name: Fetch AWS Feeds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 1時間ごとに実行 (毎時0分)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit_and_push.outputs.pushed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt

      - name: Fetch AWS feeds
        run: python .github/scripts/main.py

      - name: Commit and push changes
        id: commit_and_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ daily_reports/ docs/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Update AWS feeds - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in data/, skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
