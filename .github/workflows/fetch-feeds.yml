name: Fetch AWS Feeds

on:
  schedule:
    # 1時間ごとに実行 (毎時0分)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit_and_push.outputs.pushed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/scripts/requirements.txt

      - name: Fetch AWS feeds
        run: python3 .github/scripts/main.py

      - name: Prepare changed articles for Codex
        id: changed_articles
        run: |
          changed_days="$(git status --porcelain=v1 --untracked-files=all -- data/ \
            | sed -nE 's#^.. data/[0-9]{4}/[0-9]{2}/([0-9]{4}-[0-9]{2}-[0-9]{2})/[^/]+\.yaml$#\1#p' \
            | sort -u)"

          if [ -z "$changed_days" ]; then
            echo 'No new articles to summarize.'
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            mkdir -p .github/codex/input
            printf '%s\n' "$changed_days" > .github/codex/input/changed-days.txt
            python3 .github/scripts/summary_digest.py "$(printf '%s' "$changed_days" | paste -sd, -)" \
              --limit 300 > .github/codex/input/daily-digest.md
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize today's articles with Codex
        if: steps.changed_articles.outputs.has_changes == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/summarize-daily-feeds.md
          sandbox: workspace-write

      - name: Report summaries needing regeneration
        if: always()
        run: |
          {
            echo '## AI 概要の状況'
            echo ''
            echo '```'
            python3 .github/scripts/check_summaries.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        id: commit_and_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ _posts/
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Update AWS feeds - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in data/, skipping commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  call_deploy:
    needs: fetch-rss
    if: needs.fetch-rss.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      branch_name: ${{ github.ref_name }}
