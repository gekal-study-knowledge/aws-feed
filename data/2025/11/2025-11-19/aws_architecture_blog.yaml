    "title": "Announcing the updated AWS Well-Architected Generative AI Lens"
    "link": "https://aws.amazon.com/blogs/architecture/announcing-the-updated-aws-well-architected-generative-ai-lens/"
    "published": "2025-11-19 19:36:28"
    "fetched": "2025-11-19 19:36:28"
    "summary": "We are delighted to announce an update to the AWS Well-Architected Generative AI Lens. This update features several new sections of the Well-Architected Generative AI Lens, including new best practices, advanced scenario guidance, and improved preambles on responsible AI, data architecture, and agentic workflows."
