    "title": "Building an AI gateway to Amazon Bedrock with Amazon API Gateway"
    "link": "https://aws.amazon.com/blogs/architecture/building-an-ai-gateway-to-amazon-bedrock-with-amazon-api-gateway/"
    "published": "2025-11-19 23:33:41"
    "fetched": "2025-11-19 23:33:41"
    "summary": "In this post, we'll explore a reference architecture that helps enterprises govern their Amazon Bedrock implementations using Amazon API Gateway. This pattern enables key capabilities like authorization controls, usage quotas, and real-time response streaming. We'll examine the architecture, provide deployment steps, and discuss potential enhancements to help you implement AI governance at scale."
  "87929038e1daca021dfaa992648f33a6":
    "id": "87929038e1daca021dfaa992648f33a6"
    "title": "Architecting for AI excellence: AWS launches three Well-Architected Lenses at re:Invent 2025"
    "link": "https://aws.amazon.com/blogs/architecture/architecting-for-ai-excellence-aws-launches-three-well-architected-lenses-at-reinvent-2025/"
    "published": "2025-11-19 19:36:31"
    "fetched": "2025-11-19 19:36:31"
    "summary": "At re:Invent 2025, we introduce one new lens and two significant updates to the AWS Well-Architected Lenses specifically focused on AI workloads: the Responsible AI Lens, the Machine Learning (ML) Lens, and the Generative AI Lens. Together, these lenses provide comprehensive guidance for organizations at different stages of their AI journey, whether you're just starting to experiment with machine learning or already deploying complex AI applications at scale."
  "3239ab6ea72ec296ca25e3e41d0c2e66":
