    "title": "Node.js 24 runtime now available in AWS Lambda"
    "link": "https://aws.amazon.com/blogs/compute/node-js-24-runtime-now-available-in-aws-lambda/"
    "published": "2025-11-25 22:19:46"
    "summary": "You can now develop AWS Lambda&nbsp;functions using Node.js&nbsp;24, either as a managed runtime or using the container base image. Node.js 24 is in&nbsp;active LTS status&nbsp;and ready for production use. It is expected to be supported with security patches and bugfixes until April 2028. The Lambda runtime for Node.js 24 includes a new implementation of the […]"
  "445b7cf6e838c42d00a4cb85ee2409f9":
    "id": "445b7cf6e838c42d00a4cb85ee2409f9"
    "title": "Performance benefits of new Amazon EC2 R8a memory-optimized instances"
    "link": "https://aws.amazon.com/blogs/compute/performance-benefits-of-new-amazon-ec2-r8a-memory-optimized-instances/"
    "published": "2025-11-25 19:32:37"
    "summary": "Recently we announced the availability of Amazon Elastic Compute Cloud (Amazon EC2) R8a instances, the latest addition to the AMD memory-optimized instance family. These instances are powered by the 5th Generation AMD EPYC (codename Turin) processors with a maximum frequency of 4.5 GHz. In this post I take these instances for a spin and benchmark MySQL later on, but first I discuss the top things you should know about these instances."
  "cc95ee4087c3caab352f42daa1454f24":
    "id": "cc95ee4087c3caab352f42daa1454f24"
    "title": "The attendee’s guide to hybrid cloud and edge computing at AWS re:Invent 2025"
    "link": "https://aws.amazon.com/blogs/compute/the-attendees-guide-to-hybrid-cloud-and-edge-computing-at-aws-reinvent-2025/"
    "published": "2025-11-25 19:27:19"
    "summary": "AWS re:Invent 2025 returns to Las Vegas, Nevada, from December 1–5, 2025. This year, we’re offering a comprehensive lineup of sessions and booth activities to help you build resilient, performant, and scalable applications wherever you need them—in the cloud, on premises, or at the edge."
  "2e416c3b6e4adb7caf3055bc4dbf1e3f":
    "id": "2e416c3b6e4adb7caf3055bc4dbf1e3f"
    "title": "Optimize unused capacity with Amazon EC2 interruptible capacity reservations"
    "link": "https://aws.amazon.com/blogs/compute/optimize-unused-capacity-with-amazon-ec2-interruptible-capacity-reservations/"
    "published": "2025-11-25 01:09:16"
    "summary": "Organizations running critical workloads on Amazon Elastic Compute Cloud (Amazon EC2) reserve compute capacity using On-Demand Capacity Reservations (ODCR) to have availability when needed. However, reserved capacity can intermittently sit idle during off-peak periods, between deployments, or when workloads scale down. This unused capacity represents a missed opportunity for cost optimization and resource efficiency across the organization."
