    "title": "Enhancing API security with Amazon API Gateway TLS security policies"
    "link": "https://aws.amazon.com/blogs/compute/enhancing-api-security-with-amazon-api-gateway-tls-security-policies/"
    "published": "2025-11-21 21:17:52"
    "summary": "In this post, you will learn how the new Amazon API Gateway’s enhanced TLS security policies help you meet standards such as PCI DSS, Open Banking, and FIPS, while strengthening how your APIs handle TLS negotiation. This new capability increases your security posture without adding operational complexity, and provides you with a single, consistent way to standardize TLS configuration across your API Gateway infrastructure."
  "779411d2feafc6a7d3a4bc9569903542":
    "id": "779411d2feafc6a7d3a4bc9569903542"
    "title": "Improving throughput of serverless streaming workloads for Kafka"
    "link": "https://aws.amazon.com/blogs/compute/improving-throughput-of-serverless-streaming-workloads-for-kafka/"
    "published": "2025-11-21 20:02:57"
    "summary": "Event-driven applications often need to process data in real-time. When you use AWS Lambda to process records from Apache Kafka topics, you frequently encounter two typical requirements: you need to process very high volumes of records in close to real-time, and you want your consumers to have the ability to scale rapidly to handle traffic spikes. Achieving both necessitates understanding how Lambda consumes Kafka streams, where the potential bottlenecks are, and how to optimize configurations for high throughput and best performance."
  "6e4ce47e5611123391f43ef5bceb4b4e":
    "id": "6e4ce47e5611123391f43ef5bceb4b4e"
    "title": "Build scalable REST APIs using Amazon API Gateway private integration with Application Load Balancer"
    "link": "https://aws.amazon.com/blogs/compute/build-scalable-rest-apis-using-amazon-api-gateway-private-integration-with-application-load-balancer/"
    "published": "2025-11-21 19:28:04"
    "summary": "Today, we announced \n<a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-rest-api.html\">Amazon API Gateway REST API’s</a> support for private integration with \n<a href=\"https://aws.amazon.com/elasticloadbalancing/application-load-balancer/\">Application Load Balancers (ALBs)</a>. You can use this new capability to securely expose your VPC-based applications through your REST APIs without exposing your ALBs to the public internet."
  "28eb4472d874bb06519ba6158913cedf":
    "id": "28eb4472d874bb06519ba6158913cedf"
    "title": "Serverless strategies for streaming LLM responses"
    "link": "https://aws.amazon.com/blogs/compute/serverless-strategies-for-streaming-llm-responses/"
    "published": "2025-11-21 03:42:56"
    "summary": "Modern generative AI applications often need to stream large language model (LLM) outputs to users in real-time. Instead of waiting for a complete response, streaming delivers partial results as they become available, which significantly improves the user experience for chat interfaces and long-running AI tasks. This post compares three serverless approaches to handle Amazon Bedrock LLM streaming on Amazon Web Services (AWS), which helps you choose the best fit for your application."
