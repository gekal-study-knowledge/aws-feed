    title:
      Improper authentication token handling in the Amazon WorkSpaces client
      for Linux
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-025/
    published: "2025-11-05"
    fetched: "2025-11-05"
    summary:
      "<p><b>Bulletin ID:</b> AWS-2025-025<br /> <b>Scope:</b> AWS<br /> <b>Content\
      \ Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2025/11/5\
      \ 13:20 PM PDT</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2025-12779,\
      \ which describes an issue in the Amazon WorkSpaces client for Linux . Improper\
      \ handling of the authentication token in the Amazon WorkSpaces client for Linux,\
      \ versions 2023.0 through 2024.8, may expose the authentication token for DCV-based\
      \ WorkSpaces to other local users on the same client machine. Under certain\
      \ circumstances, an unintended user may be able to extract a valid authentication\
      \ token from the client machine and access another user’s WorkSpace. We have\
      \ proactively communicated with customers regarding the end of support for the\
      \ impacted client versions.</p> \n<p><b>Impacted versions:</b> Amazon WorkSpaces\
      \ client for Linux versions 2023.0 through 2024.8</p>"
  27cb7024b811494de91404ca7fa8ced7:
    id: 27cb7024b811494de91404ca7fa8ced7
    title: CVE-2025-31133, CVE-2025-52565, CVE-2025-52881 - runc container issues
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-024/
    published: "2025-11-05"
    fetched: "2025-11-05"
    summary:
      "<p><b>Bulletin ID:</b> AWS-2025-024<br /> <b>Scope:</b> AWS<br /> <b>Content\
      \ Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2025/11/5\
      \ 8:45 PM PDT</p> \n<p><b>CVE Identifiers: CVE-2025-31133, CVE-2025-52565, CVE-2025-52881</b></p>\
      \ \n<p>AWS is aware of recently disclosed security issues affecting the runc\
      \ component of several open source container management systems (CVE-2025-31133,\
      \ CVE-2025-52565, CVE-2025-52881) when launching new containers. AWS does not\
      \ consider containers a security boundary, and does not utilize containers to\
      \ isolate customers from each other. There is no cross-customer risk from these\
      \ issues. AWS customers that utilize containers to isolate workloads within\
      \ their own self-managed environments are strongly encouraged to contact their\
      \ operating system vendor for any updates or instructions necessary to mitigate\
      \ any potential concerns arising from these issues.</p> \n<p>With the exception\
      \ of the AWS services listed below, no customer action is required to address\
      \ this issue. As a best practice, AWS always recommends that you apply all security\
      \ patches and software version updates.</p> \n<p><b>Affected services:</b></p>\
      \ \n<p>Amazon Linux<br /> Bottlerocket<br /> Amazon Elastic Container Service\
      \ (ECS)<br /> Amazon Elastic Kubernetes Service (EKS)<br /> AWS Elastic Beanstalk<br\
      \ /> Finch<br /> AWS Deep Learning AMI<br /> AWS Batch<br /> Amazon SageMaker<br\
      \ /></p>"
