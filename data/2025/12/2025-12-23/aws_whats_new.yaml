  eea142ad5c972bcab50c9f8ffb484c38:
    id: eea142ad5c972bcab50c9f8ffb484c38
    title: Oracle Database@AWS is now available in three additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/oracle-database-aws-available-three-additional-regions/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p>Oracle Database@AWS is now generally available in three additional
      AWS Regions - US-East-2 (Ohio), EU-Central-1 (Frankfurt), and AP-Northeast-1
      (Tokyo). Oracle Database@AWS enables customers to access database services on
      Oracle Cloud Infrastructure (OCI) managed Oracle Exadata systems within AWS
      data centers. With this launch, customers in the EU and Japan with in-region
      data residency requirements can easily migrate on-premises Oracle Exadata applications
      to AWS.<br /> <br /> With this expansion, AWS customers can run OCI Exadata
      Database Service, OCI Autonomous Database on Dedicated Infrastructure, and OCI
      Autonomous Recovery Service in five Regions - US-East-1 (N.Virginia), US-West-2
      (Oregon), US-East-2 (Ohio), EU-Central-1 (Frankfurt), and AP-Northeast-1 (Tokyo).
      To use these services, request a <a href="https://aws.amazon.com/marketplace/pp/prodview-qks5dl3hr7nfw?sr=0-1&amp;ref_=beagle&amp;applicationId=AWSMPContessa">private
      offer from Oracle through the AWS Marketplace</a>, and use AWS Management Console
      to setup database resources.<br /> <br /> To learn more, visit <a href="https://aws.amazon.com/marketplace/featured-seller/oracle">Oracle
      Database@AWS</a> overview and <a href="https://docs.aws.amazon.com/odb/">documentation</a>.</p>
  ec6e81ea958675d8347887f11e93a2de:
    id: ec6e81ea958675d8347887f11e93a2de
    title: NVIDIA Nemotron 3 Nano now available on Amazon Bedrock
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/nvidia-nemotron-3-nano-amazon-bedrock
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      "<p>Amazon Bedrock now supports NVIDIA Nemotron 3 Nano 30B A3B model,\
      \ NVIDIA's latest breakthrough in efficient language modeling that delivers\
      \ high reasoning performance, native tool calling support, and extended context\
      \ processing with 256k token context window. This model employs an efficient\
      \ hybrid Mixture-of-Experts (MoE) architecture to ensure higher throughput than\
      \ its predecessors for agentic and coding workloads, while maintaining the reasoning\
      \ depth of a larger model. With explicit reasoning controls and higher accuracy\
      \ enabled by advanced reinforcement learning techniques and multi-environment\
      \ post-training at scale, this model is ideal for enterprises, startups, and\
      \ individual developers building multi-agent workflows, developer productivity\
      \ tools, processes automation, and for scientific and mathematical reasoning\
      \ analysis, amongst others.<br /> <br /> NVIDIA Nemotron 3 Nano on Amazon Bedrock\
      \ is powered by Project Mantle, a new distributed inference engine for large-scale\
      \ machine learning model serving on Amazon Bedrock. Project Mantle simplifies\
      \ and expedites onboarding of new models onto Amazon Bedrock, provides highly\
      \ performant and reliable serverless inference with sophisticated quality of\
      \ service controls, unlocks higher default customer quotas with automated capacity\
      \ management and unified pools, and provides out-of-the-box compatibility with\
      \ OpenAI API specifications.</p> \n<p>NVIDIA Nemotron 3 Nano is available today\
      \ on Amazon Bedrock in US East (N. Virginia), US East (Ohio), US West (Oregon),\
      \ Asia Pacific (Tokyo), Asia Pacific (Mumbai), South America (Sao Paulo), Europe\
      \ (London), and Europe (Milan) AWS Regions, and supports both unified and OpenAI\
      \ API-compatible service endpoints on Amazon Bedrock. To learn more and get\
      \ started, visit&nbsp;<a href=\"https://console.aws.amazon.com/bedrock/\">Amazon\
      \ Bedrock console</a>&nbsp;or the service documentation&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/getting-started.html\"\
      >here</a>. To get started with Amazon Bedrock OpenAI API-compatible service\
      \ endpoints, visit documentation&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-mantle.html\"\
      >here</a>.</p>"
  c4a8781ba9b91c208eaf243ba2e31815:
    id: c4a8781ba9b91c208eaf243ba2e31815
    title:
      Amazon MSK expands Standard Brokers and Express Brokers to Asia Pacific
      (New Zealand) Region
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-msk-additional-aws-region/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      '<p>Amazon Managed Streaming for Apache Kafka (<a href="https://aws.amazon.com/msk/"
      style="cursor: pointer;" target="_blank">Amazon MSK</a>) is now available in
      Asia Pacific (New Zealand) region. Customers can create Amazon MSK Provisioned
      clusters in this region starting today.<br /> <br /> Amazon MSK is a fully managed
      service for Apache Kafka and Kafka Connect that makes it easier for you to build
      and run applications that use Apache Kafka as a data store. Amazon MSK is fully
      compatible with Apache Kafka, which enables you to more quickly migrate your
      existing Apache Kafka workloads to Amazon MSK with confidence or build new ones
      from scratch. With Amazon MSK, you spend more time building innovative streaming
      applications and less time managing Kafka clusters.<br /> <br /> Amazon MSK
      offers two types of Apache Kafka provisioned broker - Standard brokers and Express
      brokers. Standard brokers offer the most flexibility to configure your cluster’s
      performance. You can configure availability, durability, throughput, and latency.
      You also control the storage configurations on your cluster and are responsible
      for managing storage provisioning and utilization. Express brokers are a new
      broker type for Amazon MSK Provisioned designed to deliver up to 3x more throughput
      per broker, scale up to 20x faster, up to 5x more partitions per broker, and
      reduce recovery time by 90% as compared to Standard brokers. Express brokers
      come pre-configured with Kafka best practices by default, support all Kafka
      APIs, and provide the same low-latency performance that Amazon MSK customers
      expect, so they can continue using existing client applications without any
      changes.<br /> <br /> You can now create an MSK provisioned cluster with Standard
      or Express brokers in Asia Pacific (New Zealand) Region through the Amazon MSK
      console or the Amazon CLI. To get started, see the&nbsp;<a href="https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html"
      style="cursor: pointer;" target="_blank">Amazon MSK Developer Guide</a>.</p>'
  3b8b8c9750bfed0e1c58c323c0ccfa1b:
    id: 3b8b8c9750bfed0e1c58c323c0ccfa1b
    title:
      Amazon WorkSpaces Secure Browser now supports WebAuthn redirection for
      local Chromium browsers
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-workspaces-secure-browser-webauthn-redirection-chromium-browsers
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p>Amazon WorkSpaces Secure Browser now supports Web Authentication (WebAuthn)
      redirection, allowing users to authenticate to websites using their local FIDO2
      security keys, biometric authenticators, and platform authenticators while browsing
      in their WorkSpaces Secure Browser session. This feature is compatible with
      Chromium-based browser on users’ local devices, such as Google Chrome 136 (or
      later) or Microsoft Edge 137 (or later). It is not supported on non-Chromium-based
      browsers such as Safari or Firefox.<br /> <br /> WebAuthn redirection helps
      users enjoy seamless and secure authentication on websites within their WorkSpaces
      Secure Browser sessions. This feature supports FIDO2 security keys, passkeys,
      and platform authenticators like Windows Hello or Touch ID. To enable the feature,
      administrators must activate WebAuthn redirection in Secure browser’s portal
      settings and configure the local browsers using the WebAuthenticationRemoteDesktopAllowedOrigins
      policy. This configuration allows WebAuthn tokens to be securely transmitted
      from a user’s local device to websites within a Secure Browser session, ensuring
      that users can authenticate securely without compromising the security benefits
      of the remote browsing environment.<br /> <br /> This feature is available at
      no additional cost in all regions where Amazon WorkSpaces Secure Browser is
      available, including US East (N. Virginia), US West (Oregon), Canada (Central),
      Europe (Frankfurt, London, Ireland), and Asia Pacific (Tokyo, Mumbai, Sydney,
      Singapore)<br /> <br /> To get started and enable WebAuthn redirection, visit
      the Amazon WorkSpaces Secure Browser console. For more information, see the
      <a href="https://docs.aws.amazon.com/workspaces-web/latest/adminguide/web-authentication.html"
      target="_blank">WebAuthn redirection section</a> in the Amazon WorkSpaces Secure
      Browser’s documentation.</p>
  e9d8117bfd196d96fd4935e9aaa68da6:
    id: e9d8117bfd196d96fd4935e9aaa68da6
    title:
      Amazon RDS for MySQL announces Innovation Release 9.5 in Amazon RDS Database
      Preview Environment
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-rds-mysql-innovation-release/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p><a href="https://aws.amazon.com/rds/mysql/">Amazon RDS for MySQL</a>
      now supports community MySQL Innovation Release 9.5 in the <a href="https://aws.amazon.com/rds/databasepreview/">Amazon
      RDS Database Preview Environment</a>, allowing you to evaluate the latest Innovation
      Release on Amazon RDS for MySQL. You can deploy MySQL 9.5 in the Amazon RDS
      Database Preview Environment which provides the benefits of a fully managed
      database, making it simpler to set up, operate, and monitor databases.<br />
      <br /> MySQL 9.5 is the latest Innovation Release from the MySQL community.
      MySQL Innovation releases include bug fixes, security patches, as well as new
      features. MySQL Innovation releases are supported by the community until the
      next innovation minor, whereas MySQL Long Term Support (LTS) Releases, such
      as MySQL 8.0 and MySQL 8.4, are supported by the community for up to eight years.
      Please refer to the <a href="https://dev.mysql.com/doc/relnotes/mysql/9.5/en/">MySQL
      9.5 release notes</a> and <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html#mysql-preview-environment-version-9-5">Amazon
      RDS MySQL release notes</a> for more details.<br /> <br /> Amazon RDS Database
      Preview Environment supports both Single-AZ and Multi-AZ deployments on the
      latest generation of instance classes. Amazon RDS Database Preview Environment
      database instances are retained for a maximum of 60 days and are automatically
      deleted after the retention period. Amazon RDS database snapshots created in
      the Preview Environment can only be used to create or restore database instances
      within the Preview Environment.<br /> <br /> Amazon RDS Database Preview Environment
      database instances are <a href="https://aws.amazon.com/rds/mysql/pricing/">priced
      the same as production RDS instances created in the US East (Ohio) Region</a>.
      For further information, see <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html#mysql-working-with-the-database-preview-environment">Working
      with the Database Preview Environment</a>. To get started with the Preview Environment
      from the RDS console, navigate here.</p>
  2cdb76df8b0262f02fc0238a3dfba9f2:
    id: 2cdb76df8b0262f02fc0238a3dfba9f2
    title: AWS Secrets Manager announces improved secret sorting capabilities
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-secrets-manager-secret-sorting-capabilities
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p>Today, <a href="https://aws.amazon.com/secrets-manager/">AWS Secrets
      Manager</a> announces enhanced secret sorting capabilities in the Secrets Manager
      console and for ListSecrets API. You can now sort secrets by name, last changed
      date, last accessed date, and creation date—expanding beyond the previous creation
      date-only option.<br /> <br /> Secrets Manager is a fully managed service that
      helps you manage, retrieve, and rotate database credentials, application credentials,
      API keys, and other secrets throughout their lifecycles. This enhancement improves
      secret discovery by providing flexible sorting options across multiple dimensions
      through both Secrets Manager console and APIs.<br /> <br /> The new sorting
      capabilities are available in Secrets Manager console and ListSecrets API in
      all AWS commercial and AWS GovCloud (US) Regions. For a list of regions where
      Secrets Manager is available, see the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region table</a>.</p>
  1e329bb6ba7cd002409edefef6362d8f:
    id: 1e329bb6ba7cd002409edefef6362d8f
    title: MiniMax-M2 is now available on Amazon SageMaker JumpStart
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/minimax-m2-on-sagemaker-jumpstart
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      "<p>MiniMax-M2 is now available on Amazon SageMaker JumpStart, providing\
      \ customers with immediate access to deploy this efficient open-source model\
      \ in minutes. With SageMaker JumpStart, you can quickly discover, evaluate,\
      \ and deploy MiniMax-M2 using either SageMaker Studio's intuitive interface\
      \ or the SageMaker Python SDK for programmatic deployment.</p> \n<p>MiniMax-M2\
      \ redefines efficiency for agents. It's a compact, fast, and cost-effective\
      \ MoE model (230 billion total parameters with 10 billion active parameters)\
      \ built for elite performance in coding and agentic tasks, all while maintaining\
      \ powerful general intelligence.</p> \n<p>To learn more about deploying foundation\
      \ models with SageMaker JumpStart, deployment options with the SDK, and best\
      \ practices for implementation, refer to our<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\"\
      > documentation.</a></p> \n<p>MiniMax-M2 is available in&nbsp;US East (N. Virginia),\
      \ US East (Ohio), US West (Oregon), Asia Pacific (Tokyo), Asia Pacific (Seoul),\
      \ Asia Pacific (Singapore), Asia Pacific (Mumbai), Asia Pacific (Sydney), Asia\
      \ Pacific (Jakarta), Canada (Central), Europe (Frankfurt), Europe (Stockholm),\
      \ Europe (Ireland), Europe (London), Europe (Paris), South America (São Paulo).</p>"
  4460911fbba5885b4a9a2573c9050283:
    id: 4460911fbba5885b4a9a2573c9050283
    title: AWS Transform enables network conversion for hybrid data center migrations
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-transform-hybrid-network-migration/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p>AWS Transform now supports automatic network conversion from hybrid
      data centers, eliminating manual network mapping for environments running both
      VMware and non-VMware workloads. The service now analyzes VLANs and IP ranges
      across all exported source networks and maps these to AWS constructs like Virtual
      Private Clouds (VPCs), subnets, and security groups.<br /> <br /> AWS Transform
      for VMware is an agentic AI-powered service that automates the discovery, planning,
      and migration of VMware workloads, accelerating infrastructure modernization
      with increased confidence. The service extends support to hybrid data centers
      by analyzing exported data from application mapping tools such as modelizeIT
      to automatically generate Infrastructure as Code and provision AWS networking
      resources.<br /> <br /> This feature is available in all <a href="https://docs.aws.amazon.com/transform/latest/userguide/transform-app-vmware-acct-connections.html#transform-app-vmware-target-acct"
      target="_blank">AWS Transform target Regions</a>.<br /> <br /> To learn more,
      visit the AWS Transform <a href="https://aws.amazon.com/transform/vmware/" target="_blank">product
      page</a>, read the <a href="https://docs.aws.amazon.com/transform/latest/userguide/transform-app-vmware.html"
      target="_blank">user guide</a>, or get started in the <a href="https://console.aws.amazon.com/transform/home"
      target="_blank">AWS Transform web experience</a>.</p>
  2b19d5ba1878b5daf440f9558bf8af54:
    id: 2b19d5ba1878b5daf440f9558bf8af54
    title: Amazon WorkSpaces Secure Browser enables branding customization
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-workspaces-secure-browser-enables-branding/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      '<p>Amazon WorkSpaces Secure Browser now supports branding customization,
      enabling you to create a consistent, branded experience that helps you align
      with your organization''s visual identity. This feature allows you to customize
      the sign-in and session loading screens that appear to your end users by modifying
      visual elements and text content to maintain brand consistency across all user
      touch points.<br /> <br /> You can personalize the sign-in and session loading
      experience by uploading your organization''s favicon, logo, and wallpaper, selecting
      color themes, and customizing the welcome message , the browser tab title, and
      other text fields in all 11 languages supported by the service. You can also
      modify the "Contact Us" link to redirect to your organization''s support page
      and add a Terms of Service page that users must acknowledge before starting
      a session. All customization settings are designed to meet <a contenteditable="false"
      href="https://www.w3.org/WAI/WCAG2AA-Conformance" style="cursor: pointer;" target="_blank">WCAG
      AA</a> accessibility and contrast requirements.<br /> <br /> This feature is
      available at no additional cost in 10 AWS Regions, including US East (N. Virginia),
      US West (Oregon), Canada (Central), Europe (Frankfurt, London, Ireland), and
      Asia Pacific (Tokyo, Mumbai, Sydney, Singapore). WorkSpaces Secure Browser offers
      pay-as-you go <a contenteditable="false" href="https://aws.amazon.com/workspaces/secure-browser/pricing/"
      style="cursor: pointer;" target="_blank">pricing</a>.<br /> <br /> To get started,
      visit the Amazon WorkSpaces Secure Browser console to configure your branding
      settings. For more information, see the branding customization section in the
      Amazon WorkSpaces Secure Browser’s <a contenteditable="false" href="https://docs.aws.amazon.com/workspaces-web/latest/adminguide/branding-customization.html"
      style="cursor: pointer;" target="_blank">documentation</a>.</p>'
  00adc293d97a837c6b6e52e9f3029c20:
    id: 00adc293d97a837c6b6e52e9f3029c20
    title:
      AWS End User Messaging SMS launches a Generative AI Registration Reviewer
      (Preview)
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/end-user-messaging-sms-ai-registration-reviewer/
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      <p>Starting today, AWS End User Messaging customers can use AWS generative
      AI to review their phone number registrations, so you can submit to mobile carriers
      correctly the first time. With the registration reviewer (preview), AWS will
      provide you feedback on your registration form checking the message sample,
      opt-in description, use-case, help and stop messages, etc., helping you submit
      an accurate and complete registration.<br /> <br /> AWS End User Messaging provides
      developers with a scalable and cost-effective messaging infrastructure without
      compromising the safety, security, or results of their communications. Developers
      can integrate messaging to support uses cases such as one-time passcodes (OTP)
      at sign-ups, account updates, appointment reminders, delivery notifications,
      promotions and more.<br /> <br /> Support for generative AI registration reviewer
      is available in all AWS Regions where End User Messaging is available, see the
      <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region</a> table.<br /> <br /> To learn more, see <a href="https://aws.amazon.com/end-user-messaging/">AWS
      End User Messaging</a>.&nbsp;</p>
  1538fe901faa516698ef6341762b5b26:
    id: 1538fe901faa516698ef6341762b5b26
    title:
      Amazon Redshift supports four new materialized view (MV) features on data
      shares
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-redshift-mv-datasharing-features
    published: "2025-12-23"
    fetched: "2025-12-23"
    summary:
      '<p><a href="https://aws.amazon.com/redshift/" style="cursor: pointer;">Amazon
      Redshift</a> now allows you to run create MV and refresh MV commands from multiple
      Amazon Redshift data warehouses. This update also allows you to create an MV
      on shared MVs. Finally, this release now supports concurrency scaling of the
      create materialized view (MV) data definition language (DDL) command.<br />
      <br /> With this update, you can now scale the create MV DDL command whenever
      your main Amazon Redshift data warehouse cluster or workgroup runs out of resources
      simply by enabling concurrency scaling in your Amazon Redshift account.<br />
      <br /> You can start using these new capabilities immediately in all AWS regions
      where Amazon Redshift is available to scale your workload and build resilient
      analytics applications with predictable Service Level Agreements. To get started,
      refer to the <a href="https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html"
      style="cursor: pointer;">Concurrency Scaling</a>, <a href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html"
      style="cursor: pointer;">Materialized Views</a> and <a href="https://docs.aws.amazon.com/redshift/latest/dg/datashare-overview.html"
      style="cursor: pointer;">Data Sharing</a> sections of the Amazon Redshift<a
      href="https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-overview.html"
      style="cursor: pointer;"> documentation</a>.</p>'
