  c5957572f728e59030105a123040b8a7:
    id: c5957572f728e59030105a123040b8a7
    title:
      AWS Deadline Cloud now supports direct job submission from the Deadline
      Cloud Monitor
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-deadline-cloud-direct-job-submission-from/
    published: "2025-12-22"
    summary:
      <p>AWS Deadline Cloud now lets you submit rendering jobs directly from
      the Deadline Cloud Monitor desktop application. This new feature makes it easier
      to submit renders for applications that don’t have built-in Deadline Cloud plugins
      or submission scripts, expanding compatibility with content creation tools and
      streamlining your rendering workflows.<br /> <br /> Previously, you needed the
      command line interface (CLI) to submit job bundles. With this update, you can
      submit job bundles directly from Deadline Cloud Monitor desktop interface, managing
      jobs from start to finish in one place. It is particularly useful for legacy
      applications, specialized rendering tools, or custom workflows that lack built-in
      Deadline Cloud integration.<br /> <br /> To access direct job submission, download
      the latest Deadline Cloud Monitor desktop application (version 1.1.7) in the<a>
      </a><a href="https://console.aws.amazon.com/deadlinecloud/home?useDefaultRegion=true#/downloads">AWS
      Console</a>. To learn more about AWS Deadline Cloud job submission capabilities,
      see the <a href="https://docs.aws.amazon.com/deadline-cloud/latest/userguide/submit-job-bundle-monitor.html">AWS
      Deadline Cloud documentation.</a></p>
  32d6ab35feb31a989796b9128ab6bb7f:
    id: 32d6ab35feb31a989796b9128ab6bb7f
    title:
      Oracle Database@AWS now supports sharing of AWS Marketplace entitlements
      across accounts
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/oracle-database-aws-marketplace-entitlements-across-accounts/
    published: "2025-12-22"
    summary:
      <p>Today, <a href="https://aws.amazon.com/marketplace/featured-seller/oracle/"
      target="_blank">Oracle Database@AWS</a> announced ability to share AWS Marketplace
      entitlements across accounts within an AWS Organization. With this feature,
      customers can now accept an Oracle Database@AWS AWS Marketplace offer in one
      AWS account, and share that entitlement with additional accounts in their AWS
      Organization. This allows customers to consume Oracle Database@AWS services
      from multiple AWS accounts using a single AWS Marketplace entitlement purchased
      for their organization.<br /> <br /> Many Oracle Database@AWS customers use
      separate AWS accounts for their development and production environments, and
      for different business units within their organization. Customers want a single
      buyer agreement to use Oracle Database@AWS within their organization, and use
      the purchased AWS Marketplace entitlement across multiple business units, and
      across their development and production environments. With <a href="https://aws.amazon.com/marketplace/features/managed-entitlements/"
      target="_blank">AWS Marketplace Managed Entitlements</a>, customers can now
      share their Oracle Database@AWS entitlement with other accounts in their AWS
      Organization using <a href="https://aws.amazon.com/license-manager/" target="_blank">AWS
      License Manager</a> console or APIs. These accounts can accept and activate
      their shared AWS Marketplace entitlement from AWS License Manager, and then
      start consuming Oracle Database@AWS services using the shared entitlement.<br
      /> <br /> This feature is available in all AWS Regions where Oracle Database@AWS
      is offered. For information about managing entitlements on Oracle Database@AWS,
      see <a href="https://docs.aws.amazon.com/odb/latest/UserGuide/entitlement-sharing.html"
      target="_blank">documentation</a>. To learn more about Oracle Database@AWS,
      visit the <a href="https://aws.amazon.com/marketplace/featured-seller/oracle/"
      target="_blank">Oracle Database@AWS product page</a>.&nbsp;</p>
  48775190727e0f5e034c3a568b114856:
    id: 48775190727e0f5e034c3a568b114856
    title: Amazon ECS Service Connect enhances observability with Envoy Access Logs
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-ecs-service-connect-observability-envoy-access-logs
    published: "2025-12-22"
    summary:
      <p><a href="https://aws.amazon.com/ecs/" target="_blank">Amazon Elastic
      Container Service</a> (Amazon ECS) Service Connect now supports Envoy access
      logs, providing deeper observability into request-level traffic patterns and
      service interactions. This new capability captures detailed per-request telemetry
      for end-to-end tracing, debugging, and compliance monitoring.<br /> <br /> Amazon
      ECS Service Connect makes it simple to build secure, resilient service-to-service
      communication across clusters, VPCs, and AWS accounts. It integrates service
      discovery and service mesh capabilities by automatically injecting AWS-managed
      Envoy proxies as sidecars that handle traffic routing, load balancing, and inter-service
      connectivity. Envoy Access logs capture detailed traffic metadata enabling request-level
      visibility into service communication patterns. This enables you to perform
      network diagnostics, troubleshoot issues efficiently, and maintain audit trails
      for compliance requirements.<br /> <br /> You can now configure access logs
      within ECS Service Connect by updating the ServiceConnectConfiguration to enable
      access logging. Query strings are redacted by default to protect sensitive data.
      Envoy access logs will output to the standard output (STDOUT) stream alongside
      application logs and flow through the existing ECS log pipeline without requiring
      additional infrastructure. This configuration supports all existing application
      protocols (HTTP, HTTP2, GRPC and TCP). This feature is available in AWS GovCloud
      (US-West) and AWS GovCloud (US-East) regions where Amazon ECS Service Connect
      is supported. To learn more, visit the <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect-envoy-access-logs.html"
      target="_blank">Amazon ECS Developer Guide</a>.</p>
  90c25ac771f2023b8e40e9844dcb8681:
    id: 90c25ac771f2023b8e40e9844dcb8681
    title: Amazon Kinesis Video Streams now supports IPv6 for WebRTC
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-kinesis-video-streams-webrtc-ipv6/
    published: "2025-12-22"
    summary:
      "<p>Amazon Kinesis Video Streams (Amazon KVS) now supports Internet Protocol\
      \ version 6 (IPv6) addressing for WebRTC. This release introduces dual-stack\
      \ endpoint support, enabling developers to use both IPv4 and IPv6 addresses\
      \ to stream video from millions of devices. The dual-stack support is designed\
      \ to ensure that existing IPv4 implementations continue to work reliably while\
      \ gaining IPv6 connectivity benefits. Moreover, the update simplifies transition\
      \ to IPv6 addresses while eliminating the need for address translation equipment.</p>\
      \ \n<p>This feature is available in all commercial <a href=\"https://docs.aws.amazon.com/kinesisvideostreams-webrtc-dg/latest/devguide/availability.html\"\
      \ target=\"_blank\">AWS Regions</a> where Amazon KVS is offered, except Asia\
      \ Pacific (Singapore) and China (Beijing, operated by Sinnet). For implementation\
      \ details, refer to the <a href=\"https://docs.aws.amazon.com/kinesisvideostreams-webrtc-dg/latest/devguide/kvswebrtc-ipv6.html\"\
      \ target=\"_blank\">Amazon KVS Developer Guide</a>.<br /> </p>"
  9002d65593f76f53c89d742820f943c5:
    id: 9002d65593f76f53c89d742820f943c5
    title:
      Amazon GameLift Streams launches Gen6-based stream classes and enhanced
      autoscaling for better performance and pricing
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-gameliftstream-gen6-enhanced-autoscaling
    published: "2025-12-22"
    summary:
      '<p>Today, Amazon GameLift Streams launched two new capabilities to optimize
      performance and cost: Gen6 stream classes and enhanced autoscaling with warm
      buffer. The new Gen6 stream classes provide a wider range of price performance
      options, while autoscaling enables customers to dynamically manage capacity
      scaling.&nbsp;<br /> <br /> The seven new Gen6 stream classes available today
      are based on&nbsp;EC2 G6 instances powered by NVIDIA L4 Tensor Core GPUs, which
      provide up to 2x higher performance over Gen4 stream classes. The&nbsp;<i>pro</i>&nbsp;and&nbsp;<i>ultra&nbsp;</i>stream
      class&nbsp;deliver improved performance for graphics-intensive AAA games, while
      the&nbsp;<i>medium&nbsp;</i>and&nbsp;<i>small</i>&nbsp;stream class offer cost-efficient
      options for casual games. The <b><i>gen6n_small&nbsp;</i></b>stream class is
      available at $0.16/hour in us-east-2.&nbsp;<br /> <br /> The enhanced autoscaling
      capabilities provide automatic capacity management that scales provisioned capacity
      dynamically with demand, helping customers optimize utilization and stream start
      time for new players. Developers can use the new capacity controls (minimum,
      maximum, and target-idle capacity) to precisely manage their scaling needs.&nbsp;<br
      /> <br /> New Gen6 stream classes are available in five AWS Regions: US West
      (Oregon), US East (Ohio), US East (N. Virginia), Europe (Frankfurt), and Asia
      Pacific (Tokyo). Improved autoscaling is available in all AWS Regions where
      Amazon GameLift Streams is offered. To learn more and get started, visit:<br
      /> AWS Docs:&nbsp;<a href="https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/configuration-options.html#configuration-options-stream-classes">Gen6n
      based stream classes</a><b>;&nbsp;</b><a href="https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/stream-groups.html#about-stream-capacity">Enhanced
      Autoscaling - Capacity configuration options</a>;<br /> API Reference Guide:&nbsp;<a
      href="https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamGroup.html#API_CreateStreamGroup_RequestParameters">Create
      Stream group with gen6n based stream class</a>;&nbsp;<a href="https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_LocationConfiguration.html">Capacity
      configuration option</a>&nbsp;for stream groups</p>'
  99ce521126560e4636059b22d6970cab:
    id: 99ce521126560e4636059b22d6970cab
    title:
      Amazon GameLift Streams launches real-time performance stats and improved
      API error messaging
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-gameliftstream-performance-stats-error-messaging
    published: "2025-12-22"
    summary:
      "<p>Today, Amazon GameLift Streams launched new powerful observability\
      \ capabilities with session performance stats that provide real-time data for\
      \ individual stream sessions, offering insights into application performance\
      \ issues.</p> \n<p>Game developers requested deeper visibility into session\
      \ performance and resource utilization. The new stats we're delivering today\
      \ help developers understand how their applications perform on specific stream\
      \ classes and GPUs, giving them the data to make optimal GPU selections, optimize\
      \ performance, and troubleshoot individual user experiences. Developers can\
      \ now access detailed data on CPU, memory, GPU, and VRAM usage for active sessions\
      \ through the GameLift Streams Web SDK, or view them in the AWS console's built-in\
      \ overlay on the \"Test stream\" page. These performance stats can also be exported\
      \ to a file for post-session analysis.</p> \n<p>GameLift Streams also launched\
      \ improved session status reasons and error messaging. Game developers now have\
      \ deeper insights and actionable information on the reasons for stream session\
      \ termination, enabling them to root cause unexpected termination and improve\
      \ their troubleshooting experience.&nbsp;<br /> <br /> The stream session performance\
      \ stats and improved API error messaging are available in all AWS Regions where\
      \ Amazon GameLift Streams is offered at no additional cost.<br /> <br /> To\
      \ get started with these new features, create new stream groups. To integrate\
      \ session performance stats into your clients, download the updated&nbsp;<a\
      \ href=\"https://gameliftstreams-public-website-assets.s3.us-west-2.amazonaws.com/AmazonGameLiftStreamsWebSDK-v1.1.0.zip\"\
      >Web SDK 1.1.0</a>.<br /> <br /> To learn more, visit:<br /> AWS Docs:&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/realtime-performance-stats.html\"\
      >Real-time performance stats</a>;&nbsp;<a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/stream-sessions-export-files.html\"\
      >Export stream session files</a><br /> API Reference:&nbsp;<a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_GetStreamSession.html\"\
      >Stream Session</a>&nbsp;&gt;&nbsp;<a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_GetStreamSession.html#API_GetStreamSession_ResponseSyntax\"\
      >Status Reason</a><br /> </p>"
  dfec33a72ebeada2be74d9ec5b52c97c:
    id: dfec33a72ebeada2be74d9ec5b52c97c
    title: Research and Engineering Studio on AWS Version 2025.12 now available
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/research-engineering-studio-aws-new-version-available/
    published: "2025-12-22"
    summary:
      <p>Today we announce Research and Engineering Studio (RES) on AWS version
      2025.12, which introduces tag propagation for CloudFormation resources, enhanced
      Windows domain configuration options, default session scheduling, and security
      improvements.<br /> <br /> Research and Engineering Studio on AWS is an open
      source solution that provides a web-based portal for administrators to create
      and manage secure cloud-based research and engineering environments. RES enables
      scientists and engineers to access powerful Windows and Linux virtual desktops
      with pre-installed applications and shared resources, without requiring cloud
      expertise.<br /> <br /> Tags applied to the CloudFormation stack now propagate
      to all resources created during RES deployment, making it easier to track costs
      and manage resources across your organization. Administrators can disable automatic
      Windows domain joining for hosts, providing flexibility to implement custom
      domain-join logic when needed. You can now set a default schedule for all new
      desktop sessions, helping teams standardize session management practices. This
      version includes several security improvements to help RES deployments meet
      the NIST 800-223 standard and fixes a bug where some sessions were logged out
      after 2 minutes when using a custom DNS domain.<br /> <br /> This release is
      available in all <a href="https://docs.aws.amazon.com/res/latest/ug/plan-your-deployment.html#plan-your-deployment-supported-aws-regions">AWS
      Regions where RES is available</a>. To learn more about RES 2025.12, including
      detailed release notes and deployment instructions, visit the <a href="https://docs.aws.amazon.com/res/">Research
      and Engineering Studio documentation</a> or check out the <a href="https://github.com/aws/res/releases">RES
      GitHub repository</a>.</p>
  102f53098ae78a9dbbd9c821a141983e:
    id: 102f53098ae78a9dbbd9c821a141983e
    title: AWS Storage Gateway now supports Nutanix AHV hypervisor
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-storage-gateway-nutanix-avh-hypervisor
    published: "2025-12-22"
    summary:
      "<p>The <a href=\"https://aws.amazon.com/storagegateway/\" target=\"\
      _blank\">AWS Storage Gateway</a> service now supports the Nutanix AHV hypervisor\
      \ as a deployment option for S3 File, Tape and Volume gateways. If you use Nutanix\
      \ AHV hypervisor-based on-premises infrastructure, you can now deploy Storage\
      \ Gateway in your environment to access virtually unlimited cloud storage.\L\
      </p> \n<p>Nutanix AHV (Acropolis Hypervisor) is a KVM-based virtualization platform\
      \ that is integrated into the Nutanix hyper-converged infrastructure (HCI) solution.\
      \ With this launch, you have the option to deploy Storage Gateway on a Nutanix\
      \ AHV hypervisor.\L</p> \n<p>Storage Gateway is a hybrid cloud storage service\
      \ that provides on-premises applications access to virtually unlimited cloud\
      \ storage using NFS, SMB, iSCSI, and iSCSI-VTL interfaces. You can use the service\
      \ to backup and archive data to AWS, shift on-premises storage to cloud-backed\
      \ file shares, and provide on-premises applications low-latency access to data\
      \ in AWS. You can deploy Storage Gateway as a virtual appliance (VMware ESXi,\
      \ Microsoft Hyper-V, Linux KVM, and now Nutanix) on premises or as an Amazon\
      \ EC2 instance in AWS.</p> \n<p>This capability is available in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      \ target=\"_blank\">all AWS Regions</a>. Visit the <a href=\"https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html\"\
      \ target=\"_blank\">Storage Gateway User guide</a> to learn more, or log into\
      \ the <a href=\"https://console.aws.amazon.com/storagegateway/\" target=\"_blank\"\
      >Storage Gateway management console</a> to get started.</p>"
  6651b85bf149e925e4580d7c891d89d1:
    id: 6651b85bf149e925e4580d7c891d89d1
    title: Announcing AWS Neuron SDK 2.27.0
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/announcing-aws-neuron-2-27
    published: "2025-12-22"
    summary:
      "<p>Today, AWS announces Neuron SDK 2.27.0, introducing support for <a\
      \ href=\"https://aws.amazon.com/ai/machine-learning/trainium/\">Trainium3 UltraServer</a>\
      \ with expanded open source components. Neuron also introduces the Neuron Explorer\
      \ tools suite, Enhanced NKI with open source NKI Compiler built on MLIR (private\
      \ beta), the NKI Library of optimized kernels, native PyTorch support through\
      \ TorchNeuron (private beta), and Neuron DRA for Kubernetes-native resource\
      \ management (private beta).<br /> <br /> These updates enable standard frameworks\
      \ to run unchanged on Trainium, removing barriers for researchers to experiment\
      \ and innovate. For developers requiring deeper control, the enhanced Neuron\
      \ Kernel Interface (NKI) Beta 2 provides direct access to hardware-level optimizations,\
      \ enabling customers to scale AI workloads with improved performance. If you're\
      \ interested in early access to new NKI features and improvements, you can <a\
      \ href=\"https://pulse.aws/survey/NZU6MQGW?p=0\">join the Neuron private beta\
      \ program</a>.<br /> <br /> The new SDK version is available in all AWS Regions\
      \ supporting Inferentia and Trainium instances, offering enhanced performance\
      \ and monitoring capabilities for machine learning workloads.<br /> <br /> For\
      \ more details, see:<br /> </p> \n<ul> \n <li><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/whats-new.html\"\
      >What’s New in Neuron</a></li> \n <li><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/release-notes/index.html\"\
      >AWS Neuron 2.27.0 Release Notes</a></li> \n <li><a href=\"https://aws.amazon.com/ai/machine-learning/trainium/\"\
      >AWS Trainium</a></li> \n</ul>"
  528b6d36ac826a0f654ea66ac1207491:
    id: 528b6d36ac826a0f654ea66ac1207491
    title: AWS Wickr launches admin APIs for programmatic network management at scale
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-wickr-admin-apis-generally-available/
    published: "2025-12-22"
    summary:
      "<p>AWS Wickr now provides a suite of admin APIs that empower administrators\
      \ to programmatically manage secure communication networks at scale. These APIs\
      \ enable you to automate critical administrative workflows including user lifecycle\
      \ management, network configuration, and security group administration. With\
      \ user lifecycle management APIs, you can automatically create users and assign\
      \ security groups when employees join, or deactivate accounts when they leave.\
      \ Network configuration APIs allow you to quickly create or delete networks\
      \ on demand as your organization scales or restructures, and push standardized\
      \ retention and federation policies across departments. Security group administration\
      \ APIs enable automatic user placement based on directory attributes such as\
      \ job function or clearance level. By connecting Wickr administration directly\
      \ into your identity management systems, policy management frameworks, and automation\
      \ pipelines, you can now manage secure communications infrastructure across\
      \ thousands of users alongside your other cloud service integrations.</p> \n\
      <p><br /> AWS Wickr is a security-first messaging and collaboration service\
      \ designed to help keep your communications secure, private, and compliant.\
      \ AWS Wickr protects messaging, voice and video calling, file sharing, screen\
      \ sharing, and location sharing with end-to-end encryption. Customers have full\
      \ administrative control over data and users, including single sign-on (SSO)\
      \ integration. Administrators can enforce policies that set password complexity\
      \ and retention rules, configure ephemeral messaging options, or remotely delete\
      \ credentials. You can log conversations to a private data store so you can\
      \ retain messages and files sent to and from the organization to meet compliance\
      \ requirements.<br /> <br /> The AWS Wickr Admin APIs are available today in\
      \ all AWS regions where AWS Wickr is currently supported, including AWS GovCloud\
      \ (US-West). You can leverage these APIs through AWS SDKs, the AWS Command Line\
      \ Interface (AWS CLI), or direct REST API calls. To learn more, see:</p> \n\
      <ul> \n <li><a href=\"https://docs.aws.amazon.com/wickr/latest/APIReference/Welcome.html\"\
      \ style=\"cursor: pointer;\">AWS Wickr API Reference</a></li> \n <li><a href=\"\
      https://aws.amazon.com/wickr/\" style=\"cursor: pointer;\">AWS Wickr Product\
      \ Page</a></li> \n <li><a href=\"https://docs.aws.amazon.com/wickr/latest/adminguide/what-is-wickr.html\"\
      \ style=\"cursor: pointer;\">AWS Wickr Administrator Guide</a></li> \n</ul>"
  e46ef648de7ecbd0f639e71f29706327:
    id: e46ef648de7ecbd0f639e71f29706327
