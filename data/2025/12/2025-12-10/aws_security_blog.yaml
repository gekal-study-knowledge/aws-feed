    title: How to customize your response to layer 7 DDoS attacks using AWS WAF Anti-DDoS
      AMR
    link: https://aws.amazon.com/blogs/security/how-to-customize-your-response-to-layer-7-ddos-attacks-using-aws-waf-anti-ddos-amr/
    published: '2025-12-10'
    summary: Over the first half of this year, AWS WAF introduced new application-layer
      protections to address the growing trend of short-lived, high-throughput Layer
      7 (L7) distributed denial of service (DDoS) attacks. These protections are provided
      through the AWS WAF Anti-DDoS AWS Managed Rules (Anti-DDoS AMR) rule group.
