    title:
      Amazon Connect expands automated agent performance evaluations to 5 additional
      languages
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-connect-automated-performance-evaluations-additional-languages/
    published: "2025-12-26"
    fetched: "2025-12-26"
    summary:
      <p>Amazon Connect now automates agent performance evaluations in Portuguese,
      French, Italian, German, and Spanish using generative AI. Managers define custom
      evaluation criteria in natural language and receive AI-generated evaluations
      with justifications in their preferred language. Performance evaluations also
      supports cross-language evaluation and can complete assessments in English,
      even when the conversation is in another language. This enables multilingual
      contact centers to use a standardized evaluation framework across languages.<br
      /> <br /> This feature is supported in 8 <a href="https://aws.amazon.com/about-aws/global-infrastructure/regions_az/">AWS
      regions</a> including US East (N. Virginia), US West (Oregon), Europe (Frankfurt),
      Europe (London), Canada (Central), Asia Pacific (Sydney), Asia Pacific (Tokyo),
      and Asia Pacific (Singapore). For information about Amazon Connect pricing,
      please visit our <a href="https://aws.amazon.com/connect/pricing/">pricing page</a>.
      To learn more, please visit our <a href="https://docs.aws.amazon.com/connect/latest/adminguide/generative-ai-performance-evaluations.html">documentation</a>
      and our <a href="https://aws.amazon.com/connect/contact-lens/">webpage</a>.</p>
