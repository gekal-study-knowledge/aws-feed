  773fce574df4a814a99a698527052dde:
    id: 773fce574df4a814a99a698527052dde
    title: AWS WAF is now available in the AWS Asia Pacific (New Zealand) Region
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-waf-asia-pacific-new-zealand-region/
    published: "2025-12-30"
    fetched: "2025-12-30"
    summary:
      <p>Starting today, AWS WAF is available in the AWS Asia Pacific (New
      Zealand) Region.<br /> <br /> AWS WAF is a web application firewall that helps
      you protect your web application resources against common web exploits and bots
      that can affect availability, compromise security, or consume excessive resources.
      With AWS WAF, you can control access to your content. Based on conditions that
      you specify, such as the IP addresses that requests originate from or the values
      of query strings, your protected resource responds to requests either with the
      requested content, with an HTTP 403 status code (Forbidden), or with a custom
      response.<br /> <br /> To see the full list of regions where AWS WAF is currently
      available, visit the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"></a><a
      href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS Region Table</a>. For more information about the service,
      visit the <a href="https://aws.amazon.com/waf/" target="_blank">AWS WAF</a>
      page. For more information about pricing, visit the <a href="https://aws.amazon.com/waf/pricing/"
      target="_blank">AWS WAF Pricing page</a>.</p>
  168fd21e091bab6055fcaf030e1c56cf:
    id: 168fd21e091bab6055fcaf030e1c56cf
    title: AWS launches simplified import of CloudTrail Lake data in Amazon CloudWatch
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-simplified-import-cloudtrail-lake-data-amazon-cloudwatch
    published: "2025-12-30"
    fetched: "2025-12-30"
    summary:
      <p>Today, AWS launches simplified import of CloudTrail Lake data in Amazon
      CloudWatch, a data management and analytics service that allows you to unify
      operational, security, and compliance data across your AWS environment and third-party
      sources. With this launch, you can now import your historical CloudTrail Lake
      data into CloudWatch with a few steps enabling you to easily consolidate operational,
      security, and compliance data in one place. In CloudWatch, you simply specify
      the CloudTrail Lake event data store (EDS), and the date range to initiate import
      of your CloudTrail data. Simplified import of CloudTrail Lake data is supported
      via the AWS console, CLI, and SDK.<br /> <br /> While simplified import of CloudTrail
      Lake data is available at no additional cost, you incur CloudWatch fees based
      on custom logs pricing. To learn more about simplified import of CloudTrail
      Lake data and supported AWS regions, visit the <a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-cloudwatch.html"
      target="_blank">Amazon CloudWatch documentation.</a></p>
