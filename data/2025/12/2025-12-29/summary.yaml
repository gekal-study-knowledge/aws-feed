"overview": |
  この日は新機能発表が 2 件でした。Amazon Connect のダッシュボードが、事業部門、製品ライン、顧客セグメントといったカスタムビジネスディメンションに基づくメトリクスのフィルタリングに対応しました。事前定義された属性でビジネスディメンションを作成し、独自のビジネスニーズに応じてダッシュボードをカスタマイズできます。もう 1 件は Amazon OpenSearch UI が AWS KMS のカスタマー管理キー (CMK) とメタデータサイズの拡大に対応したものです。OpenSearch ドメイン/コレクション、S3、CloudWatch、Security Lake など複数データソースを横断する管理サービスで、メタデータを自身の CMK で暗号化して規制・コンプライアンス要件を満たせるほか、複雑なクエリや大規模ダッシュボードの保存が可能になりました。
