  358a22188c261bd2afe31d878f63c164:
    id: 358a22188c261bd2afe31d878f63c164
    title:
      Amazon Connect dashboards now support filtering metrics based on custom
      business dimensions
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-connect-dashboards-filtering-metrics-custom-business-dimensions
    published: "2025-12-29"
    fetched: "2025-12-29"
    summary:
      <p>Amazon Connect dashboards now support filtering metrics based on custom
      business dimensions such as business divisions, product lines, or customer segments.
      Using predefined attributes, you can create business dimensions to filter metrics
      helping you customize the dashboards based on your unique business need. For
      example, if your queue handles contacts across product lines, you can filter
      metrics by product line to compare handle times and determine where agents need
      product training.<br /> <br /> Amazon Connect dashboards are available in all
      AWS commercial and AWS GovCloud (US-West) <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">Regions</a> where Amazon Connect is offered. To learn more about
      dashboards, see the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/dashboards.html"
      target="_blank">Amazon Connect Administrator Guide</a>. To learn more about
      Amazon Connect, the AWS cloud-based contact center, please visit the <a href="https://aws.amazon.com/connect/"
      target="_blank">Amazon Connect website</a>.</p>
  4e9728c177b48a670cfa53e5b92f49d1:
    id: 4e9728c177b48a670cfa53e5b92f49d1
    title: Amazon OpenSearch UI supports CMK and increased metadata size
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-opensearch-ui-cmk-metadata/
    published: "2025-12-29"
    fetched: "2025-12-29"
    summary:
      '<p>Amazon OpenSearch Service now supports AWS KMS customer managed keys
      (CMKs) and increased size for OpenSearch UI metadata. Amazon OpenSearch UI is
      a managed service for dashboarding and operational analytics that provides a
      unified view across multiple data sources, including OpenSearch domains and
      collections, Amazon S3, Amazon CloudWatch, and AWS Security Lake.<br /> <br
      /> You can now create new OpenSearch UI applications with metadata encrypted
      with your own CMKs, helping organizations meet regulatory and compliance requirements.
      This launch also increases the metadata size limit for saved objects in OpenSearch
      UI, enabling you to create and store complex queries, extensive visualizations,
      and large-scale dashboards.<br /> <br /> CMK support and increased metadata
      size are available in <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-ui-endpoints-quotas.html"
      style="cursor: pointer;" target="_blank">all regions that OpenSearch UI is available</a>.
      Learn more at <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application.html"
      style="cursor: pointer;" target="_blank">Amazon OpenSearch UI Developer Guide</a>.</p>'
