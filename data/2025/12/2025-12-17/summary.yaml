"overview": |
  この日は新機能発表が多く、特に Graviton4 系 EC2 インスタンスのリージョン拡張とデータベース関連の話題が目立ちました。Graviton4 搭載の M8gn/M8gb が GA (最大 600 Gbps ネットワーク帯域)、C8g/M8g/R8g が GovCloud やチューリッヒ、パリ、ハイデラバードなど多数の新リージョンで利用可能になり、Intel Xeon 6 の C8i/C8i-flex もシンガポールに追加されました。データベースでは AWS Databases (Aurora PostgreSQL/DSQL、DynamoDB) が Vercel Marketplace で提供開始、Aurora が RDS プレビュー環境で PostgreSQL 18.1 対応、Redshift Serverless が IPv6 デュアルスタックに対応。OpenSearch Service は新 OI2 インスタンスと書き込み可能な warm 層を含むマルチティアストレージを追加。決済系では Payment Cryptography が複数リージョンに拡張し API 料金を最大 63% 削減。セキュリティ面では Security Hub CSPM 自動化ルールの移行、Security Incident Response の 10 リージョン追加が発表され、速報 AWS-2025-032 で複数言語の S3 暗号化クライアントの鍵コミットメント問題 (Invisible Salamanders 攻撃) が告知されました。
