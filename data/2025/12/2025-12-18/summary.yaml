  この日は新機能発表が多く、IPv6 対応、コンテナ/コンピュート、ガバナンス強化が目立ちました。IPv6 では Amazon WorkSpaces と Amazon MSK Connect (新規コネクタ) がデュアルスタックに対応。コンピュートでは EC2 が API 全体で Availability Zone ID をサポートし、Intel Xeon 6 の R8i/R8i-flex や AMD EPYC の C8a が新リージョンに追加されました。コンテナでは ECS Managed Instances が EC2 Spot に対応 (最大 90% 割引)、ECS が Fargate タスク引退の週次イベントウィンドウ設定に対応、MSK Express Brokers が Kafka 3.9 で KRaft をサポート。サーバーレスでは Lambda durable functions が 14 リージョンに拡張。データベースでは Aurora が複数の PostgreSQL マイナーバージョン、Neptune がチューリッヒに対応。ガバナンスでは Control Tower に 176 の Security Hub コントロールが追加され、Clean Rooms は既存コラボレーションの変更リクエスト、Direct Connect は FIS によるレジリエンステスト、SES は電子メール検証を追加しました。
