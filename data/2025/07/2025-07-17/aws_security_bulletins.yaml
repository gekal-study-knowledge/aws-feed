    title: CVE-2025-6031 - Insecure device pairing in end-of-life Amazon Cloud Cam
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-013/
    published: "2025-07-17"
    fetched: "2025-07-17"
    summary:
      "<p><strong>Scope: Amazon<br /> Content Type: Informational<br /> Publication\
      \ Date: 2025/06/12 10:30 AM PDT</strong></p>\n<p> </p>\n<p><strong>Description</strong></p>\
      \ \n<p>Amazon Cloud Cam is a home security camera that was deprecated on December\
      \ 2, 2022, is end of life, and is no longer actively supported.</p> \n<p>When\
      \ a user powers on the Amazon Cloud Cam, the device attempts to connect to a\
      \ remote service infrastructure that has been deprecated due to end-of-life\
      \ status. The device defaults to a pairing status in which an arbitrary user\
      \ can bypass SSL pinning to associate the device to an arbitrary network, allowing\
      \ for network traffic interception and modification.</p> \n<p><strong>Affected\
      \ version:</strong> All</p>"
