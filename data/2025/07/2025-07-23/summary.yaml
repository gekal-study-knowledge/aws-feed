"overview": |
  この日はセキュリティ速報が 1 件公開されました。重要度「Important (requires attention)」として、CVE-2025-8069 (AWS Client VPN の Windows クライアントにおけるローカル権限昇格) が報告されました。Windows デバイスへの AWS Client VPN クライアントのインストール処理が OpenSSL 設定ファイルの取得元として C:\usr\local\windows-x86_64-openssl-localbuild\ssl を参照するため、非管理者ユーザーが当該設定ファイルに任意のコードを配置し、管理者ユーザーがインストールを実行した際に root 相当の権限でコードが実行されうるというものです。Linux および macOS のデバイスには影響しません。影響を受けるバージョンは 4.1.0、5.0.0、5.0.1、5.0.2、5.1.0、5.2.0、5.2.1 です。
