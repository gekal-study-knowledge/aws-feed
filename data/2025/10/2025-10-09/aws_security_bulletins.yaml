    id: 9b742f25c70ed854a09bcb5eccf62f19
    title: CVE-2025-11573 - Denial of Service issue in Amazon.IonDotnet
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-022/
    published: "2025-10-09"
    fetched: "2025-10-09"
    summary:
      "<p><b>Bulletin ID:</b> AWS-2025-022<br /> <b>Scope:</b> Amazon<br />\
      \ <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b>\
      \ 2025/10/09 11:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon.IonDotnet\
      \ is a library for the Dotnet language that is used to read and write Amazon\
      \ Ion data.</p> \n<p>We identified CVE-2025-11573, which describes an infinite\
      \ loop issue in Amazon.IonDotnet library versions &lt;v1.3.2 that may allow\
      \ a threat actor to cause a denial of service through a specially crafted text\
      \ input. As of August 20, 2025, this library has been deprecated and will not\
      \ receive further updates.</p> \n<p><b>Affected versions:</b></p> \n<p>&lt;1.3.2</p>"
