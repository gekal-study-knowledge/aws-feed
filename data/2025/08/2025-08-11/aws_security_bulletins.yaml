    title: 'Security Update for Amazon Q Developer Extension for Visual Studio Code
      (Version #1.84)'
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-015/
    published: '2025-08-11'
    summary: "<p><b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires\
      \ attention)<br /> <b>Publication Date:</b>&nbsp;2025/07/23 6:00 PM PDT<br />\
      \ <b>Updated Date:</b> 2025/07/25 6:00 PM PDT</p> \n<p><strong>Description:</strong></p>\
      \ \n<p>Amazon Q Developer for Visual Studio Code (VS Code) Extension is a development\
      \ tool that integrates Amazon Q's AI-powered coding assistance directly into\
      \ the VS Code integrated development environment (IDE).</p> \n<p>AWS is aware\
      \ of and has addressed an issue in the Amazon Q Developer for VS Code Extension,\
      \ which is assigned to CVE-2025-8217.</p> \n<p>AWS Security has inspected the\
      \ code and determined the malicious code was distributed with the extension\
      \ but was unsuccessful in executing due to a syntax error. This prevented the\
      \ malicious code from making changes to any services or customer environments.</p>\
      \ \n<p>We will update this bulletin if we have additional information to share.</p>\
      \ \n<p><strong>Affected version:</strong> Amazon Q Developer for Visual Studio\
      \ Code Extension (version 1.84.0)</p>"
