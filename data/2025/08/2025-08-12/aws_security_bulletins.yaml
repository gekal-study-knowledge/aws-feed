    id: 1da3555faa32a924d6eca7bace9dc8c5
    title: "[Redirected] Memory Dump Issue in AWS CodeBuild"
    link: https://aws.amazon.com/security/security-bulletins/rss/aws-2025-016/
    published: "2025-08-12"
    summary:
      "<p><b>Bulletin ID:</b> AWS-2025-016<br /> <b>Scope:</b> AWS<br /> <b>Content\
      \ Type:</b> Important (requires attention)<br /> <b>Publication Date:</b>&nbsp;2025/07/25\
      \ 6:00 PM PDT</p> \n<p><strong>Description:</strong></p> \n<p>AWS CodeBuild\
      \ is a fully managed on-demand continuous integration service that compiles\
      \ source code, runs tests, and produces software packages that are ready to\
      \ deploy.</p> \n<p>Security researchers reported a CodeBuild issue that could\
      \ be leveraged for unapproved code modification absent sufficient repository\
      \ controls and credential scoping. The researchers demonstrated how a threat\
      \ actor could submit a Pull Request (PR) that, if executed through an automated\
      \ CodeBuild build process, could extract the source code repository (e.g. GitHub,\
      \ BitBucket, or GitLab) access token through a memory dump within the CodeBuild\
      \ build environment. If the access token has write permissions, the threat actor\
      \ could commit malicious code to the repository. This issue is present in all\
      \ regions for CodeBuild.</p> \n<p>During our investigation, we identified this\
      \ technique was leveraged by a threat actor who extracted the source code repository\
      \ access token for the AWS Toolkit for Visual Studio Code and AWS SDK for .NET\
      \ repositories. We have assigned CVE-2025-8217 for this, please refer to the\
      \ AWS Security Bulletin AWS-2025-015 for additional information.</p> \n<p>Source\
      \ code repository credentials are required in CodeBuild to access repository\
      \ content, create webhooks for automated builds, and execute the build on your\
      \ behalf. If a PR submitter obtains CodeBuild's repository credentials, they\
      \ could gain elevated permissions beyond their normal access level. Depending\
      \ on the permissions customers grant in CodeBuild, these credentials might allow\
      \ elevated privileges like webhook creation, which CodeBuild requires to integrate\
      \ with source code repositories and set up automated builds, or commit code\
      \ to the repository.</p> \n<p>To determine if this issue was leveraged by an\
      \ untrusted contributor, we recommend reviewing git logs, e.g. GitHub logs,\
      \ and look for anomalous activity of the credentials granted to CodeBuild.</p>\
      \ \n<p>We will update this bulletin if we have additional information to share.</p>\
      \ \n<p><b>Resolution:</b></p> \n<p>CodeBuild has included additional protections\
      \ against memory dumps within container builds using unprivileged mode. However,\
      \ because builds execute code committed by contributors in the build environment,\
      \ they have access to anything the build environment has access to. Therefore,\
      \ we strongly recommend customers do not use automatic PR builds from untrusted\
      \ repository contributors. For public repositories that want to continue to\
      \ support automatic builds of untrusted contributions, we advise using the self-hosted\
      \ GitHub Actions runners feature in CodeBuild as it is not impacted by this\
      \ issue.</p>"
