    title: Claude Sonnet 4.6 now available in Amazon Bedrock
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/claude-sonnet-4.6-available-in-amazon-bedrock/
    published: '2026-02-17'
    summary: "<p>Starting today, Amazon Bedrock supports Claude Sonnet 4.6, which\
      \ offers frontier performance across coding, agents, and professional work at\
      \ scale.&nbsp;According to Anthropic, Claude Sonnet 4.6 is their best computer\
      \ use model yet, allowing organizations&nbsp;to deploy browser-based automation\
      \ across business tools with near-human reliability. Claude Sonnet 4.6 approaches\
      \ Opus 4.6 intelligence at a lower cost. It enables faster, high-quality task\
      \ completion, making it ideal for high-volume coding and&nbsp;knowledge&nbsp;work\
      \ use cases.&nbsp;</p> \n<p>&nbsp;</p> \n<p>Claude Sonnet 4.6 serves as a direct\
      \ upgrade to Sonnet 4.5 across use cases that require consistent conversational\
      \ quality and efficient multi-step orchestration. For search and chat applications,\
      \ it delivers reliable performance across single and multi-turn exchanges at\
      \ a price point that makes high-volume deployment practical,&nbsp;maintaining&nbsp;quality\
      \ standards while&nbsp;optimizing for&nbsp;scale. Developers can&nbsp;leverage&nbsp;Claude\
      \ Sonnet 4.6’s&nbsp;for agentic workflows, seamlessly filling both lead agent\
      \ and subagent roles in multi-model pipelines with precise workflow management\
      \ and context compaction capabilities. Enterprise teams can use Claude Sonnet\
      \ 4.6 to power domain-specific applications with professional precision, including\
      \ spreadsheet and financial model creation that accelerates analysis workflows,\
      \ compliance review processes that require meticulous attention to detail, and\
      \ data summarization tasks where iteration speed and accuracy are paramount.\
      \ Claude Sonnet 4.6 requires only minor prompting adjustments from Sonnet 4.5,\
      \ ensuring smooth migration for existing implementations.&nbsp;</p> \n<p>&nbsp;</p>\
      \ \n<p>Claude Sonnet 4.6 is now available&nbsp;in&nbsp;Amazon Bedrock. For the\
      \ full list of available regions, refer to the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html\"\
      \ target=\"_blank\">documentation</a>. To learn more and get started with Claude\
      \ Sonnet 4.6&nbsp;in&nbsp;Amazon Bedrock, read the <a href=\"https://www.aboutamazon.com/news/aws/anthropic-claude-4-opus-sonnet-amazon-bedrock\"\
      \ target=\"_blank\">About Amazon blog </a>and visit the <a href=\"https://console.aws.amazon.com/bedrock/\"\
      \ target=\"_blank\">Amazon Bedrock console</a>.</p>"
