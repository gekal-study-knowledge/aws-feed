  f4328983ffb2c9ab228860941c05f234:
    id: f4328983ffb2c9ab228860941c05f234
    title: AWS Transfer Family Terraform module now supports web apps
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-transfer-family-terraform-webapps
    published: '2026-01-21'
    summary: <p>You can now use the&nbsp;<a href="https://github.com/aws-ia/terraform-aws-transfer-family"
      target="_blank">AWS Transfer Family Terraform module</a>&nbsp;to deploy Transfer
      Family web apps, which enable end users to transfer files to and from Amazon
      S3 over a web interface. This release streamlines centralized provisioning of
      web apps with federated authentication and user access controls, enabling consistent,
      repeatable deployments through infrastructure as code.<br /> <br /> With Transfer
      Family web apps, you can provide your workforce with a fully managed, branded
      web portal to browse, upload, and download data in S3. In a single deployment,
      this module allows you to programmatically provision your web apps that authenticate
      users through AWS IAM Identity Center using your existing identity provider
      and Amazon S3 Access Grants for fine-grained user permissions. An included&nbsp;<a
      href="https://github.com/aws-ia/terraform-aws-transfer-family/tree/v0.5.0/examples/sample-web-app"
      target="_blank">end-to-end example</a>&nbsp;shows you how to assign and optionally
      create IAM Identity Center users and groups, configure S3 Access Grants, set
      up the web app, and enable security auditing through Amazon CloudTrail.<br />
      <br /> You can get started by downloading the new module from the&nbsp;<a href="https://registry.terraform.io/modules/aws-ia/transfer-family/aws/latest/submodules/transfer-web-app"
      target="_blank">Terraform Registry</a>. To learn more about Transfer Family
      web apps, visit the&nbsp;<a href="https://docs.aws.amazon.com/transfer/latest/userguide/web-app.html"
      target="_blank">user guide</a>. To see all the regions where Transfer Family
      web apps is available, visit the&nbsp;<a href="https://docs.aws.amazon.com/transfer/latest/userguide/web-app.html#webapp-regions"
      target="_blank">AWS Region table</a>.</p>
  0bbd778cf4e17c26ee5b003fbae80456:
    id: 0bbd778cf4e17c26ee5b003fbae80456
    title: Amazon EC2 C8gn instances are now available in additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-c8gn-instances-additional-regions
    published: '2026-01-21'
    summary: '<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances,
      powered by the latest-generation AWS Graviton4 processors, are available in
      the AWS Region&nbsp;Asia Pacific (Mumbai), Africa (Cape Town), Europe (Ireland,
      London), Canada West (Calgary). The new instances provide up to 30% better compute
      performance than Graviton3-based Amazon EC2 C7gn instances. Amazon EC2 C8gn
      instances feature the latest 6th generation AWS Nitro Cards, and offer up to
      600 Gbps network bandwidth, the highest network bandwidth among network optimized
      EC2 instances.&nbsp;<br /> &nbsp;<br /> Take advantage of the enhanced networking
      capabilities of C8gn to scale performance and throughput, while optimizing the
      cost of running network-intensive workloads such as network virtual appliances,
      data analytics, CPU-based artificial&nbsp;intelligence&nbsp;and machine learning&nbsp;(AI/ML)
      inference.&nbsp;<br /> &nbsp;<br /> For increased scalability, C8gn instances
      offer instance sizes up to 48xlarge, up to 384 GiB of memory, and up to 60 Gbps
      of bandwidth to Amazon Elastic Block Store (EBS). C8gn instances support Elastic
      Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge, metal-24xl,
      and metal-48xl sizes, which enables lower latency and improved cluster performance
      for workloads deployed on tightly coupled clusters.&nbsp;<br /> &nbsp;<br />
      C8gn instances are available in the following AWS Regions: US East (N. Virginia,
      Ohio), US West (Oregon, N.California), Europe (Frankfurt, Stockholm, Ireland,
      London), Asia Pacific (Singapore, Malaysia, Sydney, Thailand, Mumbai), Middle
      East (UAE), Africa (Cape Town), Canada West (Calgary).&nbsp;<br /> &nbsp;<br
      /> To learn more, see&nbsp;<a href="https://aws.amazon.com/ec2/instance-types/c8g/">Amazon
      C8gn Instances</a>. To begin your Graviton journey, visit the&nbsp;<a href="https://aws.amazon.com/ec2/graviton/level-up-with-graviton/">Level
      up your compute with AWS Graviton page</a>. To get started, see&nbsp;<a href="https://console.aws.amazon.com/">AWS
      Management Console</a>,&nbsp;<a href="https://aws.amazon.com/cli/">AWS Command
      Line Interface (AWS CLI)</a>, and&nbsp;<a href="https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html">AWS
      SDKs</a>.</p>'
