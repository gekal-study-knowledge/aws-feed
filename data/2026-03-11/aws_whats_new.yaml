  260a7cce5ceb0fe66b30832648ccd8dc:
    id: 260a7cce5ceb0fe66b30832648ccd8dc
    title: Amazon Connect now provides integrated workflows for managers to coach
      agents
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-integrated-agent-coaching-workflows/
    published: '2026-03-11'
    summary: <p>Amazon Connect now delivers integrated agent coaching workflows that
      enable contact center managers to provide timely, targeted feedback directly
      within the Connect UI. When managers identify improvement opportunities through
      evaluation scorecards, they can immediately create coaching plans with specific
      customer interaction examples. For example, a manager can share interactions
      with an agent where they excelled at problem-solving but could show more customer
      empathy, with examples of empathetic language to use going forward. After coaching
      sessions, agents acknowledge feedback and add notes to confirm understanding
      of expectations and next steps. Both managers and agents access all coaching
      history on a single page, enabling systematic progress tracking and improved
      coaching effectiveness. This integrated approach eliminates coaching delays
      and creates accountability throughout the agent development process, accelerating
      performance improvement across contact center operations.<br /> <br /> This
      feature is available in all regions where <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region">Amazon
      Connect</a> is offered. To learn more, please visit our <a href="https://docs.aws.amazon.com/connect/latest/adminguide/provide-coaching.html">documentation</a>
      and our <a href="https://aws.amazon.com/connect/conversational-analytics/">webpage</a>.&nbsp;</p>
  74caa5c191aff9ce4cb483b11e880dcd:
    id: 74caa5c191aff9ce4cb483b11e880dcd
    title: Amazon CloudWatch Database Insights on-demand analysis now available in
      AWS Govcloud (US) Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-cloudwatch-database-insights-on-demand-analysis-in-govcloud/
    published: '2026-03-11'
    summary: <p>Amazon CloudWatch Database Insights expands the availability of its
      on-demand analysis experience to AWS GovCloud (US-East) and AWS GovCloud (US-West).
      CloudWatch Database Insights is a monitoring and diagnostics solution that helps
      database administrators and developers optimize database performance by providing
      comprehensive visibility into database metrics, query analysis, and resource
      utilization patterns. This feature uses machine learning models to help identify
      performance bottlenecks during the selected time period, and gives advice on
      what to do next.<br /> <br /> Previously, database administrators had to manually
      analyze performance data, correlate metrics, and investigate root cause. This
      process is time-consuming and requires deep database expertise. With this launch,
      you can now analyze database performance monitoring data for any time period
      with automated intelligence. The feature automatically compares your selected
      time period against normal baseline performance, identifies anomalies, and provides
      specific remediation advice. Through intuitive visualizations and clear explanations,
      you can quickly identify performance issues and receive step-by-step guidance
      for resolution. This automated analysis and recommendation system reduces mean-time-to-diagnosis
      from hours to minutes.<br /> <br /> You can get started with this feature by
      enabling the Advanced mode of CloudWatch Database Insights on your Amazon Aurora
      and Amazon RDS databases using the RDS service console, AWS APIs, the AWS SDK,
      or AWS CloudFormation. Please refer to&nbsp;<a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_PerfInsights.Overview.Engines.html#USER_PerfInsights.Overview.PIfeatureEngnRegSupport"
      target="_blank">Aurora documentation&nbsp;</a>or&nbsp;<a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PerfInsights.Overview.Engines.html#USER_PerfInsights.Overview.PIfeatureEngnRegSupport"
      target="_blank">RDS documentation</a>&nbsp;to get started.&nbsp;</p>
  eca2bc9744e1a2fa41b43c1563fee2c5:
    id: eca2bc9744e1a2fa41b43c1563fee2c5
    title: Amazon EC2 C8id instances are now available in Europe (Spain)
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-c8id-instances-europe-spain/
    published: '2026-03-11'
    summary: <p>Amazon Elastic Compute Cloud (EC2) C8id instances powered by custom
      Intel Xeon 6 processors feature up to 384 vCPUs, 768GiB of memory, and 22.8TB
      of NVMe SSD storage and deliver up to 43% higher performance and 3.3x more memory
      bandwidth compared to previous generation C6id instances. Starting today, C8id
      instances are available in Europe (Spain) region.<br /> <br /> These instances
      deliver up to 46% higher performance for I/O intensive database workloads, and
      up to 30% faster query results for I/O intensive real-time data analytics than
      previous sixth-generation instances<b>.</b> Additionally, these instances support
      Instance Bandwidth Configuration, allowing 25% flexible allocation between network
      and EBS bandwidth, allocating resources optimally for each workload.<br /> <br
      /> C8id instances are ideal for compute-intensive workloads such as high-performance
      web servers, batch processing, distributed analytics, ad serving, video encoding,
      and gaming servers.<br /> <br /> C8id instances are available in US East (N.
      Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Spain), and Asia Pacific
      (Tokyo) regions. Customers can purchase these instances via Savings Plans, On-Demand
      instances, and Spot instances. For more information visit the <a href="https://aws.amazon.com/ec2/instance-types/">Amazon
      EC2 instance type page.</a></p>
  8176d0515f03f9478ecd3c9ed06c5a4e:
    id: 8176d0515f03f9478ecd3c9ed06c5a4e
    title: Amazon EC2 C8gd and M8gd instances are now available in additional AWS
      Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-c8gd-m8gd-instances-available/
    published: '2026-03-11'
    summary: <p>Amazon Elastic Compute Cloud (Amazon EC2) C8gd and M8gd instances
      with up to 11.4 TB of local NVMe-based SSD block-level storage are now available
      in additional regions. C8gd instances are now available in South America (Sao
      Paulo). M8gd instances are now available in Europe (Ireland). These instances
      are powered by AWS Graviton4 processors, delivering up to 30% better performance
      over Graviton3-based instances. They have up to 40% higher performance for I/O
      intensive database workloads, and up to 20% faster query results for I/O intensive
      real-time data analytics than comparable AWS Graviton3-based instances. These
      instances are built on the AWS Nitro System and are a great fit for applications
      that need access to high-speed, low latency local storage.<br /> <br /> Each
      instance is available in 12 different sizes. They provide up to 50 Gbps of network
      bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon
      EBS). Additionally, customers can now adjust the network and<br /> Amazon EBS
      bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration,
      providing greater ﬂexibility with the allocation of bandwidth resources to better
      optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking
      on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.<br /> <br /> To learn
      more, see <a href="https://aws.amazon.com/ec2/instance-types/c8g/">Amazon C8gd
      Instances</a> and <a href="https://aws.amazon.com/ec2/instance-types/m8g/">Amazon
      M8gd Instances</a>. To explore how to migrate your workloads to Graviton-based
      instances, see <a href="https://aws.amazon.com/ec2/graviton/fast-start/">AWS
      Graviton Fast Start program</a> and <a href="https://github.com/aws/porting-advisor-for-graviton">Porting
      Advisor for Graviton</a>. To get started, see the <a href="https://console.aws.amazon.com/">AWS
      Management Console</a>.</p>
  fca8ba817c743f039e0aca2879f98cb3:
    id: fca8ba817c743f039e0aca2879f98cb3
    title: Amazon EC2 R7gd instances are now available in South America (Sao Paulo)
      Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-r7gd-instances-available/
    published: '2026-03-11'
    summary: <p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R7gd instances
      with up to 3.8 TB of local NVMe-based SSD block-level storage are available
      in South America (Sao Paulo) Region.<br /> <br /> R7gd are powered by AWS Graviton3
      processors with DDR5 memory are built on the <a href="https://aws.amazon.com/ec2/nitro/">AWS
      Nitro System</a>. They are ideal for memory-intensive workloads such as open-source
      databases, in-memory caches, and real-time big data analytics and are a great
      fit for applications that need access to high-speed, low latency local storage,
      including those that need temporary storage of data for scratch space, temporary
      files, and caches.<br /> <br /> To learn more, see <a href="https://aws.amazon.com/ec2/instance-types/r7g/">Amazon
      R7gd Instances</a>. To get started, see the <a href="https://console.aws.amazon.com/">AWS
      Management Console</a>.</p>
  527f06c005567ebb524785cb2fbfcd90:
    id: 527f06c005567ebb524785cb2fbfcd90
    title: Amazon EC2 High Memory U7i instances now available in additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-high-memory-u7i-instances/
    published: '2026-03-11'
    summary: "<p>Amazon EC2 High Memory U7i instances with 8TB of memory (u7i-8tb.112xlarge)\
      \ are now available in AWS Asia Pacific (Hyderabad), and U7i instances with\
      \ 12TB of memory (u7i-12tb.224xlarge) are now available in AWS Europe (Spain).\
      \ U7i instances are part of AWS 7th generation and are powered by custom fourth\
      \ generation Intel Xeon Scalable Processors (Sapphire Rapids). U7i-8tb instances\
      \ offer 8TiB of DDR5 memory, U7i-12tb instances offer 12TiB of DDR5 memory,\
      \ enabling customers to scale transaction processing throughput in a fast-growing\
      \ data environment.</p> \n<p>U7i-8tb instances offer 448 vCPUs and U7i-12tb\
      \ instances offer 896 vCPUs. Both instance types support up to 100 Gbps of Amazon\
      \ Elastic Block Store (Amazon EBS) bandwidth for faster data loading and backups,\
      \ up to 100 Gbps of network bandwidth, and ENA Express.&nbsp;</p> \n<p>U7i instances\
      \ are ideal for customers using mission-critical in-memory databases like SAP\
      \ HANA, Oracle, and SQL Server.</p> \n<p><br /> To learn more about U7i instances,\
      \ visit the <a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High\
      \ Memory instances page</a>.</p>"
  b9c0211403029a63f3ec86898b6f8158:
    id: b9c0211403029a63f3ec86898b6f8158
    title: Amazon Connect now lets you select different From email addresses when
      sending emails
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-agents-select-from-email/
    published: '2026-03-11'
    summary: "<p>Amazon Connect now enables you to choose the \"From\" email address\
      \ when replying to inbound emails or sending new outbound messages, helping\
      \ contact centers ensure the correct brand or business identity is used for\
      \ every customer interaction. Administrators can configure multiple sender addresses\
      \ per queue, allowing agents to search and select the appropriate email address\
      \ based on the queue they are working in. This capability is especially useful\
      \ for contact centers that support multiple brands or lines of business from\
      \ a single Amazon Connect instance.<br /> <br /> Amazon Connect email is available\
      \ in the US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific\
      \ (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo),\
      \ Canada (Central), Europe (Frankfurt), and Europe (London) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      >regions</a>. To learn more and get started, please refer to the help <a href=\"\
      https://docs.aws.amazon.com/connect/latest/adminguide/agent-select-from-email.html\"\
      >documentation</a> or visit the <a href=\"https://aws.amazon.com/connect/\"\
      >Amazon Connect</a> website.</p> \n<p>&nbsp;</p>"
  dd37d70c942a87711a5077a2c1ca926d:
    id: dd37d70c942a87711a5077a2c1ca926d
    title: Amazon Connect now provides case data in analytics data lake
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-cases-data-lake
    published: '2026-03-11'
    summary: '<p>Amazon Connect now provides case data in the analytics data lake,
      making it easier for you to generate reports and insights. With case data available
      alongside other Amazon Connect analytics, you can use Amazon Athena and Amazon
      QuickSight to build custom reports and analyze trends such as case volume by
      type, case handling across agent shifts, or contact sentiment across cases without
      building and maintaining complex data pipelines.<br /> <br /> Amazon Connect
      Cases is available in the following AWS regions: US East (N. Virginia), US West
      (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific
      (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo),
      and Africa (Cape Town) AWS regions. To learn more and get started, visit the
      Amazon Connect Cases <a href="https://aws.amazon.com/connect/cases/" target="_blank">webpage</a>
      and <a href="https://docs.aws.amazon.com/connect/latest/adminguide/data-lake-cases-data.html"
      target="_blank">documentation</a>.</p>'
  803a438bf3110e3c0a6f1e6dcec51e8c:
    id: 803a438bf3110e3c0a6f1e6dcec51e8c
    title: AWS Backup expands support for Amazon RDS Multi-AZ clusters to 17 Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-backup-expands-amazon-rds-multi-az-clusters-17-regions/
    published: '2026-03-11'
    summary: "<p>AWS Backup for Amazon RDS Multi-AZ clusters is now available in 17\
      \ additional AWS Regions: Asia Pacific (Mumbai, Osaka, Seoul, Hong Kong, Jakarta,\
      \ Hyderabad, Melbourne, Malaysia), Europe (London, Paris, Milan, Zurich, Spain),\
      \ South America (Sao Paulo), Africa (Cape Town), Canada (Central), and Canada\
      \ West (Calgary).</p> \n<p>This expansion brings AWS Backup's comprehensive\
      \ data protection capabilities—including automated lifecycle management, and\
      \ immutable backups with AWS Backup Vault Lock —to your Amazon RDS Multi-AZ\
      \ clusters in these Regions.</p> \n<p>To start protecting your RDS Multi-AZ\
      \ clusters with AWS Backup, add your RDS Multi-AZ clusters to your existing\
      \ backup plans or create a new backup plan, and attach your RDS clusters to\
      \ the newly created backup plan. To learn more about AWS Backup for Amazon RDS\
      \ Multi-AZ clusters, visit the <a href=\"https://aws.amazon.com/backup/\">product\
      \ page</a>, <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>,\
      \ and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html\"\
      >documentation</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/backup\"\
      >AWS Backup console</a>, AWS Command Line Interface (CLI), or AWS SDKs.</p>"
  872d524629ed91c93a291aa3430e5f28:
    id: 872d524629ed91c93a291aa3430e5f28
    title: Amazon Neptune Database is now available in Asia Pacific (Hyderabad) region
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-neptune-hyderabad/
    published: '2026-03-11'
    summary: "<p><a href=\"https://aws.amazon.com/neptune/\" target=\"_blank\">Amazon\
      \ Neptune</a> Database is now available in the <a href=\"https://aws.amazon.com/local/india/\"\
      \ target=\"_blank\">AWS Asia Pacific (Hyderabad)</a> region. You can now create\
      \ Neptune clusters using R5, R5d, R6g, R6i, X2iedn, T4g, and T3 instance types\
      \ in the AWS Asia Pacific (Hyderabad) region.</p> \n<p>Amazon Neptune Database\
      \ is a fast, reliable, and fully managed graph database as a service that makes\
      \ it easy to build and run applications work with highly connected datasets.\
      \ You can build applications using Apache TinkerPop Gremlin or openCypher on\
      \ the Property Graph model, or using the SPARQL query language on W3C Resource\
      \ Description Framework (RDF). Neptune also offers enterprise features such\
      \ as high availability, automated backups, and network isolation to help customers\
      \ quickly deploy applications to production. Amazon Neptune supports Neptune\
      \ Global Database designed for globally distributed applications, allowing a\
      \ single Neptune database to span multiple AWS Regions.<br /> <br /> To get\
      \ started, you can create a new Neptune cluster using the <a href=\"https://console.aws.amazon.com/neptune\"\
      \ target=\"_blank\">AWS Management Console</a>, <a href=\"https://awscli.amazonaws.com/v2/documentation/api/latest/reference/neptune/create-db-cluster.html\"\
      \ target=\"_blank\">AWS CLI</a>, or a <a href=\"https://docs.aws.amazon.com/neptune/latest/userguide/get-started-create-cluster.html#get-started-cfn-create\"\
      \ target=\"_blank\">quickstart</a> AWS CloudFormation template. For more information\
      \ on pricing and region availability, refer to the <a href=\"https://aws.amazon.com/neptune/pricing/\"\
      \ target=\"_blank\">Neptune pricing page</a> and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      \ target=\"_blank\">AWS Region Table</a>.</p>"
  21cc492abc11f149055b80dcb0178817:
    id: 21cc492abc11f149055b80dcb0178817
    title: Amazon Neptune Database adds native spatial data support
    link: https://aws.amazon.comhttps://aws.amazon.com/about-aws/whats-new/2026/03/amazon-neptune-database-spatial-data/
    published: '2026-03-11'
    summary: "<p><a href=\"https://aws.amazon.com/neptune/\" target=\"_blank\">Amazon\
      \ Neptune</a> Database now includes comprehensive spatial data capabilities,\
      \ addressing the growing need for location-aware insights in graph database\
      \ applications. Spatial support provides 11 built-in spatial functions following\
      \ the ISO 13249-3 standard, supporting GEOMETRY data types with seamless integration\
      \ into existing GIS applications like <a href=\"https://www.esri.com/en-us/arcgis/geospatial-platform/overview\"\
      \ target=\"_blank\">Esri ArcGIS</a>.</p> \n<p>With spatial support, customers\
      \ no longer need to maintain separate spatial databases alongside their graph\
      \ databases. Organizations can now perform proximity analysis, track asset locations\
      \ and routes in network infrastructures, analyze geographic patterns in connected\
      \ data, and build location-aware AI assistants that provide factual spatial\
      \ answers without hallucinations. The feature particularly benefits mapping\
      \ and navigation companies, ridesharing and transportation services, logistics\
      \ providers, utilities, smart city planners, and emergency services organizations.\
      \ Key capabilities include support for points, lines, and polygons, with functions\
      \ like ST_DistanceSpheroid, ST_Within, ST_Intersects, and ST_Buffer, all compatible\
      \ with openCypher query language.</p> \n<p>Spatial data support is available\
      \ at no additional charge in all regions where Amazon Neptune Database is currently\
      \ offered. To learn more about spatial data capabilities and how they can enhance\
      \ your location-aware applications, check out the <a href=\"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html\"\
      \ target=\"_blank\">Neptune Database documentation</a>.</p>"
