  9781678af4d86045c4c83ceccd597b5b:
    id: 9781678af4d86045c4c83ceccd597b5b
    title: Amazon WorkSpaces launches Graphics G6, Gr6, and G6f bundles
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-workspaces-personal-core-graphics-g6-gr6-g6f-bundles/
    published: '2026-02-05'
    summary: "<p>Today, Amazon WorkSpaces announces the availability of 12 new Graphics\
      \ G6, Gr6, and G6f WorkSpaces bundles built on the Amazon <a href=\"https://aws.amazon.com/ec2/instance-types/g6/?refid=2216ee97-52d4-4886-aa83-21d21672d6ee\"\
      >EC2 G6</a> family. These bundles expand customers’ options for running graphics-intensive\
      \ and GPU-accelerated workloads, and are available on both Amazon WorkSpaces\
      \ Personal and Amazon WorkSpaces Core.</p> \n<p>The new bundles are designed\
      \ to support a wide range of performance, memory, and cost requirements: G6\
      \ bundles include five sizes with 1:4 vCPU-to-memory configurations, suitable\
      \ for graphic design, CAD/CAM, and ML model training workloads. Gr6 bundles\
      \ include two sizes with memory-optimized 1:8 vCPU-to-memory configurations,\
      \ designed for higher-memory workloads such as 3D rendering, seismic visualization,\
      \ and GIS processing. G6f bundles include five sizes and offer fractional GPU\
      \ options (1/8, 1/4, and 1/2 GPU), enabling cost-effective access to GPU acceleration\
      \ for workloads that do not require a full GPU. All Graphics G6, Gr6, and G6f\
      \ WorkSpaces support Windows Server 2022 and allow customers to bring their\
      \ own Windows desktop licenses for Windows 11.</p> \n<p>These bundles are available\
      \ in 13 AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central),\
      \ Europe (Paris, Frankfurt, London), Asia Pacific (Tokyo, Mumbai, Sydney, Seoul),\
      \ South America (São Paulo), and AWS GovCloud (US-West and US-East).</p> \n\
      <p>To get started, create a Graphics G6, Gr6, or G6f WorkSpace using the Amazon\
      \ WorkSpaces console. For pay-as-you-go pricing details, see the <a href=\"\
      https://aws.amazon.com/workspaces/desktop-as-a-service/pricing/\">Amazon WorkSpaces\
      \ Pricing Page</a> and the <a href=\"https://aws.amazon.com/workspaces/vdi-partners/pricing/\"\
      >Amazon WorkSpaces Core Pricing Page</a>.</p>"
  759cd44c4aab1317259f5918dc29150d:
    id: 759cd44c4aab1317259f5918dc29150d
    title: Amazon EC2 I7ie instances now available in AWS Canada (Central)
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-i7ie-instances-available-aws-canada/
    published: '2026-02-05'
    summary: <p>AWS is announcing Amazon EC2 I7ie instances are now available in AWS
      Canada (Central) regions. Designed for large storage I/O intensive workloads,
      I7ie instances are powered by 5th Gen Intel Xeon Processors with an all-core
      turbo frequency of 3.2 GHz, offering up to 40% better compute performance and
      20% better price performance over existing I3en instances. I7ie instances offer
      up to 120TB local NVMe storage density (highest in the cloud) for storage optimized
      instances and offer up to twice as many vCPUs and memory compared to prior generation
      instances. Powered by 3rd generation AWS Nitro SSDs, I7ie instances deliver
      up to 65% better real-time storage performance, up to 50% lower storage I/O
      latency, and 65% lower storage I/O latency variability compared to I3en instances.<br
      /> <br /> I7ie are high density storage optimized instances, ideal for workloads
      requiring fast local storage with high random read/write performance at very
      low latency consistency to access large data sets. These instances are available
      in 9 different virtual sizes and deliver up to 100Gbps of network bandwidth
      and 60Gbps of bandwidth for Amazon Elastic Block Store (EBS).<br /> <br /> To
      learn more, visit the I7ie instances<a href="https://aws.amazon.com/ec2/instance-types/i7ie/">
      page</a>.</p>
  021f698bc3ea85131ca5b53a60d72619:
    id: 021f698bc3ea85131ca5b53a60d72619
    title: Amazon EC2 capacity blocks for ML can be shared across multiple accounts
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-capacity-blocks-multiple-accounts
    published: '2026-02-05'
    summary: "<p>Amazon Web Services (AWS) is announcing the general availability\
      \ of cross-account sharing for Amazon EC2 Capacity Blocks for ML. This capability\
      \ allows organizations to share reserved GPU capacity across AWS accounts using\
      \ AWS Resource Access Manager (RAM), helping optimize utilization and reduce\
      \ costs.</p> \n<p>Organizations can now purchase Capacity Blocks and provision\
      \ them across multiple accounts, allowing different workloads to access a pool\
      \ of reserved capacity at no additional cost. This capability helps teams coordinate\
      \ ML infrastructure investments and keeps reserved GPU capacity in continuous\
      \ use across different workloads.</p> \n<p>This feature is available for all\
      \ Instance Capacity Blocks in AWS Regions where EC2 Capacity Blocks for ML are\
      \ offered. For a complete list of supported regions, refer to <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-blocks.html#capacity-blocks-prerequisites\"\
      >Capacity Blocks Supported Regions documentation</a>.&nbsp;</p> \n<p>To get\
      \ started, create a Resource Share through AWS Resource Access Manager, add\
      \ your Capacity Blocks for ML resources, and specify the target accounts you\
      \ wish to share with. For more details, please refer to the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/capacity-blocks-share.html\"\
      >Capacity Block Guide</a></p>"
  f2b41b2a3ebf66cf4cc0c9ad115a79cf:
    id: f2b41b2a3ebf66cf4cc0c9ad115a79cf
    title: AWS Glue launches native REST API connector for universal data integration
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-glue-rest-api-connector
    published: '2026-02-05'
    summary: <p>AWS Glue now offers a native REST-based connector that enables customers
      to easily read data from any source with a REST-based API. Customers can now
      create custom connectors to any REST-enabled data source and seamlessly integrate
      that data into their AWS Glue ETL (Extract, Transform, and Load) jobs. This
      capability extends AWS Glue's existing connectivity to 100+ non-AWS data sources
      through 60+ native connectors and additional options on AWS Marketplace.<br
      /> <br /> Previously, connecting to proprietary systems or emerging platforms
      required customers to build custom connectors by providing specialized JARs
      with the necessary libraries. The new native REST API connector eliminates this
      complexity, making it easier to integrate data from any REST-enabled source.
      It reduces operational overhead by eliminating the need to install, update,
      or manage custom libraries, freeing teams from maintenance burdens. The connector
      also enhances flexibility, enabling organizations to quickly adapt to new data
      sources as business needs evolve. It also streamlines ETL management by allowing
      data engineers to focus on data transformation and business logic rather than
      spending time building and maintaining connector infrastructure.<br /> <br />
      The AWS Glue REST API connector is available in all AWS commercial regions where
      AWS Glue is available.<br /> <br /> You can start using the AWS Glue REST API
      connector using AWS Glue APIs, AWS Command Line Interface (CLI), or AWS Software
      Development Kit (SDK). To get started, see AWS Glue <a href="https://docs.aws.amazon.com/glue/latest/dg/glue-connections.html">documentation</a>.</p>
