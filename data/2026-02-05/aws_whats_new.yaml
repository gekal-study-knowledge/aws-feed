  b41b6470b0b4cd196822b60ca66d8ac2:
    id: b41b6470b0b4cd196822b60ca66d8ac2
    title: AWS Builder ID now supports Sign in with Apple
    link: https://aws.amazon.comabout-aws/whats-new/2026/02/aws-builder-id-sign-in-apple
    published: '2026-02-05'
    summary: "<div class=\"WACEditing EditMode EditingSurfaceBody FireFox WACViewPanel_DisableLegacyKeyCodeAndCharCode\
      \ usehover\" id=\"WACViewPanel_ClipboardElement\" style=\"overflow: hidden;\
      \ direction: ltr;\">\n <div class=\"OutlineElement Ltr SCXW27133560 BCX2\" style=\"\
      direction: ltr;\">\n  <p>AWS Builder ID, your&nbsp;profile for accessing AWS\
      \ applications including AWS Builder Center, AWS Training and Certification,\
      \ AWS&nbsp;re:Post, AWS Startups, and Kiro, now supports Sign in with Apple\
      \ as a social login&nbsp;provider. This expansion of&nbsp;sign-in&nbsp;options&nbsp;builds\
      \ on&nbsp;the existing Sign in with Google capability, providing Apple&nbsp;users\
      \ with a streamlined way to access AWS resources without managing separate credentials&nbsp;on&nbsp;AWS.</p>\
      \ \n  <p>With Sign in&nbsp;with Apple integration, developers and&nbsp;builders\
      \ can now enjoy&nbsp;access to their AWS Builder ID profile using their Apple\
      \ Account credentials. This enhancement&nbsp;eliminates&nbsp;password management\
      \ complexity, reduces forgotten password issues, and provides a frictionless\
      \ experience for both new user registration and returning user sign-ins. Whether&nbsp;you're&nbsp;accessing\
      \ development resources in AWS Builder Center, enrolling in certification programs,&nbsp;participating&nbsp;in\
      \ community discussions on AWS&nbsp;re:Post, exploring startup resources, or&nbsp;using&nbsp;Kiro&nbsp;to\
      \ code your next app, your Apple Account now serves as a secure gateway to your&nbsp;builder&nbsp;AWS\
      \ journey.&nbsp;</p> \n  <p>To learn more about AWS Builder ID and&nbsp;get&nbsp;started\
      \ with Sign in with Apple, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/signin/latest/userguide/sign-in-builder-id.html\"\
      >AWS Builder ID documentation</a>.</p> \n </div> \n</div>"
  e5fadea340b957bfaf35ca3a1bb16bec:
    id: e5fadea340b957bfaf35ca3a1bb16bec
    title: Amazon EC2 High Memory U7i-6TB instances now available in AWS GovCloud
      (US-West)
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-u7i-6tb-instances-available/
    published: '2026-02-05'
    summary: <p>Amazon EC2 High Memory U7i instances with 6TB of memory (u7i-6tb.112xlarge)
      are now available in AWS GovCloud (US-West). U7i instances are part of AWS 7th
      generation and are powered by custom fourth generation Intel Xeon Scalable Processors
      (Sapphire Rapids). U7i-6tb instances offer 6TiB of DDR5 memory, enabling customers
      to scale transaction processing throughput in a fast-growing data environment.<br
      /> <br /> U7i-6tb instances offer 448 vCPUs, support up to 100Gbps Elastic Block
      Storage (EBS) for faster data loading and backups, deliver up to 100Gbps of
      network bandwidth, and support ENA Express. U7i instances are ideal for customers
      using mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.<br
      /> <br /> To learn more about U7i instances, visit the <a href="https://aws.amazon.com/ec2/instance-types/u7i/">High
      Memory instances page</a>.</p>
  0b5b046a7c566f5ad2b8f93687a9250f:
    id: 0b5b046a7c566f5ad2b8f93687a9250f
    title: Claude Opus 4.6 now available in Amazon Bedrock
    link: https://aws.amazon.com/about-aws/whats-new/2026/2/claude-opus-4.6-available-amazon-bedrock/
    published: '2026-02-05'
    summary: <p>Starting today, Amazon Bedrock supports Claude Opus 4.6. According
      to Anthropic, Opus 4.6 is their most intelligent model and the world's best
      model for coding, enterprise agents, and professional work. Claude Opus 4.6
      brings advanced capabilities to Amazon Bedrock customers, including industry-leading
      performance for agentic tasks, complex coding projects, and enterprise-grade
      workflows that require deep reasoning and reliability.<br /> <br /> Claude Opus
      4.6 excels across use cases that require sophisticated reasoning and multi-step
      orchestration. For agentic workflows, it manages complex tasks across dozens
      of tools with industry-leading reliability, proactively spinning up subagents
      and working with less oversight. Developers can leverage Opus 4.6’s coding capabilities
      for long-horizon projects, complex implementations, and large-scale codebases—handling
      the full lifecycle from requirements gathering to implementation and maintenance.
      Enterprise teams can use the model to power end-to-end workflows with professional
      polish, including financial analysis that surfaces insights requiring days of
      manual compilation, cybersecurity applications that catch subtle attack patterns,
      and computer use workflows that move data between applications. The model supports
      both 200K and 1M context tokens (preview), enabling processing of extensive
      documents and codebases.<br /> <br /> Claude Opus 4.6 is now available in Amazon
      Bedrock. For the full list of available regions, refer to the <a href="https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html">documentation</a>.
      To learn more and get started with the model in Amazon Bedrock, read the <a
      href="https://www.aboutamazon.com/news/aws/anthropic-claude-4-opus-sonnet-amazon-bedrock">About
      Amazon blog</a> and visit the <a href="https://console.aws.amazon.com/bedrock/">Amazon
      Bedrock console</a>.</p>
  4de76dc1503ec2c3ce07d3b2ac7d580a:
    id: 4de76dc1503ec2c3ce07d3b2ac7d580a
    title: Amazon EC2 G6e instances now available in Dubai region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-g6e-instances-dubai-region/
    published: '2026-02-05'
    summary: "<p>Starting today, the Amazon EC2 G6e instances powered by NVIDIA L40S\
      \ Tensor Core GPUs is now available in Middle East (UAE) Region. G6e instances\
      \ can be used for a wide range of machine learning and spatial computing use\
      \ cases.</p> \n<p>Customers can use G6e instances to deploy large language models\
      \ (LLMs) and diffusion models for generating images, video, and audio. Additionally,\
      \ the G6e instances will unlock customers’ ability to create larger, more immersive\
      \ 3D simulations and digital twins for spatial computing workloads. G6e instances\
      \ feature up to 8 NVIDIA L40S Tensor Core GPUs with 48 GB of memory per GPU\
      \ and third generation AMD EPYC processors. They also support up to 192 vCPUs,\
      \ up to 400 Gbps of network bandwidth, up to 1.536 TB of system memory, and\
      \ up to 7.6 TB of local NVMe SSD storage.&nbsp;<br /> <br /> Amazon EC2 G6e\
      \ instances are available today in the AWS US East (N. Virginia, Ohio), US West\
      \ (Oregon), Asia Pacific (Tokyo, Seoul), Middle East (UAE) and Europe (Frankfurt,\
      \ Spain, Stockholm) Regions. Customers can purchase G6e instances as On-Demand\
      \ Instances, Reserved Instances, Spot Instances, or as part of Savings Plans.<br\
      \ /> <br /> To get started, visit the <a href=\"https://console.aws.amazon.com/\"\
      >AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command\
      \ Line Interface</a> (CLI), and AWS SDKs. To learn more, visit the <a href=\"\
      https://aws.amazon.com/ec2/instance-types/g6e/\">G6e instance page</a>.</p>"
