  この日は AI/ML、コンタクトセンター、分析、セキュリティにわたる幅広いアップデートが報じられました。Amazon SageMaker HyperPod はクラスター作成前にサービスクォータを自動検証する機能をコンソールに追加し、インスタンス種別やEBSボリューム、VPC関連クォータをチェックして作成失敗を防ぎます。Amazon Lex は Default / High / Maximum の 3 段階から選べる音声区間検出 (VAD) の感度設定を導入しました。Amazon Connect はエージェントの画面録画ステータスを EventBridge 経由で CloudWatch にてほぼリアルタイムに追跡できるようになりました。Amazon Redshift Serverless は Asia Pacific (New Zealand) リージョンで一般提供を開始し、Amazon Inspector は Java Gradle のスキャンに対応し MySQL や PHP など対象エコシステムを拡大しました。ブログでは Salesforce が 1,000 以上の EKS クラスターで Cluster Autoscaler から Karpenter へ移行した事例や、AWS Lambda for .NET 10 などを扱う週刊まとめが公開されました。
