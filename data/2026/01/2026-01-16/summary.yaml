  この日はAWS Outposts関連の発表が中心となった。Outpostsラックが複数のローカルゲートウェイ(LGW)ルーティングドメインをサポートし、1つのOutpostあたり最大10個の分離されたルーティングドメインを作成してネットワークセグメンテーションを簡素化できるようになった。また第2世代Outpostsラックが南米(サンパウロ)と欧州(ストックホルム)リージョンで利用可能になった。ストレージ面ではAmazon S3 Storage LensがAWS GovCloud(US)リージョンで提供開始。Amazon MWAAがアジアパシフィック(タイ)リージョンに、EC2 High Memory U7iインスタンスが追加リージョンに拡大した。生成AI領域ではAmazon BedrockのReserved TierがClaude Opus 4.5とHaiku 4.5向けに提供された。セキュリティブログではAWS上のデータガバナンス実装に関する2部構成の記事が公開された。
