  d9c10ae63d8af0f48702523e06130a17:
    id: d9c10ae63d8af0f48702523e06130a17
    title: Announcing larger managed database bundles for Amazon Lightsail
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/larger-managed-database-bundles-lightsail/
    published: "2026-01-09"
    fetched: "2026-01-09"
    summary:
      <p>Amazon Lightsail now offers two larger database bundles with up to
      8 vCPUs, 32GB memory, and 960GB SSD storage. The new database bundles are available
      in both standard and high-availability plans. You can create MySQL and PostgreSQL
      databases using the new Lightsail managed database bundles.<br /> <br /> The
      new larger database bundles enable you to scale your database workloads and
      run more data-intensive applications in Lightsail. These higher-performance
      database bundles are ideal for production workloads that require increased storage
      capacity and processing power to handle growing datasets and concurrent connections.
      Using these new bundles, you can run e-commerce platforms, content management
      systems, business intelligence applications, SaaS products, and more.<br />
      <br /> These new bundles are now available in all <a href="https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html">AWS
      Regions where Amazon Lightsail is available</a>. For more information on pricing,
      or to get started with your free trial, <a href="https://aws.amazon.com/lightsail/pricing/">click
      here.</a></p>
  96615b15b84be01568636a83498120c9:
    id: 96615b15b84be01568636a83498120c9
    title: Amazon EMR Serverless adds support for job run level cost allocation
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-emr-serverless-adds-job-run-level
    published: "2026-01-09"
    fetched: "2026-01-09"
    summary:
      <p><a href="https://aws.amazon.com/emr/serverless/">Amazon EMR Serverless
      </a>now supports job run-level cost allocation that provides better visibility
      into charges for individual job runs by allowing you to configure granular billing
      attribution at the individual job run level. You can get granular cost visibility
      by filtering and tracking costs in AWS Cost Explorer and Cost and Usage Reports
      by specific job run IDs and cost allocation tags associated with job runs.<br
      /> <br /> Amazon EMR Serverless is a deployment option in Amazon EMR that makes
      it simple for data engineers and data scientists to run open-source big data
      analytics frameworks without configuring, managing, and scaling clusters or
      servers. Previously, you could assign cost allocation tags to EMR Serverless
      applications, with cost attribution limited to the application level. With job
      run-level cost allocation, now you can assign cost allocation tags to each job
      run, enabling fine-grained billing attribution at the individual job run level.
      Cost allocation tags at the job run level also allow you to track costs by domains
      within a single application. For example, a single application could support
      jobs for finance and marketing domains, allowing you to track costs separately
      for each domain. Tracking costs for individual job runs makes it easier to conduct
      benchmarks that assess the costs of each job run as well as focus cost optimization
      efforts more precisely, allowing deeper insights into resource utilization and
      spending patterns across different jobs and domains.<br /> <br /> This feature
      is available in all AWS Regions where Amazon EMR Serverless is available including&nbsp;AWS
      GovCloud (US) and China regions. To learn more, see <a href="https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/jobs-job-level-cost-allocation.html">Enabling
      Job Level Cost Allocation</a> in the Amazon EMR Serverless User Guide</p>
  5d2d0e82721b36ca3f3027d2fa80115f:
    id: 5d2d0e82721b36ca3f3027d2fa80115f
    title:
      Amazon RDS for SQL Server now supports cross-region read replica in additional
      AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-rds-sql-server-cross-region-read-replica-in-additional-aws-regions/
    published: "2026-01-09"
    fetched: "2026-01-09"
    summary:
      '<p><a href="https://aws.amazon.com/rds/sqlserver/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) for SQL Server</a> now supports setting
      up cross-region read replicas in 16 additional AWS Regions. Cross-region read
      replicas enable customers to provide a replica database for read-only applications
      closer to users in a different region, and scale out read-only workloads. Since
      a read replica can be "promoted" to a standalone production database, cross-region
      read replicas can also be used for disaster recovery in case of regional failures.
      Customers can setup up to fifteen read replicas in the same or different region
      as the primary database instance.<br /> <br /> This launch adds support for
      cross-region read replicas in RDS for SQL Server in the following AWS Regions:
      Africa (Cape Town), Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia
      Pacific (Jakarta), Asia Pacific (Malaysia), Asia Pacific (Melbourne), Asia Pacific
      (Taipei), Asia Pacific (Thailand), Canada West (Calgary), Europe (Milan), Europe
      (Spain), Europe (Zurich), Israel (Tel Aviv), Mexico (Central), Middle East (Bahrain),
      and Middle East (UAE). To get started, visit the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.ReadReplicas.html"
      target="_blank">Amazon RDS SQL Server User Guide</a>.</p>'
