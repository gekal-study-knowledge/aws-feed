  この日はデータベースと分析サービスのアップデートを中心に、セキュリティ関連の話題も報じられました。Amazon Lightsail は最大 8 vCPU、32GB メモリ、960GB SSD ストレージを備えたより大きなマネージドデータベースバンドルを 2 種類追加し、標準プランと高可用性プランの両方で MySQL / PostgreSQL を利用できるようになりました。Amazon EMR Serverless はジョブ実行単位でのコスト配分に対応し、Cost Explorer や Cost and Usage Reports でジョブ実行 ID 単位の課金追跡が可能になりました。Amazon RDS for SQL Server はクロスリージョンリードレプリカを 16 の追加リージョンでサポートします。セキュリティ面では、AWS が Sovereign Cloud Infrastructure Services (EU) の ISG レポートで 3 年連続 Leader に選出されたことが発表されたほか、Kiro IDE のコマンドインジェクション脆弱性 (CVE-2026-0830) に関するセキュリティ速報が公開されました。
