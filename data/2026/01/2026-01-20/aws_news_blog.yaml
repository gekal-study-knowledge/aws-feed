    title:
      Announcing Amazon EC2 G7e instances accelerated by NVIDIA RTX PRO 6000
      Blackwell Server Edition GPUs
    link: https://aws.amazon.com/blogs/aws/announcing-amazon-ec2-g7e-instances-accelerated-by-nvidia-rtx-pro-6000-blackwell-server-edition-gpus/
    published: "2026-01-20"
    fetched: "2026-01-20"
    summary:
      AWS introduces Amazon EC2 G7e instances accelerated by the NVIDIA RTX
      PRO 6000 Blackwell Server Edition GPUs with up to 2.3 times inference performance.
      G7e instances deliver cost-effective performance for generative AI inference
      workloads and the highest performance for graphics workloads.
