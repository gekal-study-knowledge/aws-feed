  6103bb70b1de2b5f6d1ce36c432c0a36:
    id: 6103bb70b1de2b5f6d1ce36c432c0a36
    title: Amazon RDS Custom now supports the latest GDR updates for Microsoft SQL
      Server
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-rds-custom-gdr-updates-microsoft-sql-server
    published: '2026-01-15'
    summary: <p><a href="https://aws.amazon.com/rds/custom/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports
      the latest General Distribution Release (GDR) updates for Microsoft SQL Server.
      This release includes support for SQL Server 2019 CU32+GDR <a href="https://support.microsoft.com/help/5068404"
      target="_blank">KB5068404</a> (RDS version 15.00.4455.2.1.v1) and SQL Server
      2022 CU21+GDR <a href="https://support.microsoft.com/help/5068406" target="_blank">KB5068406</a>
      (RDS version 16.00.4222.2.1.v1).<br /> <br /> The GDR updates address vulnerabilities
      described in CVE-2025-59499. For additional information on the improvements
      and fixes included in these updates, see Microsoft documentation for KB5068404
      and KB5068406. We recommend that you upgrade your Amazon RDS Custom for SQL
      Server instances to apply these updates using Amazon RDS Management Console,
      or by using the AWS SDK or CLI. You can learn more about upgrading your database
      instance in the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html"
      target="_blank">Amazon RDS Custom User Guide</a>.</p>
  6b4e97ebf2ba451930fcbe89e6482f0e:
    id: 6b4e97ebf2ba451930fcbe89e6482f0e
    title: Amazon Redshift Serverless adds queue-based query resource management
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-redshift-serverless-queue-based-query-resource-management
    published: '2026-01-15'
    summary: <p>Amazon Redshift Serverless introduces queue-based query resource management.
      You can create dedicated query queues with customized monitoring rules for different
      workloads. This feature provides granular control over resource usage. Queues
      let you set metrics-based predicates and automated responses. For example, you
      can configure rules to automatically abort queries that exceed time limits or
      consume too many resources.<br /> <br /> Previously, Query Monitoring Rules
      (QMR) were applied only at the Redshift Serverless workgroup level, affecting
      all queries run in this workgroup uniformly. The new queue-based approach lets
      you create queues with distinct monitoring rules. You can assign these queues
      to specific user roles and query groups. Each queue operates independently,
      with rules affecting only the queries within that queue. The available monitoring
      metrics can be found in <a href="https://docs.aws.amazon.com/redshift/latest/dg/cm-c-wlm-query-monitoring-rules.html#cm-c-wlm-query-monitoring-metrics-serverless"
      target="_blank">Query monitoring metrics for Amazon Redshift Serverless</a>.<br
      /> <br /> This feature is available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS regions</a> that support Amazon Redshift Serverless. You
      can manage QMR with queues through the AWS Console and Redshift APIs.<br />
      <br /> For implementation details, see the <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-workgroup-query-limits.html"
      target="_blank">documentation</a> in the Amazon Redshift management guide.</p>
  f5fbd8c61c043e4e6f627dd319d666bb:
    id: f5fbd8c61c043e4e6f627dd319d666bb
    title: Amazon Connect now provides agent scheduling metrics in data lake
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-connect-scheduling-metrics/
    published: '2026-01-15'
    summary: <p>Amazon Connect now provides agent scheduling metrics in data lake,
      making it easier for you to generate reports and insights from this data. For
      example, after publishing schedules for next month, you can access interval
      level (15 minutes or 30 minutes) metrics such as forecasted headcount, scheduled
      headcount, and projected service level in Connect analytics data lake. You can
      view aggregated metrics for an entire business unit (forecast group) or broken
      down by specific demand segments (demand groups). You can then visualize this
      data in Amazon Quick Sight or another BI tool of your choice for further analysis,
      such as identifying periods of over or under-staffing. This eliminates the need
      for manual reviews of agent schedules thus improving productivity for schedulers
      and supervisors.<br /> <br /> This feature is available in all <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region">AWS
      Regions</a> where Amazon Connect agent scheduling is available. To learn more
      about Amazon Connect agent scheduling, click <a href="https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html">here</a>.</p>
  151e00da9a8bd4c459687b407e355c3b:
    id: 151e00da9a8bd4c459687b407e355c3b
    title: Amazon RDS now supports the latest CU and GDR updates for Microsoft SQL
      Server
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-rds-cu-gdr-updates-microsoft-sql-server
    published: '2026-01-15'
    summary: <p><a href="https://aws.amazon.com/rds/sqlserver/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) for SQL Server </a>now supports the
      latest General Distribution Release (GDR) updates for Microsoft SQL Server.
      This release includes support for Microsoft SQL Server 2016 SP3+GDR <a href="https://support.microsoft.com/help/5068401"
      target="_blank">KB5068401</a> (RDS version 13.00.6475.1.v1), SQL Server 2017
      CU31+GDR <a href="https://support.microsoft.com/help/5068402" target="_blank">KB5068402</a>
      (RDS version 14.00.3515.1.v1), SQL Server 2019 CU32+GDR <a href="https://support.microsoft.com/help/5068404"
      target="_blank">KB5068404</a> (RDS version 15.00.4455.2.1.v1) and SQL Server
      2022 CU22 <a href="https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/cumulativeupdate22"
      target="_blank">KB5068450</a> (RDS version 16.00.4225.2.1.v1).<br /> <br />
      The GDR updates address vulnerabilities described in CVE-2025-59499. For additional
      information on the improvements and fixes included in these updates, see Microsoft
      documentation for KB5068401, KB5068402, KB5068404, KB5068450. We recommend that
      you upgrade your Amazon RDS for SQL Server instances to apply these updates
      using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can
      learn more about upgrading your database instance in the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html"
      target="_blank">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft
      SQL Server DB engine</a>.</p>
  b3ddf57f721ac4984cb30c501021608c:
    id: b3ddf57f721ac4984cb30c501021608c
    title: AWS Clean Rooms now supports parameters in PySpark analysis templates
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-clean-rooms-parameters-pyspark-analysis-templates/
    published: '2026-01-15'
    summary: "<p>AWS Clean Rooms announces support for parameters in PySpark analysis\
      \ templates, offering increased flexibility for organizations and their partners\
      \ to scale their privacy-enhanced data collaboration use cases. With this launch,\
      \ you can create a single <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/pyspark-analysis-templates.html\"\
      \ target=\"_blank\">PySpark analysis template</a> that allows different values\
      \ to be provided by the Clean Rooms collaborator running a job at submission\
      \ time without modifying the template code. With parameters in PySpark analysis\
      \ templates, the code author creates a PySpark template with parameters support,\
      \ and if approved to run, the job runner submits parameter values directly to\
      \ the PySpark job. For example, a measurement company running attribution analysis\
      \ for advertising campaigns can input time windows and geographic regions dynamically\
      \ to surface insights that drive campaign optimizations and media planning accelerating\
      \ time-to-insights.</p> \n<p><br /> With AWS Clean Rooms, customers can create\
      \ a secure data clean room in minutes and collaborate with any company on AWS\
      \ or Snowflake to generate unique insights about advertising campaigns, investment\
      \ decisions, and research and development. For more information about the AWS\
      \ Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\"\
      \ target=\"_blank\">AWS Regions</a> table. To learn more about collaborating\
      \ with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\"\
      \ target=\"_blank\">AWS Clean Rooms</a>.</p>"
  f12605a2adfddeaf9589db73b554e942:
    id: f12605a2adfddeaf9589db73b554e942
    title: Amazon S3 on Outposts is now available on second-generation AWS Outposts
      racks
    link: https://aws.amazon.comabout-aws/whats-new/2026/01/amazon-s3-second-generation-aws-outposts-racks
    published: '2026-01-15'
    summary: '<p>Amazon S3 on Outposts is now available on second-generation AWS Outposts
      racks for your data residency, low latency, and local data processing use cases
      on-premises. S3 on Outposts on second-generation Outposts racks offers three
      storage tiers: 196 TB, 490 TB, and 786 TB. Choose the storage tier that matches
      your workload, whether for production workloads, backups, or archival workloads.<br
      /> <br /> With S3 on Outposts, you can store, secure, retrieve, and control
      access to your data using familiar S3 APIs and features. AWS Outposts is a fully
      managed service that extends AWS infrastructure, services, and tools to virtually
      any data center, co-location space, or on-premises facility for a consistent
      hybrid experience.<br /> <br /> S3 on Outposts on second-generation Outposts
      racks is available in all AWS Regions and countries/territories where these
      <a href="https://aws.amazon.com/outposts/faqs/" target="_blank">racks are available</a>.
      To learn more, visit the <a href="https://aws.amazon.com/s3/outposts/" target="_blank">S3
      on Outposts page</a> or read our <a href="https://docs.aws.amazon.com/AmazonS3/latest/dev/S3onOutposts.html"
      target="_blank">documentation</a>.</p>'
  dccefe709df741121e789f6a30105a19:
    id: dccefe709df741121e789f6a30105a19
    title: AWS Databases are now available on v0 by Vercel
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-databases-available-vercel-v0/
    published: '2026-01-15'
    summary: '<p>Amazon Aurora PostgreSQL, Amazon Aurora DSQL, and Amazon DynamoDB
      serverless databases are now available on v0 by Vercel, an AI-powered tool that
      transforms your ideas into production-ready, full-stack web applications in
      minutes. With this launch, you can build your ideas as well as create and connect
      to AWS databases from v0 using natural language prompts.<br /> <br /> To get
      started, simply describe what you want to build in v0. The tool takes care of
      developing the frontend user interface and backend logic, storing your application
      data in the AWS database that best meets your application needs. v0 provides
      an end-to-end setup experience where you can choose and configure database resources
      under a new AWS account or link to an existing account, all without leaving
      v0 interface. New AWS accounts from Vercel include access to all three databases
      and $100 USD in credits that can be used with any of the database options for
      up to six months. You can also manage your plan, add payment information, and
      view usage details anytime by visiting the AWS settings portal from the Vercel
      dashboard. To learn more, visit <a href="http://v0.app" target="_blank">v0</a>
      or the <a href="https://vercel.com/marketplace/aws" target="_blank">AWS landing
      page</a> on the Vercel Marketplace.<br /> <br /> The serverless options for
      <a href="https://aws.amazon.com/rds/aurora/" target="_blank">Amazon Aurora PostgreSQL</a>,
      <a href="https://aws.amazon.com/rds/aurora/dsql/" target="_blank">Amazon Aurora
      DSQL</a>, and <a href="https://aws.amazon.com/dynamodb/?nc2=type_a" target="_blank">Amazon
      DynamoDB</a> do not require infrastructure management and reduce costs by scaling
      down to zero automatically when not in use. You can create a database in the
      following <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West
      (Oregon), Europe (Ireland), Europe (Frankfurt), Asia Pacific (Tokyo), and Asia
      Pacific (Mumbai).<br /> <br /> AWS Databases deliver security, reliability,
      and price performance without the operational overhead, whether you''re prototyping
      your next big idea or running production AI and data driven applications. For
      more information, visit the <a href="https://aws.amazon.com/products/databases/"
      target="_blank">AWS Databases webpage.</a></p>'
  da49894dd6271fc4f7e40ab9e48b4db1:
    id: da49894dd6271fc4f7e40ab9e48b4db1
    title: Announcing Amazon EC2 Memory optimized X8i instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-amazon-ec2-x8i-generally-available
    published: '2026-01-15'
    summary: '<p>Amazon Web Services (AWS) is announcing the general availability
      of Amazon EC2 X8i instances, next-generation memory optimized instances powered
      by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified
      and deliver the highest performance and fastest memory bandwidth among comparable
      Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x
      more memory capacity (up to 6TB), and 3.4x more memory bandwidth compared to
      previous generation X2i instances.<br /> <br /> X8i instances are designed for
      memory-intensive workloads like SAP HANA, large databases, data analytics, and
      Electronic Design Automation (EDA). Compared to X2i instances, X8i instances
      offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance,
      88% faster Memcached performance, and 46% faster AI inference performance. X8i
      instances come in 14 sizes, from large to 96xlarge, including two bare metal
      options.<br /> <br /> X8i instances are available in the following <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), and Europe
      (Frankfurt).<br /> <br /> To get started, visit the <a href="https://aws.amazon.com/console/">AWS
      Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand
      instances, and Spot instances. For more information visit <a href="https://aws.amazon.com/ec2/instance-types/x8i/">X8i
      instances page</a>.</p>'
  b7aa0fb22cc11912323f0df957bf9da9:
    id: b7aa0fb22cc11912323f0df957bf9da9
    title: AWS Lambda announces cross-account access for DynamoDB Streams
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-lambda-cross-account-access-dynamodb-streams
    published: '2026-01-15'
    summary: <p>AWS Lambda now supports cross-account access for AWS DynamoDB Streams
      event-source mappings (ESMs),<br /> enabling you to trigger Lambda functions
      in one account from DynamoDB Streams in another account.<br /> <br /> Customers
      build event-driven applications using Lambda's fully-managed DynamoDB Streams
      ESMs, which poll change events from DynamoDB tables and trigger your Lambda
      functions. Organizations implementing multi-account architectures—whether to
      centralize event processing or share events with partner teams—previously needed
      to build complex data replication solutions to share data across accounts, which
      added operational overhead . With this launch, you can now provide cross-account
      access to your DynamoDB Streams to trigger Lambda functions in another account.
      By setting a <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html">resource-based
      policy</a> on your DynomoDB stream, you can enable a Lambda function in one
      account to access DynomoDB stream in another account. This capability allows
      you to simplify your streaming applications across accounts without the overhead
      of replication solutions in each account.<br /> <br /> This feature is generally
      available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Commercial and AWS GovCloud (US) Regions</a>. You can enable cross-account Lambda
      triggers by creating resource-based policies for your DynamoDB Streams using
      the AWS Management Console, AWS CLI, AWS SDKs, AWS CloudFormation, or AWS APIs.
      To learn more, read Lambda ESM <a href="https://docs.aws.amazon.com/lambda/latest/dg/services-dynamodb-eventsourcemapping.html#services-dynamodb-eventsourcemapping-cross-account">documentation</a><a
      href="https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html#invocation-eventsourcemapping-provisioned-mode">.&nbsp;</a></p>
  190ae917a917137f1a8a0390c2bfbf11:
    id: 190ae917a917137f1a8a0390c2bfbf11
    title: Amazon EBS now supports up to four Elastic Volumes modifications in 24
      hours
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ebs-up-to-four-volume-modifications/
    published: '2026-01-15'
    summary: "<p>Amazon Elastic Block Store (EBS) now supports up to four Elastic\
      \ Volumes modifications per volume within a rolling 24-hour window. Elastic\
      \ Volumes modifications allow you to increase the size, change the type, and\
      \ adjust the performance of your EBS volumes. With this update, you can start\
      \ a new modification immediately after the previous one completes, as long as\
      \ you have initiated fewer than four modifications in the past 24 hours.</p>\
      \ \n<p>This enhancement improves your operational agility to immediately scale\
      \ storage capacity or adjust performance in response to sudden data growth or\
      \ unanticipated workload spikes. With Elastic Volumes modifications, you can\
      \ modify your volumes without detaching them or restarting your instances, allowing\
      \ your application to continue running with minimal performance impact.</p>\
      \ \n<p>This feature is available in all commercial AWS Regions, the AWS GovCloud\
      \ (US) Regions, and the China Regions. This capability is automatically enabled\
      \ without requiring changes to your existing workflows. To learn more, see&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html\"\
      >Modify an Amazon EBS volume using Elastic Volumes operations</a>&nbsp;in the\
      \ Amazon EBS User Guide.<br /> </p>"
