  5b5df9e93a7a24bf1311b7b25d8de16d:
    id: 5b5df9e93a7a24bf1311b7b25d8de16d
    title: AWS Deadline Cloud now supports machine learning training using Foundry
      Nuke CopyCat
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-deadline-cloud-machine-learning-training
    published: '2026-01-15'
    summary: <p>Today, AWS Deadline Cloud announces integration with Foundry Nuke
      CopyCat, allowing you to run machine learning training jobs for visual effects
      in the cloud. AWS Deadline Cloud is a fully managed service that simplifies
      render management for computer-generated 2D/3D graphics and visual effects for
      films, TV shows, commercials, games, and industrial design.<br /> <br /> CopyCat
      learns visual effects, such as color corrections, beauty finishes, or deblurring,
      from a set of adjusted frames and automatically applies these adjustments across
      entire sequences. Instead of cleaning up frames one by one, you can fix a handful
      of representative frames and CopyCat will automatically apply these changes
      to the rest of your footage, saving you significant amounts of valuable time.
      With this integration, you can now train models by submitting CopyCat training
      jobs directly to your Deadline Cloud render farm. This gives you the ability
      to scale and run multiple training workloads in parallel while freeing up your
      artist workstations for creative work. You can monitor and track training jobs
      alongside other render jobs through the Deadline Cloud interface for one simple
      view across an entire project.<br /> <br /> AWS Deadline Cloud with Nuke CopyCat
      integration is available in all AWS Regions where AWS Deadline Cloud is supported.
      To get started, visit our <a href="https://aws-deadline.github.io/nuke/using-submitter/copycat-submissions/">CopyCat
      integration user guide.</a></p>
last_updated: '2026-01-22T19:22:03.963492'
