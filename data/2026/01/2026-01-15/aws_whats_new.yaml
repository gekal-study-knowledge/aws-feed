  8eab1bc188a1645662f757d18ad8c4bb:
    id: 8eab1bc188a1645662f757d18ad8c4bb
    title: AWS Data Exports  adds granular operation visibility for Amazon Bedrock
      model usage
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/granular-amazon-bedrock/
    published: '2026-01-15'
    summary: <p>AWS Data Exports now enables customers to distinguish between Amazon
      Bedrock operation types in their cost reports for enhanced cost analysis and
      optimization. This granular operation information is available in Cost and Usage
      Reports (CUR), CUR 2.0, and Data Exports for FOCUS, and is particularly valuable
      for FinOps teams, cost optimization professionals, and organizations using Amazon
      Bedrock that require detailed billing analysis.<br /> <br /> Customers will
      now see specific operation types such as "InvokeModelInference" and "InvokeModelStreamingInference"
      in their cost reports, replacing generic "Usage" labels. These granular operation
      types appear in the "line_item_operation" column in Legacy CUR and CUR 2.0 reports,
      the "x_Operation" column in FOCUS reports, and AWS Cost Explorer API Operation
      dimension values. This visibility now extends to all foundation models on Amazon
      Bedrock, enabling precise tracking of usage patterns and cost optimization opportunities
      across all model providers.<br /> <br /> To learn more about AWS Billing and
      Cost Management, visit the <a href="https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-what-is.html">AWS
      Billing and Cost Management documentation</a>, and for AWS Data Exports, visit
      the <a href="https://docs.aws.amazon.com/cur/latest/userguide/what-is-data-exports.html">AWS
      Data Exports documentation</a>. To get started with Amazon Bedrock, visit the
      <a href="https://aws.amazon.com/bedrock/">Amazon Bedrock page</a> and see the
      <a href="https://docs.aws.amazon.com/bedrock/latest/userguide/models-regions.html">Amazon
      Bedrock documentation</a> for more details.</p>
