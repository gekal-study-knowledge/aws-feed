    title:
      Amazon EC2 X8i instances powered by custom Intel Xeon 6 processors are
      generally available for memory-intensive workloads
    link: https://aws.amazon.com/blogs/aws/amazon-ec2-x8i-instances-powered-by-custom-intel-xeon-6-processors-are-generally-available-for-memory-intensive-workloads/
    published: "2026-01-15"
    fetched: "2026-01-15"
    summary:
      AWS is announcing the general availability of Amazon EC2 X8i instances,
      next-generation memory optimized instances powered by custom Intel Xeon 6 processors
      available only on AWS. X8i instances are SAP-certified and deliver the highest
      performance and fastest memory bandwidth among comparable Intel processors in
      the cloud.
