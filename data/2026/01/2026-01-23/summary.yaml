  この日はセキュリティとコンプライアンス、コンピュートの更新が目立った。セキュリティ速報ではFirecracker jailerに関するCVE-2026-1386が公表され、特定条件下でホストファイルシステムの任意ファイルを上書きできる問題だが、AWSサービスはアクセス制限により影響を受けないと説明された。コンプライアンス面ではAWSが183サービスを対象とする2025年C5 Type 2認証を取得し、GSMA SAS-SM認証を4つの新リージョンに拡大、AWS Payment CryptographyのPCI PINコンプライアンスパッケージも更新された。セキュリティブログではシークレット管理の集中型・分散型アプローチも解説された。コンピュートではApple M4 Max搭載のEC2 M4 Max Macインスタンスが一般提供を開始し、M1 Ultra比で最大25%高いビルド性能を実現する。このほかEC2 Auto Scalingのグループ削除保護機能、Amazon EVSの複数NSX Edge Gateway対応、Amazon Route 53 Domainsの.aiなど10の新TLDサポート、RDS for Oracleのマルチテナント構成レプリカ対応などが発表された。
