      to cover four new Regions
    link: https://aws.amazon.com/blogs/security/aws-renews-the-gsma-sas-sm-certification-for-two-aws-regions-and-expands-to-cover-four-new-regions/
    published: "2026-01-23"
    summary:
      "Amazon Web Services (AWS) is pleased to announce the expansion of GSMA
      Security Accreditation Scheme for Subscription Management (SAS-SM) certification
      to four new AWS Regions: US West (Oregon), Europe (Frankfurt), Asia Pacific
      (Tokyo), and Asia Pacific (Singapore). Additionally, the AWS US East (Ohio)
      and Europe (Paris) Regions have been recertified. All certifications are under
