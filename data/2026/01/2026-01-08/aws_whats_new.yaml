  983d8de0a31e39c746b0a910e3c48f7a:
    id: 983d8de0a31e39c746b0a910e3c48f7a
    title:
      Amazon MQ now supports certificate based authentication with mutual TLS
      for RabbitMQ brokers
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-mq-certificate-based-authentication-mutual-tls-rabbitmq/
    published: "2026-01-08"
    summary:
      <p>Amazon MQ now supports the ability for RabbitMQ brokers to perform
      authentication (determining who can log in) using X.509 client certificates
      with mutual TLS (mTLS). The RabbitMQ auth_mechanism_ssl plugin can be configured
      on brokers running RabbitMQ version 4.2 and above on Amazon MQ by making changes
      to the associated configuration file.<br /> <br /> To start using certificate
      based authentication on Amazon MQ, simply select RabbitMQ 4.2 when creating
      a new broker using the M7g instance type through the AWS Management console,
      AWS CLI, or AWS SDKs, and then edit the associated configuration file with the
      required <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/configurable-values.html"
      target="_blank">values</a>. To learn more about the plugin, see the <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-release-notes.html"
      target="_blank">Amazon MQ release notes</a> and the Amazon MQ <a href="https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/working-with-rabbitmq.html"
      target="_blank">developer guide</a>. This plugin is available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">regions</a> where Amazon MQ RabbitMQ 4 instances are available
      today.&nbsp;</p>
  080a01fd10e0d77a348a9151181f011f:
    id: 080a01fd10e0d77a348a9151181f011f
    title:
      Amazon DocumentDB (with MongoDB compatibility) is Now Available in the
      Asia Pacific (Jakarta) Region
    link: https://aws.amazon.comabout-aws/whats-new/2026/01/amazon-documentdb-mongodb-compatibility-asia-pacific-jakarta-region
    published: "2026-01-08"
    summary:
      <p>Amazon DocumentDB (with MongoDB compatibility) is now available in
      the Asia Pacific (Jakarta) region adding to the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">list
      of available regions where you can use Amazon DocumentDB</a>.<br /> <br /> Amazon
      DocumentDB is a fully managed, native JSON database that makes it simple and
      cost-effective to operate critical document workloads at virtually any scale
      without managing infrastructure. Amazon DocumentDB is designed to give you the
      scalability and durability you need when operating mission-critical MongoDB
      workloads. Storage scales automatically up to 128TiB without any impact to your
      application. In addition, Amazon DocumentDB natively integrates with AWS Database
      Migration Service(DMS), Amazon CloudWatch, AWS CloudTrail, AWS Lambda, AWS Backup
      and more. Amazon DocumentDB supports millions of requests per second and can
      be scaled out to 15 low latency read replicas in minutes with no application
      downtime.<br /> <br /> To learn more about Amazon DocumentDB, please visit the
      Amazon DocumentDB <a href="https://aws.amazon.com/documentdb/">product page</a>&nbsp;and&nbsp;<a
      href="https://aws.amazon.com/documentdb/pricing/">pricing page</a>.<br /> <br
      /> You can create a Amazon DocumentDB cluster from the <a href="https://console.aws.amazon.com/docdb">AWS
      Management console</a>, <a href="https://awscli.amazonaws.com/v2/documentation/api/latest/reference/docdb/index.html">AWS
      Command Line Interface (CLI)</a>, or SDK.</p>
  83369c97acc264f7205f21acdd591359:
    id: 83369c97acc264f7205f21acdd591359
    title:
      Amazon EC2 R8i and R8i-flex instances are now available in additional AWS
      regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-r8i-r8i-flex-instances-additional-aws-regions
    published: "2026-01-08"
    summary:
      <p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and
      R8i-flex instances are available in the Asia Pacific (Mumbai, Hyderabad) and
      Europe (Paris) regions. These instances are powered by custom Intel Xeon 6 processors,
      available only on AWS, delivering the highest performance and fastest memory
      bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex
      instances offer up to 15% better price-performance, and 2.5x more memory bandwidth
      compared to previous generation Intel-based instances. They deliver 20% higher
      performance than R7i instances, with even higher gains for specific workloads.
      They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX
      web applications, and up to 40% faster for AI deep learning recommendation models
      compared to R7i.<br /> <br /> R8i-flex, our first memory-optimized Flex instances,
      are the easiest way to get price performance benefits for a majority of memory-intensive
      workloads. They offer the most common sizes, from large to 16xlarge, and are
      a great first choice for applications that don't fully utilize all compute resources.<br
      /> <br /> R8i instances are a great choice for all memory-intensive workloads,
      especially for workloads that need the largest instance sizes or continuous
      high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and
      the new 96xlarge size for the largest applications. <a href="https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html"
      target="_blank">R8i instances are SAP-certified </a>and deliver 142,100 aSAPS,
      delivering exceptional performance for mission-critical SAP workloads.<br />
      <br /> To get started, sign in to the <a href="https://aws.amazon.com/console/"
      target="_blank">AWS Management Console</a>. For more information about the <a
      href="https://aws.amazon.com/ec2/instance-types/r8i" target="_blank">R8i and
      R8i-flex </a>instances visit the AWS News <a href="https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/"
      target="_parent">blog</a>.</p>
  af90d65ea1fd140b7002d77a9bced1c6:
    id: af90d65ea1fd140b7002d77a9bced1c6
    title: Amazon Quick adds third-party AI agents and expands built-in actions library
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/3p-agent-in-quick/
    published: "2026-01-08"
    summary:
      <p>Amazon Quick is expanding its third-party integrations by adding AI
      agents and growing its built-in actions library. Quick is Amazon's new AI-powered
      workspace and agentic teammate that helps organizations get answers from their
      business data and move quickly from insights to action. As organizations navigate
      newly adopted AI agents and work with existing enterprise tools for CRM, support,
      collaboration, and more, users face fragmented experiences. Users are forced
      to switch between different interfaces, repeat context, and manually stitch
      together outputs. Quick enables users to work with third-party agents and enterprise
      tools from a single interface, eliminating the wasted time and cognitive load
      of constantly switching between applications.<br /> <br /> With Quick, business
      users can now invoke specialized agents from Box, Canva, and PagerDuty to accomplish
      chat and automation tasks. For example, you can pull incident insights from
      PagerDuty, generate a presentation in Canva, and query documents stored in Box
      - all directly from Quick. Additionally, Quick has expanded its built-in actions
      to include integrations with GitHub, Notion, Canva, Box, Linear, Hugging Face,
      Monday.com, HubSpot, Intercom, and more. This enables Quick users to accomplish
      tasks like creating GitHub issues, summarizing meeting notes in Notion, managing
      their CRM, and more. Beyond our new built-in integrations, customers can continue
      to leverage custom Model Context Protocol (MCP) and OpenAPI connectors to connect
      Quick to thousands of additional applications.<br /> <br /> These features are
      now available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> where Amazon Quick is available.&nbsp;To learn more, visit the&nbsp;<a
      href="https://docs.aws.amazon.com/quicksuite/latest/userguide/supported-integrations.html">Amazon
      Quick Supported Integrations Guide</a> and <a href="https://docs.aws.amazon.com/quicksuite/latest/userguide/integration-guides.html">Integration
      Specific Guide</a>.</p>
  862b60ffd51c26c37018886f572f5dd6:
    id: 862b60ffd51c26c37018886f572f5dd6
    title: Amazon EC2 M8i instances are now available in additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-m8i-instances-additional-regions/
    published: "2026-01-08"
    summary:
      <p>Starting today, Amazon EC2 M8i instances are now available in Europe
      (Frankfurt) and Asia Pacific (Malaysia) Regions. These instances are powered
      by custom Intel Xeon 6 processors, available only on AWS, delivering the highest
      performance and fastest memory bandwidth among comparable Intel processors in
      the cloud. The M8i offer up to 15% better price-performance, and 2.5x more memory
      bandwidth compared to previous generation Intel-based instances. They deliver
      up to 20% better performance than M7i instances, with even higher gains for
      specific workloads. The M8i instances are up to 30% faster for PostgreSQL databases,
      up to 60% faster for NGINX web applications, and up to 40% faster for AI deep
      learning recommendation models compared to M7i instances.<br /> <br /> M8i instances
      are a great choice for all general purpose workloads, especially for workloads
      that need the largest instance sizes or continuous high CPU usage. The SAP-certified
      M8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge
      size for the largest applications.<br /> <br /> To get started, sign in to the
      <a href="https://aws.amazon.com/console/" target="_blank">AWS Management Console</a>.
      For more information about the new instances, visit the<a href="https://aws.amazon.com/ec2/instance-types/m8i/"
      target="_blank"> M8i instance page</a> or visit the <a href="https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/"
      target="_blank">AWS News</a> blog.</p>
  4d4b3fa9839a3038dd3cdd5e1ab0f1b5:
    id: 4d4b3fa9839a3038dd3cdd5e1ab0f1b5
    title: AWS Lambda adds support for .NET 10
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-lambda-dot-net-10/
    published: "2026-01-08"
    summary:
      <p>AWS Lambda now supports creating serverless applications using .NET
      10. Developers can use .NET 10 as both a managed runtime and a container base
      image, and AWS will automatically apply updates to the managed runtime and base
      image as they become available.<br /> <br /> .NET 10 is the latest long-term
      support release of .NET and is expected to be supported for security and bug
      fixes until November 2028. This release provides Lambda developers with access
      to the latest .NET features, including file-based apps. It also includes support
      for <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html"
      target="_blank">Lambda Managed Instances</a>, enabling you to run Lambda functions
      on Amazon EC2 instances while maintaining serverless operational simplicity,
      providing cost efficiency and specialized compute options. <a href="https://docs.aws.amazon.com/powertools/dotnet/"
      target="_blank">Powertools for AWS Lambda (.NET)</a>, a developer toolkit to
      implement serverless best practices and increase developer velocity, also supports
      .NET 10. You can use the full range of AWS deployment tools, including the Lambda
      console, AWS CLI, AWS Serverless Application Model (AWS SAM), AWS CDK, and AWS
      CloudFormation to deploy and manage serverless applications written in .NET
      10.<br /> <br /> The .NET 10 runtime is available in all Regions, including
      the AWS GovCloud (US) Regions and China Regions.<br /> <br /> For more information,
      including guidance on upgrading existing Lambda functions, see our <a href="https://aws.amazon.com/blogs/compute/net-10-runtime-now-available-in-aws-lambda/"
      target="_blank">blog post</a>. For more information about AWS Lambda, visit
      our <a href="https://aws.amazon.com/lambda/" target="_blank">product page</a>.</p>
