  b0d1f706971ca186206c614ff083393d:
    id: b0d1f706971ca186206c614ff083393d
    title: Amazon MSK Connect is now available in three additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-msk-connect-additional-aws-regions
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      '<p>Amazon MSK Connect is now available in three additional AWS Regions:
      Asia Pacific (New Zealand), AWS GovCloud (US-East), and AWS GovCloud (US-West).<br
      /> <br /> MSK Connect enables you to run fully managed Kafka Connect clusters
      with Amazon Managed Streaming for Apache Kafka (Amazon MSK). With a few clicks,
      MSK Connect allows you to easily deploy, monitor, and scale connectors that
      move data in and out of Apache Kafka and Amazon MSK clusters from external systems
      such as databases, file systems, and search indices. MSK Connect eliminates
      the need to provision and maintain cluster infrastructure. Connectors scale
      automatically in response to increases in usage and you pay only for the resources
      you use. With full compatibility with Kafka Connect, it is easy to migrate workloads
      without code changes. MSK Connect will support both Amazon MSK-managed and self-managed
      Apache Kafka clusters.<br /> <br /> You can get started with MSK Connect from
      the Amazon MSK console or the Amazon CLI. With this launch, MSK Connect is now
      available in thirty eight AWS Regions. To get started visit, the MSK Connect
      <a href="https://aws.amazon.com/msk/features/msk-connect/" target="_blank">product
      page</a>, <a href="https://aws.amazon.com/msk/pricing/" target="_blank">pricing
      page</a>, and the <a href="https://docs.aws.amazon.com/msk/latest/developerguide/msk-connect.html"
      target="_blank">Amazon MSK Developer Guide</a>.</p>'
  a776a5af518f8bc05b01566a92268653:
    id: a776a5af518f8bc05b01566a92268653
    title:
      Amazon Neptune Database now supports R7g and R8g instances in 5 additional
      regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-neptune-database-r7g-r8g-additional-regions
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      <p><a href="https://aws.amazon.com/neptune/">Amazon Neptune Database</a>
      now supports Graviton3-based R7g and Graviton4-based R8g instances for Amazon
      Neptune engine versions 1.4.5 or above, in Asia Pacific (Hong Kong), Asia Pacific
      (Osaka), Asia Pacific (Singapore), Canada (Central) and US West (N. California).
      R7g and R8g instances are priced -16% vs R6g.<br /> <br /> Graviton3-based R7g
      are the first AWS database instances to feature the latest DDR5 memory, enabling
      high-speed access to data in memory. R7g database instances offer up to 30Gbps
      enhanced networking bandwidth and up to 20 Gbps of bandwidth to the Amazon Elastic
      Block Store (Amazon EBS). Graviton4-based R8g instances offer larger instance
      sizes, up to 48xlarge and features an 8:1 ratio of memory to vCPU, and the latest
      DDR5 memory.&nbsp;AWS Graviton4 processors are up to 40% faster for databases
      than AWS Graviton3 processors.<br /> <br /> You can launch R7g and R8g instances
      for Neptune using the <a href="https://console.aws.amazon.com/neptune/">AWS
      Management Console</a> or using the <a href="https://awscli.amazonaws.com/v2/documentation/api/latest/reference/neptune/index.html">AWS
      CLI</a>. Upgrading a Neptune cluster to R7g or R8g instances requires a simple
      instance type modification for Neptune engine versions 1.4.5 or higher. For
      more information on pricing and regional availability, refer to the <a href="https://aws.amazon.com/neptune/pricing/">Amazon
      Neptune pricing page</a>.</p>
  f1b562048ee4f97ec65dc4eff3e4eade:
    id: f1b562048ee4f97ec65dc4eff3e4eade
    title:
      Amazon EC2 X8aedz instances are now available in Asia Pacific (Mumbai,
      Seoul) regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-x8aedz-instances-asia-pacific-mumbai-seoul-regions
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      <p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8aedz instances
      are available in Asia Pacific (Mumbai) and Asia Pacific (Seoul) regions. These
      instances are powered by 5th Gen AMD EPYC processors (formerly code named Turin).
      These instances offer the highest maximum CPU frequency, 5GHz in the cloud.<br
      /> <br /> X8aedz instances are built using the latest sixth generation <a href="https://aws.amazon.com/ec2/nitro/">AWS
      Nitro Cards</a> and are ideal for electronic design automation (EDA) workloads
      such as physical layout and physical verification jobs, and relational databases
      that benefit from high single-threaded processor performance and a large memory
      footprint. The combination of 5 GHz processors and local NVMe storage enables
      faster processing of memory-intensive backend EDA workloads such as floor planning,
      logic placement, clock tree synthesis (CTS), routing, and power/signal integrity
      analysis.<br /> <br /> X8aedz instances feature a 32:1 ratio of memory to vCPU
      and are available in 8 sizes ranging from 2 to 96 vCPUs with 64 to 3,072 GiB
      of memory, including two bare metal variants, and up to 8 TB of local NVMe SSD
      storage.<br /> <br /> Customers can purchase X8aedz instances via Savings Plans,
      On-Demand instances, and Spot instances. To get started, sign in to the AWS
      Management Console. For more information visit the Amazon EC2 <a href="https://aws.amazon.com/ec2/instance-types/x8aedz">X8aedz
      instance page</a>.</p>
  41be9216f12f93abcd296d79ae981ddd:
    id: 41be9216f12f93abcd296d79ae981ddd
    title: Amazon Connect Cases now supports AWS CloudFormation
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-connect-cases-aws-cloudformation/
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      '<p>Amazon Connect Cases now supports AWS CloudFormation, enabling you
      to model, provision, and manage case resources as infrastructure as code. With
      this launch, administrators can create CloudFormation templates to programmatically
      deploy and update their Cases configuration—such as templates, fields, and layouts—across
      Amazon Connect instances, reducing manual setup time and minimizing configuration
      errors.<br /> <br /> Amazon Connect Cases is available in the following AWS
      Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt),
      Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific
      (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get
      started, visit the Amazon Connect Cases <a href="https://aws.amazon.com/connect/cases/">webpage</a>
      and <a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/AWS_Cases.html">documentation</a>.</p>'
  ac7955f41a5f99efc3546fa01f0fc049:
    id: ac7955f41a5f99efc3546fa01f0fc049
    title: Amazon Lex launches improved speech recognition models for English
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-lex-improved-speech-recognition-models-english
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      <p>Amazon Lex now offers a neural automatic speech recognition (ASR)
      model for English that delivers improved recognition accuracy for your voice
      bots. Trained on data from multiple English locales, the model excels at recognizing
      conversational speech patterns across diverse speaking styles, including non-native
      English speakers and regional accents. This reduces the need for end-customers
      to repeat themselves and improves self-service success rates. To enable this
      feature, select "Neural" as the speech recognition option in your bot's locale
      settings.<br /> <br /> This feature is available in all AWS commercial regions
      where Amazon Connect and Lex operate. To learn more, visit the <a href="https://docs.aws.amazon.com/lexv2/latest/dg/customizing-speech-model-preferences.html"
      target="_blank">Amazon Lex documentation</a> or explore the Amazon Connect <a
      href="https://aws.amazon.com/connect/self-service/" target="_blank">website</a>
      to learn how Amazon Connect and Amazon Lex deliver seamless end-customer self-service
      experiences.&nbsp;</p>
  9fb98ada9b1ff89c393365f6d336024e:
    id: 9fb98ada9b1ff89c393365f6d336024e
    title:
      Amazon RDS for PostgreSQL announces Extended Support minor  12.22-rds.20251114
      and 11.22-rds.20251114
    link: https://aws.amazon.com/about-aws/whats-new/2026/1/amazon-rds-for-postgresql-announces-extended-support-minor-12-22-rds-20251114-and-11-22-rds-20251114
    published: "2026-01-13"
    fetched: "2026-01-13"
    summary:
      <p>Amazon Relational Database Service (RDS) for PostgreSQL announces
      Amazon RDS Extended Support minor version &nbsp;12.22-rds.20251114 and 11.22-rds.20251114.
      We recommend that you upgrade to this version to fix known security vulnerabilities
      and bugs in prior versions of PostgreSQL.<br /> <br /> Amazon RDS Extended Support
      provides you more time, up to three years, to upgrade to a new major version
      to help you meet your business requirements. During Extended Support, Amazon
      RDS will provide critical security and bug fixes for your PostgreSQL databases
      after the community ends support for a major version. You can run your PostgreSQL
      databases on Amazon RDS with Extended Support for up to three years beyond a
      major version’s end of standard support date. Learn more about Extended Support
      in the <a href="https://docs.amazonaws.cn/en_us/AmazonRDS/latest/UserGuide/Welcome.html"
      target="_blank">Amazon RDS User Guide</a>.<br /> <br /> You can leverage automatic
      minor version upgrades to automatically upgrade your databases to more recent
      minor versions during scheduled maintenance windows. Learn more about upgrading
      your database instances, including automatic minor version upgrades, in the
      <a href="https://docs.amazonaws.cn/zh_cn/AmazonRDS/latest/UserGuide/CHAP_MySQL.html"
      target="_blank">Amazon RDS User Guide</a>.<br /> <br /> Amazon RDS for PostgreSQL
      makes it easy to set up, operate, and scale PostgreSQL deployments in the cloud.
      Amazon RDS for PostgreSQL is available in all commercial and gov cloud region.
      See <a href="https://www.amazonaws.cn/en/rds/pricing/" target="_blank">Amazon
      RDS for PostgreSQL</a> for pricing details. Create or update a fully managed
      Amazon RDS database in the <a href="https://console.amazonaws.cn/?nc2=h_m_mc"
      target="_blank">Amazon RDS Management Console</a>.<b><br /> </b></p>
