  この日はリージョン拡大や新世代インスタンス、セキュリティの大型アップデートが目立ちました。Amazon MSK Connect は Asia Pacific (New Zealand) と AWS GovCloud (US-East/US-West) の 3 リージョンに拡大し、全 38 リージョンで利用可能になりました。Amazon Neptune は Graviton3 の R7g と Graviton4 の R8g インスタンスを 5 つの追加リージョンで、Amazon EC2 X8aedz インスタンスは 5th Gen AMD EPYC 搭載で最高 5GHz を実現し Mumbai / Seoul で提供されました。Amazon Connect Cases は CloudFormation に対応し、Amazon Lex は英語向けのニューラル音声認識モデルを追加しました。Amazon RDS for PostgreSQL は Extended Support のマイナーバージョンを発表。セキュリティ面では新バージョンの AWS Security Hub が一般提供され、Security Hub オートメーションによる大規模なセキュリティ対応の効率化や、2025 年秋の PCI DSS コンプライアンスパッケージの提供が案内されました。ブログでは AWS Outposts 上の Amazon EKS のストレージ性能最適化も解説されています。
