  この日はセキュリティ、ネットワーク、各種サービス機能の発表が行われた。セキュリティブログでは、AWS Systems ManagerとAmazon Security Lakeを用いたサーバーレスなファイル整合性監視ソリューションが紹介された。AWS Network Firewallは、生成AI (GenAI) トラフィックの可視化とWebカテゴリベースのフィルタリングに対応し、GenAIサービスやSNSなどへのアクセス制御を強化した。またAWS MarketplaceがFPGA製品のAMIセルフサービス出品に対応、Amazon WorkSpacesが高度なプリンターリダイレクトを追加、AWS Deadline Cloudがジョブ名・説明の編集をサポート、Amazon Connectがケースへのタグベースアクセス制御を導入した。さらにAmazon RDSがPostgreSQL・MySQL・MariaDB向けにr6id・r6gdインスタンスを追加リージョンで提供開始した。
