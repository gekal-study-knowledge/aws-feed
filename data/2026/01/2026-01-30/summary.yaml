  この日はコンピューティング、可観測性、パートナー、レジリエンス設計など多岐にわたる発表が行われた。5th Gen AMD EPYCプロセッサ搭載のAmazon EC2 R8aインスタンスがEurope (Spain・Frankfurt) リージョンで提供開始された。可観測性では、Amazon ECSがコンテナヘルスステータスをCloudWatchメトリクスとして公開、AWS LambdaがKafkaイベントソースマッピングの拡張可観測性を追加、Amazon CloudWatch Application SignalsがKiro powersと統合された。パートナー向けにはAWSサービス消費の可視化を行うPartner Revenue Measurementが発表された。またAmazon GameLift Streamsが6つの新リージョンに拡大、Amazon RDS for Oracleがクロスリージョンレプリカでの追加ストレージボリュームに対応、Amazon RDSがサービスAPIのVPCエンドポイントでIPv6をサポート、Amazon SageMaker Unified StudioがAWS PrivateLinkに対応した。さらにAWS European Sovereign Cloudを用いたソブリンフェイルオーバー設計や、AWS Managed Microsoft ADのスケーリング、サーバーレスQ4 2025総集編も公開された。
