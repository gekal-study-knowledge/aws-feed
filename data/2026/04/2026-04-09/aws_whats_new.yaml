  "3385d65e6510cdb04912536128f0e75f":
    "id": "3385d65e6510cdb04912536128f0e75f"
    "title": "AWS Marketplace announces the Discovery API for programmatic access to catalog data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-marketplace-discovery-api/"
    "published": "2026-04-10 01:00:00"
    "fetched": "2026-04-10 01:00:00"
    "summary": "<p>Today, AWS Marketplace announces the Discovery API, giving you programmatic access to product and pricing information across the AWS Marketplace catalog — including SaaS, AI agents and tools, AMI, containers, and machine learning models.<br /> <br /> With the Discovery API, buyers can embed catalog data into internal portals, enrich procurement tools with current pricing and offer terms, and streamline vendor evaluation workflows. Sellers and channel partners can surface product listings, public pricing, and private offer details directly within their own websites and storefronts — helping customers browse, compare, and move to purchase without leaving the partner experience.<br /> <br /> The API provides access to product descriptions, categories, pricing across public and private offers, and offer terms, so you can build experiences tailored to how your organization discovers and procures software through AWS Marketplace.<br /> <br /> The AWS Marketplace Discovery API is available in US East (N. Virginia), US West (Oregon), and Europe (Ireland).<br /> <br /> You can get started by configuring IAM permissions for your AWS account and calling the API through the AWS SDK. For more information, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/discovery-apis.html\">AWS Marketplace Discovery API Reference</a>.</p>"
  "860f3028b1cf31d1ce7ad8da2a4d2475":
    "id": "860f3028b1cf31d1ce7ad8da2a4d2475"
    "title": "AWS Agent Registry for centralized agent discovery and governance is now available in Preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-agent-registry-in-agentcore-preview/"
    "published": "2026-04-10 01:00:00"
    "fetched": "2026-04-10 01:00:00"
    "summary": "<p>AWS Agent Registry, available through Amazon Bedrock AgentCore, is now in preview — a private, governed catalog and discovery layer for agents, tools, skills, MCP servers, and custom resources within the organization. It gives teams complete visibility into their AI landscape, enabling them to discover existing agents and tools instead of rebuilding capabilities that already exist. The registry can be accessed via the AgentCore Console UI, APIs (AWS CLI, AWS SDK), or as an MCP server that builders can query and invoke directly from their IDEs. Registry supports both IAM and OAuth (Custom JWT) based access.</p> \n<p>Teams can register resources manually through the console or API, or use URL-based discovery, which automatically retrieves metadata such as tool schemas and capability descriptions from a live MCP server or agent endpoint. Records go through an approval workflow where administrators can approve records before they become discoverable, and they can plug the registry into their existing approval workflows to enforce governance policies. AWS CloudTrail provides complete audit trails of all registry access and administrative actions, ensuring compliance and security oversight. For discovery, the registry offers both semantic and keyword search, so developers can quickly find agents by describing their use case in natural language.&nbsp;</p> \n<p>AWS Agent Registry (preview) is available in five AWS Regions where AgentCore is available: US West (Oregon), Asia Pacific (Tokyo), Asia Pacific (Sydney), Europe (Ireland), and US East (N. Virginia). Learn more about the registry through the <a href=\"https://aws.amazon.com/blogs/machine-learning/the-future-of-managing-agents-at-scale-aws-agent-registry-now-in-preview/\">blog</a>, and deep dive using the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html\">documentation</a>.</p>"
  "c41c150f012f6d22b652b37c1cce6b74":
    "id": "c41c150f012f6d22b652b37c1cce6b74"
    "title": "Amazon EC2 Capacity Manager now supports tag-based dimensions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-capacity-manager-tag-based-dimensions/"
    "published": "2026-04-09 16:00:00"
    "fetched": "2026-04-09 16:00:00"
    "summary": "<p>Starting today, Amazon EC2 Capacity Manager supports tag-based dimensions, enabling you to use tags from your EC2 resources to group and filter capacity metrics. EC2 Capacity Manager helps you monitor and optimize capacity usage across On-Demand Instances, Spot Instances, and Capacity Reservations. This launch also introduces Account Name as a new built-in dimension.</p> \n<p>You can activate up to five custom tag keys — such as environment, team, or cost-center — and use them alongside built-in dimensions like Region, Instance Type, and Availability Zone to group and filter capacity metrics by tag values in the console and APIs, and include tag data as additional columns in newly created S3 data exports. Capacity Manager also includes four Capacity Manager-provided tags by default: EC2 Auto Scaling group name, EKS cluster name, EKS Kubernetes node pool, and Karpenter node pool. The new Account Name dimension makes it easier to identify accounts when analyzing cross-account capacity data across your organization.</p> \n<p>This feature is available in all AWS Regions where EC2 Capacity Manager is available. To get started, navigate to the Settings tab in Capacity Manager and choose Manage tag keys, or use the AWS CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/managing-monitored-tag-keys.html\">Managing monitored tag keys</a> in the <i>Amazon EC2 User Guide</i>. For more information about Amazon EC2 Capacity Manager, visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/capacity-manager.html\">EC2 Capacity Manager documentation</a>.</p>"
  "30603840359e5d52dad6f5bebe4734d5":
    "id": "30603840359e5d52dad6f5bebe4734d5"
    "title": "Amazon S3 Lifecycle pauses actions on objects that are unable to replicate"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/s3-lifecycle-pauses-actions-on-objects/"
    "published": "2026-04-10 02:33:00"
    "fetched": "2026-04-10 02:33:00"
    "summary": "<p>Amazon S3 Lifecycle now prevents expiration and transition actions on objects that failed replication, helping you to coordinate replication configuration or permissions changes with actions defined in your lifecycle rules.</p> \n<p>Incorrect permissions or replication configuration can prevent objects from being replicated. With this change, S3 Lifecycle no longer expires or transitions objects that have failed replication, even if they match one of the lifecycle rules that you have defined. Once you have corrected your replication configuration or permissions, you can use S3 Batch Replication to replicate objects that previously failed. After successful replication, S3 Lifecycle will automatically process these objects according to your configured rules.</p> \n<p>This change applies automatically to all existing and new S3 Lifecycle configurations, across 37 AWS Regions, including the AWS China and AWS GovCloud (US) Regions. We are in the process of deploying this change and plan to complete the deployment in the coming days. To learn more, visit <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Lifecycle documentation</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-troubleshoot.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Replication troubleshooting documentation</a>.</p>"
  "d45d5e11f79442a807b67a1835fd62bf":
    "id": "d45d5e11f79442a807b67a1835fd62bf"
    "title": "Amazon OpenSearch Service supports Managed Prometheus and agent tracing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/opensearch-managed-prometheus-agent-tracing/"
    "published": "2026-04-10 05:00:00"
    "fetched": "2026-04-10 05:00:00"
    "summary": "<p>Amazon OpenSearch Service now provides a unified observability experience that brings together metrics, logs, traces, and AI agent tracing in a single interface. This release introduces native integration with Amazon Managed Service for Prometheus and comprehensive agent tracing capabilities, addressing the dual challenges of prohibitive costs from premium observability platforms and operational complexity from fragmented tooling. Site Reliability Engineers, DevOps Engineers, and Platform Engineering teams can now consolidate their observability stack without costly data duplication or constant context switching between multiple tools.</p> \n<p>You can now query Prometheus metrics directly using native PromQL syntax alongside logs and traces in OpenSearch UI's observability workspace—without duplicating data. Combined with new application monitoring workflows powered by RED metrics (Rate, Errors, Duration) and AI agent tracing using OpenTelemetry GenAI semantic conventions, operations teams can correlate slow traces to application logs, overlay Prometheus metrics on service dashboards, and trace LLM agent execution—all without switching tools. This live query architecture delivers significant cost reduction compared to premium platforms while maintaining operational excellence.</p> \n<p>The new unified observability experience is available on OpenSearch UI in 20 AWS regions: US East (N. Virginia, Ohio), US West (N. California, Oregon), Asia Pacific (Hong Kong, Mumbai, Osaka, Seoul, Singapore, Sydney, Tokyo), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm), Canada (Central), and South America (São Paulo).</p> \n<p>To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/observability.html\">OpenSearch Service observability documentation</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/direct-query-prometheus-overview.html\">direct query documentation</a>.</p>"
  "0df35c04af58e26edd9a4300ad3c34c9":
    "id": "0df35c04af58e26edd9a4300ad3c34c9"
    "title": "Amazon RDS Blue/Green Deployments now supports Amazon RDS Proxy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/rds-proxy-blue-green/"
    "published": "2026-04-10 02:00:00"
    "fetched": "2026-04-10 02:00:00"
    "summary": "<p>Amazon RDS Blue/Green Deployments now supports Amazon RDS Proxy, enabling faster application recovery during switchover by eliminating DNS propagation delays. Blue/Green Deployments create a fully managed staging environment (Green) that allows you to deploy and test production changes, keeping your current production database (Blue) safe. When ready, you can switchover to the new production environment and your applications begin accessing it immediately without any configuration changes.<br /> <br /> During a Blue/Green Deployment switchover for single-Region configurations, RDS Proxy actively monitors database instances and detects when the Green environment becomes the new production environment. This allows RDS Proxy to quickly redirect connections to the Green environment, enabling faster application recovery. You don't need to modify your drivers or change your existing application setup.<br /> <br /> Amazon RDS Blue/Green Deployments with Amazon RDS Proxy is available for Amazon Aurora with MySQL compatibility, Amazon Aurora with PostgreSQL compatibility, Amazon RDS for MySQL, Amazon RDS for PostgreSQL, and Amazon RDS for MariaDB in all commercial AWS Regions where <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RDS_Fea_Regions_DB-eng.Feature.RDSProxy.html\" rel=\"noopener noreferrer\" target=\"_blank\">RDS Proxy is available</a>.<br /> <br /> In a few clicks, update your databases using RDS Blue/Green Deployments via the Amazon RDS Console or Amazon CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/blue-green-deployments-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">Blue/Green Deployments overview</a> in the Amazon RDS documentation.</p>"
  "d94b1c85665edd279d806aad9a53c6c1":
    "id": "d94b1c85665edd279d806aad9a53c6c1"
    "title": "Amazon RDS Blue/Green Deployments now supports Amazon RDS Proxy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/rds-blue-green-proxy/"
    "published": "2026-04-10 02:00:00"
    "fetched": "2026-04-10 02:00:00"
    "summary": "<p>Amazon RDS Blue/Green Deployments now supports Amazon RDS Proxy, enabling faster application recovery during switchover by eliminating DNS propagation delays. Blue/Green Deployments create a fully managed staging environment (Green) that allows you to deploy and test production changes, keeping your current production database (Blue) safe. When ready, you can switchover to the new production environment and your applications begin accessing it immediately without any configuration changes.<br /> <br /> During a Blue/Green Deployment switchover for single-Region configurations, RDS Proxy actively monitors database instances and detects when the Green environment becomes the new production environment. This allows RDS Proxy to quickly redirect connections to the Green environment, enabling faster application recovery. You don't need to modify your drivers or change your existing application setup.<br /> <br /> Amazon RDS Blue/Green Deployments with Amazon RDS Proxy is available for Amazon Aurora with MySQL compatibility, Amazon Aurora with PostgreSQL compatibility, Amazon RDS for MySQL, Amazon RDS for PostgreSQL, and Amazon RDS for MariaDB in all commercial AWS Regions where <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RDS_Fea_Regions_DB-eng.Feature.RDSProxy.html\" rel=\"noopener noreferrer\" target=\"_blank\">RDS Proxy is available</a>.<br /> <br /> In a few clicks, update your databases using RDS Blue/Green Deployments via the Amazon RDS Console or Amazon CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/blue-green-deployments-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">Blue/Green Deployments overview</a> in the Amazon RDS documentation.</p>"
  "63b9b8c574ec77f79cb4b3068e2f5562":
    "id": "63b9b8c574ec77f79cb4b3068e2f5562"
    "title": "Amazon OpenSearch Serverless now supports Zstandard (zstd) codec for index compression"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-opensearch-serverless-supports-zstandard-index-compression/"
    "published": "2026-04-10 00:00:00"
    "fetched": "2026-04-10 00:00:00"
    "summary": "<p>Amazon OpenSearch Serverless now supports Zstandard codecs for index storage, giving customers greater control over the trade-off between storage costs and query performance. With this launch, customers can configure&nbsp;Zstandard compression to achieve up to 32% reduction in index size compared to the default LZ4 codec, helping lower managed storage costs for data-intensive workloads.</p> \n<p>Customers running large-scale log analytics, observability pipelines, and time-series workloads on Amazon OpenSearch Serverless can benefit most from&nbsp;Zstandard compression where high data volumes make storage efficiency a significant cost driver. The Zstandard compression algorithm is available in two different modes in Amazon OpenSearch Serverless:&nbsp;zstd&nbsp;and&nbsp;zstd_no_dict. Customers can tune the compression level to balance their specific needs: lower levels (e.g., level 1) deliver meaningful storage savings with minimal impact on indexing throughput and query latency, while higher levels (e.g., level 6) maximize compression ratios at the cost of slower indexing speeds.&nbsp;</p> \n<p>Zstandard codec support is available today in all AWS Regions where Amazon OpenSearch Serverless is <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">supported</a>. To get started, you can specify these codecs in your index settings at creation time. For more information, see the Amazon OpenSearch Serverless <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-zstd-compression.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "4dcd441f19e891f68b008e4c91d8ed29":
    "id": "4dcd441f19e891f68b008e4c91d8ed29"
    "title": "Amazon Bedrock now supports cost allocation by IAM user and role"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/bedrock-iam-cost-allocation/"
    "published": "2026-04-10 06:50:00"
    "fetched": "2026-04-10 06:50:00"
    "summary": "<p>Amazon Bedrock now supports cost allocation by IAM principal, such as IAM users and IAM roles, in AWS Cost and Usage Report 2.0 (CUR 2.0) and Cost Explorer. This enables customers to understand and attribute Bedrock model inference costs across users, teams, projects, and applications.<br /> <br /> With this launch, customers can tag their IAM users and roles with attributes like team, project, or cost center, activate them as cost allocation tags, and analyze Bedrock model inference costs by the tags in Cost Explorer or at the line-item level in CUR 2.0. To get started, tag your IAM users and roles and activate them as cost allocation tags in the Billing and Cost Management console. Then create a CUR 2.0 data export and select \"Include caller identity (IAM principal) allocation data\" or filter by tags in Cost Explorer.<br /> <br /> This feature is available in all AWS commercial Regions where Amazon Bedrock is available. To learn more, see <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/iam-principal-cost-allocation.html\">Using IAM principal for Cost Allocation documentation</a>. To get started with Amazon Bedrock, visit <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/getting-started.html\">Amazon Bedrock documentation.</a></p>"
  "e43ac8beeab8ebf6e6ab12f334e1e0b6":
    "id": "e43ac8beeab8ebf6e6ab12f334e1e0b6"
    "title": "Amazon Timestream for InfluxDB Now Supports Customer-Defined Maintenance Windows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/timestream-influxdb-maintenance-windows/"
    "published": "2026-04-10 06:57:00"
    "fetched": "2026-04-10 06:57:00"
    "summary": "<p>Amazon Timestream for InfluxDB now supports customer-defined maintenance windows, giving you control over when routine maintenance is performed on your InfluxDB databases. This feature is available for both InfluxDB 2 instances and InfluxDB 3 clusters across all supported editions.<br /> <br /> With this launch, you can specify a weekly maintenance window using a day-and-time format in your preferred timezone. Timestream for InfluxDB supports IANA timezone identifiers such as America/New_York, Europe/London, and Asia/Tokyo, and automatically handles Daylight Saving Time transitions so you don't need to manually adjust your schedule. If you don't specify a maintenance window, the service continues to manage maintenance timing automatically.<br /> <br /> You can set or update your preferred maintenance window when creating or modifying a resource using the Amazon Timestream for InfluxDB console, AWS CLI, or AWS SDKs.&nbsp;You can use Amazon Timestream for InfluxDB Customer-Defined Maintenance Windows in all <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Timestream for InfluxDB is offered.<br /> <br /> To get started with Amazon Timestream for InfluxDB, visit the <a href=\"https://console.aws.amazon.com/timestream\">Amazon Timestream for InfluxDB console</a>. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "16a0a0f500923cc7c828da707d01eb69":
    "id": "16a0a0f500923cc7c828da707d01eb69"
    "title": "AWS Private CA now supports customer managed permissions for cross-account sharing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-private-ca-customer-managed-permissions/"
    "published": "2026-04-09 22:00:00"
    "fetched": "2026-04-09 22:00:00"
    "summary": "<p>AWS Private Certificate Authority (AWS Private CA) now supports customer managed permissions in AWS Resource Access Manager (AWS RAM). AWS Private CA lets you share certificate authorities (CAs) across accounts using AWS RAM so you can centralize your PKI instead of creating separate CAs in every account. With customer managed permissions, you can now select exactly which AWS Private CA API operations to allow when sharing a CA, granting only the specific operations each consuming account needs.<br /> <br /> Previously, you could only use AWS managed permissions, which provide predefined sets of actions and restrict cross-account issuers to specific certificate templates. Now you can select from read operations (e.g., DescribeCertificateAuthority, GetCertificate, and GetCertificateAuthorityCertificate) and write operations (e.g., IssueCertificate and RevokeCertificate) to tailor access for each consuming account or organizational unit. With customer managed permissions, cross-account issuers are not restricted to a specific certificate template.<br /> <br /> Customer managed permissions for AWS Private CA are available in all AWS Regions where AWS Private CA and AWS RAM are available. To learn more, see <a href=\"https://docs.aws.amazon.com/privateca/latest/userguide/pca-cmp.html\">Customer managed permissions in RAM</a> in the AWS Private CA User Guide and <a href=\"https://docs.aws.amazon.com/ram/latest/userguide/create-customer-managed-permissions.html\">Creating and using customer managed permissions</a> in the AWS RAM User Guide.</p>"
