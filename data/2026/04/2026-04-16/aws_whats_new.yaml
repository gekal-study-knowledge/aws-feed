  "05237e627decea904d5fea4fb7a41a8a":
    "id": "05237e627decea904d5fea4fb7a41a8a"
    "title": "Claude Opus 4.7 is now available in Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/claude-opus-4.7-amazon-bedrock/"
    "published": "2026-04-16 12:00:00"
    "summary": "<p>Amazon Bedrock, the platform for building AI applications and agents at production scale, now offers Claude Opus 4.7--&nbsp;Anthropic's&nbsp;most capable Opus model to date&nbsp;--&nbsp;delivering meaningful improvements across agentic coding,&nbsp;professional&nbsp;work, and long-running tasks for developers and enterprises building production AI applications.&nbsp;</p> \n<p>Claude Opus 4.7 is an&nbsp;upgrade from Claude Opus 4.6, with stronger performance across the workflows teams&nbsp;run&nbsp;in production.&nbsp;Opus 4.7 works better through ambiguity, is more thorough in its problem solving, and&nbsp;folllows&nbsp;instructions more precisely.&nbsp;For coding, the model extends agentic capabilities with improved long-horizon autonomy, systems engineering, and complex code reasoning. For knowledge work, Claude Opus 4.7 advances professional tasks such as&nbsp;slides and&nbsp;document creation, financial analysis, and&nbsp;data visualization. For long-running tasks, the model stays on track&nbsp;over longer horizons with improved reasoning and memory capabilities. Claude Opus 4.7 also advances visual&nbsp;capabilities&nbsp;with high-resolution image support&nbsp;improving accuracy on charts, dense documents, and&nbsp;screen&nbsp;UIs where fine detail matters.&nbsp;&nbsp;</p> \n<p>Claude Opus&nbsp;4.7 is&nbsp;served&nbsp;through&nbsp;Amazon Bedrock's next-generation inference engine, delivering enterprise-grade infrastructure for production workloads.&nbsp;It provides zero operator data access, meaning customer&nbsp;prompts&nbsp;and responses are never visible to Anthropic or AWS operators, keeping sensitive data private. It also enables&nbsp;enhanced&nbsp;availability through&nbsp;dynamic traffic routing with expanded in-region options, along with improved scalability.</p> \n<p>Claude Opus 4.7 is available in select&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a>.&nbsp;To learn more about Claude Opus 4.7 and other&nbsp;Anthropic&nbsp;models available&nbsp;in&nbsp;Amazon Bedrock, visit the&nbsp;<a href=\"https://aws.amazon.com/bedrock/anthropic/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock&nbsp;page</a>. To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock documentation</a>.&nbsp;</p>"
  "c1c506a9f411a5ce3c4d8009006acdbe":
    "id": "c1c506a9f411a5ce3c4d8009006acdbe"
    "title": "AWS Elastic Disaster Recovery is now available in the AWS European Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/drs-thf/"
    "published": "2026-04-16 19:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/disaster-recovery/\">AWS Elastic Disaster Recovery</a> (AWS DRS) is now available in the AWS European Sovereign Cloud, enabling organizations with data sovereignty requirements to protect their mission-critical workloads with disaster recovery on AWS. AWS DRS<br /> minimizes downtime and data loss with fast, reliable recovery of on-premises and cloud-based applications using affordable storage, minimal compute, and point-in-time recovery, with Recovery Point Objectives (RPOs) measured in seconds and Recovery Time Objectives (RTOs) typically in minutes.<br /> <br /> With AWS DRS, you can recover applications from physical infrastructure, VMware vSphere, Microsoft Hyper-V, and cloud infrastructure. AWS DRS uses a unified process for testing, recovery, and failback for a wide range of applications, including critical databases such as Oracle, MySQL, and SQL Server, and enterprise applications such as SAP.<br /> <br /> AWS Elastic Disaster Recovery is available in the AWS European Sovereign Cloud (Germany). See the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a> for the latest availability information.<br /> <br /> To learn more about AWS Elastic Disaster Recovery, visit our <a href=\"https://aws.amazon.com/disaster-recovery/\">product page</a> or <a href=\"https://docs.aws.eu/drs/latest/userguide/what-is-drs.html\">documentation</a>.</p>"
  "dea2ca35a05f9fa8bb583ea24c3d4122":
    "id": "dea2ca35a05f9fa8bb583ea24c3d4122"
    "title": "Amazon Quick now supports multi-account sign-in within the same browser"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-multi-account-sign-in/"
    "published": "2026-04-16 12:00:00"
    "summary": "<p>Today, AWS announces multi-session support for Amazon Quick, which enables customers to access up to five Amazon Quick accounts simultaneously within the same browser. The feature also includes the Amazon Quick account name in all URLs, enabling users to easily access the correct account when opening agents, spaces, flows, research reports, dashboards, and other assets.<br /> <br /> Customers use multiple accounts for different environments such as development, testing, and production, and compare insights and resource configurations across multiple accounts for troubleshooting and other application-related jobs. Using multi-session capability in Amazon Quick, customers can now sign in to multiple accounts and manage their resources in a single browser. You can sign in to another account by accessing the Amazon Quick top right menu and selecting the option to sign in to another account. For users accessing global URLs without an account name, Amazon Quick presents an account input page that pre-populates the accounts they are logged into, allowing them to select the desired account. You have the option to log out of the current session in the specific browser tab or log out of all sessions.<br /> <br /> Amazon Quick multi-account sign-in is available in all <a href=\"https://docs.aws.amazon.com/quicksight/latest/user/regions-qs.html\">supported Amazon Quick regions</a>.<br /> <br /> To learn more about this, visit <a href=\"https://docs.aws.amazon.com/quicksuite/latest/userguide/signing-in.html\">Amazon Quick Signing In</a></p>"
"last_updated": "2026-04-17 05:53:47 JST"
