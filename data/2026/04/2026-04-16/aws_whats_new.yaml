  "05237e627decea904d5fea4fb7a41a8a":
    "id": "05237e627decea904d5fea4fb7a41a8a"
    "title": "Claude Opus 4.7 is now available in Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/claude-opus-4.7-amazon-bedrock/"
    "published": "2026-04-16 12:00:00"
    "fetched": "2026-04-16 12:00:00"
    "summary": "<p>Amazon Bedrock, the platform for building AI applications and agents at production scale, now offers Claude Opus 4.7--&nbsp;Anthropic's&nbsp;most capable Opus model to date&nbsp;--&nbsp;delivering meaningful improvements across agentic coding,&nbsp;professional&nbsp;work, and long-running tasks for developers and enterprises building production AI applications.&nbsp;</p> \n<p>Claude Opus 4.7 is an&nbsp;upgrade from Claude Opus 4.6, with stronger performance across the workflows teams&nbsp;run&nbsp;in production.&nbsp;Opus 4.7 works better through ambiguity, is more thorough in its problem solving, and&nbsp;folllows&nbsp;instructions more precisely.&nbsp;For coding, the model extends agentic capabilities with improved long-horizon autonomy, systems engineering, and complex code reasoning. For knowledge work, Claude Opus 4.7 advances professional tasks such as&nbsp;slides and&nbsp;document creation, financial analysis, and&nbsp;data visualization. For long-running tasks, the model stays on track&nbsp;over longer horizons with improved reasoning and memory capabilities. Claude Opus 4.7 also advances visual&nbsp;capabilities&nbsp;with high-resolution image support&nbsp;improving accuracy on charts, dense documents, and&nbsp;screen&nbsp;UIs where fine detail matters.&nbsp;&nbsp;</p> \n<p>Claude Opus&nbsp;4.7 is&nbsp;served&nbsp;through&nbsp;Amazon Bedrock's next-generation inference engine, delivering enterprise-grade infrastructure for production workloads.&nbsp;It provides zero operator data access, meaning customer&nbsp;prompts&nbsp;and responses are never visible to Anthropic or AWS operators, keeping sensitive data private. It also enables&nbsp;enhanced&nbsp;availability through&nbsp;dynamic traffic routing with expanded in-region options, along with improved scalability.</p> \n<p>Claude Opus 4.7 is available in select&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a>.&nbsp;To learn more about Claude Opus 4.7 and other&nbsp;Anthropic&nbsp;models available&nbsp;in&nbsp;Amazon Bedrock, visit the&nbsp;<a href=\"https://aws.amazon.com/bedrock/anthropic/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock&nbsp;page</a>. To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock documentation</a>.&nbsp;</p>"
  "c1c506a9f411a5ce3c4d8009006acdbe":
    "id": "c1c506a9f411a5ce3c4d8009006acdbe"
    "title": "AWS Elastic Disaster Recovery is now available in the AWS European Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/drs-thf/"
    "published": "2026-04-16 19:00:00"
    "fetched": "2026-04-16 19:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/disaster-recovery/\">AWS Elastic Disaster Recovery</a> (AWS DRS) is now available in the AWS European Sovereign Cloud, enabling organizations with data sovereignty requirements to protect their mission-critical workloads with disaster recovery on AWS. AWS DRS<br /> minimizes downtime and data loss with fast, reliable recovery of on-premises and cloud-based applications using affordable storage, minimal compute, and point-in-time recovery, with Recovery Point Objectives (RPOs) measured in seconds and Recovery Time Objectives (RTOs) typically in minutes.<br /> <br /> With AWS DRS, you can recover applications from physical infrastructure, VMware vSphere, Microsoft Hyper-V, and cloud infrastructure. AWS DRS uses a unified process for testing, recovery, and failback for a wide range of applications, including critical databases such as Oracle, MySQL, and SQL Server, and enterprise applications such as SAP.<br /> <br /> AWS Elastic Disaster Recovery is available in the AWS European Sovereign Cloud (Germany). See the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a> for the latest availability information.<br /> <br /> To learn more about AWS Elastic Disaster Recovery, visit our <a href=\"https://aws.amazon.com/disaster-recovery/\">product page</a> or <a href=\"https://docs.aws.eu/drs/latest/userguide/what-is-drs.html\">documentation</a>.</p>"
  "dea2ca35a05f9fa8bb583ea24c3d4122":
    "id": "dea2ca35a05f9fa8bb583ea24c3d4122"
    "title": "Amazon Quick now supports multi-account sign-in within the same browser"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-multi-account-sign-in/"
    "published": "2026-04-16 12:00:00"
    "fetched": "2026-04-16 12:00:00"
    "summary": "<p>Today, AWS announces multi-session support for Amazon Quick, which enables customers to access up to five Amazon Quick accounts simultaneously within the same browser. The feature also includes the Amazon Quick account name in all URLs, enabling users to easily access the correct account when opening agents, spaces, flows, research reports, dashboards, and other assets.<br /> <br /> Customers use multiple accounts for different environments such as development, testing, and production, and compare insights and resource configurations across multiple accounts for troubleshooting and other application-related jobs. Using multi-session capability in Amazon Quick, customers can now sign in to multiple accounts and manage their resources in a single browser. You can sign in to another account by accessing the Amazon Quick top right menu and selecting the option to sign in to another account. For users accessing global URLs without an account name, Amazon Quick presents an account input page that pre-populates the accounts they are logged into, allowing them to select the desired account. You have the option to log out of the current session in the specific browser tab or log out of all sessions.<br /> <br /> Amazon Quick multi-account sign-in is available in all <a href=\"https://docs.aws.amazon.com/quicksight/latest/user/regions-qs.html\">supported Amazon Quick regions</a>.<br /> <br /> To learn more about this, visit <a href=\"https://docs.aws.amazon.com/quicksuite/latest/userguide/signing-in.html\">Amazon Quick Signing In</a></p>"
  "212af957201d21c9cd0a0affa8f7fd37":
    "id": "212af957201d21c9cd0a0affa8f7fd37"
    "title": "Amazon CloudWatch now supports cross-region telemetry auditing and enablement rules"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-cross-region-enablement-rules/"
    "published": "2026-04-16 20:00:00"
    "fetched": "2026-04-16 20:00:00"
    "summary": "<p>Amazon CloudWatch now supports auditing telemetry configuration and enabling telemetry from AWS services such as Amazon EC2, Amazon VPC, and AWS CloudTrail across multiple AWS Regions from a single region. Customers can enable the telemetry auditing feature for their account or organization across all supported regions at once and create enablement rules that automatically apply to selected regions or all available regions.</p> \n<p>With today's launch, customers can scope enablement rules to specific regions or all supported regions. For example, a central security team can create a single organization-wide enablement rule for VPC Flow Logs that applies across all regions, ensuring consistent telemetry collection for every VPC across every account. Rules configured for all regions automatically expand to include new regions as they become available.</p> \n<p>CloudWatch's cross-region telemetry configuration and enablement rule is available in all AWS commercial regions. Standard CloudWatch pricing applies for telemetry ingestion. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-cloudwatch.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch documentation</a>.</p>"
  "71e49eac08546d9761435ac72c4cc755":
    "id": "71e49eac08546d9761435ac72c4cc755"
    "title": "Amazon WorkSpaces Personal and Amazon WorkSpaces Core are now available in two additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-workspaces-available-two-new-regions/"
    "published": "2026-04-16 17:38:00"
    "fetched": "2026-04-16 17:38:00"
    "summary": "<p>Amazon WorkSpaces Personal and Amazon WorkSpaces Core are now available in US East (Ohio) and Asia Pacific (Malaysia) AWS Regions. You can now provision WorkSpaces closer to your users, helping to provide in-country data residency and a more responsive experience.&nbsp;In US East (Ohio), organizations can also now implement disaster recovery solutions, meet local data residency compliance mandates, and support regional workforces with consistent, low-latency access to their virtual desktop environments across varying network conditions.</p> \n<p>Amazon WorkSpaces Personal provides users with instant access to their desktops from anywhere. It allows users to stream desktops from AWS to their devices, and WorkSpaces Personal manages the AWS resources required to host and run your desktops, scales automatically, and provides access to your users on demand. Amazon WorkSpaces Core provides cloud-based, fully managed virtual desktop infrastructure (VDI) accessible to third-party VDI management solutions via API.</p> \n<p>To get started with Amazon WorkSpaces Personal or Amazon WorkSpaces Core, sign into the WorkSpaces management console and select the AWS Region of your choice. To learn more about Amazon WorkSpaces offerings, visit the <a href=\"https://aws.amazon.com/workspaces/\" target=\"_blank\">product page</a> and <a href=\"https://docs.aws.amazon.com/workspaces/\" target=\"_blank\">technical documentation</a>.</p>"
  "7b2acc08d69f2189582f36e8569afc5b":
    "id": "7b2acc08d69f2189582f36e8569afc5b"
    "title": "Amazon FSx for Lustre Persistent-2 file systems are now available in four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-fsx-lustre-persistent-2-aws/"
    "published": "2026-04-16 16:30:00"
    "fetched": "2026-04-16 16:30:00"
    "summary": "<p>You can now create Amazon FSx for Lustre Persistent-2 file systems in four additional AWS Regions: Asia Pacific (Hyderabad, Jakarta), Europe (Zurich), and South America (São Paulo).</p> \n<p>Amazon FSx for Lustre Persistent-2 file systems are built on AWS Graviton processors and provide higher throughput per terabyte (up to 1 GB/s per terabyte) and lower cost of throughput compared to previous generation FSx for Lustre file systems. Using FSx for Lustre Persistent-2 file systems, you can accelerate execution of machine learning, high-performance computing, media &amp; entertainment, and financial simulations workloads while reducing your cost of storage.</p> \n<p>To get started with Amazon FSx for Lustre Persistent-2 in these new regions, create a file system through the <a href=\"https://console.aws.amazon.com/fsx/\">AWS Management Console</a>. To learn more about Amazon FSx for Lustre, visit our <a href=\"https://aws.amazon.com/fsx/lustre/\">product pag</a><a href=\"https://aws.amazon.com/fsx/lustre\">e</a>, and see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region Table</a> for complete regional availability information.</p>"
  "842b892cafd441bff9687ba7cf30eb2c":
    "id": "842b892cafd441bff9687ba7cf30eb2c"
    "title": "Introducing Amazon EC2 C8in and C8ib instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-c8in-c8ib-instances-ga/"
    "published": "2026-04-16 15:00:00"
    "fetched": "2026-04-16 15:00:00"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 C8in and C8ib instances powered by custom, sixth generation Intel Xeon Scalable processors, available only on AWS. These instances feature the latest sixth generation AWS Nitro cards. C8in and C8ib instances deliver up to 43% higher performance compared to previous generation C6in instances.<br /> <br /> C8in and C8ib instances deliver larger sizes and scale up to 384 vCPUs. C8in instances deliver 600 Gbps network bandwidth—the highest among enhanced networking EC2 instances—making them ideal for network-intensive workloads like distributed compute and large-scale data analytics. C8ib instances deliver up to 300 Gbps EBS bandwidth, the highest among non-accelerated compute instances, making them ideal for high-performance commercial databases and file systems.</p> \n<p>C8in instances are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Spain) regions. C8ib instances are available in US East (N. Virginia) and US West (Oregon). Both, C8in and C8ib instances are available via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 C8i instance page</a>.</p>"
