"overview": |
  「What's Next with AWS」2026 の発表が中心となった一日でした。最大の話題は AWS と OpenAI のパートナーシップ拡大で、最新 OpenAI モデル、コーディングエージェント Codex、OpenAI 搭載 Managed Agents の 3 つが Amazon Bedrock にリミテッドプレビューで登場し、IAM や PrivateLink など既存のエンタープライズ統制下で利用可能になりました。Amazon Connect は採用向けの Amazon Connect Talent (プレビュー) を発表し、AI エージェントによる音声面接や候補者評価を実現。ML 分野では Amazon Nova 2 Sonic による音声アシスタント移行、NVIDIA Nemotron 3 Nano Omni の SageMaker JumpStart での day zero 提供、AgentCore Runtime の Node.js 対応が発表されました。基盤面では AWS Glue 5.1 の全リージョン展開 (Iceberg v3 対応)、EC2 C8gn の追加リージョン、EMR 7.13、OpenSearch の JWKS URL 対応など多数の更新がありました。セキュリティでは IAM Identity Center のセッションタグや 2026 年 3 月の脅威手口カタログ更新解説が公開されました。
