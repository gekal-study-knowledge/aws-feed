    "title": "Amazon Connect Talent for AI-powered hiring (now available in Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-talent-ai-powered/"
    "published": "2026-04-29 00:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Amazon Connect Talent is now available in Preview, giving talent acquisition leaders an AI-powered hiring solution that accelerates candidate selection at scale. Informed by decades of Amazon's hiring science, Amazon Connect Talent uses AI agents to conduct structured voice interviews, administer science-backed assessments, and score candidates consistently — freeing recruiters to focus on strategic decisions. Candidates interview 24/7 from any device. Recruiters review scores, transcripts, and detailed candidate evaluations generated by their AI teammate — empowering them to make faster hiring decisions with consistent objectivity.<br /> <br /> Preview capabilities include AI-driven skills assessments, AI-led voice interviews with adaptive questioning, a brand-customizable mobile-first candidate portal, a comprehensive recruiter dashboard, system admin onboarding tools, and Applicant Tracking System (ATS) integrations for quick deployment. Amazon Connect Talent scales to handle hiring surges, evaluating hundreds of candidates simultaneously.<br /> <br /> Amazon Connect Talent is available in AWS US East (N. Virginia) and US West (Oregon) regions. To learn more and request access, visit the <a href=\"https://aws.amazon.com/products/connect/talent/\">Amazon Connect Talent page.</a></p>"
  "3e841cbc56b4a6bcd4d1298e6b9ecd3b":
    "id": "3e841cbc56b4a6bcd4d1298e6b9ecd3b"
    "title": "Amazon Bedrock now offers OpenAI models, Codex, and Managed Agents (Limited Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/bedrock-openai-models-codex-managed-agents/"
    "published": "2026-04-29 00:00:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>AWS and OpenAI are expanding their partnership to bring frontier&nbsp;intelligence to the&nbsp;infrastructure millions of organizations already trust. Enterprises want the most capable AI models and agents, with the security, operational maturity, and data governance that production&nbsp;workloads demand. Today,&nbsp;we’re&nbsp;bringing those together&nbsp;with&nbsp;three new offerings&nbsp;on&nbsp;Amazon&nbsp;Bedrock, all&nbsp;in&nbsp;limited preview: the latest OpenAI models, Codex, and Managed Agents powered by OpenAI.</p> \n<p>First, the latest OpenAI models&nbsp;are&nbsp;available&nbsp;on&nbsp;Amazon&nbsp;Bedrock. For the first time, AWS customers can access OpenAI frontier models through the same Bedrock&nbsp;services&nbsp;they already use for model access, fine-tuning, and orchestration. OpenAI models&nbsp;on&nbsp;Bedrock&nbsp;inherit the enterprise controls customers depend on,&nbsp;including IAM, AWS&nbsp;PrivateLink, guardrails,&nbsp;encryption, and CloudTrail logging. Second, Codex&nbsp;on&nbsp;Amazon&nbsp;Bedrock&nbsp;brings&nbsp;the&nbsp;OpenAI&nbsp;coding agent&nbsp;into the AWS environments where enterprise teams already build. Customers authenticate with AWS credentials&nbsp;and&nbsp;run&nbsp;inference through&nbsp;Bedrock.&nbsp;Codex will be available through&nbsp;Bedrock&nbsp;via&nbsp;the Codex CLI, desktop app, and VS Code extension.&nbsp;Usage of both OpenAI models and Codex can be applied toward existing AWS&nbsp;cloud commitments.&nbsp;Lastly, Amazon&nbsp;Bedrock&nbsp;Managed Agents, powered by OpenAI, makes it fast to deploy production-ready OpenAI-powered agents&nbsp;on&nbsp;AWS.&nbsp;At the core are the latest OpenAI frontier models and the OpenAI agent harness, engineered for faster execution, sharper reasoning, and reliable steering of long-running tasks. Every agent has&nbsp;its&nbsp;own identity,&nbsp;logs&nbsp;each action, and runs&nbsp;in&nbsp;your environment with all&nbsp;inference&nbsp;on&nbsp;Amazon&nbsp;Bedrock. Managed Agents works with Amazon&nbsp;Bedrock&nbsp;AgentCore, which provides&nbsp;the default&nbsp;compute&nbsp;environment.</p> \n<p>Read the&nbsp;<a href=\"http://aboutamazon.com/news/aws/bedrock-openai-models\">blog</a>&nbsp;to learn more. To follow our progress and be among the first to hear about the latest updates, register&nbsp;<a href=\"https://pages.awscloud.com/GLOBAL-ln-GC-openai-bedrock-interest.html\">here</a>.</p>"
"last_updated": "2026-04-29 03:14:44 JST"
