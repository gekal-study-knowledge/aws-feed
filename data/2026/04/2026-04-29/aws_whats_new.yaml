  "00e17352a855c99c3e9b2904f19774c7":
    "id": "00e17352a855c99c3e9b2904f19774c7"
    "title": "Amazon Connect Talent for AI-powered hiring (now available in Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-talent-ai-powered/"
    "published": "2026-04-29 00:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Amazon Connect Talent is now available in Preview, giving talent acquisition leaders an AI-powered hiring solution that accelerates candidate selection at scale. Informed by decades of Amazon's hiring science, Amazon Connect Talent uses AI agents to conduct structured voice interviews, administer science-backed assessments, and score candidates consistently — freeing recruiters to focus on strategic decisions. Candidates interview 24/7 from any device. Recruiters review scores, transcripts, and detailed candidate evaluations generated by their AI teammate — empowering them to make faster hiring decisions with consistent objectivity.<br /> <br /> Preview capabilities include AI-driven skills assessments, AI-led voice interviews with adaptive questioning, a brand-customizable mobile-first candidate portal, a comprehensive recruiter dashboard, system admin onboarding tools, and Applicant Tracking System (ATS) integrations for quick deployment. Amazon Connect Talent scales to handle hiring surges, evaluating hundreds of candidates simultaneously.<br /> <br /> Amazon Connect Talent is available in AWS US East (N. Virginia) and US West (Oregon) regions. To learn more and request access, visit the <a href=\"https://aws.amazon.com/products/connect/talent/\">Amazon Connect Talent page.</a></p>"
  "3e841cbc56b4a6bcd4d1298e6b9ecd3b":
    "id": "3e841cbc56b4a6bcd4d1298e6b9ecd3b"
    "title": "Amazon Bedrock now offers OpenAI models, Codex, and Managed Agents (Limited Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/bedrock-openai-models-codex-managed-agents/"
    "published": "2026-04-29 00:00:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>AWS and OpenAI are expanding their partnership to bring frontier&nbsp;intelligence to the&nbsp;infrastructure millions of organizations already trust. Enterprises want the most capable AI models and agents, with the security, operational maturity, and data governance that production&nbsp;workloads demand. Today,&nbsp;we’re&nbsp;bringing those together&nbsp;with&nbsp;three new offerings&nbsp;on&nbsp;Amazon&nbsp;Bedrock, all&nbsp;in&nbsp;limited preview: the latest OpenAI models, Codex, and Managed Agents powered by OpenAI.</p> \n<p>First, the latest OpenAI models&nbsp;are&nbsp;available&nbsp;on&nbsp;Amazon&nbsp;Bedrock. For the first time, AWS customers can access OpenAI frontier models through the same Bedrock&nbsp;services&nbsp;they already use for model access, fine-tuning, and orchestration. OpenAI models&nbsp;on&nbsp;Bedrock&nbsp;inherit the enterprise controls customers depend on,&nbsp;including IAM, AWS&nbsp;PrivateLink, guardrails,&nbsp;encryption, and CloudTrail logging. Second, Codex&nbsp;on&nbsp;Amazon&nbsp;Bedrock&nbsp;brings&nbsp;the&nbsp;OpenAI&nbsp;coding agent&nbsp;into the AWS environments where enterprise teams already build. Customers authenticate with AWS credentials&nbsp;and&nbsp;run&nbsp;inference through&nbsp;Bedrock.&nbsp;Codex will be available through&nbsp;Bedrock&nbsp;via&nbsp;the Codex CLI, desktop app, and VS Code extension.&nbsp;Usage of both OpenAI models and Codex can be applied toward existing AWS&nbsp;cloud commitments.&nbsp;Lastly, Amazon&nbsp;Bedrock&nbsp;Managed Agents, powered by OpenAI, makes it fast to deploy production-ready OpenAI-powered agents&nbsp;on&nbsp;AWS.&nbsp;At the core are the latest OpenAI frontier models and the OpenAI agent harness, engineered for faster execution, sharper reasoning, and reliable steering of long-running tasks. Every agent has&nbsp;its&nbsp;own identity,&nbsp;logs&nbsp;each action, and runs&nbsp;in&nbsp;your environment with all&nbsp;inference&nbsp;on&nbsp;Amazon&nbsp;Bedrock. Managed Agents works with Amazon&nbsp;Bedrock&nbsp;AgentCore, which provides&nbsp;the default&nbsp;compute&nbsp;environment.</p> \n<p>Read the&nbsp;<a href=\"http://aboutamazon.com/news/aws/bedrock-openai-models\">blog</a>&nbsp;to learn more. To follow our progress and be among the first to hear about the latest updates, register&nbsp;<a href=\"https://pages.awscloud.com/GLOBAL-ln-GC-openai-bedrock-interest.html\">here</a>.</p>"
  "d3d19ca9facb47cbc8c6d8dd71dc6317":
    "id": "d3d19ca9facb47cbc8c6d8dd71dc6317"
    "title": "AWS Glue 5.1 is now available in all AWS Commercial and AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-glue-5-1-all-govcloud-commercial-regions/"
    "published": "2026-04-29 03:44:00"
    "fetched": "2026-04-29 05:12:32"
    "summary": "<p>AWS Glue 5.1 is now available in the Asia Pacific (New Zealand), AWS GovCloud (US-West) and AWS GovCloud (US-East) Regions.<br /> <br /> <a href=\"https://aws.amazon.com/glue/\">AWS Glue</a> is a serverless, scalable data integration service that simplifies discovering, preparing, moving, and integrating data from multiple sources. AWS Glue 5.1 upgrades core engines to Apache Spark 3.5.6, Python 3.11, and Scala 2.12.18, bringing performance and security enhancements. This release also updates support for open table format libraries, including Apache Hudi 1.0.2, Apache Iceberg 1.10.0, and Delta Lake 3.3.2. Additionally, AWS Glue 5.1 introduces support for Apache Iceberg format version 3.0, adding default column values, deletion vectors for merge-on-read tables, multi-argument transforms, and row lineage tracking. This release extends <a href=\"https://aws.amazon.com/lake-formation/\">AWS Lake Formation</a> fine-grained access control to write operations - both DML and DDL - for Spark DataFrames and Spark SQL. Previously, this capability was limited to read operations only. AWS Glue 5.1 also adds full-table access control in Apache Spark for Apache Hudi and Delta Lake tables, providing more comprehensive security options for your data.<br /> <br /> With this expansion, AWS Glue 5.1 is now available all AWS commercial and AWS GovCloud (US) Regions.<br /> <br /> You can get started with AWS Glue 5.1 using AWS APIs, AWS CLI, AWS SDK, or AWS Glue Studio. To learn more, visit the AWS Glue <a href=\"https://aws.amazon.com/glue/\">product page</a> and our <a href=\"https://docs.aws.amazon.com/glue/latest/dg/release-notes.html\">documentation</a>.&nbsp;</p>"
  "8f89a34719ceba6c8acb52a679fb3b96":
    "id": "8f89a34719ceba6c8acb52a679fb3b96"
    "title": "AWS Cost Optimization Hub now supports CSV download"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-cost-optimization-hub-csv-download/"
    "published": "2026-04-29 02:00:00"
    "fetched": "2026-04-29 05:12:32"
    "summary": "<p>AWS Cost Optimization Hub now supports direct CSV download in the console, enabling you to export your cost optimization recommendations to your local machine with a single click. This capability provides a one click export option directly from the console and complements the existing Data Export feature for automated exports to Amazon S3.</p> \n<p>With CSV download, you can instantly export recommendations that use your current console filters, sorting preferences, and grouping settings. The download begins immediately, making it easy to analyze recommendations in spreadsheet applications, share with stakeholders who don't have AWS console access, or work with recommendations offline in your preferred tools.</p> \n<p>This feature is available now in all regions where AWS Cost Optimization Hub is offered. To learn more, visit the <a href=\"https://aws.amazon.com/aws-cost-management/cost-optimization-hub/\">Cost Optimization Hub page</a>.</p>"
  "2c3b5bdae35baadb858999e2a8adb8ab":
    "id": "2c3b5bdae35baadb858999e2a8adb8ab"
    "title": "Amazon EC2 C8gn instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-c8gn-milan-hong-kong/"
    "published": "2026-04-29 01:00:00"
    "fetched": "2026-04-29 05:12:32"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances, powered by the latest-generation AWS Graviton4 processors, are available in the AWS&nbsp;Europe (Milan) and&nbsp;Asia Pacific (Hong Kong) regions. The new instances provide up to 30% better compute performance than Graviton3-based Amazon EC2 C7gn instances. Amazon EC2 C8gn instances feature the latest 6th generation AWS Nitro Cards, and offer up to 600 Gbps network bandwidth, the highest network bandwidth among network optimized EC2 instances.&nbsp;</p> \n<p>Take advantage of the enhanced networking capabilities of C8gn to scale performance and throughput, while optimizing the cost of running network-intensive workloads such as network virtual appliances, data analytics, CPU-based artificial&nbsp;intelligence&nbsp;and machine learning&nbsp;(AI/ML) inference.&nbsp;</p> \n<p>For increased scalability, C8gn instances offer instance sizes up to 48xlarge, up to 384 GiB of memory, and up to 120 Gbps of bandwidth to Amazon Elastic Block Store (EBS). C8gn instances support Elastic Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes, which enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.&nbsp;</p> \n<p>C8gn instances are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon, N.California), Europe (Frankfurt, Stockholm, Ireland, London, Spain, Zurich, Milan), Asia Pacific (Singapore, Malaysia, Sydney, Thailand, Mumbai, Seoul, Melbourne, Jakarta, Hyderabad, Tokyo, Hong Kong), Middle East (UAE), Africa (Cape Town), Canada West (Calgary,&nbsp;Central),&nbsp;South America (Sao Paulo), AWS GovCloud (US-East, US-West).<br /> &nbsp;<br /> To learn more, see&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon C8gn Instances</a>. To begin your Graviton journey, visit the&nbsp;<a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see&nbsp;<a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>,&nbsp;<a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and&nbsp;<a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>.</p>"
  "ed4ff917b5129bc78ce86d03b9f1dc40":
    "id": "ed4ff917b5129bc78ce86d03b9f1dc40"
    "title": "Amazon WorkSpaces Personal enhances PCoIP to DCV protocol migration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-workspaces-personal-pcoip/"
    "published": "2026-04-29 01:51:00"
    "fetched": "2026-04-29 06:54:07"
    "summary": "<p>Amazon WorkSpaces Personal now provides an enhanced experience for administrators migrating WorkSpaces from PCoIP to DCV protocol, including a guided console action for protocol modification, checkpoint snapshots for rollback support, and session blocking during migration.<br /> <br /> Amazon DCV is a high-performance streaming protocol built by AWS that powers Amazon WorkSpaces services. By migrating to DCV, customers gain access to broader operating system support including Windows 11 and Windows Server 2025, enhanced security features such as certificate-based authentication and WebAuthN, and improved streaming performance. Administrators can now modify a WorkSpace's streaming protocol directly from the AWS Management Console through a single-click action, in addition to the existing command line interface (CLI) and API methods. Before migration begins, WorkSpaces automatically takes a checkpoint snapshot, enabling administrators to restore to a known-good state if migration fails, ensuring no data loss. Session provisioning is also blocked during migration with clear error messaging for end users who attempt to connect, preventing connection attempts from interfering with the migration process. Together, these enhancements help administrators migrate WorkSpaces to DCV with greater confidence and operational simplicity.<br /> <br /> These enhancements are available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> where Amazon WorkSpaces Personal is supported.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\">Amazon WorkSpaces console</a>. For more information, see <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/modify-workspaces.html#modify_protocols\">Modify protocols section</a> in the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html\">Amazon WorkSpaces Administration Guide</a>. To learn more about Amazon WorkSpaces, visit the <a href=\"https://aws.amazon.com/workspaces/\">Amazon WorkSpaces product page</a>.</p>"
"last_updated": "2026-04-29 06:54:07 JST"
