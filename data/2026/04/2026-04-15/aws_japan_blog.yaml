    "summary": "スギ薬局様では、現場の業務課題と技術を組織的に結びつける体制のもと、Amazon Bedrock を活用した年末調整 QA ボットと調剤医薬品在庫確認エージェントを構築。成果が次の AI 活用を呼ぶサイクルが回り始めています。"
