    "title": "Amazon Quick Introduces Sheet Tooltips for Rich, Contextual Data Exploration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/quick-sheet-tooltips/"
    "published": "2026-04-15 15:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/quick/quicksight/\" rel=\"noopener noreferrer\" target=\"_blank\">Quick Sight in Amazon Quick</a> now supports sheet tooltips, enabling authors to surface rich, contextual detail when viewers hover over data points — without disrupting their analysis flow. Sheet tooltips allow authors to create dedicated tooltip sheets containing visuals, text boxes, and images arranged in a free-form layout. When a viewer hovers over a data point, the tooltip sheet automatically inherits all filters from the source visual and applies an additional filter for the specific data point, delivering an instant, focused breakdown.</p> \n<p>This enhancement helps organizations build more intuitive dashboards that reduce the need for multiple sheets or manual navigation. For example, a bar chart showing sales by product category can surface a trend line of monthly sales, a year-over-year growth KPI, and a text box with the category name — all filtered to whichever category the viewer hovers over. Authors can assign one tooltip sheet to multiple visuals, switch between basic, detailed, and sheet tooltip types at any time, and tables and pivot tables are also supported. Sheet tooltips are available on interactive sheets only.</p> \n<p>This feature is now available in all Amazon Quick <a href=\"https://docs.aws.amazon.com/quicksuite/latest/userguide/regions.html\" rel=\"noopener noreferrer\" target=\"_blank\">regions where Quick Sight is supported.</a> Learn more about how to <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/customizing-visual-tooltips.html#customizing-visual-tooltips-sheet\" rel=\"noopener noreferrer\" target=\"_blank\">use sheet tooltips</a> in Amazon Quick and read more about this new feature in <a href=\"https://aws.amazon.com/blogs/machine-learning/create-rich-custom-tooltips-in-amazon-quick-sight/\" rel=\"noopener noreferrer\" target=\"_blank\">our blog post</a>.</p>"
