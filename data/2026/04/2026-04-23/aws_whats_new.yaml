    "title": "Amazon SageMaker Unified Studio now supports VPC for notebook kernels"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-unified-studio-vpc/"
    "published": "2026-04-23 00:57:00"
    "fetched": "2026-04-24 00:49:15"
    "summary": "<p>Amazon SageMaker Unified Studio now supports Amazon Virtual Private Cloud (Amazon VPC) for notebook kernels. With this launch, notebook kernels execute within the VPC configured at the domain level, giving enterprises network isolation for interactive data and machine learning (ML) workloads. This helps customers meet security and compliance requirements by keeping applicable notebook compute traffic within their VPC boundaries.</p> \n<p>With VPC support for notebook kernels, data engineers, analysts, and data scientists can connect to private resources from their notebooks. The notebook kernel inherits the VPC settings, subnets, and security groups defined at the SageMaker Unified Studio domain level, so administrators can manage network policies centrally. This means you can query private databases, access internal APIs, and work with data sources that are not publicly accessible, all from the same notebook environment that supports SQL, Python, and natural language through the built-in data agent. This VPC configuration only applies to the notebook's interactive compute, where your Python code and dataframes execute. For VPC configurations with other compute engines, refer to the documentation for each individual engine.</p> \n<p>You can use VPC-enabled notebook kernels in <a href=\"https://www.google.com/url?sa=t&amp;source=web&amp;rct=j&amp;opi=89978449&amp;url=https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html&amp;ved=2ahUKEwjo8d7u8vyTAxXNHjQIHRT0KKIQFnoECBgQAQ&amp;usg=AOvVaw3H9HTpx1fPYLIDdE0yougk\">all AWS Regions where Amazon SageMaker Unified Studio is supported</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\">SageMaker Unified Studio user guide</a> and the Amazon SageMaker product page.</p>"
