"entries":
  "eabc9bc1059fb8559287363248196431":
    "id": "eabc9bc1059fb8559287363248196431"
    "title": "Amazon SageMaker Unified Studio now supports VPC for notebook kernels"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-unified-studio-vpc/"
    "published": "2026-04-23 09:57:00"
    "fetched": "2026-04-24 00:49:15"
    "summary": "<p>Amazon SageMaker Unified Studio now supports Amazon Virtual Private Cloud (Amazon VPC) for notebook kernels. With this launch, notebook kernels execute within the VPC configured at the domain level, giving enterprises network isolation for interactive data and machine learning (ML) workloads. This helps customers meet security and compliance requirements by keeping applicable notebook compute traffic within their VPC boundaries.</p> \n<p>With VPC support for notebook kernels, data engineers, analysts, and data scientists can connect to private resources from their notebooks. The notebook kernel inherits the VPC settings, subnets, and security groups defined at the SageMaker Unified Studio domain level, so administrators can manage network policies centrally. This means you can query private databases, access internal APIs, and work with data sources that are not publicly accessible, all from the same notebook environment that supports SQL, Python, and natural language through the built-in data agent. This VPC configuration only applies to the notebook's interactive compute, where your Python code and dataframes execute. For VPC configurations with other compute engines, refer to the documentation for each individual engine.</p> \n<p>You can use VPC-enabled notebook kernels in <a href=\"https://www.google.com/url?sa=t&amp;source=web&amp;rct=j&amp;opi=89978449&amp;url=https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html&amp;ved=2ahUKEwjo8d7u8vyTAxXNHjQIHRT0KKIQFnoECBgQAQ&amp;usg=AOvVaw3H9HTpx1fPYLIDdE0yougk\">all AWS Regions where Amazon SageMaker Unified Studio is supported</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\">SageMaker Unified Studio user guide</a> and the Amazon SageMaker product page.</p>"
  "d0de63d0c458eada97b1f612a9ef0687":
    "id": "d0de63d0c458eada97b1f612a9ef0687"
    "title": "Amazon Redshift supports UPDATE, DELETE, MERGE for Apache Iceberg tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/redshift-update-delete-merge-iceberg-tables/"
    "published": "2026-04-24 00:00:00"
    "fetched": "2026-04-24 02:16:39"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> now supports row-level UPDATE, DELETE, and MERGE operations on Apache Iceberg tables. Customers who use Iceberg to build interoperable data lakes can now perform data manipulation language (DML) operations directly from Amazon Redshift, without moving data to external processing engines. Previously, modifying individual rows in Iceberg tables required using separate engines, adding complexity and latency to data pipelines.<br /> <br /> With this launch, you can run UPDATE, DELETE, and MERGE (UPSERT) statements on both partitioned and unpartitioned Iceberg tables, including S3 Tables. Supported Iceberg partition transforms include identity, bucket, truncate, year, month, day, and hour. MERGE enables you to combine insert and update logic in a single statement for common data integration patterns such as change data capture and slowly changing dimensions. Tables modified by Redshift are compatible with other Iceberg-compatible engines, including Amazon EMR and Amazon Athena, preserving cross-engine interoperability. AWS Lake Formation permissions are supported for Iceberg write operations.<br /> <br /> Amazon Redshift support for UPDATE, DELETE, and MERGE commands on Apache Iceberg tables is available in all AWS Regions where Amazon Redshift is available. To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-writes.html\">Writing to Apache Iceberg tables</a> section in the Amazon Redshift Database Developer Guide, where you will also find documentation for the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-writes-sql-syntax.html\">SQL syntax</a>.</p>"
  "13563b72f6af4578977574a950166d50":
    "id": "13563b72f6af4578977574a950166d50"
    "title": "Amazon Quick now supports multiple owners for admin-managed SharePoint and Google Drive knowledge bases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-sharepoint/"
    "published": "2026-04-24 00:59:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon Quick now enables you to add co-owners to knowledge bases and data source connections for admin-managed Microsoft SharePoint Online and Google Drive integrations. This makes it easier to collaborate across teams and reuse existing connections without re-entering credentials.<br /> <br /> Knowledge base owners can share their knowledge bases with two roles: Owner (full management access including editing, syncing, sharing, and deleting) and Viewer (query-only access). Co-owner sharing with the Owner role is available exclusively for admin-managed SharePoint and Google Drive knowledge bases. All other knowledge base types support Viewer sharing only. To share, navigate to the actions menu next to any knowledge base or use the Permissions tab.<br /> <br /> Administrators can also share data source connections, allowing other users to create knowledge bases from the same connection. Data source sharing supports Owner (create knowledge bases and edit connection details) and Viewer (create knowledge bases only) roles. To share a data source, go to Manage account &gt; Manage assets &gt; Data sources and select the connection to share.<br /> <br /> This feature is available in all AWS Regions where Amazon Quick is available. For more information, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/sharing-kb-datasources.html\" target=\"_blank\">Knowledge Base Sharing</a> in the Amazon Quick User Guide.<br /> <br /> Amazon Quick is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London), and Europe (Ireland). For more information, visit the <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">Amazon Quick page</a>.</p>"
  "05090ffabc03c7edff114ae246afad87":
    "id": "05090ffabc03c7edff114ae246afad87"
    "title": "Amazon Quick now supports permission verification for ACL-enabled knowledge bases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-acl/"
    "published": "2026-04-23 23:56:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon Quick now provides ACL verification for ACL enabled knowledge bases, enabling administrators to check whether a specific user has access to a specific document. This feature simplifies troubleshooting access issues and helps confirm that sensitive documents are properly restricted, without manually tracing permission inheritance across your data sources.<br /> <br /> To verify document access, open a knowledge base with document-level ACLs enabled, navigate to the <b>Sync reports</b> tab, and choose <b>View Access Details</b> from the actions menu next to any synced item. From the Access Details panel, use the <b>Permission Checker</b> to enter a user's email address and instantly confirm whether they can access the document. The panel also displays all users and groups with access to the document, giving you full visibility into the applied permissions.<br /> The Permission Checker returns one of three results: the user has access, the user does not have access, or no ACL was found for the document.&nbsp;</p> \n<p><br /> This feature is available for ACL enabled Knowledge Bases in all AWS Regions where Amazon Quick is available. For more information, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/sync-reports-observability.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sync reports and observability</a> in the Amazon Quick User Guide.<br /> <br /> Amazon Quick is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London), and Europe (Ireland). For more information, visit the <a href=\"https://aws.amazon.com/quick/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick page</a>.</p>"
  "d36798a052f49b31889211f085a063b3":
    "id": "d36798a052f49b31889211f085a063b3"
    "title": "Amazon S3 now supports five additional checksum algorithms"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/s3-five-additional-checksum-algorithms/"
    "published": "2026-04-23 22:00:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon S3 now supports five additional checksum algorithms: MD5, XXHash3, XXHash64, XXHash128, and SHA-512, bringing the total to ten. S3 validates and stores the checksum alongside your object for any of these supported algorithms, so you can verify data integrity end to end without additional tooling.<br /> <br /> When uploading objects, you can provide a checksum value and S3 validates it against the uploaded data before storing the object. For multipart uploads, you provide part-level checksums and S3 calculates a composite checksum upon completion. If you do not provide a checksum on upload, S3 automatically calculates and applies a CRC64NVME checksum as default integrity protection. Similarly, you can request the stored checksum when downloading to verify your data. The new algorithms work with S3 Replication, so you can replicate objects across buckets while preserving checksums, as well as S3 Inventory so you can audit checksums for datasets over time. For pre-existing objects that were uploaded without a checksum or with a different algorithm, you can use S3 Batch Operations to calculate checksums at scale without downloading or restoring data.<br /> <br /> The new checksum algorithms are available at no additional cost across 37 AWS Regions, including the AWS China and AWS GovCloud (US) Regions. You can get started using the AWS CLI or AWS SDKs. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 User Guide</a>.</p>"
  "a75843b0f3cccda50b9c5f766339ed73":
    "id": "a75843b0f3cccda50b9c5f766339ed73"
    "title": "Amazon SageMaker supports notebooks and data agent for IdC domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-idc/"
    "published": "2026-04-24 04:13:00"
    "fetched": "2026-04-24 05:48:24"
    "summary": "<p>Amazon SageMaker Unified Studio now supports serverless notebooks with a built-in data agent for AWS IAM Identity Center (IdC) domains. Previously, the notebook experience and data agent were available only in IAM domains. With this launch, customers who use IdC for authentication and access management can access the high-performance, serverless notebook environment for analytics and machine learning (ML) workloads.</p> \n<p>The serverless notebook gives data engineers, analysts, and data scientists one place to perform SQL queries, execute Python code, process large-scale data jobs, run ML workloads, and create visualizations. A built-in AI data agent accelerates development by generating code and SQL statements from natural language prompts and guides users through their tasks. Customers can flexibly combine SQL, Python, and natural language within a single interactive workspace, removing the need to switch between different tools based on the workload. For example, you can start with SQL queries to explore your data, use Python for advanced analytics or to build ML models, or use natural language prompts to generate code automatically. The notebook is backed by Amazon Athena for Apache Spark, scaling from interactive SQL queries to petabyte-scale data processing.</p> \n<p>You can use the SageMaker notebook and data agent features in <a href=\"https://www.google.com/url?sa=t&amp;source=web&amp;rct=j&amp;opi=89978449&amp;url=https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html&amp;ved=2ahUKEwjo8d7u8vyTAxXNHjQIHRT0KKIQFnoECBgQAQ&amp;usg=AOvVaw3H9HTpx1fPYLIDdE0yougk\">all AWS Regions where Amazon SageMaker Unified Studio is supported</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\">SageMaker notebooks user guide</a> and the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/sagemaker-data-agent.html\">SageMaker data agent user guide</a>.&nbsp;</p>"
  "550cc20b3a98e5477aab1f37480174dc":
    "id": "550cc20b3a98e5477aab1f37480174dc"
    "title": "Attributed Revenue Dashboard Now Available in AWS Partner Central"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/attributed-revenue-dashboard-launch/"
    "published": "2026-04-24 01:30:00"
    "fetched": "2026-04-24 05:48:24"
    "summary": "<p>Today, AWS announces the launch of the <a href=\"https://aws.amazon.com/blogs/apn/unlock-revenue-insights-in-the-new-attributed-revenue-dashboard/\">Attributed Revenue dashboard</a> in AWS Partner Central in the AWS Console, giving Partners self-service visibility into the revenue impact of their solutions as measured by Partner Revenue Measurement. The dashboard displays aggregated monthly attributed revenue by Partner product, AWS service, and billing period. It provides consolidated insights from all three Partner Revenue Measurement capabilities—<a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/resource-tagging.html\">Resource Tagging</a>, <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent string</a>, and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering-prerequisites.html\">AWS Marketplace Metering</a>—in a single view.</p> \n<p>Partners who implement Partner Revenue Measurement can now access the Attributed Revenue Dashboard through Partner Analytics to view monthly consumption patterns, monitor revenue trends over time, and verify that their implementation is actively measuring AWS service consumption driven by their solutions. Partners with multiple AWS Marketplace seller accounts can <a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/manage-subsidiary.html\">connect subsidiary accounts</a>&nbsp;to see aggregated revenue across all connected accounts.</p> \n<p>The Attributed Revenue Dashboard is available in all commercial regions for Partners that have <a href=\"https://partnercentral.awspartner.com/partnercentral2/s/login?ec=302&amp;startURL=%2Fpartnercentral2%2Fs%2Farticle%3Fcategory%3DIntroductory_resources%26article%3DPartner-Central-Migration-Guide\">migrated to AWS Partner Central in the AWS Console</a>. To learn more about Partner Revenue Measurement, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a>.</p>"
  "0a49b6dd80d0065c07b06ec4bf9be116":
    "id": "0a49b6dd80d0065c07b06ec4bf9be116"
    "title": "AWS Elastic Beanstalk AI-powered environment analysis now supports Windows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/elastic-beanstalk-ai-analysis-windows/"
    "published": "2026-04-24 01:00:00"
    "fetched": "2026-04-24 05:48:24"
    "summary": "<p>AWS Elastic Beanstalk AI-powered environment analysis is now available on Windows Server platforms. Previously available on Amazon Linux 2 and AL2023, this feature now extends to Windows-based environments, enabling you to quickly identify root causes and get recommended solutions for environment health issues. Elastic Beanstalk collects recent events, instance health, and logs from your Windows environment and sends them to Amazon Bedrock for analysis.<br /> <br /> With this expansion, developers and operations teams running .NET applications and other Windows workloads on Elastic Beanstalk can now diagnose and resolve environment issues faster without manually reviewing logs and events. You can request an AI analysis from the Elastic Beanstalk console using the AI Analysis button or using the AWS CLI with the RequestEnvironmentInfo and RetrieveEnvironmentInfo API operations. The analysis provides step-by-step troubleshooting recommendations tailored to your Windows environment's current state.</p> \n<p>AI-powered environment analysis is available in all AWS Regions where both AWS Elastic Beanstalk and Amazon Bedrock are available.<br /> <br /> For more information about the AI-powered environment analysis and for a full list of supported platform versions, see the Elastic Beanstalk&nbsp;<a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/health-ai-analysis.html\">developer guide</a>. To learn more about Elastic Beanstalk, visit the Elastic Beanstalk&nbsp;<a href=\"https://aws.amazon.com/elasticbeanstalk/\">product page</a>.</p>"
  "a1e65870660a15213ddbd8c40783462f":
    "id": "a1e65870660a15213ddbd8c40783462f"
    "title": "Second-generation AWS Outposts racks now supported in the AWS Asia Pacific (Seoul, Sydney) and Europe (Paris) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/second-generation-aws-outposts-racks-sydney-seoul-paris/"
    "published": "2026-04-24 01:00:00"
    "fetched": "2026-04-24 05:48:24"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the AWS Asia Pacific (Seoul, Sydney) and Europe (Paris) Regions. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.<br /> <br /> Organizations from startups to enterprises and the public sector in and outside of South Korea, Australia, and France can now order their Outposts racks connected to this new supported region, optimizing for their latency and data residency needs. Outposts allows customers to run workloads that need low latency access to on-premises systems locally while connecting back to their home Region for application management. Customers can also use Outposts and AWS services to manage and process data that needs to remain on-premises to meet data residency requirements. This regional expansion provides additional flexibility in the AWS Regions that customers’ Outposts can connect to.<br /> <br /> To learn more about second-generation Outposts racks, read <a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>this blog post</u></a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>user guide</u></a>. For the most updated list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, check out the <a href=\"https://aws.amazon.com/outposts/rack/faqs/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Outposts rack FAQs page</u></a>.</p>"
  "8efcc736698398e426635b5e24aa9dd2":
    "id": "8efcc736698398e426635b5e24aa9dd2"
    "title": "AWS Parallel Computing Service now supports Slurm 25.11"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-pcs-slurm-25-11/"
    "published": "2026-04-24 05:00:00"
    "fetched": "2026-04-24 06:42:07"
    "summary": "<p>AWS Parallel Computing Service (AWS PCS) now supports Slurm version 25.11, with support for a Prometheus-compatible OpenMetrics endpoint, and introduces new log types including scheduler audit logs.<br /> <br /> This release of Slurm 25.11 introduces expedited re-queue, which can automatically reschedule jobs affected by node issues at the highest priority to help your workloads recover faster. You can enable a new OpenMetrics endpoint for real-time visibility into jobs, nodes, and scheduling using your existing monitoring tools. AWS PCS can now also send Slurm database daemon (slurmdbd) and REST API daemon (slurmrestd) logs to Amazon CloudWatch Logs, Amazon S3, or Amazon Data Firehose, helping diagnose accounting issues and debug API integrations. Scheduler audit logs, previously included in operational logs, are now delivered as a dedicated log type, providing independent control over ingestion and storage costs.<br /> <br /> AWS PCS is a managed service that makes it easier for you to run and scale your high performance computing (HPC) workloads and build scientific and engineering models on AWS using Slurm. You can use AWS PCS to build complete, elastic environments that integrate compute, storage, networking, and visualization tools. AWS PCS simplifies cluster operations with managed updates and built-in observability features, helping to remove the burden of maintenance. You can work in a familiar environment, focusing on your research and innovation instead of worrying about infrastructure.<br /> <br /> These features are available in all AWS Regions where AWS PCS is available. Standard charges apply for log delivery destinations. To learn more about AWS PCS, refer to the <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/what-is-service.html\">service documentation</a>.</p>"
  "8e1b25ebbfd5beaa9c8f39d1637bc816":
    "id": "8e1b25ebbfd5beaa9c8f39d1637bc816"
    "title": "AWS Backup expands support for Amazon Aurora PITR to six Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-backup-amazon-aurora-pitr/"
    "published": "2026-04-23 19:00:00"
    "fetched": "2026-04-24 06:42:07"
    "summary": "<p>AWS Backup support for Amazon Aurora Point-in-time Recovery (PITR) is now available in six additional AWS Regions: Asia Pacific (Malaysia, Thailand, Taipei, New Zealand), Canada West (Calgary) and Mexico (Central).</p> \n<p>This expansion brings policy-based data protection and recovery with support for PITR to your Amazon Aurora clusters in these newly supported Regions.</p> \n<p>To start protecting your Aurora clusters with support for PITR utilizing AWS Backup, add your Aurora clusters to your existing backup plans, or create a new backup plan and attach your Aurora clusters to it. Ensure continuous backups or PITR is enabled on the associated backup rule. To learn more about AWS Backup for Amazon Aurora, visit the <a href=\"https://aws.amazon.com/backup/\">product page</a>, <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>, and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html\">documentation</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/backup\">AWS Backup console</a>, AWS Command Line Interface (CLI), or AWS SDKs.</p>"
  "b708e63bbad2e81724f91f17c1302a9f":
    "id": "b708e63bbad2e81724f91f17c1302a9f"
    "title": "Amazon Athena simplifies federated queries with managed connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-athena/"
    "published": "2026-04-24 06:15:00"
    "fetched": "2026-04-24 07:36:02"
    "summary": "<p><a href=\"https://aws.amazon.com/athena\">Amazon Athena</a> now offers managed connectors for 12 data sources, including Amazon DynamoDB, PostgreSQL, MySQL, and Snowflake. Managed connectors are AWS Glue Data Catalog federated connectors that Athena creates and manages on your behalf, so you can query data outside Amazon S3 without deploying or maintaining connector resources in your AWS account.<br /> <br /> With Athena, you can interactively query relational, non-relational, object, and custom data sources without moving or duplicating data. To get started with managed connectors, you create a connection for your data source in Athena. Athena automatically sets up and manages connector resources on your behalf, registering the data source as a federated catalog in AWS Glue Data Catalog. You can then query the data source alongside your Amazon S3 data and optionally set up fine-grained access controls through AWS Lake Formation.<br /> <br /> Federated queries with managed connectors are available in all AWS Regions where Athena is available, except the AWS GovCloud (US) Regions and the China Regions.<br /> <br /> To learn more, visit&nbsp;<a href=\"https://docs.aws.amazon.com/athena/latest/ug/federated-queries.html\">Use Amazon Athena Federated Query</a> in the Athena User Guide.</p>"
  "a400e778673b483e25d84c39a8904787":
    "id": "a400e778673b483e25d84c39a8904787"
    "title": "Amazon EC2 X8g instances now available in Europe (Ireland) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-x8g-instances-europe-ireland/"
    "published": "2026-04-24 00:00:00"
    "fetched": "2026-04-24 07:36:02"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8g instances are available in Europe (Ireland) region. These instances are powered by AWS Graviton4 processors and deliver up to 60% better performance than AWS Graviton2-based Amazon EC2 X2gd instances. X8g instances offer up to 3 TiB of total memory and increased memory per vCPU compared to other Graviton4-based instance. They have the best price performance among EC2 X-series instances, and are ideal for memory-intensive workloads such as electronic design automation (EDA) workloads, in-memory databases (Redis, Memcached), relational databases (MySQL, PostgreSQL), real-time big data analytics, real-time caching servers, and memory-intensive containerized applications.<br /> <br /> X8g instances offer larger instance sizes with up to 3x more vCPU (up to 48xlarge) and memory (up to 3TiB) than Graviton2-based X2gd instances. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Elastic Fabric Adapter (EFA) networking support is offered on 24xlarge, 48xlarge, and bare metal sizes, and Elastic Network Adapter (ENA) Express support is available on instance sizes larger than 12xlarge.<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/x8g/\">Amazon EC2 X8g Instances</a>. To quickly migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>.</p>"
"last_updated": "2026-04-24 07:36:02 JST"
