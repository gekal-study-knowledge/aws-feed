  "eabc9bc1059fb8559287363248196431":
    "id": "eabc9bc1059fb8559287363248196431"
    "title": "Amazon SageMaker Unified Studio now supports VPC for notebook kernels"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-unified-studio-vpc/"
    "published": "2026-04-23 00:57:00"
    "fetched": "2026-04-24 00:49:15"
    "summary": "<p>Amazon SageMaker Unified Studio now supports Amazon Virtual Private Cloud (Amazon VPC) for notebook kernels. With this launch, notebook kernels execute within the VPC configured at the domain level, giving enterprises network isolation for interactive data and machine learning (ML) workloads. This helps customers meet security and compliance requirements by keeping applicable notebook compute traffic within their VPC boundaries.</p> \n<p>With VPC support for notebook kernels, data engineers, analysts, and data scientists can connect to private resources from their notebooks. The notebook kernel inherits the VPC settings, subnets, and security groups defined at the SageMaker Unified Studio domain level, so administrators can manage network policies centrally. This means you can query private databases, access internal APIs, and work with data sources that are not publicly accessible, all from the same notebook environment that supports SQL, Python, and natural language through the built-in data agent. This VPC configuration only applies to the notebook's interactive compute, where your Python code and dataframes execute. For VPC configurations with other compute engines, refer to the documentation for each individual engine.</p> \n<p>You can use VPC-enabled notebook kernels in <a href=\"https://www.google.com/url?sa=t&amp;source=web&amp;rct=j&amp;opi=89978449&amp;url=https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html&amp;ved=2ahUKEwjo8d7u8vyTAxXNHjQIHRT0KKIQFnoECBgQAQ&amp;usg=AOvVaw3H9HTpx1fPYLIDdE0yougk\">all AWS Regions where Amazon SageMaker Unified Studio is supported</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\">SageMaker Unified Studio user guide</a> and the Amazon SageMaker product page.</p>"
  "d0de63d0c458eada97b1f612a9ef0687":
    "id": "d0de63d0c458eada97b1f612a9ef0687"
    "title": "Amazon Redshift supports UPDATE, DELETE, MERGE for Apache Iceberg tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/redshift-update-delete-merge-iceberg-tables/"
    "published": "2026-04-23 15:00:00"
    "fetched": "2026-04-24 02:16:39"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> now supports row-level UPDATE, DELETE, and MERGE operations on Apache Iceberg tables. Customers who use Iceberg to build interoperable data lakes can now perform data manipulation language (DML) operations directly from Amazon Redshift, without moving data to external processing engines. Previously, modifying individual rows in Iceberg tables required using separate engines, adding complexity and latency to data pipelines.<br /> <br /> With this launch, you can run UPDATE, DELETE, and MERGE (UPSERT) statements on both partitioned and unpartitioned Iceberg tables, including S3 Tables. Supported Iceberg partition transforms include identity, bucket, truncate, year, month, day, and hour. MERGE enables you to combine insert and update logic in a single statement for common data integration patterns such as change data capture and slowly changing dimensions. Tables modified by Redshift are compatible with other Iceberg-compatible engines, including Amazon EMR and Amazon Athena, preserving cross-engine interoperability. AWS Lake Formation permissions are supported for Iceberg write operations.<br /> <br /> Amazon Redshift support for UPDATE, DELETE, and MERGE commands on Apache Iceberg tables is available in all AWS Regions where Amazon Redshift is available. To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-writes.html\">Writing to Apache Iceberg tables</a> section in the Amazon Redshift Database Developer Guide, where you will also find documentation for the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-writes-sql-syntax.html\">SQL syntax</a>.</p>"
  "13563b72f6af4578977574a950166d50":
    "id": "13563b72f6af4578977574a950166d50"
    "title": "Amazon Quick now supports multiple owners for admin-managed SharePoint and Google Drive knowledge bases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-sharepoint/"
    "published": "2026-04-23 15:59:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon Quick now enables you to add co-owners to knowledge bases and data source connections for admin-managed Microsoft SharePoint Online and Google Drive integrations. This makes it easier to collaborate across teams and reuse existing connections without re-entering credentials.<br /> <br /> Knowledge base owners can share their knowledge bases with two roles: Owner (full management access including editing, syncing, sharing, and deleting) and Viewer (query-only access). Co-owner sharing with the Owner role is available exclusively for admin-managed SharePoint and Google Drive knowledge bases. All other knowledge base types support Viewer sharing only. To share, navigate to the actions menu next to any knowledge base or use the Permissions tab.<br /> <br /> Administrators can also share data source connections, allowing other users to create knowledge bases from the same connection. Data source sharing supports Owner (create knowledge bases and edit connection details) and Viewer (create knowledge bases only) roles. To share a data source, go to Manage account &gt; Manage assets &gt; Data sources and select the connection to share.<br /> <br /> This feature is available in all AWS Regions where Amazon Quick is available. For more information, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/sharing-kb-datasources.html\" target=\"_blank\">Knowledge Base Sharing</a> in the Amazon Quick User Guide.<br /> <br /> Amazon Quick is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London), and Europe (Ireland). For more information, visit the <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">Amazon Quick page</a>.</p>"
  "05090ffabc03c7edff114ae246afad87":
    "id": "05090ffabc03c7edff114ae246afad87"
    "title": "Amazon Quick now supports permission verification for ACL-enabled knowledge bases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-acl/"
    "published": "2026-04-23 14:56:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon Quick now provides ACL verification for ACL enabled knowledge bases, enabling administrators to check whether a specific user has access to a specific document. This feature simplifies troubleshooting access issues and helps confirm that sensitive documents are properly restricted, without manually tracing permission inheritance across your data sources.<br /> <br /> To verify document access, open a knowledge base with document-level ACLs enabled, navigate to the <b>Sync reports</b> tab, and choose <b>View Access Details</b> from the actions menu next to any synced item. From the Access Details panel, use the <b>Permission Checker</b> to enter a user's email address and instantly confirm whether they can access the document. The panel also displays all users and groups with access to the document, giving you full visibility into the applied permissions.<br /> The Permission Checker returns one of three results: the user has access, the user does not have access, or no ACL was found for the document.&nbsp;</p> \n<p><br /> This feature is available for ACL enabled Knowledge Bases in all AWS Regions where Amazon Quick is available. For more information, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/sync-reports-observability.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sync reports and observability</a> in the Amazon Quick User Guide.<br /> <br /> Amazon Quick is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London), and Europe (Ireland). For more information, visit the <a href=\"https://aws.amazon.com/quick/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick page</a>.</p>"
  "d36798a052f49b31889211f085a063b3":
    "id": "d36798a052f49b31889211f085a063b3"
    "title": "Amazon S3 now supports five additional checksum algorithms"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/s3-five-additional-checksum-algorithms/"
    "published": "2026-04-23 13:00:00"
    "fetched": "2026-04-24 04:03:06"
    "summary": "<p>Amazon S3 now supports five additional checksum algorithms: MD5, XXHash3, XXHash64, XXHash128, and SHA-512, bringing the total to ten. S3 validates and stores the checksum alongside your object for any of these supported algorithms, so you can verify data integrity end to end without additional tooling.<br /> <br /> When uploading objects, you can provide a checksum value and S3 validates it against the uploaded data before storing the object. For multipart uploads, you provide part-level checksums and S3 calculates a composite checksum upon completion. If you do not provide a checksum on upload, S3 automatically calculates and applies a CRC64NVME checksum as default integrity protection. Similarly, you can request the stored checksum when downloading to verify your data. The new algorithms work with S3 Replication, so you can replicate objects across buckets while preserving checksums, as well as S3 Inventory so you can audit checksums for datasets over time. For pre-existing objects that were uploaded without a checksum or with a different algorithm, you can use S3 Batch Operations to calculate checksums at scale without downloading or restoring data.<br /> <br /> The new checksum algorithms are available at no additional cost across 37 AWS Regions, including the AWS China and AWS GovCloud (US) Regions. You can get started using the AWS CLI or AWS SDKs. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 User Guide</a>.</p>"
