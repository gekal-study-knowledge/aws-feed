"overview": |
  この日はストレージとコンピュートの新機能・リージョン拡充が目立ちました。注目は Amazon S3 Files の提供開始で、S3 バケットを NFS v4.1 以降でファイルシステムとしてマウントでき、アクティブデータに約 1 ミリ秒のレイテンシーで複数コンピューティングから同時アクセスできます。コンピュートでは、最大 32GB メモリ (標準の 3 倍) を扱える AWS Lambda Managed Instances、カスタム Intel Xeon 6 搭載でメモリ最適化された EC2 X8i インスタンス (パリ追加) が紹介されました。ストレージ・バックアップでは第 2 世代 FSx for NetApp ONTAP が 4 リージョン追加、AWS Backup の FSx サポートとクロスリージョン/クロスアカウントコピーの拡大、S3 Lifecycle がレプリケーション失敗オブジェクトのアクションを一時停止する変更が加わりました。運用面では CloudWatch pipelines の条件付き処理・ドロップイベントプロセッサとコンプライアンス/ガバナンス機能、Billing ダッシュボードのスケジュールメール配信、Deadline Cloud のマルチリージョンモニター、RTB Fabric のヘルスチェック、Amazon Quick の S3 ナレッジベース向けドキュメントレベル ACL などが発表されました。国内では月刊 AWS 製造 4 月号も公開されました。
