    "title": "AWS Billing and Cost Management Dashboards Now Supports Scheduled Email Delivery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-billing-and-cost-management-dashboards-scheduled-email-delivery/"
    "published": "2026-04-10 15:00:00"
    "summary": "<p>AWS Billing and Cost Management Dashboards now support scheduled email delivery for your reports. You can now automate report distribution on flexible recurring schedules, eliminating manual compilation&nbsp;work&nbsp;and ensuring financial insights reach decision-makers without requiring console access.\"</p> \n<p>Scheduled email reports enable you to configure daily, weekly, or monthly delivery schedules for your dashboards.&nbsp;Recipients receive emails containing secure links to password-protected PDF reports optimized for offline viewing.&nbsp;Manage recipients through AWS User Notifications, and once configured, reports generate and distribute automatically on your chosen schedule. You can also access these capabilities programmatically through AWS SDKs and CLI tools.</p> \n<p>This feature is available at no&nbsp;additional&nbsp;cost in all commercial AWS Regions, excluding AWS China Regions. To get started, open the AWS Billing and Cost Management console, navigate to Dashboards, select a dashboard, and choose 'Manage email reports' from the Actions menu. For more information, see the&nbsp;<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/dashboards.html\">Dashboards user guide</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/automate-aws-cost-reporting-with-scheduled-dashboard-email-delivery/\">announcement blog post</a>.</p>"
  "db9ffa27daabd1e74eaeb54710766d47":
    "id": "db9ffa27daabd1e74eaeb54710766d47"
    "title": "Second-generation Amazon FSx for NetApp ONTAP is now available in four additional AWS commercial and AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/second-gen-amazon-fsx-ontap-regions/"
    "published": "2026-04-10 16:00:00"
    "summary": "<p>Amazon FSx for NetApp ONTAP second-generation file systems are now available in 4 additional AWS Regions: Europe (London), Asia Pacific (Hyderabad), South America (Sao Paulo), and&nbsp;AWS GovCloud (US-West).&nbsp;<br /> <br /> Amazon FSx makes it easier and more cost effective to launch, run, and scale feature-rich, high-performance file systems in the cloud. Second-generation <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\">FSx for ONTAP</a> file systems give you more performance scalability and flexibility over first-generation file systems by allowing you to create or expand file systems with up to 12 highly-available (HA) pairs of file servers, providing your workloads with up to 72 GBps of throughput and 1 PiB of provisioned SSD storage.<br /> <br /> With this regional expansion, second-generation FSx for ONTAP file systems are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (N. California, Oregon), Canada (Central), Europe (Frankfurt, Ireland, London, Spain, Stockholm, Zurich), South America (Sao Paulo), Asia Pacific (Hyderabad, Mumbai, Seoul, Singapore, Sydney, Tokyo), and AWS GovCloud (US-West). You can create second-generation Multi-AZ file systems with a single HA pair, and Single-AZ file systems with up to 12 HA pairs. To learn more, visit the <a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html\">FSx for ONTAP user guide</a>.</p> \n<h2>&nbsp;</h2>"
  "65c1061c7804c536260b9400a8506bd4":
    "id": "65c1061c7804c536260b9400a8506bd4"
    "title": "AWS Backup extends Amazon FSx support to 5 additional AWS Regions and expands cross-Region and cross-account copy to 14 AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/backup-extends-fsx-support/"
    "published": "2026-04-10 10:00:00"
    "summary": "<p>AWS Backup is expanding support for Amazon FSx for Windows File Server, Amazon FSx for OpenZFS, and Amazon FSx for Lustre with two regional enhancements.</p> \n<p>First, AWS Backup now supports backup and restore of these FSx file systems in 5 additional AWS Regions: Asia Pacific (Malaysia, Taipei, Thailand), Canada West (Calgary), and Mexico (Central). You can now centrally manage FSx backup policies, automate backup schedules, and monitor backup activity through AWS Backup in these Regions.</p> \n<p>Second, AWS Backup now supports cross-Region and cross-account copy of FSx backups in 14 Regions: Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Taipei, Thailand), Canada West (Calgary), Europe (Milan, Spain, Zurich), Israel (Tel Aviv), and Mexico (Central). This capability is available for both on-demand copies and scheduled backup plans with copy rules. With support in opt-in Regions, you can also store FSx backups in AWS Backup logically air-gapped vaults, providing additional defense against inadvertent or malicious deletions and helping you recover from ransomware events.</p> \n<p>You can now configure cross-Region and cross-account copy rules to meet your compliance and business continuity requirements. To learn more, visit the AWS Backup <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html\">feature availability page</a>.</p>"
