  "4e7e342225a1ebfa497e70f4b648d4cf":
    "id": "4e7e342225a1ebfa497e70f4b648d4cf"
    "title": "AWS Billing and Cost Management Dashboards Now Supports Scheduled Email Delivery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-billing-and-cost-management-dashboards-scheduled-email-delivery/"
    "published": "2026-04-10 15:00:00"
    "summary": "<p>AWS Billing and Cost Management Dashboards now support scheduled email delivery for your reports. You can now automate report distribution on flexible recurring schedules, eliminating manual compilation&nbsp;work&nbsp;and ensuring financial insights reach decision-makers without requiring console access.\"</p> \n<p>Scheduled email reports enable you to configure daily, weekly, or monthly delivery schedules for your dashboards.&nbsp;Recipients receive emails containing secure links to password-protected PDF reports optimized for offline viewing.&nbsp;Manage recipients through AWS User Notifications, and once configured, reports generate and distribute automatically on your chosen schedule. You can also access these capabilities programmatically through AWS SDKs and CLI tools.</p> \n<p>This feature is available at no&nbsp;additional&nbsp;cost in all commercial AWS Regions, excluding AWS China Regions. To get started, open the AWS Billing and Cost Management console, navigate to Dashboards, select a dashboard, and choose 'Manage email reports' from the Actions menu. For more information, see the&nbsp;<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/dashboards.html\">Dashboards user guide</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/automate-aws-cost-reporting-with-scheduled-dashboard-email-delivery/\">announcement blog post</a>.</p>"
  "db9ffa27daabd1e74eaeb54710766d47":
    "id": "db9ffa27daabd1e74eaeb54710766d47"
    "title": "Second-generation Amazon FSx for NetApp ONTAP is now available in four additional AWS commercial and AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/second-gen-amazon-fsx-ontap-regions/"
    "published": "2026-04-10 16:00:00"
    "summary": "<p>Amazon FSx for NetApp ONTAP second-generation file systems are now available in 4 additional AWS Regions: Europe (London), Asia Pacific (Hyderabad), South America (Sao Paulo), and&nbsp;AWS GovCloud (US-West).&nbsp;<br /> <br /> Amazon FSx makes it easier and more cost effective to launch, run, and scale feature-rich, high-performance file systems in the cloud. Second-generation <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\">FSx for ONTAP</a> file systems give you more performance scalability and flexibility over first-generation file systems by allowing you to create or expand file systems with up to 12 highly-available (HA) pairs of file servers, providing your workloads with up to 72 GBps of throughput and 1 PiB of provisioned SSD storage.<br /> <br /> With this regional expansion, second-generation FSx for ONTAP file systems are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (N. California, Oregon), Canada (Central), Europe (Frankfurt, Ireland, London, Spain, Stockholm, Zurich), South America (Sao Paulo), Asia Pacific (Hyderabad, Mumbai, Seoul, Singapore, Sydney, Tokyo), and AWS GovCloud (US-West). You can create second-generation Multi-AZ file systems with a single HA pair, and Single-AZ file systems with up to 12 HA pairs. To learn more, visit the <a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html\">FSx for ONTAP user guide</a>.</p> \n<h2>&nbsp;</h2>"
  "65c1061c7804c536260b9400a8506bd4":
    "id": "65c1061c7804c536260b9400a8506bd4"
    "title": "AWS Backup extends Amazon FSx support to 5 additional AWS Regions and expands cross-Region and cross-account copy to 14 AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/backup-extends-fsx-support/"
    "published": "2026-04-10 10:00:00"
    "summary": "<p>AWS Backup is expanding support for Amazon FSx for Windows File Server, Amazon FSx for OpenZFS, and Amazon FSx for Lustre with two regional enhancements.</p> \n<p>First, AWS Backup now supports backup and restore of these FSx file systems in 5 additional AWS Regions: Asia Pacific (Malaysia, Taipei, Thailand), Canada West (Calgary), and Mexico (Central). You can now centrally manage FSx backup policies, automate backup schedules, and monitor backup activity through AWS Backup in these Regions.</p> \n<p>Second, AWS Backup now supports cross-Region and cross-account copy of FSx backups in 14 Regions: Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Taipei, Thailand), Canada West (Calgary), Europe (Milan, Spain, Zurich), Israel (Tel Aviv), and Mexico (Central). This capability is available for both on-demand copies and scheduled backup plans with copy rules. With support in opt-in Regions, you can also store FSx backups in AWS Backup logically air-gapped vaults, providing additional defense against inadvertent or malicious deletions and helping you recover from ransomware events.</p> \n<p>You can now configure cross-Region and cross-account copy rules to meet your compliance and business continuity requirements. To learn more, visit the AWS Backup <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html\">feature availability page</a>.</p>"
  "2236b6025cf149b69a694580ea1cb25a":
    "id": "2236b6025cf149b69a694580ea1cb25a"
    "title": "Amazon CloudWatch pipelines now supports drop and conditional processing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-pipelines-conditional/"
    "published": "2026-04-10 20:53:00"
    "summary": "<p>Amazon CloudWatch pipelines now supports conditional processing and a new drop events processor, giving you more control over how your log data is transformed. CloudWatch pipelines is a fully managed service that ingests, transforms, and routes log data to CloudWatch without requiring you to manage infrastructure. Until now, processors applied to all log entries uniformly. With conditional processing, you can define rules that determine when a processor runs and which individual log entries it acts on, so you only transform the data that matters.</p> \n<p>Conditional processing is available across 21 processors including Add Entries, Delete Entries, Copy Values, Grok, Rename Key, and more. For each processor, you can set a \"run when\" condition to skip the entire processor if the condition is not met, or an entry-level condition to control whether each individual action within the processor is applied. The new Drop Events processor lets you filter out unwanted log entries from third-party pipeline connectors based on conditions you define, helping reduce noise and lower costs.</p> \n<p>Conditional processing and the Drop Events processor are available at no additional cost in all AWS Regions where CloudWatch pipelines is generally available. Standard CloudWatch Logs ingestion and storage rates still apply.</p> \n<p>To get started, visit the CloudWatch pipelines page in the Amazon CloudWatch console. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-pipelines.html\">CloudWatch pipelines documentation</a>.</p>"
  "936e13c2179106cf77a1c79d03c67869":
    "id": "936e13c2179106cf77a1c79d03c67869"
    "title": "AWS Deadline Cloud supports monitor creation in multiple regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/deadline-cloud-monitor-creation/"
    "published": "2026-04-10 16:44:00"
    "summary": "<p>Today, AWS Deadline Cloud announces support for creating monitors in multiple AWS Regions without additional configuration of your IAM Identity Center instance. AWS Deadline Cloud is a fully managed service that helps creative teams manage and scale their rendering workloads in the cloud.<br /> <br /> You can now deploy render farms with monitors across multiple Regions without needing to adjust your existing IAM Identity Center configuration. You can operate more efficiently by placing rendering resources in regions closest to your artists and studios worldwide, and can run and compare workloads across regions to help optimize your rendering strategy or diversify your instance types. Deadline Cloud automatically routes authentication requests to your IAM Identity Center instance in its primary Region, so your identity data remains in place without replication and requires no changes to your identity management setup.<br /> <br /> To learn more, see Getting Started with Deadline Cloud in the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/monitors-additional-regions.html\" title=\"deadlineclouduserguide\">AWS Deadline Cloud User Guide</a>.&nbsp;</p>"
  "1ad15a88ace439e4dabbbf88095f623a":
    "id": "1ad15a88ace439e4dabbbf88095f623a"
    "title": "Amazon CloudWatch pipelines introduces new compliance and governance capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/cloudwatch-pipelines-compliance-governance/"
    "published": "2026-04-10 16:12:00"
    "summary": "<p>Amazon CloudWatch pipelines now includes new compliance and governance capabilities to help you maintain data integrity and control access when processing logs. CloudWatch pipelines is a fully managed service that ingests, transforms, and routes log data to CloudWatch without requiring you to manage infrastructure. Because pipeline processors modify log events during transformation, organizations with audit or regulatory requirements need ways to preserve original data and track what has been changed. These new tools address those needs directly.</p> \n<p>You can now enable a \"keep original\" toggle to automatically store a copy of your raw logs before any transformation takes place, ensuring the unmodified data is always available when needed. Pipelines also adds new metadata to processed log entries indicating that the log has been transformed, making it easy to distinguish between original and processed data during audits or investigations. Additionally, new IAM condition keys let administrators restrict who can create pipelines based on log source name and type, giving operators fine-grained control over pipeline creation across their organization.</p> \n<p>These compliance and governance features are available at no additional cost. Standard CloudWatch Logs storage rates apply to both the original and transformed copies of your log data when the keep original log option is enabled. You can use these features in all AWS Regions where CloudWatch pipelines is generally available.</p> \n<p>To get started, visit the CloudWatch Ingestion page in the Amazon CloudWatch console. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-pipelines.html\">CloudWatch pipelines documentation</a>.</p>"
  "47278854e34a830ebc17f5090f1138e1":
    "id": "47278854e34a830ebc17f5090f1138e1"
    "title": "Amazon RDS now supports the latest CU and GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-rds-supports-latest-cu-gdr-updates-microsoft-sq-server/"
    "published": "2026-04-10 07:34:00"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server </a>now supports the latest Cumulative Updates (CU) and General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for Microsoft SQL Server 2016 SP3+GDR <a href=\"https://support.microsoft.com/en-us/topic/kb5077474-description-of-the-security-update-for-sql-server-2016-sp3-gdr-march-10-2026-3f455bec-1221-4962-b068-0b11bf96b66a\" target=\"_blank\">KB5077474</a> (RDS version 13.00.6480.4.v1), SQL Server 2017 CU31+GDR <a href=\"https://support.microsoft.com/en-us/topic/kb5077471-description-of-the-security-update-for-sql-server-2017-cu31-march-10-2026-f020d5eb-e356-42e8-a9ba-0ef061430b15\" target=\"_blank\">KB5077471</a> (RDS version 14.00.3520.4.v1), SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/en-us/topic/kb5077469-description-of-the-security-update-for-sql-server-2019-cu32-march-10-2026-5ec2c609-35cb-483d-aa80-5e66821e5c97\" target=\"_blank\">KB5077469</a> (RDS version 15.00.4460.4.v1) and SQL Server 2022 CU24 <a href=\"https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/cumulativeupdate24\" target=\"_blank\">KB5080999</a> (RDS version 16.00.4245.2.v1).<br /> <br /> The GDR updates address vulnerabilities described in CVE-2026-21262 and CVE-2026-26115. For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5077474, KB5077471, KB5077469, KB5080999. We recommend that you upgrade your Amazon RDS for SQL Server instances to apply these updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can learn more about upgrading your database instance in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html\" target=\"_blank\">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft SQL Server DB engine</a>.</p>"
  "9bcc3304c8096b856e3c59dcbde81e7a":
    "id": "9bcc3304c8096b856e3c59dcbde81e7a"
    "title": "AWS RTB Fabric supports health checks for real-time bidding workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-rtb-fabric-health-checks/"
    "published": "2026-04-10 12:00:00"
    "summary": "<p>AWS RTB Fabric now supports health checks for real-time bidding workloads that use <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-groups.html\">EC2 Auto Scaling groups</a> (AGS). Health checks in AWS RTB Fabric continuously monitors and automatically routes traffic to healthy instances with <a href=\"https://docs.aws.amazon.com/rtb-fabric/latest/userguide/health-checks-for-managed-endpoints.html\" rel=\"noopener noreferrer\" target=\"_blank\">configurable settings in RTB responder gateways</a>.&nbsp;This helps eliminate failed real-time bidding transactions from bootstrapping, draining, or failed instances. With this launch, AWS RTB Fabric helps advertising technology (AdTech) companies improve uptime, reduce error rates, and prevent revenue loss from failed auctions.</p> \n<p>AWS RTB Fabric helps you connect with your AdTech partners such as Amazon Ads, GumGum, Kargo, MobileFuse, Sovrn, TripleLift, Viant, Yieldmo, and more in three steps while delivering single-digit millisecond latency through a private, high-performance network environment. RTB Fabric reduces standard cloud networking costs by up to 80% and does not require upfront commitments. AWS RTB Fabric is generally available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (Ireland). To learn more, visit the AWS RTB Fabric <a href=\"https://docs.aws.amazon.com/rtb-fabric/latest/userguide/health-checks-for-managed-endpoints.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> or <a href=\"https://aws.amazon.com/rtb-fabric/\" rel=\"noopener noreferrer\" target=\"_blank\">product</a> page.&nbsp;</p>"
  "f71b120ecf476d87c3c81ba1c0818bfd":
    "id": "f71b120ecf476d87c3c81ba1c0818bfd"
    "title": "Amazon EC2 X8i instances are now available in Europe (Paris)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-x8i-instances-CDG-region/"
    "published": "2026-04-10 23:54:00"
    "summary": "<p>Amazon Web Services (AWS) is announcing the general availability of Amazon EC2 X8i instances, next-generation memory optimized instances powered by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified and deliver the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to previous generation X2i instances.<br /> <br /> X8i instances are designed for memory-intensive workloads like SAP HANA, large databases, data analytics, and Electronic Design Automation (EDA). Compared to X2i instances, X8i instances offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance, 88% faster Memcached performance, and 46% faster AI inference performance. X8i instances come in 14 sizes, from large to 96xlarge, including two bare metal options.<br /> <br /> X8i instances are available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Stockholm) and Europe (Paris).<br /> <br /> To get started, visit the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances, and Spot instances. For more information visit <a href=\"https://aws.amazon.com/ec2/instance-types/x8i/\" target=\"_blank\">X8i instances page</a>.</p>"
"last_updated": "2026-04-11 10:58:13 JST"
