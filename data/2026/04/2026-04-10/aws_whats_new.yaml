    "title": "AWS Billing and Cost Management Dashboards Now Supports Scheduled Email Delivery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-billing-and-cost-management-dashboards-scheduled-email-delivery/"
    "published": "2026-04-10 15:00:00"
    "summary": "<p>AWS Billing and Cost Management Dashboards now support scheduled email delivery for your reports. You can now automate report distribution on flexible recurring schedules, eliminating manual compilation&nbsp;work&nbsp;and ensuring financial insights reach decision-makers without requiring console access.\"</p> \n<p>Scheduled email reports enable you to configure daily, weekly, or monthly delivery schedules for your dashboards.&nbsp;Recipients receive emails containing secure links to password-protected PDF reports optimized for offline viewing.&nbsp;Manage recipients through AWS User Notifications, and once configured, reports generate and distribute automatically on your chosen schedule. You can also access these capabilities programmatically through AWS SDKs and CLI tools.</p> \n<p>This feature is available at no&nbsp;additional&nbsp;cost in all commercial AWS Regions, excluding AWS China Regions. To get started, open the AWS Billing and Cost Management console, navigate to Dashboards, select a dashboard, and choose 'Manage email reports' from the Actions menu. For more information, see the&nbsp;<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/dashboards.html\">Dashboards user guide</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/automate-aws-cost-reporting-with-scheduled-dashboard-email-delivery/\">announcement blog post</a>.</p>"
"last_updated": "2026-04-11 01:46:12 JST"
