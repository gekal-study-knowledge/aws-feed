"overview": |
  この日は AI エージェント関連の機能拡充とセキュリティ対応が目立ちました。Amazon Quick が Visier の Vee エージェントと MCP 経由で統合され、人事や財務担当者が自然言語で労働力データにアクセスできるようになりました。Amazon Connect は AI エージェントの性能を測る 8 つの新メトリクス (目標達成率、忠実度スコア、ツール選択精度など) を提供開始し、監督者のステータス変更を CloudTrail に記録する監査機能も追加しました。Amazon Bedrock AgentCore Gateway と Identity は VPC egress をサポートし、プライベートリソースへの安全な接続を実現。その他 EC2 High Memory U7i インスタンスのリージョン拡大、Lambda の Kafka ESM プロビジョンドモード拡大、WorkSpaces の最新 Linux 対応などがありました。セキュリティ面では耐量子暗号 (PQC) 移行のブログに加え、AWS Ops Wheel (CVE-2026-6911/6912) や tough/tuftool (CVE-2026-6966~6968) の脆弱性速報が公開されました。
