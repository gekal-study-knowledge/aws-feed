  "8c126fe07fea46fe93a7e7d152c2d35d":
    "id": "8c126fe07fea46fe93a7e7d152c2d35d"
    "title": "Amazon EC2 High Memory U7i instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-high-memory-u7i/"
    "published": "2026-04-25 02:00:00"
    "fetched": "2026-04-25 05:42:23"
    "summary": "<p>Amazon EC2 High Memory U7i-8TB instances (u7i-8tb.112xlarge) are now available in AWS Europe (Stockholm, Zurich) regions, U7in-16TB instances (u7in-16tb.224xlarge) are now available in the AWS US East (Ohio) region, and U7in-24TB instances (u7in-24tb.224xlarge) are now available in the AWS Europe (Stockholm) region. U7i instances are part of the AWS 7th generation and are powered by custom fourth-generation Intel Xeon Scalable processors (Sapphire Rapids). U7i-8TB instances offer 8 TiB of DDR5 memory, U7in-16TB instances offer 16 TiB of DDR5 memory, and U7in-24TB instances offer 24 TiB of DDR5 memory, enabling customers to scale transaction processing throughput in a fast-growing data environment.</p> \n<p>U7i-8TB instances deliver 448 vCPUs and support up to 100 Gbps of Amazon EBS bandwidth, 100 Gbps of network bandwidth, and ENA Express. Both U7in-16TB and U7in-24TB instances deliver 896 vCPUs and support up to 100 Gbps of Amazon EBS bandwidth for faster data loading and backups, 200 Gbps of network bandwidth, and ENA Express. U7i instances are ideal for customers running mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.</p> \n<p>To learn more about U7i instances, visit the&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High Memory instances page</a>.</p>"
  "21c144a58908addfc3c6e472a6a8ebd3":
    "id": "21c144a58908addfc3c6e472a6a8ebd3"
    "title": "Amazon Connect now provides eight new metrics to measure and improve AI agent performance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-ai-agent-metrics/"
    "published": "2026-04-25 02:00:00"
    "fetched": "2026-04-25 06:43:14"
    "summary": "<p>Amazon Connect now provides eight new metrics to measure and improve AI agent performance, including goal success rate, faithfulness score, and tool selection accuracy. These metrics offer visibility into the quality of AI-driven customer interactions, enabling measurement and continuous improvement of AI agent outcomes.&nbsp;With this launch, you can monitor whether AI agents successfully resolved customer requests, assess faithfulness and detect contextual hallucinations. You can also evaluate tool selection and utilization accuracy, and capture customer feedback through thumbs up/down ratings when enabled.&nbsp;<br /> <br /> You can access these new metrics through Amazon Connect's AI Agent Performance dashboard, or through the GetMetricDataV2 API and zero-ETL data lake for custom reporting or integration with your existing analytics workflows.</p> \n<p>This feature is available in all AWS Regions where Amazon Connect AI Agents is supported. For more information, see the&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/ai-agent-performance-dashboard.html\"><u>Amazon Connect Administrator Guide</u></a>. To learn more about Amazon Connect, an AI-native solution that turns every customer interaction into a moment worth remembering, visit the&nbsp;<a href=\"https://aws.amazon.com/connect/\"><u>Amazon Connect website</u></a></p>"
  "9932428506db42860ab8df7812ea4674":
    "id": "9932428506db42860ab8df7812ea4674"
    "title": "AWS Marketplace Management Portal now supports bank account deletion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-marketplace-management-portal/"
    "published": "2026-04-25 01:37:00"
    "fetched": "2026-04-25 06:43:14"
    "summary": "<p>AWS Marketplace sellers can now delete bank accounts directly from the Payment Settings page in the AWS Marketplace Management Portal (AMMP). This new self-service capability addresses a long-standing gap in payment account management, allowing sellers to remove ACH-type and SWIFT-type bank accounts without contacting customer service. This enhancement is particularly valuable for global enterprises and ISVs managing multiple currencies and banking relationships.</p> \n<p>With this update, sellers gain complete control over their payment account management. Key benefits include the ability to clean up unused accounts, remove failed or outdated banking relationships, and reduce payment routing risks. The feature also includes Last Updated timestamps to help differentiate between modified bank accounts.&nbsp;</p> \n<p>To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/provide-bank-information.html\">AWS Marketplace Seller Guide</a>.</p>"
  "e79335585c6449ecb1f36de4f3ef1e2d":
    "id": "e79335585c6449ecb1f36de4f3ef1e2d"
    "title": "Amazon Quick now integrates with Visier’s Vee agent for workforce intelligence"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-visier-vee/"
    "published": "2026-04-25 06:03:00"
    "fetched": "2026-04-25 07:35:54"
    "summary": "<p>Amazon Quick now integrates with Vee, the AI assistant from Visier's people analytics platform, through the model context protocol (MCP). HR business partners, finance managers, and operations leaders can now get governed access to live workforce intelligence from Visier directly within their Amazon Quick workspace without switching tools.</p> \n<p>After setting up the connection in Quick using Visier’s remote MCP server, you can ask questions in natural language about headcount, attrition, tenure, and open requisitions and receive answers grounded in Visier's governed workforce data model. Vee can also be invoked from automated Quick Flows to run recurring workforce reviews or draft documents. Quick intelligently routes relevant prompts to Vee and returns contextualized answers alongside enterprise knowledge – such as budgets, policies, and plans stored in Quick Spaces – so every answer reflects the full organizational picture.</p> \n<p>The Visier integration with Amazon Quick is available in all AWS Regions where Amazon Quick is available.</p> \n<p>To get started with Amazon Quick, <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">visit the website</a>. To learn more about the Visier integration, read the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/visier-integration.html\" target=\"_blank\">Visier integration guide</a>, see the <a href=\"https://aws.amazon.com/blogs/machine-learning/building-workforce-ai-agents-with-visier-and-amazon-quick/\" target=\"_blank\">blog</a>, and explore more integrations on the <a href=\"https://aws.amazon.com/quick/integrations/\" target=\"_blank\">integrations page</a>.</p>"
  "39ac0b3c45f859be632574e1d4bf307e":
    "id": "39ac0b3c45f859be632574e1d4bf307e"
    "title": "Amazon Bedrock AgentCore Gateway and Identity support VPC egress"
    "link": "https://aws.amazon.com/about-aws/whats-new/2024/04/agentcore-gateway-identity-vpc/"
    "published": "2026-04-25 06:00:00"
    "fetched": "2026-04-25 07:35:54"
    "summary": "<p>Amazon Bedrock AgentCore Gateway and Identity now provide secure and controlled egress traffic management for your applications, enabling seamless communication with resources in your Virtual Private Cloud (VPC). VPC egress for AgentCore Gateway targets and Identity credential providers are offered in both managed and self-managed configurations.</p> \n<p>With VPC egress support, customers can now invoke private resources (e.g., EKS-hosted MCP servers) directly from their AgentCore Gateway. Managed VPC egress covers most customer use cases. For more complex networking setups, customers can configure their own VPC Lattice resources. AgentCore Identity VPC egress supports connectivity to Identity Providers (IdPs) running inside a customer’s VPC. This enables two key capabilities: validating inbound access tokens issued by your private IdP and fetching tokens from your IdP for outbound request authentication. Finally, this launch supports private DNS resolution for managed VPC egress resources across Gateway and Identity.</p> \n<p>AgentCore Gateway and Identity are available in<a>&nbsp;fourteen AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), and Europe (Stockholm).</p> \n<p>Learn more about VPC egress capabilities through AgentCore Gateway&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-quick-start.html\">documentation,</a> and AgentCore Identity <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-private-idp.html\">documentation</a>. Get started with the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-get-started-cli.html\">AgentCore CLI</a>.</p>"
  "a382a4a69e953bfc0efd2df7c1a59ea6":
    "id": "a382a4a69e953bfc0efd2df7c1a59ea6"
    "title": "AWS Deadline Cloud now supports custom scripting for job submission workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-deadline-cloud/"
    "published": "2026-04-25 00:42:00"
    "fetched": "2026-04-25 07:35:54"
    "summary": "<p>AWS Deadline Cloud now supports running custom scripts before and after job submission, giving studios the ability to integrate their pipeline directly into the submission workflow. AWS Deadline Cloud is a fully managed service that simplifies render management for teams creating computer-generated graphics and visual effects for films, television, web content, and design.<br /> <br /> With the new submission scripting capability, you can configure scripts that run automatically as part of every job submission. Pre-submission scripts run before job attachments are uploaded, allowing you to validate job configurations, discover and add additional input files such as textures or caches, modify submission parameters, or enforce studio policies. Post-submission scripts run after the job is created, enabling you to send notifications, update tracking systems, or log submission details. Scripts are defined in a simple YAML or JSON configuration file placed in your job bundle directory or in a shared studio-wide directory using an environment variable, making it easy for pipeline teams to enforce standards across all artists. Each script receives job metadata automatically and supports configurable timeouts.&nbsp;<br /> <br /> To get started, visit the <a href=\"https://github.com/aws-deadline/deadline-cloud/blob/mainline/README.md#submission-hooks\">Deadline Cloud Client documentation</a>.</p>"
