"entries":
  "a713cfc69ed13d87ef69a2aa70ec6b83":
    "id": "a713cfc69ed13d87ef69a2aa70ec6b83"
    "title": "AWS IoT is now available in Israel (Tel Aviv) and Europe (Milan) AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-iot-israel-tel-aviv-europe-milan/"
    "published": "2026-04-13 16:10:00"
    "summary": "<p>AWS IoT Core and AWS IoT Device Management services are now available in the Israel (Tel Aviv) and Europe (Milan) AWS Regions. With this expansion, organizations operating in these regions can better serve their local customers and unlock multiple benefits, including faster response times, stronger data residency controls, and reduced data transfer expenses.<br /> <br /> <a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> is a managed cloud service that lets you securely connect billions of Internet of Things (IoT) devices to the cloud and manage them at scale. It routes trillions of messages to IoT devices and AWS endpoints, through bi-directional industry standard protocols, such as MQTT, HTTPS, LoRaWAN (select regions). <a href=\"https://aws.amazon.com/iot-device-management/\">AWS IoT Device Management</a> allows customers to search, organize, monitor and remotely manage connected devices at scale.<br /> <br /> With the expansion to these regions, AWS IoT is now available in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">27 AWS Regions</a> worldwide. To get started and to learn more, refer to the technical documentation for <a href=\"https://docs.aws.amazon.com/iot/\">AWS IoT Core </a>and <a href=\"https://docs.aws.amazon.com/iot-device-management/\">AWS IoT Device Management</a>.</p>"
  "cdd078ebe25b07d318ed8288e4d0b133":
    "id": "cdd078ebe25b07d318ed8288e4d0b133"
    "title": "AWS Elastic Disaster Recovery now supports IPv6"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-elastic-disaster-recovery-ipv6/"
    "published": "2026-04-13 15:30:00"
    "summary": "<p>AWS Elastic Disaster Recovery (AWS DRS) now supports IPv6 for both data replication and control plane connections. Customers operating in IPv6-only or dual-stack network environments can now configure AWS DRS to replicate using IPv6, eliminating the need for IPv4 addresses in their disaster recovery setup.<br /> <br /> AWS DRS minimizes downtime and data loss with fast, reliable recovery of on-premises and cloud-based applications using affordable storage, minimal compute, and point-in-time recovery. Previously, AWS DRS required IPv4 connectivity for all replication and service communication. Now, customers can set the internet protocol to IPv6 in their replication configuration to use dual-stack endpoints for agent-to-service communication and data replication. This helps customers meet network modernization requirements and enables disaster recovery in environments where IPv4 addresses are unavailable or restricted. Existing replication configurations are not affected and continue to use IPv4 by default.<br /> <br /> This capability is available in all AWS Regions where AWS DRS is available and where Amazon EC2 supports IPv6. See the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a> for the latest availability information.<br /> <br /> To learn more about AWS DRS, visit our <a href=\"https://aws.amazon.com/disaster-recovery/\">product page</a> or <a href=\"https://docs.aws.amazon.com/drs/latest/userguide/what-is-drs.html\">documentation</a>. To get started, sign in to the <a href=\"https://console.aws.amazon.com/drs/home\">AWS Elastic Disaster Recovery Console</a>.</p>"
  "74006e19fb0ef8e9ce1dc01717bc3254":
    "id": "74006e19fb0ef8e9ce1dc01717bc3254"
    "title": "Amazon EC2 M8i and M8i-flex instances are now available in AWS GovCloud (US-West) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-m8i-flex-govcloud-us-west/"
    "published": "2026-04-13 17:00:00"
    "summary": "<p>Starting today, Amazon EC2 M8i and M8i-flex instances are now available in AWS GovCloud (US-West)<b> </b>Region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The M8i and M8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% better performance than M7i and M7i-flex instances, with even higher gains for specific workloads. The M8i and M8i-flex instances are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to M7i and M7i-flex instances.<br /> <br /> M8i-flex are the easiest way to get price performance benefits for a majority of general-purpose workloads like web and application servers, microservices, small and medium data stores, virtual desktops, and enterprise applications. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> M8i instances are a great choice for all general purpose workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. The SAP-certified M8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. For more information about the new instances, visit the<a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\" rel=\"noopener noreferrer\" target=\"_blank\"> M8i and M8i-flex instance page</a> or visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/\" rel=\"noopener noreferrer\" target=\"_blank\">blog</a>.</p>"
  "faa5914e1e4770cbb62f9915038ac68e":
    "id": "faa5914e1e4770cbb62f9915038ac68e"
    "title": "Amazon EC2 R8i and R8i-flex instances are now available in AWS GovCloud (US-West) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-r8i-instances-govcloud-us-west/"
    "published": "2026-04-13 17:00:00"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and R8i-flex instances are available in the AWS GovCloud (US-West) Region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.<br /> <br /> R8i-flex, our first memory-optimized Flex instances, are the easiest way to get price performance benefits for a majority of memory-intensive workloads. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications. <a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" rel=\"noopener noreferrer\" target=\"_blank\">R8i instances are SAP-certified </a>and deliver 142,100 aSAPS, delivering exceptional performance for mission-critical SAP workloads.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. For more information about the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" rel=\"noopener noreferrer\" target=\"_blank\">R8i and R8i-flex </a>instances visit the AWS News <a></a><a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" rel=\"noopener noreferrer\" target=\"_blank\">blog</a>.</p>"
  "5523293745032385a3224c3de4de3427":
    "id": "5523293745032385a3224c3de4de3427"
    "title": "Aurora DSQL launches connector that simplifies building PHP applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aurora-dsql-connector-for-php/"
    "published": "2026-04-13 17:47:00"
    "summary": "<p>Today we are announcing the release of the Aurora DSQL Connector for PHP (PDO_PGSQL) that makes it easy to build PHP applications on Aurora DSQL. The PHP Connector streamlines authentication and eliminates security risks associated with traditional user-generated passwords by automatically generating tokens for each connection, ensuring valid tokens are always used while maintaining full compatibility with existing PDO_PGSQL features.<br /> <br /> The connector handles IAM token generation, SSL configuration, and connection pooling, enabling customers to scale from simple scripts to production workloads without changing their authentication approach. It also provides opt-in optimistic concurrency control (OCC) retry with exponential backoff, custom IAM credential providers, and AWS profile support, making it easier to develop client retry logic and manage AWS credentials.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_connectors.html\">Connectors for Aurora DSQL documentation</a> page. For code examples, visit our <a href=\"https://github.com/awslabs/aurora-dsql-connectors/blob/main/php/pdo_pgsql/README.md\">GitHub page for the PHP connector</a>. Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank\\&amp;all-free-tier.sort-order=asc\\&amp;awsf.Free%20Tier%20Types=*all\\&amp;awsf.Free%20Tier%20Categories=categories%23databases\">AWS Free Tier</a>. To learn more about Aurora DSQL, visit the <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "3353e7ef767961fb259e05b30dba9744":
    "id": "3353e7ef767961fb259e05b30dba9744"
    "title": "Amazon FSx now supports copying file system backups across AWS opt-in Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-fsx-copying-backups-opt-in-regions/"
    "published": "2026-04-13 16:00:00"
    "summary": "<p>Amazon&nbsp;FSx&nbsp;now supports copying file system backups across&nbsp;<a href=\"https://docs.aws.amazon.com/glossary/latest/reference/glos-chap.html#optinregion\">opt-in Regions</a>&nbsp;(AWS Regions that are disabled by default) for Amazon&nbsp;FSx&nbsp;for Windows File Server, Amazon&nbsp;FSx&nbsp;for&nbsp;Lustre, and Amazon&nbsp;FSx&nbsp;for&nbsp;OpenZFS. This launch makes it easier for customers to meet business continuity, disaster recovery, and compliance requirements by extending cross-Region, cross-account backup and recovery capabilities beyond AWS Regions that are enabled by default.</p> \n<p>Amazon&nbsp;FSx&nbsp;is a fully managed service that makes it easy and cost-effective to launch, run, and scale feature-rich, high-performance file systems in the AWS Cloud. Opt-in Regions are AWS Regions that are disabled by default, in contrast to regions that are enabled by default. Previously, customers could copy Amazon&nbsp;FSx&nbsp;file system backups across regions enabled by default, within the same AWS account or across AWS accounts in the same AWS Organization. Starting today, you can copy backups into and out of opt-in Regions within the same AWS account using the Amazon FSx console, API, or CLI, or across AWS accounts in the same AWS Organization using AWS Backup. This allows you to design resilient,&nbsp;multi-account,&nbsp;cross-Region&nbsp;backup&nbsp;and recovery architectures across a broader set of AWS Regions.</p> \n<p>To get started,&nbsp;visit&nbsp;the&nbsp;<a href=\"https://console.aws.amazon.com/fsx\">Amazon&nbsp;FSx console</a>&nbsp;or the&nbsp;<a href=\"https://console.aws.amazon.com/backup\">AWS Backup console</a>. For more details, see the&nbsp;<a href=\"https://aws.amazon.com/fsx/\">Amazon FSx product page</a>&nbsp;and the&nbsp;<a href=\"https://aws.amazon.com/backup/\">AWS Backup product page</a>.</p>"
  "ff6991ace37d6d0f2c57cbe113989fb8":
    "id": "ff6991ace37d6d0f2c57cbe113989fb8"
    "title": "Amazon OpenSearch Serverless now supports Derived Source for storage optimization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-opensearch-serverless-supports-derived-source/"
    "published": "2026-04-13 20:55:00"
    "summary": "<p>Amazon OpenSearch Serverless introduces support for Derived Source, a new feature that can help reduce the amount of storage required for your OpenSearch Service collections. With derived source support, you can skip storing source fields and dynamically derive them when required.&nbsp;</p> \n<p>With Derived Source, OpenSearch Serverless reconstructs the _source field on the fly using the values already stored in the index, eliminating the need to maintain a separate copy of the original document. This can significantly reduce storage consumption, particularly for time-series and log analytics collections where documents contain many indexed fields. You can enable derived source at the index level when creating or updating index mappings.</p> \n<p>Derived Source support is available today in all AWS Regions where Amazon OpenSearch Serverless is&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\" target=\"_blank\">supported</a>. For more information, see the Amazon OpenSearch Serverless&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-derived-source.html\" target=\"_blank\">documentation</a>.</p>"
  "87f8dc962ab111d3b5da6535b63984ef":
    "id": "87f8dc962ab111d3b5da6535b63984ef"
    "title": "Amazon Redshift introduces key  performance  optimization for Top-K queries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-redshift-topk-optimization/"
    "published": "2026-04-13 18:58:00"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> further optimizes the processing of top-k queries (queries with ORDER BY and LIMIT clauses) by intelligently skipping irrelevant data blocks to return results faster, dramatically reducing the amount of data processed. This optimization reorders and efficiently adjusts the data blocks to be read based on the ORDER BY column's min/max values, maintaining only the K most qualifying rows in memory. When the ORDER BY column is sorted or partially sorted, Amazon Redshift now processes only the minimal data blocks needed rather than scanning entire tables, eliminating unnecessary I/O and compute overhead.</p> \n<p>This enhancement particularly benefits top-k queries when the data permanently stores in descending order (ORDER BY ... DESC LIMIT K) on large tables where qualifying rows are appended at the end of the data storage. Common examples include:<br /> </p> \n<ul> \n <li>Finding the k most recent orders from millions or billions of transactions</li> \n <li>Retrieving top-k best performing products or k worst performing products (top-k in descending order) from your sales catalog containing hundreds of thousands stock keeping units (SKUs) and millions or billions of sales transactions associated with all product SKUs in your sales catalog</li> \n <li>Finding the top-k most recent or top-k oldest (top k in descending order) prompts inferred by a foundational large language model (LLM) out of billions of prompts.</li> \n</ul> \n<p>With this new optimization, top-k query performance improves dramatically. This optimization for top-k queries is now available in Amazon Redshift at no additional cost starting with <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/cluster-versions.html#cluster-version-199\">patch release P199</a> across all AWS regions where Amazon Redshift is available. This optimization automatically applies to eligible queries without requiring any query rewrites or configuration changes.</p>"
  "362b714af2eb7850a8334cc21d656c2a":
    "id": "362b714af2eb7850a8334cc21d656c2a"
    "title": "Amazon CloudWatch Logs Insights now supports saved queries with parameters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/cloudwatch-logs-insights-query-params/"
    "published": "2026-04-13 17:00:00"
    "summary": "<p>Amazon CloudWatch Logs Insights saved queries now support parameters, allowing you to pass values to reusable query templates with placeholders. This eliminates the need to maintain multiple copies of nearly identical queries that differ only in specific values such as log levels, service names, or time intervals.<br /> <br /> You can define up to 20 parameters in a query, with each parameter supporting optional default values. For example, you can create a single template to query logs by severity level (such as ERROR or WARN) and pass different service names each time you run it. To execute a query with parameters, invoke it using the query name prefixed with $ and pass your parameter values, such as $ErrorsByService(logLevel=\"ERROR\", serviceName=\"OrderEntry\"). You can also use multiple saved queries with parameters together for complex log analysis, significantly reducing query maintenance overhead while improving reusability.<br /> <br /> Saved queries with parameters are available in all commercial AWS regions. You can create and use saved queries with parameters using the Amazon CloudWatch console, AWS Command Line Interface (AWS CLI), AWS Cloud Development Kit (AWS CDK), and AWS SDKs. To learn more, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_Insights-Saving-Queries.html\">documentation</a>.</p>"
  "ea73255e00d636e45bd94a0b4b07b1b9":
    "id": "ea73255e00d636e45bd94a0b4b07b1b9"
    "title": "NVIDIA Nemotron-3-Super-120B, Qwen3.5-9B, and Qwen3.5-27B models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/nemotron3super-120b-qwen3.5-9b-qwen3.5-27b-on-sagemaker-jumpstart/"
    "published": "2026-04-13 23:40:00"
    "summary": "<p>NVIDIA’s Nemotron-3-Super-120B, Qwen3.5-9B, and Qwen3.5-27B models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three models bring specialized capabilities spanning agentic reasoning, multilingual coding, and advanced instruction following, enabling customers<b>&nbsp;</b>to deploy high-performance, scalable AI solutions on AWS infrastructure.<br /> <br /> These models address different enterprise AI challenges with specialized capabilities:<br /> Nemotron-3-Super-120B is optimized for collaborative agents and high-volume workloads such as IT ticket automation. It employs a hybrid Latent Mixture-of-Experts (LatentMoE) architecture with Mamba-2 and MoE layers, enabling strong agentic, reasoning, and conversational capabilities useful for multi-agent applications like software development and cybersecurity triaging.<br /> Qwen 3.5 9B excels in multilingual coding, instruction following, and long-horizon planning, automating software development workflows and executing complex, multi-step office tasks. Its compact design balances efficiency and performance for resource-constrained environments.<br /> Qwen 3.5 27B provides deeper contextual understanding, extended reasoning capabilities, and enhanced spatial/complex scenario comprehension, ideal for advanced multimodal reasoning and large-scale document processing.<br /> With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.<br /> <br /> To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "40c868bb9844f7e8fea3d16c98d28c72":
    "id": "40c868bb9844f7e8fea3d16c98d28c72"
    "title": "Amazon Quick now supports document-level access controls for Google Drive knowledge bases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-document-level-access-controls-google-drive/"
    "published": "2026-04-13 18:35:00"
    "summary": "<p>Amazon Quick now supports document-level access controls (ACLs) for Google Drive knowledge bases, enabling organizations to maintain native Google Drive permissions when indexing content. Quick combines ACL replication for efficient pre-retrieval filtering with an additional layer of real-time permission checks directly with Google Drive at query time. This dual approach means you get the performance benefits of indexed ACLs while also guarding against stale or incorrectly mapped permission data. When a user submits a query, Quick verifies their current permissions with Google Drive before generating a response—ensuring answers are based on live access rights.<br /> <br /> With document-level access controls, Amazon Quick now respects individual file and folder permissions from Google Drive. This feature is available in all AWS <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\" target=\"_blank\">Regions where Amazon Quick is available</a>. </p> \n<p>To get started, create or update a Google Drive knowledge base in the Amazon Quick console and configure document-level access controls in your integration settings. For more information, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/google-drive-integration.html\" rel=\"noopener noreferrer\" target=\"_blank\">Google Drive integration</a> in the Amazon Quick User Guide.</p>"
  "c8c2177e9b93b8c74cbb98fcff2defe8":
    "id": "c8c2177e9b93b8c74cbb98fcff2defe8"
    "title": "AWS announces general availability of AWS Interconnect - last mile"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-announces-ga-AWS-interconnect-last-mile/"
    "published": "2026-04-13 15:00:00"
    "summary": "<p>AWS launches AWS Interconnect - last mile, a fully managed connectivity offering that allows customers to connect their branch offices, data centers, and remote locations to AWS with just a few clicks, eliminating the friction and complexity of network setup. As a milestone collaboration between AWS and Lumen, AWS Interconnect - last mile combines AWS cloud innovation with Lumen’s extensive network footprint to redefine how businesses connect to the cloud.</p> \n<p>Through the AWS Console, customers can now instantly establish private, high-speed connections to AWS by simply choosing their preferred AWS Region, bandwidth speed, Direct Connect Gateway ID and partner subscriber ID. Once initiated, AWS generates an activation key to complete provisioning with Lumen. The launch simplifies the connectivity experience by pre-provisioning capacity and automating complex network configuration including BGP peering, VLAN configuration, and ASN assignment. Customers can dynamically scale bandwidth from 1 Gbps to 100 Gbps through the AWS Console and benefit from zero down-time maintenance. The service is designed for high availability and backed by SLA. MACsec encryption is enabled by default for enhanced security between AWS and partner devices.</p> \n<p>AWS Interconnect - last mile is available in the US through our launch partner Lumen. Partners can also easily adopt via a published open API package on <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub</a>. For more information, see the AWS Interconnect - last mile <a href=\"https://docs.aws.amazon.com/interconnect/\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>&nbsp;and <a href=\"https://aws.amazon.com/interconnect/lastmile/pricing\" rel=\"noopener noreferrer\" target=\"_blank\">pricing</a> pages.</p>"
  "1fd654273af1e69fe0d55f111084bd25":
    "id": "1fd654273af1e69fe0d55f111084bd25"
    "title": "AWS announces general availability of AWS Interconnect - multicloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-announces-ga-AWS-interconnect-multicloud/"
    "published": "2026-04-13 15:00:00"
    "summary": "<p>AWS announces general availability (GA) of AWS Interconnect - multicloud, providing simple, resilient, high-speed private connections to other cloud service providers (CSPs). With GA comes Google Cloud as the first launch partner, with Microsoft Azure coming later in 2026.</p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. They do so for many reasons including interoperability requirements, the freedom to choose technology that best suits their needs, and the ability to build and deploy applications on any environment with greater ease and speed. Previously, when interconnecting workloads across multiple cloud providers, customers had to go the route of a ‘do-it-yourself’ multicloud approach, leading to complexities of managing global multi-layered networks at scale. AWS Interconnect - multicloud is the first purpose-built product of its kind and a new way of how clouds connect and talk to each other. Simplifying connectivity into AWS, Interconnect - multicloud enables customers to quickly establish private, secure, high-speed network connections with dedicated bandwidth and built-in resiliency between their Amazon VPCs and other cloud environments. Interconnect - multicloud makes it easy to connect AWS resources or VPCs to other CSPs. Customers can also quickly scale connectivity to multiple VPCs or Regions via associating Interconnect with other networking services such as AWS Transit Gateway and AWS Cloud WAN, instead of taking weeks or months. Interconnect - multicloud introduces a new, single-fee pricing structure based on the customer’s selected bandwidth and the geographical scope of the connectivity to other CSPs. Customers can also use one free, local 500Mbps interconnect per Region starting in May. To learn more please see the Interconnect - multicloud Pricing documentation page.</p> \n<p>Interconnect - multicloud is available in five AWS Regions. You can enable this capability using the AWS Management Console, Command Line Interface (CLI), or API, and CSPs can also adopt via a published <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">open API package on GitHub</a>. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Interconnect - multicloud documentation</a>&nbsp;and <a href=\"https://aws.amazon.com/interconnect/multicloud/pricing\" rel=\"noopener noreferrer\" target=\"_blank\">pricing</a> pages.</p>"
"last_updated": "2026-04-15 11:08:08 JST"
