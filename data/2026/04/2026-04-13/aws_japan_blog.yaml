    "title": "荏原製作所様と共催！社内クラウドイベント「Ebara Cloud Day」開催レポート"
    "link": "https://aws.amazon.com/jp/blogs/news/2026-ebara-cloud-day/"
    "published": "2026-04-13 06:44:28"
    "summary": "荏原製作所様は社内クラウドイベント「Ebara Cloud Day」を開催しました。 AWSセッションや社内エンジニアによる実践的なLT(新入社員研修、EC2運用、中国リージョン導入、Wrike連携ツール、コスト半減事例)を通じて、参加者のクラウド活用意欲が大きく向上し、継続的な学習コミュニティ形成の基盤となりました。 ブログではイベントの内容やイベント実施の効果をお伝えしています。"
