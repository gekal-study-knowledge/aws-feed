    "title": "週刊AWS – 2026/4/6週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260406/"
    "published": "2026-04-13 01:49:59"
    "summary": "Amazon S3 が新規および既存バケットに対してデフォルトで新しいセキュリティベストプラクティスの展開を開始, AWS が Smithy-Java クライアントフレームワークの一般提供開始を発表, Amazon WorkSpaces Personal が PrivateLink の一意な DNS 名をサポート, AWS Transfer Family がコネクタと Web アプリで IPv6 をサポート, Amazon S3 Files の発表、S3 バケットをファイルシステムとしてアクセス可能に, Amazon Bedrock で Claude Mythos Preview (限定研究プレビュー) の提供を開始, Amazon Bedrock AgentCore Browser が OS レベルのインタラクション機能を追加, Amazon EKS マネージドノードグループが EC2 Auto Scaling ウォームプールをサポート, Amazon EC2 Capacity Manager でタグベースディメンションがサポート開始, Amazon Bedrock が IAM ユーザーとロールによるコスト配分をサポート"
