"entries":
  "6f4ba18b4870df052f8a6ac12ec3b71c":
    "id": "6f4ba18b4870df052f8a6ac12ec3b71c"
    "title": "Amazon SageMaker HyperPod now supports G7e and r5d.16xlarge instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-hyperpod-g7e-r5d/"
    "published": "2026-04-28 00:30:00"
    "fetched": "2026-04-28 02:18:37"
    "summary": "<p>Amazon SageMaker HyperPod now supports <a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\" target=\"_blank\">G7e</a> and r5d.16xlarge instances. SageMaker HyperPod is a purpose-built infrastructure for developing, training, and deploying foundation models at scale. It provides a resilient and performant environment with built-in fault tolerance, automated cluster recovery, and optimized distributed training libraries, reducing the undifferentiated heavy lifting of managing large-scale AI/ML infrastructure.&nbsp;</p> \n<p>G7e instances are powered by NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs and deliver up to 2.3x better inference performance than G6e instances, allowing you to process more requests per second while reducing latency. With up to 768 GB of total GPU memory, G7e instances let you deploy larger language models or run multiple models on a single endpoint. You can use these instances for deploying LLMs, agentic AI, multimodal generative AI, and physical AI models. G7e instances are also well suited for cost-efficient single-node fine-tuning or training of NLP, computer vision, and smaller generative AI models, with up to 1.27x the TFLOPs and up to 4x the GPU-to-GPU bandwidth compared to G6e. In addition, HyperPod now supports r5d.16xlarge as well. The r5d.16xlarge instance provides 64 vCPUs, 512 GB of memory, and 5 x 600 GB NVMe SSD instance storage, powered by Intel Xeon Platinum 8000 series processors with a sustained all-core turbo frequency of up to 3.1 GHz. This instance is well suited for distributed training data preprocessing especially with frameworks such as Ray, large-scale feature engineering, and running memory-heavy orchestration services alongside GPU compute.<br /> <br /> G7e instances are available in US East (N. Virginia), US East (Ohio), Asia Pacific (Tokyo), and US West (Oregon) and r5d.16xlarge is available in all regions Amazon SageMaker HyperPod is available in.&nbsp;</p>"
  "cd0716f637d356fb82fbc820aa542bb8":
    "id": "cd0716f637d356fb82fbc820aa542bb8"
    "title": "Amazon Redshift Serverless is now available in the AWS Asia Pacific (Melbourne) and Canada West (Calgary) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-redshift-serverless-melbourne-calgary-regions/"
    "published": "2026-04-28 04:00:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Amazon Redshift Serverless</a>, which allows you to run and scale analytics without having to provision and manage data warehouse clusters, is now generally available in the AWS&nbsp;Asia Pacific (Melbourne) and Canada West (Calgary) regions. With Amazon Redshift Serverless, all users, including data analysts, developers, and data scientists, can use Amazon Redshift to get insights from data in seconds. Amazon Redshift Serverless automatically provisions and intelligently scales data warehouse capacity to deliver high performance for all your analytics. You only pay for the compute used for the duration of the workloads on a per-second basis. You can benefit from this simplicity without making any changes to your existing analytics and business intelligence applications.<br /> <br /> With a few clicks in the AWS Management Console, you can get started with querying data using the Query Editor V2 or your tool of choice with Amazon Redshift Serverless. There is no need to choose node types, node count, workload management, scaling, and other manual configurations. You can create databases, schemas, and tables, and load your own data from Amazon S3, access data using Amazon Redshift data shares, or restore an existing Amazon Redshift provisioned cluster snapshot. With Amazon Redshift Serverless, you can directly query data in open formats, such as Apache Parquet, Apache Iceberg in Amazon S3 data lakes. Amazon Redshift Serverless provides unified billing for queries on any of these data sources, helping you efficiently monitor and manage costs.<br /> <br /> To get started, see the Amazon Redshift Serverless <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html\">user documentation</a>, and <a href=\"https://docs.aws.amazon.com/redshift-serverless/latest/APIReference/Welcome.html\">API Reference</a>.</p>"
  "aa81aed40121b95cf708b0e7cdd89443":
    "id": "aa81aed40121b95cf708b0e7cdd89443"
    "title": "Amazon Connect increases attachment file sizes and adds custom file types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-increases-attachment/"
    "published": "2026-04-28 03:45:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p>Amazon Connect now supports attachment file sizes up to 100 MB for chat, cases, and tasks, up from the previous 20 MB limit.&nbsp;Administrators can enable these higher limits and configure custom file extensions for attachments across chat, email, cases, and tasks through the Amazon Connect admin website or <a href=\"https://docs.aws.amazon.com/connect/latest/APIReference/files-api.html\">Amazon Connect APIs</a>.</p> \n<p>A technology company supporting enterprise customers can now accept files like diagnostic bundles and log archives up to 100 MB through chat, reducing back-and-forth and helping agents resolve issues faster. A financial services firm can add file extensions for signed contracts or compliance documents, giving customers the ability to attach paperwork directly in chat or email.</p> \n<p>You can use these features in the following AWS Regions: US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Osaka), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Africa (Cape Town), Canada (Central), Europe (Frankfurt), and Europe (London).</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/connect/\">Amazon Connect</a>&nbsp;and see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/enable-attachments.html\">Enable Attachments</a>&nbsp;in the Amazon Connect Administrator Guide.</p>"
  "c6c56f0ff8b1d9adfbb4ef2c12f12b3d":
    "id": "c6c56f0ff8b1d9adfbb4ef2c12f12b3d"
    "title": "Amazon FSx for OpenZFS Single-AZ (HA) file systems are now available in 17 additional AWS commercial and AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-fsx-openzfs-single-az-ha/"
    "published": "2026-04-28 01:53:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p>You can now create Amazon FSx for OpenZFS Single-AZ (HA) file systems in seventeen additional AWS Regions across the South America, Europe, Africa, Asia Pacific, and AWS GovCloud (US).</p> \n<p>Amazon FSx for OpenZFS provides fully managed, cost-effective, shared file storage powered by the popular OpenZFS file system. It’s designed to deliver sub-millisecond latencies and multi-GB/s throughput along with rich ZFS-powered data management capabilities (like snapshots, data cloning, and compression). Single-AZ (HA) file systems are a cost-effective solution for workloads that need high availability but don’t need storage redundancy across multiple availability zones, such as data analytics, machine learning, and semiconductor chip design.</p> \n<p>With this expansion, FSx for OpenZFS Single-AZ (HA) file systems are now available in the following additional AWS Regions: Africa (Cape Town), Asia Pacific (Hyderabad, Jakarta, Malaysia, Osaka, Taipei, Thailand), Canada West (Calgary), Europe (Milan, Paris, Spain, Zurich), Israel (Tel Aviv), Mexico (Central), South America (São Paulo), and AWS GovCloud (US-East, US-West). To learn more about Amazon FSx for OpenZFS, visit our <a href=\"https://aws.amazon.com/fsx/openzfs/\">product page</a>, and see the FSx for OpenZFS <a href=\"https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/available-aws-regions.html\">Region Table</a> for complete regional availability information.</p>"
  "c32687b6af41a808208ac5f36b194a80":
    "id": "c32687b6af41a808208ac5f36b194a80"
    "title": "Amazon Redshift Serverless AI-driven scaling is now the default for new workgroups"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-redshift-serverless-ai-driven-scaling-default/"
    "published": "2026-04-28 07:03:00"
    "fetched": "2026-04-28 08:50:45"
    "summary": "<p>Amazon Redshift Serverless now makes AI-driven scaling and optimization the default for all new workgroups. AI-driven scaling uses machine learning to predict compute needs and automatically adjust resources before queries queue, delivering better price-performance without manual tuning. This release also expands support to workloads with a Base RPU range of 8–512 RPU, up from the previous 32–512 RPU, reducing the entry cost for AI-driven scaling.<br /> <br /> With AI-driven scaling and optimization, Amazon Redshift monitors your workload patterns and automatically adjusts compute resources based on query complexity, data volume, and expected data scan size. You can use the price-performance slider to choose whether to prioritize cost, performance, or a balance of both. Amazon Redshift also applies additional optimizations, including automatic materialized views and automatic table design optimization, to meet your selected target. To configure price-performance targets, use the AWS Management Console or Amazon Redshift API operations. You can also modify the target after you create the workgroup.<br /> <br /> Amazon Redshift Serverless AI-driven scaling and optimization is available in all AWS Regions where Amazon Redshift Serverless is available.&nbsp;For more information,&nbsp;see Amazon Redshift Serverless <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">product page</a>&nbsp;and&nbsp;AI-driven scaling and optimization <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-capacity.html#serverless-auto-optimization\">documentation</a>.</p>"
  "a43945328cd414a433cc7891627d57e2":
    "id": "a43945328cd414a433cc7891627d57e2"
    "title": "AWS KMS now tracks last usage of all KMS keys"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-kms-tracks-last-usage-kms-keys/"
    "published": "2026-04-28 04:00:00"
    "fetched": "2026-04-28 11:37:10"
    "summary": "<p><a href=\"https://aws.amazon.com/kms/\">AWS Key Management Service (KMS)</a> now provides visibility into the last cryptographic operation performed with your KMS keys, eliminating the need to manually query and analyze logs. This feature helps security administrators and compliance teams quickly determine when&nbsp;their KMS keys were last used for cryptographic operations. You can view the timestamp,&nbsp;the type of operation performed, and the associated AWS CloudTrail event ID from the AWS KMS management console, or via API.</p> \n<p>You can use this feature to help identify unused keys for cleanup, verify that keys are actively used, and track down how your keys are used in AWS CloudTrail. In addition, you can use the <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html\">new condition key</a> (kms:TrailingDaysWithoutKeyUsage) that enables policy-based protection against accidental deletion of recently used keys.</p> \n<p>The feature is available in all AWS Regions where AWS KMS is available, including all commercial AWS Regions, AWS GovCloud (US) Regions, and AWS China Regions.&nbsp;For more information, see <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/monitoring-keys-determining-usage.html\">Determine past usage of a KMS key</a> in the AWS KMS Developer Guide.</p>"
  "48fe4ca5bdb9d07b758c56acdebc16f5":
    "id": "48fe4ca5bdb9d07b758c56acdebc16f5"
    "title": "Introducing Amazon EC2 M8in and M8ib instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-m8in-m8ib/"
    "published": "2026-04-28 00:00:00"
    "fetched": "2026-04-28 11:37:10"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 M8in network optimized instances and Amazon EC2 M8ib EBS optimized instances. The new instances are powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances also feature the latest sixth generation AWS Nitro cards. M8in and M8ib deliver up to 43% higher performance compared to previous generation M6in and M6ib instances.<br /> <br /> M8in instances deliver 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances, and are ideal for workloads such as real-time big data analytics, distributed web scale in-memory caches, caching fleets for AI/ML clusters, and Telco applications such as 5G User Plane Function (UPF).<br /> <br /> M8ib instances deliver up to 300Gbps EBS bandwidth, the highest among non-accelerated compute EC2 instances, and are best suited for workloads that benefit from high block storage performance, such as high-performance file systems and NoSQL databases.<br /> <br /> Amazon EC2 M8in and Amazon EC2 M8ib instances are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Spain) regions, via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 M8i instance</a>&nbsp;page.</p>"
  "47398115ec2884ed22d77189859d19ff":
    "id": "47398115ec2884ed22d77189859d19ff"
    "title": "Introducing Amazon EC2 R8in and R8ib instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ec2-r8in-r8ib/"
    "published": "2026-04-28 00:00:00"
    "fetched": "2026-04-28 11:37:10"
    "summary": "<p>AWS is announcing the general availability of memory optimized Amazon EC2 R8in network optimized instances and Amazon EC2 R8ib EBS optimized instances. These new instances are powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances also feature the latest sixth generation AWS Nitro cards. M8in and M8ib deliver up to 43% higher performance compared to previous generation M6in and M6ib instances.<br /> <br /> R8in instances deliver 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances, and are ideal for workloads such as real-time big data analytics, caching fleets for AI/ML clusters, and distributed web scale in-memory caches.<br /> <br /> R8ib instances deliver up to 300Gbps EBS bandwidth, the highest among non-accelerated compute EC2 instances, and are best suited for workloads that benefit from high block storage performance, such as large commercial databases, data lakes, SQL and NoSQL databases, and in-memory databases such as SAP HANA.<br /> <br /> Amazon EC2 R8in and Amazon EC2 R8ib instances are available in US East (N. Virginia, Ohio), US West (Oregon), and Europe (Spain) regions, via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 R8i instance</a>&nbsp;page.</p>"
  "1858f523c7e612d2eb97d85a80dd923c":
    "id": "1858f523c7e612d2eb97d85a80dd923c"
    "title": "Introducing Amazon EC2 C8ine and M8ine instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-c8ine-m8ine/"
    "published": "2026-04-28 00:00:00"
    "fetched": "2026-04-28 11:37:10"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 C8ine and Amazon EC2 M8ine instances, powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These also instances feature the latest sixth generation AWS Nitro cards. C8ine and M8ine instances deliver up to 43% higher performance compared to previous generation C6in and M6in instances.</p> \n<p>C8ine and M8ine instances offer up to 2.5 times higher packet performance per vCPU versus prior generation network optimized instances. They provide up to 2x higher network throughput for traffic going through Internet gateways compared to existing C6in and M6in network optimized instances.&nbsp;</p> \n<p>Both instance families are designed for security and network virtual appliances, including virtual firewalls, load balancers, and Telco 5G UPF workloads.<br /> <br /> Amazon EC2 C8ine instances are available in US East (N. Virginia), US West (Oregon), and Asia Pacific (Tokyo), while Amazon EC2 M8ine instances are available in US East (N. Virginia) and US West (Oregon). C8ine and M8ine instances are available via Savings Plans and On-Demand instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 C8i instance</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\">Amazon EC2 M8i instance</a>&nbsp;pages.</p>"
  "92f63a37e1e4c8da0acb1827882a71cd":
    "id": "92f63a37e1e4c8da0acb1827882a71cd"
    "title": "AWS Billing Conductor launches Passthrough Pricing Plan for Billing Transfer users"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-billing-conductor-launches-passthrough/"
    "published": "2026-04-28 03:44:00"
    "fetched": "2026-04-29 01:07:18"
    "summary": "<p>AWS Billing Conductor now supports the Passthrough Pricing Plan, a new managed pricing plan for Billing Transfer users.</p> \n<p>Customers using Billing Transfer can now select the AWS-managed Passthrough Pricing Plan for their billing groups. Under this plan, all accounts in a billing group view billable data that reflects the AWS invoice value through their primary view.</p> \n<p>Customers can apply the new Passthrough Pricing Plan by logging into their Bill-Transfer account and selecting a pricing plan in the Billing Transfer page as they configure a new transfer. For existing billing groups, Customers can apply Passthrough Pricing&nbsp;via the AWS Billing Conductor Console. Once configured, the Bill-Transfer account will see the same billing data across both the My View and Showback/Chargeback views associated with billing group's consumption.</p> \n<p>Direct Customers or Channel Partners who wish to use Billing Transfer to centralize billing and simplify payments without protecting proprietary discounts or customizing the billing data visible to the accounts in the billing groups, can do so by selecting the Passthrough Pricing plan, free of charge. </p> \n<p>This feature is available in the US East (N. Virginia) region. To get started, visit the Billing Transfer page in the AWS Billing and Cost Management Console or the <a href=\"https://console.aws.amazon.com/billingconductor\">AWS Billing Conductor console</a>. To learn more about Billing Transfer and AWS Billing Conductor visit the <a href=\"https://aws.amazon.com/aws-cost-management/aws-billing-transfer/\">Billing Transfer product page</a>, <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/orgs_transfer_billing.html\">AWS Billing documentation</a> and the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/what-is-costmanagement.html\">AWS Cost Management documentation.</a></p> \n<p> &nbsp;</p>"
  "897cdaf25ec4d02962a36f31218446cc":
    "id": "897cdaf25ec4d02962a36f31218446cc"
    "title": "AWS Announces Amazon Connect Decisions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-decisions-april/"
    "published": "2026-04-28 23:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Today, AWS announces the general availability of Amazon Connect Decisions, an agentic AI planning and intelligence solution that helps supply chain teams shift from firefighting to proactive operations. Combining 30 years of Amazon operational science and 25+ specialized supply chain tools, AI teammates adapt to your business, learn from your team's decisions, and continuously improve operations. Amazon Connect Decisions can be used by businesses across retail, CPG, automotive, and industrial manufacturing industries, among others, that want to transform their supply chain operations without having to replace their existing systems.&nbsp;</p> \n<p>AI teammates work 24/7 to harmonize demand signals into consensus forecasts, generate constraint-aware supply plans, and monitor operations across your supply chain — detecting variances, performing automated root cause analysis, and triaging thousands of exceptions, surfacing only what matters most based on your business priorities as actionable recommendations.&nbsp;</p> \n<p>Click <a href=\"https://aws.amazon.com/products/connect/decisions\" title=\"Hyperlink to Amazon Connect Decisions PDP\">here</a> to start a free trial or learn more about how Amazon Connect Decisions can help you make better decisions, faster, so your organization can prevent stockouts, reduce working capital waste, and transform supply chain performance.</p>"
  "f7fd40455794400488587e51d0a32080":
    "id": "f7fd40455794400488587e51d0a32080"
    "title": "Amazon Quick now available as a desktop application for macOS and Windows (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-macos-windows-preview/"
    "published": "2026-04-28 23:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Amazon Quick is now available as a native desktop application for macOS and Windows in preview. The desktop application extends Quick beyond your browser and utilizes the capabilities on your computer– including direct access to local files, proactive OS-level notifications, and native desktop control. Teams and individuals who want an AI assistant that understands their full work context across files, calendar, communications, and applications can now run Quick directly on their desktop.<br /> <br /> With Quick on your desktop, you can read and work with files on your computer without uploading them, receive notifications when action items, calendar conflicts, or messages need your attention, and automate browser-based tasks and desktop applications. Quick builds a personal knowledge graph that learns your people, projects, and relationships across every interaction–compounding context over time. For builders, the desktop application supports local Model Context Protocol (MCP) connections to coding agents. Memory, knowledge graph, and agents are shared across web and desktop, so your context travels with you across surfaces.<br /> <br /> The Amazon Quick desktop application is available in preview to all Quick subscribers on macOS and Windows in all US East (N. Virginia).<br /> <br /> To get started, download the Quick desktop application <a href=\"https://aws.amazon.com/quick/download/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>here.</u></a> Start working with Amazon Quick by <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\"><u>signing up for an account</u></a>. To learn more, visit our <a href=\"https://aws.amazon.com/quick/desktop/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>website </u></a>and <a href=\"https://docs.aws.a2z.com/quick/latest/userguide/amazon-quick-desktop.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon Quick documentation.</u></a></p>"
  "d3ac2dc921fa1902e226c6257933380f":
    "id": "d3ac2dc921fa1902e226c6257933380f"
    "title": "Amazon Quick now supports document and visual creation in chat"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick/"
    "published": "2026-04-28 20:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Today, Amazon Quick introduces document and visual creation capabilities, enabling you to produce polished documents, presentations, spreadsheets, and more through natural language without leaving your conversation. No more switching between multiple tools to draft reports, build decks, or format tables. Quick users can now create documents and visuals, refine them in conversation or inline, and download finished files including Word, PDF, PowerPoint, and Excel formats.<br /> <br /> Quick also generates images, infographics, charts, and other visuals you can embed in any document or presentation, or export as standalone image files, all from the same conversation. Visual creation is currently available in preview.<br /> Whether you need to generate an executive briefing from meeting notes, create a deck to review quarterly sales trends, build a spreadsheet in Excel or produce an infographic that brings your data to life, Quick handles the end-to-end creation process within your existing chat workflow. This capability is ideal for business analysts, product managers, marketing, finance, and operations teams who need to quickly transform data and insights into shareable, presentation-ready materials without switching tools.<br /> <br /> Document creation is available in all AWS Regions where Amazon Quick is currently supported. Visual creation (preview) is available in the US East (N. Virginia) and US West (Oregon) AWS Regions.<br /> You can <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" rel=\"noopener noreferrer\" target=\"_blank\"><u>sign up for an account</u></a> and start working with Quick for free; no AWS account or credit card is required. To get started with document and visual creation, open a chat conversation and describe whatever you need created. To learn more, see the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/document-and-visual-creation.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon Quick User Guide</u></a>.</p>"
  "35b48458cff06b6759778398abc104bb":
    "id": "35b48458cff06b6759778398abc104bb"
    "title": "Amazon Quick expands integrations to include Google Workspace, Zoom, Airtable, and more"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-google-workspace-zoom/"
    "published": "2026-04-28 20:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Amazon Quick is expanding integrations with 13 new built-in action connectors, all supporting managed authentication so users can securely connect their accounts in just a few clicks without manual credentials setup. Amazon Quick is an AI assistant that turns questions into answers, answers into actions, and actions into outcomes—for you and your entire team. Quick brings all your tools and data together in one place. It learns what matters to you and your team, grounds every answer in your real business data, and goes beyond answers: scheduling, building deliverables, creating dashboards, and acting on your behalf.<br /> <br /> With Quick, business users can now take action directly across Gmail, Google Sheets, Google Docs, Google Calendar, Google Drive, Google Slides, Google Meet, Google Analytics, Zoom, QuickBooks, Airtable, and Dropbox. For example, you can draft and send emails in Gmail, update a Google Sheet with the latest data, schedule a meeting in Google Calendar, share files from Google Drive or Dropbox, schedule a Zoom meeting, sync financial records in QuickBooks, manage projects in Airtable, or collaborate with your team in Microsoft Teams, all without leaving Quick. Each connector includes built-in sign-in support, so Quick securely handles the account authorization flow on your behalf, making it easy to get connected in just a few clicks.<br /> <br /> These connectors are now available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon Quick is available.<br /> <br /> Start working with Amazon Quick by <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" target=\"_blank\"><u>signing up for an account</u></a>. To learn more about integrations, visit the <a href=\"https://aws.amazon.com/quick/integrations/\" target=\"_blank\">integrations webpage</a> and<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/working-with-integrations.html\" target=\"_blank\"> documentation</a>.</p>"
  "14c83dcac36c5171eaddd8f72e9cc07e":
    "id": "14c83dcac36c5171eaddd8f72e9cc07e"
    "title": "Start using Amazon Quick for free in minutes with Free and Plus pricing plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-quick-free-plus/"
    "published": "2026-04-28 20:30:00"
    "fetched": "2026-04-29 03:14:44"
    "summary": "<p>Starting today, new Free and Plus pricing plans for <u><a href=\"https://aws.com/quick\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick</a></u> allow you to <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" rel=\"noopener noreferrer\" target=\"_blank\"><u>sign up in minutes</u></a> using your personal email address or existing Google, Apple, Github, or Amazon credentials—no AWS account required. A guided onboarding experience helps you find value in less than 5 minutes, with role-specific workflows for sales, marketing, finance, operations, and more.<br /> <br /> Amazon Quick is an AI assistant that turns questions into answers, answers into actions, and actions into outcomes—for you and your entire team. Quick connects with all your applications, tools, and data, creating your own personal knowledge graph that learns your priorities, preferences, and network. It doesn't just answer your questions; it knows how you want to work. Give it a task and it takes action—scheduling meetings, sending emails, and following up on action items. Whether you’re a seller looking to prioritize leads and generate personalized outreach to top prospects or a marketing manager looking to optimize campaign performance, Quick learns what matters to you and your team, grounds every answer in your real business data, and goes beyond answers: scheduling, building deliverables, and acting on your behalf.<br /> <br /> You <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" rel=\"noopener noreferrer\" target=\"_blank\"><u>can sign up for an account</u></a> and start working in Amazon Quick in minutes. By the end of the day, you'll wonder how you ever worked without it. Amazon Quick is also available through Professional and Enterprise plans that include additional agentic/business intelligence capabilities, enterprise governance, support for any number of users, and more. To compare plans, visit the <a href=\"https://aws.amazon.com/quick/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon Quick pricing plans page</u></a>. Visit <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/standalone-signup.html\" target=\"_blank\">Signing up at quick.aws.com documentation</a>.&nbsp;</p>"
  "f3125625516ff603e43513c8ac01ab00":
    "id": "f3125625516ff603e43513c8ac01ab00"
    "title": "Build custom applications using natural language in Amazon Quick (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/custom-applications/"
    "published": "2026-04-28 23:30:00"
    "fetched": "2026-04-29 05:12:32"
    "summary": "<p>Today, AWS announces new features in preview for <a href=\"https://www.aws.com/quick/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick</a>, allowing users to create custom web applications in minutes using natural language. Creating internal tools and web applications typically requires developer resources or technical skills, but with this new capability, any user can simply describe what they need and get a fully interactive application—no coding required. These applications connect to live data sources, implement complex workflows, embed AI-powered features, and can be published and shared with your team in one click.</p> \n<p>Whether you’re a sales leader wanting to create an application for pipeline review by pulling data from a CRM and other business applications in real time, or a finance manager looking to simplify monthly close by aggregating information from QuickBooks, Excel, and internal systems, Quick allows anyone to create applications that will drive their business forward using a simple prompt.</p> \n<p>Amazon Quick is an AI assistant for work that turns questions into answers, answers into actions, and actions into outcomes — for you and your entire team. You can <a href=\"https://us-east-1.signin.aws/platform/d-9067642ac7/login?workflowStateHandle=d95d4042-bc2a-48d9-9c53-f08910af24d8#/validation\" rel=\"noopener noreferrer\" target=\"_blank\">sign up</a> for an account and start working with Amazon Quick for free; no AWS account or credit card is required. A guided onboarding experience helps you find value in less than 5 minutes, with role-specific workflows for sales, marketing, finance, HR, and more. To learn more about building applications in Quick, visit the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/using-amazon-quick-apps.html\" rel=\"noopener noreferrer\" target=\"_blank\">product documentation</a> or <a href=\"https://www.aws.com/quick/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick product page</a>.</p>"
  "d822524d0af93edc3259a33eb1e75de7":
    "id": "d822524d0af93edc3259a33eb1e75de7"
    "title": "Amazon SageMaker Training Plans now provides capacity utilization monitoring through Amazon CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-training-plan-cloudwatch-observability/"
    "published": "2026-04-28 00:00:00"
    "fetched": "2026-04-29 06:54:07"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/reserve-capacity-with-training-plans.html\">Amazon SageMaker Training Plans</a> now supports <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html\">Amazon CloudWatch</a> metrics to monitor the utilization of capacity reservations associated with your purchased plan. SageMaker Flexible Training Plans helps you create the most cost-efficient training plans that fit within your timeline and AI budget. Once you create and purchase your training plans, SageMaker automatically provisions the infrastructure and runs the AI workloads on these compute resources without requiring any manual intervention. </p> \n<p>This feature provides administrators access to both historical and real-time metrics on instance usage—at the individual plan level and across all plans in your account—enabling them to make informed decisions about capacity and cost. To learn more about the Flexible Training Plan reservation monitoring feature, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/training-plan-cw-metrics.html\">Amazon SageMaker Training Plans User Guide</a>.<br /> <br /> For a detailed breakdown of Training Plan instance availability by AWS Region, see the <a href=\"https://aws.amazon.com/sagemaker/ai/pricing/\">SageMaker AI pricing page</a></p>"
"last_updated": "2026-04-29 06:54:07 JST"
