"entries":
  "6f4ba18b4870df052f8a6ac12ec3b71c":
    "id": "6f4ba18b4870df052f8a6ac12ec3b71c"
    "title": "Amazon SageMaker HyperPod now supports G7e and r5d.16xlarge instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-hyperpod-g7e-r5d/"
    "published": "2026-04-28 00:30:00"
    "fetched": "2026-04-28 02:18:37"
    "summary": "<p>Amazon SageMaker HyperPod now supports <a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\" target=\"_blank\">G7e</a> and r5d.16xlarge instances. SageMaker HyperPod is a purpose-built infrastructure for developing, training, and deploying foundation models at scale. It provides a resilient and performant environment with built-in fault tolerance, automated cluster recovery, and optimized distributed training libraries, reducing the undifferentiated heavy lifting of managing large-scale AI/ML infrastructure.&nbsp;</p> \n<p>G7e instances are powered by NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs and deliver up to 2.3x better inference performance than G6e instances, allowing you to process more requests per second while reducing latency. With up to 768 GB of total GPU memory, G7e instances let you deploy larger language models or run multiple models on a single endpoint. You can use these instances for deploying LLMs, agentic AI, multimodal generative AI, and physical AI models. G7e instances are also well suited for cost-efficient single-node fine-tuning or training of NLP, computer vision, and smaller generative AI models, with up to 1.27x the TFLOPs and up to 4x the GPU-to-GPU bandwidth compared to G6e. In addition, HyperPod now supports r5d.16xlarge as well. The r5d.16xlarge instance provides 64 vCPUs, 512 GB of memory, and 5 x 600 GB NVMe SSD instance storage, powered by Intel Xeon Platinum 8000 series processors with a sustained all-core turbo frequency of up to 3.1 GHz. This instance is well suited for distributed training data preprocessing especially with frameworks such as Ray, large-scale feature engineering, and running memory-heavy orchestration services alongside GPU compute.<br /> <br /> G7e instances are available in US East (N. Virginia), US East (Ohio), Asia Pacific (Tokyo), and US West (Oregon) and r5d.16xlarge is available in all regions Amazon SageMaker HyperPod is available in.&nbsp;</p>"
  "cd0716f637d356fb82fbc820aa542bb8":
    "id": "cd0716f637d356fb82fbc820aa542bb8"
    "title": "Amazon Redshift Serverless is now available in the AWS Asia Pacific (Melbourne) and Canada West (Calgary) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-redshift-serverless-melbourne-calgary-regions/"
    "published": "2026-04-28 04:00:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Amazon Redshift Serverless</a>, which allows you to run and scale analytics without having to provision and manage data warehouse clusters, is now generally available in the AWS&nbsp;Asia Pacific (Melbourne) and Canada West (Calgary) regions. With Amazon Redshift Serverless, all users, including data analysts, developers, and data scientists, can use Amazon Redshift to get insights from data in seconds. Amazon Redshift Serverless automatically provisions and intelligently scales data warehouse capacity to deliver high performance for all your analytics. You only pay for the compute used for the duration of the workloads on a per-second basis. You can benefit from this simplicity without making any changes to your existing analytics and business intelligence applications.<br /> <br /> With a few clicks in the AWS Management Console, you can get started with querying data using the Query Editor V2 or your tool of choice with Amazon Redshift Serverless. There is no need to choose node types, node count, workload management, scaling, and other manual configurations. You can create databases, schemas, and tables, and load your own data from Amazon S3, access data using Amazon Redshift data shares, or restore an existing Amazon Redshift provisioned cluster snapshot. With Amazon Redshift Serverless, you can directly query data in open formats, such as Apache Parquet, Apache Iceberg in Amazon S3 data lakes. Amazon Redshift Serverless provides unified billing for queries on any of these data sources, helping you efficiently monitor and manage costs.<br /> <br /> To get started, see the Amazon Redshift Serverless <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html\">user documentation</a>, and <a href=\"https://docs.aws.amazon.com/redshift-serverless/latest/APIReference/Welcome.html\">API Reference</a>.</p>"
  "aa81aed40121b95cf708b0e7cdd89443":
    "id": "aa81aed40121b95cf708b0e7cdd89443"
    "title": "Amazon Connect increases attachment file sizes and adds custom file types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-increases-attachment/"
    "published": "2026-04-28 03:45:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p>Amazon Connect now supports attachment file sizes up to 100 MB for chat, cases, and tasks, up from the previous 20 MB limit.&nbsp;Administrators can enable these higher limits and configure custom file extensions for attachments across chat, email, cases, and tasks through the Amazon Connect admin website or <a href=\"https://docs.aws.amazon.com/connect/latest/APIReference/files-api.html\">Amazon Connect APIs</a>.</p> \n<p>A technology company supporting enterprise customers can now accept files like diagnostic bundles and log archives up to 100 MB through chat, reducing back-and-forth and helping agents resolve issues faster. A financial services firm can add file extensions for signed contracts or compliance documents, giving customers the ability to attach paperwork directly in chat or email.</p> \n<p>You can use these features in the following AWS Regions: US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Osaka), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Africa (Cape Town), Canada (Central), Europe (Frankfurt), and Europe (London).</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/connect/\">Amazon Connect</a>&nbsp;and see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/enable-attachments.html\">Enable Attachments</a>&nbsp;in the Amazon Connect Administrator Guide.</p>"
  "c6c56f0ff8b1d9adfbb4ef2c12f12b3d":
    "id": "c6c56f0ff8b1d9adfbb4ef2c12f12b3d"
    "title": "Amazon FSx for OpenZFS Single-AZ (HA) file systems are now available in 17 additional AWS commercial and AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-fsx-openzfs-single-az-ha/"
    "published": "2026-04-28 01:53:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p>You can now create Amazon FSx for OpenZFS Single-AZ (HA) file systems in seventeen additional AWS Regions across the South America, Europe, Africa, Asia Pacific, and AWS GovCloud (US).</p> \n<p>Amazon FSx for OpenZFS provides fully managed, cost-effective, shared file storage powered by the popular OpenZFS file system. It’s designed to deliver sub-millisecond latencies and multi-GB/s throughput along with rich ZFS-powered data management capabilities (like snapshots, data cloning, and compression). Single-AZ (HA) file systems are a cost-effective solution for workloads that need high availability but don’t need storage redundancy across multiple availability zones, such as data analytics, machine learning, and semiconductor chip design.</p> \n<p>With this expansion, FSx for OpenZFS Single-AZ (HA) file systems are now available in the following additional AWS Regions: Africa (Cape Town), Asia Pacific (Hyderabad, Jakarta, Malaysia, Osaka, Taipei, Thailand), Canada West (Calgary), Europe (Milan, Paris, Spain, Zurich), Israel (Tel Aviv), Mexico (Central), South America (São Paulo), and AWS GovCloud (US-East, US-West). To learn more about Amazon FSx for OpenZFS, visit our <a href=\"https://aws.amazon.com/fsx/openzfs/\">product page</a>, and see the FSx for OpenZFS <a href=\"https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/available-aws-regions.html\">Region Table</a> for complete regional availability information.</p>"
  "c32687b6af41a808208ac5f36b194a80":
    "id": "c32687b6af41a808208ac5f36b194a80"
    "title": "Amazon Redshift Serverless AI-driven scaling is now the default for new workgroups"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-redshift-serverless-ai-driven-scaling-default/"
    "published": "2026-04-28 07:03:00"
    "fetched": "2026-04-28 08:50:45"
    "summary": "<p>Amazon Redshift Serverless now makes AI-driven scaling and optimization the default for all new workgroups. AI-driven scaling uses machine learning to predict compute needs and automatically adjust resources before queries queue, delivering better price-performance without manual tuning. This release also expands support to workloads with a Base RPU range of 8–512 RPU, up from the previous 32–512 RPU, reducing the entry cost for AI-driven scaling.<br /> <br /> With AI-driven scaling and optimization, Amazon Redshift monitors your workload patterns and automatically adjusts compute resources based on query complexity, data volume, and expected data scan size. You can use the price-performance slider to choose whether to prioritize cost, performance, or a balance of both. Amazon Redshift also applies additional optimizations, including automatic materialized views and automatic table design optimization, to meet your selected target. To configure price-performance targets, use the AWS Management Console or Amazon Redshift API operations. You can also modify the target after you create the workgroup.<br /> <br /> Amazon Redshift Serverless AI-driven scaling and optimization is available in all AWS Regions where Amazon Redshift Serverless is available.&nbsp;For more information,&nbsp;see Amazon Redshift Serverless <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">product page</a>&nbsp;and&nbsp;AI-driven scaling and optimization <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-capacity.html#serverless-auto-optimization\">documentation</a>.</p>"
"last_updated": "2026-04-28 08:50:45 JST"
