    "title": "CVE-2026-7191- Arbitrary Code Execution via Sandbox Bypass in QnABot on AWS"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-020-aws/"
    "published": "2026-04-28 05:21:23"
    "fetched": "2026-04-28 05:58:19"
    "summary": "<p><b>Bulletin ID:</b> 2026-020-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/04/27 13:15 PM PDT</p> \n<p><b>Description:</b></p> \n<p>QnABot on AWS is an open-source solution that provides a multi-channel, multi-language conversational interface powered by Amazon Lex, Amazon OpenSearch Service, and optionally Amazon Bedrock.</p> \n<p>We identified CVE-2026-7191, where the improper use of the static-eval npm package may allow an authenticated administrator to execute arbitrary code within the fulfillment Lambda execution context. By injecting a crafted conditional chaining expression via the Content Designer interface, an actor with Admin access could bypass the intended expression sandbox through JavaScript prototype manipulation. Successful exploitation may grant direct access to backend resources, including Lambda environment variables, OpenSearch indices, S3 objects, and DynamoDB tables, that are not exposed through normal administrative interfaces.</p> \n<p><b>Impacted versions:</b> &lt;=7.2.4</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-04-28 05:58:19 JST"
