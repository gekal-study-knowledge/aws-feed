"overview": |
  この日は「What's Next with AWS」に向けた Amazon Quick の大型アップデートが最大の話題でした。Quick は macOS/Windows 向けネイティブデスクトップアプリ (プレビュー)、チャット内でのドキュメント・ビジュアル作成、自然言語によるカスタムアプリ構築 (プレビュー)、Google Workspace・Zoom・Airtable など 13 の新コネクタ、無料 Free/Plus プランを一挙に発表しました。また Amazon Connect Decisions というサプライチェーン向けエージェント型 AI ソリューションも GA。EC2 では第 6 世代 Intel Xeon 搭載の M8in/M8ib、R8in/R8ib、C8ine/M8ine インスタンスが GA となり、旧世代比最大 43% の性能向上を実現しました。データ分析では Amazon Redshift Serverless が Melbourne/Calgary で提供開始し AI 駆動スケーリングを新規ワークグループのデフォルトに。AWS KMS のキー最終使用日時追跡、CloudWatch RUM の App Monitors 改善、FSx for OpenZFS の 17 リージョン拡大なども発表され、セキュリティ速報では QnABot on AWS の任意コード実行脆弱性 (CVE-2026-7191) が公開されました。
