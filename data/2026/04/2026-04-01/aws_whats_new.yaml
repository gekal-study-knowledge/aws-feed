  "857da3baf08ca5052a7b8a470d2417d1":
    "id": "857da3baf08ca5052a7b8a470d2417d1"
    "title": "AWS Managed Microsoft AD adds Multi-Region replication for Opt-In regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/multi-region-opt-in-aws-microsoft-ad/"
    "published": "2026-04-01 16:00:00"
    "fetched": "2026-04-01 16:00:00"
    "summary": "<p>AWS Directory Service for Microsoft Active Directory, also known as AWS Managed Microsoft AD, now supports Multi-Region replication in AWS Opt-In regions. This expands the existing Multi-Region replication capability to&nbsp;additional&nbsp;AWS regions,&nbsp;eliminating&nbsp;the need to create and manually synchronize independent directories in each region&nbsp;and allowing domain-joined workloads in those regions to connect to AWS Managed Microsoft AD.</p> \n<p>With automated Multi-Region replication, AWS Managed Microsoft AD handles inter-region networking, deploys domain controllers in separate Availability Zones per region, and replicates all directory data including users, groups, Group Policy Objects, and schema. The service configures an Active Directory site per region to&nbsp;optimize&nbsp;authentication performance and minimize cross-region data transfer costs.&nbsp;</p> \n<p>Multi-Region replication is available in&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/regions.html\">AWS Opt-In regions</a>&nbsp;where AWS Managed Microsoft AD is available, except the Middle East (UAE) and Middle East (Bahrain) Regions. You pay by the hour for the domain controllers in each region, plus the cross-region data transfer.&nbsp; To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_configure_multi_region_replication.html\">Configure Multi-Region replication guide</a>.</p>"
  "6a5b58f24a55390877064c781ab17946":
    "id": "6a5b58f24a55390877064c781ab17946"
    "title": "Amazon CloudFront now supports SHA-256 for signed URLs and signed cookies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudfront-sha-256-signed-urls/"
    "published": "2026-04-02 02:38:00"
    "fetched": "2026-04-02 02:38:00"
    "summary": "<p>Amazon CloudFront now supports SHA-256 as a hash algorithm for creating signed URLs and signed cookies. SHA-256 provides an improved security posture with stronger collision detection and alignment with modern cryptographic standards, giving you stronger cryptographic signing when restricting access to content. Previously, CloudFront signed URLs and signed cookies used SHA-1 exclusively for signature generation. This feature helps you meet security and compliance requirements that mandate SHA-256 for digital signatures, while also future-proofing your content delivery workflows.<br /> <br /> To use SHA-256, include the <i>Hash-Algorithm=SHA256</i> query parameter in your signed URLs, or the <i>CloudFront-Hash-Algorithm=SHA256</i> cookie attribute for signed cookies. Existing signed URLs and signed cookies that don't specify a hash algorithm continue to use SHA-1, so this change is fully backwards compatible.</p> \n<p>This feature is available in all edge locations where Amazon CloudFront is available. There is no additional cost to use SHA-256 signing. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-creating-signed-url-canned-policy.html\" rel=\"noopener noreferrer\" target=\"_blank\">Create a signed URL using a canned policy</a> or <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-setting-signed-cookie-canned-policy.html\" rel=\"noopener noreferrer\" target=\"_blank\">Set signed cookies using a canned policy</a> in the <i>Amazon CloudFront Developer Guide</i>.</p>"
  "e445e73ed4f049e82bcff80dc7a4ef46":
    "id": "e445e73ed4f049e82bcff80dc7a4ef46"
    "title": "Amazon RDS for Oracle now supports cross-account snapshot sharing with additional storage volumes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/rds-oracle-cross-account-snapshot-sharing-additional-storage-volume/"
    "published": "2026-04-02 00:00:00"
    "fetched": "2026-04-02 00:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon RDS for Oracle</a> now supports cross-account snapshot sharing for database instances with additional storage volumes. Additional storage volumes allow customers to scale database storage up to 256 TiB by adding up to three storage volumes, each with up to 64 TiB, in addition to the primary storage volume. With this launch, customers can create, share, and copy a database snapshot across AWS accounts for database instances set up with additional storage volumes. Cross account snapshots enable customers to set up isolated backup environments in separate accounts for compliance requirements and to perform diagnostics, such as investigating production issues by restoring database snapshots in a separate account for development and testing.<br /> <br /> Cross account snapshots for database instances with additional storage volumes preserve the storage layout of the original database instance, including the configuration of additional storage volumes. When a snapshot is shared to a target AWS account, authorized users in the target account can restore it to another database instance, copy the snapshot within the same or different AWS Region, or create independent backups under different AWS Identity and Access Management (IAM) access permissions for backup and disaster recovery.<br /> <br /> Cross-account snapshot sharing with additional storage volumes is available in all AWS Regions, including AWS GovCloud (US) Regions. Customers can start using this feature today through the AWS Management Console, AWS CLI, or AWS SDKs. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html\">Sharing a DB snapshot for Amazon RDS</a>, <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_CopySnapshot.html\">Copying a DB snapshot for Amazon RDS</a>, and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/User_Oracle_AdditionalStorage.html\">Working with storage in RDS for Oracle</a> in the Amazon RDS User Guide.</p>"
  "7b4120be8131c54f10097c98d494aece":
    "id": "7b4120be8131c54f10097c98d494aece"
    "title": "Oracle Database@AWS launches sub-millisecond network latency for high performance applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/oracle-database-aws-launches-high-performance-networking/"
    "published": "2026-04-01 16:00:00"
    "fetched": "2026-04-01 16:00:00"
    "summary": "<p>Today,<b> </b><a href=\"https://aws.amazon.com/marketplace/featured-seller/oracle/\" target=\"_blank\">Oracle Database@AWS</a> (ODB@AWS) announced high performance networking that provides customers consistent sub-millisecond roundtrip latency from their AWS applications to the database. Many applications such as payment processing, securities trading, and high volume transaction processing require predictable and consistent low-latency network connectivity to the application database. Customers who run such latency-sensitive applications on Oracle Exadata systems on-premises optimize their infrastructure to obtain the performance that these applications require. With high performance networking for ODB@AWS, customers can now seamlessly migrate these applications to an equivalent optimized environment on AWS.<br /> <br /> ODB@AWS automatically provides consistent and predictable low-latency network connectivity from Amazon EC2 instances to ODB@AWS databases through optimized placement of compute instances. When customers create an ODB@AWS network for their databases, they can now launch placement optimized Amazon EC2 instances with consistent, sub-millisecond latency network connectivity to their databases using existing Amazon EC2 APIs and workflows, such as launching new EC2 instances, or reserving compute capacity with EC2 On-Demand Capacity Reservations. There is no additional charge for EC2 instances using optimized placement for connectivity to ODB@AWS databases.<br /> <br /> The feature is available in the US-East-2 (Ohio), CA-Central-1 (Canada Central), EU-Central-1 (Frankfurt), EU-West-1 (Dublin), AP-Northeast-1 (Tokyo), and AP-Southeast-2 (Sydney) AWS Regions, with more Regions coming soon. For more information, see <a href=\"https://docs.aws.amazon.com/odb/latest/UserGuide/high-performance-networking.html\" target=\"_blank\">High performance networking for Oracle Database@AWS</a>.</p>"
  "4c147e648c9a93e84f8661af691c95ab":
    "id": "4c147e648c9a93e84f8661af691c95ab"
    "title": "AWS VPC Encryption Controls now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-vpc-encryption-controls/"
    "published": "2026-04-02 03:20:00"
    "fetched": "2026-04-02 03:20:00"
    "summary": "<p>AWS launches VPC Encryption Controls in AWS GovCloud (US) Regions to make it easy to audit and enforce encryption in transit within and across Amazon Virtual Private Clouds (VPC), and demonstrate compliance with encryption standards. You can turn it on your existing VPCs to monitor encryption status of traffic flows and identify VPC resources that are unintentionally allowing plaintext traffic. This feature also makes it easy to enforce encryption across different network paths by automatically (and transparently) turning on hardware-based AES-256 encryption on traffic between multiple VPC resources including AWS Fargate, Network Load Balancers, and Application Load Balancers.</p> \n<p>To meet stringent compliance standards like HIPAA, PCI DSS, FedRAMP, and FIPS 140-2, government customers rely on both application layer encryption and the hardware-based encryption that AWS offers across different network paths. AWS provides hardware-based AES-256 encryption transparently between modern EC2 Nitro instances. AWS also encrypts all network traffic between AWS data centers in and across Availability Zones, and AWS Regions before the traffic leaves our secure facilities. All inter-region traffic that uses VPC Peering, Transit Gateway Peering, or AWS Cloud WAN receives an additional layer of transparent encryption before leaving AWS data centers. Prior to this release, customers had to track and confirm encryption across all network paths. With VPC Encryption Controls, customers can now monitor, enforce and demonstrate encryption within and across Virtual Private Clouds (VPCs) in just a few clicks. Your information security team can turn it on centrally to maintain a secure and compliant environment, and generate audit logs for compliance and reporting.</p> \n<p>With this launch, VPC Encryption Controls is now available in AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. To learn more about this feature and its use cases, please see our <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-encryption-controls.html\">documentation</a>.</p>"
  "ff7a6e5fbde822996f5ab0b39d166e88":
    "id": "ff7a6e5fbde822996f5ab0b39d166e88"
    "title": "Amazon SES Mail Manager adds new features for enhanced security and email processing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ses-mail-manager-introduces-new-features/"
    "published": "2026-04-02 06:13:00"
    "fetched": "2026-04-02 06:13:00"
    "summary": "<p>Amazon Simple Email Service (SES) Mail Manager now offers enhancements to email security and processing while simplifying email infrastructure migrations. These enhancements include optional TLS and certificate-based authentication (mTLS) support in Ingress Endpoint, and two new rule actions: Invoke Lambda function and Bounce.<br /> <br /> These enhancements benefit organizations seeking to maintain compatibility with legacy systems while implementing stronger security controls, and advanced email routing capabilities. For example customers can now configure STARTTLS as an optional TLS configuration, enabling legacy systems that don't support STARTTLS to connect to Mail Manager. With Mutual TLS (mTLS) in Ingress Endpoint customers can now used certificate-based authentication for enhanced security. The Invoke Lambda function rule action allows direct invocation of AWS Lambda functions from rule sets, enabling custom email processing workflows and the Bounce rule action provides RFC-compliant SMTP responses to sending servers.</p> \n<p>These new enhancements are available today in all AWS Regions where Amazon SES Mail Manager is offered, except for the Middle East (UAE) and Middle East (Bahrain) regions. To learn more about Amazon SES Mail Manager and how these features can help streamline your email operations, visit <a href=\"https://aws.amazon.com/ses/\">https://aws.amazon.com/ses/</a>.</p>"
  "41dd8a97a9441d4d95ee0d6257e8c894":
    "id": "41dd8a97a9441d4d95ee0d6257e8c894"
    "title": "Amazon SageMaker Data Agent now supports geo-specific inference for Japan and Australia"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/sage-maker-da-infr-jp-au/"
    "published": "2026-04-02 05:30:00"
    "fetched": "2026-04-02 05:30:00"
    "summary": "<p>Amazon SageMaker Data Agent now supports cross-region inference profiles for Japan and Australia through Amazon Bedrock. With this update, inference requests from Data Agent in the Asia Pacific (Tokyo) and Asia Pacific (Sydney) regions are processed within their respective geographies, supporting data sovereignty requirements for customers in Japan and Australia.</p> \n<p>Data Agent provides an AI-powered conversational experience for data exploration, Python and SQL code generation, troubleshooting, and analytics directly within Amazon SageMaker Unified Studio Notebook and Query Editor. With geo-specific inference through JP-CRIS (Japan Cross-Region Inference) and AU-CRIS (Australia Cross-Region Inference), you can use Data Agent with confidence that your inference requests are routed exclusively within your geography over the AWS Global Network. Customers in regulated industries such as financial services, healthcare, and the public sector can meet data residency requirements while using the full set of Data Agent capabilities.</p> \n<p>To get started, open a project in <a href=\"https://aws.amazon.com/sagemaker/unified-studio/\" style=\"background-color: rgb(255,255,255);\">SageMaker Unified Studio</a> in a supported region and use Data Agent in notebooks or Query Editor. For more information, see SageMaker Data Agent in the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/getting-started.html\" style=\"background-color: rgb(255,255,255);\">Amazon SageMaker Unified Studio</a> User Guide.</p>"
  "ee5f4c66be853f06e561e0f4956b3cb4":
    "id": "ee5f4c66be853f06e561e0f4956b3cb4"
    "title": "Amazon Bedrock now supports structured outputs to AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-bedrock-structured-outputs-govcloud/"
    "published": "2026-04-01 19:00:00"
    "fetched": "2026-04-01 19:00:00"
    "summary": "<p>Amazon Bedrock is a fully managed service that provides access to a wide selection of high-performing foundation models from leading AI companies through a single API. Today, Amazon Bedrock expands structured outputs support to AWS GovCloud (US) Regions. Structured outputs enables foundation models to return consistent, schema-compliant, machine-readable responses—making it well-suited for government and regulated workloads that must meet strict compliance and data handling requirements.</p> \n<p>Structured outputs helps with common production tasks, such as extracting key fields and powering workflows that use APIs or tools, where even minor formatting errors can break downstream systems. By ensuring schema compliance, it reduces the need for custom validation logic and lowers operational overhead by minimizing failed requests and retries—so you can confidently deploy AI applications that require predictable, machine-readable outputs. You can use structured outputs either by defining a JSON schema that describes your desired response format or by using strict tool definitions to ensure a model's tool calls match your specifications.</p> \n<p>Structured outputs is now generally available in all commercial AWS and AWS GovCloud (US)&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/bedrock.html\" target=\"_blank\">Regions</a>&nbsp;where Amazon Bedrock is supported. To learn more about structured outputs and the supported models, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html\" target=\"_blank\">Amazon Bedrock documentation.</a></p>"
  "4d3dcf8de4bbf038ccdc161c9c693fa5":
    "id": "4d3dcf8de4bbf038ccdc161c9c693fa5"
    "title": "Amazon ECS announces Managed Daemons for ECS Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ecs-managed-daemons/"
    "published": "2026-04-02 06:00:00"
    "fetched": "2026-04-02 06:00:00"
    "summary": "<p>Amazon ECS announces Managed Daemons for <a href=\"https://aws.amazon.com/ecs/managed-instances/\">ECS Managed Instances</a>, enabling organizations to centrally deploy and manage software agents such as security, observability, and networking across their container infrastructure independent of application deployments. By decoupling daemon lifecycle management from application operations, Managed Daemons helps guarantee reliable agent coverage across all workloads, simplifies deployments and version updates, and improves resource utilization by running a single daemon task per managed instance.<br /> <br /> With Managed Daemons, you can create a daemon for one or more Managed Instances capacity providers in your cluster. ECS places exactly one daemon task per managed instance and guarantees that daemons are running before any application tasks are placed, so cross-cutting functions such as logging, tracing, and metrics collection are always available. ECS orchestrates daemons as independent processes bound to the instance lifecycle rather than individual application tasks, allowing platform administrators to manage them independently from application teams. When you update daemon versions, ECS drains existing instances and provisions new instances with the updated daemon, automatically replacing service tasks with circuit breaker protection and rollback capabilities for reliable coverage across all your workloads.<br /> <br /> To get started, you can use AWS Console, CLI, CloudFormation, or AWS SDKs to register a daemon task definition specifying your container image, then create a daemon with associated capacity providers in your clusters. This feature is now available in all AWS Regions. For more details, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-daemons.html\">documentation</a> and launch <a href=\"http://aws.amazon.com/blogs/aws/announcing-managed-daemon-support-for-amazon-ecs-managed-instances\">blog post</a>. There is no additional cost - you pay only for the standard compute resources consumed by your daemon tasks.&nbsp;</p>"
