    "title": "AWS Managed Microsoft AD adds Multi-Region replication for Opt-In regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/multi-region-opt-in-aws-microsoft-ad/"
    "published": "2026-04-01 07:00:00"
    "summary": "<p>AWS Directory Service for Microsoft Active Directory, also known as AWS Managed Microsoft AD, now supports Multi-Region replication in AWS Opt-In regions. This expands the existing Multi-Region replication capability to&nbsp;additional&nbsp;AWS regions,&nbsp;eliminating&nbsp;the need to create and manually synchronize independent directories in each region&nbsp;and allowing domain-joined workloads in those regions to connect to AWS Managed Microsoft AD.</p> \n<p>With automated Multi-Region replication, AWS Managed Microsoft AD handles inter-region networking, deploys domain controllers in separate Availability Zones per region, and replicates all directory data including users, groups, Group Policy Objects, and schema. The service configures an Active Directory site per region to&nbsp;optimize&nbsp;authentication performance and minimize cross-region data transfer costs.&nbsp;</p> \n<p>Multi-Region replication is available in&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/regions.html\">AWS Opt-In regions</a>&nbsp;where AWS Managed Microsoft AD is available, except the Middle East (UAE) and Middle East (Bahrain) Regions. You pay by the hour for the domain controllers in each region, plus the cross-region data transfer.&nbsp; To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_configure_multi_region_replication.html\">Configure Multi-Region replication guide</a>.</p>"
  "6a5b58f24a55390877064c781ab17946":
    "id": "6a5b58f24a55390877064c781ab17946"
    "title": "Amazon CloudFront now supports SHA-256 for signed URLs and signed cookies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudfront-sha-256-signed-urls/"
    "published": "2026-04-01 17:38:00"
    "summary": "<p>Amazon CloudFront now supports SHA-256 as a hash algorithm for creating signed URLs and signed cookies. SHA-256 provides an improved security posture with stronger collision detection and alignment with modern cryptographic standards, giving you stronger cryptographic signing when restricting access to content. Previously, CloudFront signed URLs and signed cookies used SHA-1 exclusively for signature generation. This feature helps you meet security and compliance requirements that mandate SHA-256 for digital signatures, while also future-proofing your content delivery workflows.<br /> <br /> To use SHA-256, include the <i>Hash-Algorithm=SHA256</i> query parameter in your signed URLs, or the <i>CloudFront-Hash-Algorithm=SHA256</i> cookie attribute for signed cookies. Existing signed URLs and signed cookies that don't specify a hash algorithm continue to use SHA-1, so this change is fully backwards compatible.</p> \n<p>This feature is available in all edge locations where Amazon CloudFront is available. There is no additional cost to use SHA-256 signing. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-creating-signed-url-canned-policy.html\" rel=\"noopener noreferrer\" target=\"_blank\">Create a signed URL using a canned policy</a> or <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-setting-signed-cookie-canned-policy.html\" rel=\"noopener noreferrer\" target=\"_blank\">Set signed cookies using a canned policy</a> in the <i>Amazon CloudFront Developer Guide</i>.</p>"
  "e445e73ed4f049e82bcff80dc7a4ef46":
    "id": "e445e73ed4f049e82bcff80dc7a4ef46"
    "title": "Amazon RDS for Oracle now supports cross-account snapshot sharing with additional storage volumes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/rds-oracle-cross-account-snapshot-sharing-additional-storage-volume/"
    "published": "2026-04-01 15:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon RDS for Oracle</a> now supports cross-account snapshot sharing for database instances with additional storage volumes. Additional storage volumes allow customers to scale database storage up to 256 TiB by adding up to three storage volumes, each with up to 64 TiB, in addition to the primary storage volume. With this launch, customers can create, share, and copy a database snapshot across AWS accounts for database instances set up with additional storage volumes. Cross account snapshots enable customers to set up isolated backup environments in separate accounts for compliance requirements and to perform diagnostics, such as investigating production issues by restoring database snapshots in a separate account for development and testing.<br /> <br /> Cross account snapshots for database instances with additional storage volumes preserve the storage layout of the original database instance, including the configuration of additional storage volumes. When a snapshot is shared to a target AWS account, authorized users in the target account can restore it to another database instance, copy the snapshot within the same or different AWS Region, or create independent backups under different AWS Identity and Access Management (IAM) access permissions for backup and disaster recovery.<br /> <br /> Cross-account snapshot sharing with additional storage volumes is available in all AWS Regions, including AWS GovCloud (US) Regions. Customers can start using this feature today through the AWS Management Console, AWS CLI, or AWS SDKs. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html\">Sharing a DB snapshot for Amazon RDS</a>, <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_CopySnapshot.html\">Copying a DB snapshot for Amazon RDS</a>, and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/User_Oracle_AdditionalStorage.html\">Working with storage in RDS for Oracle</a> in the Amazon RDS User Guide.</p>"
  "7b4120be8131c54f10097c98d494aece":
    "id": "7b4120be8131c54f10097c98d494aece"
    "title": "Oracle Database@AWS launches sub-millisecond network latency for high performance applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/oracle-database-aws-launches-high-performance-networking/"
    "published": "2026-04-01 07:00:00"
    "summary": "<p>Today,<b> </b><a href=\"https://aws.amazon.com/marketplace/featured-seller/oracle/\" target=\"_blank\">Oracle Database@AWS</a> (ODB@AWS) announced high performance networking that provides customers consistent sub-millisecond roundtrip latency from their AWS applications to the database. Many applications such as payment processing, securities trading, and high volume transaction processing require predictable and consistent low-latency network connectivity to the application database. Customers who run such latency-sensitive applications on Oracle Exadata systems on-premises optimize their infrastructure to obtain the performance that these applications require. With high performance networking for ODB@AWS, customers can now seamlessly migrate these applications to an equivalent optimized environment on AWS.<br /> <br /> ODB@AWS automatically provides consistent and predictable low-latency network connectivity from Amazon EC2 instances to ODB@AWS databases through optimized placement of compute instances. When customers create an ODB@AWS network for their databases, they can now launch placement optimized Amazon EC2 instances with consistent, sub-millisecond latency network connectivity to their databases using existing Amazon EC2 APIs and workflows, such as launching new EC2 instances, or reserving compute capacity with EC2 On-Demand Capacity Reservations. There is no additional charge for EC2 instances using optimized placement for connectivity to ODB@AWS databases.<br /> <br /> The feature is available in the US-East-2 (Ohio), CA-Central-1 (Canada Central), EU-Central-1 (Frankfurt), EU-West-1 (Dublin), AP-Northeast-1 (Tokyo), and AP-Southeast-2 (Sydney) AWS Regions, with more Regions coming soon. For more information, see <a href=\"https://docs.aws.amazon.com/odb/latest/UserGuide/high-performance-networking.html\" target=\"_blank\">High performance networking for Oracle Database@AWS</a>.</p>"
