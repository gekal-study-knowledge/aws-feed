"overview": |
  この日は生成 AI のガバナンスとエンタープライズ運用に焦点が当たりました。Amazon Bedrock Guardrails が組織全体でセーフガードを一元適用できるクロスアカウント保護を一般提供開始し、Kiro には承認済み MCP サーバーのホワイトリスト管理とモデルガバナンスの 2 つのエンタープライズガバナンス機能が追加されました。Amazon EMR の Apache Spark トラブルシューティング/アップグレードエージェントが Kiro powers として提供開始され、SageMaker Data Agent はインタラクティブなチャート作成・Snowflake クエリ・マテリアライズドビュー管理に対応しました。CloudWatch は PromQL クエリを備えた Query Studio をプレビュー提供。その他 Bedrock Data Automation のカスタム語彙対応、Secrets Manager のクロスアカウント KMS キー指定、Glue Schema Registry の 3 リージョン追加、Amazon Quick のスパークライン、Partner Revenue Measurement の User Agent/Marketplace メタリング対応が発表されました。日本語ブログでは AWS Sustainability コンソールの提供開始や週刊ラウンドアップも紹介されています。
