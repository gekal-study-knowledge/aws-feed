  "56de7c389925a0fb03069457350523c4":
    "id": "56de7c389925a0fb03069457350523c4"
    "title": "Amazon CloudWatch introduces PromQL querying with Query Studio Preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-query-studio-preview/"
    "published": "2026-04-03 07:00:00"
    "summary": "<p>Amazon CloudWatch announces Query Studio in public preview, a unified query and visualization experience that brings native PromQL querying to CloudWatch for the first time. Query Studio combines PromQL and CloudWatch Metric Insights in a single interface, enabling you to query AWS vended metrics and OpenTelemetry metrics using the language you prefer without switching between consoles.<br /> <br /> Query Studio provides a visual form builder with autocomplete and a code editor with syntax highlighting, making it accessible to both new and experienced users. For example, a team running applications on Amazon EC2 can correlate their custom OpenTelemetry application metrics with EC2 vended metrics side by side, quickly spot issues across their stack, and create alarms or add charts to dashboards directly from their query results.<br /> <br /> Amazon CloudWatch Query Studio is available in public preview in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Singapore), and Europe (Ireland). Standard CloudWatch dashboard pricing applies, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\" target=\"_blank\">pricing page</a> for details.<br /> <br /> To get started, open Query Studio from the Metrics console or dashboard edit mode in the <a href=\"https://console.aws.amazon.com/cloudwatch/\">Amazon CloudWatch console</a>. Learn more on the Amazon CloudWatch <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OpenTelemetry-Sections.html\" target=\"_blank\">documentation page</a>.</p>"
  "d049ffe99ab058aae13d1fc63bc7c21e":
    "id": "d049ffe99ab058aae13d1fc63bc7c21e"
    "title": "Partner Revenue Measurement now supports User Agent string for certain AWS services"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/partner-revenue-measurement-user-agent-support/"
    "published": "2026-04-03 18:55:00"
    "summary": "<p>Today, AWS announces the general availability of Partner Revenue Measurement User Agent string — a new capability that enables AWS Partners to measure AWS service consumption driven by their solutions using AWS APIs and SDKs. Partner Revenue Measurement allows Partners to better understand their AWS revenue impact and product consumption patterns. The User Agent string capability allows Partners to embed a unique product code from their AWS Marketplace listing as a user agent to quantify and measure the AWS revenue impact of that solution across certain services. &nbsp;</p> \n<p>Partners can now add a user agent (format APN_1.1/pc_&lt;AWS Marketplace product-code&gt;$) in their application to enable AWS service consumption measurement by solution across partner-managed and customer-managed accounts. Partners can also set an environment variable in their SDKs or configure a setting in their AWS shared configuration file to automatically apply the User Agent string to all AWS service calls. This method supports automated deployments across Python, Node.js, Java, Kotlin, and other AWS SDKs, by capturing attribution for API-driven workloads and complements Partner Revenue Measurement’s <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/01/new-partner-revenue-measurement/\">Resource Tagging</a> and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering.html\">AWS Marketplace Metering</a> integration capabilities.</p> \n<p>Partner Revenue Measurement is generally available in all commercial regions. To learn more about User Agent string implementation, visit the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent implementation guide</a> and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-included-services.html\">services supported</a>. To learn more about Partner Revenue Measurement capabilities, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a> for more information.</p>"
  "b353ec98708ea6e79f8414cb6838fceb":
    "id": "b353ec98708ea6e79f8414cb6838fceb"
    "title": "Partner Revenue Measurement now supports AWS Marketplace Metering for certain AWS Marketplace products"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/partner-revenue-supports-mp-metering/"
    "published": "2026-04-03 18:55:00"
    "summary": "<p>Today, AWS announces the launch of Partner Revenue Measurement integration with AWS Marketplace Metering for Amazon Machine Image (AMI) and Machine Learning (ML) products listed in AWS Marketplace. Partner Revenue Measurement allows Partners to better understand their AWS revenue impact and product consumption patterns. The AWS Marketplace Metering capability automatically measures AWS service consumption when customers purchase and use AMI and ML products via AWS Marketplace.</p> \n<p>Partners can now gain visibility into how their solutions impact Amazon Elastic Compute Cloud (Amazon EC2) and Amazon SageMaker AI service consumption across partner-managed and customer-managed accounts. This method complements Partner Revenue Measurement’s <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/01/new-partner-revenue-measurement/\">Resource Tagging</a> and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent string</a> capabilities by capturing attribution without requiring additional Partner implementation.</p> \n<p>Partner Revenue Measurement is generally available in all commercial regions. To learn more about AWS Marketplace Metering, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering-implementation.html\">AWS Marketplace metering guide</a>. To learn more about Partner Revenue Measurement capabilities, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a>.</p>"
"last_updated": "2026-04-04 04:35:51 JST"
