  "2a14a0d53616cc82f63d3ad2b314db43":
    "id": "2a14a0d53616cc82f63d3ad2b314db43"
    "title": "AWS DevOps Agent によるエージェンティック AI を活用した自律的インシデント対応"
    "link": "https://aws.amazon.com/jp/blogs/news/leverage-agentic-ai-for-autonomous-incident-response-with-aws-devops-agent/"
    "published": "2026-04-06 01:48:30"
    "fetched": "2026-04-06 01:48:30"
    "summary": "このブログは、AWS DevOps Agentを使った自律的なインシデント対応について解説します。従来のSREエンジニアは、障害発生時に複数のログやツールから情報を手動で収集し、原因を特定するのに数時間かかっていました。AWS DevOps Agentは、アプリケーショントポロジーの理解、クロスアカウント調査、継続的学習機能を備えた完全マネージド型のAI運用チームメンバーです。6つの主要機能(Context、Control、Convenience、Collaboration、Continuous Learning、Cost Effective)により、単純なLLMラッパーとは異なる本格的な運用支援を実現します。このブログを読むことで、AWS DevOps Agentがどのように運用の複雑性を軽減し、インシデント対応を自動化・高速化するかを理解できます。"
  "a4cf25228af9af267759b9909a61cd29":
    "id": "a4cf25228af9af267759b9909a61cd29"
    "title": "AWS Deadline Cloud のサービスマネージドフリートで 3ds Max を使う方法"
    "link": "https://aws.amazon.com/jp/blogs/news/jp-mne-how-to-use-3ds-max-with-service-managed-fleets-on-aws-deadline-cloud/"
    "published": "2026-04-06 05:12:13"
    "fetched": "2026-04-06 05:12:13"
    "summary": "本記事では、AWS Deadline Cloud のサービスマネージドフリート (SMF) 上で Autodesk 3ds Max を使用する方法を紹介します。設定スクリプトを活用して 3ds Max をフリートワーカーにインストールし、マネージドインフラストラクチャの利便性とレンダリングパイプラインの柔軟性を両立する手順を解説します。"
  "ef4de601316a27e861be4aacdf4a56dc":
    "id": "ef4de601316a27e861be4aacdf4a56dc"
    "title": "Amazon CloudWatch で OpenTelemetry と PromQL がサポートされました"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-opentelemetry-promql-support-in-amazon-cloudwatch/"
    "published": "2026-04-06 04:38:34"
    "fetched": "2026-04-06 04:38:34"
    "summary": "Amazon CloudWatch で OpenTelemetry メトリクスのネイティブ取り込みと PromQL クエリがサポートされました。メトリクスあたり最大 150 ラベルの高カーディナリティメトリクスストアにより、Kubernetes やマイクロサービスのラベルの多いメトリクスを変換なしで CloudWatch に直接送信できます。AWS リソースの自動エンリッチメントと組み合わせることで、インフラストラクチャ、コンテナ、アプリケーションのメトリクスを一元管理し、PromQL でクエリできるようになります。"
  "e3196816f03578e67ea5bfa10376c5a3":
    "id": "e3196816f03578e67ea5bfa10376c5a3"
    "title": "週刊AWS – 2026/3/30週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260330/"
    "published": "2026-04-06 02:38:30"
    "fetched": "2026-04-06 02:38:30"
    "summary": "AWS Direct Connect に BGP 監視用 CloudWatch メトリクス追加、Amazon SageMaker Data Agent が Unified Studio Query Editor で利用可能に、Amazon Athena が追加リージョンで Capacity Reservations 開始、Amazon CloudFront が IPv6 の BYOIP をサポート開始、AWS Outposts で Amazon RDS for Oracle が利用可能に、AWS Transform custom の自動コードベース分析が GA、AWS Security Agent オンデマンドペネトレーションテストが GA、AWS DevOps Agent が GA、Amazon S3 Vectors が 17 リージョンに拡張、Amazon OpenSearch Service にログ分析向けエージェント AI 導入等"
  "864c29dd309895215255a9a12db13d51":
    "id": "864c29dd309895215255a9a12db13d51"
    "title": "Kiro CLI の新しいデザイン"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-cli-tui/"
    "published": "2026-04-06 06:29:03"
    "fetched": "2026-04-06 06:29:03"
    "summary": "私たちはターミナルが大好きです。この記事を読んでいるあなたも、きっとそうでしょう。CLI には、スピード、集中力、そして直接性という独特の魅力があります。速く、反応が良く、即座に結果が返ってくる。Kiro CLI はすでに、エージェントとの直接チャット、計画の作成、複数ステップにわたる処理の実行といった機能を通じて、エージェント型コーディングの力をターミナル環境にもたらしています。そして、さらに良い体験を追求した結果、新しいデザインへの刷新が必要だという結論に至りました。 本日、Kiro CLI の刷新された UX をご紹介します。いつでも以前の体験に戻せる「実験的モード」として提供しますので、ぜひフィードバックをお聞かせください。Kiro CLI をインストールして、コマンドラインで kiro-cli --tui と入力するだけで試せます。"
  "ddbcbc38cab22a15e1e9599cb65323fd":
    "id": "ddbcbc38cab22a15e1e9599cb65323fd"
    "title": "Kiro に MiniMax M2.5 と GLM-5 が追加されました"
    "link": "https://aws.amazon.com/jp/blogs/news/minimax-m25-and-glm-5/"
    "published": "2026-04-06 08:58:22"
    "fetched": "2026-04-06 08:58:22"
    "summary": "Kiro に新たに MiniMax M2.5 と GLM-5 の 2 つのオープンウェイトモデルが追加されました。MiniMax M2.5 はクレジット乗数 0.25x の低コストモデルで、SWE-Bench Verified 80.2% を達成し、マルチステップ実装や長時間エージェントセッションに最適です。GLM-5 は 200K コンテキストウィンドウを持つ大規模 MoE モデルで、リポジトリ規模の複雑なアーキテクチャ変更や長期エージェントワークフローに強みを発揮します。両モデルは IDE と CLI から即座に利用可能です。"
