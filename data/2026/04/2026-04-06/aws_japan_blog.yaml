  "a73ba93ceff6221f27db2bb23bd1771f":
    "id": "a73ba93ceff6221f27db2bb23bd1771f"
    "title": "週刊生成AI with AWS – 2026/3/30 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260330/"
    "published": "2026-04-06 07:29:05"
    "fetched": "2026-04-06 07:29:05"
    "summary": "今週の「週刊 生成 AI with AWS」では、非エンジニアが Amazon Bedrock と Amazon Q Developer で契約書管理 AI エージェントを構築した大成様の事例や、Agentic AI を PoC から本番稼働へ引き上げるための組織論・ペルソナ別ガイドなど、生成 AI の「実用化」と「組織展開」に役立つコンテンツが充実しています。サービス面でも AWS DevOps Agent の GA、Amazon Bedrock AgentCore Evaluations と Amazon Bedrock Guardrails のクロスアカウントセーフガードの GA、Amazon OpenSearch Service へのエージェント AI 機能追加、Amazon S3 Vectors の 31 リージョン展開など、AI エージェントの本番運用を支える重要なアップデートを紹介しています。"
