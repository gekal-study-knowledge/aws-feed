  "2a14a0d53616cc82f63d3ad2b314db43":
    "id": "2a14a0d53616cc82f63d3ad2b314db43"
    "title": "AWS DevOps Agent によるエージェンティック AI を活用した自律的インシデント対応"
    "link": "https://aws.amazon.com/jp/blogs/news/leverage-agentic-ai-for-autonomous-incident-response-with-aws-devops-agent/"
    "published": "2026-04-06 01:48:30"
    "summary": "このブログは、AWS DevOps Agentを使った自律的なインシデント対応について解説します。従来のSREエンジニアは、障害発生時に複数のログやツールから情報を手動で収集し、原因を特定するのに数時間かかっていました。AWS DevOps Agentは、アプリケーショントポロジーの理解、クロスアカウント調査、継続的学習機能を備えた完全マネージド型のAI運用チームメンバーです。6つの主要機能(Context、Control、Convenience、Collaboration、Continuous Learning、Cost Effective)により、単純なLLMラッパーとは異なる本格的な運用支援を実現します。このブログを読むことで、AWS DevOps Agentがどのように運用の複雑性を軽減し、インシデント対応を自動化・高速化するかを理解できます。"
  "a4cf25228af9af267759b9909a61cd29":
    "id": "a4cf25228af9af267759b9909a61cd29"
    "title": "AWS Deadline Cloud のサービスマネージドフリートで 3ds Max を使う方法"
    "link": "https://aws.amazon.com/jp/blogs/news/jp-mne-how-to-use-3ds-max-with-service-managed-fleets-on-aws-deadline-cloud/"
    "published": "2026-04-06 05:12:13"
    "summary": "本記事では、AWS Deadline Cloud のサービスマネージドフリート (SMF) 上で Autodesk 3ds Max を使用する方法を紹介します。設定スクリプトを活用して 3ds Max をフリートワーカーにインストールし、マネージドインフラストラクチャの利便性とレンダリングパイプラインの柔軟性を両立する手順を解説します。"
  "ef4de601316a27e861be4aacdf4a56dc":
    "id": "ef4de601316a27e861be4aacdf4a56dc"
    "title": "Amazon CloudWatch で OpenTelemetry と PromQL がサポートされました"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-opentelemetry-promql-support-in-amazon-cloudwatch/"
    "published": "2026-04-06 04:38:34"
    "summary": "Amazon CloudWatch で OpenTelemetry メトリクスのネイティブ取り込みと PromQL クエリがサポートされました。メトリクスあたり最大 150 ラベルの高カーディナリティメトリクスストアにより、Kubernetes やマイクロサービスのラベルの多いメトリクスを変換なしで CloudWatch に直接送信できます。AWS リソースの自動エンリッチメントと組み合わせることで、インフラストラクチャ、コンテナ、アプリケーションのメトリクスを一元管理し、PromQL でクエリできるようになります。"
  "e3196816f03578e67ea5bfa10376c5a3":
