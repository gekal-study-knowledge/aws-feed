    "summary": "AWS Direct Connect に BGP 監視用 CloudWatch メトリクス追加、Amazon SageMaker Data Agent が Unified Studio Query Editor で利用可能に、Amazon Athena が追加リージョンで Capacity Reservations 開始、Amazon CloudFront が IPv6 の BYOIP をサポート開始、AWS Outposts で Amazon RDS for Oracle が利用可能に、AWS Transform custom の自動コードベース分析が GA、AWS Security Agent オンデマンドペネトレーションテストが GA、AWS DevOps Agent が GA、Amazon S3 Vectors が 17 リージョンに拡張、Amazon OpenSearch Service にログ分析向けエージェント AI 導入等"
