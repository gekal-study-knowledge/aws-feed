  "5f6791e917977480b33c048245f26c05":
    "id": "5f6791e917977480b33c048245f26c05"
    "title": "Amazon Verified Permissions now supports policy store aliases and named policies and policy templates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-verified-permissions-policy-store/"
    "published": "2026-04-06 18:00:00"
    "summary": "<p>Today, AWS announces support for policy store aliases and named policies and policy templates in Amazon Verified Permissions, simplifying multi-tenant deployments and day-to-day policy management. Amazon Verified Permissions is a fine-grained authorization service that helps you manage and enforce permissions across your applications using Cedar policies. These new capabilities eliminate the need to maintain separate mapping tables for associating tenant identifiers with policy store IDs or tracking individual policy and template IDs.</p> \n<p>With policy store aliases, multi-tenant application developers can assign a human-readable alias based on a tenant identifier and use it in any API call, removing the need for a lookup table. Similarly, named policies and policy templates let you reference policies by meaningful names instead of system-generated IDs, making it easier to manage authorization logic as your application grows.</p> \n<p>Amazon Verified Permissions policy store aliases and named policies and templates are available in all AWS Regions where Amazon Verified Permissions is available. For a full list of supported Regions, see&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/verifiedpermissions.html\">Amazon Verified Permissions endpoints and quotas</a>.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-store-aliases.html\">Policy store aliases</a> and <a href=\"https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policies-create.html\">Creating static policies</a> in the Amazon Verified Permissions User Guide, or visit the <a href=\"https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/\">Amazon Verified Permissions API Reference</a>.</p>"
  "ac6e5eb94d238ce18608cdc02e4ca101":
    "id": "ac6e5eb94d238ce18608cdc02e4ca101"
    "title": "Amazon WorkSpaces Personal now supports unique DNS names for PrivateLink"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-workspaces-personal-privatelink/"
    "published": "2026-04-06 17:00:00"
    "summary": "<p>Amazon WorkSpaces Personal now provides unique, publicly resolvable Domain Name System (DNS) names for each AWS PrivateLink Virtual Private Cloud (VPC) endpoint, enabling enterprise customers to deploy WorkSpaces across multiple AWS VPCs and accounts without DNS resolution conflicts. Each interface VPC endpoint now receives a globally unique AWS-managed DNS name in addition to the previous generic DNS name that was shared across all endpoints.<br /> <br /> This enhancement enables customers to route traffic appropriately in multi-account environments with centralized DNS infrastructure. Customers can now deploy WorkSpaces Personal directories across different VPCs and AWS accounts while maintaining proper security isolation, eliminating the DNS name collision that previously prevented customers from using separate interface VPC endpoints across accounts. The publicly resolvable DNS names simplify configuration while maintaining security, as they resolve to private IP addresses accessible only from within the respective VPC. The unique DNS names are automatically managed by AWS throughout their lifecycle, requiring no additional Route 53 configuration or custom DNS management.<br /> <br /> This feature is available in all AWS <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">regions</a> where PrivateLink is available in Amazon WorkSpaces Personal.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/creating-streaming-vpc-endpoints.html\">Amazon WorkSpaces PrivateLink documentation</a>. For configuration details, refer to the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html\">WorkSpaces Administration Guide</a>. Existing customers will automatically benefit from this enhancement, as the system maintains backward compatibility with previous DNS configurations.</p>"
  "004550b51784e6e427e74202028d69c1":
    "id": "004550b51784e6e427e74202028d69c1"
    "title": "AWS announces general availability of Smithy-Java client framework"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/smithy-java-client-framework/"
    "published": "2026-04-06 16:00:00"
    "summary": "<p>AWS today announced the general availability of Smithy-Java, an open-source Java framework for generating type-safe clients and standalone classes from Smithy models. Smithy-Java addresses one of the most consistently requested capabilities from enterprise Smithy users: production-grade Java SDK generation. The framework allows you to generate clients from models and async patterns that increase cognitive load and maintenance burden for developers building modern Java applications.</p> \n<p>Built on Java 21's virtual threads, Smithy-Java provides a blocking-style API that is both simpler to use and competitive in performance with complex async alternatives. Key benefits include auto-generated type-safe clients from Smithy, protocol flexibility with runtime protocol swapping for gradual migration paths. The GA release includes the Java client code generator, support for AWS SigV4 and all major AWS protocols (AWS JSON, REST-JSON, REST-XML, AWS Query, and Smithy RPCv2-CBOR), standalone type code generation for sharing types across multiple services or data modeling, and a dynamic client that can call Smithy services without a codegen step.</p> \n<p>The framework pioneers two architectural innovations: schema-driven serialization that reduces SDK size while improving performance, and binary decision diagrams (BDD) for endpoint rules resolution delivering significant latency improvements. Internal Amazon teams have already built complete services in weeks rather than months using Smithy-Java, with service teams depending on it internally. The framework is ideal for organizations invested in the Smithy ecosystem, teams requiring protocol-agnostic development, and developers building new services with generated server stubs.</p> \n<p>To learn more, visit our <a href=\"https://aws.amazon.com/blogs/developer/smithy-java-client-framework-is-now-generally-available/\" title=\"AWS Blog Post - Smithy Java client framework now generally available\">blog post</a> and follow the <a href=\"https://github.com/smithy-lang/smithy-java\">Smithy Java Quickstart guide</a>.</p>"
