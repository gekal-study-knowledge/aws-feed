    "id": "0dc0d0ae828285a2bf6cf853538b05fa"
    "title": "AWS Deadline Cloud announces AI-powered troubleshooting assistant for render jobs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/deadline-cloud-ai-troubleshooting/"
    "published": "2026-04-17 16:40:00"
    "fetched": "2026-04-18 03:55:25"
    "summary": "<p>Today, AWS Deadline Cloud announces an AI-powered troubleshooting assistant that helps you quickly diagnose and resolve render job failures. AWS Deadline Cloud is a fully managed service that simplifies render management for computer-generated 2D/3D graphics and visual effects for films, TV shows, commercials, games, and industrial design.<br /> <br /> Render job failures from missing assets, software errors, configuration mismatches, and resource constraints can stall production pipelines and waste compute resources. Previously, diagnosing these issues required specialized technical staff to manually parse logs and identify root causes — a process that is time-consuming, difficult to scale, and often unavailable to smaller studios. The new Deadline Cloud assistant investigates failed jobs you identify, analyzes logs and metrics, detects common issues, and provides troubleshooting recommendations based on industry best practices and a pre-trained knowledge base covering Deadline Cloud, common render farm issues, and popular digital content creation applications including Autodesk Maya, 3ds Max, VRED, Blender, SideFX Houdini, Maxon Cinema 4D, Foundry Nuke, and Adobe After Effects. The assistant runs within your AWS account using Amazon Bedrock, keeping all data and analysis within your control.<br /> <br /> The Deadline Cloud assistant is available today in all AWS Regions where AWS Deadline Cloud is supported. Watch a <a href=\"https://youtu.be/zz10CeybNeQ\">demo on YouTube</a> to see it in action, or visit the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/deadline-cloud-assistant.html\">AWS Deadline Cloud documentation</a> to learn more.</p>"
  "0fa9a58a0a1533ffc26cb9cfb7df16ab":
    "id": "0fa9a58a0a1533ffc26cb9cfb7df16ab"
    "title": "Amazon Managed Grafana now supports creating Grafana 12.4 workspaces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-managed-grafana-v12-create/"
    "published": "2026-04-17 15:00:00"
    "fetched": "2026-04-18 04:57:10"
    "summary": "<p>Amazon Managed Grafana&nbsp;now supports creating new workspaces with&nbsp;Grafana version 12.4.&nbsp;&nbsp;This release includes features that were launched as a part of open source Grafana versions 11.0&nbsp;to 12.4,&nbsp;including Drilldown apps,&nbsp;scenes powered dashboards, variables in transformations,&nbsp;visualization enhancements, and&nbsp;new features with&nbsp;the&nbsp;Amazon CloudWatch plugin.</p> \n<p>Queryless&nbsp;Drilldown apps enable customers to perform point-and-click exploration of Prometheus metrics, Loki logs, Tempo traces, and&nbsp;Pyroscope&nbsp;profiles. The Scenes-powered rendering engine boosts dashboard&nbsp;performance. Amazon CloudWatch Logs adds support for PPL and SQL queries, cross-account Metrics&nbsp;Insights, and log anomaly detection.&nbsp;The rebuilt table visualization improves performance with CSS cell styling and interactive Actions buttons, while trendline transformations and navigation bookmarks enhance data exploration.&nbsp;Grafana 12.4 is supported in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS regions</a>&nbsp;where Amazon Managed Grafana is&nbsp;generally available.</p> \n<p>You can create a new Amazon Managed Grafana workspace from the AWS Console, SDK, or CLI.&nbsp;To explore the complete list of new features, please refer to the&nbsp;<a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/version-differences.html#version-diff-v12\">user documentation</a>. Follow the instructions <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/AMG-create-workspace.html\">here</a> to create workspaces with version 12.4.&nbsp;To&nbsp;learn more about Amazon Managed&nbsp;Grafana&nbsp;features and its pricing, visit the <a href=\"https://aws.amazon.com/grafana/\">product page</a> and <a href=\"https://aws.amazon.com/grafana/pricing/\">pricing page</a>.</p>"
  "e9b9b5e617d8ceffac8d74c363bf9ce9":
    "id": "e9b9b5e617d8ceffac8d74c363bf9ce9"
    "title": "SageMaker JumpStart now offers optimized deployments for foundation models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-jumpstart-optimized-deployments/"
    "published": "2026-04-17 00:00:00"
    "fetched": "2026-04-18 04:57:10"
    "summary": "<p>SageMaker JumpStart now offers optimized deployments, enabling customers to deploy foundation models with pre-configured settings tailored to specific use cases and performance constraints. SageMaker JumpStart optimized deployments simplify model deployment by offering task-aware configurations that optimize for cost, throughput, or latency based on your workload requirements - whether content generation, summarization, or Q&amp;A. This launch includes support for 30+ popular models from Meta, Microsoft, Mistral AI, Qwen, Google, and TII, with visibility into key performance metrics like P50 latency, time-to-first token (TTFT), and throughput before deployment.</p> \n<p>With SageMaker JumpStart optimized deployments, customers can select from use case-specific configurations (such as generative writing or chat-style interactions) and choose optimization targets including cost-optimized, throughput-optimized, latency-optimized, or balanced performance. Models deploy to SageMaker AI Managed Inference endpoints or SageMaker HyperPod clusters with pre-set configurations that eliminate guesswork while maintaining full visibility into deployment details. Available models include Meta Llama 3.1 and 3.2 variants, Microsoft Phi-3, Mistral AI models including the new Mistral-Small-24B-Instruct-2501, Qwen 2 and 3 series including multimodal Qwen2-VL, Google Gemma, and TII Falcon3. All deployments leverage SageMaker's VPC deployment capabilities, ensuring data control and production-ready infrastructure with enterprise-grade security. The feature is available in all AWS regions where SageMaker JumpStart is curretly supported.</p> \n<p>To get started with optimized deployments, navigate to Models in SageMaker Studio, select your desired foundation model in the JumpStart Models tab, choose \"Deploy,\" and select your use case and performance optimization target. For details, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/jumpstart-foundation-models-use-studio-updated-deploy.html\">SageMaker JumpStart documentation</a>. AWS is actively expanding support to include additional models.</p>"
"last_updated": "2026-04-18 04:57:10 JST"
