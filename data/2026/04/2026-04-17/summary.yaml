"overview": |
  この日は生成 AI・機械学習インフラの強化が中心でした。SageMaker JumpStart が Meta・Microsoft・Mistral など 30 以上のモデルを対象に最適化デプロイに対応し、SageMaker HyperPod は複数インスタンスタイプ/サブネットを扱える柔軟なインスタンスグループとオンデマンドのディープヘルスチェックを追加。AWS Neuron SDK 2.29.0 では NKI と Neuron Explorer が正式版となり、CPU シミュレータも導入されました。機械学習ブログでは Nova Forge SDK でのファインチューニング、Nova モデル蒸留による動画セマンティック検索、Amazon Bedrock の詳細なコスト配分などが紹介されました。その他、Deadline Cloud の AI トラブルシューティング支援、Amazon Managed Grafana 12.4、EC2 High Memory U7i のシンガポール提供、ECR プルスルーキャッシュの referrer 同期も発表。セキュリティ面では OCSF 形式への ETL 変換手法と、Amazon EFS CSI Driver の脆弱性 CVE-2026-6437 の注意喚起が公開されました。
