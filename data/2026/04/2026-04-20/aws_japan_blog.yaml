    "title": "VPC 内のプライベートサービスに AWS DevOps Agent をセキュアに接続する方法"
    "link": "https://aws.amazon.com/jp/blogs/news/securely-connect-aws-devops-agent-to-private-services-in-your-vpcs/"
    "published": "2026-04-20 14:15:11"
    "fetched": "2026-04-20 23:45:59"
    "summary": "AWS DevOps Agent は24時間365日稼働する運用チームメンバーで、インシデント対応やアプリケーション最適化、SREタスクをAWS・マルチクラウド・オンプレミス問わず担います。MCPツールやインテグレーションで拡張し、社内レジストリやGitHub Enterprise等の内部リソースにもアクセス可能です。しかし多くのサービスはVPC内で稼働しており、パブリックインターネット経由ではアクセスできません。プライベート接続機能を使えば、Agent SpaceとVPC内のサービスをインターネットに公開せずセキュアに接続でき、MCPサーバーやGrafana、Splunk等あらゆるプライベートエンドポイントに対応します。本記事ではその仕組みとセットアップ手順を解説します。"
