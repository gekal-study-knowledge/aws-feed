    "title": "Opus 4.7 が Kiro で利用可能になりました"
    "link": "https://aws.amazon.com/jp/blogs/news/opus-4-7/"
    "published": "2026-04-20 00:38:05"
    "fetched": "2026-04-20 11:24:38"
    "summary": "Anthropic の最新モデル Claude Opus 4.7 が Kiro IDE および CLI に順次展開されました。Opus 4.6 の直接アップグレード版として、複雑で長時間にわたるタスクでのコーディング性能が向上し、複数ファイル・ツールにまたがるマルチステップ実装や自己検証機能を備えています。Kiro のスペック駆動開発との親和性も高く、大規模コードベースでの高忠実度な実装を実現します。"
