  "77ad923717fef648bc2b496bba6a5788":
    "id": "77ad923717fef648bc2b496bba6a5788"
    "title": "Kiro CLI をプログラムから実行する：ヘッドレスモードの紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-introducing-headless-mode/"
    "published": "2026-04-20 00:14:05"
    "fetched": "2026-04-20 11:24:38"
    "summary": "Kiro CLI を使ったことがある方なら、kiro-cli login を実行するとブラウザが開いて認証が走る、というお決まりの流れはご存じかと思います。手元で作業しているときはこれで十分ですが、ブラウザが開けない環境ではそうもいきません。CI/CD パイプラインや cron ジョブ、コンテナビルドといった自動化された処理では、そもそもブラウザを開けません。 こうした場面で役立つのがヘッドレスモードで、API キーを生成して環境変数に設定するだけで、Kiro CLI をブラウザなしで動かせるようになります。この記事では、ヘッドレスモードの仕組みを説明し、具体的な活用例として GitHub Actions で push のたびに自動実行されるコードレビューの構築方法を紹介します。"
  "2e96118d25c97ddbd0efe6716a60d465":
    "id": "2e96118d25c97ddbd0efe6716a60d465"
    "title": "Amazon RDS for SQL Server における追加ストレージボリュームによるストレージの改善"
    "link": "https://aws.amazon.com/jp/blogs/news/improving-storage-with-additional-storage-volumes-in-amazon-rds-for-sql-server/"
    "published": "2026-04-20 05:21:32"
    "fetched": "2026-04-20 14:37:20"
    "summary": "この記事では、Amazon RDS for SQL Server の追加ストレージボリューム機能を使用して、これらの一般的な課題に対処する方法と「追加ストレージボリュームの64 TiB を超える容量の拡張 」「動的な一時ストレージの管理 」「カスタマイズされた IOPS 設定によるパフォーマンスの向上 」「ストレージクラスの選択によるコスト削減 」「トランザクションログの分離 」「マルチテナントストレージの分離の実装」の 6 つの主要なユースケースの実装方法を学びます。"
