    "title": "[資料公開 & 開催報告] 初学者向けセミナー「これから始める AWS のコンテナサービス活用」を開催しました"
    "link": "https://aws.amazon.com/jp/blogs/news/getting-started-with-aws-container-services-202604/"
    "published": "2026-04-20 08:34:58"
    "fetched": "2026-04-20 19:44:36"
    "summary": "2025年4月14日（火）にコンテナサービスの基礎的な内容を扱うウェビナー「これから始める AWS のコンテナサービス活用」を開催しました。本セミナーでは、なぜコンテナが必要なのか、AWS コンテナサービスのラインナップや使い分けといった基礎的な内容から、生成 AI を活用したコンテナ環境の構築・運用や ECS/EKS の新機能のご紹介まで幅広くお届けし、170名の方々にご登録いただき、131名の方々に当日ご参加いただきました。"
  "287d2b53a45ca80625c60d7b39fa1bce":
    "id": "287d2b53a45ca80625c60d7b39fa1bce"
    "title": "週刊AWS – 2026/4/13週"
