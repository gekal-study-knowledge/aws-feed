    "published": "2026-04-20 08:32:11"
    "fetched": "2026-04-20 19:44:36"
    "summary": "AWS Interconnect - last mile および multicloud の一般提供開始, Amazon Redshift が Top-K クエリのパフォーマンス最適化を導入, Amazon OpenSearch Serverless が派生ソースによるストレージ最適化をサポート, Amazon EC2 C8gn/M8gn/R8gn インスタンスで EBS パフォーマンスが倍増, AWS Secrets Manager がハイブリッド耐量子 TLS をサポート開始, AWS Transform が Kiro と VS Code で利用可能に, Claude Opus 4.7 が Amazon Bedrock で利用可能, Amazon EC2 C8in および C8ib インスタンスが一般提供開始, Amazon Quick がシートツールチップやマルチアカウントサインインをサポート　など"
  "fa8c673b1f9e67603b36fda397d8865f":
