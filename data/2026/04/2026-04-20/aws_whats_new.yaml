  "01c51eadf16a62ef41dd458ff5690baa":
    "id": "01c51eadf16a62ef41dd458ff5690baa"
    "title": "Amazon S3 Express One Zone now supports S3 Inventory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/s3-express-one-zone-supports-s3-inventory/"
    "published": "2026-04-20 13:00:00"
    "fetched": "2026-04-21 03:59:47"
    "summary": "<p>Amazon S3 Express One Zone, a high-performance S3 storage class for latency-sensitive applications, now supports S3 Inventory. S3 Inventory&nbsp;provides&nbsp;a scheduled alternative to S3's synchronous List API.&nbsp;You&nbsp;can configure S3 Inventory to generate reports on a daily or weekly basis that&nbsp;list&nbsp;your stored objects within an S3 directory bucket or with a specific prefix, and their respective metadata and encryption status. You can simplify and speed up business workflows and big data jobs with S3&nbsp;Inventory, and&nbsp;verify&nbsp;encryption&nbsp;status of your objects to meet business, compliance, and regulatory needs.</p> \n<p>You can use the AWS CLI, AWS SDKs, or S3 API to configure a daily or weekly inventory report for all the objects within your S3 directory&nbsp;bucket&nbsp;or a subset of the objects under a shared prefix. As part of the configuration, you can specify a destination S3 bucket for your S3 Inventory report, the output file format (CSV, ORC, or Parquet), and specific object metadata necessary for your business application, such as object name, size, last modified date, storage class, multipart upload flag,&nbsp;and&nbsp;encryption&nbsp;status.</p> \n<p>S3 Inventory for S3 Express One Zone is available in all&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-Endpoints.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where the storage class is available</a>.&nbsp;For pricing information, visit the&nbsp;<a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 pricing page</a>.&nbsp;To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/configure-inventory.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Inventory documentation</a>.</p>"
  "b26abdd06369c7ebe45be162b41e4bab":
    "id": "b26abdd06369c7ebe45be162b41e4bab"
    "title": "Amazon DocumentDB (with MongoDB compatibility) now supports in-place upgrade from version 5.0 to 8.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-documentdb-mongodb-in-place-version-upgrade-5-0-to-8-0/"
    "published": "2026-04-20 18:00:00"
    "fetched": "2026-04-21 05:03:43"
    "summary": "<p><a href=\"https://aws.amazon.com/documentdb/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon DocumentDB (with MongoDB compatibility)</a>&nbsp;supports in-place major version upgrade (MVU) from version 5.0 to 8.0. You can upgrade with just a few clicks in the AWS Management Console or via the AWS SDK or AWS CLI — no new clusters, no endpoint changes, and no index rebuilds&nbsp;required.</p> \n<p>Upgrading to version 8.0 delivers performance and cost improvements: query latency improves by up to 7x and storage compression improves by up to 5x, so your applications run faster on less storage, reducing your costs. Version 8.0 also adds new capabilities including collation, views, new aggregation stages and operators, enhanced text search with text index v2, and vector index builds that are up to 30x faster.</p> \n<p>In-place MVU from version 5.0 to 8.0 is available in all AWS Regions where Amazon&nbsp;DocumentDB 8.0 is available, at no&nbsp;additional&nbsp;cost.</p> \n<p>To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-mvu.html\" rel=\"noopener noreferrer\" target=\"_blank\">in-place MVU documentation</a>. To learn more about Amazon&nbsp;DocumentDB&nbsp;8.0, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/compatibility.html#compatibility-whatsnew-8\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "6f0e29fd01001ffe19c9556c8be4e158":
    "id": "6f0e29fd01001ffe19c9556c8be4e158"
    "title": "Amazon EKS enhances cluster governance with new IAM condition keys"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-eks-iam-condition-keys/"
    "published": "2026-04-20 17:48:00"
    "fetched": "2026-04-21 05:03:43"
    "summary": "<p><a href=\"https://aws.amazon.com/eks/\" target=\"_blank\">Amazon Elastic Kubernetes Service</a> (EKS) now supports seven additional <a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonelastickubernetesservice.html#amazonelastickubernetesservice-policy-keys\" target=\"_blank\">IAM condition keys</a> for cluster creation and configuration APIs, enhancing the governance controls available through IAM policies and Service Control Policies (SCPs). Organizations managing multi-account environments require centralized mechanisms to enforce security and compliance requirements consistently across all clusters without relying on manual processes or post-deployment checks. This expansion of EKS IAM condition keys further enables proactive policy enforcement, providing organizations with more granular control to establish guardrails for cluster configurations.<br /> <br /> Organizations can now enforce private-only API endpoints (eks:endpointPublicAccess, eks:endpointPrivateAccess), require customer-managed AWS KMS keys for secrets encryption (eks:encryptionConfigProviderKeyArns), restrict clusters to approved Kubernetes versions (eks:kubernetesVersion), mandate deletion protection for production workloads (eks:deletionProtection), specify control plane scaling tiers (eks:controlPlaneScalingTier), and enable zonal shift capabilities for high availability (eks:zonalShiftEnabled). These condition keys apply to CreateCluster, UpdateClusterConfig, UpdateClusterVersion, and AssociateEncryptionConfig APIs, integrating seamlessly with AWS Organizations SCPs for centralized governance across accounts.<br /> <br /> The new IAM condition keys are available in all AWS Regions where Amazon EKS is available at no additional charge. To learn more about Amazon EKS IAM condition keys, see the Amazon EKS <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/security-iam-service-with-iam.html#security-iam-service-with-iam-id-based-policies\" target=\"_blank\">User Guide</a> and the <a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonelastickubernetesservice.html\" target=\"_blank\">Service Authorization Reference</a> for Amazon EKS. For information about implementing Service Control Policies, see the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\" target=\"_blank\">AWS Organizations documentation</a>.&nbsp;</p>"
  "077906f06e33fc842a70c8183be36da0":
    "id": "077906f06e33fc842a70c8183be36da0"
    "title": "AWS Managed Microsoft AD is now available on Windows functional level 2016"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-managed-microsoft-ad-2016-functional-level/"
    "published": "2026-04-20 07:00:00"
    "fetched": "2026-04-21 05:03:43"
    "summary": "<p>Starting today, all AWS Directory Service for Microsoft AD (AWS Managed Microsoft AD) directories run on Windows functional level 2016.&nbsp;The upgrade to Windows functional level 2016 has been applied automatically to all existing AWS Managed Microsoft AD directories. The functional level upgrade includes enhanced authentication mechanisms and improved security for privileged access management, helping you better protect your Active Directory infrastructure in the cloud.&nbsp;</p> \n<p>This upgrade provides&nbsp;LAPS&nbsp;(Local Administrator Password Solution), which helps you manage local administrator passwords on domain-joined computers by automatically generating unique, complex passwords, and storing them securely in Active Directory.</p> \n<p>This is enabled&nbsp;in all&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/regions.html\">AWS Regions</a>&nbsp;where AWS Managed Microsoft AD is available, except in the Middle East (UAE) and Middle East (Bahrain) Regions. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_key_concepts.html\">AWS Directory Service Administration Guide</a>.</p>"
  "bfb051b03fc42576b2fe57d2466d2851":
    "id": "bfb051b03fc42576b2fe57d2466d2851"
    "title": "Amazon EBS expands volume modification enhancement to AWS European Sovereign Cloud Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ebs-four-volume-modifications-european-sovereign-region/"
    "published": "2026-04-20 20:30:00"
    "fetched": "2026-04-21 06:42:33"
    "summary": "<p>Amazon Elastic Block Store (Amazon EBS) now supports up to four Elastic Volumes modifications per volume within a rolling 24-hour window in AWS European Sovereign Cloud (Germany) Region. Elastic Volumes modifications allow you to increase the size, change the type, and adjust the performance of your EBS volumes. With this update, you can start a new modification immediately after the previous one completes, as long as you have initiated fewer than four modifications in the past 24 hours.</p> \n<p>This enhancement improves your operational agility to immediately scale storage capacity or adjust performance in response to sudden data growth or unanticipated workload spikes. With Elastic Volumes modifications, you can modify your volumes without detaching them or restarting your instances, allowing your application to continue running with minimal performance impact.</p> \n<p>The Elastic Volumes modifications enhancement is automatically available in the Region without requiring changes to your existing workflows. To learn more, see <a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html\" rel=\"noopener noreferrer\" target=\"_blank\">Modify an Amazon EBS volume using Elastic Volumes operations</a> in the Amazon EBS User Guide.</p>"
  "4d52ad34977ef132a26d68dd1dd1fe29":
    "id": "4d52ad34977ef132a26d68dd1dd1fe29"
    "title": "Amazon EVS now offers Microsoft Windows Server Licensing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-evs-windows-server-licensing/"
    "published": "2026-04-20 20:05:00"
    "fetched": "2026-04-21 06:42:33"
    "summary": "<p>Today, we're announcing that Amazon Elastic VMware Service (Amazon EVS) now offers Microsoft Windows Server licensing entitlements. You can now migrate or create new virtual machines (VMs) running Windows Server OS in EVS and obtain Windows Server licensing entitlements for those VMs from AWS.</p> \n<p>Amazon EVS lets you run VMware Cloud Foundation (VCF) directly within your Amazon Virtual Private Cloud (VPC) on EC2 bare-metal instances, powered by AWS Nitro. Using either our step-by-step configuration workflow or the AWS Command Line Interface (CLI), you can set up a complete VCF environment in just a few hours. This rapid deployment enables faster workload migration to AWS, helping you eliminate aging infrastructure, reduce operational risks, and meet critical timelines for exiting your data center.</p> \n<p>With this latest functionality, you can now entitle your Windows Server VMs on Amazon EVS with Microsoft Windows Server.&nbsp;You can configure an EVS connector to your VMware vCenter Server and provide the VM IDs for those Window Server VMs you want to entitle through the Amazon EVS console or AWS CLI. Pay for only what your VMs use, on a per vCPU-hour basis. Add or remove entitlement for your VMs at any time, giving you flexibility to manage costs as your environment evolves.&nbsp;&nbsp;This newest release provides you with greater flexibility when migrating to AWS, helping meet critical data center exit timelines while maintaining your familiar VMware environment.&nbsp;</p> \n<p>This feature is available in all AWS Regions where <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon EVS is available</a>.</p> \n<p>For more details, read the step-by-step walkthrough on the <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/whats-new-amazon-evs-now-offers-windows-server-licensing-for-your-vmware-migrations/\">blog post.</a> Visit the Amazon EVS&nbsp;<a href=\"https://aws.amazon.com/evs/\">product detail page</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>. to learn more about Amazon EVS.&nbsp;</p>"
  "29ebf553f3125a46df092e33bf3e8d0a":
    "id": "29ebf553f3125a46df092e33bf3e8d0a"
    "title": "AWS IoT Greengrass v2.17 now supports non-root installation and introduces new light weight components"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-iot-greengrass-v217/"
    "published": "2026-04-20 19:00:00"
    "fetched": "2026-04-21 06:42:33"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/greengrass/v2/developerguide/greengrass-release-2026-04-16.html\">AWS IoT Greengrass v2.17</a>&nbsp;is now available, enabling you to run the edge runtime as a non-root user on Linux systems and deploy lighter-weight components that use significantly less memory. AWS IoT Greengrass is an Internet of Things (IoT) edge runtime and cloud service that helps customers build, deploy, and manage device software at the edge. With this release, you can install and run AWS IoT Greengrass v2.17 as a non-root user, making it easy for you to meet security requirements in enterprise and regulated environments where root access is prohibited. The release also adds an uninstall life cycle capability that automatically activates when you remove a component from a device, simplifying dependency management.<br /> <br /> Moreover, the release introduces the following new nucleus lite capabilities to reduce resource consumption at the edge:<br /> </p> \n<ul> \n <li>Secure Tunneling lite component that uses just 4MB of memory, down from 36MB in the standard component.</li> \n <li>Updated Fleet Provisioning component that supports Trusted Platform Module (TPM) 2.0 for cryptographic operations and secure device identity management.</li> \n <li>PKCS#11 (Public Key Cryptographic Standard) interface that enables AWS IoT Greengrass nucleus lite component to easily authenticate with AWS IoT Core using keys and certificates stored in a Hardware Security Module (HSM).</li> \n</ul> \n<p>AWS IoT Greengrass v2.17 is available in all AWS Regions where AWS IoT Greengrass is offered. To learn more about AWS IoT Greengrass v2.17 and its new features, visit the AWS IoT Greengrass&nbsp;<a href=\"https://docs.aws.amazon.com/greengrass/v2/developerguide/what-is-iot-greengrass.html\">documentation.</a>&nbsp;Follow the Getting Started&nbsp;<a href=\"https://docs.aws.amazon.com/greengrass/v2/developerguide/getting-started.html\">guide</a>&nbsp;for a quick introduction to AWS IoT Greengrass.</p>"
"last_updated": "2026-04-21 06:42:33 JST"
