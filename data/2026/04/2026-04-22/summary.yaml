"overview": |
  この日は AI エージェント開発とコンピューティングの強化が中心でした。Amazon Bedrock AgentCore に新機能が追加され、マネージドハーネス (プレビュー)、AgentCore CLI、コーディングアシスタント向けの AgentCore skills により、アイデアから動作するエージェントのプロトタイプまでを素早く構築できるようになりました。また Amazon Bedrock で Claude Cowork が提供開始され、開発者だけでなく全社のナレッジワーカーが AI を活用できる環境が整いました。ML では SageMaker AI の最適化された生成 AI 推論レコメンデーション、Qwen3.5 のサーバーレスモデルカスタマイズ、Neptune と Mem0 を用いた企業向けメモリが紹介されました。コンピューティングでは Intel Xeon 6 搭載の EC2 C8i/C8i-flex のリージョン拡張、ECS Managed Instances の GPU ヘルス監視・自動修復、Lambda Durable Functions の 16 リージョン拡張が発表。その他 OpenSearch のソフトウェア更新ロールバック、IVS のサーバーサイド広告挿入、Corretto の四半期更新も登場しました。セキュリティでは 184 サービスを対象とした Winter 2025 SOC 1 レポートと、Secrets Manager の MongoDB Atlas/Confluent Cloud 対応、Security Hub Extended の解説が公開されました。
