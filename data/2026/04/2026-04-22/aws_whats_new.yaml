  "5a1f53ee57d92828d6dcec85a18220a2":
    "id": "5a1f53ee57d92828d6dcec85a18220a2"
    "title": "AWS Secrets Manager extends managed external secrets to MongoDB Atlas and Confluent Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/secrets-manager-managed-external-secrets-mongodb-confluent/"
    "published": "2026-04-22 16:21:00"
    "fetched": "2026-04-23 02:58:31"
    "summary": "<p>AWS Secrets Manager now supports managed external secrets for MongoDB Atlas and Confluent Cloud</p> \n<p>AWS Secrets Manager now supports managed external secrets for MongoDB Atlas and Confluent Cloud, enabling you to centrally manage and automatically rotate secrets for these third-party services directly from AWS Secrets Manager — without building or maintaining custom Lambda rotation functions.</p> \n<p>The MongoDB Atlas integration supports two secret types: database user secrets (username-password authentication via SCRAM) and service account secrets (OAuth client ID and secret). The Confluent Cloud integration supports API key rotation for service accounts, with support for both cluster-scoped and cloud resource management keys. All integrations include automatic rotation enabled by default, eliminating hardcoded secrets and reducing the operational overhead of managing secrets across multiple platforms.</p> \n<p>With managed external secrets, secret rotation is fully managed by AWS Secrets Manager using partner-provided rotation logic — no Lambda functions are deployed in your account. For example, a data pipeline using MongoDB Atlas and Confluent Kafka can now centralize secret management in AWS Secrets Manager, automatically rotating database and streaming platform secrets without modifying application code or managing separate rotation logic for each service.</p> \n<p>MongoDB Atlas and Confluent Cloud integrations for managed external secrets are available in all AWS Regions where managed external secrets is supported, joining existing integrations with Salesforce, Snowflake, and BigID. To learn more, visit the AWS Secrets Manager managed external secrets documentation (https://docs.aws.amazon.com/secretsmanager/latest/userguide/managed-external-secrets.html).</p>"
  "92a0770c2859eaa73b9cf09897ecff2a":
    "id": "92a0770c2859eaa73b9cf09897ecff2a"
    "title": "Enhancements to AWS Network Firewall Managed Rules from AWS Marketplace Partners"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/marketplace-managed-rules-enhancements/"
    "published": "2026-04-22 18:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>AWS Network Firewall now supports expanded Managed Rules from AWS Marketplace partners, with new rule group optimizations through partners to include up to 10 million domain name indicators and up to 1 million IP addresses in their managed rule groups. Infoblox is expanding domain name indicators to protect your workloads from critical and high-risk domains. Lumen is introducing new rule groups to stop command and control attacks. ThreatSTOP is adding managed rules for Office of Foreign Assets Control (OFAC) sanctions and expanding global compliance protections with new European Union, Japan, and United Nations sanction coverage.<br /> <br /> These enhancements give you access to richer, more comprehensive threat intelligence directly within AWS Network Firewall, reducing the operational burden of managing threat feeds and enabling faster, more accurate protection against emerging threats. Whether you need to block malicious domains at scale, defend against command and control infrastructure, or enforce sanctions-based compliance policies, managed rules from AWS Marketplace partners provide ready-to-deploy, continuously updated protections for your cloud workloads.<br /> <br /> Managed rules for AWS Network Firewall are available from AWS Marketplace sellers of Check Point, Fortinet, Infoblox, Lumen, Rapid7, ThreatSTOP, and Trend Micro. AWS Marketplace rule groups are now available in 9 additional AWS Regions: Asia Pacific (Jakarta), Asia Pacific (Hyderabad), Asia Pacific (Melbourne), Asia Pacific (Malaysia), Canada West (Calgary), Europe (Zurich), Europe (Spain), Israel (Tel Aviv), and Mexico (Central). For a full list of supported regions, visit the AWS Regional Services page.<br /> <br /> To get started, visit the AWS Network Firewall console or browse available managed rules in <a href=\"https://aws.amazon.com/marketplace\" target=\"_blank\">AWS Marketplace</a>. For more information, see the AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\" target=\"_blank\">product page</a> and the service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/\" target=\"_blank\">documentation</a>.</p>"
  "ff65ef700b9615a02889ff2dcb90d3b8":
    "id": "ff65ef700b9615a02889ff2dcb90d3b8"
    "title": "Amazon EC2 for SQL Server HA now supports health notifications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-sql-ha-health-notifications/"
    "published": "2026-04-22 15:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>Today, AWS announced that you can now receive notifications through the <a href=\"https://aws.amazon.com/premiumsupport/technology/aws-health/\" target=\"_blank\">AWS Health Dashboard</a> when <a href=\"https://aws.amazon.com/microsoft/sql-server/\" target=\"_blank\">Amazon EC2 for SQL Server</a> cannot detect a valid SQL Server High Availability (HA) status.</p> \n<p>This enhancement is particularly valuable for customers who register EC2 SQL HA clusters through AWS Console or <a href=\"https://alpha.www.docs.aws.a2z.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-sqlhastandbydetectedinstance.html\" target=\"_blank\">CloudFormation</a> automation to reduce license included costs. You can receive <a href=\"https://docs.aws.amazon.com/health/latest/ug/manage-user-notifications.html\" target=\"_blank\">this notification</a> through multiple channels, including AWS Health, Amazon EventBridge events, and email. These notifications will guide you to respond quickly, helping avoid unexpected billing costs or charges.</p> \n<p>To learn more, access the <a href=\"https://docs.aws.amazon.com/sql-server-ec2/latest/userguide/sql-high-availability.html\" target=\"_blank\">High Availability for SQL Server on Amazon EC2 user guide</a> for additional details.&nbsp; This feature is accessible&nbsp;in all AWS Regions where <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Amazon EC2 SQL HA is available</a> and the AWS GovCloud (US) Regions.</p>"
  "2e11f12d4b97326670d8c12a8466bed9":
    "id": "2e11f12d4b97326670d8c12a8466bed9"
    "title": "Amazon Corretto April 2026 Quarterly Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-corretto-april-2026-quarterly-updates/"
    "published": "2026-04-22 14:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>On April 22, 2026 Amazon announced quarterly security and critical updates for Amazon Corretto Long-Term Supported (LTS) and Feature Release (FR) versions of OpenJDK. Corretto 26.0.1, 25.0.3, 21.0.11, 17.0.19, 11.0.31, and 8u492 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK.<br /> <br /> This is the last Corretto 8 release to include JavaFX binaries. JavaFX binaries will no longer be included starting from the next quarterly update in July 2026. You can learn more about the migration recommendations at <a href=\"https://github.com/corretto/corretto-8/issues/569\">Corretto 8 GitHub</a>.<br /> <br /> Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 26, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.<br /> <br /> Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "c51d5e398f78f0a7f8f2c1b78ea2ce14":
    "id": "c51d5e398f78f0a7f8f2c1b78ea2ce14"
    "title": "Amazon OpenSearch Service now supports rollback for service software updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-opensearch-service-now-supports-rollback-for-service-software-updates/"
    "published": "2026-04-22 03:30:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>Amazon OpenSearch Service now supports rollback for service software updates, giving you greater control when managing updates to your Amazon OpenSearch Service domains. Previously, once a software update was applied, there was no self-service option to revert it to a previous version if you encountered an unexpected issue.</p> \n<p>Software update rollback uses a blue/green deployment. You can initiate a rollback within 15 days of a service software update being applied, using the new RollbackServiceSoftwareUpdate API, the AWS CLI, or the Amazon OpenSearch Service console.</p> \n<p>Rollback option for service software updates is now available in all AWS Regions where Amazon OpenSearch Service is available. To learn more about the software updates and rollback option, refer to the Amazon OpenSearch Service <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/service-software.html#service-software-rollback\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
"last_updated": "2026-04-23 04:22:02 JST"
