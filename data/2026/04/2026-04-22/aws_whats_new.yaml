"entries":
  "5a1f53ee57d92828d6dcec85a18220a2":
    "id": "5a1f53ee57d92828d6dcec85a18220a2"
    "title": "AWS Secrets Manager extends managed external secrets to MongoDB Atlas and Confluent Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/secrets-manager-managed-external-secrets-mongodb-confluent/"
    "published": "2026-04-22 16:21:00"
    "fetched": "2026-04-23 02:58:31"
    "summary": "<p>AWS Secrets Manager now supports managed external secrets for MongoDB Atlas and Confluent Cloud</p> \n<p>AWS Secrets Manager now supports managed external secrets for MongoDB Atlas and Confluent Cloud, enabling you to centrally manage and automatically rotate secrets for these third-party services directly from AWS Secrets Manager — without building or maintaining custom Lambda rotation functions.</p> \n<p>The MongoDB Atlas integration supports two secret types: database user secrets (username-password authentication via SCRAM) and service account secrets (OAuth client ID and secret). The Confluent Cloud integration supports API key rotation for service accounts, with support for both cluster-scoped and cloud resource management keys. All integrations include automatic rotation enabled by default, eliminating hardcoded secrets and reducing the operational overhead of managing secrets across multiple platforms.</p> \n<p>With managed external secrets, secret rotation is fully managed by AWS Secrets Manager using partner-provided rotation logic — no Lambda functions are deployed in your account. For example, a data pipeline using MongoDB Atlas and Confluent Kafka can now centralize secret management in AWS Secrets Manager, automatically rotating database and streaming platform secrets without modifying application code or managing separate rotation logic for each service.</p> \n<p>MongoDB Atlas and Confluent Cloud integrations for managed external secrets are available in all AWS Regions where managed external secrets is supported, joining existing integrations with Salesforce, Snowflake, and BigID. To learn more, visit the AWS Secrets Manager managed external secrets documentation (https://docs.aws.amazon.com/secretsmanager/latest/userguide/managed-external-secrets.html).</p>"
  "92a0770c2859eaa73b9cf09897ecff2a":
    "id": "92a0770c2859eaa73b9cf09897ecff2a"
    "title": "Enhancements to AWS Network Firewall Managed Rules from AWS Marketplace Partners"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/marketplace-managed-rules-enhancements/"
    "published": "2026-04-22 18:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>AWS Network Firewall now supports expanded Managed Rules from AWS Marketplace partners, with new rule group optimizations through partners to include up to 10 million domain name indicators and up to 1 million IP addresses in their managed rule groups. Infoblox is expanding domain name indicators to protect your workloads from critical and high-risk domains. Lumen is introducing new rule groups to stop command and control attacks. ThreatSTOP is adding managed rules for Office of Foreign Assets Control (OFAC) sanctions and expanding global compliance protections with new European Union, Japan, and United Nations sanction coverage.<br /> <br /> These enhancements give you access to richer, more comprehensive threat intelligence directly within AWS Network Firewall, reducing the operational burden of managing threat feeds and enabling faster, more accurate protection against emerging threats. Whether you need to block malicious domains at scale, defend against command and control infrastructure, or enforce sanctions-based compliance policies, managed rules from AWS Marketplace partners provide ready-to-deploy, continuously updated protections for your cloud workloads.<br /> <br /> Managed rules for AWS Network Firewall are available from AWS Marketplace sellers of Check Point, Fortinet, Infoblox, Lumen, Rapid7, ThreatSTOP, and Trend Micro. AWS Marketplace rule groups are now available in 9 additional AWS Regions: Asia Pacific (Jakarta), Asia Pacific (Hyderabad), Asia Pacific (Melbourne), Asia Pacific (Malaysia), Canada West (Calgary), Europe (Zurich), Europe (Spain), Israel (Tel Aviv), and Mexico (Central). For a full list of supported regions, visit the AWS Regional Services page.<br /> <br /> To get started, visit the AWS Network Firewall console or browse available managed rules in <a href=\"https://aws.amazon.com/marketplace\" target=\"_blank\">AWS Marketplace</a>. For more information, see the AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\" target=\"_blank\">product page</a> and the service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/\" target=\"_blank\">documentation</a>.</p>"
  "ff65ef700b9615a02889ff2dcb90d3b8":
    "id": "ff65ef700b9615a02889ff2dcb90d3b8"
    "title": "Amazon EC2 for SQL Server HA now supports health notifications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-sql-ha-health-notifications/"
    "published": "2026-04-22 15:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>Today, AWS announced that you can now receive notifications through the <a href=\"https://aws.amazon.com/premiumsupport/technology/aws-health/\" target=\"_blank\">AWS Health Dashboard</a> when <a href=\"https://aws.amazon.com/microsoft/sql-server/\" target=\"_blank\">Amazon EC2 for SQL Server</a> cannot detect a valid SQL Server High Availability (HA) status.</p> \n<p>This enhancement is particularly valuable for customers who register EC2 SQL HA clusters through AWS Console or <a href=\"https://alpha.www.docs.aws.a2z.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-sqlhastandbydetectedinstance.html\" target=\"_blank\">CloudFormation</a> automation to reduce license included costs. You can receive <a href=\"https://docs.aws.amazon.com/health/latest/ug/manage-user-notifications.html\" target=\"_blank\">this notification</a> through multiple channels, including AWS Health, Amazon EventBridge events, and email. These notifications will guide you to respond quickly, helping avoid unexpected billing costs or charges.</p> \n<p>To learn more, access the <a href=\"https://docs.aws.amazon.com/sql-server-ec2/latest/userguide/sql-high-availability.html\" target=\"_blank\">High Availability for SQL Server on Amazon EC2 user guide</a> for additional details.&nbsp; This feature is accessible&nbsp;in all AWS Regions where <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Amazon EC2 SQL HA is available</a> and the AWS GovCloud (US) Regions.</p>"
  "2e11f12d4b97326670d8c12a8466bed9":
    "id": "2e11f12d4b97326670d8c12a8466bed9"
    "title": "Amazon Corretto April 2026 Quarterly Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-corretto-april-2026-quarterly-updates/"
    "published": "2026-04-22 14:00:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>On April 22, 2026 Amazon announced quarterly security and critical updates for Amazon Corretto Long-Term Supported (LTS) and Feature Release (FR) versions of OpenJDK. Corretto 26.0.1, 25.0.3, 21.0.11, 17.0.19, 11.0.31, and 8u492 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK.<br /> <br /> This is the last Corretto 8 release to include JavaFX binaries. JavaFX binaries will no longer be included starting from the next quarterly update in July 2026. You can learn more about the migration recommendations at <a href=\"https://github.com/corretto/corretto-8/issues/569\">Corretto 8 GitHub</a>.<br /> <br /> Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 26, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.<br /> <br /> Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "c51d5e398f78f0a7f8f2c1b78ea2ce14":
    "id": "c51d5e398f78f0a7f8f2c1b78ea2ce14"
    "title": "Amazon OpenSearch Service now supports rollback for service software updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-opensearch-service-now-supports-rollback-for-service-software-updates/"
    "published": "2026-04-22 03:30:00"
    "fetched": "2026-04-23 04:22:02"
    "summary": "<p>Amazon OpenSearch Service now supports rollback for service software updates, giving you greater control when managing updates to your Amazon OpenSearch Service domains. Previously, once a software update was applied, there was no self-service option to revert it to a previous version if you encountered an unexpected issue.</p> \n<p>Software update rollback uses a blue/green deployment. You can initiate a rollback within 15 days of a service software update being applied, using the new RollbackServiceSoftwareUpdate API, the AWS CLI, or the Amazon OpenSearch Service console.</p> \n<p>Rollback option for service software updates is now available in all AWS Regions where Amazon OpenSearch Service is available. To learn more about the software updates and rollback option, refer to the Amazon OpenSearch Service <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/service-software.html#service-software-rollback\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "142ec0915effd2f923dbba6862c8ba94":
    "id": "142ec0915effd2f923dbba6862c8ba94"
    "title": "Amazon SageMaker AI now supports serverless model customization for Qwen3.5 models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-ft-qwen3-5/"
    "published": "2026-04-22 17:53:00"
    "fetched": "2026-04-23 05:51:23"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Qwen3.5, enabling you to fine-tune Qwen3.5 4B, 9B, and 27B parameter models using supervised fine-tuning (SFT) and reinforcement fine-tuning (RFT). Qwen3.5 is a popular open-weight model family from Alibaba Cloud.&nbsp;Before this launch, you could deploy these base models on SageMaker AI and now, you can also adapt them to your specific domains and workflows.&nbsp;</p> \n<p>Model customization enables you to tailor foundation models with your proprietary data so they more accurately reflect your domain knowledge, terminology, and quality standards. Rather than building models from scratch, fine-tuning lets you start from a capable base model and specialize it for your use cases, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or improving performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.</p> \n<p>Serverless model customization for Qwen3.5 on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and EU (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the&nbsp;<a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a>&nbsp;for programmatic access. To learn more, see the Amazon SageMaker AI&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
  "14f57c7bb43663469940e9a356472f4a":
    "id": "14f57c7bb43663469940e9a356472f4a"
    "title": "Amazon Bedrock AgentCore adds new features to help developers build agents faster"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/agentcore-new-features-to-build-agents-faster/"
    "published": "2026-04-22 16:00:00"
    "fetched": "2026-04-23 05:51:23"
    "summary": "<p>Today, Amazon Bedrock AgentCore introduces new features to help developers go from an idea to working agent prototype faster and manage the full agent lifecycle from a single platform: a managed harness (in preview), the AgentCore CLI, and AgentCore skills for coding assistants.</p> \n<p>The managed harness (preview) lets developers define an agent by specifying a model, system prompt, and tools, then run it immediately with no orchestration code required. The harness manages the full agent loop: reasoning, tool selection, action execution, and response streaming. Each session gets its own microVM with filesystem and shell access. The harness is model agnostic with the ability to switch models mid-session. Any configuration set at create time can be overridden per invocation, so developers experiment without redeploying. When developers need full control, they can export the harness orchestration in Strands-based code. Filesystem persistence (preview) externalizes the local session state, allowing agents to suspend mid-task and resume exactly where they left off. As a prototype evolves, developers can easily add evaluations to measure quality, memory for personalization, or additional tools and skills. When it’s time to promote a validated concept, the AgentCore CLI deploys with the governance and audibility of infrastructure-as-code. AWS CDK is supported today as a resource manager, with Terraform coming soon. The AgentCore CLI has been optimized for coding assistant control, with pre-built skills that provide accurate, up-to-date AgentCore guidance. AgentCore skills are available today through Kiro Power, with support for Claude Code, Codex, and Cursor coming next week.</p> \n<p>The managed harness (preview) in AgentCore is available in four AWS Regions: US West (Oregon), US East (N. Virginia), Europe (Frankfurt), and Asia Pacific (Sydney).&nbsp;The AgentCore CLI is available in <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">14 AWS Regions</a> where AgentCore is available. There is no additional charge for the harness, CLI, or skills. Learn more through the <a href=\"https://aws.amazon.com/blogs/machine-learning/get-to-your-first-working-agent-in-minutes-announcing-new-features-in-amazon-bedrock-agentcore/\">blog</a>, and visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-get-started-cli.html\">documentation</a> to get started.</p>"
  "aec50249d1acd701acf0061e9a21ec45":
    "id": "aec50249d1acd701acf0061e9a21ec45"
    "title": "Amazon EC2 C8i-flex instances are now available in Europe (Ireland, London), and Asia Pacific (New Zealand) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-c8i-flex-instances-europe-ireland-europe-london-asia-pacific-new-zealand-regions/"
    "published": "2026-04-22 19:46:00"
    "fetched": "2026-04-23 06:48:07"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8i-flex instances are available in the Europe (Ireland, London), and Asia Pacific (New Zealand) regions. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. C8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% higher performance than C7i-flex instances, with even higher gains for specific workloads. The C8i-flex are up to 60% faster for NGINX web applications, up to 40% faster for AI deep learning recommendation models, and 35% faster for Memcached stores compared to C7i-flex.<br /> <br /> C8i-flex are the easiest way to get price performance benefits for a majority of compute intensive workloads like web and application servers, databases, caches, Apache Kafka, Elasticsearch, and enterprise applications. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\" target=\"_blank\">C8i-flex</a> instances visit the <a href=\"https://aws.amazon.com/blogs/aws/introducing-new-compute-optimized-amazon-ec2-c8i-and-c8i-flex-instances/\" target=\"_blank\">AWS News blog</a>.</p>"
  "cabb1b135f608a7e85421d7ec837f400":
    "id": "cabb1b135f608a7e85421d7ec837f400"
    "title": "Amazon EC2 C8i instances are now available in Europe (Ireland) and Asia Pacific (New Zealand) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-c8i-instances-europe-ireland-asia-pacific-new-zealand-regions/"
    "published": "2026-04-22 19:31:00"
    "fetched": "2026-04-23 06:48:07"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8i instances are available in the Europe (Ireland) and Asia Pacific (New Zealand) regions. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. C8i instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% higher performance than C7i instances, with even higher gains for specific workloads. The C8i instances deliver up to 60% faster for NGINX web applications, up to 40% faster for AI deep learning recommendation models, and 35% faster for Memcached stores compared to C7i.<br /> <br /> C8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. C8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\">AWS Management Console</a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\">C8i</a> instances visit the <a href=\"https://aws.amazon.com/blogs/aws/introducing-new-compute-optimized-amazon-ec2-c8i-and-c8i-flex-instances/\">AWS News blog</a>.</p>"
  "2ea8be911e47e32da7ab178b2b095581":
    "id": "2ea8be911e47e32da7ab178b2b095581"
    "title": "Amazon EC2 announces Managed resource visibility settings"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-managed-resource-visibility/"
    "published": "2026-04-22 17:53:00"
    "fetched": "2026-04-23 06:48:07"
    "summary": "<p>Amazon EC2 now lets you control whether resources provisioned by managed instance offerings appear in your Amazon EC2 console views and API list operations.</p> \n<p>Amazon EC2 Managed Instances are instances provisioned and managed by a designated service provider, such as Amazon EKS, Amazon ECS, AWS Lambda or Amazon Workspaces. AWS is responsible for the configuration, patching, and health of managed EC2 instances as well as other associated resources like EBS volumes, snapshots and Network Interfaces. Until today, by default these managed resources appeared alongside self-managed ones in API responses and respective resource consoles even though AWS is responsible for managing these resources. Now, with Managed resource visibility settings, any new managed resources are hidden by default from your resource console views and describe API responses such as EC2 console and describe-instances API responses, to align better with the shared responsibility model of these resources. &nbsp;</p> \n<p>You can configure managed resource visibility through the Amazon EC2 console or by using the AWS CLI.&nbsp;To learn more, see Managed resource visibility settings the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-ec2-managed-instances.html#managed-resource-visibility-settings\">Amazon EC2 User Guide</a>.</p>"
  "b8e34190b48c13aee35191384af4f483":
    "id": "b8e34190b48c13aee35191384af4f483"
    "title": "AWS Lambda durable functions are now available in 16 additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/lambda-durable-functions-16-new-regions/"
    "published": "2026-04-22 06:00:00"
    "fetched": "2026-04-23 06:48:07"
    "summary": "<p>AWS Lambda durable functions are now available in 16 additional AWS Regions. Lambda durable functions enable developers to build reliable multi-step applications and AI workflows within the Lambda developer experience, and with this expansion, you can now use durable functions in 16 additional AWS Regions:&nbsp;Africa (Cape Town), Asia Pacific (Hyderabad), Asia Pacific (Jakarta), Asia Pacific (Melbourne), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Taipei), Canada (Central), Canada West (Calgary), Europe (London), Europe (Paris), Europe (Zurich), Israel (Tel Aviv), Mexico (Central), South America (São Paulo), and US West (N. California).</p> \n<p>Lambda durable functions extend the Lambda programming model with new primitives in your event handler, such as \"steps\" and \"waits\", allowing you to checkpoint progress, automatically recover from failures, and pause execution without incurring compute charges for on-demand functions. With this region expansion, you can orchestrate complex processes such as order workflows, user onboarding, and AI-assisted tasks closer to your users and data, helping you to meet low-latency and data residency requirements.</p> \n<p>You can activate durable functions for new Python (versions 3.13 and 3.14), Node.js (versions 22 and 24), or Java (17+) based Lambda functions using the AWS Lambda API, AWS Management Console, or AWS SDK. You can also use infrastructure as code tools such as AWS CloudFormation, AWS Serverless Application Model (AWS SAM), and the AWS Cloud Development Kit (AWS CDK).</p> \n<p>For more information on durable functions, visit the <a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda durable functions product page</a> or the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/lambda/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda pricing</a>. For region availability, visit the <a href=\"https://builder.aws.com/build/capabilities\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Capabilities by Region page</a>.</p>"
  "d6d3520fbd4490935e60f7d95c2273f0":
    "id": "d6d3520fbd4490935e60f7d95c2273f0"
    "title": "Amazon RDS Custom now supports the latest GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-rds-custom-sql-server-supports-latest-gdr-updates-for-microsoft-sql-server/"
    "published": "2026-04-22 07:43:00"
    "fetched": "2026-04-23 07:43:19"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/en-us/topic/kb5077469-description-of-the-security-update-for-sql-server-2019-cu32-march-10-2026-5ec2c609-35cb-483d-aa80-5e66821e5c97\" target=\"_blank\">KB5077469</a> (RDS version 15.00.4460.4.v1) and SQL Server 2022 CU23+GDR <a href=\"https://support.microsoft.com/help/5077464\" target=\"_blank\">KB5077464</a> (RDS version 16.00.4240.4.v1).<br /> <br /> The GDR updates address vulnerabilities described in CVE-2026-21262 and CVE-2026-26115.. For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5077469, KB5077464. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
  "54f32ec256bd6d14948b9f17f1b8219c":
    "id": "54f32ec256bd6d14948b9f17f1b8219c"
    "title": "Amazon SageMaker Unified Studio now supports multiple code spaces within projects for IAM domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-code-spaces/"
    "published": "2026-04-22 20:31:00"
    "fetched": "2026-04-23 08:42:17"
    "summary": "<p>Amazon SageMaker Unified Studio now&nbsp;lets&nbsp;data workers create and manage multiple code spaces (individually configured development environments) within a single project for IAM domains.&nbsp;Previously, projects were limited to one&nbsp;JupyterLab&nbsp;space and one Code Editor space embedded in the project.&nbsp;With this launch, you can now&nbsp;parallelly&nbsp;work on different workstreams or experiments&nbsp;with&nbsp;different&nbsp;compute and storage configuration&nbsp;needs,&nbsp;giving&nbsp;developers&nbsp;the flexibility they need as their&nbsp;workloads scale.&nbsp;For instance, data scientists can now&nbsp;work&nbsp;in parallel&nbsp;on any long running data transformation and model training workloads within the same project using separate spaces.</p> \n<p>With multiple spaces, each one&nbsp;maintains&nbsp;its own persistent Amazon EBS volume, ensuring that your files, data, and session state are preserved independently. You can scale compute and storage up or down per space, pause and resume them at any time, and customize the runtime environment for each specific task. Spaces can either be opened in dedicated browser tabs or connected to a local IDE if you prefer your own development environment, with full functionality including Amazon Q paid tier support.&nbsp;This is particularly beneficial for builders who need isolated environments for parallel&nbsp;workstreams&nbsp;while still working within a single collaborative project.&nbsp;</p> \n<p>This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more about code spaces in SageMaker Unified Studio projects, see&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/ide-spaces.html\">Managing Code Spaces</a>&nbsp;in the Amazon SageMaker User Guide.</p>"
  "418bb86b39ce25a4f8f4ed980c4ca065":
    "id": "418bb86b39ce25a4f8f4ed980c4ca065"
    "title": "Amazon IVS Low-Latency Streaming now supports server-side ad insertion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ivs-low-latency-streaming-server-side-ad-insertion/"
    "published": "2026-04-22 15:29:00"
    "fetched": "2026-04-23 08:42:17"
    "summary": "<p>Amazon Interactive Video Service (Amazon IVS) Low-Latency Streaming now supports server-side ad insertion (SSAI), enabling you to monetize your live streams with video ads. IVS SSAI integrates with AWS Elemental MediaTailor to stitch ads directly into the video stream on the server, delivering a seamless viewing experience while providing access to ad decisioning, audience targeting, and personalization capabilities.&nbsp;</p> \n<p>IVS provides an API operation to insert ad breaks into your live stream, giving creators or operators control over when ads run. Ads are stitched into the stream on the server, reducing the impact of ad blockers and simplifying client-side integration. When a live stream is recorded to Amazon S3, IVS includes ad markers in the recording, enabling you to monetize on-demand content as well.&nbsp;</p> \n<p><a href=\"https://aws.amazon.com/ivs/\">Amazon IVS</a> is a managed live streaming solution designed to make low-latency or real-time video available to viewers around the world. Visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS region table</a> for a full list of AWS Regions where the Amazon IVS console and APIs for control and creation of video streams are available.&nbsp;</p> \n<p>To learn more, please visit the <a href=\"https://docs.aws.amazon.com/ivs/latest/LowLatencyUserGuide/server-side-ad-insertion.html\">Amazon IVS Server-Side Ad Insertion documentation</a> page.&nbsp;</p>"
  "0b1ea86b8c9caf35ee2c6e66013c5ce0":
    "id": "0b1ea86b8c9caf35ee2c6e66013c5ce0"
    "title": "Introducing GPU Health Monitoring and Auto Repair for Amazon ECS Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ecs-gpu-auto-repair/"
    "published": "2026-04-22 17:00:00"
    "fetched": "2026-04-23 11:22:43"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Service (Amazon ECS)</a> now offers NVIDIA GPU health monitoring and auto repair functionality for Amazon ECS Managed Instances. The new capability automatically detects critical NVIDIA GPU hardware failures and replaces impaired instances, helping customers improve the availability and reliability of their GPU-accelerated containerized workloads.<br /> <br /> Running GPU-accelerated workloads, such as GenAI inference, requires specialized hardware management to mitigate failures and minimize disruption. Amazon ECS Managed Instances now continuously monitor GPU health using NVIDIA Data Center GPU Manager (DCGM) and proactively replace impaired capacity when critical failures occur. You can monitor GPU health through the DescribeContainerInstances API and receive notifications through Amazon EventBridge when instances become impaired. For workloads where you prefer to manage instance lifecycle manually, you can opt out of auto repair at the capacity provider level and handle GPU error events with your own remediation logic.<br /> <br /> GPU health auto repair is enabled by default on all Amazon ECS Managed Instances running on supported NVIDIA GPU instance types at no additional cost. The capability is available in all AWS Commercial Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-instances-gpu-auto-repair.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ECS Developer Guide</a>.</p>"
"last_updated": "2026-04-23 11:22:43 JST"
