  "fce77f38c10a6b294c0e5b316ec28f73":
    "id": "fce77f38c10a6b294c0e5b316ec28f73"
    "title": "AI for Science – AI がもたらす研究新時代"
    "link": "https://aws.amazon.com/jp/blogs/news/ai-for-science-new-era/"
    "published": "2026-04-24 13:56:29"
    "fetched": "2026-04-24 14:31:30"
    "summary": "文部科学省は 2026 年 4 月、AI for Science 萌芽的挑戦研究創出事業 ( SPReAD ) の公募を開始しました。1 課題 500 万円以下、計 1,000 件程度の採択が予定され、AWS の 計算資源やAPI 利用料も対象経費に含まれます。本記事では、創薬・ゲノミクス・材料科学など 6 領域の AI 活用ユースケースと先駆者たちの事例を紹介し、AWS の サービス / 技術基盤との対応関係を解説します。SPReAD への応募を検討されている研究者の方にも参考になる内容です。"
  "53ead320c1fd84b68b4bc8e7eab51095":
    "id": "53ead320c1fd84b68b4bc8e7eab51095"
    "title": "AUMOVIO が Amazon Bedrock 搭載のエージェント型コーディングアシスタントでソフトウェア開発を強化"
    "link": "https://aws.amazon.com/jp/blogs/news/aumovio-boosts-software-development-with-an-agentic-coding-assistant-powered-by-amazon-bedrock-jp/"
    "published": "2026-04-24 16:06:14"
    "fetched": "2026-04-24 16:57:46"
    "summary": "本ブログ記事では、AUMOVIO が Amazon Web Services (AWS) のサービスと知見を活用して、Software-Defined Vehicle (SDV) 領域における革新的な自動車向けコーディングアシスタントを開発した事例をご紹介します。AUMOVIO のソリューションは、複数の AI モデルを活用して開発ライフサイクルの各工程を加速させながら、自動車業界の標準と AUMOVIO 独自のコーディングベストプラクティスに準拠しています。可能な限りコードを再利用し、変更を最小限に抑えることで、このアシスタントは V 字モデルの他の工程に必要な作業を大幅に削減します。"
"last_updated": "2026-04-24 16:57:46 JST"
