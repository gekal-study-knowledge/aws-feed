    "title": "Amazon SageMaker HyperPod now supports automatic Slurm topology management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-hyperpod-automatic-slurm-topology/"
    "published": "2026-04-24 05:00:00"
    "fetched": "2026-04-24 08:41:22"
    "summary": "<p>Amazon SageMaker HyperPod now automatically selects and continuously maintains the optimal network topology configuration for Slurm clusters based on the GPU instance types in the cluster. Network topology directly impacts distributed training performance — when jobs are placed on nodes that are topologically close, GPU-to-GPU communication is faster, NCCL collective operations are more efficient, and training throughput improves. HyperPod dynamically adapts the topology as the cluster evolves through scaling operations and node replacements, so job placement remains optimized throughout the cluster lifecycle without requiring manual updates to topology files or Slurm reconfiguration.<br /> <br /> HyperPod inspects the instance types across all instance groups at cluster creation, identifies the networking and interconnect characteristics of each instance type, and automatically selects the best-fit topology model. HyperPod supports tree topology for instance types with hierarchical interconnects such as ml.p5.48xlarge, ml.p5e.48xlarge, and ml.p5en.48xlarge, and block topology for instance types with uniform high-bandwidth connectivity such as ml.p6e-gb200.NVL72. For clusters with mixed instance types, HyperPod selects a compatible topology that works across all nodes. As the cluster changes through scale-up, scale-down, or node replacement events, HyperPod automatically updates the topology configuration without manual intervention, so the topology always reflects the actual state of the cluster.</p> \n<p>To get started, create a SageMaker HyperPod Slurm cluster with supported GPU instance types. Topology-aware scheduling is enabled by default and requires no configuration.</p> \n<p>This feature is available in all AWS Regions where Amazon SageMaker HyperPod is supported. To learn more about topology-aware scheduling, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-topology.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon SageMaker HyperPod documentation</a></p>"
  "5a886ea32ce2b1ab14af3093b716b0e8":
    "id": "5a886ea32ce2b1ab14af3093b716b0e8"
    "title": "AWS Compute Optimizer supports 162 new EC2 instance types and 32 new RDS DB instance classes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-compute-optimizer-ec2-rds/"
    "published": "2026-04-24 03:28:00"
    "fetched": "2026-04-25 01:51:55"
    "summary": "<p>AWS Compute Optimizer now supports the latest generation of Amazon Elastic Compute Cloud (Amazon EC2) and Amazon Relational Database Service (Amazon RDS) instance types. This expansion enables Compute Optimizer to help you take advantage of the price-to-performance improvements offered by the newest EC2 and RDS instance types.</p> \n<p>AWS Compute Optimizer has expanded support to include the latest generation EC2 instance types, including Compute Optimized (C8a, C8gb, C8i, C8i-flex, C8id), General Purpose (M8a, M8azn, M8gb, M8gn, M8id), Memory Optimized (R8a, R8gb, R8gn, R8id), Memory Intensive (x8i), and Storage Optimized (i7i) in its EC2 and EC2 Auto Scaling group recommendations. For RDS recommendations, Compute Optimizer has added support for M7i, M8g, R8g, X1, and Z1d DB instance classes across RDS for MySQL, RDS for PostgreSQL, Amazon Aurora MySQL, and Aurora PostgreSQL.</p> \n<p>This new feature is available in all AWS Regions where Compute Optimizer is available except the AWS GovCloud (US) Regions, the AWS China (Beijing) Region, operated by Sinnet, and the AWS China (Ningxia) Region, operated by NWCD. For more information about Compute Optimizer, visit our <a href=\"https://aws.amazon.com/compute-optimizer/\"><u>product page</u></a> <u>and</u> <a href=\"https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-ec2-recommendations.html\"><u>documentation</u></a>. You can start using Compute Optimizer through the AWS Management Console, AWS CLI, or AWS SDK.</p>"
  "f7c2b95e643f335d1c918bce6978f469":
    "id": "f7c2b95e643f335d1c918bce6978f469"
    "title": "AWS Client VPN now supports native AWS Transit Gateway integration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-client-vpn-transit-gateway/"
    "published": "2026-04-24 06:11:00"
    "fetched": "2026-04-25 02:46:48"
    "summary": "<p>AWS Client VPN now supports native integration with AWS Transit Gateway, simplifying centralized remote access for your end users across multiple VPCs and on-premises, and providing end-to-end source IP visibility.<br /> <br /> AWS Transit Gateway interconnects your Amazon Virtual Private Clouds (VPCs) and on-premises networks, while AWS Client VPN enables secure remote access to AWS and on-premises resources connected through your AWS network. Previously, connecting Client VPN to multiple VPCs required provisioning and managing an intermediate VPC, adding operational complexity as you needed to manage additional resources. Moreover, client source IPs were translated through Source Network Address Translation (SNAT), making it difficult to identify which remote user generated specific traffic and complicating security audits. Native Transit Gateway attachment eliminates the need for an intermediate VPC, letting you provide centralized remote access to multiple VPCs and on-premises networks directly from your Client VPN endpoint. Additionally, the end-user source IP is now preserved end-to-end, so you can create authorization rules based on actual client IPs and trace traffic back to specific users, simplifying security, compliance, and troubleshooting workflows. Furthermore, Transit Gateway flow logs capture connection-level details tied to preserved source IPs for improved troubleshooting and compliance audits.<br /> <br /> This integration is available in all AWS Regions where AWS Client VPN is available. There are no additional charges for this native integration beyond standard <a href=\"https://aws.amazon.com/vpn/pricing/\">pricing </a>of AWS Client VPN and AWS Transit Gateway.</p> \n<p>To learn more about Client VPN:</p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a></li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-tgw.html\">documentation</a></li> \n</ul>"
  "961f0fb05dc49a56a27fee599a5ff493":
    "id": "961f0fb05dc49a56a27fee599a5ff493"
    "title": "Amazon SageMaker Unified Studio now offers CI/CD CLI for data and AI applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-smus-ci-cd-cli/"
    "published": "2026-04-24 04:00:00"
    "fetched": "2026-04-28 07:52:56"
    "summary": "<p>Amazon SageMaker Unified Studio now offers the CI/CD CLI (aws-smus-cicd-cli), an open-source command line tool that automates deployment of multi-service data and AI applications across development, test, and production. Organizations building applications in SageMaker Unified Studio combine multiple AWS services, including AWS Glue, Amazon Athena, Amazon MWAA, Amazon SageMaker AI, Amazon Bedrock, and Amazon QuickSight, into single applications. The CLI allows data teams to define applications once in a YAML manifest while DevOps teams deploy with a single command, reducing deployment bottlenecks and configuration drift.</p> \n<p>The CLI reads a declarative&nbsp;manifest.yaml&nbsp;that maps each pipeline stage to an isolated SageMaker Unified Studio project. At deploy time, it substitutes stage-specific configurations (S3 paths, IAM roles, account IDs, and connection strings) and provisions resources in dependency order. Four commands cover the lifecycle:&nbsp;describe&nbsp;validates permissions and connections,&nbsp;bundle&nbsp;packages an immutable artifact from the source target,&nbsp;deploy&nbsp;writes that artifact to the destination target, and&nbsp;test&nbsp;runs post-deployment validation.&nbsp;It works with existing CI/CD solutions such as GitHub Actions, Jenkins, and GitLab CI.</p> \n<p>The CI/CD CLI is available at no additional cost in all AWS Regions where Amazon SageMaker Unified Studio is available. You pay only for the underlying AWS resources provisioned during deployment.</p> \n<p>To get started, visit the following resources:</p> \n<p>The CI/CD CLI is available at no additional cost in all AWS Regions where Amazon SageMaker Unified Studio is available. You pay only for the underlying AWS resources provisioned during deployment.</p> \n<p>To get started, visit the following resources:</p> \n<ul> \n <li><a href=\"https://pypi.org/project/aws-smus-cicd-cli/\">Install from PyPI</a>&nbsp;</li> \n <li><a href=\"https://github.com/aws/CICD-for-SageMakerUnifiedStudio\">GitHub repository</a></li> \n <li><a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/cicd.html\">Amazon SageMaker Unified Studio documentation</a></li> \n</ul>"
  "7540b072fe361f1508088c03917fdcac":
    "id": "7540b072fe361f1508088c03917fdcac"
    "title": "General availability of AWS for SAP MCP Server in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-sap-mcp-amazon-bedrock/"
    "published": "2026-04-24 01:44:00"
    "fetched": "2026-05-02 06:50:31"
    "summary": "<p>Today, we're announcing the General Availability of the <b>AWS for SAP MCP Server on Amazon Bedrock AgentCore, </b>purpose-built to connect AI agents directly to SAP ERP systems, securely and at scale. Built on the Model Context Protocol (MCP) and SAP's Open Data Protocol (OData) standards, this solution addresses the challenge of making SAP business data and processes accessible to AI agents while maintaining enterprise-grade security and comprehensive Observability. Organizations running SAP systems can now empower their AI agents to interact with various SAP processes including finance, procurement, logistics, and supply chain operations.<br /> <br /> By leveraging SAP ERP business data, the AWS for SAP MCP Server enables AI agents to create, read, update, and delete SAP business objects such as sales orders, purchase orders, materials, and finance documents. Deployed on the fully managed Amazon Bedrock AgentCore Runtime, the server handles session isolation, private connectivity, and dual-layer authentication through AgentCore Identity with support for OAuth 2.0. Key capabilities include dynamic service catalog discovery, telemetry through CloudWatch for complete visibility into agent actions, and flexible connectivity options for SAP S/4 HANA and SAP ECC.<br /> <br /> Organizations can deploy the AWS for SAP MCP Server in minutes using CloudFormation templates with no infrastructure management required. The AWS for SAP MCP server works seamlessly with MCP clients like Amazon Quick, Strands SDK based custom agents, and SAP Joule, and ships as a container image at no cost.<br /> <br /> Early adopters including customers like Fortescue, Harman International, and PLDT are already demonstrating the transformative potential of the AWS for SAP MCP Server, by using it to orchestrate enterprise-scale AI integration, modernize test management, automate Procure-to-Pay workflows at scale and more..&nbsp;To learn more, visit the <a href=\"https://docs.aws.amazon.com/mcp-sap/latest/awsforsapmcp/introduction.html\">AWS for SAP MCP Server documentation page</a></p>"
"last_updated": "2026-05-02 06:50:32 JST"
