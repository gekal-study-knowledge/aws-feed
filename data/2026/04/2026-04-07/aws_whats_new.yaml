  "6be6c1b24cd20e05adc62a4589141c6f":
    "id": "6be6c1b24cd20e05adc62a4589141c6f"
    "title": "AWS Cost Explorer launches Natural Language Query capabilities powered by Amazon Q"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/AWS-Cost-Explorer-Natural-Language-Query/"
    "published": "2026-04-07 02:50:00"
    "summary": "<p>AWS Cost Explorer now brings Amazon Q Developer's generative AI capabilities directly into your cost analysis workflows. You can now use natural language queries to ask Amazon Q questions about your AWS cost and usage data. In addition to providing answers to your question, you now also receive automatically updated visualizations in Cost Explorer. This enables faster cost analysis, reduces time to insights, and makes cost visibility accessible to every team member.</p> \n<p>With this launch, you can start your cost analysis with the new suggested prompts in Cost Explorer. These prompts include commonly asked cost questions like \"Show me my top spending services for this month.\" Amazon Q&nbsp;provides&nbsp;detailed insights while Cost Explorer simultaneously updates with the corresponding visualization, filters, and groupings. You can also ask custom questions in your own words using the new 'Ask Question' button, exploring your spending patterns conversationally. Cost Explorer automatically updates charts and tables when analysis is based on your cost and usage data. When Amazon Q compiles insights from&nbsp;additional&nbsp;datasets such as pricing or anomaly detection, visualizations are displayed in Amazon Q's new artifacts panel. You can continue the conversation with follow-up questions while&nbsp;maintaining&nbsp;full context, allowing you to go from a quick cost check to a deep investigation without switching tools or breaking your workflow.</p> \n<p>Natural language cost analysis for AWS Cost Explorer is available today in all commercial AWS Regions at no&nbsp;additional&nbsp;charge.&nbsp;To learn more, visit <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-explorer/\">AWS Cost Explorer</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">user guide</a>.</p>"
  "fcd35557475b58475ec2e61307d48ff3":
    "id": "fcd35557475b58475ec2e61307d48ff3"
    "title": "Amazon Lightsail is now available in the Asia Pacific (Malaysia) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-lightsail-malaysia/"
    "published": "2026-04-07 17:30:00"
    "summary": "<p>Starting today, Amazon Lightsail is available in the Asia Pacific (Malaysia) Region. This expansion brings the power and simplicity of Lightsail to customers in Malaysia and surrounding regions.<br /> <br /> With this launch, customers in Malaysia and nearby countries can now enjoy lower latency and better performance for their applications while meeting local data residency requirements. The new Region provides access to Lightsail's full range of features including instances that meet your compute needs—from general purpose to compute-optimized and memory-optimized bundles—as well as managed databases, containers, load balancers and more, all with the same simple, predictable pricing that Lightsail customers love.<br /> <br /> Lightsail is available in these AWS Regions: US East (Ohio, N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt, Ireland, London, Paris, Stockholm), Asia Pacific (Malaysia, Jakarta, Mumbai, Seoul, Singapore, Sydney, Tokyo). To learn more about Regions and Availability Zones for Lightsail, please refer to the <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html\">documentation.</a><br /> <br /> You can use this Region through the <a href=\"https://lightsail.aws.amazon.com/\">Lightsail Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (CLI)</a> and <a href=\"https://aws.amazon.com/tools/\">AWS SDKs</a>.</p>"
  "4489ab72da7d9c75ec31cba25cc4db25":
    "id": "4489ab72da7d9c75ec31cba25cc4db25"
    "title": "AWS Cost Explorer launches Natural Language Query capabilities powered by Amazon Q"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-cost-explorer-natural-language-query/"
    "published": "2026-04-07 02:50:00"
    "summary": "<p>AWS Cost Explorer now brings Amazon Q Developer's generative AI capabilities directly into your cost analysis workflows. You can now use natural language queries to ask Amazon Q questions about your AWS cost and usage data. In addition to providing answers to your question, you now also receive automatically updated visualizations in Cost Explorer. This enables faster cost analysis, reduces time to insights, and makes cost visibility accessible to every team member.</p> \n<p>With this launch, you can start your cost analysis with the new suggested prompts in Cost Explorer. These prompts include commonly asked cost questions like \"Show me my top spending services for this month.\" Amazon Q&nbsp;provides&nbsp;detailed insights while Cost Explorer simultaneously updates with the corresponding visualization, filters, and groupings. You can also ask custom questions in your own words using the new 'Ask Question' button, exploring your spending patterns conversationally. Cost Explorer automatically updates charts and tables when analysis is based on your cost and usage data. When Amazon Q compiles insights from&nbsp;additional&nbsp;datasets such as pricing or anomaly detection, visualizations are displayed in Amazon Q's new artifacts panel. You can continue the conversation with follow-up questions while&nbsp;maintaining&nbsp;full context, allowing you to go from a quick cost check to a deep investigation without switching tools or breaking your workflow.</p> \n<p>Natural language cost analysis for AWS Cost Explorer is available today in all commercial AWS Regions at no&nbsp;additional&nbsp;charge.&nbsp;To learn more, visit <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-explorer/\">AWS Cost Explorer</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">user guide</a>.</p>"
  "999007464233fe271968568e7f756446":
    "id": "999007464233fe271968568e7f756446"
    "title": "Announcing Amazon S3 Files, making S3 buckets accessible as file systems"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-s3-files/"
    "published": "2026-04-07 14:15:00"
    "summary": "<p>S3 Files delivers a shared file system that connects any AWS&nbsp;compute&nbsp;resource directly with your data in Amazon S3. With S3 Files, Amazon S3 is the first and only cloud object store that provides fully-featured, high-performance file system access to your data. It provides full file system semantics and low-latency performance, without your data ever leaving S3.&nbsp;That means file-based applications, agents,&nbsp;and teams&nbsp;can now access and work with your S3 data as a file system using the tools they already depend on. Built using Amazon EFS, S3 Files gives you the performance and simplicity of a file system with the scalability, durability, and cost-effectiveness of S3. You no longer need to duplicate your data or cycle it between object storage and file system storage. S3 Files maintains a view of the objects in your bucket and intelligently translates your file system operations into efficient S3 requests on your behalf. Your file-based applications run on your S3 data with no code changes, AI agents&nbsp;persist&nbsp;memory and share state across pipelines, and ML teams run data preparation workloads without duplicating or staging files first.&nbsp;Now, file-based&nbsp;tools&nbsp;and&nbsp;applications&nbsp;across your organization can&nbsp;work with your S3 data directly from any compute instance, container, and function using the tools your teams and agents already depend on.&nbsp;<br /> &nbsp;<br /> Organizations store their analytics data and data lakes in S3, but file-based tools, agents, and applications have never been able to directly work with that data. Bridging that gap meant managing a separate file system, duplicating data, and building complex pipelines to keep object and file storage&nbsp;in sync. S3 Files&nbsp;eliminates&nbsp;that friction&nbsp;and overhead. Using S3 Files, your data is accessible through the file system and directly through S3 APIs at the same time. Thousands of&nbsp;compute&nbsp;resources can connect to the same S3 file system simultaneously, enabling shared access across clusters without duplicating data. S3 Files works with&nbsp;all of&nbsp;your new and existing data in S3 buckets, with no migration required.&nbsp;<br /> &nbsp;<br /> S3 Files caches actively used data for low-latency access and provides up to multiple terabytes per second of aggregate read throughput, so storage never limits performance.&nbsp;There are no data silos, no synchronization&nbsp;complexities, and no tradeoffs. File and object storage, together in one place without compromise.<br /> </p> \n<p>S3 Files&nbsp;is now generally available in 34 AWS Regions. For the full list of supported Regions, visit the <a href=\"https://builder.aws.com/build/capabilities\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Capabilities tool</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/files/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>, <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 pricing page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/aws/launching-s3-files-making-s3-buckets-accessible-as-file-systems\">AWS News Blog</a>.</p>"
  "b75fda8094039b274d1290c58fab97d4":
    "id": "b75fda8094039b274d1290c58fab97d4"
    "title": "AWS Certificate Manager now supports native certificate search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-certificate-manager-search/"
    "published": "2026-04-07 04:01:00"
    "summary": "<p>AWS Certificate Manager (ACM) now provides a search bar in the console that customers can use to find certificates using one or more certificate parameters such as domain name, certificate ARN, and/or certificate validity. For example, ACM users who manages multiple certificates can search for certificates with specific domains that are due to expire soon.<br /> <br /> To get started, use the new <a href=\"https://docs.aws.amazon.com/acm/latest/APIReference/API_SearchCertificates.html\"><i>SearchCertificates</i> API</a>, or navigate to the ACM console and use the search bar to search by one or more certificate parameters.<br /> <br /> This feature is available in all Public AWS, AWS China, and AWS GovCloud regions.&nbsp;To learn more about this feature, please refer to&nbsp;<a href=\"https://docs.aws.amazon.com/acm/latest/userguide/gs-acm-list.html\">Search Certificates</a>. You can learn more about ACM and get started <a href=\"https://docs.aws.amazon.com/acm/latest/userguide/gs.html\">here</a>.</p>"
  "8e08722e36e332eb4293fbe40c7795bc":
    "id": "8e08722e36e332eb4293fbe40c7795bc"
    "title": "AWS Lambda expands response streaming support to all commercial AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-lambda-response-streaming/"
    "published": "2026-04-07 21:00:00"
    "summary": "<p>AWS Lambda response streaming is now available in all commercial AWS Regions, bringing full regional parity for this capability. Customers in newly supported Regions can use the InvokeWithResponseStream API to progressively stream response payloads back to clients as data becomes available.</p> \n<p>Response streaming enables functions to send partial responses to clients incrementally rather than buffering the entire response before transmission. This reduces time-to-first-byte (TTFB) latency and is well suited for latency-sensitive workloads such as LLM-based applications as well as web and mobile applications where users benefit from seeing responses appear incrementally. Response streaming supports payloads up to a default maximum of 200 MB.</p> \n<p>With this expansion, customers in all commercial Regions can stream responses using the InvokeWithResponseStream API through a supported AWS SDK, or through Amazon API Gateway REST APIs with response streaming enabled. Response streaming supports Node.js managed runtimes as well as custom runtimes.</p> \n<p>Streaming responses incur an additional cost for network transfer of the response payload. You are billed based on the number of bytes generated and streamed out of your Lambda function over the first 6 MB.&nbsp;To get started with Lambda response streaming, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/configuration-response-streaming.html\">AWS Lambda documentation</a>.&nbsp;</p>"
  "eb30149de37f32fcd824197394a2f056":
    "id": "eb30149de37f32fcd824197394a2f056"
    "title": "Amazon SageMaker adds serverless workflows to Identity Center domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-sagemaker-serverless-workflows/"
    "published": "2026-04-07 17:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">Amazon SageMaker Unified Studio</a> now supports Serverless Workflows in Identity Center domains. &nbsp;With this launch, customers using Identity Center domains can orchestrate data processing tasks with Apache Airflow (powered by&nbsp;<a href=\"https://aws.amazon.com/managed-workflows-for-apache-airflow/\">Managed Workflows for Apache Airflow</a>)&nbsp;without provisioning or managing Airflow infrastructure. Serverless Workflows were previously available only in IAM-based domains.&nbsp;</p> \n<p>Serverless Workflows automatically provision compute resources when a workflow runs and release them when it completes, so you only pay for actual workflow run time. Each workflow runs with its own execution role and isolated worker, providing workflow-level security and preventing cross-workflow interference. With Serverless Workflows, Identity Center domain customers also get access to the Visual Workflow experience with support for around 200 operators, including built-in integration with AWS services such as Amazon S3, Amazon Redshift, Amazon EMR, AWS Glue, and Amazon SageMaker AI.</p> \n<p>Serverless Workflows in Identity Center domains are available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">AWS Regions where SageMaker Unified Studio is supported</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/serverless-workflows.html\">Serverless Workflows documentation</a>.</p>"
  "0314813cec665e1bc7ecbf33d62c2e6c":
    "id": "0314813cec665e1bc7ecbf33d62c2e6c"
    "title": "Amazon Bedrock now offers Claude Mythos Preview (Gated Research Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-bedrock-claude-mythos/"
    "published": "2026-04-07 17:00:00"
    "summary": "<p>Amazon Bedrock, the platform for building generative AI applications and agents at production scale, now offers Claude Mythos Preview in gated research preview as part of Project Glasswing. Claude Mythos Preview is Anthropic's most advanced AI model to date, representing a fundamentally new model class with state-of-the-art capabilities across cybersecurity, software coding, and complex reasoning tasks. The model can identify sophisticated security vulnerabilities in software and demonstrate exploitability, comprehending large codebases and delivering actionable findings with less manual guidance than previous AI models. This enables security teams to accelerate defensive cybersecurity work, find and fix security vulnerabilities in the world's most critical software, and address these issues before threats emerge.<br /> <br /> Claude Mythos Preview signals an upcoming wave of AI models with powerful cybersecurity capabilities. Anthropic and AWS are taking a deliberately cautious approach to release, prioritizing internet-critical companies and open-source maintainers whose software and digital services impact hundreds of millions of users. This approach gives defenders the opportunity to strengthen their codebases and share what they learn so the whole industry can benefit.<br /> <br /> Claude Mythos Preview is available in gated preview in the US East (N. Virginia) Region through <a href=\"https://aws.amazon.com/bedrock/anthropic/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock</a>. Access is limited to an initial allow-list of organizations. If your organization has been allow-listed, your AWS account team will reach out directly. For AWS CISO Amy Herzog's perspective on this launch and what it means for the future of cybersecurity, read <u><i><a href=\"https://aws.amazon.com/blogs/security/building-ai-defenses-at-scale-before-the-threats-emerge\" rel=\"noopener noreferrer\" target=\"_blank\">Building AI Defenses at Scale: Before the Threats Emerge</a></i></u>.</p>"
  "1dc2e75bcb7002c2194bb6cf83aa6496":
    "id": "1dc2e75bcb7002c2194bb6cf83aa6496"
    "title": "Amazon RDS for Oracle now supports M8i and R8i instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-rds-oracle-8th-gen-instances/"
    "published": "2026-04-07 14:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon RDS for Oracle </a>now supports M8i and R8i instances. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The M8i and R8i instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances.<br /> <br /> M8i and R8i instances are available for Amazon RDS for Oracle in Bring Your Own License model for Oracle Database Enterprise Edition (EE) and Oracle Database Standard Edition 2 (SE2) . To use the new M8i and R8i instances, you can modify your existing RDS database instance or create a new RDS database instance from the RDS Management Console, or using the AWS SDK or CLI.<br /> <br /> See <a href=\"https://aws.amazon.com/rds/oracle/pricing/\">Amazon RDS for Oracle Pricing</a> for up-to-date pricing and regional availability.</p>"
  "fa58fcefd5c1f19400d299df760ebfd4":
    "id": "fa58fcefd5c1f19400d299df760ebfd4"
    "title": "AWS Transfer Family now supports IPv6 for connectors and web apps"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-transfer-family-ipv6-connectors-web-apps/"
    "published": "2026-04-07 07:00:00"
    "summary": "<p>AWS Transfer Family announces Internet Protocol version 6 (IPv6) support for SFTP connectors, AS2 connectors, and Transfer Family web apps. This enhancement enables your connectors to reach remote servers and trading partners over&nbsp;IPv6 and&nbsp;allows end users to access Transfer Family web apps using IPv6.</p> \n<p>AWS Transfer Family offers fully managed support for file transfers over SFTP, AS2, FTPS, FTP, and web browser-based transfers. With IPv6 support for connectors, you can now reach trading partners and remote servers that have adopted IPv6,&nbsp;eliminating&nbsp;connectivity barriers as partners transition away from IPv4. For Transfer Family web apps, IPv6 support enables end users to upload and download files from IPv6-native networks and devices. With dual-stack support across both connectors and web apps, you can communicate with both IPv4 and IPv6 systems and transition at your own pace.</p> \n<p>AWS Transfer Family IPv6 support for SFTP connectors, AS2 connectors, and web&nbsp;apps&nbsp;is&nbsp;available in&nbsp;the majority of&nbsp;AWS regions where AWS Transfer Family is offered. For the full list of supported regions, visit the&nbsp;<a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities tool</a>&nbsp;in Builder&nbsp;Center.&nbsp;To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html\">Transfer Family User Guide</a>.</p>"
  "28d226d43fa42b29330d88afc0151d48":
    "id": "28d226d43fa42b29330d88afc0151d48"
    "title": "Amazon Braket adds support for Rigetti's 108-qubit Cepheus QPU"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-braket-rigetti-cepheus/"
    "published": "2026-04-07 09:00:00"
    "summary": "<p>Amazon Braket, the quantum computing service from AWS, now offers access to Rigetti's Cepheus-1-108Q device, the first 100+ qubit superconducting quantum processing unit (QPU) available on Amazon Braket. Cepheus-1-108Q uses Rigetti's modular multi-chip architecture, consisting of a 3x4 array of twelve 9-qubit chiplets with tunable couplers and intermodule couplers between chiplets.</p> \n<p>Cepheus-1-108Q introduces CZ (controlled phase) gates, replacing the iSWAP gates used on previous Rigetti QPUs. CZ gates provide higher resilience to phase errors common in superconducting systems, and Rigetti's adiabatic CZ implementation further reduces leakage errors. These improvements enable customers to run deeper circuits for use cases such as chemical simulation, combinatorial optimization, and machine learning. Customers can build and run quantum programs using the Braket SDK or other frameworks such as Qiskit, CUDA-Q, and Pennylane. Pulse-level control is also available for researchers who need low-level hardware access to study noise, develop gates, or devise error mitigation schemes.</p> \n<p>Cepheus-1-108Q is available in the US West (N. California) Region. Get started by viewing the device on the <a href=\"https://us-east-1.console.aws.amazon.com/braket/home?region=us-east-1#/dashboard\">Amazon Braket Management Console,</a>&nbsp;reading our&nbsp;<a href=\"https://docs.aws.amazon.com/braket/\">Amazon Braket documentation</a>, or&nbsp;applying for AWS credits to support experiments on Amazon Braket through the <a href=\"https://aws.amazon.com/government-education/research-and-technical-computing/cloud-credit-for-research/\">AWS Cloud Credits for Research</a> program.</p>"
  "8f812b21b708447d7263ecdea3a097b6":
    "id": "8f812b21b708447d7263ecdea3a097b6"
    "title": "Amazon Aurora now supports PostgreSQL 17.9, 16.13, 15.17, and 14.22"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-aurora-postgresql-17-9-16-13-15-17-14-22/"
    "published": "2026-04-07 07:00:00"
    "summary": "<p>Amazon Aurora PostgreSQL-Compatible Edition now supports PostgreSQL versions 17.9, 16.13, 15.17, and 14.22 that includes bug fixes from the PostgreSQL community and Aurora-specific enhancements. We recommend upgrading to the latest minor versions to address known security vulnerabilities and benefit from these improvements, as detailed in these&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/AuroraPostgreSQL.Updates.html\" target=\"_blank\">release notes</a>.<br /> <br /> You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Maintenance.AMVU.UpgradeRollout.html\" target=\"_blank\">Upgrade Rollout Policy</a>&nbsp;to orchestrate thousands of upgrades in phases, first to development environments before upgrading production systems. You can also use Aurora's&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.PostgreSQL.html\" target=\"_blank\">zero-downtime patching</a>&nbsp;to minimize downtime for minor version upgrades.<br /> <br /> Amazon Aurora is designed for unparalleled high performance and availability at global scale with full PostgreSQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at our&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\" target=\"_blank\">getting started page</a>.<br /> <br /> </p>"
"last_updated": "2026-04-08 08:34:06 JST"
