    "summary": "<p>AWS Cost Explorer now brings Amazon Q Developer's generative AI capabilities directly into your cost analysis workflows. You can now use natural language queries to ask Amazon Q questions about your AWS cost and usage data. In addition to providing answers to your question, you now also receive automatically updated visualizations in Cost Explorer. This enables faster cost analysis, reduces time to insights, and makes cost visibility accessible to every team member.</p> \n<p>With this launch, you can start your cost analysis with the new suggested prompts in Cost Explorer. These prompts include commonly asked cost questions like \"Show me my top spending services for this month.\" Amazon Q&nbsp;provides&nbsp;detailed insights while Cost Explorer simultaneously updates with the corresponding visualization, filters, and groupings. You can also ask custom questions in your own words using the new 'Ask Question' button, exploring your spending patterns conversationally. Cost Explorer automatically updates charts and tables when analysis is based on your cost and usage data. When Amazon Q compiles insights from&nbsp;additional&nbsp;datasets such as pricing or anomaly detection, visualizations are displayed in Amazon Q's new artifacts panel. You can continue the conversation with follow-up questions while&nbsp;maintaining&nbsp;full context, allowing you to go from a quick cost check to a deep investigation without switching tools or breaking your workflow.</p> \n<p>Natural language cost analysis for AWS Cost Explorer is available today in all commercial AWS Regions at no&nbsp;additional&nbsp;charge.&nbsp;To learn more, visit <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-explorer/\">AWS Cost Explorer</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">user guide</a>.</p>"
  "999007464233fe271968568e7f756446":
    "id": "999007464233fe271968568e7f756446"
    "title": "Announcing Amazon S3 Files, making S3 buckets accessible as file systems"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-s3-files/"
    "published": "2026-04-07 14:15:00"
    "summary": "<p>S3 Files delivers a shared file system that connects any AWS&nbsp;compute&nbsp;resource directly with your data in Amazon S3. With S3 Files, Amazon S3 is the first and only cloud object store that provides fully-featured, high-performance file system access to your data. It provides full file system semantics and low-latency performance, without your data ever leaving S3.&nbsp;That means file-based applications, agents,&nbsp;and teams&nbsp;can now access and work with your S3 data as a file system using the tools they already depend on. Built using Amazon EFS, S3 Files gives you the performance and simplicity of a file system with the scalability, durability, and cost-effectiveness of S3. You no longer need to duplicate your data or cycle it between object storage and file system storage. S3 Files maintains a view of the objects in your bucket and intelligently translates your file system operations into efficient S3 requests on your behalf. Your file-based applications run on your S3 data with no code changes, AI agents&nbsp;persist&nbsp;memory and share state across pipelines, and ML teams run data preparation workloads without duplicating or staging files first.&nbsp;Now, file-based&nbsp;tools&nbsp;and&nbsp;applications&nbsp;across your organization can&nbsp;work with your S3 data directly from any compute instance, container, and function using the tools your teams and agents already depend on.&nbsp;<br /> &nbsp;<br /> Organizations store their analytics data and data lakes in S3, but file-based tools, agents, and applications have never been able to directly work with that data. Bridging that gap meant managing a separate file system, duplicating data, and building complex pipelines to keep object and file storage&nbsp;in sync. S3 Files&nbsp;eliminates&nbsp;that friction&nbsp;and overhead. Using S3 Files, your data is accessible through the file system and directly through S3 APIs at the same time. Thousands of&nbsp;compute&nbsp;resources can connect to the same S3 file system simultaneously, enabling shared access across clusters without duplicating data. S3 Files works with&nbsp;all of&nbsp;your new and existing data in S3 buckets, with no migration required.&nbsp;<br /> &nbsp;<br /> S3 Files caches actively used data for low-latency access and provides up to multiple terabytes per second of aggregate read throughput, so storage never limits performance.&nbsp;There are no data silos, no synchronization&nbsp;complexities, and no tradeoffs. File and object storage, together in one place without compromise.<br /> </p> \n<p>S3 Files&nbsp;is now generally available in 34 AWS Regions. For the full list of supported Regions, visit the <a href=\"https://builder.aws.com/build/capabilities\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Capabilities tool</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/files/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>, <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 pricing page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/aws/launching-s3-files-making-s3-buckets-accessible-as-file-systems\">AWS News Blog</a>.</p>"
  "b75fda8094039b274d1290c58fab97d4":
    "id": "b75fda8094039b274d1290c58fab97d4"
    "title": "AWS Certificate Manager now supports native certificate search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-certificate-manager-search/"
    "published": "2026-04-07 04:01:00"
    "summary": "<p>AWS Certificate Manager (ACM) now provides a search bar in the console that customers can use to find certificates using one or more certificate parameters such as domain name, certificate ARN, and/or certificate validity. For example, ACM users who manages multiple certificates can search for certificates with specific domains that are due to expire soon.<br /> <br /> To get started, use the new <a href=\"https://docs.aws.amazon.com/acm/latest/APIReference/API_SearchCertificates.html\"><i>SearchCertificates</i> API</a>, or navigate to the ACM console and use the search bar to search by one or more certificate parameters.<br /> <br /> This feature is available in all Public AWS, AWS China, and AWS GovCloud regions.&nbsp;To learn more about this feature, please refer to&nbsp;<a href=\"https://docs.aws.amazon.com/acm/latest/userguide/gs-acm-list.html\">Search Certificates</a>. You can learn more about ACM and get started <a href=\"https://docs.aws.amazon.com/acm/latest/userguide/gs.html\">here</a>.</p>"
"last_updated": "2026-04-08 05:42:10 JST"
