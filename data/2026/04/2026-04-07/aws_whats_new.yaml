    "title": "AWS Cost Explorer launches Natural Language Query capabilities powered by Amazon Q"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/AWS-Cost-Explorer-Natural-Language-Query/"
    "published": "2026-04-07 02:50:00"
    "summary": "<p>AWS Cost Explorer now brings Amazon Q Developer's generative AI capabilities directly into your cost analysis workflows. You can now use natural language queries to ask Amazon Q questions about your AWS cost and usage data. In addition to providing answers to your question, you now also receive automatically updated visualizations in Cost Explorer. This enables faster cost analysis, reduces time to insights, and makes cost visibility accessible to every team member.</p> \n<p>With this launch, you can start your cost analysis with the new suggested prompts in Cost Explorer. These prompts include commonly asked cost questions like \"Show me my top spending services for this month.\" Amazon Q&nbsp;provides&nbsp;detailed insights while Cost Explorer simultaneously updates with the corresponding visualization, filters, and groupings. You can also ask custom questions in your own words using the new 'Ask Question' button, exploring your spending patterns conversationally. Cost Explorer automatically updates charts and tables when analysis is based on your cost and usage data. When Amazon Q compiles insights from&nbsp;additional&nbsp;datasets such as pricing or anomaly detection, visualizations are displayed in Amazon Q's new artifacts panel. You can continue the conversation with follow-up questions while&nbsp;maintaining&nbsp;full context, allowing you to go from a quick cost check to a deep investigation without switching tools or breaking your workflow.</p> \n<p>Natural language cost analysis for AWS Cost Explorer is available today in all commercial AWS Regions at no&nbsp;additional&nbsp;charge.&nbsp;To learn more, visit <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-explorer/\">AWS Cost Explorer</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">user guide</a>.</p>"
"last_updated": "2026-04-07 14:06:23 JST"
