"overview": |
  この日は生成 AI と開発者向けツール、そしてインフラ拡充が中心でした。開発者支援では Kiro スタートアップクレジットプログラムの復活と、月 1,000 クレジットを無償提供する Kiro Students プランが発表されました。機械学習分野では Amazon Bedrock を用いた Amazon Nova モデルのファインチューニングと強化学習ファインチューニング (RFT) のベストプラクティス、Nova Multimodal Embeddings による音声セマンティック検索、医療・ライフサイエンス向けエージェントワークフローの Human-in-the-loop 実装が解説されました。基盤面では Oracle Database@AWS が計 12 リージョンに拡大 (ダブリン、ロンドン、ムンバイ、ハイデラバード、ソウル追加)、OpenSearch Service が Graviton4 ベース i8ge インスタンスに対応、SageMaker HyperPod のギャングスケジューリング、EKS マネージドノードグループの EC2 ウォームプール対応が加わりました。AgentCore Browser の OS レベル操作、WorkSpaces Advisor による AI トラブルシューティング、国内では大豊建設の生成 AI 活用事例も紹介されました。
