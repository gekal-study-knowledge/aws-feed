  "b005dd776bff9fe3f6702a8f68b78fb8":
    "id": "b005dd776bff9fe3f6702a8f68b78fb8"
    "title": "Oracle Database@AWS is now available in twelve AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/oracle-database-aws-available-twelve-regions/"
    "published": "2026-04-08 07:00:00"
    "summary": "<p>Oracle Database@AWS is now generally available in five additional AWS Regions: EU-West-1 (Dublin), EU-West-2 (London), AP-South-1 (Mumbai), AP-South-2 (Hyderabad), and AP-Northeast-2 (Seoul). Oracle Database@AWS enables customers to access Oracle Cloud Infrastructure (OCI) managed Oracle Exadata systems within AWS data centers. With this launch, customers in Europe and Asia Pacific with in-region data residency requirements can migrate on-premises Oracle Exadata and Oracle Real Application Clusters (RAC) applications to AWS. Dublin, Mumbai, and Hyderabad are available with two Availability Zones (AZs), while London and Seoul are available with one Availability Zone. Additionally, CA-Central-1 (Canada Central) and AP-Southeast-2 (Sydney) now support two Availability Zones, providing enhanced high availability for production workloads.<br /> <br /> With this expansion, Oracle Database@AWS services are now available in twelve Regions: US-East-1 (N. Virginia), US-West-2 (Oregon), US-East-2 (Ohio), CA-Central-1 (Canada Central), EU-Central-1 (Frankfurt), EU-West-1 (Dublin), EU-West-2 (London), AP-Northeast-1 (Tokyo), AP-Southeast-2 (Sydney), AP-South-1 (Mumbai), AP-South-2 (Hyderabad), and AP-Northeast-2 (Seoul). To use Oracle Database@AWS services, request a <a href=\"https://aws.amazon.com/marketplace/pp/prodview-qks5dl3hr7nfw?sr=0-1&amp;ref_=beagle&amp;applicationId=AWSMPContessa\" rel=\"noopener noreferrer\" target=\"_blank\"><u>private offer from Oracle through the AWS Marketplace</u></a>, and use AWS Management Console to setup and use your databases.<br /> <br /> To learn more, visit Oracle Database@AWS <a href=\"https://aws.amazon.com/marketplace/featured-seller/oracle\" rel=\"noopener noreferrer\" target=\"_blank\">overview </a>and <a href=\"https://docs.aws.amazon.com/odb/latest/UserGuide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>documentation</u></a>.</p>"
  "7371270de2316afe663b732d6c631224":
    "id": "7371270de2316afe663b732d6c631224"
    "title": "Amazon OpenSearch Service now supports Graviton4 based i8ge instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/4/amazon-opensearch-service-supports-i8ge/"
    "published": "2026-04-08 16:30:24"
    "summary": "<p>Amazon OpenSearch Service now supports i8ge instances, which is the latest generation of storage optimized instances offering the best performance for storage-intensive workloads.<br /> <br /> Powered by AWS Graviton4 processors, I8ge instances deliver up to 60% better compute performance compared to previous generation Graviton2-based storage optimized Im4gn instances. I8ge instances use the latest third generation AWS Nitro SSDs, local NVMe storage that deliver up to 55% better real-time storage performance per TB while offering up to 60% lower storage I/O latency and up to 75% lower storage I/O latency variability compared to previous generation Im4gn instances. Built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, these instances oﬄoad CPU virtualization, storage, and networking functions to dedicated hardware and software enhancing the performance and security for your workloads.<br /> <br /> I8ge instances are available of sizes up to 18xlarge and 45 TB instance storage. At 112.5 Gbps, these instances have the highest networking bandwidth among storage optimized instances available in Amazon OpenSearch Service.<br /> <br /> I8ge instances support all OpenSearch versions &amp; Elasticsearch (open source) versions 7.9 and 7.10.<br /> <br /> Amazon OpenSearch Service supports i8ge instances in following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> : US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Europe (Stockholm), Asia Pacific (Malaysia), Asia Pacific (Mumbai), Asia Pacific (Singapore) and Asia Pacific (Sydney).<br /> <br /> For region specific availability &amp; pricing, visit our <a href=\"https://aws.amazon.com/opensearch-service/pricing/\">pricing page</a>. To learn more about Amazon OpenSearch Service and its capabilities, visit our <a href=\"https://aws.amazon.com/opensearch-service/\">product page</a>.</p>"
  "8b4e25f4543209d018c2ecebfb4358db":
    "id": "8b4e25f4543209d018c2ecebfb4358db"
    "title": "Amazon Bedrock AgentCore Browser adds OS-level interaction capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/agentcore-browser-os-actions/"
    "published": "2026-04-08 17:03:00"
    "summary": "<p>Amazon Bedrock AgentCore Browser now supports OS-level interaction capabilities, enabling automation of browser workflows that require direct operating system control beyond Chrome DevTools Protocol (CDP) capabilities. This enhancement addresses automation scenarios where CDP alone is insufficient, such as mouse operations, print dialogs, native system alerts, and keyboard shortcuts. The feature serves AI agent developers, test automation engineers, and organizations building LLM-powered web interaction tools.<br /> <br /> The new capabilities provide automation through mouse operations (click, move, drag, scroll), keyboard operations (type, press, shortcuts like ctrl+a and ctrl+p), and full desktop screenshots, all at OS-level coordinates extending beyond the browser viewport. Key use cases include automated testing with system dialog handling, document management workflows, complex UI interactions with right-click menus, and vision-based AI agents that require complete browser environment visibility.<br /> <br /> This feature is available by default on all browser instances in all 14 <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Regions</a> where Amazon Bedrock AgentCore Browser is available: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Asia Pacific (Seoul), and Canada (Central).<br /> <br /> To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html\">AgentCore Browser documentation</a>.&nbsp;</p>"
  "48e5c726b060429405504a3859069949":
    "id": "48e5c726b060429405504a3859069949"
    "title": "SageMaker HyperPod now supports gang scheduling for distributed training workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-hyperpod-gang-scheduling/"
    "published": "2026-04-08 19:26:00"
    "summary": "<p>Amazon SageMaker HyperPod task governance now supports gang scheduling, which ensures all pods required for a distributed training job are ready before training begins. Administrators can configure gang scheduling to prevent wasted compute from partial job runs and avoid deadlocks from jobs waiting for resources.<br /> <br /> Data scientists running distributed AI/ML training jobs on Amazon SageMaker HyperPod clusters using the EKS orchestrator require multiple pods to work together across nodes with pod-to-pod communication. When some pods start but others do not, jobs can hold onto resources without making progress, block other workloads, and increase costs. Gang scheduling resolves this by monitoring all pods in a workload and pulling the workload back if not all pods are ready within a set time. Pulled-back workloads are automatically requeued to prevent stalling. Administrators can adjust settings on the HyperPod Console, such as how long to wait for pods to be ready, how to handle node failures, whether to admit workloads one at a time to avoid deadlocks on busy clusters, and how retries are scheduled.<br /> <br /> This capability is currently available for Amazon SageMaker HyperPod clusters using the EKS orchestrator across the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), and Asia Pacific (Tokyo), Asia Pacific (Jakarta), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Stockholm), Europe (Spain), and South America (São Paulo).<br /> <br /> To learn more, visit <a href=\"https://aws.amazon.com/sagemaker-ai/hyperpod/\">SageMaker HyperPod webpage</a>, and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-operate-console-ui-governance-tasks-gang-scheduling.html\">HyperPod task governance documentation</a>.</p>"
  "8bfe7e70caa83417d184e1e4b6ecd842":
    "id": "8bfe7e70caa83417d184e1e4b6ecd842"
    "title": "Amazon EKS managed node groups now support EC2 Auto Scaling warm pools"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-eks-managed-node-groups-ec2-warm-pools/"
    "published": "2026-04-08 19:00:00"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html\">managed node groups</a> now support <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html\">Auto Scaling warm pools</a>, enabling you to maintain pre-initialized EC2 instances ready for rapid scale-out. This reduces node provisioning latency for applications with burst traffic patterns, time-sensitive workloads, or long instance boot times due to complex initialization scripts and software dependencies.<br /> <br /> With warm pools enabled, your EKS managed node group maintains a pool of instances that have already completed OS initialization, user data execution, and software configuration. When demand increases and the Auto Scaling group scales out, instances transition from the warm pool to active service without repeating the full cold-start sequence. You can configure instances in the warm pool as Stopped (lower cost, longer transition) or Running (higher cost, faster transition). You can also enable reuse on scale-in, which returns instances to the warm pool during scale-down instead of terminating them. Warm pools work with Cluster Autoscaler without requiring any additional configuration.<br /> <br /> You can enable warm pools through the EKS API, AWS CLI, AWS Management Console, or AWS CloudFormation by adding a warmPoolConfig to your CreateNodegroup or UpdateNodegroupConfig requests. Existing managed node groups that do not enable warm pools are unaffected.<br /> <br /> This feature is available in all AWS Regions where Amazon EKS is available, except for the China (Beijing) Region, operated by Sinnet and the China (Ningxia) Region, operated by NWCD. To get started, see the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html\">Amazon EKS managed node groups documentation</a>.</p>"
  "5258c171ab14fa94d49ab818991bfbf0":
    "id": "5258c171ab14fa94d49ab818991bfbf0"
    "title": "Amazon IVS Real-Time Streaming now supports redundant ingest"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ivs-real-time-streaming-redundant-ingest/"
    "published": "2026-04-08 19:25:00"
    "summary": "<p>Amazon Interactive Video Service (Amazon IVS) Real-Time Streaming now supports redundant ingest, helping protect your live streams against source encoder failures and first-mile network issues. With redundant ingest, you can stream from two encoders simultaneously to a single stage with automated failover, ensuring uninterrupted delivery to your viewers.</p> \n<p>Redundant ingest is ideal for live events, 24/7 live streams, or any scenario where uninterrupted delivery is essential. This capability helps you maintain viewer engagement during unexpected disruptions and enables continuous 24/7 streaming.&nbsp;</p> \n<p><a href=\"https://aws.amazon.com/ivs/\">Amazon IVS</a> is a managed live streaming solution designed to make low-latency or real-time video available to viewers around the world. Visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS region table</a> for a full list of AWS Regions where the Amazon IVS console and APIs for control and creation of video streams are available.</p> \n<p>To learn more, please visit the <a href=\"https://docs.aws.amazon.com/ivs/latest/RealTimeUserGuide/rt-rtmp-publishing.html\">Amazon IVS Real-Time Streaming RTMP ingest documentation</a> page.</p>"
  "cf9b53b2865fe9a36e1b21c6a50bf392":
    "id": "cf9b53b2865fe9a36e1b21c6a50bf392"
    "title": "Amazon WorkSpaces Advisor now available for AI-powered troubleshooting"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/workspaces-advisor-ai-troubleshooting/"
    "published": "2026-04-08 17:00:00"
    "summary": "<p>Amazon WorkSpaces Advisor is a new AI-powered tool that helps administrators quickly troubleshoot and resolve issues with Amazon WorkSpaces Personal. Using generative AI capabilities, it analyzes WorkSpace configurations, identifies problems, and provides actionable recommendations to restore service and optimize performance.<br /> </p> \n<p>WorkSpaces Advisor streamlines administrative workflows by reducing the time needed to investigate and fix common issues. Administrators can leverage AI-driven insights to proactively maintain their virtual desktop infrastructure, improve end-user experience, and minimize downtime across their WorkSpaces.</p> \n<p>Amazon WorkSpaces Advisor is now available in all AWS commercial regions where Amazon WorkSpaces is offered. Visit the Amazon WorkSpaces console to access WorkSpaces Advisor and begin troubleshooting your environment. Learn more in the <a href=\"https://aws.amazon.com/blogs/desktop-and-application-streaming/troubleshoot-amazon-workspaces-personal-issues-faster-with-workspaces-advisor/\">feature blog</a> and <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/workspaces-advisor.html\">user guide</a>.</p>"
