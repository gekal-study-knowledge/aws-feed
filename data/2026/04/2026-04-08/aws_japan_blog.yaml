    "title": "Kiro Students プランのご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-kiro-students-tier/"
    "published": "2026-04-09 08:33:35"
    "fetched": "2026-04-09 08:33:35"
    "summary": "学生は、私たちが暮らす世界を形作る未来の意思決定者です。この信念が、本日発表するすべての根幹にあります。まだ学び、実験し、何を作りたいかを模索している段階のみなさんに、本格的なツールを届けたいと考えています。本日より、Kiro Students プランを開始します。対象の大学生は、月 1,000 クレジット付きの Kiro を 1 年間無料でご利用いただけます。クレジットカード不要。トライアル期間の制限もありません。"
