    "title": "Kiro スタートアップクレジットプログラムが復活します"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-bringing-back-startup-credits/"
    "published": "2026-04-08 16:09:39"
    "fetched": "2026-04-08 16:09:39"
    "summary": "起業家の皆さん、12 月のスタートアップクレジットにたくさんのご応募をいただきありがとうございました。昨年 Kiro スタートアップクレジットプログラムを開始した際、その反応は予想を大きく上回るものでした。数千もの応募が寄せられ、ニーズは明確でした。アーリーステージのチームには、成長に合わせてスケールする開発者ツールが必要だということです。 そこで、このプログラムを復活させます。本日より、対象となるスタートアップは最大 1 年分の Kiro Pro+ を無料で申請できます。仕様駆動開発と高度な AI エージェントを活用して、コストを気にせず開発を加速できます。"
