  "b669658f1b3aa52548f526080e8c9603":
    "id": "b669658f1b3aa52548f526080e8c9603"
    "title": "Amazon DocumentDB (with MongoDB compatibility) is Now Available in the Canada West (Calgary) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-documentdb-available-in-canada-west-region/"
    "published": "2026-04-30 03:00:00"
    "fetched": "2026-04-30 04:19:30"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) is now available in the Canada West (Calgary) region adding to the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">list of available regions where you can use Amazon DocumentDB</a>.</p> \n<p>Amazon DocumentDB is a fully managed, native JSON database that makes it simple and cost-effective to operate critical document workloads at virtually any scale without managing infrastructure. Amazon DocumentDB is designed to give you the scalability and durability you need when operating mission-critical MongoDB workloads. Storage scales automatically up to 128TiB without any impact to your application. In addition, Amazon DocumentDB natively integrates with AWS Database Migration Service (DMS), Amazon CloudWatch, AWS CloudTrail, AWS Lambda, AWS Backup and more. Amazon DocumentDB supports millions of requests per second and can be scaled out to 15 low latency read replicas in minutes with no application downtime.</p> \n<p>To learn more about Amazon DocumentDB, please visit the Amazon DocumentDB <a href=\"https://aws.amazon.com/documentdb/\">product page</a> and <a href=\"https://aws.amazon.com/documentdb/pricing/\">pricing page</a>. You can create a Amazon DocumentDB cluster from the <a href=\"https://console.aws.amazon.com/docdb\">AWS Management console</a>, <a href=\"https://awscli.amazonaws.com/v2/documentation/api/latest/reference/docdb/index.html\">AWS Command Line Interface (CLI)</a>, or SDK.</p>"
  "d2632853a6bf61b841b3bfb328a3932c":
    "id": "d2632853a6bf61b841b3bfb328a3932c"
    "title": "Amazon CloudFront now supports invalidation by cache tag"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/cloudfront-invalidation-cache-tag/"
    "published": "2026-04-30 02:06:00"
    "fetched": "2026-04-30 04:19:30"
    "summary": "<p>Amazon CloudFront now allows you to invalidate cached objects by cache tag, enabling you to remove groups of related content from CloudFront edge locations with a single invalidation request. Cache tag invalidation simplifies common operational workflows such as updating product information across multiple pages, managing legal takedown requests, handling regulatory compliance requests, and refreshing content across multi-tenant platforms.<br /> <br /> Previously, invalidating related objects that didn't share a common URL path required tracking individual URLs or using broad wildcard patterns that could unnecessarily clear unrelated content. With invalidation by cache tag, developers and site reliability engineers can tag cached objects when returning an object by including a specified header in HTTP responses with comma-separated tag values. When needed, they can invalidate all objects sharing a tag in one request, maintaining high cache hit ratios while ensuring end users see fresh content within seconds. You can configure the header name through the Amazon CloudFront console, AWS CLI, or API, and assign multiple tags per object for flexible, precise cache management. Over the years, CloudFront has made improvements to propagation times. Currently, invalidations take effect in under 5 seconds at P95. The end-to-end completion time, which includes reporting the invalidation status back, is under 25 seconds at P95.<br /> <br /> Amazon CloudFront invalidation by cache tag is available in all AWS Regions where CloudFront is&nbsp;offered&nbsp;except China (Beijing,&nbsp;operated&nbsp;by Sinnet) and China (Ningxia,&nbsp;operated&nbsp;by NWCD).&nbsp;To learn more,&nbsp;view the <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/invalidation-by-tags.html\">Invalidations&nbsp;By&nbsp;Cache Tag documentation</a>.&nbsp;Each cache tag is priced as one path.&nbsp;For details on pricing, refer to the&nbsp;<a href=\"https://aws.amazon.com/cloudfront/pricing/\">CloudFront pricing page</a>.</p>"
  "e16d43dba4ada20aa8d5105ccb7509ee":
    "id": "e16d43dba4ada20aa8d5105ccb7509ee"
    "title": "Paraphrase-multilingual-MiniLM-L12-v2, Table Transformer Detection, and Bielik-11B-v3.0-Instruct are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/paraphrase-multilingual-table-transformer-bielik-on-sagemaker-jumpstart/"
    "published": "2026-04-30 02:05:00"
    "fetched": "2026-04-30 04:19:30"
    "summary": "<p>Today, AWS announced the availability of paraphrase-multilingual-MiniLM-L12-v2, Microsoft Table Transformer Detection, and Bielik-11B-v3.0-Instruct in Amazon SageMaker JumpStart.</p> \n<p><b>Paraphrase-multilingual-MiniLM-L12-v2 </b>from Sentence Transformers is a lightweight semantic similarity model that maps sentences and paragraphs to a 384-dimensional dense vector space across 50+ languages. It is well suited for finding semantically similar content within and across languages, making it ideal for cross-lingual semantic search, multilingual document clustering, and sentence similarity scoring without requiring language-specific configuration.</p> \n<p><b>Microsoft Table Transformer</b>&nbsp;<b>Detection </b>is a DETR-based object detection model trained on the PubTables-1M dataset, purpose-built for detecting tables in unstructured documents such as PDFs and scanned images. It is well suited for document digitization pipelines and automated data extraction workflows that require reliably locating tabular content at scale across research papers, financial reports, and other document types.</p> \n<p><b>Bielik-11B-v3.0-Instruct</b> is an 11-billion-parameter generative language model developed by SpeakLeash and ACK Cyfronet AGH, trained on multilingual corpora spanning 32 European languages with a strong emphasis on Polish. It excels at Polish and European language dialogue, STEM and mathematical reasoning, logic and tool-use tasks, and enterprise applications requiring deep linguistic understanding across European languages.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases. To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the Amazon SageMaker JumpStart documentation.</p>"
  "b1b24ed15aaaf6aafde22cfddf54dd24":
    "id": "b1b24ed15aaaf6aafde22cfddf54dd24"
    "title": "Gemma 4 models are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/gemma-4-models-on-sagemaker-jumpstart/"
    "published": "2026-04-30 02:05:00"
    "fetched": "2026-04-30 04:19:30"
    "summary": "<p>Today, AWS announced the availability of Gemma 4 E4B, Gemma 4 26B-A4B, and Gemma 4 31B in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three instruction-tuned models from Google DeepMind bring multimodal capabilities with configurable reasoning, native function calling, and multilingual support across 140+ languages, enabling customers to build sophisticated AI applications across diverse use cases on AWS infrastructure.</p> \n<p>All three models share a common set of capabilities that address a broad range of enterprise AI use cases:</p> \n<p>Thinking - Built-in reasoning mode that lets the model think step-by-step before answering</p> \n<p>Image Understanding - Object detection, document and PDF parsing, screen and UI understanding, chart comprehension, OCR including multilingual, and handwriting recognition</p> \n<p>Video Understanding - Analyze video content by processing sequences of frames</p> \n<p>Interleaved Multimodal Input - Freely mix text and images in any order within a single prompt</p> \n<p>Function Calling - Native support for structured tool use, enabling agentic workflows</p> \n<p>Coding - Code generation, completion, and correction</p> \n<p>Multilingual - Out-of-the-box support for 35+ languages, pre-trained on 140+ languages</p> \n<p>Customers can choose the model that best fits their workload: Gemma 4 E4B additionally supports audio input for automatic speech recognition (ASR) and speech-to-translated-text translation across multiple languages.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases. To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the Amazon SageMaker JumpStart documentation.</p>"
  "36bd8778fbe2ac8940247c3c31725f39":
    "id": "36bd8778fbe2ac8940247c3c31725f39"
    "title": "Amazon CloudWatch adds visual agent configuration to the EC2 console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-agent-ec2/"
    "published": "2026-04-30 02:00:00"
    "fetched": "2026-04-30 04:19:30"
    "summary": "<p>Amazon CloudWatch now provides a visual configuration editor for the CloudWatch agent directly in the Amazon EC2 console, enabling you to set up and manage observability for your EC2 instances without hand-editing JSON. The CloudWatch agent collects infrastructure and application metrics, logs, and traces from EC2 instances and sends them to CloudWatch and AWS X-Ray. With the new visual editor, you can build agent configurations graphically,&nbsp;selecting metrics, log sources, and deployment targets,&nbsp;and deploy with a single click.</p> \n<p>From the EC2 console, you can select one or more instances, install the CloudWatch agent, or create tag-based policies for automated fleet-wide management.&nbsp;From the instance detail page, you can view agent status, update configurations, and troubleshoot agent health.&nbsp;Automated policies automatically apply the correct monitoring settings to every new instance, including those launched by auto-scaling.</p> \n<p>To get started, navigate to&nbsp;<a href=\"https://console.aws.amazon.com/ec2/v2/home#Instances:instanceState=running\">the Amazon EC2 console</a>, select an instance, and choose the EC2 monitoring tab&nbsp;to access the CloudWatch agent management experience. CloudWatch in-console agent management is available&nbsp;in all AWS Commercial Regions at no&nbsp;additional&nbsp;cost.&nbsp;<a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Standard CloudWatch pricing</a>&nbsp;applies for metrics, logs, and other telemetry collected by the agent.</p>"
"last_updated": "2026-04-30 04:19:30 JST"
