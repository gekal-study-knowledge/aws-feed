    "title": "個人番号利用事務系の実業務で生成AI活用 ― 奈良市と日立システムズが Generative AI Use Cases (GenU) で特定保健指導等における業務効率化に向けた有効性を確認"
    "link": "https://aws.amazon.com/jp/blogs/news/nara-city-gov-cloud-genai-with-genu/"
    "published": "2026-04-30 14:27:48"
    "fetched": "2026-04-30 14:55:21"
    "summary": "本ブログは、奈良市 AI・行革推進課 染川 実希 様、株式会社日立システムズ 山田 健太郎 様、アマゾン ウェブ サービス ジャパン合同会社 ソリューションアーキテクト 松本 侑也 の共著です。奈良市における個人番号利用事務系ネットワーク上での生成AI活用の取り組みについてご紹介します。自治体の個人番号利用事務系 (マイナンバー系ネットワーク) は、機微情報を扱うためネットワークが厳格に分離されており、生成AIの活用は困難とされてきました。本ブログでは、ガバメントクラウド上の個人番号利用事務系ネットワークにおいても、生成AIを活用することで業務効率化への将来的な期待と、実務における有用性を確認した、奈良市と日立システムズの取り組みをご紹介します。"
"last_updated": "2026-04-30 14:55:21 JST"
