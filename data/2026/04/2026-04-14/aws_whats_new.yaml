  "ac2b71bfaabba593e97bd37e06bec829":
    "id": "ac2b71bfaabba593e97bd37e06bec829"
    "title": "Amazon EC2 C8gn, M8gn, and R8gn instances now support higher Amazon EBS-optimized performance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-c8gn-m8gn-r8gn-ebs/"
    "published": "2026-04-14 14:01:00"
    "summary": "<p>Today, AWS announces increased Amazon Elastic Block Store (Amazon EBS) performance for Amazon EC2 C8gn, M8gn, and R8gn instances in 48xlarge and metal-48xl sizes.</p> \n<p>EC2 C8gn, M8gn, and R8gn instances are network optimized instances powered by AWS Graviton4 processors and latest 6th generation AWS Nitro Cards. With the latest enhancements to AWS Nitro System, we have doubled the maximum EBS performance on these instances in 48xlarge and metal-48xl sizes, from 60 Gbps of EBS bandwidth and 240,000 IOPS to 120 Gbps of EBS bandwidth and 480,000 IOPS. Customers running network-intensive workloads while requiring additional block storage performance such as data analytics and high-performance file systems can benefit from the improved EBS performance.</p> \n<p>All existing and new C8gn, M8gn, and R8gn instances in 48xlarge and metal-48xl sizes launched starting today will benefit from this performance increase at no additional cost. For running instances, customers can stop and start instances to enable this performance increase. The higher EBS performance is available in all AWS regions where these instance types are generally available today.</p> \n<p>To learn more, see Amazon <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">C8gn</a>, <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">M8gn</a>, and <a href=\"https://aws.amazon.com/ec2/instance-types/r8g\">R8gn</a> Instances and <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-optimized.html\">EBS-optimized instance types</a>.&nbsp;</p>"
  "8104042eeb1960500acb9713a3ec7322":
    "id": "8104042eeb1960500acb9713a3ec7322"
    "title": "AWS Transform is now available in Kiro and VS Code"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-transform-kiro-vscode/"
    "published": "2026-04-14 19:15:00"
    "summary": "<p>AWS Transform is now available through two additional developer tools — including Kiro and VS Code. <a href=\"https://aws.amazon.com/transform\">AWS Transform</a> is an agentic migration and modernization factory designed to compress enterprise transformation timelines from years to months — handling everything from large-scale infrastructure migrations to continuous tech debt reduction, without the manual handoffs and lost context that commonly stall these programs..</p> \n<p>With today’s launch, you can get started with <a href=\"https://aws.amazon.com/transform/custom/\">AWS Transform custom</a> transformations from wherever you already work: install the AWS Transform Power in <a href=\"https://github.com/kirodotdev/powers/tree/main/aws-transform\">Kiro</a>, or install the AWS Transform extension in <a href=\"https://marketplace.visualstudio.com/items?itemName=AmazonWebServices.aws-transform-plugin\">VS Code</a> . AWS Transform custom transformations help you crush tech debt at scale — choose from AWS-managed transformations for common patterns like Java, Python, and Node.js version upgrades, AWS SDK migrations (boto2 to boto3, Java SDK v1 to v2, JS SDK v2 to v3), or define your own. These new surfaces make it easier to discover additional capabilities as they become available, build and iterate on your own custom transformations, and run any agent repeatedly or across thousands of repositories at once. The custom transformations are the first in a growing library of playbooks coming to developer tools, complementing the existing AWS Transform web console and CLI so you can start a job in your IDE, track progress in the web console, and finish transformations wherever it makes sense — with job state and context shared across every surface.</p> \n<p>AWS Transform supports deploying to all AWS commercial regions,and AWS Transform custom is available in US East (N. Virginia) and Europe (Frankfurt). To learn more, visit the AWS Transform <a href=\"https://aws.amazon.com/transform\">product page</a> and <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html\">user guide</a>.</p>"
  "7bcc3ea889f9ac719647dcff3b9ba44f":
    "id": "7bcc3ea889f9ac719647dcff3b9ba44f"
    "title": "AWS Secrets Manager now supports hybrid post-quantum TLS to protect secrets from quantum threats"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-secrets-manager-post-quantum-tls/"
    "published": "2026-04-14 18:31:00"
    "summary": "<p>AWS Secrets Manager now&nbsp;supports&nbsp;hybrid post-quantum key exchange using ML-KEM (Module-Lattice-based Key-Encapsulation Mechanism) to secure TLS connections for retrieving and managing secrets. This protection is automatically enabled in Secrets Manager Agent (version 2.0.0+), AWS Lambda Extension (version 19+), and Secrets Manager CSI Driver (version 2.0.0+). For SDK-based clients, hybrid post-quantum key exchange is available in supported AWS SDKs including Rust, Go, Node.js, Kotlin, Python (with OpenSSL 3.5+), and Java v2 (v2.35.11+).</p> \n<p>With this launch, your applications retrieve secrets over TLS connections that combine classical key exchange with post-quantum cryptography, helping protect against both traditional cryptographic attacks and future quantum computing threats known as \"harvest now, decrypt later\" (HNDL). No code changes, configuration updates, or migration effort are&nbsp;required&nbsp;for customers using the latest client versions&nbsp;except for Java v2. For example, a microservice requiring multiple secrets at startup can now retrieve them over quantum-resistant TLS connections by simply upgrading to the latest Secrets Manager Agent version. You can verify hybrid post-quantum key exchange is active by checking CloudTrail logs for the \"X25519MLKEM768\" key exchange algorithm in the&nbsp;tlsDetails&nbsp;field of&nbsp;GetSecretValue&nbsp;API calls.</p> \n<p>Hybrid post-quantum key exchange using ML-KEM for AWS Secrets Manager is available in all AWS Regions where AWS Secrets Manager is supported. To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html\">AWS Secrets Manager documentation</a>&nbsp;and the&nbsp;<a href=\"https://aws.amazon.com/security/post-quantum-cryptography/migrating-to-post-quantum-cryptography/\">AWS Post-Quantum Cryptography migration page</a>.</p>"
  "498e3ef576b8c8bef1a58e8e09906a61":
    "id": "498e3ef576b8c8bef1a58e8e09906a61"
    "title": "Amazon EC2 P6-B300 instances are now available in the AWS GovCloud (US-East) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-p6-b300-govcloud-us-east/"
    "published": "2026-04-14 21:00:00"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in the AWS GovCloud (US-East) Region. P6-B300 instances provide 8x NVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.<br /> <br /> P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) and large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads. <br /> <br /> P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon) and AWS GovCloud (US-East). To learn more about P6-B300 instances, visit <a href=\"https://aws.amazon.com/ec2/instance-types/p6/\" target=\"_blank\">Amazon EC2 P6 instances</a>.</p>"
