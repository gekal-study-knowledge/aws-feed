  "119e9ec1a38bfe49179fefa94d2de527":
    "id": "119e9ec1a38bfe49179fefa94d2de527"
    "title": "Issues with AWS Research and Engineering Studio (RES)"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-014-aws/"
    "published": "2026-04-14 17:31:02"
    "summary": "<p><b>Bulletin ID:</b> 2026-014-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/04/06 14:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Research and Engineering Studio (RES) on AWS is an open source, web portal design for administrators to create and manage secure cloud-based research and engineering environments. We have identified the following issues with the AWS Research and Engineering Studio (RES).</p> \n<p>CVE-2026-5707: Unsanitized input in an OS Command in the virtual desktop session name handling in AWS Research and Engineering Studio (RES) version 2025.03 through 2025.12.01 might allow a remote authenticated actor to execute arbitrary commands as root on the virtual desktop host via a crafted session name.</p> \n<p>CVE-2026-5708: Improper control of user-modifiable attributes in the session creation component in AWS Research and Engineering Studio (RES) before version 2026.03 might allow an authenticated remote user to escalate privileges and assume the Virtual Desktop Host instance profile permissions and interact with other AWS resources and services via a crafted API request.</p> \n<p>CVE-2026-5709: Unsanitized input in the FileBrowser API in AWS Research and Engineering Studio (RES) version 2024.10 through 2025.12.01 might allow a remote authenticated actor to execute arbitrary commands on the cluster-manager EC2 instance via crafted input when using the FileBrowser functionality.</p> \n<p><b>Impacted versions:</b> &lt;= 2025.12.01</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "46249aa1b97d7ba03297d87a82db3e89":
    "id": "46249aa1b97d7ba03297d87a82db3e89"
    "title": "Issues with Amazon Athena ODBC Driver"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-013-aws/"
    "published": "2026-04-14 17:19:15"
    "summary": "<p><b>Bulletin ID:</b> 2026-013-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/04/03 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>The Amazon Athena ODBC driver implements standard ODBC application program interfaces (APIs). The ODBC driver provides access to Amazon Athena from any C/C++ application. The Amazon Athena ODBC driver provides 64-bit ODBC drivers for Windows, Linux and MAC operating systems.</p> \n<p>We identified the following:<br /> - CVE-2026-5485: OS command injection in browser-based authentication component (Linux only, fixed in 2.0.5.1)<br /> - CVE-2026-35558: Improper neutralization of special elements in authentication components<br /> - CVE-2026-35559: Out-of-bounds write in query processing components<br /> - CVE-2026-35560: Improper certificate validation in identity provider connection components<br /> - CVE-2026-35561: Insufficient authentication security controls in browser-based authentication components<br /> - CVE-2026-35562: Allocation of resources without limits in parsing components</p> \n<p><b>Impacted versions:</b> CVE-2026-5485 was addressed in 2.0.5.1 (Linux only). The remaining five (CVE-2026-35558 through CVE-2026-35562) were addressed in version 2.1.0.0 and apply to all supported platforms</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "02f5b66aeb5db30c36bdfc102e2c5cc4":
    "id": "02f5b66aeb5db30c36bdfc102e2c5cc4"
    "title": "CVE-2026-5429 - Kiro IDE Webview Cross-Site Scripting via Workspace Color Theme"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-012-aws/"
    "published": "2026-04-14 16:52:04"
    "summary": "<p><b>Bulletin ID:</b> 2026-012-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/04/02 11:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Kiro IDE is an agentic development environment that makes it easy for developers to ship real engineering work with the help of AI agents.</p> \n<p>We identified CVE-2026-5429, where unsanitized input during web page generation in the Kiro Agent webview in Kiro IDE before version 0.8.140 allows a remote unauthenticated threat actor to execute arbitrary code via a maliciously crafted color theme name when a local user opens the workspace. This issue requires the user to trust the workspace when prompted.</p> \n<p><b>Impacted versions:</b> &lt; 0.8.140</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "07b2914c7030ca5c10c9da8cf5090d9c":
    "id": "07b2914c7030ca5c10c9da8cf5090d9c"
    "title": "CVE-2026-5747 - Out-of-bounds Write in Firecracker virtio-pci Transport"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-015-aws/"
    "published": "2026-04-14 17:38:31"
    "summary": "<p><b>Bulletin ID:</b> 2026-015-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/04/07 15:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Firecracker is an open source virtualization technology that is purpose-built for creating and managing secure, multi-tenant container and function-based services.</p> \n<p>We identified CVE-2026-5747, an out-of-bounds write issue in the virtio PCI transport in Firecracker 1.13.0 through 1.14.3 and 1.15.0 on x86_64 and aarch64 that might allow a local guest user with root privileges to crash the Firecracker VMM process or potentially execute arbitrary code on the host via modification of virtio queue configuration registers after device activation. Achieving code execution on the host requires additional preconditions, such as the use of a custom guest kernel or specific snapshot configurations.</p> \n<p>No AWS service is affected.</p> \n<p><b>Impacted versions:</b> Firecracker &gt;= 1.13.0 AND &lt;= 1.14.3 AND 1.15.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "2ab062dac658fedcf2f001deae40bcfc":
    "id": "2ab062dac658fedcf2f001deae40bcfc"
    "title": "CVE-2026-5190 - AWS C Event Stream Streaming Decoder Stack Buffer Overflow"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-011-aws/"
    "published": "2026-04-14 16:44:23"
    "summary": "<p><b>Bulletin ID:</b> 2026-011-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/03/31 10:15 AM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS Common Runtime library is used by several AWS SDKs to communicate with event-stream services (Ex. Kinesis, Transcribe). We identified CVE-2026-5190. AWS Common Runtime event-stream decoder component before 0.6.0 might allow a third party operating a server to cause memory corruption leading to arbitrary code execution on a client application that processes crafted event-stream messages.</p> \n<p><b>Impacted versions:</b><br /> - aws-c-event-stream &lt; 0.6.0and the following higher level libraries that expose event-stream functionality<br /> - aws-iot-device-sdk-cpp-v2 &lt; 1.42.1<br /> - aws-iot-device-sdk-java-v2 &lt; 1.30.1<br /> - aws-iot-device-sdk-python-v2 &lt; 1.28.2<br /> - aws-iot-device-sdk-js-v2 &lt; 1.25.1<br /> - aws-sdk-swift &lt; 1.6.70<br /> - aws-sdk-cpp &lt; 1.11.764</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
