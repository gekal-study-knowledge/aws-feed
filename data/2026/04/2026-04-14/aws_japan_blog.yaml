  "282293715996fa0268468466efad1894":
    "id": "282293715996fa0268468466efad1894"
    "title": "Kiro CLI 2.0: デザイン刷新、ヘッドレス CI/CD パイプライン、Windows サポート"
    "link": "https://aws.amazon.com/jp/blogs/news/cli-2-0/"
    "published": "2026-04-14 03:17:59"
    "summary": "ターミナルで作業する開発者にとって、ワークフローに合ったツールが必要です。その逆ではありません。だからこそ私たちは Kiro CLI を開発しました。Kiro CLI は、そのまま使えるエージェント型ターミナルで、高品質なコードをより速くリリースできます。ローンチ以来、皆さんから素晴らしい反響をいただきました。気に入った点、改善が必要な点、そして足りない機能について教えていただきました。私たちはその声に耳を傾け、本日、皆さんからリクエストの多かった 3 つの大きな機能をリリースしました。"
  "c61f10d55cf2539bfe408c6ce112a20d":
    "id": "c61f10d55cf2539bfe408c6ce112a20d"
    "title": "Planview が Kiro CLI で SOC 2 コンプライアンスを自動化し、監査サイクルあたり 40 時間以上を削減"
    "link": "https://aws.amazon.com/jp/blogs/news/automating-soc-2-compliance/"
    "published": "2026-04-14 08:51:46"
    "summary": "コンプライアンス管理は、時に圧倒的な負担に感じることがあります。多くのエンジニアリングチームにとって、継続的に大きな注意を払い続ける必要がある業務です。チームは年間サイクルごとに 40 時間以上をかけてエビデンスを収集し、クラウドプロバイダーのコンソールを操作し、監査期限が迫る中でスプレッドシートを作成しています。戦略的ポートフォリオ管理のリーダーとして世界中で 3,000 社以上の顧客にサービスを提供する Planview も、同じ課題に直面していました。マルチサービスの AWS インフラストラクチャ全体で SOC 2 コンプライアンスを維持するために、顧客向けの機能開発に充てるべきエンジニアリング時間が消費されていたのです。ここでは、Planview が Kiro CLI を使ってコンプライアンスワークフローをどのように変革し、コンプライアンスサイクルあたり 40 時間以上を削減したかをご紹介します。"
