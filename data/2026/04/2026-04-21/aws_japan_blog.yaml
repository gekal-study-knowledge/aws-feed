    "summary": "Amazon Bedrock の IAM プリンシパルベースのコスト配分を使うと、Bedrock API コールの呼び出し元 (IAM ユーザーやロール) を CUR 2.0 と Cost Explorer に自動記録できます。本記事では、この機能のセットアップ方法と、チーム・部門・プロジェクトごとに Bedrock コストを追跡・配分する方法を解説します。"
