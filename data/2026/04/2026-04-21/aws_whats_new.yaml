    "title": "Amazon Connect Outbound Campaigns now supports contact priority ordering"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-priority-dialing/"
    "published": "2026-04-21 02:03:00"
    "fetched": "2026-04-21 14:23:52"
    "summary": "<p>Amazon Connect&nbsp;Outbound&nbsp;Campaigns now&nbsp;allows&nbsp;you to dial contacts in configurable priority order based on up to 10 profile attributes for voice campaigns and voice activities in journeys.&nbsp;This helps you focus agent time on the most valuable customers or time-sensitive opportunities, improving campaign effectiveness and conversion rates.</p> \n<p>With contact priority ordering, you can sort segments on attributes such as customer lifetime value, account tier, or appointment date. For example, a financial services team can prioritize outreach to high-value accounts nearing contract renewal, or a healthcare provider can ensure patients with the earliest upcoming appointments are contacted first. Initial dial attempts always take precedence over reattempts, ensuring your priority order is&nbsp;maintained&nbsp;throughout campaign execution.&nbsp;</p> \n<p>This capability is available in all AWS Regions where Amazon Connect&nbsp;Outbound&nbsp;Campaigns&nbsp;is&nbsp;offered at no&nbsp;additional&nbsp;cost. To get started, configure sort attributes when building segments in Amazon Connect Customer Profiles. To learn more, see the Amazon Connect&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/outbound-campaign-best-practices.html\">Outbound&nbsp;Campaigns&nbsp;best practice</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/customer-segments-building-segments.html\">how to build customer segments</a>.&nbsp;</p>"
  "dffa4223db69252e514c8334be99c1a8":
    "id": "dffa4223db69252e514c8334be99c1a8"
    "title": "Amazon Aurora serverless: Up to 30% better performance, smarter scaling, and still scales to zero"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aurora-serverless-smarter-scaling/"
    "published": "2026-04-21 13:53:00"
    "fetched": "2026-04-22 00:09:33"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a> — the autoscaling database that scales up to support your most demanding workloads and down to zero when you don't need it — just got faster and smarter, with up to 30% better performance than the previous version and enhanced scaling that understands your workload. It's especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents rather than against them, and you only pay for what you actually use. When not in use, the database automatically scales down to zero to save cost.<br /> <br /> With improved performance and scaling, you can now use serverless for even more demanding workloads. The enhanced scaling algorithm enables you to efficiently run workloads where multiple tasks compete for resources, such as busy web applications and API services. These improvements are available in platform version 4 at no additional cost. All new clusters, database restores, and new clones will automatically launch on platform version 4. Existing clusters on platform version 1, 2, or 3 can upgrade directly to platform version 4 by using pending maintenance action, stopping and restarting the cluster, or using blue/green deployments. You can verify your cluster's platform version in the AWS Console under instance configuration section or via the RDS API's ServerlessV2PlatformVersion parameter. To learn more, read the <a href=\"https://aws.amazon.com/blogs/database/aurora-serverless-faster-performance-enhanced-scaling-and-still-scales-down-to-zero/\">blog</a>.<br /> <br /> Aurora serverless is an on-demand, automatic scaling configuration for <a href=\"https://aws.amazon.com/rds/aurora/\">Amazon Aurora</a>. For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more, read the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html#aurora-serverless-v2.how-it-works.capacity\">documentation</a>, and get started by creating an Aurora serverless database using only a few steps in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
