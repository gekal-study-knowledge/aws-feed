  "90f13cf903ae0d315b809f659799f6a2":
    "id": "90f13cf903ae0d315b809f659799f6a2"
    "title": "Amazon Connect Outbound Campaigns now supports contact priority ordering"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-connect-priority-dialing/"
    "published": "2026-04-21 02:03:00"
    "fetched": "2026-04-21 14:23:52"
    "summary": "<p>Amazon Connect&nbsp;Outbound&nbsp;Campaigns now&nbsp;allows&nbsp;you to dial contacts in configurable priority order based on up to 10 profile attributes for voice campaigns and voice activities in journeys.&nbsp;This helps you focus agent time on the most valuable customers or time-sensitive opportunities, improving campaign effectiveness and conversion rates.</p> \n<p>With contact priority ordering, you can sort segments on attributes such as customer lifetime value, account tier, or appointment date. For example, a financial services team can prioritize outreach to high-value accounts nearing contract renewal, or a healthcare provider can ensure patients with the earliest upcoming appointments are contacted first. Initial dial attempts always take precedence over reattempts, ensuring your priority order is&nbsp;maintained&nbsp;throughout campaign execution.&nbsp;</p> \n<p>This capability is available in all AWS Regions where Amazon Connect&nbsp;Outbound&nbsp;Campaigns&nbsp;is&nbsp;offered at no&nbsp;additional&nbsp;cost. To get started, configure sort attributes when building segments in Amazon Connect Customer Profiles. To learn more, see the Amazon Connect&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/outbound-campaign-best-practices.html\">Outbound&nbsp;Campaigns&nbsp;best practice</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/customer-segments-building-segments.html\">how to build customer segments</a>.&nbsp;</p>"
  "dffa4223db69252e514c8334be99c1a8":
    "id": "dffa4223db69252e514c8334be99c1a8"
    "title": "Amazon Aurora serverless: Up to 30% better performance, smarter scaling, and still scales to zero"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aurora-serverless-smarter-scaling/"
    "published": "2026-04-21 13:53:00"
    "fetched": "2026-04-22 00:09:33"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a> — the autoscaling database that scales up to support your most demanding workloads and down to zero when you don't need it — just got faster and smarter, with up to 30% better performance than the previous version and enhanced scaling that understands your workload. It's especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents rather than against them, and you only pay for what you actually use. When not in use, the database automatically scales down to zero to save cost.<br /> <br /> With improved performance and scaling, you can now use serverless for even more demanding workloads. The enhanced scaling algorithm enables you to efficiently run workloads where multiple tasks compete for resources, such as busy web applications and API services. These improvements are available in platform version 4 at no additional cost. All new clusters, database restores, and new clones will automatically launch on platform version 4. Existing clusters on platform version 1, 2, or 3 can upgrade directly to platform version 4 by using pending maintenance action, stopping and restarting the cluster, or using blue/green deployments. You can verify your cluster's platform version in the AWS Console under instance configuration section or via the RDS API's ServerlessV2PlatformVersion parameter. To learn more, read the <a href=\"https://aws.amazon.com/blogs/database/aurora-serverless-faster-performance-enhanced-scaling-and-still-scales-down-to-zero/\">blog</a>.<br /> <br /> Aurora serverless is an on-demand, automatic scaling configuration for <a href=\"https://aws.amazon.com/rds/aurora/\">Amazon Aurora</a>. For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more, read the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html#aurora-serverless-v2.how-it-works.capacity\">documentation</a>, and get started by creating an Aurora serverless database using only a few steps in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
  "86826a430e364a810a7b5c88ca39f027":
    "id": "86826a430e364a810a7b5c88ca39f027"
    "title": "AWS Lambda functions can now mount Amazon S3 buckets as file systems with S3 Files"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-lambda-amazon-s3/"
    "published": "2026-04-21 17:00:00"
    "fetched": "2026-04-22 04:21:38"
    "summary": "<p>AWS Lambda now supports&nbsp;<a href=\"https://aws.amazon.com/s3/features/files/\" target=\"_blank\">Amazon S3 Files</a>, enabling your Lambda functions to mount Amazon S3 buckets as file systems and perform standard file operations without downloading data for processing. Built using Amazon EFS, S3 Files gives you the performance and simplicity of a file system with the scalability, durability, and cost-effectiveness of S3. Multiple Lambda functions can connect to the same S3 Files file system simultaneously, sharing data through a common workspace&nbsp;without&nbsp;building custom synchronization logic.</p> \n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\"></a>The&nbsp;S3 Files integration simplifies stateful workloads in Lambda by&nbsp;eliminating&nbsp;the overhead of downloading objects, uploading results, and managing ephemeral storage limits.&nbsp;This is particularly valuable for AI and machine learning workloads where agents need to&nbsp;persist&nbsp;memory and share state across pipeline steps.&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\" target=\"_blank\">Lambda durable functions</a>&nbsp;make&nbsp;these multi-step AI workflows possible by orchestrating parallel execution with automatic checkpointing. For example, an orchestrator function can clone a repository to a shared workspace while multiple agent functions analyze the code in parallel. The durable function handles checkpointing of execution state while S3 Files provides seamless data sharing across all steps.</p> \n<p>To use S3 Files with Lambda, configure your function to mount an S3 bucket through the Lambda console, AWS CLI, AWS SDKs,&nbsp;AWS CloudFormation, or&nbsp;AWS Serverless Application Model (SAM).&nbsp;To learn more about how to use S3 Files with your Lambda function, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-s3files.html\">Lambda developer guide</a>.&nbsp;</p> \n<p><a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"></a>S3 Files is supported for Lambda functions not configured with a capacity provider, in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>&nbsp;where both Lambda and&nbsp;S3 Files are available, at no&nbsp;additional&nbsp;charge beyond standard Lambda and S3 pricing.</p>"
  "803705787dec04aa76518c2e94868a8b":
    "id": "803705787dec04aa76518c2e94868a8b"
    "title": "Amazon EC2 G7e instances now available in AWS Local Zones in Los Angeles"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/ec2-g7e-instances-local-zones/"
    "published": "2026-04-21 14:00:00"
    "fetched": "2026-04-22 04:21:38"
    "summary": "<p>Today, AWS announces the general availability of <a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Compute Cloud (Amazon EC2) G7e instances</a> in AWS Local Zones in Los Angeles, California. G7e instances feature NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs and 5th generation Intel Xeon Scalable (Emerald Rapids) processors, bringing high-performance GPU compute closer to end users in Los Angeles.&nbsp;</p> \n<p>For creative workloads, you can use G7e instances to run studio workstation workloads with low-latency access to local storage, and post-production workloads including visual effects (VFX) editorial, color correction, and VFX finishing. G7e instances support enhanced real-time rendering on graphics engines and 2D/3D VFX composition software. For AI workloads, you can also use G7e instances to deploy Large Language Models (LLMs), inference, and agentic AI at the edge.&nbsp;</p> \n<p>To get started, opt-in to the Los Angeles Local Zone (us-west-2-lax-1b) from <a href=\"https://us-east-1.console.aws.amazon.com/ec2globalview/home#RegionsAndZones:tabId=lz\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Global View</a>. You can enable G7e instances from&nbsp;the <a href=\"https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#Overview\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 console</a>, <a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Command Line Interface</a> (AWS CLI), and AWS SDKs. G7e instances are available through On Demand and Savings Plans. To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/features/?nc=sn&amp;loc=2\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Local Zones Features page</a>.</p>"
  "20f6b4dd271929a272a35aec210a802f":
    "id": "20f6b4dd271929a272a35aec210a802f"
    "title": "AWS Lambda Durable Execution SDK for Java GA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/lambda-durable-execution-java-ga/"
    "published": "2026-04-21 06:00:00"
    "fetched": "2026-04-22 04:21:38"
    "summary": "<p>Today, AWS announces the general availability of the AWS Lambda Durable Execution SDK for Java, empowering Java developers to build resilient, long-running workflows using Lambda durable functions. With this SDK, developers can create multi-step applications like order processing pipelines, AI agent orchestration, and human-in-the-loop approvals directly in their applications without implementing custom progress tracking or integrating external orchestration services.</p> \n<p>Lambda durable functions extend Lambda's event-driven programming model with operations that checkpoint progress automatically and pause execution for up to a year when waiting on external events. The AWS Lambda Durable Execution SDK for Java provides an idiomatic Java experience for building with Lambda durable functions. It includes steps for progress tracking, callback integration for human and agent-in-the-loop workflows, durable invocation for reliable function chaining, and waits for efficient suspension. The SDK is compatible with Java 17+ and can be deployed using Lambda managed runtimes or functions packaged as container images. The local testing emulator in the SDK enables developers to build and debug locally before deploying to production.</p> \n<p>To get started, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\" rel=\"noopener noreferrer\" target=\"_blank\">Lambda durable functions developer guide</a> and the <a href=\"https://github.com/aws/aws-durable-execution-sdk-java/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda Durable Execution SDK for Java on GitHub</a>. For Regional availability and pricing details, see the <a href=\"https://builder.aws.com/build/capabilities\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regional Services List</a> and <a href=\"https://aws.amazon.com/lambda/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda Pricing</a>.</p>"
"last_updated": "2026-04-22 04:21:38 JST"
