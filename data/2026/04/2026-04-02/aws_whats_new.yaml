  "5c51ae314e1fb8e7bc77c03dfb5f1d7b":
    "id": "5c51ae314e1fb8e7bc77c03dfb5f1d7b"
    "title": "Amazon CloudWatch now supports OpenTelemetry metrics in public preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-opentelemetry-metrics/"
    "published": "2026-04-02 15:00:00"
    "fetched": "2026-04-02 15:00:00"
    "summary": "<p>Amazon CloudWatch now supports native OpenTelemetry (OTel) metrics in public preview, enabling you to send metrics directly using the OpenTelemetry Protocol (OTLP) without custom conversion logic or additional tooling. You can now combine your custom OpenTelemetry metrics with AWS vended metrics from over 70 services and query them using PromQL — no additional agents or code changes required.<br /> <br /> With native OTel support, a team running microservices on Amazon EKS and on-premises servers can now send OTel metrics from both environments directly to CloudWatch. They can correlate application-level metrics like order processing latency from their on-premises services with EKS pod CPU utilization and Application Load Balancer request counts, then use PromQL to build unified dashboards and alarms that span their entire infrastructure. CloudWatch anomaly detection works with OTel metrics, automatically identifying unusual patterns without requiring you to set static thresholds. Query Studio, a new console experience for PromQL, lets you write queries, explore metrics, create alarms, and build dashboards directly in the CloudWatch console.<br /> <br /> Native OpenTelemetry metrics support is available in public preview in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Singapore), and Europe (Ireland). There is no charge for OpenTelemetry metrics or querying during preview. To learn more, see the Amazon CloudWatch <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OpenTelemetry-Sections.html\">OpenTelemetry documentation</a>.</p>"
  "7765db1625e9eb374e47206ff451302c":
    "id": "7765db1625e9eb374e47206ff451302c"
    "title": "Amazon CloudWatch expands auto-enablement to Amazon CloudFront logs and 3 additional resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-cloudwatch-cloudfront-enablement/"
    "published": "2026-04-02 17:00:00"
    "fetched": "2026-04-02 17:00:00"
    "summary": "<p>Amazon CloudWatch now supports automatic enablement of Amazon CloudFront Standard access logs, AWS Security Hub CSPM finding logs, and Amazon Bedrock AgentCore memory and gateway logs and traces to CloudWatch Logs. Customers can set up enablement rules that automatically configure telemetry for both existing and newly created resources, ensuring consistent monitoring coverage without manual setup.</p> \n<p>Enablement rules can be scoped to the organization, specific accounts, or specific resources based on resource tags to standardize telemetry collection. For example, a central security team can create a single rule to automatically send CloudFront access logs and Security Hub findings for all resources across their organization to CloudWatch Logs.</p> \n<p>CloudWatch's auto-enablement capability is available in all AWS commercial regions. Log ingestion will be billed according to <a href=\"https://aws.amazon.com/cloudwatch/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Pricing.</a></p> \n<p>Amazon CloudFront access logs and AWS Security Hub CSPM findings support organization-wide enablement rules. Bedrock AgentCore memory and gateway telemetry support account-level enablement rules. To learn more about enablement rules in Amazon CloudWatch, visit the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-rules.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch documentation</a>.</p>"
  "f096fad27365642496f2c0c473548ebd":
    "id": "f096fad27365642496f2c0c473548ebd"
    "title": "AWS Direct Connect announces 100G expansion in Auckland, New Zealand"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-direct-connect-100g-auckland/"
    "published": "2026-04-02 16:00:00"
    "fetched": "2026-04-02 16:00:00"
    "summary": "<p>Today, AWS announced the expansion of 100 Gbps dedicated connections at the existing&nbsp;<a href=\"https://aws.amazon.com/directconnect\">AWS Direct Connect</a>&nbsp;location in the&nbsp;Datacom Orbit DH6 data center near Auckland, New Zealand. You can now establish private, direct network access to all public AWS Regions (except those in China), AWS GovCloud Regions, and&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones</a>&nbsp;from this location. This is the second AWS Direct Connect location in New Zealand to provide 100 Gbps connections with MACsec encryption capabilities.</p> \n<p>The Direct Connect service enables you to establish a private, physical network connection between AWS and your data center, office, or colocation environment. These private connections can provide a more consistent network experience than those made over the public internet.</p> \n<p>For more information on the over 150 Direct Connect locations worldwide, visit the&nbsp;<a href=\"https://aws.amazon.com/directconnect/locations/\">locations</a>&nbsp;section of the Direct Connect&nbsp;<a href=\"https://aws.amazon.com/directconnect\">product detail pages</a>. Or, visit our&nbsp;<a href=\"https://aws.amazon.com/directconnect/getting-started/\">getting started</a>&nbsp;page to learn more about how to purchase and deploy Direct Connect.</p>"
  "80c30fc72cadded8a913b289ec691019":
    "id": "80c30fc72cadded8a913b289ec691019"
    "title": "Amazon ElastiCache Serverless now supports IPv6 and dual stack connectivity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-elasticache-serverless-ipv6-dual-stack/"
    "published": "2026-04-02 21:00:00"
    "fetched": "2026-04-02 21:00:00"
    "summary": "<p>Amazon&nbsp;ElastiCache&nbsp;Serverless&nbsp;now supports IPv6 and dual stack&nbsp;connectivity, expanding beyond the IPv4 connectivity that was previously available. This gives you greater flexibility in how your applications connect to your&nbsp;Serverless&nbsp;caches.</p> \n<p>When creating an&nbsp;ElastiCache&nbsp;Serverless&nbsp;cache, you can now choose from three network type options — IPv4, IPv6, or dual stack. With dual stack connectivity, your cache accepts connections over both IPv4 and IPv6 simultaneously, making it ideal for migrating to IPv6 gradually while&nbsp;maintaining&nbsp;backward compatibility with applications connecting over IPv4. IPv6 connectivity enables you to use IPv6-only subnets with your&nbsp;Serverless&nbsp;caches,&nbsp;eliminating&nbsp;the need for IPv4 addresses and helping you meet compliance requirements for IPv6 adoption.</p> \n<p>IPv6 and dual stack connectivity for&nbsp;ElastiCache&nbsp;Serverless&nbsp;is available in all AWS Regions, including the AWS GovCloud (US) Regions and the China Regions, at no&nbsp;additional&nbsp;charge.&nbsp;To learn more, visit the&nbsp;<a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache product page</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/serverless-network-type.html\" target=\"_blank\">Choosing&nbsp;a network type for serverless caches</a>&nbsp;in the Amazon&nbsp;ElastiCache&nbsp;documentation.</p>"
  "ef92ff9954f87ad08b705ba2ebe34b12":
    "id": "ef92ff9954f87ad08b705ba2ebe34b12"
    "title": "Amazon CloudWatch launches OTel Container Insights for Amazon EKS (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/cloudwatch-otel-container-insights-eks/"
    "published": "2026-04-02 20:41:00"
    "fetched": "2026-04-02 20:41:00"
    "summary": "<p>Amazon CloudWatch introduces Container Insights with OpenTelemetry metrics for Amazon EKS, available in public preview. Building on the existing Container Insights experience, this capability provides deeper visibility into EKS clusters by collecting more metrics from widely adopted open source and AWS collectors and sending them to CloudWatch using the OpenTelemetry Protocol (OTLP). Each metric is automatically enriched with up to 150 descriptive labels, including Kubernetes metadata and customer-defined labels such as team, application, or business unit.<br /> <br /> Curated dashboards in the Container Insights console present cluster, node, and pod health with the ability to aggregate and filter metrics by instance type, availability zone, node group, or any custom label. For deeper analysis, customers can write queries using the Prometheus Query Language (PromQL) in CloudWatch Query Studio. The CloudWatch Observability EKS add-on provides one-click installation through the Amazon EKS console, or can be deployed through CloudFormation, CDK, or Terraform. The add-on automatically detects accelerated compute hardware including NVIDIA GPUs, Elastic Fabric Adapters, and AWS Trainium and Inferentia accelerators. For existing customers of the add-on, CloudWatch supports publishing both OpenTelemetry and existing Container Insights metrics at the same time.<br /> <br /> Container Insights with OpenTelemetry metrics is available in public preview in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Singapore), and Europe (Ireland). There is no charge for OpenTelemetry metrics from Container Insights during preview.&nbsp;To get started, see the<a href=\"http://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/container-insights-otel-metrics.html\"> Container Insights with OpenTelemetry metrics for Amazon EKS.</a></p>"
  "055320a2f6f182d4918291b705373526":
    "id": "055320a2f6f182d4918291b705373526"
    "title": "AWS Deadline Cloud now supports configurable job scheduling modes for queues"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/deadline-cloud-job-scheduling/"
    "published": "2026-04-02 20:11:00"
    "fetched": "2026-04-02 20:11:00"
    "summary": "<p>Today, AWS Deadline Cloud announces support for configurable job scheduling modes, giving you control over how workers are distributed across jobs in a queue. AWS Deadline Cloud is a fully managed service that simplifies render management for computer-generated 2D/3D graphics and visual effects for films, TV shows, commercials, games, and industrial design.<br /> <br /> Previously, all available workers were assigned to the highest-priority, earliest-submitted job first, which could delay feedback on other submitted jobs. You can now choose from three scheduling modes when creating or updating a queue: priority FIFO (the existing default behavior), priority balanced (workers are distributed evenly across all jobs at the highest priority level), and weighted balanced (jobs are weighted based on configurable parameters including priority, error count, submission time, and rendering task count). Priority balanced and weighted balanced scheduling modes enable artists to get immediate feedback on their submissions without waiting for earlier jobs to complete.<br /> <br /> Configurable job scheduling modes are available in all AWS Regions where AWS Deadline Cloud is supported. To get started, visit the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/developerguide/build-jobs-scheduling.html\">Deadline Cloud developer guide</a>.</p>"
  "1ed799c7e2c65845edc7dbaa2f0c2dcd":
    "id": "1ed799c7e2c65845edc7dbaa2f0c2dcd"
    "title": "Announcing compute-optimized instance bundles for Amazon Lightsail"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/lightsail-compute-optimized-instances/"
    "published": "2026-04-02 20:03:00"
    "fetched": "2026-04-02 20:03:00"
    "summary": "<p>Amazon Lightsail now offers compute-optimized instance bundles with up to 72 vCPUs. The new instance bundles are available in 7 sizes with both IPv6-only and dual-stack networking types. All Lightsail blueprints are supported with compute-optimized instance bundles, including Linux and Windows operating system (OS) and application blueprints. You can create instances using the new bundles with pre-configured OS and application blueprints including WordPress, cPanel &amp; WHM, Plesk, Drupal, Magento, MEAN, LAMP, Node.js, Ruby on Rails, Amazon Linux, Ubuntu, CentOS, Debian, AlmaLinux, and Windows.</p> \n<p>The new compute-optimized instances enable you to run compute-intensive workloads that require high CPU. These high-performance instances deliver consistent, dedicated CPU performance ensuring your applications always have the full processing power they need. These new instance bundles are ideal for workloads such as batch processing, distributed analytics, high-performance web servers, scientific modeling, dedicated gaming servers, ad serving engines, video encoding, and CPU-intensive machine learning inference applications.</p> \n<p>Amazon Lightsail is available in <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html\">15 AWS Regions</a> including US East (N. Virginia), US West (Oregon), Europe (Frankfurt), Europe (London), Asia Pacific (Tokyo), and Asia Pacific (Jakarta). To get started, visit the <a href=\"https://lightsail.aws.amazon.com/\">Lightsail console</a>. For pricing and other details, visit the <a href=\"https://aws.amazon.com/lightsail/pricing/\">Amazon Lightsail pricing</a>.</p>"
  "3c33e9542759a405cc990a4bd67c6e79":
    "id": "3c33e9542759a405cc990a4bd67c6e79"
    "title": "Amazon WorkSpaces Applications improves multi-session fleet management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-workspaces-applications-drain-mode/"
    "published": "2026-04-02 15:00:00"
    "fetched": "2026-04-02 15:00:00"
    "summary": "<p>Amazon WorkSpaces Applications now enables instances in multi-session fleets to stop accepting new user sessions, while allowing existing sessions to continue uninterrupted. This capability, known as drain mode, ensures seamless operations during maintenance, scaling, or system updates.<br /> <br /> Multi-session fleets allow hosting multiple end user sessions on a single instance, helping to maximize usage of the underlying infrastructure - including compute, memory and storage resources - and lowering the overall cost. This new drain mode capability helps administrators manage multi-session environments more seamlessly by preventing disruption to active users. When performing system maintenance, applying security patches, or scaling down resources, administrators can configure instances to gradually empty without abruptly terminating user sessions. This ensures users can complete their work smoothly while new connections are directed to other available instances, maintaining system stability and improving the overall end-user experience.<br /> <br /> This new feature is available at no additional cost in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>&nbsp;where Amazon WorkSpaces Applications is available.<br /> <br /> Amazon WorkSpaces Applications offers pay-as-you-go pricing. For more information, see&nbsp;<a href=\"https://aws.amazon.com/appstream2/pricing/\">Amazon WorkSpaces Applications Pricing</a>. To get started with WorkSpaces Applications, see&nbsp;<a href=\"https://aws.amazon.com/workspaces/applications/getting-started/\">WorkSpaces applications: Getting started</a>.</p>"
  "12ad2ca359e25e4f20c06852d7517973":
    "id": "12ad2ca359e25e4f20c06852d7517973"
    "title": "Amazon Location Service announces enhanced map styling with contour line density, traffic visualization, and 3D terrain"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-location-enhanced-map-styling/"
    "published": "2026-04-02 14:00:00"
    "fetched": "2026-04-02 14:00:00"
    "summary": "<p>Amazon Location Service today announced new map styling capabilities, providing developers with greater control over terrain visualization, traffic display, and immersive 3D experiences. This release introduces customizable contour line density levels, a traffic congestion-only mode, 3D Terrain and Globe View features, and expands support for existing features across multiple map styles.<br /> <br /> These capabilities enable you to customize maps for diverse use cases. Choose from three contour line density levels (Low, Medium, and High) to control elevation data visualization, with Low density emphasizing major elevation changes, Medium density providing balanced detail, and High density showing double the contour lines for intricate terrain views. Display traffic strategically with the new traffic congestion-only mode, which filters out free-flowing traffic to highlight incidents and congestion. Create immersive experiences with 3D Terrain and 3D Globe View with Atmosphere, featuring realistic elevation and atmospheric effects. Additionally, existing features like full traffic visualization, Transit and Truck travel modes, and dark and light color schemes are now available across more map styles, including Monochrome, Hybrid, and Satellite.<br /> <br /> Amazon Location Service is available in the following AWS Regions: US East (Ohio), US East (N. Virginia), US West (Oregon), Asia Pacific (Malaysia), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Spain), Europe (Stockholm), South America (São Paulo), and AWS GovCloud (US-West).<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/maps-concepts.html\">Amazon Location Service Developer Guide</a> or try the hands-on <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/dynamic-maps-how-to.html\">how to code samples</a>.</p>"
