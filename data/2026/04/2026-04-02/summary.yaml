"overview": |
  この日はエージェント型 AI (Agentic AI) の本番運用に関するコンテンツが中心でした。日本語ブログでは「Agentic AI の運用化」ステークホルダー/ペルソナ別ガイド 2 部作、AWS DevOps Agent の一般提供開始、Amazon OpenSearch Service へのエージェント AI 機能追加によるオブザーバビリティ効率化が取り上げられ、セキュリティブログではエージェント型 AI システムの 4 つのセキュリティ原則が解説されました。機械学習分野では SageMaker HyperPod による地震基盤モデルの分散学習で学習時間を 6 か月から 5 日に短縮した TGS の事例、Rocket Close の住宅ローン書類処理を Bedrock と Textract で 15 倍高速化した事例、Network Firewall による AgentCore のドメイン制限、Strands Evals での多ターン評価が紹介されました。CloudWatch は OpenTelemetry メトリクスと Query Studio (PromQL) をパブリックプレビューで提供開始し、EKS 向け OTel Container Insights も追加。その他 ElastiCache Serverless の IPv6/デュアルスタック対応、Lightsail のコンピュート最適化バンドル、Amazon Location Service の地図スタイリング強化なども発表されました。
