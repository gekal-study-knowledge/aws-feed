    "summary": "この記事では、さまざまな戦略を使用して&nbsp;Amazon CloudFront&nbsp;のパブリックオリジンを&nbsp;Amazon Virtual Private Cloud&nbsp;(Amazon VPC)&nbsp;オリジンに移行する方法を紹介します。また、クロスアカウントで&nbsp;VPC&nbsp;オリジンを使用することで、セキュリティを最優先としたアーキテクチャをサポートすることもできます。"
