    "title": "Automate AML alert triage with Amazon Quick and Snowflake Cortex AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/automate-aml-alert-triage-with-amazon-quick-and-snowflake-cortex-ai/"
    "published": "2026-05-29 01:41:07"
    "fetched": "2026-05-29 01:52:00"
    "summary": "This post demonstrates that integration in action by automating one of the most labor-intensive workflows in financial services: anti-money laundering (AML) alert triage. You will build a triage workflow using Amazon Quick Flows and Snowflake Cortex, connected through the Amazon Quick Model Context Protocol (MCP) integration. In our testing environment, automated workflows built using Amazon Quick reduced alert investigation time from 30-90 minutes to under 5 minutes. Actual results may vary based on alert complexity and data volume."
  "9ed213fb187df61b5e6ea90b2c20d88e":
    "id": "9ed213fb187df61b5e6ea90b2c20d88e"
    "title": "Build a test suite that grows with your agent with dataset management in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-test-suite-that-grows-with-your-agent-with-dataset-management-in-amazon-bedrock-agentcore/"
    "published": "2026-05-29 03:10:47"
    "fetched": "2026-05-29 04:34:09"
    "summary": "Agent evaluation is most powerful when you combine fast-moving online signals with stable offline baselines. To understand whether your agent is truly improving over time, you need a fixed benchmark alongside your changing real-world traffic. Managing test cases for evaluation baselines as a dataset in Amazon Bedrock AgentCore brings the discipline of versioned test fixtures […]"
  "35f3ca1fea9289dd4b81fbe5202f9e66":
    "id": "35f3ca1fea9289dd4b81fbe5202f9e66"
    "title": "Claude Opus 4.8 is now available on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/claude-opus-4-8-is-now-available-on-aws/"
    "published": "2026-05-29 02:51:32"
    "fetched": "2026-05-29 04:34:09"
    "summary": "This post covers Opus 4.8's improvements and practical guidance for AI engineers integrating the model into agentic systems and production inference workloads on Amazon Bedrock."
  "f744951443f3caed5e049dc3b4199518":
    "id": "f744951443f3caed5e049dc3b4199518"
    "title": "Build a custom portal with embedded Amazon SageMaker AI MLflow Apps"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-custom-portal-with-embedded-amazon-sagemaker-ai-mlflow-apps/"
    "published": "2026-05-29 05:39:22"
    "fetched": "2026-05-29 06:52:49"
    "summary": "In this post, you learn how to build a custom portal with embedded SageMaker AI MLflow Apps UI. You walk through the architecture pattern behind a React front end paired with a Flask reverse proxy that handles AWS Signature Version 4 (SigV4) authentication, deploy the entire stack through the AWS Cloud Development Kit (AWS CDK), validate the deployment, and review security considerations and cleanup procedures."
  "b928b08a0bab16255fca122ae1b77ae8":
    "id": "b928b08a0bab16255fca122ae1b77ae8"
    "title": "Streamline external access to Amazon SageMaker MLflow using a REST API proxy"
    "link": "https://aws.amazon.com/blogs/machine-learning/streamline-external-access-to-amazon-sagemaker-mlflow-using-a-rest-api-proxy/"
    "published": "2026-05-29 05:35:44"
    "fetched": "2026-05-29 06:52:49"
    "summary": "In this post, we demonstrate how to build a secure Flask-based MLflow proxy service that provides HTTPS access to Amazon SageMaker MLflow without requiring the MLflow SDK. This solution is for organizations undergoing cloud transformation who want to preserve their existing ML workflows while adopting cloud-native services."
  "5ef1019dcb97136d3c55429b36f9e779":
    "id": "5ef1019dcb97136d3c55429b36f9e779"
    "title": "Evaluating Deep Agents using LangSmith on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluating-deep-agents-using-langsmith-on-aws/"
    "published": "2026-05-29 05:32:23"
    "fetched": "2026-05-29 06:52:49"
    "summary": "This post combines learnings from LangChain’s work on evaluating deep agents and Anthropic’s guide to demystifying evals for AI agents into a practical guide. In this post, you will learn how to: 1) apply five evaluation patterns for deep agents, 2) build offline evaluations using pytest and LangSmith, and 3) configure online monitoring for production. The walkthrough uses a text-to-SQL deep agent with Amazon Bedrock for the full development to production lifecycle."
