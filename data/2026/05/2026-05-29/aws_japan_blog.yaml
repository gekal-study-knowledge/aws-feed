    "title": "Kiro アンバサダープログラムのご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-kiro-ambassadors/"
    "published": "2026-05-29 07:34:08"
    "fetched": "2026-05-29 08:12:23"
    "summary": "先日、開発者コミュニティが互いに発見し、つながり、よりよいものを作るための場として Kiro コミュニティハブと Kiro Labs をローンチしました。すでにギャラリーにプロジェクトを投稿したり、これから開催するイベントをシェアしたりする動きが始まっています。今日はそこからもう一歩踏み込みます。Kiro Ambassadors は、フィードバックを寄せ、コンテンツを発信し、他のビルダーを支えてくれる、最もアクティブな開発者のみなさんとの関係を公式なプログラムにしたものです。すでに Kiro を前に進めてくれていて、これからの方向性にも直接関わりたいと考えている開発者のための仕組みです。Kiro を実際のワークフローの一部として使っている開発者の影響力とインパクトを、さらに広げていきたいと考えています。"
"last_updated": "2026-05-29 08:12:23 JST"
