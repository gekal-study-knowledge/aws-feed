"entries":
  "262b623f8b9ec6007b0ee42b2327f04a":
    "id": "262b623f8b9ec6007b0ee42b2327f04a"
    "title": "DynamoDB Streams now supports AWS PrivateLink for FIPS endpoints in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-dynamodb-streams-privatelink-fips-govcloud/"
    "published": "2026-05-29 00:00:00"
    "fetched": "2026-05-29 01:51:59"
    "summary": "<p>Amazon DynamoDB Streams now supports AWS PrivateLink for FIPS (Federal Information Processing Standard) endpoints in AWS GovCloud (US) Regions. DynamoDB Streams captures time-ordered sequences of item-level modifications in DynamoDB tables, enabling real-time data processing and event-driven architectures. This enhancement allows government agencies and organizations with federal compliance requirements to establish private connectivity between their VPCs and DynamoDB Streams FIPS endpoints without exposing traffic to the public internet.</p> \n<p>This capability helps customers meet strict federal compliance and regulatory requirements while simplifying their network architecture. By keeping all traffic within the AWS network infrastructure, organizations can securely process real-time data streams, implement compliant change data capture (CDC) solutions, and build event-driven architectures that adhere to federal security standards. Government agencies operating in GovCloud regions can now leverage DynamoDB Streams for secure data streaming applications while maintaining the enhanced security and privacy that AWS PrivateLink provides.</p> \n<p>AWS PrivateLink support for DynamoDB Streams FIPS endpoints is available in AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions, as well as US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Canada (Central), and Canada West (Calgary).</p> \n<p>&nbsp;To learn more, visit the <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/privatelink-streams.html\">Amazon DynamoDB Streams PrivateLink documentation</a> and the <a href=\"https://aws.amazon.com/privatelink/\">AWS PrivateLink page</a>.</p>"
  "fd64e58e8998a6588a169807f366d0ba":
    "id": "fd64e58e8998a6588a169807f366d0ba"
    "title": "AWS Organizations emits CloudTrail events for account membership changes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-organizations-cloudtrail/"
    "published": "2026-05-29 01:00:00"
    "fetched": "2026-05-29 04:34:08"
    "summary": "<p>AWS Organizations&nbsp;now automatically emits CloudTrail events to your management account whenever accounts join or leave your organization. These new events—AccountJoinedOrganization&nbsp;and&nbsp;AccountDepartedOrganization—provide security teams and cloud administrators with enhanced visibility into organizational membership changes, helping detect unauthorized activities and potential security incidents that previously could go unnoticed.&nbsp;</p> \n<p>The&nbsp;AccountJoinedOrganization&nbsp;event&nbsp;captures how an account joined an organization&nbsp;(Created or Invited) and the&nbsp;join&nbsp;timestamp, while the&nbsp;AccountDepartedOrganization&nbsp;event&nbsp;records&nbsp;how an account&nbsp;departed&nbsp;—Left for accounts that departed voluntarily, Removed for accounts removed by the management account, or&nbsp;&nbsp;Cleaned&nbsp;for accounts&nbsp;that were permanently closed along with&nbsp;the departure timestamp.&nbsp;</p> \n<p>You can&nbsp;leverage&nbsp;these events to create CloudWatch alarms or Amazon&nbsp;EventBridge&nbsp;rules for real-time notifications, enabling rapid response to suspicious organizational changes. This capability supports critical use cases including fraud detection, compliance auditing, security monitoring, and incident investigation across your AWS environment.</p>"
  "07423aef7e6770e0730ef584131aff9b":
    "id": "07423aef7e6770e0730ef584131aff9b"
    "title": "Amazon Connect Customer expands generative AI-powered post-contact summaries to eight new languages"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-summary-languages/"
    "published": "2026-05-29 00:21:00"
    "fetched": "2026-05-29 04:34:08"
    "summary": "<p>Amazon Connect Customer now supports generative AI-powered post-contact summaries in eight additional language families: Portuguese, French, Italian, German, Spanish, Chinese, Japanese, and Korean. Post-contact summaries also now support non-US variations of English, including British English, Australian English, and other regional locales, ensuring summaries reflect locally appropriate spelling and terminology.</p> \n<p>Generative AI-powered post-contact summaries provide agents and managers with concise, structured overviews of customer conversations across voice, chat, and email channels, eliminating the need to read full transcripts. With this expansion, organizations can automatically generate summaries in the language of the conversation, helping agents complete after-contact work faster and enabling managers to review contacts across languages. For example, a global support organization can now generate post-contact summaries for calls handled in French, German, or Japanese, giving supervisors visibility into service quality across all regions.</p> \n<p>The newly supported languages are available in all AWS Regions where Amazon Connect Customer post-contact summaries are available. To learn more, refer to <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/view-generative-ai-contact-summaries.html\">View generative AI-powered post-contact summaries</a> in the Amazon Connect Customer Administrator Guide. To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.</p>"
  "9c9c31916be392b228c293a381a45f2c":
    "id": "9c9c31916be392b228c293a381a45f2c"
    "title": "Claude Opus 4.8 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/claude-opus-4.8-aws/"
    "published": "2026-05-29 00:16:00"
    "fetched": "2026-05-29 04:34:08"
    "summary": "<p>AWS&nbsp; now offers Claude Opus 4.8 -- Anthropic's most capable generally available model to date -- delivering meaningful advances across agentic coding, professional knowledge work, and long-running autonomous tasks for developers and enterprises building production AI applications.</p> \n<p>Claude Opus 4.8 can perform longer autonomous runs, deeper reasoning, and consistency to be trusted with production work. For coding, the Opus 4.8 reads codebases like an engineer, plans before it edits, and holds context across long sessions in real repositories. For agentic tasks, it is better at finding paths around obstacles instead of stalling, recovering from its own errors, and knowing when to ask for help versus when to keep going. For knowledge work, it better synthesizes across long documents and complex sources, self-checks its output, and delivers structured deliverables that hold up to review.</p> \n<p>Customers have two ways to access Claude Opus 4.8: Amazon Bedrock and Claude Platform on AWS. </p> \n<p>Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Opus 4.8 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/foundation-models-reference.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>&nbsp; and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability</a>..</p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Platform on AWS documentation</a></p>"
  "a49b605bf8a4c5770676efc1e2c0d3aa":
    "id": "a49b605bf8a4c5770676efc1e2c0d3aa"
    "title": "Monitor AWS Budgets directly in Billing and Cost Management Dashboards with new Budgets widget"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/monitor-aws-budgets-using-dashboards"
    "published": "2026-05-29 05:57:00"
    "fetched": "2026-05-29 06:52:47"
    "summary": "<p>Today, AWS Billing and Cost Management (BCM) announces support for Budgets widgets in BCM Dashboards, giving you the flexibility to customize your cost management console with the views that matter most to your organization. You can now monitor AWS Budgets alongside Cost Explorer reports and Savings Plans and Reserved Instance coverage and utilization reports, all in a single, tailored dashboard.</p> \n<p>Previously, reviewing budget performance required navigating to a separate console page. Now, finance teams and cloud administrators can add one or more Budgets widgets to any BCM Dashboard, displaying budget name, budgeted amount, actual spend, and forecasted amount. You can filter budgets by name, threshold, and budget type, directly within the widget, and choose which budgets appear on each dashboard, reducing the time spent switching between console pages and enabling faster budget monitoring across teams. Budget widgets are fully integrated with dashboard export capabilities, allowing you to include budget data in scheduled email reports or download it as CSV or PDF, making it easier to share budget status with stakeholders without manual data gathering.&nbsp;</p> \n<p>Budgets widgets for BCM Dashboards are available in all AWS commercial Regions at no additional charge. To learn more, visit our&nbsp;<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/dashboards.html\">User Guide</a>.</p>"
  "619d2a58aa3921ee36502497e837ff6e":
    "id": "619d2a58aa3921ee36502497e837ff6e"
    "title": "The next generation of Amazon OpenSearch Serverless is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-opensearch-serverless-next-generation-generally-available/"
    "published": "2026-05-29 00:00:00"
    "fetched": "2026-05-29 06:52:47"
    "summary": "<p>Today, AWS announced the general availability of the next generation of Amazon OpenSearch Serverless, a fully managed search and vector engine designed for customers building agents. The next generation of OpenSearch Serverless auto scales 20x faster than its predecessor and provisions resources in seconds to meet the demands of even the most unpredictable agentic workflows. With scale-to-zero and pay-per-usage pricing, customers can now save up to 60% compared to the cost of provisioning Opensearch clusters for peak loads.<br /> <br /> The next generation of OpenSearch Serverless introduces complete decoupling of compute and storage through a new shared storage layer. This means customers can scale compute up and down independently, reducing costs during low-traffic periods while maintaining instant readiness for traffic spikes.&nbsp;To simplify network connectivity, OpenSearch Serverless now offers two resource-based endpoints - a collection level endpoint and a regional endpoint which makes multi-VPC and on-premise connectivity straightforward using standard VPC APIs. The next generation of OpenSearch Serverless also launches with native integrations with AI development platforms including <a href=\"https://vercel.com/changelog/amazon-opensearch-serverless-is-now-available-in-the-vercel-marketplace\" rel=\"noopener noreferrer\" target=\"_blank\">Vercel</a> and <a href=\"https://kiro.dev/launch/powers/add/?name=opensearch-launchpad\" rel=\"noopener noreferrer\" target=\"_blank\">Kiro</a>, enabling developers to provision search infrastructure directly from their development environment using natural language commands. OpenSearch Serverless is now also part of <a href=\"https://github.com/opensearch-project/opensearch-agent-skills\" rel=\"noopener noreferrer\" target=\"_blank\">OpenSearch Agent Skills</a> that allows you to bring OpenSearch capabilities to your agents when using popular coding platfroms like Claude Code, Cursor and Codex.<br /> <br /> At GA, search and vector are the two available collection types. The next generation of OpenSearch Serverless is available today in all commercial AWS regions where Amazon OpenSearch Serverless is currently <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">available</a>. For pricing details about the next generation of OpenSearch Serverless, visit the <a href=\"https://aws.amazon.com/opensearch-service/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>.<br /> <br /> To learn more about the next generation of Amazon OpenSearch Serverless, see the <a href=\"https://aws.amazon.com/opensearch-service/features/serverless/\" rel=\"noopener noreferrer\" target=\"_blank\">marketing page</a>, <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-create.html\" rel=\"noopener noreferrer\" target=\"_blank\">technical documentation</a> and <a href=\"https://aws.amazon.com/blogs/aws/introducing-the-next-generation-of-amazon-opensearch-serverless-for-building-your-agentic-ai-applications\" rel=\"noopener noreferrer\" target=\"_blank\">AWS News Blog</a>. You can get started by visiting the technical <a href=\"https://aws.amazon.com/blogs/big-data/the-next-generation-of-amazon-opensearch-serverless-built-from-the-ground-up-for-agents/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog</a> that details all the new features launching in the next generation of Amazon OpenSearch Serverless.</p>"
  "9bc722085740c0d5bcf53f8a5c9f64b8":
    "id": "9bc722085740c0d5bcf53f8a5c9f64b8"
    "title": "AWS IoT Core adds APIs for MQTT connection management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-iot-core-apis-mqtt/"
    "published": "2026-05-29 05:30:00"
    "fetched": "2026-05-29 08:12:22"
    "summary": "<p>Today, <a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> launches two new MQTT connection management APIs, GetConnection and ListSubscriptions, enabling you to easily access MQTT client connection and subscription information for your Internet of Things (IoT) devices. These APIs help you troubleshoot connectivity issues, monitor client behavior, and audit connection patterns across your device fleet.<br /> <br /> The <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/mqtt.html#get-connection-api\">GetConnection API </a>gives you visibility into an IoT device connection by retrieving detailed connection information, including connection status, MQTT session details, and optional socket-level data such as source and target IP addresses, ports, and client VPC endpoint ID, controlled via granular IAM policies. The<a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/mqtt.html#list-subscriptions-api\"> ListSubscriptions API</a> complements this by returning all topic subscriptions, including QoS levels for a client’s MQTT session, for connected and offline clients with persistent sessions. This enables you to validate and identify overlapping or unnecessary subscriptions that may impact solution performance. Together with the existing DeleteConnection API, these new APIs provide a comprehensive MQTT connection management experience.</p> \n<p>These APIs are now available in all AWS <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">regions</a> where AWS IoT Core is supported. To learn more, visit the AWS IoT Core&nbsp;<a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/mqtt.html#get-connection-api\">documentation</a>&nbsp;and AWS IoT Core API <a href=\"https://docs.aws.amazon.com/iot/latest/apireference/Welcome.html\">reference</a> guide.</p>"
  "f5d9a4d31db8334a4d7146785a32ac14":
    "id": "f5d9a4d31db8334a4d7146785a32ac14"
    "title": "AWS announces general availability of the next generation of AWS Resilience Hub"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-announces-next-gen-aws-resilience-hub/"
    "published": "2026-05-29 01:00:00"
    "fetched": "2026-05-29 08:12:22"
    "summary": "<p>Today, AWS announces the general availability of the next generation of AWS Resilience Hub, a central location in the AWS console that helps platform engineering and site reliability teams assess and strengthen the resilience of their critical workloads running on AWS. This new update expands on AWS Resilience Hub’s existing experience for meeting resilience objectives by introducing a new application model, dependency discovery, generative AI-powered failure mode analysis, modular resilience policies, and organization-wide reporting.</p> \n<p>With the next generation of Resilience Hub, teams model applications using a three-level hierarchy — systems, user journeys, and services — that reflects how these applications deliver business value. Through dependency discovery assessments, maintain up-to-date visibility into the AWS services, internal endpoints, and third-party endpoints that your services rely on. A generative AI-powered failure mode assessment analyzes your services against AWS Well-Architected&nbsp;best practices, the AWS Resilience Analysis Framework, and the organization's resilience policies, generating prioritized, actionable recommendations. AWS Organizations integration enables central teams to define resilience policies and monitor posture across all accounts and regions from a single dashboard.</p> \n<p>The next generation of the AWS Resilience Hub is available in all AWS Regions where Resilience Hub is offered.&nbsp;For more information about the AWS Regions where AWS Resilience Hub is available, see the <a href=\"https://aws.amazon.com//about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Region</a> table.</p> \n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/resiliencehub/v2/home\" rel=\"noopener noreferrer\" target=\"_blank\">AWS console</a>. To learn more about the next generation of AWS Resilience Hub, see the <a href=\"https://aws.amazon.com/resilience-hub/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>, or visit the <a href=\"https://aws.amazon.com/blogs/aws/introducing-the-next-generation-of-aws-resilience-hub-for-generative-ai-based-sre-resilience-journey/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS News Blog</a>.&nbsp;</p> \n<p>Existing AWS Resilience Hub customers can continue using their current experience and adopt the next generation of AWS Resilience Hub at their own pace. For guidance, see the <a href=\"https://docs.aws.amazon.com/resilience-hub/latest/userguide/next-gen-migrating.html\" rel=\"noopener noreferrer\" target=\"_blank\">migration user guide</a>.</p>"
  "336c02d708a55c873d68cd486dd78212":
    "id": "336c02d708a55c873d68cd486dd78212"
    "title": "Amazon WorkSpaces Applications adds support for Windows Desktop OS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-workspaces-applications-windows-desktop-OS/"
    "published": "2026-05-29 00:00:00"
    "fetched": "2026-05-29 08:12:22"
    "summary": "<p>Amazon WorkSpaces Applications now supports the ability to set up streaming resources powered by Windows Desktop operating systems using Bring Your Own License (BYOL). Customers can now bring their existing Windows Desktop licenses to support their eligible Microsoft 365 Apps for enterprise, delivering a consistent and familiar desktop experience as users move between on-premises and virtual desktop environments.<br /> <br /> With BYOL support on WorkSpaces Applications, the operating system is hosted on hardware dedicated to the customer's AWS account, enabling customers to stream Windows desktop applications and full desktop experiences at scale. Customers benefit from cost savings by bringing their existing Windows Desktop OS licenses, eliminating OS fees so they only pay for compute and streaming infrastructure.&nbsp;When the local device and the streaming session both run the same Windows Desktop OS, users apply the same workflows, shortcuts, and navigation in both environments. This removes the cognitive overhead of adapting to a different desktop experience when switching between local and remote work, reducing onboarding time.<br /> <br /> Windows Desktop for WorkSpaces Applications is available in multiple AWS Regions. For the list of supported regions, see <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/byol-windows-images.html\">Amazon WorkSpaces Applications BYOL documentation</a>.<br /> <br /> To take advantage of BYOL on WorkSpaces Applications, organizations must meet Microsoft's licensing requirements and commit to running a minimum number of streaming resources in a given AWS Region each month. To learn more about eligibility requirements and getting started, see the <a href=\"https://docs.aws.amazon.com/appstream2/\">Amazon WorkSpaces Applications&nbsp;documentation</a> and&nbsp;<a href=\"https://aws.amazon.com/windows/faq/\">FAQs</a>.</p>"
  "ec4e2eb380bb978fba3ce4c931695ec3":
    "id": "ec4e2eb380bb978fba3ce4c931695ec3"
    "title": "Amazon S3 Tables are now available in two additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-s3-tables-aws-regions/"
    "published": "2026-05-29 13:00:00"
    "fetched": "2026-05-30 02:33:06"
    "summary": "<p>Amazon S3 Tables are now available in the Asia Pacific (Taipei) and Asia Pacific (New Zealand) Regions.</p> \n<p>Amazon S3 Tables deliver the first cloud object store with built-in Apache Iceberg support, streamlining tabular data storage at scale. S3 Tables automatically perform continual table maintenance to optimize query efficiency and reduce storage costs as your data lake grows and evolves. Because S3 Tables support the Apache Iceberg standard, your data is easily queryable by both AWS and third-party engines. With the Intelligent-Tiering storage class, S3 Tables automatically manage costs based on access patterns with no performance impact or operational overhead.</p> \n<p>For more information about the AWS Regions where S3 Tables are available, see <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-regions-quotas.html#s3-tables-regions\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables AWS Regions and endpoints</a>.</p> \n<p>To learn more, see the following resources:</p> \n<ul> \n <li><a href=\"https://aws.amazon.com/s3/features/tables/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 Tables</a></li> \n <li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html\" rel=\"noopener noreferrer\" target=\"_blank\">Working with Amazon S3 Tables and table buckets</a></li> \n <li><a href=\"https://aws.amazon.com/s3/pricing/?nc=sn&amp;loc=4\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables pricing</a></li> \n</ul>"
  "fd5ff28b6b44069cf49b71931f5e3e73":
    "id": "fd5ff28b6b44069cf49b71931f5e3e73"
    "title": "Amazon RDS for Oracle now supports April 2026 Release Update and Supplemental Patch Bundle"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-rds-oracle-supports-april-2026-release-update-supplemental-patch-bundle"
    "published": "2026-05-29 16:49:00"
    "fetched": "2026-05-30 05:17:36"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> now supports the <a href=\"https://www.oracle.com/security-alerts/cpuapr2026.html#AppendixDB\" target=\"_blank\">Oracle April 2026 Release Update</a> (RU) for Oracle Database versions 19c and 21c, and the corresponding Supplemental Patch Bundle for Oracle Database version 19c. We recommend upgrading to the April 2026 RU as it includes security updates for Oracle database products. <br /> <br /> Starting with April 2026 releases, the Oracle Spatial Patch Bundle has been renamed to Supplemental Patch Bundle (SPB). The SPB includes additional database patches recommended by Oracle for specific use cases, such as Oracle Spatial, Oracle Data Pump, and Oracle GoldenGate.<br /> <br /> You can apply the April 2026 RU from the Amazon RDS Management Console, or by using the AWS SDK or CLI. To automatically apply updates to your database instance during your maintenance window, enable Automatic Minor Version Upgrade. You can apply the Supplemental Patch Bundle update for new database instances, or upgrade existing instances to engine version '19.0.0.0.ru-2026-04.spb-1.r1' by selecting the \"Supplemental Patch Bundle Engine Versions\" checkbox in the AWS Console. <br /> <br /> You can also use AWS Organizations upgrade rollout policy to stagger automatic minor version upgrades for your Amazon RDS database instances. This feature allows you to automatically apply updates to non-production environments, validate the updates, and then automatically apply the same update to production environments. For additional details about using AWS Organizations upgrade rollout policy for automatic minor version upgrades, refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Oracle.Minor.html#oracle-minor-version-upgrade-rollout\" target=\"_blank\">Amazon RDS for Oracle documentation</a> . </p>"
  "7777aaac59ed5280b9b815ccb6d537f3":
    "id": "7777aaac59ed5280b9b815ccb6d537f3"
    "title": "Oracle Database@AWS is now available in twenty AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/oracle-database-aws-available-twenty-regions/"
    "published": "2026-05-29 16:00:00"
    "fetched": "2026-05-30 05:17:36"
    "summary": "<p>Oracle Database@AWS is now generally available in eight additional AWS Regions: EU-Central-2 (Zurich), EU-South-1 (Milan), EU-South-2 (Spain), EU-West-3 (Paris), AP-Northeast-3 (Osaka), AP-Southeast-1 (Singapore), AP-Southeast-4 (Melbourne) and SA-East-1 (Sao Paulo). Oracle Database@AWS enables customers to access Oracle Cloud Infrastructure (OCI) managed Oracle Exadata systems within AWS data centers. With this launch, customers in Europe, South America, and Asia Pacific with in-region data residency requirements can migrate on-premises Oracle Exadata and Oracle Real Application Clusters (RAC) applications to AWS.<br /> <br /> With this expansion, Oracle Database@AWS services are now available in twenty Regions: US-East-1 (N. Virginia), US-West-2 (Oregon), US-East-2 (Ohio), CA-Central-1 (Canada Central), SA-East-1 (Sao Paulo), EU-Central-1 (Frankfurt), EU-West-1 (Dublin), EU-West-2 (London), EU-Central-2 (Zurich), EU-South-1 (Milan), EU-South-2 (Spain), EU-West-3 (Paris), AP-Northeast-1 (Tokyo), AP-Northeast-3 (Osaka), AP-Southeast-1 (Singapore), AP-Southeast-2 (Sydney), AP-Southeast-4 (Melbourne), AP-South-1 (Mumbai), AP-South-2 (Hyderabad), and AP-Northeast-2 (Seoul). To use Oracle Database@AWS services, request a <a href=\"https://aws.amazon.com/marketplace/pp/prodview-qks5dl3hr7nfw?sr=0-1&amp;ref_=beagle&amp;applicationId=AWSMPContessa\" rel=\"noopener noreferrer\" target=\"_blank\"><u>private offer from Oracle through the AWS Marketplace</u></a>, and use AWS Management Console to setup your databases.<br /> <br /> To learn more, visit Oracle Database@AWS <a href=\"https://aws.amazon.com/marketplace/featured-seller/oracle\" rel=\"noopener noreferrer\" target=\"_blank\">overview </a>and <a href=\"https://docs.aws.amazon.com/odb/latest/UserGuide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>documentation</u></a>.</p>"
  "3038c51c715c322b7f47d0d05ac29d93":
    "id": "3038c51c715c322b7f47d0d05ac29d93"
    "title": "Amazon CloudWatch now supports querying metrics data up to two weeks old"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-mi-extended-retention-region-expansion"
    "published": "2026-05-29 11:00:00"
    "fetched": "2026-06-04 01:40:49"
    "summary": "<p>Amazon CloudWatch now allows you to query metrics data up to two weeks in the past using the Metrics Insights query source. CloudWatch Metrics Insights offers fast, flexible, SQL-based queries. This new capability allows you to display, aggregate, or slice and dice metrics data older than 3 hours, for enhanced visualization and investigation.<br /> <br /> Previously, when creating dashboards and alarms to monitor dynamic groups of metrics over your resources and applications, you could visualize up to 3 hours of data when using Metrics Insights SQL queries. This enhancement helps you identify trends and investigate impact for a longer period of time, even days after an event. This extended query time range helps improve the operational health of teams and ensures impacts are never missed.<br /> <br /> Querying metrics data up to two weeks old with Metrics Insights is now available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions.<br /> <br /> The ability to query metrics data up to 2 weeks old is automatically available at no additional cost. Standard pricing applies for alarms, dashboards or API usage on Metrics Insights, see <a href=\"https://www.amazonaws.com/en/cloudwatch/pricing/\" target=\"_blank\">CloudWatch pricing</a> for details. To learn more about metrics queries with Metrics Insights, visit the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/query_with_cloudwatch-metrics-insights.html\" target=\"_blank\">CloudWatch documentation</a>.</p>"
"last_updated": "2026-06-04 01:40:49 JST"
