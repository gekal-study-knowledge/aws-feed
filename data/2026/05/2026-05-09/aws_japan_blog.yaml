    "title": "Build with Kiro: コミュニティハブと Kiro Labs のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-community-and-labs/"
    "published": "2026-05-09 15:38:14"
    "fetched": "2026-05-09 16:03:57"
    "summary": "Kiro コミュニティは、日々新たなものを生み出し続けています。境界を押し広げるハッカソンプロジェクトから、カスタムフック、創造的なエージェントワークフロー、そして SNS や Discord で共有される MCP インテグレーションまで、皆さんは私たちの想像を超える場所へ Kiro を連れて行ってくれました。Amazon 社内でも同じ現象が起きています。多様なバックグラウンドを持つビルダーたちが、私たちの予想を超える形で Kiro を最大限に活用するワークフロー、インターフェイス、ツールをカスタマイズしています。そして今、私たちはこれらすべてにふさわしい拠点を用意しました。"
