  "0c40b7a19c3dd15ca1d20974de38b796":
    "id": "0c40b7a19c3dd15ca1d20974de38b796"
    "title": "Amazon Route 53 Global Resolver now lets you add and remove AWS Regions for anycast DNS resolution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-route-global-resolver-aws/"
    "published": "2026-05-09 02:43:00"
    "fetched": "2026-05-09 04:12:17"
    "summary": "<p>Amazon Route 53 Global Resolver now lets you add and remove AWS Regions for anycast DNS resolution, giving you flexible control over where your DNS queries are resolved. This allows you to easily expand Global Resolver coverage as your organization grows or adjust regional deployment to meet compliance requirements.<br /> <br /> Global Resolver provides anycast DNS resolution for public internet domains and private Route 53 hosted zones from any location, along with DNS query filtering and centralized logging. With this update, you can dynamically adjust which AWS Regions participate in anycast resolution without recreating your Global Resolver configuration.<br /> <br /> This capability is available at no additional cost in all AWS Regions where Route 53 Global Resolver is supported. To get started, see the Route 53 Global Resolver <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-what-is-global-resolver.html\" target=\"_blank\">documentation</a>. For regional availability, see the Route 53 Global Resolver Region <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-what-is-global-resolver.html#regions\" target=\"_blank\">list</a>. For pricing, see Amazon Route 53 <a href=\"https://aws.amazon.com/route53/pricing/\" target=\"_blank\">pricing</a>.</p>"
  "1455367e8bbc7b5a6767a00b1cf20697":
    "id": "1455367e8bbc7b5a6767a00b1cf20697"
    "title": "AWS Service Catalog is now available in the AWS Asia Pacific (New Zealand) and Canada West (Calgary) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-service-catalog-calgary-new-zealand-regions/"
    "published": "2026-05-09 01:43:00"
    "fetched": "2026-05-09 04:12:17"
    "summary": "<p>AWS Service Catalog is now available to customers in two additional AWS Regions: Asia Pacific (New Zealand) and Canada West (Calgary).<br /> <br /> AWS Service Catalog enables customers to create, govern, and distribute a catalog of approved Infrastructure as Code (IaC) products for deployment on AWS. Administrators define products using AWS CloudFormation or other IaC tools such as Terraform. A product is a set of AWS resources that can range from a single compute instance to a fully configured multi-tier application. Customers can share portfolios of approved products across AWS accounts and organizational units through AWS Organizations, giving engineers, database administrators, data scientists, and other end-users consistent self-service access to governed AWS resources across their organization.<br /> <br /> With AWS Service Catalog, organizations can apply launch and template constraints to govern how products are provisioned, manage product versions as they evolve, and control access by individual, group, or cost center using AWS Identity and Access Management (IAM). AWS Service Catalog is used by enterprises, system integrators, and managed service providers to organize, govern, and provision resources on AWS at scale.<br /> <br /> For more information, please visit the&nbsp;<a href=\"https://aws.amazon.com/servicecatalog/\">AWS Service Catalog product page</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/servicecatalog/\">documentation</a>. See the&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region Table</a>&nbsp;for complete regional availability.</p>"
  "4028a4eb573c9c4de2fa8c3a49382337":
    "id": "4028a4eb573c9c4de2fa8c3a49382337"
    "title": "AWS Client VPN now supports Ubuntu OS version 26.04 LTS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-client-vpn-ubuntu-26/"
    "published": "2026-05-09 07:39:00"
    "fetched": "2026-05-09 13:20:24"
    "summary": "<p>AWS Client VPN now supports Linux desktop client with Ubuntu versions 26.04 LTS. You can now run the AWS supplied VPN client on the latest Ubuntu OS versions. AWS Client VPN desktop clients are available free of charge, and can be downloaded<a href=\"https://aws.amazon.com/vpn/client-vpn-download/\"> here.</a><br /> <br /> AWS Client VPN is a managed service that securely connects your remote workforce to AWS or on-premises networks. It supports desktop clients for MacOS, Windows, and Ubuntu-Linux. With this release, CVPN now supports the latest version of Ubuntu client - 26.04 LTS, along with 22.04 and 24.04. It already support Mac OS version Sonoma 14.0,, Sequoia 15.0, and Tahoe 26.0, and Windows 11. Client also supports ARM64 for MacOS and Windows.</p> \n<p>This client version is available in all regions where AWS Client VPN is generally available with no additional cost.<br /> <br /> To learn more about Client VPN:<br /> </p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a></li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html\">documentation</a></li> \n</ul>"
  "987f1f8d06e9dee919dc082fb726ee12":
    "id": "987f1f8d06e9dee919dc082fb726ee12"
    "title": "Amazon Connect adds default Step-by-Step Guides for After Contact Work"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-adds-default-step-by-step-guides-for-after-contact-work"
    "published": "2026-05-09 05:12:00"
    "fetched": "2026-05-09 13:20:24"
    "summary": "<p>Amazon Connect now supports Default Guides for After Contact Work (ACW), enabling contact center administrators to automatically launch a Step-by-Step Guide when an agent enters the ACW state without any manual work.&nbsp;</p> \n<p>This capability helps contact centers standardize post-contact workflows and reduce handle time by ensuring agents are automatically guided through required wrap-up tasks, such as logging disposition codes, updating cases, or completing follow-up actions. By&nbsp;eliminating&nbsp;the need for agents to manually&nbsp;navigate to&nbsp;the correct&nbsp;application&nbsp;during ACW, organizations can improve consistency, reduce errors, and accelerate agent productivity across their contact center operations.</p> \n<p>&nbsp;To learn more and get started, visit the Amazon Connect&nbsp;<a href=\"https://aws.amazon.com/connect/agent-workspace/\">webpage</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agent-workspace.html\">documentation.</a></p>"
  "cc5a3209a4b894fef13eb16eb98d8712":
    "id": "cc5a3209a4b894fef13eb16eb98d8712"
    "title": "Amazon Quick now supports cross-account access for Amazon Athena data sources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-athena/"
    "published": "2026-05-09 01:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Today, Amazon Quick is announcing cross-account access for Amazon Athena data sources. This launch enables you to query Athena data&nbsp;residing&nbsp;in a different AWS account(s)&nbsp;from your Quick deployment using IAM role chaining, with Athena query costs billed to the account where the data lives.</p> \n<p>With this feature, administrators can create an Athena data source in Quick by specifying a&nbsp;RunAsRole&nbsp;in the Quick account and a&nbsp;ConsumerAccountRoleArn&nbsp;in the target account where Athena resources&nbsp;reside. Quick uses a role chaining mechanism first assuming the&nbsp;RunAsRole, then chaining into the consumer account role to execute queries. This&nbsp;launch&nbsp;supports multiple roles per consumer account(s), enabling fine-grained access segregation across teams within a single account.&nbsp;&nbsp;</p> \n<p>This feature is now available in all supported Amazon Quick&nbsp;Sight regions&nbsp;<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" target=\"_blank\">here</a>. For more details, read our <a href=\"https://aws.amazon.com/blogs/machine-learning/from-siloed-data-to-unified-insights-cross-account-athena-access-for-amazon-quick/\" rel=\"noopener noreferrer\" target=\"_blank\">blog post</a>.</p>"
"last_updated": "2026-05-15 05:26:12 JST"
