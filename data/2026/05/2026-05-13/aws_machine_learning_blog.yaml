    "title": "Navigating EU AI Act requirements for LLM fine-tuning on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/navigating-eu-ai-act-requirements-for-llm-fine-tuning-on-amazon-sagemaker-ai/"
    "published": "2026-05-13 00:48:52"
    "fetched": "2026-05-13 02:07:27"
    "summary": "In this post, we show you how to set up FLOPs tracking during LLM fine-tuning using the open source Fine-Tuning FLOPs Meter toolkit on Amazon SageMaker AI. You learn how to determine your compliance status with a single configuration flag and generate audit-ready documentation."
