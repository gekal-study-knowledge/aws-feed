  "017458581ae6cf3da123d56e46938a71":
    "id": "017458581ae6cf3da123d56e46938a71"
    "title": "Amazon Redshift launches RG instances powered by AWS Graviton"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-redshift-rg-instances-powered-by-graviton"
    "published": "2026-05-13 01:00:00"
    "fetched": "2026-05-13 02:07:25"
    "summary": "<p>Amazon Redshift announces the general availability of <a href=\"https://aws.amazon.com/redshift/features/rg/\">RG instances</a>, a new generation of provisioned cluster nodes powered by AWS Graviton processors that deliver better performance, running data warehouse and data lake workloads up to 2.4x as fast as previous generation RA3 instances, at 30% lower price per vCPU. RG instances include Redshift's custom-built vectorized data lake query engine that processes Apache Iceberg and Parquet data on your cluster nodes — enabling you to run SQL analytics across your data warehouse and data lake using a single engine. This eliminates the need for Redshift Spectrum's separate scanning fleet and its associated per-terabyte charges.<br /> <br /> Whether you're running structured data warehouse workloads on Redshift Managed Storage or querying open-format data lake tables in Amazon S3, RG instances deliver significant performance improvements — up to 2.2x as fast as RA3 instances for data warehouse workloads, up to 2.4x as fast for Apache Iceberg queries, and up to 1.5x as fast for Parquet workloads. The natively built data lake engine features a purpose-built I/O subsystem with smart prefetch, NVMe caching, vectorized Parquet scans, and advanced file and partition-level pruning. Just-in-Time (JIT) Analyze delivers consistently fast queries without manual tuning — automatically collecting and updating table statistics as your data and workload patterns evolve. Intelligent NVMe caching keeps frequently accessed datasets close to compute, reducing round-trips to your data lake for faster response times on repeated queries. RG instances are available at launch in two instance sizes — rg.xlarge and rg.4xlarge. Existing RA3 clusters can migrate using Snapshot &amp; Restore, Elastic Resize, or Classic Resize. RG instances are available with flexible pricing options, including On-Demand, and 1-year and 3-year Reserved Instances with No Upfront payment. For pricing details, visit the <a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a>.</p> \n<p><br /> Amazon Redshift RG instances are now available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), US West (N. California), Canada (Central), South America (São Paulo), Europe (Ireland), Europe (Frankfurt), Europe (London), Europe (Paris), Europe (Stockholm), Europe (Milan), Europe (Spain), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Mumbai), Asia Pacific (Jakarta), Asia Pacific (Hong Kong), Asia Pacific (Osaka), Asia Pacific (Malaysia), Asia Pacific (Hyderabad), Asia Pacific (Taiwan), Asia Pacific (Melbourne), and Middle East (UAE).</p> \n<p>To get started, refer to the following resources:<br /> </p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html\">Amazon Redshift RG Instance Documentation</a></li> \n <li><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-considerations.html\">RA3 to RG Upgrade Guide</a></li> \n <li><a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift Pricing</a></li> \n</ul>"
  "51a6e8f649beedfc2efc75d0be53742a":
    "id": "51a6e8f649beedfc2efc75d0be53742a"
    "title": "Amazon EventBridge Scheduler adds 619 new SDK API actions, including Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-eventbridge-sdk-integrations/"
    "published": "2026-05-13 03:00:00"
    "fetched": "2026-05-13 04:45:14"
    "summary": "<p>Amazon EventBridge Scheduler expands its AWS SDK integrations with 13 additional services and 619 new API actions across new and existing AWS services, including AWS Lambda Managed Instances. You can now schedule direct invocations of a broader set of AWS services without writing custom integration code.<br /> <br /> EventBridge Scheduler is a serverless scheduler that allows you to create, run, and manage billions of scheduled events and tasks across more than 270 AWS services, without provisioning or managing the underlying infrastructure. With this expansion, you can now schedule a broader set of AWS API actions directly from Scheduler, including scaling Lambda managed instances up or down on a time-based schedule for precise control over capacity provisioning.<br /> <br /> These enhancements are now generally available in all AWS Regions where AWS EventBridge Scheduler is available. Specific services and API actions are subject to the availability of the target service in the AWS Region. To learn more about AWS EventBridge Scheduler SDK integrations, visit the <a href=\"https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html\">Developer Guide</a>.</p>"
  "b7ee3cebf90654fcef5be788fa5bdbb3":
    "id": "b7ee3cebf90654fcef5be788fa5bdbb3"
    "title": "Amazon SageMaker Feature Store now supports SageMaker Python SDK V3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-feature-store-pyv3/"
    "published": "2026-05-13 02:12:00"
    "fetched": "2026-05-13 04:45:14"
    "summary": "<p>Amazon SageMaker Feature Store now supports the SageMaker Python SDK v3, including new capabilities for Lake Formation access controls and Apache Iceberg table properties configuration. Feature Store is a fully managed repository to store, share, and manage features for machine learning models. Data scientists can now use the modern, modular SDK v3 interfaces to manage feature groups with fine-grained access control and optimized offline storage.<br /> <br /> Data scientists can use the SageMaker Python SDK v3 to manage feature groups with streamlined workflows and reduced boilerplate. With Lake Formation integration, data scientists can enforce column-level and row-level access control on offline store data through an opt-in setting at feature group creation. With Iceberg properties support, data scientists can configure additional table properties such as compaction and snapshot expiration directly through the SDK to optimize storage and query performance. These capabilities allow data scientists to govern access to feature data and optimize offline store performance from a single SDK without managing separate tools.<br /> <br /> These capabilities are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where<a href=\"https://aws.amazon.com/sagemaker/ai/feature-store/\"> Amazon SageMaker Feature Store</a> is available. To get started, install <a href=\"https://sagemaker.readthedocs.io/en/stable/\">SageMaker Python SDK v3.8.0</a> or later. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-lf-governance.html\">Lake Formation access controls </a>and<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-iceberg-metadata-management.html\"> Iceberg metadata management</a> documentation.</p>"
  "8bffd42cbc13882bdd659e15f82a4fbf":
    "id": "8bffd42cbc13882bdd659e15f82a4fbf"
    "title": "Karpenter now supports Amazon Application Recovery Controller zonal shift"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/karpenter-arc-zonal-shift/"
    "published": "2026-05-13 02:00:00"
    "fetched": "2026-05-13 04:45:14"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) now supports <a href=\"https://aws.amazon.com/application-recovery-controller/\">Amazon Application Recovery Controller</a> (ARC) zonal shift and zonal autoshift when using the <a href=\"https://karpenter.sh/\">open source Karpenter project</a> for compute provisioning. ARC helps you manage and coordinate recovery for your applications across AWS Regions and Availability Zones (AZs). With this launch, you can better maintain Kubernetes application availability by automating the process of shifting in-cluster network traffic away from an impaired AZ.<br /> <br /> Customers increasingly deploy highly available applications in Amazon EKS across multiple AZs to eliminate a single point of failure. With ARC zonal shift, you can temporarily mitigate an AZ impairment by redirecting in-cluster network traffic away from the impacted AZ. For a fully automated experience, authorize AWS to manage this on your behalf using ARC <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-autoshift.html\">zonal autoshift</a>, which includes practice runs to verify your cluster functions as expected with one less AZ. When a zonal shift is activated for your EKS cluster, Karpenter stops provisioning new capacity in the impaired AZ, halts voluntary disruptions such as consolidation and drift for nodes in that AZ, and prevents voluntary disruptions in healthy zones if they depend on scheduling pods to the impaired zone. Pods with strict scheduling requirements such as volume affinities that require the impaired zone will not trigger launch attempts. When the zonal shift expires or is canceled, Karpenter resumes normal operations.<br /> <br /> This Karpenter feature works with both manual zonal shifts and zonal autoshifts. No custom ARC resources are required as Karpenter integrates directly with the existing EKS cluster ARC resource. To enable zonal shift support, set the ENABLE_ZONAL_SHIFT setting in your Karpenter settings. To learn more, visit the <a href=\"https://karpenter.sh/docs/\">Karpenter documentation</a> and the <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html\">ARC zonal shift documentation</a>.</p>"
  "e7670a5358361c0128246ef094b0a8a0":
    "id": "e7670a5358361c0128246ef094b0a8a0"
    "title": "AWS Lambda supports scheduled scaling for functions on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-lambda-managed-instances/"
    "published": "2026-05-13 04:00:00"
    "fetched": "2026-05-13 07:56:55"
    "summary": "<p>AWS Lambda now supports scheduled scaling for functions running on Lambda Managed Instances, using Amazon EventBridge Scheduler. This capability allows you to define one-time or recurring schedules that proactively adjust your function's capacity limits ahead of expected traffic, to meet your performance targets during peak periods and avoid costs during idle periods.<br /> <br /> Lambda Managed Instances lets you run Lambda functions on managed Amazon EC2 instances with built-in routing, load balancing, and autoscaling. Capacity scales between your configured minimum and maximum execution environment limits based on traffic. Previously, customers with predictable traffic patterns, such as business-hours applications or marketing events, were required to manually adjust capacity limits ahead of known demand changes or build custom automation to manage scaling on a schedule. With scheduled scaling, you can now define schedules that proactively adjust your function’s capacity limits ahead of expected traffic. For example, you can schedule capacity limits to increase before business hours so execution environments are ready when the first requests arrive. You can also define a schedule that scales capacity to zero during idle periods (so you only pay when the function is actively serving traffic), and schedule it to scale back up before traffic returns.<br /> <br /> Scheduled scaling for functions running on Lambda Managed Instances is available in all AWS Regions where Lambda Managed Instances is supported. You can create schedules using the Amazon EventBridge Scheduler console, AWS CLI, AWS SDK, AWS CDK, or AWS CloudFormation. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-scaling.html#lambda-managed-instances-scheduled-scaling\">AWS Lambda Managed Instances documentation</a>, <a href=\"https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html\">Amazon EventBridge Scheduler documentation</a>, <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>, and <a href=\"https://aws.amazon.com/eventbridge/pricing/\">Amazon EventBridge pricing</a>.</p>"
  "07d3ee9cdd858f2e1ec99711f2809017":
    "id": "07d3ee9cdd858f2e1ec99711f2809017"
    "title": "Amazon CloudFront Premium flat-rate plan now supports configurable usage allowances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/cloudfront-configurable-premium-flat-rate-plans/"
    "published": "2026-05-13 01:00:00"
    "fetched": "2026-05-13 07:56:55"
    "summary": "<p style=\"text-align: left;\">Previously, the Amazon CloudFront Premium flat-rate plan supported a single usage allowance, and customers who outgrew it needed to contact us to discuss custom pricing options. Now, the Premium plan offers a range of self-service monthly usage levels ranging from 500 million to 6 billion requests and 50 TB to 600 TB, so customers can scale within the plan as their applications grow. Enterprises and mid-sized businesses whose baseline traffic previously made them ineligible for flat-rate plans can now adopt the Premium plan at a usage level that fits their application.</p> \n<p style=\"text-align: left;\">You select your Premium plan usage level in the CloudFront console, see your new monthly flat-rate price instantly, and can change your usage level at any time with no commitment required. All Premium plan features are included at every usage level. Flat-rate plans provide a single monthly price covering content delivery, AWS WAF and DDoS protection, bot management, Amazon Route 53 DNS, Amazon CloudWatch Logs ingestion, serverless edge compute, and Amazon S3 storage credits — with no overage charges.</p> \n<p style=\"text-align: left;\">To get started, visit the <a href=\"https://us-east-1.console.aws.amazon.com/cloudfront/v4/home\">CloudFront console</a>. To learn more, refer to the <a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/cloudfront-premium-flat-rate-plan-supports-configurable-usage-allowances/\">Launch Blog</a> or <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/flat-rate-pricing-plan.html#usage-allowance\">Amazon CloudFront Developer Guide</a>.</p>"
"last_updated": "2026-05-13 07:56:55 JST"
