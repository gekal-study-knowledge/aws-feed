    "summary": "Chronos-2は、Amazonが開発した時系列予測の基盤モデルです。従来の単変量予測に加え、多変量予測や共変量を活用した予測をゼロショットで実現します。コンテキスト内学習により、追加学習なしで多様な予測タスクに対応し、既存モデルを大幅に上回る性能を達成しました。"
