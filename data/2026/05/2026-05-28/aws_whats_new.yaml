  "c405e2ec7d78ad9ef2ce46025be3ef5f":
    "id": "c405e2ec7d78ad9ef2ce46025be3ef5f"
    "title": "Amazon SageMaker HyperPod Slurm clusters now support specifying minimum capacity requirements with continuous provisioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-hyperpod-mincount/"
    "published": "2026-05-28 00:06:00"
    "fetched": "2026-05-28 03:23:25"
    "summary": "<p>Amazon SageMaker HyperPod now supports minimum capacity requirements (MinCount) for clusters using Slurm orchestration with continuous provisioning. With <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-hyperpod-continuous-provisioning/\" rel=\"noopener noreferrer\" target=\"_blank\">continuous provisioning</a>, HyperPod provisions clusters with available partial capacity so you can start your AI/ML jobs quickly, while continuing to provision remaining instances asynchronously in the background. While this provides flexibility, some training workloads require a guaranteed minimum number of nodes before they can start effectively. MinCount lets you specify the minimum number of instances that must be successfully provisioned before an instance group transitions to InService status, giving you greater control over when your cluster becomes available for job scheduling.<br /> <br /> This is particularly useful for distributed training workloads using frameworks such as PyTorch FSDP, Megatron-LM, or NVIDIA NeMo, where training jobs are commonly configured with a fixed number of participating nodes and may not start efficiently or correctly with partial cluster capacity. It also benefits teams that need to guarantee a baseline GPU count to meet SLA or cost-efficiency targets before committing to a training run.<br /> <br /> You can specify MinInstanceCount in the CreateCluster or UpdateCluster API request to set a minimum capacity threshold for an instance group. The instance group remains in Creating or Updating status until the threshold is met, then transitions to InService and nodes become available for Slurm job scheduling. HyperPod continues launching additional instances beyond MinCount until the target count is reached. If MinCount cannot be satisfied within 3 hours, the system automatically rolls back the instance group to its last known good state.<br /> <br /> MinCount for Slurm clusters with continuous provisioning is available in all AWS Regions where Amazon SageMaker HyperPod is supported. To get started on specifying minimum capacity requirements for your cluster, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-scaling-slurm.html#sagemaker-hyperpod-scaling-slurm-mincount\" rel=\"noopener noreferrer\" target=\"_blank\">Minimum capacity requirements (MinCount)</a> in the Amazon SageMaker AI documentation.</p>"
  "a803db3aa141fe4fa1333a9cdf22371a":
    "id": "a803db3aa141fe4fa1333a9cdf22371a"
    "title": "Amazon Connect Customer now uses generative AI to automatically evaluate self-service interactions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-customer-gen-AI-evaluations-self-service"
    "published": "2026-05-28 02:00:00"
    "fetched": "2026-05-28 05:59:59"
    "summary": "<p>Amazon Connect Customer now enables managers to use generative AI to automatically evaluate self-service interactions, and get aggregated insights to help improve customer experience. Managers can define custom evaluation criteria in natural language within evaluation forms — such as \"Were all of the customer issues resolved by the AI agent?\" — which generative AI uses to help assess the quality of the self-service interaction. Connect provides detailed reasoning for the evaluation along with relevant reference points from the conversation transcript. Managers can review these insights in aggregate and on individual contacts, alongside self-service interaction recordings and transcripts, to identify opportunities to improve AI agent performance.</p> \n<p>This feature is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Europe (Frankfurt). To learn more, please visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/performance-evaluations-automated-interactions.html\">documentation</a> and our <a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>. For information about Amazon Connect Customer pricing, please visit our <a href=\"https://aws.amazon.com/products/connect/customer/pricing/?trk=758059ab-77e5-44fc-8a4a-1be845ee42b9&amp;sc_channel=ps\">pricing</a> page.</p>"
  "45d9848a3a9d9884746e39992a9dbd8f":
    "id": "45d9848a3a9d9884746e39992a9dbd8f"
    "title": "SageMaker Notebook Instances now support P5.4xl instance types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/g6-region-expansion-sagemaker-notebook-instances/"
    "published": "2026-05-28 05:30:00"
    "fetched": "2026-05-28 07:46:22"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P5.4xl instances on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p5/\">Amazon EC2 P5.4xl instances</a> are powered by NVIDIA H100 Tensor Core GPUs and deliver high performance in Amazon EC2 for deep learning (DL) and high performance computing (HPC) applications. They help you accelerate your time to solution by up to 4x compared to previous-generation GPU-based EC2 instances, and reduce cost to train ML models by up to 40%. Customers can use P5 instances for training and deploying complex large language models (LLMs) and diffusion models powering generative AI applications. These applications include question answering, code generation, video and image generation, and speech recognition.</p> \n<p>Amazon EC2 P5.4xl instances are available on SageMaker notebook instances in the AWS US East (N. Virginia and Ohio), US West (Oregon), Asia Pacific (Mumbai, Tokyo, Jakarta) and South America (São Paulo) regions.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "a11c7f9ab13e9f3e65f9f5beb2db5343":
    "id": "a11c7f9ab13e9f3e65f9f5beb2db5343"
    "title": "SageMaker Notebook Instances now support P5en.48xl instance types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/g6-region-expansion-sagemaker-notebook-instances/"
    "published": "2026-05-28 05:30:00"
    "fetched": "2026-05-28 07:46:22"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P5en.48xl instances on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p5/\">Amazon EC2 P5en instances</a> feature 8 H200 GPUs which have 1.7x GPU memory size and 1.4x GPU memory bandwidth than H100 GPUs featured in P5 instances. P5en instances pair the H200 GPUs with high performance custom 4<sup>th </sup>Generation Intel Xeon Scalable processors, enabling Gen5 PCIe between CPU and GPU which provides up to 4x the bandwidth between CPU and GPU and boosts AI training and inference performance. P5en, with up to 3200 Gbps of third generation of EFA using Nitro v5, shows up to 35% improvement in latency compared to P5 that uses the previous generation of EFA and Nitro. This helps improve collective communications performance for distributed training workloads such as deep learning, generative AI, real-time data processing, and high-performance computing (HPC) applications.</p> \n<p>Amazon EC2 P5en.48xl instances are available on SageMaker notebook instances in the AWS US East (N. Virginia and Ohio), US West (Oregon), and Asia Pacific (Tokyo) regions.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "76af77b5eca22df72b091e536790de4d":
    "id": "76af77b5eca22df72b091e536790de4d"
    "title": "Amazon EMR now supports Apache Spark 4.0.2 in general availability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-emr-apache-spark/"
    "published": "2026-05-28 05:17:00"
    "fetched": "2026-05-28 07:46:22"
    "summary": "<p>Amazon EMR now supports Apache Spark 4.0.2 across all three deployment models. With Spark 4.0.2, you can build and maintain data pipelines more easily with ANSI SQL and VARIANT data types, enforce fine-grained access control (FGAC) at the row level or column level, strengthen compliance and governance frameworks with Apache Iceberg v3 table format, and deploy new real-time applications faster with enhanced streaming capabilities.<br /> <br /> With Spark 4.0.2, you can build data pipelines, making data engineering accessible to a broader range of users through standard ANSI SQL support, eliminating the need to learn Spark-specific syntax. Spark 4.0.2 natively supports JSON and semi-structured data through VARIANT data types, providing flexibility for handling diverse data formats. You can enforce fine-grained access control (FGAC) on both read and write operations for AWS Lake Formation registered tables in your Apache Spark jobs. Building on these security capabilities, Apache Iceberg v3 table format provides stronger transaction guarantees and tracks data lineage, creating the audit trails required for regulatory compliance. Enhanced streaming controls simplify management of complex stateful operations and improve monitoring, enabling you to deploy real-time applications for fraud detection, personalization, and other time-sensitive use cases faster.</p> \n<p><br /> Apache Spark 4.0.2 is available in all regions where EMR is available. If you are upgrading your existing EMR application, you can use <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-upgrades.html\">Apache Spark upgrade agent</a> to accelerate your upgrades. To learn more about Apache Spark 4.0.2 on Amazon EMR, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark800-release.html\"></a><a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark800-release.html\"></a><a>Amazon EMR </a>release notes, or get started by creating an EMR application with Spark 4.0.2 from the <a href=\"https://console.aws.amazon.com/emr/serverless\">AWS Management Console</a>.</p>"
"last_updated": "2026-05-28 07:46:22 JST"
