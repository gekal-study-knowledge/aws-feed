    "fetched": "2026-05-28 08:58:21"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P5en.48xl instances on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p5/\">Amazon EC2 P5en instances</a> feature 8 H200 GPUs which have 1.7x GPU memory size and 1.4x GPU memory bandwidth than H100 GPUs featured in P5 instances. P5en instances pair the H200 GPUs with high performance custom 4<sup>th </sup>Generation Intel Xeon Scalable processors, enabling Gen5 PCIe between CPU and GPU which provides up to 4x the bandwidth between CPU and GPU and boosts AI training and inference performance. P5en, with up to 3200 Gbps of third generation of EFA using Nitro v5, shows up to 35% improvement in latency compared to P5 that uses the previous generation of EFA and Nitro. This helps improve collective communications performance for distributed training workloads such as deep learning, generative AI, real-time data processing, and high-performance computing (HPC) applications.</p> \n<p>Amazon EC2 P5en.48xl instances are available on SageMaker notebook instances in the AWS US East (N. Virginia and Ohio), US West (Oregon), and Asia Pacific (Tokyo) regions.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "bf5c24fed6c598af82e882bd10b9d648":
    "id": "bf5c24fed6c598af82e882bd10b9d648"
    "title": "AWS Glue large and memory optimized workers now available in Europe (Spain) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-glue-larger-memory-intensive-workers-spain"
    "published": "2026-05-28 05:10:00"
    "fetched": "2026-05-28 08:58:21"
    "summary": "<p>AWS Glue now offers large and memory-optimized workers in the AWS Europe (Spain) Region, giving customers in this region more power to handle complex data processing workloads. The new additions include two general compute workers (G.12X and G.16X) as well as four memory-optimized workers (R.1X, R.2X, R.4X, and R.8X). With these options, you can now tackle more complex transforms, aggregations, joins, and queries while processing higher volumes of data quickly using AWS Glue.<br /> <br /> The G.12X and G.16X workers extend the existing G worker lineup with additional compute, memory, and storage which makes them ideal for large, resource-intensive workloads. The R-series workers (R.1X, R.2X, R.4X, and R.8X) offer double the memory of their G counterparts, making them well-suited for memory-intensive Spark operations such as caching, shuffling, and aggregating. You can select any of these worker types through AWS Glue Studio, using <a href=\"https://docs.aws.amazon.com/glue/latest/dg/create-notebook-job.html\">notebooks</a> or <a href=\"https://docs.aws.amazon.com/glue/latest/dg/author-job-glue.html\">Visual ETL</a>, or programmatically via the Glue Job APIs.<br /> <br /> For more information on these worker types and AWS Regions where they are available, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/add-job.html\">AWS Glue documentation</a>.</p>"
  "f2cd24ee555c17f40c6a5de1a779d251":
    "id": "f2cd24ee555c17f40c6a5de1a779d251"
    "title": "Announcing Region Expansion of P6-B200 instances on SageMaker Notebook Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/p6-b200-region-expansion-sagemaker-notebook-instances/"
    "published": "2026-05-28 08:30:00"
    "fetched": "2026-05-28 13:03:56"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P6-B200 instances in AWS US East (N. Virginia) on SageMaker notebook instances.</p> \n<p><u><a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6-B200 instances</a></u> are powered by 8 NVIDIA Blackwell GPUs with 1440 GB of high-bandwidth GPU memory and 5th Generation Intel Xeon processors (Emerald Rapids). These instances deliver up to 2x better performance compared to P5en instances for AI training. Customers can use P6-B200 instances to interactively develop and fine-tune large foundation models, including LLMs, mixture of experts models, and multi-modal reasoning models. These instances enable efficient experimentation with larger models directly in JupyterLab or CodeEditor environments for generative AI applications such as enterprise copilots and content generation across text, images, and video.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "ba09649eec47ecea4af6798b44bdc019":
    "id": "ba09649eec47ecea4af6798b44bdc019"
    "title": "Amazon Bedrock expands support for Service Quotas"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/5/amazon-bedrock-service-quotas/"
    "published": "2026-05-28 06:41:00"
    "fetched": "2026-05-28 13:03:56"
    "summary": "<p>Amazon Bedrock is a fully managed service that provides secure, enterprise-grade access to high-performing foundation models from leading AI companies, enabling you to build and scale generative AI applications. Amazon Bedrock customers can now view inference quotas for the bedrock-mantle endpoint through AWS Service Quotas. This gives customers a familiar, consistent way to track limits for this endpoint, the same way they already do for the bedrock-runtime endpoint and other AWS services, and gives them clear visibility into the limits that apply to their workloads.<br /> <br /> The bedrock-mantle endpoint supports the OpenAI Responses API, OpenAI Chat Completions API, and the Anthropic Messages API, letting customers run existing OpenAI or Anthropic based applications on Amazon Bedrock with minimal code changes. AWS Service Quotas now exposes per-model input-tokens-per-minute and output-tokens-per-minute quotas for supported models on the endpoint.<br /> <br /> With this launch, customers gain visibility into how much limits they have on the bedrock-mantle endpoint and can proactively plan for production scale. To get started, open the AWS Service Quotas console, choose Amazon Bedrock, and search for \"Bedrock Mantle\" to view your current quotas. To request an increase to any of these quotas, follow the standard Amazon Bedrock limit increase process. Service Quotas support for the bedrock-mantle endpoint is available in all AWS Regions where the endpoint is offered: US East (N. Virginia, Ohio), US West (Oregon), Asia Pacific (Mumbai, Tokyo, Sydney, Jakarta), Europe (Frankfurt, Ireland, London, Milan, Stockholm), and South America (São Paulo). To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/quotas-mantle.html\">Quotas for Amazon Bedrock</a>.&nbsp;</p>"
  "42dce265bb8b24341631f676fd246403":
    "id": "42dce265bb8b24341631f676fd246403"
    "title": "Amazon Aurora MySQL now supports integration with Kiro Powers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-aurora-mysql-kiro-powers/"
    "published": "2026-05-28 00:00:00"
    "fetched": "2026-05-28 13:03:56"
    "summary": "<p>Today, AWS announces that Amazon Aurora MySQL-Compatible Edition now supports integration with <a href=\"https://kiro.dev/powers/\">Kiro Powers</a>, enabling developers to build Aurora MySQL-backed applications faster with AI agent assistance. Kiro Powers is a repository of curated and pre-packaged Model Context Protocol (MCP) servers, steering files, and hooks that have been validated by Kiro partners to accelerate specialized software development and deployment. This integration bundles direct database connectivity with Aurora MySQL best practices, providing developers with instant expertise in Aurora MySQL operations and schema design through natural language interactions.<br /> <br /> With this integration, developers can perform both data plane operations (database queries, table creation, schema management) and control plane operations (cluster creation and management) through conversational commands instead of complex syntax. The Kiro agent dynamically loads task-specific guidance for Aurora MySQL Serverless scaling, migration from RDS MySQL to Aurora MySQL, and replication configuration, ensuring developers receive only relevant context without information overload.<br /> <br /> This integration is available through one-click installation from the <a href=\"https://kiro.dev/\">Kiro IDE</a> and <a href=\"https://kiro.dev/web/\">Kiro webpage</a>, and can be used to create and manage database clusters in all AWS Regions where Aurora MySQL is available. For more information about development use cases, read this <a href=\"https://aws.amazon.com/blogs/database/guide-your-amazon-aurora-mysql-migration-with-kiro-powers\">blog post</a>. To learn more, explore the <a href=\"https://awslabs.github.io/mcp/servers/mysql-mcp-server\">Aurora MySQL MCP Server documentation</a>.<br /> <br /> Amazon Aurora is designed for unparalleled high performance and availability at global scale with full MySQL compatibility. It provides built-in security, continuous backups, serverless compute, up to 15 read replicas, automated multi-Region replication, and integrations with other AWS services. To get started with Amazon Aurora, take a look at our getting started page.</p>"
  "3347bba0287f00f7997f2ece23c4f7fe":
    "id": "3347bba0287f00f7997f2ece23c4f7fe"
    "title": "AWS Elemental Inference now supports Smart Subtitles for automated live captioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/elemental-inference-subtitles"
    "published": "2026-05-28 06:00:00"
    "fetched": "2026-05-29 01:51:59"
    "summary": "<p>AWS Elemental Inference now supports smart subtitles, a new AI-powered feature that automatically generates real-time subtitles for live video streams. Smart subtitles use advanced speech recognition to transcribe spoken audio and deliver Timed Text Markup Language (TTML)-formatted subtitles with low latency, helping broadcasters and streamers provide accessible content to viewers without manual captioning workflows or third-party services.</p> \n<p>With Smart subtitles, you can add live subtitling for content that is English (United States, Great Britain, and Australian), French, German, Italian, Portuguese, and Spanish to your broadcasts by enabling the feature through the native integration with AWS Elemental MediaLive. You can improve transcription accuracy for specialized content—such as sports commentary with athlete names or technical terminology—by creating custom dictionaries through the AWS Elemental Inference API or console. Smart subtitles work alongside existing Elemental Inference features like smart cropping for vertical video and clip generation, and you benefit from the same non-linear pricing that reduces per-feature costs when using multiple features simultaneously on the same content.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/elemental-inference/latest/userguide/what-is.html\">AWS Elemental Inference documentation</a>, <a href=\"https://docs.aws.amazon.com/medialive/latest/ug/elemental-inference-automatic-subtitling.html\">MediaLive documentation</a>,&nbsp;&nbsp;and the <a href=\"https://aws.amazon.com/elemental-inference/pricing/\">AWS Elemental Inference pricing page</a>.</p>"
  "0bca2594ccf93802aaaf20ecaf897ecc":
    "id": "0bca2594ccf93802aaaf20ecaf897ecc"
    "title": "AWS Partner Central now supports deal sizing using total contract value (TCV)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-partner-central-opportunity-deal-sizing-tcv/"
    "published": "2026-05-28 23:00:00"
    "fetched": "2026-05-29 04:34:08"
    "summary": "<p>Today, AWS announces an enhancement to the opportunity deal sizing capability in AWS Partner Central, by allowing Partners to estimate deals using total contract value (TCV). Partners can now submit the TCV from the deal with the customer, and deal sizing capability instantly converts the TCV to a forecasted monthly recurring revenue (MRR), eliminating manual MRR estimation so partners submit opportunities faster and with more accurate forecasts.<br /> <br /> When creating or updating opportunities, partners choose an MRR estimation method — Forecast MRR from TCV, Forecast MRR, AWS Pricing Calculator, or Manual entry. With Forecast MRR from TCV, partners enter the total contract value in USD or EUR and the contract duration in months, then review the forecasted MRR before submitting. The forecasted MRR improves pipeline accuracy, so partner sales teams accelerate deal velocity.<br /> <br /> Deal sizing using TCV is available in AWS Partner Central worldwide. The feature is accessible through both AWS Partner Central and the AWS Partner Central API for Selling, which is available in the US East (N. Virginia) Region.<br /> <br /> To get started, log in to <a href=\"https://aws.amazon.com/partners/partner-central/\">AWS Partner Central</a> in the console to create or update opportunities. To learn more about deal sizing, visit the <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/creating-opportunity.html\">Partner Central Sales Guide</a>. For API integration with your CRM system, see the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/welcome.html\">AWS Partner Central API Documentation</a>.</p>"
  "42d9664d8ff7086bf7f2cb32e65bf566":
    "id": "42d9664d8ff7086bf7f2cb32e65bf566"
    "title": "Announcing Region Expansion of P5.48xl instances on SageMaker Notebook Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/p5-48xl-region-expansion-sagemaker-notebook-instances/"
    "published": "2026-05-28 08:30:00"
    "fetched": "2026-05-29 04:34:08"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P5.48xl instances in Asia Pacific (Tokyo) on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p5/\">Amazon EC2 P5.48xl instances</a> are powered by NVIDIA H100 Tensor Core GPUs and deliver high performance in Amazon EC2 for deep learning (DL) and high performance computing (HPC) applications. They help you accelerate your time to solution by up to 4x compared to previous-generation GPU-based EC2 instances, and reduce cost to train ML models by up to 40%. Customers can use P5 instances for training and deploying complex large language models (LLMs) and diffusion models powering generative AI applications. These applications include question answering, code generation, video and image generation, and speech recognition.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
