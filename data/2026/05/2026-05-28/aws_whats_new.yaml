    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P4de instances in Asia Pacific (Tokyo) on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p4/\">Amazon EC2 P4de instances</a> are powered by 8 NVIDIA A100 GPUs with 80GB high-performance HBM2e GPU memory, 2X higher than the GPUs in our current P4d instances. The new P4de instances provide a total of 640GB of GPU memory, which provide up to 60% better ML training performance along with 20% lower cost to train when compared to P4d instances. The improved performance will allow customers to reduce model training times and accelerate time to market. Increased GPU memory on P4de will also benefit workloads that need to train on large datasets of high-resolution data.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "6f46274066521a5f8506b32cfb9f0314":
    "id": "6f46274066521a5f8506b32cfb9f0314"
    "title": "AWS IoT Core now supports direct messaging for point-to-point communication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-iot-core-direct-messaging/"
    "published": "2026-05-28 23:56:00"
    "fetched": "2026-05-29 08:12:22"
    "summary": "<p><a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> now supports the ability to send point-to-point messages to any connected device, providing better visibility into message delivery and lower messaging cost. AWS IoT Core is a fully managed service that securely connects IoT devices to the AWS cloud, and enables bi-directional messaging between IoT devices and cloud services.<br /> <br /> Previously, sending messages to a single IoT device required publishing to a topic subscribed by the device, with no built-in way to confirm delivery from the receiving device. With the <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/direct-messaging.html\">SendDirectMessage API</a>, you can send a message directly to any device connected to AWS IoT Core, and opt-in to receive delivery acknowledgement from the device. AWS IoT Core also uses the delivery acknowledgement to provide detailed API response codes and emit Amazon CloudWatch Logs, giving you visibility into message delivery status and failure reasons.<br /> <br /> Direct messaging is available in all AWS Regions where AWS IoT Core is available, including Amazon China and AWS GovCloud (US). To get started, see the direct messaging <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/direct-messaging.html\">developer guide</a>. For pricing details, visit the AWS IoT Core <a href=\"https://aws.amazon.com/iot-core/pricing/\">pricing page</a>.</p>"
  "a7c24d4722a28371b925b4827b5e3046":
    "id": "a7c24d4722a28371b925b4827b5e3046"
    "title": "Amazon Connect’s AI assistant is now available in the UI builder"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connects-ai-assistant-now-available-ui-builder"
    "published": "2026-05-28 22:51:00"
    "fetched": "2026-06-02 02:31:24"
    "summary": "<p>Amazon Connect Customer Assistant is now integrated within the UI builder, enabling contact center managers to create and modify views using natural language. Managers describe what they need, such as \"Create a feedback form with rating and comment fields,\" and the assistant generates the corresponding UI components for review before publishing. This reduces the time and expertise needed to build Views for Step-by-Step Guides and Workspace pages by up to 70%.</p> \n<p>Managers can use conversational prompts to create views, configure layouts with conditional UIs, set component properties, and apply styling without manual work. The assistant recommends components, explains options, and troubleshoots issues to accelerate builds.&nbsp;</p>"
"last_updated": "2026-06-02 02:31:24 JST"
