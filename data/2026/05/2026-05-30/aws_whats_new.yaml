  "a86345c067701fe859f052f835d02429":
    "id": "a86345c067701fe859f052f835d02429"
    "title": "AWS Shield Advanced introduces DDoS attack flow logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-shield-ddos/"
    "published": "2026-05-30 02:00:00"
    "fetched": "2026-05-30 02:33:06"
    "summary": "<p>AWS Shield Advanced announces distributed denial-of-service (DDoS) attack flow logs, giving you packet-level visibility into traffic hitting Shield Advanced protected resources during a DDoS attack. The log data is published to Amazon S3, Amazon CloudWatch Logs, or Amazon Data Firehose, for forensic analysis and compliance purposes.</p> \n<p>The DDoS attack flow logs, capture critical packet-level details, including source and destination IP addresses, ports, protocols, packet and byte counts, source country information, and others. The log data is automatically published to your chosen destination at 5-minute intervals during active attacks. Once published, you can retrieve and analyze your flow log data using your preferred analytics tools, enabling post-incident investigation, threat intelligence gathering, and compliance reporting. To enable flow logs, you must protect the resources with Shield Advanced, and configure log delivery based on your destination.</p> \n<p>The feature is avaialble in all regions where AWS Shield Advanced is available. To learn more about configuring and using DDoS attack flow logs, visit the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/ddos-viewing-events.html\" style=\"background-color: rgb(255,255,255);\">AWS Shield Advanced documentation</a>.</p>"
  "c3f5dd7462778befb5a9353e7476e623":
    "id": "c3f5dd7462778befb5a9353e7476e623"
    "title": "Amazon Connect Customer now supports scheduling tasks up to 90 days in advance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-customer-tasks-90day-schedule"
    "published": "2026-05-30 03:00:00"
    "fetched": "2026-05-30 05:17:36"
    "summary": "<p>Amazon Connect Customer now supports scheduling tasks up to 90 days in advance, helping organizations plan, route, and track long-running follow-up work. For example, an insurance team managing an auto repair claim can schedule future tasks for an adjuster visit, parts availability check, and repair completion follow-up, with each task routed to the right team at the right time with relevant claim context. You can schedule tasks using the StartTaskContact API, flows, or the agent workspace.</p> \n<p>This feature is available in all commercial and AWS GovCloud (US) regions where Amazon Connect Customer is offered. To learn more, see our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/tasks.html\">documentation</a>. To learn more about Connect Customer, visit the <a href=\"https://aws.amazon.com/products/connect/customer/\">Amazon Connect Customer website</a>.&nbsp;</p>"
  "b01172298141af879e8ac2655ff16660":
    "id": "b01172298141af879e8ac2655ff16660"
    "title": "AWS End User Messaging RCS for Business now available in 20 additional countries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-rcs-countries/"
    "published": "2026-05-30 05:23:00"
    "fetched": "2026-05-30 07:26:30"
    "summary": "<p> AWS End User Messaging now supports RCS for Business messaging in 20 additional countries, bringing the total to 22. Businesses can now send verified, branded RCS&nbsp;messages to customers in Austria, Brazil, Colombia, Czech Republic, Denmark, Dominican Republic, France, Germany, Guatemala, Italy, Mexico, Netherlands, Norway, Peru, Poland, Singapore, Slovakia, Spain, Sweden, and the United Kingdom, in addition to the United States and Canada.</p> \n<p>Customers can use the existing SendTextMessage API to send RCS messages to these countries with no application changes. Messages are delivered from a recognized<br /> business identity, and when a recipient's device does not support RCS, they automatically fall back to SMS for reliable delivery.</p> \n<p>RCS for Business is available in all AWS Regions where AWS End User Messaging is available. Pricing varies by destination country; see the <a href=\"https://aws.amazon.com/end-user-messaging/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS End User Messaging pricing page</a> for details.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/rcs-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">RCS for Business</a> in the AWS End User Messaging User Guide.</p>"
  "d3bbd0b87edfb693de33c735e1c1c01d":
    "id": "d3bbd0b87edfb693de33c735e1c1c01d"
    "title": "AWS Interconnect - multicloud now offers a free 500 Mbps tier"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-interconnect-multicloud-offers-free-500-mbps-tier"
    "published": "2026-05-30 00:00:00"
    "fetched": "2026-05-30 07:26:30"
    "summary": "<p>AWS Interconnect - multicloud now offers a free 500 Mbps multicloud Interconnect, making it easier to privately connect your workloads on AWS and other public clouds.</p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. With AWS Interconnect - multicloud, AWS simplified the way cloud services providers (CSPs) offer managed, highly-resilient, private connectivity for customers. The <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">specification that powers Interconnect is open</a> and already adopted by Google Cloud and Oracle Cloud Infrastructure (currently in Public Preview), with Microsoft Azure coming later in 2026.</p> \n<p>Today we are making it easier for customers to evaluate, test, and operate workloads between AWS and another CSP. The new Free Tier Interconnect gives customers a fully managed, 500 Mbps Interconnect to another CSP at no charge on the AWS side, with the same network path, facility, and device resiliency as our paid offering. The other CSP determines their pricing and charges independently of AWS for their side of the infrastructure. Please review the other CSP's pricing before creating your Interconnect.</p> \n<p>With a 500 Mbps Interconnect, you can transfer approximately 160 TB of data per month, enough to support significant multicloud workloads, data replication, or hybrid application architectures without incurring AWS Interconnect charges. To help customers monitor their network health and performance across clouds, each Free Tier multicloud Interconnect includes an Amazon CloudWatch Network Synthetic Monitor at no extra cost.</p> \n<p>The Free Tier is limited to one local (Tier 1) Interconnect per customer, per AWS Region to each CSP that is Generally Available with AWS and is subject to the AWS Service Terms.</p> \n<p>To get started, use the AWS Direct Connect Console and select AWS Interconnect<b> </b>from the navigation menu. To learn more, visit the <a href=\"https://docs.aws.amazon.com/interconnect/latest/userguide/what-is-interconnect.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Interconnect User Guide</a>.</p>"
  "9fbf0ed50169a06b74d734b35e093eb1":
    "id": "9fbf0ed50169a06b74d734b35e093eb1"
    "title": "Amazon Redshift Serverless now offers 4-RPU Minimum Capacity in 7 additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-redshift-serverless-4-rpu-seven-regions/"
    "published": "2026-05-30 00:00:00"
    "fetched": "2026-05-30 07:26:30"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> now allows you to get started with Amazon Redshift Serverless with a lower data warehouse <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-capacity.html\">base capacity configuration</a> of 4 Redshift Processing Units (RPUs) in the Asia Pacific (Hong Kong), Asia Pacific (Seoul), Canada (Central), Europe (London), South America (Sao Paulo), AWS GovCloud (US-East), and AWS GovCloud (US-West) regions. Amazon Redshift Serverless measures data warehouse capacity in RPUs. 1 RPU provides you 16 GB of memory. You pay only for the duration of workloads you run in RPU-hours on a per-second basis. Previously, the minimum base capacity required to run Amazon Redshift Serverless was 8 RPUs. You can start using Amazon Redshift Serverless for as low as $1.50 per hour and pay only for the compute capacity your data warehouse consumes when it is active. For predictable workloads, Amazon Redshift Serverless <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-billing-reserved.html#serverless-billing-reserved-works\">capacity reservations</a> with 1-year and 3-year terms provide additional price-performance benefits.<br /> <br /> Amazon Redshift Serverless enables users to run and scale analytics without managing data warehouse clusters. The new lower capacity configuration makes Amazon Redshift Serverless suitable for both production and development environments, particularly when workloads require minimal compute and memory resources. This entry-level configuration supports data warehouses with up to 32 TB of Redshift managed storage, offering a maximum of 100 columns per table and 64 GB of memory.<br /> <br /> To get started, see the Amazon Redshift Serverless <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html\">user documentation</a>, and <a href=\"https://docs.aws.amazon.com/redshift-serverless/latest/APIReference/Welcome.html\">API Reference</a>.</p>"
  "e8950944ff0247f5dce3583635b20456":
    "id": "e8950944ff0247f5dce3583635b20456"
    "title": "Amazon SES now offers inbox placement metrics and blocklist monitoring"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ses-global-deliverability/"
    "published": "2026-05-30 06:48:00"
    "fetched": "2026-05-30 09:05:48"
    "summary": "<p>Today, Amazon Simple Email Service&nbsp;(SES) launched a new set of deliverability features that help customers get more information about their outbound sending deliverability performance and reputation. Customers can now see the percentage of messages that are placed in recipient spam folders based on samples of industry data, as well as see when their domains and IPs are listed on public email sender block lists. This makes it easier for customers to optimize their sending content to maximize customer engagement.&nbsp;<br /> <br /> Previously, customers could use SES' Virtual Deliverability Manager to visualize the full end-to-end journey of email deliverability metrics. This included delivery rates, bounce rates of various types, as well as complaint, open and click rates. Customers did not have visibility into how many emails were placed in the spam folder, making it difficult to estimate how many emails were actually seen by recipients. Now, based on representative data sampled from the industry, customers can see inbox placement rates by sending domain and campaign. Customers can also pro-actively test candidate email content to estimate inbox placement rates at top mailbox providers before sending to any of their target recipients. Finally, customers get peripheral awareness and passive monitoring of industry blocklist activity, helping to identify when a reputation change may affect their ability to send emails to mailbox providers.<br /> <br /> SES supports inbox placement rates and blocklist monitoring in all <a href=\"https://docs.aws.amazon.com/general/latest/gr/ses.html\">AWS commercial regions</a> where SES is available.&nbsp;<br /> <br /> For more information, see the documentation for the <a href=\"https://docs.aws.amazon.com/ses/latest/dg/vdm-global-deliverability.html\">Virtual Deliverability Manager global deliverability</a>.</p>"
"last_updated": "2026-05-30 09:05:48 JST"
