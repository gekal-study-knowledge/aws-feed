    "title": "AWS Shield Advanced introduces DDoS attack flow logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-shield-ddos/"
    "published": "2026-05-30 02:00:00"
    "fetched": "2026-05-30 02:33:06"
    "summary": "<p>AWS Shield Advanced announces distributed denial-of-service (DDoS) attack flow logs, giving you packet-level visibility into traffic hitting Shield Advanced protected resources during a DDoS attack. The log data is published to Amazon S3, Amazon CloudWatch Logs, or Amazon Data Firehose, for forensic analysis and compliance purposes.</p> \n<p>The DDoS attack flow logs, capture critical packet-level details, including source and destination IP addresses, ports, protocols, packet and byte counts, source country information, and others. The log data is automatically published to your chosen destination at 5-minute intervals during active attacks. Once published, you can retrieve and analyze your flow log data using your preferred analytics tools, enabling post-incident investigation, threat intelligence gathering, and compliance reporting. To enable flow logs, you must protect the resources with Shield Advanced, and configure log delivery based on your destination.</p> \n<p>The feature is avaialble in all regions where AWS Shield Advanced is available. To learn more about configuring and using DDoS attack flow logs, visit the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/ddos-viewing-events.html\" style=\"background-color: rgb(255,255,255);\">AWS Shield Advanced documentation</a>.</p>"
  "c3f5dd7462778befb5a9353e7476e623":
    "id": "c3f5dd7462778befb5a9353e7476e623"
    "title": "Amazon Connect Customer now supports scheduling tasks up to 90 days in advance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-customer-tasks-90day-schedule"
    "published": "2026-05-30 03:00:00"
    "fetched": "2026-05-30 05:17:36"
    "summary": "<p>Amazon Connect Customer now supports scheduling tasks up to 90 days in advance, helping organizations plan, route, and track long-running follow-up work. For example, an insurance team managing an auto repair claim can schedule future tasks for an adjuster visit, parts availability check, and repair completion follow-up, with each task routed to the right team at the right time with relevant claim context. You can schedule tasks using the StartTaskContact API, flows, or the agent workspace.</p> \n<p>This feature is available in all commercial and AWS GovCloud (US) regions where Amazon Connect Customer is offered. To learn more, see our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/tasks.html\">documentation</a>. To learn more about Connect Customer, visit the <a href=\"https://aws.amazon.com/products/connect/customer/\">Amazon Connect Customer website</a>.&nbsp;</p>"
"last_updated": "2026-05-30 05:17:36 JST"
