    "title": "Amazon FSx for OpenZFS now supports creating Multi-AZ file systems in shared VPCs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-fsx-openzfs-multi-az-vpcs/"
    "published": "2026-05-14 04:00:00"
    "fetched": "2026-05-14 07:06:54"
    "summary": "<p>Amazon&nbsp;FSx&nbsp;for&nbsp;OpenZFS&nbsp;now&nbsp;allows&nbsp;you to create&nbsp;Multi-AZ&nbsp;file systems in&nbsp;shared&nbsp;VPCs&nbsp;within your AWS organization, making it easier for you&nbsp;to decentralize&nbsp;network and storage&nbsp;administration.</p> \n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html\">VPC&nbsp;sharing</a>&nbsp;is&nbsp;a feature that allows resource owners (\"owner accounts\") to share one or more VPC subnets with other accounts (\"participant accounts\") in their AWS organization. Participant accounts can then&nbsp;view, create,&nbsp;modify, delete, and&nbsp;manage their&nbsp;application resources in the subnets&nbsp;shared&nbsp;with them. Previously, participant accounts could create Single-AZ&nbsp;OpenZFS&nbsp;file systems in&nbsp;VPCs&nbsp;shared&nbsp;with&nbsp;them, but&nbsp;could only create&nbsp;Multi-AZ&nbsp;file&nbsp;systems in VPCs they owned.&nbsp;Starting today, participant accounts can create any&nbsp;FSx&nbsp;for&nbsp;OpenZFS&nbsp;file system in a&nbsp;shared&nbsp;VPC, allowing&nbsp;organizations&nbsp;to run&nbsp;highly available&nbsp;file systems with centralized network management.</p> \n<p>You can create Multi-AZ&nbsp;FSx&nbsp;for&nbsp;OpenZFS&nbsp;file systems from shared VPC participant accounts in&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?refid=bc0b1108-3dde-4bd6-8c6b-5bc65141884a\">all AWS Regions where Amazon&nbsp;FSx&nbsp;for&nbsp;OpenZFS&nbsp;is available</a>. To learn more, visit the&nbsp;FSx&nbsp;for&nbsp;<a href=\"https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/what-is-fsx.html\">OpenZFS&nbsp;documentation</a>&nbsp;and the&nbsp;<a href=\"https://aws.amazon.com/fsx/openzfs/\">FSx&nbsp;for&nbsp;OpenZFS&nbsp;product page</a>.</p>"
  "9508550b60e6422f41991e5e4f8b891c":
    "id": "9508550b60e6422f41991e5e4f8b891c"
    "title": "Amazon SageMaker Data Agent now available for IAM Identity Center domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-data-agent-idc/"
    "published": "2026-05-14 06:53:00"
    "fetched": "2026-05-14 11:47:46"
    "summary": "<p>Amazon SageMaker Data Agent is now available in SageMaker Unified Studio domains configured with IAM Identity Center. Data Agent extends its AI-powered capabilities to help data analysts and engineers streamline their analytics workflows across both SageMaker notebooks and Query Editor environments, eliminating the need to manually write complex SQL joins, aggregations, and Python code.<br /> <br /> With Data Agent, you can describe your analysis goals in plain English and receive working Python or SQL code tailored to your connected data sources, including Amazon Athena, Amazon Redshift, Amazon S3, and AWS Glue Data Catalog. The agent maintains conversational context across notebook cells, selected tables, and query history, proposing step-by-step plans before generating code. Use it to calculate quarterly revenue growth rates, generate visualizations, transform DataFrames, or optimize query performance—all through natural language interaction. The \"Fix with AI\" feature provides intelligent debugging by analyzing execution errors and suggesting corrections, accelerating your development cycle.<br /> <br /> This capability is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all commercial AWS Regions where Amazon SageMaker Unified Studio is supported</a>. To get started, navigate to a project in SageMaker Unified Studio, open a notebook or Query Editor, and select the Data Agent panel. To learn more, visit the <a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">Amazon SageMaker Unified Studio page</a> and refer to <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-agent-query-editor.html\">\"Use the SageMaker Data Agent\"</a> in the Amazon SageMaker Unified Studio User Guide.</p>"
"last_updated": "2026-05-14 11:47:46 JST"
