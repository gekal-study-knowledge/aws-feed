    "summary": "2026/4/20 – 4/24 に世界最大規模の産業向け展示会ハノーバーメッセが開催されました。AWS は今年も \"Built for Industrial AI\" というテーマを掲げ、フィジカル AI を筆頭に、AI とクラウドを活用し製造業の業務を変革するアイディアを提供しました。AWS の製造のリーダーである Ozgur から、\"産業 AI は大規模展開してこそ意味がある\"というメッセージを基調講演で語りました。"
