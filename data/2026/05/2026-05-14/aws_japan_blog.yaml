    "title": "Amazon Aurora スナップショットから Amazon Aurora DSQL へのデータ移行"
    "link": "https://aws.amazon.com/jp/blogs/news/migrating-data-from-an-amazon-aurora-snapshot-into-amazon-aurora-dsql/"
    "published": "2026-05-14 09:00:05"
    "fetched": "2026-05-14 11:47:47"
    "summary": "Amazon Aurora DSQL はサーバーレスの分散 SQL データベースで、データ移行には COPY コマンドや dataloader スクリプトが利用できますが、テーブル単位の処理しかできず、データ変換の手段もありません。本記事では AWS Glue を使い、Aurora PostgreSQL のスナップショットから Aurora DSQL へ、データ型変換や主キーの UUID 化を含めて移行する手順を紹介します。"
