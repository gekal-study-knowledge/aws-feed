    "fetched": "2026-05-12 01:30:02"
    "summary": "Amazon Quick helps turn your large enterprise data into fast and accurate AI-powered decisions. In this post, you will learn about five new capabilities of Amazon Quick that accelerate how data professionals deliver trusted AI-powered insights at enterprise scale."
  "df8190d7d01c63cec0bf9287045fdebb":
    "id": "df8190d7d01c63cec0bf9287045fdebb"
    "title": "Introducing Claude Platform on AWS: Anthropic’s native platform, through your AWS account"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-claude-platform-on-aws-anthropics-native-platform-through-your-aws-account/"
    "published": "2026-05-12 03:43:03"
    "fetched": "2026-05-12 03:55:08"
    "summary": "Today, we're excited to announce the general availability of Claude Platform on AWS. Claude Platform on AWS is a new service that gives customers direct access to Anthropic's native Claude Platform experience through their AWS account, with no separate credentials, contracts, or billing relationships required. AWS is the first cloud provider to offer access to the native Claude Platform experience. In this post, we explore how Claude Platform on AWS works and how you can start using it today."
  "b08c881524f04a7a646aa59678f377b7":
    "id": "b08c881524f04a7a646aa59678f377b7"
    "title": "Manufacturing intelligence with Amazon Nova Multimodal Embeddings"
    "link": "https://aws.amazon.com/blogs/machine-learning/manufacturing-intelligence-with-amazon-nova-multimodal-embeddings/"
    "published": "2026-05-12 02:08:24"
    "fetched": "2026-05-12 03:55:08"
    "summary": "In this post, we build a multimodal retrieval system for aerospace manufacturing documents using Amazon Nova Multimodal Embeddings on Amazon Bedrock and Amazon S3 Vectors. We evaluate the system on 26 manufacturing queries and compare generation quality between a text-only pipeline and the multimodal pipeline."
  "71c393f13c7629c076dbc6c399b6a29f":
