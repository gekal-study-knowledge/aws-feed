    "title": "3人月の開発を2日間で ─ 日立グループ初の AI-DLC 実践で得たリアルな手応え"
    "link": "https://aws.amazon.com/jp/blogs/news/3%E4%BA%BA%E6%9C%88%E3%81%AE%E9%96%8B%E7%99%BA%E3%82%922%E6%97%A5%E9%96%93%E3%81%A7-%E2%94%80-%E6%97%A5%E7%AB%8B%E3%82%B0%E3%83%AB%E3%83%BC%E3%83%97%E5%88%9D%E3%81%AE-ai-dlc-%E5%AE%9F%E8%B7%B5/"
    "published": "2026-05-12 03:23:01"
    "fetched": "2026-05-12 03:55:07"
    "summary": "株式会社日立産業制御ソリューションズ様が、11社合同「AI-DLC Unicorn Gym」に参加し、Kiroを活用したAI駆動開発ライフサイクル（AI-DLC）で従来3人月（約530時間）規模のIT資産・セキュリティデータ統合基盤を、わずか2日間（約70時間）で構築した実践事例をご紹介します。要件定義から設計・実装・デプロイまでの全工程をAI主導で進めた手応えと、エンジニアに求められる役割の変化について、現場のエンジニアによる寄稿でお届けします。"
