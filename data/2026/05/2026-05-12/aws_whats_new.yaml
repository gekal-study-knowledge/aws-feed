  "4e23a12847cb7299f0a6260f0ed36497":
    "id": "4e23a12847cb7299f0a6260f0ed36497"
    "title": "AWS HealthOmics now supports caching of cancelled workflow runs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-healthomics-caching-cancelled-runs/"
    "published": "2026-05-12 04:00:00"
    "fetched": "2026-05-12 05:45:13"
    "summary": "<p>AWS HealthOmics now supports caching completed task outputs of cancelled runs, enabling customers to reuse outputs and avoid recomputing previously completed tasks. When caching is enabled and a run is cancelled, HealthOmics automatically stores completed task outputs in the customer’s S3 bucket, allowing customers to restart runs from the point of cancellation. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p> \n<p>Caching of cancelled runs helps researchers, bioinformaticians, and workflow developers debug and iteratively develop workflows efficiently by storing intermediate files and completed task outputs for inspection. This saves customers the cost of recomputing completed tasks that may have taken hours and accelerates subsequent runs by executing only the remaining incomplete tasks.</p> \n<p>Caching cancelled runs is now available for Nextflow, WDL, and CWL runs in all AWS HealthOmics regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Singapore, Seoul). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/workflow-cache-startrun.html#workflow-cache-cancel\">workflow cache documentation</a>.&nbsp;</p>"
  "1e9fb1aa9aa063f7869e824a9a2e19a6":
    "id": "1e9fb1aa9aa063f7869e824a9a2e19a6"
    "title": "Announcing Region Expansion of G6e instances on SageMaker Studio notebooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/g6e-region-expansion-sagemaker-studio-notebooks/"
    "published": "2026-05-12 05:00:00"
    "fetched": "2026-05-12 07:03:37"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 G6e instances in the Middle East (Dubai), Asia Pacific (Tokyo, Seoul) and Europe (Frankfurt, Stockholm, Spain) on SageMaker Studio notebooks.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/g6e/\">Amazon EC2 G6e instances</a>&nbsp;are powered by up to 8 NVIDIA L40s Tensor Core GPUs with 48 GB of memory per GPU and third generation AMD EPYC processors. G6e instances deliver up to 2.5x better performance compared to EC2 G5 instances. Customers can use G6e instances to interactively test model deployment and for interactive model training use cases such as generative AI fine-tuning. You can use G6e instances to deploy large language models (LLMs) with up to 13B parameters and diffusion models for generating images, video, and audio.</p> \n<p>Visit developer guides for instructions on setting up and using&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\">JupyterLab</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\">CodeEditor</a>&nbsp;applications on&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\">SageMaker Studio</a>.&nbsp;For pricing information on these instances, please visit our&nbsp;<a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
  "5080abbe0dd808572d1e8b29103d2ee3":
    "id": "5080abbe0dd808572d1e8b29103d2ee3"
    "title": "Announcing Region Expansion of G6 instances on SageMaker Studio notebooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/g6-region-expansion-sagemaker-studio-notebooks/"
    "published": "2026-05-12 05:00:00"
    "fetched": "2026-05-12 07:03:37"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 G6 instances in the Middle East (Dubai) and Asia Pacific (Malaysia) on SageMaker Studio notebooks.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/g6/\">Amazon EC2 G6 instances</a>&nbsp;are powered by up to 8 NVIDIA L4 Tensor Core GPUs with 24 GB of memory per GPU and third generation AMD EPYC processors. G6 instances offer 2x better performance for deep learning inference compared to EC2 G4dn instances. Customers can use G6 instances to interactively test model deployment and for interactive model training for use cases such as generative AI fine-tuning and inference workloads, natural language processing, language translation, computer vision, and recommender engines.</p> \n<p>Visit developer guides for instructions on setting up and using&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\">JupyterLab</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\">CodeEditor</a>&nbsp;applications on&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\">SageMaker Studio</a>.&nbsp;For pricing information on these instances, please visit our&nbsp;<a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
  "df6f6dca3117be0e44d09bfa01b00de3":
    "id": "df6f6dca3117be0e44d09bfa01b00de3"
    "title": "Announcing Region Expansion of P4de instances on SageMaker Studio notebooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/p4de-region-expansion-sagemaker-studio-notebooks/"
    "published": "2026-05-12 05:00:00"
    "fetched": "2026-05-12 07:03:37"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P4de instances in Asia Pacific (Tokyo, Singapore) and Europe (Frankfurt) on SageMaker Studio notebooks.<br /> <br /> <a href=\"https://aws.amazon.com/ec2/instance-types/p4/\">Amazon EC2 P4de instances</a>&nbsp;are powered by 8 NVIDIA A100 GPUs with 80GB high-performance HBM2e GPU memory, 2X higher than the GPUs in our current P4d instances. The new P4de instances provide a total of 640GB of GPU memory, which provide up to 60% better ML training performance along with 20% lower cost to train when compared to P4d instances. The improved performance will allow customers to reduce model training times and accelerate time to market. Increased GPU memory on P4de will also benefit workloads that need to train on large datasets of high-resolution data.<br /> <br /> Visit developer guides for instructions on setting up and using&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\">JupyterLab</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\">CodeEditor</a>&nbsp;applications on&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\">SageMaker Studio</a>.&nbsp;For pricing information on these instances, please visit our&nbsp;<a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
  "9dfd5430ffc2c84120a478b91c4b3a59":
    "id": "9dfd5430ffc2c84120a478b91c4b3a59"
    "title": "Amazon Aurora DSQL is now available in five additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-aurora-dsql-five-additional-aws-regions/"
    "published": "2026-05-12 04:59:00"
    "fetched": "2026-05-12 07:03:37"
    "summary": "<p>Amazon Aurora DSQL single-Region clusters are now available in Asia Pacific (Hong Kong), Asia Pacific (Mumbai), Asia Pacific (Singapore), Europe (Stockholm), and South America (Sao Paulo). Aurora DSQL is the fastest serverless, distributed SQL database that enables you to build always available applications with virtually unlimited scalability, the highest availability, and zero infrastructure management. It is designed to make scaling and resilience effortless for your applications and offers the fastest distributed SQL reads and writes.<br /> <br /> With this launch, Aurora DSQL is available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Canada West (Calgary), Asia Pacific (Hong Kong), Asia Pacific (Melbourne), Asia Pacific (Mumbai), Asia Pacific (Osaka), Asia Pacific (Singapore), Asia Pacific (Sydney), , Asia Pacific (Tokyo), Asia Pacific (Seoul), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Paris), Europe (Stockholm), and South America (Sao Paulo).<br /> <br /> Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank&amp;all-free-tier.sort-order=asc&amp;awsf.Free%20Tier%20Types=*all&amp;awsf.Free%20Tier%20Categories=categories%23databases\">AWS Free Tier</a>. To learn more, visit the Aurora DSQL <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">documentation</a>.</p>"
  "9b700f6ce80332047f4aa92140527ec9":
    "id": "9b700f6ce80332047f4aa92140527ec9"
    "title": "Announcing Region Expansion of P6-B200 instances on SageMaker Studio notebooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/p6-b200-region-expansion-sagemaker-studio-notebooks/"
    "published": "2026-05-12 08:34:00"
    "fetched": "2026-05-12 11:40:20"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P6-B200 instances in AWS US East (N. Virginia) on SageMaker Studio notebooks.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6-B200 instances</a>&nbsp;are powered by 8 NVIDIA Blackwell GPUs with 1440 GB of high-bandwidth GPU memory and 5th Generation Intel Xeon processors (Emerald Rapids). These instances deliver up to 2x better performance compared to P5en instances for AI training. Customers can use P6-B200 instances to interactively develop and fine-tune large foundation models, including LLMs, mixture of experts models, and multi-modal reasoning models. These instances enable efficient experimentation with larger models directly in JupyterLab or CodeEditor environments for generative AI applications such as enterprise copilots and content generation across text, images, and video.</p> \n<p>Visit developer guides for instructions on setting up and using&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\">JupyterLab</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\">CodeEditor</a>&nbsp;applications on&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\">SageMaker Studio</a>.&nbsp;For pricing information on these instances, please visit our&nbsp;<a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
  "69dadfc3bdcfb8a7822eae2576db9e52":
    "id": "69dadfc3bdcfb8a7822eae2576db9e52"
    "title": "ENA Express for Amazon EC2 instances now supports traffic between Availability Zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/ena-express-availability-zones/"
    "published": "2026-05-12 05:00:00"
    "fetched": "2026-05-12 11:40:20"
    "summary": "<p>Elastic Network Adapter (ENA) Express now supports traffic between Amazon EC2 instances in different Availability Zones within a Region, delivering up to 25 Gbps single-flow bandwidth. ENA Express is a networking feature that uses the AWS Scalable Reliable Datagram (SRD) protocol to improve network performance. SRD is a reliable network protocol that delivers performance improvements through advanced congestion control and multi-pathing. Amazon Elastic Block Store (EBS) io2 Block Express and Elastic Fabric Adapter (EFA) for high performance computing and machine learning workloads also leverage SRD.</p> \n<p>Workloads such as distributed storage, databases, and file systems require deployments spanning multiple Availability Zones for resilience, yet single flows between zones support up to 5 Gbps with ENA. ENA Express delivers up to 25 Gbps single-flow bandwidth for traffic between Availability Zones.&nbsp;To achieve this, ENA Express detects compatibility between your EC2 instances and establishes an SRD connection when both communicating instances have ENA Express enabled. Once established, SRD uses multi-pathing to route your traffic across the network and avoids head-of-line blocking as it does not need packets to arrive in order.&nbsp;Using these capabilities, ENA Express delivers the performance benefits transparently to your application with TCP and UDP protocols.</p> \n<p>ENA Express for connections between Availability Zones within a Region is available for all supported instance types and sizes in Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Mumbai, New Zealand, Osaka, Seoul, Singapore, Sydney, Taipei, Thailand, Tokyo), Canada (Central), Canada West (Calgary), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), Israel (Tel Aviv), Mexico (Central), US East (N. Virginia, Ohio), US West (N. California, Oregon), and AWS GovCloud (US) Regions. ENA Express comes at no additional cost. For a list of supported instances and configuration guidance, please review the latest&nbsp;<a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ena-express.html\" style=\"background-color: rgb(255, 255, 255);\">EC2 documentation</a>.</p>"
  "dcb2c92da2a60754be75f0815d1badc9":
    "id": "dcb2c92da2a60754be75f0815d1badc9"
    "title": "Amazon SageMaker Unified Studio adds getting started tutorials and in-product release notes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/smus-getting-started"
    "published": "2026-05-12 02:12:00"
    "fetched": "2026-05-13 02:07:25"
    "summary": "<p>Amazon SageMaker Unified Studio now helps you get productive faster with getting started tutorials and a development environment appearance that automatically adapts to your system preference, and adds in-product release notes to help you discover new capabilities.<br /> <br /> On the homepage, a new getting started section helps you get productive in minutes by walking through core workflows such as running your first SQL query, analyzing data from a notebook, building a data pipeline with Visual ETL, and training an ML model. Each tutorial uses pre-loaded sample data and can be completed in under 10 minutes. The development environment now also defaults to match your operating system’s light or dark mode setting, so the interface matches your preference from your first sign-in. A new “What’s New” section surfaces recent feature announcements and release notes directly in the product, so you can stay informed about new capabilities as they launch. In 2026 alone, SageMaker Unified Studio has added over 20 new features, which you can also find in the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/release-notes.html\">release notes.</a><br /> <br /> These enhancements are available in all AWS Regions where Amazon SageMaker Unified Studio is supported in IAM-based domains. Sign in to <a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">SageMaker Unified Studio </a>to explore what’s new, or start with the getting started tutorials in the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/gs-sql.html\">Amazon SageMaker Unified Studio User Guide.</a></p>"
  "1f3283620306424aaf96fa32bf77b9ad":
    "id": "1f3283620306424aaf96fa32bf77b9ad"
    "title": "Amazon Route 53 Domains adds support for 34 new Top Level Domains including .app, .dev, and .health."
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-route-53-domains/"
    "published": "2026-05-12 00:21:00"
    "fetched": "2026-05-13 04:45:14"
    "summary": "<p>Amazon Route 53 Domains now supports registration and management of 34 new top-level domains (TLDs), including .app, .dev, .art, .forum, .health, and .realty. This expansion enhances Route 53's domain registration and DNS management capabilities by offering customers&nbsp;industry-specific, technology-focused, and purpose-driven domain name options directly through AWS, enabling businesses and individuals to better establish their online presence.&nbsp;&nbsp;</p> \n<p>The new TLDs cater to diverse use cases across multiple sectors. The .app domain is perfect for anyone building digital products — from mobile apps and SaaS platforms to browser extensions and developer tools. Developers can utilize .dev for development projects and technical portfolios, while .art serves creative professionals and galleries. The .forum domain suits community platforms and discussion boards. Healthcare organizations can leverage .health for medical services and wellness platforms. Real estate professionals can establish their presence with .realty domains. Additional domains like .food, .lifestyle, .living, and .love provide opportunities for specialized content and services.</p> \n<p>Users can register these domains through the Route 53 console, AWS CLI, or SDKs, enjoying integrated DNS management and automatic renewal features. This seamless integration allows for efficient domain administration alongside existing Route 53 hosted zones and DNS records, providing a unified experience for managing both domain registration and DNS services.&nbsp;Additionally, developers building AI-powered workflows can leverage the <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/agent-toolkit/\">AWS Agent Toolkit</a> to register and manage these domains programmatically through a fully managed MCP server.<br /> <br /> <b>Complete list of new TLDs:</b> .app, .art, .bar, .boo, .build, .dad, .day, .dev, .diy, .earth, .esq, .fit, .foo, .food, .forum, .health, .how, .lifestyle, .living, .love, .menu, .mov, .my, .nexus, .one, .page, .phd, .prof, .realty, .rest, .rsvp, .soy, .win, .zip<br /> <br /> To learn more about Amazon Route 53 Domains and start registering new domains, visit the <a href=\"https://aws.amazon.com/route53/domains/\">Amazon Route 53 Domains page.</a> Domain registration pricing varies by TLD. Visit the <a href=\"https://aws.amazon.com/route53/pricing/\">pricing page</a> for detailed pricing information.</p>"
  "c3d9aa959a55be435cef2c843b293e6b":
    "id": "c3d9aa959a55be435cef2c843b293e6b"
    "title": "Announcing Region Expansion of P5.48xl instances on SageMaker Studio notebooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/p5-48xl-region-expansion-sagemaker-studio-notebooks/"
    "published": "2026-05-12 13:22:00"
    "fetched": "2026-05-14 01:15:20"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 P5.48xl instances in the AWS US West (San Francisco), Asia Pacific (Tokyo, Mumbai, Sydney, Jakarta) and Europe (London, Stockholm) regions on SageMaker Studio notebooks.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/p5/\">Amazon EC2 P5.48xl instances</a> are powered by NVIDIA H100 Tensor Core GPUs and deliver high performance in Amazon EC2 for deep learning (DL) and high performance computing (HPC) applications. They help you accelerate your time to solution by up to 4x compared to previous-generation GPU-based EC2 instances, and reduce cost to train ML models by up to 40%. Customers can use P5&nbsp;instances for training and deploying complex large language models (LLMs) and diffusion models powering generative AI applications. These applications include question answering, code generation, video and image generation, and speech recognition.</p> \n<p>Visit developer guides for instructions on setting up and using&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\">JupyterLab</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\">CodeEditor</a>&nbsp;applications on&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\">SageMaker Studio</a>. For pricing information on these instances, please visit our&nbsp;<a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
