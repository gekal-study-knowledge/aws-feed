"entries":
  "135ba19f48df7f9fbff9539f1ffba9f3":
    "id": "135ba19f48df7f9fbff9539f1ffba9f3"
    "title": "Amazon Neptune now supports 1-click connect with CloudShell"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-neptune-cloudshell/"
    "published": "2026-05-07 02:00:00"
    "fetched": "2026-05-07 03:13:23"
    "summary": "<p><a href=\"https://aws.amazon.com/neptune/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Neptune</a> now offers 1-click connect capability, enabling you to quickly connect to Neptune Database and Neptune Analytics using CloudShell.</p> \n<p>Previously, connecting to Neptune resources required manual configuration network settings and access permissions, taking time from database administrators, developers, and data analysts who needed to query their graph databases. With 1-click connect, you can immediately start querying your Neptune resources without manual network configuration, significantly reducing setup time and technical complexity. This streamlined approach works across different network configurations, including VPC only resources. 1-click connect is particularly valuable for testing and development workflows, troubleshooting, and for customers new to Neptune who want to quickly explore and experiment with their graph data.<br /> <br /> 1-click connect is available at no additional charge in all regions where Amazon Neptune is currently offered. To learn more and how to get started, visit <a href=\"https://aws.amazon.com/neptune/\">https://aws.amazon.com/neptune/</a>.</p>"
  "c80d4d74e86874a90b4e092edc8cad45":
    "id": "c80d4d74e86874a90b4e092edc8cad45"
    "title": "AWS Marketplace now supports programmatic procurement with Agreements API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-marketplace-agreements-api/"
    "published": "2026-05-07 03:00:00"
    "fetched": "2026-05-07 05:18:58"
    "summary": "<p>Today, AWS Marketplace announces the Agreements API, enabling you to procure AWS Marketplace products and manage agreements programmatically. With this launch, you can generate estimates, accept offers, track charges and entitlements, update purchase orders and manage agreements all within your existing tools and workflows.</p> \n<p>Combined with the Discovery API, the Agreements API provides an end-to-end procurement journey from product discovery to purchase. You can integrate these APIs into your procurement systems to build custom workflows and streamline operations across your organization. Partners can also use these APIs to build custom storefronts that deliver unified procurement experiences for their customers.&nbsp;</p> \n<p>The AWS Marketplace Agreements APIs is available in the US East (N. Virginia) Region.</p> \n<p>To get started, configure AWS Identity and Access Management (IAM) permissions for your AWS account and call the API through the AWS SDK. To learn more, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/agreement-apis.html\">AWS Marketplace Agreement APIs documentation</a>.</p>"
  "c09c3b3bc74146923a24f128465a5da7":
    "id": "c09c3b3bc74146923a24f128465a5da7"
    "title": "AWS Elastic Beanstalk now supports TLS listeners for Network Load Balancers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/elastic-beanstalk-tls-support/"
    "published": "2026-05-07 01:00:00"
    "fetched": "2026-05-07 05:18:58"
    "summary": "<p>AWS Elastic Beanstalk now supports TLS listeners for environments configured with a Network Load Balancer. You can configure a TLS listener with an SSL certificate and security policy, allowing the load balancer to handle secure connections and forward decrypted traffic to your instances. You can configure TLS listeners through the Elastic Beanstalk console or CLI.</p> \n<p>&nbsp;</p> \n<p>Previously, Elastic Beanstalk did not support TLS listeners for NLB environments as a managed configuration option. With this launch, you can configure TLS listener settings directly through Elastic Beanstalk.</p> \n<p>&nbsp;</p> \n<p>This feature is available in all AWS regions that support Elastic Beanstalk and Network Load Balancers.</p> \n<p>&nbsp;</p> \n<p>To get started, see Configuring a Network Load Balancer in the AWS Elastic Beanstalk <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environments-cfg-nlb.html\">Developer Guide</a>. For more information about SSL certificates and security policies, see the Elastic Load Balancing <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html#tls-security-policies\">documentation</a>.</p>"
  "6abbf3d75b641b3fc5f2b257bfa35d38":
    "id": "6abbf3d75b641b3fc5f2b257bfa35d38"
    "title": "Amazon EC2 P6-B300 instances are now available in the US East (N. Virginia) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-p6-b300-us-east"
    "published": "2026-05-07 04:24:00"
    "fetched": "2026-05-07 06:53:33"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in the US East (N. Virginia) Region.&nbsp;P6-B300 instances provide 8xNVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.<br /> <br /> P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) and large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads.&nbsp;<br /> <br /> P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon), AWS GovCloud (US-East) and US East (N. Virginia). To learn more about P6-B300 instances, visit&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6 instances.</a></p>"
  "3c2a5b39d3a53175b3ac82b25005c701":
    "id": "3c2a5b39d3a53175b3ac82b25005c701"
    "title": "Amazon Bedrock AgentCore Memory announces metadata for long-term memory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/agentcore-longterm-memory-metadata"
    "published": "2026-05-07 02:00:00"
    "fetched": "2026-05-07 06:53:33"
    "summary": "<p>Amazon Bedrock&nbsp;AgentCore&nbsp;Memory now supports&nbsp;metadata on long-term memory (LTM) records, enabling agents to tag, filter, and retrieve memories using structured attributes alongside semantic search. You can define up to ten indexed keys&nbsp;per memory resource&nbsp;-&nbsp;with support for STRING, NUMBER, and STRING_LIST types&nbsp;-&nbsp;and use&nbsp;different&nbsp;operator&nbsp;types&nbsp;to filter retrieval results.</p> \n<p>Metadata can be attached to events at ingestion&nbsp;time or&nbsp;inferred automatically by the LLM based on extraction instructions you define on the memory&nbsp;resource. During ingestion, the LLM processes all events and&nbsp;determines&nbsp;how metadata is applied to the resulting memory records.</p> \n<p>You define a metadata schema on the memory resource that includes indexed key definitions (key name, type, and optional allowed values) along with extraction instructions that guide the LLM on how to generate metadata from conversation&nbsp;content.&nbsp;With metadata filters on retrieval&nbsp;-&nbsp;agents can retrieve records by structured attributes like ticket number, priority,&nbsp;or date&nbsp;-&nbsp;eliminating&nbsp;irrelevant context and improving response accuracy.</p> \n<p>To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-memory-metadata.html\">Amazon Bedrock AgentCore Memory&nbsp;documentation</a>. This feature is available today in all AWS Regions where Amazon Bedrock&nbsp;AgentCore&nbsp;Memory is supported.</p>"
  "0cdb7e03c6a6098e067fa818e61ce3cb":
    "id": "0cdb7e03c6a6098e067fa818e61ce3cb"
    "title": "AWS Site-to-Site VPN now supports modifying tunnel bandwidth on existing VPN connections"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-site-to-site-vpn-modify-bandwidth/"
    "published": "2026-05-07 06:09:00"
    "fetched": "2026-05-07 07:48:03"
    "summary": "<p>AWS Site-to-Site VPN now supports modifying tunnel bandwidth between standard (up to 1.25 Gbps) and large (up to 5 Gbps) on existing connections, making it easier to update your VPN connections’ bandwidth per your organization’s need.<br /> <br /> Previously, changing tunnel bandwidth required deleting and recreating the connection, which generated new tunnel IP addresses and meant updating your on-premises VPN device configuration and firewall rules. With this launch, tunnels are upgraded while preserving your IP addresses, CIDR blocks, pre-shared keys, and all configuration settings, eliminating the need to make any changes to your on-premises device.<br /> <br /> This feature is available in the following AWS Regions: US East (N. Virginia, Ohio), US West (N. California), AWS GovCloud (US-West), Europe (Frankfurt, London, Paris, Spain, Stockholm), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Mumbai, New Zealand, Osaka, Seoul, Sydney, Taipei, Thailand, Tokyo), Africa (Cape Town), Mexico (Central), and South America (São Paulo). To learn more and get started, visit the AWS Site-to-Site VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/modify-vpn-connection-options.html\">documentation</a>.</p>"
  "e4176fc4b5debd68667983f50ec82c02":
    "id": "e4176fc4b5debd68667983f50ec82c02"
    "title": "Agents that transact: Amazon Bedrock AgentCore now includes Payments (preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-bedrock-agentcore-payments-preview"
    "published": "2026-05-07 21:00:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p>Today, Amazon Bedrock AgentCore announces the preview of AgentCore payments, enabling AI agents to autonomously access and pay for APIs, MCP servers, web content, and other agents. Built in partnership with Coinbase and Stripe, AgentCore payments is the first managed payment capabilities purpose-built for autonomous agents, handling the full payment lifecycle from wallet authentication through transaction execution to spending governance and observability. As AI agents become more capable and services shift to pay-per-use models built for machine consumption, developers need infrastructure that lets their agents transact without building bespoke billing integrations, credential management, orchestration logic, budgeting, and observability from scratch.</p> \n<p>With AgentCore payments, developers connect a Coinbase CDP wallet or Stripe Privy wallet as a payment connection, set session-level spending limits, and their agent transacts autonomously during execution. When an agent encounters a paid resource and receives an HTTP 402 response, AgentCore handles the x402 protocol negotiation, wallet authentication, stablecoin payment, and proof delivery back to the endpoint, all without interrupting the agent's reasoning loop. Spending limits are enforced deterministically at the infrastructure layer, and every transaction is observable through the same logs, metrics, and traces developers already use in AgentCore. The Coinbase x402 Bazaar MCP server is also available through AgentCore Gateway, providing over 10,000 x402 endpoints that agents can search, discover, and pay for autonomously.<br /> </p> \n<p>AgentCore payments is available in preview in the following AWS Regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt), and Asia Pacific (Sydney). Learn more about it through the <a href=\"https://aws.amazon.com/blogs/machine-learning/agents-that-transact-introducing-amazon-bedrock-agentcore-payments-built-with-coinbase-and-stripe/\">blog</a>, deep dive using the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/payments.html\">documentation</a>, and get started with the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-get-started-cli.html\">AgentCore CLI.</a></p>"
  "95578418060fc18040bba17decafa5c5":
    "id": "95578418060fc18040bba17decafa5c5"
    "title": "Amazon OpenSearch Service now supports VPC egress for private connectivity to resources in your VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-opensearch-service-vpc"
    "published": "2026-05-07 09:30:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p>Amazon OpenSearch Service now supports the VPC egress option, which allows your virtual private cloud (VPC) domain to establish private network connections to resources in your VPC, such as ML models, AWS services, and custom applications, without exposing traffic to the public internet.</p> \n<p>When you enable the VPC egress option, OpenSearch Service adds network interfaces to the subnets you selected for the domain and routes outbound traffic into your VPC. You can enable or disable the VPC egress option using the Amazon OpenSearch Service console, AWS CLI, or the CreateDomain and UpdateDomainConfig API operations.</p> \n<p>VPC egress is now supported in all AWS Regions where Amazon OpenSearch Service is available. To get started, refer to <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/vpc-egress.html\" target=\"_blank\">Routing domain egress traffic through your VPC</a>.<br /> </p>"
  "5ef0de3a6a77ead68df046109683fef0":
    "id": "5ef0de3a6a77ead68df046109683fef0"
    "title": "Amazon EC2 P6-B200 instances are now available in the AWS GovCloud (US-West) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-p6-b200-aws-govcloud"
    "published": "2026-05-07 04:45:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) P6-B200 instances accelerated by NVIDIA Blackwell GPUs are available in AWS GovCloud (US-West) Region.&nbsp;These instances offer up to 2x performance compared to P5en instances for AI training and inference.<br /> <br /> P6-B200 instances feature 8 Blackwell GPUs with 1440 GB of high-bandwidth GPU memory and a 60% increase in GPU memory bandwidth compared to P5en, 5th Generation Intel Xeon processors (Emerald Rapids), and up to 3.2 terabits per second of Elastic Fabric Adapter (EFAv4) networking. P6-B200 instances are powered by the AWS Nitro System, so you can reliably and securely scale AI workloads within Amazon EC2 UltraClusters to tens of thousands of GPUs.<br /> <br /> P6-B200 instances are now available in p6-b200.48xlarge size in the following AWS Regions: US West (Oregon), US East (N. Virginia, Ohio) and AWS GovCloud (US-West). To learn more about P6-B200 instances, visit&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6 instances.</a></p>"
  "b52660926599a0f583270cc7ed32a3a2":
    "id": "b52660926599a0f583270cc7ed32a3a2"
    "title": "Amazon ElastiCache now supports real-time aggregations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-elasticache-aggregations/"
    "published": "2026-05-07 04:00:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache</a> now supports aggregation queries, making it easier to filter, group, transform, and summarize data directly in your cache with a single query. Developers can use aggregation queries to build real-time application experiences with latencies as low as microseconds over terabytes of data and results reflecting completed writes.<br /> <br /> By running aggregations directly in-memory within ElastiCache, developers can reduce architectural complexity and improve response times without a separate analytics engine. Applications can use aggregations to power faceted navigation, category counts, rollups, and leaderboards. Applications can aggregate over the most up-to-date data to deliver real-time insights such as trending content, popular categories, and top-performing items in e-commerce marketplaces and streaming services. Aggregations can drive AI-powered personalization applications that need fast summaries over search results, and operational dashboards for live monitoring and business analytics.<br /> <br /> Aggregations are available in all commercial AWS Regions, AWS GovCloud (US) Regions, and China Regions, for node-based clusters running ElastiCache version 9.0 for Valkey at no additional cost. Valkey is the most permissive open source and vendor-neutral alternative to Redis and the recommended engine on ElastiCache. To get started, create a new Valkey 9.0 or above cluster or upgrade an existing cluster using the <a href=\"https://console.aws.amazon.com/elasticache/\" target=\"_blank\">AWS Management Console</a>, AWS SDK, or AWS CLI. To learn more, read the <a href=\"https://aws.amazon.com/blogs/database/announcing-aggregations-on-amazon-elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">aggregations blog</a> and see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/aggregations.html\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache documentation</a>.&nbsp;</p>"
  "f607d0419c8aa83b7722bf22e61566a1":
    "id": "f607d0419c8aa83b7722bf22e61566a1"
    "title": "Amazon ElastiCache now supports real-time hybrid search with vector and full-text"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-elasticache-hybrid-search/"
    "published": "2026-05-07 04:00:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache</a> now supports real-time hybrid search that combines vector similarity with full-text search in a single query, without a separate search service. Applications can combine semantic meaning with exact keyword matching that captures both intent and precise terms to deliver more relevant results than either method alone. Customers can use ElastiCache to combine full-text and vector similarity search across billions of embeddings from popular providers like <a href=\"https://aws.amazon.com/bedrock/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock</a>, <a href=\"https://aws.amazon.com/sagemaker/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon SageMaker</a>, <a href=\"https://www.anthropic.com/\" rel=\"noopener noreferrer\" target=\"_blank\">Anthropic</a>, and <a href=\"https://openai.com/\" rel=\"noopener noreferrer\" target=\"_blank\">OpenAI</a> with latency as low as microseconds and up to 99% recall.<br /> <br /> ElastiCache makes data searchable as soon as writes complete, so applications always search the most current vectors and text. Developers can use hybrid search to build <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/agentic-memory.html\" rel=\"noopener noreferrer\" target=\"_blank\">AI agent memory</a> and RAG systems that retrieve relevant context by exact terms and meaning to improve generative AI responses while reducing token costs. E-commerce and streaming platforms can use hybrid search to surface relevant matches, whether users search by exact product name, description, or both. ElastiCache for Valkey delivers the lowest latency vector search with the highest throughput and best price-performance at 95%+ recall rate among popular vector databases on AWS.<br /> <br /> Hybrid search is available in all commercial AWS Regions, AWS GovCloud (US) Regions, and China Regions, for node-based clusters running ElastiCache version 9.0 for Valkey at no additional cost. Valkey is the most permissive open source and vendor-neutral alternative to Redis and the recommended engine on ElastiCache. To get started, create a new Valkey 9.0 or above cluster or upgrade an existing cluster using the <a href=\"https://console.aws.amazon.com/elasticache/\" target=\"_blank\">AWS Management Console</a>, AWS SDK, or AWS CLI. To learn more, read <a href=\"https://aws.amazon.com/blogs/database/enhanced-search-for-amazon-elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">this blog</a> and see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/search.html\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache documentation</a>.</p>"
  "a2bdf0897b3866a758110da847675a95":
    "id": "a2bdf0897b3866a758110da847675a95"
    "title": "Amazon ElastiCache now supports real-time full-text, exact-match, and numeric range search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-elasticache-enchanced-search/"
    "published": "2026-05-07 04:00:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache</a> now supports real-time full-text, exact-match, and numeric range search directly in your cache without a separate search service. Applications can use ElastiCache to search terabytes of data with latency as low as microseconds and throughput up to millions of search operations per second. Developers can combine any of these search types in a single query to power real-time, scalable search across frequently changing data.<br /> <br /> ElastiCache makes data searchable as soon as writes complete, so applications always search the most current data. This is ideal for frequently updated datasets such as user session details, product inventory, and transaction records. Exact-match search enables instant lookup of records by precise values such as usernames, content IDs, or genres across streaming and gaming applications. Numeric range queries enable filtering by transaction amounts, date ranges, or player scores in financial applications and leaderboards. Developers can use full-text search with prefix, suffix, and fuzzy matching to power product discovery in e-commerce platforms, or combine search types to filter by category, price, and ratings.<br /> <br /> Full-text, exact-match, and numeric range search is available in all commercial AWS Regions, AWS GovCloud (US) Regions, and China Regions, for node-based clusters running ElastiCache version 9.0 for Valkey at no additional cost. Valkey is the most permissive open source and vendor-neutral alternative to Redis and the recommended engine on ElastiCache. To get started, create a new Valkey 9.0 or above cluster or upgrade an existing cluster using the <a href=\"https://console.aws.amazon.com/elasticache/\" target=\"_blank\">AWS Management Console</a>, AWS SDK, or AWS CLI. To learn more, read <a href=\"https://aws.amazon.com/blogs/database/enhanced-search-for-amazon-elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">this blog</a> and see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/search.html\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache documentation</a>.&nbsp;</p>"
  "092231ac18547c395f2839925d7a77c7":
    "id": "092231ac18547c395f2839925d7a77c7"
    "title": "AWS Resource Explorer is now available in AWS GovCloud (US-East) and (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-resource-explorer-available-aws-govcloud/"
    "published": "2026-05-07 21:00:00"
    "fetched": "2026-05-08 05:11:32"
    "summary": "<p>We are pleased to announce that AWS Resource Explorer, a managed capability that simplifies the search and discovery of resources, is now available in the AWS GovCloud Regions (US-East) and (US-West).</p> \n<p>You can search for your AWS resources either using the AWS Resource Explorer console, the AWS Command Line Interface (AWS CLI), the AWS SDKs, or the unified search bar from wherever you are in the AWS Management Console. From the search results displayed in the console, you can go to your resource’s service console and Region with a single step, and take action.</p> \n<p>To turn on AWS Resource Explorer, visit the&nbsp;<a href=\"https://resource-explorer.console.aws.amazon.com/\">AWS Resource Explorer console</a>. Read about getting started in our&nbsp;<a href=\"https://docs.aws.amazon.com/resource-explorer/latest/userguide/welcome.html\">AWS Resource Explorer documentation</a>, or explore the&nbsp;<a href=\"https://aws.amazon.com/resourceexplorer/\">AWS Resource Explorer product page</a>.</p>"
  "8fe86410efd1fbd4d367fa84f853f2b2":
    "id": "8fe86410efd1fbd4d367fa84f853f2b2"
    "title": "Amazon Bedrock AgentCore Runtime now supports bring-your-own file system from Amazon S3 Files and Amazon EFS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-bedrock-agentcore-runtime/"
    "published": "2026-05-07 04:45:00"
    "fetched": "2026-05-08 05:11:32"
    "summary": "<p>Amazon Bedrock AgentCore Runtime now supports bring-your-own file system, enabling developers to attach their Amazon S3 Files and Amazon EFS access points directly to agent runtimes. AgentCore Runtime mounts the file system into every session at a path you specify, and your agent reads and writes files using standard file operations&nbsp; - no custom mount code, no privileged containers, and no download orchestration before the agent can start working is needed.</p> \n<p>This complements the existing managed session storage (in public preview), which AgentCore Runtime can automatically provision. Bring-your-own file system is for the data you already own and want to share: skills, tool libraries, reference datasets, knowledge bases, and project files that should be available across sessions, across microVM lifecycles, or across multiple agents. Developers can mount an Amazon S3 Files file system to access data through both standard file operations and S3 APIs, with changes automatically synchronized between the file system and the S3 bucket. Alternatively, they can mount an Amazon EFS access point for a purpose-built, shared NFS file system. Both options deliver sub-millisecond latency for active data and support NFS close-to-open consistency.</p> \n<p>This unlocks patterns that were previously difficult to build. Agents can load shared skills, prompt templates, or curated datasets at session start without re-downloading at every new session initialization. Long-running workflows can persist intermediate results and resume work in future sessions. Multiple agents, or multiple sessions of the same agent, can collaborate on the same dataset, with one producing outputs that another consumes as inputs.</p> \n<p>To get started, developers provide an access point ARN, and the agent runtime must be configured with a VPC. Bring-your-own file system is available across all 15 AWS Regions where AgentCore Runtime is supported. For the full list, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-filesystem-configurations.html\">File system configurations in AgentCore Runtime</a>.</p>"
  "f8688d85b963e138a9a51865d85a012e":
    "id": "f8688d85b963e138a9a51865d85a012e"
    "title": "Amazon RDS for SQL Server now supports instances powered by AMD EPYC processors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/rds-sqlserver-supports-amd-instances/"
    "published": "2026-05-07 16:00:00"
    "fetched": "2026-05-08 07:58:42"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\">Amazon RDS for SQL Server</a> now supports M8a and R8a instances powered by 5th Generation AMD EPYC processors. On RDS for SQL Server, R8a and M8a instances deliver up to 70% higher throughput than comparable x86 instances for commonly used instance sizes. <br /> <br /> Each vCPU in M8a and R8a instances corresponds to a physical CPU core, designed to deliver consistent per-core performance. For workloads with high I/O requirements, M8a and R8a instances provide up to 75 Gbps of network bandwidth and 60 Gbps of Amazon EBS bandwidth. Additionally, M8a and R8a instances support the RDS for SQL Server optimize CPU feature, which allows customers to reduce their vCPU-based Microsoft SQL Server licensing charges by adjusting the number of vCPUs enabled on their instance. All instances are built on the AWS Nitro System using sixth-generation Nitro Cards.<br /> <br /> Amazon RDS for SQL Server M8a and R8a instances are available in all commercial AWS Regions where these instances are offered in Amazon EC2. Customers can purchase these instances using On-Demand pricing or as part of their <a href=\"https://aws.amazon.com/savingsplans/database-pricing/\">Database Savings Plan</a>. To learn more, visit the <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\">Amazon RDS for SQL Server pricing page</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html\">Amazon RDS User Guide</a>.</p>"
"last_updated": "2026-05-08 07:58:42 JST"
