  "135ba19f48df7f9fbff9539f1ffba9f3":
    "id": "135ba19f48df7f9fbff9539f1ffba9f3"
    "title": "Amazon Neptune now supports 1-click connect with CloudShell"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-neptune-cloudshell/"
    "published": "2026-05-07 02:00:00"
    "fetched": "2026-05-07 03:13:23"
    "summary": "<p><a href=\"https://aws.amazon.com/neptune/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Neptune</a> now offers 1-click connect capability, enabling you to quickly connect to Neptune Database and Neptune Analytics using CloudShell.</p> \n<p>Previously, connecting to Neptune resources required manual configuration network settings and access permissions, taking time from database administrators, developers, and data analysts who needed to query their graph databases. With 1-click connect, you can immediately start querying your Neptune resources without manual network configuration, significantly reducing setup time and technical complexity. This streamlined approach works across different network configurations, including VPC only resources. 1-click connect is particularly valuable for testing and development workflows, troubleshooting, and for customers new to Neptune who want to quickly explore and experiment with their graph data.<br /> <br /> 1-click connect is available at no additional charge in all regions where Amazon Neptune is currently offered. To learn more and how to get started, visit <a href=\"https://aws.amazon.com/neptune/\">https://aws.amazon.com/neptune/</a>.</p>"
  "c80d4d74e86874a90b4e092edc8cad45":
    "id": "c80d4d74e86874a90b4e092edc8cad45"
    "title": "AWS Marketplace now supports programmatic procurement with Agreements API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-marketplace-agreements-api/"
    "published": "2026-05-07 03:00:00"
    "fetched": "2026-05-07 05:18:58"
    "summary": "<p>Today, AWS Marketplace announces the Agreements API, enabling you to procure AWS Marketplace products and manage agreements programmatically. With this launch, you can generate estimates, accept offers, track charges and entitlements, update purchase orders and manage agreements all within your existing tools and workflows.</p> \n<p>Combined with the Discovery API, the Agreements API provides an end-to-end procurement journey from product discovery to purchase. You can integrate these APIs into your procurement systems to build custom workflows and streamline operations across your organization. Partners can also use these APIs to build custom storefronts that deliver unified procurement experiences for their customers.&nbsp;</p> \n<p>The AWS Marketplace Agreements APIs is available in the US East (N. Virginia) Region.</p> \n<p>To get started, configure AWS Identity and Access Management (IAM) permissions for your AWS account and call the API through the AWS SDK. To learn more, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/agreement-apis.html\">AWS Marketplace Agreement APIs documentation</a>.</p>"
  "c09c3b3bc74146923a24f128465a5da7":
    "id": "c09c3b3bc74146923a24f128465a5da7"
    "title": "AWS Elastic Beanstalk now supports TLS listeners for Network Load Balancers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/elastic-beanstalk-tls-support/"
    "published": "2026-05-07 01:00:00"
    "fetched": "2026-05-07 05:18:58"
    "summary": "<p>AWS Elastic Beanstalk now supports TLS listeners for environments configured with a Network Load Balancer. You can configure a TLS listener with an SSL certificate and security policy, allowing the load balancer to handle secure connections and forward decrypted traffic to your instances. You can configure TLS listeners through the Elastic Beanstalk console or CLI.</p> \n<p>&nbsp;</p> \n<p>Previously, Elastic Beanstalk did not support TLS listeners for NLB environments as a managed configuration option. With this launch, you can configure TLS listener settings directly through Elastic Beanstalk.</p> \n<p>&nbsp;</p> \n<p>This feature is available in all AWS regions that support Elastic Beanstalk and Network Load Balancers.</p> \n<p>&nbsp;</p> \n<p>To get started, see Configuring a Network Load Balancer in the AWS Elastic Beanstalk <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environments-cfg-nlb.html\">Developer Guide</a>. For more information about SSL certificates and security policies, see the Elastic Load Balancing <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html#tls-security-policies\">documentation</a>.</p>"
  "6abbf3d75b641b3fc5f2b257bfa35d38":
    "id": "6abbf3d75b641b3fc5f2b257bfa35d38"
    "title": "Amazon EC2 P6-B300 instances are now available in the US East (N. Virginia) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-p6-b300-us-east"
    "published": "2026-05-07 04:24:00"
    "fetched": "2026-05-07 06:53:33"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in the US East (N. Virginia) Region.&nbsp;P6-B300 instances provide 8xNVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.<br /> <br /> P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) and large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads.&nbsp;<br /> <br /> P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon), AWS GovCloud (US-East) and US East (N. Virginia). To learn more about P6-B300 instances, visit&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6 instances.</a></p>"
  "3c2a5b39d3a53175b3ac82b25005c701":
    "id": "3c2a5b39d3a53175b3ac82b25005c701"
    "title": "Amazon Bedrock AgentCore Memory announces metadata for long-term memory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/agentcore-longterm-memory-metadata"
    "published": "2026-05-07 02:00:00"
    "fetched": "2026-05-07 06:53:33"
    "summary": "<p>Amazon Bedrock&nbsp;AgentCore&nbsp;Memory now supports&nbsp;metadata on long-term memory (LTM) records, enabling agents to tag, filter, and retrieve memories using structured attributes alongside semantic search. You can define up to ten indexed keys&nbsp;per memory resource&nbsp;-&nbsp;with support for STRING, NUMBER, and STRING_LIST types&nbsp;-&nbsp;and use&nbsp;different&nbsp;operator&nbsp;types&nbsp;to filter retrieval results.</p> \n<p>Metadata can be attached to events at ingestion&nbsp;time or&nbsp;inferred automatically by the LLM based on extraction instructions you define on the memory&nbsp;resource. During ingestion, the LLM processes all events and&nbsp;determines&nbsp;how metadata is applied to the resulting memory records.</p> \n<p>You define a metadata schema on the memory resource that includes indexed key definitions (key name, type, and optional allowed values) along with extraction instructions that guide the LLM on how to generate metadata from conversation&nbsp;content.&nbsp;With metadata filters on retrieval&nbsp;-&nbsp;agents can retrieve records by structured attributes like ticket number, priority,&nbsp;or date&nbsp;-&nbsp;eliminating&nbsp;irrelevant context and improving response accuracy.</p> \n<p>To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-memory-metadata.html\">Amazon Bedrock AgentCore Memory&nbsp;documentation</a>. This feature is available today in all AWS Regions where Amazon Bedrock&nbsp;AgentCore&nbsp;Memory is supported.</p>"
  "0cdb7e03c6a6098e067fa818e61ce3cb":
    "id": "0cdb7e03c6a6098e067fa818e61ce3cb"
    "title": "AWS Site-to-Site VPN now supports modifying tunnel bandwidth on existing VPN connections"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-site-to-site-vpn-modify-bandwidth/"
    "published": "2026-05-07 06:09:00"
    "fetched": "2026-05-07 07:48:03"
    "summary": "<p>AWS Site-to-Site VPN now supports modifying tunnel bandwidth between standard (up to 1.25 Gbps) and large (up to 5 Gbps) on existing connections, making it easier to update your VPN connections’ bandwidth per your organization’s need.<br /> <br /> Previously, changing tunnel bandwidth required deleting and recreating the connection, which generated new tunnel IP addresses and meant updating your on-premises VPN device configuration and firewall rules. With this launch, tunnels are upgraded while preserving your IP addresses, CIDR blocks, pre-shared keys, and all configuration settings, eliminating the need to make any changes to your on-premises device.<br /> <br /> This feature is available in the following AWS Regions: US East (N. Virginia, Ohio), US West (N. California), AWS GovCloud (US-West), Europe (Frankfurt, London, Paris, Spain, Stockholm), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Mumbai, New Zealand, Osaka, Seoul, Sydney, Taipei, Thailand, Tokyo), Africa (Cape Town), Mexico (Central), and South America (São Paulo). To learn more and get started, visit the AWS Site-to-Site VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/modify-vpn-connection-options.html\">documentation</a>.</p>"
"last_updated": "2026-05-07 07:48:03 JST"
