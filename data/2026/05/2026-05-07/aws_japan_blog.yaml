    "summary": "AWS X-Ray SDKとDaemonは2026年2月にメンテナンスモードへ移行します。今後のトレース計装にはOpenTelemetryが推奨されます。本記事では移行の背景、スケジュール、移行先の選択肢、新機能について解説します。"
