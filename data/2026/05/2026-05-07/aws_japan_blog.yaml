    "summary": "週刊生成AI with AWS, What's Next with AWS の大型発表が中心の2026年4月27日週号 - 奈良市と日立システムズ様の個人番号利用事務系での GenU 活用事例を紹介。また、AWS Retail &amp; CPG EXPO 2026 や製造業の生成 AI ラウンドテーブルの開催報告、Amazon Q Developer サポート終了のお知らせなどのブログ記事も。サービスアップデートでは Amazon Bedrock の OpenAI モデル/Codex/マネージドエージェント（限定プレビュー）や AgentCore の最適化機能、Amazon Quick のデスクトップアプリをはじめとする 14 件のアップデートを紹介。"
