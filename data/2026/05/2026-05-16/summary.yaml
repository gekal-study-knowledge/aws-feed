"overview": |
  この日はマルチクラウド接続とセキュリティ、運用管理系のアップデートが目立ちました。目玉は AWS Interconnect - multicloud の Oracle Cloud Infrastructure 接続がプレビュー提供開始となり、OCI が同オープン仕様を採用した点です。セキュリティ面では AWS AI Security Framework の紹介、coreMQTT の脆弱性 CVE-2026-8686 の告知がありました。管理系では AWS Organizations の SCP クォータ拡大、Amazon Managed Grafana の v12.4 インプレースアップグレード対応、CloudWatch Logs のクエリ結果上限が 10 万件へ拡大。さらに Amazon EMR Serverless が 6 リージョン追加、Amazon Connect Cases の機能強化、AWS Partner Central エージェントの機会作成支援も発表されました。
