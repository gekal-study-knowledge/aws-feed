  "66dd374997e1e9a3fb1de9a539cb3bbd":
    "id": "66dd374997e1e9a3fb1de9a539cb3bbd"
    "title": "Amazon Connect Cases now lets you edit related items and delete cases from the agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-cases-related-item/"
    "published": "2026-05-16 02:25:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p>Amazon Connect Cases now supports editing and deleting related items, and deleting cases directly from the agent workspace without administrator help. Agents can update comments, unlink contacts associated with the wrong case, or delete cases opened in error. Agents can also create, edit, and delete custom related items such as orders, returns, and invoices to capture additional case context.<br /> <br /> Amazon Connect Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Amazon Connect Cases <a href=\"https://aws.amazon.com/connect/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_UpdateRelatedItem.html\">documentation</a>.</p>"
  "711b429d48f7f65aad4d56b460b9dd67":
    "id": "711b429d48f7f65aad4d56b460b9dd67"
    "title": "Amazon RDS for PostgreSQL announces Extended Support minor versions 11.22-rds.20260224, 12.22-rds.20260224, and 13.23-rds.20260224"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-rds-postgresql-extended-support/"
    "published": "2026-05-16 01:08:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\">Amazon Relational Database Service</a> (RDS) for PostgreSQL announces Amazon RDS Extended Support minor versions 11.22-rds.20260224, 12.22-rds.20260224, and 13.23-rds.20260224. We recommend that you upgrade to these versions to fix known security vulnerabilities and bugs in prior versions of PostgreSQL.<br /> <br /> <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS Extended Support</a> provides up to three additional years of critical security and bug fixes beyond a major version's end of standard support date, giving you more time to upgrade to a new major version. Learn more about Extended Support in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS User Guide</a>.<br /> <br /> You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.PostgreSQL.UpgradeRollout.html\">Upgrade Rollout Policy</a> to orchestrate thousands of upgrades in phases, first to development environments before upgrading production systems. You can also use Amazon RDS <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\">Blue/Green deployments</a> with physical replication to minimize downtime for minor version upgrades.<br /> <br /> Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. See <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\">Amazon RDS for PostgreSQL Pricing</a> for pricing details and regional availability. Create or update a fully managed Amazon RDS database in the Amazon RDS Management Console or by using the AWS Command Line Interface (CLI).</p>"
  "413ee84108ab29452ade8fcaa7771209":
    "id": "413ee84108ab29452ade8fcaa7771209"
    "title": "Amazon Managed Grafana now supports in-place upgrade to Grafana version 12.4"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-managed-grafana-v12-update/"
    "published": "2026-05-16 01:06:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p>Amazon Managed Grafana&nbsp;now supports&nbsp;in-place&nbsp;upgrade&nbsp;from Grafana version 10.4 to 12.4.&nbsp;You can upgrade with just a few clicks&nbsp;from&nbsp;the AWS Console or via AWS SDK or AWS CLI.</p> \n<p>Upgrading to version 12.4 brings native Grafana Scenes-powered dashboards for faster rendering and&nbsp;queryless&nbsp;Drilldown apps for point-and-click exploration&nbsp;of Prometheus metrics, Loki logs, Tempo traces, and&nbsp;Pyroscope&nbsp;profiles.&nbsp;Amazon CloudWatch plugin enhancements simplify log analysis with PPL/SQL query support, broaden visibility through cross-account Metrics Insights, and surface issues proactively with log anomaly detection.&nbsp;The rebuilt table visualization delivers smoother performance with CSS cell styling and interactive Actions buttons, while trendline transformations and navigation bookmarks streamline data exploration.&nbsp;</p> \n<p>In-place upgrade to&nbsp;Grafana&nbsp;12.4&nbsp;is supported in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS regions</a>&nbsp;where Amazon Managed Grafana is&nbsp;generally available.&nbsp;&nbsp;For a complete list of new features, refer to <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/version-differences.html#version-diff-v12\">Differences between Grafana versions</a> in the Amazon Managed Grafana User Guide. For upgrade instructions, see <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/AMG-workspace-version-update.html\">Update your workspace version</a>.&nbsp;&nbsp;To learn more about Amazon Managed&nbsp;Grafana features and its pricing, visit the <a href=\"https://aws.amazon.com/grafana/\">product page</a> and <a href=\"https://aws.amazon.com/grafana/pricing/\">pricing page</a>.</p>"
  "bf7bf8701806ca405927ef5b1019e53c":
    "id": "bf7bf8701806ca405927ef5b1019e53c"
    "title": "AWS Organizations now supports higher quotas for service control policies (SCPs)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-organizations-increased-scp-quotas/"
    "published": "2026-05-16 00:00:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p><a href=\"https://aws.amazon.com/organizations/\">AWS Organizations</a> now supports higher quotas for service control policies (SCPs). The maximum number of SCPs that can be attached to a single node (root, OU, or account) has increased from 5 to 10, and the maximum SCP size has increased from 5,120 to 10,240 characters. </p> \n<p>With these higher quotas, you can write SCPs with finer-grained permissions and conditions, and attach more SCPs per node to build more comprehensive security controls across your organization.</p> \n<p>These higher quotas are available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the China Regions, and are available automatically to all organizations with no action required. To learn more, see quotas for AWS Organizations in the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html\">AWS Organizations User Guide</a>.</p>"
  "84dfa7064b57ad8de3f1ca2369937ffb":
    "id": "84dfa7064b57ad8de3f1ca2369937ffb"
    "title": "AWS announces AWS Interconnect - multicloud connectivity with Oracle Cloud Infrastructure in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-announces-AWS-interconnect-multicloud-oci-preview/"
    "published": "2026-05-16 00:00:00"
    "fetched": "2026-05-16 05:13:44"
    "summary": "<p>AWS announces the public preview of AWS Interconnect — multicloud with Oracle Cloud Infrastructure (OCI).</p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. They do so for many reasons including interoperability requirements, the freedom to choose technology that best suits their needs, and the ability to build and deploy applications on any environment with greater ease and speed. Previously, when interconnecting workloads across multiple cloud service providers (CSPs), customers had to go the route of a ‘do-it-yourself’ multicloud approach, leading to complexities of building and managing global multi-layered networks at scale. AWS Interconnect - multicloud is the first purpose-built product of its kind and a new way of how clouds connect and talk to each other, allowing customers to quickly provision resilient, scalable private connections to other cloud providers.</p> \n<p>OCI is the latest CSP to adopt the <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">open specification</a> that powers AWS Interconnect. This allows AWS to provide a consistent, simple experience to our customers on OCI (preview), Google Cloud (Generally Available), and Microsoft Azure (coming later in 2026).</p> \n<p>Interconnect - multicloud is available in preview with OCI in the us-east-1 (N. Virginia) AWS Region. You can create a preview Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/latest/userguide/what-is-interconnect.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Interconnect - multicloud documentation</a>.</p>"
  "8e37e5b180338f0703fcce05935c66ba":
    "id": "8e37e5b180338f0703fcce05935c66ba"
    "title": "Amazon EMR Serverless is now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-emr-serverless-aws-regions/"
    "published": "2026-05-16 04:50:00"
    "fetched": "2026-05-16 06:56:27"
    "summary": "<p>Amazon EMR Serverless is now generally available in six additional AWS Regions - Asia Pacific (Hyderabad), Asia Pacific (Malaysia), Asia Pacific (New Zealand), Asia Pacific (Taipei), Asia Pacific (Thailand), and Mexico (Central).<br /> <br /> Amazon EMR Serverless is a deployment option in Amazon EMR that makes it simple and cost effective for data engineers and analysts to run petabyte-scale data analytics in the cloud. With EMR Serverless, you can run your Apache Spark and Apache Hive applications without having to configure, optimize, tune, or manage clusters. EMR Serverless offers fine-grained automatic scaling, fast launch times, customizable worker configurations, and support for batch, interactive and streaming workloads.<br /> <br /> To get started, visit the Amazon EMR Serverless <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/getting-started.html\">User Guide</a>. For pricing info, visit the <a href=\"https://aws.amazon.com/emr/pricing/\">EMR Serverless pricing page</a>.</p>"
  "d7e52c1c00cd9192ae6ef85302066270":
    "id": "d7e52c1c00cd9192ae6ef85302066270"
    "title": "Amazon CloudWatch Logs announces increased query result limits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/cloudwatch-logs-query-results/"
    "published": "2026-05-16 06:00:00"
    "fetched": "2026-05-16 08:52:53"
    "summary": "<p>Amazon CloudWatch Logs now supports retrieving up to 100,000 results using the Logs Insights query language. Customers can specify the limit in their query using the LIMIT command.<br /> <br /> Previously, customers were limited to 10,000 results and had to split their queries into smaller time ranges to retrieve all results. With this launch, customers can view a larger set of results and use existing features such as patterns, visualization, and export on the full 100,000 result set. The GetQueryResults API has also been updated to support pagination; each invocation can return up to 10,000 results along with a token that can be used to fetch the next set of results.<br /> <br /> The increased query result limits are available in all commercial AWS regions. You can execute queries and view up to 100,000 results using the Amazon CloudWatch console, AWS CLI, AWS CDK, and AWS SDKs. To learn more, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Limit.html\">documentation</a>.</p>"
  "fa1520877229b486ba8c38dd7cf5cb2e":
    "id": "fa1520877229b486ba8c38dd7cf5cb2e"
    "title": "AWS Partner Central agents now accelerates opportunity creation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-partner-central-agents-oppo"
    "published": "2026-05-16 03:41:00"
    "fetched": "2026-05-16 14:51:01"
    "summary": "<p>Today, AWS announces that the AWS Partner Central agents now accelerate opportunity creation through natural language conversation. <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/03/aws-partner-central-agents-accelerate-co-sell/\">AWS Partner Central agents</a>, released on March 16, 2026, are AI-powered capabilities built on Amazon Bedrock AgentCore that help partners surface pipeline insights, advance deals with next-step recommendations, and identify funding opportunities. With this update, partners create opportunities through a short conversation instead of completing a multi-step form, so partner sales teams spend less time on data entry and more time selling.<br /> <br /> Partners describe a deal in natural language, upload meeting notes, proposals, or call transcripts (PDF, DOCX, Excel, TXT), or clone an existing opportunity. The agent extracts the information, enriches customer details, and recommends improvements — such as adding missing context, correcting field values, or strengthening the business problem statement — so partners submit higher-quality opportunities, improve pipeline hygiene, and shorten sales cycles. Partners use the feature in the AWS Console through Amazon Q chat, and programmatically through Model Context Protocol (MCP), so sales teams create opportunities from their existing tools.<br /> <br /> AWS Partner Central agents are available in all commercial AWS Regions. To learn more about agentic capabilities in <a href=\"https://aws.amazon.com/partners/partner-central/\">AWS Partner Central</a>, review this <a href=\"https://aws.amazon.com/blogs/apn/introducing-aws-partner-central-agents/\">blog</a>. Partners can start using agents by visiting AWS Partner Central in the AWS console and accessing opportunities, after reviewing the <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/partner-cosell-agent.html\">agents guide</a>, and to integrate agents into your existing tools, visit the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/partner-central-mcp-server.html\">Partner Central agents MCP server guide</a>.</p>"
"last_updated": "2026-05-16 14:51:01 JST"
