  "66dd374997e1e9a3fb1de9a539cb3bbd":
    "id": "66dd374997e1e9a3fb1de9a539cb3bbd"
    "title": "Amazon Connect Cases now lets you edit related items and delete cases from the agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-cases-related-item/"
    "published": "2026-05-16 02:25:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p>Amazon Connect Cases now supports editing and deleting related items, and deleting cases directly from the agent workspace without administrator help. Agents can update comments, unlink contacts associated with the wrong case, or delete cases opened in error. Agents can also create, edit, and delete custom related items such as orders, returns, and invoices to capture additional case context.<br /> <br /> Amazon Connect Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Amazon Connect Cases <a href=\"https://aws.amazon.com/connect/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-cases_UpdateRelatedItem.html\">documentation</a>.</p>"
  "711b429d48f7f65aad4d56b460b9dd67":
    "id": "711b429d48f7f65aad4d56b460b9dd67"
    "title": "Amazon RDS for PostgreSQL announces Extended Support minor versions 11.22-rds.20260224, 12.22-rds.20260224, and 13.23-rds.20260224"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-rds-postgresql-extended-support/"
    "published": "2026-05-16 01:08:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\">Amazon Relational Database Service</a> (RDS) for PostgreSQL announces Amazon RDS Extended Support minor versions 11.22-rds.20260224, 12.22-rds.20260224, and 13.23-rds.20260224. We recommend that you upgrade to these versions to fix known security vulnerabilities and bugs in prior versions of PostgreSQL.<br /> <br /> <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS Extended Support</a> provides up to three additional years of critical security and bug fixes beyond a major version's end of standard support date, giving you more time to upgrade to a new major version. Learn more about Extended Support in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS User Guide</a>.<br /> <br /> You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.PostgreSQL.UpgradeRollout.html\">Upgrade Rollout Policy</a> to orchestrate thousands of upgrades in phases, first to development environments before upgrading production systems. You can also use Amazon RDS <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\">Blue/Green deployments</a> with physical replication to minimize downtime for minor version upgrades.<br /> <br /> Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. See <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\">Amazon RDS for PostgreSQL Pricing</a> for pricing details and regional availability. Create or update a fully managed Amazon RDS database in the Amazon RDS Management Console or by using the AWS Command Line Interface (CLI).</p>"
  "413ee84108ab29452ade8fcaa7771209":
    "id": "413ee84108ab29452ade8fcaa7771209"
    "title": "Amazon Managed Grafana now supports in-place upgrade to Grafana version 12.4"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-managed-grafana-v12-update/"
    "published": "2026-05-16 01:06:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p>Amazon Managed Grafana&nbsp;now supports&nbsp;in-place&nbsp;upgrade&nbsp;from Grafana version 10.4 to 12.4.&nbsp;You can upgrade with just a few clicks&nbsp;from&nbsp;the AWS Console or via AWS SDK or AWS CLI.</p> \n<p>Upgrading to version 12.4 brings native Grafana Scenes-powered dashboards for faster rendering and&nbsp;queryless&nbsp;Drilldown apps for point-and-click exploration&nbsp;of Prometheus metrics, Loki logs, Tempo traces, and&nbsp;Pyroscope&nbsp;profiles.&nbsp;Amazon CloudWatch plugin enhancements simplify log analysis with PPL/SQL query support, broaden visibility through cross-account Metrics Insights, and surface issues proactively with log anomaly detection.&nbsp;The rebuilt table visualization delivers smoother performance with CSS cell styling and interactive Actions buttons, while trendline transformations and navigation bookmarks streamline data exploration.&nbsp;</p> \n<p>In-place upgrade to&nbsp;Grafana&nbsp;12.4&nbsp;is supported in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS regions</a>&nbsp;where Amazon Managed Grafana is&nbsp;generally available.&nbsp;&nbsp;For a complete list of new features, refer to <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/version-differences.html#version-diff-v12\">Differences between Grafana versions</a> in the Amazon Managed Grafana User Guide. For upgrade instructions, see <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/AMG-workspace-version-update.html\">Update your workspace version</a>.&nbsp;&nbsp;To learn more about Amazon Managed&nbsp;Grafana features and its pricing, visit the <a href=\"https://aws.amazon.com/grafana/\">product page</a> and <a href=\"https://aws.amazon.com/grafana/pricing/\">pricing page</a>.</p>"
  "bf7bf8701806ca405927ef5b1019e53c":
    "id": "bf7bf8701806ca405927ef5b1019e53c"
    "title": "AWS Organizations now supports higher quotas for service control policies (SCPs)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-organizations-increased-scp-quotas/"
    "published": "2026-05-16 00:00:00"
    "fetched": "2026-05-16 03:19:56"
    "summary": "<p><a href=\"https://aws.amazon.com/organizations/\">AWS Organizations</a> now supports higher quotas for service control policies (SCPs). The maximum number of SCPs that can be attached to a single node (root, OU, or account) has increased from 5 to 10, and the maximum SCP size has increased from 5,120 to 10,240 characters. </p> \n<p>With these higher quotas, you can write SCPs with finer-grained permissions and conditions, and attach more SCPs per node to build more comprehensive security controls across your organization.</p> \n<p>These higher quotas are available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the China Regions, and are available automatically to all organizations with no action required. To learn more, see quotas for AWS Organizations in the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html\">AWS Organizations User Guide</a>.</p>"
"last_updated": "2026-05-16 03:19:56 JST"
