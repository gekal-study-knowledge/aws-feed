    "title": "Amazon GuardDuty Malware Protection for AWS Backup supports Amazon S3 continuous backups"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-guardduty-aws-backup-s3-continuous/"
    "published": "2026-05-26 19:00:00"
    "fetched": "2026-05-27 08:05:55"
    "summary": "<p>Amazon GuardDuty Malware Protection for AWS Backup is now available for Amazon S3 continuous backups. You can now scan your S3 continuous backups for malware and identify clean points in time across your entire backup timeline for safe recovery.</p> \n<p>You can enable full or incremental malware scans for S3 continuous backups within your backup plan, and run on-demand scans up to any restorable point in time. You can now query the malware scan status at any point in time within your continuous backup using the new GetPITRMalwareScanResults API, allowing you to verify whether a specific recovery time is clean before initiating a restore.</p> \n<p>Support for S3 continuous backups is available in all AWS Regions where Amazon GuardDuty Malware Protection for AWS Backup is supported. You can get started using the <a href=\"https://console.aws.amazon.com/backup/home\">AWS Backup console</a>, API, or CLI. To learn more, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/malware-protection.html\">AWS Backup documentation</a> and <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html\">Amazon GuardDuty Malware Protection documentation</a>.</p>"
"last_updated": "2026-05-27 08:05:55 JST"
