    "title": "Amazon VPC IPAM now supports tags on IPAM pool allocations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-vpc-ipam-tags/"
    "published": "2026-05-26 22:00:00"
    "fetched": "2026-05-27 06:40:50"
    "summary": "<p>Amazon VPC IP Address Manager (IPAM) now supports tags on IPAM pool allocations, enabling customers to organize, govern, and control access to individual IP address allocations using the same tagging workflows they use across other AWS resources.</p> \n<p>Amazon VPC IP Address Manager (IPAM) helps customers plan, track, and monitor IP addresses across their AWS environments. With this launch, customers can tag allocations at creation time or add tags to existing allocations. These tags can be referenced in AWS Identity and Access Management and Service Control Policies, enabling centralized governance over IP address usage at scale. For example, a network administrator can tag allocations by environment and enforce an IAM policy that allows only the production networking role to allocate from the pool, while development teams are restricted to development pools. Customers can also search and filter allocations by tag across all IPAM pools, making it faster to locate specific IP address ranges in large, multi-account environments.</p> \n<p>This feature is available in all AWS Regions where IPAM is available at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/vpc/latest/ipam/allocate-cidrs-ipam.html\">IPAM User Guide</a>. To get started with IPAM, visit the <a href=\"https://console.aws.amazon.com/ipam/\">IPAM console</a>.</p>"
"last_updated": "2026-05-27 06:40:50 JST"
