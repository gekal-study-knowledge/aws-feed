    "summary": "この記事では、AWS Summit Japan 2026で AWS IoT サービスを利活用した展示の一部をご紹介します。各ブースで表示している資料もこちらに掲載予定です。AWS IoTで実現するロボット遠隔テレオペレーション体験 (A026),AIエージェントで実現するスマートマシン -建設機械の自律運用-(A162),Physical AIへの第一歩 AWS IoTで実現するPhysical AI基盤 (A161),builders' Fair： クラウドVLAが操るミニロボたち,インダストリブース：AWS認定デバイスウォール(A017) のブースについて紹介しています。"
