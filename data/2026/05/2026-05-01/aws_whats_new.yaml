    "title": "Amazon MQ for RabbitMQ now supports Prometheus metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-mq-rabbitmq-prometheus-metrics/"
    "published": "2026-05-01 03:10:00"
    "fetched": "2026-05-01 04:15:04"
    "summary": "<p><a href=\"https://aws.amazon.com/amazon-mq/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MQ</a> for RabbitMQ now supports the Prometheus plugin on RabbitMQ 4.2 brokers, providing a native Prometheus-compatible metrics endpoint on your RabbitMQ brokers. You can scrape broker, queue, and connection metrics directly from your brokers using any Prometheus-compatible monitoring tool, giving you more flexibility in how you observe and alert on your messaging infrastructure.<br /> <br /> The plugin exposes metrics through the /metrics, /metrics/detailed, and /metrics/memory-breakdown endpoints in Prometheus text format. Amazon MQ also publishes a curated subset of these Prometheus metrics to CloudWatch. With the Prometheus plugin, you can now integrate your brokers into existing Prometheus-based monitoring stacks including Grafana dashboards, Amazon Managed Service for Prometheus, and self-hosted Prometheus servers.<br /> <br /> The Prometheus plugin is enabled by default on all Amazon MQ for RabbitMQ 4.2 brokers in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon MQ is available. To learn more about monitoring with Prometheus, see the <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-release-notes.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MQ release notes</a>.</p>"
  "f4fa173cee4b5b8363a44227fe65a16f":
    "id": "f4fa173cee4b5b8363a44227fe65a16f"
    "title": "AWS Outposts racks now support LagStatus CloudWatch metric"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-outposts-lagstatus-cloudwatch/"
    "published": "2026-05-01 05:17:00"
    "fetched": "2026-05-01 06:55:21"
    "summary": "<p>AWS Outposts racks now support the LagStatus Amazon CloudWatch metric in all AWS commercial Regions and the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions.</p> \n<p>This metric provides you with the ability to monitor Outposts LAG connectivity status directly within the CloudWatch console, without having to rely on external networking tools or coordination with other teams. You can use this metric to set alarms, troubleshoot connectivity issues, and ensure your Outposts racks are properly integrated with your on-premises infrastructure. The LagStatus metric indicates whether an Outposts LAG is operationally up and ready to forward traffic. A value of \"1\" means that the LAG is up, while \"0\" means that it is down. When combined with the existing VifConnectionStatus and VifBgpSessionState metrics, you can quickly identify whether issues stem from LAG configuration, BGP peering, or connection problems.</p> \n<p>The LagStatus metric is now available for all Outposts LAGs in all commercial AWS Regions and the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions where Outposts racks are available.</p> \n<p>To get started, read this <a href=\"https://aws.amazon.com/blogs/compute/enhancing-network-observability-with-new-aws-outposts-racks-lag-metrics/\">blog post</a> and access the metrics in the CloudWatch console. To learn more, check out the CloudWatch metrics for AWS Outposts documentation for <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/outposts-cloudwatch-metrics.html\">second-generation Outposts racks</a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/userguide/outposts-cloudwatch-metrics.html\">first-generation Outposts racks</a>.</p>"
  "149999846bf1e0bc6f5e7ddac56f9d13":
    "id": "149999846bf1e0bc6f5e7ddac56f9d13"
    "title": "AWS Neuron SDK now available with Neuron Agentic Development for NKI kernel development on Trainium"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/announcing-neuron-agentic-development/"
    "published": "2026-05-01 00:00:00"
    "fetched": "2026-05-01 07:51:17"
    "summary": "<p>AWS Neuron announces the Neuron Agentic Development capabilities, an open-source collection of agents and skills that equip AI coding assistants to accelerate development on <a href=\"https://aws.amazon.com/ai/machine-learning/trainium/\">AWS Trainium</a> and <a href=\"https://aws.amazon.com/ai/machine-learning/inferentia/\">AWS Inferentia</a>. The initial release provides agentic coding capabilities for Neuron Kernel Interface (NKI) kernel development, covering the workflow from authoring to profiling and performance analysis.<br /> <br /> NKI gives developers direct, low-level programming access to Trainium for writing custom compute kernels that maximize hardware performance. Neuron Agentic Development brings NKI expertise directly into the developer's agentic IDE&nbsp;(such as Claude Code and Kiro) through natural language. For example, a developer can describe a PyTorch operation and receive a working NKI kernel, ask the agent to fix a compilation error and have it automatically identify the issue and apply a correction, or request a performance analysis and receive a report identifying which lines of kernel code are causing bottlenecks. The capabilities span kernel authoring, debugging, documentation lookup, profile capture, and profile analysis.<br /> <br /> Neuron Agentic Development is designed as a broad framework for agentic capabilities across the Neuron stack, with NKI kernel development as the initial release. The repository is available on <a href=\"https://github.com/aws-neuron/neuron-agentic-development/tree/main\">GitHub</a>.<br /> <br /> <b>Learn more:</b><br /> </p> \n<ul> \n <li><a href=\"https://github.com/aws-neuron/neuron-agentic-development/tree/main\">Neuron Agentic Development GitHub repository</a></li> \n <li><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/\">AWS Neuron documentation</a></li> \n</ul>"
"last_updated": "2026-05-01 07:51:17 JST"
