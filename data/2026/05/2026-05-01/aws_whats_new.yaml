  "312f12622853d43c4f65944c8546ace6":
    "id": "312f12622853d43c4f65944c8546ace6"
    "title": "Amazon MQ for RabbitMQ now supports Prometheus metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-mq-rabbitmq-prometheus-metrics/"
    "published": "2026-05-01 03:10:00"
    "fetched": "2026-05-01 04:15:04"
    "summary": "<p><a href=\"https://aws.amazon.com/amazon-mq/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MQ</a> for RabbitMQ now supports the Prometheus plugin on RabbitMQ 4.2 brokers, providing a native Prometheus-compatible metrics endpoint on your RabbitMQ brokers. You can scrape broker, queue, and connection metrics directly from your brokers using any Prometheus-compatible monitoring tool, giving you more flexibility in how you observe and alert on your messaging infrastructure.<br /> <br /> The plugin exposes metrics through the /metrics, /metrics/detailed, and /metrics/memory-breakdown endpoints in Prometheus text format. Amazon MQ also publishes a curated subset of these Prometheus metrics to CloudWatch. With the Prometheus plugin, you can now integrate your brokers into existing Prometheus-based monitoring stacks including Grafana dashboards, Amazon Managed Service for Prometheus, and self-hosted Prometheus servers.<br /> <br /> The Prometheus plugin is enabled by default on all Amazon MQ for RabbitMQ 4.2 brokers in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon MQ is available. To learn more about monitoring with Prometheus, see the <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-release-notes.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MQ release notes</a>.</p>"
  "f4fa173cee4b5b8363a44227fe65a16f":
    "id": "f4fa173cee4b5b8363a44227fe65a16f"
    "title": "AWS Outposts racks now support LagStatus CloudWatch metric"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-outposts-lagstatus-cloudwatch/"
    "published": "2026-05-01 05:17:00"
    "fetched": "2026-05-01 06:55:21"
    "summary": "<p>AWS Outposts racks now support the LagStatus Amazon CloudWatch metric in all AWS commercial Regions and the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions.</p> \n<p>This metric provides you with the ability to monitor Outposts LAG connectivity status directly within the CloudWatch console, without having to rely on external networking tools or coordination with other teams. You can use this metric to set alarms, troubleshoot connectivity issues, and ensure your Outposts racks are properly integrated with your on-premises infrastructure. The LagStatus metric indicates whether an Outposts LAG is operationally up and ready to forward traffic. A value of \"1\" means that the LAG is up, while \"0\" means that it is down. When combined with the existing VifConnectionStatus and VifBgpSessionState metrics, you can quickly identify whether issues stem from LAG configuration, BGP peering, or connection problems.</p> \n<p>The LagStatus metric is now available for all Outposts LAGs in all commercial AWS Regions and the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions where Outposts racks are available.</p> \n<p>To get started, read this <a href=\"https://aws.amazon.com/blogs/compute/enhancing-network-observability-with-new-aws-outposts-racks-lag-metrics/\">blog post</a> and access the metrics in the CloudWatch console. To learn more, check out the CloudWatch metrics for AWS Outposts documentation for <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/outposts-cloudwatch-metrics.html\">second-generation Outposts racks</a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/userguide/outposts-cloudwatch-metrics.html\">first-generation Outposts racks</a>.</p>"
  "149999846bf1e0bc6f5e7ddac56f9d13":
    "id": "149999846bf1e0bc6f5e7ddac56f9d13"
    "title": "AWS Neuron SDK now available with Neuron Agentic Development for NKI kernel development on Trainium"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/announcing-neuron-agentic-development/"
    "published": "2026-05-01 00:00:00"
    "fetched": "2026-05-01 07:51:17"
    "summary": "<p>AWS Neuron announces the Neuron Agentic Development capabilities, an open-source collection of agents and skills that equip AI coding assistants to accelerate development on <a href=\"https://aws.amazon.com/ai/machine-learning/trainium/\">AWS Trainium</a> and <a href=\"https://aws.amazon.com/ai/machine-learning/inferentia/\">AWS Inferentia</a>. The initial release provides agentic coding capabilities for Neuron Kernel Interface (NKI) kernel development, covering the workflow from authoring to profiling and performance analysis.<br /> <br /> NKI gives developers direct, low-level programming access to Trainium for writing custom compute kernels that maximize hardware performance. Neuron Agentic Development brings NKI expertise directly into the developer's agentic IDE&nbsp;(such as Claude Code and Kiro) through natural language. For example, a developer can describe a PyTorch operation and receive a working NKI kernel, ask the agent to fix a compilation error and have it automatically identify the issue and apply a correction, or request a performance analysis and receive a report identifying which lines of kernel code are causing bottlenecks. The capabilities span kernel authoring, debugging, documentation lookup, profile capture, and profile analysis.<br /> <br /> Neuron Agentic Development is designed as a broad framework for agentic capabilities across the Neuron stack, with NKI kernel development as the initial release. The repository is available on <a href=\"https://github.com/aws-neuron/neuron-agentic-development/tree/main\">GitHub</a>.<br /> <br /> <b>Learn more:</b><br /> </p> \n<ul> \n <li><a href=\"https://github.com/aws-neuron/neuron-agentic-development/tree/main\">Neuron Agentic Development GitHub repository</a></li> \n <li><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/\">AWS Neuron documentation</a></li> \n</ul>"
  "57c7f1a9cc81fc580da19741e433688e":
    "id": "57c7f1a9cc81fc580da19741e433688e"
    "title": "Amazon ECS Managed Instances now supports NVIDIA GPU metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-ecs-mi-gpu-metrics/"
    "published": "2026-05-01 04:00:00"
    "fetched": "2026-05-01 08:50:14"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service (Amazon ECS)</a> now offers NVIDIA GPU metrics for containerized workloads running on Amazon ECS Managed Instances. These metrics are available through<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/container-insights-detailed-ecs-metrics.html\"> Amazon CloudWatch Container Insights with enhanced observability</a>, giving customers visibility into GPU health and performance to help troubleshoot and optimize GPU-accelerated workloads on Amazon ECS.<br /> <br /> With the new GPU metrics, Amazon ECS Managed Instances customers can now monitor GPU capacity, utilization, memory, hardware health, and thermal conditions directly in CloudWatch. Using Container Insights with enhanced observability, customers get granular visibility into these metrics, including at the GPU device level. These metrics give customers visibility into GPU operational and hardware health across their Amazon ECS Managed Instances fleet, enabling them to right-size GPU capacity, troubleshoot performance issues, and detect problems before they impact GPU-accelerated workloads, such as AI/ML training and inference.<br /> <br /> NVIDIA GPU metrics for Amazon ECS Managed Instances are available through Container Insights in all commercial AWS Regions. To get started, enable Container Insights with enhanced observability on your Amazon ECS cluster, and launch GPU-accelerated Amazon EC2 instance types through an Amazon ECS Managed Instances capacity provider. For Container Insights pricing, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch Pricing</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Container-Insights-enhanced-observability-metrics-ECS.html\">Amazon ECS Container Insights with enhanced observability metrics user guide</a>.&nbsp;</p>"
  "874b7edaf916877ff1fac2ae2c41d807":
    "id": "874b7edaf916877ff1fac2ae2c41d807"
    "title": "Amazon Bedrock AgentCore Identity now supports On-Behalf-Of (OBO) token exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-bedrock-agentcore/"
    "published": "2026-05-01 02:00:00"
    "fetched": "2026-05-01 08:50:14"
    "summary": "<p>Amazon Bedrock AgentCore Identity now supports On-Behalf-Of (OBO) token exchange, enabling developers to build agents that securely access protected resources on behalf of authenticated users — without requiring users to complete multiple consent flows.<br /> <br /> Previously, developers building agents that needed to act on behalf of a user had to manage separate consent flows for each protected resource, adding friction for end users and complexity for builders. With OBO token exchange, developers can exchange an access token for a new scoped-down access token that carries both the original user identity and the agent identity. This token is targeted specifically to the outbound protected resource, granting just-in-time, least-privilege access without prompting the user for additional consent.<br /> <br /> Amazon Bedrock AgentCore Identity OBO token exchange is now generally available in 14 AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), and Europe (Stockholm). To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/on-behalf-of-token-exchange.html\">Amazon Bedrock AgentCore Identity documentation </a>.<br /> </p>"
  "fd658cd9a3face8ac9d93e83ce71b6b2":
    "id": "fd658cd9a3face8ac9d93e83ce71b6b2"
    "title": "Amazon Bedrock AgentCore launches capabilities for optimizing agent performance in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/bedrock-agentcore-optimization-preview/"
    "published": "2026-05-01 00:00:00"
    "fetched": "2026-05-01 11:44:12"
    "summary": "<p>Amazon Bedrock AgentCore launches recommendations and two ways to validate performance (batch evaluations and A/B tests). This completes the observe, evaluate, improve loop for AI agents in production. Until now, translating evaluation findings into concrete, validated improvements required manual developer intervention and intuition rather than a systematic approach. With recommendations, batch evaluations and A/B tests, developers now have the tools to act on what evaluations surface.<br /> <br /> As models evolve and user behavior shifts, agent quality degrades quietly over time. The recommendations capability analyzes production traces and evaluation outputs generated by AgentCore to create optimized system prompts and tool descriptions tailored to your specific workload. Batch evaluations are then used for validating the recommendations against pre-defined test cases. A/B tests further validate those recommendations through controlled A/B testing against pre-defined test sets or live production traffic, with statistical significance reported before any change is promoted. Every recommendation requires your approval before it ships. Together, these capabilities complete the performance improvement cycle for agents. Agents don't just run, they get better, on your terms.<br /> <br /> You can use optimization capabilities in all <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Regions</a> where AgentCore Evaluations is available. To learn more, visit the AgentCore <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/optimization.html\">documentation.</a></p>"
  "83474704fa2a3d047d98838b8b185410":
    "id": "83474704fa2a3d047d98838b8b185410"
    "title": "Announcing Kubernetes Dynamic Resource Allocation for Elastic Fabric Adapter"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/kubernetes-dra-elastic-fabric-adapter/"
    "published": "2026-05-01 23:00:00"
    "fetched": "2026-05-02 00:54:00"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) now supports Dynamic Resource Allocation (DRA) for Elastic Fabric Adapter (EFA), simplifying high-performance inter-node communication and RDMA (Remote Direct Memory Access) for artificial intelligence, machine learning, and High Performance Computing (HPC) workloads. The EFA DRA driver, built on the upstream <a href=\"https://github.com/kubernetes-sigs/dranet\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"DRANET project\">DRANET project</a>, brings EFA interface sharing and topology-aware allocation for workloads running on Kubernetes.<br /> <br /> With the EFA DRA driver, you can allocate EFA interfaces and accelerator devices that share the same PCIe root or device group, ensuring inter-node traffic flows through the closest network interface to each NVIDIA GPU, AWS Trainium, or AWS Inferentia device on the node. The EFA DRA driver also supports EFA interface sharing across workloads on the same node to maximize EFA interface utilization.<br /> <br /> The EFA DRA driver is recommended for new deployments on Amazon EKS clusters running Kubernetes version 1.34 or later with EKS managed node groups or self-managed nodes. The EFA DRA driver is available in all AWS Regions where Amazon EKS is available. The EFA device plugin remains supported and is recommended for use with Karpenter and Amazon EKS Auto Mode.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/device-management-efa.html\" rel=\"noopener noreferrer\" target=\"_blank\">Manage EFA devices on Amazon EKS</a> in the Amazon EKS User Guide.</p>"
  "5a7ae84ae9feb90394386b65035b5f95":
    "id": "5a7ae84ae9feb90394386b65035b5f95"
    "title": "Amazon EKS now supports one-click cluster access through CloudShell"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-eks-one-click-cluster-access/"
    "published": "2026-05-01 07:00:00"
    "fetched": "2026-05-02 01:54:15"
    "summary": "<p><a href=\"https://aws.amazon.com/eks/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Kubernetes Service</a> (EKS) now provides one-click cluster access directly from the AWS Management Console through <a href=\"https://docs.aws.amazon.com/cloudshell/latest/userguide/welcome.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS CloudShell</a>, eliminating the need to install and configure kubectl, AWS CLI, or kubeconfig files locally. This feature helps developers and operators who want immediate cluster access without tooling setup or complex environment configuration.<br /> <br /> With one-click cluster access, you can navigate to any EKS cluster in the console and choose <b>Connect </b>to instantly launch an AWS CloudShell session with kubectl pre-configured for that cluster. You can then run kubectl commands immediately to inspect workloads, troubleshoot issues, or manage resources without switching to a local terminal. This feature supports clusters with both public and private API server endpoints. Each CloudShell session also includes the AWS CLI and standard CloudShell utilities, giving you immediate access to essential cluster operations.<br /> <br /> One-click cluster access is available at no additional charge in all the AWS Regions where Amazon EKS is available. To get started, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/create-kubeconfig.html#connect-cloudshell\" rel=\"noopener noreferrer\" target=\"_blank\">Connect kubectl to an EKS cluster</a> in the Amazon EKS User Guide.</p>"
  "3a8d0a985fbd6beeed32bf88db9418e9":
    "id": "3a8d0a985fbd6beeed32bf88db9418e9"
    "title": "AWS Payment Cryptography now supports paper-based key exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-payment-cryptography/"
    "published": "2026-05-01 07:08:00"
    "fetched": "2026-05-02 02:56:50"
    "summary": "<p><a href=\"https://aws.amazon.com/payment-cryptography/\">AWS Payment Cryptography</a> now supports Physical Key Exchange, a new PCI PIN and P2PE compliant feature for performing paper-based cryptographic key exchange with the service without needing to maintain your own secure key loading infrastructure. If your partners or vendors do not support electronic key exchange,&nbsp;Physical Key Exchange provides an option to exchange cryptographic keys to accelerate your migration. AWS Payment Cryptography is a managed service that provides elastic key management and cryptographic operations for your cloud-hosted payment applications.</p> \n<p>Although electronic key exchange is preferred, some counter parties are not yet ready to support it, requiring organizations to maintain Hardware Security Modules (HSMs) and Key Loading Devices (KLDs) to perform paper-based key ceremonies in a compliant manner. Maintaining this infrastructure is costly and operationally burdensome, especially for key exchanges that occur only a few times per year. With Physical Key Exchange,&nbsp;paper key components are shipped to trained&nbsp;AWS key custodians, who handle them securely and perform key ceremonies in AWS-operated secure facilities that meet the PCI PIN and P2PE physical and logical security requirements. Once loaded into AWS Payment Cryptography, keys are available to perform cryptographic operations.&nbsp;</p> \n<p>For details on key exchange options in AWS Payment Cryptography, see the <a href=\"https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-physicalkeyexchange.html\">Physical Key Exchange</a> for paper-based and <a href=\"https://docs.aws.amazon.com/payment-cryptography/latest/userguide/keys-importexport.html\">importing and exporting keys</a> for electronic key exchange in the User Guide. For pricing details, visit the <a href=\"https://aws.amazon.com/payment-cryptography/pricing/\">pricing page</a>. To get started, open an <a href=\"https://console.aws.amazon.com/support/\">AWS support case</a> or contact your AWS account team.</p>"
