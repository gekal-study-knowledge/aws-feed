    "title": "Issue with Amazon SageMaker Python SDK - Model artifact integrity verification issues (CVE-2026-8596 &amp: CVE-2026-8597)"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-031-aws/"
    "published": "2026-05-15 05:07:25"
    "fetched": "2026-05-15 05:26:13"
    "summary": "<p><b>Bulletin ID:</b> 2026-031-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 05/14/2026 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon SageMaker Python SDK is an open-source library for training and deploying machine learning models on Amazon SageMaker. The ModelBuilder component simplifies model deployment by automating model artifact preparation and SageMaker model creation.</p> \n<p>We identified two issues affecting the model artifact integrity verification mechanism in the ModelBuilder/Serve component:<br /> <b>- CVE-2026-8596:</b> We identified a cleartext storage of sensitive information issue in the ModelBuilder/Serve component. When building models using ModelBuilder, the SDK stored an HMAC signing key as a container environment variable (SAGEMAKER_SERVE_SECRET_KEY). This key was returned in plaintext by SageMaker describe APIs (DescribeModel, DescribeEndpointConfig, DescribeModelPackage). A remote authenticated actor with permissions to call these APIs and S3 write access to the model artifact path could extract the key, forge valid integrity signatures for specially crafted model artifacts, and achieve code execution in inference containers.<br /> <b>- CVE-2026-8597:</b> We identified a missing integrity verification issue in the Triton inference handler. The Triton handler deserialized model artifacts without performing integrity verification before execution. A remote authenticated actor with S3 write access to the model artifact path could replace model artifacts with a specially crafted pickle payload that would be deserialized without verification, achieving code execution in inference containers.</p>\n<p> </p>\n<p><b>Description:</b> Amazon SageMaker Python SDK &gt;= v2.199.0 AND &lt;= v2.257.1, &gt;= v3.0.0 AND &lt;= v3.7.1</p> \n<p>See more details at Security Bulletin (ID: 2026-030-AWS).</p>"
