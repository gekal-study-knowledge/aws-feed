    "title": "Real-time voice agents with Stream Vision Agents and Amazon Nova 2 Sonic"
    "link": "https://aws.amazon.com/blogs/machine-learning/real-time-voice-agents-with-stream-vision-agents-and-amazon-nova-2-sonic/"
    "published": "2026-05-15 02:23:48"
    "fetched": "2026-05-15 03:54:41"
    "summary": "In this post, you learn how to combine Stream's Vision Agents open-source framework with Amazon Bedrock and Amazon Nova 2 Sonic to build real-time voice agents that can be production-ready in minutes. You'll learn how the integration works under the hood, walk through code examples, and explore advanced capabilities like function calling, automatic reconnection, and multilingual voice support."
  "3d4998dae53d0d4e7f3b3020d67cf1e6":
