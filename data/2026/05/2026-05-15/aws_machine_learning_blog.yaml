    "title": "From siloed data to unified insights: Cross-account Athena Access for Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-siloed-data-to-unified-insights-cross-account-athena-access-for-amazon-quick/"
    "published": "2026-05-15 02:17:50"
    "fetched": "2026-05-15 03:54:41"
    "summary": "Today, we're announcing cross-account Athena access for Amazon Quick. With this feature, customers can query Athena data in other AWS accounts using AWS Identity and Access Management (IAM) role chaining, with query costs billed to the account where the data resides."
  "a832addec3ba8bf0ec22d8ce3f401129":
