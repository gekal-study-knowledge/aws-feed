    "title": "Control where your AI agents can browse with Chrome enterprise policies on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/control-where-your-ai-agents-can-browse-with-chrome-enterprise-policies-on-amazon-bedrock-agentcore/"
    "published": "2026-05-15 02:17:35"
    "fetched": "2026-05-15 03:54:41"
    "summary": "In this post, you will configure Chrome enterprise policies to restrict a browser agent to a specific website, observe the policy enforcement through session recording, and demonstrate custom root CA certificates using a public test site. The walkthrough produces a working solution that researches Amazon Bedrock AgentCore documentation while operating under enterprise browser restrictions."
