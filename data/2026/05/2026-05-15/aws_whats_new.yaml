"entries":
  "6748a12ab0873073bfc25b5273a6435a":
    "id": "6748a12ab0873073bfc25b5273a6435a"
    "title": "SageMaker AI now supports serverless model customization for Qwen3.6"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-ft-qwen3-6/"
    "published": "2026-05-15 04:18:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Qwen3.6 27B parameter model using supervised fine-tuning (SFT) and reinforcement fine-tuning (RFT). Qwen3.6 is a popular open-weight model family from Alibaba Cloud. This launch is an addition to our support for fine-tuning Qwen3.5 and other popular models. Before this launch, you could deploy Qwen3.6 base model on SageMaker AI and now, you can also adapt it to your specific domains and workflows.<br /> <br /> Model customization enables you to tailor foundation models with your proprietary data so they more accurately reflect your domain knowledge, terminology, and quality standards. Rather than building models from scratch, fine-tuning lets you start from a capable base model and specialize it for your use cases, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or improving performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.<br /> <br /> Serverless model customization for Qwen3.6 on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and EU (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
  "7c0e60ff6ae17d2afc84ce1a28be9afd":
    "id": "7c0e60ff6ae17d2afc84ce1a28be9afd"
    "title": "AWS Transform agents now available in Kiro, Claude, Cursor, and Codex"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-transform-developer-tools/"
    "published": "2026-05-15 04:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Today, AWS announces that the AWS Transform agents — built on decades of AWS migration and modernization experience — are now accessible through a Kiro power, agent plugins, and via the AWS Transform MCP server. Developers can now consume all of AWS Transform's capabilities directly from their preferred development environment, whether working interactively in an agentic IDE, managing jobs through the web console, or integrating programmatically via MCP.</p> \n<p>This launch gives builders flexibility to choose the surface that fits their workflow while gaining the depth of transformation expertise behind the AWS Transform agents for Windows, VMware, mainframe and more. A developer can start a transformation in their agentic IDE, monitor progress and collaborate in the web console, then see results back in their IDE — all against the same underlying job with consistent state. Additionally, AWS Transform now supports IAM role authentication. Customers who start using AWS Transform in their IDE or the web app can use their existing AWS credentials to create a Transform environment, workspace, and transformation job.</p> \n<p>The <a href=\"https://github.com/awslabs/agent-plugins/tree/main/plugins/aws-transform/\">agent plugin</a> and <a href=\"https://github.com/awslabs/mcp/tree/main/src/aws-transform-mcp-server\">MCP</a> are available on GitHub, and the Kiro Power within the Kiro marketplace. To learn more, see https://aws.amazon.com/transform.</p>"
  "ce5ba6d765fd95754ff02f097a3b7f56":
    "id": "ce5ba6d765fd95754ff02f097a3b7f56"
    "title": "AWS Transform introduces the agent builder toolkit Kiro power for building customized transformation agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-transform-agent-builder-toolkit/"
    "published": "2026-05-15 04:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Today, as part of the <a href=\"https://aws.amazon.com/transform/partners/\">AWS Transform composability initiative</a>, AWS announces the general availability of the agent builder toolkit Kiro power for AWS Transform. With the agent builder toolkit, AWS Partners and customers can build agents tailored to their specific modernization needs and ensure it works seamlessly within AWS Transform.</p> \n<p>This capability enables Migration and Modernization Competency Partners, ISVs, or customers to create differentiated transformation solutions by integrating their specialized agents, tools, knowledge bases, and workflows with AWS Transform's agentic AI capabilities. The agent builder toolkit provides the end-to-end lifecycle for transformation agents: build agents using the Kiro power; share them with teams or across partner networks, and register them with AWS Transform for discovery.<br /> <br /> The agent builder toolkit for AWS Transform is available in the Kiro power marketplace. To learn more, see AWS Transform (https://aws.amazon.com/transform).</p>"
  "911cc9375441fa0aa589d7d8ce669b1a":
    "id": "911cc9375441fa0aa589d7d8ce669b1a"
    "title": "ARC Region switch adds Lambda event source mapping execution block for event handling during failover"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/region-switch-lambda-esm-execution-block/"
    "published": "2026-05-15 03:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Amazon Application Recovery Controller (ARC) Region Switch helps customers orchestrate the failover of their multi-Region applications to achieve a bounded recovery time in the event of a Regional impairment. Today, we are announcing the Lambda event source mapping execution block, which automates the coordinated failover of event streams for multi-Region workloads.<br /> <br /> Customers running event-driven architectures use Lambda functions with event source mappings to process event streams from Kinesis, DynamoDB Streams, MSK, or SQS. For active-passive workloads, customers may maintain Lambda functions in each Region but process events in only one Region at a time. These event source mappings must be toggled during failover to avoid duplicate processing—a manual, error-prone step. The Lambda event source mapping execution block automates this by enabling or disabling event source mappings in either the activating or deactivating Region. To control duplicate processing, customers can configure two Lambda event source mapping execution blocks<b> </b>in sequence: a disable block to stop event processing in the deactivating Region, and an enable block to start it in the activating Region. The disable block can be overridden by running the plan in \"ungraceful\" mode for unplanned failovers where the deactivating Region may be impaired. Native cross-account support enables a single plan to handle event stream failover across multiple accounts.<br /> <br /> To get started, see the Lambda event source mapping execution block&nbsp;<a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/lambda-event-source-mapping-block.html\">documentation</a>.&nbsp;ARC Region switch is available in all commercial Regions. See&nbsp;<a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/aws-regions-rs.html\">ARC Region switch availability</a><br /> </p>"
  "ced1cbbae8b0dc5cca341b8e5cf24fa6":
    "id": "ced1cbbae8b0dc5cca341b8e5cf24fa6"
    "title": "Amazon Aurora DSQL now supports change data capture (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-aurora-dsql-change-data-capture-preview/"
    "published": "2026-05-15 03:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>Amazon Aurora DSQL introduces support for change data capture (CDC) in preview, enabling you to stream real-time database changes directly to Amazon Kinesis Data Streams. This fully managed capability removes the need to build or maintain custom streaming pipelines, making it easier to build event-driven applications, power real-time analytics pipelines, and synchronize data across systems.<br /> <br /> Aurora DSQL automatically captures the result of insert, update, and delete operations as change events. You can use these events to synchronize data across microservices, trigger downstream processing with AWS Lambda, or deliver to Amazon S3, Amazon Redshift, and Amazon OpenSearch Service through Amazon Data Firehose for analytics. CDC streaming requires no infrastructure setup and is designed to have zero impact on your database workload, so you can stream changes without affecting database throughput or latency.<br /> <br /> CDC streaming in preview is available in all AWS Regions where Aurora DSQL is available. Streams are billed using Distributed Processing Units (DPUs) based on the volume of data captured, with standard Amazon Kinesis Data Streams pricing applying separately.&nbsp;To learn more, read the <a href=\"https://aws.amazon.com/blogs/database/getting-started-with-change-data-capture-in-amazon-aurora-dsql/\">blog</a> and see<a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/cdc-setup.html\"> getting started</a>.</p>"
  "4253780f81819a7bff6f00292fe7a0a4":
    "id": "4253780f81819a7bff6f00292fe7a0a4"
    "title": "Reference stack outputs across accounts and Regions with AWS CloudFormation and CDK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-cloudformation-cdk-stack/"
    "published": "2026-05-15 02:30:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/cloudformation/\">AWS CloudFormation</a> now supports a new intrinsic function, <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html\">Fn::GetStackOutput</a>, that enables you to reference stack outputs across AWS accounts and Regions directly within your CloudFormation templates and CDK applications. This new capability simplifies the provisioning and management of multi-account and multi-Region workloads in CloudFormation and CDK, and eliminates deployment deadlocks when restructuring cross-stack dependencies in CDK apps.<br /> <br /> When managing multi-account AWS environments, teams often need to share infrastructure values, such as VPC IDs or database endpoints, across account boundaries. Previously, achieving this required multiple steps, including copying values between templates or coordinating parameter updates across teams. Now, with Fn::GetStackOutput, you simply specify the target stack name, output key, an IAM role ARN for cross-account access, and optionally a Region. CloudFormation assumes the specified role, retrieves the output value, and resolves it during template processing, reducing manual coordination and the risk of configuration drift. In CDK applications, cross-account and cross-Region references now use this function automatically, eliminating the need for custom resources and SSM parameters that the previous approach required. Customers can also call <a href=\"https://docs.aws.amazon.com/cdk/api/v2/docs/aws-cdk-lib.Fn.html#static-getwbrstackwbroutputstackname-outputname-region-rolearn\">Fn.getStackOutput</a> directly to create weak references between stacks, simplifying stack refactoring.<br /> <br /> To get started, add the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html\">Fn::GetStackOutput</a> function to your CloudFormation template and configure the appropriate IAM permissions for cross-account access. In CDK, cross-account and cross-Region references use this function automatically. Visit the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html\">AWS CloudFormation User Guide</a> or the <a href=\"https://docs.aws.amazon.com/cdk/api/v2/docs/aws-cdk-lib-readme.html#accessing-resources-in-a-different-stack-and-region\">CDK developer guide</a> to learn more.</p> \n<p><br /> This feature is available in all AWS Regions where CloudFormation is supported. Refer to the <a href=\"https://docs.aws.amazon.com/general/latest/gr/cfn.html#cfn_region\">AWS Region table</a> for service availability details.</p>"
  "581e4f722f7bc0f63e5784002239c1ed":
    "id": "581e4f722f7bc0f63e5784002239c1ed"
    "title": "AWS Transform adds agentic AI assistant to the AWS Toolkit for Visual Studio"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-transform-ai-assistant"
    "published": "2026-05-15 00:00:00"
    "fetched": "2026-05-15 05:26:12"
    "summary": "<p>To improve developer experience, AWS Transform now includes an interactive agentic AI assistant in the AWS Toolkit for Visual Studio. This enables .NET developers to modernize applications through a conversational, step-by-step guided experience directly in their IDE. The assistant provides visibility, checkpointing, and enhanced steering capabilities. So, a developer that lives in IDE can continue to work in IDE leveraging fine granular control. The agent analyzes source code, provides a detailed assessment report, and generates a transformation plan. It then executes modernization tasks interactively, allowing developers to review, edit, and approve each step before proceeding, all without switching to the web console.<br /> <br /> You can pause at any step, inspect generated diffs, upload a custom plan, and direct the agent with natural language. The agent automatically attempts to fix build errors encountered during transformation, provides detailed worklogs for transparency, and generates a downloadable HTML summary report upon completion along with recommended next steps. You can start a modernization project in the AWS Transform web console and continue directly in Visual Studio, with full context and progress preserved across both environments, eliminating the need to restart or reconfigure your workflow. In addition to Visual Studio, you can invoke the power of AWS Transform agents from Kiro and other AI coding assistants and coding environments. Through <a href=\"https://kiro.dev/powers/\" target=\"_blank\">Kiro power for AWS Transform</a> and AWS Transform MCP agents, you can enjoy a unified tool experience to reduce context-switching and continue iterating on transformed code in your preferred development.<br /> <br /> This capability is available in the following AWS Regions: US East (N. Virginia), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Sydney), and Asia Pacific (Tokyo).<br /> <br /> To get started, download the latest <a href=\"https://marketplace.visualstudio.com/items?itemName=AmazonWebServices.AWSToolkitforVisualStudio2022\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Toolkit for Visual Studio from the Visual Studio Marketplace</a>. To learn more, visit the <a href=\"https://aws.amazon.com/transform/windows/net/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform for Windows .NET page</a>.</p>"
  "8526683e75c241ae29098306d5d68d54":
    "id": "8526683e75c241ae29098306d5d68d54"
    "title": "Amazon Bedrock Introduces Advanced Prompt Optimization and Migration Tool"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-bedrock-advanced-prompt-optimization-migration-tool/"
    "published": "2026-05-15 06:50:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Customers&nbsp;spend days to weeks&nbsp;optimizing&nbsp;prompts and evaluating responses when they want to migrate to a new model or just get better performance out of their current model.&nbsp;They struggle&nbsp;with&nbsp;changing&nbsp;their prompts quickly&nbsp;and&nbsp;then&nbsp;testing&nbsp;them to&nbsp;prevent&nbsp;regressions&nbsp;and&nbsp;improve on&nbsp;underperforming tasks.&nbsp;These situations call for the same tool – a prompt optimizer with built-in&nbsp;evaluations.&nbsp;</p> \n<p>Today, Amazon Bedrock introduces Advanced Prompt Optimization, a new tool that allows customers to optimize their prompts for any model on Bedrock, while comparing their original prompts to their optimized prompts across up to 5 models simultaneously. Customers can use this if they are migrating to a new model or just want to get better performance on their current model. If they’re changing models, they can select their current model as a baseline and up to 4 other models. If they aren’t changing models, they just select their current model to see before and after optimization. The optimizer takes in prompt templates, example user inputs for the variable values, optional ground truth answers, and an evaluation metric or short natural language criteria to use as a guide. It's even compatible with multimodal inputs such as jpg, png, or PDF. The prompt optimizer works in a feedback loop to steer the prompt and resulting model responses toward optimizing the evaluation metric, and outputs the original and final prompt templates with evaluation scores, cost estimates, and latency.</p> \n<p>For region availability, see our documentation. For pricing, see the Bedrock pricing page. To get started, use the Bedrock APIs for Advanced Prompt Optimizer or visit the Bedrock Console.</p>"
  "9d5d34696dbc4574bd908b7dfec86e44":
    "id": "9d5d34696dbc4574bd908b7dfec86e44"
    "title": "Amazon CloudFront announces Passthrough Mode for mutual TLS (Viewer)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-cloudfront-mtls-passthrough/"
    "published": "2026-05-15 06:30:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Amazon CloudFront now supports passthrough mode for viewer mutual TLS (mTLS) authentication, enabling customers to forward client certificates to their origin for validation without requiring CloudFront to perform certificate verification. Passthrough mode allows customers with existing mTLS implementations at their origins to use CloudFront without requiring to implement their validation logic at the edge.</p> \n<p>CloudFront viewer mTLS already supports required mode and optional mode, which offload client certificate authentication to CloudFront using trust stores. Passthrough mode is designed for customers to maintain their existing mTLS validation infrastructure at their origin without requiring any trust store configuration on CloudFront.&nbsp;In passthrough mode, CloudFront forwards every request to the origin along with the client's full certificate chain. Caching is not performed, ensuring each request is authenticated end-to-end by your origin. Connection functions which allow you to inspect or transform connection-level data are still invoked, enabling you to process certificate data before it reaches the origin.</p> \n<p>CloudFront Mutual TLS (viewer) in passthrough mode is available at no additional cost. To learn more, visit&nbsp;<a href=\"https://us-east-1.quicksight.aws.amazon.com/sn/account/amazonbi/start/TK\">CloudFront mutual TLS (viewer)</a>.</p>"
  "c1484ae471049f211344e8ec882b4c84":
    "id": "c1484ae471049f211344e8ec882b4c84"
    "title": "Announcing general availability of Amazon EC2 M3 Ultra Mac instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-m3-ultra-mac-instances-generally-available/"
    "published": "2026-05-15 06:23:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Amazon Web Services announces general availability of Amazon EC2 M3&nbsp;Ultra&nbsp;Mac instances, powered by the latest Mac Studio hardware. Amazon EC2 M3 Ultra Mac instances are the next-generation EC2 Mac instances, that enable Apple developers to migrate their most demanding build and test workloads onto AWS. These instances are ideal for building and testing applications for Apple platforms such as iOS, macOS, iPadOS, tvOS, watchOS,&nbsp;visionOS, and Safari.&nbsp;<br /> &nbsp;<br /> M3 Ultra Mac instances are powered by the AWS Nitro System, providing up to 10 Gbps network bandwidth and 8 Gbps of Amazon Elastic Block Store (Amazon EBS) storage bandwidth. These instances are built on Apple M3 Ultra Mac Studio computers featuring a 28-core CPU, 60-core GPU, 32-core Neural Engine, and 256GB of unified memory.&nbsp;Compared to EC2 M4 Max Mac instances, M3 Ultra Mac instances provide&nbsp;2x the unified memory, 1.75x the CPU cores, 1.5x the GPU cores, and 2x the Neural Engine cores, giving Apple developers the headroom to run significantly more Xcode simulators in parallel&nbsp;and accelerate on-device ML workflows&nbsp;to improve product time to market.&nbsp;</p> \n<p>Amazon EC2 M3 Ultra Mac instances are available in US East (N. Virginia) and US West (Oregon). To learn more about Amazon EC2 M3 Ultra Mac&nbsp;instances, visit the&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/mac/\" target=\"_blank\">Amazon EC2 Mac page.</a></p>"
  "9fee02eada4fc34aff8dd24dc99b4856":
    "id": "9fee02eada4fc34aff8dd24dc99b4856"
    "title": "AWS Transform now supports customer-owned artifact stores"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-transform-customer-owned-artifact/"
    "published": "2026-05-15 04:00:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>AWS Transform brings assessment, migration, and modernization into a single AI-powered experience that guides enterprises through their full transformation journey. Today, AWS announces support for customer-owned Amazon S3 buckets, giving customers full control over where their transformation artifacts are stored and how they are secured.</p> \n<p>With this launch, you can configure your own S3 bucket, optionally encrypt artifacts with your own AWS KMS key, and manage access policies through your own AWS account. Migration practitioners can upload files directly to their bucket for immediate use by transformation agents and centralize artifact storage across multiple AWS accounts. This is designed to help enterprises in regulated industries meet data sovereignty and compliance requirements without changing how they use AWS Transform.</p> \n<p>This capability is available in all AWS Regions where AWS Transform is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom-s3-bucket.html\">AWS Transform User Guide</a>.</p>"
  "06adaff3edf42d4512aa1366614b902c":
    "id": "06adaff3edf42d4512aa1366614b902c"
    "title": "New models for image generation and text embeddings are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/image-embeddings-models-on-sagemaker-jumpstart/"
    "published": "2026-05-15 03:00:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Today, AWS announced the availability of FLUX.2-klein-base-4B and Qwen3-Embedding-0.6B in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These models from Black Forest Labs and Qwen bring state-of-the-art image generation and multilingual text embedding capabilities, enabling customers to build creative AI applications and intelligent search systems on AWS infrastructure.</p> \n<p>These models address different enterprise AI challenges with specialized capabilities:</p> \n<p><b>FLUX.2-klein-base-4B</b>&nbsp;excels at real-time image generation and multi-reference editing in a compact architecture, delivering state-of-the-art quality that runs on consumer hardware with as little as 13GB VRAM. It is ideal for creative content pipelines, product visualization, rapid prototyping, and applications that require high-quality image synthesis without sacrificing speed.</p> \n<p><b>Qwen3-Embedding-0.6B</b>&nbsp;excels at text embedding for retrieval, classification, clustering, and bitext mining across 100+ languages, with flexible output dimensions and instruction-aware embeddings. It is ideal for building semantic search systems, RAG pipelines, multilingual document retrieval, and applications that require efficient, high-quality text representations at scale.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\"></a><a>Amazon SageMaker JumpStart documentation</a>.</p>"
  "a4eb3df3c82096e4631b0cc940831fda":
    "id": "a4eb3df3c82096e4631b0cc940831fda"
    "title": "Three new models for speech recognition and text-to-speech are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/speech-models-on-sagemaker-jumpstart/"
    "published": "2026-05-15 03:00:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Today, AWS announced the availability of Qwen3-TTS-12Hz-1.7B-CustomVoice, Qwen3-TTS-12Hz-1.7B-Base, and Qwen3-ASR-1.7B in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three models from Qwen bring advanced speech synthesis and recognition capabilities across 10+ languages, enabling customers to build intelligent voice-powered applications on AWS infrastructure.</p> \n<p>These models address different enterprise speech and audio challenges with specialized capabilities:</p> \n<p><b>Qwen3-TTS-12Hz-1.7B-CustomVoice</b> excels at multilingual text-to-speech with customizable voice styles, supporting 10 languages with instruction-driven control over timbre, emotion, and prosody. It is ideal for building real-time interactive voice applications, customer-facing virtual assistants, and content creation workflows that require natural, expressive speech output.</p> \n<p><b>Qwen3-TTS-12Hz-1.7B-Base</b> excels at multilingual text-to-speech with 3-second rapid voice cloning from audio input. It is ideal for building custom voice applications, fine-tuning domain-specific speech synthesis, and scenarios where developers need a flexible foundation model for voice generation.</p> \n<p><b>Qwen3-ASR-1.7B</b> excels at automatic speech recognition supporting 52 languages and dialects with state-of-the-art accuracy in complex acoustic environments. It is ideal for transcription services, multilingual customer support, real-time captioning, and applications that require robust streaming and offline speech-to-text.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\"></a><a>Amazon SageMaker JumpStart documentation</a>.</p>"
  "7df37e515137a117b65dfefb84db2987":
    "id": "7df37e515137a117b65dfefb84db2987"
    "title": "Two new models for agentic coding and efficient AI are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/agentic-reasoning-models-on-sagemaker-jumpstart/"
    "published": "2026-05-15 03:00:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Today, AWS announced the availability of GLM-5.1-FP8 and Phi-4-mini-instruct in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These models from Z.ai and Microsoft bring advanced agentic capabilities and efficient inference to enterprise AI workloads on AWS infrastructure.</p> \n<p>These models address different enterprise AI challenges with specialized capabilities:</p> \n<p><b>GLM-5.1-FP8</b> excels at agentic software engineering with sustained multi-round optimization, handling repository-level code generation, terminal tasks, and complex debugging workflows that improve with extended reasoning. It is ideal for automated code review pipelines, AI-powered development environments, and long-horizon problem-solving where the model iterates over hundreds of rounds to refine solutions.</p> \n<p><b>Phi-4-mini-instruct</b> excels at strong reasoning, math, and logic in memory-constrained and latency-bound environments, supporting 24 languages and function calling in a compact form factor. It is ideal for edge deployment, latency-sensitive applications, multilingual chatbots, and scenarios where customers need capable reasoning with minimal resource overhead.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\"></a><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\"></a><a>Amazon SageMaker JumpStart documentation</a>.</p>"
  "5089ac0c6ac402c1140c6c045350f332":
    "id": "5089ac0c6ac402c1140c6c045350f332"
    "title": "Amazon Connect Customer launches permission for agents to view only their own performance evaluations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-customer-permission-view-own-performance-evaluations/"
    "published": "2026-05-15 02:00:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p>Amazon Connect Customer now supports a permission that gives agents access to their own performance evaluations in the Connect UI, without exposing other agents' evaluations, so they can review feedback to improve their performance. With this permission, agents can search for contacts where they have received an evaluation, view their evaluations alongside call recordings and transcripts, and submit an acknowledgment after reviewing. Agents can be granted access to view their entire department's contacts for investigating multi-contact customer issues, while ensuring that they can only view their own evaluations. This provides operational flexibility while ensuring that agents cannot view sensitive peer performance data.</p> \n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">AWS regions</a> where Amazon Connect Customer is offered. To learn more, please see our <a href=\"https://aws.amazon.com/connect/conversational-analytics/\">website</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/evaluation-and-coaching-permissions.html\">documentation</a>.</p>"
  "b783b58fdb04fbb9e0e59f670fa1b323":
    "id": "b783b58fdb04fbb9e0e59f670fa1b323"
    "title": "Amazon RDS for PostgreSQL supports minor versions 18.4, 17.10, 16.14, 15.18, and 14.23"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-rds-postgresql/"
    "published": "2026-05-15 01:49:00"
    "fetched": "2026-05-15 07:06:49"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\">Amazon Relational Database Service (RDS)</a> for PostgreSQL now supports the latest minor versions 18.4, 17.10, 16.14, 15.18, and 14.23. We recommend that you upgrade to the latest minor versions to fix known security vulnerabilities in prior versions of PostgreSQL, and to benefit from the bug fixes and improvements added by the PostgreSQL community. This release also adds postgis_topology support in PostGIS 3.6.3 for PostgreSQL 18, enabling you to model and query topological relationships such as network connectivity and spatial adjacency directly in your databases.<br /> <br /> You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html\">AWS Organizations Upgrade Rollout Policy</a> to orchestrate thousands of upgrades in phases, first to development environments before upgrading production systems. You can also use <a href=\"https://aws.amazon.com/about-aws/whats-new/2024/11/rds-blue-green-deployments-upgrade-rds-postgresql/\">Amazon RDS Blue/Green deployments</a> with physical replication to minimize downtime for minor version upgrades.<br /> <br /> Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. See <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\">Amazon RDS for PostgreSQL Pricing</a> for pricing details and regional availability. Create or update a fully managed Amazon RDS database in the Amazon RDS Management Console or by using the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html\">AWS Command Line Interface</a> (CLI).</p>"
"last_updated": "2026-05-15 07:06:49 JST"
