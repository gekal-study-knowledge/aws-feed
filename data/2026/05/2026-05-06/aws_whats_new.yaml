  "77841b5fd0f56fcd0fc70820b55cb80d":
    "id": "77841b5fd0f56fcd0fc70820b55cb80d"
    "title": "Amazon WorkSpaces now lets AI agents operate desktop applications (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/workspaces-ai-agents/"
    "published": "2026-05-06 02:25:00"
    "fetched": "2026-05-06 03:07:30"
    "summary": "<p>Amazon WorkSpaces, AWS's fully managed cloud desktop service, now enables AI agents to securely access and operate desktop applications through managed WorkSpaces environments. Many enterprises run critical business processes on desktop applications—mainframes, ERP systems, and proprietary tools—that lack modern APIs, creating a \"last-mile challenge\" for AI agents. WorkSpaces now allows organizations to automate everyday workflows at scale while maintaining full enterprise-grade governance and compliance.</p> \n<p>AI agents built on any framework and running anywhere—cloud-hosted, on-premises, or hybrid—can now connect to business applications with minimal code using industry-standard Model Context Protocol (MCP) integration. Builders gain fast time-to-value without standing up new infrastructure, while IT administrators maintain centralized permissions, logging, and auditing controls identical to human WorkSpaces environments. Enterprise observability features including screenshots and metrics provide full visibility into agent activities. Organizations can automate workflows spanning claims processing, trade settlement, candidate screening, and back-office operations across financial services, healthcare, and other regulated industries—all without requiring application modernization.</p> \n<p>WorkSpaces delivers secure environments where agents can point, click, and navigate on desktop applications just like humans. With pay-as-you-go pricing and elastic scale built on AWS's global infrastructure, enterprises reduce IT overhead while expanding what's possible when people and AI work together. To learn more, visit the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">WorkSpaces documentation.</a>&nbsp;&nbsp;</p>"
  "cd3cb00ed8a63556069f6a1a48f7ee46":
    "id": "cd3cb00ed8a63556069f6a1a48f7ee46"
    "title": "Amazon Connect Cases now supports customer profile identity resolution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-cases-customer-profiles-id-res/"
    "published": "2026-05-06 00:25:00"
    "fetched": "2026-05-06 03:07:30"
    "summary": "<p>Amazon Connect Cases now automatically reassociates cases when duplicate customer profiles are merged, so agents always see a complete case history for each customer. When the same customer has multiple profiles, such as when they reach out through different channels or provide different contact details, Identity Resolution in Amazon Connect Customer Profiles detects and merges those duplicates, and Cases now brings all associated cases together under the unified profile. Agents no longer have to search across profiles or piece together a customer's history manually.<br /> <br /> Amazon Connect Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Amazon Connect Cases <a href=\"https://aws.amazon.com/connect/cases/\" target=\"_blank\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases.html\" target=\"_blank\">documentation</a>.</p>"
  "eff4f25225c76f487174235554cd5ff2":
    "id": "eff4f25225c76f487174235554cd5ff2"
    "title": "AWS SAM CLI adds BuildKit support for AWS Lambda functions packaged as container images"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-sam-cli-buildkit-aws-lambda/"
    "published": "2026-05-06 03:50:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli.html\" target=\"_blank\">AWS Serverless Application Model Command Line Interface (SAM CLI)</a> now supports BuildKit for building container images from Dockerfiles, enabling faster, more efficient container image builds for Lambda functions packaged as container images.</p> \n<p>SAM CLI is a command-line tool for building, testing, debugging, and packaging serverless applications locally before deploying to AWS Cloud. Developers packaging Lambda functions as container images often need advanced build features provided by BuildKit to optimize their images for production. However, SAM CLI previously did not support BuildKit features. Now, with BuildKit support in SAM CLI, you can utilize multi-stage builds to create smaller final images without development dependencies, improved caching to reduce rebuild times, and better parallelization of build steps. BuildKit also enables cross-architecture builds, allowing you to build container images targeting both x86_64 and arm64 (AWS Graviton2) instruction set architectures from the same development machine. You can also use Docker secrets during builds, keeping sensitive data such as credentials and API keys out of your final image layers.</p> \n<p>To get started, download or update SAM CLI to version 1.159.0 or later and use the --use-buildkit flag with sam build. This feature works regardless of whether you are using Docker or Finch with SAM CLI, unlocking the full set of BuildKit capabilities.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-build.html\" target=\"_blank\">SAM CLI developer guide</a>.</p>"
  "66f87289ec0bdb8c6d56ca7f4e40c84c":
    "id": "66f87289ec0bdb8c6d56ca7f4e40c84c"
    "title": "AWS SAM now supports WebSocket APIs for Amazon API Gateway"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-sam-websocket-apis-api-gateway/"
    "published": "2026-05-06 03:31:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/what-is-sam.html\" target=\"_blank\">AWS Serverless Application Model (AWS SAM)</a> now supports WebSocket APIs for Amazon API Gateway, enabling you to define complete WebSocket APIs with minimal configuration in your SAM template.</p> \n<p>AWS SAM is a collection of open-source tools that make it easy for you to build and manage serverless applications. WebSocket APIs are critical for real-time applications such as chat, live dashboards, AI/LLM streaming, and IoT. However, SAM previously did not support WebSocket APIs, requiring you to manually configure all of the underlying resources in AWS CloudFormation. This made it difficult to debug common issues such as missing IAM permissions for Lambda functions. Now, SAM handles all of this automatically, generating the required resources and permissions from your template. The new resource provides feature parity with <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api-overview.html\" target=\"_blank\">API Gateway WebSocket APIs</a>, including IAM and Lambda authorization, custom domains, RouteSettings, Models, and StageVariables. Globals support lets you share common configuration across multiple WebSocket APIs.</p> \n<p>To get started, add the AWS::Serverless::WebSocketApi resource type to your SAM template. Define your routes by specifying Lambda function handlers for $connect, $disconnect, and $default routes, along with any custom routes your application requires. SAM automatically wires up the integrations and permissions for each route. You can also configure authorization, stage settings, and custom domains directly within the resource definition.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-websocketapi.html\" target=\"_blank\">SAM developer guide</a>.</p>"
  "d4b9fcbd7311d98e8e7b407e98033001":
    "id": "d4b9fcbd7311d98e8e7b407e98033001"
    "title": "Amazon ElastiCache adds thirteen new Amazon CloudWatch metrics for network capacity planning and engine diagnostics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-elasticache-cloudwatch-metrics-network-engine-diagnostics/"
    "published": "2026-05-06 03:00:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache</a> customers can now detect network throttling, memory fragmentation, and connection exhaustion, using thirteen new Amazon CloudWatch metrics for node-based clusters. You can monitor these host-level and engine-level diagnostics directly from CloudWatch without running INFO commands on individual nodes or calculating baselines from raw byte counters.<br /> </p> \n<ul> \n <li><b>Network capacity:</b> NetworkBaselineUsageInPercentage, NetworkBaselineUsageOutPercentage, NetworkBaselineMaxUsageInPercentage, and NetworkBaselineMaxUsageOutPercentage report network utilization relative to instance baseline, enabling portable alarms that remain valid across instance type changes. Values above 100 percent signal that a host is consuming burst credits, a leading indicator that a sustained workload will eventually lead to credit exhaustion and throttling. The variants capturing max report per-second bursts that averaged metrics can hide.</li> \n <li><b>Memory health:</b> UsedMemoryDataset shows memory consumed by actual stored data excluding engine overhead. AllocatorFragmentationBytes and AllocatorFragmentationRatio isolate fragmentation that the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/ParameterGroups.Engine.html\" rel=\"noopener noreferrer\" target=\"_blank\">activedefrag parameter</a> can address. MajorPageFaults captures OS-level page faults that indicate memory pressure beyond what the engine can surface.</li> \n <li><b>Connectivity health:</b> BlockedConnections and RejectedConnections surface connections waiting on blocking commands and connections turned away when the maxclients limit is reached. When RejectedConnections is non-zero, raise maxclients or diagnose client-side connection pool leaks.<i> </i></li> \n <li><b>Pub/sub workloads:</b> PubSubChannels and PubSubShardChannels expose active classic and sharded channels on each node. When classic channel counts are growing with utilization, consider switching to sharded pub/sub to scale horizontally.</li> \n <li><b>Command throughput:</b> ProcessedCommands provides total command throughput across all command types.</li> \n</ul> \n<p>These metrics are available for node-based clusters in all commercial AWS Regions and the AWS China and AWS GovCloud (US) Regions where ElastiCache is supported, at no additional cost.<br /> <br /> To get started, view the new metrics in the <a href=\"https://console.aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache console</a> monitoring tab or in the AWS/ElastiCache namespace in the CloudWatch console. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.HostLevel.html\" rel=\"noopener noreferrer\" target=\"_blank\">Host-Level Metrics </a>and <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheMetrics.Redis.html\" rel=\"noopener noreferrer\" target=\"_blank\">Metrics for Valkey and Redis OSS</a>.</p>"
  "1e1c3b9314ea586de752f6c315808751":
    "id": "1e1c3b9314ea586de752f6c315808751"
    "title": "AWS IoT Core for Device Location adds Confidence Level Configuration and Measurement Type support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-iot-core-device-location/"
    "published": "2026-05-06 01:59:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p>AWS IoT Core for Device Location now supports two enhancements that give developers greater control over location resolution and richer metadata for resolved device locations.<br /> <br /> Customers using the Cell ID, Wi-Fi, or Cell+Wi-Fi solvers can now specify a desired confidence level between 50% and 99% when resolving device locations. The confidence level represents the statistical probability that the actual device location falls within the reported accuracy radius. A higher confidence level (for example, 95%) increases certainty that the device falls within the reported radius but produces a larger accuracy radius. A lower confidence level (for example, 50%) yields a smaller radius with less certainty. Customers can now configure this value to balance accuracy and confidence based on their specific requirements. This feature is currently supported for HTTP-based location resolution.<br /> <br /> This update also introduces a measurement type field in resolved location metadata, giving developers greater visibility into how each device location was determined — whether through GNSS, Wi-Fi or BLE location resolvers. This make it easier to assess location data quality, debug positioning issues, and make more informed decisions based on how each location was determined.<br /> <br /> These updates are available in all AWS IoT Core for Device Location supported regions. For detailed guidance and implementation instructions, visit the <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/device-location.html\">AWS IoT Core Device Location</a> and <a href=\"https://docs.aws.amazon.com/iot-wireless/latest/developerguide/what-is-iot-wireless.html\">IoT Wireless Developer Guide</a> .</p>"
  "6727bb077852e99d9660fdb6d76df1c0":
    "id": "6727bb077852e99d9660fdb6d76df1c0"
    "title": "Amazon Quick now integrates with New Relic for observability-driven AI agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-new-relic/"
    "published": "2026-05-06 01:35:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p>Amazon Quick, your AI assistant for work,&nbsp;now integrates with New Relic's AI agents, enabling&nbsp;on-call engineers, SREs, and engineering leaders&nbsp;to&nbsp;investigate incidents, generate root cause analysis briefs, and create tracked tasks without leaving their Amazon Quick workspace.</p> \n<p>After connecting to New Relic's remote model context protocol (MCP) server, you can invoke New Relic's AI&nbsp;agents&nbsp;directly from a conversational prompt in Quick&nbsp;–&nbsp;including alert insights, user impact analysis, log analysis, transaction diagnostics, and natural language NRQL queries. In a single chat exchange, you can investigate an incident across your observability data, generate a root cause analysis (RCA) document with evidence links, and send it as an email attachment. Quick Flows can also invoke New Relic AI agents to automate recurring triage runbooks or escalation workflows. Because Quick surfaces responses alongside enterprise knowledge stored in Spaces&nbsp;-&nbsp;such as runbooks, architecture docs, and on-call policies—every answer reflects both live telemetry and organizational context.&nbsp;</p> \n<p>The New Relic integration with Amazon Quick is available in all&nbsp;<a href=\"https://aws.amazon.com//about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a>&nbsp;where Amazon Quick is available.</p> \n<p>To get started with Amazon Quick,&nbsp;<a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">visit the website</a>&nbsp;and sign up in minutes. To learn more about the&nbsp;New Relic integration, read the&nbsp;<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/newrelic-integration.html\" target=\"_blank\">New Relic integration guide</a>, and explore more&nbsp;Quick&nbsp;integrations on the&nbsp;<a href=\"https://aws.amazon.com/quick/integrations/\" target=\"_blank\">integrations page</a>.&nbsp;</p>"
  "72859a90565a97119103a735cc53bf24":
    "id": "72859a90565a97119103a735cc53bf24"
    "title": "EC2 Instance Store CSI driver now generally available in EKS add-ons"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/ec2-csi-eks/"
    "published": "2026-05-06 01:22:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) now supports using the Amazon EKS console, and AWS Command Line Interface (CLI) to install and manage the Amazon&nbsp;<a href=\"https://docs.aws.amazon.com/eks/latest/userguide/lis-csi.html\" rel=\"noopener noreferrer\" target=\"_blank\">Elastic Cloud Compute (EC2)</a>&nbsp;Container Storage Interface (CSI) driver. This launch enables a simple experience for attaching a EC2 local instance store to an EKS cluster.</p> \n<p>The Amazon EC2 Instance Store CSI driver is a plugin that enables Kubernetes to use EC2 instance store volumes. Instance store volumes provide ephemeral block-level storage that is physically attached to the host computer. The driver manages the lifecycle of these NVMe storage volumes and makes them available as Kubernetes&nbsp;<a href=\"https://kubernetes.io/docs/concepts/storage/persistent-volumes/\" rel=\"noopener noreferrer\" target=\"_blank\">persistent volumes</a>.&nbsp;</p> \n<p>This feature is available in all commercial regions. To get started and learn more visit the&nbsp;<a href=\"https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EKS documentation</a>.</p>"
"last_updated": "2026-05-06 05:04:30 JST"
