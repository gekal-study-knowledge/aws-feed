    "title": "形式的検証済み AES-XTS: s2n-bignum に加わった初の AES アルゴリズム"
    "link": "https://aws.amazon.com/jp/blogs/news/formally-verified-aes-xts-the-first-aes-algorithm-to-join-s2n-bignum/"
    "published": "2026-05-21 13:28:49"
    "fetched": "2026-05-21 15:52:38"
    "summary": "AWS は AES-XTS 復号の最適化された Arm64 アセンブリ実装の形式的検証に成功し、s2n-bignum ライブラリに初の AES アルゴリズムとして追加しました。本記事では、コア演算のアセンブリコードを単純化することで SLOTHY による自動最適化を可能にし、HOL Light 対話型定理証明器を用いて IEEE 1619 仕様への適合を数学的に証明したプロセスを紹介します。暗号文スティーリングや定数時間設計、メモリ安全性の検証についても解説します。"
