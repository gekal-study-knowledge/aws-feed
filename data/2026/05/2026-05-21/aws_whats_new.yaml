"entries":
  "070ed864d373f5c32279a0980923c2d0":
    "id": "070ed864d373f5c32279a0980923c2d0"
    "title": "Security Hub Extended expands to 21 curated partner solutions across 9 categories"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-security-hub-extended/"
    "published": "2026-05-21 03:00:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<p>AWS Security Hub Extended plan now includes 21 curated partner solutions across 9 security categories, adding SentinelOne (endpoint), CyberArk (identity), Sublime (email), Varonis (data security), LayerX (browser), Native Security (cloud), and Zenity (AI security). With these additions, you have more flexibility to select the solutions that best fit your enterprise security requirements. All solutions have published pay-as-you-go pricing, a single AWS bill, automatic Enterprise Discount Program (EDP) eligibility, unified Level 1 support for AWS Enterprise Support customers, and no long-term commitments.</p> \n<p><br /> Security Hub Extended is a plan of Security Hub that helps simplify how you procure, deploy, and integrate a full-stack enterprise security solution across endpoint, identity, email, network, data, browser, cloud, AI, and security operations. With today's expansion, you now have more choice within each category, selecting between established leaders and fast-growing innovators across your security domains. Security findings from all participating solutions are emitted in the Open Cybersecurity Schema Framework (OCSF) schema and automatically aggregated in AWS Security Hub. With the Extended plan, you can combine AWS and curated partner solutions to quickly identify and respond to risks that span boundaries.</p> \n<p>&nbsp;</p> \n<p>We will continue to expand the Extended plan based on customer feedback. The seven new curated partner solutions are available today in all AWS commercial Regions where Security Hub is available. For a list of supported Regions, see the<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?p=ngi&amp;loc=4&amp;refid=d8ec3b19-0f37-4f8c-8c12-189f913e205c\" rel=\"noopener noreferrer\" target=\"_blank\"> AWS Region table.</a> For more information about pricing, visit the<a href=\"https://aws.amazon.com/security-hub/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"> AWS Security Hub pricing page</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/securityhub/v2/home\" target=\"_blank\">AWS Security Hub console</a> or <a href=\"https://aws.amazon.com/security-hub/?nc=sn&amp;loc=1\" rel=\"noopener noreferrer\" target=\"_blank\">product page.</a></p>"
  "0627c7678759748504c60b6f8f304223":
    "id": "0627c7678759748504c60b6f8f304223"
    "title": "AWS announces ExtendDB, an open source DynamoDB-compatible adapter"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-extenddb-dynamodb/"
    "published": "2026-05-21 02:00:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<p>Today, Amazon Web Services (AWS) announced version 0.1 of ExtendDB, an open source project that implements the Amazon DynamoDB API with pluggable storage backends. Amazon DynamoDB is a serverless, fully managed NoSQL database with single-digit millisecond performance at any scale. ExtendDB enables application developers, platform teams, and enterprise architects to use the DynamoDB programming model in environments where the DynamoDB managed service is not available, including developer laptops, on-premises data centers, and disconnected edge sites, without rewriting application code.<br /> <br /> ExtendDB implements the DynamoDB control plane and data plane APIs, including operations on tables, items, and streams. The reference storage backend at launch is PostgreSQL, and the pluggable architecture allows the community to add new storage backends without modifying the core adapter. Developers can use ExtendDB for high-fidelity local development and continuous integration testing, and operate DynamoDB-shaped workloads in on-premises data centers backed by a supported database.<br /> <br /> ExtendDB is maintained by AWS, released under the Apache 2.0 license, and developed in the open on GitHub. We invite the community to contribute backend implementations, submit feedback, and participate in the project's evolution. To learn more, see the <a href=\"https://extenddb.org\">ExtendDB project page</a> and the AWS database <a href=\"https://aws.amazon.com/blogs/database/introducing-extenddb-an-open-source-dynamodb-compatible-adapter-with-pluggable-storage-backends/\">blog post</a>. To get started or contribute, visit the <a href=\"https://github.com/ExtendDB/extenddb\">GitHub repository</a>.<a href=\"https://github.com/ExtendDB/extenddb\"></a></p>"
  "e3acfaf1c5d350353e54447f5ced2bbf":
    "id": "e3acfaf1c5d350353e54447f5ced2bbf"
    "title": "AWS Billing Conductor Improves Account Visibility with Billing Transfer Inventory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-billing-conductor-billing-transfer/"
    "published": "2026-05-21 01:28:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing Conductor Console now enables you to see which accounts have received or accepted billing transfer invites but still lack access to pro forma billing data. </span></span></p> \n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\">&nbsp;</p> \n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">This page helps customers detect and close gaps in their account’s billing visibility. When an account accepts a billing transfer invitation, billing data is transferred to the inviting account. By configuring a billing group via AWS Billing Conductor, accounts can access pro forma cost data across Billing and Cost Management tools. This page provides visibility into what accounts currently lack access to pro forma billing data, making it easier to complete this configuration step. Customers can also sign up for daily notifications via AWS User Notifications and Amazon </span><span class=\"NormalTextRun SpellingErrorV2Themed CommentHighlightClicked SCXW31228399 BCX2\">EventBridge</span><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> to receive a summary of accepted billing transfers that lack a corresponding billing group. Notifications are available via email, Amazon Q Developer in chat applications (Slack, Microsoft Teams, and Amazon Chime), AWS Console Mobile Application push notifications, and the Console Notifications Center.</span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"></span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">These features are available in the US East (N. Virginia) region. To get started, visit the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing Conductor console</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. To learn more about setting up </span><span class=\"NormalTextRun SpellingErrorV2Themed CommentHighlightClicked SCXW31228399 BCX2\">EventBridge</span><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> integration, see the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">EventBridge documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. For instructions on configuring User Notifications, see the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">User Notifications documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. To learn more about Billing Transfer and AWS Billing Conductor visit the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">Billing Transfer product page</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">, </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> and the</span></span><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Cost Management documentation.</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> </span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<p>&nbsp;</p>"
  "6b3a82cd7293254fe4ef5ac324c8e1a3":
    "id": "6b3a82cd7293254fe4ef5ac324c8e1a3"
    "title": "ECS supports native integration with Amazon EBS volumes in GovCloud Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/ecs-amazon-ebs-govcloud/"
    "published": "2026-05-21 00:53:00"
    "fetched": "2026-05-21 06:48:37"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (ECS) now supports mounting Amazon Elastic Block Store (EBS) volumes to containers in the AWS GovCloud Regions. This capability makes it easier for you to deploy storage and data intensive applications such as ETL jobs, media transcoding, and ML inference workloads using serverless containers.<br /> With EBS task attachment, customers can allow ECS to provision, manage and de-provision EBS Volumes with each new ECS Task launch. EBS task attachment will automatically wire these volumes to their containerized workloads. Customers can have ECS format an empty volume on their behalf or bring an EBS snapshot for ECS to use to create new volumes.<br /> EBS task attachment is now available in the AWS GovCloud Regions for EC2, Fargate, and Managed Instances launch types. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ebs-volumes.html\"><i>Use Amazon EBS volumes with Amazon ECS</i></a> in the Amazon ECS Developer Guide.</p>"
  "be74bae976a8c895b03b2d5283f370a2":
    "id": "be74bae976a8c895b03b2d5283f370a2"
    "title": "AWS Security Hub now uncovers identity risks from unused access"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-security-hub-unused-access/"
    "published": "2026-05-21 05:20:00"
    "fetched": "2026-05-21 08:09:00"
    "summary": "<p>Today, AWS Security Hub brings identity risk into the same unified console where central security teams already manage threats, exposures, and posture findings. Security Hub now detects unused IAM permissions, roles, and credentials across your AWS organization, helping central security teams identify and reduce identity risk at scale. Until now, managing identity risk across hundreds of accounts required toggling between multiple tools, with no unified view connecting unused permissions to actual resource exposure. Security Hub now surfaces these identity risks alongside threats, exposures, and posture findings in a unified console, enabling teams to prioritize remediation based on actual organizational risk.<br /> <br /> When you enable Security Hub for your organization, a service-linked IAM Access Analyzer is automatically created in each member account with no additional configuration required. Security Hub evaluates IAM principals against 90 days of actual access activity, detects unused access, and correlates identity findings with exposure context so teams can focus on the risks that matter most. Security Hub also provides on-demand generation of recommended least-privilege policies based on actual usage patterns, helping teams refine IAM permissions and reduce their attack surface. These capabilities represent a foundational step toward broader cloud infrastructure entitlement management in Security Hub, delivered with consistent workflows, automation rules, and downstream integrations.&nbsp;These capabilities are included with Security Hub Essentials at no additional cost.<br /> <br /> To learn more, see Understanding unused access findings in Security Hub in the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\">AWS Security Hub User Guide </a>and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "a82467b2ce45540778b6cd96ccf2d3cb":
    "id": "a82467b2ce45540778b6cd96ccf2d3cb"
    "title": "Amazon SageMaker Unified Studio now supports data quality rule authoring and evaluation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/smus-data-quality"
    "published": "2026-05-21 02:42:00"
    "fetched": "2026-05-22 02:28:55"
    "summary": "<p>Amazon SageMaker Unified Studio now supports data quality rule authoring and evaluation, powered by AWS Glue Data Quality. Data engineers, analysts, and data scientists can define data quality rules, run ruleset evaluations, and view results directly within SageMaker Unified Studio for both data at rest in catalog tables and data in transit within Visual ETL jobs. This helps you catch data quality issues before bad data enters your data lakes or affects downstream analytics and machine learning workloads.<br /> <br /> With this launch, you can author rules using the same Data Quality Definition Language (DQDL) used in AWS Glue Data Quality and run evaluations directly in SageMaker Unified Studio across two workflows. For data at rest, a dedicated Data Quality tab on catalog assets provides rule authoring, on-demand or scheduled evaluations, and detailed per-rule pass/fail results. For data in transit, you can add an Evaluate Data Quality transform to any Visual ETL job, and review data quality results as part of the run details. You can create rulesets that check for completeness, uniqueness, freshness, accuracy, and other data quality dimensions.<br /> <br /> This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available, in both AWS IAM Identity Center-based and IAM-based domains. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-quality-catalog.html\">Amazon SageMaker Unified Studio documentation.</a></p>"
  "346783ede69fbc07481488b41755c5f1":
    "id": "346783ede69fbc07481488b41755c5f1"
    "title": "Amazon Bedrock expands support for request-level usage attribution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-bedrock-request-level-usage-attribution/"
    "published": "2026-05-21 08:34:00"
    "fetched": "2026-05-22 04:49:01"
    "summary": "<p>Amazon Bedrock customers can now attribute model inference usage to specific teams, applications, environments, and experiments at the individual request level on the InvokeModel and InvokeModelWithResponseStream APIs. This gives customers fine-grained visibility into how their Amazon Bedrock usage is distributed across their organization, helping them<br /> understand consumption patterns, optimize spend, and report usage back to internal stakeholders without provisioning additional resources.<br /> <br /> This launch builds on Amazon Bedrock's existing portfolio of usage attribution capabilities. Customers can already attribute model inference usage at the resource and identity level using application inference profiles, IAM principal-based attribution, project-level tracking on the OpenAI-compatible bedrock-mantle endpoint, and workspace-level tracking for<br /> Anthropic Claude models. For finer-grained, per-request attribution, the Converse and ConverseStream APIs have supported request-level metadata since launch. Today's release brings the same capability to the InvokeModel and InvokeModelWithResponseStream APIs, giving customers a consistent way to tag inference calls across the entire bedrock-runtime endpoint.<br /> <br /> With this launch, customers can tag each Amazon Bedrock model inference call with attributes like team, project, or environment, and analyze usage by these tags in Amazon Bedrock model invocation logs. To get started, enable model invocation logging in the AWS Region where you call Amazon Bedrock, then add metadata to your inference requests. This feature is available in all AWS commercial Regions where Amazon Bedrock is available. To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/cost-mgmt-request-metadata.html\">Request metadata</a>.&nbsp;</p>"
  "e6273aaeffa7116f4f27a58485a147f8":
    "id": "e6273aaeffa7116f4f27a58485a147f8"
    "title": "Amazon RDS Custom now supports the latest GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-custom-sql-server-latest-gdr-updates-microsoft-sql-server"
    "published": "2026-05-21 16:22:00"
    "fetched": "2026-05-22 06:24:13"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/help/5084816\" rel=\"noopener noreferrer\" target=\"_blank\">KB5084816</a> (RDS version 15.00.4465.1.v1) and SQL Server 2022 CU24+GDR <a href=\"https://support.microsoft.com/help/5083252\" rel=\"noopener noreferrer\" target=\"_blank\">KB5083252</a> (RDS version 16.00.4250.1.v1).<br /> <br /> The GDR updates address vulnerabilities described in CVE-2026-32167 and CVE-2026-32176. For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5084816, KB5083252. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
  "78bb7e7e02033366681dd370823dd7bf":
    "id": "78bb7e7e02033366681dd370823dd7bf"
    "title": "Amazon DocumentDB (with MongoDB compatibility) Serverless is now available on DocumentDB 8.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/5/docdb8-serverless"
    "published": "2026-05-21 03:17:00"
    "fetched": "2026-05-22 06:24:13"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) Serverless, an on-demand, auto-scaling configuration for DocumentDB, is now available on version 8.0. Amazon DocumentDB Serverless automatically scales capacity up or down in fine-grained increments based on your application's demand, offering up to 90% cost savings compared to provisioning for peak capacity.<br /> <br /> DocumentDB 8.0 improves query latency by up to 7x and compression ratio by up to 5x, while adding compatibility with MongoDB API versions 6.0, 7.0, and 8.0. It also introduces enhanced vector search with up to 30x faster index builds, new aggregation stages and operators, and support for collation and views. DocumentDB Serverless is available for both new and existing clusters on Amazon DocumentDB 8.0.</p> \n<p>You can use the in-place major version upgrade (MVU) to convert your Amazon DocumentDB 5.0 clusters to Amazon DocumentDB 8.0 clusters. Please see&nbsp;<a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-migration.versions.html\"><u>upgrading your DocumentDB cluster</u></a>&nbsp;to learn more. To learn more about the regions Amazon DocumentDB Serverless is available, see the&nbsp;<a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html#what-is-db-instances\">supported instance classes by region</a>. To learn more about Amazon DocumentDB Serverless, see the&nbsp;<a href=\"https://aws.amazon.com/documentdb/serverless\">overview</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-serverless.html\">documentation</a>, and&nbsp;<a href=\"https://aws.amazon.com/blogs/aws/amazon-documentdb-serverless-is-now-available\">AWS News blog</a></p>"
  "99ef1df6748c47b0970ca19959f7ec0c":
    "id": "99ef1df6748c47b0970ca19959f7ec0c"
    "title": "AWS Deadline Cloud now supports browsing job attachments in the monitor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-deadline-cloud/"
    "published": "2026-05-21 05:28:00"
    "fetched": "2026-05-27 12:27:08"
    "summary": "<p>AWS Deadline Cloud now supports browsing job attachment files directly within the Deadline Cloud monitor. AWS Deadline Cloud is a fully managed service that simplifies render management for teams creating computer-generated graphics and visual effects, for films, television, broadcasting, web content, and design.<br /> <br /> The Deadline Cloud job attachments feature simplifies managing input and output files for render jobs by handling uploads and downloads through Amazon S3. Previously, you could download all outputs for a job but couldn't easily see which specific files were attached as inputs or generated as outputs. With this new browsing capability, you can now view all attached files for a given job directly from the monitor in the browser or desktop application, clearly organized by inputs and outputs. You can also download individual files as needed, making it easy to retrieve specific assets without downloading everything.<br /> <br /> For more information, please visit the <a href=\"https://aws.amazon.com/deadline-cloud\">Deadline Cloud product page</a> and our <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/\">AWS Deadline Cloud documentation</a>.</p>"
  "ec45c49f8a3c17ceadc8c3949eccf53a":
    "id": "ec45c49f8a3c17ceadc8c3949eccf53a"
    "title": "Quick Research now supports customer managed keys"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-research-cmk"
    "published": "2026-05-21 16:00:00"
    "fetched": "2026-06-02 06:28:35"
    "summary": "<p>Amazon Quick Research now enables customers to encrypt their data using customer-managed keys (CMK) through AWS Key Management Service (KMS).</p> \n<p>This enhancement allows organizations with strict security and compliance requirements to manage their own encryption keys. With customer-managed keys, you gain enhanced security control and comprehensive audit capabilities through AWS CloudTrail integration. You can encrypt your data with your own KMS keys, trace all data access for security auditing, and revoke access to compromised keys within 15 minutes during security incidents. This feature supports multiple CMKs with one default key per AWS account per region, providing the flexibility to manage encryption across different datasets while maintaining granular control over your sensitive business intelligence data.</p> \n<p>Customer-managed keys must be created in the same AWS account and region as your Quick resources, and only symmetric AWS KMS keys are supported.</p> \n<p>This feature is generally available in all AWS Regions&nbsp;<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\" rel=\"noopener noreferrer\" target=\"_blank\">where Amazon Quick is available</a>. To learn more, visit the&nbsp;<a href=\"https://aws.amazon.com/quick/research/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick Research detail page</a>.</p>"
"last_updated": "2026-06-02 06:28:35 JST"
