  "070ed864d373f5c32279a0980923c2d0":
    "id": "070ed864d373f5c32279a0980923c2d0"
    "title": "Security Hub Extended expands to 21 curated partner solutions across 9 categories"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-security-hub-extended/"
    "published": "2026-05-21 03:00:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<p>AWS Security Hub Extended plan now includes 21 curated partner solutions across 9 security categories, adding SentinelOne (endpoint), CyberArk (identity), Sublime (email), Varonis (data security), LayerX (browser), Native Security (cloud), and Zenity (AI security). With these additions, you have more flexibility to select the solutions that best fit your enterprise security requirements. All solutions have published pay-as-you-go pricing, a single AWS bill, automatic Enterprise Discount Program (EDP) eligibility, unified Level 1 support for AWS Enterprise Support customers, and no long-term commitments.</p> \n<p><br /> Security Hub Extended is a plan of Security Hub that helps simplify how you procure, deploy, and integrate a full-stack enterprise security solution across endpoint, identity, email, network, data, browser, cloud, AI, and security operations. With today's expansion, you now have more choice within each category, selecting between established leaders and fast-growing innovators across your security domains. Security findings from all participating solutions are emitted in the Open Cybersecurity Schema Framework (OCSF) schema and automatically aggregated in AWS Security Hub. With the Extended plan, you can combine AWS and curated partner solutions to quickly identify and respond to risks that span boundaries.</p> \n<p>&nbsp;</p> \n<p>We will continue to expand the Extended plan based on customer feedback. The seven new curated partner solutions are available today in all AWS commercial Regions where Security Hub is available. For a list of supported Regions, see the<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?p=ngi&amp;loc=4&amp;refid=d8ec3b19-0f37-4f8c-8c12-189f913e205c\" rel=\"noopener noreferrer\" target=\"_blank\"> AWS Region table.</a> For more information about pricing, visit the<a href=\"https://aws.amazon.com/security-hub/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"> AWS Security Hub pricing page</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/securityhub/v2/home\" target=\"_blank\">AWS Security Hub console</a> or <a href=\"https://aws.amazon.com/security-hub/?nc=sn&amp;loc=1\" rel=\"noopener noreferrer\" target=\"_blank\">product page.</a></p>"
  "0627c7678759748504c60b6f8f304223":
    "id": "0627c7678759748504c60b6f8f304223"
    "title": "AWS announces ExtendDB, an open source DynamoDB-compatible adapter"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-extenddb-dynamodb/"
    "published": "2026-05-21 02:00:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<p>Today, Amazon Web Services (AWS) announced version 0.1 of ExtendDB, an open source project that implements the Amazon DynamoDB API with pluggable storage backends. Amazon DynamoDB is a serverless, fully managed NoSQL database with single-digit millisecond performance at any scale. ExtendDB enables application developers, platform teams, and enterprise architects to use the DynamoDB programming model in environments where the DynamoDB managed service is not available, including developer laptops, on-premises data centers, and disconnected edge sites, without rewriting application code.<br /> <br /> ExtendDB implements the DynamoDB control plane and data plane APIs, including operations on tables, items, and streams. The reference storage backend at launch is PostgreSQL, and the pluggable architecture allows the community to add new storage backends without modifying the core adapter. Developers can use ExtendDB for high-fidelity local development and continuous integration testing, and operate DynamoDB-shaped workloads in on-premises data centers backed by a supported database.<br /> <br /> ExtendDB is maintained by AWS, released under the Apache 2.0 license, and developed in the open on GitHub. We invite the community to contribute backend implementations, submit feedback, and participate in the project's evolution. To learn more, see the <a href=\"https://extenddb.org\">ExtendDB project page</a> and the AWS database <a href=\"https://aws.amazon.com/blogs/database/introducing-extenddb-an-open-source-dynamodb-compatible-adapter-with-pluggable-storage-backends/\">blog post</a>. To get started or contribute, visit the <a href=\"https://github.com/ExtendDB/extenddb\">GitHub repository</a>.<a href=\"https://github.com/ExtendDB/extenddb\"></a></p>"
  "e3acfaf1c5d350353e54447f5ced2bbf":
    "id": "e3acfaf1c5d350353e54447f5ced2bbf"
    "title": "AWS Billing Conductor Improves Account Visibility with Billing Transfer Inventory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-billing-conductor-billing-transfer/"
    "published": "2026-05-21 01:28:00"
    "fetched": "2026-05-21 04:21:31"
    "summary": "<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing Conductor Console now enables you to see which accounts have received or accepted billing transfer invites but still lack access to pro forma billing data. </span></span></p> \n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\">&nbsp;</p> \n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">This page helps customers detect and close gaps in their account’s billing visibility. When an account accepts a billing transfer invitation, billing data is transferred to the inviting account. By configuring a billing group via AWS Billing Conductor, accounts can access pro forma cost data across Billing and Cost Management tools. This page provides visibility into what accounts currently lack access to pro forma billing data, making it easier to complete this configuration step. Customers can also sign up for daily notifications via AWS User Notifications and Amazon </span><span class=\"NormalTextRun SpellingErrorV2Themed CommentHighlightClicked SCXW31228399 BCX2\">EventBridge</span><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> to receive a summary of accepted billing transfers that lack a corresponding billing group. Notifications are available via email, Amazon Q Developer in chat applications (Slack, Microsoft Teams, and Amazon Chime), AWS Console Mobile Application push notifications, and the Console Notifications Center.</span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"></span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW31228399 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW31228399 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; margin: 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">These features are available in the US East (N. Virginia) region. To get started, visit the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing Conductor console</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. To learn more about setting up </span><span class=\"NormalTextRun SpellingErrorV2Themed CommentHighlightClicked SCXW31228399 BCX2\">EventBridge</span><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> integration, see the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">EventBridge documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. For instructions on configuring User Notifications, see the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">User Notifications documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">. To learn more about Billing Transfer and AWS Billing Conductor visit the </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">Billing Transfer product page</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">, </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Billing documentation</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> and the</span></span><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> </span></span><a class=\"Hyperlink SCXW31228399 BCX2\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\">AWS Cost Management documentation.</span></span></a><span class=\"TextRun SCXW31228399 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentHighlightClicked SCXW31228399 BCX2\"> </span></span><span class=\"EOP CommentHighlightClicked SCXW31228399 BCX2\">&nbsp;</span></p> \n</div> \n<p>&nbsp;</p>"
  "6b3a82cd7293254fe4ef5ac324c8e1a3":
    "id": "6b3a82cd7293254fe4ef5ac324c8e1a3"
    "title": "ECS supports native integration with Amazon EBS volumes in GovCloud Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/ecs-amazon-ebs-govcloud/"
    "published": "2026-05-21 00:53:00"
    "fetched": "2026-05-21 06:48:37"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (ECS) now supports mounting Amazon Elastic Block Store (EBS) volumes to containers in the AWS GovCloud Regions. This capability makes it easier for you to deploy storage and data intensive applications such as ETL jobs, media transcoding, and ML inference workloads using serverless containers.<br /> With EBS task attachment, customers can allow ECS to provision, manage and de-provision EBS Volumes with each new ECS Task launch. EBS task attachment will automatically wire these volumes to their containerized workloads. Customers can have ECS format an empty volume on their behalf or bring an EBS snapshot for ECS to use to create new volumes.<br /> EBS task attachment is now available in the AWS GovCloud Regions for EC2, Fargate, and Managed Instances launch types. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ebs-volumes.html\"><i>Use Amazon EBS volumes with Amazon ECS</i></a> in the Amazon ECS Developer Guide.</p>"
"last_updated": "2026-05-21 06:48:37 JST"
