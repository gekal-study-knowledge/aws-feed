    "title": "AWS SAM CLI adds AWS CloudFormation Language Extensions support to accelerate local serverless development"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-sam-cli-cloudformation/"
    "published": "2026-05-19 01:31:00"
    "fetched": "2026-05-19 02:57:32"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli.html\" target=\"_blank\">AWS SAM CLI</a> now supports <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/transform-aws-languageextensions.html\" target=\"_blank\">AWS CloudFormation Language Extensions</a>, enabling you to reduce duplication in your infrastructure as code (IaC) templates while retaining the full local development workflow. This accelerates your serverless development by letting you define resources once and iterate locally without waiting for cloud deployments.</p> \n<p>Developers frequently need to define multiple similar resources, such as Lambda functions, DynamoDB tables, or SNS topics, from a single template definition. However, developers who use SAM CLI to build, test, and deploy their serverless applications previously could not process templates that use CloudFormation Language Extensions. This required choosing between reducing template duplication and using SAM CLI for local development. Now, SAM CLI processes Language Extensions in memory for local operations while preserving your original template for CloudFormation deployment. You can define your resources once and test them locally across all SAM CLI commands, catching errors like invalid syntax or missing dependencies before deploying. This shortens your iteration cycles and reduces time spent debugging failed deployments in the cloud.</p> \n<p>To get started, download or update SAM CLI to the latest version. Add the AWS::LanguageExtensions transform to your SAM template and use Fn::ForEach to generate multiple resources from a single definition. SAM CLI commands including sam build, sam local invoke, sam sync, sam local start-api, and sam validate will automatically expand your loops and process each generated resource. You can invoke expanded functions by name, for example sam local invoke AlphaFunction. SAM CLI also supports Fn::Length, Fn::ToJsonString, Fn::FindInMap with DefaultValue, and conditional DeletionPolicy and UpdateReplacePolicy attributes.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-language-extensions.html\" target=\"_blank\">SAM CLI developer guide</a>&nbsp;and <a href=\"https://builder.aws.com/content/3DiJq5vQ2hnGq1ddBlCApT8uy6u/dynamic-looping-comes-to-aws-sam\" target=\"_blank\">launch blog post</a>.</p>"
  "5660994ffa528ccf5afc84e6a37728b5":
    "id": "5660994ffa528ccf5afc84e6a37728b5"
    "title": "Amazon SageMaker Studio now supports GPU capacity reservation through SageMaker Flexible Training Plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-training-plan-support-for-studio/"
    "published": "2026-05-19 00:00:00"
    "fetched": "2026-05-19 04:46:46"
    "summary": "<p>Amazon SageMaker Studio IDEs, including JupyterLab and Code Editor, now support GPU capacity reservations through <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/reserve-capacity-with-training-plans.html\">SageMaker Flexible Training Plans (FTP)</a>, giving you predictable access to high-demand, high-performance computational resources within your budget. By leveraging FTP, you can achieve up to 65% cost savings compared to On-Demand instances while running ML workflows in JupyterLab or Code Editor.<br /> <br /> FTP provides a fully self-serve procurement experience. To get started, navigate to the SageMaker FTP console and select your preferred instance type, reservation length, and start date for your Studio IDE workload. Review your order, complete the purchase, and wait for the plan to become active. When creating a Studio app from the SageMaker Studio UI, select your purchased plan from the Instance dropdown. SageMaker provisions the instance automatically with no infrastructure management required on your part. As your plan nears expiration, the IDE proactively notifies you, giving you time to save your work before the reservation ends.<br /> </p> \n<p>To learn more about using FTP capacity reservation capability with Studio IDEs, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/training-plan-utilization-for-studio-apps.html\">Using Training Plans with Studio IDEs</a>.<br /> To learn about launching JupyterLab and Code Editor applications in SageMaker Studio, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-spaces.html\">Studio Spaces documentation</a>.</p> \n<p>&nbsp;</p>"
