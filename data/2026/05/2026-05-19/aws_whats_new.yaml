  "5bb6e06c5f1eb312a747f94dd76c6515":
    "id": "5bb6e06c5f1eb312a747f94dd76c6515"
    "title": "AWS SAM CLI adds AWS CloudFormation Language Extensions support to accelerate local serverless development"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-sam-cli-cloudformation/"
    "published": "2026-05-19 01:31:00"
    "fetched": "2026-05-19 02:57:32"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli.html\" target=\"_blank\">AWS SAM CLI</a> now supports <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/transform-aws-languageextensions.html\" target=\"_blank\">AWS CloudFormation Language Extensions</a>, enabling you to reduce duplication in your infrastructure as code (IaC) templates while retaining the full local development workflow. This accelerates your serverless development by letting you define resources once and iterate locally without waiting for cloud deployments.</p> \n<p>Developers frequently need to define multiple similar resources, such as Lambda functions, DynamoDB tables, or SNS topics, from a single template definition. However, developers who use SAM CLI to build, test, and deploy their serverless applications previously could not process templates that use CloudFormation Language Extensions. This required choosing between reducing template duplication and using SAM CLI for local development. Now, SAM CLI processes Language Extensions in memory for local operations while preserving your original template for CloudFormation deployment. You can define your resources once and test them locally across all SAM CLI commands, catching errors like invalid syntax or missing dependencies before deploying. This shortens your iteration cycles and reduces time spent debugging failed deployments in the cloud.</p> \n<p>To get started, download or update SAM CLI to the latest version. Add the AWS::LanguageExtensions transform to your SAM template and use Fn::ForEach to generate multiple resources from a single definition. SAM CLI commands including sam build, sam local invoke, sam sync, sam local start-api, and sam validate will automatically expand your loops and process each generated resource. You can invoke expanded functions by name, for example sam local invoke AlphaFunction. SAM CLI also supports Fn::Length, Fn::ToJsonString, Fn::FindInMap with DefaultValue, and conditional DeletionPolicy and UpdateReplacePolicy attributes.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-language-extensions.html\" target=\"_blank\">SAM CLI developer guide</a>&nbsp;and <a href=\"https://builder.aws.com/content/3DiJq5vQ2hnGq1ddBlCApT8uy6u/dynamic-looping-comes-to-aws-sam\" target=\"_blank\">launch blog post</a>.</p>"
  "5660994ffa528ccf5afc84e6a37728b5":
    "id": "5660994ffa528ccf5afc84e6a37728b5"
    "title": "Amazon SageMaker Studio now supports GPU capacity reservation through SageMaker Flexible Training Plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-training-plan-support-for-studio/"
    "published": "2026-05-19 00:00:00"
    "fetched": "2026-05-19 04:46:46"
    "summary": "<p>Amazon SageMaker Studio IDEs, including JupyterLab and Code Editor, now support GPU capacity reservations through <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/reserve-capacity-with-training-plans.html\">SageMaker Flexible Training Plans (FTP)</a>, giving you predictable access to high-demand, high-performance computational resources within your budget. By leveraging FTP, you can achieve up to 65% cost savings compared to On-Demand instances while running ML workflows in JupyterLab or Code Editor.<br /> <br /> FTP provides a fully self-serve procurement experience. To get started, navigate to the SageMaker FTP console and select your preferred instance type, reservation length, and start date for your Studio IDE workload. Review your order, complete the purchase, and wait for the plan to become active. When creating a Studio app from the SageMaker Studio UI, select your purchased plan from the Instance dropdown. SageMaker provisions the instance automatically with no infrastructure management required on your part. As your plan nears expiration, the IDE proactively notifies you, giving you time to save your work before the reservation ends.<br /> </p> \n<p>To learn more about using FTP capacity reservation capability with Studio IDEs, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/training-plan-utilization-for-studio-apps.html\">Using Training Plans with Studio IDEs</a>.<br /> To learn about launching JupyterLab and Code Editor applications in SageMaker Studio, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-spaces.html\">Studio Spaces documentation</a>.</p> \n<p>&nbsp;</p>"
  "49937774e811f4a6b71b617b05eb21f1":
    "id": "49937774e811f4a6b71b617b05eb21f1"
    "title": "Amazon EVS enables support for 32 hosts per environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-evs-32-hosts"
    "published": "2026-05-19 02:55:00"
    "fetched": "2026-05-19 06:07:51"
    "summary": "<p>Today, we are announcing that Amazon Elastic VMware Service (Amazon EVS) now supports up to 32&nbsp;ESXi&nbsp;hosts per environment, double the&nbsp;previous&nbsp;limit of 16 hosts.</p> \n<p>Amazon EVS gives you flexibility in how you configure VMware Cloud Foundation (VCF) domains and clusters within an environment. You can put all your hosts into a single large cluster, spread them across several smaller clusters, or any combination that fits your needs. With this release, you can now&nbsp;submit&nbsp;a service quota increase to&nbsp;scale up to a total of 32 hosts and&nbsp;reduce the operational overhead of managing multiple environments.</p> \n<p>This latest release is available in all regions where Amazon EVS&nbsp;is&nbsp;offered.</p> \n<p>For more details&nbsp;on the steps and procedure, visit the Amazon EVS&nbsp;<a href=\"https://aws.amazon.com/evs/\">product detail page</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide.</a></p>"
  "6bfa492c5c03cfd6b771425da0a5d9d1":
    "id": "6bfa492c5c03cfd6b771425da0a5d9d1"
    "title": "Amazon Redshift adds ALTER TABLE for Iceberg tables and writes via the AWS Glue Data Catalog mount"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-redshift-alter-table-iceberg/"
    "published": "2026-05-19 01:25:00"
    "fetched": "2026-05-19 06:07:51"
    "summary": "<p><a href=\"http://aws.amazon.com/redshift\">Amazon Redshift</a> now supports writing directly to Apache Iceberg tables via the AWS Glue Data Catalog (awsdatacatalog) mount and ALTER TABLE DDL statements to modify the schema, partitioning, and properties of Apache Iceberg tables. With write access through the auto-mounted awsdatacatalog, you can land Redshift transformations in your data lake for any engine to query without creating external schemas—particularly useful for Iceberg tables federated with AWS Lake Formation.&nbsp;Supported ALTER TABLE operations include ADD/DROP/ALTER columns, RENAME COLUMN, SET TABLE PROPERTIES to overwrite the default compression type, and ADD/DROP/REPLACE PARTITION FIELD to adapt partitioning strategies as data volumes grow. Previously, updating the structure of Iceberg tables required deleting the table and its data, adding complexity and latency to data pipelines.&nbsp;Tables modified by Redshift remain compatible with other Iceberg-compatible engines, including <a href=\"https://aws.amazon.com/emr/\">Amazon EMR</a> and <a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a>, preserving cross-engine interoperability. AWS Lake Formation permissions are supported for Iceberg write operations.<br /> <br /> These capabilities are available in all AWS Regions where Amazon Redshift is available. To get started, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/redshift/latest/dg/referencing-iceberg-tables.html\">Referencing Iceberg tables in Amazon Redshift</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-alter-table.html\">Altering table definitions</a> sections in the Amazon Redshift Database Developer Guide.</p>"
  "b0e11d8c33512b94b3f607d5727d45dd":
    "id": "b0e11d8c33512b94b3f607d5727d45dd"
    "title": "AWS Management Console now displays AWS Local Zones in the Region Selector"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-local-zones-region-selector/"
    "published": "2026-05-19 06:50:00"
    "fetched": "2026-05-19 07:57:26"
    "summary": "<p>Today, AWS announces the addition of AWS Local Zones to the Region selector in the AWS Management Console, providing a unified experience across AWS global infrastructure. AWS Local Zones now appear alongside AWS Regions in the Console's top navigation, making it easier for customers to quickly navigate to the Console page for managing their resources in AWS Local Zones.</p> \n<p>Now, when customers select the Local Zones tab in the Region selector, they will see all opted-in AWS Local Zones in one place. Clicking on an AWS Local Zone takes customers directly to its parent Region's Console page to view and manage resources. This capability streamlines navigation for customers operating across multiple AWS Local Zones parented to different AWS Regions.</p> \n<p>This capability is available across all AWS Local Zones in public AWS Regions. To get started, navigate to the Region selector in the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>. For more information, see the <a href=\"https://docs.aws.amazon.com/local-zones/latest/ug/getting-started.html\">AWS Local Zones</a> documentation.<b></b></p>"
  "15bfda284c233e377ee54330d43bbff4":
    "id": "15bfda284c233e377ee54330d43bbff4"
    "title": "AWS Glue zero-ETL is now available in Asia Pacific (Mumbai) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-glue-zero-etl-mumbai-region"
    "published": "2026-05-19 06:10:00"
    "fetched": "2026-05-19 07:57:26"
    "summary": "<p>AWS Glue zero-ETL integrations are now available in the Asia Pacific (Mumbai) region. With this expansion, customers in the Asia Pacific (Mumbai) region can now use zero-ETL integrations to simplify their data pipelines, reduce data movement latency, and accelerate time-to-insight for analytics and machine learning workloads.<br /> <br /> Zero-ETL integrations offer a set of fully managed integrations by AWS that minimizes the need to build ETL data pipelines for common ingestion and replication use cases. You can use zero-ETL to replicate data from sources such as Amazon DynamoDB, Oracle Database@AWS, self-managed databases (Oracle, SQL Server, MySQL or PostgreSQL), and supported SaaS applications including Salesforce, SAP, Zendesk, and Zoho CRM directly into target analytics data stores without writing or maintaining ETL pipelines. It automatically handles schema mapping, change data capture, and incremental data replication, eliminating the need to build and manage complex data pipelines by yourself. This allows your data engineering teams to focus on deriving value from data rather than managing infrastructure, while replicating data in your target data stores in near real-time.<br /> <br /> To learn more, visit the AWS Glue <a href=\"https://docs.aws.amazon.com/glue/latest/dg/zero-etl-using.html\">documentation</a>.&nbsp;</p>"
  "aee3ed1bd0035ec0e1f8e824e200209c":
    "id": "aee3ed1bd0035ec0e1f8e824e200209c"
    "title": "Amazon Lightsail CDN distributions now support IPv6-only instances as origins"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-lightsail-cdn-ipv6/"
    "published": "2026-05-19 03:49:00"
    "fetched": "2026-05-19 07:57:26"
    "summary": "<p>Amazon Lightsail content delivery network (CDN) distributions now support IPv6-only instances as origins. This feature enables customers to use IPv6-only instances to deliver content through the Lightsail CDN distributions with low latency and high transfer speeds worldwide. With this launch, customers can run their websites and applications on cost-effective IPv6-only instances while seamlessly serving content to all end users, including those on networks that don't yet support IPv6 connectivity.<br /> <br /> Previously, only IPv4 and dual-stack instances were supported as origins for Lightsail CDN distributions. With this launch, customers can also use IPv6-only instances as origins for their Lightsail CDN distributions, making applications running on those instances accessible to all end users, regardless of whether end users have IPv6 connectivity. Lightsail CDN distributions support multiple origin types including instances, containers, buckets, and load balancers.</p> \n<p>Amazon Lightsail is available in <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html\">16 AWS Regions</a> including US East (N. Virginia), US West (Oregon), Europe (Frankfurt), Europe (London), Asia Pacific (Tokyo), and Asia Pacific (Malaysia). To get started, visit the <a href=\"https://lightsail.aws.amazon.com/\">Lightsail console</a>. For pricing and other details, visit the <a href=\"https://aws.amazon.com/lightsail/pricing/\">Amazon Lightsail pricing</a>.</p>"
  "b94aede6a5bf7d97ec3f3b56555ffdc7":
    "id": "b94aede6a5bf7d97ec3f3b56555ffdc7"
    "title": "Amazon ECS now integrates with Amazon EBS volumes in AWS GovCloud Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/ecs-amazon-ebs-govcloud/"
    "published": "2026-05-19 00:53:00"
    "fetched": "2026-05-22 08:00:01"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now integrates with Amazon Elastic Block Store (Amazon EBS) volumes in AWS GovCloud Regions. This capability makes it easier for you to deploy storage and data-intensive applications such as ETL jobs, media transcoding, and ML inference workloads using ECS.<br /> <br /> To use EBS volumes with your Amazon ECS tasks, simply configure the path you want the EBS volume to be mounted on in your task definition, and pass desired EBS volume attributes (e.g., size, type, IOPS, throughput), AWS Key Management Service (AWS KMS) key, and a snapshot ID (if you want the volume to be initialized from an existing EBS snapshot) in the RunTask, CreateService, or UpdateService API request. When you configure EBS volumes for your Amazon ECS tasks or services, Amazon ECS provisions an equal number of EBS volumes as the number of tasks and mounts one EBS volume to each task. By default, Amazon ECS automatically deletes the attached Amazon EBS volume when a task exits. This integration gives you access to all EBS features including configurable volume types and performance, snapshots, Amazon Data Lifecycle Manager, and encryption for your applications deployed with Amazon ECS.<br /> <br /> Amazon ECS support for Amazon EBS volumes is available in the AWS GovCloud Regions for Amazon EC2, AWS Fargate, and ECS Managed Instances. To get started, <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ebs-volumes.html\">view our documentation</a> and <a href=\"https://aws.amazon.com/blogs/aws/amazon-ecs-supports-a-native-integration-with-amazon-ebs-volumes-for-data-intensive-workloads/\">blog</a>.</p>"
