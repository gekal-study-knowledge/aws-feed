    "title": "Build custom code-based evaluators in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-custom-code-based-evaluators-in-amazon-bedrock-agentcore/"
    "published": "2026-05-19 00:07:15"
    "fetched": "2026-05-19 00:22:13"
    "summary": "In this post, you will implement four Lambda-based custom code evaluators for a financial market-intelligence agent, register each with AgentCore, and run them in on-demand and online modes. You will also see how to combine custom code-based evaluators with built-in evaluators and how to call other AWS services for grounded fact-checking, PII detection, and real-time alerting."
  "e7d494e639fe5d3d49bf43140a884ae3":
    "id": "e7d494e639fe5d3d49bf43140a884ae3"
    "title": "Aderant transforms cloud operations with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/aderant-transforms-cloud-operations-with-amazon-quick/"
    "published": "2026-05-19 02:26:40"
    "fetched": "2026-05-19 02:57:34"
    "summary": "In this post, we share how Aderant used the AI-powered capabilities of Amazon Quick to unify search across six vendor systems and automate documentation workflows, achieving 90 percent faster search times and 75 percent documentation acceleration, and how others can apply these approaches to their operations."
  "a7829fb68ddcfe57502ae4a815ec8343":
