  "fa9581d82dfa31095bd4d381ae75c3e6":
    "id": "fa9581d82dfa31095bd4d381ae75c3e6"
    "title": "Build custom code-based evaluators in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-custom-code-based-evaluators-in-amazon-bedrock-agentcore/"
    "published": "2026-05-19 00:07:15"
    "fetched": "2026-05-19 00:22:13"
    "summary": "In this post, you will implement four Lambda-based custom code evaluators for a financial market-intelligence agent, register each with AgentCore, and run them in on-demand and online modes. You will also see how to combine custom code-based evaluators with built-in evaluators and how to call other AWS services for grounded fact-checking, PII detection, and real-time alerting."
  "e7d494e639fe5d3d49bf43140a884ae3":
    "id": "e7d494e639fe5d3d49bf43140a884ae3"
    "title": "Aderant transforms cloud operations with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/aderant-transforms-cloud-operations-with-amazon-quick/"
    "published": "2026-05-19 02:26:40"
    "fetched": "2026-05-19 02:57:34"
    "summary": "In this post, we share how Aderant used the AI-powered capabilities of Amazon Quick to unify search across six vendor systems and automate documentation workflows, achieving 90 percent faster search times and 75 percent documentation acceleration, and how others can apply these approaches to their operations."
  "a7829fb68ddcfe57502ae4a815ec8343":
    "id": "a7829fb68ddcfe57502ae4a815ec8343"
    "title": "Integrate Atlassian Confluence Cloud with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/integrate-atlassian-confluence-cloud-with-amazon-quick/"
    "published": "2026-05-19 00:37:55"
    "fetched": "2026-05-19 02:57:34"
    "summary": "In this post, you will learn how to set up the Confluence Cloud integration with Quick. This includes creating a knowledge base for semantic search, setting up Actions to query and manage Confluence pages, and organizing resources in Quick Spaces. Quick integrates with your current enterprise technology stack, from internal knowledge repositories and corporate intranets to business-critical applications and AWS data services."
  "8abbdb472ba00c313466673d628d5180":
    "id": "8abbdb472ba00c313466673d628d5180"
    "title": "Prompting Amazon Nova 2 for content moderation"
    "link": "https://aws.amazon.com/blogs/machine-learning/prompting-amazon-nova-2-for-content-moderation/"
    "published": "2026-05-19 03:56:36"
    "fetched": "2026-05-19 04:46:48"
    "summary": "In this post, you learn how to prompt Amazon Nova 2 Lite for content moderation using structured and free-form approaches, grounded in the MLCommons AILuminate Assessment Standard. The prompting techniques use the AILuminate taxonomy as an example, but they work equally well with your own custom moderation policy. You can swap in your own category definitions and the prompt structure stays the same. We also benchmark the content moderation capabilities of Amazon Nova 2 Lite against several foundation models (FMs) on three public datasets."
"last_updated": "2026-05-19 04:46:48 JST"
