  "8f3713b787a0593ac2dcae71da71b409":
    "id": "8f3713b787a0593ac2dcae71da71b409"
    "title": "Amazon RDS now supports ENA Express for Multi-AZ replication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-rds-ena-express-multiAZ/"
    "published": "2026-05-27 04:00:00"
    "fetched": "2026-05-27 06:40:50"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS </a>Multi-AZ instances now use ENA Express for replication traffic between Availability Zones. ENA Express uses AWS's Scalable Reliable Datagram (SRD) protocol to optimize network performance by delivering up to 25 Gbps single-flow bandwidth for cross-AZ replication traffic leveraging advanced congestion control and multi-pathing capabilities, and reducing latency variability for Multi-AZ deployments.<br /> <br /> RDS Multi-AZ instances replicate data synchronously to a standby in a different Availability Zone to provide high availability and automatic failover. AWS SRD, used by ENA Express, improves replication by dynamically distributing traffic across multiple network paths and adapting to congestion in real time. Amazon RDS Multi-AZ with ENA Express delivers increased write throughput and lower write latencies for write-intensive database workloads.<br /> <br /> ENA Express for Amazon RDS is available at no additional charge for Amazon RDS for MariaDB, Amazon RDS for MySQL, Amazon RDS for PostgreSQL, Amazon RDS for Db2, and Amazon RDS for Oracle. It is supported in Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Mumbai, New Zealand, Osaka, Seoul, Singapore, Sydney, Taipei, Thailand, Tokyo), Canada (Central), Canada West (Calgary), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), Israel (Tel Aviv), Mexico (Central), US East (N. Virginia, Ohio), US West (N. California, Oregon), and AWS GovCloud (US) Regions. To enable this on your existing Amazon RDS instances, perform a start-stop or scale compute action. For a list of supported instance types on ENA Express, refer the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.CrossAZENAExpress.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>user guide</u></a>.&nbsp;</p>"
  "8ed8a39210f48628ed21c6bbc43a6d73":
    "id": "8ed8a39210f48628ed21c6bbc43a6d73"
    "title": "Amazon EC2 M8i and M8i-flex instances are now available in AWS GovCloud (US-East) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-m8i-m8i-flex-govcloud-east/"
    "published": "2026-05-27 01:00:00"
    "fetched": "2026-05-27 08:05:55"
    "summary": "<p>Starting today, Amazon EC2 M8i and M8i-flex instances are now available in AWS GovCloud (US-East)<b> </b>Region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The M8i and M8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% better performance than M7i and M7i-flex instances, with even higher gains for specific workloads. The M8i and M8i-flex instances are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to M7i and M7i-flex instances.<br /> <br /> M8i-flex are the easiest way to get price performance benefits for a majority of general-purpose workloads like web and application servers, microservices, small and medium data stores, virtual desktops, and enterprise applications. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> M8i instances are a great choice for all general purpose workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. The SAP-certified M8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. For more information about the new instances, visit the<a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\" rel=\"noopener noreferrer\" target=\"_blank\"> M8i and M8i-flex instance page</a> or visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/\" rel=\"noopener noreferrer\" target=\"_blank\">blog</a>.</p>"
  "0bad81f8e641bcefe7a8ec3ec874595e":
    "id": "0bad81f8e641bcefe7a8ec3ec874595e"
    "title": "Amazon EC2 R8i and R8i-flex instances are now available in AWS GovCloud (US-East) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-r8i-r8i-flex-govcloud-east/"
    "published": "2026-05-27 01:00:00"
    "fetched": "2026-05-27 08:05:55"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and R8i-flex instances are available in the AWS GovCloud (US-East) Region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.<br /> <br /> R8i-flex, our first memory-optimized Flex instances, are the easiest way to get price performance benefits for a majority of memory-intensive workloads. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications. <a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" rel=\"noopener noreferrer\" target=\"_blank\">R8i instances are SAP-certified </a>and deliver 142,100 aSAPS, delivering exceptional performance for mission-critical SAP workloads.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. For more information about the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" rel=\"noopener noreferrer\" target=\"_blank\">R8i and R8i-flex </a>instances visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" rel=\"noopener noreferrer\" target=\"_blank\">blog</a>.</p>"
"last_updated": "2026-05-27 08:05:55 JST"
