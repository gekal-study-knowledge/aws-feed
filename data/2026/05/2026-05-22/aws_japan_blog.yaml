    "summary": "本記事では、キヤノン IT ソリューションズ株式会社様が 、Amazon Q Developer を開発現場に導入し、3 か月間効果検証を実施した取り組みをご紹介します。コード生成やレビュー支援による効率化、現場での活用事例、そして検証から得られた知見について詳しく解説します。"
  "53450bcd1da88db78284917fefefc1c3":
    "id": "53450bcd1da88db78284917fefefc1c3"
    "title": "CIRT インサイト: AWS Organizations からの不正なアカウント離脱を防ぐには"
    "link": "https://aws.amazon.com/jp/blogs/news/cirt-insights-how-to-help-prevent-unauthorized-account-removals-from-aws-organizations/"
    "published": "2026-05-22 16:14:06"
    "fetched": "2026-05-22 17:22:58"
    "summary": "AWS Customer Incident Response Team (CIRT) が観測している、攻撃者がお客様アカウントを侵害した後に AWS Organizations から離脱させ、SCP やガバナンス制御を回避する新しい手口について解説します。 具体的には、organizations:LeaveOrganization 権限を持つクレデンシャルが悪用されると、メンバーアカウントが Organization の保護下から外れ、CloudTrail の組織トレイル、GuardDuty の中央集約、SCP による制限、一括請求などの可視性と統制が失われます。 最も効果が大きく労力の少ない対策として、organizations:LeaveOrganization アクションを拒否する SCP (DenyLeaveOrganization) の実装を推奨します。あわせて、CloudTrail での AcceptHandshake / LeaveOrganization / InviteAccountToOrganization / RemoveAccountFromOrganization イベントの監視、IAM の最小権限原則の徹底、およびルートアクセスの一元管理についても解説しています。"
  "3ad9a39a006296f156d56da6ab257c07":
    "id": "3ad9a39a006296f156d56da6ab257c07"
    "title": "自動推論で実現する Amazon のポスト量子暗号の検証と最適化"
    "link": "https://aws.amazon.com/jp/blogs/news/verifying-and-optimizing-post-quantum-cryptography-at-amazon/"
    "published": "2026-05-22 16:10:03"
    "fetched": "2026-05-22 17:22:58"
    "summary": "AWS は、Amazon Automated Reasoning Group、AWS Cryptography、オープンソースコミュニティと協力し、ポスト量子暗号 (PQC) ML-KEM の形式的に検証された最適化実装 mlkem-native を開発しました。本記事では、CBMC によるメモリ安全性・型安全性の検証、HOL Light と s2n-bignum によるアセンブリ実装の正当性証明、SLOTHY によるマイクロアーキテクチャ最適化を組み合わせ、セキュリティ・性能・保守性を同時に実現した取り組みをご紹介します。AWS-LC への統合により、c7i や c7g で約 2 倍の性能向上を達成しました。"
