"entries":
  "c4e5338a9d1623dfddaac3ad28a35c55":
    "id": "c4e5338a9d1623dfddaac3ad28a35c55"
    "title": "Amazon SageMaker AI now supports OpenAI-compatible APIs for inference endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-ai-openai-apis/"
    "published": "2026-05-22 02:55:00"
    "fetched": "2026-05-22 04:49:01"
    "summary": "<p>Amazon SageMaker Inference now supports OpenAI-compatible APIs, so you can use the tools and frameworks you already know, like the OpenAI SDK, LangChain, and Strands Agents, to connect directly to your SageMaker endpoints. Switching requires nothing more than changing an endpoint URL — no custom integration code, no SDK wrappers, no rewrites.<br /> <br /> With this launch, you no longer need to adopt a different API format or change your authentication approach. Simply change your endpoint URL, and your existing SDK calls, streaming logic, and framework integrations continue to work as-is. You immediately gain the ability to choose your own GPU instances, keep data in your own VPC, run any open source or fine-tuned model, and scale with auto-scaling policies tuned to your workload. Authentication uses existing AWS credentials with automatic token refresh, so there is nothing extra to manage in production.<br /> <br /> This capability is available today in US East (N. Virginia), US West (Oregon), US East (Ohio), Asia Pacific (Mumbai), Asia Pacific (Jakarta), Europe (Ireland), Europe (Frankfurt), South America (São Paulo), Asia Pacific (Tokyo), Asia Pacific (Seoul), Europe (London), Asia Pacific (Singapore), Asia Pacific (Sydney), and Canada (Central). To learn more and get started, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/announcing-openai-compatible-api-support-for-amazon-sagemaker-ai-endpoints/\">launch blog </a>or visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-openai-compatible.html\">SageMaker Inference documentation.</a></p>"
  "404c5b6865ae343e3d653f466c98f6cd":
    "id": "404c5b6865ae343e3d653f466c98f6cd"
    "title": "Amazon EC2 C7i-flex, M7i-flex & M7i instances now available in Asia Pacific (Hyderabad) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-c7i-flex-m7i-flex-m7i-instances-HYD-region/"
    "published": "2026-05-22 04:39:00"
    "fetched": "2026-05-22 06:24:13"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C7i-flex, M7i-flex and M7i instances powered by custom 4th Gen Intel Xeon Scalable processors (code-named Sapphire Rapids) are available in Asia Pacific (Hyderabad) region. These custom processors, available only on AWS, offer up to 15% better performance over comparable x86-based Intel processors utilized by other cloud providers.<br /> <br /> C7i-flex and M7i-flex instances are the easiest way for you to get price-performance benefits for a majority of general-purpose workloads. They deliver up to 19% better price-performance compared to C6i and M6i&nbsp; instances respectively. These instances offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources such as web and application servers, virtual-desktops, batch-processing, and microservices.&nbsp;</p> \n<p>&nbsp;</p> \n<p>M7i deliver up to 15% better price-performance compared to M6i. M7i instances are a great choice for workloads that need the largest instance sizes or continuous high CPU usage, such as gaming servers, CPU-based machine learning (ML), and video-streaming. M7i offer larger instance sizes, up to 48xlarge, and two bare metal sizes (metal-24xl, metal-48xl). These bare-metal sizes support built-in Intel accelerators: Data Streaming Accelerator, In-Memory Analytics Accelerator, and QuickAssist Technology that are used to facilitate efficient offload and acceleration of data operations and optimize performance for workloads.<br /> <br /> To learn more, visit the&nbsp;EC2&nbsp;&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/c7i/\" rel=\"noopener noreferrer\" target=\"_blank\">C7i-flex</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/m7i/\" rel=\"noopener noreferrer\" target=\"_blank\">M7i/M7i-flex</a> instances pages.</p>"
  "3c08b1613d317d358d604910e4aa945c":
    "id": "3c08b1613d317d358d604910e4aa945c"
    "title": "Amazon Aurora MySQL 8.4  is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-aurora-mysql/8-4/"
    "published": "2026-05-22 01:00:00"
    "fetched": "2026-05-22 06:24:13"
    "summary": "<p>Amazon Aurora MySQL-Compatible Edition now supports MySQL 8.4, a community MySQL Long Term Support (LTS) major version. Aurora MySQL 8.4 launches with compatibility for community MySQL 8.4.7 and introduces aligned version numbering, so the version number you run on Aurora matches the community MySQL version it is compatible with. Aurora also manages the underlying patch on your behalf, simplifying day-to-day operations. Aurora MySQL now targets major versions within 12 months of community MySQL LTS releases, minor versions within 3 months of each community minor, and an Aurora LTS minor within 12 months of each major. For engine specific release objectives, see the <a href=\"https://aws.amazon.com/blogs/database/knowing-when-new-open-source-database-engine-versions-release-on-amazon-aurora-and-amazon-rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora and RDS open source release calendar announcement</a>.<br /> <br /> Aurora MySQL 8.4 strengthens security defaults for new clusters. TLS is enforced by default with only TLS 1.2 and 1.3 supported, new accounts use the caching_sha2_password authentication plugin, and password validation policies are customizable through DB cluster parameter groups. Automated upgrade prechecks identify compatibility issues before your cluster goes offline, giving you confidence before you upgrade. To learn more about the Aurora MySQL 8.4 customer experience, refer to the <a href=\"https://aws.amazon.com/blogs/database/amazon-aurora-mysql-8-4-is-now-generally-available/\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora MySQL 8.4 launch announcement blog.</a><br /> <br /> You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. Learn more about performing major version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Updates.MajorVersionUpgrade.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora User Guide</a>. You can also migrate to Aurora MySQL 8.4 from external MySQL sources using <a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service</a> or <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Migrating.ExtMySQL.S3.html\" rel=\"noopener noreferrer\" target=\"_blank\">Percona XtraBackup</a>. Aurora MySQL 8.4 is available in <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.RegionsAndAvailabilityZones.html#Aurora.Overview.Availability.MySQL\" rel=\"noopener noreferrer\" target=\"_blank\">all AWS Regions</a> where Aurora MySQL is available.<br /> <br /> Amazon Aurora MySQL is designed for unparalleled high performance and availability at global scale with full MySQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for Multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started with Amazon Aurora, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.AuroraMySQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
  "7d20842e9cf344c8f56d000d6a8cf9bb":
    "id": "7d20842e9cf344c8f56d000d6a8cf9bb"
    "title": "Amazon CloudWatch Logs Insights adds new query commands and functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-logs-insights/"
    "published": "2026-05-22 08:00:00"
    "fetched": "2026-05-22 09:11:09"
    "summary": "<p>Amazon CloudWatch Logs Insights query language now supports 13 new commands and functions that give you more powerful ways to query, transform, and analyze your logs. Customers analyzing logs in CloudWatch Logs Insights often need to perform string manipulation, encode or decode field values, parse non-JSON log formats, or calculate geographic distances, so they can derive deeper insights from their logs.<br /> <br /> With this launch, CloudWatch Logs Insights provides new string and numeric functions (round, startswith, endswith, case, regex_replace, haversine), encoding and decoding functions (urlencode, urldecode, base64encode, base64decode), and new parse and analysis commands (parse logfmt, expand, relevantfields). You can now filter logs by string prefixes, decode Base64 payloads inline, parse logfmt structured logs into fields, expand nested JSON arrays into individual records, calculate distances between coordinates, and automatically surface relevant fields in high-cardinality log groups.<br /> <br /> These commands and functions are available today in all commercial AWS Regions. To learn more, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData_LogsInsights.html\">documentation</a>.</p>"
  "8b04ee779151e057ed578b4fbb132a39":
    "id": "8b04ee779151e057ed578b4fbb132a39"
    "title": "SageMaker Unified Studio automates Glue connector provisioning for cross-subnet job retries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/sagemaker-unified-studio-glue/"
    "published": "2026-05-22 04:27:00"
    "fetched": "2026-05-22 09:11:09"
    "summary": "<p>Amazon SageMaker Unified Studio now supports automatic creation of connections for Glue job retries across subnets to improve data pipeline resilience. This helps organizations running business-critical data pipelines reduce unplanned downtime and meet their SLAs — without requiring engineers to manually configure backup connectors or intervene during subnet failures.</p> \n<p>With this launch, SageMaker Unified Studio automates the provisioning of Glue connectors across subnets defined in the domain VPC configuration. Administrators can define their domain VPC with multiple private subnets across availability zones, and the system provisions the connectors needed for all new projects so that failed jobs can be retried on an alternate subnet automatically. If a Glue job fails because the primary subnet is unavailable due to IP address exhaustion or availability zone degradation, the job can be retried on a connector in a different subnet. No user action is needed beyond the initial VPC configuration on the domain.</p> \n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">AWS Regions where Amazon SageMaker Unified Studio</a> is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/what-is-sagemaker-unified-studio.html\">Amazon SageMaker Unified Studio documentation</a>.&nbsp;</p>"
  "47d524f308a4388cf7c6a32e7694d7a4":
    "id": "47d524f308a4388cf7c6a32e7694d7a4"
    "title": "AWS Clean Rooms now supports mutable payment configurations for collaborations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-clean-rooms-mutable-payments"
    "published": "2026-05-22 16:00:00"
    "fetched": "2026-05-23 02:05:39"
    "summary": "<p>AWS Clean Rooms now supports mutable fine-grained <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/change-requests.html\" target=\"_blank\">payment configurations</a> for collaboration members. This capability offers customers greater flexibility and control over payment responsibilities as they develop new use cases with their partners. With this launch, customers can specify which partners are authorized to pay for specific cost types after a collaboration is created—including SQL queries, PySpark jobs, ML model training and inference jobs, and synthetic data generation in AWS Clean Rooms.</p> \n<p>With AWS Clean Rooms, you can add or remove authorized payers for specific cost types through a change request. Collaboration members must approve the results before it takes effect. Payment configurations support multiple authorized payers for SQL and PySpark analyses. You can select an authorized payer when submitting the analysis. For example, a pharmaceutical research company collaborates with healthcare organizations for real-world clinical trial data. The pharmaceutical research company can pay for complex analysis, and the healthcare organizations can pay for simple SQL analyses in a collaboration.&nbsp;</p> \n<p>AWS Clean Rooms helps companies and their partners easily analyze and collaborate on their collective datasets without revealing or copying one another’s underlying data. For more information about the AWS Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Clean Rooms</a>.</p>"
  "0ee0ac0b43410d58c691606edb85bbd3":
    "id": "0ee0ac0b43410d58c691606edb85bbd3"
    "title": "AWS Secrets Manager adds managed external secrets support for Datadog vended keys and Snowflake Programmatic Access Tokens"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/secrets-manager-managed-external-secrets-datadog-snowflake/"
    "published": "2026-05-22 16:00:00"
    "fetched": "2026-05-23 06:06:45"
    "summary": "<p>AWS Secrets Manager now extends its managed external secrets capability to include Datadog Keys and Snowflake Programmatic Access Tokens (PATs). Managed external secrets enable customers to automatically rotate third-party credentials directly from AWS Secrets Manager by offering first-class integration with supported third-party services.</p> \n<p>With this launch, you can manage rotation for three types of Datadog credentials —<a></a><a> API keys, Application keys, and admin credential pairs</a>&nbsp;for service accounts. For Snowflake, you can now rotate Programmatic Access Tokens using Snowflake's native authentication, with a configurable grace period that allows applications to seamlessly transition to new tokens without interruption.</p> \n<p>These new integrations join existing managed external secrets integrations with BigID, Confluent Cloud, MongoDB Atlas, and Salesforce, enabling customers to manage third-party software vended secrets.</p> \n<p>Datadog and Snowflake PAT managed external secrets are available in all AWS Regions where AWS Secrets Manager managed external secrets is supported. To learn more, visit the <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/managed-external-secrets.html\">AWS Secrets Manager managed external secrets documentation</a>.</p>"
  "62c865fb7566570b11618b378be7b581":
    "id": "62c865fb7566570b11618b378be7b581"
    "title": "Amazon EMR now supports Apache Spark 4.0.2 in general availability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-emr-apache-spark/"
    "published": "2026-05-22 05:17:00"
    "fetched": "2026-05-28 05:59:59"
    "summary": "<p>Amazon EMR now supports Apache Spark 4.0.2 across all three deployment models. With Spark 4.0.2, you can build and maintain data pipelines more easily with ANSI SQL and VARIANT data types, enforce fine-grained access control (FGAC) at the row level or column level, strengthen compliance and governance frameworks with Apache Iceberg v3 table format, and deploy new real-time applications faster with enhanced streaming capabilities.<br /> <br /> With Spark 4.0.2, you can build data pipelines, making data engineering accessible to a broader range of users through standard ANSI SQL support, eliminating the need to learn Spark-specific syntax. Spark 4.0.2 natively supports JSON and semi-structured data through VARIANT data types, providing flexibility for handling diverse data formats. You can enforce fine-grained access control (FGAC) on both read and write operations for AWS Lake Formation registered tables in your Apache Spark jobs. Building on these security capabilities, Apache Iceberg v3 table format provides stronger transaction guarantees and tracks data lineage, creating the audit trails required for regulatory compliance. Enhanced streaming controls simplify management of complex stateful operations and improve monitoring, enabling you to deploy real-time applications for fraud detection, personalization, and other time-sensitive use cases faster.</p> \n<p><br /> Apache Spark 4.0.2 is available in all regions where EMR is available. If you are upgrading your existing EMR application, you can use <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-upgrades.html\">Apache Spark upgrade agent</a> to accelerate your upgrades. To learn more about Apache Spark 4.0.2 on Amazon EMR, visit the <a>Amazon EMR </a><a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-spark800-release.html\">release notes</a>, or get started by creating an EMR application with Spark 4.0.2 from the <a href=\"https://console.aws.amazon.com/emr/serverless\">AWS Management Console</a>.</p>"
"last_updated": "2026-05-28 05:59:59 JST"
