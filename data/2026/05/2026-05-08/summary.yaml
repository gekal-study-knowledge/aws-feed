"overview": |
  この日は SAP 向け AI 支援と EC2 の新インスタンス群が目立ちました。日本語ブログでは AWS SDK for SAP ABAP Knowledge MCP Server や AWS For SAP Management MCP Server の一般提供、Kiro エージェントによる SAP Clean Core ジャーニーの加速、KDDI の AWS DevOps Agent 活用によるインシデント対応効率化などが紹介されました。コンピュートでは第 6 世代 Intel Xeon 搭載の EC2 M8idn/M8idb・R8idn/R8idb、Graviton4 の M8gn/M8gb（アイルランド）、NVIDIA RTX PRO 6000 Blackwell 搭載 G7e（ロンドン）、Xeon 6 の X8i（アイルランド・ムンバイ）、G6 の欧州ソブリンクラウド展開など多数のインスタンス発表がありました。機械学習では EC2 Capacity Blocks と SageMaker トレーニングプランによる短期 GPU 確保、GRPO による検証可能報酬型強化学習、Halliburton の Bedrock 活用事例が公開されました。その他 SageMaker Unified Studio の ID/ユーザー管理、SageMaker HyperPod の AMI ベースノード構成、IAM Policy Autopilot の Java/Terraform 対応、AWS WAF の動的ラベル補間、インドの UPI Scan and Pay 対応などが発表されました。セキュリティでは Jakarta リージョンの SNI 認証取得、4 月のセキュリティ ICYMI、Linux カーネルの DirtyFrag 系問題 (CVE-2026-31431 関連) の速報が出されました。
