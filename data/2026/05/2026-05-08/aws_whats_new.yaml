"entries":
  "b7d2b03288c4f0fea1fffafd75bb45d0":
    "id": "b7d2b03288c4f0fea1fffafd75bb45d0"
    "title": "AWS India customers can now use UPI Scan and Pay for sign-up and payments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/aws-india-upi-scanandpay/"
    "published": "2026-05-08 00:00:00"
    "fetched": "2026-05-08 01:08:02"
    "summary": "<p>India customers can now use <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/edit-aispl-payment-method.html#using-aispl-autopay-UPI\">UPI (Unified Payments Interface)</a> Scan and Pay to sign up for AWS or make payments to their invoices.<br /> <br /> UPI is a popular and convenient payment method in India, which facilitates instant bank-to-bank transfers between two parties through mobile phones with internet. The new Scan and Pay experience simplifies payments by allowing customers to scan a QR code displayed on the AWS Console using their UPI mobile app (such as Google Pay, PhonePe, Paytm, or Amazon Pay), eliminating the need to manually enter a UPI ID.<br /> <br /> This enhancement makes the UPI payment experience more secure, convenient, and error-free for customers signing up for AWS or making one-time payments. Scan and Pay reduces friction and aligns with how customers commonly use UPI for everyday transactions. Customers can also set up UPI AutoPay using Scan and Pay for automatic monthly payments up to INR 15,000.<br /> <br /> To use this feature, customers log in to the AWS Console and select UPI as their payment method during signup or when making a payment. A QR code is displayed on screen, which customers scan using their UPI mobile app to verify and authorize the transaction.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/edit-aispl-payment-method.html\"><u>Managing Payment Methods in India</u></a><u>.</u></p>"
  "a34bc693b1a11c92e06605f06554c743":
    "id": "a34bc693b1a11c92e06605f06554c743"
    "title": "AWS Capabilities by Region now supports availability notifications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-regional-planning-tool-notification"
    "published": "2026-05-08 02:48:00"
    "fetched": "2026-05-08 03:21:17"
    "summary": "<p>Today, AWS announces availability notifications for AWS Capabilities by Region in AWS Builder Center, a new subscription-based system that automatically alerts builders when&nbsp;an&nbsp;AWS service(s)&nbsp;and/or&nbsp;features(s)&nbsp;become available in their target Regions.&nbsp;Availability notifications&nbsp;make&nbsp;it easy for builders to&nbsp;track availability&nbsp;of&nbsp;1,500+&nbsp;services and features across&nbsp;37&nbsp;AWS&nbsp;Regions,&nbsp;accelerating&nbsp;infrastructure planning and deployment decisions.</p> \n<p>With availability notifications,&nbsp;builders can subscribe&nbsp;at&nbsp;the service level through&nbsp;AWS Builder Center UI, and the subscription automatically covers all underlying features across selected Regions, so&nbsp;there's&nbsp;no need to track each feature individually. Notifications are delivered through two channels: instantaneous in-app alerts within AWS Builder Center, and a&nbsp;consolidated&nbsp;weekly email digest.&nbsp;Subscriptions and notification preferences can be managed through&nbsp;Settings &gt; Notifications&nbsp;in AWS Builder Center. Common use cases include tracking a specific capability launch, monitoring service parity across&nbsp;AWS&nbsp;Regions, and preparing for upcoming migrations or&nbsp;Regional&nbsp;expansions. For example, a solutions architect expanding a generative AI application into new Regions can subscribe to Amazon Bedrock and receive automatic&nbsp;updates&nbsp;as Knowledge Bases, Guardrails, and other features become available.</p>"
  "d608f0cb0cc8a799bde19172984fdd2e":
    "id": "d608f0cb0cc8a799bde19172984fdd2e"
    "title": "Amazon SageMaker Unified Studio adds identity and user management features"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/smus-identity-user-management/"
    "published": "2026-05-08 04:00:00"
    "fetched": "2026-05-08 05:11:32"
    "summary": "<p>Amazon SageMaker Unified Studio announces new administration features that give administrators more control over identity configuration and user management for both IAM and Identity Center domain types.<br /> <br /> In SageMaker IAM domains, administrators can now onboard users through single sign-on by configuring AWS IAM Identity Center. After configuration, administrators can add IAM roles, IAM users, IAM Identity Center users, and IAM Identity Center groups as project members. Teams can collaborate on project data and resources regardless of how individual members authenticate. Administrators can set up IAM Identity Center integration in the SageMaker Unified Studio admin portal. A new domain user management page for SageMaker IAM domains gives administrators a consolidated view of all users active in the domain, where they can manage access and update permissions from a single screen.<br /> <br /> In SageMaker Identity Center domains, users can now access the SageMaker Unified Studio portal by federating through an IAM role. SageMaker Unified Studio creates a unique user session for each federated user, so users sharing the same role don't overwrite each other's work. Administrators can audit individual actions even when multiple users share a single IAM role.<br /> <br /> With these features, customers can use IAM identity or IAM Identity Center corporate identity across both domain types, giving teams flexibility to collaborate in SageMaker Unified Studio regardless of their authentication method.<br /> <br /> These features are available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), South America (São Paulo), US East (N. Virginia), US East (Ohio), and US West (Oregon).<br /> <br /> To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/working-with-domains.html\">SageMaker Unified Studio documentation</a>.</p>"
  "97d2d67db7862c2cf6f7f306b7b60ac1":
    "id": "97d2d67db7862c2cf6f7f306b7b60ac1"
    "title": "AWS Elemental MediaTailor launches Monetization Functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-elemental-mediatailor-monetization-functions"
    "published": "2026-05-08 02:20:00"
    "fetched": "2026-05-08 05:11:32"
    "summary": "<p>AWS Elemental MediaTailor now supports&nbsp;monetization&nbsp;functions,&nbsp;a new capability that lets customers customize how MediaTailor builds ad decision server (ADS) requests and manages session data during ad-personalized playback.&nbsp;With&nbsp;monetization&nbsp;functions, customers can call external APIs and run inline data transformations at defined points in the playback session —&nbsp;eliminating&nbsp;the need to build and&nbsp;operate&nbsp;middleware between the player and the ADS.</p> \n<p>Common use cases include resolving hashed email addresses into&nbsp;privacy-compliant identity envelopes through providers&nbsp;such as&nbsp;LiveRamp,&nbsp;appending contextual metadata from a content management system to every ad request&nbsp;through providers like&nbsp;GraceNote,&nbsp;activate header bidding workflows through providers like The Trade Desk&nbsp;and running A/B tests across multiple ad decision servers. Monetization&nbsp;functions&nbsp;are fail-open&nbsp;by design: if a function&nbsp;encounters&nbsp;an error, exceeds its timeout, or hits a resource limit, MediaTailor discards the output and&nbsp;proceeds&nbsp;with default ad-insertion behavior, so viewers' playback is never interrupted.</p> \n<p>Monetization&nbsp;functions&nbsp;is&nbsp;available at general availability in all AWS regions where AWS Elemental MediaTailor operates.&nbsp;You are billed per&nbsp;lifecycle&nbsp;hook invocation at a flat rate that does not depend on&nbsp;the number,&nbsp;type,&nbsp;or complexity&nbsp;of functions.&nbsp;For full details, see the&nbsp;<a href=\"https://aws.amazon.com/mediatailor/pricing/\" title=\"MediaTailor pricing page\">MediaTailor pricing page</a>, the&nbsp;<a href=\"https://aws.amazon.com/mediatailor/pricing/\" title=\"MediaTailor User Guide\">Monetization Functions section of the MediaTailor User Guide</a>, and the&nbsp;<a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/monetization-functions.html\" title=\"MediaTailor product page\">MediaTailor product page</a>.<a href=\"https://aws.amazon.com/mediatailor/pricing/\" title=\"MediaTailor pricing page\"></a></p>"
  "8a841f8f8481e541355f7a83b1fc46be":
    "id": "8a841f8f8481e541355f7a83b1fc46be"
    "title": "Amazon SageMaker HyperPod now supports AMI-based node lifecycle configuration for Slurm clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-hyperpod-ami-based-node/"
    "published": "2026-05-08 01:00:00"
    "fetched": "2026-05-08 05:11:32"
    "summary": "<p>Amazon SageMaker HyperPod now supports AMI-based configuration that provisions Slurm cluster nodes with the software and configurations needed for a production-ready environment to run AI/ML training workloads. This removes the need to download, configure, or upload lifecycle configuration scripts to Amazon S3. With fewer operational steps to prepare a cluster and no lifecycle configuration scripts executing during node provisioning, cluster creation time is significantly reduced, so you can start running jobs sooner.</p> \n<p>AMI-based configuration includes required software such as Docker, Enroot, and Pyxis, and configurations such as Slurm accounting, SSH key generation, Slurm log rotation and user home directory setup. To enable AMI-based configuration, omit the LifeCycleConfig block from the instance group configuration when creating clusters using the CreateCluster API, or when using the SageMaker AI console, select \"None\" under Lifecycle scripts in Custom setup. For additional customization on top of the AMI-based configuration baseline, an extension script can be provided, allowing you to focus only on what capabilities and software to add, such as user configuration, observability, or LDAP integration.</p> \n<p>Extension scripts can be configured when creating clusters through both the API and the SageMaker AI console. Using the CreateCluster API, specify the new OnInitComplete parameter and SourceS3Uri in the LifeCycleConfig block. Via the console, provide the S3 URI to the extension script in the \"Extension script file in S3\" field in Custom setup. For advanced use cases that require full control over provisioning, custom lifecycle configuration scripts remain fully supported through both the API and the SageMaker AI console.</p> \n<p>This feature is available in all AWS Regions where SageMaker HyperPod is available. To get started with creating HyperPod Slurm clusters with AMI-based node lifecycle configuration, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/smcluster-getting-started-slurm-cli.html\" rel=\"noopener noreferrer\" target=\"_blank\">Getting started with SageMaker HyperPod using the AWS CLI</a> or <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/smcluster-getting-started-slurm-console.html\" rel=\"noopener noreferrer\" target=\"_blank\">Getting started with SageMaker HyperPod using the SageMaker AI console</a> in the SageMaker AI developer guide.</p>"
  "bb0ad6222b0f4f19f52a624447141024":
    "id": "bb0ad6222b0f4f19f52a624447141024"
    "title": "AWS Advanced JDBC Wrapper now provides client-side encryption"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-advanced-jdbc-wrapper-encryption/"
    "published": "2026-05-08 02:00:00"
    "fetched": "2026-05-08 06:54:22"
    "summary": "<p>The AWS Advanced JDBC Wrapper now provides column-level client-side encryption through its KMS Encryption plugin. The wrapper provides advanced capabilities such as failover handling, AWS authentication integration, and enhanced monitoring for Amazon Aurora and Amazon RDS open source databases. It enables Java applications to encrypt sensitive data before it reaches the database without changing application code.<br /> <br /> Database encryption at rest and TLS in transit are foundational security controls. However, with these controls decrypt the data within the database engine. A compromised credential, overprivileged administrator, or SQL injection attack can expose sensitive data in plaintext, creating compliance risk under PCI DSS, HIPAA, and GDPR. The KMS Encryption plugin closes this gap by working at the JDBC driver level. When your application writes to an encrypted column, the plugin encrypts the value before it reaches the database. When reading, it decrypts the value before returning it. Plaintext remains visible only to your application, while the database sees encrypted values. The database can verify data integrity through HMAC validation without needing the encryption key. The plugin integrates seamlessly with your existing SQL, Spring, Hibernate, and connection pool setup without requiring code changes.<br /> <br /> The KMS Encryption plugin works with <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a> and <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> PostgreSQL and MySQL-compatible databases.<br /> <br /> The plugin is available as an open-source project under the Apache 2.0 license. To learn more, see <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper/blob/main/README.md\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Advanced JDBC Wrapper documentation</a>.</p>"
  "96ebdaecfa176e2623bfac508e60f447":
    "id": "96ebdaecfa176e2623bfac508e60f447"
    "title": "Amazon EC2 M8gn and M8gb instances are now available in AWS Europe (Ireland) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-m8gn-m8gb-aws-europe/"
    "published": "2026-05-08 01:00:00"
    "fetched": "2026-05-08 06:54:22"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M8gn and M8gb instances are available in the AWS Europe (Ireland) region. These instances are powered by AWS Graviton4 processors to deliver up to 30% better compute performance than AWS Graviton3 processors, and feature the latest 6th generation AWS Nitro Cards. M8gn instances offer up to 600 Gbps network bandwidth, the highest network bandwidth among network optimized EC2 instances. M8gb offer up to 300 Gbps of EBS bandwidth to provide higher EBS performance compared to same-sized equivalent Graviton4-based instances.</p> \n<p>M8gn are ideal for network-intensive workloads such as high-performance file systems, distributed web scale in-memory caches, caching fleets, real-time big data analytics, and Telco applications such as 5G User Plane Function (UPF). M8gb are ideal for workloads requiring high block storage performance such as high performance databases and NoSQL databases.</p> \n<p>M8gn instances offer instance sizes up to 48xlarge and metal-48xl, up to 768 GiB of memory, up to 600 Gbps of networking bandwidth, and up to 120 Gbps of bandwidth to Amazon Elastic Block Store (EBS). They also support EFA networking on the 16xlarge, 24xlarge, 48xlarge sizes, metal-24xl, and metal-48xl.<br /> <br /> M8gb instances offer sizes up to 48xlarge and metal-48xl, up to 768 GiB of memory, up to 300 Gbps of EBS bandwidth, and up to 400 Gbps of networking bandwidth. They support Elastic Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge sizes, metal-24xl, and metal-48xl., which enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.</p> \n<p>The new instances are available in the following AWS Regions: US East (N. Virginia), US West (Oregon), and&nbsp;Europe (Ireland).&nbsp;Metal sizes are available in US East (N. Virginia) region.<br /> <br /> To learn more, see&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">Amazon EC2 M8gn and M8gb Instances</a>. To begin your Graviton journey, visit the&nbsp;<a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>.</p>"
  "613186c8e72eaf2cc78b8b6d0c9a0026":
    "id": "613186c8e72eaf2cc78b8b6d0c9a0026"
    "title": "Amazon EC2 X8i instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-x8i-instances-BOM-DUB-region/"
    "published": "2026-05-08 05:45:00"
    "fetched": "2026-05-08 07:58:42"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8i instances are available in the Europe (Ireland) and Asia Pacific (Mumbai) regions. These instances are powered by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified and deliver the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to previous generation X2i instances.<br /> <br /> X8i instances are designed for memory-intensive workloads like SAP HANA, large databases, data analytics, and Electronic Design Automation (EDA). Compared to X2i instances, X8i instances offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance, 88% faster Memcached performance, and 46% faster AI inference performance. X8i instances come in 14 sizes, from large to 96xlarge, including two bare metal options.<br /> <br /> To get started, visit the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances, and Spot instances. For more information visit <a href=\"https://aws.amazon.com/ec2/instance-types/x8i/\" target=\"_blank\">X8i instances page</a>.</p>"
  "82a3bc85c47c70ef160e4897837d2be8":
    "id": "82a3bc85c47c70ef160e4897837d2be8"
    "title": "Amazon EC2 G7e instances now available in Europe (London) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-g7e-london-region/"
    "published": "2026-05-08 03:04:00"
    "fetched": "2026-05-08 07:58:42"
    "summary": "<p>Starting today, Amazon EC2 G7e instances accelerated by NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs are now available in Europe (London) region. G7e instances offer up to 2.3x inference performance compared to G6e.</p> \n<p>Customers can use G7e instances to deploy large language models (LLMs), agentic AI models, multimodal generative AI models, and physical AI models. G7e instances offer the highest performance for spatial computing workloads as well as workloads that require both graphics and AI processing capabilities. G7e instances feature up to 8 NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs, with 96 GB of memory per GPU, and 5th Generation Intel Xeon processors. They support up to 192 virtual CPUs (vCPUs) and up to 1600 Gbps of networking bandwidth. G7e instances support NVIDIA GPUDirect Peer to Peer (P2P) that boosts performance for multi-GPU workloads. Multi-GPU G7e instances also support NVIDIA GPUDirect Remote Direct Memory Access (RDMA) with EFA in EC2 UltraClusters, reducing latency for small-scale multi-node workloads.</p> \n<p>You can use G7e instances for Amazon EC2 in the following AWS Regions: US West (Oregon), US East (N. Virginia, Ohio), Europe (Spain, London) and Asia Pacific (Tokyo, Seoul). You can purchase G7e instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p> \n<p>To get started, visit the&nbsp;<a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>,&nbsp;<a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface</a>&nbsp;(CLI), and AWS SDKs. To learn more, visit&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\">G7e instances</a>.</p>"
  "c8f35ac73316ce3f6692a2b083169f73":
    "id": "c8f35ac73316ce3f6692a2b083169f73"
    "title": "Introducing Amazon EC2 R8idn and R8idb instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-r8idn-r8idb/"
    "published": "2026-05-08 00:00:00"
    "fetched": "2026-05-08 07:58:42"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 R8idn and Amazon EC2 R8idb instances, powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances also feature the latest sixth generation AWS Nitro cards. R8idn and R8idb deliver up to 43% better compute performance per vCPU compared to previous generation R6in instances.<br /> <br /> Amazon EC2 R8idn instances offer up to 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances, combined with up to 22,800 GB of local NVMe instance storage. Amazon EC2 R8idb instances deliver up to 300 Gbps EBS bandwidth and up to 1,440K IOPS, the highest EBS performance among non-accelerated compute EC2 instances.<br /> <br /> R8idn instances are ideal for memory-intensive workloads requiring high network throughput and local storage, such as in-memory databases, real-time big data analytics, and large-scale distributed caching layers. R8idb instances are ideal for memory-intensive workloads requiring high block storage performance, such as large-scale commercial databases, high-performance file systems, and enterprise analytics platforms.<br /> <br /> Amazon EC2 R8idn and R8idb instances are available in US East (N. Virginia, Ohio), US West (Oregon), and Europe (Spain). R8idn and R8idb instances are available via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 R8i instance page</a>.</p>"
  "bcf359b9900860e73ad394872ffd6180":
    "id": "bcf359b9900860e73ad394872ffd6180"
    "title": "Introducing Amazon EC2 M8idn and M8idb instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-m8idn-m8idb/"
    "published": "2026-05-08 00:00:00"
    "fetched": "2026-05-08 07:58:42"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 M8idn and Amazon EC2 M8idb instances, powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances also feature the latest sixth generation AWS Nitro cards. M8idn and M8idb deliver up to 43% better compute performance per vCPU compared to previous generation M6idn instances.<br /> <br /> Amazon EC2 M8idn instances offer up to 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances. Amazon EC2 M8idb instances deliver up to 300 Gbps EBS bandwidth, the highest EBS performance among non-accelerated compute EC2 instances.<br /> <br /> M8idn instances are ideal for network-intensive general purpose workloads requiring local storage, such as distributed compute, data analytics, and high-performance file systems. M8idb instances are ideal for storage-intensive general purpose workloads such as large commercial databases, data lakes, and NoSQL databases that benefit from both high EBS throughput and low-latency local NVMe storage.<br /> <br /> Amazon EC2 M8idn and Amazon EC2 M8idb instances are available in US East (N. Virginia), US West (Oregon), and Europe (Spain). M8idn and M8idb instances are available via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 M8i instance page</a>.</p>"
  "77ea1d24d4ceefc78c9565eaa1d28768":
    "id": "77ea1d24d4ceefc78c9565eaa1d28768"
    "title": "Amazon EC2 G6 instances now available in AWS European Sovereign Cloud (Germany)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ec2-g6-aws-european-sovereign-cloud/"
    "published": "2026-05-08 06:07:00"
    "fetched": "2026-05-08 08:57:51"
    "summary": "<p>Starting today, the Amazon Elastic Compute Cloud (Amazon EC2) G6 instances powered by NVIDIA L4 GPUs are available in AWS European Sovereign Cloud (Germany). G6 instances can be used for a wide range of graphics-intensive and machine learning (ML) use cases.<br /> <br /> Customers can use G6 instances for deploying ML models for natural language processing, language translation, video and image analysis, speech recognition, and personalization. G6 instances are also well-suited for graphics workloads, such as creating and rendering real-time, cinematic-quality graphics and game streaming. G6 instances feature up to 8 NVIDIA L4 Tensor Core GPUs with 24 GB of memory per GPU and third generation AMD EPYC processors. They also support up to 192 vCPUs, up to 100 Gbps of network bandwidth, and up to 7.52 TB of local NVMe SSD storage.<br /> <br /> In addition to AWS European Sovereign Cloud (Germany), Amazon EC2 G6 instances are available today in the AWS US East (N. Virginia and Ohio), US West (Oregon), Europe (Frankfurt, London, Paris, Spain, Stockholm and Zurich), Asia Pacific (Mumbai, Tokyo, Malaysia, Seoul and Sydney), South America (Sao Paulo), Middle East (UAE) and Canada (Central) Regions. Customers can purchase G6 instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.<br /> <br /> To get started, visit the <a href=\"https://console.aws.amazon.com/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Command Line Interface</a> (CLI), and AWS SDKs. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g6/\" rel=\"noopener noreferrer\" target=\"_blank\">G6 instance page</a>.</p>"
  "327d34474801cafe8c2be7712af78fbd":
    "id": "327d34474801cafe8c2be7712af78fbd"
    "title": "Amazon Connect Outbound Campaigns adds multi-contact time zone detection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-connect-campaign-multitimezone"
    "published": "2026-05-08 01:00:00"
    "fetched": "2026-05-08 08:57:51"
    "summary": "<p>Amazon Connect Outbound Campaigns now detects customer&nbsp;time zones&nbsp;using all phone numbers and addresses on a customer profile, not just the primary contact fields.&nbsp;Previously, time zone detection used only the primary phone number, which could miss customers who span multiple time zones.</p> \n<p>When a&nbsp;profile's&nbsp;contact information spans multiple time zones, the system delivers only during hours that fall within your configured window in every detected&nbsp;time zone, and skips profiles when no overlap exists. For example, if a customer has a mobile number with an Eastern time area code and a business number with a Pacific&nbsp;time area code, and your campaign is configured for 9am–5pm delivery, messages will only be sent between 12pm–5pm ET (9am–2pm PT), when both time zones fall within the&nbsp;allowed&nbsp;window.&nbsp;</p> \n<p>This capability is available in all AWS Regions where Amazon Connect Outbound Campaigns is offered at no&nbsp;additional&nbsp;cost. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/how-to-create-campaigns.html#communication-time\">Amazon Connect&nbsp;Outbound&nbsp;Campaign</a>&nbsp;documentation.&nbsp;</p>"
  "c4b9ed786598b07ec87c9f9ecb6896bd":
    "id": "c4b9ed786598b07ec87c9f9ecb6896bd"
    "title": "Amazon Route 53 Resolver endpoints now support additional capabilities for IPv6 query traffic"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-route-53-resolver-ipv6/"
    "published": "2026-05-08 08:08:00"
    "fetched": "2026-05-09 00:18:48"
    "summary": "<p>Amazon Route 53 Resolver endpoints now support DNS64 on inbound endpoints and IPv6 forwarding through the internet gateway (IGW) on outbound endpoints, making it easier to manage hybrid DNS across IPv4 and IPv6 networks. With DNS64 enabled on inbound endpoints, you can synthesize AAAA (IPv6) responses for domains that only have A (IPv4) records, allowing IPv6-only clients on-premises to reach IPv4 services on AWS without changes to those services. You can also configure outbound endpoints to forward DNS queries to public IPv6 name servers through the IGW.<br /> <br /> Amazon Route 53 Resolver endpoints simplify hybrid cloud DNS by enabling seamless query resolution between on-premises networks and Amazon Virtual Private Cloud (Amazon VPC). As you transition workloads to IPv6, these capabilities help your IPv6 resources on VPCs and on-premises networks communicate with both IPv4 and IPv6 destinations without additional workarounds.<br /> <br /> These capabilities are available at no additional cost in all AWS Regions where Route 53 Resolver endpoints are supported. To get started, see the Route 53 VPC Resolver <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>. For regional availability, see the Route 53 Region <a href=\"https://docs.aws.amazon.com/general/latest/gr/r53.html\" rel=\"noopener noreferrer\" target=\"_blank\">list</a>. For Route 53 Resolver endpoint pricing, see <a href=\"https://aws.amazon.com/route53/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">here</a>.</p>"
  "4095ebc7f09e4f288d3ca9abca95a06a":
    "id": "4095ebc7f09e4f288d3ca9abca95a06a"
    "title": "AWS Marketplace introduces Tax management portal for sellers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-marketplace-tax/"
    "published": "2026-05-08 06:36:00"
    "fetched": "2026-05-09 04:12:17"
    "summary": "<p>AWS Marketplace launches a new Tax management portal that provides sellers a streamlined self-service process to view and download invoices, eliminating the need to request invoices through support channels. Tax management portal integrates the invoice management directly into the AWS Partner Central console, providing centralized access to both seller listing fee invoices and invoices issued to buyers in applicable regions. The portal streamlines invoice retrieval and record-keeping for sellers and partner finance teams managing AWS Marketplace operations.<br /> <br /> Sellers can now access the new experience through AWS Partner Central or AWS Marketplace Management portal, enabling advanced search and filtering capabilities, allowing you to search listing fee invoices by invoice ID, date range, or invoicing entity. Sellers can also access these invoices programmatically through the <a href=\"https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_invoicing_ListInvoiceSummaries.html\">ListInvoiceSummaries</a> API. Sellers can download multiple invoices simultaneously, making it efficient to prepare for audits, reconcile financial records, or retrieve tax-related information. This self-service approach provides transparency into listing fees across different AWS Marketplace invoicing entities, supporting multi-region operations and revenue tracking needs.<br /> <br /> Beyond listing fee invoices, India-based sellers can view and download tax invoices generated on their behalf to the buyer through the portal, with filtering by invoice ID, buyer name, date range, buyer account ID, or invoicing entity.<br /> <br /> Seller listing fee invoices are supported for all AWS Marketplace entities. To learn more about accessing and managing the invoices, visit <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/managing-invoices.html\">AWS Marketplace Seller Guide</a>.</p>"
  "63935a4ea631c38b427fcef88f16ab91":
    "id": "63935a4ea631c38b427fcef88f16ab91"
    "title": "IAM Policy Autopilot adds Java support and Terraform-aware policy generation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/iam-policy-autopilot/"
    "published": "2026-05-08 13:00:00"
    "fetched": "2026-05-09 06:58:26"
    "summary": "<p>IAM Policy Autopilot now supports Java applications and Terraform-aware policy generation, expanding its language coverage and its ability to generate less permissive IAM policies from code. IAM Policy Autopilot is an open-source tool launched at re:Invent 2025 that helps builders quickly and deterministically create baseline IAM policies on AWS that you can refine as your application evolves, reducing the time you spend writing IAM policies and troubleshooting access issues.</p> \n<p>Java has been one of the most requested languages from IAM Policy Autopilot users. With this release, Java developers can now analyze their application source code to generate AWS IAM policies, joining Python, TypeScript, and Go as supported languages. In addition, IAM Policy Autopilot can now cross-reference Terraform resource definitions with SDK calls in your application code to resolve actual resource ARNs for each IAM action. For example, a policy generated for an application that calls S3 GetObject will now reference the specific bucket defined in Terraform rather than defaulting to wildcard (*) resources.&nbsp;</p> \n<p>IAM Policy Autopilot is available at no additional cost and can be used from your own machine. To get started, visit the IAM Policy Autopilot&nbsp;<a href=\"https://github.com/awslabs/iam-policy-autopilot\">GitHub repository</a>.&nbsp;</p>"
  "1845cb8ed77b176c46d92a6ba643c27e":
    "id": "1845cb8ed77b176c46d92a6ba643c27e"
    "title": "AWS WAF introduces dynamic label interpolation for custom request and response handling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-waf-dynamic-label-interpolation/"
    "published": "2026-05-08 00:00:00"
    "fetched": "2026-05-12 03:55:06"
    "summary": "<p>AWS WAF now supports dynamic label interpolation, enabling you to forward WAF classification signals to your origin and embed context in responses with a single rule. Security engineers who previously maintained a separate rule for every signal value can now use ${namespace:} syntax in custom request headers, response headers, and response bodies to forward an entire label namespace at once. For example, one rule with a dynamic variable can forward all IP reputation signals to your application, which can then respond adaptively, such as by enforcing MFA.</p> \n<p>Interpolation also introduces synthetic labels: built-in values resolved from request context, including client IP address, WAF request ID, and JA3 and JA4 fingerprints. You can embed these in custom block pages and challenge pages so users reporting false positives have a reference ID to cite, or forward TLS fingerprints to your application for adaptive auth decisions. Interpolation works with any label namespace, including AWS Managed Rules, AWS Marketplace rule groups, and your own custom labels. Headers automatically adapt as new labels are added to the namespace, and when multiple labels match, values resolve to a comma-separated list.</p> \n<p>Dynamic label interpolation is available in all AWS Regions where AWS WAF is available at no additional cost. There are no new API fields or configuration steps. To get started, see <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-custom-request-response.html#waf-dynamic-label-interpolation\">Dynamic label interpolation</a> in the AWS WAF Developer Guide, or explore the <a href=\"https://github.com/aws-samples/sample-aws-waf-dynamic-labels\">sample on GitHub</a>.</p>"
"last_updated": "2026-05-12 03:55:06 JST"
