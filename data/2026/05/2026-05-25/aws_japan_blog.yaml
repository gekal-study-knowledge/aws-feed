    "title": "週刊生成AI with AWS – 2026/5/18 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260518/"
    "published": "2026-05-25 16:10:01"
    "fetched": "2026-05-25 17:22:36"
    "summary": "週刊生成AI with AWS 2026 年 5 月 18 日号 - キヤノン IT ソリューションズ様、富士電機 IT ソリューション様の Amazon Q Developer 活用国内事例ブログを紹介。また、AI エージェント対応のデータ基盤シリーズや Amazon Bedrock Advanced Prompt Optimization、OpenSearch Agent Skills、AWS Security Agent のフルリポジトリコードレビューなどのブログ記事も。サービスアップデートでは Amazon SageMaker AI の OpenAI 互換 API サポートや Amazon Bedrock のリクエストレベル使用量属性をはじめとする 6 件のアップデートを紹介。"
