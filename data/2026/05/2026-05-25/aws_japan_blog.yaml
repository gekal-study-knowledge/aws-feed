    "fetched": "2026-05-25 17:22:36"
    "summary": "2026年6月25日・26日に幕張メッセで開催されるAWS Summit Japan 2026では、Hall 7のAWS Industries Zone内にてSmart Manufacturingを中心とした製造Highlight展示やお客様事例展示、Product Engineering・Smart Productの最新デモを含む製造Industry展示など、製造業向けの2つの展示エリアをご用意しております。このブログでは、その内容をご紹介します。"
  "497e23681d40c021f864b3911c6e49d8":
