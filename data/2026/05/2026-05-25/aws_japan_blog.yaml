    "summary": "AWS Secrets Manager Agent の pre-fetching と IAM role assumption 機能の提供開始、Amazon SageMaker Studio が SageMaker Flexible Training Plans による GPU キャパシティ予約をサポート、Amazon MWAA が Apache Airflow 3.2 をサポート開始、Amazon SageMaker HyperPod が推論ワークロードのデータキャプチャに対応、Amazon RDS Custom for SQL Server が最新の GDR アップデートに対応、AWS Clean Rooms でコラボレーションの変更可能な payment configurations をサポートなど"
