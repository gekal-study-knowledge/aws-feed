    "title": "Amazon Redshift Introduces Concurrency Scaling Support for auto-copy and zero-ETL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/concurrency-scaling-auto-copy-zero-ETL/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 05:47:43"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift </a>announces the general availability of Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html\">concurrency scaling</a> support for Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/r_COPY-JOB.html\">auto-copy</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html\">zero-ETL</a>, enhancing the performance of data ingestion. This new feature combines the power of auto-copy's seamless data ingestion from Amazon S3 and zero-ETL's near real-time data replication from operational database, transactional database, and applications with the elasticity of concurrency scaling.<br /> <br /> The enhancement delivers benefits for high-volume, time-sensitive data operations. Auto-copy monitors S3 buckets and loads new data files automatically, while zero-ETL replicates data from operational and transactional databases in near real-time. When enabled, concurrency scaling adds compute capacity automatically to handle increased read and write queries, ensuring faster data ingestion without compromising performance during peak periods.<br /> <br /> This new enhancement is available in all AWS commercial regions and AWS GovCloud (US) regions where Amazon Redshift is available for Amazon Redshift Serverless and RA3 Provisioned data warehouses. You can implement this feature immediately to optimize their data ingestion workflows.</p>"
  "db63a57b3eed812b92ec230760912e42":
    "id": "db63a57b3eed812b92ec230760912e42"
    "title": "AWS Transform now offers BI migration agents for Power BI and Tableau to Amazon Quick"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/quick-bi-migration/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 06:50:31"
    "summary": "<p>AWS Transform&nbsp;customers can&nbsp;now&nbsp;use&nbsp;BI migration agents to&nbsp;convert Tableau and Power BI dashboards to Amazon Quick Sight&nbsp;(BI capability of Amazon Quick)&nbsp;assets,&nbsp;helping&nbsp;reduce&nbsp;migration effort from months to days.&nbsp;These agents are&nbsp;built&nbsp;by&nbsp;<a href=\"https://wavicledata.com/bi-migration-aws-transform/\" rel=\"noopener noreferrer\" target=\"_blank\">Wavicle Data Solutions</a>, an AWS Advanced Consulting Partner,&nbsp;leveraging&nbsp;the&nbsp;AWS Transform&nbsp;initiative to create differentiated transformation solutions by integrating specialized agents, tools, knowledge bases, and workflow with AWS Transform’s agentic AI capabilities.&nbsp;Four agents&nbsp;are available&nbsp;for purchase through AWS Marketplace:&nbsp;one&nbsp;Analyzer&nbsp;agent&nbsp;and&nbsp;one&nbsp;Converter&nbsp;agent for&nbsp;each BI migration source (Power BI&nbsp;and&nbsp;Tableau). </p> \n<p>AWS Transform is a collaborative enterprise IT transformation workbench powered by expert agents, agentic AI systems, and continuous learning that accelerates cloud migration, legacy app modernization, and tech debt reduction.&nbsp;These&nbsp;new BI migration agents are embedded into the AWS Transform workflow and use a chat-based interface to assess your source dashboards for migration readiness, then convert them – rebuilding datasets, calculated fields, visualizations,&nbsp;and&nbsp;filters in&nbsp;Amazon Quick Sight.&nbsp;All processing runs within your AWS account; no data leaves your environment. After conversion, your Amazon Quick administrators assign dashboard ownership to BI authors for validation and publishing. Once migrated, your teams can take advantage of Amazon Quick's AI-powered workflows, including natural-language business questions, automated research, and data-driven actions.</p> \n<p>The BI migration agents are available through AWS Marketplace in&nbsp;US&nbsp;East&nbsp;(N. Virginia). They support Quick Sight asset creation in all&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/quicksight.html\" rel=\"noopener noreferrer\" target=\"_blank\">commercial regions where Amazon Quick Sight is available</a>.&nbsp;To get started, subscribe&nbsp;through&nbsp;AWS Marketplace (<a href=\"https://aws.amazon.com/marketplace/pp/prodview-p7sor3iihijpg\" target=\"_blank\">Power BI</a> or <a href=\"https://aws.amazon.com/marketplace/pp/prodview-dkpskx3mnmk6m\" target=\"_blank\">Tableau</a>) or&nbsp;contact your AWS account team&nbsp;to explore available programs for free&nbsp;or discounted&nbsp;Amazon Quick migrations. Read more in this&nbsp;<a href=\"https://aws.amazon.com/blogs/machine-learning/aws-transform-now-automates-bi-migration-to-amazon-quick-in-days/\" rel=\"noopener noreferrer\" target=\"_blank\">blog post</a>.</p>"
  "1f3a897fe5b01b52564b310dabb4a36a":
    "id": "1f3a897fe5b01b52564b310dabb4a36a"
    "title": "OpenSearch UI supports cross-region data access to OpenSearch domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/opensearch-ui-cross-region-data-access-domains/"
    "published": "2026-05-02 05:54:00"
    "fetched": "2026-05-02 07:45:25"
    "summary": "<p>Amazon OpenSearch Service now supports cross-region data access for OpenSearch UI, enabling users to access OpenSearch domains hosted in different AWS Regions from within a single OpenSearch UI application. Combined with the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application-cross-account-data-access-domains.html\">cross-account data access</a> launch earlier this year, you can now query or build dashboards on OpenSearch domains in flexible combinations of accounts and Regions - without switching endpoints or replicating data. Cross-region data access is available for OpenSearch domains hosted in both public and Virtual Private Cloud (VPC) configurations.<br /> <br /> With cross-region data access, teams can build centralized analytics, search, and observability workflows across globally distributed deployments while keeping data in place - meeting data residency requirements, minimizing inter-region egress, and preserving each Region’s latency and availability characteristics. If you are using cross-cluster replication, you can now query both your primary and replica domains directly from a single OpenSearch UI application. Cross-region data access can be combined with cross-account data access, so a single OpenSearch UI application can connect to domains in different accounts, different Regions, or both. Cross-region data access supports both IAM and IAM Identity Center for end-user authentication.<br /> <br /> Cross-region data access to OpenSearch domains is available in all AWS Regions where OpenSearch UI is available. To learn more, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application-cross-region-data-access-domains.html\">Cross-region data access to OpenSearch domains</a> in the Amazon OpenSearch Service Developer Guide.</p>"
