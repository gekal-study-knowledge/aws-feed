    "title": "IAM Roles Anywhere now enforces VPC endpoint policies for the CreateSession API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/iam-roles-anywhere-vpc/"
    "published": "2026-05-02 01:00:00"
    "fetched": "2026-05-02 04:12:57"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/roles-anywhere/\">AWS Identity and Access Management (IAM) Roles Anywhere</a> now provides the capability to configure Virtual Private Cloud (VPC) endpoint policies for the IAM Roles Anywhere CreateSession API. You can update your VPC endpoint policies to allow or deny the CreateSession operation. If CreateSession is not explicitly included in the Allow statement of your VPC endpoint policy or if you don’t allow all operations (for example, by specifying “rolesanywhere:*“ as the action), IAM Roles Anywhere will not return temporary AWS credentials for requests made through your VPC endpoint.<br /> <br /> The CreateSession API enables workloads running outside of AWS to obtain temporary AWS credentials using X.509 certificates to access AWS resources. Previously, VPC endpoint policies applied to all IAM Roles Anywhere API operations except CreateSession. This launch closes that gap, giving you consistent, fine-grained access control across all IAM Roles Anywhere API operations.<br /> <br /> This feature is available in all <a href=\"https://docs.aws.amazon.com/general/latest/gr/rolesanywhere.html\">AWS Regions</a> where IAM Roles Anywhere is available, including the AWS GovCloud (US) Regions, AWS European Sovereign Cloud (Germany) Region, and China Regions. To learn more, see the <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/vpc-interface-endpoints.html\">IAM Roles Anywhere User Guide</a>.</p>"
  "e5b820607f33b2ed73c4bbd40ceaf1d3":
    "id": "e5b820607f33b2ed73c4bbd40ceaf1d3"
    "title": "Concurrency Scaling Support for auto-copy and zero-ETL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/concurrency-scaling-auto-copy-zero-ETL/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 04:12:57"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift </a>announces the general availability of Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html\">concurrency scaling</a> support for Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/r_COPY-JOB.html\">auto-copy</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html\">zero-ETL</a>, enhancing the performance of data ingestion. This new feature combines the power of auto-copy's seamless data ingestion from Amazon S3 and zero-ETL's near real-time data replication from operational database, transactional database, and applications with the elasticity of concurrency scaling.<br /> <br /> The enhancement delivers benefits for high-volume, time-sensitive data operations. Auto-copy monitors S3 buckets and loads new data files automatically, while zero-ETL replicates data from operational and transactional databases in near real-time. When enabled, concurrency scaling adds compute capacity automatically to handle increased read and write queries, ensuring faster data ingestion without compromising performance during peak periods.<br /> <br /> This new enhancement is available in all AWS commercial regions and AWS GovCloud (US) regions where Amazon Redshift is available for Amazon Redshift Serverless and RA3 Provisioned data warehouses. You can implement this feature immediately to optimize their data ingestion workflows.</p>"
