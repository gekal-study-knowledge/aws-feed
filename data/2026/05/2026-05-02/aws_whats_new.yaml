  "c50614d43a2ea51758ac596fad49fd58":
    "id": "c50614d43a2ea51758ac596fad49fd58"
    "title": "IAM Roles Anywhere now enforces VPC endpoint policies for the CreateSession API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/iam-roles-anywhere-vpc/"
    "published": "2026-05-02 01:00:00"
    "fetched": "2026-05-02 04:12:57"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/roles-anywhere/\">AWS Identity and Access Management (IAM) Roles Anywhere</a> now provides the capability to configure Virtual Private Cloud (VPC) endpoint policies for the IAM Roles Anywhere CreateSession API. You can update your VPC endpoint policies to allow or deny the CreateSession operation. If CreateSession is not explicitly included in the Allow statement of your VPC endpoint policy or if you don’t allow all operations (for example, by specifying “rolesanywhere:*“ as the action), IAM Roles Anywhere will not return temporary AWS credentials for requests made through your VPC endpoint.<br /> <br /> The CreateSession API enables workloads running outside of AWS to obtain temporary AWS credentials using X.509 certificates to access AWS resources. Previously, VPC endpoint policies applied to all IAM Roles Anywhere API operations except CreateSession. This launch closes that gap, giving you consistent, fine-grained access control across all IAM Roles Anywhere API operations.<br /> <br /> This feature is available in all <a href=\"https://docs.aws.amazon.com/general/latest/gr/rolesanywhere.html\">AWS Regions</a> where IAM Roles Anywhere is available, including the AWS GovCloud (US) Regions, AWS European Sovereign Cloud (Germany) Region, and China Regions. To learn more, see the <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/vpc-interface-endpoints.html\">IAM Roles Anywhere User Guide</a>.</p>"
  "e5b820607f33b2ed73c4bbd40ceaf1d3":
    "id": "e5b820607f33b2ed73c4bbd40ceaf1d3"
    "title": "Concurrency Scaling Support for auto-copy and zero-ETL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/concurrency-scaling-auto-copy-zero-ETL/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 04:12:57"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift </a>announces the general availability of Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html\">concurrency scaling</a> support for Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/r_COPY-JOB.html\">auto-copy</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html\">zero-ETL</a>, enhancing the performance of data ingestion. This new feature combines the power of auto-copy's seamless data ingestion from Amazon S3 and zero-ETL's near real-time data replication from operational database, transactional database, and applications with the elasticity of concurrency scaling.<br /> <br /> The enhancement delivers benefits for high-volume, time-sensitive data operations. Auto-copy monitors S3 buckets and loads new data files automatically, while zero-ETL replicates data from operational and transactional databases in near real-time. When enabled, concurrency scaling adds compute capacity automatically to handle increased read and write queries, ensuring faster data ingestion without compromising performance during peak periods.<br /> <br /> This new enhancement is available in all AWS commercial regions and AWS GovCloud (US) regions where Amazon Redshift is available for Amazon Redshift Serverless and RA3 Provisioned data warehouses. You can implement this feature immediately to optimize their data ingestion workflows.</p>"
  "8dd96d438cdb0045d9740ee4005b07b4":
    "id": "8dd96d438cdb0045d9740ee4005b07b4"
    "title": "Amazon CloudFront Announces WebSocket Support for VPC Origins"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-cloudfront-websockets-vpc-origins/"
    "published": "2026-05-02 04:30:00"
    "fetched": "2026-05-02 05:47:43"
    "summary": "<p>Amazon CloudFront now supports WebSockets traffic through Virtual Private Cloud (VPC) origins, enabling you to use CloudFront as the single entry point for real-time applications hosted entirely in private subnets. WebSockets support extends VPC origins to applications that require persistent, bidirectional connections between clients and servers, such as chat platforms, collaborative editing tools, live dashboards, and IoT device management systems.<br /> <br /> Previously, customers running real-time applications over WebSockets had to keep their origins in public subnets and use Access Control Lists and other mechanisms to restrict access to their WebSockets-enabled servers. Customers had to spend ongoing effort to implement and maintain these solutions. Now, customers can place their Application Load Balancers (ALB), Network Load Balancers (NLB), and EC2 instances serving WebSockets traffic in private subnets accessible only through their CloudFront distributions. CloudFront serves as the single front door for both traditional HTTP traffic and real-time WebSockets connections, reducing attack surface, simplifying security management, and providing built-in DDoS protection.<br /> <br /> WebSockets support for VPC origins is available in all AWS Commercial Regions where VPC origins is supported. There is no additional cost for WebSockets traffic through VPC origins. To learn more, visit&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html\">CloudFront VPC origins</a>.</p>"
  "0295a1a687c4aad555cc25e79c000f4a":
    "id": "0295a1a687c4aad555cc25e79c000f4a"
    "title": "Amazon Redshift Introduces Concurrency Scaling Support for auto-copy and zero-ETL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/concurrency-scaling-auto-copy-zero-ETL/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 05:47:43"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift </a>announces the general availability of Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/concurrency-scaling.html\">concurrency scaling</a> support for Amazon Redshift <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/r_COPY-JOB.html\">auto-copy</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html\">zero-ETL</a>, enhancing the performance of data ingestion. This new feature combines the power of auto-copy's seamless data ingestion from Amazon S3 and zero-ETL's near real-time data replication from operational database, transactional database, and applications with the elasticity of concurrency scaling.<br /> <br /> The enhancement delivers benefits for high-volume, time-sensitive data operations. Auto-copy monitors S3 buckets and loads new data files automatically, while zero-ETL replicates data from operational and transactional databases in near real-time. When enabled, concurrency scaling adds compute capacity automatically to handle increased read and write queries, ensuring faster data ingestion without compromising performance during peak periods.<br /> <br /> This new enhancement is available in all AWS commercial regions and AWS GovCloud (US) regions where Amazon Redshift is available for Amazon Redshift Serverless and RA3 Provisioned data warehouses. You can implement this feature immediately to optimize their data ingestion workflows.</p>"
  "db63a57b3eed812b92ec230760912e42":
    "id": "db63a57b3eed812b92ec230760912e42"
    "title": "AWS Transform now offers BI migration agents for Power BI and Tableau to Amazon Quick"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/quick-bi-migration/"
    "published": "2026-05-02 00:00:00"
    "fetched": "2026-05-02 06:50:31"
    "summary": "<p>AWS Transform&nbsp;customers can&nbsp;now&nbsp;use&nbsp;BI migration agents to&nbsp;convert Tableau and Power BI dashboards to Amazon Quick Sight&nbsp;(BI capability of Amazon Quick)&nbsp;assets,&nbsp;helping&nbsp;reduce&nbsp;migration effort from months to days.&nbsp;These agents are&nbsp;built&nbsp;by&nbsp;<a href=\"https://wavicledata.com/bi-migration-aws-transform/\" rel=\"noopener noreferrer\" target=\"_blank\">Wavicle Data Solutions</a>, an AWS Advanced Consulting Partner,&nbsp;leveraging&nbsp;the&nbsp;AWS Transform&nbsp;initiative to create differentiated transformation solutions by integrating specialized agents, tools, knowledge bases, and workflow with AWS Transform’s agentic AI capabilities.&nbsp;Four agents&nbsp;are available&nbsp;for purchase through AWS Marketplace:&nbsp;one&nbsp;Analyzer&nbsp;agent&nbsp;and&nbsp;one&nbsp;Converter&nbsp;agent for&nbsp;each BI migration source (Power BI&nbsp;and&nbsp;Tableau). </p> \n<p>AWS Transform is a collaborative enterprise IT transformation workbench powered by expert agents, agentic AI systems, and continuous learning that accelerates cloud migration, legacy app modernization, and tech debt reduction.&nbsp;These&nbsp;new BI migration agents are embedded into the AWS Transform workflow and use a chat-based interface to assess your source dashboards for migration readiness, then convert them – rebuilding datasets, calculated fields, visualizations,&nbsp;and&nbsp;filters in&nbsp;Amazon Quick Sight.&nbsp;All processing runs within your AWS account; no data leaves your environment. After conversion, your Amazon Quick administrators assign dashboard ownership to BI authors for validation and publishing. Once migrated, your teams can take advantage of Amazon Quick's AI-powered workflows, including natural-language business questions, automated research, and data-driven actions.</p> \n<p>The BI migration agents are available through AWS Marketplace in&nbsp;US&nbsp;East&nbsp;(N. Virginia). They support Quick Sight asset creation in all&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/quicksight.html\" rel=\"noopener noreferrer\" target=\"_blank\">commercial regions where Amazon Quick Sight is available</a>.&nbsp;To get started, subscribe&nbsp;through&nbsp;AWS Marketplace (<a href=\"https://aws.amazon.com/marketplace/pp/prodview-p7sor3iihijpg\" target=\"_blank\">Power BI</a> or <a href=\"https://aws.amazon.com/marketplace/pp/prodview-dkpskx3mnmk6m\" target=\"_blank\">Tableau</a>) or&nbsp;contact your AWS account team&nbsp;to explore available programs for free&nbsp;or discounted&nbsp;Amazon Quick migrations. Read more in this&nbsp;<a href=\"https://aws.amazon.com/blogs/machine-learning/aws-transform-now-automates-bi-migration-to-amazon-quick-in-days/\" rel=\"noopener noreferrer\" target=\"_blank\">blog post</a>.</p>"
  "1f3a897fe5b01b52564b310dabb4a36a":
    "id": "1f3a897fe5b01b52564b310dabb4a36a"
    "title": "OpenSearch UI supports cross-region data access to OpenSearch domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/opensearch-ui-cross-region-data-access-domains/"
    "published": "2026-05-02 05:54:00"
    "fetched": "2026-05-02 07:45:25"
    "summary": "<p>Amazon OpenSearch Service now supports cross-region data access for OpenSearch UI, enabling users to access OpenSearch domains hosted in different AWS Regions from within a single OpenSearch UI application. Combined with the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application-cross-account-data-access-domains.html\">cross-account data access</a> launch earlier this year, you can now query or build dashboards on OpenSearch domains in flexible combinations of accounts and Regions - without switching endpoints or replicating data. Cross-region data access is available for OpenSearch domains hosted in both public and Virtual Private Cloud (VPC) configurations.<br /> <br /> With cross-region data access, teams can build centralized analytics, search, and observability workflows across globally distributed deployments while keeping data in place - meeting data residency requirements, minimizing inter-region egress, and preserving each Region’s latency and availability characteristics. If you are using cross-cluster replication, you can now query both your primary and replica domains directly from a single OpenSearch UI application. Cross-region data access can be combined with cross-account data access, so a single OpenSearch UI application can connect to domains in different accounts, different Regions, or both. Cross-region data access supports both IAM and IAM Identity Center for end-user authentication.<br /> <br /> Cross-region data access to OpenSearch domains is available in all AWS Regions where OpenSearch UI is available. To learn more, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application-cross-region-data-access-domains.html\">Cross-region data access to OpenSearch domains</a> in the Amazon OpenSearch Service Developer Guide.</p>"
  "588d1fe285a01d579fb7839b8222b8bf":
    "id": "588d1fe285a01d579fb7839b8222b8bf"
    "title": "Amazon Bedrock AgentCore is now available in the South America (São Paulo) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/agentcore-sao-paulo-region/"
    "published": "2026-05-02 07:00:00"
    "fetched": "2026-05-02 08:48:33"
    "summary": "<p>Amazon Bedrock AgentCore is now available in the AWS South America (São Paulo) Region. Amazon Bedrock AgentCore is the platform to build, connect, and optimize agents. It helps engineers ship agents fast with any framework and any model, connect them to enterprise systems and tools, and optimize them continuously, with security enforced at the infrastructure layer that agents can't bypass.<br /> <br /> With this expansion, customers in South America can deploy and operate agents closer to their end users, reducing latency and helping meet data residency requirements. AgentCore capabilities including agent runtime, identity, gateway, policy, observability, code interpreter, and browser tools are available in the São Paulo Region at launch.<br /> <br /> For more information on AgentCore, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">AgentCore product page</a> or the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html\">AgentCore Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>. For region availability, visit <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a>.</p>"
  "906977ebef190eb3294ff87b1c1450f1":
    "id": "906977ebef190eb3294ff87b1c1450f1"
    "title": "FreeRTOS 202604 LTS now available with enhanced security and MQTT v5.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/freertos-lts/"
    "published": "2026-05-02 06:42:00"
    "fetched": "2026-05-02 08:48:33"
    "summary": "<p>FreeRTOS 202604 LTS, a new Long Term Support release of the open-source real-time operating system for embedded devices, is now available. This release provides embedded systems developers and Internet of Things (IoT) device manufacturers with feature stability, security updates, and critical bug fixes for two years. It addresses key challenges in embedded systems, including memory safety, code quality, and protocol support.<br /> <br /> FreeRTOS kernel v11.3.0 introduces new hardware ports, security hardening, and expanded Memory Protection Unit (MPU) support, reducing the number of MPU regions claimed by FreeRTOS and allowing developers to reserve hardware regions for application-specific memory protection. Additionally, coreMQTT v5.0.2 adds MQTT v5.0 protocol support, enabling features like topic aliases for bandwidth-constrained devices and request/response patterns for interactive IoT applications. coreSNTP v2.0.0 brings year 2038 readiness, so devices deployed today can validate TLS certificates and timestamp data correctly throughout their operational lifetime.<br /> <br /> This release offers libraries verified for memory safety and MISRA-C compliance. The libraries improve robustness, portability, and reliability in embedded systems.<br /> <br /> Migration guides for <a href=\"https://github.com/FreeRTOS/coreMQTT/blob/main/MQTTv5Guide.md\">coreMQTT</a> and <a href=\"https://github.com/FreeRTOS/coreSNTP/blob/main/MigrationGuide.md\">coreSNTP</a> provide detailed guidance for updating to FreeRTOS 202604 LTS. For projects requiring critical fixes on the previous LTS version beyond its expiry, the <a href=\"https://aws.amazon.com/freertos/features/#freertos-extended-maintenance-plan--oxjb3r\">FreeRTOS Extended Maintenance Plan</a> is available. To learn more, visit the <a href=\"https://freertos.org/Documentation/03-Libraries/01-Library-overview/03-LTS-libraries/01-LTS-libraries\">FreeRTOS LTS page</a> and <a href=\"https://github.com/FreeRTOS/FreeRTOS-LTS\">FreeRTOS LTS GitHub repository</a>.</p>"
  "3ae678aaf6134d1beddbe285c966d6bf":
    "id": "3ae678aaf6134d1beddbe285c966d6bf"
    "title": "Amazon CloudWatch RUM now supports Session Replay for Web Applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-cloudwatch-rum-session/"
    "published": "2026-05-02 06:07:00"
    "fetched": "2026-05-06 05:04:30"
    "summary": "<p>Amazon CloudWatch RUM (Real User Monitoring) Session Replay gives developers a video-like playback of user experiences on their web applications — capturing clicks, scrolls, page changes, and errors — so they can see exactly what a user encountered in their browser without needing to reproduce the issue. CloudWatch RUM collects client-side performance metrics and error data from both web and mobile applications; Session Replay extends this visibility for web applications by letting developers visually diagnose issues like broken navigation flows or unresponsive UI elements that don't surface in server-side logs. This capability is built for front-end developers and application owners who need to move quickly from a user-reported problem to its root cause.<br /> <br /> Session Replay helps developers identify user experience issues — such as forms that fail to render or navigation flows that break — that can silently impact conversion and engagement, even when no one reports them. Developers can also replay sessions to study navigation patterns and identify drop-off points. To get started, enable Session Replay in your app monitor and view recorded sessions from the Session Replay tab in the CloudWatch RUM console — the feature is opt-in, supports sensitive field masking, and is included at no additional cost.</p> \n<p>Session Replay for Amazon CloudWatch RUM is available in all AWS Regions where CloudWatch RUM is supported. To learn more about Session Replay for Amazon CloudWatch RUM, see the &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM.html\">Amazon CloudWatch RUM documentation&nbsp;</a>. For pricing details, see the &nbsp;<a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing page&nbsp;</a>.</p>"
"last_updated": "2026-05-06 05:04:30 JST"
