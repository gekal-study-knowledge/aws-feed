"overview": |
  この日は分析・BI 移行とセキュリティが目立ちました。AWS Transform に Power BI・Tableau ダッシュボードを Amazon Quick (Quick Sight) へ変換する BI 移行エージェントが追加され、移行期間を数か月から数日へ短縮できるとされました。ネットワークとオブザーバビリティ分野では、Amazon CloudFront が VPC オリジンでの WebSocket をサポートし、Amazon CloudWatch RUM にセッションリプレイ機能が加わりました。データ関連では Amazon Redshift の concurrency scaling が auto-copy と zero-ETL に対応し、OpenSearch UI がクロスリージョンのデータアクセスを実現しました。ID/IoT では IAM Roles Anywhere の CreateSession API に VPC エンドポイントポリシーが適用され、Bedrock AgentCore がサンパウロリージョンに展開、FreeRTOS 202604 LTS が MQTT v5.0 対応で公開されました。セキュリティでは ISO 31000:2018 リスク管理コンプライアンスガイドの公開や AI 時代のセキュリティ態勢向上に関する記事、および ECS エージェントの FSx ボリューム認証情報を悪用する OS コマンドインジェクション (CVE-2026-7461) の速報が出されました。
