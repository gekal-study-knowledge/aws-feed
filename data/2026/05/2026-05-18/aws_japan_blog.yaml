    "title": "Amazon MWAA における Airflow ワーカープール最適化ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/a-guide-to-airflow-worker-pool-optimization-in-amazon-mwaa/"
    "published": "2026-05-18 08:42:27"
    "fetched": "2026-05-18 08:55:08"
    "summary": "本記事では、Amazon MWAA におけるワーカースケーリングの判断パターンを、タスクプールの仕組みとワーカー割り当ての関係に焦点を当てて解説します。具体的なシナリオと実践的な判断フレームワークを示し、ワーカーの追加がパフォーマンス課題の適切な解決策かどうか、また適切な場合にどうスケーリングを実装するかの指針を提供します。"
  "ad15770cd7dba8ed4fe5c5e18a376da4":
    "id": "ad15770cd7dba8ed4fe5c5e18a376da4"
    "title": "Amazon Aurora DSQL によるグローバル規模の金融トランザクション"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-aurora-dsql-for-global-scale-financial-transactions/"
    "published": "2026-05-18 10:45:38"
    "fetched": "2026-05-18 11:55:56"
    "summary": "Amazon Aurora DSQL を使用して、強い整合性と低レイテンシーを両立しながらグローバル規模の金融トランザクションを実行する方法を解説します。コアバンキング、グローバル経費管理、デジタル通貨インフラストラクチャの 3 つのユースケースを通じて、従来の 2 フェーズコミットや結果整合性のトレードオフを解消するアーキテクチャを紹介します。"
  "186320de0d7381d57c43c2f10bd1abed":
    "id": "186320de0d7381d57c43c2f10bd1abed"
    "title": "富士電機ITソリューションが挑戦する働き方の大変革 〜Amazon Q Developer 活用から Kiro による新しい企業価値創出へ〜"
    "link": "https://aws.amazon.com/jp/blogs/news/fuji-electric-it-solutions-fsl-genai/"
    "published": "2026-05-18 10:05:16"
    "fetched": "2026-05-18 11:55:56"
    "summary": "この記事では、富士電機ITソリューション株式会社（以下、FSL）が Amazon Q Developer Pro サブスクリプションを活用し、開発者が実施する業務だけではなく日常業務でも生成 AI を取り込むことで、業務効率化のその先にある新しい企業価値の創出へと歩みを進めている旅路をご紹介します。AWS は、Amazon Q Developer や Kiro をはじめとするコーディングエージェントや生成 AI サービスを通じて、お客様ならではの価値創出の旅路を引き続きサポートしてまいります。生成 AI を活用した開発変革について、ぜひ AWS の担当者にご相談ください。"
