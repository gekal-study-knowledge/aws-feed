    "title": "Introducing pre-fetching and IAM role assumption for AWS Secrets Manager Agent"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/secrets-manager-agent-prefetch-and-role-assumption/"
    "published": "2026-05-18 16:00:00"
    "fetched": "2026-05-20 05:45:50"
    "summary": "<p>AWS Secrets Manager Agent now supports two new capabilities: pre-fetching secrets at startup and assuming an IAM role to retrieve secrets. With pre-fetching, you can specify a list of secrets or a tag value to retrieve and cache at agent&nbsp;startup, reducing application startup latency and&nbsp;optimizing&nbsp;cost through the&nbsp;BatchGetSecretValue&nbsp;API. With IAM role assumption, you can pass a role ARN in your pre-fetch configuration or HTTP requests&nbsp;for secret retrieval. The agent assumes the specified role to retrieve secrets, enabling cross-account secret retrieval by assuming a role in a different account.</p> \n<p>Together, these enhancements strengthen your security posture through role-based secret access and reduce operational overhead by&nbsp;eliminating&nbsp;custom pre-loading logic. For example, a microservice that requires 20 secrets at startup can now pre-fetch them in a single batch operation, cutting startup latency by avoiding sequential&nbsp;GetSecretValue&nbsp;calls. IAM role assumption also simplifies multi-account architectures by enabling you to specify a different IAM role per secret.</p> \n<p>AWS Secrets Manager Agent with pre-fetching and IAM role assumption is supported in all AWS Regions where AWS Secrets Manager is offered. To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/secrets-manager-agent.html\">AWS Secrets Manager Agent documentation</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
"last_updated": "2026-05-20 05:45:50 JST"
