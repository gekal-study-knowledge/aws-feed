"overview": |
  この日は Amazon Quick の生成 AI 分析機能が大きく前進しました。自然言語プロンプトからマルチシートのダッシュボードを生成する Generate Analysis、構造化データに対する対話型分析 Dataset Q&A、そして Apache Iceberg 対応の S3 テーブルバケットをデータソースとする直接クエリが一般提供され、Microsoft Outlook 向け拡張機能もプレビュー公開されました。SageMaker AI では自然言語でモデルカスタマイズを進めるエージェント体験が登場し、Kiro・Claude Code・CoPilot 等のコーディングエージェントと連携します。Bedrock AgentCore の最適化機能（エージェント品質ループ）がプレビューで詳説され、GovCloud (US-West) にも展開されました。基盤面では Aurora DSQL の JSON 型対応、EventBridge のデータプレーン CloudTrail ログ、IAM のクォータ引き上げ、EC2 I8ge・FSx のニュージーランドリージョン展開、SageMaker JumpStart への Qwen 新モデル 4 種追加などがありました。セキュリティではオープンプロキシの保護に関する記事と、WorkSpaces Skylight エージェントの権限昇格 (CVE-2026-7791) の速報が出されました。
