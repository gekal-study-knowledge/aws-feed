    "title": "Amazon Quick now supports S3 tables bucket as a data source"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/quick-direct-query-s3-tables/"
    "published": "2026-05-05 01:00:00"
    "fetched": "2026-05-05 02:45:38"
    "summary": "<p>Amazon Quick now supports Amazon S3 table buckets as a data source — enabling users to build dashboards, run conversational analytics, and explore Apache Iceberg tables stored in S3 table buckets. With no intermediate data warehouse or OLAP layers required, users can now interoperate with their lakehouse data in Amazon Quick for both agentic AI and BI workloads — all through a simplified data architecture.</p> \n<p>Paired with Zero-ETL from sources like Salesforce, SAP, and Amazon Kinesis Data Firehose directly into S3 table buckets, users get near real-time insights with minimal pipeline dependencies.&nbsp;Getting started is straightforward: admins configure S3 table bucket permissions once, and authors can immediately create datasets and start building. S3 table bucket datasets are fully accessible through Amazon Quick's Dataset Q&amp;A — ask a natural language question and get answers grounded in your data lake as the source of truth.</p> \n<p>Amazon S3 table buckets as a data source in Amazon Quick is now available in all AWS Regions <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\">where Amazon Quick is available</a>. To get started, see this <a href=\"https://aws.amazon.com/blogs/machine-learning/from-data-lake-to-ai-ready-analytics-introducing-direct-query-with-s3-tables-in-amazon-quick/\">blog post</a>.</p>"
  "119c56fc50fa5679cbfa182ebd41cddc":
    "id": "119c56fc50fa5679cbfa182ebd41cddc"
    "title": "Amazon SageMaker AI launches AI agent experience for model customization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-ai-ai/"
    "published": "2026-05-05 00:00:00"
    "fetched": "2026-05-05 02:45:38"
    "summary": "<p>Amazon SageMaker AI now features an agentic experience that transforms model customization from a months-long process into a workflow completed in days or hours. Customers building an AI solution need to carefully frame their use case goals and success criteria, prepare data, choose the right models, configure, run, and analyze multiple experiments with various models and fine tuning techniques. Once a suitable model candidate that meets the success criteria is identified, they need to figure out the most cost performant way to deploy the model. Throughout this workflow customers need to manage the undifferentiated heavy lifting of setting up the infrastructure to train and deploy the models. The new capability now enables developers to use natural language interactions with coding agents to streamline the entire journey from use case definition to production deployment of a high quality model.<br /> <br /> The agentic experience, based on SageMaker AI model customization agent skills, delivers expertise on fine-tuning applied to a builder’s specific use case, transformation to the required data formats, comprehensive quality evaluation using LLM-as-a-judge metrics, and flexible deployment options to Amazon Bedrock or SageMaker AI endpoints. Customers can <a href=\"https://github.com/awslabs/agent-plugins/tree/main/plugins/sagemaker-ai\">install these skills</a> in any IDE of their choice, such as Visual Studio and Cursor. Developers can work with multiple coding agents including Kiro, Claude Code, and CoPilot, in order to optimize popular model families like Amazon Nova, Llama, Qwen, and GPT-OSS. The experience generates reusable, editable code artifacts for transparency, reproducibility, and automation through integration into AIOps pipelines<br /> <br /> Install SageMaker AI skills in your favorite IDE using the <a href=\"https://github.com/awslabs/agent-plugins/tree/main/plugins/sagemaker-ai\">sagemaker-ai agent plugin</a>. SageMaker AI model customization skills are also available and pre-installed in SageMaker Studio Notebooks, along with the Kiro coding agent. All you need to do is just sign up for Kiro subscription, open the chat window in Studio Notebooks and start chatting with the agent to build the workflow. The experience supports advanced customization techniques including supervised fine-tuning for instruction tuning, direct Preference Optimization for adjusting tone and preference selections, and Reinforcement Learning for use cases with verifiable correctness.<br /> <br /> To learn more about model customization with the AI agent experience in Amazon SageMaker AI, visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">SageMaker model customization documentation</a>.</p>"
