  "0be82a253f5e81b12928b74e0f50fecb":
    "id": "0be82a253f5e81b12928b74e0f50fecb"
    "title": "Amazon Quick now supports S3 tables bucket as a data source"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/quick-direct-query-s3-tables/"
    "published": "2026-05-05 01:00:00"
    "fetched": "2026-05-05 02:45:38"
    "summary": "<p>Amazon Quick now supports Amazon S3 table buckets as a data source — enabling users to build dashboards, run conversational analytics, and explore Apache Iceberg tables stored in S3 table buckets. With no intermediate data warehouse or OLAP layers required, users can now interoperate with their lakehouse data in Amazon Quick for both agentic AI and BI workloads — all through a simplified data architecture.</p> \n<p>Paired with Zero-ETL from sources like Salesforce, SAP, and Amazon Kinesis Data Firehose directly into S3 table buckets, users get near real-time insights with minimal pipeline dependencies.&nbsp;Getting started is straightforward: admins configure S3 table bucket permissions once, and authors can immediately create datasets and start building. S3 table bucket datasets are fully accessible through Amazon Quick's Dataset Q&amp;A — ask a natural language question and get answers grounded in your data lake as the source of truth.</p> \n<p>Amazon S3 table buckets as a data source in Amazon Quick is now available in all AWS Regions <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\">where Amazon Quick is available</a>. To get started, see this <a href=\"https://aws.amazon.com/blogs/machine-learning/from-data-lake-to-ai-ready-analytics-introducing-direct-query-with-s3-tables-in-amazon-quick/\">blog post</a>.</p>"
  "119c56fc50fa5679cbfa182ebd41cddc":
    "id": "119c56fc50fa5679cbfa182ebd41cddc"
    "title": "Amazon SageMaker AI launches AI agent experience for model customization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-ai-ai/"
    "published": "2026-05-05 00:00:00"
    "fetched": "2026-05-05 02:45:38"
    "summary": "<p>Amazon SageMaker AI now features an agentic experience that transforms model customization from a months-long process into a workflow completed in days or hours. Customers building an AI solution need to carefully frame their use case goals and success criteria, prepare data, choose the right models, configure, run, and analyze multiple experiments with various models and fine tuning techniques. Once a suitable model candidate that meets the success criteria is identified, they need to figure out the most cost performant way to deploy the model. Throughout this workflow customers need to manage the undifferentiated heavy lifting of setting up the infrastructure to train and deploy the models. The new capability now enables developers to use natural language interactions with coding agents to streamline the entire journey from use case definition to production deployment of a high quality model.<br /> <br /> The agentic experience, based on SageMaker AI model customization agent skills, delivers expertise on fine-tuning applied to a builder’s specific use case, transformation to the required data formats, comprehensive quality evaluation using LLM-as-a-judge metrics, and flexible deployment options to Amazon Bedrock or SageMaker AI endpoints. Customers can <a href=\"https://github.com/awslabs/agent-plugins/tree/main/plugins/sagemaker-ai\">install these skills</a> in any IDE of their choice, such as Visual Studio and Cursor. Developers can work with multiple coding agents including Kiro, Claude Code, and CoPilot, in order to optimize popular model families like Amazon Nova, Llama, Qwen, and GPT-OSS. The experience generates reusable, editable code artifacts for transparency, reproducibility, and automation through integration into AIOps pipelines<br /> <br /> Install SageMaker AI skills in your favorite IDE using the <a href=\"https://github.com/awslabs/agent-plugins/tree/main/plugins/sagemaker-ai\">sagemaker-ai agent plugin</a>. SageMaker AI model customization skills are also available and pre-installed in SageMaker Studio Notebooks, along with the Kiro coding agent. All you need to do is just sign up for Kiro subscription, open the chat window in Studio Notebooks and start chatting with the agent to build the workflow. The experience supports advanced customization techniques including supervised fine-tuning for instruction tuning, direct Preference Optimization for adjusting tone and preference selections, and Reinforcement Learning for use cases with verifiable correctness.<br /> <br /> To learn more about model customization with the AI agent experience in Amazon SageMaker AI, visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">SageMaker model customization documentation</a>.</p>"
  "f42432b2998c46df377f6974d7fc8c27":
    "id": "f42432b2998c46df377f6974d7fc8c27"
    "title": "AWS Entity Resolution launches support for incremental Machine Learning based matching workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-entity-resolution-ml/"
    "published": "2026-05-05 02:43:00"
    "fetched": "2026-05-05 04:23:49"
    "summary": "<p>AWS Entity Resolution launches support for Machine Learning (ML) based Incremental Matching workflows in General Availability, fundamentally transforming how enterprises process entity resolution at scale. Previously, adding even a single new record required customers to reprocess their entire dataset—a process that could take up to 2 days and cost thousands of dollars. This created a critical bottleneck that forced major businesses to seek costly workarounds or alternative solutions.&nbsp;</p> \n<p>With this enhancement, AWS Entity Resolution enables businesses to process only the new records added since their last workflow run.&nbsp;This launch provides dramatic efficiency gains: processing 1M incremental records in less than 1 hour which is a 95% reduction in processing time compared to current workloads , while also significantly reducing infrastructure costs. The feature supports incremental workloads up to 50M incremental records over datasets containing up to 1 billion historical base records, making AWS Entity Resolution viable for continuous, large-scale enterprise workloads that were previously economically unfeasible.</p> \n<p>You can start using incremental ML workflows in all&nbsp;<a href=\"https://aws.amazon.com/entity-resolution/faqs/\">AWS Regions</a>&nbsp;where AWS Entity Resolution is available. For more information on starting an incremental ML workflow, see our <a href=\"https://docs.aws.amazon.com/entityresolution/latest/userguide/create-matching-workflow-ml.html\">user guide</a>. For more information about AWS Entity Resolution, visit our&nbsp;<a href=\"https://aws.amazon.com/entity-resolution/\">product page</a>.&nbsp;</p>"
  "cfa86ae163e13299ea7bd417a0459944":
    "id": "cfa86ae163e13299ea7bd417a0459944"
    "title": "Amazon Quick generates dashboards from natural language prompts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-generates-analyses-from-natural-language-prompts/"
    "published": "2026-05-05 02:00:00"
    "fetched": "2026-05-05 04:23:49"
    "summary": "<p>Amazon Quick now generates dashboards from natural language prompts with Generate Analysis. You describe the dashboard you want, select up to three datasets, and review an editable plan before generation. Amazon Quick then produces organized sheets with visuals selected for your data, filter controls for exploring by different dimensions, and calculated fields such as year-over-year growth and month-over-month comparisons.. Generate Analysis reduces dashboard creation from hours of manual configuration to minutes.</p> \n<p>With Generate Analysis, you can describe goals such as \"create a sales performance dashboard with revenue trends, regional comparisons, and month-over-month growth\" and receive a dashboard ready for refinement. The output works with existing publishing workflows, embedding, CI/CD pipelines, and point-and-click editing.</p> \n<p>At launch, Generate Analysis is available to Enterprise subscription/Author Pro users. Authors also have promotional access to this capability through December 2026 as part of Amazon Quick Enterprise, provided their organization has not restricted access. Generate Analysis is now generally available in all AWS Regions&nbsp;<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\" style=\"background-color: rgb(255, 255, 255);\">where Amazon Quick is available</a>.</p> \n<p>To learn more, see&nbsp;<a href=\"https://docs.aws.amazon.com/quick/latest/userguide/generating-an-analysis.html\">Generating an analysis with natural language prompts</a>&nbsp;in the Amazon Quick User Guide. To get started, open any dataset in Amazon Quick and choose Generate analysis.</p>"
  "181ad84ea73f3b2e62328146cd161881":
    "id": "181ad84ea73f3b2e62328146cd161881"
    "title": "Amazon Quick introduces Dataset Q&A for conversational analytics against enterprise data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-dataset-qa/"
    "published": "2026-05-05 01:55:00"
    "fetched": "2026-05-05 04:23:49"
    "summary": "<p>Amazon Quick now supports Dataset Q&amp;A — a conversational analytics capability that enables users to ask natural language questions directly against their enterprise data. Alongside Dashboard Q&amp;A, Dataset Q&amp;A provides a powerful new way to interact with data in Amazon Quick — letting anyone with dataset access explore their data and get meaningful, actionable insights using natural language, while respecting all governance rules including Row Level and Column Level Security policies set by data owners..</p> \n<p>Dataset Q&amp;A is powered by Amazon Quick's text-to-SQL agent, which interprets user questions, identifies the right data, and generates precise SQL — all in a single conversational step. The agent works across various data sources users bring into Amazon Quick — generating engine- and dialect-aware optimized SQL against SPICE or AWS data assets such as Amazon Redshift, Amazon Athena, Aurora PostgreSQL, and Apache Iceberg tables stored in Amazon S3 table buckets. Data owners can enrich their datasets with custom instructions, business definitions, and field descriptions directly in Amazon Quick or through simple file uploads. These curated semantics, together with dataset metadata, are ingested into a knowledge graph that captures the meaning and relationships across data assets, enabling Quick's orchestrator to accurately identify the most relevant datasets and generate the accurate SQL. The Dataset Q&amp;A agent delivers accurate answers across a broad range of question types — from trend analysis and time-series comparisons to ranking, multi-condition analytical queries, and open-ended exploratory questions. Dataset Q&amp;A also includes an Explain capability, allowing users to step through the reasoning behind each answer, inspect the underlying logic, and validate that the generated SQL correctly interprets their question before acting on the result.</p> \n<p>Dataset Q&amp;A is now generally available in all AWS Regions <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\">where Amazon Quick is available</a>. To get started, see this <a class=\"clutterFree_existingDuplicate clutterFree_noIcon cf_div_theme_dark\" href=\"https://aws.amazon.com/blogs/machine-learning/introducing-dataset-qa-expanding-natural-language-querying-for-structured-datasets-in-amazon-quick/\">blog post</a>.</p>"
  "136fc74d31eb26486fbdcf96410d5ae8":
    "id": "136fc74d31eb26486fbdcf96410d5ae8"
    "title": "Amazon Quick upgrades the extension for Microsoft Outlook (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-quick-microsoft-outlook/"
    "published": "2026-05-05 00:27:00"
    "fetched": "2026-05-05 04:23:49"
    "summary": "<p>Today, AWS announces the preview of the Amazon Quick extension for Microsoft Outlook, which brings generative AI-powered productivity directly into your email and calendar workflows. With the extension, you can use natural language to summarize unread messages, organize your inbox, schedule meetings, and draft in-line responses all without leaving Outlook.</p> \n<p>The Quick extension for Outlook helps you focus on what matters most by prioritizing emails, searching for specific discussions, and organizing messages into folders or flagging them for follow-up. Using conversational instructions, you can find optimal meeting times with coworkers and schedule meetings. For email threads, you can generate summaries, extract action items, and draft contextual replies that pull in relevant information from your Amazon Quick spaces and knowledge bases. You can also trigger actions in external applications using your configured integrations directly from Outlook.</p> \n<p>The Amazon Quick extension for Microsoft Outlook is available in preview in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (London).</p> \n<p>To get started with Amazon Quick, visit the <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">Quick website</a>, and <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" target=\"_blank\">sign up for an account</a> in minutes. Read the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/outlook-extension-preview-guide.html\" target=\"_blank\">documentation</a> to learn more, and install the Quick extension for Outlook from the <a href=\"https://aws.amazon.com/quick/download/\" target=\"_blank\">Quick download page</a>.</p>"
"last_updated": "2026-05-05 04:23:49 JST"
