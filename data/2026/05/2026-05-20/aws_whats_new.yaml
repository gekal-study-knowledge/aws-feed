  "9ec7bcfc9c1984997384d55fe230b181":
    "id": "9ec7bcfc9c1984997384d55fe230b181"
    "title": "Amazon Inspector is now available in the AWS Asia Pacific (Taipei) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-inspector-taipei/"
    "published": "2026-05-20 02:00:00"
    "fetched": "2026-05-20 03:57:27"
    "summary": "<p>Today, AWS announces the availability of Amazon Inspector in the AWS Asia Pacific (Taipei) Region. Amazon Inspector is an automated vulnerability management service that continually scans AWS workloads including Amazon EC2 instances, container images, and AWS Lambda functions for software vulnerabilities and unintended network exposure across your AWS Organization.&nbsp;<br /> <br /> With this expansion, Amazon Inspector extends its security coverage to AWS Asia Pacific (Taipei) Region, designed to help customers automatically discover workloads, conduct continuous vulnerability assessments, and receive actionable security findings. The service is designed to detect newly launched Amazon EC2 instances, Lambda functions, and eligible container images pushed to Amazon Elastic Container Registry (ECR) and scan them for software vulnerabilities and unintended network exposure.<br /> <br /> All accounts new to Amazon Inspector are eligible for a 15-day free trial to evaluate the service and estimate its cost. During the trial, all eligible Amazon EC2 instances, AWS Lambda functions, and container images pushed to Amazon ECR are continually scanned at no cost. After the trial period, you will be charged based on public pricing for Amazon Inspector. Visit the Amazon Inspector <a href=\"https://aws.amazon.com/inspector/pricing/\">pricing page</a> for more details.<br /> <br /> To get started with <a href=\"https://aws.amazon.com/inspector/\">Amazon Inspector</a> visit our documentation or begin your <a href=\"https://aws.amazon.com/inspector/pricing/\">free trial today</a>.</p>"
  "9d6507878aff7aa47538e20e8f83f7f5":
    "id": "9d6507878aff7aa47538e20e8f83f7f5"
    "title": "Amazon MWAA now supports Apache Airflow 3.2"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-mwaa-now-supports-apache-airflow-3-2/"
    "published": "2026-05-20 05:00:00"
    "fetched": "2026-05-20 07:12:34"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) now supports Apache Airflow version 3.2, the latest major release of the popular open-source workflow orchestration framework. Amazon MWAA is a managed service that lets you run Apache Airflow at scale without managing the underlying infrastructure. This release brings new data-aware scheduling capabilities and developer productivity improvements to teams building and operating data pipelines on AWS.</p> \n<p>With Apache Airflow 3.2, you can now use asset partitioning to trigger downstream DAGs based on specific slices of data, such as a date-partitioned S3 path, rather than an entire asset, giving data engineering teams more precise control over pipeline execution. This release also expands Human-in-the-Loop (HITL) capabilities with a full audit history view for approvals, HITL support for the AgenticOperator, and synchronous callback support for Deadline Alerts. Additional improvements include Grid View virtualization for faster rendering of large DAGs, full XCom management from the Airflow UI, and async callable support in PythonOperator..</p> \n<p>You can launch a new Apache Airflow 3.2 environment on Amazon MWAA, or upgrade from 2.11 or later, with just a few clicks in the&nbsp;<a href=\"https://console.aws.amazon.com/mwaa/home\">AWS Management Console</a>&nbsp;in all currently supported&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon MWAA regions</a>. To learn more about Apache Airflow 3.2 visit the&nbsp;<a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html\">Amazon MWAA documentation</a>, and the&nbsp;<a href=\"https://airflow.apache.org/docs/apache-airflow/stable/release_notes.html#airflow-3-2-0-2026-04-07\">Apache Airflow 3.2 change log</a>&nbsp;in the Apache Airflow documentation.<br /> <br /> <i>Apache, Apache Airflow, and Airflow are either registered trademarks or trademarks of the&nbsp;<a href=\"https://www.apache.org/\">Apache Software Foundation</a>&nbsp;in the United States and/or other countries.</i></p>"
  "bba6d42efe96c799c4193fc5178a857d":
    "id": "bba6d42efe96c799c4193fc5178a857d"
    "title": "Amazon ECS introduces pause and continue controls for service deployments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-ecs-pause-continue-deployments/"
    "published": "2026-05-20 02:00:00"
    "fetched": "2026-05-20 07:12:34"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now enables you to pause service deployments at critical stages during deployment progression and continue deployments when ready. You can use these pause points to introduce manual decision points and interactive controls into your deployments for scenarios such as manual approval workflows, operational checks, integration tests, or custom automation, while continuing to use native Amazon ECS deployment strategies with managed traffic shifting, bake times, fast rollbacks, CloudWatch alarms, and deployment circuit breaker.</p> \n<p>With this launch, you can configure a new PAUSE deployment lifecycle hook as part of your Amazon ECS service deployment configuration. When a deployment reaches a configured pause point, Amazon ECS pauses deployment progression and emits Amazon EventBridge events that you can use to trigger automation workflows, approval systems, or external validation processes. You can then continue or roll back the deployment using the new ContinueServiceDeployment API. With pause hooks, you can configure timeout durations up to 14 days and timeout actions to automatically continue or roll back the deployment if no action is received.</p> \n<p>You can configure pause hooks for rolling, blue/green, linear, and canary deployment strategies using the Amazon ECS Console, AWS CLI, AWS SDKs, AWS CloudFormation, AWS CDK, and Terraform. You can use the ContinueServiceDeployment API through the Amazon ECS Console, AWS CLI, and AWS SDKs. This feature is available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Regions</a>. To learn more, see our documentation on <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/pause-lifecycle-hooks.html\" target=\"_blank\">pause hooks for service deployments</a> and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/continue-service-deployment.html\" target=\"_blank\">continuing service deployments</a>.</p>"
  "71be6f1158d32e64e048a4dafc182dc1":
    "id": "71be6f1158d32e64e048a4dafc182dc1"
    "title": "Amazon Managed Grafana now supports dual-stack connectivity (IPv6 and IPv4)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-managed-grafana-ipv6/"
    "published": "2026-05-20 00:00:00"
    "fetched": "2026-05-20 07:12:34"
    "summary": "<p>Amazon Managed Grafana now supports dual-stack connectivity, enabling workspaces to communicate over both Internet Protocol version 4 (IPv4) and Internet Protocol version 6 (IPv6). Dual-stack mode is available for&nbsp;workspaces&nbsp;running Grafana version 10.4 or later.</p> \n<p>With dual-stack support, customers can simplify their network stack by&nbsp;eliminating&nbsp;the need to manage overlapping address spaces in their VPCs. Customers migrating to IPv6 can connect to their Grafana workspaces over IPv6 while maintaining IPv4 compatibility, and those not yet on IPv6 can continue using IPv4-only connections. This is especially beneficial as the continued growth of the internet exhausts&nbsp;available&nbsp;IPv4 addresses.&nbsp;</p> \n<p>Support for&nbsp;dual-stack connectivity&nbsp;on Amazon Managed Grafana is available in all&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">regions</a>&nbsp;where the service is&nbsp;generally available.&nbsp;To get started, update your workspace configuration via the Amazon Managed Grafana console, API, or CLI. For more information, see&nbsp;the&nbsp;<a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/AMG-configure-workspace.html\">Amazon Managed Grafana User Guide</a>.&nbsp;To learn more about best practices for configuring IPv6 in your environment, visit the whitepaper on&nbsp;<a href=\"https://docs.aws.amazon.com/whitepapers/latest/ipv6-on-aws/internet-protocol-version-6.html\">IPv6 in AWS</a>.</p>"
  "4a71d7ea23830e69dbd434ba610f5293":
    "id": "4a71d7ea23830e69dbd434ba610f5293"
    "title": "Amazon SageMaker HyperPod now supports data capture for inference workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-hyperpod-data-capture"
    "published": "2026-05-20 10:08:00"
    "fetched": "2026-05-20 14:00:57"
    "summary": "<p>Amazon SageMaker HyperPod now supports data capture for inference workloads, enabling customers to record inference request and response payloads for model monitoring, compliance, debugging, and offline analysis. Organizations deploying generative AI and machine learning models on HyperPod need systematic visibility into the inputs flowing into their models and the outputs returned to clients to detect model drift, satisfy regulatory audit requirements, debug production issues, and build ground-truth datasets for fine-tuning. Previously, customers had to either accept limited operational visibility into their inference workloads or build expensive custom logging pipelines outside the HyperPod Inference Operator.<br /> <br /> With data capture, you can choose to record inference traffic at the SageMaker endpoint, at the load balancer, or at the model pod, depending on the level of visibility you need, and combine these options for layered observability. Captured data is delivered asynchronously to your Amazon S3 bucket and supports configurable sampling and encryption with customer-managed AWS KMS keys, so you can balance coverage with cost while keeping sensitive data protected. Data capture is designed to never block inference, ensuring production availability is preserved. You can enable data capture by configuring it on your inference endpoint when deploying models through the HyperPod Inference Operator or with SageMaker JumpStart.<br /> <br /> This feature is available for SageMaker HyperPod clusters using the EKS orchestrator in all AWS Regions where Amazon SageMaker HyperPod is supported. To learn more, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-data-capture.html\">Data capture for inference on HyperPod</a>.</p>"
