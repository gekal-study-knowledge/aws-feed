    "title": "Amazon Inspector is now available in the AWS Asia Pacific (Taipei) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-inspector-taipei/"
    "published": "2026-05-20 02:00:00"
    "fetched": "2026-05-20 03:57:27"
    "summary": "<p>Today, AWS announces the availability of Amazon Inspector in the AWS Asia Pacific (Taipei) Region. Amazon Inspector is an automated vulnerability management service that continually scans AWS workloads including Amazon EC2 instances, container images, and AWS Lambda functions for software vulnerabilities and unintended network exposure across your AWS Organization.&nbsp;<br /> <br /> With this expansion, Amazon Inspector extends its security coverage to AWS Asia Pacific (Taipei) Region, designed to help customers automatically discover workloads, conduct continuous vulnerability assessments, and receive actionable security findings. The service is designed to detect newly launched Amazon EC2 instances, Lambda functions, and eligible container images pushed to Amazon Elastic Container Registry (ECR) and scan them for software vulnerabilities and unintended network exposure.<br /> <br /> All accounts new to Amazon Inspector are eligible for a 15-day free trial to evaluate the service and estimate its cost. During the trial, all eligible Amazon EC2 instances, AWS Lambda functions, and container images pushed to Amazon ECR are continually scanned at no cost. After the trial period, you will be charged based on public pricing for Amazon Inspector. Visit the Amazon Inspector <a href=\"https://aws.amazon.com/inspector/pricing/\">pricing page</a> for more details.<br /> <br /> To get started with <a href=\"https://aws.amazon.com/inspector/\">Amazon Inspector</a> visit our documentation or begin your <a href=\"https://aws.amazon.com/inspector/pricing/\">free trial today</a>.</p>"
"last_updated": "2026-05-20 03:57:27 JST"
