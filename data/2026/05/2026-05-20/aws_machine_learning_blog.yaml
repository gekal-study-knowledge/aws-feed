    "title": "Scalable voice agent design with Amazon Nova Sonic: multi-agent, tools, and session segmentation"
    "link": "https://aws.amazon.com/blogs/machine-learning/scalable-voice-agent-design-with-amazon-nova-sonic-multi-agent-tools-and-session-segmentation/"
    "published": "2026-05-20 00:26:37"
    "fetched": "2026-05-20 01:15:39"
    "summary": "In this post, you’ll learn how to use Amazon Nova Sonic, Amazon Bedrock AgentCore, and Strands BidiAgent to build scalable, maintainable voice agents that handle these challenges efficiently, resulting in more responsive and intelligent customer interactions. We’ll explore three popular architectural patterns for voice agents, highlighting their trade-offs and best practices for minimizing latency."
  "8d389dcdea79db595fd1eef01d13e057":
    "id": "8d389dcdea79db595fd1eef01d13e057"
    "title": "Extending conversational memory in Kiro CLI using Amazon Bedrock AgentCore Memory"
    "link": "https://aws.amazon.com/blogs/machine-learning/extending-conversational-memory-in-kiro-cli-using-amazon-bedrock-agentcore-memory/"
    "published": "2026-05-20 00:23:22"
    "fetched": "2026-05-20 01:15:39"
    "summary": "In this post, we demonstrate how you can extend the conversational memory of Kiro CLI by implementing a custom Model Context Protocol (MCP) server that integrates with Amazon Bedrock AgentCore Memory. You can use Kiro CLI to interact with AI agents of Kiro directly from your terminal. Amazon Bedrock AgentCore Memory is a fully managed service that allows AI agents to retain information from past interactions, creating more intelligent and context-aware conversations. By implementing a custom MCP server, you can provide Kiro CLI with tools to store and retrieve conversation context, monitor memory usage, and manage the underlying Bedrock Agent Core Memory infrastructure."
