    "title": "Accelerate ML feature pipelines with new capabilities in Amazon SageMaker Feature Store"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerate-ml-feature-pipelines-with-new-capabilities-in-amazon-sagemaker-feature-store/"
    "published": "2026-05-20 00:20:33"
    "fetched": "2026-05-20 01:15:39"
    "summary": "Today, we’re announcing three new capabilities available in SageMaker Python SDK v3.8.0. In this post, we walk through each capability with code examples you can use to get started. For complete end-to-end walkthroughs, see the accompanying notebooks for Lake Formation governance and Iceberg table properties in the SageMaker Python SDK repository."
