  "3b7cde7b3f2f37bdf06ec2c8e4e8a412":
    "id": "3b7cde7b3f2f37bdf06ec2c8e4e8a412"
    "title": "How Synthesia optimizes generative AI video inference on Amazon EC2 G7e instances"
    "link": "https://aws.amazon.com/blogs/architecture/how-synthesia-optimizes-generative-ai-video-inference-on-amazon-ec2-g7e-instances/"
    "published": "2026-05-20 00:06:40"
    "fetched": "2026-05-20 01:15:38"
    "summary": "This post introduces a video decoding optimization technique that we have ideated in collaboration with Synthesia Research Engineering team, which we call Asynchronous Frame Generation Pipeline. Adopting this technique allows you to overlap GPU compute, device-to-host (D2H) data transfer, and host-side post-processing. In this post, we apply this technique to the VAE decoder of a Wan video generation model as an example, where our benchmarks on G7e show increased GPU kernel utilization from 82% to 99.9%, in turn leading to an 8.2% decrease in latency (and increase in throughput) for video decoding. We expect this technique to benefit any customer with a chunked video generation pipeline that transfers frames to host memory."
