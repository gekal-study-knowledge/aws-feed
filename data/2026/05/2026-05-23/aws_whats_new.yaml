"entries":
  "b5eb66ff277bf852c4c1c84393880d17":
    "id": "b5eb66ff277bf852c4c1c84393880d17"
    "title": "Amazon WorkSpaces Personal now supports WorkSpace Migration for Linux WorkSpaces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/workspaces-linux-migration"
    "published": "2026-05-23 01:24:00"
    "fetched": "2026-05-23 02:05:39"
    "summary": "<p>Amazon WorkSpaces now supports the WorkSpace Migration feature for all Linux operating systems that Amazon WorkSpaces offers. This allows customers to seamlessly migrate WorkSpaces from one Linux operating system to another, automating the process to migrate to newer operating system versions or to move from one Linux operating system to another.<br /> <br /> When customers migrate their WorkSpaces from one operating system to another, the user data on a Linux WorkSpace’s home directory is now automatically moved to the new WorkSpace. Customers can seamlessly migrate WorkSpaces without having to manually copy data between WorkSpaces. This streamlines the process to upgrade Linux WorkSpaces to take advantage of the latest Linux operating systems without disrupting end users with manual migration steps.<br /> <br /> The WorkSpace Migration feature is now supported for all Linux operating systems in AWS commercial and AWS GovCloud (US) Regions where Amazon WorkSpaces Personal is supported. For more information, see the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/migrate-linux-workspaces.html\">Migrate a Linux WorkSpace section</a> in the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html\">Amazon WorkSpaces Administration Guide</a>.</p>"
  "1769aa3c75b6adaabae9c3f479ae6845":
    "id": "1769aa3c75b6adaabae9c3f479ae6845"
    "title": "Amazon SageMaker adds business metadata and governance in IAM-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/sagemaker-catalog-iam-domains/"
    "published": "2026-05-23 03:24:00"
    "fetched": "2026-05-23 04:39:39"
    "summary": "<p><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">Amazon SageMaker Unified Studio</a> now supports business context, metadata and data governance capabilities in IAM-based domains. With this launch, customers using Amazon SageMaker IAM-based domains can add business context to their AWS Glue Data Catalog tables, including business names, descriptions, and README documentation. They can use AI-generated metadata to produce business names and descriptions automatically, reducing the effort of cataloging large numbers of tables. Customers can also create business glossaries so that teams across the organization use consistent definitions for terms like \"ARR\" or \"churn rate,\" and define metadata form templates to capture structured attributes such as data classification, retention policies, or ownership details.</p> \n<p>With this business context in place, data engineers, analysts, and data scientists can search for and discover tables across the entire domain, filter results by glossary terms and metadata form fields, and request access through subscriptions. After an administrator approves the request, SageMaker Unified Studio automatically grants the necessary AWS Lake Formation permissions to the project. Administrators can also grant access to tables directly from within SageMaker Unified Studio without waiting for a request.</p> \n<p>Amazon SageMaker Unified Studio business context, metadata, and governance capabilities in IAM-based domains are available in all AWS Regions where SageMaker Unified Studio is <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">supported</a>. To learn more, visit the Amazon SageMaker Unified Studio <a href=\"https://preview.docs.aws.dev/preview/utmittal/SEA/AWSMaxdomeDocs/utkarsh-m2-catalog-branch/sagemaker-unified-studio/latest/userguide/catalog-iam-based-domains.html\">documentation</a>.</p>"
  "a355057087cba5a4f6eb4407a1d80037":
    "id": "a355057087cba5a4f6eb4407a1d80037"
    "title": "AWS Security Agent adds verification scripts for pentest findings"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-security-agent/"
    "published": "2026-05-23 02:21:00"
    "fetched": "2026-05-23 04:39:39"
    "summary": "<p><a href=\"https://aws.amazon.com/security-agent/\">AWS Security Agent</a> now generates verification scripts for penetration test findings, enabling security teams to independently reproduce and validate discovered vulnerabilities.<br /> <br /> Previously, teams manually followed reproduction steps from finding details. Now, AWS Security Agent automatically generates ready-to-run scripts for each confirmed finding. Teams download the script, configure environment variables, and execute it against their target system to verify the vulnerability, streamlining triage and accelerating remediation.<br /> <br /> Verification scripts include setup instructions, documented environment variables, and redacted sensitive values. Available in all AWS Regions where AWS Security Agent is supported.<br /> <br /> To get started, run a penetration test, navigate to findings, and expand the Verification Script section. To learn more, see <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/review-penetration-findings.html\">Review findings</a> from a penetration test in the AWS Security Agent User Guide.</p>"
  "094c3201fafdd0f30b98b2617459691b":
    "id": "094c3201fafdd0f30b98b2617459691b"
    "title": "Amazon Keyspaces (for Apache Cassandra) expands to Asia Pacific (Malaysia) and Asia Pacific (Thailand) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-keyspaces-malaysia-thailand/"
    "published": "2026-05-23 01:00:00"
    "fetched": "2026-05-23 04:39:39"
    "summary": "<p><a href=\"https://aws.amazon.com/keyspaces/\">Amazon Keyspaces (for Apache Cassandra)</a> is now available in the Asia Pacific (Malaysia) and Asia Pacific (Thailand) Regions, allowing customers in Asia Pacific Region to build Cassandra-compatible applications with lower latency while keeping their data within the Region to meet data residency requirements.<br /> &nbsp;&nbsp;<br /> Amazon Keyspaces (for Apache Cassandra) is a scalable, highly available, and managed Apache Cassandra–compatible database service. Amazon Keyspaces is serverless, so you pay for only the resources that you use and you can build applications that serve thousands of requests per second with virtually unlimited throughput and storage.<br /> &nbsp;&nbsp;<br /> The Asia Pacific (Malaysia) and Asia Pacific (Thailand) Regions provide the same Amazon Keyspaces features available in other AWS Regions, including point-in-time recovery, Multi-Region replication, CDC streams, and IPv6 support. This regional expansion enables organizations in Asia Pacific to build highly scalable, low-latency applications using familiar Cassandra Query Language (CQL) without the operational burden of managing Cassandra clusters.</p> \n<p>To learn more about Keyspaces, visit the <a href=\"https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html\">Amazon Keyspaces documentation</a>.</p>"
  "4c05d1d3bb59d2e7fbc67ee85b980805":
    "id": "4c05d1d3bb59d2e7fbc67ee85b980805"
    "title": "Amazon SageMaker expands domain management across domain types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/domain-management-iam-idc/"
    "published": "2026-05-23 04:30:00"
    "fetched": "2026-05-23 06:06:45"
    "summary": "<p>Amazon SageMaker Unified Studio now provides domain management experience for Identity Center and IAM-based domains outside of AWS console, allows administrators and data management teams to create and manage projects, configure workforce identity, manage users and permissions, and set networking properties for projects. Previously, this was only available for IAM based domains.<br /> <br /> With this launch, administrators of Identity Center-based domains can access domain management capabilities in SageMaker Unified Studio portal to create projects with configurable execution roles that define which AWS analytics, AI, and ML services the project can access. VPC configuration is consistent across both domain types, inherited by all projects, and can be edited to change the VPC, subnets, or security group. Administrators can also manage associated accounts, enabling users to publish and consume data from other AWS accounts within SageMaker Unified Studio.<br /> <br /> These features are available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">AWS Regions where Amazon SageMaker Unified Studio</a> is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/access-domain-admin-portal-idc.html\">Domain administration for Identity Center-based domains</a>.&nbsp;</p>"
  "38701a246e7f031aad3fbea5f53c7558":
    "id": "38701a246e7f031aad3fbea5f53c7558"
    "title": "New agentic migration assessment capabilities now available with AWS Transform"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/assessment-capabilities-transform"
    "published": "2026-05-23 03:58:00"
    "fetched": "2026-05-23 06:06:45"
    "summary": "<p>AWS Transform now offers advanced migration assessment capabilities including what-if scenarios, customizable assumptions, flexible file format support, and multiple new total cost of ownership (TCO) assessment features. These latest features let you quickly build a migration business case and accelerate your migration decisions.<br /> <br /> You can start your migration assessment with whatever data you have including RVTools exports, CMDB data, exports from the AWS Transform discovery tool, and a wide variety of third-party discovery tools. Create what-if scenarios for your migrations with customized assumptions including region, resource utilization, and service mapping. You can also compare scenarios and find the best path for your AWS migration. This latest release lets you include multiple analyses in your what-if scenarios including cost modelling of EC2, FSx, S3, SQL Server on EC2, and virtual desktops. On top of this, you can enhance your assessment with the inclusion of additional pillars of the <a href=\"https://aws.amazon.com/executive-insights/content/business-value-on-aws/\">Cloud Value Framework</a> such as staff productivity, operational resilience, business agility, and sustainability.<br /> <br /> Now you can build a comprehensive assessment for migrating to AWS faster than ever before and start your migration with the confidence of having an optimized TCO.<br /> <br /> AWS Transform migration assessments are available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\">AWS Transform is offered</a>. Learn more here on the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html\">user guide</a>.&nbsp;</p>"
  "decaca5f264aa1cd01d5b12497b3b042":
    "id": "decaca5f264aa1cd01d5b12497b3b042"
    "title": "Amazon SageMaker Unified Studio adds interactive interface for managing Feature Store in IAM Domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/sagemaker-feature-store/"
    "published": "2026-05-23 05:07:00"
    "fetched": "2026-05-27 04:16:25"
    "summary": "<p>Amazon SageMaker Unified Studio IAM domains now includes an interactive interface for creating and managing feature groups in SageMaker Feature Store, eliminating the need to write code for common feature management tasks. This launch makes feature management accessible to data scientists, ML engineers, and business analysts from a single collaborative environment.</p> \n<p>Features are the inputs to ML models used during training and inference. For example, a music recommendation app might use features like song ratings, listening duration, and listener demographics to personalize which songs are suggested to each user. With this interactive interface for creating and managing features, you can now discover and search existing features, create and modify feature groups, view definitions and schemas, monitor data ingestion status - all without writing API calls. Features created elsewhere appear immediately in SageMaker Unified Studio when sharing the same IAM role, ensuring seamless workflows across your ML development lifecycle.</p> \n<p>To learn more about using the interactive interface for creating and managing features in SageMaker Unified Studio, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/feature-store.html\">Amazon SageMaker Unifed Studio User Guide.</a></p>"
  "35f7c0755b3fcdfde1e3b3d6dd1aeba1":
    "id": "35f7c0755b3fcdfde1e3b3d6dd1aeba1"
    "title": "Amazon GameLift Streams launches Generation 6e stream classes for high-fidelity game streaming"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/04/amazon-gamelift-streams-g6e-stream-class/"
    "published": "2026-05-23 01:39:00"
    "fetched": "2026-05-27 04:16:25"
    "summary": "<p>Today, Amazon GameLift Streams launched Generation 6e (G6e) stream classes, providing enhanced GPU performance for streaming high-fidelity, graphically demanding games and applications. The new G6e stream classes are powered by EC2 G6e instances featuring NVIDIA L40S Tensor Core GPUs and 3rd generation AMD EPYC processors, delivering 2x the GPU memory and up to 2.9x faster GPU memory bandwidth compared to standard Generation 6 stream classes.</p> \n<p>The two new G6e stream classes -- gen6e_pro and gen6e_pro_win2022 -- are designed for customers who need maximum GPU performance for AAA-quality game streaming or GPU-intensive applications. These classes provide a full dedicated NVIDIA L40S GPU with 48 GB of GPU memory, making them ideal for streaming experiences that require high frame rates at high resolutions.</p> \n<p>Generation 6e stream classes are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Stockholm), and Asia Pacific (Tokyo, Seoul).</p> \n<p>To learn more and get started, visit:&nbsp;</p> \n<ul> \n <li><p>AWS Docs: Configuration options - Stream classes&nbsp;<br /> https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/configuration-options.html#configuration-options-stream-classes</p> </li> \n</ul> \n<ul> \n <li><p>API Reference Guide: CreateStreamGroup&nbsp;<br /> https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamGroup.html</p> </li> \n</ul>"
"last_updated": "2026-05-27 04:16:25 JST"
