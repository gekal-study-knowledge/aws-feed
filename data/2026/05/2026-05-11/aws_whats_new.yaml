    "title": "AWS Transform adds containerization capability during migrations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-transform-containerization/"
    "published": "2026-05-11 17:22:00"
    "fetched": "2026-05-12 03:55:06"
    "summary": "<p>AWS Transform now supports replatforming applications to containers during migration to AWS. This release extends AWS Transform's agentic AI capabilities to automate the containerization of your source code, enabling you to migrate and modernize in parallel, reducing the time and complexity of moving from on-premises to cloud-native architectures. Migration teams can containerize source code from GitHub, Bitbucket, GitLab, or .zip files, generate Docker images, publish to <a href=\"https://aws.amazon.com/ecr/\">Amazon Elastic Container Registry (Amazon ECR)</a>, and deploy to <a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service (Amazon ECS</a>) or <a href=\"https://aws.amazon.com/eks/\">Amazon Elastic Kubernetes Service (Amazon EKS)</a>. This brings containerization into the same workflow your team uses to plan and execute rehost migrations.<br /> <br /> AWS Transform analyzes your source code repositories, generates Dockerfiles, and builds container images with integrated security scanning for common vulnerabilities and exposures (CVEs). It produces deployment-ready Terraform infrastructure-as-code and Helm charts for your target environment. The service supports monolithic repositories (monorepos) and multi-repo structures, private dependency resolution through AWS CodeArtifact, and containerization of thousands of applications at scale. During migration wave planning, you can assign applications to either a rehost or replatform-to-containers path, so you can move and realize the benefits of AWS faster.<br /> <br /> This new capability is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\">AWS Transform is offered</a>.</p> \n<p>To learn more, please visit the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-containers.html\">AWS Transform User Guide</a>.</p>"
  "209e3fb556b1abf8cb778fe7ff86e296":
    "id": "209e3fb556b1abf8cb778fe7ff86e296"
    "title": "Claude Platform on AWS is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/claude-platform-aws/"
    "published": "2026-05-11 23:00:00"
    "fetched": "2026-05-12 05:45:13"
    "summary": "<p>Today, AWS announced the general availability of Claude Platform on AWS, a new service that gives customers direct access to&nbsp;Anthropic's&nbsp;native Claude Platform experience through their existing AWS account.&nbsp;AWS is the first cloud provider to offer access to the native Claude Platform experience. Developers and organizations now have the choice to access&nbsp;Anthropic's&nbsp;native&nbsp;Claude&nbsp;Platform experience, including APIs, console, and early-access beta features, directly through their existing AWS account, without managing separate accounts, billing, or tracking.</p> \n<p>Claude Platform on AWS is&nbsp;operated&nbsp;by Anthropic, and customer data is processed outside the AWS security boundary.&nbsp;Claude Platform on AWS is designed for development teams and enterprises that want access to&nbsp;Anthropic's&nbsp;native Claude Platform development experience and do not have specific regional data residency requirements.&nbsp;Customers still use existing IAM credentials and access controls,&nbsp;consolidated&nbsp;AWS billing, and CloudTrail audit logging for full security visibility. Features available through Claude Platform on AWS include Claude Managed Agents (beta), advisor strategy (beta), web search, web fetch, code execution, files API (beta), Skills (beta), MCP connector (beta), prompt caching, citations, batch processing, and the Claude Console for prompt development and evaluation.&nbsp;</p> \n<p>Claude Platform on AWS is available in US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), South America (São Paulo), Europe (Dublin), Europe (London), Europe (Frankfurt), Europe (Milan), Europe (Zurich), Europe (Paris), Europe (Stockholm), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Parcific (Melborune), Asia, Pacific (Jakarta), Asia Pacific (Sydney), and Asia Pacific (Melbourne). To learn more, visit the <a href=\"https://aws.amazon.com/claude-platform/\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Platform on&nbsp;AWS&nbsp;product page.</a> To get started, see the Claude Platform on AWS <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/welcome.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation.</a></p>"
