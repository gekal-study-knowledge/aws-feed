    "summary": "Amazon Quick が Microsoft Outlook 拡張機能をアップグレード (プレビュー版), Amazon Quick が S3 Tables バケットをデータソースとしてサポート, Amazon Quick が Dataset Q&amp;A を導入し、エンタープライズデータに対する会話型分析を実現, Amazon Quick が自然言語プロンプトからダッシュボードを生成, Amazon Quick が New Relic との統合でオブザーバビリティ駆動型 AI エージェントに対応, Amazon WorkSpaces が AI エージェントによるデスクトップアプリケーションの操作に対応 (プレビュー), Amazon ElastiCache で Valkey 9.0 を発表, Agent Toolkit for AWS を発表 — AI コーディングエージェントが AWS 上で効果的に構築できるよう支援, AWS MCP Server の一般提供開始, Amazon Bedrock AgentCore Runtime が Amazon S3 Files と Amazon EFS からの Bring-Your-Own ファイルシステムをサポート, Amazon OpenSearch Service が VPC プライベート接続のための VPC egress オプションをサポート, Amazon Route 53 Global Resolver でanycast DNS 解決のための AWS リージョンの追加と削除が可能に"
