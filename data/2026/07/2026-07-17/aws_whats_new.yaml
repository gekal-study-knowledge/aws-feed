  "3f4738eff6fef9c6168cbd28cd29325c":
    "id": "3f4738eff6fef9c6168cbd28cd29325c"
    "title": "Amazon EC2 now surfaces the public SSM parameters associated with public AMIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ec2-pulic-images-ssm-parameters"
    "published": "2026-07-17 03:20:00"
    "fetched": "2026-07-17 04:59:58"
    "summary": "<p>Amazon EC2 now surfaces the AWS Systems Manager (SSM) Parameter Store parameters associated with public AMIs directly in the AMI metadata. When you describe a public AMI, the response includes the associated public SSM parameter,&nbsp;making it easy to discover and reference in your configurations.</p> \n<p>Previously, finding the SSM parameter associated with a public AMI required searching through SSM parameter namespaces manually. Now, when you describe a public AMI, the response includes the public SSM parameter it is associated with. This allows you to discover the SSM parameter for a public AMI easily and use it as an alias that always resolves to the latest version, simplifying AMI updates across your infrastructure.<br /> <br /> This capability is available to all customers at no additional cost in all AWS regions including AWS China (Beijing) Region, operated by Sinnet, and AWS China (Ningxia) Region, operated by NWCD, and AWS GovCloud (US) Regions. To learn more, please visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/finding-an-ami-parameter-store.html\">documentation</a>.</p>"
  "13c4d4ed5185ddc541d7f8ad1f7e44b5":
    "id": "13c4d4ed5185ddc541d7f8ad1f7e44b5"
    "title": "Amazon S3 Event Notifications now include system-generated tags"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-s3-event-notifications-system-generated-tags/"
    "published": "2026-07-17 03:00:00"
    "fetched": "2026-07-17 04:59:58"
    "summary": "<p>Amazon S3 Event Notifications now include system-generated tags in events delivered to all destinations including Amazon EventBridge, Amazon SQS, Amazon SNS, and AWS Lambda. System-generated tags are metadata labels attached to your bucket by AWS services. You can use these tags to filter events from thousands of buckets with a single EventBridge rule, instead of listing each bucket name individually.<br /> <br /> To get started, enable S3 Event Notifications on your general purpose buckets through the AWS Management Console, AWS SDK, or AWS CLI. If AWS services like AWS CloudFormation have already applied system-generated tags to your buckets, S3 automatically includes them in new event notifications. System-generated tags in S3 Event Notifications are available at no additional cost in all AWS Regions and require no changes to existing configurations. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-content-structure.html\">S3 Event Notifications documentation</a>.</p>"
  "577714557e930c892f12d40639876876":
    "id": "577714557e930c892f12d40639876876"
    "title": "Amazon EC2 High Memory U7in-24TB instances now available in AWS Europe (Paris) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-high-memory-europe/"
    "published": "2026-07-17 01:00:00"
    "fetched": "2026-07-17 04:59:58"
    "summary": "<p>Amazon EC2 High Memory U7in-24TB instances (u7in-24tb.224xlarge) are now available in AWS&nbsp;Europe (Paris) region. U7i instances are part of the AWS 7th generation and are powered by custom fourth-generation Intel Xeon Scalable processors (Sapphire Rapids). U7in-24TB instances offer 24 TiB of DDR5 memory, enabling customers to scale transaction processing throughput in a fast-growing data environment. U7i instances offer up to 45% better price performance over existing U-1 instances.</p> \n<p>U7in-24TB instances deliver 896 vCPUs and support up to 100 Gbps of Amazon EBS bandwidth for faster data loading and backups, 200 Gbps of network bandwidth, and ENA Express. U7i instances are ideal for customers running mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.</p> \n<p>To learn more about U7i instances, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High Memory instances page</a>.</p>"
  "25eb330cddc6525c4bae548536358ef5":
    "id": "25eb330cddc6525c4bae548536358ef5"
    "title": "PostgreSQL 19 Beta 2 is now available in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/postgresql-19-beta-2-amazon-rds-database-preview-environment/"
    "published": "2026-07-17 03:00:00"
    "fetched": "2026-07-17 06:11:19"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for PostgreSQL</a> 19 Beta 2 is now available in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of PostgreSQL 19 on Amazon RDS for PostgreSQL. You can deploy PostgreSQL 19 Beta 2 in the Amazon RDS Database Preview Environment that has the benefits of a fully managed database.<br /> <br /> PostgreSQL 19 introduces parallel autovacuum with configurable worker limits, so routine maintenance no longer bottlenecks large databases. The new REPACK CONCURRENTLY command rebuilds tables and reclaims storage online, keeping production databases accessible without third-party extensions. Native SQL Property Graph Queries (SQL/PGQ) let you express relationship traversals directly in standard SQL, eliminating separate application logic. Logical replication now synchronizes sequence values automatically and can be enabled dynamically without a server restart, reducing planned downtime. Beta 2 adds bug fixes and stability improvements from the Beta 1 testing period, including refinements to parallel autovacuum worker coordination and REPACK CONCURRENTLY lock handling.&nbsp;Please refer to <a href=\"https://www.postgresql.org/about/news/postgresql-19-beta-2-released-3350/\" rel=\"noopener noreferrer\" target=\"_blank\">PostgreSQL community announcement</a> for more details.<br /> <br /> Amazon RDS Database Preview Environment database instances are retained for a maximum period of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots that are created in the preview environment can only be used to create or restore database instances within the preview environment. You can use the PostgreSQL dump and load functionality to import or export your databases from the preview environment.<br /> <br /> Amazon RDS Database Preview Environment database instances are priced as per the <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing</a> in the US East (Ohio) Region.</p>"
  "fb104a1e74da5efb7153a45170aa2d44":
    "id": "fb104a1e74da5efb7153a45170aa2d44"
    "title": "AWS Sustainability service now includes water withdrawals data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-sustainability-water-withdrawals/"
    "published": "2026-07-17 01:43:00"
    "fetched": "2026-07-17 06:11:19"
    "summary": "<p>Customers can now view annual water withdrawals data associated with their AWS workloads in AWS Sustainability, alongside existing carbon emissions data. This enhancement helps organizations gain comprehensive visibility into their environmental impact across carbon and water.</p> \n<p>Water withdrawals data is available by AWS Region, service, and AWS account on an annual basis through the AWS Sustainability console and API. The data represents the total volume of water withdrawn for data center operations, with efficiency improvements reflected as lower withdrawal volumes.</p> \n<p>AWS Sustainability water withdrawals data is available at no additional charge in all AWS Regions where the service is available.</p> \n<p>To get started visit the&nbsp;<a href=\"https://docs.aws.amazon.com/sustainability/latest/userguide/what-is-sustainability.html\">AWS Sustainability user guide</a>.&nbsp;For more information, see the&nbsp;<a href=\"https://aws.amazon.com/sustainability/tools/console/\">AWS Sustainability console</a> page.</p>"
  "e6e7b88d3e14a64065a11ac76ad8bdff":
    "id": "e6e7b88d3e14a64065a11ac76ad8bdff"
    "title": "Amazon Managed Grafana achieves FedRAMP High authorization in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-grafana-fedramp-high/"
    "published": "2026-07-17 04:31:00"
    "fetched": "2026-07-17 07:53:57"
    "summary": "<p>Amazon Managed Grafana is now a&nbsp;<a href=\"https://aws.amazon.com/compliance/fedramp/\">FedRAMP</a> High authorized service in the AWS GovCloud (US-East) and AWS GovCloud (US-West) regions. Federal agencies, public sector organizations, and other enterprises with FedRAMP High compliance requirements can now use Amazon Managed Grafana to visualize, query, and alert on operational metrics across their AWS and hybrid environments while meeting their strict security and compliance requirements.</p> \n<p>Amazon Managed Grafana is a fully managed service based on open-source Grafana that makes it easier for you to visualize and analyze your operational data at scale. The Federal Risk and Authorization Management Program (FedRAMP) is a US government-wide program that delivers a standard approach to the security assessment, authorization, and continuous monitoring for cloud products and services.&nbsp;</p> \n<p>For more details about Amazon Managed Grafana in AWS GovCloud (US), visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/grafana.html\">Amazon Managed Grafana GovCloud documentation</a> or contact your AWS account team for more information. To learn more, visit the Amazon Managed Grafana <a href=\"https://aws.amazon.com/grafana/\">product page.</a></p>"
  "a664a0351fcb5da9c6d11e70b0aa1ecf":
    "id": "a664a0351fcb5da9c6d11e70b0aa1ecf"
    "title": "Amazon EC2 now surfaces the public SSM parameters associated with public AMIs"
