    "published": "2026-07-17 03:20:00"
    "fetched": "2026-07-17 07:53:57"
    "summary": "<p>Amazon EC2 now surfaces the AWS Systems Manager (SSM) Parameter Store parameters associated with public AMIs directly in the AMI metadata. When you describe a public AMI, the response includes the associated public SSM parameter,&nbsp;making it easy to discover and reference in your configurations.</p> \n<p>Previously, finding the SSM parameter associated with a public AMI required searching through SSM parameter namespaces manually. Now, when you describe a public AMI, the response includes the public SSM parameter it is associated with. This allows you to discover the SSM parameter for a public AMI easily and use it as an alias that always resolves to the latest version, simplifying AMI updates across your infrastructure.<br /> <br /> This capability is available to all customers at no additional cost in all AWS regions including AWS China (Beijing) Region, operated by Sinnet, and AWS China (Ningxia) Region, operated by NWCD, and AWS GovCloud (US) Regions. To learn more, please visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/finding-an-ami-parameter-store.html\">documentation</a>.</p>"
  "2502407dd5f3baefe23c9ce3b0655e6f":
    "id": "2502407dd5f3baefe23c9ce3b0655e6f"
    "title": "Amazon S3 removes 30-day minimum for transitions to S3 Standard-IA and S3 One Zone-IA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/s3-removes-30-day-transitions-standard-ia-one-zone-ia"
    "published": "2026-07-17 00:00:00"
    "fetched": "2026-07-17 07:53:57"
    "summary": "<p>You can now transition objects to S3 Standard-Infrequent Access (S3 Standard-IA) and S3 One Zone-Infrequent Access (S3 One Zone-IA) as soon as the day they are created, without the previous 30-day minimum retention in S3 Standard. These storage classes offer up to 40% lower storage costs than S3 Standard while still providing millisecond access when needed, making them ideal for backups, log analytics, and compliance workloads where data becomes cold within hours or days.<br /> <br /> To get started, create new S3 Lifecycle rules to transition objects to S3 Standard-IA and S3 One Zone-IA as soon as 0 days after creation. You can configure these rules using the S3 console, AWS CLI, or SDKs. This update is available in all AWS Regions where S3 Standard-IA and S3 One Zone-IA are available. For pricing details, visit the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 pricing page</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/storage-classes/\" rel=\"noopener noreferrer\" target=\"_blank\">overview page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
