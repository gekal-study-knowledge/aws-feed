    "title": "AWS DMS を使って Amazon RDS for Db2 からオンプレミスの AIX Db2 へフェイルバックする"
    "link": "https://aws.amazon.com/jp/blogs/news/fail-back-from-amazon-rds-for-db2-to-on-premises-aix-db2-using-dms/"
    "published": "2026-07-17 14:25:03"
    "fetched": "2026-07-17 14:38:10"
    "summary": "AWS Database Migration Service (AWS DMS) を使い、Amazon RDS for Db2 からオンプレミスの AIX Db2 インスタンスへ CDC のみのリバースレプリケーションを構成する方法を説明します。プライベートのみのネットワーク上で検証済みのフェイルバック経路を用意し、移行カットオーバー後の検証期間に問題が発生してもデータの整合性を保ったまま迅速にロールバックできるようにします。"
  "0688ca707bb17217d516962d887eaed8":
    "id": "0688ca707bb17217d516962d887eaed8"
    "title": "Amazon RDS for Db2 でセルフマネージド AD の Kerberos 認証を有効にする"
    "link": "https://aws.amazon.com/jp/blogs/news/enable-self-managed-ad-kerberos-authentication-with-amazon-rds-for-db2/"
    "published": "2026-07-17 13:50:28"
    "fetched": "2026-07-17 14:38:10"
    "summary": "Amazon RDS for Db2 は、お客様自身の Active Directory を利用した Kerberos 認証をサポートしており、データベースユーザーの認証を一元化してシングルサインオンを実現できます。本記事では、専用の OU とサービスアカウントの作成、必要な AD 権限の委任、KMS で暗号化したシークレットへの認証情報の保存、そしてドメイン参加済みクライアントからの接続検証まで、セルフマネージド AD による Kerberos 認証の設定手順を順を追って説明します。"
