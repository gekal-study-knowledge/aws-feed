    "fetched": "2026-07-17 14:38:10"
    "summary": "本記事では、Amazon RDS for Oracle のクロスリージョンレプリカにおけるレプリケーションラグを REDO 圧縮機能で最適化する方法を説明します。REDO 圧縮の仕組み、有効化手順、実際の負荷テストによる効果を SLOB ツールを用いて検証し、圧縮有効時にラグが大幅に削減されることを示します。"
