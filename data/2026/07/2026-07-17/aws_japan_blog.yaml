    "summary": "Oracle Data Masking and Subsetting Pack を Amazon RDS for Oracle で使用する方法を説明します。Oracle Enterprise Manager (OEM) でのデータマスキングのセットアップから、マスキングスクリプトの生成と実行、EventBridge と Step Functions による自動化まで、非本番環境を本番相当のデータで安全にリフレッシュする手順を紹介します。"
