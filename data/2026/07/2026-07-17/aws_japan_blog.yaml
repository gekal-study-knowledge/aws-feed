  "d3bbbd712867e58bd26e6142a12cca9a":
    "id": "d3bbbd712867e58bd26e6142a12cca9a"
    "title": "Amazon RDS for Db2 でカスタムドメイン名を維持する"
    "link": "https://aws.amazon.com/jp/blogs/news/preserving-custom-domain-names-for-amazon-rds-for-db2/"
    "published": "2026-07-17 13:32:40"
    "fetched": "2026-07-17 14:38:10"
    "summary": "IBM Db2 ワークロードを Amazon RDS for Db2 へ移行する際、既存のアプリケーション接続文字列を書き換えずに済ませたいという要望はよくあります。本記事では、SNI ベースの TLS プロキシをデプロイするモジュール化された Terraform テンプレートを紹介します。エンドツーエンドの TLS 暗号化を維持しながら、既存のカスタムドメイン名とポートをそのまま利用できます。"
  "77eb95e564f73c0c321e3633c1c58b48":
    "id": "77eb95e564f73c0c321e3633c1c58b48"
    "title": "Terraform を使用した Amazon RDS for Db2 のデプロイ"
    "link": "https://aws.amazon.com/jp/blogs/news/deploying-amazon-rds-for-db2-using-terraform/"
    "published": "2026-07-17 13:09:04"
    "fetched": "2026-07-17 14:38:10"
    "summary": "IBM Db2 ワークロードを運用しているお客様向けに、Amazon RDS for Db2 を再現性が高く監査可能な方法でプロビジョニングするモジュール式の Terraform テンプレートを紹介します。空の AWS アカウントから、AWS License Manager で追跡される稼働中の RDS for Db2 インスタンスまでを 1 時間以内で構築できます。ネットワーク、IAM、暗号化、パラメータグループ、インスタンス、ライセンスまでを 7 つのモジュールでカバーします。"
  "b422b961f49222ff8eb27c084a8d7cf4":
    "id": "b422b961f49222ff8eb27c084a8d7cf4"
    "title": "Amazon RDS for Oracle レプリカのレプリカ遅延を診断して解消する – Part 2"
    "link": "https://aws.amazon.com/jp/blogs/news/diagnose-and-resolve-replica-lag-in-amazon-rds-for-oracle-replicas-part-2/"
    "published": "2026-07-17 12:42:10"
    "fetched": "2026-07-17 14:38:10"
    "summary": "本記事は Amazon RDS for Oracle リードレプリカのレプリケーション遅延を減らす 2 回シリーズの後編です。CloudWatch メトリクスとデータベースビューによる遅延の監視、待機イベント分析による根本原因の特定、そして遅延を解消するための段階的なトラブルシューティング手法を、プライマリ側とリードレプリカ側の 2 つの実践シナリオを通じて紹介します。"
