    "title": "9 社合同 AI-DLC Unicorn Gym：AI と作った 2 日間で見えた、 「書く」から「決める」への転換"
    "link": "https://aws.amazon.com/jp/blogs/news/joint-ai-dlc-unicorn-gym-202606/"
    "published": "2026-07-22 14:06:10"
    "fetched": "2026-07-22 14:45:25"
    "summary": "2026 年 6 月、事業ドメインの異なる 9 社 11 チーム・約 90 名が一堂に会し、Kiro と Claude Code を使って自社の実課題に挑む AI-DLC Unicorn Gym を合同開催しました。動くものを見ながらビジネスと開発がその場で会話する 2日間を通じて、多くのチームが「開発の主役が書くことから決めることへ移る」という手応えを掴み、参加者アンケートでは満足度 4.7/5・平均 74% の工数削減という結果につながりました。各チームが持ち込んだテーマ、成果発表のハイライト、そして率直なお客様の声まで、合同開催だからこそ見えた 2 日間をレポートします。"
