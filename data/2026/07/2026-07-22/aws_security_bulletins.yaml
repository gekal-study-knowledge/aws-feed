    "title": "CVE-2026-15957 - Uncontrolled recursion in smithy-rs generated JSON, CBOR, and XML deserializers allows unauthenticated remote denial of service via recursive shapes"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-061-aws/"
    "published": "2026-07-22 04:45:45"
    "fetched": "2026-07-22 06:03:04"
    "summary": "<p><b>Bulletin ID:</b> 2026-061-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 07/21/2026 12:45 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Smithy-RS is a Rust code generation and runtime framework that generates HTTP clients and servers from Smithy interface definitions, powering the AWS SDK for Rust and custom service implementations. We identified CVE-2026-15957, where uncontrolled recursion in the JSON, CBOR, and XML deserializer functions emitted by Amazon smithy-rs code generation could allow a third party to cause a denial of service (process abort via stack exhaustion) via a small request containing deeply nested data for a recursive model shape to a generated SDK or server.</p> \n<p><b>Impacted versions:</b> aws-sdk-rust crates &lt; release-2026-06-0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
