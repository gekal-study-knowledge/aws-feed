  "ffe08f9d541fc76525ec0db6768a26f2":
    "id": "ffe08f9d541fc76525ec0db6768a26f2"
    "title": "Amazon ECS now provides Action Logs for deployment and orchestration visibility"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ecs-action-logs/"
    "published": "2026-07-22 00:30:00"
    "fetched": "2026-07-22 02:13:23"
    "summary": "<p>Today, <a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) introduces Action Logs, a new observability feature that delivers detailed, timestamped records of the actions Amazon ECS performs on behalf of customers during service deployments and ECS Managed Daemon updates. By surfacing service-side operations that were previously invisible, Action Logs help you monitor and troubleshoot your workloads directly, without contacting AWS Support or manually correlating data from multiple sources.</p> \n<p>With Action Logs, you gain visibility into key deployment state transitions of service deployments, Managed Daemon updates. Each log entry includes the event name, log level(INFO, WARN, OR ERROR), relevant resource ARNs, and a status reason, helping you reduce mean time to resolution when issues arise. You can opt in at the cluster level through the Amazon ECS console or by using Amazon CloudWatch vended logs APIs, and choose to deliver logs to Amazon CloudWatch Logs, Amazon S3, or Amazon Kinesis Data Firehose depending on your operational needs. At launch, Amazon Q in the Amazon ECS console integrates with Action Logs to automatically detect deployment issues such as circuit breaker rollbacks and unstable service revisions, providing customers with root cause analysis, resource-level comparisons, and step-by-step remediation guidance without leaving the console. Standard CloudWatch Logs, Amazon S3, or Amazon Data Firehose pricing applies for log ingestion and storage. For pricing details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch Pricing</a>.</p> \n<p>Amazon ECS Action Logs are available in all AWS Regions, including the AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a>. To learn more, refer <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/action-logs.html\">Monitor Amazon ECS operations with Action Logs</a> in <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/\">Amazon ECS Developer Guide</a>.</p>"
  "cf88ce7cb3ffa4d547d2775addf7f870":
    "id": "cf88ce7cb3ffa4d547d2775addf7f870"
    "title": "Amazon SES introduces pricing plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ses-pricing-plans/"
    "published": "2026-07-22 01:35:00"
    "fetched": "2026-07-22 04:14:29"
    "summary": "<p>Today, Amazon Simple Email Service (SES) introduced pricing plans, making it easy to purchase and access SES capabilities without evaluating them individually. Amazon SES pricing plans include three hierarchical options: Essentials, Pro, and Enterprise. Each plan builds on the one before it, offering progressively more capability at a discount compared to à-la-carte pricing.</p> \n<p>Businesses depend on email reaching the inbox and getting read, but the capabilities needed to ensure this have traditionally been sold as individual add-ons that must be evaluated and purchased independently. With pricing plans, customers pick a plan and have access to the right capabilities at no additional cost. Essentials provides deliverability insights, Pro adds managed dedicated IPs, email validation, and global inbox placement visibility to proactively prevent problems, and Enterprise adds multi-region resilience, workload-level reputation isolation, and an annual deliverability assessment.</p> \n<p>Pricing plans are available in all AWS Regions where Amazon SES is available, except the Middle East (UAE) and Middle East (Bahrain) Regions.</p> \n<p>To get started, sign in to the <a href=\"https://console.aws.amazon.com/ses/\">Amazon SES console</a> and navigate to the pricing plan section. To learn more, visit the <a href=\"https://aws.amazon.com/ses/pricing/\">Amazon SES Pricing</a> page or the <a href=\"https://docs.aws.amazon.com/ses/\">Amazon SES Developer Guide</a>.</p>"
  "015be1ef886d163ea60a8d45a841e842":
    "id": "015be1ef886d163ea60a8d45a841e842"
    "title": "Amazon EC2 R6in and R6idn instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-r6in-r6idn/"
    "published": "2026-07-22 05:00:00"
    "fetched": "2026-07-22 07:52:02"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R6in and R6idn instances are available in AWS Europe (Paris) and Canada (Central) regions. These sixth-generation network optimized instances, powered by 3rd Generation Intel Xeon Scalable processors and built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, deliver up to 200Gbps network bandwidth, 2x more network bandwidth, and up to 2x higher packet-processing performance over comparable fifth-generation instances.&nbsp;</p> \n<p>Customers can use R6in and R6idn instances to scale the performance and throughput of network-intensive workloads such as memory-intensive SQL and NoSQL databases, distributed web scale in-memory caches (Memcached, Redis), in-memory databases (SAP HANA), and real-time big data analytics (Apache Hadoop, Apache Spark).&nbsp;<br /> &nbsp;<br /> R6in and R6idn instances are available in 10 different instance sizes including metal, with up to 128 vCPUs and 1024 GiB of memory. They deliver up to 100 Gbps of <a href=\"https://aws.amazon.com/ebs/\">Amazon Elastic Block Store (EBS)</a> bandwidth, and up to 400K IOPS. R6in and R6idn instances offer <a href=\"https://aws.amazon.com/hpc/efa/\">Elastic Fabric Adapter (EFA)</a> networking support on 32xlarge and metal sizes. R6idn instances offer up to 7.6 TB of high-speed, low-latency instance storage.&nbsp;<br /> &nbsp;<br /> With this regional expansion, R6in and R6idn instances are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Ireland, Frankfurt, Paris, Stockholm), Asia Pacific (Singapore, Sydney, Tokyo), Canada (Central), and AWS GovCloud (US-West). Customers can purchase the new instances through Savings Plans, Reserved, On-Demand, and Spot instances. To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r6i/\">R6in and R6idn instances page</a>.&nbsp;</p>"
  "584bf62038a7449969b99f7a943f4000":
    "id": "584bf62038a7449969b99f7a943f4000"
    "title": "Amazon EC2 C6in instances are now available in Asia Pacific (Taipei) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c6in/"
    "published": "2026-07-22 05:00:00"
    "fetched": "2026-07-22 07:52:02"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C6in instances are available in AWS Asia Pacific (Taipei). These sixth-generation network optimized instances, powered by 3rd Generation Intel Xeon Scalable processors and built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, deliver up to 200Gbps network bandwidth, for 2x more network bandwidth over comparable fifth-generation instances.&nbsp;<br /> &nbsp;<br /> Customers can use C6in instances to scale the performance of applications such as network virtual appliances (firewalls, virtual routers, load balancers), Telco 5G User Plane Function (UPF), data analytics, high-performance computing (HPC), and CPU based AI/ML workloads. C6in instances are available in 10 different sizes with up to 128 vCPUs, including bare metal size. Amazon EC2 sixth-generation x86-based network optimized EC2 instances deliver up to 100Gbps of Amazon Elastic Block Store (Amazon EBS) bandwidth, and up to 400K IOPS. C6in instances offer Elastic Fabric Adapter (EFA) networking support on 32xlarge and metal sizes.&nbsp;<br /> &nbsp;<br /> C6in instances are available in these <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (Ohio, N. Virginia), US West (N. California, Oregon), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), Middle East (Bahrain, UAE), Israel (Tel Aviv), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Mumbai, Osaka, Seoul, Singapore, Sydney, Taipei, Tokyo, Thailand), Africa (Cape Town), South America (Sao Paulo), Canada (Central), Canada West (Calgary), AWS GovCloud (US-West, US-East), and Mexico (Central). To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c6i/\">Amazon EC2 C6in instance</a> page.&nbsp;</p>"
  "d8422e3d9412ca8af10b37a47c8857c9":
    "id": "d8422e3d9412ca8af10b37a47c8857c9"
    "title": "Amazon EC2 M6in and M6idn instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-m6in-m6idn/"
    "published": "2026-07-22 05:00:00"
    "fetched": "2026-07-22 07:52:02"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M6in and M6idn instances are available in AWS Asia Pacific (Hyderabad) and South America (Sao Paulo) regions. These sixth-generation network optimized instances, powered by 3rd Generation Intel Xeon Scalable processors and built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, deliver up to 200Gbps network bandwidth, for 2x more network bandwidth over comparable fifth-generation instances.&nbsp;</p> \n<p>Customers can use M6in and M6idn instances to scale their performance and throughput of network-intensive workloads such as high-performance file systems, distributed web scale in-memory caches, caching fleets, real-time big data analytics, and Telco applications such as 5G User Plane Function.</p> \n<p>M6in and M6idn instances are available in 10 different instance sizes including metal, offering up to 128 vCPUs and 512 GiB of memory. They deliver up to 100Gbps of <a href=\"https://aws.amazon.com/ebs/\">Amazon Elastic Block Store (EBS)</a> bandwidth, and up to 400K IOPS. M6in and M6idn instances offer <a href=\"https://aws.amazon.com/hpc/efa/\">Elastic Fabric Adapter (EFA)</a> networking support on 32xlarge and metal sizes. M6idn instances offer up to 7.6 TB of high-speed, low-latency instance storage.</p> \n<p>With this regional expansion, M6in and M6idn instances are available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (Ohio, N. Virginia), US West (N. California, Oregon), Europe (Ireland, Frankfurt, Spain, Stockholm, Zurich, London), Asia Pacific (Hyderabad, Mumbai, Singapore, Tokyo, Sydney, Seoul), South America (Sao Paulo), Canada (Central), and AWS GovCloud (US-West). Customers can purchase the new instances through Savings Plans, On-Demand, and Spot instances. To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/m6i/\">M6in and M6idn instances page</a>.</p>"
  "191b7eccd4a5d54d63ad7701913f951f":
    "id": "191b7eccd4a5d54d63ad7701913f951f"
    "title": "Amazon ECS advanced deployment strategies now available in AWS European Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ecs-adv-deployments-eu-sovereign-cloud/"
    "published": "2026-07-22 02:00:00"
    "fetched": "2026-07-22 08:53:13"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now supports built-in blue/green, linear, and canary deployment strategies in the AWS European Sovereign Cloud, making software updates for containerized applications safer and allowing you to release new application versions faster with greater confidence. Built directly into Amazon ECS, these capabilities eliminate the need for custom deployment tooling while providing production-ready controls including deployment lifecycle hooks, bake time, and quick rollback.</p> \n<p>With these strategies, Amazon ECS provisions a new application version alongside the existing version and allows you to validate it before shifting production traffic. Blue/green deployments shift traffic in a single step, linear deployments shift traffic in equal increments over a specified period, and canary deployments shift a small percentage initially before shifting the remainder. You can use deployment lifecycle hooks, including Lambda hooks and pause hooks, to run custom validation logic and approval workflows at specific deployment stages. You can also configure bake time to evaluate the new version after traffic has shifted, and roll back without downtime if regressions are identified. To automatically detect failures, configure Amazon CloudWatch alarms or Amazon ECS deployment circuit breaker, or initiate a rollback directly using the StopServiceDeployment API.</p> \n<p>These capabilities are available for Amazon ECS services using Application Load Balancers (ALB), Network Load Balancers (NLB), and Amazon ECS Service Connect. You can configure deployments using the AWS Management Console, AWS CLI, AWS SDKs, or infrastructure-as-code tools on new or existing Amazon ECS services. To learn more, see our documentation for <a href=\"https://docs.aws.eu/AmazonECS/latest/developerguide/deployment-type-blue-green.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ECS blue/green</a>, <a href=\"https://docs.aws.eu/AmazonECS/latest/developerguide/deployment-type-linear.html\" rel=\"noopener noreferrer\" target=\"_blank\">linear</a>, and <a href=\"https://docs.aws.eu/AmazonECS/latest/developerguide/canary-deployment.html\" rel=\"noopener noreferrer\" target=\"_blank\">canary deployments</a>, and <a href=\"https://docs.aws.eu/AmazonECS/latest/developerguide/deployment-lifecycle-hooks.html\" rel=\"noopener noreferrer\" target=\"_blank\">deployment lifecycle hooks</a>.</p>"
  "612e9281ac0370679c505e726b36050b":
    "id": "612e9281ac0370679c505e726b36050b"
    "title": "Amazon EKS now supports EFA and placement groups on Amazon EKS Auto Mode and Karpenter"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-eks-efa-placement-groups/"
    "published": "2026-07-22 23:30:00"
    "fetched": "2026-07-23 00:36:38"
    "summary": "<p>Amazon Elastic Kubernetes Service (EKS) now supports Amazon EC2 placement groups and Elastic Fabric Adapter (EFA) network device configuration for node pools on EKS Auto Mode and the open-source Karpenter project, enabling you to optimize EKS workloads for performance and availability. These capabilities allow you to control EFA network interface configuration and how EC2 instances are physically distributed across AWS infrastructure for distributed training and inference workloads.<br /> <br /> With EKS Auto Mode and Karpenter’s EFA configuration, you can configure network interfaces as EFA-only or standard ENI on EFA-capable instances with both dynamic and static capacity node pools. EFA-only interfaces do not consume IP addresses, giving you fine-grained control over IP utilization in your VPC while achieving full interconnect bandwidth. With placement group support, you can launch EC2 instances using cluster, spread, or partition strategies directly from your EKS Auto Mode or Karpenter node pool configuration, giving you control over how instances are physically distributed without additional operational workarounds. Together, these capabilities let you optimize for the performance, availability, and fault isolation characteristics your workloads require, whether that's maximizing throughput for distributed training jobs or minimizing blast radius for critical production services.<br /> <br /> These features are available in all AWS Regions where Amazon EKS is available. To get started and learn more, see the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/create-node-class.html#static-network-interfaces\">EKS Auto Mode User Guide</a> and <a href=\"https://karpenter.sh/docs/concepts/nodeclasses/#specnetworkinterfaces\">Karpenter documentation</a>.</p>"
  "02acd021783ac2c3eff2f06b3c03351c":
    "id": "02acd021783ac2c3eff2f06b3c03351c"
    "title": "AWS Elastic Disaster Recovery is now available in six additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-drs-additional-regions/"
    "published": "2026-07-22 07:00:00"
    "fetched": "2026-07-23 00:36:38"
    "summary": "<p>AWS Elastic Disaster Recovery (AWS DRS) is now available in six additional AWS Regions: Asia Pacific (Bangkok), Asia Pacific (Malaysia), Asia Pacific (New Zealand), Asia Pacific (Taipei), Canada West (Calgary), and Mexico (Central). Elastic Disaster Recovery is the recommended service for disaster recovery to AWS. It helps minimize downtime and data loss with fast, reliable recovery of on-premises and cloud-based applications using affordable storage, minimal compute, and point-in-time recovery. With Elastic Disaster Recovery, you can recover your applications on AWS from physical infrastructure, VMware vSphere, Microsoft Hyper-V, and cloud infrastructure. You can also use Elastic Disaster Recovery to recover Amazon EC2 instances in a different AWS Region. AWS DRS replicates and recovers a wide range of applications, including critical databases such as Oracle, MySQL, and SQL Server, and enterprise applications such as SAP. AWS DRS uses a unified process for drills, recovery, and failback, so you do not need application-specific skillsets to operate the service. With this launch, Elastic Disaster Recovery is now available in 36 AWS Regions. See the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a> for the most up-to-date availability information. </p> \n<p>To learn more about AWS Elastic Disaster Recovery, visit our <a href=\"https://aws.amazon.com/disaster-recovery/\">product page</a> or <a href=\"https://docs.aws.amazon.com/drs/latest/userguide/supported-regions.html\">documentation</a>. To get started, sign in to the <a href=\"https://console.aws.amazon.com/drs/\">AWS Elastic Disaster Recovery Console</a>.</p>"
"last_updated": "2026-07-23 00:36:38 JST"
