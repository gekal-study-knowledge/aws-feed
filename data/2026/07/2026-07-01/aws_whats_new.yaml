"entries":
  "5ace34db5048785c45019a37f3deacb8":
    "id": "5ace34db5048785c45019a37f3deacb8"
    "title": "AWS End User Messaging RCS now supports rich media and interactive messaging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-end-user-messaging-rcs/"
    "published": "2026-07-01 03:21:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>AWS End User Messaging now supports rich media and interactive messaging for RCS across all 22 supported countries. With the new SendRcsMessage API, you can send rich cards, carousels, images, videos, and interactive suggestion buttons that let recipients take action directly inside their messaging app.</p> \n<p>RCS message recipients can tap to confirm an appointment, browse a product catalog, complete a payment in a webview, share their location, or interact with an AI agent, all without leaving their phone's messaging app. Behind each of these interactions is the same AWS infrastructure you already use to build applications. RCS becomes the interface layer that connects your backend services, your data, and your AI directly to your end users through your conversation with them.</p> \n<p>With this release AWS now supports four RCS message types (text, files, rich cards, and carousels). These message types can be used with any combination of six actions (replies, URLs, webviews, phone calls, maps, and calendar events) to bring web and mobile app experiences directly into conversations.. Each message supports configurable SMS or MMS fallback for recipients without RCS.</p> \n<p>AWS End User Messaging also introduces RCS Conversation pricing for 21 countries consisting of one flat rate for unlimited messages within a 24-hour session, so you can build back-and-forth workflows without per-message cost pressure.</p> \n<p>RCS messaging is available in all AWS Regions where AWS End User Messaging is available. To learn more, see <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/rcs-rich-messaging.html\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255,255,255);\" target=\"_blank\" title=\"Sending Rich RCS Messages\">sending rich RCS messages</a> in the AWS End User Messaging User Guide.</p> \n<p>&nbsp;</p>"
  "d12935cd9c710c171fcb2cead0a17bc4":
    "id": "d12935cd9c710c171fcb2cead0a17bc4"
    "title": "Amazon Time Sync Service adds support for Microsecond accurate time on 26 additional EC2 instance types in all commercial regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-time-sync-precision-time-placement-group"
    "published": "2026-07-01 02:30:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon Time Sync Service introduces support for microsecond accurate time on 26 additional EC2 instance types in all commercial regions. Built on Amazon's proven network infrastructure and the AWS Nitro System, microsecond accurate time and nanosecond precision hardware timestamps leverage the reference clocks running in the Nitro System directly, enabling customers to easily order application events, measure 1-way network latency, and increase distributed application transaction speed.&nbsp;<br /> &nbsp;<br /> Starting today, customers can access microsecond accurate time on these additional instance types by creating a Precision Time Placement Group (PTPG), a new placement strategy that allows customers to launch instances with Precision Time Protocol hardware clock (PHC) enabled. Customers that require both low network latency as well as precision time can associate a PTPG with their Cluster Placement Group (CPG), so that their low-latency workloads also benefit from microsecond accurate time.&nbsp;<br /> &nbsp;<br /> For more information, refer to the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configure-ec2-ntp.html#enhanced-amazon-time-sync-service\">Amazon Time Sync Service documentation.</a></p>"
  "8a210ab0e332947a8ec46543ad0cbaba":
    "id": "8a210ab0e332947a8ec46543ad0cbaba"
    "title": "Announcing general availability of Amazon WorkSpaces for AI agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-workspaces-ai/"
    "published": "2026-07-01 02:28:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon WorkSpaces for agents is now generally available, enabling AI agents to securely access and operate desktop applications through managed WorkSpaces environments. Enterprises run critical business processes on desktop applications (ERP systems, CRMs, mainframes, and proprietary tools) where years of customization, undocumented logic, and strict compliance requirements make them too critical to abandon and costly to modernize. WorkSpaces for agentsnow gives AI agents a managed cloud workspace where they can see the screen and operate these applications the way humans do, without requiring application modernization or custom integrations.</p> \n<p>WorkSpaces uses the same infrastructure for agents as organizations have trusted for over a decade to deliver secure, managed desktops at scale. Agents inherit the same identity controls, network isolation, and compliance boundaries as human users, so organizations gain automation without giving up governance. Organizations can automate workflows such as claims processing, patient record updates, trade settlement, and back-office operations. The service works with any agent framework using Model Context Protocol (MCP), and pricing scales based on active session time.</p> \n<p>Since launching in <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/workspaces-ai-agents/\">Preview</a>, customer and partner feedback has shaped new capabilities. MCP tool forwarding allows agents to interact with applications and the desktop operating system through direct MCP calls rather than using computer use tools, improving accuracy, reducing latency, and lowering cost. Real-time session control gives operators live visibility into agent activity with the ability to revoke access mid-session. Domain-joined fleet support lets agents operate under existing Active Directory identities, extending the same access policies and audit attribution that apply to employees.</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/workspaces/ai-agents/\">Amazon WorkSpaces for AI agents</a>. To get started building, see the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">documentation</a> and <a href=\"https://github.com/aws-samples/sample-code-for-workspaces-agent-access\">sample code on GitHub</a>. &nbsp;</p>"
  "ebe8ed015ac8e761ccb60dab83f4e9b2":
    "id": "ebe8ed015ac8e761ccb60dab83f4e9b2"
    "title": "capability-insights-aws"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/capability-insights-aws/"
    "published": "2026-07-01 02:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Announcing Capability Insights for AWS, an open-source solution for regional capabilities</p> \n<p>Today, AWS announces the launch of Capability Insights, an open-source solution that enables you to deploy regional capabilities data inside your own Amazon Virtual Private Cloud (VPC). This self-hosted dashboard addresses the needs of teams building multi-Region architectures requiring regional capabilities data deployed as infrastructure they own, inside their network, and under their governance. The solution is designed for organizations with data residency requirements, compliance teams needing internal reporting, and teams planning regional expansion or multi-Region recovery strategies.</p> \n<p>The dashboard auto-refreshes every 24 hours with AWS capabilities data across all Regions, covering services, features, API operations, and CloudFormation resource types. The Workload Analysis component scans your AWS CloudTrail logs and AWS CloudFormation stacks to filter 200+ services down to the number of services your account actually uses, reducing multi-week gap analysis to quick reviews. All data remains within your VPC perimeter, supporting compliance and data residency requirements while providing full ownership and control over the infrastructure hosting the regional capabilities data.</p> \n<p>&nbsp;</p>"
  "c9d02fd4d10a2ac9738b511f20a242cb":
    "id": "c9d02fd4d10a2ac9738b511f20a242cb"
    "title": "Amazon SageMaker AI cuts generative AI inference scale-out time by up to half with automatic container image caching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/sagemakerai-inf-scale-out-time"
    "published": "2026-07-01 01:31:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon SageMaker Inference now supports container image caching, enabling up to 2x faster end-to-end scaling for generative AI models during scale-out events. When your endpoint scales out, the service pre-caches your container image so new instances can start serving traffic faster, without waiting for large container images to be pulled from Amazon ECR.<br /> <br /> Generative AI workloads typically use large container images (10 GB or more) for deep learning frameworks and model serving. Previously, every new instance launched during scale-out had to pull the full image from ECR, adding several minutes of cold-start latency. Container image caching eliminates this bottleneck by pre-pulling the image so new instances launch with the container already available locally. Customers don't need to make any changes. The service automatically caches whatever image URI is specified in your endpoint or inference component configuration. This capability supports accelerator instance types, single-model endpoints, and inference component-based endpoints.<br /> <br /> With this launch, SageMaker Inference now offers a comprehensive scaling optimization suite for generative AI: sub-minute concurrency metrics for up to 6x faster load detection, instance-store container caching for faster scaling on existing instances, and container image caching for up to 2x faster scaling on new instances.<br /> <br /> Container image caching is available in all AWS commercial regions where SageMaker Inference is supported. To learn more, visit the <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-container-caching-in-amazon-sagemaker-ai-for-faster-model-scaling/\">launch blog</a>.</p>"
  "e37f8aef69c8377f110d6146585f18ee":
    "id": "e37f8aef69c8377f110d6146585f18ee"
    "title": "IAM Identity Center now enables programmatic AWS account access for customer managed applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-iam-identity-center-account-access-customer-managed-apps/"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>IAM Identity Center now enables customer managed applications to programmatically access AWS accounts on behalf of their users, including the ability to discover accounts and roles assigned to a user and retrieve temporary credentials required for AWS account access.</p> \n<p>If you have a customer managed application that authenticates users through an external identity provider (IdP), you can configure that IdP as a <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/using-apps-with-trusted-token-issuer.html\">trusted token issuer (TTI)</a> in IAM Identity Center. With this launch, you can now enable AWS account access for this application.&nbsp;Users who have already signed in through the IdP can access their assigned AWS accounts and obtain temporary security credentials for their authorized roles without a separate authentication flow.&nbsp;This eliminates redundant sign-in prompts that previously required users to re-authenticate even after signing in through their external identity provider.</p> \n<p>This feature is available for organization instances of IAM Identity Center. IAM Identity Center administrators must explicitly enable AWS account access for each customer managed application. Only management account administrators or delegated administrators can enable this capability, ensuring centralized governance over which applications can access account-level resources.</p> \n<p>This feature is available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the China Regions. To get started, navigate to the IAM Identity Center console, select your customer managed application, and enable AWS account access. For more information, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/enable-account-access-customer-managed-apps.html\">Enable AWS account access for customer managed applications</a> in the IAM Identity Center User Guide.</p>"
  "97da56fa11d4aea890693756bda1e56c":
    "id": "97da56fa11d4aea890693756bda1e56c"
    "title": "Claude Sonnet 5 now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/claude-sonnet-5-now-available-on-aws"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>AWS now offers Claude Sonnet 5 - Anthropic's most capable Sonnet model and the first Sonnet model of Anthropic’s latest generation - bringing top-tier intelligence at Sonnet pricing for coding, agents, and everyday professional work at scale.</p> \n<p>Claude Sonnet 5 delivers strong performance across coding, professional work, and agentic tasks while maintaining the balance of capability, cost, and speed that teams get from Sonnet. For coding, it navigates large codebases, lands multi-file changes, and carries debugging and refactoring tasks through to completion with fewer rounds of correction. For agents, it calls tools precisely, holds state across many steps, and recovers from errors so more runs finish correctly the first time. For knowledge work, it builds spreadsheets, drafts documents, and turns unstructured material into structured analysis.&nbsp;</p> \n<p>Customers have two ways to access Claude Sonnet 5: Amazon Bedrock and Claude Platform on AWS.</p> \n<p>Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Sonnet 5 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>.&nbsp;</p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\">Claude Platform on AWS documentation</a>.</p>"
  "bb72db2c9b5ae76d027a18fae20a0d20":
    "id": "bb72db2c9b5ae76d027a18fae20a0d20"
    "title": "Amazon SageMaker AI now supports serverless model customization for Gemma 4 models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-sagemaker-ai-gemma-4/"
    "published": "2026-07-01 00:30:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Gemma 4 E4B and 31B models using supervised fine-tuning (SFT), direct preference optimization (DPO), and reinforcement fine-tuning (RFT). Gemma is a family of open models built by Google DeepMind. In addition to deploying these models on SageMaker AI, you can now adapt them to your specific domains and workflows. This launch also extends the variety of models available for serverless customization on SageMaker AI, including models from the Nova, Nemotron 3, Qwen, Llama, gpt-oss, and DeepSeek families.<br /> <br /> Model customization enables you to tailor these foundation models with your proprietary data, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or enhancing performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.<br /> <br /> Serverless model customization on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and EU (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
  "f1f2cb3737d53bac04a40035ca9fe22e":
    "id": "f1f2cb3737d53bac04a40035ca9fe22e"
    "title": "Amazon RDS Enhances IAM Database Authentication with Connection Rate Scaling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-rds-iam/"
    "published": "2026-07-01 05:00:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p>Amazon Relational Database Service (Amazon RDS) now offers dynamic connection scaling for IAM database authentication, allowing connection rates to scale with instance resources.<br /> <br /> IAM database authentication performance now scales with available instance resources, enabling enterprise workloads to leverage IAM authentication for high-volume connection patterns. The number of new IAM authentication requests your instance can handle depends on available resources and workload characteristics. For optimal performance, we recommend reusing IAM user or IAM assumed role principals to generate authentication tokens, or reusing the authentication tokens themselves, when possible.<br /> <br /> This update is available in all AWS Regions, including the AWS GovCloud (US) Regions, where IAM database authentication is supported for Amazon Aurora and Amazon RDS database engines including PostgreSQL, MySQL, and MariaDB. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html\" target=\"_blank\">IAM database authentication documentation</a>.</p>"
  "7b6eac02ee64d55ae25ebeb95048a51a":
    "id": "7b6eac02ee64d55ae25ebeb95048a51a"
    "title": "AWS Parallel Computing Service supports in-place Slurm major version upgrades"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-parallel-computing-service-upgrade/"
    "published": "2026-07-01 04:12:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p>AWS Parallel Computing Service (PCS) now supports managed in-place Slurm version upgrades for existing clusters. You can move your clusters up to three Slurm major versions ahead with no disruption to running jobs.<br /> <br /> To upgrade, update your Cluster configuration with your target Slurm version using the AWS Management Console, AWS CLI, or UpdateCluster API. PCS handles the upgrade of all managed Slurm components — the controller, accounting database, and REST API. Running jobs continue uninterrupted during the upgrade, queued jobs resume once the operation completes, and any accounting data is preserved in the database. You can then update your compute nodes to the new Slurm version at your convenience. Refer to the <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/working-with_clusters_version_update.html\">PCS User Guide</a> for more information on the steps to follow and considerations to review based on your cluster configuration.<br /> <br /> AWS PCS is a managed service that simplifies running and scaling HPC workloads on AWS using Slurm. You can build complete, elastic environments that integrate compute, storage, networking, and visualization tools, while the service handles cluster operations with managed updates and built-in observability features.<br /> <br /> This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions where PCS is available</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/working-with_clusters_version_update.html\">PCS User Guide</a>.</p>"
  "b1e5a94182a3934d4bd5fe4b6281c9e7":
    "id": "b1e5a94182a3934d4bd5fe4b6281c9e7"
    "title": "Amazon ElastiCache T4g nodes now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-elasticache-t4g-additional-aws-regions/"
    "published": "2026-07-01 04:00:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p>Amazon ElastiCache now supports T4g node types in the following AWS Regions: Africa (Cape Town), Asia Pacific (Jakarta), Asia Pacific (Osaka), AWS GovCloud (US-East), and AWS GovCloud (US-West). T4g nodes are powered by AWS Graviton2 processors and provide a baseline level of CPU performance with the ability to burst CPU usage at any time, making them ideal for applications that experience temporary spikes in usage.</p> \n<p>For complete information on pricing and regional availability, please refer to the <a href=\"https://aws.amazon.com/elasticache/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache pricing page</a>. To get started, create a new cluster or modify an existing cluster using the <a href=\"https://console.aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>, AWS CLI, or API. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheNodes.SupportedTypes.html\" rel=\"noopener noreferrer\" target=\"_blank\">Supported node types</a> in the <i>Amazon ElastiCache User Guide</i>.</p>"
  "11a4c2a84f18c1d9795bb7f94bef4571":
    "id": "11a4c2a84f18c1d9795bb7f94bef4571"
    "title": "Amazon Neptune announces dual stack support with IPv6"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-neptune-ipv6/"
    "published": "2026-07-01 04:00:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p><a href=\"https://aws.amazon.com/neptune/\" target=\"_blank\">Amazon Neptune</a> now supports dual-stack mode, enabling database clusters to accept connections over IPv4, IPv6, or both protocols simultaneously. This allows organizations to adopt IPv6 while maintaining backward compatibility with existing IPv4 deployments.<br /> <br /> Neptune dual-stack mode supports two configurations. Private dual-stack mode provides IPv6 endpoints that remain isolated from the internet, suitable for internal applications and private graph databases. Public dual-stack mode enables IPv6 endpoints accessible from the internet, supporting internet-facing applications and hybrid network environments. Clients connect seamlessly using their preferred protocol with no application changes required.<br /> <br /> Dual-stack mode is available in all AWS Regions where Amazon Neptune is supported. To get started, see the <a href=\"https://docs.aws.amazon.com/neptune/latest/userguide/neptune-setup.html\" target=\"_blank\">Neptune setup documentation</a>.</p>"
  "a8c93b58bbdfa56c72d62dde18292ea3":
    "id": "a8c93b58bbdfa56c72d62dde18292ea3"
    "title": "Announcing Capability Insights for AWS, an open-source solution for regional capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/capability-insights-aws/"
    "published": "2026-07-01 02:00:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p>Today, AWS announces the launch of Capability Insights, an open-source solution that enables you to deploy regional capabilities data inside your own Amazon Virtual Private Cloud (VPC). This self-hosted dashboard addresses the needs of teams building multi-Region architectures requiring regional capabilities data deployed as infrastructure they own, inside their network, and under their governance. The solution is designed for organizations with data residency requirements, compliance teams needing internal reporting, and teams planning regional expansion or multi-Region recovery strategies.</p> \n<p>The dashboard auto-refreshes every 24 hours with AWS capabilities data across all Regions, covering services, features, API operations, and CloudFormation resource types. The Workload Analysis component scans your AWS CloudTrail logs and AWS CloudFormation stacks to filter 200+ services down to the number of services your account actually uses, reducing multi-week gap analysis to quick reviews. All data remains within your VPC perimeter, supporting compliance and data residency requirements while providing full ownership and control over the infrastructure hosting the regional capabilities data.</p> \n<p>&nbsp;</p>"
  "c0d39b3cac76aa47fead885fd81375c9":
    "id": "c0d39b3cac76aa47fead885fd81375c9"
    "title": "AWS Security Hub CSPM launches AI Security Best Practices standard with 31 automated controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-security-hub-cspm-ai-security/"
    "published": "2026-07-01 01:17:00"
    "fetched": "2026-07-01 06:24:47"
    "summary": "<p>Today, AWS Security Hub CSPM announces the AI Security Best Practices standard, a set of 31 automated security controls that detect when your deployed AI resources do not align with security best practices. Developed by AWS security experts, this standard helps you continuously evaluate your Amazon Bedrock, Amazon Bedrock AgentCore, and Amazon SageMaker workloads against recommended security configurations—without requiring manual assessments or custom rule authoring.<br /> <br /> The AI Security Best Practices standard covers critical security domains including but not limited to network isolation, encryption at rest and in transit, VPC placement, KMS key usage, private container registry requirements, and authorization controls. Controls span the breadth of AI infrastructure: from Bedrock AgentCore runtimes, gateways, memory stores, and custom browsers to SageMaker notebook instances, endpoints, models, monitoring jobs, and feature groups. Each control is assigned a security category and generates findings when resources deviate from best practices, enabling security teams to quickly identify and remediate misconfigurations across their AI workloads.<br /> <br /> The AI Security Best Practices standard is available in all AWS Regions where Security Hub CSPM is currently available, including AWS GovCloud (US) and the China Regions. The standard identifier is standards/ai-security-best-practices/v/1.0.0. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html\"><i>AWS Security Hub CSPM User Guide</i></a>. You can also try Security Hub CSPM at no cost for 30 days with the <a href=\"https://aws.amazon.com/free/\">AWS Free Tier</a>.<a href=\"https://aws.amazon.com\"></a></p>"
  "f2557c983bcad43595a592cdd320ccde":
    "id": "f2557c983bcad43595a592cdd320ccde"
    "title": "Amazon CloudWatch Logs enriches log events with AWS resource tags"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-logs-resource-tags/"
    "published": "2026-07-01 06:15:00"
    "fetched": "2026-07-01 08:07:27"
    "summary": "<p>Amazon CloudWatch Logs now enriches log events with resource tags, making it easier to filter, search, and analyze logs by the metadata that matters most to your organization, such as&nbsp; team ownership, environment, cost center, or application name, without requiring changes to your logging instrumentation.</p> \n<p>With tag enrichment, Amazon CloudWatch Logs adds resource tags directly to your log events at ingestion time. You can immediately use tags in log queries, to scope your analysis without building custom pipelines or manually adding context to your application logs. For example, you can quickly filter all logs from production resources owned by a specific team, or filter by cost center during an incident investigation.</p> \n<p>Tag enrichment for logs is available in all commercial AWS Regions except Middle East (UAE), Middle East (Bahrain), and Israel (Tel Aviv). To get started, enable resource tags on telemetry in the <a href=\"https://console.aws.amazon.com/cloudwatch/\">Amazon CloudWatch</a> Settings, or through the AWS Command Line Interface (AWS CLI), and AWS SDKs to use your existing AWS resource tags to enrich your log events. Tag enrichment is available for no additional cost. Learn more on the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/resource-tags-for-telemetry.html\">Amazon CloudWatch documentation </a>page.</p>"
  "20aa81b929de4e01c579ebf5f2b70047":
    "id": "20aa81b929de4e01c579ebf5f2b70047"
    "title": "AWS CloudFormation and CDK accelerate development feedback loops with pre-deployment validation on all stack operations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-cloudformation/"
    "published": "2026-07-01 06:00:00"
    "fetched": "2026-07-01 08:07:27"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/cloudformation/\">AWS CloudFormation</a> customers can now get immediate feedback on deployment errors in seconds, eliminating the need to wait through a full provision-and-rollback cycle to discover preventable failures. CloudFormation now runs <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/validate-stack-deployments.html\">pre-deployment validation</a> on <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_CreateStack.html\">Create Stack</a> and <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_UpdateStack.html\">Update Stack</a> operations, catching common deployment errors before resource provisioning begins. This accelerates development velocity across all deployment workflows, from manual iteration to CI/CD pipelines to AI agents provisioning infrastructure.<br /> <br /> Previously, pre-deployment validation was available during <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-changesets.html\">change set</a> creation, covering property syntax errors, resource name conflicts, and S3 bucket emptiness constraints. With this release, the same validations now run automatically on Create Stack and Update Stack operations. Additionally, three new validation checks are now available as warnings during change set creation. Service quota limits validation warns when creating resources would exceed your account's service quotas. AWS Config Recorder conflict detection warns when your template adds Config rules to an account that does not have Config recording enabled, or defines a Config Recorder in an account where one is already active. ECR repository delete readiness validation warns when an ECR repository targeted for deletion still contains images. When validation detects an issue, you can view errors using the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_DescribeEvents.html\">DescribeEvents</a> API with the operation ID, or in the CloudFormation console by navigating to your stack's Events tab and clicking the operation ID (or the link in the banner or status reason column) to open the Operation view page, which opens directly on the Deployment validations tab. Each error includes the logical resource ID and property path, so you can pinpoint and fix the problem before any resources are provisioned. In CDK, both cdk deploy and cdk validate surface validation results with construct-level tracing in a unified report, so AI agents and automation tools can parse structured responses and self-correct immediately.<br /> <br /> Pre-deployment validation is enabled by default on all stack operations with no configuration required. If you need to skip validation for a specific operation, use the new DisableValidation parameter on CreateStack, UpdateStack and CreateChangeSet API calls, or the --disable-validation flag in the CLI. Visit the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/validate-stack-deployments.html\">Validate stack deployments</a> User Guide to learn more.<br /> <br /> This feature is available in all AWS Regions where CloudFormation is supported, excluding China. Refer to the <a href=\"https://docs.aws.amazon.com/general/latest/gr/cfn.html#cfn_region\">AWS Region table</a> for service availability details.</p>"
  "ce8119c0ea7ed090e39c8a998f4d1d2c":
    "id": "ce8119c0ea7ed090e39c8a998f4d1d2c"
    "title": "AWS CloudFormation and CDK express mode speeds up infrastructure deployments by up to 4x"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-cloudformation-cdk/"
    "published": "2026-07-01 06:00:00"
    "fetched": "2026-07-01 08:07:27"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/cloudformation/\">AWS CloudFormation</a> and <a href=\"https://docs.aws.amazon.com/cdk/v2/guide/home.html\">CDK</a> express mode reduces deployment time by up to 4x for developers and AI agents building infrastructure, based on internal benchmarks. Express mode completes stack operations when CloudFormation confirms resource configuration is applied, rather than waiting for extended stabilization checks such as traffic readiness, region propagation, and resource cleanup. This enables faster iteration cycles for developers and AI agents building infrastructure.<br /> <br /> When iterating on infrastructure in development environments, developers and AI agents need faster iteration cycles to build infrastructure incrementally. Previously, every deployment waited for full resource stabilization regardless of whether the workflow required it. For example, creating a CloudFront distribution required waiting 5-10 minutes for propagation to all edge locations before the deployment completed, even when the developer only needed the distribution domain name to continue. With express mode, deployments complete in seconds once configuration is applied, and propagation continues in the background. CloudFormation still processes resources in dependency order and handles dependent resource failures within the same stack. Express mode disables rollback by default, enabling immediate fix-and-retry without waiting for rollback operations.<br /> <br /> To get started, set --deployment-config '{\"mode\": \"EXPRESS\"}' when creating, updating, and deleting stacks or creating a change set through the <a href=\"https://docs.aws.amazon.com/cli/latest/reference/cloudformation/\">AWS CLI</a>, AWS SDKs, or the <a href=\"https://console.aws.amazon.com/cloudformation\">AWS Management Console</a>. For <a href=\"https://docs.aws.amazon.com/cdk/v2/guide/\">AWS CDK</a> users, activate express mode with cdk deploy --express. No template changes are required. Express mode works with all existing CloudFormation templates, and nested stacks. Visit the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-express-mode.html\">CloudFormation Express mode documentation</a> to learn more.<br /> <br /> This feature is available in all AWS Regions where CloudFormation is supported. Refer to the <a href=\"https://docs.aws.amazon.com/general/latest/gr/cfn.html#cfn_region\">AWS Region table</a> for service availability details.</p>"
  "5414d89b3a9a5dfe5f75a6a85934343b":
    "id": "5414d89b3a9a5dfe5f75a6a85934343b"
    "title": "Amazon EC2 Auto Scaling now supports reservations then balanced Availability Zone distribution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-auto-scaling-res-then-balanced/"
    "published": "2026-07-01 02:09:00"
    "fetched": "2026-07-01 08:07:27"
    "summary": "<p>Amazon EC2 Auto Scaling now offers reservations-then-balanced, a new Availability Zone (AZ) distribution strategy that prioritizes launching instances into your capacity reservations before distributing remaining capacity evenly across Availability Zones. This enables you to maximize utilization of pre-purchased capacity such as On-Demand Capacity Reservations (ODCRs), Capacity Blocks, and Interruptible Capacity Reservations, while retaining the operational simplicity and resilience of Auto Scaling.<br /> <br /> Starting today, you can configure reservations-then-balanced by setting the capacity distribution strategy in the AvailabilityZoneDistribution configuration of your Auto Scaling group and targeting reservations by Capacity Reservation Group ARN or by individual Capacity Reservation IDs. There is no additional charge to use reservations-then-balanced; you continue to pay standard EC2 pricing for your reservations and any On-Demand or Spot instances launched by the group.</p> \n<p>Reservations-then-balanced is available today in all AWS commercial Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html\">Amazon EC2 Auto Scaling User Guide</a>.</p>"
  "d3c74149199f3b3dd1cb50a2f36b1f0d":
    "id": "d3c74149199f3b3dd1cb50a2f36b1f0d"
    "title": "Amazon EC2 C9g and C9gd compute optimized instances are now available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-c9g-c9gd-instances-graviton5-processors-available/"
    "published": "2026-07-01 00:00:00"
    "fetched": "2026-07-01 08:07:27"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C9g and C9gd instances, powered by AWS Graviton5 processors, are generally available. AWS Graviton5 processors are the fifth generation of custom-designed CPUs, delivering the best price performance for compute-intensive workloads running on Amazon EC2.</p> \n<p>C9g instances are ideal for workloads such as high-performance computing (HPC), batch processing, gaming, video encoding, scientific modeling, distributed analytics, CPU-based machine learning (ML) inference, real time analytics, and ad serving. C9gd instances offer local NVMe-based SSD block-level storage for customers running compute-intensive workloads that also require high-speed, low-latency local storage for scratch space, temporary files, and caches.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">C9g and C9gd instances</a> deliver up to 25% better compute performance compared to AWS Graviton4-based C8g and C8gd instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. They feature 5x larger cache and the fastest memory of any processor instances in the cloud. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security.&nbsp;</p> \n<p>C9g and C9gd instances are available in US East (N. Virginia, Ohio), US West (Oregon), and EU (Frankfurt) regions. C9g and C9gd instances are available for purchase via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts.</p> \n<p><a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">get started today.</a>&nbsp;</p>"
  "49823e628f84a11d593ed61ab4a60d7d":
    "id": "49823e628f84a11d593ed61ab4a60d7d"
    "title": "Claude Sonnet 5 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/claude-sonnet-5-now-available-on-aws"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-01 12:27:48"
    "summary": "<p>AWS now offers Claude Sonnet 5 - Anthropic's most capable Sonnet model and the first Sonnet model of Anthropic’s latest generation - bringing top-tier intelligence at Sonnet pricing for coding, agents, and everyday professional work at scale.</p> \n<p>Claude Sonnet 5 delivers strong performance across coding, professional work, and agentic tasks while maintaining the balance of capability, cost, and speed that teams get from Sonnet. For coding, it navigates large codebases, lands multi-file changes, and carries debugging and refactoring tasks through to completion with fewer rounds of correction. For agents, it calls tools precisely, holds state across many steps, and recovers from errors so more runs finish correctly the first time. For knowledge work, it builds spreadsheets, drafts documents, and turns unstructured material into structured analysis.&nbsp;</p> \n<p>Customers have two ways to access Claude Sonnet 5: Amazon Bedrock and Claude Platform on AWS.</p> \n<p>Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Sonnet 5 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>.&nbsp;</p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\">Claude Platform on AWS documentation</a>.</p>"
  "e1eeadcae4d1954b226cf875400d6e45":
    "id": "e1eeadcae4d1954b226cf875400d6e45"
    "title": "AWS announces AWS Interconnect - last mile new partner with AT&T in gated preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-announces-AWS-interconnect-last-mile-ATT-gated-preview/"
    "published": "2026-07-01 00:00:00"
    "fetched": "2026-07-02 04:48:28"
    "summary": "<p>AWS launches AWS Interconnect - last mile, a fully managed connectivity offering that allows customers to connect their branch offices, data centers, and remote locations to AWS with just a few clicks, eliminating the friction and complexity of network setup. Now with AT&amp;T in gated preview, AWS Interconnect - last mile combines AWS cloud innovation with AT&amp;T’s extensive network footprint to redefine how businesses connect to the cloud.</p> \n<p>Customers can instantly establish private, high-speed connections to AWS by simply choosing their preferred AWS Region, bandwidth speed, Direct Connect Gateway ID and partner subscriber ID. Once initiated, AWS generates an activation key to complete provisioning with AT&amp;T. The launch simplifies the connectivity experience by pre-provisioning capacity and automating complex network configuration including BGP peering, VLAN configuration, and ASN assignment. Customers can benefit from zero down-time maintenance. The service is designed for high availability and backed by SLA.</p> \n<p>AWS Interconnect - last mile is available as a gated preview with AT&amp;T for customers in the US starting today. Partners can also easily adopt via a published open <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">API package on GitHub</a>. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Interconnect - last mile documentation</a>&nbsp;and request access <a href=\"https://pages.awscloud.com/AWSInterconnect-LastMile-Preview.html\" target=\"_blank\">here</a>.</p>"
  "40498f9863a3d45527206c36e238cf3f":
    "id": "40498f9863a3d45527206c36e238cf3f"
    "title": "Amazon OpenSearch Service optimized for log analytics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-opensearch-service-optimized-log-analytics"
    "published": "2026-07-01 11:30:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>Today, Amazon OpenSearch Service introduces a new engine purpose-built for log analytics workloads, delivering up to 4x better price-performance on internal benchmarks. It combines this efficiency with the full-text search capabilities that OpenSearch is known for, so users can still run the ad hoc queries that incident investigation depends on.</p> \n<p>As log volumes grow with cloud-native architectures, AI workloads, and expanding compliance needs, teams spend more of their time on aggregations and trend analysis to uncover broader patterns — while incident investigations still call for precise text search. Amazon OpenSearch Service, with new optimized capability for log analytics, delivers both fast analytical queries and full-text search in one seamless service.&nbsp;Amazon OpenSearch Service’s new engine optimized for log analytics delivers up to 70% lower storage with a new columnar storage for aggregation workloads. Retain up to 3x more data at the same cost. The new engine also delivers up to 2x higher ingestion throughput on the same hardware and 2x faster analytical queries.</p> \n<p>To get started, create a new domain on OpenSearch 3.5 or above using AWS console,&nbsp; select the observability use case, and set the engine mode to optimized. You can build visualizations and explore data through PPL in OpenSearch UI, or query via SQL using the API, JDBC/ODBC drivers, and Query Workbench. The engine also supports combining full-text search predicates with analytical SQL in the same query. For more information, refer to the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/optimized-log-analytics.html\">documentation</a>.</p> \n<p>Amazon OpenSearch Service optimized for log analytics is available across 12 regions globally: US East (N. Virginia, Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai, Singapore, Sydney, Tokyo), and Europe (Frankfurt, Ireland, London, Spain). There are no additional charges for the new engine.</p>"
  "6737c3db1f7b7246710abdfcd9965b0d":
    "id": "6737c3db1f7b7246710abdfcd9965b0d"
    "title": "AWS Network Firewall now supports container attribute-based inspection for Amazon EKS and Amazon ECS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-network-firewall-container-attributes-referencing"
    "published": "2026-07-01 02:00:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>Today, AWS announces container attribute-based rules for AWS Network Firewall, a capability that simplifies how you secure containerized workloads, including generative AI applications, running on Amazon Elastic Kubernetes Service (Amazon EKS) and Amazon Elastic Container Service (Amazon ECS). You can now write firewall policies using native container constructs such as Namespace, Cluster Name, and Labels for Amazon EKS, and Cluster Name and Container Instance Attributes for Amazon ECS, instead of managing complex IP-based rules that break every time pods scale or restart. As organizations accelerate adoption of generative AI on Amazon EKS and Amazon ECS, this feature delivers the enterprise-grade network security controls needed to protect these dynamic, rapidly evolving environments.<br /> <br /> With container attribute-based rules, you can apply TLS decryption for deep packet inspection of encrypted traffic, FQDN-based filtering to restrict specific pods to approved domains, URL category filtering, and GeoIP filtering—all automatically adapting as your containers scale. The native integration between AWS Network Firewall, Amazon EKS, and Amazon ECS enables centralized, multi-cluster security, helping you meet business and regulatory compliance.<br /> <br /> Container attribute-based inspection is available at no additional cost as part of AWS Network Firewall. For a full list of supported regions, visit the <a href=\"https://builder.aws.com/build/capabilities/explore?f=eJxVirEKg0AQBX9FXq1FWiGFjZAmRVKkcC0uusji4cneqYj477lcEUg3b94c8Gy5C9w_eBA3eZRoCIsv2PhQXAgt8l9TrUaseYuVsMewmvbsT-WY1c2sYa_FBtbYHIRAKJs2J8wRCE4JcQxfG98xSc-6Sse3Pn0uuWviNXH1emZ3DpvTMatFeTPWEs72xPkBR_VAow&amp;tab=service-feature\" target=\"_blank\">AWS Capabilities by Region page.</a><br /> <br /> To get started, visit AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\" target=\"_blank\">product page</a> and service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/rule-groups-url-filtering.html\" target=\"_blank\">documentation</a>.</p>"
  "e38472200a6faff9a80bf5178b532cdb":
    "id": "e38472200a6faff9a80bf5178b532cdb"
    "title": "Amazon RDS for Db2 now supports self-managed Active Directory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-db2-supports-self-managed-active-directory"
    "published": "2026-07-01 16:28:00"
    "fetched": "2026-07-02 08:10:33"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/db2/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for Db2</a> now allows customers to directly join their RDS for Db2 DB instances to the domains of self-managed Microsoft Active Directory (AD). Self-managed AD can be on-premises, on AWS, or in another cloud. Customers use Kerberos as the authentication protocol to enable single sign-on for their database users.<br /> <br /> Previously, to use Kerberos authentication against a self-managed AD with their RDS for Db2 instances, customers were required to deploy AWS Managed Microsoft AD and establish a trust between the AWS managed domain and the self-managed domain. Now, customers can use their existing self-managed AD directly to authenticate and authorize database users without the additional complexity of a managed directory or a directory trust — helping them meet compliance requirements with their existing identity infrastructure. Customers can domain-join their RDS for Db2 instance by either creating a new instance or modifying an existing one, supplying the credentials of a delegated AD service account stored in AWS Secrets Manager and encrypted with AWS KMS. Customers can use self-managed AD free of charge.<br /> <br /> Self-managed Active Directory with Amazon RDS for Db2 is now generally available in all AWS Regions where Amazon RDS for Db2 is available, including the AWS GovCloud (US) Regions.<br /> <br /> To learn more and get started with self-managed Active Directory, visit the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/db2-self-managed-active-directory.html\" target=\"_blank\">Amazon RDS for Db2 User Guide</a> and the <a href=\"https://aws.amazon.com/rds/db2/\" target=\"_blank\">Amazon RDS for Db2 product page</a>.</p>"
  "a481a5b3690bcf9026ca5daa6a9030e2":
    "id": "a481a5b3690bcf9026ca5daa6a9030e2"
    "title": "Amazon Connect Customer now supports rule based redaction for agent screen recording"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/screen-recording-rule-based/"
    "published": "2026-07-01 07:53:00"
    "fetched": "2026-07-03 04:18:37"
    "summary": "<p>Amazon Connect Customer now lets you protect sensitive information in agent screen recordings by defining rules to redact specific applications or URLs. Agent screen recording helps supervisors identify coaching opportunities, such as non-compliance with business processes by allowing them to record agents' on-screen actions during voice calls, chats, and tasks.<br /> <br /> With this feature, you can create rules specifying which URLs or applications should be redacted from recorded content. When any rule condition is met, the system automatically redacts the matching content in the post-contact screen recording.<br /> <br /> Rule-based redaction is available in all AWS Regions where Amazon Connect is currently offered and is supported on Windows operating systems. To learn more about, please visit the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agent-screen-recording.html\">documentation</a> and <a href=\"https://aws.amazon.com/connect/contact-lens/\">webpage</a>. For information about pricing, visit the <a href=\"https://aws.amazon.com/connect/pricing/\">Amazon Connect pricing page</a>.</p>"
  "3eac66c86f7f07f0382364a6f0070648":
    "id": "3eac66c86f7f07f0382364a6f0070648"
    "title": "Amazon Connect Customer now supports assigning up to 7 security profiles with granular access controls per user"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/connect-7-security-profiles-user/"
    "published": "2026-07-01 03:44:00"
    "fetched": "2026-07-03 04:18:37"
    "summary": "<p>Amazon Connect Customer now supports assigning up to 7 security profiles with granular access controls per user, increased from the previous limit of 2. This means an agent who serves multiple lines of business can now have a distinct, scoped permission set for each one, enforced through tag-based or heirarchy-based access controls. The increased limit gives you greater flexibility to match your security model directly to your organizational structure. For example, a financial services company with separate lines for credit cards, mortgages, auto loans, personal banking, investments, insurance, and fraud can now assign an agent seven security profiles, one per line of business, each granting access only to the resources tagged for that specific division. This ensures least privilege access without requiring a single overly broad profile.<br /> <br /> This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS regions</a> where Amazon Connect is offered. To learn more about estimated wait time see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/set-routing-criteria.html\">Amazon Connect Administrator Guide</a>. To learn more about Amazon Connect, the AWS cloud-based contact center, please visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect website</a></p>"
  "4055420aaef840538e45ea84370f4624":
    "id": "4055420aaef840538e45ea84370f4624"
    "title": "CloudWatch Application Signals now supports Dynamic Instrumentation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/cloudwatch-dynamic-instrumentation/"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-07 03:52:30"
    "summary": "<p>Today, AWS announces Dynamic Instrumentation for Amazon CloudWatch Application Signals, a capability that captures runtime state from live applications without requiring restarts or redeployments. Developers debugging production issues can now inspect variable values, method arguments, return values, and stack traces at specific code locations. Dynamic Instrumentation eliminates the need to add logging statements, redeploy, and wait to reproduce a problem, making it practical to investigate issues that are difficult to replicate locally.</p> \n<p>Customers start by instrumenting their application with the AWS Distro for OpenTelemetry (ADOT) SDKs. Customers then configure which code locations to monitor using the CloudWatch Application Signals MCP server or manually via the AWS CLI and SDK. When execution reaches an instrumented location, the agent captures a snapshot containing the runtime context and delivers it to CloudWatch Logs, correlated with the active trace. Customers can tune how much data to capture, including which arguments and local variables to collect.</p> \n<p>Dynamic Instrumentation is available in all commercial AWS regions. Supported languages are Java, Python, and JavaScript/TypeScript. The feature is disabled by default in the ADOT SDKs and must be enabled via a flag, see documentation for more.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-DynamicInstrumentation.html\">Debug applications with Dynamic Instrumentation</a> in the <i>Amazon CloudWatch User Guide</i>. Dynamic instrumentation data is captured as logs. Standard CloudWatch Logs ingestion and storage rates apply. For details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing</a>.</p>"
"last_updated": "2026-07-07 03:52:31 JST"
