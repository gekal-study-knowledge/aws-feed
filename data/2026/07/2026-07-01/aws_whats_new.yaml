  "5ace34db5048785c45019a37f3deacb8":
    "id": "5ace34db5048785c45019a37f3deacb8"
    "title": "AWS End User Messaging RCS now supports rich media and interactive messaging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-end-user-messaging-rcs/"
    "published": "2026-07-01 03:21:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>AWS End User Messaging now supports rich media and interactive messaging for RCS across all 22 supported countries. With the new SendRcsMessage API, you can send rich cards, carousels, images, videos, and interactive suggestion buttons that let recipients take action directly inside their messaging app.</p> \n<p>RCS message recipients can tap to confirm an appointment, browse a product catalog, complete a payment in a webview, share their location, or interact with an AI agent, all without leaving their phone's messaging app. Behind each of these interactions is the same AWS infrastructure you already use to build applications. RCS becomes the interface layer that connects your backend services, your data, and your AI directly to your end users through your conversation with them.</p> \n<p>With this release AWS now supports four RCS message types (text, files, rich cards, and carousels). These message types can be used with any combination of six actions (replies, URLs, webviews, phone calls, maps, and calendar events) to bring web and mobile app experiences directly into conversations.. Each message supports configurable SMS or MMS fallback for recipients without RCS.</p> \n<p>AWS End User Messaging also introduces RCS Conversation pricing for 21 countries consisting of one flat rate for unlimited messages within a 24-hour session, so you can build back-and-forth workflows without per-message cost pressure.</p> \n<p>RCS messaging is available in all AWS Regions where AWS End User Messaging is available. To learn more, see <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/rcs-rich-messaging.html\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255,255,255);\" target=\"_blank\" title=\"Sending Rich RCS Messages\">sending rich RCS messages</a> in the AWS End User Messaging User Guide.</p> \n<p>&nbsp;</p>"
  "d12935cd9c710c171fcb2cead0a17bc4":
    "id": "d12935cd9c710c171fcb2cead0a17bc4"
    "title": "Amazon Time Sync Service adds support for Microsecond accurate time on 26 additional EC2 instance types in all commercial regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-time-sync-precision-time-placement-group"
    "published": "2026-07-01 02:30:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon Time Sync Service introduces support for microsecond accurate time on 26 additional EC2 instance types in all commercial regions. Built on Amazon's proven network infrastructure and the AWS Nitro System, microsecond accurate time and nanosecond precision hardware timestamps leverage the reference clocks running in the Nitro System directly, enabling customers to easily order application events, measure 1-way network latency, and increase distributed application transaction speed.&nbsp;<br /> &nbsp;<br /> Starting today, customers can access microsecond accurate time on these additional instance types by creating a Precision Time Placement Group (PTPG), a new placement strategy that allows customers to launch instances with Precision Time Protocol hardware clock (PHC) enabled. Customers that require both low network latency as well as precision time can associate a PTPG with their Cluster Placement Group (CPG), so that their low-latency workloads also benefit from microsecond accurate time.&nbsp;<br /> &nbsp;<br /> For more information, refer to the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configure-ec2-ntp.html#enhanced-amazon-time-sync-service\">Amazon Time Sync Service documentation.</a></p>"
  "8a210ab0e332947a8ec46543ad0cbaba":
    "id": "8a210ab0e332947a8ec46543ad0cbaba"
    "title": "Announcing general availability of Amazon WorkSpaces for AI agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-workspaces-ai/"
    "published": "2026-07-01 02:28:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon WorkSpaces for agents is now generally available, enabling AI agents to securely access and operate desktop applications through managed WorkSpaces environments. Enterprises run critical business processes on desktop applications (ERP systems, CRMs, mainframes, and proprietary tools) where years of customization, undocumented logic, and strict compliance requirements make them too critical to abandon and costly to modernize. WorkSpaces for agentsnow gives AI agents a managed cloud workspace where they can see the screen and operate these applications the way humans do, without requiring application modernization or custom integrations.</p> \n<p>WorkSpaces uses the same infrastructure for agents as organizations have trusted for over a decade to deliver secure, managed desktops at scale. Agents inherit the same identity controls, network isolation, and compliance boundaries as human users, so organizations gain automation without giving up governance. Organizations can automate workflows such as claims processing, patient record updates, trade settlement, and back-office operations. The service works with any agent framework using Model Context Protocol (MCP), and pricing scales based on active session time.</p> \n<p>Since launching in <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/workspaces-ai-agents/\">Preview</a>, customer and partner feedback has shaped new capabilities. MCP tool forwarding allows agents to interact with applications and the desktop operating system through direct MCP calls rather than using computer use tools, improving accuracy, reducing latency, and lowering cost. Real-time session control gives operators live visibility into agent activity with the ability to revoke access mid-session. Domain-joined fleet support lets agents operate under existing Active Directory identities, extending the same access policies and audit attribution that apply to employees.</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/workspaces/ai-agents/\">Amazon WorkSpaces for AI agents</a>. To get started building, see the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">documentation</a> and <a href=\"https://github.com/aws-samples/sample-code-for-workspaces-agent-access\">sample code on GitHub</a>. &nbsp;</p>"
  "ebe8ed015ac8e761ccb60dab83f4e9b2":
    "id": "ebe8ed015ac8e761ccb60dab83f4e9b2"
    "title": "capability-insights-aws"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/capability-insights-aws/"
    "published": "2026-07-01 02:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Announcing Capability Insights for AWS, an open-source solution for regional capabilities</p> \n<p>Today, AWS announces the launch of Capability Insights, an open-source solution that enables you to deploy regional capabilities data inside your own Amazon Virtual Private Cloud (VPC). This self-hosted dashboard addresses the needs of teams building multi-Region architectures requiring regional capabilities data deployed as infrastructure they own, inside their network, and under their governance. The solution is designed for organizations with data residency requirements, compliance teams needing internal reporting, and teams planning regional expansion or multi-Region recovery strategies.</p> \n<p>The dashboard auto-refreshes every 24 hours with AWS capabilities data across all Regions, covering services, features, API operations, and CloudFormation resource types. The Workload Analysis component scans your AWS CloudTrail logs and AWS CloudFormation stacks to filter 200+ services down to the number of services your account actually uses, reducing multi-week gap analysis to quick reviews. All data remains within your VPC perimeter, supporting compliance and data residency requirements while providing full ownership and control over the infrastructure hosting the regional capabilities data.</p> \n<p>&nbsp;</p>"
  "c9d02fd4d10a2ac9738b511f20a242cb":
    "id": "c9d02fd4d10a2ac9738b511f20a242cb"
    "title": "Amazon SageMaker AI cuts generative AI inference scale-out time by up to half with automatic container image caching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/sagemakerai-inf-scale-out-time"
    "published": "2026-07-01 01:31:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon SageMaker Inference now supports container image caching, enabling up to 2x faster end-to-end scaling for generative AI models during scale-out events. When your endpoint scales out, the service pre-caches your container image so new instances can start serving traffic faster, without waiting for large container images to be pulled from Amazon ECR.<br /> <br /> Generative AI workloads typically use large container images (10 GB or more) for deep learning frameworks and model serving. Previously, every new instance launched during scale-out had to pull the full image from ECR, adding several minutes of cold-start latency. Container image caching eliminates this bottleneck by pre-pulling the image so new instances launch with the container already available locally. Customers don't need to make any changes. The service automatically caches whatever image URI is specified in your endpoint or inference component configuration. This capability supports accelerator instance types, single-model endpoints, and inference component-based endpoints.<br /> <br /> With this launch, SageMaker Inference now offers a comprehensive scaling optimization suite for generative AI: sub-minute concurrency metrics for up to 6x faster load detection, instance-store container caching for faster scaling on existing instances, and container image caching for up to 2x faster scaling on new instances.<br /> <br /> Container image caching is available in all AWS commercial regions where SageMaker Inference is supported. To learn more, visit the <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-container-caching-in-amazon-sagemaker-ai-for-faster-model-scaling/\">launch blog</a>.</p>"
  "e37f8aef69c8377f110d6146585f18ee":
    "id": "e37f8aef69c8377f110d6146585f18ee"
    "title": "IAM Identity Center now enables programmatic AWS account access for customer managed applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-iam-identity-center-account-access-customer-managed-apps/"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>IAM Identity Center now enables customer managed applications to programmatically access AWS accounts on behalf of their users, including the ability to discover accounts and roles assigned to a user and retrieve temporary credentials required for AWS account access.</p> \n<p>If you have a customer managed application that authenticates users through an external identity provider (IdP), you can configure that IdP as a <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/using-apps-with-trusted-token-issuer.html\">trusted token issuer (TTI)</a> in IAM Identity Center. With this launch, you can now enable AWS account access for this application.&nbsp;Users who have already signed in through the IdP can access their assigned AWS accounts and obtain temporary security credentials for their authorized roles without a separate authentication flow.&nbsp;This eliminates redundant sign-in prompts that previously required users to re-authenticate even after signing in through their external identity provider.</p> \n<p>This feature is available for organization instances of IAM Identity Center. IAM Identity Center administrators must explicitly enable AWS account access for each customer managed application. Only management account administrators or delegated administrators can enable this capability, ensuring centralized governance over which applications can access account-level resources.</p> \n<p>This feature is available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the China Regions. To get started, navigate to the IAM Identity Center console, select your customer managed application, and enable AWS account access. For more information, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/enable-account-access-customer-managed-apps.html\">Enable AWS account access for customer managed applications</a> in the IAM Identity Center User Guide.</p>"
  "97da56fa11d4aea890693756bda1e56c":
    "id": "97da56fa11d4aea890693756bda1e56c"
    "title": "Claude Sonnet 5 now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/claude-sonnet-5-now-available-on-aws"
    "published": "2026-07-01 01:00:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>AWS now offers Claude Sonnet 5 - Anthropic's most capable Sonnet model and the first Sonnet model of Anthropic’s latest generation - bringing top-tier intelligence at Sonnet pricing for coding, agents, and everyday professional work at scale.</p> \n<p>Claude Sonnet 5 delivers strong performance across coding, professional work, and agentic tasks while maintaining the balance of capability, cost, and speed that teams get from Sonnet. For coding, it navigates large codebases, lands multi-file changes, and carries debugging and refactoring tasks through to completion with fewer rounds of correction. For agents, it calls tools precisely, holds state across many steps, and recovers from errors so more runs finish correctly the first time. For knowledge work, it builds spreadsheets, drafts documents, and turns unstructured material into structured analysis.&nbsp;</p> \n<p>Customers have two ways to access Claude Sonnet 5: Amazon Bedrock and Claude Platform on AWS.</p> \n<p>Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Sonnet 5 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>.&nbsp;</p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\">Claude Platform on AWS documentation</a>.</p>"
  "bb72db2c9b5ae76d027a18fae20a0d20":
    "id": "bb72db2c9b5ae76d027a18fae20a0d20"
    "title": "Amazon SageMaker AI now supports serverless model customization for Gemma 4 models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-sagemaker-ai-gemma-4/"
    "published": "2026-07-01 00:30:00"
    "fetched": "2026-07-01 04:49:42"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Gemma 4 E4B and 31B models using supervised fine-tuning (SFT), direct preference optimization (DPO), and reinforcement fine-tuning (RFT). Gemma is a family of open models built by Google DeepMind. In addition to deploying these models on SageMaker AI, you can now adapt them to your specific domains and workflows. This launch also extends the variety of models available for serverless customization on SageMaker AI, including models from the Nova, Nemotron 3, Qwen, Llama, gpt-oss, and DeepSeek families.<br /> <br /> Model customization enables you to tailor these foundation models with your proprietary data, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or enhancing performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.<br /> <br /> Serverless model customization on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and EU (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
"last_updated": "2026-07-01 04:49:42 JST"
