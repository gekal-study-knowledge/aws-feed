    "published": "2026-07-01 01:37:09"
    "fetched": "2026-07-01 02:02:59"
    "summary": "In this post, we explore how Outpost VFX achieved 8x faster training speeds using AWS infrastructure to transform their face replacement workflow, the technical architecture they implemented to overcome single-GPU limitations, and the measurable results achieved through AWS multi-GPU training."
  "40dd4bd328d17869f4782be5a148b43d":
