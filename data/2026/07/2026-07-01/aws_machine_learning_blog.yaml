    "title": "Build generative UI for AI agents on Amazon Bedrock AgentCore with the AG-UI protocol"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-generative-ui-for-ai-agents-on-amazon-bedrock-agentcore-with-the-ag-ui-protocol/"
    "published": "2026-07-01 01:46:17"
    "fetched": "2026-07-01 02:02:59"
    "summary": "This post walks through how AG-UI integrates into the Fullstack AgentCore Solution Template (FAST) to build interactive agent frontends on Amazon Bedrock AgentCore. We then show how CopilotKit extends this with generative UI, shared state, and human-in-the-loop interactions, all deployed on Amazon Bedrock AgentCore."
  "ec1227c0eeb423fe95fc0e13d8023092":
    "id": "ec1227c0eeb423fe95fc0e13d8023092"
    "title": "Simplify multi-account access to Amazon Bedrock models with managed entitlements"
    "link": "https://aws.amazon.com/blogs/machine-learning/simplify-multi-account-access-to-amazon-bedrock-models-with-managed-entitlements/"
    "published": "2026-07-01 01:42:49"
    "fetched": "2026-07-01 02:02:59"
    "summary": "In this post, we show you how to use managed entitlements for Amazon Bedrock to subscribe once from a central account and distribute model access across your organization. This approach removes the need for AWS Marketplace permissions in workload accounts."
  "7aa306dc7b4d6937ce46fca3a3b81921":
    "id": "7aa306dc7b4d6937ce46fca3a3b81921"
    "title": "Implementing resilience patterns with Amazon Bedrock and LLM gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/implementing-resilience-patterns-with-amazon-bedrock-and-llm-gateway/"
    "published": "2026-07-01 01:40:47"
    "fetched": "2026-07-01 02:02:59"
    "summary": "In this post, you will learn five practical patterns for building resilient generative AI applications on AWS, progressing from native Amazon Bedrock features to multi-model orchestration using an LLM gateway. These patterns address real-world challenges such as quota exhaustion during unexpected traffic surges, maximizing availability through geographic distribution of inference, and helping prevent noisy neighbor problems in multi-tenant environments."
  "dbe3d7f5fabe6adb88dd94a0aae5a4ea":
    "id": "dbe3d7f5fabe6adb88dd94a0aae5a4ea"
    "title": "How Outpost VFX Uses AWS to Accelerate AI Model Training for Visual Effects"
