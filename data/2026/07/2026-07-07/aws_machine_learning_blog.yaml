  "249b76710394617ccfe25f23e16c95ff":
    "id": "249b76710394617ccfe25f23e16c95ff"
    "title": "Run MiniMax models on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/run-minimax-models-on-amazon-bedrock/"
    "published": "2026-07-07 02:00:44"
    "fetched": "2026-07-07 03:52:32"
    "summary": "In this post, we walk through how to get started with MiniMax models on Amazon Bedrock, including the capabilities supported by these models, the service tiers available, how on-demand inference scales to handle your workloads, and the different APIs you can use to access them. Using these models, customers can build agentic applications, long-context document analysis pipelines, and software engineering workflows, all backed by the security and operational guarantees of AWS."
  "21c25a558f63d31420144239baf5e1ac":
    "id": "21c25a558f63d31420144239baf5e1ac"
    "title": "Deploying Multi-Turn RL Infrastructure for Amazon Nova on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/deploying-multi-turn-rl-infrastructure-for-amazon-nova-on-amazon-sagemaker-hyperpod/"
    "published": "2026-07-07 01:58:13"
    "fetched": "2026-07-07 03:52:32"
    "summary": "In this post, you deploy a two-phase infrastructure for multi-turn RL using Amazon Nova Forge on Amazon SageMaker HyperPod. By the end, you have an event-driven pipeline that starts training when you upload data to Amazon Simple Storage Service (Amazon S3). The training job teaches the model to play Wordle, a placeholder for your own RL task."
  "2d25409b8f9b1fa6cdc9aa0467cd1a15":
    "id": "2d25409b8f9b1fa6cdc9aa0467cd1a15"
    "title": "Automatically redact PII in images with Amazon Nova"
    "link": "https://aws.amazon.com/blogs/machine-learning/automatically-redact-pii-in-images-with-amazon-nova/"
    "published": "2026-07-07 01:55:02"
    "fetched": "2026-07-07 03:52:32"
    "summary": "In this post, we present a multi-step pipeline directed by Amazon Nova, which uses its contextual vision reasoning to coordinate complementary tools, including Meta’s open-source Segment Anything Model (SAM 3) deployed on Amazon SageMaker AI for pixel-level segmentation, and Amazon Textract for optical character recognition (OCR). This pipeline is designed to provide comprehensive and compliant PII redaction even for challenging edge cases such as fingerprints, ID cards, or license plates in arbitrary orientations."
  "fef14140067d954b4e4bc1b11a83da6a":
    "id": "fef14140067d954b4e4bc1b11a83da6a"
    "title": "Streaming benchmark and recommendation results to MLflow with Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/streaming-benchmark-and-recommendation-results-to-mlflow-with-amazon-sagemaker-ai/"
    "published": "2026-07-07 01:53:38"
    "fetched": "2026-07-07 03:52:32"
    "summary": "In this post, you learn how to use the new MLflow integration with Amazon SageMaker AI optimized inference recommendation jobs and Amazon SageMaker AI benchmark jobs to automatically stream experiment data into a unified tracking interface. This integration streams metrics, parameters, and charts into your serverless Amazon SageMaker MLflow App in real time and you get a unified experiment tracking experience."
  "db1fa054d4678db831a564c7aeb94c11":
    "id": "db1fa054d4678db831a564c7aeb94c11"
    "title": "From Hugging Face to Amazon SageMaker Studio in one click"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-hugging-face-to-amazon-sagemaker-studio-in-one-click-2/"
    "published": "2026-07-07 07:35:55"
    "fetched": "2026-07-07 09:04:12"
    "summary": "Today, we’re excited to announce a deep-link integration between Hugging Face and Amazon SageMaker AI. Developers can now go from model discovery to hands-on experimentation in SageMaker Studio with a single selection."
  "925b4a961063a0416365ba73f19b27f0":
    "id": "925b4a961063a0416365ba73f19b27f0"
    "title": "Teaching models to forget: Selective unlearning with Amazon Nova"
    "link": "https://aws.amazon.com/blogs/machine-learning/teaching-models-to-forget-selective-unlearning-with-amazon-nova/"
    "published": "2026-07-07 07:23:45"
    "fetched": "2026-07-07 09:04:12"
    "summary": "In this post, we introduce Reverse Direct Preference Optimization (rDPO), the novel unlearning technique behind Amazon Nova Customizable Content Moderation Settings (CCMS), and show how it reduces over-deflection while preserving model quality. We also provide pointers for customers who want to apply these preference optimization techniques to their own experiments."
