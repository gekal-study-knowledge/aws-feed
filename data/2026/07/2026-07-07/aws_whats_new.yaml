  "e9e3012a129b17da4f22c3d55aa857e6":
    "id": "e9e3012a129b17da4f22c3d55aa857e6"
    "title": "AWS Certificate Manager now supports the ACME protocol for public certificates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-certificate-manager-acme/"
    "published": "2026-07-07 00:00:00"
    "fetched": "2026-07-07 01:16:49"
    "summary": "<p>AWS Certificate Manager (ACM) now allows you to provision a fully managed ACME server endpoint that issues public TLS certificates with a 45 day validity from <a href=\"https://www.amazontrust.com/repository\">Amazon Trust Services</a> using any ACMEv2-compatible client, including Certbot, cert-manager for Kubernetes, and acme.sh. With the CA/Browser Forum mandating 47-day certificate lifetimes by 2029, manual management of public certificates becomes untenable. ACME support in ACM gives developers a standards-based path to fully automate certificate issuance and renewal.<br /> <br /> PKI administrators can create managed ACME endpoints with centralized governance controls: define domain scopes to restrict which certificates each client can issue, enforce policies on wildcard usage, and delegate certificate requests to application teams without distributing DNS credentials. Domain validation is performed once at the endpoint level, while application owners use standard ACME clients to request certificates. All activity is visible in the ACM console with AWS CloudTrail logging and Amazon CloudWatch metrics for auditability.<br /> <br /> ACME support in ACM is available in all commercial AWS Regions. For pricing details, see the <a href=\"https://aws.amazon.com/certificate-manager/pricing/\">ACM pricing page</a>. To get started, visit the <a href=\"https://aws.amazon.com/blogs/aws/automate-public-tls-certificate-issuance-with-acme-support-in-aws-certificate-manager/\">AWS News blog post</a> or read the <a href=\"https://docs.aws.amazon.com/acm/latest/userguide/acm-acme.html\">documentation</a>.</p>"
  "4358b2c11fc0e25ff50b7adbe2f4d107":
    "id": "4358b2c11fc0e25ff50b7adbe2f4d107"
    "title": "Amazon EVS VCF 9.0 and 9.1 support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-evs-vcf9"
    "published": "2026-07-07 02:29:00"
    "fetched": "2026-07-07 05:50:06"
    "summary": "<p>Today, we are announcing that Amazon Elastic VMware Service (EVS) now supports VMware Cloud Foundation (VCF) 9.0 and 9.1.</p> \n<p>Amazon EVS lets you run the latest VCF software directly within your Amazon Virtual Private Cloud (VPC) on EC2 bare-metal instances. With this latest announcement, you now have complete control of the installation, operations, and management of the VMware virtualization solution running the VCF 9.0 and recently released VCF 9.1 versions. You can continue to use the same tools, processes, and skills on Amazon EVS that you use in your data center today, managing your VCF environment yourself or with an experienced AWS partner. With this, we’re also launching the <a href=\"https://github.com/aws/solutions-for-amazon-evs\">Solutions for EVS GitHub repository</a> with examples, templates, and infrastructure as code artifacts to help you get started.</p> \n<p>This release is available in all regions where Amazon EVS is offered.</p> \n<p>For more details, visit the <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/vmware-cloud-foundation-vcf-9-0-and-9-1-on-amazon-evs/\">launch blog</a>, the Amazon EVS <a href=\"https://aws.amazon.com/evs/\">product detail page</a> and <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide.</a>&nbsp;</p>"
  "bb76ee888f9dd65096f7266eb905634d":
    "id": "bb76ee888f9dd65096f7266eb905634d"
    "title": "CloudWatch Application Signals now automatically captures errors, performance anomalies, and deployment events"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/cloudwatch-service-events/"
    "published": "2026-07-07 00:00:00"
    "fetched": "2026-07-07 05:50:06"
    "summary": "<p>Today, AWS announces Service Events for Amazon CloudWatch Application Signals, which automatically captures exception and latency event snapshots, function-level performance data, and deployment events from instrumented services without additional code changes. Customers can now quickly identify whether a deployment has introduced new exceptions by navigating to CloudWatch &gt; Application Signals &gt; [Service] &gt; Errors in the CloudWatch console.</p> \n<p>Service Events is available to any application with CloudWatch Application Signals enabled. Customers instrument their applications with the ADOT SDKs or the Amazon CloudWatch Observability EKS add-on. Once Application Signals is active, Service Events begins capturing exception and latency event snapshots and deployment events automatically. Optionally, customers can gain deeper performance visibility by turning on function-call metrics.</p> \n<p>Service Events is available in all commercial AWS Regions. Supported languages are Java, Python, and JavaScript.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Signals-ServiceEvents.html\">Monitor service events</a> in the <i>Amazon CloudWatch User Guide</i>. Service Events data is captured as logs. Function call metrics are captured as OpenTelemetry metrics. Standard CloudWatch pricing applies. For details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing</a>.</p>"
  "00b5fa985d1358f021dab698a2fa371f":
    "id": "00b5fa985d1358f021dab698a2fa371f"
    "title": "Amazon SageMaker HyperPod now supports disaggregated prefill and decode"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/amazon-sagemaker-hyperpod-dpd/"
    "published": "2026-07-07 06:29:00"
    "fetched": "2026-07-07 07:10:30"
    "summary": "<p>Amazon SageMaker HyperPod now supports Disaggregated Prefill and Decode (DPD), an inference optimization that separates the two phases of large language model (LLM) inference — prefill and decode — onto dedicated GPU pools and transfers the key-value (KV) cache between them over Elastic Fabric Adapter (EFA) using GPU-Direct RDMA. Customers running LLMs in production for chat assistants, agentic pipelines, retrieval-augmented generation, and long-document analysis need consistent per-token latency and predictable throughput under mixed traffic, but when prefill and decode share the same GPU, a single long-context request can stall token generation for every concurrent request and force customers to over-provision one phase to protect the other.<br /> <br /> With DPD, customers run compute-bound prefill on one set of GPUs and memory-bandwidth-bound decode on another, so the two phases no longer contend for the same resources. This delivers more consistent per-token latency under sustained concurrency, higher goodput at strict latency SLOs, and the ability to scale prefill and decode capacity independently to match the input and output distribution of the workload. An intelligent router automatically directs long-context requests through the disaggregated path and sends shorter prompts directly to the decoder, so customers get the benefit on the traffic that needs it without paying transfer overhead on short prompts. Customers enable DPD by adding a `pdSpec` section to the same `InferenceEndpointConfig` custom resource they already use for inference endpoints on the HyperPod Inference Operator, and DPD is composable with the existing KV cache offloading and intelligent routing features on HyperPod.<br /> <br /> DPD is available for SageMaker HyperPod clusters using the EKS orchestrator on EFA-capable instance types in all AWS Regions where Amazon SageMaker HyperPod is available. To learn more, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-dpd.html\">Disaggregated Prefill and Decode for HyperPod inference</a>&nbsp;in the Amazon SageMaker AI Developer Guide.</p>"
  "6fbf61bb75637740a6d2bf63b2ca1f87":
    "id": "6fbf61bb75637740a6d2bf63b2ca1f87"
    "title": "Amazon Cognito now supports self-service provisioned API rate limits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/cognito-provisioned-limits"
    "published": "2026-07-07 06:00:00"
    "fetched": "2026-07-07 09:04:10"
    "summary": "<p>Amazon Cognito now allows you to increase or decrease your provisioned API rate limits on demand. Cognito has default rate limits for the maximum number of operations per second that you can perform in your user pools in each AWS Region, and you can purchase additional limits on adjustable API categories. With the new on-demand model, you can adjust your rate limits up or down more quickly to match your application’s traffic patterns.<br /> <br /> Previously, to adjust your Cognito API rate limits, you would request an increase through Service Quotas, where requests are manually reviewed. This meant you had to plan rate limits in advance ahead of anticipated traffic spikes. Now, you have a new self-service experience to set your desired Cognito rate limit up to the account-level max limit using the Amazon Cognito console or the new limit provisioning API operations. Rate limit changes take effect immediately.<br /> <br /> Self-service provisioned limits are available for <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/quotas.html#category_operations\">adjustable API categories</a> in all AWS Regions where Amazon Cognito is available. For pricing details of this add-on feature, see Amazon Cognito <a href=\"https://aws.amazon.com/cognito/pricing/\">pricing page</a>. To get started, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/quotas.html\">developer guide</a>.</p>"
  "d348484116758a8c33e86861a3c6394d":
    "id": "d348484116758a8c33e86861a3c6394d"
    "title": "Amazon SageMaker Studio now integrates with Hugging Face for one-click model deployment and customization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/sagemaker-studio-hugging-face-integration/"
    "published": "2026-07-07 05:30:00"
    "fetched": "2026-07-07 09:04:10"
    "summary": "<p>Amazon SageMaker Studio now supports direct integration from Hugging Face, letting you go from discovering a model to working with it inside a fully configured Studio environment in a single click. Select any supported model on Hugging Face and choose \"Customize on SageMaker AI\" or \"Deploy on SageMaker AI\" to land directly on the corresponding workflow page with the model pre-loaded and ready to use.</p> \n<p>Previously, getting from model discovery to a working environment required navigating the AWS Console to find SageMaker AI, configuring an environment, setting up IAM permissions for serverless model customization, and in many cases requesting GPU quota increases through Service Quotas before running a first job. Now, new customers complete a standard AWS sign-up and receive a SageMaker Studio environment created in seconds with pre-configured permissions for serverless model customization jobs including fine-tuning with custom reward functions for reinforcement learning, model evaluation, and deployment to SageMaker or Bedrock endpoints. Verified customers receive default GPU access to G5, G6, and G4dn instances across endpoint deployments, training jobs, and notebooks without requesting quota increases, and quota limit and utilization information is visible for each instance type directly inside the Studio environment. Returning customers signing in from Hugging Face or SageMaker product pages select their environment and land directly inside SageMaker Studio with the model ready to use.</p> \n<p>This feature is available in all AWS Commercial Regions where Amazon SageMaker Studio is supported. To get started, visit any supported model on <a href=\"https://huggingface.co/models\">Hugging Face</a> and select \"Customize on SageMaker AI\" or \"Deploy on SageMaker AI,\" or click Get Started from the <a href=\"https://aws.amazon.com/sagemaker/ai/studio/\">SageMaker Studio</a> page. To learn more, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-launch.html\">Service quotas for Studio</a>&nbsp;in the Amazon SageMaker documentation.</p>"
  "fa534438b60afa40fd0d5792a9fd81a5":
    "id": "fa534438b60afa40fd0d5792a9fd81a5"
    "title": "AWS Security Hub adds impact analysis for exposure findings"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/impact-analysis-aws-security-hub/"
    "published": "2026-07-07 06:45:00"
    "fetched": "2026-07-08 02:10:00"
    "summary": "<p>Today, AWS Security Hub adds impact analysis to exposure findings, helping security teams understand the full scope of what an attacker could reach if an exposure is exploited. Impact analysis extends exposure findings by mapping the downstream resources that could be compromised beyond the initially exposed resource, giving teams deeper visibility into organizational risk.<br /> <br /> Security Hub analyzes the effective permissions of IAM principals associated with exposed resources to identify privilege escalation paths to other resources in your account. The resulting scope of impact is displayed in the potential attack path graph, and a new Impact Assessment tab shows the prioritized chains of resources an attacker could traverse along with the specific permissions at each step. Security Hub factors the scope of impact into its severity scoring for exposure findings, and adjusts existing exposures as their scope of impact is identified or changes, so that exposures with greater downstream reach are prioritized appropriately.<br /> <br /> To learn more, see Understanding exposure findings in the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "c05632c07d5856678eb61ef61d845b9e":
    "id": "c05632c07d5856678eb61ef61d845b9e"
    "title": "Amazon EKS Auto Mode reduces GPU management fees by up to 60%"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-eks-auto-mode-gpu-price"
    "published": "2026-07-07 21:00:00"
    "fetched": "2026-07-08 06:20:05"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) Auto Mode now offers significantly reduced management fees for GPU and accelerated instance types. Beginning July 1, 2026, G-series Auto Mode management fees are reduced by 35%, and P-series and AWS Trainium fees are reduced by 60%. These reductions apply automatically to all EKS Auto Mode clusters and no action is required from customers already using GPU instances with Auto Mode.</p> \n<p>EKS Auto Mode simplifies Kubernetes operations by automatically provisioning and managing infrastructure for machine learning inference, fine-tuning, rendering, and batch processing workloads. It includes capabilities built for accelerated workloads: automatic parallel image pulling and unpacking on GPU instances with local NVMe storage, so large container and model images start faster, and accelerator-aware node repair that detects GPU hardware failures and automatically replaces unhealthy nodes. With today's price reduction, customers can run GPU workloads on Auto Mode at lower management fees, making its fully managed infrastructure more cost-effective.</p> \n<p>This pricing update is available in all AWS Regions where EKS Auto Mode is available. Amazon ECS is implementing identical management fee reductions for GPU instances on ECS Managed Instances. See the ECS What's New post for details.</p> \n<p>To get started with GPU workloads on EKS Auto Mode, see the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/ml-on-eks.html\">EKS for AI/ML documentation</a>. For the complete updated rate table, see <a href=\"https://aws.amazon.com/eks/pricing/\">Amazon EKS pricing</a>.</p>"
  "13862d2d2d82dc2c6dfb4e4b9232a4b0":
    "id": "13862d2d2d82dc2c6dfb4e4b9232a4b0"
    "title": "AWS introduces declarative controls for VPC Encryption Controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/vpc-encryption-controls-declarative-controls/"
    "published": "2026-07-07 03:19:00"
    "fetched": "2026-07-08 06:20:05"
    "summary": "<p>You can now use declarative policies to turn on VPC Encryption Controls in monitor or enforce mode across all VPCs in your environment. This enhancement allows you to centrally define and manage your desired VPC Encryption Controls settings and apply it everywhere. You can exercise these controls for your account, organization or specific organizational unit.</p> \n<p>VPC Encryption Controls offers you simple tools to audit and enforce encryption in transit within and across Amazon Virtual Private Clouds (VPCs), and to demonstrate compliance with encryption standards such as HIPAA, FedRAMP, and PCI. Before today, customers would turn on Encryption Controls in monitor or enforce mode and set up exclusions on each VPC separately. Security teams often want to exercise these controls centrally and consistently across their environment. With this launch, you can define and maintain a single declarative policy to enforce your desired encryption controls settings across all existing and future VPCs. This enhancement also gives you central visibility into the Encryption Controls status of all accounts and VPCs in your organization.</p> \n<p>Declarative policies for VPC Encryption Controls are available in all AWS regions that support VPC Encryption Controls. There is no additional charge to use declarative policies in AWS Organizations. To learn more about this feature, see our <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-encryption-controls.html\">documentation</a>.</p> \n<p>&nbsp;</p>"
"last_updated": "2026-07-08 06:20:05 JST"
