"overview": |
  この日は Amazon Redshift の大型アップデートが集中しました。Graviton 搭載の新インスタンス RG が一般提供となり、RA3 比で最大 2.2 倍の性能を 30% 低いコストで実現、Iceberg クエリは最大 2.4 倍高速化します。あわせてクエリ起動最適化により初回クエリの P50 コンパイル時間が 4.3 秒から 170 ミリ秒へ短縮され、追加費用なしで既定有効になりました。マルチウェアハウス機能の強化や Tableau 統合、Bedrock を使った AI パフォーマンス推奨の構築方法も公開されています。SageMaker では HyperPod の Disaggregated Prefill and Decode 対応、Hugging Face からのワンクリック連携、Unified Studio の MWAA 環境インポートが追加されました。セキュリティ面では ACM が ACME プロトコルに対応し、Security Hub が露出検出に影響分析を追加、Cedar によるマルチエージェント連鎖の最小権限認可が解説されました。EKS Auto Mode は GPU 管理手数料を最大 60% 引き下げています。
