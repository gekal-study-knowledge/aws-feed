    "title": "AWS Console Home now supports the Cost and Usage widget in the AWS European Sovereign Cloud (Germany) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-console-home-cost-and-usage-eu-sovereign-cloud"
    "published": "2026-07-29 01:00:00"
    "fetched": "2026-07-29 03:10:32"
    "summary": "<p>AWS Console Home now supports the Cost and Usage widget in the AWS European Sovereign Cloud (Germany) Region, allowing customers to surface insights from Cost Explorer and Cost Optimization Hub on their Console Home dashboard.</p> \n<p>With the Cost and Usage widget, customers can track month-to-date and forecasted costs, identify savings opportunities, and see how their spend breaks down by service over time.</p> \n<p>To get started, sign in to the <a href=\"https://console.amazonaws-eusc.eu/\">AWS Management Console</a>, select Add widgets, and drag the Cost and Usage widget onto your Console Home dashboard. To learn more, see <a href=\"https://docs.aws.eu/awsconsolehelpdocs/latest/gsg/work-with-widgets.html\">Working with widgets in AWS Console Home documentation</a>.</p>"
  "c12e4222e95530da4ea6f393ba999b58":
    "id": "c12e4222e95530da4ea6f393ba999b58"
    "title": "Second-generation AWS Outposts racks now supported in the AWS Asia Pacific (Mumbai) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-outposts-asia-pacific-mumbai/"
    "published": "2026-07-29 01:00:00"
    "fetched": "2026-07-29 03:10:32"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the Asia Pacific (Mumbai) Region. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.<br /> <br /> Organizations from startups to enterprises and the public sector in and outside of India can now order their Outposts racks connected to this new supported region, optimizing for their latency and data residency needs. Outposts allows customers to run workloads that need low latency access to on-premises systems locally while connecting back to their home Region for application management. Customers can also use Outposts and AWS services to manage and process data that needs to remain on-premises to meet data residency requirements. This regional expansion provides additional flexibility in the AWS Regions that customers’ Outposts can connect to.<br /> <br /> To learn more about second-generation Outposts racks, read <a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\"><u>this blog post</u></a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\"><u>user guide</u></a>. For the most updated list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, check out the <a href=\"https://aws.amazon.com/outposts/rack/faqs/\"><u>Outposts rack FAQs page</u></a>.</p>"
  "91dc53d59a197b773437b2e463177389":
    "id": "91dc53d59a197b773437b2e463177389"
    "title": "Amazon EKS Provisioned Control Plane now delivers faster pod autoscaling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-eks-provisioned-control/"
    "published": "2026-07-29 02:18:00"
    "fetched": "2026-07-29 05:13:18"
    "summary": "<p><a href=\"https://aws.amazon.com/pm/eks\">Amazon EKS</a> now delivers faster pod autoscaling across all <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/eks-provisioned-control-plane.html\">Provisioned Control Plane</a> clusters by increasing <a href=\"https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/\">Horizontal Pod Autoscaler (HPA)</a> sync concurrency to up to 40 times the default Kubernetes value. This reduces the time it takes for HPA-driven workloads to scale in response to increased load, enabling faster responsiveness to demand.<br /> <br /> The Kubernetes Horizontal Pod Autoscaler (HPA) continuously monitors workload metrics and adjusts pod counts to match demand. In clusters running hundreds or thousands of HPA objects, the speed at which the Kubernetes control plane processes these objects determines how quickly workloads scale in response to changing demand. The HPA sync concurrency setting controls how many HPA objects the control plane evaluates in parallel. By increasing this value, Provisioned Control Plane clusters now process more HPA objects simultaneously, reducing the time between detecting increased load and scaling out pods.<br /> <br /> This enhancement is available to all customers using EKS Provisioned Control Plane and requires no configuration changes. To learn more about this enhancement, see EKS Provisioned Control Plane in the EKS <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/eks-provisioned-control-plane.html\">User Guide</a>.</p>"
  "6e9dc1c6e4616ec59f9004b675aa7dc8":
    "id": "6e9dc1c6e4616ec59f9004b675aa7dc8"
    "title": "Amazon EFS now supports cross-account Replication in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/amazon-efs-cross-account-replication-aws-gov-cloud-us"
    "published": "2026-07-29 21:00:00"
    "fetched": "2026-07-30 03:03:24"
    "summary": "<p><a href=\"https://aws.amazon.com/efs/\">Amazon EFS</a> now supports cross-account Replication in AWS GovCloud (US), allowing customers to replicate file systems between AWS accounts. EFS Replication enables you to easily maintain an up-to-date replica of your file system in the AWS GovCloud (US) Region of your choice. With this launch, EFS Replication customers can meet business continuity, multi-account disaster recovery, and compliance requirements by automatically keeping replicas of their file data in separate accounts.&nbsp;</p> \n<p>Customers often use multiple AWS accounts to help isolate and manage business applications and data for operational excellence, security, and reliability. Starting today, you can use EFS Replication to replicate your file system to another account in any AWS GovCloud (US) region. This eliminates the need to set up custom processes to synchronize EFS data across accounts, enhancing resilience and reliability in distributed environments.&nbsp;</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/efs/latest/ug/efs-replication.html\">Amazon EFS documentation</a> and get started by configuring EFS Replication in just a few clicks using the <a href=\"https://console.aws.amazon.com/efs\">Amazon EFS Console</a>, AWS CLI, AWS CloudFormation, and APIs.</p>"
