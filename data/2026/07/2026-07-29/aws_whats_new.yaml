    "summary": "<p><a href=\"https://aws.amazon.com/efs/\">Amazon EFS</a> now supports cross-account Replication in AWS GovCloud (US), allowing customers to replicate file systems between AWS accounts. EFS Replication enables you to easily maintain an up-to-date replica of your file system in the AWS GovCloud (US) Region of your choice. With this launch, EFS Replication customers can meet business continuity, multi-account disaster recovery, and compliance requirements by automatically keeping replicas of their file data in separate accounts.&nbsp;</p> \n<p>Customers often use multiple AWS accounts to help isolate and manage business applications and data for operational excellence, security, and reliability. Starting today, you can use EFS Replication to replicate your file system to another account in any AWS GovCloud (US) region. This eliminates the need to set up custom processes to synchronize EFS data across accounts, enhancing resilience and reliability in distributed environments.&nbsp;</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/efs/latest/ug/efs-replication.html\">Amazon EFS documentation</a> and get started by configuring EFS Replication in just a few clicks using the <a href=\"https://console.aws.amazon.com/efs\">Amazon EFS Console</a>, AWS CLI, AWS CloudFormation, and APIs.</p>"
  "fd2ab46eb0e8d7551d65f6fb16c37b6a":
    "id": "fd2ab46eb0e8d7551d65f6fb16c37b6a"
    "title": "AWS IAM Identity Center extends multi-Region support to Identity Center directory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-iam-identity-center-extends-multi-region-support-to-identity-center-directory"
    "published": "2026-07-29 16:00:00"
    "fetched": "2026-07-30 05:09:14"
    "summary": "<p>IAM Identity Center helps you configure the single sign-on experience of your workforce to AWS accounts and applications. You can now replicate IAM Identity Center from the primary AWS Region where you first enabled it to additional Regions of your choice when using Identity Center directory as your identity source. This extends the multi-Region support capability, previously available for Identity Center organization instances connected to external identity providers, to instances that use the Identity Center directory to manage and authenticate their workforce. This feature enhances resilience of user access to AWS accounts and helps you deploy AWS applications in the AWS Regions that best align with your business needs such as application data residency and proximity to users.</p> \n<p>When you enable this feature, IAM Identity Center automatically replicates your identities, entitlements, and other information from the primary Region to additional Regions. If IAM Identity Center is affected by a disruption in the primary Region, IAM Identity Center users continue to have access to their AWS accounts using the already provisioned entitlements in the additional Regions.&nbsp;</p> \n<p>AWS application administrators can use the standard application deployment workflow to deploy their application in an additional Region while you continue to administer IAM Identity Center in the primary Region.</p> \n<p>IAM Identity Center multi-Region support is currently available in the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-regions.html?refid=6e78b6f1-dfd8-49b4-ae84-4527ca1881cb#manage-acct-regions-regional-availability\">17 enabled-by-default commercial AWS Regions</a> for organization instances of IAM Identity Center. The IAM Identity Center organization instance must be configured with a multi-Region customer managed KMS key (CMK). To find out which AWS applications support deployment in additional Regions, visit <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/awsapps-that-work-with-identity-center.html?refid=6e78b6f1-dfd8-49b4-ae84-4527ca1881cb\">AWS applications that you can use with IAM Identity Center</a>. Standard <a href=\"https://aws.amazon.com/kms/pricing/\">AWS KMS charges apply</a> for storing and using CMKs. IAM Identity Center is provided at no additional cost. To learn more about IAM Identity Center, visit the <a href=\"https://aws.amazon.com/iam/identity-center/?c=sc&amp;sec=srvm&amp;trk=6e78b6f1-dfd8-49b4-ae84-4527ca1881cb&amp;sc_channel=ps\">product detail page</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\">IAM Identity Center User Guide</a>.</p>"
