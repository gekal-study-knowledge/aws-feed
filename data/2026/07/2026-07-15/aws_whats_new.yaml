"entries":
  "3d712c92d83f9fa828db0e8354f40928":
    "id": "3d712c92d83f9fa828db0e8354f40928"
    "title": "Amazon WorkSpaces Personal simplifies bulk PCoIP to DCV protocol migration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-workspaces-personal-pcoip/"
    "published": "2026-07-15 02:00:00"
    "fetched": "2026-07-15 04:13:08"
    "summary": "<p>Amazon WorkSpaces Personal now provides automated rollback and support for PCoIP to DCV protocol migration of stopped WorkSpaces, building on the recently launched console-based migration workflow and checkpoint snapshot support. These new capabilities enable administrators to migrate WorkSpaces at scale with minimal manual intervention.<br /> <br /> Amazon DCV is a high-performance streaming protocol built by AWS that powers Amazon WorkSpaces services. By migrating to DCV, customers gain access to broader operating system support including Windows 11 and Windows Server 2025, enhanced security features such as certificate-based authentication and WebAuthN redirection, and improved streaming performance. With this launch, if a protocol modification fails, the WorkSpace automatically rolls back to the pre-migration snapshot, ensuring it returns to a known healthy state without manual intervention. Additionally, administrators can now initiate migration for WorkSpaces in a stopped state, removing the need to manually start each stopped WorkSpace before modifying its protocol. This helps customers significantly speed up large scale migrations.<br /> <br /> These enhancements are available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> where Amazon WorkSpaces Personal is supported.<br /> <br /> To get started, sign in to the <a href=\"https://us-east-1.console.aws.amazon.com/workspaces/v2/home\">Amazon WorkSpaces console</a>. For more information, see <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/modify-workspaces.html#modify_protocols\">Modify protocols section</a> in the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html\">Amazon WorkSpaces Administration Guide</a>. To learn more about Amazon WorkSpaces, visit the <a href=\"https://aws.amazon.com/workspaces/\">Amazon WorkSpaces product page</a>.</p>"
  "c5ea70e8bdad96c8d7a004a4045baeb6":
    "id": "c5ea70e8bdad96c8d7a004a4045baeb6"
    "title": "AWS Security Hub now provides AI inventory for organization-wide visibility of AI assets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-security-hub-ai/"
    "published": "2026-07-15 02:00:00"
    "fetched": "2026-07-15 04:13:08"
    "summary": "<p>Today, AWS announces that AWS Security Hub now provides an AI inventory, giving central security teams a continuously updated, organization-wide view of AI assets and their security posture. As organizations rapidly deploy AI agents, models, and pipelines, security teams may lack visibility into what AI assets exist across their organization. Without centralized visibility connecting AI assets to active threats and misconfigurations, organizations cannot secure what they don't know exists.</p> \n<p>Security Hub AI inventory automatically discovers and catalogs AI workloads across your AWS environment through three discovery methods. For managed AI services, Security Hub inventories AWS Config resources from Amazon Bedrock, Bedrock AgentCore and Amazon SageMaker, with no additional configuration. For self-hosted AI workloads, Security Hub leverages the software bill of materials (SBOM) analysis from Amazon Inspector, which has been enhanced to identify inference endpoints, models and AI agents installed on Amazon EC2 instances and Amazon ECR container images, including frameworks such as Ollama, vLLM, Hugging Face TGI, and others. Security Hub also leverages Amazon GuardDuty DNS telemetry to discover external AI API endpoints (such as calls to third-party model providers) being accessed from your EC2 instances, revealing third-party AI dependencies that may not have been previously identified.</p> \n<p>&nbsp;Each discovered AI asset is mapped to its underlying infrastructure and correlated with security findings from across the AWS security stack, including threat findings from Amazon GuardDuty. Teams can filter, group, and query their AI inventory by account, resource type, discovery method, and specific model identity, enabling them to prioritize remediation based on which AI workloads are actively under threat and carry the highest organizational risk.</p> \n<p>AI Inventory is included with Security Hub Essentials at no additional cost and requires no new enablement. It is available in all AWS commercial Regions where Security Hub is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>.</p>"
  "cdd6400372bcd7fce9ebca25c9318a9b":
    "id": "cdd6400372bcd7fce9ebca25c9318a9b"
    "title": "Introducing Amazon GuardDuty AI Protection for AWS AI workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-guardduty-ai-protection-aws/"
    "published": "2026-07-15 04:00:00"
    "fetched": "2026-07-15 05:56:17"
    "summary": "<p>Amazon GuardDuty now offers AI Protection, expanding threat detection to AWS AI services including Amazon Bedrock and Amazon SageMaker. As organizations rapidly adopt AI, security teams may lack visibility into threats specifically targeting AI workloads, such as anomalous model invocations, cost harvesting attacks, and prompt injection attempts. GuardDuty AI Protection continuously monitors these workloads so security teams can detect and respond to AI-specific threats without manual configuration or custom tooling.</p> \n<p>GuardDuty AI Protection analyzes both CloudTrail management and data events from AWS AI services to identify suspicious activity, including unusual invocation patterns, cost harvesting attacks where threat actors force AI resources to consume excessive GPU time and tokens, and prompt injection attempts through integration with Amazon Bedrock Guardrails. Threat findings flow directly into AWS Security Hub, giving teams a single view of AI assets and threats for prioritized response. GuardDuty AI Protection can be enabled with a few steps in the GuardDuty or Security Hub console, and using AWS Organizations, can be centrally enabled for all accounts in an organization.</p> \n<p>GuardDuty AI Protection is available to GuardDuty customers with a 30-day free trial. For pricing details, visit the <a href=\"https://aws.amazon.com/guardduty/pricing/\">Amazon GuardDuty pricing page</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html\">Amazon GuardDuty User Guide</a> and the <a href=\"https://aws.amazon.com/guardduty/\">Amazon GuardDuty product page</a>. For the full list of supported Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "74ffcf4ed1e12dea3bf274e91b65cd82":
    "id": "74ffcf4ed1e12dea3bf274e91b65cd82"
    "title": "Amazon Aurora DSQL is now available in Europe (Spain)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-aurora-dsql-available-in-spain/"
    "published": "2026-07-15 02:00:00"
    "fetched": "2026-07-15 05:56:17"
    "summary": "<p>Starting today, Amazon Aurora DSQL is available for single-Region clusters in the Europe (Spain) Region. Aurora DSQL is the fastest serverless, distributed SQL database, with active-active high availability and multi-Region strong consistency. It enables you to build always-available applications with virtually unlimited scalability, the highest availability, and zero infrastructure management, making scaling and resilience effortless for your applications.<br /> </p> \n<p>With this launch, Aurora DSQL is available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>:&nbsp;US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Canada West (Calgary), South America (São Paulo), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Spain), Europe (Stockholm), Asia Pacific (Hong Kong), Asia Pacific (Melbourne), Asia Pacific (Mumbai), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), and Asia Pacific (Tokyo).<br /> <br /> Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank&amp;all-free-tier.sort-order=asc&amp;awsf.Free%20Tier%20Types=*all&amp;awsf.Free%20Tier%20Categories=categories%23databases\">AWS Free Tier</a>. To learn more, visit the Aurora DSQL <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage </a>and <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">documentation</a>.</p>"
  "1529bbda863dbcccae6ec0dd11d65467":
    "id": "1529bbda863dbcccae6ec0dd11d65467"
    "title": "AWS IAM Identity Center achieves FedRAMP Class C Certification"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-identity-center-fedramp/"
    "published": "2026-07-15 04:10:00"
    "fetched": "2026-07-15 06:56:02"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/identity-center/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS IAM Identity Center</a> is now in scope for FedRAMP Class C in the US East (Ohio), US East (N. Virginia), US West (N. California), and US West (Oregon) Regions. You can now use IAM Identity Center to enable workforce access to AWS accounts and applications that are subject to FedRAMP Class C compliance.</p> \n<p>The Federal Risk and Authorization Management Program (FedRAMP) is a US government-wide program that delivers a standard approach to the security assessment, certification, and continuous monitoring for cloud products and services. AWS IAM Identity Center is the recommended service for managing your workforce access to AWS accounts and applications.</p> \n<p>To learn more about <a href=\"https://aws.amazon.com/compliance/fedramp/\" rel=\"noopener noreferrer\" target=\"_blank\">FedRAMP</a>, visit the <a href=\"https://aws.amazon.com/compliance/services-in-scope/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS services compliance page</a> and <a href=\"https://aws.amazon.com/compliance/resources/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS compliance resources</a> page. To learn more about IAM Identity Center, visit the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html\" rel=\"noopener noreferrer\" target=\"_blank\">User Guide</a>.</p>"
  "30cc7545ec343dcba67a45d928448507":
    "id": "30cc7545ec343dcba67a45d928448507"
    "title": "AWS Elastic Disaster Recovery now supports Amazon EBS volume initialization rate"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-drs-fast-hydration/"
    "published": "2026-07-15 07:00:56"
    "fetched": "2026-07-15 07:55:03"
    "summary": "<p>AWS Elastic Disaster Recovery (AWS DRS) now supports the Amazon EBS volume initialization rate, helping recovered volumes reach full performance faster during drills and recoveries. When DRS restores EBS volumes from snapshots, the data loads from Amazon S3 in the background, and I/O to blocks that haven't loaded yet can be slower until initialization finishes. With this launch, you can set a volume initialization rate on your DRS-managed EC2 launch template, and DRS applies it automatically when it creates volumes during recovery — bringing your applications to full storage performance on a predictable timeline.</p> \n<p>This is especially valuable for I/O-intensive workloads such as databases, where fast, consistent storage performance is critical to meeting your recovery time objectives. You set the rate once on the launch template, and DRS preserves it across the updates it makes for rightsizing or disk changes. If the rate cannot be applied for a given recovery, DRS completes recovery without it, so your recovery is never blocked.</p> \n<p>AWS DRS support for the EBS volume initialization rate is available in all AWS Regions and environments where the EBS volume initialization rate is offered. You are charged per GB based on the full snapshot size and the rate you specify; for details, see <a href=\"https://aws.amazon.com/ebs/pricing/\">Amazon EBS pricing</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/drs/\">AWS Elastic Disaster Recovery User Guide</a>.</p>"
  "ce833a82bf2eb8e68dbf23da9f0a25fb":
    "id": "ce833a82bf2eb8e68dbf23da9f0a25fb"
    "title": "AWS Elastic Disaster Recovery reduces recovery time for AWS-to-AWS workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-drs-fast-recovery/"
    "published": "2026-07-15 07:00:00"
    "fetched": "2026-07-15 07:55:03"
    "summary": "<p>AWS Elastic Disaster Recovery (AWS DRS) now recovers your AWS-based workloads faster. For source servers running on Amazon EC2, DRS can now skip preparation steps that these workloads no longer need, reducing recovery time by up to 65% for Windows and up to 40% for Linux.</p> \n<p>During a disaster or a drill, every minute matters. Because workloads already running on AWS come with AWS-compatible drivers and configuration, DRS can launch them with fewer steps — helping you bring applications back online sooner and with greater confidence. Networking, drivers, and licensing are still applied automatically, so recovery stays simple and hands-off. You remain in control: turn on faster recovery across your whole account or for individual servers and change the setting whenever your needs change.</p> \n<p>This capability is available in all AWS Regions where AWS DRS is offered, at no additional cost. To learn more, visit the <a href=\"https://docs.aws.amazon.com/drs/\">AWS Elastic Disaster Recovery User Guide</a>.</p>"
  "887f553af1c675806637fc76b76978ca":
    "id": "887f553af1c675806637fc76b76978ca"
    "title": "Amazon Managed Service for Apache Flink now offers AI Agent Skills to simplify building and operating Flink applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-service-flink-agent-skills/"
    "published": "2026-07-15 03:20:00"
    "fetched": "2026-07-15 07:55:03"
    "summary": "<p>Amazon Managed Service for Apache Flink now offers AI Agent Skills that give AI coding assistants expert, up-to-date guidance for building and operating Flink applications. The skills provide expert guidance for common tasks such as creating applications, troubleshooting, scaling, monitoring, networking configuration, and cost optimization.</p> \n<p>Customers can leverage these skills to keep Flink applications healthy and performant, accelerate development of new streaming applications, and easily upgrade to latest versions of Apache Flink like Flink 2.2. The skills turn tasks that once required specialized Apache Flink knowledge into a guided experience developers can complete on their own.</p> \n<p>You can use the Managed Service for Apache Flink skills with your existing AI coding agent, including Kiro, Claude Code, or Cursor. To get started, configure the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/what-is-agent-toolkit.html?refid=ee1fe04d-2569-460e-88fb-d67e6d0ef979\">Agent Toolkit for AWS</a> using the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/aws-cli.html?refid=ee1fe04d-2569-460e-88fb-d67e6d0ef979\">AWS CLI</a>, then ask your coding agent a question, such as <i>\"How do I create a new Flink application on MSF?\"</i> or <i>\"My Flink application is unhealthy — what's wrong?\"</i></p>"
  "0fd5a8e58ca59c38b86863ea5dcd6edb":
    "id": "0fd5a8e58ca59c38b86863ea5dcd6edb"
    "title": "AWS Lambda console provides a one-click setup prompt for coding agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-lambda-prompt-coding-agents/"
    "published": "2026-07-15 05:00:00"
    "fetched": "2026-07-15 08:50:36"
    "summary": "<p>AWS Lambda console now provides a one-click setup prompt for coding agents that configures your agent with AWS Serverless skills and the Serverless Model Context Protocol (MCP) server, embedding serverless best practices from the start. This setup is available on the Lambda console wherever the developers start their Lambda journey: whether they are getting started with Lambda, exploring its capabilities, or have created their first function.</p> \n<p>Developers use coding agents to build, test, and deploy Lambda functions, but setting up an agent for serverless development previously required navigating across multiple documentation pages to find the right configuration. The one-click setup prompt eliminates this friction as it provides a prompt that instructs the agent to install AWS Serverless skills (hosted in <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\" rel=\"noopener noreferrer\" target=\"_blank\">Agent Toolkit for AWS</a>) and the Serverless MCP server directly in the developer's preferred coding agent. The prompt references the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/samples/aws-lambda-agent-setup.md\" rel=\"noopener noreferrer\" target=\"_blank\">Lambda agent setup guide</a>, which includes installation commands for Claude Code, Kiro, Cursor, GitHub Copilot, Codex, Devin Desktop, and OpenCode, for the AWS Serverless skills, three specialized Lambda skills (MicroVM, Managed Instances, durable functions), and Serverless MCP server configuration. If a developer does not have local AWS authentication configured, the prompt guides them to connect using the signing-in-to-aws skill.</p> \n<p>This capability is available in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?refid=2abe6167-e3db-40c4-a9fa-b283e7b4d7c8\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a>&nbsp;(except Middle East (Bahrain) and Middle East (UAE)) and AWS GovCloud (US) Regions where Lambda is available. Get started by visiting the <a href=\"https://console.aws.amazon.com/lambda\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda console</a> or learn more in the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/samples/aws-lambda-agent-setup.md\" rel=\"noopener noreferrer\" target=\"_blank\">Lambda agent setup guide</a>.</p> \n<p>&nbsp;</p>"
  "80262ffc5b437d2b5bc014ddebabba5e":
    "id": "80262ffc5b437d2b5bc014ddebabba5e"
    "title": "AWS Lambda announces self-managed code storage"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/lambda-self-managed-code-storage/"
    "published": "2026-07-15 16:00:00"
    "fetched": "2026-07-15 21:11:44"
    "summary": "<p><a href=\"https://aws.amazon.com/lambda/\">AWS Lambda</a> now supports self-managed Amazon S3 buckets for code storage,&nbsp;enabling you to reference source code directly from your own S3 buckets without Lambda creating intermediate copies. This eliminates code storage limits and reduces function activation time after function creates and updates by removing the copy step.</p> \n<p>AWS Lambda is a serverless compute service that runs your code without requiring you to manage servers. Customers who deploy many functions and additional code as Lambda layers often need more than 75GB of code storage per Region, requiring support tickets to increase this quota. Previously, Lambda always copied your deployment package to Lambda-managed storage during function and layer creation, counting against this limit. Now, with self-managed code storage, Lambda references your code directly in your Amazon S3 bucket without creating a copy, so you can store as much function and layer code as your bucket allows. You maintain a single source of truth for your deployment packages in your own account. No additional Lambda charges apply for self-managed storage; you only pay for standard Amazon S3 storage and, where applicable, cross-Region data transfer rates. In addition,&nbsp;Lambda has increased the default limit for Lambda-managed code storage from 75GB to 300GB per Region per account.</p> \n<p>Self-managed Amazon S3 code storage is available in all commercial AWS Regions.</p> \n<p>To get started, set the `S3ObjectStorageMode` parameter to `REFERENCE` when creating or updating functions and layers through the AWS CLI, AWS CloudFormation, AWS SAM, or AWS SDKs. You must grant the Lambda service principal `s3:GetObject` and `s3:GetObjectVersion` permissions on your S3 bucket. You can also update a function to use self-managed code storage via the Lambda Console. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/configuration-self-managed-storage.html\">AWS Lambda Developer Guide</a>.</p>"
  "710db93d556d0a269df975263ce67fae":
    "id": "710db93d556d0a269df975263ce67fae"
    "title": "Amazon CloudWatch announces lookup processor for log enrichment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-cloudwatch-lookup-processor/"
    "published": "2026-07-15 07:00:00"
    "fetched": "2026-07-16 01:17:31"
    "summary": "<p>Amazon CloudWatch now supports lookup processor, enabling you to enrich log events with additional context by matching fields in your logs against a lookup table directly within your&nbsp;CloudWatch Pipeline.</p> \n<p>With the lookup processor, you can upload CSV files containing reference data and configure your pipeline to match incoming log fields against this data to add enriched metadata. For example, you can upload a CSV mapping IP addresses to application teams and automatically tag VPC Flow Logs with team ownership information as logs are ingested. The lookup processor matches fields in your log events against fields in a lookup table and adds specified fields from matching rows to your log events. This enables data enrichment scenarios such as mapping user IDs to user details, product codes to product information, or error codes to human-readable error descriptions, thereby eliminating the need to build and maintain custom enrichment logic outside of CloudWatch. By enriching logs at ingestion time, your queries, dashboards, and alarms immediately benefit from the added context without any post-processing.</p> \n<p>The lookup table processor is available in all AWS commercial regions that support Amazon CloudWatch pipelines. You can add a lookup processor to your pipeline using the AWS Management Console, AWS CLI, or AWS SDKs. To get started, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/transformation-processors.html#lookup-processor\">documentation.</a></p>"
  "a799ea631889307579240e748d7a61bd":
    "id": "a799ea631889307579240e748d7a61bd"
    "title": "Amazon EC2 M8in, M8idn, M8ib, M8idb instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/m8in-m8idn-m8ib-m8idb-new-regions"
    "published": "2026-07-15 05:00:00"
    "fetched": "2026-07-16 01:17:31"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M8in, M8idn network optimized, and M8ib, M8idb EBS optimized instances are available in the AWS US East (Ohio), Europe (Ireland), and Asia Pacific (Tokyo) regions. The new instances are powered by custom sixth generation Intel Xeon Scalable processors available only on AWS and deliver up to 43% higher performance compared to previous generation instances. These instances also feature the latest sixth generation AWS Nitro cards.</p> \n<p>M8in, M8idn instances deliver 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances, and are ideal for workloads such as real-time big data analytics, distributed web scale in-memory caches, caching fleets for AI/ML clusters, and Telco applications such as 5G User Plane Function (UPF).&nbsp;<br /> &nbsp;<br /> M8ib, M8idb instances deliver up to 300Gbps EBS bandwidth, the highest among non-accelerated compute EC2 instances, and are best suited for workloads that benefit from high block storage performance, such as high-performance file systems and NoSQL databases.</p> \n<p>M8idn instances are ideal for network-intensive workloads that benefit from low-latency local storage, such as distributed compute, data analytics, and high-performance file systems. M8idb instances are ideal for storage-intensive workloads such as large commercial databases, data lakes, and NoSQL databases that benefit from both high EBS throughput and low-latency local NVMe storage.&nbsp;</p> \n<p>M8in, M8idn, M8ib, M8idb instances are available in US East (N. Virginia, Ohio), US West (Oregon), Europe (Ireland), Asia Pacific (Tokyo), and Europe (Spain) regions, via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\">Amazon EC2 M8i instance</a> page.</p>"
  "124d54aa6a3e8a67c22f2f0ff039a34b":
    "id": "124d54aa6a3e8a67c22f2f0ff039a34b"
    "title": "Amazon OpenSearch Service now supports the Agent Toolkit for AWS with a curated skill"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-opensearch-service-agent/"
    "published": "2026-07-15 23:44:00"
    "fetched": "2026-07-16 03:02:24"
    "summary": "<p>Amazon OpenSearch Service now integrates with the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\">Agent Toolkit for AWS</a>, enabling you to build, manage, and query OpenSearch Service domains and OpenSearch Serverless collections directly from AI coding agents such as Claude Code, Kiro, and Cursor. The integration is powered by the AWS MCP (Model Context Protocol) server, which executes AWS API calls on your behalf, paired with the curated <i>amazon-opensearch-service</i> skill that automatically routes natural-language requests to the right capability.<br /> <br /> With this skill, you can describe a goal in plain language and the agent handles the rest across five areas. <b>Migration</b> moves you from self-managed OpenSearch into OpenSearch Service or OpenSearch Serverless. <b>Operations</b> provisions and manages domains and collections. <b>Search</b> builds vector, semantic, hybrid, and RAG search. <b>Log analytics</b> analyzes logs with PPL and OpenSearch Ingestion. <b>Trace analytics</b> investigates distributed traces with OpenTelemetry. The integration works with both managed domains and collections across all versions, requires no changes to your existing infrastructure, and is available at no additional charge. To learn more about these capabilities, see our <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/amazon-opensearch-service-skill.html\">documentation</a>.<br /> <br /> Support is available in all AWS Regions where Amazon OpenSearch Service and OpenSearch Serverless are offered. To get started, install the aws-data-analytics plugin in your agent — it bundles the AWS MCP Server configuration and the OpenSearch skill in a single step. For setup instructions, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/aws-mcp-server.html\">MCP Server and Agent Skills</a>.&nbsp;</p>"
  "f32074daaf5cfa42d14c2af04bab9d8b":
    "id": "f32074daaf5cfa42d14c2af04bab9d8b"
    "title": "Amazon RDS for Db2 is now available in additional AWS Commercial regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-db2-available-additional-aws-commercial-regions"
    "published": "2026-07-15 16:39:00"
    "fetched": "2026-07-16 05:04:49"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/db2/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for Db2</a> is now available in the Asia Pacific (Thailand), Asia Pacific (Malaysia), Asia Pacific (Taipei), Mexico (Central), and Canada West (Calgary) Regions. Amazon RDS for Db2 makes it easy to set up, operate, and scale Db2 databases in the cloud. Customers can deploy a Db2 database in minutes with automatically configured parameters for optimal performance. For databases setup with Multi-AZ configuration, Amazon RDS performs synchronous replication to a standby instance in a different Availability Zone to provide high availability. <br /> <br /> To use Amazon RDS for Db2, customers can purchase a Db2 license from the AWS Marketplace for hourly, pay-as-you-go pricing, or use Bring Your Own License (BYOL). Both hourly and BYOL licensing are available in Standard and Advanced Editions. You can also choose to use the latest Db2 Community Edition that provides all the features available in Standard and Advanced Editions, with no commercial software licensing charges for development and test applications. This allows you to easily start developing and testing Db2 applications with a managed database service without worrying about software licensing. <br /> <br /> To learn more about Amazon RDS for Db2, refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Db2.html\" target=\"_blank\">documentation</a> and <a href=\"https://aws.amazon.com/rds/db2/pricing/\" target=\"_blank\">pricing</a> pages.<br /> </p> \n<p>&nbsp;</p>"
  "7c177811dabdf329facb41d5937d1c5a":
    "id": "7c177811dabdf329facb41d5937d1c5a"
    "title": "Connect Customer Outbound Campaigns now in Cape Town Africa"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/connect-africa-cape-town/"
    "published": "2026-07-15 04:00:00"
    "fetched": "2026-07-17 01:18:17"
    "summary": "<p>Connect Customer Outbound Campaigns digital channels (SMS, WhatsApp, and email) are now available in the Africa (Cape Town) Region. Businesses in the Region can now use Connect Customer's proactive outreach capabilities to create targeted, personalized engagement campaigns for service updates, promotional offers, appointment reminders, and product usage tips. Organizations configure and manage these campaigns through the Connect Customer admin website and Outbound Campaigns APIs.</p> \n<p>A retail business in the Region can segment customers by purchase behavior, then run a coordinated campaign that sends promotional offers over SMS, appointment reminders over WhatsApp, and product usage tips over email, with each message personalized to the recipient. Built-in analytics show which messages drove engagement, and event-based triggers start campaigns automatically from customer actions such as a completed purchase or a missed appointment.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/outbound-campaigns.html\">Outbound campaigns in the Amazon Connect Administrator Guide</a>. To get started, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer product page</a>. For all Regions where Connect Customer Outbound Campaigns is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p>"
"last_updated": "2026-07-17 01:18:17 JST"
