"overview": |
  この日は AI ワークロードそのものを守るセキュリティ機能が揃いました。Amazon GuardDuty AI Protection が登場し、脅威検出の対象が Amazon Bedrock や SageMaker といった AWS の AI サービスへ拡大されました。AWS Security Hub は組織全体の AI 資産を継続的に把握する AI インベントリを追加し、あわせて Microsoft Azure を含むマルチクラウド対応と AI ワークロード保護も発表されています。AWS WAF Bot Control では正規の AI エージェントトラフィックを認証する手法が解説されました。開発体験では Lambda コンソールにコーディングエージェントのワンクリックセットアップが追加され、Managed Service for Apache Flink と OpenSearch Service は Agent Toolkit for AWS のスキルとして利用できるようになっています。運用面では CloudWatch Logs のルックアッププロセッサによるログ拡充、Elastic Disaster Recovery の復旧時間短縮、Lambda の自己管理コードストレージが追加されました。
