  "4f69fc98363d6051dc99ce978078c5dc":
    "id": "4f69fc98363d6051dc99ce978078c5dc"
    "title": "Kiro でテスト駆動開発（TDD）：こうあるべき体験"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-how-tdd-should-feel/"
    "published": "2026-07-15 19:51:32"
    "fetched": "2026-07-15 21:11:45"
    "summary": "私のキャリアの初期に、所属していた組織は、コード品質の向上と自信を持ってリファクタリングできる体制づくりのために、本格的にユニットテストを導入するという正しい判断を下しました。私たちは テスト駆動開発（TDD） の導入を試みました。その利点は理解していたものの、TDD を実践する作業自体が負担に感じられ、エンジニアたちにこの手法を一貫して適用してもらえませんでした。私自身、TDD というアイデアは大好きでしたが、実際の作業は嫌いでした。本記事では、Kiro を使って TDD を実践する方法を紹介し、red-green-refactor サイクルに沿ったテストを手作業で書くという苦痛を伴うことなく、TDD の恩恵を受ける方法をお見せします。"
