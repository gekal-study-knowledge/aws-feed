    "title": "Amazon Corretto July 2026 Quarterly Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-corretto-july-2026-quarterly-updates"
    "published": "2026-07-23 03:00:00"
    "fetched": "2026-07-23 04:09:10"
    "summary": "<p>On July 22, 2026, Amazon announced quarterly security and critical updates for Amazon Corretto Long-Term Support (LTS) and Feature Release (FR) versions of OpenJDK. Corretto 26.0.2, 25.0.4, 21.0.12, 17.0.20, 11.0.32, and 8u502 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK.<br /> <br /> Starting with this release, the default Amazon Corretto Docker images are based on Amazon Linux 2023. Amazon Linux 2 images will continue to be provided as non-default options for customers who cannot yet migrate.<br /> <br /> JavaFX binaries are no longer included with Corretto 8 starting from this release. You can learn more about the migration recommendations at <a href=\"https://github.com/corretto/corretto-8/issues/569\">Corretto 8 GitHub</a>.<br /> <br /> Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 26, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.<br /> <br /> Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
"last_updated": "2026-07-23 04:09:10 JST"
