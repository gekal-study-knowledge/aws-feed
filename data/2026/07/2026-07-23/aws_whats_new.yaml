  "fea0b6b2e4824e04b24725daa35baab0":
    "id": "fea0b6b2e4824e04b24725daa35baab0"
    "title": "Amazon Corretto July 2026 Quarterly Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-corretto-july-2026-quarterly-updates"
    "published": "2026-07-23 03:00:00"
    "fetched": "2026-07-23 04:09:10"
    "summary": "<p>On July 22, 2026, Amazon announced quarterly security and critical updates for Amazon Corretto Long-Term Support (LTS) and Feature Release (FR) versions of OpenJDK. Corretto 26.0.2, 25.0.4, 21.0.12, 17.0.20, 11.0.32, and 8u502 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK.<br /> <br /> Starting with this release, the default Amazon Corretto Docker images are based on Amazon Linux 2023. Amazon Linux 2 images will continue to be provided as non-default options for customers who cannot yet migrate.<br /> <br /> JavaFX binaries are no longer included with Corretto 8 starting from this release. You can learn more about the migration recommendations at <a href=\"https://github.com/corretto/corretto-8/issues/569\">Corretto 8 GitHub</a>.<br /> <br /> Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 26, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.<br /> <br /> Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "5e82f340d6e1b13d3d8043255d144dd7":
    "id": "5e82f340d6e1b13d3d8043255d144dd7"
    "title": "AWS Network Load Balancer now supports Listener Rules for custom traffic routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-network-load-balancer-supports-listener-rules/"
    "published": "2026-07-23 04:13:00"
    "fetched": "2026-07-23 06:01:26"
    "summary": "<p>Network Load Balancer (NLB) now supports listener rules allowing you to route connections to different target groups based on the source IP address type. With listener rules, a single dual-stack NLB sends IPv6 client traffic to IPv6 targets and IPv4 client traffic to IPv4 targets, preserving the original client IP address end to end for both address families.<br /> <br /> Previously, serving both IPv4 and IPv6 clients from one NLB meant accepting a tradeoff: either run two separate load balancers (one per IP version) and split clients with DNS, or send all traffic to one target group and lose the original client IP through protocol translation. Listener rules remove that tradeoff by enabling conditional routing at Layer 3, directing each connection to a same-family target group with no translation and no additional infrastructure.<br /> <br /> You can add listener rules to existing dual-stack NLBs without recreating them. Rules are supported on TCP, UDP, TCP_UDP, and TLS listeners and work alongside existing NLB features including connection draining, target group stickiness, cross-zone load balancing, weighted target groups, and client IP preservation.<br /> <br /> Listener rules for Network Load Balancer are available in all AWS commercial Regions and the AWS GovCloud (US) Regions at no additional charge. Standard NLB pricing for load balancer hours and LCUs applies. To get started, see <a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/consolidate-dual-stack-architectures-with-listener-rules-for-network-load-balancer/\">this AWS blog</a>, and the <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">Network Load Balancer User Guide</a>.</p>"
  "9916a0981a30bc2f9f2ef814e6cb2991":
    "id": "9916a0981a30bc2f9f2ef814e6cb2991"
    "title": "AWS Lambda durable functions now supports customer managed key encryption"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/durablefunctions-cmk/"
    "published": "2026-07-23 03:30:00"
    "fetched": "2026-07-23 06:01:26"
    "summary": "<p>AWS Lambda durable functions now supports encryption of durable execution data with an AWS Key Management Service (AWS KMS) customer managed key. <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions</a>&nbsp;lets you build long-running, reliable workflows directly in your Lambda function code with automatic state management. Lambda encrypts execution state at rest by default with an AWS owned key.&nbsp;Now with support for AWS KMS, you can choose and manage the encryption key yourself.</p> \n<p>If you operate in regulated industries such as financial services or healthcare, your data governance policies may require customer-owned encryption keys. You can now configure a customer managed key for durable execution data, giving you control over key rotation and who can access execution history and state. The durable execution key operates independently of the function-level key that protects environment variables and SnapStart snapshots, so you can manage access to execution data separately from function configuration.</p> \n<p>This feature is available in all AWS Regions where Lambda durable functions is available. Standard AWS KMS charges apply for customer managed keys. There are no additional Lambda charges for this feature.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-encryption.html\">Encrypting Lambda durable execution data</a> in the AWS Lambda Developer Guide.&nbsp;</p>"
  "867dcd14f5f1ca404a40a87f34fdfd5e":
    "id": "867dcd14f5f1ca404a40a87f34fdfd5e"
    "title": "Amazon EC2 M8a instances now available in the Asia Pacific (Hyderabad) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-m8a-instances-asia-pacific-hyderabad-region/"
    "published": "2026-07-23 05:55:00"
    "fetched": "2026-07-23 07:58:02"
    "summary": "<p>Starting today, the general-purpose Amazon EC2 M8a instances are available in AWS Asia Pacific (Hyderabad) region. M8a instances are powered by 5th Gen AMD EPYC processors (formerly code named Turin) with a maximum frequency of 4.5 GHz, deliver up to 30% higher performance, and up to 19% better price-performance compared to M7a instances.<br /> <br /> M8a instances deliver 45% more memory bandwidth compared to M7a instances, making these instances ideal for even latency sensitive workloads. M8a instances deliver even higher performance gains for specific workloads. M8a instances are up to 60% faster for GroovyJVM benchmark, and up to 39% faster for Cassandra benchmark compared to Amazon EC2 M7a instances. M8a instances are SAP-certified and offer 12 sizes including 2 bare metal sizes. This range of instance sizes allows customers to precisely match their workload requirements.<br /> <br /> M8a instances are built using the latest sixth generation <a href=\"https://aws.amazon.com/ec2/nitro/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Nitro Cards</a> and ideal for applications that benefit from high performance and high throughput such as financial applications, gaming, rendering, application servers, simulation modeling, mid-size data stores, application development environments, and caching fleets.<br /> <br /> To get started, sign in to the AWS Management Console. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the Amazon EC2 <a href=\"https://aws.amazon.com/ec2/instance-types/m8a\" rel=\"noopener noreferrer\" target=\"_blank\">M8a instance page</a>.</p>"
  "c6c0f4a02a9154c6f9414ace5008f5fb":
    "id": "c6c0f4a02a9154c6f9414ace5008f5fb"
    "title": "AWS Entity Resolution now supports advanced real-time matching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-entity-resolution/"
    "published": "2026-07-23 04:00:00"
    "fetched": "2026-07-23 07:58:02"
    "summary": "<p>AWS Entity Resolution now supports real-time matching with advanced matching workflows, enabling customers to match records in milliseconds using complex rulesets through the GenerateMatchId API. Previously, real-time matching was limited to simple rule-based workflows, while advanced rulesets—which support operators like Exact and ExactManyToMany combined with AND/OR logic—could only be used for batch processing that took minutes to hours. This created a critical gap for customers needing real-time entity resolution with sophisticated matching logic.</p> \n<p>With this launch, customers performing fraud detection, real-time account lookup, or website personalization can define advanced matching rules and get results in real-time without maintaining separate matching infrastructure or re-architecting applications. To enable advanced real-time matching, customers set the enableRealTimeMatching parameter to true on their matching workflow, then call the existing GenerateMatchId API—no new endpoints or migration required.</p> \n<p>Advanced real-time matching is available in all <a href=\"https://aws.amazon.com/entity-resolution/faqs/\">AWS Regions</a> where AWS Entity Resolution is available.&nbsp;</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/entityresolution/latest/userguide/generate-match-id.html\">Using GenerateMatchId</a> in the AWS Entity Resolution User Guide.&nbsp;&nbsp;</p> \n<p>For more information about AWS Entity Resolution, visit the <a href=\"https://aws.amazon.com/entity-resolution/\">product page</a>.</p>"
  "bd48753620714b0d610264209a72922d":
    "id": "bd48753620714b0d610264209a72922d"
    "title": "AWS Organizations increases RCP quota to 2,000 per organization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-organizations-resource-control-policy-limit-increase-2000"
    "published": "2026-07-23 02:00:00"
    "fetched": "2026-07-23 07:58:02"
    "summary": "<p>AWS Organizations now supports up to 2,000 resource control policies (RCPs) per organization, doubling the previous limit of 1,000. RCPs enable centralized management of the maximum permissions available to resources across member accounts in your organization. This quota increase helps customers managing large, complex, multi-account environments define more granular resource access controls without encountering policy limits.&nbsp;</p> \n<p>With RCPs, you can restrict which external principals can access resources across your organization's member accounts, helping enforce organization-wide access control guidelines at scale — without updating individual resource-based policies. This is especially valuable for organizations that require fine-grained, centralized permission management across hundreds of accounts, where the previous 1,000-policy limit created barriers to sufficiently detailed access control configurations.&nbsp;</p> \n<p>The increased quota of 2,000 RCPs per organization is available at no additional cost in all AWS Regions where AWS Organizations is supported. No action is required — existing organizations automatically have access to the higher limit.&nbsp;<br /> &nbsp;To learn more about resource control policies and managing quotas in AWS Organizations, visit the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html\">AWS Organizations documentation</a>.</p>"
  "b0b949187b4522f3cdd72d33b9ad84b5":
    "id": "b0b949187b4522f3cdd72d33b9ad84b5"
    "title": "Amazon EC2 C7a instances are now available in the US West (N. California) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c7a-instances-us-west-ncalifornia-region/"
    "published": "2026-07-23 06:42:00"
    "fetched": "2026-07-23 09:02:05"
    "summary": "<p>Starting today, the compute optimized Amazon EC2 C7a instances are now available in AWS US West (N. California) Region. C7a instances, powered by 4th Gen AMD EPYC processors (code-named Genoa) with a maximum frequency of 3.7 GHz, deliver up to 50% higher performance compared to C6a instances.<br /> <br /> C7a instances offer new processor capabilities such as AVX-512, VNNI, and bfloat16. They feature Double Data Rate 5 (DDR5) memory to enable high-speed access to data in memory and 2.25x more memory bandwidth compared to C6a instances, making these instances ideal for even latency sensitive workloads. C7a instances offer 12 sizes from medium to 48xlarge, including a bare-metal size. And with the launch of C7a instances, customers can attach up to 128 EBS volumes to an EC2 instance — by comparison, C6a instances allow up to 28 EBS volume attachments to an EC2 instance. These instances are built on the AWS Nitro System and ideal for high performance, compute-intensive workloads such as batch processing, distributed analytics, high performance computing (HPC), ad serving, highly-scalable multiplayer gaming, and video encoding.<br /> <br /> C7a instances are available through On-Demand, Spot Instances, and Savings Plans. To get started, visit the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>. To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c7a/\">C7a instances</a>.<br /> </p>"
  "5a44d1300e08c7799c7ed7f9840a040c":
    "id": "5a44d1300e08c7799c7ed7f9840a040c"
    "title": "Amazon EC2 M8id instances are now available in Europe (Ireland) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-m8id-europe-ireland/"
    "published": "2026-07-23 04:55:00"
    "fetched": "2026-07-24 02:16:30"
    "summary": "<p>Amazon EC2 M8id instances are now available in (Ireland). These instances are powered by custom Intel Xeon 6 processors and deliver up to 43% higher performance and 3.3x more memory bandwidth compared to previous generation M6id instances.<br /> <br /> M8id instances offer up to 384 vCPUs, 1.5TiB of memory, and 22.8TB of NVMe SSD storage, 3x more than previous generation instances. These instances deliver up to 46% higher performance for I/O intensive database workloads, and up to 30% faster query results for I/O intensive real-time data analytics than previous sixth-generation instances. Additionally, these instances support Instance Bandwidth Configuration, allowing 25% flexible allocation between network and EBS bandwidth, allocating resources optimally for each workload.<br /> <br /> M8id instances are well-suited for balanced workloads including application servers, microservices, enterprise applications, and small to medium databases.<br /> <br /> Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the <a href=\"https://aws.amazon.com/ec2/instance-types/\">Amazon EC2 instance type page.</a></p>"
"last_updated": "2026-07-24 02:16:30 JST"
