    "title": "AWS Summit Japan 2026：完全自律型 AI Agent が変える SaaS の世界"
    "link": "https://aws.amazon.com/jp/blogs/news/multitenant-ai-agent-saas-architecture-aws-summit-japan-2026/"
    "published": "2026-07-27 11:59:49"
    "fetched": "2026-07-27 12:35:15"
    "summary": "AWS Summit Japan 2026 のブース展示にて、Amazon Bedrock AgentCore を活用したマルチテナント AI CRM のデモを展示しました。AI Agent の台頭により SaaS に求められる要素が変わりつつある中、SaaS に AI Agent を組み込むことで顧客体験をどう変えられるか、その設計上の 4 つのポイントを動くデモを通じて具体的に示しています。"
  "7061e1a03683474cc017d32003f976a6":
    "id": "7061e1a03683474cc017d32003f976a6"
    "title": "寄稿：弁護士ドットコムにおける AWS DevOps Agent の活用事例 – インシデント対応の自動化と属人化の解消"
    "link": "https://aws.amazon.com/jp/blogs/news/bengo4com-devops-agent-case-study/"
    "published": "2026-07-27 10:55:01"
    "fetched": "2026-07-27 12:35:15"
    "summary": "弁護士ドットコム株式会社は、『「プロフェッショナル・テック」で、次の常識をつくる。』というミッションのもと、国内最大級の法律相談ポータルサイト「弁護士ドットコム」や契約マネジメントプラットフォーム「クラウドサイン」などを運営しています。また、最近ではリーガル特化型 AI エージェント「Legal Brain エージェント」を開発し、AI を活用したリーガルサービスの進化にも取り組んでいます。PRE 部は、これらのサービスを支えるインフラの信頼性と運用効率の向上を担っています。本記事では、AWS DevOps Agent を用いたインシデント対応の自動化と運用組織のあり方の見直しを進めている事例を紹介します。"
  "80f5cbb2e6af8cd938cc0223a71eadbf":
    "id": "80f5cbb2e6af8cd938cc0223a71eadbf"
    "title": "Amazon GuardDuty 調査エージェントのご紹介: オンデマンドの AI を活用した脅威評価"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-the-amazon-guardduty-investigation-agent-on-demand-ai-powered-threat-assessment/"
    "published": "2026-07-27 12:57:52"
    "fetched": "2026-07-27 16:25:09"
    "summary": "Amazon GuardDuty 調査エージェントのパブリックプレビューを発表しました。AI を活用してセキュリティ検出結果の調査を自動化し、調査時間を数時間から数分に短縮します。リスクレベル、信頼度スコア、MITRE ATT&amp;CK 手法マッピング、推奨アクションを含む構造化された評価を提供します。本記事では、コンソールと AWS CLI による有効化と調査の実行手順、AWS MCP サーバーとの統合、AWS Security Incident Response との使い分けを解説します。"
  "64f308b8d081044dc435c0a181db9246":
    "id": "64f308b8d081044dc435c0a181db9246"
    "title": "Security Hub が AI ワークロード保護と Microsoft Azure 対応のマルチクラウドサポートを追加"
    "link": "https://aws.amazon.com/jp/blogs/news/security-hub-adds-ai-workload-protection-and-multicloud-support-for-microsoft-azure/"
    "published": "2026-07-27 12:53:57"
    "fetched": "2026-07-27 16:25:09"
    "summary": "AWS Security Hub の 2 つの大きな拡張を発表します。マルチクラウドセキュリティ管理の対象を Microsoft Azure に拡大し、Azure の検出結果を AWS と統合して優先順位付けできるようになりました。さらに GuardDuty AI Protection による Amazon Bedrock や SageMaker の脅威検出、GuardDuty AI-powered investigations による調査の自動化、Security Hub AI inventory による AI 資産の可視化など、AI ワークロード保護の新機能も紹介します。"
"last_updated": "2026-07-27 16:25:09 JST"
