"entries":
  "013fc355177d54929922e1fca2bf1053":
    "id": "013fc355177d54929922e1fca2bf1053"
    "title": "Amazon EC2 C8ine instances are now available in AWS Europe (Frankfurt) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c8ine-aws-frankfurt/"
    "published": "2026-07-08 02:00:00"
    "fetched": "2026-07-08 04:49:33"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8ine instances are available in the AWS Europe (Frankfurt) region. C8ine instances are powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances feature the latest sixth generation AWS Nitro cards, delivering up to 43% higher performance compared to previous generation C6in instances.</p> \n<p>C8ine instances offer up to 2.5 times higher packet performance per vCPU versus prior generation network optimized instances, providing up to 2x higher network throughput for traffic going through Internet gateways compared to existing C6in network optimized instances. C8ine instances are designed for security and network virtual appliances, including virtual firewalls, load balancers, and Telco 5G UPF workloads.</p> \n<p>Amazon EC2 C8ine instances are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Frankfurt) regions. C8ine instances are available via Savings Plans and On-Demand instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\">Amazon EC2 C8i instance</a> pages.</p>"
  "c01a15fb78adb344ba83ccacc4205e5f":
    "id": "c01a15fb78adb344ba83ccacc4205e5f"
    "title": "Amazon ECS Managed Instances reduces GPU management fees by up to 60%"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ecs-managed-instances-gpu-price/"
    "published": "2026-07-08 03:00:00"
    "fetched": "2026-07-08 06:20:05"
    "summary": "<p>Amazon Elastic Container Service (Amazon ECS) Managed Instances now offers significantly reduced management fees for GPU and accelerated instance types. Beginning July 1, 2026, G-series ECS management fees are reduced by 35%, and P-series and AWS Trainium fees are reduced by 60%. These reductions apply automatically and no action is required from customers already using GPU instances with ECS Managed Instances.<br /> <br /> With ECS Managed Instances, you get the application performance you want and the simplicity you need. Simply define your task requirements such as the number of vCPUs, memory size, and CPU architecture, and Amazon ECS automatically provisions, configures and operates most optimal EC2 instances within your AWS account using AWS-controlled access. You can also specify desired instance types, including GPU-accelerated, network-optimized, and burstable performance, to run your workloads on the instance families you prefer. ECS Managed Instances includes capabilities built specifically for accelerated workloads: GPU metrics (utilization, memory, and temperature) through <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Container-Insights-enhanced-observability-metrics-ECS.html\">Amazon CloudWatch Container Insights</a>, and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-instances-gpu-auto-repair.html\">automatic health monitoring </a>that detects GPU-specific hardware failures and replaces unhealthy instances to minimize workload disruption. With today's pricing update, customers running GPU workloads on ECS Managed Instances can now benefit from fully managed infrastructure at lower management fees.<br /> <br /> This pricing update is available in all AWS Regions where ECS Managed Instances is available. For the complete updated rate table, see <a href=\"https://aws.amazon.com/ecs/managed-instances/pricing/\">ECS Managed Instances pricing.</a> Amazon EKS is implementing identical management fee reductions for GPU instances on EKS Auto Mode. See the EKS&nbsp;What's New Post for details. To learn more about ECS Managed Instances, visit the <a href=\"https://aws.amazon.com/ecs/managed-instances/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/aws/announcing-amazon-ecs-managed-instances-for-containerized-applications\">AWS News launch blog</a>.</p>"
  "e3ab3820bcd2baec96605e0040afd697":
    "id": "e3ab3820bcd2baec96605e0040afd697"
    "title": "Amazon EMR Serverless now supports larger worker sizes to run more compute and memory intensive workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-emr-serverless/"
    "published": "2026-07-08 02:06:00"
    "fetched": "2026-07-08 06:20:05"
    "summary": "<p>Amazon EMR Serverless now offers larger worker configurations of 32 vCPUs with up to 244 GB of memory, allowing you to run more compute and memory-intensive workloads. Previously, the largest worker configuration available on EMR Serverless was 16 vCPUs with up to 120 GB of memory. Larger workers can help you improve the runtime performance as well as cost profiles for your workloads.</p> \n<p>For shuffle-heavy workloads, larger workers reduce inefficient data transfers between executors. For jobs&nbsp;with data skew, larger workers reduce the chances of out-of-memory failures. For jobs that need to cache data, larger workers allow holding more data in memory, boosting job performance. To take advantage of these benefits,&nbsp;we recommend using larger workers for your compute and memory-intensive Spark and Hive workloads.</p> \n<p>To learn more about different worker configurations, please visit EMR Serverless <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/app-behavior.html#worker-configs\">documentation</a>. Larger workers are available in all AWS Regions where EMR Serverless is <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/endpoints-quotas.html\">available</a>.</p>"
  "baf56c2fbcabd2bfcf614a18e9660baf":
    "id": "baf56c2fbcabd2bfcf614a18e9660baf"
    "title": "Amazon Redshift RG instances now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-redshift-rg-instances-aws-govcloud"
    "published": "2026-07-08 01:00:00"
    "fetched": "2026-07-08 07:57:16"
    "summary": "<p>Amazon Redshift RG instances, powered by AWS Graviton processors, are now available in the AWS GovCloud (US-West) and AWS GovCloud (US-East) Regions. RG instances deliver better performance, running data warehouse and data lake workloads up to 2.4x as fast as previous generation RA3 instances, at 30% lower price per vCPU. RG instances include Redshift's custom-built vectorized data lake query engine that processes Apache Iceberg and Parquet data on your cluster nodes, enabling you to run SQL analytics across your data warehouse and data lake using a single engine.<br /> <br /> RG instances are available in two instance sizes, rg.xlarge and rg.4xlarge. Customers with existing RA3 clusters can upgrade them to RG using Snapshot &amp; Restore, Elastic Resize, or Classic Resize. RG instances are available with flexible pricing options, including On-Demand, and 1-year and 3-year Reserved Instances with All Upfront, Partial Upfront, and No Upfront payment options. For pricing details, visit the <a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a>.<br /> <br /> To get started, refer to the following resources:<br /> </p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-rg-nodes-table\">Amazon Redshift RG Instance Documentation</a></li> \n <li><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-considerations.html#rs-upgrading-to-rg\">RA3 to RG Upgrade Guide</a></li> \n <li><a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift Pricing</a></li> \n</ul>"
  "65cb099dcc03644719679c0094ea0c2c":
    "id": "65cb099dcc03644719679c0094ea0c2c"
    "title": "Amazon RDS for Oracle now supports Oracle Database 26ai"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-oracle-database-26ai/"
    "published": "2026-07-08 00:00:00"
    "fetched": "2026-07-08 07:57:16"
    "summary": "<p><a></a><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon RDS for Oracle</a> now supports Oracle Database 26ai, Oracle's latest Long Term Support Release, with Amazon Bedrock integration which provides access to foundation models such as Anthropic Claude, Amazon Nova, and Meta Llama. With Oracle Database 26ai, you can leverage Oracle's Select AI feature to generate and run SQL queries from natural language prompts, increasing productivity for both developers and business users. You can also implement retrieval augmented generation (RAG) directly from SQL using Oracle AI Vector Search without moving data out of their database.<br /> <br /> Oracle Database 26ai also includes AI Vector Search for storing vector embeddings alongside relational data and performing semantic similarity and hybrid searches without a separate vector database, JSON Relational Duality Views for accessing the same underlying data as either JSON documents or relational tables, and SQL Property Graphs for in-database graph analytics. You can create new DB instances running Oracle Database 26ai or upgrade from Oracle Database 19c or 21c container databases (CDBs). Oracle Database 26ai is available in Enterprise Edition only. To create a new Oracle Database 26ai instance, use the AWS Management Console, AWS CLI, or AWS SDK and select an Oracle 26.0.0.0 engine version. To upgrade existing Oracle Database 19c or 21c CDB instances, use the Modify DB Instance workflow and select a 26.0.0.0 engine version. If your DB instance runs Oracle Database 19c as a non-CDB, you must first convert it to the CDB architecture before upgrading to 26ai. For more information, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/oracle-cdb-converting.html\">Converting a non-CDB to a CDB</a>.<br /> <br /> Amazon RDS for Oracle Database 26ai is available in&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all commercial AWS Regions and the AWS GovCloud (US) Regions</a>.&nbsp;For more information, see&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Oracle.Concepts.database-versions.html#Oracle.Concepts.FeatureSupport.26ai\">Oracle Database 26ai with Amazon RDS</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Oracle.BedrockIntegration.html\">Amazon Bedrock integration for RDS for Oracle</a>.&nbsp;</p>"
  "54accebdfca48e7977af71e36197d819":
    "id": "54accebdfca48e7977af71e36197d819"
    "title": "Amazon GameLift Streams introduces secure terminal access for stream sessions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-gamelift-streams-terminal-access/"
    "published": "2026-07-08 06:26:00"
    "fetched": "2026-07-08 08:58:22"
    "summary": "<p>Amazon GameLift Streams now supports Stream Session Admin Shell, a secure terminal connection to the live runtime environment of a stream session for real-time troubleshooting. You can inspect logs, query running processes, check GPU utilization, and examine application state — all without managing SSH keys, open ports, or infrastructure credentials.<br /> <br /> Stream Session Admin Shell provides a terminal connection with the same level of access as your Amazon GameLift Streams applications. To connect, call the new <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamSessionAdminShell.html\">CreateStreamSessionAdminShell API</a> with your stream group and stream session identifiers, then use the returned credentials with the SSM Session Manager plugin for the AWS CLI. The feature supports Linux (Ubuntu 22.04), Proton, and Windows Server 2022 runtimes. The terminal connection is scoped to your application environment and automatically closes when the stream session ends.<br /> <br /> Stream Session Admin Shell is available at no additional cost in all AWS Regions where Amazon GameLift Streams is offered. For a full list of supported Regions, see the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/regions-quotas-rande.html\">AWS Region table</a>.<br /> <br /> To get started, see the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/troubleshoot-admin-shell-guide.html\">Stream Session Admin Shell developer guide</a> and <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamSessionAdminShell.html\">CreateStreamSessionAdminShell API reference</a>.</p>"
  "62742087b723e7dd28ec344dd4864a3b":
    "id": "62742087b723e7dd28ec344dd4864a3b"
    "title": "Amazon S3 Vectors is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/s3-vectors-available-aws-govcloud-regions/"
    "published": "2026-07-08 04:00:00"
    "fetched": "2026-07-08 08:58:22"
    "summary": "<p>Amazon S3 Vectors is now available in AWS GovCloud (US-East) and AWS GovCloud (US-West).</p> \n<p>Amazon S3 Vectors is purpose-built vector storage for AI agents, inference, Retrieval Augmented Generation (RAG), and semantic search at billion-vector scale. S3 Vectors is designed to provide the same elasticity, durability, and availability as Amazon S3, with a dedicated set of APIs that let you store, access, and query vectors without provisioning any infrastructure.</p> \n<p>For a full list of AWS Regions where Amazon S3 Vectors is available, see <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-regions-quotas.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions and endpoints</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/vectors/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, and the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 pricing page</a>.<br /> </p>"
  "b74631783aa69b5c487295b9d1f92b95":
    "id": "b74631783aa69b5c487295b9d1f92b95"
    "title": "Amazon SageMaker now supports data lineage in IAM-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-sagemaker-data-lineage-iam-domain"
    "published": "2026-07-08 02:00:00"
    "fetched": "2026-07-08 08:58:22"
    "summary": "<p>Amazon SageMaker Unified Studio now supports OpenLineage compatible data lineage in IAM-based domains, capturing lineage events from Apache Spark jobs run on Amazon EMR, AWS Glue, SageMaker Visual ETL, and notebooks. This capability is already available in IAM Identity Center-based domains. The interactive lineage graph provides an aggregate visual representation of how data moves from source to consumption, with configurable graph depth, event timestamp mode for detailed column-level lineage, and a dataset-only view for simplified visualization. For both IAM-based and IAM Identity Center-based domains, you can programmatically publish, query, and manage data lineage from OpenLineage compatible applications. You can now also remove published events using the DeleteLineageEvent API.</p> \n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all AWS Regions where Amazon SageMaker Unified Studio is available</a>. To get started, visit the Amazon SageMaker Unified Studio <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-visualizing-data-lineage-iam-mode.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/datazone-data-lineage-apis.html\">API reference</a>.</p>"
"last_updated": "2026-07-08 08:58:22 JST"
