    "title": "Amazon EVS で VCF 9.0 および 9.1 のサポートを発表"
    "link": "https://aws.amazon.com/jp/blogs/news/vmware-cloud-foundation-vcf-9-0-and-9-1-on-amazon-evs/"
    "published": "2026-07-08 12:50:45"
    "fetched": "2026-07-08 15:24:22"
    "summary": "VMware Cloud Foundation (VCF) 9.0 および 9.1 が Amazon Elastic VMware Service (EVS) で利用可能になり、VCF インストールを完全に制御できるようになったことをお知らせいたします。Amazon EVS における私たちの焦点は、お客様が現在お持ちのツール、運用プロセス、スキルを使用して、ニーズに合わせて VCF をデプロイおよび構成できる柔軟性を提供することです。"
