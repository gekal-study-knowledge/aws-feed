    "title": "Data modeling patterns for Amazon Quick Sight multi-dataset relationships"
    "link": "https://aws.amazon.com/blogs/machine-learning/data-modeling-patterns-for-amazon-quick-sight-multi-dataset-relationships/"
    "published": "2026-07-08 02:07:39"
    "fetched": "2026-07-08 02:10:02"
    "summary": "In this post, we shift from concepts to patterns. For each schema, you’ll find a table structure, use cases, implementation steps, and sample SQL queries. We also cover workarounds for advanced scenarios that require extra modeling steps, and close with a summary of current limitations."
  "202d678dd3013d9276eadc8a984ce810":
