    "published": "2026-07-08 02:07:31"
    "fetched": "2026-07-08 02:10:02"
    "summary": "This post is for data architects, business intelligence (BI) engineers, and analytics engineers building or optimizing Quick Sight Topics for natural-language Chat-based exploration."
  "390384bfe760155d9d3a6a7c9430109b":
    "id": "390384bfe760155d9d3a6a7c9430109b"
    "title": "Build a unified semantic layer across datasets with multi-dataset Topics in Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-unified-semantic-layer-across-datasets-with-multi-dataset-topics-in-amazon-quick/"
    "published": "2026-07-08 02:07:22"
    "fetched": "2026-07-08 02:10:02"
    "summary": "In this post, we walk through how multi-dataset Topics work, explain how the chat agent uses defined relationships to generate cross-dataset queries, and demonstrate an end-to-end implementation using a retail analytics scenario in Quick Sight."
  "293b6f07259d4662022a01c5209e7956":
    "id": "293b6f07259d4662022a01c5209e7956"
    "title": "Build a serverless image editing agent with Amazon Bedrock AgentCore harness"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-serverless-image-editing-agent-with-amazon-bedrock-agentcore-harness/"
    "published": "2026-07-08 01:51:29"
    "fetched": "2026-07-08 02:10:02"
    "summary": "This post walks through building a serverless image editor where users upload a photo, describe an edit in plain English, and receive the result in seconds. The agent runs on AgentCore harness without custom orchestration code. We deploy the full solution, including authentication, encrypted storage, three image editing tools, and a React frontend, with a single deployment command. The infrastructure is defined using AWS Cloud Development Kit (AWS CDK)."
  "a377eeb9425b05c921f0876a0fdf9cb1":
    "id": "a377eeb9425b05c921f0876a0fdf9cb1"
    "title": "Monitoring discriminative ML models using Amazon SageMaker AI with MLflow"
    "link": "https://aws.amazon.com/blogs/machine-learning/monitoring-discriminative-ml-models-using-amazon-sagemaker-ai-with-mlflow/"
    "published": "2026-07-08 01:49:09"
    "fetched": "2026-07-08 02:10:02"
    "summary": "Implementing a data and model monitoring solution is necessary to maintain prediction accuracy and help achieve the best outcome for your machine learning use case. This post shows how you can use open source Evidently together with Amazon SageMaker AI to generate monitoring reports, organize and compare the results in MLflow, scale through pipelines, and trigger drift notifications."
  "2d9b3438fe62223c60deda8b29e8b866":
    "id": "2d9b3438fe62223c60deda8b29e8b866"
    "title": "Build an AI-powered AWS support companion with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-an-ai-powered-aws-support-companion-with-amazon-bedrock-agentcore/"
    "published": "2026-07-08 01:46:43"
    "fetched": "2026-07-08 02:10:02"
    "summary": "In this post, you build an AWS Support Companion using Amazon Bedrock AgentCore. The agent uses Strands Agents as the orchestration framework and connects to AWS services through the Model Context Protocol (MCP). By the end, you have a working agent that can analyze CloudWatch logs, search AWS documentation, query community knowledge from AWS re:Post, and create support cases, all from a single conversational interface. The solution deploys with a single script using AWS CloudFormation and includes a web frontend built on AWS Amplify for interacting with the agent."
