  "1e2ed9966cc64b8edae3b0b05f683e48":
    "id": "1e2ed9966cc64b8edae3b0b05f683e48"
    "title": "AWS announces AWS Interconnect - multicloud connectivity with Oracle Cloud Infrastructure in GA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-announces-AWS-interconnect-multicloud-OCI-GA/"
    "published": "2026-07-30 00:00:00"
    "fetched": "2026-07-30 05:09:14"
    "summary": "<p>AWS announces the general availability (GA) of AWS Interconnect — multicloud with Oracle Cloud Infrastructure (OCI).</p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. They do so for many reasons including interoperability requirements, the freedom to choose technology that best suits their needs, and the ability to build and deploy applications on any environment with greater ease and speed. Previously, when interconnecting workloads across multiple cloud providers (CSPs), customers had to go the route of a ‘do-it-yourself’ multicloud approach, leading to complexities of building and managing global multi-layered networks at scale. AWS Interconnect - multicloud is the first purpose-built product of its kind and a new way of how clouds connect and talk to each other, allowing customers to quickly provision resilient, scalable private connections to other cloud providers.</p> \n<p>In May, OCI launched support for AWS Interconnect in public preview and became the latest CSP to adopt the <a href=\"https://github.com/aws/Interconnect\" target=\"_blank\"><u>open specification</u></a> that powers the service. With today’s GA launch, AWS customers can now rely on the same consistent, simple experience to interconnect their workloads on OCI and Google Cloud. Microsoft Azure will launch later in 2026.<br /> <br /> Interconnect - multicloud is available with OCI in the us-east-1 (N. Virginia) AWS Region. You can create an Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/latest/userguide/what-is-interconnect.html\" target=\"_blank\"><u>AWS Interconnect - multicloud documentation</u></a>.</p>"
  "896cafda1dd44680cddfc66c7355b135":
    "id": "896cafda1dd44680cddfc66c7355b135"
    "title": "Amazon Redshift Data API announces long polling, session management, and flexible batch execution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-redshift-data-api-longpolling-listsession-flexiblebatchexecute/"
    "published": "2026-07-30 05:45:00"
    "fetched": "2026-07-30 06:56:33"
    "summary": "<p>Amazon Redshift Data API introduces new capabilities that reduce the number of API calls to retrieve SQL statement metadata or results, provide visibility into sessions, and allow batch statements to execute on separate transactions.<br /> <br /> Long polling: Long polling enables you to retrieve SQL statement metadata or results without polling repeatedly until the SQL statement reaches a terminal state, by delaying returning a synchronous response until the SQL statement finishes. To use this feature, specify the WaitTimeSeconds parameter on ExecuteStatement, BatchExecuteStatement, DescribeStatement, GetStatementResult, or GetStatementResultV2.<br /> <br /> ListSessions: Applications that reuse sessions across multiple queries can now enumerate active sessions and filter by status, compute target, or database, eliminating the need to track session identifiers externally.<br /> <br /> Flexible batch execution: BatchExecuteStatement now supports an ExecutionMode parameter with AUTO_COMMIT mode, allowing each SQL statement in a batch to execute independently so a single failure no longer rolls back the entire batch — useful for ETL pipelines and administrative scripts where partial completion is acceptable. In addition, BatchExecuteStatement now accepts an array of SqlParameter, enabling parameter reuse across all statements in a batch: define parameters once and reference them in any statement, eliminating the need to embed literal values in each query.<br /> <br /> These features are generally available for Amazon Redshift Provisioned and Amazon Redshift Serverless in all AWS commercial and AWS GovCloud (US) Regions that support Amazon Redshift Data API. To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html\">Amazon Redshift Data API developer guide</a>.</p>"
  "91634da5b7cd2675791a1965251c2422":
    "id": "91634da5b7cd2675791a1965251c2422"
    "title": "Amazon EC2 Auto Scaling now supports Instance Refresh in CloudFormation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ec2-auto-scaling-instance-refresh-cloudformation"
    "published": "2026-07-30 06:00:00"
    "fetched": "2026-07-30 07:58:37"
    "summary": "<p>Amazon EC2 Auto Scaling now supports Instance Refresh as a new AWS CloudFormation update policy. When you configure the new AutoScalingInstanceRefresh update policy and update properties that require instance replacement, CloudFormation automatically triggers an Instance Refresh.</p> \n<p>With this integration, you can now access Instance Refresh capabilities including replace root volume for in-place updates, launch-before-terminate, alarm-based monitoring, and checkpoints with bake time for controlled rollouts. Auto Scaling features such as scaling policies and health checks remain active throughout the update, so your service health is not at risk during deployments. Rollback is handled through CloudFormation stack rollback.</p> \n<p>This feature is available in all AWS Regions at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html#cfn-attributes-updatepolicy-instancerefresh\">AutoScalingInstanceRefresh update policy</a> in the AWS CloudFormation Template Reference.</p>"
  "5592fc88c83b5c9635e45cc332d0e41a":
    "id": "5592fc88c83b5c9635e45cc332d0e41a"
    "title": "AWS WAF adds pre-parse text transformations and new text transformations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-waf/"
    "published": "2026-07-30 00:00:00"
    "fetched": "2026-07-30 07:58:37"
    "summary": "<p>Today, AWS WAF adds pre-parse text transformations for query arguments and ten new text transformations for use in any rule statement. Both help you normalize request content so that AWS WAF inspects requests the same way your application interprets them.</p> \n<p>Pre-parse text transformations normalize a raw query string before AWS WAF parses it into key-value pairs, closing HTTP parameter pollution and parser differential evasion gaps. You can chain up to ten transformations, including URL decode, Combine Duplicate Query Arguments by Comma, and Replace Semicolons with Ampersands, then layer standard post-parse transformations on top within a single rule statement.</p> \n<p>The new text transformations give you more ways to normalize content before inspection, including industry-standard options such as Uppercase, Trim, Remove Whitespace, and SHA256, plus operating-system-aware command line and JavaScript decoding functions developed by the Amazon Threat Research Team.</p> \n<p>Each new transformation consumes 10 WCUs, with no additional charge beyond standard AWS WAF pricing, and is available in all AWS Regions. To get started, see the following resources:</p> \n<ul> \n <li><p>Pre-parse text transformations in AWS WAF:&nbsp;<a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-preparse-transformation.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-preparse-transformation.html</a></p> </li> \n</ul> \n<ul> \n <li><p>Text transformations in AWS WAF: <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-transformation.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-transformation.html</a></p> </li> \n</ul> \n<ul> \n <li><p>Getting started with AWS WAF: <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/getting-started.html\">https://docs.aws.amazon.com/waf/latest/developerguide/getting-started.html</a></p> </li> \n</ul>"
  "d1615078eb325801de487ad6f9526e04":
    "id": "d1615078eb325801de487ad6f9526e04"
    "title": "AWS Glue announces VPC support, filter pushdown, and partition support for the REST API connector"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-glue-rest-connector-filtering-partitioning-vpc"
    "published": "2026-07-30 05:18:00"
    "fetched": "2026-07-30 12:53:21"
    "summary": "<p>AWS Glue now supports VPC connections, filter pushdown, and partition support for the REST API connector. The REST API connector enables you to ingest data from any source that exposes a REST-based API, including proprietary systems and emerging platforms without native AWS Glue connectors. With this launch, you can operate your ETL pipelines from data sources with REST API endpoints by securely connecting to private endpoints, transfering only the data they need, and parallelizing reads for faster ingestion, all without writing custom code<br /> <br /> With VPC support, you can use the REST API connector to access data sources hosted in private subnets or connected through VPNs or AWS PrivateLink, without exposing traffic to the public internet. Filter pushdown translates your query predicates into API-native parameters, so only matching records leave the source, reducing data transfer costs and improving job performance. Partition support splits large datasets across multiple Spark workers using field-based or record-count strategies, providing parallel reads that reduce ingestion time for high-volume, paginated APIs.<br /> <br /> These capabilities are available in all AWS commercial regions where AWS Glue is available.<br /> <br /> To get started, visit the AWS Glue <a href=\"https://docs.aws.amazon.com/glue/latest/dg/connecting-to-data-rest-api.html\">REST API connector documentation</a>.</p>"
  "4f25a09b38ce0efae6751a028ec53337":
    "id": "4f25a09b38ce0efae6751a028ec53337"
    "title": "Grok 4.3 from xAI is now available on Amazon Bedrock in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/grok-4-3-bedrock-govcloud/"
    "published": "2026-07-30 22:00:00"
    "fetched": "2026-07-31 02:21:50"
    "summary": "<p>xAI's Grok 4.3 model is now available on Amazon Bedrock in AWS GovCloud (US-West). With this launch, xAI joins Amazon Bedrock as a model provider in AWS GovCloud (US-West), giving you even more choice as you build generative AI applications across reasoning, agentic, and enterprise workflows.</p> \n<p>Grok 4.3 is a reasoning-first model that offers configurable reasoning effort (none, low, medium, high). It also offers strong tool use and instruction-following capabilities for building reliable agents, and token efficiency to help keep high-volume inference cost-effective. Grok 4.3 is especially well suited to enterprise workloads such as customer support, web development, case law research, and financial document Q&amp;A, while delivering consistent, high-quality results across conversational Al, search, chat, and multi-turn workflows. Grok 4.3 runs on Mantle, a new inference engine in Amazon Bedrock designed for price performance, with support for tool calling, structured output, and response streaming.</p> \n<p>See <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">region availability</a> of Grok 4.3 for list of supported regions. To get started, visit the Grok 4.3 <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html\">model detail page</a> in our documentation.</p>"
  "69f172725d95602f3f4b54813a41dd24":
    "id": "69f172725d95602f3f4b54813a41dd24"
    "title": "Gemma 4 models are now available on Amazon Bedrock in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/gemma-4-bedrock-govcloud/"
    "published": "2026-07-30 22:00:00"
    "fetched": "2026-07-31 02:21:50"
    "summary": "<p>The Gemma 4 family of open-weight models from Google DeepMind on <a href=\"https://aws.amazon.com/bedrock/\">Amazon Bedrock</a> in AWS GovCloud (US-West). With Gemma 4, you can build generative AI applications across reasoning, multimodal understanding, agentic, and software engineering workflows.</p> \n<p>The Gemma 4 family on Amazon Bedrock includes three variants - Gemma 4 31B, Gemma 4 26B-A4B, and Gemma 4 E2B - spanning dense and mixture-of-experts (MoE) architectures with built-in reasoning, native function calling, support for 35+ languages and multimodal input across text, image, video and audio. Gemma 4 31B is suited for reasoning- and coding-heavy workloads with a 256K-token context window, Gemma 4 26B-A4B targets cost- and latency-sensitive workloads, and Gemma 4 E2B is the smallest variant, designed for low-latency interactive use cases. Gemma 4 runs on a new innovation in Amazon Bedrock designed for price performance, with improved support for tool calling, structured output, reasoning, and response streaming, so customers can build reliable generative AI applications with open-source models.</p> \n<p>To get started, visit Gemma 4 model detail pages in our <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-google.html\">documentation.</a></p>"
  "fc9063989779146addfce52d49b3b360":
    "id": "fc9063989779146addfce52d49b3b360"
    "title": "Amazon OpenSearch Service now supports OpenSearch version 3.7"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-opensearch-service/"
    "published": "2026-07-30 11:30:15"
    "fetched": "2026-07-31 02:21:50"
    "summary": "<p>You can now run OpenSearch version 3.7 on Amazon OpenSearch Service. OpenSearch 3.7 introduces improvements in vector search performance, search relevance, and Query Insights.</p> \n<p>With this launch, <a href=\"https://docs.opensearch.org/latest/vector-search/optimizing-storage/faiss-scalar-quantization/#1-bit-quantization\" target=\"_blank\">1-bit scalar quantization</a> on the Faiss and Lucene engines&nbsp;compresses vectors, reducing the storage and memory required by vector workloads while maintaining search accuracy.&nbsp;You can now retrieve vectors faster using <a href=\"https://docs.opensearch.org/latest/vector-search/performance-tuning-search/#retrieve-vectors-using-doc-values/\" target=\"_blank\">doc values</a> instead of document source, with no reindexing required.&nbsp;<a href=\"https://docs.opensearch.org/latest/search-plugins/search-relevance/using-search-relevance-workbench/\" target=\"_blank\">Search Relevance Workbench</a> adds new evaluation metrics, CSV judgment uploads, and expanded hybrid search optimization, helping you measure and improve search quality.</p> \n<p>This launch also introduces new Query Insights capabilities, including automated query recommendations, a finished-queries cache for observing recently completed queries, and the option to export top query data to Amazon S3, helping you identify expensive queries and analyze trends over time.</p> \n<p>For information on upgrading to OpenSearch 3.7, please see the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/version-migration.html\" target=\"_blank\">documentation</a>. OpenSearch 3.7 is now available in all AWS Regions where Amazon OpenSearch Service is available.</p>"
  "a10230941cd62fe8f25192b71e0fe46b":
    "id": "a10230941cd62fe8f25192b71e0fe46b"
    "title": "Amazon MSK Express brokers now delivers Apache Kafka data to Amazon S3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-msk-express-brokers-delivers-to-amazon-s3"
    "published": "2026-07-30 23:07:00"
    "fetched": "2026-07-31 04:19:05"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/express-brokers-for-amazon-msk/\">Amazon MSK Express brokers</a> now delivers data to Amazon S3 general purpose buckets, providing a fully managed capability to deliver Apache Kafka data in Amazon S3 for downstream processing in the easiest and most reliable way. This capability automatically scales to deliver high-throughput Kafka data to S3 with end-to-end reliability for mission-critical workloads, while reducing ingestion and delivery costs by up to 60% compared to self-managed alternatives.</p> \n<p>Customers deliver Apache Kafka data to Amazon S3 for use cases such as log archival, compliance retention, Kafka replay, and training AI/ML models, and typically build these pipelines with self-managed connectors that grow costly and operationally complex as workloads scale, forcing teams to build or source S3 connector plugins, secure approvals to deploy them, and continually scale capacity, and apply security updates across connector fleet. With this capability, MSK Express automatically handles scaling, retries, and backpressure so customers no longer manage connector fleets or coordinate across teams. MSK Express &nbsp;supports throughput of up to 10 GB/s for data delivery to Amazon S3, and manages routine operations such as capacity scaling and version upgrades without introducing delivery gaps. Additionally, customers add this delivery capability without provisioning additional broker egress throughput, which eliminates the incremental infrastructure costs that scaling connector-based pipelines typically incurs, so customers scale delivery to actual workload demand rather than provisioning for peak, achieving reliable, high-throughput delivery to Amazon S3 while removing operational overhead and lowering costs.</p> \n<p>Amazon MSK data delivery to Amazon S3 is available today in every <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region</a> where Amazon MSK Express brokers are offered. For pricing information, visit the <a href=\"https://aws.amazon.com/msk/pricing/\">pricing page</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-data-delivery.html\">Amazon MSK Developer Guide</a> and <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/analytics-skills/managing-amazon-msk\">Amazon MSK AI skills</a>.</p>"
  "d80b3b8bbe7933631ec5868772741f21":
    "id": "d80b3b8bbe7933631ec5868772741f21"
    "title": "Amazon MSK Express brokers now deliver data to streaming tables for Apache Iceberg"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-msk-streaming-tables-for-apache-iceberg"
    "published": "2026-07-30 23:07:00"
    "fetched": "2026-07-31 04:19:05"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/express-brokers-for-amazon-msk/\">Amazon MSK Express brokers</a> now deliver data to streaming tables for Apache Iceberg, a new capability that continuously materializes Apache Kafka topics as Apache Iceberg tables on Amazon S3 Tables. Amazon MSK data delivery to streaming tables can reduce the cost of ingesting and delivering Apache Kafka data into Amazon S3 Tables by up to 60% versus self-managed deployments and reduces downstream query costs by up to 30% versus self-managed Apache Kafka deployments.</p> \n<p>Customers rely on Apache Kafka to ingest real-time data for use cases like fraud detection and personalization and increasingly want to unify that data with Apache Iceberg tables for near real-time analytics but integrating the two forces them to operate complex custom pipelines, manage format conversions, and contend with the small-file problem, where high-volume ingestion creates many small parquet files that slow downstream queries and increase costs. With this capability, intelligent inline compaction eliminates the performance impact of small files and keeps query performance predictable without sacrificing data freshness, while built-in coordination resolves concurrent writer conflicts across high-throughput consumers. Amazon MSK supports throughput of up to 10 GB/s for delivery to Apache Iceberg on Amazon S3 Tables, and because this native capability adds no broker egress throughput, customers avoid the incremental infrastructure costs of scaling connector pipelines and match capacity to actual demand rather than peak. Customers deliver data to streaming tables and query or transform the data with any engine of their choice, including Apache Spark, Trino, or Apache Flink.&nbsp;</p> \n<p>To get started, customers open the Amazon MSK console, select the Express cluster, and enable the capability in a few clicks, or use the MSK APIs or MCP server. Amazon MSK data delivery to streaming tables is available today in every <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region</a> where Amazon MSK Express brokers are offered. For pricing information, visit the <a href=\"https://aws.amazon.com/msk/pricing/\">pricing page</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-data-delivery.html\">Amazon MSK Developer Guide</a>&nbsp;and <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/analytics-skills/managing-amazon-msk\">Amazon MSK AI skills</a>.</p>"
