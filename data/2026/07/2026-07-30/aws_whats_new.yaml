    "id": "896cafda1dd44680cddfc66c7355b135"
    "title": "Amazon Redshift Data API announces long polling, session management, and flexible batch execution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-redshift-data-api-longpolling-listsession-flexiblebatchexecute/"
    "published": "2026-07-30 05:45:00"
    "fetched": "2026-07-30 06:56:33"
    "summary": "<p>Amazon Redshift Data API introduces new capabilities that reduce the number of API calls to retrieve SQL statement metadata or results, provide visibility into sessions, and allow batch statements to execute on separate transactions.<br /> <br /> Long polling: Long polling enables you to retrieve SQL statement metadata or results without polling repeatedly until the SQL statement reaches a terminal state, by delaying returning a synchronous response until the SQL statement finishes. To use this feature, specify the WaitTimeSeconds parameter on ExecuteStatement, BatchExecuteStatement, DescribeStatement, GetStatementResult, or GetStatementResultV2.<br /> <br /> ListSessions: Applications that reuse sessions across multiple queries can now enumerate active sessions and filter by status, compute target, or database, eliminating the need to track session identifiers externally.<br /> <br /> Flexible batch execution: BatchExecuteStatement now supports an ExecutionMode parameter with AUTO_COMMIT mode, allowing each SQL statement in a batch to execute independently so a single failure no longer rolls back the entire batch — useful for ETL pipelines and administrative scripts where partial completion is acceptable. In addition, BatchExecuteStatement now accepts an array of SqlParameter, enabling parameter reuse across all statements in a batch: define parameters once and reference them in any statement, eliminating the need to embed literal values in each query.<br /> <br /> These features are generally available for Amazon Redshift Provisioned and Amazon Redshift Serverless in all AWS commercial and AWS GovCloud (US) Regions that support Amazon Redshift Data API. To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/data-api.html\">Amazon Redshift Data API developer guide</a>.</p>"
  "91634da5b7cd2675791a1965251c2422":
    "id": "91634da5b7cd2675791a1965251c2422"
    "title": "Amazon EC2 Auto Scaling now supports Instance Refresh in CloudFormation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ec2-auto-scaling-instance-refresh-cloudformation"
    "published": "2026-07-30 06:00:00"
    "fetched": "2026-07-30 07:58:37"
    "summary": "<p>Amazon EC2 Auto Scaling now supports Instance Refresh as a new AWS CloudFormation update policy. When you configure the new AutoScalingInstanceRefresh update policy and update properties that require instance replacement, CloudFormation automatically triggers an Instance Refresh.</p> \n<p>With this integration, you can now access Instance Refresh capabilities including replace root volume for in-place updates, launch-before-terminate, alarm-based monitoring, and checkpoints with bake time for controlled rollouts. Auto Scaling features such as scaling policies and health checks remain active throughout the update, so your service health is not at risk during deployments. Rollback is handled through CloudFormation stack rollback.</p> \n<p>This feature is available in all AWS Regions at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatepolicy.html#cfn-attributes-updatepolicy-instancerefresh\">AutoScalingInstanceRefresh update policy</a> in the AWS CloudFormation Template Reference.</p>"
  "5592fc88c83b5c9635e45cc332d0e41a":
    "id": "5592fc88c83b5c9635e45cc332d0e41a"
    "title": "AWS WAF adds pre-parse text transformations and new text transformations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-waf/"
    "published": "2026-07-30 00:00:00"
    "fetched": "2026-07-30 07:58:37"
    "summary": "<p>Today, AWS WAF adds pre-parse text transformations for query arguments and ten new text transformations for use in any rule statement. Both help you normalize request content so that AWS WAF inspects requests the same way your application interprets them.</p> \n<p>Pre-parse text transformations normalize a raw query string before AWS WAF parses it into key-value pairs, closing HTTP parameter pollution and parser differential evasion gaps. You can chain up to ten transformations, including URL decode, Combine Duplicate Query Arguments by Comma, and Replace Semicolons with Ampersands, then layer standard post-parse transformations on top within a single rule statement.</p> \n<p>The new text transformations give you more ways to normalize content before inspection, including industry-standard options such as Uppercase, Trim, Remove Whitespace, and SHA256, plus operating-system-aware command line and JavaScript decoding functions developed by the Amazon Threat Research Team.</p> \n<p>Each new transformation consumes 10 WCUs, with no additional charge beyond standard AWS WAF pricing, and is available in all AWS Regions. To get started, see the following resources:</p> \n<ul> \n <li><p>Pre-parse text transformations in AWS WAF:&nbsp;<a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-preparse-transformation.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-preparse-transformation.html</a></p> </li> \n</ul> \n<ul> \n <li><p>Text transformations in AWS WAF: <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-transformation.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-transformation.html</a></p> </li> \n</ul> \n<ul> \n <li><p>Getting started with AWS WAF: <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/getting-started.html\">https://docs.aws.amazon.com/waf/latest/developerguide/getting-started.html</a></p> </li> \n</ul>"
"last_updated": "2026-07-30 07:58:37 JST"
