    "published": "2026-07-30 00:24:21"
    "fetched": "2026-07-30 01:17:50"
    "summary": "Learn how to build a no-code customer retention pipeline in Amazon Quick that detects at-risk customers from call transcripts and CSAT data, scores them by retention priority with a custom MCP Action, and generates personalized retention letters, reducing response time from days to minutes."
