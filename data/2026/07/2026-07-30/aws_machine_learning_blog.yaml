    "title": "Authenticate with Private Key JWT using Amazon Bedrock AgentCore Identity"
    "link": "https://aws.amazon.com/blogs/machine-learning/authenticate-with-private-key-jwt-using-amazon-bedrock-agentcore-identity/"
    "published": "2026-07-30 01:20:28"
    "fetched": "2026-07-30 03:03:27"
    "summary": "This post explains how Private Key JWT client authentication works in AgentCore Identity and reviews the supported grant flows. We then walk through creating an AWS KMS signing key, registering its public key with your identity provider, configuring a credential provider on the AWS Management Console, and reviewing example AWS CloudTrail events that record your agent’s access."
