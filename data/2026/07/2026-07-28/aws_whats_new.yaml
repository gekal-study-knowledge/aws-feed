  "6eacd63037277d337b1af08cba44c647":
    "id": "6eacd63037277d337b1af08cba44c647"
    "title": "AWS Elemental MediaTailor adds configurable ad timeout and concurrency controls for improved ad fill and faster startup"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/mediatail-configurable-ad-timeout-and-concurrency"
    "published": "2026-07-28 01:09:00"
    "fetched": "2026-07-28 03:21:59"
    "summary": "<p>AWS Elemental MediaTailor now gives you direct control over ad decision server (ADS) timeout. Previously, changing these settings required contacting AWS Support. You can now configure individual HTTP ad request timeouts, total ad personalization time budgets for live, VOD, and live ad prefetch, and enable parallel ADS requests.</p> \n<p>These settings allow you to optimize ad delivery performance for your specific workflows. For example, you can increase the personalization time budget for live events to improve ad fill rates or enable parallel ADS requests in VOD workflows to reduce overall response time for faster video startup. New prefetch-specific timeout settings give you additional granularity for livestream ad retrieval.</p> \n<p>You can configure these settings through the AWS Elemental MediaTailor console, AWS CLI, or AWS SDKs using the new AdsPersonalizationTimeouts and AdsPersonalizationConcurrency parameters on your playback configurations.</p> \n<p>This feature is available in all AWS Regions where AWS Elemental MediaTailor is available.&nbsp;</p> \n<p>To learn more about configuring ADS request timeouts, personalization time budgets, and concurrency, see <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/configurations-create.html#configurations-advanced-settings\">Advanced settings</a> in the AWS Elemental MediaTailor User Guide.</p>"
  "2b762963b9c23cb6b4a07a47c737081c":
    "id": "2b762963b9c23cb6b4a07a47c737081c"
    "title": "AWS Security Hub MCP App brings exposure findings into your AI-assisted workflow (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-security-hub-mcp-app/"
    "published": "2026-07-28 02:00:00"
    "fetched": "2026-07-28 05:19:19"
    "summary": "<p>AWS announces the preview of the AWS Security Hub MCP App, a local Model Context Protocol (MCP) server that brings your Security Hub exposure findings directly into Claude Desktop.&nbsp;&nbsp;This capability can help accelerates your security investigations by reducing context switching and manual triage, letting you explore and act on your exposures without leaving your AI-assisted workflow.</p> \n<p>With the Security Hub MCP App, you can investigate your security posture in natural language: view your top exposure findings, drill into a finding’s attack path and expanded network path, examine correlated findings and affected resource configurations, and get remediation recommendations. Each tool call returns both a text summary for your AI agent to reason overover and an interactive visualization for you to verify in the same conversation. The MCP server runs locally on your machine using your existing AWS credentials, and every tool is read-only,-- no changes are made to your environment.</p> \n<p>The Security Hub MCP App is available at no additional cost to Security Hub customers. This feature is available in preview in all AWS commercial Regions that support Security Hub.&nbsp;To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-mcp-app.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "90c4fb08eb50ae9e9037ee8f03dae4ce":
    "id": "90c4fb08eb50ae9e9037ee8f03dae4ce"
    "title": "Amazon GameLift Streams now supports Custom Aspect Ratio and Dynamic Resolution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-gamelift-streams/"
    "published": "2026-07-28 03:58:00"
    "fetched": "2026-07-28 07:02:53"
    "summary": "<p>Amazon GameLift Streams now supports Custom Aspect Ratio and Dynamic Resolution, giving you greater control over the streaming experience across diverse player devices and network conditions.</p> \n<p>With Custom Aspect Ratio, you can configure a specific resolution per stream session to match your player's device — including portrait, landscape, ultra-wide, and square aspect ratios. This eliminates letterboxing or pillarboxing, delivering native full-screen experiences on mobile phones, tablets, and non-standard displays. Specify any resolution from 320 to 4096 pixels per dimension (up to 1080p total pixel budget) using the DisplayConfiguration parameter in the StartStreamSession API. You can also try custom resolution from the AWS Console.</p> \n<p>Dynamic Resolution automatically adapts stream quality when a player's network bandwidth fluctuates. When bandwidth drops, the stream gracefully reduces resolution to maintain smooth playback without frame drops or disconnections — and automatically recovers to full quality when conditions improve. Dynamic Resolution is enabled by default for all new stream groups with no configuration required. Customers will need to download the new Web SDK.</p> \n<p>Both features are available in all AWS Regions where Amazon GameLift Streams is offered. To learn more, see Custom stream resolution in the Amazon GameLift Streams Developer Guide.&nbsp;<br /> &nbsp;<br /> <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/custom-stream-resolution.html\">https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/custom-stream-resolution.html</a></p>"
  "5618bb995eb44d451ec05f6ebd981e41":
    "id": "5618bb995eb44d451ec05f6ebd981e41"
    "title": "Amazon Neptune now supports tag-based access control for IAM"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-neptune-tbac/"
    "published": "2026-07-28 07:00:00"
    "fetched": "2026-07-28 12:18:42"
    "summary": "<p><a href=\"https://aws.amazon.com/neptune/\" target=\"_blank\">Amazon Neptune</a> Database now supports tag-based access control (TBAC) for IAM, enabling customers to use AWS resource tags and IAM principal tags as conditions in IAM policies and Service Control Policies (SCPs) to control access to Neptune data-plane operations. Neptune already provides robust security through VPC isolation, TLS encryption, and IAM authentication, but customers managing multiple clusters at scale needed a dynamic, attribute-based mechanism to enforce organizational access boundaries. TBAC addresses this by allowing administrators to govern cluster access without enumerating specific cluster ARNs in every policy.<br /> <br /> With TBAC, IAM principals can only perform `neptune-db:*` actions against Neptune clusters whose tags match their own — for example, a principal tagged `Project=FraudDetection` is automatically restricted to clusters sharing that same tag. This eliminates lateral access risk within shared VPC environments, enforces team and environment-level isolation across projects, and supports federated identity workflows using SAML or OIDC session tags from external identity providers. Granular permissions like neptune-db:QueryLanguage can be used alongside TBAC for more fine-grained access control.<br /> <br /> This feature is available in all AWS Regions where Amazon Neptune is available and requires Neptune engine version 1.2.0.0 or later with IAM authentication enabled.<br /> <br /> To learn more about configuring tag-based access control for Amazon Neptune, including how to tag your DB clusters and IAM principals and deploy organization-wide guardrails using SCPs, visit the <a href=\"https://docs.aws.amazon.com/neptune/latest/userguide/iam-data-tbac.html\" target=\"_blank\">Amazon Neptune documentation</a>.</p>"
  "f5ef381a7911621e66d5e2d16a8ba77f":
    "id": "f5ef381a7911621e66d5e2d16a8ba77f"
    "title": "AWS Glue Data Quality now supports anomaly detection and writing results to the AWS Glue Data Catalog"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-glue-data-quality-catalog-anomaly-detection-write-results"
    "published": "2026-07-28 05:45:00"
    "fetched": "2026-07-28 12:18:42"
    "summary": "<p>AWS Glue Data Quality now supports anomaly detection for Catalog-based data quality evaluations and the ability to write evaluation results to AWS Glue Data Catalog (GDC) tables. These capabilities work across both ETL jobs and Catalog evaluations, giving you a consistent data quality experience regardless of workflow type.<br /> <br /> With anomaly detection support for GDC, you can identify unexpected changes in data statistics such as sudden drops in distinct values or row count spikes in your GDC tables using ML-powered time-series forecasting, without writing rules with explicit thresholds. This is especially valuable for data engineers monitoring hundreds of tables in the GDC who need to surface issues automatically.<br /> <br /> With results storage<b> </b>in GDC, Data Quality rule outcomes, profiling metrics, and anomaly predictions (with confidence bounds) are written back to GDC tables, creating a queryable record of all quality evaluations. Whether the evaluation runs in an ETL job or directly on a Catalog table, results can be queried at any time using standard SQL.<br /> <br /> AWS Glue Data Quality anomaly detection and Catalog results storage are available in all AWS commercial regions and AWS GovCloud (US) regions.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/data-quality.html\">AWS Glue Data Quality documentation</a>.</p>"
  "a62e4424870e7514d1a5f5948ebac53b":
    "id": "a62e4424870e7514d1a5f5948ebac53b"
    "title": "AWS Glue Data Quality now supports distribution statistics for data profiling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-glue-data-quality-distribution-profiling"
    "published": "2026-07-28 05:23:00"
    "fetched": "2026-07-28 12:18:42"
    "summary": "<p>AWS Glue Data Quality now supports a new Distribution Analyzer that generates frequency distribution profiles for your data. Using this new Distribution Analyzer in the Data Quality Definition Language (DQDL), you can generate histograms for numeric columns and value distributions for categorical, date, and boolean columns. With support for custom bin counts, you can explore the shape and patterns of your data at the granularity that matters most to your use case.<br /> <br /> Understanding how data is distributed is foundational to building reliable data pipelines. Distribution statistics help you quickly identify skewness, outliers, and unexpected patterns across your datasets, without writing custom code. The capability integrates directly with your existing DQDL rulesets, so you can add distribution profiling alongside your current data quality checks in a single evaluation run. Distribution statistics are stored in Amazon S3 for future querying through services like Amazon Athena, and are also surfaced through APIs, making it easy to integrate distribution insights into monitoring workflows and visualization tools, including SageMaker Unified Studio.<br /> <br /> AWS Glue Data Quality distribution statistics are available in all AWS commercial regions and AWS GovCloud (US) regions.<br /> <br /> To learn more about Glue Data Quality, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html\">AWS Glue Data Quality documentation</a>. To get started with using Distribution Analyzer, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/dqdl.html#dqdl-analyzers\">Analyzers documentation</a>.</p>"
"last_updated": "2026-07-28 12:18:42 JST"
