    "title": "AWS Elemental MediaTailor adds configurable ad timeout and concurrency controls for improved ad fill and faster startup"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/mediatail-configurable-ad-timeout-and-concurrency"
    "published": "2026-07-28 01:09:00"
    "fetched": "2026-07-28 03:21:59"
    "summary": "<p>AWS Elemental MediaTailor now gives you direct control over ad decision server (ADS) timeout. Previously, changing these settings required contacting AWS Support. You can now configure individual HTTP ad request timeouts, total ad personalization time budgets for live, VOD, and live ad prefetch, and enable parallel ADS requests.</p> \n<p>These settings allow you to optimize ad delivery performance for your specific workflows. For example, you can increase the personalization time budget for live events to improve ad fill rates or enable parallel ADS requests in VOD workflows to reduce overall response time for faster video startup. New prefetch-specific timeout settings give you additional granularity for livestream ad retrieval.</p> \n<p>You can configure these settings through the AWS Elemental MediaTailor console, AWS CLI, or AWS SDKs using the new AdsPersonalizationTimeouts and AdsPersonalizationConcurrency parameters on your playback configurations.</p> \n<p>This feature is available in all AWS Regions where AWS Elemental MediaTailor is available.&nbsp;</p> \n<p>To learn more about configuring ADS request timeouts, personalization time budgets, and concurrency, see <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/configurations-create.html#configurations-advanced-settings\">Advanced settings</a> in the AWS Elemental MediaTailor User Guide.</p>"
  "2b762963b9c23cb6b4a07a47c737081c":
    "id": "2b762963b9c23cb6b4a07a47c737081c"
    "title": "AWS Security Hub MCP App brings exposure findings into your AI-assisted workflow (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-security-hub-mcp-app/"
    "published": "2026-07-28 02:00:00"
    "fetched": "2026-07-28 05:19:19"
    "summary": "<p>AWS announces the preview of the AWS Security Hub MCP App, a local Model Context Protocol (MCP) server that brings your Security Hub exposure findings directly into Claude Desktop.&nbsp;&nbsp;This capability can help accelerates your security investigations by reducing context switching and manual triage, letting you explore and act on your exposures without leaving your AI-assisted workflow.</p> \n<p>With the Security Hub MCP App, you can investigate your security posture in natural language: view your top exposure findings, drill into a finding’s attack path and expanded network path, examine correlated findings and affected resource configurations, and get remediation recommendations. Each tool call returns both a text summary for your AI agent to reason overover and an interactive visualization for you to verify in the same conversation. The MCP server runs locally on your machine using your existing AWS credentials, and every tool is read-only,-- no changes are made to your environment.</p> \n<p>The Security Hub MCP App is available at no additional cost to Security Hub customers. This feature is available in preview in all AWS commercial Regions that support Security Hub.&nbsp;To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-mcp-app.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
"last_updated": "2026-07-28 05:19:19 JST"
