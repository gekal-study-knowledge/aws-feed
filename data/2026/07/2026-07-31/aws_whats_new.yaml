  "a727af1c2011c6f886587c206e4ce9fe":
    "id": "a727af1c2011c6f886587c206e4ce9fe"
    "title": "AWS announces general availability of Policy-Based Routing on AWS Transit Gateway"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-transit-gateway-policy-based-routing/"
    "published": "2026-07-31 00:39:00"
    "fetched": "2026-07-31 02:21:50"
    "summary": "<p>AWS Transit Gateway now supports Policy-Based Routing (PBR), giving network administrators granular control over how traffic is forwarded across their AWS network. With PBR, forwarding decisions can be based on a combination of packet attributes including source and destination IP addresses, ports, and protocol rather than destination IP address alone.<br /> <br /> Previously, customers needing traffic steering or workload isolation had to build multi-VPC architectures with additional routing hops, adding complexity and operational overhead. PBR eliminates this by extending Transit Gateway's native routing capabilities, enabling security architects and enterprise network teams to classify and direct traffic inline without extra infrastructure. Customers associate a policy table with a Transit Gateway attachment and define an ordered set of rules. Each rule classifies traffic and directs matching packets to a specified route table using first-match-wins logic. This supports use cases such as steering sensitive workloads through AWS Network Firewall or third-party inspection appliances, routing application traffic over AWS Direct Connect or AWS VPN paths based on source, port, or protocol, and isolating production and development environments into separate routing domains to limit lateral movement.<br /> <br /> Policy-Based Routing for AWS Transit Gateway is available in all commercial <a href=\"https://docs.aws.amazon.com/network-manager/latest/cloudwan/what-is-cloudwan.html#cloudwan-available-regions\">AWS Regions</a> where Transit Gateway is available. You can configure PBR using the AWS Management Console, AWS Command Line Interface (CLI), and the AWS Software Development Kit (SDK). PBR incurs no additional charge beyond standard Transit Gateway fees. To learn more about Policy-Based Routing for AWS Transit Gateway, visit the <a href=\"https://aws.amazon.com/transit-gateway/\">AWS Transit Gateway product page </a>.</p>"
  "c61dd5e013896afb073b4a7055c09634":
    "id": "c61dd5e013896afb073b4a7055c09634"
    "title": "OpenAI GPT-5.6 Terra and GPT-5.6 Luna pricing update on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/openai-gpt-terra-luna-pricing-bedrock/"
    "published": "2026-07-31 01:18:00"
    "fetched": "2026-07-31 04:19:05"
    "summary": "<p>On 7/30, OpenAI announced updated pricing for GPT-5.6 Terra and GPT-5.6 Luna.&nbsp;</p> \n<p>GPT-5.6 Terra is the balanced model for everyday production work, delivering GPT-5.5-level performance at lower cost. GPT-5.6 Luna is the fast, affordable model for high-volume inference tasks where latency and cost per token matter most. GPT-5.6 Sol pricing remains unchanged.&nbsp;Pricing on Amazon Bedrock matches OpenAI first-party rates, and usage counts toward your existing AWS commitments.&nbsp;</p> \n<p>GPT-5.6 Sol is available in US East (N. Virginia) and US East (Ohio). GPT-5.6 Terra and Luna are available in US East (N. Virginia), US East (Ohio), and US West (Oregon). For more details on the update, see the <a href=\"https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6/\">OpenAI blog</a>. For the latest pricing information for GPT-5.6 models on Amazon Bedrock, please visit the <a href=\"https://aws.amazon.com/bedrock/pricing/\">Amazon Bedrock pricing page</a>.</p>"
  "cce94a44c4411eab536dda7f704212c9":
    "id": "cce94a44c4411eab536dda7f704212c9"
    "title": "Amazon Bedrock announces up to 80% lower prices for OpenAI GPT‑5.6 models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/openai-gpt-terra-luna-pricing-bedrock/"
    "published": "2026-07-31 01:18:00"
    "fetched": "2026-07-31 06:03:54"
    "summary": "<p>Today, OpenAI announced lower prices for GPT‑5.6 Luna and GPT‑5.6 Terra. Effective July 30, 2026, on-demand inference prices on Amazon Bedrock for GPT‑5.6 Luna are reduced by 80%, while prices for GPT‑5.6 Terra are reduced by 20%. These reductions are in-line with <a href=\"https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6/\">OpenAI's first-party pricing changes</a> for these models.&nbsp;</p> \n<p>GPT‑5.6 Luna is optimized for fast, high-volume workloads and can use tools to complete multi-step workflows, making it well suited for content processing, classification, customer-service automation, and routine implementation tasks. GPT‑5.6 Terra balances intelligence, speed, and cost for everyday production workloads requiring more sophisticated reasoning. These price reductions enable customers to apply their capabilities across more applications, process larger workloads, and lower the cost per completed task. Pricing for GPT‑5.6 Sol remains unchanged. The new prices apply automatically, with no changes required from customers.</p> \n<p>GPT‑5.6 Luna and Terra are available in US East (N. Virginia), US East (Ohio), and US West (Oregon) through the OpenAI Responses API on the bedrock-mantle endpoint. To get started, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock OpenAI model documentation</a>.&nbsp;For the latest pricing information for GPT-5.6 models on Amazon Bedrock, please visit the <a href=\"https://aws.amazon.com/bedrock/pricing/\">Amazon Bedrock pricing page</a>.</p>"
  "79a8ee4f91e0bbdadc7dab092767332f":
    "id": "79a8ee4f91e0bbdadc7dab092767332f"
    "title": "AWS Direct Connect now supports BGP route visibility on Virtual Interfaces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-direct-connect-bgp-visibility/"
    "published": "2026-07-31 05:21:00"
    "fetched": "2026-07-31 08:01:23"
    "summary": "<p><span style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; white-space: pre-wrap;\">AWS Direct Connect now provides Border Gateway Protocol (BGP) route visibility, allowing you to view the routes exchanged between AWS and your on-premises routers across your private, transit, and public virtual interfaces (VIFs). You can now see which routes AWS accepted from your router and which routes AWS is advertising to your router, along with their AS path and BGP community values. This visibility helps network administrators troubleshoot routing issues, verify route propagation, and monitor their hybrid network connectivity.</span></p> \n<p><span style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; white-space: pre-wrap;\">With this feature, you can view accepted routes (routes AWS received from your router) and advertised routes (routes AWS sends to your router) directly in the Direct Connect console or programmatically using the ListVirtualInterfaceRoutes API action. Each route displays its prefix, address family, AS path, community values, and installation timestamp, giving you comprehensive insight into your routing topology. You can filter routes by prefix, AS path, community, or address family to quickly identify specific routing behaviors. This capability is particularly valuable when managing complex multi-region architectures, validating BGP policy configurations, or diagnosing unexpected traffic patterns.</span></p> \n<p>This feature is available in all AWS commercial Regions and the AWS China Regions (Beijing, operated by Sinnet, and Ningxia, operated by NWCD).</p> \n<p><span style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; white-space: pre-wrap;\">To learn more about BGP route visibility, visit the </span><a style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; color: inherit; text-decoration: inherit;\"><u></u></a><u><a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html\">AWS Direct Connect documentation</a></u><span style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; white-space: pre-wrap;\"> or access the feature through the </span><a style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; color: inherit; text-decoration: inherit;\"><u></u></a><u><a href=\"https://us-east-1.console.aws.amazon.com/directconnect/v2/home\">Direct Connect console</a></u><span style=\"margin: 0.0px; padding: 0.0px; border: 0.0px solid; white-space: pre-wrap;\">.</span></p> \n<p>&nbsp;</p>"
  "87146aaf16e1f95f9b32befd23a397b9":
    "id": "87146aaf16e1f95f9b32befd23a397b9"
    "title": "Amazon Redshift RG large and 12xlarge instances now available on the trailing track"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-redshift-rg-large-12xlarge-trailing-track"
    "published": "2026-07-31 05:02:00"
    "fetched": "2026-07-31 08:01:23"
    "summary": "<p>Amazon Redshift now supports Graviton-based RG instances on the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/tracks.html\">trailing track</a>.&nbsp;Starting today, rg.large and rg.12xlarge instance types are available for customers running workloads on the trailing track on patch P202 and onwards.<br /> <br /> The trailing track is designed for customers who prioritize stability for production workloads, running on a version already validated through the leading track. With RG instances now available on both tracks, customers can take advantage of AWS Graviton-powered performance - delivering up to 2.4x faster query performance than RA3 instances at 30% lower price per vCPU.<br /> <br /> Customers on the trailing maintenance track (patch P202 and later) can now create Amazon Redshift RG clusters in all AWS regions where RG is generally available. To get started, customers can provision a new cluster or resize an existing cluster to an rg.large or rg.12xlarge instance type using the AWS Management Console, AWS CLI, or AWS SDKs.For more information, see <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/cluster-versions.html\">Amazon Redshift cluster versions</a>.</p>"
  "8960a17719ba07a36c9a917e5a993660":
    "id": "8960a17719ba07a36c9a917e5a993660"
    "title": "IAM Policy Simulator moves to the IAM console and adds additional capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/iam-policy-simulator-iam-console/"
    "published": "2026-07-31 02:43:00"
    "fetched": "2026-07-31 08:01:23"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/\">AWS Identity and Access Management (IAM)</a> announces a major update to <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html\">IAM Policy Simulator</a>, the tool you use to test and validate the permissions your IAM policies grant before you deploy them. This update changes the simulator in three ways: it now lives in the IAM console, it can test service control policies (SCPs), and it adds flexibility to model more of the scenarios that security and platform teams simulate in practice.</p> \n<p>IAM Policy Simulator is now part of the IAM console, replacing the standalone simulator site, so you can test policies in the same place you manage your identities and policies.&nbsp;You can also now include SCPs in your simulation to test how your organization's SCP hierarchy interacts with identity and resource policies, and through the API, test how condition keys such as Region restrictions and tag requirements affect the outcome. Finally, new flexibility lets you exclude specific policies to model \"what if I remove this policy?\" scenarios, and cross-account simulations now report per-policy decisions for identity and resource-based policies, with the matched statements returned for a denied request reflecting only the policies that drove the decision. Together, these changes help teams automate policy unit testing, detect over-permissive access, and validate guardrails with greater confidence.</p> \n<p>These features are available in all AWS Regions where IAM Policy Simulator is available. You can access IAM Policy Simulator in the IAM console by choosing Policy simulator in the navigation pane.</p> \n<p>To learn more, see the following resources:</p> \n<ul> \n <li><p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_testing-policies.html\">Testing IAM policies with the IAM policy simulator</a></p> </li> \n <li><p>API reference on <a href=\"https://docs.aws.amazon.com/IAM/latest/APIReference/API_SimulatePrincipalPolicy.html\">SimulatePrincipalPolicy</a> and <a href=\"https://docs.aws.amazon.com/IAM/latest/APIReference/API_SimulateCustomPolicy.html\">SimulateCustomPolicy</a></p> </li> \n</ul>"
  "40529e7201602334bd92b50d394122c7":
    "id": "40529e7201602334bd92b50d394122c7"
    "title": "Amazon SageMaker Unified Studio brings richer Git version control to all project tools"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-sagemaker-unified-studio-git/"
    "published": "2026-07-31 07:37:00"
    "fetched": "2026-07-31 11:26:49"
    "summary": "<p>Amazon SageMaker Unified Studio gives project members full Git version control directly within the tools you already use - Query Editor, Visual ETL, Workflows, and Notebooks. The enhanced <b>Repositories</b> experience replaces the previous automatic sync approach with flexible, file-level version control. This brings a consistent source control experience across all project tools, including Notebooks, which previously had no Git support.</p> \n<p>You choose exactly which files to track in Git by adding them to a repository on GitHub, GitLab, or Bitbucket - source control is not enforced at the project level, so you decide what gets versioned and when. When you're ready, you commit and push all your changes in a single action. Repositories are decoupled from project creation, meaning you can add a repository to a project at any point after the project is created, as your needs evolve. Projects can connect to any number of repositories and branches at the same time, and you can create branches, pull updates, and resolve conflicts without ever leaving your project. If you use JupyterLab or Code Editor, you also retain full Git CLI access through the built-in terminal.&nbsp;</p> \n<p>This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is supported, for both IAM and IAM Identity Center domains. If your project uses the previous Git experience, you can opt in to the richer model by updating your project. To get started, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/storage.html\">Working with repositories</a> in the User Guide and <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/smus-admin-storage-guide.html\">Configuring Git connections</a> in the Admin Guide.</p>"
  "3ae79d5f847256a7f479588b2151132d":
    "id": "3ae79d5f847256a7f479588b2151132d"
    "title": "AWS CodeDeploy now available in five additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-codedeploy-five-additional-regions"
    "published": "2026-07-31 19:54:00"
    "fetched": "2026-07-31 22:56:30"
    "summary": "<p>AWS CodeDeploy is now available in five additional AWS Regions: Asia Pacific (New Zealand), Asia Pacific (Thailand), Asia Pacific (Taipei), Asia Pacific (Malaysia), and Mexico (Central). AWS CodeDeploy is a fully managed deployment service that automates application deployments to Amazon EC2 instances, on-premises servers, AWS Lambda functions, and Amazon ECS services. Customers in these newly added regions can now access CodeDeploy locally, enabling lower latency and supporting data residency requirements.</p> \n<p>With AWS CodeDeploy, developers and DevOps engineers can rapidly release new features while avoiding downtime during application deployments. The service eliminates error-prone manual deployment operations and scales seamlessly from a single instance to thousands, making it ideal for teams managing complex deployment pipelines across EC2 fleets, serverless Lambda functions, or containerized ECS workloads.</p> \n<p>AWS CodeDeploy is now available across 34 AWS commercial regions, as well as AWS GovCloud (US) and the AWS China Regions.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/codedeploy/\">AWS CodeDeploy product page</a>.</p>"
  "86c0d4526320d13caaa517ef4732b65a":
    "id": "86c0d4526320d13caaa517ef4732b65a"
    "title": "Amazon CloudWatch announces managed Prometheus collectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/cloudwatch-managed-collectors/"
    "published": "2026-07-31 22:06:00"
    "fetched": "2026-08-01 03:16:22"
    "summary": "<p>Amazon CloudWatch now supports collecting Prometheus metrics from your AWS infrastructure using fully managed collectors — enabling you to monitor Amazon EKS, Amazon EC2, Amazon ECS, Amazon MSK, and Amazon OpenSearch Service workloads without deploying or managing any agents.</p> \n<p>Previously, getting Prometheus metrics into CloudWatch required deploying, scaling, and maintaining a self-managed OpenTelemetry Collector. Managed Prometheus collectors eliminate that overhead. You provide a scrape configuration and a connection to your resources, and CloudWatch handles provisioning, scaling, and collection automatically. Metrics are delivered in OpenTelemetry format and can be queried alongside your AWS vended metrics using PromQL — providing unified alarming, dashboarding, and cross-service correlation in a single view.</p> \n<p>Managed collectors support Kubernetes service discovery (EKS), DNS-based service discovery via AWS Cloud Map (ECS), direct instance scraping (EC2), and open monitoring endpoints (MSK, OpenSearch). Metrics for EKS, MSK and Open Search can be visualized in automatic dashboards, queried with PromQL and used in CloudWatch alarms.</p> \n<p>This feature is available in all AWS Regions where the CloudWatch OTLP endpoint is available, except Asia Pacific (New Zealand). Managed Prometheus collectors are charged by the hour and standard CloudWatch OpenTelemetry metric ingestion pricing applies. To get started, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/managed-prometheus-collectors.html\">documentation</a>.</p>"
  "4463d23303eea553bfc279364c458188":
    "id": "4463d23303eea553bfc279364c458188"
    "title": "Amazon EC2 C7i-flex instances now available in Europe (Milan) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c7i-flex-instances-MXP-region/"
    "published": "2026-07-31 09:21:00"
    "fetched": "2026-08-01 03:16:22"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C7i-flex instances powered by custom 4th Gen Intel Xeon Scalable processors (code-named Sapphire Rapids) are available in Europe (Milan) region. These custom processors, available only on AWS, offer up to 15% better performance over comparable x86-based Intel processors utilized by other cloud providers.<br /> <br /> C7i-flex instances are the easiest way for you to get price performance benefits for a majority of compute intensive workloads, and deliver up to 19% better price-performance compared to C6i. C7i-flex instances offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources. With C7i-flex instances, you can seamlessly run web and application servers, databases, caches, Apache Kafka, and Elasticsearch, and more.<br /> <br /> To learn more, visit the EC2 <a href=\"https://aws.amazon.com/ec2/instance-types/c7i/\" rel=\"noopener noreferrer\" target=\"_blank\">C7i-flex</a> instances page.</p>"
  "475a19796a1593aeb267b84a3ff8ca23":
    "id": "475a19796a1593aeb267b84a3ff8ca23"
    "title": "Amazon EC2 C7i instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c7i-instances-mxp-yyc-region/"
    "published": "2026-07-31 09:17:00"
    "fetched": "2026-08-01 03:16:22"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C7i instances powered by custom 4th Gen Intel Xeon Scalable processors (code-named Sapphire Rapids) are available in Europe (Milan) and Canada West (Calgary) regions. These custom processors, available only on AWS, offer up to 15% better performance over comparable x86-based Intel processors utilized by other cloud providers.<br /> <br /> C7i instances deliver up to 15% better price-performance versus C6i instances and are a great choice for all compute-intensive workloads, such as batch processing, distributed analytics, ad-serving, and video encoding. C7i instances offer larger instance sizes, up to 48xlarge, and two bare metal sizes (metal-24xl, metal-48xl). These bare-metal sizes support built-in Intel accelerators: Data Streaming Accelerator, In-Memory Analytics Accelerator, and QuickAssist Technology that are used to facilitate efficient offload and acceleration of data operations and optimize performance for workloads. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c7i/\" target=\"_blank\">EC2 C7i instances Page</a>.</p>"
  "8874d2f88ebfbb951d8a72b7133243dc":
    "id": "8874d2f88ebfbb951d8a72b7133243dc"
    "title": "AWS Lambda now supports Java 8, 11, and 17 on Amazon Linux 2023"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-lambda-java-amazon-linux/"
    "published": "2026-07-31 23:00:00"
    "fetched": "2026-08-01 08:58:20"
    "summary": "<p>AWS Lambda now supports Java 8, Java 11, and Java 17 runtimes on Amazon Linux 2023 (AL2023), available as both managed runtimes and container base images. These new runtimes enable customers running Lambda functions on Java 8, 11, or 17 to migrate from Amazon Linux 2 (AL2) to AL2023 without requiring a simultaneous Java version upgrade.<br /> <br /> The existing Lambda runtimes for Java 8, 11 and 17 run on AL2, which reached end of life on June 30, 2026. To maintain support coverage and SLA eligibility, customers must migrate their functions to an AL2023-based runtime. AWS recommends that customers upgrade to Java 21 or Java 25 on AL2023 as the preferred migration path. These runtimes offer the latest language features and performance improvements. For customers who are not yet ready to upgrade their Java version, the new Java 8, 11, and 17 runtimes on AL2023 provide an alternative forward path. In addition, the existing AL2-based Lambda runtimes for Java 8, 11, and 17 will remain supported and continue to receive patches for critical and selected important security issues until June 30, 2027, giving customers a full year after AL2's end of life to complete their migration.<br /> <br /> The Java 8, 11, and 17 runtimes on AL2023 are available in all AWS Regions where Lambda is available, including the AWS GovCloud (US) Regions and the China Regions.<br /> <br /> To learn more about AL2023 support in Lambda, see our <a href=\"https://aws.amazon.com/blogs/compute/introducing-the-amazon-linux-2023-runtime-for-aws-lambda/\">blog post</a>. For customers ready to upgrade to Java 21 or Java 25, you can use <a href=\"https://aws.amazon.com/transform/custom/\">AWS Transform custom</a> to assist with the migration. To learn more about Lambda runtimes, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html\">Lambda runtimes documentation</a>.</p>"
  "9bda2d180560d7197716bbb52cf5c887":
    "id": "9bda2d180560d7197716bbb52cf5c887"
    "title": "Amazon Location Service adds Search Nearby support for GrabMaps in Southeast Asia"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-location-service-search-nearby-grabmaps"
    "published": "2026-07-31 23:00:00"
    "fetched": "2026-08-02 04:02:40"
    "summary": "<p>Amazon Location Service now supports proximity-based point of interest discovery with GrabMaps data in the Asia Pacific (Singapore) and Asia Pacific (Malaysia) AWS Regions. Builders creating local discovery, delivery, and mobility applications in Southeast Asia can surface relevant nearby places using hyperlocal data validated by millions of daily Grab journeys.<br /> <br /> SearchNearby returns places within a specified radius of a user's location, ranked by distance. Developers can filter results by category (such as fuel stations, hospitals, or restaurants) to narrow responses to what their application needs. This enables a delivery platform to find the closest pickup points, a ride-hailing app to show nearby dining options, or a travel app to locate services within range.<br /> <br /> GrabMaps delivers hyperlocal mapping data purpose-built for Southeast Asia. Millions of daily journeys across the Grab platform continuously validate road networks, addresses, and points of interest, capturing changes in real time. GrabMaps covers detailed back alleys, narrow side streets, and motorcycle-accessible routes across more than 500 cities in Singapore, Malaysia, Thailand, Vietnam, Indonesia, Philippines, Myanmar, and Cambodia.<br /> <br /> To get started, see the <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/search-nearby.html\">Search Nearby Developer Guide</a>, <a href=\"https://docs.aws.amazon.com/location/latest/APIReference/API_geoplaces_SearchNearby.html\">API reference</a>, and the <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/GrabMaps.html\">GrabMaps Overview page</a>.</p>"
  "a4f8bd234f03c393e58e49d0b78a5f79":
    "id": "a4f8bd234f03c393e58e49d0b78a5f79"
    "title": "Amazon Web Services now introduces Context Ontology Accelerator"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-context--ontology-accelarator-generally-available"
    "published": "2026-07-31 19:00:00"
    "fetched": "2026-08-04 01:19:46"
    "summary": "<p>Today, AWS announces Context Ontology Accelerator, an open source accelerator that helps organizations build an ontology of their business — a machine-readable model of their products, customers, policies, and the rules that define how they operate so AI agents make accurate, consistent, explainable, and auditable decisions. Context Ontology Accelerator connects to your structured and/or unstructured data sources, and uses AI to draft an ontology; your domain experts review, edit, and approve every element of it. The approved ontology is stored in a knowledge graph you own, expressed in open W3C standards so it works with any standards-based tooling, and any agent can consume it through the included Model Context Protocol (MCP) server.<br /> <br /> Organizations building AI agents need more trust in their agents' decisions, with outputs they can explain and audit. The context those agents require — entities, rules, policies, relationships — is scattered across dozens of systems with conflicting schemas and naming conventions. Teams spend months reconciling definitions and encoding them into prompts and point integrations, and because the results are not traceable, teams block agents from moving from proof-of-concept to production. Context Ontology Accelerator reduces what would take months of manual ontology authoring into days — from connecting data to serving governed answers to agents.<br /> <br /> Context Ontology Accelerator is available today on GitHub under Apache 2.0. The initial release uses Amazon Neptune as the graph store, Amazon OpenSearch Serverless as the vector store, and foundation models hosted on Amazon Bedrock; deploy it yourself or engage AWS Professional Services. Context Ontology Accelerator’s managed, user-defined ontology capability will become a fully managed feature native to AWS Context. Customers who get started with Context Ontology Accelerator to create ontologies will be able to use and manage them with AWS Context. To learn more, read the <a href=\"https://aws.github.io/context-ontology-accelerator/\">documentation</a>.</p>"
"last_updated": "2026-08-04 01:19:46 JST"
