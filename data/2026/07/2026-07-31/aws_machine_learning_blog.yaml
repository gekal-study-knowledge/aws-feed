    "title": "How Yahoo enhances search retargeting using Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-yahoo-enhances-search-retargeting-using-amazon-bedrock/"
    "published": "2026-07-31 01:40:36"
    "fetched": "2026-07-31 02:21:52"
    "summary": "In this post, we demonstrate how Yahoo implemented Amazon Bedrock to enhance their Search Retargeting (SRT) capabilities in the Yahoo DSP ad tech suite. SRT is a core audience targeting solution that helps advertisers reach users based on their historical search behavior, bridging search intent with display, video, and native advertising. Beyond targeting keywords entered on Yahoo Search, SRT uses AI to identify and engage users who demonstrate intent through search activity both on Yahoo and across integrated partner systems."
  "9663e102948ba141492351f01e2ceb05":
    "id": "9663e102948ba141492351f01e2ceb05"
    "title": "Inference meta-monitoring for Amazon SageMaker AI endpoints with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/inference-meta-monitoring-for-amazon-sagemaker-ai-endpoints-with-amazon-quick/"
    "published": "2026-07-31 01:10:10"
    "fetched": "2026-07-31 02:21:52"
    "summary": "Learn how to build an inference meta-monitoring system for Amazon SageMaker AI endpoints using Amazon Quick. This governance layer sits above production ML inference pipelines to continuously track prediction and data quality, detect drift, integrate delayed ground truth, and surface automated performance dashboards."
  "5359ffdbcbcbe98c6d8ecf3475ad50a0":
    "id": "5359ffdbcbcbe98c6d8ecf3475ad50a0"
    "title": "Introducing explicit prompt caching for OpenAI GPT-5.6 models on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-explicit-prompt-caching-for-openai-gpt-5-6-models-on-amazon-bedrock/"
    "published": "2026-07-31 01:02:32"
    "fetched": "2026-07-31 02:21:52"
    "summary": "OpenAI GPT-5.6 Sol, Terra, and Luna are now generally available on Amazon Bedrock, along with explicit prompt caching that gives you precise control over which parts of your prompt are cached and reused. Learn how to get started, set up explicit caching, and migrate existing GPT workloads to reduce inference cost."
  "350fd1f5bd00be30262073c4766db1ac":
