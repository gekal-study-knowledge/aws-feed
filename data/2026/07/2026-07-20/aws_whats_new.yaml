    "title": "Amazon CloudWatch announces coding agent insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/cloudwatch-coding-agent-insights/"
    "published": "2026-07-20 18:51:00"
    "fetched": "2026-07-21 00:08:08"
    "summary": "<p>Amazon CloudWatch announces the launch of coding agent insights, giving engineering leaders visibility into how AI coding tools are driving value across their organization. Coding Agent Insights integrates with <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-claude-apps-gateway-for-aws/\">Claude apps gateway for AWS</a> to collect telemetry from Claude Code without additional instrumentation. Other supported coding agents include Codex and GitHub Copilot.&nbsp;</p> \n<p>As organizations scale AI coding agent adoption, they need to understand return on investment. Coding agent insights is built on OpenTelemetry metrics emitted by your coding agents and presents them alongside your existing CloudWatch operational data. This helps you answer questions like which teams would benefit from expanded access, where are agents accelerating delivery, and how can you right-size token budgets across departments. You can track spend trends, set proactive token billing alerts, correlate agent adoption with improvements in commit throughput and pull request velocity, or identify the models delivering the best cost-to-output ratio for your workloads.</p> \n<p>CloudWatch coding agent insights is available in all AWS commercial regions except Middle East (UAE), Middle East (Bahrain), and Israel (Tel Aviv). Configure your Claude apps gateway to emit telemetry to CloudWatch using the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/coding-agents-claude-code-gateway.html\">setup guide</a> and view the Coding Agent Insights dashboard in the CloudWatch console. Standard CloudWatch OpenTelemetry metric ingestion pricing applies — see metrics&nbsp;<a href=\"https://aws.amazon.com/cloudwatch/pricing/\">pricing</a> for details. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/coding-agents-insights.html\">the documentation</a>.</p>"
