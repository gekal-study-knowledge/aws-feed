    "id": "5f6601f1f9db4b23d4c06bc6d08fa981"
    "title": "Amazon CloudWatch announces coding agent insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/cloudwatch-coding-agent-insights/"
    "published": "2026-07-20 18:51:00"
    "fetched": "2026-07-21 00:08:08"
    "summary": "<p>Amazon CloudWatch announces the launch of coding agent insights, giving engineering leaders visibility into how AI coding tools are driving value across their organization. Coding Agent Insights integrates with <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-claude-apps-gateway-for-aws/\">Claude apps gateway for AWS</a> to collect telemetry from Claude Code without additional instrumentation. Other supported coding agents include Codex and GitHub Copilot.&nbsp;</p> \n<p>As organizations scale AI coding agent adoption, they need to understand return on investment. Coding agent insights is built on OpenTelemetry metrics emitted by your coding agents and presents them alongside your existing CloudWatch operational data. This helps you answer questions like which teams would benefit from expanded access, where are agents accelerating delivery, and how can you right-size token budgets across departments. You can track spend trends, set proactive token billing alerts, correlate agent adoption with improvements in commit throughput and pull request velocity, or identify the models delivering the best cost-to-output ratio for your workloads.</p> \n<p>CloudWatch coding agent insights is available in all AWS commercial regions except Middle East (UAE), Middle East (Bahrain), and Israel (Tel Aviv). Configure your Claude apps gateway to emit telemetry to CloudWatch using the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/coding-agents-claude-code-gateway.html\">setup guide</a> and view the Coding Agent Insights dashboard in the CloudWatch console. Standard CloudWatch OpenTelemetry metric ingestion pricing applies — see metrics&nbsp;<a href=\"https://aws.amazon.com/cloudwatch/pricing/\">pricing</a> for details. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/coding-agents-insights.html\">the documentation</a>.</p>"
  "3eea54a0ffe4d790b52eaf2e77c83801":
    "id": "3eea54a0ffe4d790b52eaf2e77c83801"
    "title": "Introducing KNFSD File Cache - Now in Preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/knfsd-file-cache/"
    "published": "2026-07-20 17:00:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Today, AWS announces the availability of KNFSD File Cache, an open-source, Apache-2.0 licensed solution for deploying a scalable, high-speed Network File System (NFS) cache on AWS. KNFSD File Cache mounts exports from one or more source NFS servers, whether on-premises, in another AWS Availability Zone or Region, or in another cloud over AWS Interconnect - multicloud, and re-exports them to NFS clients in AWS. You can front multiple on-premises filers, in-cloud file systems such as Amazon FSx for OpenZFS and Amazon FSx for NetApp ONTAP, and any other NFS v3, v4.1, or v4.2 compliant filer. Frequently read data is cached in memory and on local NVMe storage, so files cross the high-latency link to the source once and are then served to large compute fleets at local VPC speed. The solution is designed for read-heavy burst compute workloads such as visual effects rendering, simulation, financial services, health and life sciences, microprocessor design, weather forecasting, and energy.</p> \n<p>KNFSD File Cache builds on standard Linux kernel technology: nfs-kernel-server provides NFS re-export, and FS-Cache provides the persistent disk cache. Because it uses the native NFS stack, it fully supports the NFS client-server protocol, including byte-range reads and writes, synchronous and asynchronous writes, and both write-through and write-around modes. You build the cache Amazon Machine Image (AMI) with Packer, then deploy the cluster with the included Terraform module. Cache nodes run in an Amazon Elastic Compute Cloud (Amazon EC2) Auto Scaling group on AMD, Intel, or AWS Graviton instances, with client traffic distributed by DNS round-robin or a Network Load Balancer, and optional automatic scaling based on the number of active NFS client connections. An Amazon CloudWatch dashboard provides more than 70 metrics through an OpenTelemetry-based agent, which can also publish to third-party tools such as Prometheus and Grafana.</p> \n<p>KNFSD File Cache (preview) is available in all AWS Regions. There are no licensing costs; you pay only for the AWS resources you consume.</p> \n<p>To get started, visit the KNFSD File Cache GitHub <a href=\"https://github.com/awslabs/knfsd-file-cache\">repository</a>, launch <a href=\"https://aws.amazon.com/blogs/media/introducing-knfsd-file-cache-extending-your-nfs-storage-into-the-cloud/\">blog</a>, and <a href=\"https://docs.aws.amazon.com/solutions/knfsd-file-cache-on-aws\">AWS Solutions Guidance</a>. For detailed deployment and configuration guidance, see the GitHub <a href=\"https://github.com/awslabs/knfsd-file-cache/blob/main/docs/index.md\">documentation</a>.</p>"
