  "59f2e3b30d2a800b5f54b3eec5717dfe":
    "id": "59f2e3b30d2a800b5f54b3eec5717dfe"
    "title": "AWS CodePipeline now available in Asia Pacific (New Zealand) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-codepipeline-new-zealand/"
    "published": "2026-07-06 18:00:00"
    "fetched": "2026-07-07 01:16:49"
    "summary": "<p>Starting today, AWS CodePipeline is now available in Asia Pacific (New Zealand) Region (ap-southeast-6). AWS CodePipeline is a continuous delivery service that enables you to model, visualize, and automate the steps required to release your software. With CodePipeline, you model the full release process for building your code, deploying to pre-production environments, testing your application and releasing it to production. CodePipeline then builds, tests, and deploys your application according to the defined workflow every time there is a code change. You can integrate partner tools and your own custom tools into any stage of the release process to form an end-to-end continuous delivery solution.</p> \n<p>CodePipeline integrates natively with other AWS services (such as CodeBuild, CodeDeploy, and CloudFormation) and supports third-party integrations, such as GitHub or with your own custom plugin, offering a comprehensive solution for orchestrating end-to-end CI/CD pipelines. By integrating manual approval gates, IAM-based access controls, and encryption of artifacts at rest and in transit, CodePipeline helps teams enforce governance policies and maintain a robust security posture throughout the software delivery lifecycle. CodePipeline enables organizations to automate security scans and compliance checks directly within their CI/CD workflows, ensuring consistent and reliable validation against industry frameworks.</p> \n<p>To get started, you can sign in to the <a href=\"https://console.aws.amazon.com/codepipeline/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a> and create a pipeline to start using the service. If you want an introduction to CodePipeline, see <a href=\"https://docs.aws.amazon.com/codepipeline/latest/userguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Getting Started</a>, which includes step-by-step tutorials. &nbsp;With CodePipeline, you only pay for what you use. There are no upfront fees or long-term commitments. See the <a href=\"https://aws.amazon.com/codepipeline/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a> for additional details on CodePipeline.</p>"
  "0f549647010894e084325321d5704ffc":
    "id": "0f549647010894e084325321d5704ffc"
    "title": "AWS Secrets Manager adds managed external secrets support for Paddle and GitLab"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/secrets-manager-managed-external-secrets-paddle-gitlab/"
    "published": "2026-07-06 16:00:00"
    "fetched": "2026-07-07 03:52:30"
    "summary": "<p>AWS Secrets Manager now extends its managed external secrets capability to include Paddle API Keys and GitLab Access Tokens. Managed external secrets enable customers to automatically rotate third-party credentials directly from AWS Secrets Manager by offering first-class integration with supported third-party services.<br /> <br /> With this launch, you can manage rotation for Paddle API keys using Paddle's native rotation API, which provides a configurable grace period that allows applications to seamlessly transition to new keys without interruption. For GitLab, you can now rotate three types of access tokens — Personal Access Tokens, Group Access Tokens, and Project Access Tokens — using GitLab's atomic rotation mechanism.<br /> <br /> These new integrations join existing managed external secrets integrations with BigID, Confluent Cloud, Datadog, MongoDB Atlas, Salesforce, and Snowflake, enabling customers to manage third-party software vended secrets.<br /> Paddle and GitLab managed external secrets are available in all AWS Regions where AWS Secrets Manager managed external secrets is supported. To learn more, visit the <a>AWS Secrets Manager managed external secrets documentation</a>.</p>"
"last_updated": "2026-07-07 03:52:30 JST"
