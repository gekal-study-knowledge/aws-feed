  "178e4d3eab1734d73b654c54a9e73b57":
    "id": "178e4d3eab1734d73b654c54a9e73b57"
    "title": "フロンティアモデルの安全なリリースに向けた AWS の取り組み"
    "link": "https://aws.amazon.com/jp/blogs/news/safely-releasing-frontier-models-to-customers/"
    "published": "2026-07-06 14:56:34"
    "fetched": "2026-07-06 16:08:58"
    "summary": "Amazon Bedrock で Anthropic の Claude Fable 5 モデルが、悪用防止のためのさらに強力なガードレールを備えて再びご利用いただけるようになりました。本記事では、サイバー能力を持つフロンティアモデルを防御側に届けながら攻撃者による悪用を防ぐバランスの取り方、Project Glasswing を通じた Anthropic との連携、問題の重大度と対応の SLA など、フロンティアモデルを安全にお客様へ提供するための AWS の取り組みを紹介します。"
  "407b2310793329ee9e5be09e2b7c3120":
    "id": "407b2310793329ee9e5be09e2b7c3120"
    "title": "クラスターアップグレードを安全かつ信頼性高く管理できる Amazon EKS バージョンロールバックを発表"
    "link": "https://aws.amazon.com/jp/blogs/news/announcing-amazon-eks-rollback-for-safe-and-reliable-management-of-cluster-upgrades/"
    "published": "2026-07-06 12:29:01"
    "fetched": "2026-07-06 16:08:58"
    "summary": "Amazon EKS バージョンロールバックを発表します。これは、クラスター管理者が Amazon Elastic Kubernetes Service (Amazon EKS) クラスターにおける Kubernetes バージョンのアップグレードを安全にロールバックできる新機能です。この機能により、追加のセーフティネットを備えた状態で EKS フリート全体に新しいバージョンのアップグレードを自信を持って展開できるようになりました。"
  "5bfb7be26ee85a8245ba23aa679d7648":
    "id": "5bfb7be26ee85a8245ba23aa679d7648"
    "title": "週刊生成AI with AWS – 2026年6月29日週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260629/"
    "published": "2026-07-06 18:28:56"
    "fetched": "2026-07-06 21:00:27"
    "summary": "週刊生成AI with AWS, お客様事例が充実した 2026 年 6 月 29 日号 - プリモグローバルホールディングス様、株式会社ラクス様、ITbook 株式会社様、株式会社オーレックホールディングス様の国内事例ブログを紹介。また、Kiro の Agent Focus や GitLab 連携、OpenAPI からのテストスイート生成などのブログ記事も。サービスアップデートでは Claude Sonnet 5 の AWS 提供開始や Amazon Bedrock AgentCore のリージョン拡大をはじめとするアップデートを紹介。"
  "3c76c812ff361c0a60533f142ae2883b":
    "id": "3c76c812ff361c0a60533f142ae2883b"
    "title": "週刊AWS – 2026/6/29週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260629/"
    "published": "2026-07-06 22:16:10"
    "fetched": "2026-07-07 01:16:50"
    "summary": "Amazon S3 サーバーアクセスログが Amazon CloudWatch Logs と Amazon S3 Tables への配信に対応、AWS WAF が Amazon Bedrock AgentCore Gateway のサポートを追加、AWS のサービスおよび機能の提供状況変更のお知らせ、Amazon SageMaker AI が Gemma 4 モデルのサーバーレスモデルカスタマイズをサポート、Claude Sonnet 5 が AWS で利用可能に、Amazon WorkSpaces for AI agents の一般提供を発表、Amazon OpenSearch Service にログ分析向けに最適化された新エンジンが登場、AWS AppConfig が A/B テスト向けのマネージド実験ツールを提供開始、Amazon RDS のクロスリージョン自動バックアップが 4 つの追加 AWS リージョンで利用可能に、AWS Config が 8 つの新しいリソースタイプに対応、Amazon EC2 X8i インスタンスが追加リージョンで利用可能に、Amazon SageMaker Unified Studio が Terraform によるプロビジョニングをサポート"
"last_updated": "2026-07-07 01:16:50 JST"
