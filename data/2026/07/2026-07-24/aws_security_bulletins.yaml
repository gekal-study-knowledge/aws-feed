    "title": "CVE-2026-16584 - AWS API MCP Server Security Policy Bypass via Startup Failure"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-063-aws/"
    "published": "2026-07-24 00:39:32"
    "fetched": "2026-07-24 02:16:31"
    "summary": "<p><b>Bulletin ID:</b> 2026-063-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 07/23/2026 08:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The AWS API MCP Server (awslabs.aws-api-mcp-server) is an open-source MCP server that lets AI assistants execute AWS CLI commands against a user's AWS account. It includes an optional, user-configured security policy that can deny or gate specific AWS operations. We identified CVE-2026-16584. On startup, the server loads the data used to enforce this security policy. If that initialization fails, the server continues running with the per-request policy check skipped for the lifetime of the process. When a security policy is configured without the fail-closed modes enabled, an actor could then cause AWS API operations that the policy was configured to deny or gate to execute without enforcement. IAM permissions on the configured credentials remain in effect and are unaffected.</p> \n<p><b>Impacted versions:</b> &gt;= 0.2.13 AND &lt; 1.3.47</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-07-24 02:16:31 JST"
