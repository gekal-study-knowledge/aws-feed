"entries":
  "7749c2c99fce10de3f8ebe06c6cdff85":
    "id": "7749c2c99fce10de3f8ebe06c6cdff85"
    "title": "Amazon Bedrock AgentCore now delivers unified observability with traces and logs in a single log group"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-bedrock-agentcore-unified-observability-single-log-group/"
    "published": "2026-07-24 02:00:00"
    "fetched": "2026-07-24 02:16:30"
    "summary": "<p>Amazon Bedrock AgentCore now delivers agent traces and prompts to the same log group as your agent's logs, giving you unified observability for AI agents in a single Amazon CloudWatch log group.</p> \n<p>Previously, AgentCore split agent telemetry across multiple destinations trace spans went to the shared `aws/spans` log group while event logs containing prompts, inputs, and outputs went to a separate resource-specific log group. This meant debugging an agent invocation required searching across multiple log groups, and customers could not apply fine-grained access control or customer-managed key (CMK) encryption at the individual agent level. With today's launch, all of an agent's telemetry traces, prompts, structured logs, and standard output is delivered to a single per-agent log group (`/aws/bedrock-agentcore/runtimes/&lt;agent_id&gt;-&lt;endpoint_name&gt;`). You can now correlate traces and logs in one place, scope IAM policies and CMK encryption to individual agents, and export all telemetry by subscribing to a single log group. For multi-agent systems, each agent's complete execution history stays together, making end-to-end debugging straightforward.</p> \n<p>All newly created agents starting July 20, 2026 in supported AWS Regions use unified observability by default starting no configuration needed. For existing agents, set the `UNIFIED_TRACES_DESTINATION_ENABLED=true` environment variable on your agent runtime and upgrade ADOT to version 0.17.1 or later. This feature is available in all AWS commercial regions where AgentCore runtime is supported. Learn more in the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html\">AgentCore Developer Guide</a>.</p>"
  "723536b3ac7bc9faae1fb1b454da8381":
    "id": "723536b3ac7bc9faae1fb1b454da8381"
    "title": "Claude Sonnet 5 is now available on Amazon Bedrock in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/claude-sonnet-5-govcloud/"
    "published": "2026-07-24 01:02:00"
    "fetched": "2026-07-24 02:16:30"
    "summary": "<p>AWS GovCloud (US) now offers Claude Sonnet 5 on Amazon Bedrock. Claude Sonnet 5 delivers strong performance across coding, professional work, and agentic tasks while maintaining the balance of capability, cost, and speed. For coding, it navigates large codebases, lands multi-file changes, and carries debugging and refactoring tasks through to completion with fewer rounds of correction. For agents, it calls tools precisely, holds state across many steps, and recovers from errors so more runs finish correctly the first time. For knowledge work, it builds spreadsheets, drafts documents, and turns unstructured material into structured analysis. </p> \n<p>With this launch, <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/claude-opus-4.8-aws-govcloud-us/\">Claude Opus 4.8</a> and Claude Sonnet 5 are available on bedrock-runtime endpoints in AWS GovCloud (US-West and US-East) and bedrock-mantle endpoints in AWS GovCloud (US-West) for performing inference. Bedrock Mantle, Amazon Bedorck's next-generation inference engine, supports the Anthropic Messages API. Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Sonnet 5 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>. </p>"
  "da11a13a276979eb8ace41c58405dd30":
    "id": "da11a13a276979eb8ace41c58405dd30"
    "title": "Amazon RDS for MySQL supports MySQL 9.7 in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-mysql-long-term-9-7-rds-database-preview/"
    "published": "2026-07-24 03:05:00"
    "fetched": "2026-07-24 04:09:02"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/mysql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MySQL</a>&nbsp;now supports version community MySQL 9.7 in the&nbsp;<a href=\"https://aws.amazon.com/rds/databasepreview/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the latest Release on Amazon RDS for MySQL. This preview environment provides a sandbox where you can test applications and explore new MySQL 9.7 capabilities before they become generally available.<br /> <br /> MySQL 9.7 is the latest Long-Term Support release for community MySQL. MySQL Long-Term Support releases include bug fixes, security patches, as well as new features. Please refer to the&nbsp;<a href=\"https://dev.mysql.com/doc/refman/9.7/en/mysql-nutshell.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL 9.7 release notes</a>&nbsp;for more details about this release.<br /> <br /> Amazon RDS Database Preview Environment database instances are retained for a maximum of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots created in the preview environment can only be used to create or restore database instances within the preview environment. Amazon RDS Database Preview Environment database instances are&nbsp;<a href=\"https://aws.amazon.com/rds/mysql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">priced the same as production RDS instances created in the US East (Ohio) Region</a>. For further information, see&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Previewenvironment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Working with the Database Preview Environment</a>.</p>"
  "45c6bcd4833365941270784ef9436736":
    "id": "45c6bcd4833365941270784ef9436736"
    "title": "Announcing region expansion of G7e instances on SageMaker AI inference"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/g7e-sagemaker-ai/"
    "published": "2026-07-24 00:04:00"
    "fetched": "2026-07-24 04:09:02"
    "summary": "<p>We are pleased to announce the availability of <a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\">Amazon EC2 G7e instances </a>in Asia Pacific (Seoul), Europe (London), and Asia Pacific (Tokyo) on Amazon SageMaker AI inference. G7e instances feature up to 8 NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs with 96 GB of memory per GPU, 5th Generation Intel Xeon processors, and up to 1,600 Gbps of Elastic Fabric Adapter networking bandwidth, delivering up to 2.3x inference performance compared to previous-generation G6e instances.<br /> <br /> With this region expansion, you can now deploy inference endpoints on G7e instances closer to your end users in Asia and Europe, reducing latency for generative AI workloads. G7e instances provide up to 768 GB of total GPU memory on a single instance, enabling you to serve medium-to-large language models of up to 70B parameters with FP8 precision without multi-node configurations. These instances are well suited for LLM inference, image and video generation, spatial computing, and scientific computing workloads that require high GPU memory capacity and bandwidth.<br /> <br /> G7e instances for SageMaker AI inference are now available in Asia Pacific (Seoul), Europe (London), and Asia Pacific (Tokyo), in addition to previously supported regions. For pricing information on these instances, please visit our <a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\"><u>pricing page</u></a>.</p>"
  "3704a665e649d88adbf9c03e9a0bcfbb":
    "id": "3704a665e649d88adbf9c03e9a0bcfbb"
    "title": "Amazon EVS is now available in additional Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-evs-available-in-additional-regions/"
    "published": "2026-07-24 01:24:00"
    "fetched": "2026-07-24 05:59:08"
    "summary": "<p>Today, we're announcing that Amazon Elastic VMware Service (Amazon EVS) is now available in the Asia Pacific (Seoul), Europe (Zurich), and Europe (Stockholm)&nbsp;Regions. This expansion provides more options to leverage the scale and flexibility of AWS for running your VMware workloads in the cloud.<br /> <br /> Amazon EVS lets you run VMware Cloud Foundation (VCF) directly within your Amazon Virtual Private Cloud (VPC) on EC2 bare-metal instances, powered by AWS Nitro. You can set up a complete VCF environment in just a few hours, enabling rapid workload migration to AWS to help you eliminate aging infrastructure, reduce operational risks, and meet critical timelines for exiting your data center. This launch supports all existing Amazon EVS features, including <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-evs-vcf9/\">VCF 9.0 and 9.1 support</a> to take advantage of the latest VMware features, such as memory tiering.<br /> <br /> The added availability in these Regions gives your VMware workloads lower latency through closer proximity to your end users, compliance with data residency or sovereignty requirements, and additional high availability and resiliency options for your enhanced redundancy strategy.<br /> <br /> To get started, visit the Amazon EVS <a href=\"https://aws.amazon.com/evs/\">product detail page</a> and <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>.&nbsp;</p>"
  "10a72eeee4e4838ef5734a3696ebc829":
    "id": "10a72eeee4e4838ef5734a3696ebc829"
    "title": "AWS now supports automatic credit memo application preferences"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/credit-memo-applications/"
    "published": "2026-07-24 03:16:00"
    "fetched": "2026-07-24 07:08:20"
    "summary": "<p>AWS now enables customers who pay through electronic funds transfer to configure preferences for how credit memos are automatically applied to outstanding invoices. Customers can choose from different application preferences directly on the Billing and Cost Management console to match their internal payment processes. These options include combinations of applying credit memos to the original invoice, next eligible invoice, and oldest unpaid invoice. By default,&nbsp;credit memos are applied to the original invoice first, then to future invoices, unless a different preference is selected.<br /> <br /> Automatic credit memo application preferences are available in all commercial AWS Regions. To get started, visit the <a href=\"https://console.aws.amazon.com/billing/home#/paymentpreferences/balanceapplications\" rel=\"noopener noreferrer\" target=\"_blank\">Payment Preferences</a> page in the AWS Billing and Cost Management console. To learn more, see <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-balance-application-preferences.html\" rel=\"noopener noreferrer\" target=\"_blank\">Managing balance application preferences</a>.&nbsp;</p>"
  "255cf73828016f3736d8eebceb5a6d36":
    "id": "255cf73828016f3736d8eebceb5a6d36"
    "title": "Amazon ECS Service Connect now supports Zone-Aware routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ecs-service-connect-zone-aware/"
    "published": "2026-07-24 08:46:00"
    "fetched": "2026-07-24 11:36:10"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS)&nbsp;introduces zone-aware routing for ECS Service Connect, enabling customers to reduce cross Availability Zone (AZ) data transfer costs and latency by automatically prioritizing service-to-service traffic within the same AZ.</p> \n<p>With this launch, ECS Service Connect preferentially routes requests to endpoints in the same AZ as the originating task while dynamically adjusting traffic weights as endpoints scale to maintain balanced load across target services. Previously, as customers distributed their applications across AZs for resiliency, service-to-service traffic led to significant cross-zone data transfer, requiring trade-offs between cost and resilience. Zone-aware routing eliminates this trade-off, and when local endpoints become unhealthy or fall below capacity thresholds, traffic automatically redistributes across healthy AZs to maintain availability without overloading any single zones.</p> \n<p>Zone-aware routing is enabled by default for all new and existing services and requires no additional infrastructure or application code changes. Existing services require a one-time redeployment to enable the new routing behavior. You can use Amazon VPC Flow Logs with AZ metadata to monitor cross-AZ traffic patterns and validate routing effectiveness. This feature is available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a>, where ECS Service Connect is supported at no additional cost. For more details, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect-zone-aware-routing.html\">documentation</a> and launch <a href=\"https://aws.amazon.com/blogs/containers/announcing-zone-aware-routing-in-amazon-ecs-service-connect/\">blog post</a>.</p>"
  "4c30ec669f564d3a86a79bee1e9e912a":
    "id": "4c30ec669f564d3a86a79bee1e9e912a"
    "title": "Amazon CloudWatch Logs now supports Application Load Balancer logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-cloudwatch-logs/"
    "published": "2026-07-24 02:00:00"
    "fetched": "2026-07-24 11:36:10"
    "summary": "<p>Amazon CloudWatch Logs now supports Application Load Balancer (ALB) logs as vended logs, improving observability and simplifying debugging for network traffic patterns. You can now analyze ALB access, connection and health check logs directly in CloudWatch to gain insights into client connections, traffic distribution, connection status and target health, helping you identify and troubleshoot network issues faster. Additionally, you can set up <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/telemetry-config-rules.html\">CloudWatch telemetry enablement rules</a> to automatically configure logging of both existing and newly created ALB resources, for your organization, specific accounts, or specific resources, ensuring consistent monitoring coverage without manual setup.<br /> <br /> With this CloudWatch Logs integration, you can track detailed access patterns using CloudWatch Logs Insights queries, create metric filters for monitoring and alarming, and review traffic patterns in real time using Live Tail. ALB logs can be configured through the integrations tab of your application load balancer in AWS Management Console, AWS CLI, or SDKs. You can also configure delivery of ALB logs to Amazon Data Firehose or Amazon S3 with support for Apache Parquet format.<br /> <br /> ALB logs delivery to CloudWatch is available in all AWS Commercial and GovCloud regions where Application Load Balancer and CloudWatch are available. ALB logs are charged as vended logs when delivered to CloudWatch Logs and Data Firehose, while delivery to Amazon S3 is free (Parquet conversion is charged at $0.035/GB - N. Virginia).<br /> <br /> To learn more about configuring ALB logs in CloudWatch Logs, <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-logs.html\">please visit our documentation</a>. For pricing information, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing page.</a></p>"
  "f3b9264d364e5a13212eeca9b460b0d0":
    "id": "f3b9264d364e5a13212eeca9b460b0d0"
    "title": "AWS Lambda durable execution SDK for .NET is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/lambdadf-dotnet/"
    "published": "2026-07-24 03:00:00"
    "fetched": "2026-07-24 14:46:36"
    "summary": "<p>Today, AWS announces the general availability of the AWS Lambda Durable Execution SDK for .NET, empowering C# developers to build resilient, long-running workflows using Lambda durable functions. With this SDK, developers can create multi-step applications like payment processing pipelines, AI agent orchestration, and human-in-the-loop approvals directly in their applications without implementing custom progress tracking or integrating external orchestration services.&nbsp;</p> \n<p>Lambda durable functions extend Lambda's event-driven programming model with operations that checkpoint progress automatically and pause execution for up to a year when waiting on external events. The AWS Lambda Durable Execution SDK for .NET provides an idiomatic C# experience for building with Lambda durable functions. It includes steps for progress tracking, callback integration for human and agent-in-the-loop workflows, durable invocation for reliable function chaining, and waits for efficient suspension. The SDK installs from NuGet into the .NET toolchain you use today. The <a href=\"https://www.nuget.org/packages/Amazon.Lambda.DurableExecution.Testing/\">local testing emulator</a> in the SDK enables developers to build and debug locally before deploying to production.</p> \n<p>To get started, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions developer guide</a> and the <a href=\"https://www.nuget.org/packages/Amazon.Lambda.DurableExecution\">AWS Lambda Durable Execution SDK</a> for .NET on NuGet. For Regional availability and pricing details, see the <a href=\"https://builder.aws.com/build/capabilities\">AWS Regional Services List</a> and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda Pricing.</a></p> \n<p>&nbsp;</p>"
  "127299ebff2cbebb1913f0d4782e06a2":
    "id": "127299ebff2cbebb1913f0d4782e06a2"
    "title": "AWS announces aws-bench, an open-source benchmark for AI agents on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-bench/"
    "published": "2026-07-24 22:00:00"
    "fetched": "2026-07-25 01:32:22"
    "summary": "<p>Today, AWS announces a research preview of aws-bench, an open-source benchmark that measures how accurately and efficiently AI agents complete real-world AWS tasks. Model providers and AI researchers building agents that operate on AWS infrastructure need an objective, reproducible way to measure performance and diagnose failures. aws-bench provides a public suite of test cases derived from analysis of real AWS usage, including investigation, troubleshooting, and infrastructure creation tasks.<br /> <br /> Each test case pairs a natural-language query with a defined cloud resource state and a ground-truth answer, so you can score any agent or model on a consistent, verifiable basis. Researchers and model providers can use aws-bench to improve foundation model performance on AWS tasks, improve agent harnesses, and track improvement progress. The release includes an easy-to-use CLI tool to instantiate testing environments, execute and score evaluation runs, and reset resource state.<br /> <br /> aws-bench is available now on <a href=\"https://github.com/aws-bench/aws-bench\">GitHub</a>. To get started, follow the setup instructions on the README.&nbsp;</p>"
  "ab07fd25230b03abd2f0538628641167":
    "id": "ab07fd25230b03abd2f0538628641167"
    "title": "Opus 4.8, Sonnet 5, and User Activity Monitoring now available on Kiro in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/kiro-opus-sonnet-monitoring-launch-aws-govcloud-us/"
    "published": "2026-07-24 23:00:00"
    "fetched": "2026-07-25 03:15:31"
    "summary": "<p>Two new models are now available in the Kiro IDE and CLI for the AWS GovCloud (US) Regions.<br /> <br /> Claude Opus 4.8 is the most intelligent Opus model, delivering stronger self-verification, more efficient tool calling, and better follow-through on long-horizon projects. It plans before it edits, catches its own mistakes, and finds creative paths around obstacles instead of stalling, making it well suited for complex multi-step tasks that previously required close supervision. Available with a 1M context window and 2.2x credit multiplier.<br /> <br /> Claude Sonnet 5 is the most agentic Sonnet model, bringing stronger reasoning, tool use, and coding at Sonnet-class pricing. It approaches Opus 4.8 on reasoning and agentic coding benchmarks while running at meaningfully lower cost, giving developers a cost-performance dial between maximum accuracy and higher throughput. Available with <a href=\"https://kiro.dev/docs/privacy-and-security/data-protection/#global-cross-region-inference-for-experimental-features\">experimental support</a>, a 1M context window, and 1.3x credit multiplier.<br /> <br /> Kiro enterprise administrators now have full visibility into organizational usage through built-in monitoring and tracking. A usage dashboard provides aggregate metrics at a glance, per-user activity reports deliver daily CSV telemetry (credits, model usage, and more) to your S3 bucket for license optimization and audit, and optional prompt logging captures user prompts and Kiro responses for compliance and debugging. All data is stored in your own account with no additional charge beyond S3 storage.<br /> <br /> Ensure your IDE or CLI is updated to the latest version, then restart it to access the new models from the model selector. For more details, visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">GovCloud documentation</a>, the <a href=\"https://kiro.dev/docs/enterprise/monitor-and-track/\">monitoring and tracking guide</a>, or contact your AWS account team. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "d62788fa3f96f147de3a2be1e83e1e0d":
    "id": "d62788fa3f96f147de3a2be1e83e1e0d"
    "title": "Amazon EC2 I8ge instances are now generally available in additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-i8ge-additional-regions/"
    "published": "2026-07-24 02:00:00"
    "fetched": "2026-07-25 03:15:31"
    "summary": "<p>Amazon Web Services (AWS) announces the availability of Amazon EC2 I8ge instances in AWS Europe (London) and Canada (Central)&nbsp; regions. I8ge instances are powered by AWS Graviton4 processors and deliver up to 60% better compute performance compared to previous generation Graviton2-based storage optimized Amazon EC2 instances. I8ge instances use the third generation AWS Nitro SSDs, local NVMe storage, and deliver up to 55% better real-time storage performance per TB compared to previous generation Amazon EC2 Im4gn instances . They offer up to 60% lower storage I/O latency and up to 75% lower storage I/O latency variability compared to Im4gn instances.<b><i> </i></b><br /> <br /> I8ge instances are storage-optimized instances, and offer up to 120TB of local NVMe storage. They are ideal for workloads that demand rapid local storage with high random read/write performance and consistently low latency for accessing large datasets. These versatile instances are offered in eleven different sizes including two metal sizes, providing flexibility to match customers’ computational needs. They deliver up to 180 Gbps of network performance bandwidth and 60 Gbps of dedicated bandwidth for Amazon Elastic Block Store (EBS), ensuring fast and efficient data transfer for the most demanding applications.<br /> <br /> To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/i8g/\">I8ge instances page.</a></p>"
  "acad6fbb5de304da41eb2d8d1f8a5fb8":
    "id": "acad6fbb5de304da41eb2d8d1f8a5fb8"
    "title": "AWS Clean Rooms supports larger worker types up to 32 vCPUs for SQL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-clean-rooms-32-vcpu-worker-types-sql"
    "published": "2026-07-24 21:00:00"
    "fetched": "2026-07-28 07:02:53"
    "summary": "<p>AWS Clean Rooms now supports <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/use-sql-editor.html\" rel=\"noopener noreferrer\" target=\"_blank\">larger worker types</a> of 32 vCPUs with 244 GB of memory for SQL analyses, allowing you to run more compute and memory-intensive workloads. Previously, the largest worker type available was 16 vCPUs with 120 GB of memory. Larger workers can help improve performance for complex queries on large datasets, optimizing costs for customers. For example, an advertiser collaborating with a publisher can use larger workers to run complex feature engineering across billions of records to train their multi-touch attribution model, accelerating time-to-value and optimizing costs.</p> \n<p>AWS Clean Rooms helps companies and their partners easily analyze and collaborate on their collective datasets without revealing or copying one another’s underlying data. For more information about the AWS Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Clean Rooms</a>.</p>"
"last_updated": "2026-07-28 07:02:53 JST"
