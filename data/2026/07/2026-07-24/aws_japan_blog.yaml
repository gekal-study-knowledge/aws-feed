  "26594befaa2bcc1242e845ed065c3406":
    "id": "26594befaa2bcc1242e845ed065c3406"
    "title": "AWS Certified Machine Learning Engineer – Associate アップデート (MLA-C02) のお知らせ"
    "link": "https://aws.amazon.com/jp/blogs/news/updates-to-aws-certified-machine-learning-engineer-associate-mla-c02/"
    "published": "2026-07-24 08:59:16"
    "fetched": "2026-07-24 11:36:11"
    "summary": "AWS Certified Machine Learning Engineer – Associate が MLA-C02 にアップデートされます。生成 AI、エージェンティック AI、基盤モデル / LLM、Amazon Bedrock のカバレッジが追加され、進化する ML エンジニアの役割に対応します。ベータ版試験（英語のみ）の受験予約は 2026 年 9 月 1 日開始、現行版 (MLA-C01) の英語での最終受験日は 9 月 28 日です。日本語を含む他言語は、ベータ期間中も現行版で引き続き受験可能です。全言語対応の標準版 MLA-C02 は 2027 年初頭に提供予定です。"
  "aa198ff77044a50b72c8647c04890b9f":
    "id": "aa198ff77044a50b72c8647c04890b9f"
    "title": "【開催報告】AWS Summit Japan 2026 – AWS for Telcom 展示ブース"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-summit-japan-2026-telcom/"
    "published": "2026-07-24 12:58:11"
    "fetched": "2026-07-24 14:46:37"
    "summary": "2026 年 6 月 25 日(木)、26 日(金)の 2 日間にわたって幕張メッセで開催された AWS Summit Japan 2026 では、AWS Expo の Industry Zone に「AWS for Telecom」として通信業界に関する展示ブースを出展しました。"
  "fc680f171416935e3c63b688752bf19a":
    "id": "fc680f171416935e3c63b688752bf19a"
    "title": "ISA/IEC 62443を踏まえたAWSでのOTとクラウドの接続設計"
    "link": "https://aws.amazon.com/jp/blogs/news/isaiec62443/"
    "published": "2026-07-24 16:21:25"
    "fetched": "2026-07-24 17:20:33"
    "summary": "本記事では、製造業のお客様が OT をクラウドに接続する際に特に重要となるISA/IEC 62443 の様々な概念を、AWS サービスを使ってどのように実現するのかをご紹介します。お客様は、AWS サービスを活用した製造現場向けのクラウドアーキテクチャを構成することで、ISA/IEC 62443 に沿ったクラウド側のセキュリティ対策を実装できます。"
  "709ab8bda99ba42aa115bec2767f8941":
    "id": "709ab8bda99ba42aa115bec2767f8941"
    "title": "【開催報告】Neuron Community – 2026 Vol.1"
    "link": "https://aws.amazon.com/jp/blogs/news/neuron-community-2026-vol-1/"
    "published": "2026-07-24 18:14:38"
    "fetched": "2026-07-24 20:00:07"
    "summary": "2026年7月15日 (水) に開催された「Neuron Community - 2026 Vol.1」の様子をレポートします。このイベントは、「Neuron Community」の協力のもと開催しました。Neuron Community は、ユーザー間で AWS Trainium / AWS Inferentia エコシステムに関する情報や知見の共有を促進するための場として発足したものです。今回は、AWS Summit Japan 2026 開催後ということもあり、AWS Summit Japan の振り返りや、AWS Neuron のアップデート情報が多めの内容となりました。"
"last_updated": "2026-07-24 20:00:07 JST"
