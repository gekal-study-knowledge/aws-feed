  "361fbe1e50678e0adb03d9967b6bfa14":
    "id": "361fbe1e50678e0adb03d9967b6bfa14"
    "title": "Evaluating AI Agents: A production blueprint with Strands and AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluating-ai-agents-a-production-blueprint-with-strands-and-agentcore/"
    "published": "2026-07-24 02:00:20"
    "fetched": "2026-07-24 02:16:32"
    "summary": "Together, Motorway and AWS built an end-to-end evaluation pipeline that reduced incorrect results from 1 in 8 queries to 1 in 50 and cut issue detection time from few hours to few minutes. The pipeline combines the Strands Agents SDK with Amazon Bedrock AgentCore, a fully managed service for deploying and operating AI agents at scale. In this post, you will learn how to build this pipeline for your own agents."
  "353c1e768a2c9088fb331d62c1b263b8":
    "id": "353c1e768a2c9088fb331d62c1b263b8"
    "title": "Building trade assistant: How Jefferies optimized front office trading operations with AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-trade-assistant-how-jefferies-optimized-front-office-trading-operations-with-ai/"
    "published": "2026-07-24 01:42:54"
    "fetched": "2026-07-24 02:16:32"
    "summary": "In this post, we explore how Jefferies overcame these challenges with a solution built on Strands Agents, an agent harness SDK for building AI agents that can reason, plan, and act by orchestrating calls to foundation models (FMs) and external tools. The solution uses large language models (LLMs), Amazon Bedrock, and Amazon Bedrock Knowledge Bases. It also uses Model Context Protocol (MCP), an open standard that helps AI agents securely connect to diverse data sources and tools through a unified interface. We cover the solution overview, the rationale for selecting the underlying technology stack, lessons learned, and the business impact the solution created at Jefferies."
  "5b0eaf71b14a6c3aaee95137fad8d30b":
    "id": "5b0eaf71b14a6c3aaee95137fad8d30b"
    "title": "Building multi-Region visualizations with Highcharts in Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-multi-region-visualizations-with-highcharts-in-amazon-quick/"
    "published": "2026-07-24 01:40:59"
    "fetched": "2026-07-24 02:16:32"
    "summary": "This post shows you how to build multi-Region carrier performance dashboards in Quick Sight using Highcharts custom visualizations to overcome native chart limitations. You will learn how to maintain data sovereignty across AWS Regions while creating unified visualizations through the Quick Sight federated dataset capability. The solution includes production-ready chart configurations and addresses security, compliance, and scalability requirements."
  "c0c17125a69650baf068b8d4fbab2120":
    "id": "c0c17125a69650baf068b8d4fbab2120"
    "title": "Detecting silent agent failures with Amazon Bedrock AgentCore optimization"
    "link": "https://aws.amazon.com/blogs/machine-learning/detecting-silent-agent-failures-with-amazon-bedrock-agentcore-optimization/"
    "published": "2026-07-24 01:38:34"
    "fetched": "2026-07-24 02:16:32"
    "summary": "Amazon Bedrock AgentCore optimization surfaces silent behavioral failures in production AI agents: the ones that pass every health check but still deliver wrong outcomes. Learn how insights discovers, explains, and ranks failure patterns across sessions so you can fix the highest-impact issues first."
  "6b9a8ae8376feb464d279f7b3c9a3fe5":
