    "title": "AWS Client VPN extends availability to four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-client-vpn-four-additional-regions/"
    "published": "2026-07-10 02:08:00"
    "fetched": "2026-07-10 03:47:37"
    "summary": "<p>AWS Client VPN is now available in four new regions: Canada West (Calgary), Mexico (Central) and two in Asia Pacific - New Zealand and Taipei. This fully managed service enables customers to securely connect their remote workforce to resources in AWS or on-premises networks.</p> \n<p>AWS Client VPN eliminates the need for hardware VPN appliances and complex operational management through its pay-as-you-go model. Organizations can easily manage and monitor VPN connections through a single console.<br /> To learn more about Client VPN:<br /> </p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a>.</li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/\">documentation</a>.</li> \n <li>AWS Client VPN <a href=\"https://aws.amazon.com/vpn/pricing/\">pricing page</a>.</li> \n</ul>"
"last_updated": "2026-07-10 03:47:37 JST"
