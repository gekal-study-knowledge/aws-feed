"entries":
  "c4a3b74f9e65128b8a0aaffb3ade0207":
    "id": "c4a3b74f9e65128b8a0aaffb3ade0207"
    "title": "AWS Client VPN extends availability to four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-client-vpn-four-additional-regions/"
    "published": "2026-07-10 02:08:00"
    "fetched": "2026-07-10 03:47:37"
    "summary": "<p>AWS Client VPN is now available in four new regions: Canada West (Calgary), Mexico (Central) and two in Asia Pacific - New Zealand and Taipei. This fully managed service enables customers to securely connect their remote workforce to resources in AWS or on-premises networks.</p> \n<p>AWS Client VPN eliminates the need for hardware VPN appliances and complex operational management through its pay-as-you-go model. Organizations can easily manage and monitor VPN connections through a single console.<br /> To learn more about Client VPN:<br /> </p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a>.</li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/\">documentation</a>.</li> \n <li>AWS Client VPN <a href=\"https://aws.amazon.com/vpn/pricing/\">pricing page</a>.</li> \n</ul>"
  "1eaca22de9453030f77f000dc0a8273b":
    "id": "1eaca22de9453030f77f000dc0a8273b"
    "title": "Amazon SageMaker Unified Studio adds custom asset types to the catalog in IAM-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/smus-custom-asset-types-iam/"
    "published": "2026-07-10 01:04:00"
    "fetched": "2026-07-10 05:44:17"
    "summary": "<p>Amazon SageMaker Unified Studio now supports custom asset types for IAM-based domains. With custom asset types, domain administrators can catalog any format of asset within the SageMaker Unified Studio, such as medical imaging files in Amazon S3, revenue dashboards built in PowerBI, or PDF research reports generated by a third-party platform. Custom asset types bring all assets, regardless of their underlying format, into the SageMaker catalog so teams can search, discover, and subscribe to them without needing separate tools or processes.</p> \n<p>To get started, an administrator can create a custom asset type with a name, description, and optional metadata forms that define the fields each asset should carry. Individual assets can then be created from that type, enriched with glossary terms and README documentation to add business context for humans and AI agents, and published for discovery. Once published, anyone in the domain can find the asset by name, type, or glossary term and request a subscription through the same governed workflow used for all other catalog assets.</p> \n<p>Custom asset types for IAM-based domains are available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/catalog-iam-custom-asset-types.html\">SageMaker Unified Studio user guide.&nbsp;</a></p>"
  "f98d5c89cb1fe0f9982a12ecccb3a846":
    "id": "f98d5c89cb1fe0f9982a12ecccb3a846"
    "title": "Amazon Timestream for InfluxDB now publishes database state change events to Amazon EventBridge"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/timestream-influxdb-eventbridge/"
    "published": "2026-07-10 02:24:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon Timestream for InfluxDB now publishes events to Amazon EventBridge when your database instances or clusters undergo state changes. Events are emitted for lifecycle operations including creation, deletion, compute and storage scaling, parameter group updates, maintenance windows, and reboot — covering both successful completions and failures.<br /> <br /> With this capability, customers can use Amazon EventBridge rules to programmatically react to database operations without polling the API for status. DevOps teams can build automation workflows that trigger when a scaling operation completes, operations teams can route failure events for immediate alerting, and compliance teams can persist all events to Amazon CloudWatch Logs or Amazon S3 for audit trails. Events are published to the default Amazon EventBridge event bus in your account with source aws.timestream-influxdb, supporting content-based filtering and routing to any EventBridge target including AWS Lambda functions, AWS Step Functions, Amazon SQS queues, Amazon SNS topics, and cross-account event buses.<br /> <br /> This capability is available in all AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Amazon Timestream for InfluxDB is available. Standard Amazon EventBridge pricing applies for rule evaluation and target delivery. To get started, open the Amazon EventBridge console and create a rule with source aws.timestream-influxdb. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "d51d35cfe8f80477c436ee5021d69e94":
    "id": "d51d35cfe8f80477c436ee5021d69e94"
    "title": "Amazon SageMaker Feature Store now supports batch feature writes and record listing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amzn-sgm-feature-store-batch-write-list/"
    "published": "2026-07-10 00:35:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon SageMaker Feature Store is a fully managed capability that makes it easy to compute, store, and retrieve features for training and deploying AI models. SageMaker Feature Store now supports new capabilities for high-throughput feature ingestion, record discovery, and offline store cataloging. Data scientists can now write multiple records across multiple feature groups in a single request with BatchWriteRecord, list the records stored in a feature group without knowing each record identifier in advance with ListRecords, and create tables and databases with custom names in the offline store.<br /> <br /> Data scientists can use BatchWriteRecord to ingest feature data at scale with fewer API calls and lower latency than writing one record at a time. BatchWriteRecord targets the online store, the offline store, or both, returns individual record failures without failing the entire request, and supports time-to-live settings at the record, request, and feature group level. With ListRecords, data scientists can retrieve the record identifiers in a feature group, one page at a time, to browse and audit feature group contents, recover record identifiers, and manage the record lifecycle. When configuring an offline store, data scientists can also create Glue and Iceberg tables with custom names. These capabilities enable data scientists to ingest features at scale and manage the records stored in SageMaker Feature Store without building custom tooling.</p> \n<p>These capabilities are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where<a href=\"https://aws.amazon.com/sagemaker/ai/feature-store/\"> Amazon SageMaker Feature Store</a> is available. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Operations_Amazon_SageMaker_Feature_Store_Runtime.html\">Amazon Feature Store Runtime</a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_OfflineStoreConfig.html#sagemaker-Type-OfflineStoreConfig-DisableGlueTableCreation\">Offline Store Configuration</a> documentation.</p>"
  "07f64f6ddfce094275388e0fae2f5ccf":
    "id": "07f64f6ddfce094275388e0fae2f5ccf"
    "title": "Amazon MSK Replicator now supports replication from external Apache Kafka clusters to MSK Standard brokers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-msk-replicator-external-kafka-standard-broker-support"
    "published": "2026-07-10 00:00:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon MSK Replicator now supports data replication from external Apache Kafka clusters - including on-premises, self-managed on AWS, or other cloud providers to Amazon MSK Standard brokers. This capability extends replication support to MSK Standard brokers, in addition to the existing support for MSK Express brokers. With this launch, you can migrate workloads to MSK Standard brokers, support disaster recovery by using MSK clusters as a failover or backup target, and enable data distribution across hybrid and multi-cloud environments.<br /> <br /> MSK Replicator is a feature of Amazon MSK that automates data replication between Kafka clusters, eliminating the need to manage custom replication infrastructure or configure open-source tools. Previously, MSK Replicator supported replication from external Apache Kafka clusters to MSK Express brokers only. With this launch, you can now also replicate data from external Kafka clusters to MSK Standard brokers, using either SASL/SCRAM or mutual TLS (mTLS) authentication to connect to your external clusters. You can also use MSK Replicator to replicate data from Amazon MSK Standard to external Kafka clusters for reliable failback or multi-cloud data distribution. Unlike self-managed replication tools, MSK Replicator lets you retain your original Kafka topic names during replication while automatically avoiding infinite replication loops. It also synchronizes consumer group offsets bidirectionally, enabling you to move producers and consumers across clusters independently, in any order, without coordination constraints or the risk of data loss.<br /> <br /> This new capability is supported in all AWS Regions where Amazon MSK Replicator is available. Visit the MSK Replicator <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-replicator.html\">documentation</a>, <a href=\"https://aws.amazon.com/msk/features/msk-replicator/\">product page</a>, <a href=\"https://aws.amazon.com/msk/pricing/\">pricing page</a>, and this <a href=\"https://aws.amazon.com/blogs/big-data/migrate-third-party-and-self-managed-apache-kafka-clusters-to-amazon-msk-express-brokers-with-amazon-msk-replicator/\">AWS blog post</a> to learn more.</p>"
  "36d0ba2cb0a60b012a30d7f847623bf3":
    "id": "36d0ba2cb0a60b012a30d7f847623bf3"
    "title": "Amazon SageMaker HyperPod now supports deep health checks for Slurm clusters with continuous provisioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/deep-health-check-continuous-slurm/"
    "published": "2026-07-10 01:00:00"
    "fetched": "2026-07-10 09:00:49"
    "summary": "<p>Amazon SageMaker HyperPod now supports deep health checks for Slurm-orchestrated clusters created with continuous provisioning, enabling you to proactively verify GPU accelerator health on running instances at any time. Continuous provisioning lets you start training quickly and scale instance groups asynchronously without all-or-nothing failures, and you can now pair that flexibility with comprehensive hardware validation as instances come online. This capability addresses a critical challenge where even a single unhealthy node can waste hours of compute time and delay critical workloads.<br /> <br /> With deep health checks, you can target entire instance groups or specific instances to run comprehensive hardware stress tests and connectivity tests before committing compute resources to a job. Because continuous provisioning adds worker nodes to your Slurm cluster asynchronously as capacity becomes available, you can run deep health checks on each new node as it comes online, validating hardware before scheduling jobs on it and without interrupting workloads already running on healthy nodes. Progress and results are visible at both the instance group and instance level through the SageMaker console and APIs, providing complete visibility into GPU health, network connectivity, and multi-node communication performance. Instances undergoing checks are automatically isolated from workload scheduling and returned to service upon passing. When paired with HyperPod's automatic node recovery capability, instances that fail are automatically rebooted or replaced, ensuring cluster health.<br /> <br /> This capability is available in all regions where Amazon SageMaker HyperPod is available. To learn more about on-demand deep health checks and continuous provisioning, see the Amazon SageMaker HyperPod <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-resiliency-slurm-deep-health-checks.html\" target=\"_blank\">User Guide</a>.</p>"
  "2a7107e63b9ab5678fb0c541a535e4eb":
    "id": "2a7107e63b9ab5678fb0c541a535e4eb"
    "title": "OAuth support for the AWS MCP Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/oauth-aws-mcp-server/"
    "published": "2026-07-10 08:03:00"
    "fetched": "2026-07-10 13:47:13"
    "summary": "<p>You can now connect AI agents directly to the AWS MCP Server using AWS Sign-In. Agents connect using industry-standard OAuth without requiring additional authentication software. Existing AWS identities, sign-in methods, IAM permissions, and governance controls you have already set up continue to apply.</p> \n<p>Developers can authorize agents interactively through a browser or programmatically using non-interactive (headless) authorization. Administrators can govern OAuth access using familiar IAM policies together with new OAuth capabilities, including global condition keys, token introspection and revocation APIs, dynamic client registration, and CloudTrail audit events.</p> \n<p><br /> To learn more, see the <a href=\"https://aws.amazon.com/blogs/security/introducing-oauth-support-for-aws-mcp-server/\">OAuth Support for the AWS MCP Server blogpost</a>, <a href=\"https://docs.aws.amazon.com/signin/latest/userguide/oauth-sign-in-overview.html\">Sign-In with OAuth 2.0</a> in the AWS Sign-In User Guide, and <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html\">Setting up the AWS MCP Server</a> in the Agent Toolkit for AWS User Guide.</p>"
  "2794050c36396289ed56c91b795a995c":
    "id": "2794050c36396289ed56c91b795a995c"
    "title": "Amazon DocumentDB (with MongoDB compatibility) now supports R8g.24xlarge and R8g.48xlarge instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-documentdb-r8g-24xl-48xl/"
    "published": "2026-07-10 23:00:00"
    "fetched": "2026-07-11 01:52:38"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) now supports R8g.24xlarge and R8g.48xlarge database instances. R8g instances are powered by AWS Graviton4 processors and feature DDR5 memory, enabling customers to achieve higher throughput and support larger working sets in memory. With R8g.24xlarge (96 vCPUs, 768 GiB memory) and R8g.48xlarge (192 vCPUs, 1,536 GiB memory), customers can run more demanding workloads such as high-concurrency transactional applications, large-scale document processing, and memory-intensive operational workloads.<br /> <br /> Customers can get started with R8g.24xlarge and R8g.48xlarge instances through the AWS Management Console, CLI, and SDK by modifying their existing Amazon DocumentDB database cluster or creating a new one. R8g instances are available for Amazon DocumentDB 5.0+ on both Standard and IO-Optimized cluster storage configurations. For more information including region availability, visit our <a href=\"https://aws.amazon.com/documentdb/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/db-instance-classes.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "4e3acda7bcfabc4fcae9e111c097107c":
    "id": "4e3acda7bcfabc4fcae9e111c097107c"
    "title": "AWS DMS Schema Conversion now supports AI agent automation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-dms-sc-ai-agent-automation-mcp-server/"
    "published": "2026-07-10 16:00:00"
    "fetched": "2026-07-11 01:52:38"
    "summary": "<p><a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service (DMS) Schema Conversion</a>&nbsp;now supports AI agent automation through the AWS MCP Server. You can connect AI coding agents, including Kiro, Claude Code, and Cursor, to DMS Schema Conversion and run complete migration workflows using natural language directly from your IDE. Agents create projects, browse source metadata, convert schemas, generate assessment reports, and export results autonomously.</p> \n<p>The DMS Schema Conversion skill,&nbsp;<i>dms-schema-conversion</i>, loads on demand and provides agents with predefined procedures, including API patterns, schema exclusions, and operational sequencing rules. Agents follow these procedures rather than improvising from general knowledge, reducing trial-and-error loops. They can also help convert remaining code objects such as stored procedures, functions, and triggers, building on the generative AI capabilities launched at re:Invent 2024.</p> \n<p>AI agent automation is available for all existing DMS Schema Conversion source and target engine pairs at no additional charge. For regional availability, see the&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html#schema-conversion-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">Supported AWS Regions</a>&nbsp;page. To get started, see&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/sc-genai-agents.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using AI agents with DMS Schema Conversion</a>&nbsp;in the documentation.</p>"
  "1d9c7f0a3f6212ff8ea6aa06d90fb6b6":
    "id": "1d9c7f0a3f6212ff8ea6aa06d90fb6b6"
    "title": "Amazon EC2 I7ie instances now available in AWS Asia Pacific (Hyderabad) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-i7ie-instances-aws-hyd-region/"
    "published": "2026-07-10 23:55:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>AWS is announcing starting today, Amazon EC2 I7ie instances are now available in AWS Asia Pacific (Hyderabad) region. Designed for large storage I/O intensive workloads, I7ie instances are powered by 5th Gen Intel Xeon Processors with an all-core turbo frequency of 3.2 GHz, offering up to 40% better compute performance and 20% better price performance over existing I3en instances. I7ie instances offer up to 120TB local NVMe storage density for storage optimized instances and offer up to twice as many vCPUs and memory compared to prior generation instances. Powered by 3rd generation AWS Nitro SSDs, I7ie instances deliver up to 65% better real-time storage performance, up to 50% lower storage I/O latency, and 65% lower storage I/O latency variability compared to I3en instances.<br /> <br /> I7ie are high density storage optimized instances, ideal for workloads requiring fast local storage with high random read/write performance at very low latency consistency to access large data sets. These instances are available in 9 different virtual sizes and deliver up to 100Gbps of network bandwidth and 60Gbps of bandwidth for Amazon Elastic Block Store (EBS).<br /> <br /> To learn more, visit the I7ie instances<a href=\"https://aws.amazon.com/ec2/instance-types/i7ie/\"> page</a>.</p>"
  "1c9a961d387b6171070e0435c04aca38":
    "id": "1c9a961d387b6171070e0435c04aca38"
    "title": "AWS Organizations now applies account departure security controls by default for new organizations created via AWS Organizations console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-organizations-security-controls-new-orgs-console"
    "published": "2026-07-10 16:00:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>AWS Organizations now automatically applies security controls by default when you create a new organization via AWS Organizations console, simplifying initial security configuration by automatically applying core security controls. This approach safeguards multi-account environments by protecting against unintended member account departures from your organization. CloudOps administrators and central security teams get immediate protection in their new organizations from day one.</p> \n<p>When you create a new organization using the AWS Organizations console, the service automatically applies service control policies (SCPs) that prevent member accounts from leaving the organization or closing themselves. These controls help enterprises migrating to AWS or starting a new organization establish strong governance patterns without requiring deep security expertise. The security defaults are intentionally lightweight to provide protection without impeding legitimate operations. You maintain full control to modify or disable these settings at any time.</p> \n<p>This feature is available in US East (N. Virginia), AWS GovCloud (US-East), AWS GovCloud (US-West), China (Beijing), and China (Ningxia). To learn more, visit the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_org_create.html\">AWS Organizations documentation</a>.</p> \n<p>&nbsp;</p>"
  "07b0a521901ccf865004cf9c784ce282":
    "id": "07b0a521901ccf865004cf9c784ce282"
    "title": "Amazon EC2 I8g instances now available in AWS GovCloud (US) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-i8g-instances-aws-govcloud-us-regions/"
    "published": "2026-07-10 03:35:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>AWS is announcing the general availability of Amazon EC2 Storage Optimized I8g instances in AWS GovCloud (US East, US West) regions. I8g instances offer the best performance in Amazon EC2 for storage-intensive workloads. I8g instances are powered by AWS Graviton4 processors that deliver up to 60% better compute performance compared to previous generation I4g instances. I8g instances use the latest third generation AWS Nitro SSDs, local NVMe storage that deliver up to 65% better real-time storage performance per TB while offering up to 50% lower storage I/O latency and up to 60% lower storage I/O latency variability. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which oﬄoads CPU virtualization, storage, and networking functions to dedicated hardware and software enhancing the performance and security for your workloads.<br /> <br /> Amazon EC2 I8g instances are designed for I/O intensive workloads that require rapid data access and real-time latency from storage. These instances excel at handling transactional, real-time, distributed databases, including MySQL, PostgreSQL, Hbase and NoSQL solutions like Aerospike, MongoDB, ClickHouse, and Apache Druid. They're also optimized for real-time analytics platforms such as Apache Spark, data lakehouse and AI LLM pre-processing for training. I8g instances are available in 11 different sizes with up to 48xlarge including one metal size, 1.5 TiB of memory, and 45 TB local instance storage. They deliver up to 100 Gbps of network performance bandwidth, and 60 Gbps of dedicated bandwidth for Amazon Elastic Block Store (EBS).<br /> <br /> To learn more, visit <a href=\"https://aws.amazon.com/ec2/instance-types/i8g/\">EC2 I8g instances</a>.</p>"
  "9fa5baefbe50c6720dfc0585f7edcc33":
    "id": "9fa5baefbe50c6720dfc0585f7edcc33"
    "title": "Amazon EC2 now supports using an EBS volume for Replace Root Volume"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-replace-root-volume-ebs-volume/"
    "published": "2026-07-10 03:06:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>Today, AWS announces Replace Root Volume using an existing EBS volume, a new option for replacing the root volume of a running Amazon EC2 instance. Customers can now use an EBS volume as the target for a root volume replacement, in addition to the existing options of replacing from a snapshot or an AMI. This option supports customers running stateful workloads who need to include specific metadata or software on the root volume before the application boots.<br /> <br /> Many customers use Replace Root Volume today to apply operating system patches and configuration changes without stopping the instance. However, customers who needed specific metadata or software on the root volume had to first capture an volume with data as a snapshot or register it as an AMI before they could replace the root volume. These intermediate steps added time and operational overhead. Customers can now configure the volume directly and use it as the new root volume, removing the snapshot and AMI creation steps. This reduces operational overhead and speeds up root volume patching for stateful workloads where downtime is costly.<br /> <br /> Using an EBS volume when replacing a root volume of an EC2 instance is available in all commercial AWS Regions and AWS GovCloud (US) regions. To get started, see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/replace-root.html\">Replace an EC2 instance root volume</a>&nbsp;in the Amazon EC2 User Guide.</p>"
  "06ad838ef6be3f448e7a8c18880dc022":
    "id": "06ad838ef6be3f448e7a8c18880dc022"
    "title": "AWS Partner Central subsidiary connections now support qualification sharing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/subsidiary-qualification-sharing/"
    "published": "2026-07-10 13:00:00"
    "fetched": "2026-07-14 14:25:14"
    "summary": "<p>AWS Partner Central subsidiary connections now enable partners to share qualifications across their connected partner and seller accounts. Partners connecting newly acquired partner's accounts or regional subsidiary accounts they own can now consolidate their AWS partnership standing across those accounts beyond revenue attribution.</p> \n<p>Partners with active subsidiary connections can now select Associate qualifications to share specializations, certifications, and select program enrollments across all connected accounts. The subsidiary's display name is automatically updated to reflect its affiliation with the primary account, and tier is recalculated based on combined scorecard metrics. Upon connection, Partner Revenue Measurement (PRM) continues to attribute combined revenue across all connected accounts. With qualification sharing, partners now also benefit from a unified public profile and consolidated scorecard.</p> \n<p>Subsidiary account connections and qualification sharing are available today in all commercial AWS Regions. Partners can self-service their subsidiary account connections and qualification sharing directly in AWS Partner Central. To get started, log in to AWS Partner Central in the AWS Management Console, navigate to Account Connections, and send a connection request to the accounts you own. To learn more about subsidiary connections and qualification sharing, visit the &nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/manage-subsidiary.html\">Managing subsidiary account connections guide&nbsp;</a>.</p>"
  "664d7384d258d3d176fce5f5e9996d48":
    "id": "664d7384d258d3d176fce5f5e9996d48"
    "title": "Amazon EC2 C8id, M8id, and R8id instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-c8id-m8id-r8id/"
    "published": "2026-07-10 04:33:00"
    "fetched": "2026-07-15 04:13:08"
    "summary": "<p>Amazon EC2 C8id, M8id, and R8id instances are now available in additional regions. Amazon EC2 C8id instances are now available in Asia Pacific (Mumbai) and Europe (Stockholm), M8id instances are available in Europe (London, Stockholm), and R8id instances are available in Europe (London) Regions. There instances are powered by custom Intel Xeon 6 processors and deliver up to 43% higher performance and 3.3x more memory bandwidth compared to previous generation C6id, M6id, and R6id instances.<br /> <br /> C8id, M8id, and R8id instances offer up to 384 vCPUs, 3TiB of memory, and 22.8TB of NVMe SSD storage, 3x more than previous generation instances. These instances deliver up to 46% higher performance for I/O intensive database workloads, and up to 30% faster query results for I/O intensive real-time data analytics than previous sixth-generation instances<b>.</b> Additionally, these instances support Instance Bandwidth Configuration, allowing 25% flexible allocation between network and EBS bandwidth, allocating resources optimally for each workload.<br /> <br /> C8id instances are ideal for compute-intensive workloads such as high-performance web servers, batch processing, distributed analytics, ad serving, video encoding, and gaming servers. M8id instances are well-suited for balanced workloads including application servers, microservices, enterprise applications, and small to medium databases. R8id instances are ideal for memory-intensive workloads such as in-memory databases, real-time big data analytics, large in-memory caches, and scientific computing applications.<br /> <br /> Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the <a href=\"https://aws.amazon.com/ec2/instance-types/\">Amazon EC2 instance type page.</a></p>"
  "d482de033c9ea33e3ed6c3d13f2e19b3":
    "id": "d482de033c9ea33e3ed6c3d13f2e19b3"
    "title": "Amazon EC2 M8gd and R8gd instances are now available in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-m8gd-r8gd-us-govcloud/"
    "published": "2026-07-10 04:24:00"
    "fetched": "2026-07-15 04:13:08"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) M8gd and R8gd instances are available in AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. These instances feature up to 11.4 TB of local NVMe-based SSD block-level storage and are powered by AWS Graviton4 processors, delivering up to 30% better performance over Graviton3-based instances. These instances are built on the AWS Nitro System and are a great fit for applications that need access to high-speed, low latency local storage.<br /> <br /> Each instance is available in 12 different sizes. They provide up to 50 Gbps of network bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Additionally, customers can now adjust the network and<br /> Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">M8gd instances</a> or <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\">R8gd instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
