  "c4a3b74f9e65128b8a0aaffb3ade0207":
    "id": "c4a3b74f9e65128b8a0aaffb3ade0207"
    "title": "AWS Client VPN extends availability to four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-client-vpn-four-additional-regions/"
    "published": "2026-07-10 02:08:00"
    "fetched": "2026-07-10 03:47:37"
    "summary": "<p>AWS Client VPN is now available in four new regions: Canada West (Calgary), Mexico (Central) and two in Asia Pacific - New Zealand and Taipei. This fully managed service enables customers to securely connect their remote workforce to resources in AWS or on-premises networks.</p> \n<p>AWS Client VPN eliminates the need for hardware VPN appliances and complex operational management through its pay-as-you-go model. Organizations can easily manage and monitor VPN connections through a single console.<br /> To learn more about Client VPN:<br /> </p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a>.</li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/\">documentation</a>.</li> \n <li>AWS Client VPN <a href=\"https://aws.amazon.com/vpn/pricing/\">pricing page</a>.</li> \n</ul>"
  "1eaca22de9453030f77f000dc0a8273b":
    "id": "1eaca22de9453030f77f000dc0a8273b"
    "title": "Amazon SageMaker Unified Studio adds custom asset types to the catalog in IAM-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/smus-custom-asset-types-iam/"
    "published": "2026-07-10 01:04:00"
    "fetched": "2026-07-10 05:44:17"
    "summary": "<p>Amazon SageMaker Unified Studio now supports custom asset types for IAM-based domains. With custom asset types, domain administrators can catalog any format of asset within the SageMaker Unified Studio, such as medical imaging files in Amazon S3, revenue dashboards built in PowerBI, or PDF research reports generated by a third-party platform. Custom asset types bring all assets, regardless of their underlying format, into the SageMaker catalog so teams can search, discover, and subscribe to them without needing separate tools or processes.</p> \n<p>To get started, an administrator can create a custom asset type with a name, description, and optional metadata forms that define the fields each asset should carry. Individual assets can then be created from that type, enriched with glossary terms and README documentation to add business context for humans and AI agents, and published for discovery. Once published, anyone in the domain can find the asset by name, type, or glossary term and request a subscription through the same governed workflow used for all other catalog assets.</p> \n<p>Custom asset types for IAM-based domains are available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/catalog-iam-custom-asset-types.html\">SageMaker Unified Studio user guide.&nbsp;</a></p>"
  "f98d5c89cb1fe0f9982a12ecccb3a846":
    "id": "f98d5c89cb1fe0f9982a12ecccb3a846"
    "title": "Amazon Timestream for InfluxDB now publishes database state change events to Amazon EventBridge"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/timestream-influxdb-eventbridge/"
    "published": "2026-07-10 02:24:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon Timestream for InfluxDB now publishes events to Amazon EventBridge when your database instances or clusters undergo state changes. Events are emitted for lifecycle operations including creation, deletion, compute and storage scaling, parameter group updates, maintenance windows, and reboot — covering both successful completions and failures.<br /> <br /> With this capability, customers can use Amazon EventBridge rules to programmatically react to database operations without polling the API for status. DevOps teams can build automation workflows that trigger when a scaling operation completes, operations teams can route failure events for immediate alerting, and compliance teams can persist all events to Amazon CloudWatch Logs or Amazon S3 for audit trails. Events are published to the default Amazon EventBridge event bus in your account with source aws.timestream-influxdb, supporting content-based filtering and routing to any EventBridge target including AWS Lambda functions, AWS Step Functions, Amazon SQS queues, Amazon SNS topics, and cross-account event buses.<br /> <br /> This capability is available in all AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Amazon Timestream for InfluxDB is available. Standard Amazon EventBridge pricing applies for rule evaluation and target delivery. To get started, open the Amazon EventBridge console and create a rule with source aws.timestream-influxdb. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "d51d35cfe8f80477c436ee5021d69e94":
    "id": "d51d35cfe8f80477c436ee5021d69e94"
    "title": "Amazon SageMaker Feature Store now supports batch feature writes and record listing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amzn-sgm-feature-store-batch-write-list/"
    "published": "2026-07-10 00:35:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon SageMaker Feature Store is a fully managed capability that makes it easy to compute, store, and retrieve features for training and deploying AI models. SageMaker Feature Store now supports new capabilities for high-throughput feature ingestion, record discovery, and offline store cataloging. Data scientists can now write multiple records across multiple feature groups in a single request with BatchWriteRecord, list the records stored in a feature group without knowing each record identifier in advance with ListRecords, and create tables and databases with custom names in the offline store.<br /> <br /> Data scientists can use BatchWriteRecord to ingest feature data at scale with fewer API calls and lower latency than writing one record at a time. BatchWriteRecord targets the online store, the offline store, or both, returns individual record failures without failing the entire request, and supports time-to-live settings at the record, request, and feature group level. With ListRecords, data scientists can retrieve the record identifiers in a feature group, one page at a time, to browse and audit feature group contents, recover record identifiers, and manage the record lifecycle. When configuring an offline store, data scientists can also create Glue and Iceberg tables with custom names. These capabilities enable data scientists to ingest features at scale and manage the records stored in SageMaker Feature Store without building custom tooling.</p> \n<p>These capabilities are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where<a href=\"https://aws.amazon.com/sagemaker/ai/feature-store/\"> Amazon SageMaker Feature Store</a> is available. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Operations_Amazon_SageMaker_Feature_Store_Runtime.html\">Amazon Feature Store Runtime</a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_OfflineStoreConfig.html#sagemaker-Type-OfflineStoreConfig-DisableGlueTableCreation\">Offline Store Configuration</a> documentation.</p>"
  "07f64f6ddfce094275388e0fae2f5ccf":
    "id": "07f64f6ddfce094275388e0fae2f5ccf"
    "title": "Amazon MSK Replicator now supports replication from external Apache Kafka clusters to MSK Standard brokers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-msk-replicator-external-kafka-standard-broker-support"
    "published": "2026-07-10 00:00:00"
    "fetched": "2026-07-10 07:18:45"
    "summary": "<p>Amazon MSK Replicator now supports data replication from external Apache Kafka clusters - including on-premises, self-managed on AWS, or other cloud providers to Amazon MSK Standard brokers. This capability extends replication support to MSK Standard brokers, in addition to the existing support for MSK Express brokers. With this launch, you can migrate workloads to MSK Standard brokers, support disaster recovery by using MSK clusters as a failover or backup target, and enable data distribution across hybrid and multi-cloud environments.<br /> <br /> MSK Replicator is a feature of Amazon MSK that automates data replication between Kafka clusters, eliminating the need to manage custom replication infrastructure or configure open-source tools. Previously, MSK Replicator supported replication from external Apache Kafka clusters to MSK Express brokers only. With this launch, you can now also replicate data from external Kafka clusters to MSK Standard brokers, using either SASL/SCRAM or mutual TLS (mTLS) authentication to connect to your external clusters. You can also use MSK Replicator to replicate data from Amazon MSK Standard to external Kafka clusters for reliable failback or multi-cloud data distribution. Unlike self-managed replication tools, MSK Replicator lets you retain your original Kafka topic names during replication while automatically avoiding infinite replication loops. It also synchronizes consumer group offsets bidirectionally, enabling you to move producers and consumers across clusters independently, in any order, without coordination constraints or the risk of data loss.<br /> <br /> This new capability is supported in all AWS Regions where Amazon MSK Replicator is available. Visit the MSK Replicator <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-replicator.html\">documentation</a>, <a href=\"https://aws.amazon.com/msk/features/msk-replicator/\">product page</a>, <a href=\"https://aws.amazon.com/msk/pricing/\">pricing page</a>, and this <a href=\"https://aws.amazon.com/blogs/big-data/migrate-third-party-and-self-managed-apache-kafka-clusters-to-amazon-msk-express-brokers-with-amazon-msk-replicator/\">AWS blog post</a> to learn more.</p>"
  "36d0ba2cb0a60b012a30d7f847623bf3":
    "id": "36d0ba2cb0a60b012a30d7f847623bf3"
    "title": "Amazon SageMaker HyperPod now supports deep health checks for Slurm clusters with continuous provisioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/deep-health-check-continuous-slurm/"
    "published": "2026-07-10 01:00:00"
    "fetched": "2026-07-10 09:00:49"
    "summary": "<p>Amazon SageMaker HyperPod now supports deep health checks for Slurm-orchestrated clusters created with continuous provisioning, enabling you to proactively verify GPU accelerator health on running instances at any time. Continuous provisioning lets you start training quickly and scale instance groups asynchronously without all-or-nothing failures, and you can now pair that flexibility with comprehensive hardware validation as instances come online. This capability addresses a critical challenge where even a single unhealthy node can waste hours of compute time and delay critical workloads.<br /> <br /> With deep health checks, you can target entire instance groups or specific instances to run comprehensive hardware stress tests and connectivity tests before committing compute resources to a job. Because continuous provisioning adds worker nodes to your Slurm cluster asynchronously as capacity becomes available, you can run deep health checks on each new node as it comes online, validating hardware before scheduling jobs on it and without interrupting workloads already running on healthy nodes. Progress and results are visible at both the instance group and instance level through the SageMaker console and APIs, providing complete visibility into GPU health, network connectivity, and multi-node communication performance. Instances undergoing checks are automatically isolated from workload scheduling and returned to service upon passing. When paired with HyperPod's automatic node recovery capability, instances that fail are automatically rebooted or replaced, ensuring cluster health.<br /> <br /> This capability is available in all regions where Amazon SageMaker HyperPod is available. To learn more about on-demand deep health checks and continuous provisioning, see the Amazon SageMaker HyperPod <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-resiliency-slurm-deep-health-checks.html\" target=\"_blank\">User Guide</a>.</p>"
