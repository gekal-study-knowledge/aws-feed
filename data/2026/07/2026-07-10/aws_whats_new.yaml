    "title": "AWS Client VPN extends availability to four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-client-vpn-four-additional-regions/"
    "published": "2026-07-10 02:08:00"
    "fetched": "2026-07-10 03:47:37"
    "summary": "<p>AWS Client VPN is now available in four new regions: Canada West (Calgary), Mexico (Central) and two in Asia Pacific - New Zealand and Taipei. This fully managed service enables customers to securely connect their remote workforce to resources in AWS or on-premises networks.</p> \n<p>AWS Client VPN eliminates the need for hardware VPN appliances and complex operational management through its pay-as-you-go model. Organizations can easily manage and monitor VPN connections through a single console.<br /> To learn more about Client VPN:<br /> </p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a>.</li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/\">documentation</a>.</li> \n <li>AWS Client VPN <a href=\"https://aws.amazon.com/vpn/pricing/\">pricing page</a>.</li> \n</ul>"
  "1eaca22de9453030f77f000dc0a8273b":
    "id": "1eaca22de9453030f77f000dc0a8273b"
    "title": "Amazon SageMaker Unified Studio adds custom asset types to the catalog in IAM-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/smus-custom-asset-types-iam/"
    "published": "2026-07-10 01:04:00"
    "fetched": "2026-07-10 05:44:17"
    "summary": "<p>Amazon SageMaker Unified Studio now supports custom asset types for IAM-based domains. With custom asset types, domain administrators can catalog any format of asset within the SageMaker Unified Studio, such as medical imaging files in Amazon S3, revenue dashboards built in PowerBI, or PDF research reports generated by a third-party platform. Custom asset types bring all assets, regardless of their underlying format, into the SageMaker catalog so teams can search, discover, and subscribe to them without needing separate tools or processes.</p> \n<p>To get started, an administrator can create a custom asset type with a name, description, and optional metadata forms that define the fields each asset should carry. Individual assets can then be created from that type, enriched with glossary terms and README documentation to add business context for humans and AI agents, and published for discovery. Once published, anyone in the domain can find the asset by name, type, or glossary term and request a subscription through the same governed workflow used for all other catalog assets.</p> \n<p>Custom asset types for IAM-based domains are available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/catalog-iam-custom-asset-types.html\">SageMaker Unified Studio user guide.&nbsp;</a></p>"
"last_updated": "2026-07-10 05:44:17 JST"
