  "3b4f657e071d6278f07ec6bccb93ab5f":
    "id": "3b4f657e071d6278f07ec6bccb93ab5f"
    "title": "AWS Cloud WAN Routing Policy：実運用におけるグローバルネットワークのシナリオ集 (Part 2)"
    "link": "https://aws.amazon.com/jp/blogs/news/networking-and-content-delivery-aws-cloud-wan-routing-policy-real-world-global-network-scenarios-part-2/"
    "published": "2026-07-10 10:43:38"
    "fetched": "2026-07-10 13:47:14"
    "summary": "本記事では、AWS Cloud WAN のルーティングポリシーを使い、ハイブリッド環境やマルチサイト環境で一般的に見られる3つの実運用シナリオを取り上げます。Transit Gateway 環境からの移行中のルート伝播制御、複数の Direct Connect ロケーション間のパス選択の改善、そして同一 ASN を持つネットワーク間の接続の許可という課題を、集中型のポリシー適用ポイントとしての AWS Cloud WAN でどのように解決できるかを解説します。"
  "5a9be66da6c88110d0949aae69c0c816":
    "id": "5a9be66da6c88110d0949aae69c0c816"
    "title": "Kiro の超過利用の上限設定と前払い機能のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/cap-prepay-overage/"
    "published": "2026-07-10 10:21:11"
    "fetched": "2026-07-10 13:47:14"
    "summary": "Kiro の超過利用に関する 2 つの新機能をご紹介します。チーム向けには、AWS Service Quotas コンソールからアカウント単位で超過利用の上限を設定できるようになりました。個人開発者向けには、有料プラン利用者が前払いで購入できるアドオンクレジットパック (最小 5 ドルから) を追加しました。後から届く想定外の請求書に驚かされることなく、支出をコントロールしながら Kiro を使い続けられます。"
  "f57f5e2343a61ea8b253f3f2dd043043":
    "id": "f57f5e2343a61ea8b253f3f2dd043043"
    "title": "【公共向け】Claude Mythos 時代の脅威対策ワークショップ開催報告 & 耐障害性ライフサイクル実践ワークショップのご案内"
    "link": "https://aws.amazon.com/jp/blogs/news/claude-mythos-workshop-report-resilience-workshop-upcoming/"
    "published": "2026-07-10 23:51:52"
    "fetched": "2026-07-11 01:52:39"
    "summary": "AWS Japan パブリックセクターでは月次でセキュリティワークショップイベントを開催しています。Claude Mythos / Project Glasswing の登場によりセキュリティを取り巻く状況が変化する中、第 3・4 回は「Claude Mythos 時代の脅威への対応」をテーマに実施しました。本記事では、第 3 回の Amazon Inspector による脆弱性管理と、第 4 回の AWS Security Agent によるプロアクティブなセキュリティ評価を扱った開催レポートをお届けします。"
"last_updated": "2026-07-11 01:52:39 JST"
