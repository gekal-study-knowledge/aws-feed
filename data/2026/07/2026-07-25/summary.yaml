  この日は Claude Opus 5 の AWS 提供開始が最大のトピックです。ゼロデータ保持 (ZDR) に対応した最も高度な Opus モデルとして、コーディングや長時間タスクで段階的な進化をもたらすと紹介されました。Kiro でも同日から Opus 5 が IDE / CLI / Web で利用可能になり、時間のかかる作業への強さ、並列エージェントの協調改善、長いセッションでのコストとレイテンシを制御する新機能が加わっています。あわせて Kiro では初めて OpenAI のモデルとして GPT-5.6 が利用可能になり、これは Kiro の 1 周年でもありました。機械学習ブログでは Bedrock 上の GPT-5.6 Sol / Terra / Luna の使い分けと Responses API による推論方法、銀行向けの説明可能なネクストベストプロダクト推薦システムが解説されています。運用面では Network Firewall のトラブルシューティングを AWS DevOps Agent で加速する手法が公開されました。
