  "1bf681dfa172eef17a52faed5b610b79":
    "id": "1bf681dfa172eef17a52faed5b610b79"
    "title": "Claude Opus 5 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/claude-opus-5-aws/"
    "published": "2026-07-25 00:00:00"
    "fetched": "2026-07-25 03:15:31"
    "summary": "<p>AWS now offers Claude Opus 5 — the most advanced Opus model yet, and compatible with zero data retention (ZDR) — bringing a step-change in coding, long-running agents, and complex professional work to teams building at the highest level.&nbsp;</p> \n<p>Claude Opus 5 delivers advances in coding, understanding and navigating codebases like an experienced engineer and writing production-quality code while adapting its strategy as it works. It powers dependable agents that run for hours and even overnight, finding paths around obstacles, recovering from errors, and reaching their objectives. And it brings deeper reasoning to long documents and higher accuracy to complex analysis, with the largest gains on document-heavy enterprise work.&nbsp;</p> \n<p>Customers have two ways to access Claude Opus 5: Amazon Bedrock and Claude Platform on AWS.&nbsp;</p> \n<p>Amazon Bedrock offers Claude Opus 5 with zero data retention (ZDR) enabled by default, giving you Opus' top-tier intelligence while meeting your data governance requirements. It keeps your data within AWS infrastructure with regional data residency, and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability.</a></p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console, with support for zero data retention (ZDR) available on request. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the Claude Platform on AWS <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.&nbsp;</p>"
  "75fec35969437045cfe3b010e1972fb6":
    "id": "75fec35969437045cfe3b010e1972fb6"
    "title": "Amazon SES simplifies sending emails over SMTP using Mail Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ses-simplified-smtp-mail-manager"
    "published": "2026-07-25 00:03:00"
    "fetched": "2026-07-25 05:17:12"
    "summary": "<p>Amazon Simple Email Service (SES) now offers a simplified console experience for sending emails over SMTP using Mail Manager. Mail Manager is a capability within SES for managing email flow, but configuring its resources individually to set up SMTP sending requires multiple steps. The new guided setup creates and configures these resources automatically, so developers can get started in just a few clicks.</p> \n<p>The guided setup gives developers a working SMTP endpoint and downloadable credentials they can plug into any application or framework that supports SMTP. This is ideal for teams building applications that send email notifications, password resets, or transactional messages and need a fast path to a production-ready SMTP configuration.</p> \n<p>This experience is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where <a href=\"https://aws.amazon.com/ses/\">Amazon SES</a> is available.</p> \n<p>To learn more, visit the <a href=\"https://console.aws.amazon.com/ses/\">Amazon SES console</a> or refer to the <a href=\"https://docs.aws.amazon.com/ses/latest/dg/smtp-credentials-mail-manager.html\">documentation</a>.</p>"
  "b6b3acf77454ac92e5369f68df9f9171":
    "id": "b6b3acf77454ac92e5369f68df9f9171"
    "title": "AWS Lambda now publishes logs for Lambda Managed Instances capacity providers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-lambda-managed-instances-logs/"
    "published": "2026-07-25 01:00:00"
    "fetched": "2026-07-25 07:01:45"
    "summary": "<p>AWS Lambda now publishes logs for Lambda Managed Instances (LMI) capacity providers to Amazon CloudWatch Logs, giving you visibility into scaling activity and instance lifecycle operations. LMI enables you to run Lambda functions on Amazon EC2 instances while maintaining serverless operational simplicity. Capacity providers are resources that let you define compute resources that Lambda provisions on your behalf. With capacity provider logs, you can monitor, troubleshoot, and optimize these managed EC2 instances, helping you quickly diagnose provisioning issues and understand scaling behavior.</p> \n<p>Customers use LMI to operate high-volume, predictable workloads with specialized compute configurations and achieve cost efficiency through EC2 pricing options like Savings Plans and Reserved Instances. With this launch, Lambda automatically generates logs for compute resources managed by capacity providers and delivers them to CloudWatch Logs. Lambda publishes structured JSON logs capturing instance lifecycle events like launches, terminations, and health checks. This structured format lets you identify failed operations and provisioning errors through CloudWatch Logs filtering, helping you resolve issues quickly and shorten debugging cycles.</p> \n<p>The capacity provider logs are&nbsp;available in all AWS Commercial Regions where LMI is available. The logs are enabled by default for all capacity providers. You can view your capacity provider logs by visiting the Lambda console's capacity provider page. You can use the Lambda API, Lambda console, AWS CLI, AWS SAM, or AWS CloudFormation to change&nbsp;capacity provider&nbsp;log configuration. Standard Amazon CloudWatch Logs charges apply.&nbsp;To learn more, visit the AWS Lambda Managed Instances <a href=\"https://aws.amazon.com/lambda/lambda-managed-instances/\">product page</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">documentation</a>.&nbsp;</p>"
  "86a0c7ac3dc7317452f5598495d4230d":
    "id": "86a0c7ac3dc7317452f5598495d4230d"
    "title": "Amazon MWAA now supports Apache Airflow version 2.11.2"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-mwaa-now-supports-apache-airflow-version-2-11-2"
    "published": "2026-07-25 06:57:00"
    "fetched": "2026-07-25 08:59:28"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) now supports Apache Airflow version 2.11.2. Amazon MWAA is a managed service that runs Apache Airflow at scale without the operational overhead of managing the underlying infrastructure. Apache Airflow 2.11.2 is a maintenance release that includes security improvements, bug fixes, and dependency upgrades.<br /> <br /> This release upgrades core dependencies with security patches and stability improvements to the Airflow webserver and task execution layers. It also includes fixes to task lifecycle management for queued tasks, enhanced secrets masking in logs, UI corrections in the Task Instances list view, and provider package updates for S3 and CloudWatch log delivery.<br /> <br /> You can create a new Apache Airflow 2.11.2 environment on Amazon MWAA or upgrade your existing environments with a few clicks in the AWS Management Console in all currently available Amazon MWAA regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html\">Amazon MWAA documentation</a>, review the <a href=\"https://airflow.apache.org/docs/apache-airflow/2.11.2/release_notes.html#airflow-2-11-2-2026-03-14\">Apache Airflow 2.11.2 release notes</a>, and explore the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/airflow-versions.html\">list of available Airflow versions on MWAA</a>.</p>"
  "cf44775a26eb4a3493c83a7e93c2db0c":
    "id": "cf44775a26eb4a3493c83a7e93c2db0c"
    "title": "Amazon EC2 Dedicated Hosts now support host resource groups without self-managed licenses"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ec2-dedicated-hosts-hrg/"
    "published": "2026-07-25 06:00:00"
    "fetched": "2026-07-25 08:59:28"
    "summary": "<p>Starting today, customers can create Host Resource Groups (HRGs) for EC2 Dedicated Hosts without the previously required step of creating Self-Managed Licenses (SMLs) and associating AMIs through AWS License Manager.</p> \n<p>This flexibility is particularly valuable for EC2 Mac Instance customers and for customers who need Dedicated Hosts for hardware-level isolation rather than Bring Your Own License (BYOL). Customers with BYOL workloads can continue to create HRGs with SMLs to ensure that only instances from associated AMIs can be launched on the host and track host-level license consumption.</p> \n<p>To create an HRG without SML, uncheck the \"Restrict to AMIs associated with self-managed license\" option when creating a Host Resource Group in the EC2 Console, or set instance-launch-option to license-configuration-required via the AWS CLI.</p> \n<p>This feature is available in all AWS Regions where Host Resource Groups are supported. To learn more, visit the <a href=\"https://docs.aws.amazon.com/license-manager/latest/userguide/host-resource-groups.html\">Host Resource Group User Guide</a></p>"
  "3fe4f9f76e3b9e4a7b7a8bc6f1182637":
    "id": "3fe4f9f76e3b9e4a7b7a8bc6f1182637"
    "title": "Amazon Kinesis Data Streams now supports scaling down ingest capacity with warm throughput"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/kinesis/on-demand-scale-down"
    "published": "2026-07-25 03:55:00"
    "fetched": "2026-07-25 08:59:28"
    "summary": "<p>Amazon Kinesis Data Streams is a serverless streaming data service that makes it easy to capture, process, and store data streams at any scale. On-demand streams automatically increase ingest capacity in response to rising data ingest usage. With On-demand Advantage mode, you can proactively manage stream capacity using warm throughput to prepare streams for sudden changes in data traffic. We are extending warm throughput with the ability to also scale down ingest capacity, giving you full control to scale your stream's write throughput up or down. </p> \n<p>To scale down, simply set a lower warm throughput value on your on-demand stream. The stream adjusts to the requested capacity or the amount needed to support peak data ingest usage in the last hour, whichever is higher. This ensures your stream always retains sufficient capacity for current traffic while releasing excess capacity you no longer need. As a result, you get optimal stream-processing performance and cost efficiency.&nbsp;</p> \n<p>Warm throughput scale-down is available at no additional cost for all on-demand streams with On-demand Advantage mode enabled.&nbsp; For more information about On-demand Advantage, see <a href=\"https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html\">Choose the right mode to stream in</a> in the Amazon Kinesis Data Streams Developer Guide. To get started with the feature, see <a href=\"https://docs.aws.amazon.com/streams/latest/dev/updating-a-stream.html\">Update a stream</a>. For pricing details, see <a href=\"https://aws.amazon.com/kinesis/data-streams/pricing/\">Amazon Kinesis Data Streams pricing</a>.</p> \n<p>The feature is available in all AWS Regions where Amazon Kinesis Data Streams On-demand Advantage is supported.&nbsp;</p> \n<p>&nbsp;</p>"
"last_updated": "2026-07-25 08:59:28 JST"
