    "title": "Claude Opus 5 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/claude-opus-5-aws/"
    "published": "2026-07-25 00:00:00"
    "fetched": "2026-07-25 03:15:31"
    "summary": "<p>AWS now offers Claude Opus 5 — the most advanced Opus model yet, and compatible with zero data retention (ZDR) — bringing a step-change in coding, long-running agents, and complex professional work to teams building at the highest level.&nbsp;</p> \n<p>Claude Opus 5 delivers advances in coding, understanding and navigating codebases like an experienced engineer and writing production-quality code while adapting its strategy as it works. It powers dependable agents that run for hours and even overnight, finding paths around obstacles, recovering from errors, and reaching their objectives. And it brings deeper reasoning to long documents and higher accuracy to complex analysis, with the largest gains on document-heavy enterprise work.&nbsp;</p> \n<p>Customers have two ways to access Claude Opus 5: Amazon Bedrock and Claude Platform on AWS.&nbsp;</p> \n<p>Amazon Bedrock offers Claude Opus 5 with zero data retention (ZDR) enabled by default, giving you Opus' top-tier intelligence while meeting your data governance requirements. It keeps your data within AWS infrastructure with regional data residency, and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability.</a></p> \n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console, with support for zero data retention (ZDR) available on request. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the Claude Platform on AWS <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.&nbsp;</p>"
