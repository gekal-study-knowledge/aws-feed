    "title": "Claude Opus 5 が Kiro で利用可能になりました"
    "link": "https://aws.amazon.com/jp/blogs/news/opus-5/"
    "published": "2026-07-25 07:41:56"
    "fetched": "2026-07-25 08:59:28"
    "summary": "Kiro の IDE / CLI / Web すべてで Claude Opus 5 が本日から利用可能になりました。Opus 4.8 からの意味のある進化として、時間のかかる作業に強くなり、並列エージェントの協調が改善され、長いセッションにおけるコストとレイテンシをより細かく扱える新しいコントロールが備わっています。"
