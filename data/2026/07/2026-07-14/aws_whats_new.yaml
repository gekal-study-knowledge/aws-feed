"entries":
  "09a7f9828b3adb3abaa1442b0dfd975f":
    "id": "09a7f9828b3adb3abaa1442b0dfd975f"
    "title": "Gemma-4-E2B-it for is now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/gemma-4-e2b-on-sagemaker-jumpstart/"
    "published": "2026-07-14 00:30:00"
    "fetched": "2026-07-14 03:40:48"
    "summary": "<p>Today, AWS announced the availability of gemma-4-E2B-it in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. This model from Google DeepMind is a multimodal, instruction-tuned model optimized for efficient local execution, enabling customers to build capable AI applications on AWS infrastructure.</p> \n<p>Gemma-4-E2B-it processes text, image, and audio input and generates text output, with a built-in reasoning mode that lets the model think step-by-step before answering. It offers image understanding including object detection, document parsing, screen and UI understanding, chart comprehension, and OCR; video understanding; native function calling for agentic workflows; code generation, completion, and correction; and multilingual support across dozens of languages.</p> \n<p>With SageMaker JumpStart, customers can deploy this model with just a few clicks to address their specific AI use cases. To get started with this model, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the model to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "d8ffdc8ccc838f0be84634873b6fecd3":
    "id": "d8ffdc8ccc838f0be84634873b6fecd3"
    "title": "OpenAI privacy-filter for PII detection and masking is now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/privacy-filter-on-sagemaker-jumpstart/"
    "published": "2026-07-14 00:30:00"
    "fetched": "2026-07-14 03:40:48"
    "summary": "<p>Today, AWS announced the availability of privacy-filter in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. This model from OpenAI is a bidirectional token-classification model for personally identifiable information (PII) detection and masking in text, enabling customers to build data sanitization workflows on AWS infrastructure.</p> \n<p>Privacy-filter is fast, context-aware, and tunable, designed for high-throughput data sanitization workflows that teams can run on-premises. It labels an input sequence in a single forward pass and detects PII span categories including account numbers, addresses, emails, names, phone numbers, URLs, dates, and secrets.&nbsp;</p> \n<p>With SageMaker JumpStart, customers can deploy this model with just a few clicks to address their specific AI use cases. To get started with this model, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the model to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "e4bff772deb702cc4ec7893943eeabc0":
    "id": "e4bff772deb702cc4ec7893943eeabc0"
    "title": "Voxtral-Mini-4B-Realtime for real-time speech transcription is now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/voxtral-mini-realtime-on-sagemaker-jumpstart/"
    "published": "2026-07-14 00:30:00"
    "fetched": "2026-07-14 03:40:48"
    "summary": "<p>Today, AWS announced the availability of Voxtral-Mini-4B-Realtime-2602 in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. This model from Mistral AI is a multilingual, real-time speech-transcription model, enabling customers to build low-latency speech applications on AWS infrastructure.</p> \n<p>Voxtral-Mini-4B-Realtime excels at high-quality transcription of audio to text with a natively streaming architecture that enables real-time transcription. It supports multilingual transcription across 13 languages and offers configurable transcription delays, allowing users to balance latency and accuracy based on their needs.</p> \n<p>With SageMaker JumpStart, customers can deploy this model with just a few clicks to address their specific AI use cases. To get started with this model, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the model to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "c7cdc290ee145f1a563abc6ef022124d":
    "id": "c7cdc290ee145f1a563abc6ef022124d"
    "title": "Qwen3 embedding and reranking models for retrieval are now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/qwen3-search-retrieval-on-sagemaker-jumpstart/"
    "published": "2026-07-14 00:30:00"
    "fetched": "2026-07-14 03:40:48"
    "summary": "<p>Today, AWS announced the availability of Qwen3-VL-Embedding-2B and Qwen3-Reranker-4B in Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These models from Qwen are designed for information retrieval and cross-modal understanding, enabling customers to build comprehensive search pipelines on AWS infrastructure. The two models are typically used in tandem: the embedding model performs efficient initial recall, while the reranker refines results in a subsequent re-ranking stage.</p> \n<p>These models address different stages of the retrieval pipeline with specialized capabilities:</p> \n<p><b>Qwen3-VL-Embedding-2B</b> accepts diverse inputs including text, images, screenshots, and videos, as well as inputs containing a mixture of these modalities, and generates semantically rich vectors that capture both visual and textual information in a shared space. It delivers performance across diverse multimodal tasks such as image-text retrieval, video-text matching, visual question answering, and multimodal content clustering, with support for over 30 languages.</p> \n<p><b>Qwen3-Reranker-4B</b> takes a query and document pair as input and outputs a precise relevance score to refine retrieval results. It supports text retrieval, code retrieval, text classification, text clustering, and bitext mining across over 100 languages, with user-defined instructions to enhance performance for specific tasks, languages, or scenarios.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases. To get started with these models, navigate to the Models section of SageMaker Studio or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "436e247d90c5d41e79a72deccbb60fd5":
    "id": "436e247d90c5d41e79a72deccbb60fd5"
    "title": "Amazon DocumentDB (with MongoDB compatibility) now available as a skill in the Agent Toolkit for AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-documentdb-agent-skill"
    "published": "2026-07-14 03:00:00"
    "fetched": "2026-07-14 05:10:58"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) is now available as a specialized database skill in the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\">Agent Toolkit for AWS</a>. With this skill, AI coding agents can set up, manage, migrate, optimize, and troubleshoot Amazon DocumentDB clusters using step-by-step best-practice workflows, reducing errors and helping developers move faster without needing to look up DocumentDB operations guidance manually.</p> \n<p>The Amazon DocumentDB skill covers seven workflows: cluster provisioning, schema design, MongoDB compatibility assessment, DMS-based migration with change data capture, performance tuning, a 41-check well-architected review, and major version upgrades. When paired with the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html\">AWS MCP Server</a>, agents can execute AWS CLI commands and run diagnostic queries with IAM-based guardrails, CloudTrail audit logging, and sandboxed execution. The skill also works standalone via the AWS CLI for teams that prefer local execution.</p> \n<p>The Amazon DocumentDB skill is available at no additional charge as part of the Agent Toolkit for AWS. To get started, see the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/database-skills/amazon-documentdb\">Amazon DocumentDB skill on GitHub</a> or browse the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/quick-start.html\">Agent Toolkit Quick Start guide</a>. For more information about Amazon DocumentDB, see the <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/\">Amazon DocumentDB Developer Guide</a>.</p>"
  "3aa8523cefa73f86d84e996dc1873658":
    "id": "3aa8523cefa73f86d84e996dc1873658"
    "title": "OpenAI GPT-5.6 Sol, Terra, and Luna now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/openai-gpt-sol-terra/"
    "published": "2026-07-14 07:03:00"
    "fetched": "2026-07-14 08:50:59"
    "summary": "<p>GPT-5.6 Sol, Terra, and Luna are now generally available on Amazon Bedrock, bringing the smartest family of models from OpenAI yet to Bedrock's next-generation inference engine built for high-performance, security and reliability. GPT-5.6 sets a new standard for intelligence and efficiency, allowing you to solve harder problems in less time and with more intelligence per token. The three models span capability tiers from flagship reasoning (Sol) to balanced performance (Terra) to fast, cost-efficient inference (Luna), all accessible through the Responses API on Amazon Bedrock.&nbsp;</p> \n<p>With GPT-5.6, you can build autonomous coding agents, run long-horizon genomics and biology analyses, and perform advanced cybersecurity research. Sol delivers state-of-the-art results on agentic coding benchmarks, Terra provides GPT-5.5-level performance at half the cost, and Luna brings fast, affordable inference at the lowest price point. GPT-5.6 also supports prompt caching with explicit cache breakpoints, so repeated context across agentic workflows is billed at a 90% discount and doesn't compound cost as you scale. Pricing matches OpenAI first-party rates and usage counts toward your AWS commitments.&nbsp;</p> \n<p>GPT-5.6 Sol is available in the following <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions</a>: US East (N. Virginia) and US East (Ohio). GPT-5.6 Terra and Luna are available in US East (N. Virginia), US East (Ohio), and US West (Oregon). Get started with Sol, Terra, and Luna using the <a href=\"https://us-east-1.console.aws.amazon.com/bedrock-mantle/home?region=us-east-1#\">Amazon Bedrock Console</a> or the Responses API on the bedrock-mantle endpoint. To learn more, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock documentation</a> and read the <a href=\"https://aws.amazon.com/blogs/machine-learning/openai-gpt-5-6-sol-terra-and-luna-are-now-generally-available-on-amazon-bedrock/\">launch blog post</a>.</p>"
  "1fa32c36e7eaa0e2d0a40aa155024af2":
    "id": "1fa32c36e7eaa0e2d0a40aa155024af2"
    "title": "Amazon Managed Service for Prometheus is now available in Asia Pacific (New Zealand) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-service-prometheus-new-zealand/"
    "published": "2026-07-14 06:17:00"
    "fetched": "2026-07-14 08:50:59"
    "summary": "<p><a href=\"https://aws.amazon.com/prometheus/\">Amazon Managed Service for Prometheus</a> is now available in Asia Pacific (New Zealand) Region. Amazon Managed Service for Prometheus is a fully managed, Prometheus-compatible monitoring service that makes it easy to monitor and alert on operational metrics at scale.&nbsp;<br /> &nbsp;<br /> Amazon Managed Service for Prometheus is available in multiple <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>. Customers can send up to 1 billion active metric series to a single workspace and can create many workspaces per account, where a workspace is a logical space dedicated to the storage and querying of Prometheus metrics.</p> \n<p>To learn about Amazon Managed Service for Prometheus pricing, visit the <a href=\"https://aws.amazon.com/prometheus/pricing/\">pricing page</a>.</p>"
  "a9f4908091473acafed148b6719bb7ae":
    "id": "a9f4908091473acafed148b6719bb7ae"
    "title": "Amazon DocumentDB (with MongoDB compatibility) adds support for 46 new MongoDB operators in version 8.0.1"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-documentdb-mongodb-8-0-1-mongo-api"
    "published": "2026-07-14 02:00:00"
    "fetched": "2026-07-14 14:25:14"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) now supports 46 additional MongoDB aggregation operators and cursor methods starting from minor version 8.0.1. This release significantly expands query API compatibility, making it easier to migrate MongoDB workloads to Amazon DocumentDB without application code changes.</p> \n<p>New capabilities span seven categories:</p> \n<ul> \n <li><p>Accumulators (13): $top, $topN, $bottom, $bottomN, $firstN, $lastN, $maxN, $minN, $count, $median, $percentile, $stdDevPop, $stdDevSamp</p> </li> \n</ul> \n<ul> \n <li><p>Trigonometry (15): $sin, $cos, $tan, $asin, $acos, $atan, $atan2, $sinh, $cosh, $tanh, $asinh, $acosh, $atanh, $degreesToRadians, $radiansToDegrees&nbsp;</p> </li> \n</ul> \n<ul> \n <li><p>Bitwise aggregation (4): $bitAnd, $bitOr, $bitXor, $bitNot</p> </li> \n</ul> \n<ul> \n <li><p>Arithmetic (3): $round, $trunc, $sigmoid</p> </li> \n</ul> \n<ul> \n <li><p>Data size and type (4): $binarySize, $bsonSize, $isNumber, $toUUID</p> </li> \n</ul> \n<ul> \n <li><p>Timestamp (2): $tsIncrement, $tsSecond&nbsp;</p> </li> \n</ul> \n<ul> \n <li><p>Stages and other (5): $sortByCount, $listSearchIndexes, $sampleRate, cursor.min(), cursor.max()</p> </li> \n</ul> \n<p>These operators are available starting from Amazon DocumentDB 8.0.1 in all regions where Amazon DocumentDB is available. To learn more, see <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/mongo-apis.html\">Supported MongoDB APIs, operations, and data types</a> and <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/release-notes.html\">Amazon DocumentDB release notes</a>.</p>"
  "df80e63524e7e6163ceaaef55deca031":
    "id": "df80e63524e7e6163ceaaef55deca031"
    "title": "Amazon CloudFront Functions now supports logging to CloudFront access logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/cloudfront-functions-access-logs/"
    "published": "2026-07-14 17:00:00"
    "fetched": "2026-07-15 02:10:41"
    "summary": "<p>You can now write custom data directly into CloudFront access logs using a new helper method available from within CloudFront Functions. CloudFront Functions run lightweight JavaScript at the edge for tasks like URL rewrites, header manipulation, and request routing. Previously, you could only emit log data to Amazon CloudWatch Logs as a separate log file from your CloudFront access logs. With this launch, you no longer need to correlate function decisions with CloudFront access log data across separate logging systems.</p> \n<p>You can call <i>cf.logCustomData() </i>from viewer request or viewer response functions to log values such as A/B test variant assignments, authentication outcomes, or routing decisions directly into the CloudFront access log record for that request. This works with both CloudFront real time log configurations and standard logging (v2), so you can analyze function behavior and request outcomes in a single query. The existing <i>console.log()</i> functionality remains available and the two methods can be used together in the same function.</p> \n<p>Amazon CloudFront Functions custom log data is available today in all CloudFront edge locations. There is no additional charge for using <i>cf.logCustomData().</i> Standard CloudFront Functions invocation pricing and access log delivery charges apply. To get started, visit <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/general-helper-methods.html#log-custom-data-method\" rel=\"noopener noreferrer\" target=\"_blank\">CloudFront Functions helper methods</a>.</p>"
"last_updated": "2026-07-15 02:10:41 JST"
