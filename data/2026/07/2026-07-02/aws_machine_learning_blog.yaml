  "5bb72f0227f7824a73c9ab6d842f1b3e":
    "id": "5bb72f0227f7824a73c9ab6d842f1b3e"
    "title": "Run NVIDIA Nemotron and OpenAI GPT OSS models on Amazon Bedrock in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/blogs/machine-learning/run-nvidia-nemotron-and-openai-gpt-oss-models-on-amazon-bedrock-in-aws-govcloud-us/"
    "published": "2026-07-02 03:14:34"
    "fetched": "2026-07-02 04:48:30"
    "summary": "We're excited to introduce US-based frontier open-weight models in AWS GovCloud (US). With this release, Amazon Bedrock now supports OpenAI’s open-weight GPT OSS models (120B and 20B) and NVIDIA Nemotron (Nano 9B v2, Nano 12B v2, Nano 30B, Super 120B) models. In this post, we cover these models and their capabilities, the inference options for data residency, the available service tiers and how to get started."
  "0e5d06b742c8c8e45ef6b1aaa4664575":
    "id": "0e5d06b742c8c8e45ef6b1aaa4664575"
    "title": "Building a serverless A2A gateway for agent discovery, routing, and access control"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-a-serverless-a2a-gateway-for-agent-discovery-routing-and-access-control/"
    "published": "2026-07-02 03:07:06"
    "fetched": "2026-07-02 04:48:30"
    "summary": "In this post, you will learn how to build a serverless A2A gateway on AWS that hosts multiple agents behind a single domain using path-based routing (/agents/{agentId}). Standard A2A clients work without modification."
  "a76117bc7289d19e260b97f3cb15041b":
    "id": "a76117bc7289d19e260b97f3cb15041b"
    "title": "Structured memory filtering with metadata in AgentCore Memory"
    "link": "https://aws.amazon.com/blogs/machine-learning/structured-memory-filtering-with-metadata-in-agentcore-memory/"
    "published": "2026-07-02 03:03:10"
    "fetched": "2026-07-02 04:48:30"
    "summary": "In this post, you will learn how metadata works across configuration, ingestion, and retrieval, explore enterprise use cases including multi-agent and multi-tenant architectures, and discover best practices for implementation."
  "955246735c8b09a5665e7c3e6ee054ee":
    "id": "955246735c8b09a5665e7c3e6ee054ee"
    "title": "HippoRAG: Neurobiologically inspired RAG using Amazon Bedrock, Amazon Neptune, and personalized PageRank"
    "link": "https://aws.amazon.com/blogs/machine-learning/hipporag-neurobiologically-inspired-rag-using-amazon-bedrock-amazon-neptune-and-personalized-pagerank/"
    "published": "2026-07-02 03:01:32"
    "fetched": "2026-07-02 04:48:30"
    "summary": "In this post, we demonstrate how to implement HippoRAG using a comprehensive AWS stack. We use Amazon Bedrock for LLM capabilities, Amazon Neptune for graph database functionality, Amazon Neptune Analytics for advanced graph algorithms including Personalized PageRank, and Amazon Titan Embeddings for vector representations. This implementation showcases how to build and deploy HippoRAG within AWS infrastructure for enterprise-scale applications."
  "8531b319a8cd597ab9a3b61b0e710ab5":
    "id": "8531b319a8cd597ab9a3b61b0e710ab5"
    "title": "How Inscribe uses Amazon Bedrock to stop document fraud in seconds"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-inscribe-uses-amazon-bedrock-to-stop-document-fraud-in-seconds/"
    "published": "2026-07-02 02:53:16"
    "fetched": "2026-07-02 04:48:30"
    "summary": "In this post, you will learn how Inscribe developed an agentic AI system using Amazon Bedrock that reasons across documents the way an expert fraud analyst would. With this new agentic AI system, Inscribe now detects tampered, fabricated, and AI-generated financial documents in under 90 seconds. This is a 20x improvement over traditional manual review, while maintaining the accuracy and explainability required by financial services regulations."
  "0fba25a8c973ef9539c37fec272cbcd2":
    "id": "0fba25a8c973ef9539c37fec272cbcd2"
    "title": "Simplify model selection in Amazon Bedrock with the open source Model Profiler"
    "link": "https://aws.amazon.com/blogs/machine-learning/simplify-model-selection-in-amazon-bedrock-with-the-open-source-model-profiler/"
    "published": "2026-07-02 02:46:54"
    "fetched": "2026-07-02 04:48:30"
    "summary": "The Amazon Bedrock Model Profiler is an open source tool that aggregates model metadata from multiple AWS APIs and external sources into a single, searchable interface. In this post, you’ll learn what the Model Profiler provides, the real-world scenarios it supports, and how to deploy it in your own environment in under five minutes."
  "464421c9f1261412853ed88c5b697105":
    "id": "464421c9f1261412853ed88c5b697105"
    "title": "Accelerate protein design with BoltzGen on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerate-protein-design-with-boltzgen-on-amazon-sagemaker-ai/"
    "published": "2026-07-02 02:44:08"
    "fetched": "2026-07-02 04:48:30"
    "summary": "In this post, we demonstrate how to deploy BoltzGen on SageMaker AI and run an end-to-end protein design experiment. By the end of the walkthrough, you have a working setup that scales from quick validation runs to production batch processing. The setup offers two execution modes for different stages of research and uses step-level caching to reduce compute expenses during iterative workflows."
