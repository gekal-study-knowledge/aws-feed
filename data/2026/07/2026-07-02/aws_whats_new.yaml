"entries":
  "e0ed913b9e1b50a23629bbbd026c6b09":
    "id": "e0ed913b9e1b50a23629bbbd026c6b09"
    "title": "Amazon Managed Service for Prometheus achieves FedRAMP High and DoD IL-4/5 authorization in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-service-prometheus-fedramp-high/"
    "published": "2026-07-02 00:43:00"
    "fetched": "2026-07-02 02:10:51"
    "summary": "<p>Amazon Managed Service for Prometheus is now FedRAMP High and Department of Defense Cloud Computing Security Requirements Guide (DoD CC SRG) Impact Level (IL) 4 and 5 authorized in the AWS GovCloud (US) Regions.</p> \n<p>Federal agencies, public sector organizations, and other enterprises with FedRAMP High and DoD CC SRG IL-4/5 compliance requirements can now use Amazon Managed Service for Prometheus to monitor and alert on their workloads with confidence that it meets the security and compliance standards required for sensitive environments.</p> \n<p>Amazon Managed Service for Prometheus is a fully managed, Prometheus-compatible monitoring service that makes it easy to monitor and alert on operational metrics at scale. It automatically scales ingestion and storage for high-cardinality workloads, and integrates with AWS security services for fast, secure access to data.</p> \n<p>For more details about Amazon Managed Service for Prometheus in AWS GovCloud (US), visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-amp.html\">Amazon Managed Service for Prometheus GovCloud documentation</a> or contact your AWS account team for more information. To learn more, visit the Amazon Managed Service for Prometheus <a href=\"https://aws.amazon.com/prometheus/\">product page</a>.</p>"
  "bf8e46571c27751c7b7563b55f0410ab":
    "id": "bf8e46571c27751c7b7563b55f0410ab"
    "title": "AWS Security Agent now available in Asia Pacific (Mumbai), Asia Pacific (Singapore), and South America (São Paulo)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-security-agent-asia-pacific/"
    "published": "2026-07-02 00:26:00"
    "fetched": "2026-07-02 02:10:51"
    "summary": "<p>Starting today, AWS Security Agent (now part of <a href=\"https://aws.amazon.com/continuum/\">AWS Continuum</a>) is available in three additional AWS Regions: Asia Pacific (Mumbai), Asia Pacific (Singapore), and South America (São Paulo). Customers in these Regions can now access core capabilities of Security Agent to proactively secure their applications throughout the development lifecycle.<br /> <br /> With this expansion, customers gain access to STRIDE-based threat modeling (preview) that analyzes design documents and source code to surface risks early in the development lifecycle. Full-repo and PR-level code reviews (preview) are available across GitHub, GitLab, GitHub Enterprise Server, Bitbucket, and Confluence, with managed compliance packs and custom security requirements. They can trigger threat modeling, code reviews, and remediation directly from Kiro or Claude Code through the new IDE plugins and MCP integration. On-demand penetration testing delivers validated findings with reproducible attack paths and ready-to-implement fixes, and retesting confirms that applied remediations are effective. Simulated validation remains available only in US East (N. Virginia).<br /> <br /> AWS Security Agent scales security expertise across your applications to match development velocity while providing comprehensive security coverage. To learn more, visit the <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/what-is.html\">documentation</a> or see our <a href=\"https://aws.amazon.com/security-agent/\">product page</a>.</p>"
  "7446dfd9ac889682e2b84c330ae61e12":
    "id": "7446dfd9ac889682e2b84c330ae61e12"
    "title": "Amazon Bedrock AgentCore now available in four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-four-additional-regions/"
    "published": "2026-07-02 02:00:00"
    "fetched": "2026-07-02 04:48:28"
    "summary": "<p>&nbsp;Amazon Bedrock AgentCore is now available in four additional AWS Regions: Asia Pacific (Bangkok), Asia Pacific (Malaysia), Europe (Milan), and Europe (Spain).&nbsp;Amazon Bedrock AgentCore is the platform to build, connect, and optimize agents. It helps engineers ship agents fast with any framework and any model, connect them to enterprise systems and tools, and optimize them continuously, with security enforced at the infrastructure layer that agents can't bypass.</p> \n<p>With this expansion, customers in these regions can build and run agents closer to their end users with lower latency.&nbsp;AgentCore capabilities including agent runtime, identity and access control, policy management, session persistence, tool connectivity, and observability are available in these regions at launch.</p> \n<p>For more information on AgentCore, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">AgentCore product page</a>&nbsp;or the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/\">AgentCore Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>. For region availability, visit <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a>.</p>"
  "57d579c602e34b2c47b2b0dc88290bfe":
    "id": "57d579c602e34b2c47b2b0dc88290bfe"
    "title": "Amazon RDS announces Cross-Region Automated Backups in four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-cross-region-automated-backups-additional-aws-regions/"
    "published": "2026-07-02 02:00:00"
    "fetched": "2026-07-02 04:48:28"
    "summary": "<p>Cross-Region Automated Backup replication for Amazon RDS is now available in four additional AWS Regions. This launch allows you to setup automated backup replication between Mexico (Central) and Europe (Ireland) or US West (N. California); between Asia Pacific (Taipei) and Asia Pacific (Singapore) or Asia Pacific (Tokyo); between Asia Pacific (New Zealand) and Asia Pacific (Singapore), Asia Pacific (Sydney), or Asia Pacific (Melbourne); and between Asia Pacific (Thailand) and Asia Pacific (Singapore) or Asia Pacific (Jakarta) Regions.</p> \n<p>Automated Backups enable recovery capability for mission-critical databases by providing you the ability to restore your database to a specific point in time within your backup retention period. With Cross-Region Automated Backup replication, RDS will replicate snapshots and transaction logs to the chosen destination AWS Region. In the event that your primary AWS Region becomes unavailable, you can restore the automated backup to a point in time in the secondary AWS Region and quickly resume operations. As transaction logs are uploaded to the target AWS Region frequently, you can achieve a Recovery Point Objective (RPO) of within the last few minutes.</p> \n<p>You can setup Cross-Region Automated Backup replication with just a few clicks on the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or using the <a href=\"https://aws.amazon.com/tools/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS SDK</a> or <a href=\"https://docs.aws.amazon.com/cli/latest/reference/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">CLI</a>. Cross-Region Automated Backup replication is available on Amazon RDS for PostgreSQL, Amazon RDS for MariaDB, Amazon RDS for MySQL, Amazon RDS for Db2, Amazon RDS for Oracle, and Amazon RDS for Microsoft SQL Server. For more information, including instructions on getting started, read the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReplicateBackups.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS documentation</a>.</p>"
  "cd5b99c713fb88b3ac883687c9f1775e":
    "id": "cd5b99c713fb88b3ac883687c9f1775e"
    "title": "Amazon EKS now supports Kubernetes version rollback"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-eks-version-rollback"
    "published": "2026-07-02 01:00:00"
    "fetched": "2026-07-02 04:48:28"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Kubernetes Service </a>(Amazon EKS) now supports Kubernetes <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/rollback-cluster.html\" rel=\"noopener noreferrer\" target=\"_blank\">version rollback</a>, enabling you to revert to the previous Kubernetes minor version within 7 days if any issues arise after an upgrade. This provides an additional safety net for your upgrade workflow, allowing you to validate the new version under real production conditions and rollback if needed.<br /> <br /> You can initiate a rollback using the Amazon EKS console, AWS CLI, or AWS SDKs. Before proceeding, Amazon EKS evaluates your cluster <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/cluster-insights.html\" rel=\"noopener noreferrer\" target=\"_blank\">rollback readiness insights</a> that include automated checks covering API compatibility, version skew, add-on compatibility, cluster health, and more. For clusters running <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/rollback-automode.html\" rel=\"noopener noreferrer\" target=\"_blank\">EKS Auto Mode</a>, EKS automatically manages the rollback of worker nodes before reverting the control plane, honoring your configured disruption controls.<br /> <br /> Amazon EKS version rollback is available at no additional cost in all AWS Regions where Amazon EKS is available. To get started, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/rollback-cluster.html\" rel=\"noopener noreferrer\" target=\"_blank\">version rollback</a> in the <i>Amazon EKS User Guide</i>.</p>"
  "427bbddc9f9aa629395c167298face0a":
    "id": "427bbddc9f9aa629395c167298face0a"
    "title": "AWS Artifact now includes Assurance Assistant for compliance inquiries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-artifact-assurance-assistant/"
    "published": "2026-07-02 05:01:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>AWS Artifact now includes Assurance Assistant, an AI-powered capability that generates citation-backed responses to security and compliance questions about AWS services. AWS Artifact is the service through which AWS provides compliance reports, certifications, and agreements to customers. Assurance Assistant helps third-party risk managers, compliance officers, security engineers, and auditors accelerate vendor assessments and due diligence questionnaire (DDQ) completion by providing sourced answers grounded in verified AWS compliance documentation.<br /> <br /> Assurance Assistant offers two modes: single-question mode for immediate on-screen responses, and questionnaire upload mode for bulk processing of XLSX files including industry-standard formats such as CAIQ, SIG, and custom DDQs. All responses include citations from AWS compliance documentation — including SOC reports, ISO certifications, and C5 attestation packages — so customers can independently verify information against source materials. Responses can be exported selectively or in full, with or without citations, in the original file format. To control access, two new IAM managed policies are available: AWSArtifactComplianceInquiriesReadOnlyAccess and AWSArtifactComplianceInquiriesFullAccess.<br /> <br /> Assurance Assistant is available at no additional charge through the AWS Artifact console in all commercial AWS Regions. AWS Artifact is a globally accessible service; customers do not need to select a specific Region to use Assurance Assistant.<br /> <br /> To learn more about Assurance Assistant, see <a href=\"https://docs.aws.amazon.com/artifact/latest/ug/managing-compliance-inquiries.html\">Managing compliance inquiries</a> in the AWS Artifact User Guide. For general information about AWS Artifact, see the <a href=\"https://aws.amazon.com/artifact/\">AWS Artifact product page</a>.</p>"
  "13c4eba7339a57c41b3be6b527a66420":
    "id": "13c4eba7339a57c41b3be6b527a66420"
    "title": "AWS Partner Central now supports AWS Marketplace listings for co-selling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-marketplace-co-selling-support/"
    "published": "2026-07-02 04:06:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>Today, AWS announces that partners can associate one or more AWS Marketplace solutions and product listings from their AWS Marketplace catalog directly to co-sell opportunities in AWS Partner Central.&nbsp;Previously, opportunities required partners to use solutions specially created for co-selling, which meant partners managed their solutions for the AWS Marketplace catalog and solutions for co-selling separately. Partners can now associate their existing AWS Marketplace listings with opportunities to track fulfillment more effectively.</p> \n<p>When creating or editing an opportunity in AWS Partner Central in the AWS Console, Partners can select one of the following options: (1) AWS Marketplace solutions and products, (2) AWS Marketplace solutions only, (3) AWS Marketplace products only, or (4) Other. Partners can associate up to 10 AWS Marketplace Solutions and up to 10 AWS Marketplace Products with a single opportunity. This includes AWS&nbsp;Marketplace listings within AWS accounts that have an established <a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/manage-subsidiary.html\">subsidiary account connection</a>. The same capability is available programmatically through the AWS Partner Central Selling API. To progress an opportunity to the Committed or Launched stage, an AWS Marketplace Solution, AWS Marketplace Product, or Partner Solution must be associated.</p> \n<p>This capability is generally available in AWS Partner Central in the AWS Console. To learn more, review <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/creating-opportunity.html\">creating an opportunity</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/partner-central/latest/builder-guide/attaching-solutions-to-ace-opportunities.html\">attach AWS Marketplace listings to ACE opportunities</a> guides, or&nbsp;explore how to leverage the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/associating-disassociating-assigning-opportunities.html\">programmatic implementation option</a> with the AWS Partner Central Selling API.</p>"
  "0a411a75cdf3a3190e5895f13594d567":
    "id": "0a411a75cdf3a3190e5895f13594d567"
    "title": "Amazon GuardDuty adds sensitive file modification threat detections"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-guardduty-sfm/"
    "published": "2026-07-02 01:58:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>Amazon GuardDuty Runtime Monitoring now includes three new threat detections that alert security teams when sensitive files are modified on Amazon EC2 instances and container workloads running on Amazon EKS or Amazon ECS. These findings help identify post-compromise attacker activities by monitoring critical system files, including configuration files, authentication settings, and system logs. This capability is designed for security teams, DevSecOps professionals, and cloud security architects who need comprehensive threat visibility across their AWS compute environments.<br /> <br /> The new detections—Persistence:Runtime/SensitiveFileModified, PrivilegeEscalation:Runtime/SensitiveFileModified, and DefenseEvasion:Runtime/SensitiveFileModified—help identify attempts to maintain persistent access, escalate privileges, and evade detection after an initial system compromise. By monitoring five specific file operations (open-for-write, rename, symlink, link, and unlink) directly, these findings can detect threats even when attackers use obfuscated techniques that bypass traditional command-line monitoring. The correlation-based analysis distinguishes malicious behavior from legitimate administrative operations, helping reduce false positives while providing actionable intelligence with MITRE ATT&amp;CK® tactics mapping and remediation recommendations.<br /> <br /> These sensitive file modification findings are now available to all customers who have enabled GuardDuty Runtime Monitoring for their Amazon EC2, Amazon EKS, or Amazon ECS workloads. A 30-day free trial is available for new users. To learn more, see <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html\">Amazon GuardDuty Findings</a>. To receive programmatic updates on new Amazon GuardDuty features and threat detections, please subscribe to the <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_sns.html\">Amazon GuardDuty SNS topic</a>.</p>"
  "f3eb0db8c6e727c8598ff693980d641c":
    "id": "f3eb0db8c6e727c8598ff693980d641c"
    "title": "AWS AppConfig launches managed experimentation tools for A/B testing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/6/aws-appconfig-experimentation/"
    "published": "2026-07-02 01:30:00"
    "fetched": "2026-07-02 06:24:12"
    "summary": "<p>Today, AWS announces the general availability of experimentation tools in AWS AppConfig, a new capability that enables you to run A/B tests and feature experiments without building or managing separate experimentation infrastructure. Built on 25+ years of Amazon experimentation best practices, AWS AppConfig experimentation tools use AI-driven guidance to help you build robust experiments while providing exposure control and locked treatment allocations so you can make confident, data-driven decisions about what to ship to your customers.</p> \n<p>Using AWS AppConfig experimentation tools, you can run A/B tests and multivariate experiments across your application stack, from UI changes and recommendation algorithms to AI model selections and prompt experiments. Define feature variations, target granular audiences using a rule builder, and set traffic allocation percentages through the AWS Management Console, CLI, API, or AWS CDK. AI-assisted experiment design can validate your setup against Amazon's best practices, helping you build experiments with sufficient statistical power. Customers set up and run the experiment in AWS AppConfig, and then analyze results using Amazon CloudWatch or existing analytics tools. At the end of the experiment, you promote the winning treatment to production through a standard AWS AppConfig safe rollout. Experiments work across workloads on Amazon EC2, AWS Lambda, Amazon ECS, Amazon EKS, and on-premises servers through AWS AppConfig Agent.</p>"
  "43c74b0216ce3fa8375ef94728fbb073":
    "id": "43c74b0216ce3fa8375ef94728fbb073"
    "title": "Amazon Bedrock AgentCore increases default runtime quota limits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-bedrock-agentcore-increases-default-runtime-quota-limits/"
    "published": "2026-07-02 07:00:00"
    "fetched": "2026-07-02 08:10:33"
    "summary": "<p>Amazon Bedrock AgentCore has increased the default runtime quota limits, giving customers greater capacity to scale their agent-based workloads. AgentCore is the platform for developers to build, connect, and optimize AI agents.</p> \n<p>The new default limits support up to 5,000 active concurrent sessions in US East (N. Virginia) and US West (Oregon), and 2,500 in all other supported Regions. All <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Regions where AgentCore</a> is available now support 200 agent interactions per second and 25 new sessions created per second. This means customers can run more AI agents simultaneously while handling high-throughput workloads out of the box.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">AgentCore product page</a>&nbsp;or see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/\">AgentCore Developer Guide</a>. For all quota limits, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/bedrock-agentcore-limits.html\">AgentCore Quotas documentation</a>.</p> \n<p>&nbsp;</p>"
  "0c0f4ca3bd56c3107e6eb08a01a9c50d":
    "id": "0c0f4ca3bd56c3107e6eb08a01a9c50d"
    "title": "Amazon CloudWatch supports creating alarms from log queries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-cloudwatch-log-alarms/"
    "published": "2026-07-02 06:30:00"
    "fetched": "2026-07-02 08:10:33"
    "summary": "<p>Amazon CloudWatch allows you to create alarms on log data using log queries, and get alerted on anomalies without leaving your log analysis workflow.</p> \n<p>With today's launch, you can configure an alarm on log query and specify the alarm threshold directly, thereby eliminating the need to first create metric filters or custom metrics as intermediate steps. This streamlines the path to actively monitoring the data in your logs, and monitoring and alerting on it. For example, you can write a query to count error rates by service, set a threshold, and receive an alarm notification with log context when errors spike - all in a single workflow. Alarms created from log queries support all standard CloudWatch Alarm actions, including Amazon SNS notifications, and Amazon EventBridge integrations.</p> \n<p>This feature is available in all commercial AWS Regions except Middle East (UAE), and Middle East (Bahrain). You can create log query-based alarms using the Amazon CloudWatch console, AWS Command Line Interface (AWS CLI), AWS CloudFormation, and AWS SDKs. For pricing details and documentation, see the Amazon CloudWatch <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">pricing</a>&nbsp;and visit the Amazon CloudWatch <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Alarm-On-Logs.html\">documentation</a>.</p>"
  "782a35cf2ed5465bed8a344c2204f05a":
    "id": "782a35cf2ed5465bed8a344c2204f05a"
    "title": "Amazon ECS now supports configurable deployment circuit breaker settings"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ecs-circuit-breaker-settings/"
    "published": "2026-07-02 02:00:00"
    "fetched": "2026-07-02 08:10:33"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now gives you more control over when a service deployment is considered failed and automatically rolled back. You can now customize deployment circuit breaker settings to match your application's startup behavior, deployment needs, and tolerance for task failures, so rollback works the way you need across different applications and environments.<br /> <br /> The ECS deployment circuit breaker automatically detects failed deployments and rolls them back to the last successful deployment once a failure threshold is reached. With this launch, you can set the deployment circuit breaker threshold using either a fixed task failure count or a percentage of your service's desired task count, and choose how failures are counted using either a consecutive model, where the counter resets when a healthy task starts, or a cumulative model, where failures keep adding up throughout the deployment. For example, you can set lower thresholds for faster rollbacks in development and test environments, or allow more tolerance for applications that experience expected startup failures before stabilizing.<br /> <br /> This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon ECS is available. You can configure deployment circuit breaker settings for new and existing ECS services using the AWS Management Console, AWS CLI, AWS SDKs, AWS CloudFormation, AWS CDK, and Terraform. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-circuit-breaker.html\" rel=\"noopener noreferrer\" target=\"_blank\">ECS deployment circuit breaker documentation</a>.</p>"
  "1573cca51616c3b17fa92f6961642cb5":
    "id": "1573cca51616c3b17fa92f6961642cb5"
    "title": "Amazon ECS Express Mode now supports custom task definitions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ecs-express-mode-custom-task-def/"
    "published": "2026-07-02 01:05:00"
    "fetched": "2026-07-02 08:10:33"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Service</a>&nbsp;(Amazon ECS) Express Mode now supports custom task definitions, giving you the flexibility to use existing ECS application configurations and advanced task-level customizations with Express Mode’s simplified deployment experience. This also enables you to reuse task definitions from your existing CI/CD pipelines and infrastructure-as-code workflows, allowing you to retain established operational practices while taking advantage of Express Mode’s streamlined application deployment and infrastructure automation.</p> \n<p>ECS Express Mode makes it easy to deploy containerized web applications and APIs by automatically handling load balancing, networking, auto scaling, monitoring, and deployments. Now you can get the same simplicity for your own custom task definitions. With this update, you can extend Express Mode services with advanced task definition capabilities, including observability and security sidecars, custom container health checks, ulimits and Linux runtime settings, and FireLens for custom log routing. Once you associate a custom task definition with an Express Mode service, you can continue managing your application either through task definition updates or directly through Express Mode, whichever you prefer.<br /> </p> \n<p>This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>. To get started,&nbsp;create or update your ECS Express Mode service by passing your task definition using the AWS Management Console, AWS CLI, AWS SDKs, or infrastructure-as-code tools. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html\">Amazon ECS Express Mode</a> documentation and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-getting-started.html\">getting started walkthrough</a>.</p>"
  "3f8fead759e53e6f790d9be61948a4d9":
    "id": "3f8fead759e53e6f790d9be61948a4d9"
    "title": "ECS Service Connect now supports Zone-Aware routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ecs-service-connect-zone-aware/"
    "published": "2026-07-02 06:28:00"
    "fetched": "2026-07-02 11:52:58"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a>&nbsp;(Amazon ECS) introduces zone-aware routing for ECS Service Connect, enabling customers to reduce cross Availability Zone (AZ) data transfer costs and latency by automatically prioritizing service-to-service traffic within the same AZ.<br /> <br /> With this launch, ECS Service Connect preferentially routes requests to endpoints in the same AZ as the originating task while dynamically adjusting traffic weights as endpoints scale to maintain balanced load across target services. Previously, as customers distributed their applications across AZs for resiliency, service-to-service traffic led to significant cross-zone data transfer, requiring trade-offs between cost and resilience. Zone-aware routing eliminates this trade-off, and when local endpoints become unhealthy or fall below capacity thresholds, traffic automatically redistributes across healthy AZs to maintain availability without overloading any single zones.<br /> <br /> Zone-aware routing is enabled by default for all new and existing services and requires no additional infrastructure or application code changes. Existing services require a one-time redeployment to enable the new routing behavior. You can use Amazon VPC Flow Logs with AZ metadata to monitor cross-AZ traffic patterns and validate routing effectiveness.&nbsp;This feature is available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a>,&nbsp;where ECS Service Connect is supported at no additional cost.&nbsp;For more details, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect-zone-aware-routing.html\">documentation</a> and launch <a href=\"https://aws.amazon.com/blogs/containers/announcing-zone-aware-routing-in-amazon-ecs-service-connect/\">blog post</a>.</p>"
  "88ac459191b98ed472bf6cece24ad8f8":
    "id": "88ac459191b98ed472bf6cece24ad8f8"
    "title": "Amazon ECS now provides real-time deployment observability in the AWS Management Console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ecs-aws-management-console/"
    "published": "2026-07-02 05:48:00"
    "fetched": "2026-07-02 11:52:58"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a>&nbsp;(Amazon ECS) now provides real-time deployment observability in the Amazon ECS Console. With this launch, customers can track deployment progress, monitor deployment health, and diagnose failures directly from the console, and understand exactly what is happening during a deployment, identify issues as they occur, and reduce the time it takes to troubleshoot and resolve deployment failures.</p> \n<p>The enhanced deployment observability introduces a live deployment timeline that shows each phase, service events, and task launch and termination progress with automatic refresh. You can monitor deployment health in real time using circuit breaker status with live task failure proximity and threshold tracking, deployment alarm state, and health checks at both the container and load-balancer level. To diagnose deployment failures faster, you can view failed tasks directly in the deployment timeline with diagnostic context and deep links to related services such as AWS CloudTrail, reducing the need to navigate across multiple tools to pinpoint the root cause of a failure.</p> \n<p>These capabilities are available at no additional charge in all AWS commercial Regions, and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> for all Amazon ECS services using the rolling update deployment type. To get started, navigate to any Amazon ECS service in the&nbsp;<a href=\"https://console.aws.amazon.com/ecs\">Amazon ECS Console</a> and select the Deployments tab.&nbsp;</p>"
