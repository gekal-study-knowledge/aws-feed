"overview": |
  この日はエージェント運用の統制とセキュリティの将来対応が目立ちました。Claude apps gateway for AWS が発表され、Claude Code と Claude Desktop のアクセス・コスト・ポリシーを単一のセルフホスト型コントロールプレーンで統制できるようになりました。Bedrock AgentCore Runtime を AWS WAF で保護する 2 つのアーキテクチャパターンも示されています。セキュリティブログでは耐量子暗号への移行を CISO 視点で整理した記事と、生成 AI アプリのシステムプロンプト漏洩を前提とした緩和策が公開されました。サービス更新では Aurora DSQL の変更データキャプチャが一般提供となり Kinesis Data Streams への変更ストリーミングが可能に、Security Hub は公開到達可能なリソースを特定する Network Scanning を追加、AWS Config は 191 のマネージドルールを追加しています。国内では井村屋グループが SageMaker Canvas によるチルド製品の需要予測で業務工数 90% 削減を達成した事例が紹介されました。
