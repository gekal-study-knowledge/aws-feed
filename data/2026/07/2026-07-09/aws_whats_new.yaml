  "a06c45201f7b6c9e1e837b695162434b":
    "id": "a06c45201f7b6c9e1e837b695162434b"
    "title": "AWS Security Hub now offers Network Scanning to identify publicly reachable resources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-security-hub-network-scanning/"
    "published": "2026-07-09 06:00:00"
    "fetched": "2026-07-09 08:01:53"
    "summary": "<p>Today, AWS Security Hub introduces Network Scanning, a capability that identifies resources in your environment that are reachable from the public internet.&nbsp; Network Scanning probes your resources from the internet to detect actual reachability, not just what could be reachable based on security group rules and route tables. It discovers public IP addresses, virtual machines, and load balancers across your AWS and Azure environments, identifies reachable ports, and determines what services are running behind them. This complements Security Hub’s existing network reachability findings, which identify configurations that could make a resource reachable from the internet.&nbsp;&nbsp;Network Scanning confirms actual reachability from the internet. Each reachable port generates a Security Hub finding with evidence of the port and service discovered. Security Hub Exposures then automatically correlates these findings with other findings and resource configurations to determine broader risk.</p>"
  "c704bd29fb684fa4ef82c5163b2faf83":
    "id": "c704bd29fb684fa4ef82c5163b2faf83"
    "title": "Amazon Redshift RG instances now available on the trailing track"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-redshift-graviton-rg-instances-trailing-track"
    "published": "2026-07-09 03:12:00"
    "fetched": "2026-07-09 08:01:53"
    "summary": "<p>Amazon Redshift now supports Graviton-based RG instances on the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/tracks.html\">trailing track</a>. Starting July 7, 2026, rg.4xlarge and rg.xlarge instance types are available for customers running workloads on the trailing track (P201).</p> \n<p>The trailing track is designed for customers who prioritize stability for production workloads, running on a version already validated through the leading track. With RG instances now available on both tracks, customers can take advantage of AWS Graviton-powered performance - delivering up to 2.4x faster query performance than RA3 instances at 30% lower price per vCPU.<br /> <br /> To get started, customers can provision a new cluster or resize an existing cluster to an rg.4xlarge or rg.xlarge instance type on the trailing track (P201) in the AWS Management Console, AWS CLI, or AWS SDKs.<br /> <br /> For more information, see <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/cluster-versions.html\">Amazon Redshift cluster versions</a>.</p>"
  "090d6ad9873da6421865fe11c75325e2":
    "id": "090d6ad9873da6421865fe11c75325e2"
    "title": "Amazon Aurora DSQL change data capture (CDC) Is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-aurora-dsql-cdc-ga/"
    "published": "2026-07-09 03:00:00"
    "fetched": "2026-07-09 08:01:53"
    "summary": "<p>Amazon Aurora DSQL change data capture (CDC) is now generally available, enabling you to stream real-time database changes to Amazon Kinesis Data Streams for event-driven architectures and data integration workflows.<br /> <br /> Aurora DSQL CDC automatically captures the results of insert, update, and delete operations as change events and delivers them to Kinesis Data Streams with no infrastructure to manage. You can use CDC to synchronize data across microservices, trigger AWS Lambda functions, or deliver changes to Amazon S3, Amazon Redshift, and Amazon OpenSearch Service via Amazon Data Firehose. CDC streaming is designed to have zero impact on your database workload performance.<br /> <br /> CDC streaming is available in all AWS Regions where <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Aurora DSQL is available.</a> Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank\\&amp;all-free-tier.sort-order=asc\\&amp;awsf.Free%20Tier%20Types=*all\\&amp;awsf.Free%20Tier%20Categories=categories%23databases\">AWS Free Tier</a>. To learn more about CDC in Aurora DSQL, visit the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/cdc-setup.html\">documentation page</a>.</p>"
  "a4cf0caa38cc3dfae81c5107ae76d832":
    "id": "a4cf0caa38cc3dfae81c5107ae76d832"
    "title": "Amazon Connect Customer now supports forecasting, planning, and scheduling for Tasks and Emails"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-connect-customer-agent-scheduling-tasks/"
    "published": "2026-07-09 02:00:00"
    "fetched": "2026-07-09 08:01:53"
    "summary": "<p>Amazon Connect Customer now supports forecasting, capacity planning, and scheduling for Tasks and Emails, enabling you to plan and optimize your workforce across all workloads (Voice, Chat, Tasks, Emails). Connect Customer accounts for the unique characteristics of each channel, including concurrent work handling, duration of work from minutes to months, and distinct service level requirements, so your forecasts and schedules reflect how your operation actually runs. For example, if your agents handle email inquiries or tasks such as case processing alongside voice calls, you can now generate a unified forecast that accounts for all of these workloads and create schedules that efficiently allocate agents across channels. Thus enabling end-to-end workforce optimization within a single solution and ensuring consistent service levels across all customer interaction channels.<br /> <br /> This feature is available in all <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region\">AWS Regions</a> where Amazon Connect Customer agent scheduling is available. To learn more about Amazon Connect Customer agent scheduling, click <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html\">here</a>.</p>"
  "005fa301ce21584ab5ee68a2d86b57b1":
    "id": "005fa301ce21584ab5ee68a2d86b57b1"
    "title": "AWS Builder Center Now Offers Free Sandbox Environments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-builder-center-sandbox/"
    "published": "2026-07-09 07:45:00"
    "fetched": "2026-07-09 11:36:11"
    "summary": "<p>AWS Builder Center now lets builders request free, time-limited sandbox environments directly from eligible workshops, eliminating the need for a personal AWS account, credit card, or concerns about unexpected charges. Previously, workshops could only be completed using a builder's own AWS account. With sandbox environments, builders of all skill levels can safely deploy resources, write code, and experiment in a pre-provisioned AWS account.</p> \n<p>Free sandbox environments are ideal for builders who want to gain practical AWS experience without setting up an account. Each sandbox provides 8 hours of access from activation, with automatic cleanup afterward. Builders can request one sandbox per week (resetting every Sunday), and most environments are ready within 15 minutes. Sandboxes are available for select workshops at launch, with more being enabled over time.</p> \n<p>To get started, visit <a href=\"https://builder.aws.com/workshops\">Workshops on AWS Builder Center</a>.</p>"
"last_updated": "2026-07-09 11:36:11 JST"
