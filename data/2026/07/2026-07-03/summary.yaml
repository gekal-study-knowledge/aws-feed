"overview": |
  この日はコンフィデンシャルコンピューティングと SageMaker 運用、セキュリティ AI が中心でした。EC2 Dedicated Hosts が AMD SEV-SNP に対応し、専有物理サーバー上での機密コンピューティングワークロード実行が可能になりました。SageMaker では Unified Studio の Terraform プロビジョニング対応、HyperPod の AMI バージョニングと自動パッチ適用 (NVIDIA ドライバや CUDA を変えずに後方互換のセキュリティパッチのみ適用) が追加されました。AWS Config は API Gateway・EC2・S3 Vectors など 8 つの新リソースタイプに対応。機械学習ブログでは Amazon Bedrock による AI 生成フィッシングの検知、SageMaker AI でのマルチターン強化学習のベストプラクティスが解説されました。日本語では前日発表の EKS バージョンロールバックと CloudFormation Express モードの解説、公共分野の AI 活用セミナー報告が公開されました。なお、この日付のエントリーには後日取得された AWS CodeBuild のビルドホスト更新も含まれます。オンデマンドビルドホストで Amazon Linux 2023 を選択できるようになり、ホストカーネル選択の設定から Amazon Linux 2 (カーネル 4) と Amazon Linux 2023 (カーネル 6) を切り替えられます。
