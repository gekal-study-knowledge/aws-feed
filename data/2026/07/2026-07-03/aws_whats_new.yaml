  "ebba99fe519c151f6a756eb433b208bc":
    "id": "ebba99fe519c151f6a756eb433b208bc"
    "title": "Amazon EC2 Dedicated Hosts now support AMD SEV-SNP"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/ec2-amd-sev-snp-dedicated-hosts"
    "published": "2026-07-03 02:00:00"
    "fetched": "2026-07-03 04:18:37"
    "summary": "<p>Amazon EC2 is announcing support for AMD Secure Encrypted Virtualization-Secure Nested Paging (SEV-SNP) on Dedicated Hosts, enabling customers to run their confidential computing workloads on physical servers fully dedicated to their use.<br /> <br /> Customers can allocate a Dedicated Host with SEV-SNP enabled and launch SEV-SNP instances on it. This gives customers the benefits of Dedicated Hosts for confidential computing workloads, including control over instance placement, and host affinity that allows customers to deploy instances to the same physical server over time. The physical host is provisioned with AMD security firmware during allocation, ensuring a customer’s confidential computing environment is up to date.<br /> <br /> Dedicated Host SEV-SNP is available in all AWS commercial Regions with AMD instances. To learn more, visit our <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sev-snp.html\">documentation</a>.</p>"
  "e5927778ba65d83bda10611c4d03cdfc":
    "id": "e5927778ba65d83bda10611c4d03cdfc"
    "title": "AWS Config now supports 8 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-config-new-resource-types"
    "published": "2026-07-03 00:00:00"
    "fetched": "2026-07-03 04:18:37"
    "summary": "<p>AWS Config now supports 8 additional AWS resource types across key services including Amazon API Gateway, Amazon EC2, and Amazon S3 Vectors. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p> \n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p> \n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\" target=\"_blank\">AWS Regions</a> where the resources are available:</p> \n<p>Resource Types:</p> \n<ul> \n <li>AWS::ApiGateway::DomainNameV2</li> \n <li>AWS::ApiGatewayV2::VpcLink</li> \n <li>AWS::EC2::VPCEncryptionControl</li> \n <li>AWS::NetworkFirewall::ContainerAssociation</li> \n <li>AWS::OpenSearchServerless::SecurityPolicy</li> \n <li>AWS::OSIS::Pipeline</li> \n <li>AWS::S3Vectors::VectorBucket</li> \n <li>AWS::S3Vectors::VectorBucketPolicy</li> \n</ul>"
  "cd709ed441dd23b4f5e31bf0ebea731a":
    "id": "cd709ed441dd23b4f5e31bf0ebea731a"
    "title": "Amazon EC2 X8i instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-x8i-instances-ICN-KUL-NRT-region/"
    "published": "2026-07-03 05:48:00"
    "fetched": "2026-07-03 08:00:42"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8i instances are available in the Asia Pacific (Seoul), Asia Pacific (Malaysia) and Asia Pacific (Tokyo) regions. These instances are powered by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified and deliver the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to previous generation X2i instances.<br /> <br /> X8i instances are designed for memory-intensive workloads like SAP HANA, large databases, data analytics, and Electronic Design Automation (EDA). Compared to X2i instances, X8i instances offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance, 88% faster Memcached performance, and 46% faster AI inference performance. X8i instances come in 14 sizes, from large to 96xlarge, including two bare metal options.<br /> <br /> To get started, visit the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances, and Spot instances. For more information visit <a href=\"https://aws.amazon.com/ec2/instance-types/x8i/\" target=\"_blank\">X8i instances page</a>.</p>"
  "ce8711b9d5295e0912530b7772de353c":
    "id": "ce8711b9d5295e0912530b7772de353c"
    "title": "Amazon SageMaker Unified Studio now supports Terraform for provisioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-sagemaker-unified-studio-terraform/"
    "published": "2026-07-03 06:49:00"
    "fetched": "2026-07-03 11:36:10"
    "summary": "<p>Amazon SageMaker Unified Studio now supports Terraform for provisioning. Customers can use the open-source <a href=\"https://github.com/aws-ia/terraform-aws-sagemaker-unified-studio\">terraform-aws-sagemaker-unified-studio</a> module to deploy a SageMaker Unified Studio domain through version-controlled templates. With this launch, platform teams can bring SageMaker Unified Studio into their existing infrastructure-as-code pipelines, maintaining consistency across development, staging, and production accounts.</p> \n<p>Amazon SageMaker Unified Studio is a unified development environment where data teams can build end-to-end data and AI workflows using familiar tools—from data integration and analytics to machine learning and generative AI—all governed by a shared catalog. Administrators provision domains to give their organization a single, managed workspace with built-in access control, data governance, and cross-service connectivity. With this launch, the Terraform module handles the infrastructure of SageMaker Unified Studio domain with&nbsp;provisioned IAM roles. Sub-modules let teams enable blueprints, compose blueprints into project profiles, and create projects independently. Customers can also&nbsp;create projects with existing IAM roles.&nbsp;This integration is enabled through the <a href=\"https://aws.amazon.com/blogs/devops/quickly-adopt-new-aws-features-with-the-terraform-aws-cloud-control-provider/\">Terraform AWS Cloud Control Provider</a>.</p> \n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all AWS Regions where Amazon SageMaker Unified Studio is available</a>. To get started, see examples provided in <a href=\"https://github.com/aws-ia/terraform-aws-sagemaker-unified-studio\">terraform-aws-sagemaker-unified-studio module</a> on GitHub and the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/\">Amazon SageMaker Unified Studio documentation</a>.</p>"
  "c544280925c0f387954f986e640680ea":
    "id": "c544280925c0f387954f986e640680ea"
    "title": "Amazon SageMaker HyperPod now supports AMI versioning and auto-patching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-sagemaker-hyperpod-ami-version-auto-patch"
    "published": "2026-07-03 01:00:00"
    "fetched": "2026-07-03 11:36:10"
    "summary": "<p>Amazon SageMaker HyperPod now gives you visibility into the Amazon Machine Image (AMI) versions running across your clusters and automatically applies security patches without disrupting your workloads. SageMaker HyperPod is purpose-built infrastructure for training and deploying foundation models at scale. Cluster administrators previously had limited insight into which AMI versions were running, making drift hard to detect and security patching a manual, reactive process that was difficult to run on long multi-day training jobs and that risked changing bundled software in the AMI such as NVIDIA drivers or CUDA. These new capabilities on HyperPod help you keep clusters secure and consistent while removing the operational burden of manual patching.</p> \n<p>With AMI versioning, you can see the exact AMI version on every instance group and node in the semantic versioning (major.minor.patch) format, quickly detect version drift, and roll back to a previous version—including the prior NVIDIA driver, CUDA, and other software stack—using the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateClusterSoftware.html\" rel=\"noopener noreferrer\" target=\"_blank\">UpdateClusterSoftware</a> API. Auto-patching is an opt-in, per-instance-group capability that applies only backward-compatible security patches as nodes become idle, so your running workloads stay undisrupted and critical AI/ML packages such as NVIDIA driver, CUDA version, and operating system kernels are never upgraded to a different major or minor version; you can enable it through the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateCluster.html\" rel=\"noopener noreferrer\" target=\"_blank\">CreateCluster</a> or <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateCluster.html\" rel=\"noopener noreferrer\" target=\"_blank\">UpdateCluster</a> API. A new AMI support policy also publishes support timelines for different AMI versions after which HyperPod stops publishing security patches.</p> \n<p>Both AMI versioning and auto-patching are available for HyperPod clusters orchestrated by Amazon EKS, in all AWS Regions where SageMaker HyperPod is supported. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-release-ami.html\" rel=\"noopener noreferrer\" target=\"_blank\">HyperPod AMI management documentation</a> and the new <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-ami-support-policy.html\" rel=\"noopener noreferrer\" target=\"_blank\">HyperPod AMI support policy.</a></p>"
