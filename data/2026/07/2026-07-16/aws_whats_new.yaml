  "6565a30bd992e6b32ad535225a4cce1f":
    "id": "6565a30bd992e6b32ad535225a4cce1f"
    "title": "Amazon RDS now supports up to four storage modifications in 24 hours"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-upto-four-storage-modifications-24-hours"
    "published": "2026-07-16 01:15:00"
    "fetched": "2026-07-16 03:02:24"
    "summary": "<p>Amazon RDS now allows up to four storage modifications per database instance within a rolling 24-hour window. These modifications let you increase the size, change the type, and adjust the performance of your RDS storage volumes. You can start a new modification right after storage optimization for the previous modification is complete without having to wait for the six-hour cool-off period to complete.</p> \n<p>This enhancement improves operational agility for scaling storage capacity or adjusting performance during sudden data growth or unexpected workload spikes. With RDS storage modifications, you can modify your volumes without downtime, keeping applications running with minimal performance impact.</p> \n<p>The feature is automatically enabled on all Amazon RDS for PostgreSQL, Amazon RDS for MariaDB, Amazon RDS for MySQL, Amazon RDS for Db2, Amazon RDS for Oracle, and Amazon RDS for Microsoft SQL Server instances in all commercial AWS Regions and the AWS GovCloud (US) Regions. To learn more, refer the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.StorageTypes.html\" target=\"_blank\">Amazon RDS User Guide</a>.</p>"
  "36750f27a95e0c91d5cfd2d12e4e6745":
    "id": "36750f27a95e0c91d5cfd2d12e4e6745"
    "title": "Amazon MQ now supports configurable storage for RabbitMQ brokers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-mq-rabbitmq-configurable-storage/"
    "published": "2026-07-16 03:18:00"
    "fetched": "2026-07-16 05:04:49"
    "summary": "<p>Amazon MQ now allows you to configure the EBS Disk storage size for RabbitMQ brokers independently of instance type. When creating or updating a broker, you can define a custom storage size, allowing you to right-size storage independently of your instance size to match your specific messaging workload requirements. Configurable storage is available for RabbitMQ M7g brokers on version 4.2 or later using cluster deployments only.</p> \n<p>With configurable storage, you can choose a storage size from the default value on M7g to the maximum allowed value depending on your instance size in increments of 5 GB. You can specify the Storage Size using the using the AWS Console, AWS CloudFormation, AWS Command Line Interface (CLI), or the AWS Cloud Development Kit (CDK). Storage changes are applied during the next broker reboot.&nbsp;</p> \n<p>Standard Amazon MQ storage pricing applies based on the disk size as per <a href=\"https://aws.amazon.com/amazon-mq/pricing/\" target=\"_blank\">Amazon MQ pricing</a>. Configurable storage is available in all commercial AWS Regions where Amazon MQ for RabbitMQ is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html\" target=\"_blank\">Amazon MQ Developer Guide</a>.</p>"
  "510c1c44bb8be8eac5f4fd086d6a9f3a":
    "id": "510c1c44bb8be8eac5f4fd086d6a9f3a"
    "title": "Amazon RDS and Aurora now support R8g and M8g database instances in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/amazon-rds-aurora-r8g-m8g-regions/"
    "published": "2026-07-16 02:00:00"
    "fetched": "2026-07-16 05:04:49"
    "summary": "<p>AWS Graviton4-based R8g database instances are now generally available for Amazon Aurora (MySQL and PostgreSQL compatibility) and Amazon RDS for PostgreSQL, MySQL, and MariaDB in Asia Pacific (Hyderabad, Melbourne, Malaysia), Europe (London, Paris, Zurich), AWS GovCloud (US-East), South America (Sao Paulo), and Mexico (Central) regions. Additionally, M8g instances are now supported for Amazon RDS for PostgreSQL, MySQL, and MariaDB in US West (N. California), Asia Pacific (Mumbai, Sydney, Hong Kong, Seoul, Malaysia, Singapore), Canada West (Calgary), Europe (Zurich, Milan, Paris), South America (Sao Paulo) and Africa (Cape Town) regions.&nbsp;<br /> <br /> AWS Graviton4-based instances provide up to 40% performance improvement and up to 29% price/performance improvement for on-demand pricing over Graviton3-based instances of equivalent sizes on Amazon Aurora and Amazon RDS databases, depending on database engine, version, and workload. Built on the AWS Nitro System, the new R8g database instances introduce 24xlarge and 48xlarge sizes, delivering up to 192 vCPUs, an 8:1 ratio of memory to vCPU with the latest DDR5 memory, up to 50Gbps enhanced networking bandwidth, and up to 40Gbps of bandwidth to Amazon Elastic Block Store (Amazon EBS).<br /> <br /> You can easily launch R8g or M8g database instances through the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\"> </a><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Command Line Interface</a> (CLI). For detailed information about specific engine versions that support these database instance types, please refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.DBInstanceClass.SupportAurora.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora </a>and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">RDS</a> documentation. For complete information on pricing and regional availability, please refer to the Amazon RDS <a href=\"https://aws.amazon.com/rds/pricing/?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>.&nbsp;</p>"
  "a3a55441ef677175db77962ba1442638":
    "id": "a3a55441ef677175db77962ba1442638"
    "title": "Amazon RDS and Aurora expand R8gd and M8gd to additional Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-aurora-r8gd-m8gd-regions/"
    "published": "2026-07-16 02:00:00"
    "fetched": "2026-07-16 05:04:49"
    "summary": "<p>Amazon Relational Database Service (RDS) now supports R8gd database instances in 12 additional regions and and M8gd database instances in 6 additional Regions with Optimized Reads for Amazon Aurora PostgreSQL, RDS for PostgreSQL, RDS for MySQL, and RDS for MariaDB.<br /> <br /> R8gd and M8gd instances deliver up to 165% better throughput and up to 120% better price-performance over R6g instances for Aurora PostgreSQL. Optimized Reads uses local NVMe-based SSD block storage to store ephemeral data such as temporary tables, reducing network storage access and improving query latency. The result is improved query performance for complex queries and faster index rebuild operations. Aurora PostgreSQL Optimized Reads instances using the I/O-Optimized configuration also use the local storage to extend their caching capacity. Database pages that are evicted from the in-memory buffer cache are cached in local storage to speed subsequent retrieval of that data.<br /> <br /> Customers can get started with Optimized Reads through the AWS Management Console, CLI, and SDK by modifying their existing Aurora and RDS databases or creating a new database using R8gd or M8gd instances. R8gd instances are available in the following additional regions: Europe (Ireland), Asia Pacific (Seoul), Asia Pacific (Malaysia), Europe (London), US West (N. California), Asia Pacific (Sydney), Canada (Central), Asia Pacific (Jakarta), Africa (Cape Town), Canada West (Calgary),&nbsp;South America (Sao Paulo) and Asia Pacific (Hong Kong). M8gd instances are available in the following additional regions: Europe (Ireland), Asia Pacific (Malaysia), Europe (London), Asia Pacific (Sydney),&nbsp;South America (Sao Paulo) and Canada (Central). For complete information on pricing and regional availability, please refer to the <a href=\"https://aws.amazon.com/rds/pricing/\">pricing page</a>. For information on specific engine versions that support these DB instance types, please see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.DBInstanceClass.SupportAurora.html\">Aurora</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html\">RDS</a> documentation.<b></b></p>"
  "1874d491007eab62c57a5b001c8794b0":
    "id": "1874d491007eab62c57a5b001c8794b0"
    "title": "Amazon MSK Express Brokers adds support for Apache Kafka version 4.2"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-msk-express-version-42/"
    "published": "2026-07-16 02:00:00"
    "fetched": "2026-07-16 05:04:49"
    "summary": "<p>Amazon Managed Streaming for Apache Kafka (Amazon MSK) Express Brokers now supports Apache Kafka version 4.2. This release includes Eligible Leader Replicas (ELR) enhancements that strengthen availability with improved leader election correctness. It also introduces a new consumer rebalance protocol that helps ensure smoother and faster group rebalances, and a new Streams Rebalance Protocol that extends broker coordination capabilities to Kafka Streams for optimized task assignments. For a complete list of improvements and bug fixes, please refer to the <a href=\"https://archive.apache.org/dist/kafka/4.2.0/RELEASE_NOTES.html\" rel=\"noopener noreferrer\" target=\"_blank\">Apache Kafka release notes for version 4.2</a>.<br /> <br /> MSK Express Brokers are designed to deliver up to three times more throughput per broker, scale up to 20 times faster, and reduce recovery time by 90 percent. This launch brings the latest open-source reliability and performance improvements to MSK Express.<br /> <br /> To get started, simply select version 4.2.x when creating a new cluster with Express Brokers via the AWS Management Console, AWS CLI, or AWS SDKs. You can also upgrade existing MSK Express Brokers with an in-place rolling update. Amazon MSK orchestrates broker restarts to maintain availability and protect your data during the upgrade. Kafka version 4.2 support is available today across all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS regions</a> where Amazon MSK Express Brokers is offered. To learn how to get started, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MSK Developer Guide</a>.</p>"
  "2f79cb7689fcc0b73764b4b9acf97acb":
    "id": "2f79cb7689fcc0b73764b4b9acf97acb"
    "title": "Amazon CloudWatch Logs announces intelligent tiering for storage"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-cloudwatch-intelligent-tiering/"
    "published": "2026-07-16 05:00:00"
    "fetched": "2026-07-16 07:56:15"
    "summary": "<p>Amazon CloudWatch Logs now supports intelligent storage tiering, which automatically classifies your log data across three storage tiers - Standard (existing), Infrequent Access, and Archive Instant Access based on access patterns. This allows you to store logs in Amazon CloudWatch for extended periods at lower-cost tiers without any operational overhead.</p> \n<p>With today's launch, customers can now retain high-volume verbose logs needed to be stored for longer periods at a lower cost in Amazon CloudWatch. Instead of filtering these logs or exporting them, you can now keep them natively in Amazon CloudWatch and benefit from the same query experience regardless of which tier your data resides in. Amazon CloudWatch monitors access patterns and automatically reclassifies data not accessed for 30 days to the Infrequent Access tier, and data not accessed for 90 days to the Archive Instant Access tier. When you access older data, it is automatically promoted back to the Standard tier for 30 days. By consolidating all your logs in CloudWatch, you get full visibility in one tool, thereby eliminating the operational overhead of managing multiple storage solutions and reducing your Mean Time to Resolution (MTTR) by analyzing, and alerting on all your logs in a single place.</p> \n<p>Amazon CloudWatch Logs Intelligent-Tiering is available in all AWS commercial regions except Middle East (Bahrain) and Middle East (UAE). You can enable intelligent tiering at the account level in the AWS Management Console, AWS SDKs or through AWS CLI. Learn more about CloudWatch Logs intelligent tiering <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">pricing</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/cwl_intelligent_tier.html\">documentation</a>.</p>"
  "2efe6785284cc82d40fd5e9cb440bc54":
    "id": "2efe6785284cc82d40fd5e9cb440bc54"
    "title": "Amazon Cognito now supports importing users with password hashes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-cognito-password-hash-import/"
    "published": "2026-07-16 02:00:00"
    "fetched": "2026-07-16 07:56:15"
    "summary": "<p>Amazon Cognito now supports importing users with password hashes in CSV user imports. Previously, users imported from a CSV file had to reset their passwords on first sign-in. Now, you can include password hashes in your CSV file so that imported users can sign in immediately with their existing credentials.<br /> <br /> When creating a CSV import, you specify the password hashing algorithm used by your source system. Amazon Cognito imports these users and verifies their password against the imported hash on first sign-in. Supported algorithms include bcrypt, scrypt, Argon2id, and PBKDF2 with SHA-256. All imported hashes receive an additional layer of cryptographic protection before storage.<br /> <br /> Password hash import is available in all AWS Regions where Amazon Cognito is available. To get started, create a user import using the <a href=\"https://console.aws.amazon.com/cognito/home\">AWS Management Console</a>, AWS Command Line Interface (CLI), or AWS Software Development Kits (SDKs). See the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-using-import-tool.html\">developer guide</a> for instructions.</p>"
  "d30989423bc5f913f45ac3efbbfde5fd":
    "id": "d30989423bc5f913f45ac3efbbfde5fd"
    "title": "AWS Glue SAP OData connector and zero-ETL integrations are now available in AWS GovCloud (US) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-glue-sap-zero-etl-govcloud"
    "published": "2026-07-16 00:51:00"
    "fetched": "2026-07-16 07:56:15"
    "summary": "<p>AWS Glue SAP OData connector and zero-ETL integrations are now available in AWS GovCloud (US-West) and AWS GovCloud (US-East) Regions, with support for Amazon DynamoDB, Salesforce, and SAP OData as sources. Customers operating in regulated environments can now replicate data from these sources into Amazon Redshift, Amazon S3, or other supported destinations without building or maintaining custom data pipelines.<br /> <br /> The SAP OData connector allows you to extract data from SAP systems exposing OData services, eliminating the need for custom extraction logic or third-party middleware. The zero-ETL integrations are fully managed by AWS and minimize the need to build ETL data pipelines. With this new zero-ETL integration, you can efficiently extract and load valuable data from your Amazon DynamoDB databases or Salesforce and SAP applications into your data lake and data warehouse for analysis. Zero-ETL integration reduces your operational burden and saves the weeks of engineering effort needed to design, build, and test data pipelines. By selecting a few settings in the no-code interface, you can quickly set up your zero-ETL integration to automatically ingest and continually maintain an up-to-date replica of your data in the data lake and data warehouse. Zero-ETL integrations help you focus on deriving insights from your application data, breaking down data silos in your organization and improving operational efficiency.<br /> <br /> To get started, navigate to the AWS Glue console and create a new zero-ETL integration. For more information, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/zero-etl-using.html\">AWS Glue zero-ETL integrations documentation</a>.</p>"
  "815e79cbfe1756cbd06330fc9753b65c":
    "id": "815e79cbfe1756cbd06330fc9753b65c"
    "title": "Amazon EC2 G7e instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-g7e-additional-regions/"
    "published": "2026-07-16 03:04:00"
    "fetched": "2026-07-16 11:34:06"
    "summary": "<p>Starting today, Amazon&nbsp;Elastic Compute Cloud (Amazon EC2) G7e instances accelerated by NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs are now available in the AWS Europe (Frankfurt, Stockholm) and Asia Pacific (Mumbai) Regions. G7e instances offer up to 2.3x inference performance compared to G6e.</p> \n<p>Customers can use G7e instances to deploy large language models (LLMs), agentic AI models, multimodal generative AI models, and physical AI models. G7e instances offer the highest performance for spatial computing workloads as well as workloads that require both graphics and AI processing capabilities. G7e instances feature up to 8 NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs, with 96 GB of memory per GPU, and 5th Generation Intel Xeon processors. They support up to 192 virtual CPUs (vCPUs) and up to 1600 Gbps of networking bandwidth. G7e instances support NVIDIA GPUDirect Peer to Peer (P2P) that boosts performance for multi-GPU workloads. Multi-GPU G7e instances also support NVIDIA GPUDirect Remote Direct Memory Access (RDMA) with EFA in EC2 UltraClusters, reducing latency for small-scale multi-node workloads.</p> \n<p>You can use G7e instances for Amazon EC2 in the following AWS Regions: US West (Oregon), US East (N. Virginia, Ohio), Europe (Spain, London, Frankfurt, Stockholm) and Asia Pacific (Tokyo, Seoul, Mumbai). You can purchase G7e instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p> \n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface</a> (CLI), and AWS SDKs. To learn more, visit <a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\">G7e instances</a>.</p>"
  "58172b8edb23a0e185cdad7960ac9f57":
    "id": "58172b8edb23a0e185cdad7960ac9f57"
    "title": "Amazon CloudWatch Logs Insights adds 25 new query commands and functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/amazon-cloudwatch-logs-insights-ql/"
    "published": "2026-07-16 06:56:00"
    "fetched": "2026-07-17 01:18:17"
    "summary": "<p>Amazon CloudWatch Logs Insights query language now supports 25 new commands and functions that expand your ability to query, transform, correlate, and analyze logs. Customers analyzing logs in CloudWatch Logs Insights often need to perform statistical aggregation, handle null values in time-series data, compare logs across time windows, detect outliers, and enrich events with lookup data.<br /> <br /> With this launch, CloudWatch Logs Insights adds type conversion and encoding functions (hexToAscii, hexToDec, decToHex), date and time functions (parseDate, formatDate, queryStartTime, queryEndTime, queryTimeRange), string functions (messageSize), JSON inspection functions (jsonArraySize, jsonArrayContains), and a conditional validation function (isNumeric). It also introduces statistical commands (variance, topk, countFrequent), row-sequencing and null-handling commands (autoregress, accum, filldown, fillmissing), sessionization and time-comparison commands (sessionize, logcompare), a data analysis command (outlier), query-composition and join commands (where, appendcols), and a lookup enrichment command (cidrlookup).<br /> <br /> These commands and functions are available today in all commercial AWS Regions. To learn more, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData_LogsInsights.html\">documentation</a>.</p>"
"last_updated": "2026-07-17 01:18:17 JST"
