    "title": "Built Technologies builds an AI-powered document intelligence solution on AWS to power agents across real estate finance"
    "link": "https://aws.amazon.com/blogs/machine-learning/built-technologies-builds-an-ai-powered-document-intelligence-solution-on-aws-to-power-agents-across-real-estate-finance/"
    "published": "2026-07-16 03:14:31"
    "fetched": "2026-07-16 05:04:51"
    "summary": "Built partnered with the AWS Generative AI Innovation Center (GenAIIC), AWS Partner AND Digital, and AWS account teams to create a scalable, AI-powered document processing engine that can classify, split, extract, evaluate, and reason over complex real estate finance documents. It reduces workflows that previously took days to minutes, supports hundreds of document types, and gives technical teams and industry experts a shared environment for building and improving document processors."
  "fd968704fda5dd32fbc409637f359a31":
