"overview": |
  この日は Oracle Database@AWS の日本語解説がまとめて公開されたのが最大の特徴です。ワークロード適性を見極める 5 つの質問から、CloudFormation / Terraform でのプロビジョニング、バックアップとリカバリ、高性能ネットワーキング、クロスアカウント共有、トラフィックの集中検査まで、導入から運用までを一通り網羅する構成になっています。Amazon OpenSearch Service には書き込み可能なウォームストレージが加わり、UltraWarm で必要だったホストとの往復なしにウォーム層へ直接書き込めるようになってインフラコストを最大 48% 削減できます。CloudWatch Logs はストレージのインテリジェント階層化と Logs Insights の 25 個の新コマンド・関数を追加しました。Aurora DSQL は FedRAMP Moderate の対象となり、AWS Backup は論理的にエアギャップされた保管庫と復元テストを複数リージョンへ拡大しています。
