  "34fee07d7c43443f9101b806866adaab":
    "id": "34fee07d7c43443f9101b806866adaab"
    "title": "Fine-tune NVIDIA Nemotron 3 models with Amazon SageMaker AI serverless model customization"
    "link": "https://aws.amazon.com/blogs/machine-learning/fine-tune-nvidia-nemotron-3-models-with-amazon-sagemaker-ai-serverless-model-customization/"
    "published": "2026-07-11 00:35:05"
    "fetched": "2026-07-11 01:52:40"
    "summary": "In this post, we explore what makes the Nemotron 3 architecture unique, walk through the fine-tuning techniques available, and show you step-by-step how to get started with serverless customization using SageMaker Studio."
  "1834edcb7e5a1dfa2c601065c09a76c5":
    "id": "1834edcb7e5a1dfa2c601065c09a76c5"
    "title": "Real-time dental image verification with Amazon SageMaker AI at Henry Schein One"
    "link": "https://aws.amazon.com/blogs/machine-learning/real-time-dental-image-verification-with-amazon-sagemaker-ai-at-henry-schein-one/"
    "published": "2026-07-11 00:33:47"
    "fetched": "2026-07-11 01:52:40"
    "summary": "This post describes how Henry Schein One closed that gap by building Image Verify, an AI-powered quality verification system on Amazon SageMaker AI that evaluates dental X-ray quality at the point of capture, in real time, across thousands of locations. The system went from concept to over 10,000 active locations within months and has already processed over 11 million X-rays and growing at 1.5 million per week. Henry Schein One is now scaling toward 40,000 locations globally across four regions."
  "58edde1c73d3763deb02b62ff6617b0d":
    "id": "58edde1c73d3763deb02b62ff6617b0d"
    "title": "Build a semantic layer for agentic AI on AWS with Stardog and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-semantic-layer-for-agentic-ai-on-aws-with-stardog-and-amazon-bedrock-agentcore/"
    "published": "2026-07-11 00:31:12"
    "fetched": "2026-07-11 01:52:40"
    "summary": "In this post we show how to build a semantic layer on AWS using Stardog’s Semantic AI Application over Amazon Aurora and Amazon Redshift, and how to run a Strands Agents agent on Amazon Bedrock AgentCore that queries the layer to answer customer 360 questions across both sources without extract, transform, and load (ETL). The same Stardog deployment works behind AWS computes (Amazon Elastic Kubernetes Service (Amazon EKS), Amazon Elastic Container Service (Amazon ECS), and AWS Lambda). We use AgentCore here because it bundles inbound auth, hosting, and tool credentials into one managed service."
  "88cd5fcb1ab8f2f157375d939d964697":
    "id": "88cd5fcb1ab8f2f157375d939d964697"
    "title": "Scaling agentic workflows with native case management in Amazon Quick Automate"
    "link": "https://aws.amazon.com/blogs/machine-learning/scaling-agentic-workflows-with-native-case-management-in-amazon-quick-automate/"
    "published": "2026-07-11 00:28:54"
    "fetched": "2026-07-11 01:52:40"
    "summary": "In this post, we show you how to combine case management with agentic automation capabilities in Quick Automate. We introduce case management and explore the lifecycle of cases in an agentic workflow from case creation through processing to resolution. We cover how to create and manage single or multiple cases, automatically track and update status, handle exceptions, and incorporate Human-in-the-loop (HITL) steps within workflows. We also show the case creator-processor pattern that enables dynamic scaling. Finally, we walk through how to structure case management for enterprise processes, including HITL and case tracking, through a real-life use case."
  "bf8570a5cd6b32b99f0a44d2e01d85ee":
    "id": "bf8570a5cd6b32b99f0a44d2e01d85ee"
    "title": "Deploying quantized models on Amazon SageMaker AI with Unsloth"
    "link": "https://aws.amazon.com/blogs/machine-learning/deploying-quantized-models-on-amazon-sagemaker-ai-with-unsloth/"
    "published": "2026-07-11 00:26:05"
    "fetched": "2026-07-11 01:52:40"
    "summary": "In this post, you will learn four deployment patterns for taking models that have already been quantized with Unsloth and deploying them on AWS infrastructure. The patterns use Amazon Elastic Compute Cloud (Amazon EC2) for direct instance access, Amazon SageMaker AI inference endpoints for managed serving, and Amazon Elastic Kubernetes Service (Amazon EKS) or Amazon Elastic Container Service (Amazon ECS) when inference needs to fit into an existing container framework. You also learn operational practices for production deployments."
  "8bc7b432d8583af3cc0e1772f37c4b5f":
    "id": "8bc7b432d8583af3cc0e1772f37c4b5f"
    "title": "How KTern.AI built agentic AI for SAP on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-ktern-ai-built-agentic-ai-for-sap-on-amazon-bedrock-agentcore/"
    "published": "2026-07-11 00:23:25"
    "fetched": "2026-07-11 01:52:40"
    "summary": "Evolving from a traditional software as a service (SaaS) platform into a next-generation agentic AI platform meant orchestrating multiple specialized agents across long-running enterprise programs. Each agent operates with persistent context, secure tool access, and production-grade reliability. We built that system on Amazon Bedrock AgentCore using the Strands Agents SDK. This post walks through how we architected it, which agents we built, and the outcomes for our customers."
  "7b634b4a456fa41c200d069ffa4b67a0":
