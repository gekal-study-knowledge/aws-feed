    "title": "AWS DMS Schema Conversion now supports offline SQL Server conversion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-dms-schema-conversion-offline-source/"
    "published": "2026-07-11 00:09:00"
    "fetched": "2026-07-11 01:52:38"
    "summary": "<p><a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service (DMS) Schema Conversion</a>&nbsp;now supports offline source conversion for Microsoft SQL Server, enabling you to convert SQL Server schemas and code without direct connectivity to your source databases. You extract metadata using standard database commands in your own environment, then upload it to DMS Schema Conversion for processing. This eliminates security reviews, firewall changes, and VPN setup that delay migration projects, while delivering the same conversion results as the connected approach.</p> \n<p>Offline Source is ideal for organizations with security policies that restrict external tool access to production SQL Server databases. Database administrators generate human-readable metadata files within their existing environment, and security teams can review the commands and output before uploading, making approval straightforward. By removing the connectivity requirement, Offline Source transforms weeks of security reviews into a simple command-and-upload workflow.</p> \n<p>Offline Source supports all DMS Schema Conversion targets at no additional conversion charge. For regional availability, see the&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html#schema-conversion-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">Supported AWS Regions</a>&nbsp;page. To get started, see&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/virtual-data-provider.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using Offline Source</a>&nbsp;in the DMS Schema Conversion documentation.</p>"
  "097bf1e2d7fc24063d8933451fa9c145":
    "id": "097bf1e2d7fc24063d8933451fa9c145"
    "title": "Amazon Location Service enhances Places APIs with new address and search options"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-location-service-enhanced-address-search"
    "published": "2026-07-11 02:26:00"
    "fetched": "2026-07-11 03:20:04"
    "summary": "<p>Today, Amazon Location Service announced new enhancements to its Places APIs that give developers greater control over address name formatting, multilingual address, travel-optimized POI search, and drive-through data. These capabilities span the Geocode, ReverseGeocode, GetPlace, Suggest, Autocomplete, SearchNearby, and SearchText APIs. Amazon Location Service is a mapping service that offers geospatial data and location functionality such as maps, places search and geocoding, route planning, device tracking, and geofencing.<br /> <br /> Developers can now control how address component names are returned using the new AddressNamesMode parameter — choosing between matched (echoing input), normalized (canonical names), or administrative (government hierarchy names) — and override behavior per component with AddressNamesVariant. The new AddressTranslations parameter returns place name translations in 50+ languages, making it easier to build multilingual applications. A TravelMode parameter optimizes Suggest and SearchText results for users on the move, improving relevance for navigation and in-vehicle scenarios. Additionally, GetPlace, Suggest, SearchNearby, and SearchText now return a DriveThrough attribute indicating whether a place offers drive-through service — useful for logistics, food delivery, and navigation applications. The Geocode API also now supports a new Parsing.AdditionalInfo response field with additional detail about how the input address was interpreted.<br /> <br /> Amazon Location Service is available in the following AWS Regions: US East (Ohio), US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Spain), Europe (Stockholm), South America (São Paulo), and AWS GovCloud (US-West).<br /> <br /> To get started, see the <a href=\"https://docs.aws.amazon.com/location/latest/APIReference/API_Operations_Amazon_Location_Service_Places_V2.html\">Amazon Location Service Places API reference</a>, or learn more about <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/places.html\">Places</a> in the Amazon Location Service Developer Guide.</p>"
"last_updated": "2026-07-11 03:20:04 JST"
