    "title": "AWS DMS Schema Conversion now supports offline SQL Server conversion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-dms-schema-conversion-offline-source/"
    "published": "2026-07-11 00:09:00"
    "fetched": "2026-07-11 01:52:38"
    "summary": "<p><a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service (DMS) Schema Conversion</a>&nbsp;now supports offline source conversion for Microsoft SQL Server, enabling you to convert SQL Server schemas and code without direct connectivity to your source databases. You extract metadata using standard database commands in your own environment, then upload it to DMS Schema Conversion for processing. This eliminates security reviews, firewall changes, and VPN setup that delay migration projects, while delivering the same conversion results as the connected approach.</p> \n<p>Offline Source is ideal for organizations with security policies that restrict external tool access to production SQL Server databases. Database administrators generate human-readable metadata files within their existing environment, and security teams can review the commands and output before uploading, making approval straightforward. By removing the connectivity requirement, Offline Source transforms weeks of security reviews into a simple command-and-upload workflow.</p> \n<p>Offline Source supports all DMS Schema Conversion targets at no additional conversion charge. For regional availability, see the&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html#schema-conversion-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">Supported AWS Regions</a>&nbsp;page. To get started, see&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/virtual-data-provider.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using Offline Source</a>&nbsp;in the DMS Schema Conversion documentation.</p>"
"last_updated": "2026-07-11 01:52:38 JST"
