  "f0820fbc49da3183abd910c0827b769f":
    "id": "f0820fbc49da3183abd910c0827b769f"
    "title": "AWS DMS Schema Conversion now supports offline SQL Server conversion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-dms-schema-conversion-offline-source/"
    "published": "2026-07-11 00:09:00"
    "fetched": "2026-07-11 01:52:38"
    "summary": "<p><a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service (DMS) Schema Conversion</a>&nbsp;now supports offline source conversion for Microsoft SQL Server, enabling you to convert SQL Server schemas and code without direct connectivity to your source databases. You extract metadata using standard database commands in your own environment, then upload it to DMS Schema Conversion for processing. This eliminates security reviews, firewall changes, and VPN setup that delay migration projects, while delivering the same conversion results as the connected approach.</p> \n<p>Offline Source is ideal for organizations with security policies that restrict external tool access to production SQL Server databases. Database administrators generate human-readable metadata files within their existing environment, and security teams can review the commands and output before uploading, making approval straightforward. By removing the connectivity requirement, Offline Source transforms weeks of security reviews into a simple command-and-upload workflow.</p> \n<p>Offline Source supports all DMS Schema Conversion targets at no additional conversion charge. For regional availability, see the&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html#schema-conversion-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">Supported AWS Regions</a>&nbsp;page. To get started, see&nbsp;<a href=\"https://docs.aws.amazon.com/dms/latest/userguide/virtual-data-provider.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using Offline Source</a>&nbsp;in the DMS Schema Conversion documentation.</p>"
  "097bf1e2d7fc24063d8933451fa9c145":
    "id": "097bf1e2d7fc24063d8933451fa9c145"
    "title": "Amazon Location Service enhances Places APIs with new address and search options"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-location-service-enhanced-address-search"
    "published": "2026-07-11 02:26:00"
    "fetched": "2026-07-11 03:20:04"
    "summary": "<p>Today, Amazon Location Service announced new enhancements to its Places APIs that give developers greater control over address name formatting, multilingual address, travel-optimized POI search, and drive-through data. These capabilities span the Geocode, ReverseGeocode, GetPlace, Suggest, Autocomplete, SearchNearby, and SearchText APIs. Amazon Location Service is a mapping service that offers geospatial data and location functionality such as maps, places search and geocoding, route planning, device tracking, and geofencing.<br /> <br /> Developers can now control how address component names are returned using the new AddressNamesMode parameter — choosing between matched (echoing input), normalized (canonical names), or administrative (government hierarchy names) — and override behavior per component with AddressNamesVariant. The new AddressTranslations parameter returns place name translations in 50+ languages, making it easier to build multilingual applications. A TravelMode parameter optimizes Suggest and SearchText results for users on the move, improving relevance for navigation and in-vehicle scenarios. Additionally, GetPlace, Suggest, SearchNearby, and SearchText now return a DriveThrough attribute indicating whether a place offers drive-through service — useful for logistics, food delivery, and navigation applications. The Geocode API also now supports a new Parsing.AdditionalInfo response field with additional detail about how the input address was interpreted.<br /> <br /> Amazon Location Service is available in the following AWS Regions: US East (Ohio), US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Spain), Europe (Stockholm), South America (São Paulo), and AWS GovCloud (US-West).<br /> <br /> To get started, see the <a href=\"https://docs.aws.amazon.com/location/latest/APIReference/API_Operations_Amazon_Location_Service_Places_V2.html\">Amazon Location Service Places API reference</a>, or learn more about <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/places.html\">Places</a> in the Amazon Location Service Developer Guide.</p>"
  "1ab875c0b13b24fa2f93d04998f40824":
    "id": "1ab875c0b13b24fa2f93d04998f40824"
    "title": "Amazon EMR on EKS now supports Apache Spark troubleshooting agent"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-emr-eks-spark-troubleshooting/"
    "published": "2026-07-11 03:16:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>Amazon EMR on EKS now supports the Apache Spark troubleshooting agent. Data engineers can now diagnose EMR on EKS job failures through natural language, receiving automated root cause analysis and PySpark code recommendations without manually navigating distributed logs and Spark History Server data.<br /> <br /> The agent analyzes Spark History Server data, distributed executor logs, and cluster configurations to identify issues such as memory errors, data skew, resource contention, and connectivity failures. With this launch, the Spark troubleshooting agent now covers all EMR deployment options: EMR on EC2, EMR Serverless, and EMR on EKS. The agent is accessible directly from the EMR on EKS console through a \"Troubleshoot with AI\" option on failed jobs. Additionally, the agent is available through MCP (Model Context Protocol) using any compatible AI coding agent, including Kiro, Claude Code, and Cursor. All operations are read-only, authenticated with IAM roles, and logged in AWS CloudTrail.<br /> <br /> The Spark troubleshooting agent for Amazon EMR on EKS is available in all AWS Regions where the SageMaker Unified Studio is <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-troubleshooting-features.html#available-regions\">available</a>. To get started, go to EMR on EKS console, or set up the MCP server in your preferred AI coding agent. For detailed guidance, see the <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-troubleshoot.html\">EMR troubleshooting agent documentation</a>.</p>"
  "b1629e77f527213ccdcef986f21ffc97":
    "id": "b1629e77f527213ccdcef986f21ffc97"
    "title": "Amazon EC2 G7 instances are now available in the AWS US East (N. Virginia) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-g7-available-North-Virginia"
    "published": "2026-07-11 00:14:00"
    "fetched": "2026-07-11 05:19:07"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) G7 instances powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs are now available in US East (N. Virginia) Region.&nbsp;G7 instances deliver up to 4.6x AI inference performance and up to 2.1 graphics performance compared to G6 instances. G7 instances also deliver faster performance for GPU-accelerated data analytics workloads.</p> \n<p>Customers can use G7 instances for deploying AI models for language translation, video and image analysis, and speech recognition. They also accelerate graphics workloads such as creating and rendering real-time, cinematic-quality graphics and game streaming. Additionally, G7 instances support video transcoding, spatial computing, and data analytics workloads such as recommender systems,&nbsp;Retrieval Augmented Generation (RAG) inference, and real-time data pipelines. G7 instances feature up to 8 NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs with 32 GB of memory per GPU and custom Intel Xeon 6 processors. They support up to 192 virtual CPUs (vCPUs) and up to 700 Gbps of Elastic Fabric Adapter networking bandwidth. They also support up to 768 GiB of system memory, and up to 7.6 TB of local NVMe SSD storage.</p> \n<p>You can start using Amazon EC2 G7 instances today in three AWS Regions: US East (N. Virginia and Ohio), and US West (Oregon). You can purchase G7 instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p> \n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface</a> (CLI), and AWS SDKs. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\">G7 instance page</a>.</p>"
  "909d2ead519812b5e149adb122610e4f":
    "id": "909d2ead519812b5e149adb122610e4f"
    "title": "Amazon EC2 network/EBS instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-r8in-r8ib-r8idn-r8idb"
    "published": "2026-07-11 05:00:00"
    "fetched": "2026-07-11 06:57:46"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8in, R8ib, R8idn, and R8idb instances are available in the AWS Asia Pacific (Tokyo) and Europe (Frankfurt, Ireland) regions.&nbsp;These instances are powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS and feature the latest sixth generation AWS Nitro cards. These instances deliver up to 43% better compute performance per vCPU compared to previous generation R6in and R6idn instances.</p> \n<p>R8in, R8idn instances deliver 600 Gbps network bandwidth, the highest network bandwidth among enhanced networking EC2 instances. R8in instances are ideal for workloads such as real-time big data analytics, distributed web scale in-memory caches, caching fleets for AI/ML clusters, and Telco applications such as 5G User Plane Function (UPF). R8idn instances are ideal for network-intensive general purpose workloads requiring local storage, such as distributed compute, data analytics, and high-performance file systems.<br /> <br /> R8ib, R8idb instances deliver up to 300Gbps EBS bandwidth, the highest among non-accelerated compute EC2 instances. R8ib instances are best suited for workloads that benefit from high block storage performance, such as high-performance file systems and NoSQL databases. R8idb instances are ideal for storage-intensive general purpose workloads such as large commercial databases, data lakes, and NoSQL databases that benefit from both high EBS throughput and low-latency local NVMe storage.<br /> <br /> R8in, R8ib, R8idn, and R8idb instances support Elastic Fabric Adapter (EFA) networking on 48xlarge, 96xlarge, metal-48xl, and metal-96xl sizes. EFA networking enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.</p> \n<p>Amazon EC2 R8in an R8ib instances are available in US East (N. Virginia, Ohio), US West (Oregon),&nbsp;Asia Pacific (Tokyo), and Europe (Spain, Frankfurt, Ireland) regions, via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i/\">Amazon EC2 R8i instance</a> page.</p>"
  "8b36fb43b30370729cdaebea461b5655":
    "id": "8b36fb43b30370729cdaebea461b5655"
    "title": "Amazon SageMaker HyperPod now supports AMI-based node lifecycle configuration for Slurm clusters using continuous provisioning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2025/06/ami-configuration-continuous-slurm/"
    "published": "2026-07-11 02:00:00"
    "fetched": "2026-07-11 11:13:44"
    "summary": "<p>Amazon SageMaker HyperPod now supports AMI-based configuration for Slurm clusters that use continuous provisioning. Continuous provisioning adds nodes to the cluster as capacity becomes available, and this launch extends AMI-based configuration to clusters using this mode. With this support, clusters using continuous provisioning can be created without downloading, configuring, or uploading lifecycle configuration scripts to Amazon S3.<br /> <br /> AMI-based configuration provisions nodes with the software and configurations needed for a production-ready environment to run AI/ML training workloads, including required software such as Docker, Enroot, and Pyxis, and configurations such as Slurm accounting, SSH key generation, and log rotation. When using continuous provisioning, each node is configured from the AMI as it is added to the cluster, without the need to manage lifecycle configuration scripts, so nodes become available to schedule jobs sooner. To enable AMI-based configuration, omit the LifeCycleConfig block from the instance group configuration when creating clusters via the API, or select \"None\" under Lifecycle scripts in Custom setup when using the SageMaker AI console. For additional customization on top of the AMI-based configuration baseline, an extension script can be provided by specifying the OnInitComplete parameter and SourceS3Uri in the LifeCycleConfig block via the API, or by providing the S3 URI in the \"Extension script file in S3\" field in Custom setup when using the console. Custom lifecycle configuration scripts remain fully supported for use cases that require full control over provisioning.<br /> <br /> AMI-based node lifecycle configuration for Slurm clusters using continuous provisioning is available in all AWS Regions where SageMaker HyperPod is available. To get started, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/smcluster-getting-started-slurm-cli.html\" target=\"_blank\">Getting started with SageMaker HyperPod using the AWS CLI</a> or <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/smcluster-getting-started-slurm-console.html\" target=\"_blank\">Getting started with SageMaker HyperPod using the SageMaker AI console</a> in the SageMaker user guide.</p>"
