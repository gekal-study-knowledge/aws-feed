    "summary": "半導体設計のクラウド活用を徹底解説するイベント「EDA on the Cloud – Tokyo」を8月4日（火）に麻布台ヒルズで開催します。 AWSによる最新のEDAソリューションに加え、ソニーセミコンダクタソリューションズ様の事例講演、NetApp・AMD・Intel・Cadence・Siemens EDA・Anthropic・ChipAgentsら各社によるAI×EDAの最先端セッションをお届けします。 参加費は無料です。詳細・お申し込みはブログをご覧ください。"
