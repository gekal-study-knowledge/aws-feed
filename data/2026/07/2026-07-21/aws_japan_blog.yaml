    "title": "週刊生成AI with AWS – 2026/7/13 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260713/"
    "published": "2026-07-21 14:18:21"
    "fetched": "2026-07-21 14:46:14"
    "summary": "今週の「週刊生成AI with AWS」は、3 万人が利用する生成 AI 基盤を AIエージェント活用基盤へ進化させた村田製作所様の事例をはじめ、音声 AI や Well-Architected レビューでのAI活用、LLMコスト最適化など幅広い話題をお届けします。公開から 1 周年を迎えた Kiro については、この 1 年の振り返りや GPT-5.6 対応などの記事に加え、AWS Summit Japan 2026 各ブースの開催報告もまとめてご紹介。サービスアップデートでは、OpenAI GPT-5.6 の Amazon Bedrock での一般提供開始や、Amazon GuardDuty AI Protection・AWS Security Hub の AI インベントリなど、AI ワークロードのセキュリティ強化に関する発表が並びます。"
