    "summary": "Amazon SageMaker HyperPod が Slurm クラスターでカスタム AMI をサポート、Voxtral-Mini-4B-Realtime をリアルタイム音声文字起こし向けに Amazon SageMaker JumpStart で提供開始、OpenAI GPT-5.6 Sol, Terra, Luna が Amazon Bedrock で一般提供開始、AWS Security Hub が組織全体の AI アセットを可視化する AI インベントリの提供を開始、AWS Lambda が self-managed code storage に対応など"
