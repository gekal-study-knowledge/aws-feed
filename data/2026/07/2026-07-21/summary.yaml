"overview": |
  この日はセキュリティ運用の自動化が目玉でした。Amazon GuardDuty investigation agent がパブリックプレビューで登場し、AWS 環境全体のセキュリティ検出結果を AI が調査して調査時間を短縮します。あわせて 2026 年の ISO および CSA STAR 認証が 2 サービスを追加して取得されました。分析・BI では Tradeshift がレガシー BI を Amazon Quick のエージェント機能で置き換えクエリ応答を最大 30 倍高速化した事例、NVIDIA NeMo Agent Toolkit と組み合わせたサプライチェーンリスクのエージェントワークフロー構築が紹介されています。Couchbase が Capella iQ にマルチモデル AI アーキテクチャを採用した事例も公開されました。サービス更新は Managed Service for Apache Flink の Flink 2.3 対応、CloudTrail のネットワークアクティビティイベントを ID 単位で選択的に記録する機能、RDS for SQL Server の SQL Server 2025 対応、Managed Service for Prometheus の 15 億アクティブメトリクス対応などです。
