    "title": "How Couchbase built a multi-model AI architecture for Capella iQ with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-couchbase-built-a-multi-model-ai-architecture-for-capella-iq-with-amazon-bedrock/"
    "published": "2026-07-21 01:58:52"
    "fetched": "2026-07-21 02:56:59"
    "summary": "This post describes how Couchbase adopted Amazon Bedrock to power Capella iQ with Anthropic’s Claude family of models, the architectural decisions behind their multi-model approach, and the operational benefits realized in production."
  "5c5d5af411ccd094cdbc97ed5eef9357":
    "id": "5c5d5af411ccd094cdbc97ed5eef9357"
    "title": "Evolving from legacy BI to agentic AI at Tradeshift with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/evolving-from-legacy-bi-to-agentic-ai-at-tradeshift-with-amazon-quick/"
    "published": "2026-07-21 01:56:48"
    "fetched": "2026-07-21 02:56:59"
    "summary": "In this post, we describe how Tradeshift deployed Amazon Quick with agentic AI capabilities to replace our legacy BI tool, resulting in query response times up to 30 times faster, a 40 percent reduction in total cost of ownership, and turned embedded analytics into a product that generates revenue."
