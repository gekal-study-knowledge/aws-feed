  "a118145bbf1fc5edfeaae9cfe7f3ef20":
    "id": "a118145bbf1fc5edfeaae9cfe7f3ef20"
    "title": "Selectively log network activity events by identity in AWS CloudTrail"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-cloudtrail-filter-useridentity-advance-selectors/"
    "published": "2026-07-21 02:34:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Today, AWS launches enhanced event filtering for network activity events for VPC end points, a CloudTrail event type that captures actions transmitted through a&nbsp;<a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html\">Virtual Private Cloud Endpoint</a>.&nbsp;Customers can now control which network activity events are logged based on the IAM user identity making the API call. For example, you can configure selectors to log only access denied events when the calling user identity is not on a known safe list. This lets you capture unauthorized access attempts while excluding routine traffic from trusted identities, reducing both logging costs and noise.</p> \n<p>With UserIdentity filtering, customers building a data perimeter strategy can focus on network activity event logging for scenarios that matter most in security. You can configure selectors to log only VpceAccessDenied events from identities outside a trusted set of IAM roles. This enables detection of potential data exfiltration attempts through VPC endpoints without the cost of logging every successful API call from approved principals. You can combine UserIdentity conditions with existing fields like eventName or vpcEndpointId for fine-grained control over what gets recorded.</p> \n<p>You can use this feature via the AWS Management Console, AWS Command Line Interface, and AWS SDKs. This feature is available in all AWS Regions where CloudTrail network activity events are supported. To learn more about Network Activity events, visit the <a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html\">AWS CloudTrail user guide</a> or read <a href=\"https://aws.amazon.com/blogs/mt/announcing-aws-cloudtrail-network-activity-events-for-vpc-endpoints/\">AWS Blog on how to enable Network Activity Events</a>.</p> \n<p>&nbsp;</p> \n<p><br /> <br /> <br /> </p>"
  "ed7172cce3a352fe991a0c442246bc7d":
    "id": "ed7172cce3a352fe991a0c442246bc7d"
    "title": "Amazon Connect delivers more natural agentic voice experiences with expanded language support and speech controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-connect-agentic-voice/"
    "published": "2026-07-21 01:16:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Amazon Connect customers can now deliver more natural, human-sounding agentic voice experiences with expanded support across 50+ languages including Spanish, French, Italian, Japanese, Korean, Portuguese, and Thai, over 100 new voice options, and conversational improvements that make AI interactions sound more fluid and responsive.</p> \n<p>Amazon Connect's agentic self-service capabilities enable AI agents to understand, reason, and take action across voice and digital channels, adapting responses to match customer tone and sentiment while maintaining natural conversational pace. With this launch, you can deliver smoother conversations with seamless response pacing that fills natural pauses so interactions feel immediate rather than halting, more accurate turn-taking so agents and customers don't talk over each other, and speech controls that let you adjust speed, volume, and emotion to match your brand's tone.</p> \n<p>To learn more about this feature, see the Amazon Connect Customer <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agentic-voice.html\">Administrator Guide</a>. For the full list of supported languages and voices, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/supported-languages.html\">Supported Languages</a>. For region availability, please see the availability of <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#gv_region\">Amazon Connect Customer features by Region</a>. To learn more about Amazon Connect Customer, an agentic AI solution that helps enterprises deliver exceptional customer experiences visit the Amazon Connect Customer <a href=\"https://aws.amazon.com/connect/\">website</a>.</p>"
  "8da3245a6be9396fb04aecef83c5b6f4":
    "id": "8da3245a6be9396fb04aecef83c5b6f4"
    "title": "Amazon Managed Service for Apache Flink now supports Apache Flink 2.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-service-flink-2-3/"
    "published": "2026-07-21 00:00:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Amazon Managed Service for Apache Flink now supports Apache Flink version 2.3. This release includes adaptive partition selection for improved backpressure handling, so applications run more smoothly under uneven load. It also introduces better handling of out-of-order updates in change data capture (CDC) pipelines that improves data correctness, and new SQL functions make it easier to convert between changelog and standard streams. For a full list of improvements, see the Amazon Managed Service for Apache Flink <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/flink-2-3.html\">release notes</a>.<br /> <br /> Amazon Managed Service for Apache Flink makes it easier to transform and analyze streaming data in real time, by simplifying the setup, operation, and scaling of Apache Flink applications. Developers and data engineers can focus on building and running their streaming applications without managing the underlying infrastructure.<br /> <br /> To get started, <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/how-creating-apps.html\">create a new application</a> on Apache Flink 2.3, or use <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/how-in-place-version-upgrades.html\">in-place version upgrades </a>to move compatible applications to the Flink 2.3 runtime for a simpler and faster upgrade. Apache Flink 2.3 is available across all AWS Regions where Amazon Managed Service for Apache Flink is offered. To learn more, see the Amazon Managed Service for Apache Flink <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html\">Developer Guide</a>.</p>"
  "e088ae8c9bdf1e0529f486d3791a3b84":
    "id": "e088ae8c9bdf1e0529f486d3791a3b84"
    "title": "Amazon EC2 R8i and R8i-flex instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-r8i-r8i-flex-instances-in-stockholm-zurich-regions/"
    "published": "2026-07-21 02:37:00"
    "fetched": "2026-07-21 06:07:47"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and R8i-flex instances are available in the Europe (Stockholm, Zurich) regions. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.<br /> <br /> R8i-flex, our first memory-optimized Flex instances, are the easiest way to get price performance benefits for a majority of memory-intensive workloads. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.<br /> <br /> R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications. <a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" target=\"_blank\">R8i instances are SAP-certified </a>and deliver 142,100 aSAPS, delivering exceptional performance for mission-critical SAP workloads.<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. For more information about the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" target=\"_blank\">R8i and R8i-flex </a>instances visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" target=\"_blank\">blog</a>.</p>"
  "829f586d6186b8893e4730e362574af7":
    "id": "829f586d6186b8893e4730e362574af7"
    "title": "Amazon EC2 I8ge instances are now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-ec2-i8ge-instances-aws-govcloud-us-regions/"
    "published": "2026-07-21 01:00:00"
    "fetched": "2026-07-21 06:07:47"
    "summary": "<p>Amazon Web Services (AWS) announces the availability of Amazon EC2 I8ge instances in AWS GovCloud (US-East, US-West) regions. I8ge instances are powered by AWS Graviton4 processors and deliver up to 60% better compute performance compared to previous generation Graviton2-based storage optimized Amazon EC2 instances. I8ge instances use the third generation AWS Nitro SSDs, local NVMe storage, and deliver up to 55% better real-time storage performance per TB compared to previous generation Amazon EC2 Im4gn instances. They offer up to 60% lower storage I/O latency and up to 75% lower storage I/O latency variability compared to Im4gn instances.</p> \n<p>I8ge instances are storage-optimized instances, and offer up to 120TB of local NVMe storage. They are ideal for workloads that demand rapid local storage with high random read/write performance and consistently low latency for accessing large datasets. These versatile instances are offered in eleven different sizes including two metal sizes, providing flexibility to match customers' computational needs. They deliver up to 180 Gbps of network performance bandwidth and 60 Gbps of dedicated bandwidth for Amazon Elastic Block Store (EBS), ensuring fast and efficient data transfer for the most demanding applications.</p> \n<p>To begin your Graviton journey, visit the <a>Level up your compute with AWS Graviton page</a>. To get started, see <a>AWS Management Console</a>, <a>AWS Command Line Interface (AWS CLI)</a>, and <a>AWS SDKs</a>. To learn more, visit the <a>I8ge instances page</a>.&nbsp;</p>"
  "8e6140e9663aa0b285252c476b44ebcf":
    "id": "8e6140e9663aa0b285252c476b44ebcf"
    "title": "Amazon WorkSpaces Applications now supports Microsoft OneDrive and Google Drive on Multi-Session fleets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/storage-multi-session-fleets/"
    "published": "2026-07-21 00:00:00"
    "fetched": "2026-07-21 06:07:47"
    "summary": "<p>Amazon WorkSpaces Applications now supports Microsoft OneDrive for Business and Google Drive as persistent storage options on multi-session fleets. Users streaming on multi-session fleets can now connect their OneDrive or Google Drive accounts and access, save, and sync their cloud-based files directly within their streaming sessions, in addition to the existing home folder backed by Amazon S3.<br /> <br /> Multi-session fleets allow multiple users to share a single fleet instance, enabling organizations to achieve cost efficiencies by increasing session density across their infrastructure. With the addition of OneDrive and Google Drive support, customers can now take full advantage of the cost savings offered by multi-session fleets while providing their users with familiar, enterprise-grade cloud storage experiences. Users can browse, upload, and download files from their connected storage accounts without disruption, enabling seamless collaboration and continuity across streaming sessions.<br /> <br /> Microsoft OneDrive for Business and Google Drive support on multi-session fleets is available in all AWS Regions where Amazon WorkSpaces Applications is offered. Standard usage <a href=\"https://aws.amazon.com/workspaces/applications/pricing/\">pricing</a> applies for WorkSpaces Applications streaming sessions; there is no additional charge for enabling OneDrive or Google Drive storage connectors.<br /> <br /> To enable this feature for your users, you must use an WorkSpaces Applications image that uses <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/base-images-agent.html\">WorkSpaces Applications agent</a> released on or after June 29, 2026 or your image is using <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/keep-image-updated-managed-image-updates.html\">Managed WorkSpaces Applications image updates</a>&nbsp;released on or after June 29, 2026. To learn more about WorkSpaces Applications refer <a href=\"https://aws.amazon.com/workspaces/applications/faqs/\">FAQs</a></p>"
  "efde394fa423f12242a7f97ec0061de2":
    "id": "efde394fa423f12242a7f97ec0061de2"
    "title": "AWS Data Exports now provides standardized Amazon Bedrock product metadata"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-data-exports-amazon-bedrock-product-metadata/"
    "published": "2026-07-21 03:29:00"
    "fetched": "2026-07-21 07:55:54"
    "summary": "<p>Today, AWS announces standardized product metadata for Amazon Bedrock in AWS Data Exports (Cost and Usage Report), giving FinOps teams and cloud administrators consistent, structured attributes to understand &nbsp;Bedrock costs. AWS Data Exports lets you create customized exports of your AWS cost and usage data and deliver them to Amazon S3 for querying with Amazon Athena or loading into your data warehouse. With these attributes, you can attribute Bedrock spend without building custom logic to parse various product metadata in CUR 2.0.</p> \n<p>The standardized attributes include model provider, model name, pricing unit, inference type (such as input tokens or output tokens), and feature (the inference serving mode, such as On-Demand or Batch), along with a unified \"Amazon Bedrock\" product family name that consolidates all Bedrock costs. In CUR 2.0, the model provider, model name, inference type, and feature attributes are available in the product map column, and pricing unit is available as a column. The standardized fields are available by default, at no additional cost, to Amazon Bedrock customers using AWS Data Exports.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/bedrock/\">Amazon Bedrock</a> product page, and see <a href=\"https://docs.aws.amazon.com/cur/latest/userguide/table-dictionary-cur2-product.html\">Product columns</a> in the AWS Data Exports User Guide for the standardized product attributes.</p>"
"last_updated": "2026-07-21 07:55:54 JST"
