    "title": "Selectively log network activity events by identity in AWS CloudTrail"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-cloudtrail-filter-useridentity-advance-selectors/"
    "published": "2026-07-21 02:34:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Today, AWS launches enhanced event filtering for network activity events for VPC end points, a CloudTrail event type that captures actions transmitted through a&nbsp;<a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html\">Virtual Private Cloud Endpoint</a>.&nbsp;Customers can now control which network activity events are logged based on the IAM user identity making the API call. For example, you can configure selectors to log only access denied events when the calling user identity is not on a known safe list. This lets you capture unauthorized access attempts while excluding routine traffic from trusted identities, reducing both logging costs and noise.</p> \n<p>With UserIdentity filtering, customers building a data perimeter strategy can focus on network activity event logging for scenarios that matter most in security. You can configure selectors to log only VpceAccessDenied events from identities outside a trusted set of IAM roles. This enables detection of potential data exfiltration attempts through VPC endpoints without the cost of logging every successful API call from approved principals. You can combine UserIdentity conditions with existing fields like eventName or vpcEndpointId for fine-grained control over what gets recorded.</p> \n<p>You can use this feature via the AWS Management Console, AWS Command Line Interface, and AWS SDKs. This feature is available in all AWS Regions where CloudTrail network activity events are supported. To learn more about Network Activity events, visit the <a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html\">AWS CloudTrail user guide</a> or read <a href=\"https://aws.amazon.com/blogs/mt/announcing-aws-cloudtrail-network-activity-events-for-vpc-endpoints/\">AWS Blog on how to enable Network Activity Events</a>.</p> \n<p>&nbsp;</p> \n<p><br /> <br /> <br /> </p>"
  "ed7172cce3a352fe991a0c442246bc7d":
    "id": "ed7172cce3a352fe991a0c442246bc7d"
    "title": "Amazon Connect delivers more natural agentic voice experiences with expanded language support and speech controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-connect-agentic-voice/"
    "published": "2026-07-21 01:16:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Amazon Connect customers can now deliver more natural, human-sounding agentic voice experiences with expanded support across 50+ languages including Spanish, French, Italian, Japanese, Korean, Portuguese, and Thai, over 100 new voice options, and conversational improvements that make AI interactions sound more fluid and responsive.</p> \n<p>Amazon Connect's agentic self-service capabilities enable AI agents to understand, reason, and take action across voice and digital channels, adapting responses to match customer tone and sentiment while maintaining natural conversational pace. With this launch, you can deliver smoother conversations with seamless response pacing that fills natural pauses so interactions feel immediate rather than halting, more accurate turn-taking so agents and customers don't talk over each other, and speech controls that let you adjust speed, volume, and emotion to match your brand's tone.</p> \n<p>To learn more about this feature, see the Amazon Connect Customer <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agentic-voice.html\">Administrator Guide</a>. For the full list of supported languages and voices, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/supported-languages.html\">Supported Languages</a>. For region availability, please see the availability of <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#gv_region\">Amazon Connect Customer features by Region</a>. To learn more about Amazon Connect Customer, an agentic AI solution that helps enterprises deliver exceptional customer experiences visit the Amazon Connect Customer <a href=\"https://aws.amazon.com/connect/\">website</a>.</p>"
  "8da3245a6be9396fb04aecef83c5b6f4":
    "id": "8da3245a6be9396fb04aecef83c5b6f4"
    "title": "Amazon Managed Service for Apache Flink now supports Apache Flink 2.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-managed-service-flink-2-3/"
    "published": "2026-07-21 00:00:00"
    "fetched": "2026-07-21 04:43:54"
    "summary": "<p>Amazon Managed Service for Apache Flink now supports Apache Flink version 2.3. This release includes adaptive partition selection for improved backpressure handling, so applications run more smoothly under uneven load. It also introduces better handling of out-of-order updates in change data capture (CDC) pipelines that improves data correctness, and new SQL functions make it easier to convert between changelog and standard streams. For a full list of improvements, see the Amazon Managed Service for Apache Flink <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/flink-2-3.html\">release notes</a>.<br /> <br /> Amazon Managed Service for Apache Flink makes it easier to transform and analyze streaming data in real time, by simplifying the setup, operation, and scaling of Apache Flink applications. Developers and data engineers can focus on building and running their streaming applications without managing the underlying infrastructure.<br /> <br /> To get started, <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/how-creating-apps.html\">create a new application</a> on Apache Flink 2.3, or use <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/how-in-place-version-upgrades.html\">in-place version upgrades </a>to move compatible applications to the Flink 2.3 runtime for a simpler and faster upgrade. Apache Flink 2.3 is available across all AWS Regions where Amazon Managed Service for Apache Flink is offered. To learn more, see the Amazon Managed Service for Apache Flink <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html\">Developer Guide</a>.</p>"
"last_updated": "2026-07-21 04:43:54 JST"
