    "title": "CVE-2026-12283 - Issue with Athena Federated Query Synapse Connector"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-059-aws/"
    "published": "2026-07-18 04:09:51"
    "fetched": "2026-07-18 05:02:26"
    "summary": "<p><b>Bulletin ID:</b> 2026-059-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 07/17/2026 12:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon Athena is a serverless, interactive query service that lets you analyze data directly in Amazon S3 using standard SQL. Athena Query Federation is a feature that allows you to connect to data sources outside of Amazon S3 like DynamoDB, Azure Synapse, and custom connectors using standard SQL syntax. These connectors are open source and deployed to the Athena service on a regular basis. We identified CVE-2026-12283. A user with access to an Azure Synapse account can create a table with a specially crafted name that, when queried through the Athena Synapse connector, could result in unintended data being returned.</p> \n<p><b>Impacted versions:</b><br /> - versions &gt;= v2022.20.1 (released on 5/19/2022) AND<br /> - versions &lt;= v2026.19.1 (released on 5/28/2026)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "7672d796d9022fe772be783160505210":
    "id": "7672d796d9022fe772be783160505210"
    "title": "CVE-2026-15415 - Path traversal and arbitrary file write in the workflow linters of aws-healthomics-mcp-server"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-060-aws/"
    "published": "2026-07-18 04:44:21"
    "fetched": "2026-07-18 05:02:26"
    "summary": "<p><b>Bulletin ID:</b> 2026-060-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention) / Informational<br /> <b>Publication Date:</b> 07/17/2026 12:45 PM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS HealthOmics is a HIPAA-eligible service that fully manages the compute, storage, and workflow engine infrastructure required to run bioinformatics analyses at scale for clinical diagnostics, drug discovery, and agricultural research. We identified CVE-2026-15415, where improper limitation of a pathname to a restricted directory in the linting tools of the AWS HealthOmics MCP Server (aws-healthomics-mcp-server) before version 0.0.36 might allow an actor who can influence the MCP agent to write an actor-controlled content to arbitrary locations outside the intended workflow bundle directory, via directory traversal sequences in the workflow_files input.</p> \n<p><b>Impacted versions:</b> aws-healthomics-mcp-server &lt;= 0.0.35</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
