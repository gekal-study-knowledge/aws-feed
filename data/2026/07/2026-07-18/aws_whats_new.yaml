    "title": "Amazon OpenSearch UI now supports one-click dashboard migration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-opensearch-ui-one-click-dashboard-migration"
    "published": "2026-07-18 02:23:00"
    "fetched": "2026-07-18 05:02:25"
    "summary": "<p>Amazon OpenSearch Service now supports one-click migration from legacy OpenSearch Dashboards to OpenSearch UI, for both OpenSearch domains and serverless collections. OpenSearch UI is the new, zero-downtime, serverless interface for search and unified observability across multiple data sources. With this launch, the multiple tenants and thousands of saved objects you created in legacy OpenSearch Dashboards become reusable in your OpenSearch UI applications, reducing the operational complexity of moving between interfaces.</p> \n<p>With one-click migration, you can move your existing tenants and saved objects into OpenSearch UI workspaces without recreating them manually. The mechanism works for OpenSearch Dashboards created under Amazon OpenSearch Service domains and serverless collections. You can migrate everything into a new workspace or into an existing one. If you have created multiple tenants in your OpenSearch Dashboard, you have the option to either convert them into a single workspace or keep them separate for different teams. &nbsp;</p> \n<p>This feature is available in all AWS Regions where OpenSearch UI is available. To get started, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-ui.html\">Using OpenSearch UI</a> in the Amazon OpenSearch Service Developer Guide. Visit the <a href=\"https://help.os.aws.dev/getting-started/in-app-migration/\">OpenSearch UI Help</a> page for detailed feature tutorials. To learn more about the service, see the <a href=\"https://aws.amazon.com/opensearch-service/\">Amazon OpenSearch Service product page</a>.</p>"
  "f1cab17e87f7f8c193e64784ec2d5580":
    "id": "f1cab17e87f7f8c193e64784ec2d5580"
    "title": "Amazon GameLift Streams now supports IAM role credentials for stream sessions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-gamelift-streams-iam/"
    "published": "2026-07-18 02:29:00"
    "fetched": "2026-07-18 08:48:38"
    "summary": "<p>Amazon GameLift Streams now supports assigning an IAM role to a stream session, enabling your application to securely access resources in your AWS account, such as Amazon S3 buckets and DynamoDB tables. With this launch, you can pass a RoleArn parameter when starting a stream session, and your application automatically receives short-lived, auto-refreshing AWS credentials through the standard AWS SDK credential resolution chain — no application code changes required.</p> \n<p>Previously, customers who needed their streamed applications to access AWS services had to embed long-lived access keys in application bundles or pass them as environment variables, creating security and operational challenges. Now, Amazon GameLift Streams handles credential vending and automatic refresh using the same container credential provider mechanism trusted by Amazon ECS task roles and Amazon EKS Pod Identity. Role misconfigurations are validated at session start, surfacing clear errors immediately rather than during runtime.</p> \n<p>You can also configure IAM roles directly in the Amazon GameLift Streams console, which provides a pre-filled trust policy template to simplify role setup.</p> \n<p>IAM role support for stream sessions is available in all AWS Regions where Amazon GameLift Streams is available.</p> \n<p>To learn more, see Session Credentials Setup in the Amazon GameLift Streams Developer Guide:&nbsp;<a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/session-credentials-setup.html\">https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/session-credentials-setup.html</a>&nbsp;</p>"
"last_updated": "2026-07-18 08:48:38 JST"
