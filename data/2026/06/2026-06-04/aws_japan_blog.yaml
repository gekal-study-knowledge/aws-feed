    "title": "【開催報告】ランサムウェアに備える「防御」と「復旧」— AWS で実現するセキュリティ対策セミナーを開催しました！（2026 年 5 月 21 日）"
    "link": "https://aws.amazon.com/jp/blogs/news/ransomware-security-seminar-may-2026/"
    "published": "2026-06-04 15:42:59"
    "fetched": "2026-06-04 17:16:53"
    "summary": "2026年5月21日、「ランサムウェアに備える『防御』と『復旧』— AWS で実現するセキュリティ対策」セミナーを開催しました。AWS サービスによる防御・検知・復旧の具体策と、パートナー3社によるエンドポイント・ネットワーク・運用支援をご紹介。各セッションの概要をレポートします。"
