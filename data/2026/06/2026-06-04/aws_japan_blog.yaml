    "summary": "日本の製造業のお客様に向けて、AWS の最新情報を毎月お届けするブログシリーズです。今号では、6月開催の AWS Summit Japan　2026 の製造業向け展示の見どころを中心に、Hannover Messe 2026 のブースレポート、トヨタ・Volkswagen 等のグローバル事例など5月の製造業×クラウド関連トピックを幅広くまとめています。"
