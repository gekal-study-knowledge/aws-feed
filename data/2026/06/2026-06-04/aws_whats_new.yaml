  "c5c86b7cd841a4f45fe4f95804e8a4ad":
    "id": "c5c86b7cd841a4f45fe4f95804e8a4ad"
    "title": "Amazon Keyspaces (for Apache Cassandra) now provides CDC iterator position"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/keyspaces-cdc-iterator-position/"
    "published": "2026-06-04 01:00:00"
    "fetched": "2026-06-04 01:40:49"
    "summary": "<p>Amazon Keyspaces (for Apache Cassandra) now returns an iterator position in the GetRecords response for change data capture (CDC) streams, indicating whether a consumer has reached the tip of the stream or whether additional records may be available. Amazon Keyspaces is a scalable, serverless, and managed Apache Cassandra-compatible database service that lets customers run Cassandra workloads on AWS without managing infrastructure. CDC streams capture row-level changes to Keyspaces tables so customers can integrate with downstream analytics, replication, and event-driven applications.</p> \n<p>Previously, customers polled CDC streams at a fixed cadence regardless of whether new records were available, leading to inefficient resource usage and unnecessary CDC consumption costs. With iterator position, customers can now adapt polling frequency based on whether the iterator is at the tip of the stream or has records pending, lowering CDC consumption costs while maintaining timely data processing. The GetRecords response now includes an iteratorDescription structure with an iteratorPosition field that returns either AT_TIP or BEHIND_TIP, enabling customers to optimize their data integration pipelines and event-driven architectures.</p> \n<p>This feature is available in all AWS Regions where Amazon Keyspaces CDC is supported. To use it, customers need to update to the latest AWS SDK. To learn more, visit the <a href=\"https://aws.amazon.com/keyspaces/\">Amazon Keyspaces product page</a> and see <a href=\"https://docs.aws.amazon.com/keyspaces/latest/devguide/keyspaces-records-cdc.html\">Working with change data capture (CDC) streams</a> in the Amazon Keyspaces Developer Guide.</p>"
  "48c7129d2f8e03effbe831fad3179d6a":
    "id": "48c7129d2f8e03effbe831fad3179d6a"
    "title": "Amazon SageMaker AI launches multi-turn reinforcement learning for AI agent model customization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/multi-turn-reinforcement-learning-on-sagemaker-ai/"
    "published": "2026-06-04 00:00:00"
    "fetched": "2026-06-04 01:40:49"
    "summary": "<p>Amazon SageMaker AI now offers multi-turn reinforcement learning (RL), a new serverless model customization technique for fine-tuning models on multi-step, agentic tasks.&nbsp;SageMaker AI model customization lets you adapt foundation models using techniques such as supervised fine-tuning, reinforcement learning from verifiable rewards (RLVR), and reinforcement learning from AI feedback (RLAIF), without the undifferentiated heavy lifting of building and operating your own training infrastructure. Multi-turn RL extends this by training models against your own agent environment and rewarding the full sequence of decisions an agent makes across a task, helping you specialize smaller, lower-cost models to match or exceed the task accuracy of larger general-purpose models on your target workload.</p> \n<p>Training models that power agents to reliably complete multi-step tasks is complex and time-consuming, often requiring custom infrastructure that takes weeks to build. SageMaker's Multi-turn RL offering handles this for you. You can connect your agent running on Amazon Bedrock AgentCore Runtime for fully managed hosting, or on Amazon EKS, Amazon EC2, AWS Fargate, or any infrastructure using the framework of your choice. SageMaker AI manages the full training loop, from rollout orchestration and trajectory collection to training and checkpoint management. Built-in MLflow tracking lets you inspect agent trajectories, rewards, and traces. Evaluation jobs report reward, pass@k, and trajectory metrics so you can benchmark a model before deploying it to a SageMaker AI endpoint or Amazon Bedrock. Multi-turn RL runs as a fully serverless capability, so you pay only for the tokens processed, with no infrastructure to provision or manage.</p> \n<p>Multi-turn RL is available today through SageMaker Studio and the SageMaker Python SDK as part of Amazon SageMaker AI model customization.&nbsp;Supported models include Qwen 3.6 27B, Nova Lite 2.0, GPT-OSS-20B and Gemma 31B in us-west-2, and Nova Lite 2.0, GPT-OSS-20B in us-east-1. To get started with multi-turn reinforcement learning in SageMaker AI, visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-mtrl.html\">Amazon SageMaker AI documentation</a>.&nbsp;</p>"
  "f9217eab313db730c1f48ef109863d9e":
    "id": "f9217eab313db730c1f48ef109863d9e"
    "title": "AWS Step Functions adds AgentCore-powered agentic reasoning step"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-step-functions-agentcore/"
    "published": "2026-06-04 05:00:00"
    "fetched": "2026-06-04 05:16:25"
    "summary": "<p>AWS Step Functions now enables you to add AI agent reasoning steps to your workflow through an optimized integration with the managed harness (currently in preview) in Amazon Bedrock AgentCore. <a href=\"https://aws.amazon.com/step-functions/\">AWS Step Functions</a> is a visual workflow service that orchestrates AWS services with built-in error handling, parallel execution, and human approval steps. The AgentCore <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html\">harness</a> lets you declare an agent through configuration where you specify the model, tools, and behavior. AgentCore provides the managed environment that runs the agent loop end-to-end.</p> \n<p>&nbsp;</p> \n<p>With this integration, you can automate reasoning tasks in your workflow such as classifying a document or extracting elements from an unstructured form. You can run multiple agents in parallel or in sequence at different decision points in a single workflow and add human approval before critical actions. The workflow execution history shows agent input, output, token usage, and duration with links to agent turn details in Amazon CloudWatch, so you can trace and audit every agent decision. You can reuse an existing harness or create a new one directly from the Workflow Studio, the Step Functions visual builder. With per-invocation overrides such as the model, system prompt, and tools, you can adapt the agent to each workflow context without duplicating configurations. Agent context can be persisted across invocations using a session ID that works within or across workflow executions.</p> \n<p>&nbsp;</p> \n<p>The harness integration is available in the following AWS Regions where the AgentCore harness preview is available: US East (N. Virginia), US West (Oregon), Europe (Frankfurt), and Asia Pacific (Sydney). Standard Step Functions pricing applies for workflow execution with no additional integration charges, and standard Amazon Bedrock and AgentCore pricing applies for model inference and associated AgentCore resources.</p> \n<p>&nbsp;</p> \n<p>To learn more about adding agentic reasoning to your workflows, visit AWS Step Functions <a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrockagentcore.html\">documentation</a>.&nbsp;</p>"
  "c63be22077300b47a4bc69e4d2368bd5":
    "id": "c63be22077300b47a4bc69e4d2368bd5"
    "title": "OpenAI GPT-5.4 generally available on Amazon Bedrock in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/GPT54-available-in-aws-govcloud-us-west/"
    "published": "2026-06-04 04:58:00"
    "fetched": "2026-06-04 05:16:25"
    "summary": "<p>Amazon Bedrock now supports GPT‑5.4 from OpenAI in AWS GovCloud (US-West) — giving government and regulated industry customers access to OpenAI's most capable frontier model for professional work, backed by the enterprise-grade security and goverment compliance scope of AWS GovCloud (US).&nbsp;</p> \n<p>GPT‑5.4 supports native computer-use capabilities, and deep reasoning across coding, documents, and multi-step agentic tasks — all running on Bedrock's high-performance inference engine with isolated queues and durable state for fault-tolerant workloads. Your data stays in-partition and is never used to train models.</p> \n<p>For Regional availability of&nbsp; GPT-5.4 see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions page</a>. Read <a href=\"https://aws.amazon.com/blogs/machine-learning/openai-models-and-codex-on-amazon-bedrock-are-now-generally-available\">the launch blog</a> to learn more, for documentation and a step-by-step walkthrough, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock docs</a> and the<a href=\"https://aws.amazon.com/blogs/aws/get-started-with-openai-gpt-5-5-gpt-5-4-models-and-codex-on-amazon-bedrock\"> getting started blog</a>.</p>"
  "212c4c756889ce56f261f7bb072bad3e":
    "id": "212c4c756889ce56f261f7bb072bad3e"
    "title": "ARC Region switch adds Amazon Aurora scaling and Amazon Neptune global database failover"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/region-switch-aurora-scaling-neptune-failover/"
    "published": "2026-06-04 02:44:00"
    "fetched": "2026-06-04 05:16:25"
    "summary": "<p>Amazon Application Recovery Controller (ARC) Region switch helps customers orchestrate the failover of their multi-Region applications to achieve a bounded recovery time in the event of a Regional impairment. Today, we are announcing three new execution blocks — the Amazon Aurora serverless scaling execution block, the Amazon Aurora provisioned scaling execution block, and the Amazon Neptune global database failover execution block — which automate database scaling and failover for multi-Region workloads.<br /> <br /> Customers running Amazon Aurora global database in active-passive configurations typically maintain a scaled-down secondary cluster to minimize cost. During failover, they must manually right-size and scale the secondary cluster to handle production traffic before routing requests — adding critical minutes to recovery time. The new Amazon Aurora serverless and Amazon Aurora provisioned scaling execution blocks automate right-sizing and scaling the secondary cluster as part of the Region switch plan, so it's ready for production traffic when failover completes.<br /> <br /> Customers running Amazon Neptune global database face a similar challenge: failover requires scripting or manually deciding whether to switchover or detach-and-promote depending on the outage type — all under the pressure of an active incident. The new Amazon Neptune global database failover execution block automates both planned switchover and unplanned failover scenarios within a single plan, eliminating custom scripting during recovery.<br /> <br /> All three blocks support cross-account orchestration, enabling a single plan to coordinate database operations across multiple accounts and Regions. To learn more, read documentation of <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/aurora-provisioned-scaling-block.html\">Amazon Aurora provisioned scaling</a>, <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/aurora-serverless-scaling-block.html\">Amazon Aurora serverless scaling</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/neptune-global-database-block.html\">Amazon Neptune global database failover</a></p>"
  "9d3964589779a7b4ca3dafb43281b0aa":
    "id": "9d3964589779a7b4ca3dafb43281b0aa"
    "title": "Amazon SageMaker Unified Studio now supports a localized experience in twelve languages"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/sagemaker-localization"
    "published": "2026-06-04 00:26:00"
    "fetched": "2026-06-04 05:16:25"
    "summary": "<p>Amazon SageMaker Unified Studio enhanced its global accessibility by introducing support for twelve languages across the user interface. Supported languages include English (American), Chinese (Simplified and Traditional), French, German, Indonesian, Italian, Japanese, Korean, Portuguese (Brazilian), Spanish, and Turkish. With this launch, data engineers, analysts, and data scientists across global teams can navigate, build, and collaborate in the language they are most comfortable with, reducing friction and improving productivity.<br /> <br /> Your preferred language is automatically detected based on your browser’s default language settings. You can also set your preferred language by choosing ‘Language selector’ in your profile settings and selecting the language. The selected language applies across the entire SageMaker Unified Studio user interface.<br /> <br /> This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available, in both AWS IAM Identity Center-based and IAM-based domains. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/navigating-sagemaker-unified-studio.html#display-language\">Amazon SageMaker Unified Studio documentation.</a></p>"
  "74fceb4b4324c610e03aa4718b190be6":
    "id": "74fceb4b4324c610e03aa4718b190be6"
    "title": "AWS Config now supports 9 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/aws-config-new-resource-types"
    "published": "2026-06-04 00:00:00"
    "fetched": "2026-06-04 05:16:25"
    "summary": "<p>AWS Config now supports 9 additional AWS resource types across key services including Amazon Bedrock, Amazon Bedrock AgentCore, and Amazon SageMaker. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p> \n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p> \n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\">AWS Regions</a> where the resources are available:</p> \n<p>Resource Types:</p> \n<ul> \n <li>AWS::Bedrock::FlowAlias</li> \n <li>AWS::BedrockAgentCore::Evaluator</li> \n <li>AWS::BedrockAgentCore::GatewayTarget</li> \n <li>AWS::BedrockAgentCore::OnlineEvaluationConfig</li> \n <li>AWS::BedrockAgentCore::RuntimeEndpoint</li> \n <li>AWS::SageMaker::Cluster</li> \n <li>AWS::SageMaker::Endpoint</li> \n <li>AWS::SageMaker::ModelPackageGroup</li> \n <li>AWS::SageMaker::Pipeline</li> \n</ul>"
"last_updated": "2026-06-04 05:16:25 JST"
