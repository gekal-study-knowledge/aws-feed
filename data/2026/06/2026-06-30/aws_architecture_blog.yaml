    "title": "Lessons learned from scaling to 1 million Lambda functions"
    "link": "https://aws.amazon.com/blogs/architecture/lessons-learned-from-scaling-to-1-million-lambda-functions/"
    "published": "2026-06-30 02:21:05"
    "fetched": "2026-06-30 02:32:45"
    "summary": "In this post, we share our journey and the lessons learned from building and running a fully serverless, multi-account software as a service (SaaS) platform at scale. We’ll explore why true scale-to-zero is critical, how we handle quota management, why engaging AWS service teams early saved us from outages, and which unexpected practices emerged once we scaled from thousands to over a million functions."
  "aca130414198b991d0833c61de6506be":
    "id": "aca130414198b991d0833c61de6506be"
    "title": "Preventing data exfiltration in machine learning environments with Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/architecture/preventing-data-exfiltration-in-machine-learning-environments-with-amazon-sagemaker-ai/"
    "published": "2026-06-30 02:16:48"
    "fetched": "2026-06-30 02:32:45"
    "summary": "In this post, we demonstrate how iBusiness implemented a three-layered security architecture using Amazon SageMaker AI, virtual private cloud (VPC) endpoints, and Amazon WorkSpaces Secure Browser to prevent data exfiltration while maintaining data scientist productivity. You can adapt this approach to build secure machine learning environments that balance strict data protection with team scalability."
  "fa68820f8f37496214f4604ddb90e316":
