    "title": "Dual-token authentication for Nakama game servers with Amazon Cognito on AWS"
    "link": "https://aws.amazon.com/blogs/architecture/dual-token-authentication-for-nakama-game-servers-with-amazon-cognito-on-aws/"
    "published": "2026-06-30 02:09:54"
    "fetched": "2026-06-30 02:32:45"
    "summary": "In this post, you learn how to configure an Amazon Cognito User Pool for SRP-based game client authentication with no client secret. You will implement a Go runtime hook that validates Cognito JWTs and bridges player identity to Nakama sessions."
