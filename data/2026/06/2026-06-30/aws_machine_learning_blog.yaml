    "title": "Debugging production agents with Amazon Bedrock AgentCore Observability"
    "link": "https://aws.amazon.com/blogs/machine-learning/debugging-production-agents-with-amazon-bedrock-agentcore-observability/"
    "published": "2026-06-30 02:25:21"
    "fetched": "2026-06-30 02:32:45"
    "summary": "In this post, you learn how to debug production agent failures using built-in observability capabilities. We walk through common failure patterns, show how to analyze agent behavior with traces and metrics, and provide structured workflows for resolving issues such as infinite loops and tool invocation failures. This is Part 1 of a two-part series. Part 2 covers performance optimization and memory management."
  "4efc01af8a8cf6791383f2d0a3e3abeb":
    "id": "4efc01af8a8cf6791383f2d0a3e3abeb"
    "title": "Implement a backup strategy for Amazon Quick Sight BI assets"
    "link": "https://aws.amazon.com/blogs/machine-learning/implement-a-backup-strategy-for-amazon-quick-sight-bi-assets/"
    "published": "2026-06-30 03:15:14"
    "fetched": "2026-06-30 04:51:23"
    "summary": "In this post, we cover best practices for implementing an effective backup strategy for BI assets in Quick Sight. We start by covering the options for selecting the assets to include in your backup, then explain the high-level APIs available for that purpose, and finalize with sample code to help you get started quickly."
  "4460258f7a72dbf1d484d7bfd74516a5":
    "id": "4460258f7a72dbf1d484d7bfd74516a5"
    "title": "Pair Nova 2 Lite with Claude for cost-optimized document processing"
    "link": "https://aws.amazon.com/blogs/machine-learning/pair-nova-2-lite-with-claude-for-cost-optimized-document-processing/"
    "published": "2026-06-30 02:52:33"
    "fetched": "2026-06-30 04:51:23"
    "summary": "In this post, we show how pairing Amazon Nova 2 Lite with Anthropic’s Claude Sonnet 4.6 delivers an efficient solution for digitizing scanned documents at scale. We built a two-model pipeline on Amazon Bedrock for digitizing scanned yearbook pages. Amazon Nova 2 Lite handles native multimodal extraction in a single call: detecting photos, extracting visible names with coordinates, and returning page-level metadata. Claude Sonnet 4.6 then performs spatial reasoning to match names to faces based on page layout."
  "5d99039d90d9b0a1209bcbd36b323c05":
    "id": "5d99039d90d9b0a1209bcbd36b323c05"
    "title": "Multi-tenant LLM analytics with row-level security: How we built a secure agent on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/multi-tenant-llm-analytics-with-row-level-security-how-we-built-a-secure-agent-on-aws/"
    "published": "2026-06-30 02:39:29"
    "fetched": "2026-06-30 04:51:23"
    "summary": "In this post, we show you how PAR built a production-ready multi-tenant LLM analytics system that enforces row-level security through a three-layer architecture: cryptographic request signing with AWS SigV4, semantic validation on Amazon Bedrock, and programmatic data isolation via Split-Plane SQL. We demonstrate how each layer operates independently to reduce the risk of cross-tenant data exposure, even when the LLM itself is compromised or manipulated."
  "18d93ebb78bcee4223c142286b7fb47b":
    "id": "18d93ebb78bcee4223c142286b7fb47b"
    "title": "Build an agentic AI healthcare claims pipeline with Amazon Bedrock and AWS HealthLake"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-an-agentic-ai-healthcare-claims-pipeline-with-amazon-bedrock-and-aws-healthlake/"
    "published": "2026-06-30 02:36:34"
    "fetched": "2026-06-30 04:51:23"
    "summary": "In this post, we show you how to build an automated claims processing pipeline using two key Amazon Bedrock capabilities: Amazon Bedrock Data Automation for intelligent document extraction from healthcare claim forms, and Amazon Bedrock AgentCore for hosting an AI agent that validates and transforms the extracted data into FHIR (Fast Healthcare Interoperable Resources) resources in AWS HealthLake. You will learn how to combine these services to create an end-to-end workflow that reduces manual processing while maintaining accuracy through automated validation checks."
