  "c4ec2111c51b78f9b3f1fb40e8dc3240":
    "id": "c4ec2111c51b78f9b3f1fb40e8dc3240"
    "title": "Agent Focus の紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-agent-focus/"
    "published": "2026-06-30 14:23:26"
    "fetched": "2026-06-30 17:27:00"
    "summary": "開発者が AI と協働する方法は変わりつつあります。モデルは今や複数ステップの作業を計画し実行できるようになり、より多くの開発者が、自分で一行ずつコードを打ったり直接編集したりするのではなく、エージェントを導くことに一日を費やすようになっています。 IDE は別の時代のために作られたものです。IDE はコードを中心に据えますが、それはまさに「自分で編集しているとき」に欲しいものです。しかし、主な仕事がエージェントに実行させる作業を定義し、洗練し、方向づけることであるとき、それが必ずしも欲しいものとは限りません。2026 年 6 月 25 日、私たちは Agent Focus を発表します。これは Kiro IDE における実験的な新しいビューで、エージェントとのやり取りを前面に押し出すものです。チャットファーストな働き方の基盤を築きます。やりたいことを記述し、会話を通じて洗練させ、作業を開始し、エージェントが進める様子を確認する——という流れです。これまでの IDE 体験がなくなるわけではありません。Agent Focus はそれと並んで存在し、いつでも両者を行き来できます。"
  "84537bd1b26861bb28abceab58708ba0":
    "id": "84537bd1b26861bb28abceab58708ba0"
    "title": "1 つのタスク、2 つのプロバイダー(GitLab と GitHub) をまたぐ変更を 1 セッションで調整する"
    "link": "https://aws.amazon.com/jp/blogs/news/coordinating-changes-across-gitlab-and-github-in-one-session/"
    "published": "2026-06-30 14:20:24"
    "fetched": "2026-06-30 17:27:00"
    "summary": "Kiro Web は、既存の GitHub サポートに加えて、GitLab でも動作するようになりました。より興味深いのは、コードが GitLab と GitHub の両方にまたがって存在する場合に何が起きるかです。両方からリポジトリを同じセッションに追加し、単一の変更を記述すれば、Kiro がそれを両方にわたって実行し、一方にはマージリクエスト（MR）を、もう一方にはプルリクエスト（PR）を開いてくれます。これは、コードが 1 つのきれいな場所に収まっていないときに意味を持ちます。"
  "7ee8664a45a8b39eb58a75322ecbf7ac":
    "id": "7ee8664a45a8b39eb58a75322ecbf7ac"
    "title": "【ベータ開始】AWS 認定を最新の状態に保つ新しい方法"
    "link": "https://aws.amazon.com/jp/blogs/news/a-new-way-to-keep-your-aws-certification-current/"
    "published": "2026-06-30 14:18:39"
    "fetched": "2026-06-30 17:27:00"
    "summary": "AWS 認定の再認定に新たな方法が加わりました。Skill Builder 上のコースとハンズオンラボを完了することで、認定の有効期限を 1 年間延長できます。テストセンターの予約も不要で、自分のペースで取り組めます。現在は AWS Certified Solutions Architect – Associate、AWS Certified Developer – Associate、AWS Certified CloudOps Engineer – Associate、AWS Certified DevOps Engineer – Professional、AWS Certified Solutions Architect – Professional が対象で、今年後半に AWS Certified Data Engineer – Associate、 AWS Certified Security – Specialty、AWS Certified Machine Learning Engineer – Associate を含む追加の認定も対応予定です。"
  "32b3679c12435f64c8f9c964b59f5aa3":
    "id": "32b3679c12435f64c8f9c964b59f5aa3"
    "title": "AWS マネジメントコンソールへのアクセスを想定するネットワークに制限"
    "link": "https://aws.amazon.com/jp/blogs/news/restrict-aws-management-console-access-to-expected-networks-with-sign-in-resource-based-policies-and-rcps/"
    "published": "2026-06-30 17:36:31"
    "fetched": "2026-06-30 20:42:29"
    "summary": "本ブログでは、企業が規制コンプライアンスのためにコンソールアクセスを企業ネットワークに制限するユースケースを取り上げ、AWS Sign-In のリソースベースポリシーと RCP を使った実装方法を紹介します。リソース許可ステートメントの作成、コンソール認可の有効化、CloudTrail による検証、Console Private Access やデータ境界フレームワークとの統合まで詳しく説明します。"
