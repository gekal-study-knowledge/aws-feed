  "66cfff1f46a171614e9111b2a581248f":
    "id": "66cfff1f46a171614e9111b2a581248f"
    "title": "Amazon MWAA Serverless now supports shared VPC configurations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-mwaa-serverless-vpc/"
    "published": "2026-06-30 02:19:00"
    "fetched": "2026-06-30 06:22:18"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (Amazon MWAA) Serverless now supports shared VPC subnets. Previously, customers using subnets shared via AWS Resource Access Manager (AWS RAM) received a validation error when creating MWAA Serverless workflows. With this update, MWAA Serverless correctly validates subnet ownership in shared VPC configurations, consistent with MWAA Provisioned environments.<br /> Sharing VPC subnets across accounts using AWS RAM is a common pattern in multi-account landing zone architectures. Organizations that centrally manage networking can now launch MWAA Serverless workflows in member accounts using shared subnets — no workarounds required. Customers using Amazon SageMaker Unified Studio Workflows also benefit from this update when their projects are configured with shared VPC networking.<br /> This update is available in all AWS Regions where <a href=\"https://aws.amazon.com/managed-workflows-for-apache-airflow/\">Amazon MWAA Serverless</a> is supported. To learn more, see the <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/networking.html#networking-support\">Networking</a> section of the Amazon MWAA Serverless User Guide.</p>"
  "7ea89d602a8ffd04d59c2b8a608ea31d":
    "id": "7ea89d602a8ffd04d59c2b8a608ea31d"
    "title": "AWS WAF adds support for Amazon Bedrock AgentCore Gateway"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-waf-amazon-bedrock-agentcore/"
    "published": "2026-06-30 07:00:00"
    "fetched": "2026-06-30 09:00:14"
    "summary": "<p>Today, AWS announces general availability of AWS Web Application Firewall (AWS WAF) protection for Amazon Bedrock AgentCore Gateway, enabling you to protect your agentic AI workloads from common web exploits and abuse. As enterprises move agentic applications from prototype to production, this launch gives security and platform teams ability to apply consistent, customizable web protections at the Gateway layer.</p> \n<p>You can now associate an AWS WAF protection pack with your AgentCore Gateway to enforce IP-based access controls, rate-based rules that throttle abusive traffic, and AWS Managed Rule Groups including common rule sets, known bad inputs, and Bot Control. You configure the protection pack once at the Gateway level and AWS WAF applies it consistently to every target behind that Gateway, so a single configuration protects all downstream tools, agents, and integrations.</p> \n<p>Support for AWS WAF on AgentCore Gateway is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where both AWS WAF and Amazon Bedrock AgentCore Gateway are available.</p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html\">AWS WAF Developer Guide</a> and the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html\">Amazon Bedrock AgentCore documentation.</a></p>"
  "bf1115e44a60331e5bf63f138d157a63":
    "id": "bf1115e44a60331e5bf63f138d157a63"
    "title": "OpenAI GPT-5.4 and NVIDIA Nemotron 3 Super 120B now available on Kiro in AWS GovCloud (US-West) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/kiro-gpt-nemotron-launch-aws-govcloud-us/"
    "published": "2026-06-30 18:00:00"
    "fetched": "2026-06-30 20:42:28"
    "summary": "<p>Two new models are now available in the Kiro IDE and CLI for the AWS GovCloud (US-West) Region.<br /> <br /> OpenAI GPT-5.4 is now available in Kiro for complex reasoning, coding, document analysis, and multi-step agentic workflows. It helps developers build AI applications and production workflows that can interpret context, interact with tools, operate software environments, and verify outputs across multiple steps. GPT-5.4 runs on Amazon Bedrock's next-generation inference engine with isolated queues and durable execution for resilient workloads. Available with a 272K context window and 1.2x credit multiplier.<br /> <br /> NVIDIA Nemotron 3 Super 120B is now available in Kiro as an open weight model option. A hybrid mixture-of-experts model activating only 12B of its 120B parameters for high compute efficiency and fast inference on agentic tasks. 256K context window with 32K max output. Available with a 0.25x credit multiplier.<br /> <br /> Ensure your IDE or CLI is updated to the latest version, then restart it to access the new models from the model selector. For more details about Kiro in AWS GovCloud (US), visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">GovCloud documentation</a>&nbsp;or contact your AWS account team for more information. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "8cc2dc4b116948a22d9bed348fbf7be1":
    "id": "8cc2dc4b116948a22d9bed348fbf7be1"
    "title": "Claude Opus 4.8 is now available in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/claude-opus-4.8-aws-govcloud-us"
    "published": "2026-06-30 21:00:00"
    "fetched": "2026-06-30 23:10:24"
    "summary": "<p>AWS GovCloud (US)&nbsp; now offers Claude Opus 4.8 -- Anthropic's most capable generally available model to date -- delivering meaningful advances across agentic coding, professional knowledge work, and long-running autonomous tasks for developers and enterprises building production AI applications.</p> \n<p>Claude Opus 4.8 can perform longer autonomous runs, deeper reasoning, and consistency to be trusted with production work. For coding, the Opus 4.8 reads codebases like an engineer, plans before it edits, and holds context across long sessions in real repositories. For agentic tasks, it is better at finding paths around obstacles instead of stalling, recovering from its own errors, and knowing when to ask for help versus when to keep going. For knowledge work, it better synthesizes across long documents and complex sources, self-checks its output, and delivers structured deliverables that hold up to review.</p> \n<p>Amazon Bedrock keeps your data within AWS infrastructure and provides access to Claude Opus 4.8 through a unified service with AWS-managed features like Guardrails, Knowledge Bases, and regional data residency. To learn more, see Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-4-8.html\">documentation</a>&nbsp; and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>.</p>"
"last_updated": "2026-06-30 23:10:24 JST"
