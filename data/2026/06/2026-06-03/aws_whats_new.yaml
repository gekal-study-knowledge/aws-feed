  "70b2cb6b352a2d994f4a78e1b6b3d135":
    "id": "70b2cb6b352a2d994f4a78e1b6b3d135"
    "title": "Amazon ElastiCache for Valkey now supports durability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/durability-amazon-elasticache"
    "published": "2026-06-03 00:00:00"
    "fetched": "2026-06-03 02:18:46"
    "summary": "<p>Today, AWS announces durability support for Amazon ElastiCache. Durability enables you to use ElastiCache for workloads that require microsecond read latency but cannot tolerate data loss. With durability support, ElastiCache now stores data durably across multiple Availability Zones (AZs) using a Multi-AZ transactional log to enable fast failover, database recovery, and node restarts to prevent data loss in the unlikely event of a failure.</p> \n<p>You can choose between two durability options: synchronous and asynchronous writes. Synchronous writes persist data across at least two AZs before responding to the client, designed for zero data loss at single-digit millisecond write latency. Asynchronous writes persist data after responding to the client, maintaining microsecond write latency at no additional cost. However, up to 10 seconds of uncommitted data could be lost in the rare event of a failure. Both options maintain microsecond read latency. You can now use ElastiCache for a broader set of use cases beyond caching where data loss is unacceptable such as AI agent long-term memory, AI agent workflow state, knowledge bases for RAG applications, payment tokenization, and real-time inventory management.</p> \n<p>Durability for ElastiCache is available in all AWS commercial Regions, AWS China Regions, and AWS GovCloud (US) Regions starting with Valkey 9.0. To get started, create a new ElastiCache cluster and select your preferred durability option using the AWS Management Console, AWS Software Development Kit (SDK), or AWS Command Line Interface (CLI). For pricing details, visit the <a href=\"https://aws.amazon.com/elasticache/pricing/\">Amazon ElastiCache pricing page</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/durability.html\">ElastiCache documentation</a> and <a href=\"https://aws.amazon.com/blogs/database/announcing-durability-for-amazon-elasticache/\">blog</a>.&nbsp;&nbsp;</p>"
  "cdbdf2a90420515371f26450996435ae":
    "id": "cdbdf2a90420515371f26450996435ae"
    "title": "AWS Deadline Cloud now supports persistent storage for Service Managed Fleets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/deadline-cloud/persistent-storage"
    "published": "2026-06-03 02:00:00"
    "fetched": "2026-06-03 05:43:25"
    "summary": "<p>AWS Deadline Cloud now supports persistent storage for Service-Managed Fleets (SMF), allowing you to maintain data across worker lifecycle events.&nbsp;AWS Deadline Cloud is a fully managed service that makes it easy for teams to run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming.<br /> <br /> Previously, Deadline Cloud SMF workers relied only on ephemeral storage, requiring software and assets to be reinstalled each time a worker was recycled or replaced. Now, Deadline Cloud attaches persistent Amazon Elastic Block Store (Amazon EBS) volumes to SMF workers, preserving Conda environments, Perforce workspaces, shader caches, and asset collections across worker lifecycle events. This reduces worker startup time and helps you complete jobs faster.&nbsp;You can configure the number of persistent volumes per worker and set a time-to-live (TTL) to control how long volumes are retained, giving you flexibility to balance storage costs with startup performance.&nbsp;<br /> <br /> Persistent storage for SMF is available in all AWS Regions where Deadline Cloud is offered. Persistent volumes are priced the same as existing Service-Managed Fleets EBS pricing. See the <a href=\"https://aws.amazon.com/deadline-cloud/pricing/\">Deadline Cloud pricing page</a>&nbsp;for details. To learn more, visit the <a href=\"https://aws.amazon.com/deadline-cloud/\">AWS Deadline Cloud product page</a> or our <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/volumes.html\">user guide</a>.</p>"
  "02a3ce8e3a1a8fb0b92966c81e02df25":
    "id": "02a3ce8e3a1a8fb0b92966c81e02df25"
    "title": "Amazon SageMaker Studio now sets up in seconds with model customization ready from the start"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/quick-setup-model-customization-sagemaker-studio/"
    "published": "2026-06-03 01:23:00"
    "fetched": "2026-06-03 05:43:25"
    "summary": "<p>Amazon SageMaker Studio quick setup now completes in under twenty seconds, reduced from over two minutes. Whether you are building ML pipelines, exploring data, developing with notebooks, or fine-tuning foundation models, you can go from sign-in to a fully configured Studio environment almost instantly.<br /> <br /> As part of this streamlined setup, newly created Studio environments now come with serverless model customization permissions automatically configured. A new managed policy, AmazonSageMakerModelCustomizationCoreAccess, is created and attached for you, providing permissions for serverless model customization jobs including fine-tuning with custom reward functions for reinforcement learning, model evaluation, and deployment to SageMaker or Bedrock endpoints. This eliminates the need to manually create and configure IAM roles and policies before you can start experimenting. For existing Studio environments, actionable messages with direct links to documentation guide you through adding these permissions.<br /> <br /> This feature is available in all AWS Commercial Regions where Amazon SageMaker Studio is supported. To get started, create a new Studio environment using quick setup in the SageMaker AI Console. To learn more, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html\">Quick setup</a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight-prereq.html\">Model Customization permissions setup</a> in the Amazon SageMaker documentation.</p>"
  "7008c222d4caeffe1ffac7402571f9f6":
    "id": "7008c222d4caeffe1ffac7402571f9f6"
    "title": "AWS Config now supports internal service linked rules"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-config-supports-internal-service-linked-rules"
    "published": "2026-06-03 03:00:00"
    "fetched": "2026-06-03 07:59:45"
    "summary": "<p>AWS Config now supports internal service linked rules, enabling AWS services to evaluate AWS resource configurations using AWS Config managed rules. Internal service linked rules extend the existing service linked recorder capability by allowing AWS services such as AWS Security Hub CSPM to deploy and manage rule evaluations for service specific functionality.<br /> <br /> With internal service linked rules, AWS services can use AWS Config managed rules to provide integrated security and compliance capabilities. Evaluation results are delivered directly to the AWS service that deployed the rule at no charge from AWS Config to customers. Internal service linked rules operate independently of existing customer managed AWS Config recorders and rules. This allows customers to continue using AWS Config for inventory, governance, compliance, and auditing use cases while AWS services independently manage service specific evaluations.<br /> <br /> AWS Security Hub CSPM internal service-linked rules are now available in all commercial, GovCloud, and China Regions. To learn more, see the AWS Config <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/service-linked-awsconfig-rules.html\">documentation</a>.</p>"
"last_updated": "2026-06-03 07:59:45 JST"
