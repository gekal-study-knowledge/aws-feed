    "title": "Amazon ElastiCache for Valkey now supports durability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/durability-amazon-elasticache"
    "published": "2026-06-03 00:00:00"
    "fetched": "2026-06-03 02:18:46"
    "summary": "<p>Today, AWS announces durability support for Amazon ElastiCache. Durability enables you to use ElastiCache for workloads that require microsecond read latency but cannot tolerate data loss. With durability support, ElastiCache now stores data durably across multiple Availability Zones (AZs) using a Multi-AZ transactional log to enable fast failover, database recovery, and node restarts to prevent data loss in the unlikely event of a failure.</p> \n<p>You can choose between two durability options: synchronous and asynchronous writes. Synchronous writes persist data across at least two AZs before responding to the client, designed for zero data loss at single-digit millisecond write latency. Asynchronous writes persist data after responding to the client, maintaining microsecond write latency at no additional cost. However, up to 10 seconds of uncommitted data could be lost in the rare event of a failure. Both options maintain microsecond read latency. You can now use ElastiCache for a broader set of use cases beyond caching where data loss is unacceptable such as AI agent long-term memory, AI agent workflow state, knowledge bases for RAG applications, payment tokenization, and real-time inventory management.</p> \n<p>Durability for ElastiCache is available in all AWS commercial Regions, AWS China Regions, and AWS GovCloud (US) Regions starting with Valkey 9.0. To get started, create a new ElastiCache cluster and select your preferred durability option using the AWS Management Console, AWS Software Development Kit (SDK), or AWS Command Line Interface (CLI). For pricing details, visit the <a href=\"https://aws.amazon.com/elasticache/pricing/\">Amazon ElastiCache pricing page</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/durability.html\">ElastiCache documentation</a> and <a href=\"https://aws.amazon.com/blogs/database/announcing-durability-for-amazon-elasticache/\">blog</a>.&nbsp;&nbsp;</p>"
