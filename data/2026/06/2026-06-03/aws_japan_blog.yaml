    "title": "【開催報告】データから業務アクション、展開まで繋げる ​ Amazon Quick ワークショップ​ in 大阪"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-business-innovation-series-west-japan-02-20260529/"
    "published": "2026-06-03 16:48:09"
    "fetched": "2026-06-03 20:53:48"
    "summary": "2026 年 5 月 29 日、AWS ジャパン 大阪オフィスにて「AWS Business Innovation Series – West Japan」の第 2 回を開催しました。AI ワークアシスタント「Amazon Quick」をテーマに、座学・ハンズオン・ハッカソンの 3 ステップでデータ接続からエージェント構築までを体験いただき、参加者全員が半日で自社業務に活用できるチャットエージェントを作り上げました。当日の様子と参加者の声をお届けします。"
