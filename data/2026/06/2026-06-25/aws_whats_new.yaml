  "af3ea1489fc65eaec9c14bc1adc827a3":
    "id": "af3ea1489fc65eaec9c14bc1adc827a3"
    "title": "Amazon EMR Serverless now supports live configuration updates without application restarts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-emr-serverless/"
    "published": "2026-06-25 04:21:00"
    "fetched": "2026-06-25 05:45:03"
    "summary": "<p>Amazon EMR Serverless now supports updates to key application configurations such as maximum capacity, and custom image settings — without stopping and restarting the application. New workloads submitted after the update automatically use the new settings, while existing workloads continue uninterrupted with their original configuration.</p> \n<p>Previously, modifying these settings required stopping your EMR Serverless application, making the change, and restarting it — forcing you to coordinate maintenance windows and temporarily block job submissions. Now you can adjust scaling boundaries or deploy updated custom images at any time without disrupting running jobs. This reduces operational overhead and lets you respond to changing workload demands or deploy image updates immediately.&nbsp;</p> \n<p>This feature is available on all Amazon EMR releases and in all AWS Regions where Amazon EMR Serverless is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/updating-running-applications.html\">EMR Serverless User Guide.</a></p>"
  "b72e1bc512784bff6c211bb0303439e5":
    "id": "b72e1bc512784bff6c211bb0303439e5"
    "title": "Amazon EC2 announces AMI Watermarks for improved AMI governance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-image-watermarks-allowed-images"
    "published": "2026-06-25 05:00:00"
    "fetched": "2026-06-25 07:13:45"
    "summary": "<p>Amazon EC2 introduces AMI watermarks, letting you embed custom identifiers in your private AMIs. Once applied, a watermark automatically carries forward to every AMI derived from the original, whether you copy it across regions or create a new AMI from a running instance. Watermarks also remain visible when you share an AMI with other accounts. This helps you identify trusted AMIs, track provenance, and enforce governance policies across your organization.<br /> <br /> Each watermark includes metadata such as the AMI ID, owner ID, region, and creation timestamps, providing reliable provenance that persists regardless of how many times an AMI is copied or new AMIs are created from it. AMI Watermarks improve AMI tracking by enabling you to filter and find related AMIs across your accounts. For governance, you can combine watermarks with <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html\">Allowed AMIs</a>&nbsp;to restrict instance launches to only AMIs carrying approved watermarks and enforce the setting at scale across your organization through Declarative Policies.<br /> <br /> You can start adding AMI watermarks to your private AMIs by using the AWS Management Console, AWS CLI, or SDKs. To learn more, please visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-watermark.html\">documentation</a>.&nbsp;You can also attach watermarks through <a href=\"https://docs.aws.amazon.com/imagebuilder/latest/userguide/what-is-image-builder.html\">EC2 Image Builder,</a> a service used to create and manage AMIs, as part of your AMI build pipeline.<br /> <br /> AMI watermarks are available to all customers at no additional cost in all AWS regions including AWS China (Beijing) Region, operated by Sinnet, and AWS China (Ningxia) Region, operated by NWCD, and AWS GovCloud (US) Regions.&nbsp;</p>"
  "fb03bab8aa2e5941b1058bebe5941589":
    "id": "fb03bab8aa2e5941b1058bebe5941589"
    "title": "AWS IoT Device SDK for Swift is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-iot-device-sdk-swift/"
    "published": "2026-06-25 03:48:00"
    "fetched": "2026-06-25 07:13:45"
    "summary": "<p>The AWS IoT Device SDK for Swift is now generally available, enabling Swift developers to build secure, scalable IoT applications natively on Apple platforms including macOS, iOS, and tvOS, as well as Linux. This SDK addresses the previous lack of native Swift support for AWS IoT services, providing stable, production-ready APIs specifically designed for teams managing IoT device fleets and building cross-platform IoT solutions across the Apple ecosystem.</p> \n<p>The SDK delivers comprehensive capabilities for real-time device management and secure communication. With integrated service clients for AWS IoT Device Shadow, Jobs, and Fleet Provisioning, developers can synchronize device states between applications and AWS IoT Core, manage remote operations on connected devices at scale, and automate certificate and policy creation for secure device onboarding. The SDK also provides built-in TLS 1.3 support on Apple iOS and tvOS platforms, ensuring IoT applications use the latest industry-standard security practices for protecting data in transit.</p> \n<p>To learn more, visit the &nbsp;<a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/iot-sdks.html\">AWS IoT Device SDK documentation&nbsp;</a> and explore &nbsp;<a href=\"https://github.com/aws/aws-iot-device-sdk-swift/tree/main/Samples/ServiceClientSamples\">code samples on GitHub&nbsp;</a>. Get started by installing the SDK via Swift Package Manager.</p>"
  "8ceebf0c6d44629ce7f551afa48000f2":
    "id": "8ceebf0c6d44629ce7f551afa48000f2"
    "title": "Amazon Route 53 Global Resolver now supports sharing DNS Views between AWS Accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-route-53-global-resolver/"
    "published": "2026-06-25 01:09:00"
    "fetched": "2026-06-26 02:09:12"
    "summary": "<p>Amazon Route 53 Global Resolver now enables you to share DNS views with other AWS accounts using AWS Resource Access Manager (AWS RAM). Consumer accounts can associate their own Route 53 private hosted zones with a shared DNS view, making their records resolvable through the owner's global resolver in every AWS Region where it runs—without transferring ownership of the hosted zone or the DNS view.<br /> <br /> With DNS view sharing, teams can continue to own and manage their private hosted zones while making them resolvable through a centralized global resolver. You can control access using predefined AWS RAM managed permissions — default association-only, lifecycle management, or full access—or create custom permissions to grant specific actions to the consumer. Private hosted zone associations created by the consumer belong to the consumer's account, while remaining visible to and removable by the owner.<br /> <br /> This capability is available at no additional cost in all AWS Regions where Route 53 Global Resolver is supported. To get started, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-sharing-dns-views.html\" target=\"_blank\">Route 53 Global Resolver documentation</a>. For regional availability, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-what-is-global-resolver.html#regions\" target=\"_blank\">Route 53 Global Resolver Region list</a>. For pricing, see <a href=\"https://aws.amazon.com/route53/pricing/\" target=\"_blank\">Amazon Route 53 pricing</a>.</p>"
"last_updated": "2026-06-26 02:09:12 JST"
