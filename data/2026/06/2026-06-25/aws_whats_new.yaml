"entries":
  "af3ea1489fc65eaec9c14bc1adc827a3":
    "id": "af3ea1489fc65eaec9c14bc1adc827a3"
    "title": "Amazon EMR Serverless now supports live configuration updates without application restarts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-emr-serverless/"
    "published": "2026-06-25 04:21:00"
    "fetched": "2026-06-25 05:45:03"
    "summary": "<p>Amazon EMR Serverless now supports updates to key application configurations such as maximum capacity, and custom image settings — without stopping and restarting the application. New workloads submitted after the update automatically use the new settings, while existing workloads continue uninterrupted with their original configuration.</p> \n<p>Previously, modifying these settings required stopping your EMR Serverless application, making the change, and restarting it — forcing you to coordinate maintenance windows and temporarily block job submissions. Now you can adjust scaling boundaries or deploy updated custom images at any time without disrupting running jobs. This reduces operational overhead and lets you respond to changing workload demands or deploy image updates immediately.&nbsp;</p> \n<p>This feature is available on all Amazon EMR releases and in all AWS Regions where Amazon EMR Serverless is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/updating-running-applications.html\">EMR Serverless User Guide.</a></p>"
  "b72e1bc512784bff6c211bb0303439e5":
    "id": "b72e1bc512784bff6c211bb0303439e5"
    "title": "Amazon EC2 announces AMI Watermarks for improved AMI governance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-image-watermarks-allowed-images"
    "published": "2026-06-25 05:00:00"
    "fetched": "2026-06-25 07:13:45"
    "summary": "<p>Amazon EC2 introduces AMI watermarks, letting you embed custom identifiers in your private AMIs. Once applied, a watermark automatically carries forward to every AMI derived from the original, whether you copy it across regions or create a new AMI from a running instance. Watermarks also remain visible when you share an AMI with other accounts. This helps you identify trusted AMIs, track provenance, and enforce governance policies across your organization.<br /> <br /> Each watermark includes metadata such as the AMI ID, owner ID, region, and creation timestamps, providing reliable provenance that persists regardless of how many times an AMI is copied or new AMIs are created from it. AMI Watermarks improve AMI tracking by enabling you to filter and find related AMIs across your accounts. For governance, you can combine watermarks with <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html\">Allowed AMIs</a>&nbsp;to restrict instance launches to only AMIs carrying approved watermarks and enforce the setting at scale across your organization through Declarative Policies.<br /> <br /> You can start adding AMI watermarks to your private AMIs by using the AWS Management Console, AWS CLI, or SDKs. To learn more, please visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-watermark.html\">documentation</a>.&nbsp;You can also attach watermarks through <a href=\"https://docs.aws.amazon.com/imagebuilder/latest/userguide/what-is-image-builder.html\">EC2 Image Builder,</a> a service used to create and manage AMIs, as part of your AMI build pipeline.<br /> <br /> AMI watermarks are available to all customers at no additional cost in all AWS regions including AWS China (Beijing) Region, operated by Sinnet, and AWS China (Ningxia) Region, operated by NWCD, and AWS GovCloud (US) Regions.&nbsp;</p>"
  "fb03bab8aa2e5941b1058bebe5941589":
    "id": "fb03bab8aa2e5941b1058bebe5941589"
    "title": "AWS IoT Device SDK for Swift is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-iot-device-sdk-swift/"
    "published": "2026-06-25 03:48:00"
    "fetched": "2026-06-25 07:13:45"
    "summary": "<p>The AWS IoT Device SDK for Swift is now generally available, enabling Swift developers to build secure, scalable IoT applications natively on Apple platforms including macOS, iOS, and tvOS, as well as Linux. This SDK addresses the previous lack of native Swift support for AWS IoT services, providing stable, production-ready APIs specifically designed for teams managing IoT device fleets and building cross-platform IoT solutions across the Apple ecosystem.</p> \n<p>The SDK delivers comprehensive capabilities for real-time device management and secure communication. With integrated service clients for AWS IoT Device Shadow, Jobs, and Fleet Provisioning, developers can synchronize device states between applications and AWS IoT Core, manage remote operations on connected devices at scale, and automate certificate and policy creation for secure device onboarding. The SDK also provides built-in TLS 1.3 support on Apple iOS and tvOS platforms, ensuring IoT applications use the latest industry-standard security practices for protecting data in transit.</p> \n<p>To learn more, visit the &nbsp;<a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/iot-sdks.html\">AWS IoT Device SDK documentation&nbsp;</a> and explore &nbsp;<a href=\"https://github.com/aws/aws-iot-device-sdk-swift/tree/main/Samples/ServiceClientSamples\">code samples on GitHub&nbsp;</a>. Get started by installing the SDK via Swift Package Manager.</p>"
  "8ceebf0c6d44629ce7f551afa48000f2":
    "id": "8ceebf0c6d44629ce7f551afa48000f2"
    "title": "Amazon Route 53 Global Resolver now supports sharing DNS Views between AWS Accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-route-53-global-resolver/"
    "published": "2026-06-25 01:09:00"
    "fetched": "2026-06-26 02:09:12"
    "summary": "<p>Amazon Route 53 Global Resolver now enables you to share DNS views with other AWS accounts using AWS Resource Access Manager (AWS RAM). Consumer accounts can associate their own Route 53 private hosted zones with a shared DNS view, making their records resolvable through the owner's global resolver in every AWS Region where it runs—without transferring ownership of the hosted zone or the DNS view.<br /> <br /> With DNS view sharing, teams can continue to own and manage their private hosted zones while making them resolvable through a centralized global resolver. You can control access using predefined AWS RAM managed permissions — default association-only, lifecycle management, or full access—or create custom permissions to grant specific actions to the consumer. Private hosted zone associations created by the consumer belong to the consumer's account, while remaining visible to and removable by the owner.<br /> <br /> This capability is available at no additional cost in all AWS Regions where Route 53 Global Resolver is supported. To get started, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-sharing-dns-views.html\" target=\"_blank\">Route 53 Global Resolver documentation</a>. For regional availability, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-what-is-global-resolver.html#regions\" target=\"_blank\">Route 53 Global Resolver Region list</a>. For pricing, see <a href=\"https://aws.amazon.com/route53/pricing/\" target=\"_blank\">Amazon Route 53 pricing</a>.</p>"
  "8d30c2ed5fd1a3fb49ae6b3966953533":
    "id": "8d30c2ed5fd1a3fb49ae6b3966953533"
    "title": "AWS GovCloud (US) now offers US-based, US citizen 24/7 technical support for all customers by default"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/default-govcloud-us-based-support/"
    "published": "2026-06-25 21:00:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p>AWS GovCloud (US) customers now have their technical support cases routed to US-based, US-citizen cloud support engineers by default with no opt-in or special request required. This enhancement ensures that 24/7 technical support across both AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions is handled exclusively by full-time AWS employees who are US citizens on US soil, trained to maintain ITAR compliance and meet other applicable AWS GovCloud (US) requirements.<br /> <br /> With this update, AWS GovCloud (US) customers benefit from cloud support engineers with the permissions and tools to work directly within their regulated environments, enabling faster diagnosis and resolution of technical issues. Support is available around the clock through the AWS GovCloud (US) Console, API access for automated workflows, click-to-call for urgent issues, and live chat for quick questions.<br /> <br /> To learn more about AWS GovCloud (US), visit the <a href=\"https://aws.amazon.com/govcloud-us/\">product page</a> and <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-support.html\">user guide</a>; to learn more about the AWS GovCloud (US). For a deeper dive into this launch, read the full <a href=\"https://aws.amazon.com/blogs/publicsector/introducing-us-based-us-citizen-24-7-technical-support-for-aws-govcloud-us-customers-your-mission-never-sleeps-neither-do-we/\">blog post</a>.</p>"
  "3ff09eb34bbdde996ce9da416a393e9a":
    "id": "3ff09eb34bbdde996ce9da416a393e9a"
    "title": "AWS Backup enhances Amazon S3 backup copy performance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-backup-amazon-s3-copy-enhancement/"
    "published": "2026-06-25 19:00:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p>AWS Backup now executes S3 backup copy operations up to 8x faster for buckets with millions of objects and low change rates between backup copies through enhanced change tracking. This improvement reduces the time required to copy S3 backups across accounts and AWS Regions by eliminating the need to scan all objects in the destination account or Region.</p> \n<p>With this improvement, AWS Backup records object events as they occur, resulting in faster copy operations and reduced processing time. The enhancement automatically applies to all new S3 backup cross account and cross-Region copy jobs.</p> \n<p>This improvement is enabled at no additional cost in all AWS Regions where AWS Backup support Amazon S3 backup cross-account and cross-Region copying.</p> \n<p>To learn more about AWS Backup for Amazon S3, visit the <a href=\"https://aws.amazon.com/backup/faqs/\">product page</a> and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/s3-backups.html\">technical documentation</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/backup\">AWS Backup console</a>.&nbsp;</p>"
  "eef5d42f98fe73961828967f01aba1a8":
    "id": "eef5d42f98fe73961828967f01aba1a8"
    "title": "Amazon RDS now supports the latest GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-rds-supports-latest-gdr-updates-microsoft-sql-server"
    "published": "2026-06-25 16:03:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server </a>now supports the latest General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for Microsoft SQL Server 2016 SP3+GDR <a href=\"https://support.microsoft.com/help/5084821\" rel=\"noopener noreferrer\" target=\"_blank\">KB5084821</a> (RDS version 13.00.6485.1.v1), SQL Server 2017 CU31+GDR <a href=\"https://support.microsoft.com/help/5084818\" rel=\"noopener noreferrer\" target=\"_blank\">KB5084818</a> (RDS version 14.00.3525.1.v1), SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/help/5084816\" rel=\"noopener noreferrer\" target=\"_blank\">KB5084816</a> (RDS version 15.00.4465.1.v1) and SQL Server 2022 CU24+GDR <a href=\"https://support.microsoft.com/help/5083252\" rel=\"noopener noreferrer\" target=\"_blank\">KB5083252</a> (RDS version 16.00.4250.1.v1).<br /> <br /> The GDR updates address vulnerabilities described in CVE-2026-32167 and CVE-2026-32176. For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5084821, KB5084818, KB5084816, KB5083252. We recommend that you upgrade your Amazon RDS for SQL Server instances to apply these updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can learn more about upgrading your database instance in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft SQL Server DB engine</a>.</p>"
  "aab374f8a95b3433a02a6dd4e7637e6f":
    "id": "aab374f8a95b3433a02a6dd4e7637e6f"
    "title": "Amazon OpenSearch Ingestion now available in AWS Europe (Paris) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/opensearch-ingestion-europe-paris-region-availability"
    "published": "2026-06-25 10:32:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p>Starting today, customers can use Amazon OpenSearch Ingestion in the Europe (Paris) Region (eu-west-3) for ingesting data into their Amazon OpenSearch Service managed clusters or serverless collections.<br /> <br /> Amazon OpenSearch Ingestion is a fully managed data ingestion tier that allows you to ingest and process data before indexing it in Amazon OpenSearch managed clusters or serverless collections. Amazon OpenSearch Ingestion provides a no-code experience to filter, transform, redact, and route data into Amazon OpenSearch Service. Amazon OpenSearch Ingestion automatically provisions and scales the underlying resources to meet the fluctuating demands of your workloads.<br /> <br /> With this launch, Amazon OpenSearch Ingestion is now generally available in 17 AWS regions: US East (Ohio), US East (N. Virginia), US West (Oregon), US West (N. California), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Spain), Europe (Paris), Asia Pacific (Tokyo), Asia Pacific (Sydney), Asia Pacific (Singapore), Asia Pacific (Mumbai), Asia Pacific (Seoul), Canada (Central), South America (Sao Paulo), and Europe (Stockholm).<br /> <br /> To learn more, see the <a href=\"https://aws.amazon.com/opensearch-service/features/ingestion/\">Amazon OpenSearch Ingestion</a> webpage and the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ingestion.html\">Amazon OpenSearch Ingestion Developer Guide</a>.</p>"
  "6d84d1de5f2e9bbb6ed1c6ff54661710":
    "id": "6d84d1de5f2e9bbb6ed1c6ff54661710"
    "title": "Amazon RDS Custom now supports the latest CU and GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-rds-custom-supports-latest-cu-gdr-updates-microsoft-sql-server"
    "published": "2026-06-25 16:44:00"
    "fetched": "2026-06-26 08:14:08"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest Cumulative Updates (CU) and General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/help/5090407\" target=\"_blank\">KB5090407</a> (RDS version 15.00.4470.1.v1) and SQL Server 2022 CU25 <a href=\"https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/cumulativeupdate25\" target=\"_blank\">KB5081477</a> (RDS version 15.00.4255.1.v1).<br /> <br /> The GDR updates address vulnerabilities described in CVE-2026-40370. For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5090407, KB5081477. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
"last_updated": "2026-06-26 08:14:08 JST"
