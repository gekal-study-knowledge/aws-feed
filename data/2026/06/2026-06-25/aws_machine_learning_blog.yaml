    "title": "Huntington Bank: Redacting sensitive data from 400M+ documents with AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/huntington-bank-redacting-sensitive-data-from-400m-documents-with-aws/"
    "published": "2026-06-25 03:24:50"
    "fetched": "2026-06-25 03:48:51"
    "summary": "In this post, we walk through how Huntington built a scalable AWS solution to detect and redact Personally Identifiable Information (PII) and Payment Card Industry (PCI) data from over 400 million documents, reducing processing time from years to just a few months while achieving 95%+ redaction accuracy."
  "35d1017c17d3b793236b4c189e7dfaf1":
    "id": "35d1017c17d3b793236b4c189e7dfaf1"
    "title": "Build a healthcare appointment agent with Amazon Nova 2 Sonic"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-healthcare-appointment-agent-with-amazon-nova-2-sonic/"
    "published": "2026-06-25 03:20:27"
    "fetched": "2026-06-25 03:48:51"
    "summary": "In this post, you will learn how to build a voice agent that handles appointment reminder conversations using Amazon Nova 2 Sonic and Amazon Bedrock AgentCore. The agent authenticates patients by voice, manages appointments (confirm, cancel, or reschedule), collects pre-visit health information, and escalates to human staff when needed. You handle routine calls at scale, which can help reduce no-show rates. This sample focuses on the agentic side of the problem: voice conversation and tool orchestration. A browser-based interface is included for testing. To connect the agent to actual phone lines for outbound dialing, you would integrate a telephony service such as Amazon Connect Customer."
  "2875de3e380ba114ab9c8abe9f6b9dc6":
    "id": "2875de3e380ba114ab9c8abe9f6b9dc6"
    "title": "AI-powered BI with Snowflake and Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/ai-powered-bi-with-snowflake-and-amazon-quick/"
    "published": "2026-06-25 03:19:35"
    "fetched": "2026-06-25 03:48:51"
    "summary": "In this post, you will learn how to build an end-to-end integration between Snowflake semantic views and Amazon Quick. The sample data is user review data for a media company. You start by loading movie review data from Amazon Simple Storage Service (Amazon S3) into Snowflake, define a semantic view in SQL to add business meaning, explore it with natural-language queries through Cortex Analyst, and then generate an Amazon Quick dataset and dashboard. The dataset can be created manually or with a provided automation script. By the end, your BI team or AI team can ask natural-language questions against a governed data layer and trust that every response reflects the same business logic."
  "68805e5909d01a4861e5d931513995f7":
    "id": "68805e5909d01a4861e5d931513995f7"
    "title": "How Loka Built a Natural, Low-Latency Voice Agent with Amazon Nova 2 Sonic"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-loka-built-a-natural-low-latency-voice-agent-with-amazon-nova-2-sonic/"
    "published": "2026-06-25 01:56:24"
    "fetched": "2026-06-25 03:48:51"
    "summary": "In this post, we demonstrate the architecture and approach Loka used to solve a common frustration: robotic, slow voice assistants that cause customers to hang up, damaging brand reputation and driving up support costs."
