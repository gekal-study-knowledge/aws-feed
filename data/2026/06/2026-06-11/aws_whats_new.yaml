"entries":
  "cad37cea5f561ccc3c32b620a4e1f9a0":
    "id": "cad37cea5f561ccc3c32b620a4e1f9a0"
    "title": "Amazon EC2 M9g and M9gd general purpose instances are now available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ec2-m9g-m9gd-instances-graviton5-processors-available"
    "published": "2026-06-11 00:00:00"
    "fetched": "2026-06-11 01:32:36"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) <a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">M9g and M9gd instances</a>, powered by AWS Graviton5 processors, are generally available. AWS Graviton5 processors are the fifth generation of custom-designed AWS processors, delivering the best price performance for general purpose workloads running on <a href=\"https://aws.amazon.com/ec2/\">Amazon EC2</a>.</p> \n<p>​​M9g instances serve a broad range of general-purpose workloads including application servers, microservices, gaming, caching, and containers, while also delivering the performance needed for agentic AI use cases like real-time reasoning, code generation, and multi-step orchestration. &nbsp;</p> \n<p>​​M9gd instances offer local NVMe-based SSD block-level storage for customers that require high-speed, low-latency local storage, such as media processing, batch and log processing, and applications that need access to temporary storage including caches and scratch files.​</p> \n<p>​​​M9g and M9gd instances deliver up to 25% better compute performance compared to AWS Graviton4-based M8g and M8gd instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the Nitro Isolation Engine, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security​​</p> \n<p>M9g and M9gd instances are available in US East (N. Virginia, Ohio), US West (Oregon), and EU (Frankfurt) regions. M9g and M9gd instances are available for purchase via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts.</p> \n<p><a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">get started today.</a>&nbsp;</p>"
  "c61b42f7107004ca7c14548e68834c85":
    "id": "c61b42f7107004ca7c14548e68834c85"
    "title": "Amazon ECS Managed Daemons now support inter-task visibility and communication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ecs-managed-daemons-pid-ipc-modes/"
    "published": "2026-06-11 05:00:00"
    "fetched": "2026-06-11 08:25:31"
    "summary": "<p>Amazon ECS Managed Daemons now support inter-task visibility and communication, enabling customers to deploy tracing, profiling, and security agents that require access to application processes and shared IPC resources on <a href=\"https://aws.amazon.com/ecs/managed-instances/\">ECS Managed Instances</a>.<br /> <br /> With this launch, you can configure two new settings in ECS daemon definitions: pidMode controls whether the daemon can see all processes on the instance, and ipcMode controls whether the daemon shares an IPC namespace with other containers on the instance. Setting either to \"shared\" grants the daemon access to the respective namespace; the default of \"none\" keeps daemons isolated from application containers and other tasks. These settings let you run process-aware and IPC-dependent agents as ECS daemons instead of embedding them as sidecars in application task definitions. ECS places exactly one daemon task per managed instance and starts daemons before application tasks, so platform teams can deploy and update agents independently with consistent coverage across all workloads.<br /> <br /> To get started, register a daemon task definition specifying pidMode or ipcMode set to \"shared\" using the AWS Console, CLI, CloudFormation, or AWS SDKs, then create or update a daemon with associated ECS Managed Instances capacity providers in your clusters. This feature is now available in all AWS Regions at no additional cost. For more details, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-daemons-task-definitions.html#managed-daemons-taskdef-parameters\">documentation</a>.</p>"
  "7aa3c81e2697675c42465dbf82d52f18":
    "id": "7aa3c81e2697675c42465dbf82d52f18"
    "title": "OpenAI GPT-5.4 and GPT-5.5 models now available in US East (N. Virginia) on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/openai-gpt-us-east-virginia-amazon/"
    "published": "2026-06-11 09:12:00"
    "fetched": "2026-06-11 12:35:13"
    "summary": "<p>Today, AWS announces the expanded availability of OpenAI's GPT-5.4 and GPT-5.5 models, which are now available in the US East (N. Virginia) Region on Amazon Bedrock. With GPT-5.4 and GPT-5.5, you can build generative AI applications across reasoning, coding, computer use, document workflows, and long-running agentic tasks.<br /> <br /> GPT-5.5 is OpenAI's most capable model, designed for advanced coding, research, analysis, software operation, document workflows, and long-running agentic tasks. It can understand open-ended goals, use tools, reason across longer workflows, navigate ambiguity, and carry complex tasks through to completion with less orchestration. GPT-5.4 brings frontier reasoning, coding, computer use, long-context workflows, and tool use to production applications that interpret context, interact with tools, operate software environments, and verify outputs across multiple steps. Both models support a 272K-token context window, accept text and image input, and are available through the Responses API with support for server-side and client-side tool calling, projects, and response streaming.<br /> <br /> With this launch, GPT-5.4 and GPT-5.5 are now available in additional AWS Regions. To get started, visit the GPT-5.5 and GPT-5.4 model cards in our <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">documentation</a>.</p>"
  "81e46dc64a9ed83b429ee124916111b5":
    "id": "81e46dc64a9ed83b429ee124916111b5"
    "title": "Amazon OpenSearch Service launches MCP Apps for agentic observability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/opensearch-agentic-observability-mcp-app"
    "published": "2026-06-11 07:58:00"
    "fetched": "2026-06-11 17:41:56"
    "summary": "<p>Amazon OpenSearch Service now supports MCP Apps, bringing observability workflows directly into compatible agentic IDEs such as Claude Desktop and VS Code. With this capability, your AI agent in local environment can investigate incidents using logs, traces, metrics, and alerts stored in OpenSearch domains, collections and Amazon Managed Service for Prometheus. You can easily review and verify the results in interactive MCP App visualizations without leaving your local environment.<br /> <br /> Each MCP App tool call returns a dual response, a concise text summary for your agent to reason over and an interactive visualization rendered in the same conversation thread for you to review. You can work alongside your observability agent from firing an alert, perform root cause analysis, exploring distributed traces, service maps, PromQL metric charts, and cross-signal correlations all within a single conversation. Available MCP App tools cover log, metrics and trace investigation, service performance, topology, dynamic visualizations, agent health, cluster health, and instrumentation scoring.</p> \n<p><br /> The OpenSearch MCP app experience is available is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application.html\">Amazon OpenSearch UI</a> is offered. To get started, follow the instructions in <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-observability-mcp-app.html\">OpenSearch Agentic observability with MCP Apps</a>. To learn more about OpenSearch, visit <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html\">Amazon OpenSearch Service Developer Guid</a><a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html\">e</a>.</p>"
  "4a115b3f9dfba9b60f71797aa5f54c2e":
    "id": "4a115b3f9dfba9b60f71797aa5f54c2e"
    "title": "Amazon Managed Service for Prometheus now supports out of order sample ingestion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-managed-service-prometheus-outoforder-ingestion/"
    "published": "2026-06-11 22:00:00"
    "fetched": "2026-06-12 04:32:56"
    "summary": "<p><a href=\"https://aws.amazon.com/prometheus/\">Amazon Managed Service for Prometheus</a> now supports out-of-order sample ingestion and a workspace-level rule query offset. All workspaces have a default out-of-order time window of 1 minute, allowing the workspace to accept metric samples arriving outside strict chronological order. You can adjust this window to match your ingestion patterns or set it to 0 to disable the feature and discard out-of-order samples. You can also configure a global rule query offset that introduces a delay before rule evaluation queries run, giving late-arriving samples time to be ingested before rules execute.</p> \n<p>Together, these features reduce data loss and improve alerting accuracy for workloads with distributed collectors, batched exports, or variable network latency. Out-of-order sample support ensures late-arriving data points are ingested rather than discarded, preserving metric completeness. The rule query offset compensates for the expected ingestion delay. Without it, rules evaluate instantly and may miss samples that haven't landed yet, producing results that differ from the same expression evaluated after all metrics arrive. Two new CloudWatch vended metrics, OutOfOrderIngestionRate and OutOfOrderSampleAge give you visibility into ingestion patterns, helping you tune both settings for your workload.&nbsp;</p> \n<p>Out-of-order sample ingestion and rule query offset are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS regions</a> where Amazon Managed Service for Prometheus is generally available. To get started, configure the out-of-order time window and ruler query offset in your workspace settings via AWS console, API or CLI. For more information, see Amazon Managed Service for Prometheus <a href=\"https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-workspace-configuration.html\">user documentation.</a></p>"
  "f932d92f7db7aff63ceaea674a2c10ee":
    "id": "f932d92f7db7aff63ceaea674a2c10ee"
    "title": "AWS announces AWS Workload Credentials Provider"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-workload-credentials-provider/"
    "published": "2026-06-11 16:00:00"
    "fetched": "2026-06-12 04:32:56"
    "summary": "<p>AWS announces AWS Workload Credentials Provider, a lightweight client-side provider that automates deployment of exported certificates from AWS Certificate Manager (ACM) and local caching of secrets from AWS Secrets Manager across AWS and non-AWS workloads.<br /> <br /> Previously, customers exporting public or private certificates from ACM had to build custom automation using Amazon EventBridge to detect renewals and deploy the updated certificates. With public certificate lifetimes decreasing per the the Certification Authority Browser Forum (CA/B) mandate, this custom automation can become difficult to maintain at scale. AWS Workload Credentials Provider eliminates this complexity by providing a single provider that helps distribute and automate both secrets and certificates to your workloads. You configure it with your certificate ARN and specify options such as file paths and server reload behavior — the provider then handles certificate export and deployment automatically to prevent expiry related failures. It runs on Windows and Linux and supports Apache and NGINX web servers.<br /> <br /> For secrets caching, the provider maintains full backwards compatibility with the AWS Secrets Manager Agent, enabling you to securely cache application secrets locally across AWS and non-AWS workloads through the same unified provider.<br /> <br /> AWS Workload Credentials Provider is open source and available on <a href=\"https://github.com/aws/aws-workload-credentials-provider\">GitHub</a>. You can use it with exportable ACM certificates and Secrets Manager in all AWS Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate-automation.html\">AWS Certificate Manager documentation</a> or the <a href=\"https://docs.aws.amazon.com/secretsmanager/\">AWS Secrets Manager documentation</a>.</p>"
  "bca05c0699a3e027c818a13f7e19a7c9":
    "id": "bca05c0699a3e027c818a13f7e19a7c9"
    "title": "Gemma 4 models now available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/gemma-4-amazon-bedrock/"
    "published": "2026-06-11 04:17:00"
    "fetched": "2026-06-12 06:59:34"
    "summary": "<p>Today, AWS announces the availability of the Gemma 4 family of open-weight models from Google DeepMind on <a href=\"https://aws.amazon.com/bedrock/\">Amazon Bedrock</a>. With Gemma 4, you can build generative AI applications across reasoning, multimodal understanding, agentic, and software engineering workflows.</p> \n<p>The Gemma 4 family on Amazon Bedrock includes three variants—Gemma 4 31B, Gemma 4 26B-A4B, and Gemma 4 E2B—spanning dense and mixture-of-experts (MoE) architectures with built-in reasoning, native function calling, support for 35+ languages and multimodal input across text, image, video and audio. Gemma 4 31B is suited for reasoning- and coding-heavy workloads with a 256K-token context window, Gemma 4 26B-A4B targets cost- and latency-sensitive workloads, and Gemma 4 E2B is the smallest variant, designed for low-latency interactive use cases. Gemma 4 runs on a new innovation in Bedrock designed for price performance, with improved support for tool calling, structured output, reasoning, and response streaming, so customers can build reliable generative AI applications with open-source models.</p> \n<p>Gemma 4 models are available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), and Europe (Frankfurt). To get started, visit Gemma 4 model detail pages in our <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-google.html\">documentation.</a></p>"
  "577dbd8b1a73b75960fafda20505a93e":
    "id": "577dbd8b1a73b75960fafda20505a93e"
    "title": "Amazon Virtual Private Cloud (VPC) Flow Logs introduces additional metadata"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-flow-logs-metadata"
    "published": "2026-06-11 01:58:00"
    "fetched": "2026-06-12 06:59:34"
    "summary": "<p>Amazon Virtual Private Cloud (VPC) Flow Logs now supports EC2 resource tags and next-hop interface metadata, simplifying network monitoring and troubleshooting by eliminating the need to manually correlate flow log data with resource metadata.</p> \n<p>VPC Flow Logs enable you to capture and log information about your VPC network traffic to monitor and troubleshoot network traffic issues. With EC2 resource tag support, you can embed tag values from your network interfaces, EC2 instances, and auto scaling groups. This eliminates the need for you to join flow log data with separate tag metadata to correlate records with specific workloads. With next-hop metadata support, you can capture details about the next-hop network interface for each flow, including its interface ID, subnet, Availability Zone, VPC, and interface type. These fields help you understand how traffic traverses through network resources such as NAT Gateways, Network Load Balancers, and Transit Gateways without requiring manual correlation of multiple data sources.<br /> <br /> VPC Flow Logs EC2 resource tag and next-hop metadata support is available in the following AWS Regions: US East (Ohio, N. Virginia), US West (Northern California, Oregon), Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Melbourne, Mumbai, Osaka, Seoul, Singapore, Sydney, Tokyo, Auckland, Taipei, Bangkok, Malaysia), Canada (Central), Canada West (Calgary), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), Israel (Tel Aviv), South America (Sao Paulo), Mexico (Central), European Sovereign Cloud (Germany), and AWS GovCloud (US-East, US-West) Regions. To get started, see the VPC Flow Logs <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html\">documentation</a>.</p>"
"last_updated": "2026-06-12 06:59:34 JST"
