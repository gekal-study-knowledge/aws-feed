    "title": "Amazon S3 server access logs now deliver to Amazon CloudWatch Logs and Amazon S3 Tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-s3-cloudwatch-logs-tables/"
    "published": "2026-06-29 13:00:00"
    "fetched": "2026-06-30 06:22:18"
    "summary": "<p>Amazon S3 now supports delivering server access logs to Amazon CloudWatch Logs, giving you instant querying, alarms, cross-account and cross-Region aggregation, and AWS Key Management Service (KMS) encryption for your access log data. You can also mirror your logs to Amazon S3 Tables in Apache Iceberg format at no additional storage cost. These new delivery paths complement the existing free delivery of server access logs to S3 general purpose buckets, giving you more flexibility in how you monitor and analyze access to your data.<br /> <br /> With delivery to CloudWatch Logs, you can set alarms on error rates, monitor traffic patterns, investigate access incidents across accounts and Regions, and correlate S3 access activity with the rest of your operational data. Logs mirrored to S3 Tables are immediately queryable with standard SQL in Amazon Athena, Amazon Redshift, and other Iceberg-compatible query engines, so you can audit access patterns, analyze usage trends, and identify cost drivers across buckets over time.<br /> <br /> S3 server access logs delivery to CloudWatch Logs is available today in all AWS Regions, except for AWS China Regions and AWS GovCloud (US) Regions. To learn more, see the <a href=\"https://aws.amazon.com/s3\" target=\"_blank\">Amazon S3 webpage</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerLogs.html\" rel=\"noopener noreferrer\" target=\"_blank\">server access logging</a> in the Amazon S3 User Guide, and the <a href=\"https://aws.amazon.com/blogs/storage/query-amazon-s3-access-logs-instantly-with-cloudwatch-and-s3-tables/\" target=\"_blank\">AWS Storage Blog post</a>.</p>"
"last_updated": "2026-06-30 06:22:18 JST"
