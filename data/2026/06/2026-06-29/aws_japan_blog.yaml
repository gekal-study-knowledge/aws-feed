  "b238bb9e1d8493202eb3927fd5a4ed1f":
    "id": "b238bb9e1d8493202eb3927fd5a4ed1f"
    "title": "週刊AWS – 2026/6/22週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260622/"
    "published": "2026-06-29 17:24:06"
    "fetched": "2026-06-29 19:49:27"
    "summary": "Amazon Connect Customer が Agentic CX designer (NLX) を Preview 開始、AWS Network Firewall がデフォルト drop action を server-directed only に変更、AWS Lambda MicroVMs で分離実行環境を提供開始、Claude Tag が AWS Marketplace の Claude Enterprise でベータ提供、Amazon GuardDuty AI-powered investigations を Preview 開始、Amazon CloudWatch Logs がマネージド syslog 取り込みに対応、Amazon CloudWatch がダッシュボードのタグ機能をサポート、Amazon Route 53 Global Resolver が AWS RAM での DNS View 共有に対応、AWS IoT Device SDK for Swift が GA、Amazon EC2 が AMI Watermarks 機能を発表等"
  "e5fcf98f8a6b558087e15f5b6915cfd2":
    "id": "e5fcf98f8a6b558087e15f5b6915cfd2"
    "title": "Kiro で OpenAPI/Swagger 仕様から数秒でテストスイートを生成する"
    "link": "https://aws.amazon.com/jp/blogs/news/from-openapi-swagger-to-test-suite-in-seconds-with-kiro/"
    "published": "2026-06-29 16:27:10"
    "fetched": "2026-06-29 19:49:27"
    "summary": "API 仕様とテストの乖離は開発現場の慢性的な課題です。本記事では、エージェント駆動の開発システム Kiro を使い、Swagger/OpenAPI 仕様から axios ベースの HTTP テスト、Express のモックサーバー、モックと実 API を切り替える設定、HTML レポートまでを含む Node.js テストスイートを数秒で自動生成する方法を解説します。Petstore API を例にステアリングファイルの活用、生成されたテスト品質、削除ライフサイクル検証、認証付き内部 API への適応、ヘッドレスモードによる CI/CD 自動再生成まで紹介します。"
  "e45ab02e41bdeec033a5b6fbae1f45ed":
    "id": "e45ab02e41bdeec033a5b6fbae1f45ed"
    "title": "キヤノンIT ソリューションズ様と取り組むホテルのフードロス削減 – 時系列基盤モデル Chronos-2 で最適な提供量を予測する"
    "link": "https://aws.amazon.com/jp/blogs/news/sustainability-case-study-canon-its-chronos-2-foodloss-management/"
    "published": "2026-06-29 23:41:35"
    "fetched": "2026-06-29 23:45:17"
    "summary": "本ブログでは、サステナビリティを組み込む取り組みの一例として、キヤノンITソリューションズ様と共同で取り組んだ Chronos-2 による需要予測を起点としたフードロス削減 PoC について、アーキテクチャと技術的なポイントをご紹介します。"
