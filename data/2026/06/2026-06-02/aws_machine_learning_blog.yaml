    "fetched": "2026-06-02 06:28:38"
    "summary": "While deploying Model Context Protocol (MCP) servers in production, enterprises need fine-grained access control across servers, observability into which teams use which tools, security guarantees against data exfiltration, and centralized credential management, all at scale. Amazon Bedrock AgentCore Gateway sits between MCP servers and the clients that consume them, centralizing credential management, observability, and secure […]"
  "11a3674232dcc86d2bf4463d2ecacdf9":
    "id": "11a3674232dcc86d2bf4463d2ecacdf9"
    "title": "Secure AI agents with Policy and Lambda interceptors in Amazon Bedrock AgentCore gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/secure-ai-agents-with-policy-and-lambda-interceptors-in-amazon-bedrock-agentcore-gateway/"
    "published": "2026-06-02 02:54:22"
    "fetched": "2026-06-02 06:28:38"
    "summary": "In this post, we use a lakehouse data agent to demonstrate how you can use Policy for deterministic access control and Lambda interceptors for dynamic validation. We then show how to combine Lambda interceptors and Policy to implement a geography-based access control which requires both dynamic validation and deterministic access control."
  "ac6e97861821f12e8683cb1f5b0b4703":
    "id": "ac6e97861821f12e8683cb1f5b0b4703"
    "title": "Reference your own AWS Secrets Manager secrets in Amazon Bedrock AgentCore Identity"
    "link": "https://aws.amazon.com/blogs/machine-learning/reference-your-own-aws-secrets-manager-secrets-in-amazon-bedrock-agentcore-identity/"
    "published": "2026-06-02 07:16:28"
    "fetched": "2026-06-02 08:24:53"
    "summary": "Today, we’re excited to announce the ability to reference a secret in AWS Secrets Manager for AgentCore Identity, so you can reference your own preconfigured secret from Secrets Manager and retain full control over how it is managed. With this ability, you can extend your organization’s existing secrets governance processes to AgentCore. You can provide an existing, preconfigured AWS Secrets Manager secret to use with your credential provider resources. You retain full control over its encryption configuration, rotation, replication, tags, and resource policies, just as you would manage other secrets in Secrets Manager. You can also choose a secret from another AWS account within the same AWS Region, though cross-Region secret sharing isn’t supported. This also supports secrets brought in through AWS Secrets Manager external connectors, enabling integration with third-party secret managers."
  "7f03388879533f82caad0e464b6c5c77":
    "id": "7f03388879533f82caad0e464b6c5c77"
    "title": "Transforming rare cancer research with Amazon Quick: Integrating biomedical databases for breakthrough discoveries"
    "link": "https://aws.amazon.com/blogs/machine-learning/transforming-rare-cancer-research-with-amazon-quick-integrating-biomedical-databases-for-breakthrough-discoveries/"
    "published": "2026-06-02 06:54:16"
    "fetched": "2026-06-02 08:24:53"
    "summary": "In this post, we walk through how to use Amazon Quick Research to integrate biomedical data sources for rare cancer research. The walkthrough uses pediatric sarcoma as the research domain and draws on publicly available datasets from PubMed and other open biomedical repositories. It covers the end-to-end workflow: defining a research objective, configuring data sources, reviewing the AI-generated research plan, running the investigation, and iterating on results using the revision and versioning system."
