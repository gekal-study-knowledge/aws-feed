    "title": "Secure AI agents with Policy and Lambda interceptors in Amazon Bedrock AgentCore gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/secure-ai-agents-with-policy-and-lambda-interceptors-in-amazon-bedrock-agentcore-gateway/"
    "published": "2026-06-02 02:54:22"
    "fetched": "2026-06-02 06:28:38"
    "summary": "In this post, we use a lakehouse data agent to demonstrate how you can use Policy for deterministic access control and Lambda interceptors for dynamic validation. We then show how to combine Lambda interceptors and Policy to implement a geography-based access control which requires both dynamic validation and deterministic access control."
