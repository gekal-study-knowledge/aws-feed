  "0908b527da2402ed0878e55196d68085":
    "id": "0908b527da2402ed0878e55196d68085"
    "title": "AWS Network Firewall updates default drop action for improved connection reliability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-network-firewall-updates-default-drop-action"
    "published": "2026-06-23 02:00:00"
    "fetched": "2026-06-23 05:40:47"
    "summary": "<p><a href=\"https://aws.amazon.com/network-firewall/\">AWS Network Firewall</a> now uses \"Application drop established (server-directed only)\" as the default stateful action for all newly created firewall policies, replacing the previous default of \"Application drop established (bidirectional)\" (formerly named \"Application layer drop established\"). No action is required to benefit from this change when creating new policies.<br /> <br /> AWS Network Firewall is a managed service that lets you deploy network protections across your Amazon VPCs. Previously, the “Application drop established (bidirectional)” default could silently drop legitimate server-to-client TCP packets, such as window updates, keep-alives, and resets — causing intermittent connection failures that were difficult to diagnose. With the safer default now in place, new policies avoid this issue.<br /> <br /> If your existing environment requires “Application drop established (bidirectional)” to support post-quantum cryptography (PQC) fragmented TLS handshakes, refer to our documentation for guidance on on switching to \"Application drop established (server-directed only)\" or adding the “to_server” flag to your TCP drop rules so legitimate flow control packets are not blocked.<br /> <br /> This update is available in all AWS Regions where AWS Network Firewall is offered. To get started, see <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/suricata-rule-evaluation-order.html\">Managing evaluation order for Suricata compatible rules</a> in the AWS Network Firewall service documentation.</p>"
  "1bae80cc6ddaedb5615993cbb98fffe4":
    "id": "1bae80cc6ddaedb5615993cbb98fffe4"
    "title": "AWS Batch now supports customer-ordered instance allocation strategies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/batch-ordered-allocation-strategies/"
    "published": "2026-06-23 01:30:00"
    "fetched": "2026-06-23 05:40:47"
    "summary": "<p>AWS Batch now offers the Best Fit Progressive Ordered (BFPO) and Spot Capacity Optimized Prioritized (SCOP) allocation strategies, giving you more control over instance type prioritization in your compute environments. BFPO and SCOP enable you to manually define instance type ordering based on your workload-specific performance characteristics.<br /> <br /> To use these features in AWS Batch, specify BEST_FIT_PROGRESSIVE_ORDERED allocation strategy for your on-demand compute environments or SPOT_CAPACITY_OPTIMIZED_PRIORITIZED for your Amazon EC2 Spot compute environments and provide an ordered list of instance types or families. These features are available via the AWS Batch API (<i>CreateComputeEnvironment </i>or <i>UpdateComputeEnvironment</i>) or the AWS Batch Management Console.<br /> <br /> BFPO and SCOP allocation strategies are supported today in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/allocation-strategies.html\">AWS Batch User Guide</a>.</p>"
  "d0b309af46e85b17161a6db3c661f56a":
    "id": "d0b309af46e85b17161a6db3c661f56a"
    "title": "AWS IAM Identity Center now supports separate quotas for AWS accounts and applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-identity-center-separate-quotas/"
    "published": "2026-06-23 01:07:00"
    "fetched": "2026-06-23 05:40:47"
    "summary": "<p>AWS IAM Identity Center now supports separate quotas for the number of AWS accounts and applications that can be configured in an IAM Identity Center instance. By default, you can configure up to 7,000 AWS accounts and up to 7,000 applications independently, so that using more of one does not consume capacity from the other. Quotas can be further increased by submitting a quota increase request through AWS Service Quotas console.</p> \n<p>Customers with existing higher limits are automatically granted the same limit for both accounts and applications, with no action required. Organizations managing thousands of AWS accounts can now onboard applications without consuming account quota capacity.</p> \n<p>This update is available in all AWS Regions where IAM Identity Center is available.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/limits.html\" rel=\"noopener noreferrer\" target=\"_blank\">Quotas for IAM Identity Center</a>. Visit the <a href=\"https://aws.amazon.com/iam/identity-center/\" rel=\"noopener noreferrer\" target=\"_blank\">IAM Identity Center product page</a> to get started.</p>"
  "e470c8ae538c28cf1673d0f83bf5da7e":
    "id": "e470c8ae538c28cf1673d0f83bf5da7e"
    "title": "AWS HealthOmics now supports Nextflow profiles"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-healthomics-nextflow-profiles/"
    "published": "2026-06-23 07:00:00"
    "fetched": "2026-06-23 09:01:51"
    "summary": "<p>AWS HealthOmics now supports Nextflow profiles, enabling customers to activate predefined execution settings at run time. Nextflow profiles allow customers to define reusable settings and select them at the point of execution, making it easy to switch between execution settings without modifying workflow source code. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p> \n<p>With Nextflow profiles, you can cleanly separate platform-specific settings such as resource limits or execution options from core workflow logic. You can switch between development and production settings without creating separate workflow definitions. This reduces errors from manual edits, accelerates workflow portability, and saves time when scaling from development to production. If you use nf-core workflows, you can now activate the built-in and institutional profiles those pipelines already ship with.</p> \n<p>You can now specify one or more Nextflow profiles in your workflow runs in all AWS HealthOmics Regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Singapore, Seoul). To learn more, visit the Nextflow Profiles section on HealthOmics <a href=\"https://docs.aws.amazon.com/omics/latest/dev/starting-a-run.html#start-run-api-engine-settings\">Nextflow engine settings</a> documentation.</p>"
  "b41a01bf132e7cb30724fbf0ce96fc23":
    "id": "b41a01bf132e7cb30724fbf0ce96fc23"
    "title": "AWS introduces Lambda MicroVMs for isolated execution of user and AI-generated code"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-lambda-microvms/"
    "published": "2026-06-23 05:37:00"
    "fetched": "2026-06-23 09:01:51"
    "summary": "<p>AWS introduces Lambda MicroVMs, a new serverless compute primitive that provides VM-level isolation, near-instant launch and resume speeds, and state preservation for executing user or AI-generated code. You can now give each user or job their own compute environment to securely run code without managing virtualization infrastructure or choosing between isolation, speed, and state retention.</p> \n<p>Developers are increasingly building multi-tenant applications that execute code supplied by end users or AI for use cases such as interactive coding environments, data analytics platforms, coding assistants, and vulnerability scanning platforms. For these applications, developers need to allocate a separate, isolated execution environment per user or session to limit the impact of incorrect or malicious code on other concurrently running users or jobs. Previously, developers needed to choose between strong isolation, fast launch times, and state retention when building these applications. Starting today, Lambda MicroVMs provides you these capabilities without any trade-offs. You get VM-level isolation, near-instant launch speeds, and the ability to suspend and resume execution for up to 8 hours. Lambda MicroVMs is built on Firecracker virtualization, the technology powering more than 15 trillion monthly Lambda Function invocations.&nbsp;</p> \n<p>To get started, create a MicroVM image from your Dockerfile, then launch MicroVMs from that image. Give each user or job their own MicroVM with a dedicated HTTPS URL that supports popular connectivity protocols such as HTTP/2, gRPC, and WebSockets.&nbsp;</p> \n<p>Lambda MicroVMs is available today in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda MicroVMs developer guide</a>&nbsp;and the <a href=\"https://aws.amazon.com/blogs/aws/run-isolated-sandboxes-with-full-lifecycle-control-aws-lambda-introduces-microvms\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog post</a>. Get started with MicroVMs through the AWS Lambda console, AWS CloudFormation, AWS Cloud Development Kit, or use the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/serverless-skills/aws-lambda-microvms\" rel=\"noopener noreferrer\" target=\"_blank\">Agent Toolkit for AWS</a>&nbsp;with your preferred Agentic development tools. You pay for baseline compute resources while your MicroVM is running, and only for the active duration of additional resources consumed when your workload exceeds the baseline. To learn more about pricing, see <a href=\"https://aws.amazon.com/lambda/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Lambda MicroVMs pricing</a>.</p>"
  "69f4c0f3cf062f12fa0e3ba805acff81":
    "id": "69f4c0f3cf062f12fa0e3ba805acff81"
    "title": "Amazon MSK now offers AI Agent Skills to help developers operate MSK efficiently and accelerate migrations to MSK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-msk-ai-agent-skills"
    "published": "2026-06-23 00:00:00"
    "fetched": "2026-06-23 09:01:51"
    "summary": "<p>Amazon MSK now offers AI Agent Skills that give AI coding assistants expert, up-to-date guidance for operating Amazon MSK. The skills provide expert guidance for common operational tasks such as troubleshooting, sizing, configuring, monitoring, and migration from external Kafka clusters.<br /> <br /> Teams can leverage these skills to keep their clusters healthy and performant, and to migrate their external Kafka workloads to MSK Express to take advantage of up to 3 times more throughput per broker, scale up to 20 times faster, and reduced recovery time by 90 percent as compared to Standard brokers running Apache Kafka. The skills turn tasks that once required specialized knowledge into a guided experience developers can complete quickly, on their own.<br /> <br /> You can use the MSK skills with your existing AI coding agent - Kiro, Claude Code, or Cursor. To get started, configure the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/what-is-agent-toolkit.html\">Agent Toolkit for AWS</a> using the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/aws-cli.html\">AWS CLI</a>, then ask your coding agent a question, such as <i>\"What broker type and size should I use for my MSK cluster?\" or </i>\"Is my Kafka cluster compatible with MSK Express?\"</p>"
  "3e493401be5839bf50b29539d2a26955":
    "id": "3e493401be5839bf50b29539d2a26955"
    "title": "AWS Transform for migrations now supports all AWS commercial regions as migration targets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-migrations-region-expansion/"
    "published": "2026-06-23 02:30:40"
    "fetched": "2026-06-23 20:57:06"
    "summary": "<p>AWS Transform for migrations now supports all AWS commercial regions as migration targets. A migration target region is the AWS region where migrated resources are deployed, including landing zones, network infrastructure, and server rehosting. Customers can now deploy workloads in any commercial region, making it easier to meet data residency requirements.<br /> <br /> The new migration target regions are: US East (N. California), Africa (Cape Town), Asia Pacific (Bangkok), Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Jakarta), Asia Pacific (Kuala Lumpur), Asia Pacific (Melbourne), Asia Pacific (New Zealand), Asia Pacific (Taipei), Canada (Calgary), Europe (Milan), Europe (Spain), Europe (Zurich), Mexico (Querétaro) and Middle East (Tel Aviv).<br /> <br /> Target region selection is available in the AWS Transform for migrations workflow. For the most up-to-date availability information, see the supported migration <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\">target region list</a>.</p>"
"last_updated": "2026-06-23 20:57:06 JST"
