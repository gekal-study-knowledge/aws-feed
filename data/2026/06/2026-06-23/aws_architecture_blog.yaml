    "title": "Secure multi-tenant RAG with Amazon Bedrock and Verified Permissions"
    "link": "https://aws.amazon.com/blogs/architecture/secure-multi-tenant-rag-with-amazon-bedrock-and-verified-permissions/"
    "published": "2026-06-23 01:49:13"
    "fetched": "2026-06-23 02:28:16"
    "summary": "This post walks you through a two-layer, defense-in-depth authorization pattern for granular, intra-tenant access control in RAG applications. Defense in depth is a security strategy that uses multiple independent layers of protection. Each layer operates independently. If one layer is misconfigured, the other layer still enforces access control. The pattern runs on Amazon Bedrock, a fully managed service that offers a choice of high-performing foundation models (FMs) from Amazon and AI companies through a single API, along with a broad set of capabilities you need to build generative AI applications with security, privacy, and responsible AI."
  "a27fad10e024f2c4af97ed4bbf8d3f11":
