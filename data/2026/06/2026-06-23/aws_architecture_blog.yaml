    "title": "Modernizing financial analytics with Amazon SageMaker Unified Studio"
    "link": "https://aws.amazon.com/blogs/architecture/modernizing-financial-analytics-with-amazon-sagemaker-unified-studio/"
    "published": "2026-06-23 01:42:55"
    "fetched": "2026-06-23 02:28:16"
    "summary": "Avanse Financial Services, India’s leading education loan providers, migrated to a cloud-native lakehouse architecture using Amazon SageMaker Unified Studio, which unified their data engineering, analytics, and artificial intelligence (AI) workflows in a single governed environment on AWS. In this post, we walk through their migration journey so you can adapt their approach to your own environment."
  "eaedc0ac29cda457aef927e5e92029cc":
    "id": "eaedc0ac29cda457aef927e5e92029cc"
    "title": "Architecting AI-powered resilience framework on AWS"
    "link": "https://aws.amazon.com/blogs/architecture/architecting-ai-powered-resilience-framework-on-aws/"
    "published": "2026-06-23 01:35:07"
    "fetched": "2026-06-23 02:28:16"
    "summary": "In this post, you’ll learn how to architect and implement a five-layer AI-powered resilience framework that automatically discovers dependencies, generates targeted experiments, and integrates with your existing Continuous Integration/Continuous Deployment (CI/CD) pipelines. First, we’ll explore the key challenges in resilience testing. Then, we’ll walk through the five-layer architecture that solves these challenges. Finally, we’ll show you how to implement this, with phased rollout guidance for pilot, expansion, and organization-wide deployment."
