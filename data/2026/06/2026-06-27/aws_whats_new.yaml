    "title": "Amazon EC2 R8g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-r8g-instances-additional-regions/"
    "published": "2026-06-27 00:00:00"
    "fetched": "2026-06-27 05:43:59"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8g instances are available in AWS Asia Pacific (Thailand, New Zealand), AWS Africa (Cape Town), AWS Europe (Milan), and AWS Canada West (Calgary) regions. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 R8g instances are ideal for memory-intensive workloads such as databases, in-memory caches, and real-time big data analytics. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which offloads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads.<br /> <br /> AWS Graviton4-based Amazon EC2 instances deliver the best performance and energy efficiency for a broad range of workloads running on Amazon EC2. AWS Graviton4-based R8g instances offer larger instance sizes with up to 3x more vCPU (up to 48xlarge) and memory (up to 1.5TB) than Graviton3-based R7g instances. These instances are up to 30% faster for web applications, 40% faster for databases, and 45% faster for large Java applications compared to AWS Graviton3-based R7g instances. R8g instances are available in 12 different instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS).<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\">Amazon EC2 R8g Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
