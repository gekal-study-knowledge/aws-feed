    "title": "AWS FinOps Agent is now available in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-finops-agent-preview/"
    "published": "2026-06-10 00:28:00"
    "fetched": "2026-06-10 02:59:06"
    "summary": "<p>Today, AWS announces the preview of AWS FinOps Agent, a frontier agent for FinOps practitioners and engineering teams that answers cost questions, surfaces optimization opportunities, automatically investigates cost anomalies, and runs recurring FinOps workflows on a schedule you define.</p> \n<p>With&nbsp;the&nbsp;AWS FinOps Agent, you can ask&nbsp;questions&nbsp;about your AWS costs&nbsp;and generate cloud cost reports for finance and engineering teams. The agent surfaces rightsizing, idle resource, and Savings Plans recommendations from AWS Cost Optimization Hub and AWS Compute&nbsp;Optimizer, and&nbsp;can open Jira tickets on your behalf. When a cost anomaly is detected, FinOps Agent can automatically investigate the root cause and&nbsp;can&nbsp;post the findings to a Slack channel, so engineering teams are notified without manual triage.</p> \n<p>AWS FinOps Agent&nbsp;(preview)&nbsp;is available in the US East (N. Virginia) Region and includes cost and usage data covering all AWS Regions, except AWS GovCloud (US) Regions and AWS China (Beijing and Ningxia) Regions. AWS FinOps Agent is offered at no&nbsp;additional&nbsp;charge during the preview.</p> \n<p>Learn more about AWS FinOps Agent in the&nbsp;<a href=\"https://docs.aws.amazon.com/finops-agent/latest/userguide/what-is.html\">User Guide</a>,&nbsp;<a href=\"http://aws.amazon.com/finops-agent\">product details page</a>, and the&nbsp;<a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/aws-finops-agent-is-now-public-preview\">blog</a>. Get started by visiting the AWS FinOps Agent page in the AWS Management Console.</p>"
  "07aa2dc5bfb5acbc3173518ce030aea1":
    "id": "07aa2dc5bfb5acbc3173518ce030aea1"
    "title": "Amazon SageMaker Unified Studio Notebooks now support EMR Serverless"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-sagemaker-unified-studio-emr/"
    "published": "2026-06-10 03:46:00"
    "fetched": "2026-06-10 07:21:04"
    "summary": "<p>Amazon SageMaker Unified Studio Notebooks now support Amazon EMR Serverless with Apache Spark Connect, giving data engineers and analysts more flexibility in choosing their Spark runtime for interactive analytics and data engineering workloads. In addition to Amazon Athena Spark, users can now leverage Amazon EMR Serverless as their Spark runtime, selecting the optimal engine based on their requirements.</p> \n<p>With this launch, you can run PySpark and Spark SQL on an EMR Serverless Spark Application in Notebook cells. Users can select their Spark runtime from the Notebook side panel, and the selected runtime applies to both Python and SQL cells. Additionally, users can leverage SageMaker Data Agent, the built-in AI assistant, to generate code and execution plans from natural language prompts, accelerating Spark development workflows with EMR Serverless. Organizations can leverage pre-initialized capacity to improve session start times, while benefiting from unified Spark UI monitoring across all supported engines for consistent visibility into job execution and performance. Additionally, EMR Serverless provides VPC connectivity support for workloads requiring network isolation.</p> \n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all AWS Regions where Amazon SageMaker Unified Studio</a> is available, supporting both SageMaker Unified Studio notebooks and JupyterLab IDE environments. To get started, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks-spark-connect.html\">Amazon SageMaker Unified Studio User Guide</a>.</p>"
  "2d466866c2bd6e6a121df8b215a8c07f":
    "id": "2d466866c2bd6e6a121df8b215a8c07f"
    "title": "Amazon S3 Access Grants are now available in the AWS European Sovereign Cloud (Germany) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-s3-access-grants-european-sovereign-cloud-germany-region"
    "published": "2026-06-10 02:14:00"
    "fetched": "2026-06-10 07:21:04"
    "summary": "<p>You can now create Amazon S3 Access Grants in the AWS European Sovereign Cloud (Germany) Region.</p> \n<p>Amazon S3 Access Grants map identities in directories such as Microsoft Entra ID, or AWS Identity and Access Management (IAM) principals, to datasets in S3. This helps you manage data permissions at scale by automatically granting S3 access to end users based on their corporate identity.</p> \n<p>Visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-grants-limitations.html\">AWS Region Table</a> for complete regional availability information. To learn more about Amazon S3 Access Grants, visit our <a href=\"https://aws.amazon.com/s3/features/access-grants/\">product page</a>.</p>"
  "6456d79d0f5c609c1eadadd8fcfb091c":
    "id": "6456d79d0f5c609c1eadadd8fcfb091c"
    "title": "Amazon FSx for OpenZFS Intelligent-Tiering storage class is now available in 8 additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-fsx-openzfs/"
    "published": "2026-06-10 05:52:00"
    "fetched": "2026-06-11 01:32:36"
    "summary": "<p>You can now create Amazon FSx for OpenZFS file systems with the Intelligent-Tiering storage class in 8 additional AWS Regions across the US, Europe, Asia Pacific, and South America.</p> \n<p>FSx Intelligent-Tiering is built for general-purpose file workloads such as file shares, archives, media libraries, and migrations from on-premises HDD storage. It automatically moves your data across three storage tiers (Frequent Access, Infrequent Access, and Archive) based on access patterns, and an optional SSD read cache keeps your active data fast. You get high performance for active workloads and low-cost storage for everything else, paying only for what you store with no capacity to manage. With FSx Intelligent-Tiering, you can save up to 85% compared to the FSx SSD storage class and up to 20% compared to on-premises HDD-based NAS.</p> \n<p>With this expansion, the FSx Intelligent-Tiering storage class is now available for FSx for OpenZFS file systems in the following additional AWS Regions: US West (N. California), Europe (London, Stockholm, Spain, Zurich), Asia Pacific (Hyderabad, Seoul), and South America (São Paulo). To learn more, visit the <a href=\"https://aws.amazon.com/fsx/intelligent-tiering/\">FSx Intelligent-Tiering page</a> and the <a href=\"https://aws.amazon.com/fsx/openzfs/\">Amazon FSx for OpenZFS product page</a>, and see the FSx for OpenZFS <a href=\"https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/available-aws-regions.html\">Region Table</a> for complete regional availability information.</p>"
"last_updated": "2026-06-11 01:32:36 JST"
