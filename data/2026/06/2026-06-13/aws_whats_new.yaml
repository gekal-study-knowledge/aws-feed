    "fetched": "2026-06-13 08:13:43"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for NVIDIA Nemotron 3 Nano model using supervised fine-tuning (SFT) and reinforcement fine-tuning (RFT). This is a popular open-weight model from NVIDIA with 30B total parameters. In addition to deploying this model on SageMaker AI, you can now adapt it to your specific domains and workflows.</p> \n<p>Model customization enables you to tailor foundation models with your proprietary data, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or enhancing performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.<br /> <br /> Serverless model customization for NVIDIA Nemotron 3 Nano on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
  "8c74e9749611a83e69d2c7b2b68c97db":
    "id": "8c74e9749611a83e69d2c7b2b68c97db"
    "title": "Announcing Web Search on Amazon Bedrock AgentCore for Agentic Web Retrieval"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-web-search/"
    "published": "2026-06-13 00:22:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>As AI agents become more capable, they need access to information beyond a model's training data - to answer questions, retrieve latest facts, and take action grounded in current developments. Today, we're making that easy with the general availability of Web Search on AgentCore. Web Search is a fully managed tool that enables agents to ground responses in current, accurate web knowledge while keeping data residency within your secured AWS environment with zero data egress.<br /> <br /> Previously, adding web search to agents on Amazon Bedrock AgentCore required integrating with external search providers, building custom orchestration, managing authentication and billing, and coordinating security and compliance across multiple services. Web Search removes this undifferentiated heavy lifting, enabling developers to focus on building agents.<br /> <br /> Web Search is built on Amazon’s proven search infrastructure, informed by years of experience powering agentic search experiences across Alexa+, Amazon Q Business, and Kiro. It uses a multi-source grounding approach, by combining a web index operated by amazon with structured knowledge graph data. Beyond standard web results, this gives agents access to entity data and verified facts, helping them retrieve more relevant and accurate responses than traditional web search alone.<br /> <br /> Web Search is optimized for agentic retrieval, returning short high-value excerpts that deliver strong intelligence per token. The tool is exposed as a built-in connector target on AgentCore gateway using the Model Context Protocol (MCP). Your agent sends a natural-language query, and Web Search returns ranked results with relevant snippets, source URLs, titles, and publication dates that the model can reason over to produce a grounded response.<br /> <br /> Web Search on AgentCore is generally available today in the AWS Region: US East (N. Virginia). For more information, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/\">AgentCore documentation</a> or read the <a href=\"https://aws.amazon.com/blogs/aws/announcing-web-search-on-amazon-bedrock-agentcore-ground-your-ai-agents-in-current-accurate-web-knowledge/\">AWS News Blog</a>.</p>"
"last_updated": "2026-06-18 01:36:37 JST"
