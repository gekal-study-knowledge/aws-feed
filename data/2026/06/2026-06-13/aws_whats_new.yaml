  "52e4d56e4efd2a018a850336918b73c3":
    "id": "52e4d56e4efd2a018a850336918b73c3"
    "title": "Amazon EC2 I7i instances now available in AWS Europe (Paris) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-i7i-instances-europe-paris-region/"
    "published": "2026-06-13 01:00:00"
    "fetched": "2026-06-13 04:01:59"
    "summary": "<p>AWS is announcing the availability of high performance Storage optimized Amazon EC2 I7i instances in AWS Europe (Paris) region. Powered by 5th Gen Intel Xeon Processors with an all-core turbo frequency of 3.2 GHz, these new instances deliver up to 23% better compute performance and more than 10% better price performance over previous generation I4i instances. Powered by 3rd generation AWS Nitro SSDs, I7i instances offer up to 45TB of NVMe storage with up to 50% better real-time storage performance, up to 50% lower storage I/O latency, and up to 60% lower storage I/O latency variability compared to I4i instances.<br /> <br /> I7i instances offer compute and storage performance for x86-based storage optimized instances in Amazon EC2 ideal for I/O intensive and latency-sensitive workloads that demand very high random IOPS performance with real-time latency to access the small to medium size datasets. Additionally, torn write prevention feature support up to 16KB block sizes, enabling customers to eliminate database performance bottlenecks.<br /> <br /> I7i instances are available in eleven sizes - nine virtual sizes up to 48xlarge and two bare metal sizes - delivering up to 100Gbps of network bandwidth and 60Gbps of Amazon Elastic Block Store (EBS) bandwidth. To learn more, visit the I7i instances <a href=\"https://aws.amazon.com/ec2/instance-types/i7i/\">page</a>.</p>"
  "125d3c798b071c934b9b1b748f54fed2":
    "id": "125d3c798b071c934b9b1b748f54fed2"
    "title": "SageMaker AI now supports serverless fine-tuning for Nvidia Nemotron models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-sagemaker-ft-nemotron-3/"
    "published": "2026-06-13 02:00:00"
    "fetched": "2026-06-13 06:28:28"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Nvidia Nemotron 3 Nano model using supervised fine-tuning (SFT) and reinforcement fine-tuning (RFT). This is a popular open-weight model from Nvidia with 30B total parameters. In addition to deploying this model on SageMaker AI, you can now adapt it to your specific domains and workflows.</p> \n<p>Model customization enables you to tailor these foundation models with your proprietary data, whether that's improving accuracy on domain-specific tasks, aligning outputs with your organization's tone, or enhancing performance on new tasks using your labeled data. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.<br /> <br /> Serverless model customization for Nvidia Nemotron 3 Nano on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customize-model.html\">model customization documentation.</a></p>"
  "695096587e0e69de5cc57bd7555a2476":
    "id": "695096587e0e69de5cc57bd7555a2476"
    "title": "Amazon Lightsail is now available in three additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-lightsail-aws-regions/"
    "published": "2026-06-13 05:43:00"
    "fetched": "2026-06-13 08:13:43"
    "summary": "<p>Starting today, Amazon Lightsail is available in three additional AWS Regions: Asia Pacific (Hong Kong), South America (São Paulo), and Europe (Spain). This expansion brings the power and simplicity of Lightsail to customers across new geographies in Asia, South America, and Europe.<br /> <br /> With this launch, customers in these geographical regions can now enjoy lower latency and better performance for their applications while meeting local data residency requirements. The new Regions provide access to Lightsail's full range of features including instances that meet your compute needs, from general purpose to compute-optimized and memory-optimized bundles, as well as managed databases, container services, load balancers, <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/what-is-amazon-lightsail.html\">and more</a>, all with the same simple, predictable pricing that Lightsail customers love. Startups, small businesses, and developers in these regions can now run their applications closer to their end users with low latency.<br /> <br /> Lightsail is available in these AWS Regions: US East (Ohio, N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt, Ireland, London, Paris, Spain, Stockholm), Asia Pacific (Hong Kong, Jakarta, Malaysia, Mumbai, Seoul, Singapore, Sydney, Tokyo), South America (São Paulo). To learn more about Regions and Availability Zones for Lightsail, please refer to the <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html\">documentation</a>.<br /> <br /> You can create Lightsail resources in these AWS Regions through the <a href=\"https://lightsail.aws.amazon.com/\">Lightsail Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (CLI)</a>, and <a href=\"https://aws.amazon.com/tools/\">AWS SDKs</a>.</p>"
