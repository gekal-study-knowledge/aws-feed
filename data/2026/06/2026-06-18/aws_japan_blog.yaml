    "fetched": "2026-06-18 12:34:12"
    "summary": "Kiro のネイティブ iOS アプリが登場しました。スマートフォンから直接、クラウド上で動作する Kiro セッションの起動、監視、軌道修正、対話が可能になり、chat / spec / autonomous の 3 モードに対応します。差分はネイティブカードで読みやすく描画され、Web セッションと ID・設定・モデルがそのまま同期されます。ノート PC を開かずとも、移動中や待ち時間にエージェントへ作業を委譲し、後から PR として確認できます。"
