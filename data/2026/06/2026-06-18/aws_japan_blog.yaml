    "title": "AWS Continuum のご紹介: マシンスピードで実現するセキュリティ"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-continuum-security-at-machine-speed/"
    "published": "2026-06-18 09:15:23"
    "fetched": "2026-06-18 12:34:12"
    "summary": "コードの脆弱性に対応する AWS Continuum を発表します。テレメトリ収集とダッシュボード監視に頼る従来の運用モデルから、テレメトリ、コンテキスト、推論、アクションへと至る新しいアプローチへ移行します。フロンティアモデルを活用し、発見、優先順位付け、検証、緩和と修復という 4 つの継続的フェーズで、コードの脆弱性のライフサイクル全体にマシンスピードで対応する仕組みを紹介します。"
