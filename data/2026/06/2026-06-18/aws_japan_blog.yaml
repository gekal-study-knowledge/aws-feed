    "id": "07061d5f75f0fb5d3217e800919d5238"
    "title": "AWS Continuum のご紹介: マシンスピードで実現するセキュリティ"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-continuum-security-at-machine-speed/"
    "published": "2026-06-18 09:15:23"
    "fetched": "2026-06-18 12:34:12"
    "summary": "コードの脆弱性に対応する AWS Continuum を発表します。テレメトリ収集とダッシュボード監視に頼る従来の運用モデルから、テレメトリ、コンテキスト、推論、アクションへと至る新しいアプローチへ移行します。フロンティアモデルを活用し、発見、優先順位付け、検証、緩和と修復という 4 つの継続的フェーズで、コードの脆弱性のライフサイクル全体にマシンスピードで対応する仕組みを紹介します。"
  "00af08c7d4f043e0e150747292b6fb52":
    "id": "00af08c7d4f043e0e150747292b6fb52"
    "title": "Amazon OpenSearch Service による「EC サイト検索ワークショップ」と「Observability Stack ワークショップ」のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-amazon-opensearch-service-ec-search-observability-workshops-jp/"
    "published": "2026-06-18 17:35:26"
    "fetched": "2026-06-18 17:41:59"
    "summary": "2025 年 3 月に Amazon OpenSearch Service による検索ワークショップ（日本語版）のご紹介 という記事を公開し、OpenSearch の基本概念から AI を活用した検索までを学べる日本語ワークショップをご案内しました。 このたび、2 つの日本語版ワークショップが仲間入りいたしましたので、ご紹介いたします。 EC サイト検索ワークショップ：架空の EC サイトを題材に、検索機能を全文検索からセマンティック検索、マルチモーダル検索、エージェント検索へと段階的に育てていくワークショップです。また、ユーザーの行動ログを使った品質計測、機械学習による最適化を体験いただける実験的なラボも付属しています。 OpenSearch Observability Stack ワークショップ：OpenSearch を Observability のバックエンドとして使い、マイクロサービスの APM・ログ・メトリクスを横断しながら、Agentic AI も活用して障害の原因を調査するワークショップです。Agent Trace といった新しい OpenSearch の Observability 関連機能もお試しいただけます。"
