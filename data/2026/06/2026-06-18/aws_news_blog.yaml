    "title": "Introducing Amazon Bedrock Managed Knowledge Base for faster, more accurate enterprise AI applications"
    "link": "https://aws.amazon.com/blogs/aws/introducing-amazon-bedrock-managed-knowledge-base-for-faster-more-accurate-enterprise-ai-applications/"
    "published": "2026-06-18 00:09:20"
    "fetched": "2026-06-18 01:36:38"
    "summary": "Amazon Bedrock's new Fully Managed Knowledge Bases simplifies building enterprise RAG pipelines by providing native data connectors Smart Parsing for automatic multi-format data preparation, and an Agentic Retriever for complex multi-step queries—all integrated with AgentCore Gateway so developers can focus on business outcomes rather than infrastructure management."
  "b1e11c00f2acf6b04a115c8063b74558":
