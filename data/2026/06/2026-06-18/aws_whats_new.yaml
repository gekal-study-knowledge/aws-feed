    "title": "AWS DevOps Agent adds release management capability (preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-devops-agent-release-management/"
    "published": "2026-06-18 00:00:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>AWS DevOps Agent now offers a release management capability in preview, reviewing code changes for release readiness and running autonomous release testing to help you ship code to production safely and with confidence. With this addition, AWS DevOps Agent now works across both delivery and operations. It accelerates and validates the deployment of code changes, then keeps your applications running optimally across AWS, multicloud, and on-prem environments, so your team ships faster, reduces MTTR, and achieves operational excellence.<br /> <br /> With release readiness review, AWS DevOps Agent evaluates code changes for production safety during code generation by checking for drift from your internal standards, dependency impacts, and access controls. It maps cross-repository dependencies to surface breaking changes before commit and uses deterministic proofs to review that infrastructure changes do not drift from AWS Well-Architected best practices. With release testing, AWS DevOps Agent generates and runs test plans for web and API-based applications in customer-provisioned environments, catching regressions, UX issues, and integration failures a human reviewer may miss.<br /> <br /> To get started with the preview, connect your code repositories and pipelines in your AWS DevOps Agent space. AWS DevOps Agent release management is available in the US East (N. Virginia) Region and at no additional cost during the preview period. For the list of AWS Regions where AWS DevOps Agent production operations is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">supported Regions table</a>. For pricing of production operations features, which are generally available, see <a href=\"https://aws.amazon.com/devops-agent/pricing/\">AWS DevOps Agent pricing</a>.</p>"
  "7c126d333ebc1e2371600b92bd78ec9a":
    "id": "7c126d333ebc1e2371600b92bd78ec9a"
    "title": "AWS HealthOmics now streams workflow engine logs to Amazon CloudWatch in real time"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-healthomics-real-time-engine-log-streaming/"
    "published": "2026-06-18 01:00:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>AWS HealthOmics now streams workflow engine logs to Amazon CloudWatch in real time, enabling customers to monitor workflow execution progress as it happens. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p> \n<p>Real-time engine log streaming accelerates iterative workflow development and debugging by giving researchers, bioinformaticians, and workflow developers immediate access to execution details during a run. The streamed engine logs provide visibility into workflow orchestration events, task scheduling details, import/export activity, and full stack traces on errors — all routed into the engine log stream in real time. Customers can set up CloudWatch alarms on log patterns to detect anomalies early, build dashboards for ongoing monitoring, and integrate with existing observability tooling.</p> \n<p>Real-time engine log streaming is now available for Nextflow, WDL, and CWL workflow runs in all AWS HealthOmics regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Singapore, Seoul). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/monitoring-cloudwatch-logs.html\">Monitoring HealthOmics with CloudWatch Logs documentation</a>.</p>"
  "0bc4e22d6ae2e1ef3e3d4d3658d9a341":
    "id": "0bc4e22d6ae2e1ef3e3d4d3658d9a341"
    "title": "Amazon Aurora and RDS for MySQL expand Extended Support for MySQL 5.7 through June 2029"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/rds-mysql-es-extension/"
    "published": "2026-06-18 00:00:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>Amazon Aurora MySQL-Compatible Edition and Amazon Relational Database Service (RDS) for MySQL now offer <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS Extended Support</a> for MySQL 5.7 through June 30, 2029, from the previous end date of February 28, 2027. This applies to Aurora MySQL version 2 (with MySQL 5.7 compatibility) and RDS for MySQL version 5.7, giving customers additional time to plan and complete their upgrades to a supported major version while continuing to receive critical security patches and bug fixes.<br /> <br /> RDS Extended Support delivers security patches for critical and high CVEs, bug fixes for critical operational issues, and access to AWS Support within the standard Aurora and RDS SLAs. There is no price increase with this extension, and customers using RDS Extended Support for MySQL 5.7 will continue to pay Year 3 pricing through June 30, 2029. For pricing details, see <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Aurora pricing</a> and <a href=\"https://aws.amazon.com/rds/mysql/pricing/\">RDS for MySQL pricing</a>.<br /> <br /> We recommend upgrading to MySQL 8.0 or MySQL 8.4 compatible versions to benefit from the latest database features, performance improvements, and security enhancements. You can upgrade using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or snapshot restore. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Updates.MajorVersionUpgrade.html\">Aurora MySQL</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MySQL.html\">RDS for MySQL</a> user guides. This extension is available in all AWS Regions where Aurora MySQL and RDS for MySQL are available.<br /> <br /> Amazon Aurora is designed for high performance and availability at global scale with full MySQL and PostgreSQL compatibility. Amazon RDS for MySQL, PostgreSQL, and MariaDB make it simple to set up, operate, and scale open source deployments in the cloud. Visit the getting started pages for <a href=\"https://aws.amazon.com/rds/aurora/\">Aurora</a> and <a href=\"https://aws.amazon.com/rds/\">RDS</a> to begin.</p>"
"last_updated": "2026-06-18 04:23:04 JST"
