  "1fa82ea1d9d23ffa2509b87b4abb4302":
    "id": "1fa82ea1d9d23ffa2509b87b4abb4302"
    "title": "【開催報告 & 資料公開】Security for App Builders #2 〜AI Agent の認可管理〜"
    "link": "https://aws.amazon.com/jp/blogs/news/security-for-app-builders-2/"
    "published": "2026-06-17 13:12:00"
    "fetched": "2026-06-17 17:59:28"
    "summary": "AI Agent が企業のワークフローに組み込まれ始めている中で、「エージェントにどこまでの権限を持たせるべきか」「ユーザーの操作として実行されるべきなのか、エージェント自身の権限で実行されるべきなのか」といった設計判断に悩まれている方は多いのではないでしょうか。従来のアプリケーションとは異なり、エージェントは自律的にツールを呼び出し外部リソースへアクセスするため、認証・認可の設計にも新しい考え方が必要になります。こうした課題に取り組む開発者・セキュリティエンジニアの皆様を対象に、2026 年 5 月 22 日、AWS 麻布台ヒルズオフィスにて「Security for App Builders #2」を開催しました。ご参加いただきました皆様には、改めて御礼申し上げます。 本ブログでは、当日の各セッションの概要をお伝えするとともに、発表資料を公開いたします。AI Agent のアイデンティティ制御に関心をお持ちの方にとって、設計の出発点となる情報が得られる内容になっていますので、ぜひご覧ください。"
  "4f9f7db221eb79c16078ca1cd156b48c":
    "id": "4f9f7db221eb79c16078ca1cd156b48c"
    "title": "AWS Shield Advanced のフローログで DDoS 攻撃を可視化する"
    "link": "https://aws.amazon.com/jp/blogs/news/security-gain-visibility-into-ddos-attacks-with-flow-logs-in-aws-shield-advanced/"
    "published": "2026-06-17 19:59:41"
    "fetched": "2026-06-17 21:54:54"
    "summary": "これまでDDoS攻撃のトラフィックを再構成するには、攻撃が終わった後に複数のデータソースを組み合わせる必要がありました。AWS Shield Advancedの攻撃フローログはこの課題を解決する機能で、攻撃中にトラフィックのメタデータをキャプチャすることで、攻撃元の特定、緩和策の検証、既存の分析パイプラインへのデータ投入をリアルタイムに行えるようになります。ログの配信先はAmazon S3、Amazon CloudWatch Logs、Amazon Data Firehoseの3つから選択でき、他のAWSフローログと同じCloudWatch Logs配信インフラを利用するため、既存の監視・分析ツールにそのまま統合することができます。このブログでは、Shield Advanced攻撃フローログがDDoSイベント中にどのようにメタデータをキャプチャするか、各フィールドの意味、フローログの有効化と設定方法について解説しています。"
"last_updated": "2026-06-17 21:54:54 JST"
