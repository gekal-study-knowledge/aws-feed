  "664229bde5076b6b77ebecb2cb16a26f":
    "id": "664229bde5076b6b77ebecb2cb16a26f"
    "title": "Kiro Web の新機能: Spec、GitLab、その他のアップデート"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-web-specs-gitlab/"
    "published": "2026-06-17 08:45:12"
    "fetched": "2026-06-17 12:41:55"
    "summary": "先月、私たちは Kiro Web をプレビュー版として公開し、皆さんがすでに作業している場所へと Kiro を広げました。ブラウザから Kiro とともにアイデアを探求して変更を形にし、ローカル環境を最初にセットアップすることなくプルリクエストをオープンします。あるいは自律モード（Autonomous mode）でタスクを任せれば、Kiro が最初から最後まで処理します。いずれの場合も、1 つのセッションで複数の GitHub リポジトリにまたがる 1 つの変更を調整できます。公開以降、私たちはワークフローの改善を一通り提供してきました。今回のアップデートでは、開発者の皆さんから要望のあった 2 つの機能をお届けします。構造化されたスペックワークフローがブラウザで実行できるようになり、さらに Kiro Web が GitLab に対応しました。GitLab と GitHub の両方にまたがるセッションも含めてです。"
