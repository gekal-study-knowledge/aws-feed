  "0f1c3c64e9066630ccda8413ceee5dc0":
    "id": "0f1c3c64e9066630ccda8413ceee5dc0"
    "title": "AWS Sign-in now supports resource-based policies and resource control policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-sign-in/"
    "published": "2026-06-17 01:20:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Sign-in now supports resource-based policies and resource control policies (RCPs) for the AWS Management Console. You can use these policies to restrict console sign-in to expected networks. Policies are evaluated during sign-in and whenever the console session requests new credentials.</p> \n<p>Resource-based policies apply to individual AWS accounts. Resource control policies apply organization-wide through AWS Organizations. You can combine these policies with <a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/console-private-access.html\" target=\"_blank\">AWS Management Console Private Access</a> to control both which networks users can sign in from and which accounts they can access.</p> \n<p>AWS Sign-in resource-based policies and RCPs are available at no additional cost in all AWS commercial Regions. To learn more, see the <a href=\"https://docs.aws.amazon.com/signin/latest/userguide/what-is-sign-in.html\" target=\"_blank\">AWS Sign-in User Guide</a>. For API details, see the <a href=\"https://docs.aws.amazon.com/signin/latest/APIReference/\" target=\"_blank\">AWS Sign-in API Reference</a>.</p>"
  "4136861b7756db7afa143cfa4ced7138":
    "id": "4136861b7756db7afa143cfa4ced7138"
    "title": "AWS Transform for mainframe now delivers a traceable reimagine workflow"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-mainframe-traceable-reimagine-workflow/"
    "published": "2026-06-17 03:29:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>AWS Transform for mainframe now delivers a connected, traceable reimagine experience from assessment through code generation. Previously, modernizing mainframe applications required months of analysis across multiple tools for discovery, reverse engineering, and code generation with manual handoffs between phases. With this launch, enterprises running z/OS COBOL and PL/I workloads can assess their portfolio to identify the discrete business functions, extract business rules, generate development-ready requirements, and produce traceable cloud-native code in a single connected workflow.</p> \n<p>The experience starts with a portfolio assessment, where AWS Transform systematically identifies and catalogs discrete business functions. Selected business functions flow directly into the reimagine workflow, creating a connected path from portfolio analysis through code generation. For each business function, AWS Transform generates development-ready requirements with full traceability, flowing directly into Kiro and other IDEs through MCP-based integrations. Teams can generate interactive documentation for any requirement or code directly in the IDE. Every requirement traces back to the source code, so teams can audit any transformation decision back to its origin. This end-to-end approach compresses what previously took years of manual effort into months of automated, evidence-based modernization.<br /> </p> \n<p>These capabilities are available in all AWS Regions where AWS Transform for mainframe is available. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/transform/mainframe/\">AWS Transform for mainframe</a> or see the <a href=\"https://docs.aws.amazon.com/transform/\">AWS Transform for mainframe documentation</a>.</p>"
  "c14e84b8e1ad9595f1e7e98fb26f14a6":
    "id": "c14e84b8e1ad9595f1e7e98fb26f14a6"
    "title": "Amazon Redshift RG instances powered by AWS Graviton now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-rg-instances-3-additional-regions/"
    "published": "2026-06-17 01:10:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>Amazon Redshift is expanding the general availability of <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-redshift-rg-instances-powered-by-graviton/\">RG instances</a> — powered by AWS Graviton processors — to three additional AWS Regions: Africa (Cape Town), Asia Pacific (Bangkok), and Mexico (Central). Amazon Redshift's new Graviton-based RG instances deliver up to <b>4.2X better price-performance for data warehouse workloads compared to other data warehouses</b>, run workloads up to 2.4x faster than previous-generation RA3 instances, and cost 30% less per vCPU.<br /> <br /> Customers in Cape Town (af-south-1), Bangkok (ap-southeast-7), and Mexico Central (mx-central-1) can provision rg.xlarge and rg.4xlarge node types — ideal for a wide range of workloads from smaller development environments to production data warehouse deployments. Customers can upgrade their existing RA3 provisioned instances to RG instances and immediately benefit from improved query performance and reduced compute costs.<br /> <br /> RG instances come with additional cost savings built in by default. With <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-incremental-manual-snapshots/\">Amazon Redshift incremental manual snapshots</a>, customers now pay less for backup storage as snapshot costs are metered based on unique data blocks rather than total snapshot size. Additionally, RG instances eliminate Redshift Spectrum scanning charges, meaning customers no longer pay for data scanned in Amazon S3 via Spectrum — further reducing the total cost of running data lake queries.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html\">Amazon Redshift documentation</a> and the <a href=\"https://aws.amazon.com/redshift/pricing/\">RG instances pricing page</a>.</p>"
  "91ab0ed0c9389834128dc65bf89d12c3":
    "id": "91ab0ed0c9389834128dc65bf89d12c3"
    "title": "AWS announces AWS Blocks, an open-source framework for composing application backends on AWS (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-blocks-preview"
    "published": "2026-06-17 00:49:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>Today, AWS announces the public preview of AWS Blocks, an open-source TypeScript framework for application developers who want backend capabilities on AWS removing the need to learn infrastructure tools. AWS Blocks runs a fully functional local environment with Postgres, authentication, and real-time messaging, no AWS account required. When ready to deploy, the same application code runs on production AWS services with zero changes, and developers can drop into AWS CDK at any point for direct resource configuration.</p> \n<p>A developer building a SaaS application can add database tables, user authentication, AI agents, file uploads, and background jobs in a single session, test the full stack locally, and deploy to AWS when ready. Built-in guidance for AI coding tools enables correct architecture without custom configuration, and end-to-end type safety flows from the data schema to the frontend without a code generation step. At preview, supported frontend frameworks include SPAs (e.g. Vite + React) and SSR frameworks such as Next.js, Nuxt, and Astro. AWS Blocks is available at no additional charge. You pay only for the AWS services your application uses.</p> \n<p>AWS Blocks deploys to all commercial AWS regions.</p> \n<p>To get started, run npx @aws-blocks/create-blocks-app. Read more here:</p> \n<ul> \n <li><a href=\"https://aws.amazon.com/products/developer-tools/blocks/\">AWS Blocks product page</a></li> \n <li><a href=\"https://docs.aws.amazon.com/blocks/latest/devguide/getting-started.html\">Getting started guide</a> in the AWS Blocks Developer Guide</li> \n <li><a href=\"https://github.com/aws-devtools-labs/aws-blocks\">AWS Blocks on GitHub</a></li> \n</ul>"
  "8894d8d46ce8fc0e099cc47f40fe4884":
    "id": "8894d8d46ce8fc0e099cc47f40fe4884"
    "title": "AWS Transform now supports model-to-model migration assessment for generative AI workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-model-to-model-assessments"
    "published": "2026-06-17 06:55:00"
    "fetched": "2026-06-17 08:21:21"
    "summary": "<p>AWS Transform now offers a model-to-model migration custom transformation that assesses your generative AI workloads and produces a comprehensive migration plan for moving from third-party providers to Amazon Bedrock. The AI-powered agent scans your codebase, identifies every AI SDK and model in use, gathers your migration requirements through interactive questions, and maps models to Bedrock equivalents with transparent cost comparisons and production-ready code changes. This managed custom transformation helps organizations consolidate their AI workloads on AWS to gain IAM-based security, VPC endpoint isolation, prompt caching, Amazon Bedrock Guardrails, and unified operational tooling through Amazon CloudWatch. &nbsp;<br /> <br /> The transformation supports migrations from OpenAI, Google Gemini, direct Anthropic SDK usage, and open-source models via LiteLLM or Ollama. It handles direct SDK integrations, framework-wrapped patterns such as LangChain and LlamaIndex, agentic architectures including CrewAI and LangGraph, and multi-provider routing layers — preserving your application architecture while swapping only the model layer. The agent includes intelligent cost optimization with tiered model routing recommendations, prompt caching analysis, and model lifecycle awareness that excludes models within 90 days of end-of-life from all recommendations. For some workloads, it recommends Amazon Bedrock's OpenAI-compatible endpoints as a zero-code-change migration path.</p> \n<p>AWS Transform model-to-model migration is available in all AWS Regions where <a href=\"https://aws.amazon.com/transform\">AWS Transform</a>&nbsp;is offered, at no additional charge beyond standard AWS Transform pricing. To get started, install the ATX CLI and run the mke-genai-model-migration custom transformation against your codebase. To learn more, see the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom.html\">AWS Transform Custom Transformations documentation</a>&nbsp;and the <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/migrate-your-ai-workloads-to-amazon-bedrock-with-aws-transform/\">announcement blog</a>.</p>"
  "122990ff3b2027ec0ed152cdb83d55a5":
    "id": "122990ff3b2027ec0ed152cdb83d55a5"
    "title": "Amazon Bedrock Guardrails announces a new API targeting agentic AI workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-guardrails-api-ai/"
    "published": "2026-06-17 07:53:00"
    "fetched": "2026-06-17 12:41:55"
    "summary": "<p><a href=\"https://aws.amazon.com/bedrock/guardrails/\">Amazon Bedrock Guardrails</a> now offers the InvokeGuardrailChecks API, a new resourceless API that lets you apply individual safeguards at any point in your agentic AI applications without creating guardrail resources. The API provides granular, per-request control over which safeguards to run at each step of your agent loop, returning numeric severity and confidence scores so you can implement custom thresholds and actions, whether to block, pass, retry, or log based on your specific requirements.</p> \n<p>Agentic AI applications operate through iterative loops; planning tasks, calling tools, processing outputs, and iterating again while often executing dozens of steps for a single request. Each step carries a different risk profile, making a one-size-fits-all guardrail difficult to scale. The InvokeGuardrailChecks API addresses this by operating in detect-only mode with no guardrail IDs to track and no versions to manage. You specify which safeguards to run directly in each request, making it straightforward to add, remove, or adjust checks as your workflows evolve.</p> \n<p>The API supports content filters (detecting harmful content across categories including hate, violence, sexual, insults, and misconduct), prompt attack detection (identifying jailbreak, prompt injection, and prompt leakage as independent standalone checks), and sensitive information filters (detecting supported PII entity types). Prompt attack detection is exposed as a separate safeguard, giving you the granularity to invoke each supported attack vector independently.</p> \n<p>The InvokeGuardrailChecks API is available today in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (London), Europe (Stockholm), Asia Pacific (Tokyo), and Asia Pacific (Sydney).</p> \n<p>To learn more, visit the Amazon Bedrock Guardrails <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-invoke-guardrail-checks.html\">technical documentation</a>.</p>"
  "360254f8ffa7b1344fecd57c2e2d1fa7":
    "id": "360254f8ffa7b1344fecd57c2e2d1fa7"
    "title": "Amazon S3 Vectors now supports up to 10,000 similarity search results per query"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/s3-vectors-supports-10000-search-results-per-query"
    "published": "2026-06-17 06:22:00"
    "fetched": "2026-06-17 12:41:55"
    "summary": "<p>Amazon S3 Vectors can now return up to 10,000 similarity search results per query, a 100x increase from the previous limit.&nbsp;The higher result limit helps you retrieve a larger, more comprehensive set of candidates during similarity queries. This is especially valuable for applications with multi-stage retrieval pipelines that need to apply additional processing such as reranking, aggregations, or deduplication to produce a more relevant final result set.</p> \n<p>To get started with the higher limit, use the latest AWS SDK and update your application code to specify up to 10,000 relevant results (topK nearest neighbors) when making a QueryVectors API request. Query results are now returned across multiple pages, and you can start processing the first page immediately while retrieving additional pages as needed. For queries that return larger result sets, you pay a small data-returned fee based on the total size of results returned. The first 512 KB of data returned per query is free. For full pricing details, visit the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 pricing page.</a></p> \n<p>S3 Vectors supports retrieving up to 10,000 results per query in all <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-regions-quotas.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where it is available. To learn more about S3 Vectors, visit the <a href=\"https://aws.amazon.com/s3/features/vectors/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 User Guide</a>.</p>"
