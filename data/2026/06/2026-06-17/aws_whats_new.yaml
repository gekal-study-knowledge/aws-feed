"entries":
  "0f1c3c64e9066630ccda8413ceee5dc0":
    "id": "0f1c3c64e9066630ccda8413ceee5dc0"
    "title": "AWS Sign-in now supports resource-based policies and resource control policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-sign-in/"
    "published": "2026-06-17 01:20:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Sign-in now supports resource-based policies and resource control policies (RCPs) for the AWS Management Console. You can use these policies to restrict console sign-in to expected networks. Policies are evaluated during sign-in and whenever the console session requests new credentials.</p> \n<p>Resource-based policies apply to individual AWS accounts. Resource control policies apply organization-wide through AWS Organizations. You can combine these policies with <a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/console-private-access.html\" target=\"_blank\">AWS Management Console Private Access</a> to control both which networks users can sign in from and which accounts they can access.</p> \n<p>AWS Sign-in resource-based policies and RCPs are available at no additional cost in all AWS commercial Regions. To learn more, see the <a href=\"https://docs.aws.amazon.com/signin/latest/userguide/what-is-sign-in.html\" target=\"_blank\">AWS Sign-in User Guide</a>. For API details, see the <a href=\"https://docs.aws.amazon.com/signin/latest/APIReference/\" target=\"_blank\">AWS Sign-in API Reference</a>.</p>"
  "4136861b7756db7afa143cfa4ced7138":
    "id": "4136861b7756db7afa143cfa4ced7138"
    "title": "AWS Transform for mainframe now delivers a traceable reimagine workflow"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-mainframe-traceable-reimagine-workflow/"
    "published": "2026-06-17 03:29:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>AWS Transform for mainframe now delivers a connected, traceable reimagine experience from assessment through code generation. Previously, modernizing mainframe applications required months of analysis across multiple tools for discovery, reverse engineering, and code generation with manual handoffs between phases. With this launch, enterprises running z/OS COBOL and PL/I workloads can assess their portfolio to identify the discrete business functions, extract business rules, generate development-ready requirements, and produce traceable cloud-native code in a single connected workflow.</p> \n<p>The experience starts with a portfolio assessment, where AWS Transform systematically identifies and catalogs discrete business functions. Selected business functions flow directly into the reimagine workflow, creating a connected path from portfolio analysis through code generation. For each business function, AWS Transform generates development-ready requirements with full traceability, flowing directly into Kiro and other IDEs through MCP-based integrations. Teams can generate interactive documentation for any requirement or code directly in the IDE. Every requirement traces back to the source code, so teams can audit any transformation decision back to its origin. This end-to-end approach compresses what previously took years of manual effort into months of automated, evidence-based modernization.<br /> </p> \n<p>These capabilities are available in all AWS Regions where AWS Transform for mainframe is available. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p> \n<p>To learn more, visit <a href=\"https://aws.amazon.com/transform/mainframe/\">AWS Transform for mainframe</a> or see the <a href=\"https://docs.aws.amazon.com/transform/\">AWS Transform for mainframe documentation</a>.</p>"
  "c14e84b8e1ad9595f1e7e98fb26f14a6":
    "id": "c14e84b8e1ad9595f1e7e98fb26f14a6"
    "title": "Amazon Redshift RG instances powered by AWS Graviton now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-rg-instances-3-additional-regions/"
    "published": "2026-06-17 01:10:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>Amazon Redshift is expanding the general availability of <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-redshift-rg-instances-powered-by-graviton/\">RG instances</a> — powered by AWS Graviton processors — to three additional AWS Regions: Africa (Cape Town), Asia Pacific (Bangkok), and Mexico (Central). Amazon Redshift's new Graviton-based RG instances deliver up to <b>4.2X better price-performance for data warehouse workloads compared to other data warehouses</b>, run workloads up to 2.4x faster than previous-generation RA3 instances, and cost 30% less per vCPU.<br /> <br /> Customers in Cape Town (af-south-1), Bangkok (ap-southeast-7), and Mexico Central (mx-central-1) can provision rg.xlarge and rg.4xlarge node types — ideal for a wide range of workloads from smaller development environments to production data warehouse deployments. Customers can upgrade their existing RA3 provisioned instances to RG instances and immediately benefit from improved query performance and reduced compute costs.<br /> <br /> RG instances come with additional cost savings built in by default. With <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-incremental-manual-snapshots/\">Amazon Redshift incremental manual snapshots</a>, customers now pay less for backup storage as snapshot costs are metered based on unique data blocks rather than total snapshot size. Additionally, RG instances eliminate Redshift Spectrum scanning charges, meaning customers no longer pay for data scanned in Amazon S3 via Spectrum — further reducing the total cost of running data lake queries.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html\">Amazon Redshift documentation</a> and the <a href=\"https://aws.amazon.com/redshift/pricing/\">RG instances pricing page</a>.</p>"
  "91ab0ed0c9389834128dc65bf89d12c3":
    "id": "91ab0ed0c9389834128dc65bf89d12c3"
    "title": "AWS announces AWS Blocks, an open-source framework for composing application backends on AWS (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-blocks-preview"
    "published": "2026-06-17 00:49:00"
    "fetched": "2026-06-17 06:40:07"
    "summary": "<p>Today, AWS announces the public preview of AWS Blocks, an open-source TypeScript framework for application developers who want backend capabilities on AWS removing the need to learn infrastructure tools. AWS Blocks runs a fully functional local environment with Postgres, authentication, and real-time messaging, no AWS account required. When ready to deploy, the same application code runs on production AWS services with zero changes, and developers can drop into AWS CDK at any point for direct resource configuration.</p> \n<p>A developer building a SaaS application can add database tables, user authentication, AI agents, file uploads, and background jobs in a single session, test the full stack locally, and deploy to AWS when ready. Built-in guidance for AI coding tools enables correct architecture without custom configuration, and end-to-end type safety flows from the data schema to the frontend without a code generation step. At preview, supported frontend frameworks include SPAs (e.g. Vite + React) and SSR frameworks such as Next.js, Nuxt, and Astro. AWS Blocks is available at no additional charge. You pay only for the AWS services your application uses.</p> \n<p>AWS Blocks deploys to all commercial AWS regions.</p> \n<p>To get started, run npx @aws-blocks/create-blocks-app. Read more here:</p> \n<ul> \n <li><a href=\"https://aws.amazon.com/products/developer-tools/blocks/\">AWS Blocks product page</a></li> \n <li><a href=\"https://docs.aws.amazon.com/blocks/latest/devguide/getting-started.html\">Getting started guide</a> in the AWS Blocks Developer Guide</li> \n <li><a href=\"https://github.com/aws-devtools-labs/aws-blocks\">AWS Blocks on GitHub</a></li> \n</ul>"
  "8894d8d46ce8fc0e099cc47f40fe4884":
    "id": "8894d8d46ce8fc0e099cc47f40fe4884"
    "title": "AWS Transform now supports model-to-model migration assessment for generative AI workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-model-to-model-assessments"
    "published": "2026-06-17 06:55:00"
    "fetched": "2026-06-17 08:21:21"
    "summary": "<p>AWS Transform now offers a model-to-model migration custom transformation that assesses your generative AI workloads and produces a comprehensive migration plan for moving from third-party providers to Amazon Bedrock. The AI-powered agent scans your codebase, identifies every AI SDK and model in use, gathers your migration requirements through interactive questions, and maps models to Bedrock equivalents with transparent cost comparisons and production-ready code changes. This managed custom transformation helps organizations consolidate their AI workloads on AWS to gain IAM-based security, VPC endpoint isolation, prompt caching, Amazon Bedrock Guardrails, and unified operational tooling through Amazon CloudWatch. &nbsp;<br /> <br /> The transformation supports migrations from OpenAI, Google Gemini, direct Anthropic SDK usage, and open-source models via LiteLLM or Ollama. It handles direct SDK integrations, framework-wrapped patterns such as LangChain and LlamaIndex, agentic architectures including CrewAI and LangGraph, and multi-provider routing layers — preserving your application architecture while swapping only the model layer. The agent includes intelligent cost optimization with tiered model routing recommendations, prompt caching analysis, and model lifecycle awareness that excludes models within 90 days of end-of-life from all recommendations. For some workloads, it recommends Amazon Bedrock's OpenAI-compatible endpoints as a zero-code-change migration path.</p> \n<p>AWS Transform model-to-model migration is available in all AWS Regions where <a href=\"https://aws.amazon.com/transform\">AWS Transform</a>&nbsp;is offered, at no additional charge beyond standard AWS Transform pricing. To get started, install the ATX CLI and run the mke-genai-model-migration custom transformation against your codebase. To learn more, see the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom.html\">AWS Transform Custom Transformations documentation</a>&nbsp;and the <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/migrate-your-ai-workloads-to-amazon-bedrock-with-aws-transform/\">announcement blog</a>.</p>"
  "122990ff3b2027ec0ed152cdb83d55a5":
    "id": "122990ff3b2027ec0ed152cdb83d55a5"
    "title": "Amazon Bedrock Guardrails announces a new API targeting agentic AI workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-guardrails-api-ai/"
    "published": "2026-06-17 07:53:00"
    "fetched": "2026-06-17 12:41:55"
    "summary": "<p><a href=\"https://aws.amazon.com/bedrock/guardrails/\">Amazon Bedrock Guardrails</a> now offers the InvokeGuardrailChecks API, a new resourceless API that lets you apply individual safeguards at any point in your agentic AI applications without creating guardrail resources. The API provides granular, per-request control over which safeguards to run at each step of your agent loop, returning numeric severity and confidence scores so you can implement custom thresholds and actions, whether to block, pass, retry, or log based on your specific requirements.</p> \n<p>Agentic AI applications operate through iterative loops; planning tasks, calling tools, processing outputs, and iterating again while often executing dozens of steps for a single request. Each step carries a different risk profile, making a one-size-fits-all guardrail difficult to scale. The InvokeGuardrailChecks API addresses this by operating in detect-only mode with no guardrail IDs to track and no versions to manage. You specify which safeguards to run directly in each request, making it straightforward to add, remove, or adjust checks as your workflows evolve.</p> \n<p>The API supports content filters (detecting harmful content across categories including hate, violence, sexual, insults, and misconduct), prompt attack detection (identifying jailbreak, prompt injection, and prompt leakage as independent standalone checks), and sensitive information filters (detecting supported PII entity types). Prompt attack detection is exposed as a separate safeguard, giving you the granularity to invoke each supported attack vector independently.</p> \n<p>The InvokeGuardrailChecks API is available today in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (London), Europe (Stockholm), Asia Pacific (Tokyo), and Asia Pacific (Sydney).</p> \n<p>To learn more, visit the Amazon Bedrock Guardrails <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-invoke-guardrail-checks.html\">technical documentation</a>.</p>"
  "360254f8ffa7b1344fecd57c2e2d1fa7":
    "id": "360254f8ffa7b1344fecd57c2e2d1fa7"
    "title": "Amazon S3 Vectors now supports up to 10,000 similarity search results per query"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/s3-vectors-supports-10000-search-results-per-query"
    "published": "2026-06-17 06:22:00"
    "fetched": "2026-06-17 12:41:55"
    "summary": "<p>Amazon S3 Vectors can now return up to 10,000 similarity search results per query, a 100x increase from the previous limit.&nbsp;The higher result limit helps you retrieve a larger, more comprehensive set of candidates during similarity queries. This is especially valuable for applications with multi-stage retrieval pipelines that need to apply additional processing such as reranking, aggregations, or deduplication to produce a more relevant final result set.</p> \n<p>To get started with the higher limit, use the latest AWS SDK and update your application code to specify up to 10,000 relevant results (topK nearest neighbors) when making a QueryVectors API request. Query results are now returned across multiple pages, and you can start processing the first page immediately while retrieving additional pages as needed. For queries that return larger result sets, you pay a small data-returned fee based on the total size of results returned. The first 512 KB of data returned per query is free. For full pricing details, visit the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 pricing page.</a></p> \n<p>S3 Vectors supports retrieving up to 10,000 results per query in all <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-regions-quotas.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where it is available. To learn more about S3 Vectors, visit the <a href=\"https://aws.amazon.com/s3/features/vectors/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 User Guide</a>.</p>"
  "a2fc5bd806e888d81aaf493cb8ae8869":
    "id": "a2fc5bd806e888d81aaf493cb8ae8869"
    "title": "Amazon Bedrock AgentCore now supports Bedrock Guardrails in policy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-policy-guardrails-generally-available"
    "published": "2026-06-17 21:00:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>Today, AWS announces that Amazon Bedrock AgentCore now supports Bedrock Guardrails in policy, giving enterprises deeper safety and security controls as they scale AI agents in production. AgentCore policy is an authorization capability within Amazon Bedrock AgentCore that controls which actions AI agents are authorized to take. Guardrails give enterprises defenses against the top security and safety risks with AI agent workloads, including prompt injection attacks and sensitive data exposure.<br /> <br /> Guardrails can evaluate the outputs of every authorized agent action and inputs of every call to a gateway target (tools, agents, and models) in real-time, helping detect and block prompt injection attacks, harmful content, and sensitive information exposure before they reach downstream systems. Guardrail results are evaluated in policy at the AgentCore gateway perimeter, outside the agent's code, ensuring consistent enforcement regardless of agent autonomy. All policy evaluations are logged via AgentCore observability for optimization and auditing purposes.<br /> <br /> AgentCore policy works with existing AgentCore gateway deployments and requires no new infrastructure. Customers author policies through natural language or policy-as-code, with consumption-based pricing for policy evaluations.<br /> <br /> Bedrock Guardrails are available in policy in US East (N. Virginia), Europe (London), Europe (Stockholm), Asia Pacific (Sydney), and Asia Pacific (Tokyo). To learn more, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/\">Amazon Bedrock AgentCore</a> or explore the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html\">documentation</a>.</p>"
  "2267a089d62dea085a77bbde6c5aec50":
    "id": "2267a089d62dea085a77bbde6c5aec50"
    "title": "AgentCore harness in now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-harness-generally-available"
    "published": "2026-06-17 21:00:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>Today, AWS announces the general availability of the managed agent harness in Amazon Bedrock AgentCore, taking teams from idea to working agents in minutes. An agent is more than a model. If the model is the brain, the harness is the body: everything the brain needs to get work done. It runs the orchestration loop, executes tools, manages the context window, persists state across turns, recovers from failures, and isolates each session. The harness shapes how well an agent performs as much as the model does, and building a durable one is where most teams spend their time today. AgentCore harness provides that layer as a managed capability. Instead of coding the loop, customers define an agent in configuration: the model it uses, the tools it calls, the skills it accesses, and the instructions it follows, and AgentCore assembles and runs that loop. From that single definition, a production-grade agent runs in minutes in its own isolated environment, with a filesystem and shell, memory across sessions, skills including the AWS-curated catalog, and web browsing. This is not a starter tool teams outgrow: the configuration they start with is what they operate at scale, and when custom orchestration is needed, the harness exports to code on the same platform without rebuilding anything.<br /> <br /> Besides speed, AgentCore decouples the harness from the model. Customers can choose any model and switch providers mid-session without losing context or touching agent logic, for example planning with one model and writing code with another. The harness is also one piece of a single platform, not a hosting layer wrapped around a framework. It reaches tools through the same gateway that enforces security policies, and connects the agent to organizational knowledge and web search. Identity, memory, and observability come from that same platform, so every agent action is governed and traced from the first call without additional wiring. When a use case needs custom orchestration, a single CLI command exports the harness to Strands-based code on the same compute and primitives, with Claude Agent SDK coming soon as an export target. The agent declared on day one is the agent that runs at the thousandth, on the same foundation throughout.<br /> <br /> AgentCore harness is generally available today in all <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Commercial Regions</a> where AgentCore is available. Learn more using the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html\">documentation</a>.&nbsp;</p>"
  "c66c67f99962f1feef67ea5959d3dd1d":
    "id": "c66c67f99962f1feef67ea5959d3dd1d"
    "title": "Introducing AWS Continuum for security at machine speed"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-continuum/"
    "published": "2026-06-17 16:00:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>Today, AWS announces AWS Continuum, which&nbsp;discovers, prioritizes, validates, and remediates security risks at machine speed within guardrails you define. Frontier models have made finding software vulnerabilities faster and cheaper, but the harder work comes after: deciding which vulnerabilities matter to your business, proving which are exploitable, and fixing them without days of cross-team coordination. AWS Continuum closes that gap,&nbsp;so your security team shifts from manual triage to setting direction and approving outcomes.&nbsp;</p> \n<p>AWS Continuum for code vulnerabilities, available in gated preview, works the full lifecycle of a vulnerability at machine speed. It ingests findings from your existing tools and its own scans, prioritizes each one using a context graph of your environment and business, and validates which are exploitable by building reproducible proof in an isolated sandbox. Confirmed exposures then receive fast, reversible mitigations within your guardrails, followed by durable fixes that route through your own review and deployment process, with blast radius visibility and rollback. AWS Security Agent penetration testing and code scanning are now available as Continuum penetration testing and Continuum code scanning (preview). We are also launching Continuum threat modeling in preview, which automatically generates more comprehensive threat models from design documents or source code and outputs results in STRIDE format.</p> \n<p>AWS Continuum works alongside your existing AWS security services, including Amazon GuardDuty and AWS Security Hub. For more information about the AWS Regions where AWS Continuum is available, see the AWS Region table. To learn more and request access, see the AWS Continuum <a href=\"https://aws.amazon.com/continuum/\">product page</a>.</p>"
  "e555761a9d1464ce3cd9c0d25a0805e7":
    "id": "e555761a9d1464ce3cd9c0d25a0805e7"
    "title": "Amazon Bedrock Managed Knowledge Base is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-managed-knowledge-base/"
    "published": "2026-06-17 14:00:00"
    "fetched": "2026-06-18 01:36:37"
    "summary": "<p>Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service, is now generally available. With Managed Knowledge Base, developers can build production-ready AI agents grounded in enterprise data without managing vector databases, data pipelines, or retrieval infrastructure. The service handles data ingestion, storage optimization, and advanced retrieval so teams can go from prototype to production faster.</p> \n<p>Amazon Bedrock Managed Knowledge Base includes six native data source connectors—Amazon S3, SharePoint, Confluence, Google Drive, OneDrive, and Web Crawler—with automatic data syncing and managed vector storage optimized for price-performance. Advanced retrieval capabilities include hybrid search, document ranking, and agentic retrieval that automatically orchestrates query planning, interim response evaluation, and re-ranking for complex multi-hop queries. You can use Managed Knowledge Base to power employee assistants, automate customer support, or build multimodal knowledge bases spanning text, video, audio, and images. The service integrates natively with Amazon Bedrock AgentCore, enabling you to connect your knowledge base to agents with auto-generated permissions and built-in observability.</p> \n<p>Amazon Bedrock Managed Knowledge Base is available today in the US East (N. Virginia), US West (Oregon), Asia Paciﬁc (Sydney, Tokyo), Europe (Dublin, Frankfurt, London), and AWS GovCloud (US-West) Regions.</p> \n<p>To learn more, visit the Amazon Bedrock Knowledge Bases <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">product page.</a> To get started, see the Amazon Bedrock Knowledge Bases <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "d05ea04b7ce5487c3c1635a9a23f4e4b":
    "id": "d05ea04b7ce5487c3c1635a9a23f4e4b"
    "title": "AWS Outposts racks now support bmn-cx3a instances, the first AMD-based instances with accelerated networking on Outposts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-outposts-amd-bmn-cx3a/"
    "published": "2026-06-17 23:30:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>AWS announces the availability of bmn-cx3a instances on second-generation AWS Outposts racks. Bmn-cx3a instances feature 5th Gen AMD EPYC processors with a maximum frequency of 4.1 GHz and NVIDIA ConnectX-7 (CX7) network interface cards, delivering up to 800 Gbps of bare-metal accelerated network bandwidth operating at near line rate.<br /> <br /> Bmn-cx3a instances offer up to 256 cores and 1.5 TB of memory across two sizes, bmn-cx3a.metal-32xl and bmn-cx3a.metal-64xl, with 2x 8 TB NVMe SSD storage. With native Layer 2 (L2) multicast and hardware Precision Time Protocol (PTP) support, bmn-cx3a instances are designed for high-throughput workloads such as real-time market data ingestion and distribution, market and risk analytics, telecom 5G core network applications, and media distribution.<br /> <br /> Bmn-cx3a instances on AWS Outposts racks are available in all countries and regions where second-generation Outposts racks are supported. For a current list of AWS Regions and countries/territories where Outposts racks are supported, check out the <a href=\"https://aws.amazon.com/outposts/rack/faqs/#product-faqs%23in-which-countries-and-territories-is-outposts-rack-available-trigger\">Outposts rack FAQs page</a>.</p>"
  "9420e88b1d51154b1a23ed1ebc2f0d8f":
    "id": "9420e88b1d51154b1a23ed1ebc2f0d8f"
    "title": "Amazon Bedrock AgentCore introduces new optimization capabilities to continuously improve agents in production"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-new-optimization-capabilities"
    "published": "2026-06-17 21:00:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>Today, AWS announces new optimization capabilities in AgentCore that turn production traces into continuous improvement for agents. The most dangerous agent failures are not the ones that throw errors. They are the silent ones that look fine on dashboards. These failures produce no error signal and often surface through customer complaints weeks later. AgentCore closes that gap with a loop to understand what agents are doing, generate fixes grounded in data, and prove they work.<br /> <br /> To understand agent behavior, AgentCore surfaces failure, intent, and trajectory insights across hundreds of sessions, revealing patterns no dashboard or one-at-a-time trace review would catch. Failure insights discover recurring failure patterns, including silent behavioral failures, explain the root cause of each, and rank them by how widespread they are, so teams can fix the problems hurting the most users first. Intent insights cluster requests by what users were trying to do, and trajectory insights group the paths agents take through a task, surfacing common patterns and outliers. Customers can enable continuous monitoring or run a targeted investigation in minutes. To fix issues with confidence, recommendations analyze traces and evaluation outputs to suggest specific improvements to system prompts and tool descriptions, grounded in how the agent actually behaves. Each recommendation includes a clear rationale tied to observed failures and comes ready to validate, not a generic suggestion but a targeted change derived from production data. Before a change reaches users, batch evaluation tests recommendations against a defined test dataset and reports aggregate scores across multiple evaluators, catching regressions early. Customers define what \"good\" looks like, and batch evaluation measures each candidate change against that bar at scale. A/B testing then confirms improvements hold under real conditions, running a controlled comparison between agent versions by splitting live production traffic and measuring outcomes side by side. This provides statistical evidence that a change actually works in production, not just on test data, before customers commit to rolling it out fleet-wide. These capabilities work regardless of where agents run: on AgentCore’s runtime, AWS Lambda, Amazon EKS, or non-AWS environments.<br /> <br /> Failure, intent, and trajectory insights are available in preview today in <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">13 AWS Regions.</a> Batch evaluations, recommendations, and A/B tests are generally available today in <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">14 AWS Regions</a>. To learn more, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/\">Amazon Bedrock AgentCore</a> or explore the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/optimization.html\">documentation</a>.</p>"
  "f99232f575d5f25090fa33ece6a01d7e":
    "id": "f99232f575d5f25090fa33ece6a01d7e"
    "title": "AWS Security Agent announces support for Threat Modeling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-security-agent-threat-modeling/"
    "published": "2026-06-17 13:00:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>AWS Security Agent (now part of AWS Continuum) now includes threat modeling, an AI-powered agentic capability that automatically generates threat models for your applications. Available today in public preview, AWS Security Agent analyzes your design documents or application source code, understands the full context of your application architecture, and identifies threats with recommended mitigations using the STRIDE framework.</p> \n<p>Threat modeling is critical but often requires specialized expertise and significant manual effort. The threat modeling capability brings agentic AI reasoning to this process by deeply analyzing your code and documentation to understand architecture, data flows, and trust boundaries, then producing a contextually relevant threat model with actionable mitigations across all six STRIDE categories.</p> \n<p>Developers can integrate the agent into IDEs such as Kiro and Claude Code to create threat models from specs and address threats early in the design phase. Security teams can use it for pre-deployment assessments against design documents and source code.</p> \n<p>The threat modeling capability is available in all regions supported by AWS Security Agent, at no additional cost during the public preview.&nbsp;</p> \n<p>To learn more, visit our <a href=\"https://aws.amazon.com/blogs/aws/aws-security-agent-adds-threat-modeling-kiro-power-and-claude-code-plugin-and-more\">blog post</a> or our&nbsp;<a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/what-is.html\">documentation</a> page.</p>"
  "689e316864c0092fd65c6bcd44145d5e":
    "id": "689e316864c0092fd65c6bcd44145d5e"
    "title": "AWS Security Agent adds Kiro Power, Claude Code, simulated validations and new integrations support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-kiro-power-claude-code/"
    "published": "2026-06-17 13:00:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>AWS Security Agent (now part of AWS Continuum) adds support for Kiro and Claude Code, enabling developers to trigger security scans directly from their development environment. AWS Security Agent now also validates code scanner findings by simulating exploits in a sandbox environment and providing proof of exploit, so teams can trust their results, minimize false positives, and prioritize remediation with confidence. Additionally, this release adds integrations with GitLab.com, GitLab Self Managed, GitHub Enterprise, Bitbucket, and Confluence.</p> \n<p>With simulated validations, the code scanner goes beyond detection as it executes findings in an isolated environment and returns evidence demonstrating how a vulnerability can be exploited. Security teams no longer need to spend cycles triaging unverified alerts; they get legitimate, proven findings with the context needed to make the right prioritization decisions.</p> \n<p>Kiro power and Claude Code plugin for AWS Security Agent lets developers connect their existing source control platforms and build threat models, run code scans and remediate validated findings from code review and penetration tests without leaving their IDE.</p> \n<p>These features are available in all regions where AWS Security Agent is supported.&nbsp;</p> \n<p>To learn more, visit our <a href=\"https://aws.amazon.com/blogs/aws/aws-security-agent-adds-threat-modeling-kiro-power-and-claude-code-plugin-and-more\">blog post</a> or our&nbsp;<a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/what-is.html\">documentation </a>page.&nbsp;</p>"
  "eb8ffc2d92f44bb493ef836bbd30187a":
    "id": "eb8ffc2d92f44bb493ef836bbd30187a"
    "title": "Amazon Bedrock Guardrails adds automated reasoning checks in Sydney"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-guardrails-sydney/"
    "published": "2026-06-17 05:07:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>Automated Reasoning checks in Amazon Bedrock Guardrails use formal verification techniques to validate AI model outputs with mathematical rigor, providing a fundamentally different approach from traditional sampling-based testing methods. This capability addresses critical challenges in deploying generative AI applications, including AI hallucinations, policy compliance violations, and ambiguous responses that can undermine trust in AI systems. Organizations in regulated industries such as finance, healthcare, and legal services, as well as any enterprise requiring unambiguous validation of AI outputs, can now leverage this advanced verification capability.</p> \n<p>The feature delivers up to 99% accuracy in detecting correct responses from large language models, offering provable assurance through mathematical guarantees rather than probabilistic testing. Automated Reasoning checks help enterprises meet regulatory requirements for AI deployment while significantly reducing risks associated with incorrect or fabricated model outputs. Specific use cases include validating AI responses before production deployment in regulated environments, ensuring business rule compliance in enterprise applications, and providing quality assurance for generative AI outputs in critical workflows where ambiguity cannot be tolerated.</p> \n<p>Automated Reasoning checks in Amazon Bedrock Guardrails are now available in the Asia Pacific (Sydney) Region, joining existing availability in US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), and Europe (Paris). Customers can access this capability through the Amazon Bedrock console or the Amazon Bedrock SDK. To learn more about Automated Reasoning checks and Amazon Bedrock Guardrails, visit <a href=\"https://aws.amazon.com/bedrock/guardrails/\">Amazon Bedrock Guardrails</a>.</p>"
  "a6f78bcb324635f21f8b81129e187cf3":
    "id": "a6f78bcb324635f21f8b81129e187cf3"
    "title": "Amazon Quick expands integrations with new connectors for Adobe, Figma, WhatsApp, and more"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-quick-adobe-figma-whatsapp/"
    "published": "2026-06-17 00:20:00"
    "fetched": "2026-06-18 04:23:04"
    "summary": "<p>Amazon Quick now connects to 16 additional tools, allowing teams to act on insights from their data, analytics, design, and communication apps without switching context. New connectors include Adobe, Cisco Video Messaging, Cisco Webex Meetings, Dun &amp; Bradstreet, Figma, Google Chat, HG Insights, Microsoft OneNote, Moody’s, Shopify, Smartsheet, Snowflake, Visier, WhatsApp, Zapier, and ZoomInfo.</p> \n<p>With this expansion, Quick now integrates across productivity, design, analytics, data infrastructure, financial intelligence, commerce, and communication covering the tools teams already rely on and making it easier to build workflows that combine multiple tools in a single conversation. For example, a revenue team can enrich account data from Dun &amp; Bradstreet, cross-reference it against a Snowflake dataset, and track outreach tasks in Smartsheet without leaving Quick. Teams can add new tools to their workspace in minutes and immediately start incorporating them into Quick Flows, Chat, and Spaces alongside their existing integrations.</p> \n<p>These integrations are available in all <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" target=\"_blank\">AWS Regions</a> where Amazon Quick is available.</p> \n<p>Visit the Amazon Quick website to learn more and <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">start your Quick free trial</a>. To learn more about Quick integrations, visit the <a href=\"https://aws.amazon.com/quick/integrations/\" target=\"_blank\">integrations page</a>.&nbsp;</p>"
  "f60b6a845a0990fcae423b18d680bb13":
    "id": "f60b6a845a0990fcae423b18d680bb13"
    "title": "Amazon Quick announces autonomous agents, multi-dataset analytics, and redesigned activity feed"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-quick/"
    "published": "2026-06-17 22:40:00"
    "fetched": "2026-06-18 06:57:27"
    "summary": "<p>Today, AWS announces multiple new features for Amazon Quick, including autonomous agents, multi-dataset analytics capabilities, and a redesigned activity feed. Amazon Quick is the AI assistant that connects to popular business applications and learns user workflows. These new capabilities enable Quick to handle recurring tasks continuously while providing unified analytics across multiple data sources.</p> \n<p><br /> With autonomous agents, users can describe tasks in natural language and set granular autonomy levels—from step-by-step approval to broad goal-based execution. Agents operate continuously to automate workflows like following up on stalled deals, summarizing regulatory changes, and processing purchase orders, eliminating manual repetitive work and notification overload. The new multi-dataset analytics feature enables users to query across data sources including Snowflake and relational databases using natural language, without requiring technical data preparation or pre-joining datasets. Quick inherits semantic intelligence from existing data catalogs such as AWS Glue, Databricks Unity Catalog, and Collibra, while enforcing security through identity propagation that respects existing permissions.</p> \n<p><br /> The redesigned activity feed provides a personalized, conversational interface where users can prioritize updates using thumbs up/down feedback, reply to emails and Slack messages, and approve requests directly—all without switching between applications. Users can also share Quick applications as public websites, extending collaboration capabilities beyond their organization.</p> \n<p><br /> To learn more about these new Amazon Quick capabilities, including autonomous agents, multi-dataset analytics., and redesigned activity feed, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/get-back-hours-every-day-with-amazon-quicks-new-autonomous-agents/\" target=\"_blank\">launch blog</a>. You can create an account for free and get started in minutes at <a href=\"http://aws.com/quick\" target=\"_blank\">aws.com/quick</a>.</p>"
  "c83435da27c52e1e06f8ca2a83bd82d1":
    "id": "c83435da27c52e1e06f8ca2a83bd82d1"
    "title": "AWS Glue Data Catalog now supports business context and semantic search (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-glue-data-catalog/"
    "published": "2026-06-17 21:00:00"
    "fetched": "2026-06-18 06:57:27"
    "summary": "<p>Today, AWS announces the preview of business context and semantic search for AWS Glue Data Catalog, helping you discover and understand data by semantic meaning. You can now enrich your Glue Data Catalog tables, including those backed by S3 Tables, with glossary terms and custom metadata fields. You can also add skills to the catalog that direct agents to additional context about your data. With business context indexed alongside technical metadata, you can use the new Glue Search API to find data by semantic meaning, and ground your AI agents in trusted definitions rather than inferred context.</p> \n<p>You can use the new search capability to find tables in the catalog both by their structure, such as schema and table format, and by the business meaning you attach through glossary terms and descriptive metadata fields. This means an analyst exploring data or an agent reasoning about it can retrieve a table's definition, what its data represents, and how to use it correctly, in a single step. Any MCP-compatible agent, including Claude Code, Kiro, Cursor, and Codex, can get started with virtually no setup using the aws-data-analytics plugin from the Agent Toolkit for AWS.</p> \n<p>Business context and semantic search for AWS Glue Data Catalog is available in preview in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), and Europe (Ireland). To learn more, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/catalog-business-context-getting-started.html\">AWS Glue User Guide</a>. To connect an AI agent to Glue Data Catalog, install the aws-data-analytics plugin from the <a href=\"https://github.com/aws/agent-toolkit-for-aws\">Agent Toolkit for AWS</a> repository on GitHub.</p>"
  "f92b694fc080e0a777436eab7d763347":
    "id": "f92b694fc080e0a777436eab7d763347"
    "title": "Oracle Database@AWS now supports Oracle Autonomous AI Database Serverless"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/oracle-database-aws-autonomous-database-serverless/"
    "published": "2026-06-17 16:00:00"
    "fetched": "2026-06-18 06:57:27"
    "summary": "<p>Oracle Database@AWS now supports Oracle Autonomous AI Database Serverless (ADB-S), a fully managed Oracle database service on Exadata infrastructure that automatically handles patching, tuning, and scaling. ADB-S is available through both public and private offers on AWS Marketplace, with support for Bring Your Own License and License Included options.<br /> <br /> With ADB-S, you can provision an Oracle Autonomous AI Database directly from the AWS Management Console, AWS CLI, or AWS APIs without provisioning dedicated Exadata infrastructure or VM clusters. ADB-S supports four workload types - AI Transaction Processing, AI Lakehouse, AI JSON Database, and Oracle APEX - with compute and storage that scale independently based on workload demand. ADB-S includes Autonomous Data Guard for high availability and disaster recovery, automated backups to Amazon S3, and cross-Region disaster recovery. ADB-S integrates with AWS Key Management Service (KMS) for encryption, Amazon CloudWatch for monitoring, and Amazon EventBridge for event management.<br /> <br /> Oracle Autonomous AI Database Serverless on Oracle Database@AWS is available in the US East (N. Virginia) and US West (Oregon) AWS Regions. To learn more, visit <a href=\"https://aws.amazon.com/marketplace/featured-seller/oracle/\" rel=\"noopener noreferrer\" target=\"_blank\">Oracle Database@AWS</a> and the <a href=\"https://docs.aws.amazon.com/odb/latest/UserGuide/what-is-odb.html\" rel=\"noopener noreferrer\" target=\"_blank\">Oracle Database@AWS User Guide</a>. To get started, subscribe through <a href=\"https://aws.amazon.com/marketplace/pp/prodview-qks5dl3hr7nfw?applicationId=AWSMPContessa&amp;ref_=beagle&amp;sr=0-1\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Marketplace</a>.</p>"
  "c156ea01b3eec9218915f90ac8871587":
    "id": "c156ea01b3eec9218915f90ac8871587"
    "title": "AWS Secrets Manager introduces safe secrets handling in the Agent Toolkit for AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/safe-secrets-handling-in-agent-toolkit-for-aws/"
    "published": "2026-06-17 16:00:00"
    "fetched": "2026-06-18 08:26:50"
    "summary": "<p>AWS Secrets Manager now offers a secret safety skill as part of the aws-core plugin in the <a href=\"https://github.com/aws/agent-toolkit-for-aws\">Agent Toolkit for AWS</a>, an open-source repository that equips AI coding agents with tools, knowledge, and guardrails for building on AWS. The skill lets developers use secrets within agentic workflows without ever exposing secret values to the underlying model or session logs.<br /> <br /> Until now, developers using AI coding agents could retrieve secrets as plain text without any guardrails, bringing sensitive values into agent context. With this skill, agents can securely retrieve and consume secrets without passing secret values through the context window, adding a layer of protection. To achieve this, the skill uses a two-layer approach. First, it steers the agent so the model never requests or receives a raw secret value—instead prompting the developer to clarify intent and constructing a command that <i>uses</i> the secret rather than retrieving it. Second, a child process resolves secret references to actual values only at execution time, outside the agent process. Together, these layers ensure plaintext secrets never appear in model context, session logs, or agent memory—without disrupting the developer's workflow.<br /> <br /> The secret safety skill is available today for all agent harnesses supported by the Agent Toolkit for AWS—including Claude Code, Codex, and Cursor—and in all AWS Regions where Secrets Manager is available. To get started, visit the <a href=\"https://github.com/aws/agent-toolkit-for-aws\">Agent Toolkit for AWS repository on GitHub</a> and install the aws-core plugin for your preferred coding agent. For details, refer to the <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/retrieving-secrets-ai-agents.html\">documentation</a>.</p>"
  "98ca0872b0ae4f5c2e695532930aa9b2":
    "id": "98ca0872b0ae4f5c2e695532930aa9b2"
    "title": "AgentCore harness is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-harness-generally-available"
    "published": "2026-06-17 21:00:00"
    "fetched": "2026-06-19 01:26:36"
    "summary": "<p>Today, AWS announces the general availability of the managed agent harness in Amazon Bedrock AgentCore, taking teams from idea to working agents in minutes. An agent is more than a model. If the model is the brain, the harness is the body: everything the brain needs to get work done. It runs the orchestration loop, executes tools, manages the context window, persists state across turns, recovers from failures, and isolates each session. The harness shapes how well an agent performs as much as the model does, and building a durable one is where most teams spend their time today. AgentCore harness provides that layer as a managed capability. Instead of coding the loop, customers define an agent in configuration: the model it uses, the tools it calls, the skills it accesses, and the instructions it follows, and AgentCore assembles and runs that loop. From that single definition, a production-grade agent runs in minutes in its own isolated environment, with a filesystem and shell, memory across sessions, skills including the AWS-curated catalog, and web browsing. This is not a starter tool teams outgrow: the configuration they start with is what they operate at scale, and when custom orchestration is needed, the harness exports to code on the same platform without rebuilding anything.<br /> <br /> Besides speed, AgentCore decouples the harness from the model. Customers can choose any model and switch providers mid-session without losing context or touching agent logic, for example planning with one model and writing code with another. The harness is also one piece of a single platform, not a hosting layer wrapped around a framework. It reaches tools through the same gateway that enforces security policies, and connects the agent to organizational knowledge and web search. Identity, memory, and observability come from that same platform, so every agent action is governed and traced from the first call without additional wiring. When a use case needs custom orchestration, a single CLI command exports the harness to Strands-based code on the same compute and primitives, with Claude Agent SDK coming soon as an export target. The agent declared on day one is the agent that runs at the thousandth, on the same foundation throughout.<br /> <br /> AgentCore harness is generally available today in all <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Commercial Regions</a> where AgentCore is available. Learn more using the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/harness.html\">documentation</a>.&nbsp;</p>"
"last_updated": "2026-06-19 01:26:36 JST"
