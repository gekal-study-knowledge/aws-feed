    "fetched": "2026-06-09 02:19:55"
    "summary": "In this post, we introduce mathematical optimization, explain how it fits within the broader AI landscape, and showcase real-world success stories where the Innovation Center has partnered with customers to deliver concrete results."
  "b6e4ae654c106455fbfdc26cb998ccb3":
    "id": "b6e4ae654c106455fbfdc26cb998ccb3"
    "title": "End-to-end encrypted ML inference with Amazon SageMaker AI and FHE"
    "link": "https://aws.amazon.com/blogs/machine-learning/end-to-end-encrypted-ml-inference-with-amazon-sagemaker-ai-and-fhe/"
    "published": "2026-06-09 01:14:14"
    "fetched": "2026-06-09 02:19:55"
    "summary": "This blog has previously discussed FHE for ML inference in the post Enable fully homomorphic encryption with Amazon SageMaker endpoints for secure, real-time inferencing, but this post goes a little further. That previous post showed how to implement FHE-based inference 'from scratch' by hand-crafting a linear-regression algorithm using a low-level library called SEAL. Instead, this post shows a much more flexible and higher-level approach based on concrete-ml, a high-level library built specifically for FHE-based inference. It supports several common types of models 'out of the box' and is even API compatible with the well-known ML library scikit-learn."
  "f63ceee5d5fbe4863b1e6bb69cc6fbbb":
    "id": "f63ceee5d5fbe4863b1e6bb69cc6fbbb"
    "title": "Amazon Quick ARNs: Cross-account migration and namespace permissions"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-quick-arns-cross-account-migration-and-namespace-permissions/"
    "published": "2026-06-09 01:07:29"
    "fetched": "2026-06-09 02:19:55"
    "summary": "In this post, we cover the structure of Amazon Quick ARNs and provide a practical mental model for working with them. By the end, you can look at an ARN and immediately understand what it means for your migration strategy, diagnose permission issues faster, and design multi-tenant architectures with confidence."
  "1dc98e28f4eb287c9fb1dd05c26d9fa5":
    "id": "1dc98e28f4eb287c9fb1dd05c26d9fa5"
    "title": "Evaluate your Amazon Nova Sonic voice agent at scale, no microphone required"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluate-your-amazon-nova-sonic-voice-agent-at-scale-no-microphone-required/"
    "published": "2026-06-09 00:57:45"
    "fetched": "2026-06-09 02:19:55"
    "summary": "In this post, we walk you through the Nova Sonic Test Harness, an open source framework that we built to solve both problems. It serves as a rapid iteration tool for tuning system prompts and tool configurations (run a conversation, see results, adjust, repeat) and as a comprehensive evaluation framework for validating voice agent quality at scale. It runs complete multi-turn conversations with Amazon Nova Sonic automatically, evaluates them using LLM-as-judge techniques, and can even detect cases where the model’s audio output doesn’t match its text output (audio hallucinations). No microphone required."
