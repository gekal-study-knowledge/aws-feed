    "title": "CVE-2026-11393 - Code Injection via Improper Triple-Quote Escaping in AgentCore CLI Bedrock Agent Import"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-040-aws/"
    "published": "2026-06-09 03:54:30"
    "fetched": "2026-06-09 05:09:34"
    "summary": "<p><b>Bulletin ID:</b> 2026-040-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 06/08/2026 11:45 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The AWS AgentCore CLI (@aws/agentcore) is a developer tool for managing agent infrastructure lifecycle on Amazon Bedrock AgentCore. We identified CVE-2026-11393 in which improper neutralization of triple-quote characters during Python code generation may allow an authenticated user in the same AWS account to inject arbitrary Python code into the source file generated by the \"agentcore add agent ‐‐type import\" command.</p> \n<p>Specifically, the collaborationInstruction field of a Bedrock Agent collaborator association was interpolated into a triple-quoted Python docstring using single-quote escaping rather than triple-quote escaping. A user with bedrock:AssociateAgentCollaborator IAM permission could craft a collaborationInstruction value containing \"\"\" to break out of the docstring boundary in the generated main.py of the imported agent. If that generated file was subsequently executed - either via agentcore dev on the developer's local machine, or via agentcore deploy followed by agentcore invoke in the AgentCore Runtime environment - the injected Python would run with the credentials available in that context.</p> \n<p><b>Impacted versions:</b><br /> - @aws/agentcore &gt;= 0.4.0 AND &lt;= 0.14.1<br /> - preview versions &gt;= 0.3.0-preview.7.0 and &lt;= 1.0.0-preview.8</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
