"entries":
  "9f4bb0261eb97f05d70bce7aa48e2be5":
    "id": "9f4bb0261eb97f05d70bce7aa48e2be5"
    "title": "AWS Application Migration Service is now AWS Transform MGN"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-mgn-rebrand/"
    "published": "2026-06-09 02:00:00"
    "fetched": "2026-06-09 05:09:33"
    "summary": "<p>AWS Application Migration Service (MGN) is now available as <b>AWS Transform MGN</b>. This name change reflects MGN's role as the proven replication engine powering AWS Transform, the agentic migration service.<br /> <br /> You can choose between two rehosting experiences. Use the AWS Transform MGN console for direct control over replication and cutover. Or use the AWS Transform agentic workflow, where an agent handles discovery, wave planning, landing zone setup, network creation, and rehosting or containerization on your behalf, accelerating your path to AWS.<br /> <br /> AWS Transform MGN retains all of its existing compliance certifications, including FedRAMP High, HIPAA, PCI DSS, ISO, and SOC 1, 2, and 3, so you can migrate with confidence. It is available in all commercial regions and both GovCloud (US) Regions.<br /> <br /> Visit the <a href=\"https://aws.amazon.com/application-migration-service/\">AWS Transform MGN product page</a> and <a href=\"https://docs.aws.amazon.com/mgn/latest/ug/what-is-mgn.html\">AWS Transform MGN documentation</a> for more information on how to rehost applications to AWS.</p>"
  "a5f8a6216f10ae5fb7102a064c99d8f8":
    "id": "a5f8a6216f10ae5fb7102a064c99d8f8"
    "title": "Amazon Redshift reduces manual snapshot cost for Serverless and RG instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-incremental-manual-snapshots/"
    "published": "2026-06-09 00:00:00"
    "fetched": "2026-06-09 05:09:33"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> announces a new billing model for manual snapshots on <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Amazon Redshift Serverless</a> and <a href=\"https://aws.amazon.com/redshift/features/rg/\">Amazon Redshift RG</a> instances. With this enhancement, Amazon Redshift now meters manual snapshot storage based on the unique data blocks stored across your snapshots rather than the total size of each individual snapshot. This results in lower manual snapshot costs for customers who maintain multiple snapshots.<br /> <br /> Customers who maintain multiple manual snapshots for disaster recovery, testing, or long-term retention will see reduced storage costs. With this new billing model, you can take more frequent manual snapshots to achieve a better recovery point objective (RPO) without proportional cost increases, enabling more robust disaster recovery strategies. The new billing model automatically applies to both existing and new manual snapshots.<br /> <br /> The new manual snapshot billing model is available in all AWS commercial and AWS GovCloud (US) Regions where Amazon Redshift Serverless and Amazon Redshift RG instances are available. To learn more about Amazon Redshift snapshots, please visit our <a href=\"https://aws.amazon.com/redshift/pricing/\">documentation</a> or the <a href=\"https://aws.amazon.com/blogs/big-data/unlock-cost-savings-with-incremental-snapshot-billing-for-amazon-redshift-serverless-and-amazon-redshift-rg/\">blog</a>.</p>"
  "675b7eec142b62c97b8bc177da8378c4":
    "id": "675b7eec142b62c97b8bc177da8378c4"
    "title": "AWS Compute Optimizer now supports idle recommendations for six additional resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-compute-optimizer-six-new-idle"
    "published": "2026-06-09 06:00:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>AWS Compute Optimizer now identifies idle resources for Amazon DynamoDB provisioned tables, Amazon ElastiCache (Redis and Valkey), Amazon MemoryDB, Amazon DocumentDB (provisioned and serverless), Amazon WorkSpaces, and Amazon SageMaker endpoints. This expansion enables you to detect unused resources across more of your AWS environment and identify potential cost savings.</p> \n<p>Compute Optimizer analyzes utilization metrics to determine whether a resource is idle. Customers can set this lookback period based on the nature of their workloads. For each resource type, Compute Optimizer evaluates service-specific signals such as consumed capacity, cache hits, active connections, and CPU utilization. When Compute Optimizer identifies potential idle resources, it surfaces these recommendations, along with detailed utilization metrics and estimated savings in the console, enabling you to evaluate recommendations before acting. You can also view idle resource recommendations across all AWS accounts in your organization through the Cost Optimization Hub, with de-duplicated estimated savings with other recommendations on the same resources.</p> \n<p>For more information about the AWS Regions where Compute Optimizer is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>. For more information about AWS Compute Optimizer, visit our <a href=\"https://aws.amazon.com/compute-optimizer/\">product page</a> and <a href=\"https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-ec2-recommendations.html\">documentation</a>. You can start using AWS Compute Optimizer through the AWS Management Console, AWS CLI, and AWS SDK.</p>"
  "af78885d933aed4e1efb80262c836a41":
    "id": "af78885d933aed4e1efb80262c836a41"
    "title": "Amazon MSK Express Brokers now support automatic topic creation with Kafka Streams"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-msk-express-topic-support-kstreams/"
    "published": "2026-06-09 04:36:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>Effective today, Amazon MSK Express Brokers support automatic topic creation with Kafka Streams. Customers can now deploy their Kafka Streams applications on Express Brokers without needing to manually pre-create<b> </b>or manage topics for stateful operations.<br /> <br /> MSK Express Brokers are designed to deliver up to three times more throughput per broker, scale up to 20 times faster, and reduce recovery time by 90 percent. Kafka Streams uses topics to store state and repartition data for stateful operations. Previously, customers running Kafka Streams with Express Brokers had to manually name and pre-create these topics before deploying their application. With this launch, these topics are created automatically when the application starts, simplifying deployment and reducing operational setup for Kafka Streams applications on Express Brokers.<br /> <br /> This capability is available today in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS regions</a> where MSK Express Brokers are available. No additional configuration or setup is required to get started. To learn more, see <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MSK Developer Guide</a>.</p>"
  "d9c64e55a2ae8b4cf0d678fd662e6028":
    "id": "d9c64e55a2ae8b4cf0d678fd662e6028"
    "title": "Amazon DocumentDB now supports engine minor version starting with 5.0.1"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-documentdb-engine-minor-version-5-0-1/"
    "published": "2026-06-09 03:59:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) now supports engine minor versions, starting with 5.0.1. This release delivers enhanced aggregation capabilities with new operators ($rand, $pow, $dateToParts, $dateFromParts), the active connections metric to monitor instances, and granular command-level performance metrics in CloudWatch (find, insert, findAndModify, update, etc.). For a full list of what's included, see <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/release-notes.html\">release notes</a>. Minor versions provide new features and bug fixes within the same major version, giving you more control over when and how you upgrade your clusters. We recommend upgrading to the latest minor version to benefit from these performance enhancements, bug fixes, and new capabilities.<br /> <br /> You can specify minor version 5.0.1 when creating a new cluster, or manually upgrade an existing 5.0.0 cluster to 5.0.1 using the AWS Management Console or AWS CLI (via the modify-db-cluster command with --engine-version 5.0.1). Once you upgrade to a newer minor version, you cannot downgrade back to a previous minor version. Upgrading from 5.0.0 (LTS) to 5.0.1 gives you access to the latest features and fixes, but you will no longer be on the LTS track. If minimizing upgrades is your priority, you should remain on LTS. For more information, see <a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-lts-release.html\">Using a long-term support (LTS) release</a>.<br /> <br /> Amazon DocumentDB engine minor version 5.0.1 is available in all AWS Regions where Amazon DocumentDB 5.0 is available. Learn more about minor version upgrades and version support dates in the <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-version-support-dates.html\">Amazon DocumentDB Developer Guide</a>. Create or update a fully managed Amazon DocumentDB cluster in the <a href=\"https://console.aws.amazon.com/docdb/\">Amazon DocumentDB Management Console</a>.</p>"
  "e0250d86e78823e5c81287699e47feb1":
    "id": "e0250d86e78823e5c81287699e47feb1"
    "title": "AWS Savings Plans Purchase Analyzer now supports target coverage analysis"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-savings-plans-coverage/"
    "published": "2026-06-09 02:16:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>Today, AWS announces target coverage analysis in Savings Plans Purchase Analyzer, a capability in AWS Billing and Cost Management that helps you plan your Savings Plans purchases based on your coverage target. Savings Plans Purchase Analyzer helps you evaluate different purchase scenarios by estimating the potential impact of Savings Plans purchases on cost, coverage, utilization, and savings.<br /> <br /> With target coverage analysis, you can set a specific percentage of On-Demand spend to be covered by Savings Plans. Savings Plans Purchase Analyzer uses your historical usage to recommend a new purchase amount to help you reach that target. You can further customize your analysis using parameters such as custom lookback period or excluding expiring Savings Plans, and compare cost, coverage, utilization, and savings across different coverage targets. You can view your recommendations through interactive charts or access your target coverage analysis via the Purchase Analyzer API.<br /> <br /> Target coverage analysis is available in all AWS Regions where Savings Plans Purchase Analyzer is available. To learn more, visit the <a href=\"https://aws.amazon.com/savingsplans/\">AWS Savings Plans page</a> and <a href=\"https://docs.aws.amazon.com/savingsplans/latest/userguide/sp-analyzer.html\">user guide</a>.</p>"
  "59b755be139c7802982b5d07b7313902":
    "id": "59b755be139c7802982b5d07b7313902"
    "title": "PostgreSQL 19 Beta 1 is now available in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/postgresql-19-beta-1-amazon-rds-database-preview-environment/"
    "published": "2026-06-09 02:03:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\">Amazon RDS for PostgreSQL</a> 19 Beta 1 is now available in the <a href=\"https://aws.amazon.com/rds/databasepreview/\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of PostgreSQL 19 on Amazon RDS for PostgreSQL. You can deploy PostgreSQL 19 Beta 1 in the Amazon RDS Database Preview Environment that has the benefits of a fully managed database.<br /> <br /> PostgreSQL 19 adds native graph query support via SQL Property Graph Queries (SQL/PGQ), so you can express complex relationship traversals directly in standard SQL instead of building separate application logic or syncing data across two databases. It also introduces support for concurrent table repacking that rebuilds tables and reclaims unused storage, so production databases stay accessible during routine table maintenance. Logical replication now synchronizes sequence values to the replica automatically, eliminating manual sequence reconciliation after major version upgrade cutover. Logical replication can also be enabled dynamically without a server restart, reducing planned downtime. Please refer to <a href=\"https://www.postgresql.org/about/news/postgresql-19-beta-1-released-3313/\">PostgreSQL community announcement</a> for more details.<br /> <br /> Amazon RDS Database Preview Environment database instances are retained for a maximum period of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots that are created in the preview environment can only be used to create or restore database instances within the preview environment. You can use the PostgreSQL dump and load functionality to import or export your databases from the preview environment.<br /> <br /> Amazon RDS Database Preview Environment database instances are priced as per the <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\">pricing</a> in the US East (Ohio) Region.</p>"
  "2b7dca885523159479a933252e0c9018":
    "id": "2b7dca885523159479a933252e0c9018"
    "title": "Amazon Aurora DSQL now supports the JSONB data type with compression"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-aurora-dsql-supports-jsonb/"
    "published": "2026-06-09 02:00:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>Amazon Aurora DSQL introduces support for the PostgreSQL JSONB data type with optional compression. You can now use code and tools that depend on PostgreSQL's JSONB type with Aurora DSQL, making it easier to store semi-structured data alongside relational data.<br /> <br /> You can use the JSONB data type when creating or modifying tables to store semi-structured data such as system configuration metadata, API parameters, and event logs. With PostgreSQL compression enabled by default, larger JSONB payloads are stored more efficiently, helping reduce storage costs.<br /> <br /> Get started with Aurora DSQL for free with the AWS Free Tier. For information about Regional availability, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>. You can learn more about Aurora DSQL data types, including JSONB, <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-postgresql-compatibility-supported-data-types.html\">here</a>.</p>"
  "76d0208b452dd2481b02f01620bb7a3c":
    "id": "76d0208b452dd2481b02f01620bb7a3c"
    "title": "AWS now provides AI-powered cost investigations for cost anomalies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-ai-powered-cost-investigations/"
    "published": "2026-06-09 01:41:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p><a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-anomaly-detection/\">AWS Cost Anomaly Detection</a> now includes AI-powered cost investigation, which uses Amazon Q to analyze the root cause of detected cost anomalies. Investigating a cost change typically requires correlating cost data with AWS CloudTrail events and resource activity, which can take hours. Cost investigation delivers a plain-language explanation in minutes, helping FinOps practitioners and engineering teams move from alert to action faster.</p> \n<p>When you investigate an anomaly, Amazon Q determines whether the cost change is usage-driven or rate-driven, identifies the contributing services, accounts, and regions, and for usage-driven changes, correlates with AWS CloudTrail to attribute the change to specific API calls and IAM principals. For organizations with a CloudTrail organization trail, the investigation works across all member accounts automatically. You can continue the conversation with follow-up questions to explore patterns or drill into specific resources.&nbsp;</p> \n<p>AI-powered cost investigation is available today in all commercial AWS Regions at no additional charge.&nbsp;Cross-account investigations that use an&nbsp;organization-wide CloudTrail trail delivered to Amazon CloudWatch Logs might incur&nbsp;standard CloudWatch Logs Insights charges based on data scanned.</p> \n<p>To get started, navigate to AWS Cost Anomaly Detection in the <a href=\"https://console.aws.amazon.com/costmanagement/\">AWS Billing and Cost Management console</a> and choose Investigate with Amazon Q on any detected anomaly. To learn more, see <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/investigating-ad.html\">Investigating anomaly root causes with Amazon Q</a> in the AWS Billing and Cost Management User Guide.&nbsp;</p>"
  "735ba46fe7a395416729a7092032545f":
    "id": "735ba46fe7a395416729a7092032545f"
    "title": "Amazon Connect Customer now offers AI agent trace details for self-service voice interactions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-connect-ai-agent-traces/"
    "published": "2026-06-09 01:17:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p>Amazon Connect Customer now provides AI agent traces for self-service voice interactions, enabling you to understand how AI agents reason, act, and respond during each customer conversation. With this launch, you have full visibility into how the AI agent handled an interaction, so you can confirm what worked, diagnose issues, validate behavior, and deploy agentic experiences with confidence.</p> \n<p>For example, if your AI agent fails to resolve a customer request, you can access the step-by-step trace directly in the Connect web UI alongside the full transcript, and see whether it reasoned incorrectly, called a tool with bad parameters, or timed out waiting for a response.</p> \n<p>This feature is available in all AWS Regions where Amazon Connect Customer AI Agents are supported. For more information, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/ai-agent-traces.html\">Amazon Connect Customer Administrator Guide</a>. To learn more about Amazon Connect Customer, an agentic AI solution that helps enterprises deliver exceptional customer experiences, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.</p>"
  "e9848f9bba9470e540689d1000417458":
    "id": "e9848f9bba9470e540689d1000417458"
    "title": "AWS Lambda Managed Instances expands to additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-lambda-managed-instances-region-expansion/"
    "published": "2026-06-09 02:00:00"
    "fetched": "2026-06-09 09:02:26"
    "summary": "<p>AWS Lambda Managed Instances (LMI) is now available in all commercial AWS Regions, except Israel (Tel Aviv), Middle East (Bahrain), Middle East (UAE), and Asia Pacific (Auckland). &nbsp;</p> \n<p>LMI lets you run Lambda functions on managed Amazon EC2 instances, giving you access to specialized compute configurations and EC2 pricing advantages while maintaining Lambda's operational simplicity. LMI fully manages instance lifecycle, OS and runtime patching, routing, load balancing, and auto-scaling, so you can focus on writing code. You can process parallel requests within each execution environment, maximizing resource utilization and improving price-performance. You can further improve costs by leveraging EC2 pricing models including Compute Savings Plans and Reserved Instances. LMI is ideal for customers requiring specialized hardware configurations, as well as those with steady-state or predictable workloads seeking to optimize costs.</p> \n<p>You can continue building functions with familiar development workflows, including the Console and your preferred IDEs. To get started, create a capacity provider that defines your compute preferences, including VPC configuration, optional instance requirements, and scaling policies. Then, attach your Lambda functions to the capacity provider via the AWS Lambda Console, APIs, or Infrastructure as Code tooling. LMI integrates seamlessly with all Lambda event sources and tools like Amazon CloudWatch, AWS X-Ray, and AWS Config.&nbsp;To learn more, visit AWS Lambda&nbsp;<a href=\"https://aws.amazon.com/lambda/pricing/\">pricing</a>, AWS Lambda Managed Instances <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/compute/build-high-performance-apps-with-aws-lambda-managed-instances/\">blog</a>.&nbsp;</p>"
  "9526585da2a95f51231d55352d303f47":
    "id": "9526585da2a95f51231d55352d303f47"
    "title": "AWS Cost Explorer launches intelligent cost explanations powered by Amazon Q"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-cost-explorer-intelligent-cost-explanations"
    "published": "2026-06-09 12:00:00"
    "fetched": "2026-06-09 18:35:43"
    "summary": "<p>AWS Cost Explorer now supports 'Analyze with Amazon Q', a new capability that delivers comprehensive cost explanations for any report you configure in Cost Explorer. With a single button click you now can receive detailed analysis from Amazon Q Developer covering your cost trends, top cost drivers, and anomalies. All analysis uses your exact filters and time-period and provides guidance to discover optimization opportunities through follow-up questions.</p> \n<p>Previously, cost analysis required manual investigation across multiple filters and data points. With 'Analyze with Amazon Q', you simply configure your Cost Explorer view and click a single button. Amazon Q analyzes your current context and delivers explanations directly in its chat panel, adapting to what you're viewing: historical explanations for past dates, forecast explanations for future dates, or both for mixed periods. You can then ask follow-up questions to explore any insights related to your cost data in greater detail as Amazon Q maintains full conversation context throughout.</p> \n<p>'Analyze with Amazon Q' is available in all commercial AWS Regions at no additional charge. To get started, visit the <a href=\"https://console.aws.amazon.com/cost-management/home\">AWS Cost Explorer</a> console, or view the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">user guide</a>.</p>"
  "a476dfef7e4bdb4b8aa8de4a68aa6f0c":
    "id": "a476dfef7e4bdb4b8aa8de4a68aa6f0c"
    "title": "Amazon CloudWatch Logs Insights adds 23 new query commands and functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-logs-insights-new/"
    "published": "2026-06-09 02:50:00"
    "fetched": "2026-06-09 18:35:43"
    "summary": "<p>Amazon CloudWatch Logs Insights query language now supports 23 new commands and functions that give you new ways to query, parse, transform, and analyze your logs. Customers analyzing logs in CloudWatch Logs Insights often need to do conditional processing, string conversions, process IP addresses, parse different file formats, and execute complex stats commands.<br /> <br /> With this launch, CloudWatch Logs Insights provides new hash functions (md5, sha256), string functions (strcontains supporting case-insensitive search, split), conditional logic (if statement), and conversion functions (toNumber, toInt, toLong, toDouble). It also adds IP functions (ipv4ToNumber, isPrivateIP, isPublicIP, isReservedIP), analytics functions (rate, count_over_time, sum_over_time, offset, histogram), and parse functions (parse CSV, parse XML, parse multi, values, addtotals). Additionally, queries now support “limit any N” to fetch the first N results, and can use up to 10 stats commands.<br /> <br /> These commands and functions are available today in all commercial AWS Regions. To learn more, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_AnalyzeLogData_LogsInsights.html\">documentation</a>.</p>"
  "ef9252b87cdd159bf195350f652fc031":
    "id": "ef9252b87cdd159bf195350f652fc031"
    "title": "Run Interactive Workloads on Amazon EMR Serverless with Spark Connect"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/amazon-emr-serverless-spark-connect"
    "published": "2026-06-09 16:00:00"
    "fetched": "2026-06-10 02:59:06"
    "summary": "<p>Amazon EMR Serverless now supports interactive sessions with Spark Connect, enabling you to develop and run Apache Spark applications from managed notebooks in Amazon SageMaker Unified Studio, as well as your favorite notebook environments and IDEs such as Jupyter and Visual Studio Code. You can also monitor and debug active and completed sessions in the EMR console, and get granular cost and usage visibility for individual sessions.&nbsp;</p> \n<p>&nbsp;</p> \n<p>An interactive session provides a persistent Spark context that seamlessly spans across cells and scripts, enabling you to blend local Python code execution with remote Spark operations within a unified environment. This is enabled by Spark Connect's client-server architecture, which decouples your application client from the Spark driver and allows you to maintain your preferred development environment and tooling while Spark infrastructure runs independently on EMR Serverless. This architecture unlocks workflows including ad hoc data exploration, iterative step-by-step debugging, and incremental PySpark job development before deploying to production.&nbsp;&nbsp;For observability, you get real-time session monitoring via the Spark UI, history tracking through the Spark History Server, and session management from the EMR console or API/CLI/SDK.</p> \n<p>&nbsp;</p> \n<p>Spark Connect on Amazon EMR Serverless is available with EMR release 7.13 in all AWS Regions where Amazon EMR Serverless is available. The SageMaker Unified Studio experience is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\" title=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">supported regions</a>. To get started, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/spark-connect.html\">EMR Serverless Interactive Sessions User Guide</a> or the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/what-is-sagemaker-unified-studio.html\">Amazon SageMaker Unified Studio Getting Started guide.</a></p>"
"last_updated": "2026-06-10 02:59:06 JST"
