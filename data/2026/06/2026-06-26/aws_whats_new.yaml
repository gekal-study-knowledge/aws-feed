  "ecd3d94fb306da721006fce91dd97c57":
    "id": "ecd3d94fb306da721006fce91dd97c57"
    "title": "Amazon Redshift adds Reserved Instance upfront pricing options for RG instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-redshift-ri-upfront-pricing-rg-instances"
    "published": "2026-06-26 01:39:00"
    "fetched": "2026-06-26 02:09:12"
    "summary": "<p>Amazon Redshift announces the availability of All Upfront and Partial Upfront payment options for 1-year and 3-year reserved instances for RG instances. Reserved instances allow customers to benefit from significant savings over on-demand rates. The new payment options join the previously available No Upfront option, giving customers greater flexibility to optimize compute costs based on their financial preferences. All Upfront delivers the maximum discount by paying for the full reservation term at the start, while Partial Upfront splits the cost between an initial payment and lower monthly installments.</p> \n<p>Amazon Redshift RG reserved instances with All Upfront and Partial Upfront payment options are now available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), US West (N. California), Canada (Central), South America (São Paulo), Europe (Ireland), Europe (Frankfurt), Europe (London), Europe (Paris), Europe (Stockholm), Europe (Milan), Europe (Spain), Africa (Cape Town), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Mumbai), Asia Pacific (Jakarta), Asia Pacific (Hong Kong), Asia Pacific (Osaka), Asia Pacific (Malaysia), Asia Pacific (Hyderabad), Asia Pacific (Taiwan), Asia Pacific (Melbourne), Asia Pacific (Bangkok), and Mexico (Central).</p> \n<p>For pricing details, visit the <a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a>.</p>"
  "4daf44cc8ec0bea3ec305f02e19f4de7":
    "id": "4daf44cc8ec0bea3ec305f02e19f4de7"
    "title": "AWS Network Firewall now supports managed threat intelligence rules from VisionHeight"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/network-firewall-visionheight-managed-rules"
    "published": "2026-06-26 05:18:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p>AWS Network Firewall now supports two new managed rule groups from VisionHeight, available through AWS Marketplace: Zero-Day Threat Protection, and Noisy Scanners and Tor Protection. These rule groups expand the managed rules offerings for AWS Network Firewall, giving customers access to proprietary threat intelligence built on VisionHeight's Pulse telemetry.<br /> <br /> Zero-Day Threat Protection proactively blocks malicious IP infrastructure before it appears on public blocklists. This rule group helps organizations get ahead of emerging threats by weeks, strengthening defense for workloads facing targeted attacks. Tor Protection reduces firewall log noise by blocking communication with active Tor exit nodes and filtering traffic from known high-volume scanning sources. With daily refresh cycles, this rule group suppresses noise at first packet —before events are generated—lowering SOC alert volume, reducing SIEM ingestion costs, and removing Tor as a path into or out of your environment.<br /> <br /> Managed rules for AWS Network Firewall are available from AWS Marketplace sellers including Check Point, Fortinet, Infoblox, Lumen, Rapid7, ThreatSTOP, Trend Micro, and VisionHeight. For a full list of supported regions, visit the AWS Regional Services page.<br /> <br /> To get started, visit the AWS Network Firewall console or browse available managed rules in <a href=\"https://aws.amazon.com/marketplace\" target=\"_blank\">AWS Marketplace</a>. For more information, see the AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\" target=\"_blank\">product page</a> and the service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html\" target=\"_blank\">documentation</a>.</p>"
  "bb694add069f58611c369dfd40da3f00":
    "id": "bb694add069f58611c369dfd40da3f00"
    "title": "Kiro achieves FedRAMP High and DoD IL-4/5 authorization in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/kiro-fedramp-high-dod-il-4-5-govcloud-us/"
    "published": "2026-06-26 02:00:00"
    "fetched": "2026-06-26 06:28:43"
    "summary": "<p>Kiro is now FedRAMP High and Department of Defense Cloud Computing Security Requirements Guide (DoD CC SRG) Impact Level (IL) 4 and 5 authorized in the AWS GovCloud (US) Regions.<br /> <br /> Federal agencies, public sector organizations, and other enterprises with FedRAMP High and DoD CC SRG IL-4/5 compliance requirements can now use Kiro as their agentic engineering partner with confidence that it meets the security and compliance standards required for sensitive workloads.<br /> <br /> Kiro is an agentic AI with an integrated development environment (IDE) and command-line interface (CLI) that helps you build applications from prototype to production with spec-driven development. From simple to complex tasks, Kiro works alongside you to turn prompts into detailed specs, then into working code, docs, and tests — so what you build is exactly what you want and ready to share with your team. With native Model Context Protocol (MCP) support, Kiro connects to documentation, databases, APIs, and other enterprise resources, providing capability for mission-critical development workflows.<br /> <br /> For more details about Kiro in AWS GovCloud (US), visit the&nbsp;<a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">GovCloud documentation</a>&nbsp;or contact your AWS account team for more information. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "4a79da819852e5f2e1456792a2eeba22":
    "id": "4a79da819852e5f2e1456792a2eeba22"
    "title": "Amazon EC2 C7a instances are now available in the Asia Pacific (Singapore) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-c7a-instances-asia-pacific-singapore-region/"
    "published": "2026-06-26 07:24:00"
    "fetched": "2026-06-26 08:14:08"
    "summary": "<p>Starting today, the compute optimized Amazon EC2 C7a instances are now available in AWS Asia Pacific (Singapore) Region. C7a instances, powered by 4th Gen AMD EPYC processors (code-named Genoa) with a maximum frequency of 3.7 GHz, deliver up to 50% higher performance compared to C6a instances.<br /> <br /> C7a instances offer new processor capabilities such as AVX-512, VNNI, and bfloat16. They feature Double Data Rate 5 (DDR5) memory to enable high-speed access to data in memory and 2.25x more memory bandwidth compared to C6a instances, making these instances ideal for even latency sensitive workloads. C7a instances offer 12 sizes from medium to 48xlarge, including a bare-metal size. And with the launch of C7a instances, customers can attach up to 128 EBS volumes to an EC2 instance — by comparison, C6a instances allow up to 28 EBS volume attachments to an EC2 instance. These instances are built on the AWS Nitro System and ideal for high performance, compute-intensive workloads such as batch processing, distributed analytics, high performance computing (HPC), ad serving, highly-scalable multiplayer gaming, and video encoding.<br /> <br /> C7a instances are available through On-Demand, Spot Instances, and Savings Plans. To get started, visit the <a href=\"https://console.aws.amazon.com/\" target=\"_blank\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\" target=\"_blank\">AWS Command Line Interface (CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\" target=\"_blank\">AWS SDKs</a>. To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c7a/\" target=\"_blank\">C7a instances</a>.<br /> </p>"
  "a52f13992ac5dd92941e1be90bc0f50b":
    "id": "a52f13992ac5dd92941e1be90bc0f50b"
    "title": "Amazon EC2 M8a instances now available in the Asia Pacific (Mumbai) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-m8a-instances-asia-pacific-mumbai-region/"
    "published": "2026-06-26 07:15:00"
    "fetched": "2026-06-26 08:14:08"
    "summary": "<p>Starting today, the general-purpose Amazon EC2 M8a instances are available in AWS Asia Pacific (Mumbai) region. M8a instances are powered by 5th Gen AMD EPYC processors (formerly code named Turin) with a maximum frequency of 4.5 GHz, deliver up to 30% higher performance, and up to 19% better price-performance compared to M7a instances.<br /> <br /> M8a instances deliver 45% more memory bandwidth compared to M7a instances, making these instances ideal for even latency sensitive workloads. M8a instances deliver even higher performance gains for specific workloads. M8a instances are up to 60% faster for GroovyJVM benchmark, and up to 39% faster for Cassandra benchmark compared to Amazon EC2 M7a instances. M8a instances are SAP-certified and offer 12 sizes including 2 bare metal sizes. This range of instance sizes allows customers to precisely match their workload requirements.<br /> <br /> M8a instances are built using the latest sixth generation <a href=\"https://aws.amazon.com/ec2/nitro/\" target=\"_blank\">AWS Nitro Cards</a> and ideal for applications that benefit from high performance and high throughput such as financial applications, gaming, rendering, application servers, simulation modeling, mid-size data stores, application development environments, and caching fleets.<br /> <br /> To get started, sign in to the AWS Management Console. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the Amazon EC2 <a href=\"https://aws.amazon.com/ec2/instance-types/m8a\" target=\"_blank\">M8a instance page</a>.</p>"
  "5e42421be76289f810867e0fadba980c":
    "id": "5e42421be76289f810867e0fadba980c"
    "title": "OpenAI GPT, OpenAI GPT OSS, and NVIDIA Nemotron models on Amazon Bedrock receive FedRAMP High and DoD IL-4/5 approval in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/addl-bedrock-model-fedramp-il-5-govcloud"
    "published": "2026-06-26 06:00:00"
    "fetched": "2026-06-26 08:14:08"
    "summary": "<p>OpenAI GPT, OpenAI GPT OSS, and NVIDIA Nemotron models are now FedRAMP High and Department of Defense Cloud Computing Security Requirements Guide (DoD CC SRG) Impact Level (IL) 4 and 5 approved within Amazon Bedrock in the AWS GovCloud (US) Regions.</p> \n<p>Federal agencies, public sector organizations, and other enterprises with FedRAMP High and DoD CC SRG IL-4/5 compliance requirements can now use these models on Amazon Bedrock to build and scale generative AI applications with confidence that they meet the security and compliance standards required for government workloads. These models are powered by Mantle, a next-generation distributed inference engine on Amazon Bedrock, which provides high-performance serverless inference with zero operator access, automated capacity management, and out-of-the-box compatibility with OpenAI API specifications.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/whats-new/recent/feed/#https://aws.amazon.com/bedrock/?trk=7ecf60df-6136-414c-a7c3-6aa4d2d6019f&amp;sc_channel=ps&amp;ef_id=EAIaIQobChMI0-nJtciglQMVh3JHAR3wnSV-EAAYASAAEgIIGvD_BwE&amp;gads_camp=23532472972&amp;gads_ag=194311072004&amp;gads_ad=795877020842&amp;gads_kw=amazon%20bedrock&amp;gads_matchtype=e&amp;gads_network=g&amp;gads_device=c&amp;gads_geo=9007742&amp;gad_campaignid=23532472972&amp;gclid=EAIaIQobChMI0-nJtciglQMVh3JHAR3wnSV-EAAYASAAEgIIGvD_BwE\">Amazon Bedrock product page</a>, <a href=\"https://aws.amazon.com/about-aws/whats-new/recent/feed/#https://docs.aws.amazon.com/bedrock/\">Amazon Bedrock documentation</a>, and the <a href=\"https://aws.amazon.com/about-aws/whats-new/recent/feed/#https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-compliance.html\">AWS GovCloud (US) compliance page</a>. To get started, visit the <a href=\"https://aws.amazon.com/about-aws/whats-new/recent/feed/#\">Amazon Bedrock console</a>.</p>"
  "d45a36422f6f102f73ff393eca7d1de5":
    "id": "d45a36422f6f102f73ff393eca7d1de5"
    "title": "Amazon EC2 C8in instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-c8in-ireland-ohio/"
    "published": "2026-06-26 02:00:00"
    "fetched": "2026-06-27 03:28:19"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8in instances are available in the AWS US East (Ohio) and Europe (Ireland) regions. C8in instances are powered by custom, sixth generation Intel Xeon Scalable processors, available only on AWS. These instances feature the latest sixth generation AWS Nitro cards, delivering up to 43% higher performance compared to previous generation C6in instances.</p> \n<p>C8in instances deliver larger sizes and scale up to 384 vCPUs. C8in instances deliver 600 Gbps network bandwidth—the highest among enhanced networking EC2 instances—making them ideal for network-intensive workloads like distributed compute and large-scale data analytics.&nbsp;</p> \n<p>C8in instances are available in US East (N. Virginia, Ohio), US West (Oregon), Asia Pacific (Tokyo, Sydney, Singapore, Malaysia), and Europe (Spain, Frankfurt, Ireland) regions. C8in instances are available via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\">Amazon EC2 C8i instance page</a>.</p>"
"last_updated": "2026-06-27 03:28:19 JST"
