  "29bad82bb8fc2faf59b48e48a30b2add":
    "id": "29bad82bb8fc2faf59b48e48a30b2add"
    "title": "Optimize model training on Amazon SageMaker AI with NVIDIA Blackwell"
    "link": "https://aws.amazon.com/blogs/machine-learning/optimize-model-training-on-amazon-sagemaker-ai-with-nvidia-blackwell/"
    "published": "2026-06-26 01:41:47"
    "fetched": "2026-06-26 02:09:14"
    "summary": "This post shows you how to configure training jobs on Amazon SageMaker AI to get the most out of Blackwell’s architecture on AWS. You learn how to select batch sizes and sequence lengths that take advantage of Blackwell’s expanded memory, choose the right precision format for your model size (1B to 64B parameters), and apply activation checkpointing strategically. By the end, you have a practical framework for tuning your training configuration and launching distributed training jobs on P6-B200 instances."
  "01f228d332db352110cc22036b93cf26":
    "id": "01f228d332db352110cc22036b93cf26"
    "title": "Implementing super resolution by deploying SeedVR2 on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/implementing-super-resolution-by-deploying-seedvr2-on-amazon-sagemaker-ai/"
    "published": "2026-06-26 01:40:13"
    "fetched": "2026-06-26 02:09:14"
    "summary": "In this post, we demonstrate how to implement video upscaling using SeedVR2 on SageMaker AI. We cover the solution architecture, walk through the deployment steps, and show performance comparisons that highlight the quality improvements and processing efficiency you can achieve. By the end of this post, you’ll have the practical knowledge needed to implement this super resolution solution."
  "9c99c77fc876c184c747d1cb92c5394c":
    "id": "9c99c77fc876c184c747d1cb92c5394c"
    "title": "Build self-service AWS Health analytics to find actionable health insights with AI agents powered by Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-self-service-aws-health-analytics-to-find-actionable-health-insights-with-ai-agents-powered-by-amazon-bedrock/"
    "published": "2026-06-26 01:38:12"
    "fetched": "2026-06-26 02:09:14"
    "summary": "In this post, we show you how to build Chaplin (Customer Health and Planned Lifecycle Intelligence Nexus), an open source solution that uses AI agents exposed through the Model Context Protocol (MCP) to provide self-service health event analytics."
  "d2d34ac946c8ddd4fc4993fac388865b":
    "id": "d2d34ac946c8ddd4fc4993fac388865b"
    "title": "Building agentic AI applications with a modern data mesh strategy on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-agentic-ai-applications-with-a-modern-data-mesh-strategy-on-aws/"
    "published": "2026-06-26 01:35:07"
    "fetched": "2026-06-26 02:09:14"
    "summary": "This post shows how to build a governed, serverless data mesh on AWS that provides the secure, scalable data foundation production agentic AI requires."
  "9249f8b7a1b139f8b4076ad162f9e8f9":
    "id": "9249f8b7a1b139f8b4076ad162f9e8f9"
    "title": "Retrofit, don’t rebuild: Agentic overlays for transforming legacy enterprise services"
    "link": "https://aws.amazon.com/blogs/machine-learning/retrofit-dont-rebuild-agentic-overlays-for-transforming-legacy-enterprise-services/"
    "published": "2026-06-26 02:55:10"
    "fetched": "2026-06-26 04:54:09"
    "summary": "In this technical collaboration between AWS and the authors, we present a pragmatic solution: agentic overlays. Agentic overlays are thin wrapper layers that transform traditional REST-based services into agents capable of participating in A2A interactions. They also expose REST APIs as tools compatible with the Model Context Protocol (MCP). Together, they let enterprises add A2A capabilities to existing REST services without rewriting business logic, without duplicating code, and without running parallel infrastructures. This reduces agent sprawl in the infrastructure by reusing existing services as agents. We provide reference architectures and sample code that show how to build agentic overlays."
  "ef72a3e0c390aed91d35351bace12ce6":
    "id": "ef72a3e0c390aed91d35351bace12ce6"
    "title": "Build interactive PDF text extraction from Amazon S3"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-interactive-pdf-text-extraction-from-amazon-s3/"
    "published": "2026-06-26 23:47:45"
    "fetched": "2026-06-27 01:12:33"
    "summary": "In this post, you’ll build a server that extracts text from PDF files in Amazon S3 in real time. This protocol-based approach provides programmatic document access. You’ll walk through the architecture, set up the server, and run interactive document queries. Along the way, you’ll compare this approach with Amazon Textract so you can decide which tool fits your workload."
  "c153228ec42725082c79b9f89ff8f49a":
    "id": "c153228ec42725082c79b9f89ff8f49a"
    "title": "How Cara pioneers domain-specific AI for enterprise insurance brokerages with AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-cara-pioneers-domain-specific-ai-for-enterprise-insurance-brokerages-with-aws/"
    "published": "2026-06-26 23:42:20"
    "fetched": "2026-06-27 01:12:33"
    "summary": "In this post, we explore how Cara, built in cooperation with AWS, addresses these challenges. We walk through the technical design decisions and the AWS services that support the solution. We also share measurable outcomes Cara has delivered for enterprise brokerages."
  "0fd1334ca8e442b174fe6d431af57adf":
    "id": "0fd1334ca8e442b174fe6d431af57adf"
    "title": "Production-grade AI agents for financial compliance: Lessons from Stripe"
    "link": "https://aws.amazon.com/blogs/machine-learning/production-grade-ai-agents-for-financial-compliance-lessons-from-stripe/"
    "published": "2026-06-26 23:38:01"
    "fetched": "2026-06-27 01:12:33"
    "summary": "In this post, you learn how Stripe built a production-grade AI agent system for financial compliance. We cover the technical architecture of Stripe’s ReAct agent framework and the infrastructure decisions behind a dedicated agent service. We also discuss the role of human oversight in maintaining accountability, and key lessons about task decomposition, orchestration patterns, and cost optimization through prompt caching. By the end, you will understand how to design agentic systems that scale compliance operations without compromising quality or auditability."
