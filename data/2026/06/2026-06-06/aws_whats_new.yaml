    "title": "Amazon ECS with AWS Fargate now supports 32vCPU compute configurations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ecs-fargate-32vcpu"
    "published": "2026-06-06 00:00:00"
    "fetched": "2026-06-06 06:22:19"
    "summary": "<p>Amazon Elastic Container Service (Amazon ECS) with AWS Fargate now supports 32vCPU compute configurations, enabling customers to run more demanding applications with greater flexibility and performance. AWS Fargate offers 32vCPU tasks with the following memory configurations: 60 GiB, 120 GiB, or 244 GiB, for both x86-based and ARM-based workloads on Linux. These new task sizes extend Amazon ECS’s capability to support high-performance computing use-cases, large-scale data processing, AI inference, and other compute-intensive workloads. With 32vCPUs and up to 244 GiB of memory, Amazon ECS customers can now deploy larger containers and scale applications beyond previous limits, all while leveraging the reliability, security, and scalability of AWS Fargate.<br /> <br /> To use the new 32vCPU task sizes, simply configure your task definitions to specify 32 as the vCPU value and select one of the new memory options (60, 120, or 244 GiB), then deploy your Amazon ECS services or tasks as usual via the AWS Management Console, CLI, or your infrastructure-as-code of choice. The new vCPU and memory configurations are available on both Fargate and Fargate Spot capacity providers, and existing Compute Savings Plans apply automatically. For pricing details, refer to AWS Fargate <a href=\"https://aws.amazon.com/fargate/pricing/\">pricing page</a>.<br /> <br /> The 32vCPU tasks are available with Amazon ECS and AWS Fargate in all AWS commercial and AWS GovCloud (US) Regions. To learn more, refer to the Amazon ECS <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition_parameters.html\">documentation</a>.</p>"
  "701d20a7fd1429d549bc481a554d3dbf":
    "id": "701d20a7fd1429d549bc481a554d3dbf"
    "title": "Amazon Bedrock AgentCore Runtime introduces interactive shells for terminal access into agent sessions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-agentcore-runtime/"
    "published": "2026-06-06 07:25:00"
    "fetched": "2026-06-06 08:04:17"
    "summary": "<p>Amazon Bedrock AgentCore Runtime now supports interactive shells through a new InvokeAgentRuntimeCommandShell API, opening a persistent, PTY-backed terminal directly into a running agent session over WebSocket. This complements the existing InvokeAgentRuntimeCommand API for one-shot execution, giving developers a full terminal experience inside an isolated microVM with colors, tab completion, Ctrl+C, terminal resize, and automatic reconnect on network drop.<br /> <br /> This is particularly important for developers hosting coding agents such as Claude Code, OpenAI Codex, Amazon Kiro on AgentCore Runtime. In addition to the asynchronous command execution they already had, they can now authenticate, drop into the microVM hosting their coding agent, and interact with it like a local terminal: interact with the agent, inspect files, run ad-hoc commands, or debug the environment state. The shell carries persistent state across commands within the same session, so environment variables, working directory, and command history all behave as expected.<br /> <br /> Each interactive session is identified by a runtime session ID and a shell ID. Passing both back when reconnecting lands you in the exact same shell. Brief network drops reconnect automatically, and longer disconnects can be resumed manually using the same IDs. A single agent runtime supports up to 10 concurrent shells, allowing developers to open multiple terminals against the same or multiple microVMs and watch agents work different branches in parallel.<br /> <br /> To get started using the AgentCore CLI: `agentcore exec --it --runtime &lt;runtime-arn&gt;`. To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-command-shell.html\">Interactive Shells (Terminals)</a> and <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-shell-execution.html\">Shell execution in AgentCore Runtime</a> for a comparison of both shell modes.</p>"
  "7f8f20b6a0700da4f68fa24bd13ba5a4":
    "id": "7f8f20b6a0700da4f68fa24bd13ba5a4"
    "title": "Simplified permissions for Amazon S3 Tables and Iceberg materialized views are now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/gdc-s3tables-simplified-permissions-in-aws-govcloud/"
    "published": "2026-06-06 06:11:00"
    "fetched": "2026-06-06 08:04:17"
    "summary": "<p>AWS Glue Data Catalog now supports AWS IAM-based authorization for Amazon S3 Tables and Apache Iceberg materialized views. With IAM-based authorization, you can define all necessary permissions across storage, catalog, and query engines in a single IAM policy.<br /> <br /> This capability simplifies the integration of S3 Tables or materialized views with any AWS Analytics service, including Amazon Athena, Amazon EMR, Amazon Redshift, and AWS Glue. You can also opt in to AWS Lake Formation at any time to manage fine-grained access controls using the AWS Management Console, AWS CLI, API, and AWS CloudFormation.<br /> <br /> This feature is now available in AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-integration-overview.html\">S3 Tables documentation</a> and the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/glue-federation-s3tables.html\">AWS Glue Data Catalog documentation</a>.</p>"
  "3be07e9099f7a5b60ca1c478176c1ac6":
    "id": "3be07e9099f7a5b60ca1c478176c1ac6"
    "title": "Amazon OpenSearch UI is now available in GovCloud regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/opensearch-ui-govcloud-region"
    "published": "2026-06-06 05:40:00"
    "fetched": "2026-06-06 08:04:17"
    "summary": "<p>Amazon OpenSearch Service expands its modernized operational analytics experience to GovCloud regions, including AWS GovCloud (US-East) and AWS GovCloud (US-West), enabling users to gain insights across data spanning managed domains and serverless collections from a single endpoint. The expansion includes Workspaces to enhance collaboration and productivity, allowing teams to create dedicated spaces. Discover is revamped to provide a unified log exploration experience supporting languages such as Piped-Processing-Language (PPL) and SQL, in addition to DQL and Lucene. Discover now features a data selector to support multiple sources, new visual design and query autocomplete for improved usability. This experience ensures users can access the latest UI enhancements, regardless of version of underlying managed cluster or collection.<br /> <br /> The expanded OpenSearch analytics helps users gain insights from their operational data by providing purpose-built features for observability, security analytics, and search use cases. With the enhanced Discover interface, users can now analyze data from multiple sources without switching tools, improving efficiency. Workspaces enable better collaboration by creating dedicated environments for teams to work on dashboards, saved queries, and other relevant content. Availability of the latest UI updates across all versions ensures uninterrupted access to the newest features and tools.<br /> <br /> OpenSearch UI can connect to OpenSearch domains (above version 1.3) and OpenSearch serverless collections. To get started, create an OpenSearch application in <a href=\"https://console.aws.amazon.com/aos/application\">AWS Management Console</a>. Learn more at <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application.html\">Amazon OpenSearch Service Developer Guide</a>.</p>"
"last_updated": "2026-06-06 08:04:17 JST"
