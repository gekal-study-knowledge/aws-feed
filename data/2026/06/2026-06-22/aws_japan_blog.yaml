    "title": "週刊AWS – 2026/6/15週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260615/"
    "published": "2026-06-22 11:46:57"
    "fetched": "2026-06-22 15:25:14"
    "summary": "AWS WAF が AI トラフィック収益化機能を発表、AWS DevOps Agent がカスタム SRE エージェントと MCP/A2A プロトコルに対応、Amazon Bedrock AgentCore Memory が long-term memory に厳密に一貫したメタデータをサポート、Amazon Quick が Adobe、Figma、WhatsApp など 16 の新しいコネクタで統合を拡大、AWS Compute Optimizer が EBS ボリューム推奨で IOPS とスループットスパイクの可視性を強化　など"
  "050f707a7eb68c2ce289f0a25f8a5e3e":
    "id": "050f707a7eb68c2ce289f0a25f8a5e3e"
    "title": "「フィジカル AI 開発支援プログラム by AWS ジャパン」Community Meetup #1 を開催しました"
    "link": "https://aws.amazon.com/jp/blogs/news/physical-ai-community-meetup-1/"
    "published": "2026-06-22 11:40:46"
    "fetched": "2026-06-22 15:25:14"
    "summary": "2026 年 6 月 1 日、アマゾン ウェブ サービス ジャパン合同会社（以下、AWS ジャパン）は、「フィジカル AI 開発支援プログラム by AWS ジャパン」の第 1 回コミュニティイベント「Community Meetup #1」を、 AWS ジャパン 麻布台オフィスにて開催しました。本プログラムは 2026 年 1 月 27 日に発表し、3 月 3 日にキックオフイベントを開催しました。今回の Community Meetup は、約 6 ヶ月間の開発支援期間のなかで、採択企業同士の交流を主な目的として開いた初めてのコミュニティイベントです。"
  "85ee60a5b6f09244687d35702d76d928":
    "id": "85ee60a5b6f09244687d35702d76d928"
    "title": "週刊生成AI with AWS – 2026/6/15 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260615/"
    "published": "2026-06-22 22:00:00"
    "fetched": "2026-06-23 02:28:15"
    "summary": "今週も AWS の最新アップデートをまとめてお届けします。Kiroを定額で余裕をもって使える新プラン「Kiro Pro Max」、ブラウザでスペック開発や GitLab 連携ができる Kiro Web、スマホから開発を進められる Kiro for iOS の登場、Amazon Bedrock AgentCore や Guardrails の機能強化など、AI エージェントを本番で安全に運用するためのアップデートが充実しています。日立グループや通信事業者向けの AI 駆動開発・AI エージェントワークショップの開催レポートもお見逃しなく。生成 AI から運用・分析まで、今週の気になる話題をぜひご覧ください。"
"last_updated": "2026-06-23 02:28:15 JST"
