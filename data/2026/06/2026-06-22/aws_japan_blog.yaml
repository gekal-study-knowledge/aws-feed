    "title": "BIM データの要件定義から IDS を自動生成する: 生成 AI と AgentCore で実現するパラレル IDS ビルダー"
    "link": "https://aws.amazon.com/jp/blogs/news/parallel-ids-builder-with-amazon-bedrock-agentcore-and-aws-step-functions/"
    "published": "2026-06-22 14:12:51"
    "fetched": "2026-06-22 15:25:14"
    "summary": "建設業界で進む BIM 活用では、「必要なデータが揃っているか」を定義・検証することの難しさが課題になっています。本ブログでは、この要件を機械が検証できる形で定義する国際標準の IDS を、自然言語で書かれた要件定義から生成 AI が自動生成するソリューションを解説します。Amazon Bedrock AgentCore と AWS Step Functions を組み合わせ、要件ごとに並列で IDS を生成する仕組みを、実装レベルで紹介します。"
  "9364c6b70ff867c82f73ba067b7305e3":
    "id": "9364c6b70ff867c82f73ba067b7305e3"
    "title": "BIM データを生成 AI で活用する: IFC を RDF グラフに変換し Amazon Neptune で問い合わせるアーキテクチャ"
    "link": "https://aws.amazon.com/jp/blogs/news/bim-graph-on-amazon-neptune-with-text-to-sparql/"
    "published": "2026-06-22 14:10:08"
    "fetched": "2026-06-22 15:25:14"
    "summary": "建設業界で導入が進む BIM には、建物の豊富なデータが蓄積されています。本ブログでは、このデータを生成 AI から自然言語で問い合わせる方法として、BIM のオープンな標準フォーマットである IFC を RDF グラフに変換して Amazon Neptune に格納し、AI エージェントが text-to-SPARQL で回答する仕組みを、実装レベルで解説します。"
