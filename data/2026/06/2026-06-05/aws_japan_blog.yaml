  "819c0ce377ddfc377cfe25c9359077a8":
    "id": "819c0ce377ddfc377cfe25c9359077a8"
    "title": "Amazon Bedrock 上で OpenAI の GPT-5.5 モデル、GPT-5.4 モデル、Codex の使用を開始する"
    "link": "https://aws.amazon.com/jp/blogs/news/get-started-with-openai-gpt-5-5-gpt-5-4-models-and-codex-on-amazon-bedrock/"
    "published": "2026-06-05 13:24:52"
    "fetched": "2026-06-05 14:12:40"
    "summary": "OpenAIの最先端モデルであるGPT-5.5とGPT-5.4、そしてOpenAIのコーディングエージェントであるCodexが、Amazon Bedrockで一般提供開始となりました。Bedrockの高性能推論エンジンに、セキュリティ、ガバナンス、トークン単位の料金体系を組み込んだ状態で、最先端モデルをデプロイできます。"
  "01256efd0fdef2db9d2a8d8abb868a9a":
    "id": "01256efd0fdef2db9d2a8d8abb868a9a"
    "title": "ポスト量子暗号で将来の量子リスクからシークレットを守る"
    "link": "https://aws.amazon.com/jp/blogs/news/protecting-your-secrets-from-tomorrows-quantum-risks/"
    "published": "2026-06-05 13:12:08"
    "fetched": "2026-06-05 14:12:40"
    "summary": "AWS Secrets Manager が ML-KEM を使用したハイブリッドポスト量子鍵交換をデフォルトで有効化しました。これにより harvest now, decrypt later (HNDL) 攻撃から将来の量子コンピュータの脅威に備えてシークレットを保護します。Secrets Manager Agent、Lambda 拡張機能、CSI Driver、各種 AWS SDK のアップグレード要件と、CloudTrail を使った接続検証手順を詳しく説明します。"
  "4537a9b71803eb652dd9ddeb11c615f2":
