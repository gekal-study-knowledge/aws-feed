    "title": "Amazon Cognito now supports multi-Region replication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cognito-multi-region/"
    "published": "2026-06-05 02:00:00"
    "fetched": "2026-06-05 05:00:43"
    "summary": "<p>Amazon Cognito now supports multi-Region replication, enabling you to synchronize user and machine identity data — including credentials, user pool configurations, and federation setups — to a secondary user pool in a standby Region you designate in near real-time. This capability helps you improve the resilience of your authentication system by providing a standby replica that can accept traffic in case there is a regional service disruption.<br /> In the event of a disruption in the primary Region, you can redirect traffic to the secondary user pool. Signed-in users continue accessing their applications without re-authenticating, and registered users can sign in with their existing credentials. Authentication methods continue to work in the secondary Region, including username/password, federation with social identity and SAML/OIDC providers, and machine-to-machine authorization flows.<br /> Multi-Region replication is available as an add-on for user pools in Essentials or Plus feature tiers. You can start using this feature in the following AWS Regions: US East (Ohio, N. Virginia), US West (N. California, Oregon), Asia Pacific (Mumbai, Seoul, Singapore, Sydney, Tokyo), Canada (Central), Europe (Frankfurt, Ireland, London, Paris, Stockholm), and South America (São Paulo). To get started, configure multi-Region replication using the AWS Management Console, AWS Command Line Interface (CLI), or AWS Software Development Kits (SDKs) by adding a replica user pool. Visit the&nbsp;<a href=\"https://aws.amazon.com/cognito/pricing/\">pricing page</a>&nbsp;for pricing details and the&nbsp;<a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-multi-region.html\">developer guide</a>&nbsp;for instructions.</p>"
  "b92167cfd3d7a978f8541d91c6236f9d":
    "id": "b92167cfd3d7a978f8541d91c6236f9d"
    "title": "AWS Databases on Vercel now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-databases-vercel-aws-regions/"
    "published": "2026-06-05 02:00:00"
    "fetched": "2026-06-05 07:17:47"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/\" target=\"_blank\">Amazon Aurora PostgreSQL</a>, <a href=\"https://aws.amazon.com/rds/aurora/dsql/\" target=\"_blank\">Amazon Aurora DSQL</a>, and <a href=\"https://aws.amazon.com/dynamodb/?nc2=type_a\" target=\"_blank\">Amazon DynamoDB</a> serverless databases are now available on Vercel Marketplace and v0 by Vercel in additional AWS Regions, offering you more flexibility to build applications with Vercel and AWS databases from the Regions of your choice.<br /> <br /> To get started, you can describe your idea in v0 using natural language. The tool automatically generates a spec-driven design, deploys code and infrastructure, and stores your application data in the AWS database that best fits your needs with no hands-on coding or provisioning required. Vercel provides an end-to-end setup experience where you can create database resources in seconds under a new AWS account or link to an existing one, all without leaving Vercel. New AWS accounts created from Vercel include access to all three databases and $100 USD in credits, usable across any of these database options for up to six months. You can manage your plan, add payment information, and view usage details anytime from the AWS settings portal in the Vercel dashboard. To learn more, visit <a href=\"http://v0.app\" target=\"_blank\">v0</a> or the <a href=\"https://vercel.com/marketplace/aws\" target=\"_blank\">AWS landing page</a> on the Vercel Marketplace.<br /> <br /> You can now create an Aurora PostgreSQL database or Amazon DynamoDB table through Vercel from 17 <a href=\"https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html#regions-opt-in-status\" target=\"_blank\">AWS Regions enabled by default</a>, and Aurora DSQL from 16 AWS Regions including: US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), and South America (São Paulo).<br /> <br /> AWS Databases deliver security, reliability, and price performance without the operational overhead, whether you're prototyping your next big idea or running production AI and data driven applications. For more information, visit the <a href=\"https://aws.amazon.com/products/databases/\" target=\"_blank\">AWS Databases webpage.</a></p>"
