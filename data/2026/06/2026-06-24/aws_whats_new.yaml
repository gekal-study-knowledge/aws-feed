  "ccabc6e7453cd1082c0b61b1f4ae8968":
    "id": "ccabc6e7453cd1082c0b61b1f4ae8968"
    "title": "Automated Reasoning checks in Amazon Bedrock Guardrails add new policy refinement workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-guardrails/"
    "published": "2026-06-24 01:20:00"
    "fetched": "2026-06-24 02:14:10"
    "summary": "<p>Today, AWS announces new automated refinement workflows for Automated Reasoning checks in Amazon Bedrock Guardrails. Automated Reasoning checks use formal logic to mathematically validate the accuracy of generative AI responses against a policy you define, helping detect hallucinations and provide verifiable explanations. The quality of validation results depends on how well a policy is defined. The new workflows help customers improve their policies with less manual effort, leading to more reliable Guardrail validation results.</p> \n<p>The launch introduces two refinement workflows. With the iterative policy improvement workflow, customers who have created natural language tests for a policy can start an iterative refinement run, letting the system deduce the changes needed for the policy to pass those tests. With the ambiguity reduction workflow, customers who frequently encounter ambiguous translation results can run the resolve policy ambiguities workflow to automatically refine variable descriptions and type definitions, reducing how often ambiguous translations occur. Both workflows are available through the Amazon Bedrock APIs and in the AWS Management Console, where customers can start a workflow by choosing Refine policy on the policy page.</p> \n<p>These workflows are available in all AWS Regions where Automated Reasoning checks in Amazon Bedrock Guardrails are available. To learn more, visit the <a href=\"https://aws.amazon.com/bedrock/guardrails/\" target=\"_blank\">Amazon Bedrock Guardrails product page</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html\" target=\"_blank\">the&nbsp;Automated Reasoning checks User Guide</a>.</p>"
  "00b8f93dd4dab3fd71778c8ffdd93ed9":
    "id": "00b8f93dd4dab3fd71778c8ffdd93ed9"
    "title": "Amazon Bedrock AgentCore Memory now supports cross-account access"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/agentcore-memory-cross-account-access"
    "published": "2026-06-24 02:20:00"
    "fetched": "2026-06-24 04:56:44"
    "summary": "<p>Amazon Bedrock AgentCore Memory now enables cross-account access, allowing you to build multi-account architectures where memory resources and consuming agents span multiple AWS accounts. You can grant principals in one account permission to call memory data plane APIs against resources in another account using resource-based policies, and configure memory delivery destinations (Amazon S3, Amazon SNS, Amazon Kinesis Data Streams) that reside in a separate account.</p> \n<p>Cross-account access is configured by attaching a resource-based policy to your memory resource. Once configured, principals in the consuming account can create events, write memory records, retrieve records, and perform semantic search by referencing the full memory ARN. Cross-account delivery destinations allow your memory resource to deliver payloads and stream events to S3 buckets, SNS topics, and Kinesis Data Streams in other accounts.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-cross-account-access.html\">Cross-account memory access</a> in the Amazon Bedrock AgentCore Developer Guide. Amazon Bedrock AgentCore Memory cross-account access is available in all <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Regions</a> where Amazon Bedrock AgentCore Memory is supported.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "1f79bccc334ad256fa864806b7bb159a":
    "id": "1f79bccc334ad256fa864806b7bb159a"
    "title": "AWS HealthOmics now supports ephemeral storage for private workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/healthomics-scratch-storage/"
    "published": "2026-06-24 02:15:00"
    "fetched": "2026-06-24 04:56:44"
    "summary": "<p>AWS HealthOmics adds ephemeral storage for private workflows, giving bioinformatics workloads dedicated scratch space that delivers more consistent run performance and lower costs. Each workflow task now receives a dedicated local volume mounted at /tmp, and workflows that generate significant scratch data, such as genomic sequence alignment, BAM sorting, and variant calling,&nbsp;can experience faster run times.&nbsp;<a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs with fully managed bioinformatics workflows.</p> \n<p>With this launch, workflow tasks can write temporary data to their own local volume, keeping scratch I/O isolated from shared run storage that hosts the working directory. By default, each task includes 16 GiB of ephemeral storage at no additional charge. You can increase the amount of ephemeral storage allocated to individual tasks, up to a maximum of 3,072 GiB per task, using the appropriate directive in your WDL, Nextflow, or CWL workflow definition. You can enable ephemeral storage at runtime with the StartRun API.&nbsp;All ephemeral storage volumes are encrypted and deleted when a task terminates.</p> \n<p>You can use ephemeral storage in all AWS Regions where AWS HealthOmics is available:&nbsp;US East (N. Virginia), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Singapore, Seoul). To learn more about ephemeral storage, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/workflows-ephemeral-storage.html\">AWS HealthOmics User Guide</a>. For more information on pricing, visit <a href=\"https://aws.amazon.com/healthomics/pricing/\">AWS HealthOmics pricing</a>.</p>"
  "d19b3558dfe641e284f5e87f259295c6":
    "id": "d19b3558dfe641e284f5e87f259295c6"
    "title": "Amazon CloudWatch Logs supports managed syslog ingestion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-syslog-ingestion/"
    "published": "2026-06-24 05:30:00"
    "fetched": "2026-06-24 06:42:39"
    "summary": "<p>Amazon CloudWatch Logs supports managed syslog ingestion, enabling customers to send syslog messages from firewalls, routers, switches, and Linux servers directly into CloudWatch Logs.<br /> <br /> With today's launch, customers can configure their network devices and servers to send syslog messages over TCP, TCP+TLS, or UDP to a VPC endpoint in their account - without installing or managing any agents. Amazon CloudWatch Logs supports RFC 5424, RFC 3164, and Cisco FTD/ASA syslog formats, making it compatible with a wide range of infrastructure. Amazon CloudWatch Logs automatically parses incoming syslog messages and extracts structured fields such as facility, severity, hostname, and application name, thereby eliminating the need for custom parsing pipelines. For example, customers can ingest syslog from their network firewalls and immediately query by severity or hostname using Logs Analytics to investigate security events or troubleshoot connectivity issues. This feature helps teams centralize infrastructure log visibility, simplify operational workflows, and reduce the overhead of deploying and maintaining log collection agents across distributed environments.<br /> <br /> Available in all commercial AWS Regions except Middle East (UAE), Middle East (Bahrain), and Israel (Tel Aviv). To get started, see the Amazon CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_Syslog.html\">documentation.</a></p>"
  "6624cc1460674b23a21af2aa05eeb058":
    "id": "6624cc1460674b23a21af2aa05eeb058"
    "title": "SageMaker Notebook Instances now support G6e instance types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/g6e-new-launch-sagemaker-notebook-instances/"
    "published": "2026-06-24 03:14:00"
    "fetched": "2026-06-24 06:42:39"
    "summary": "<p>We are pleased to announce general availability of Amazon EC2 G6e instances on SageMaker notebook instances.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/g6e/\"><u>Amazon EC2 G6e instances</u></a> are powered by up to 8 NVIDIA L40s Tensor Core GPUs with 48 GB of memory per GPU and third generation AMD EPYC processors. G6e instances deliver up to 2.5x better performance compared to EC2 G5 instances. Customers can use G6e instances to interactively test model deployment and for interactive model training use cases such as generative AI fine-tuning. You can use G6e instances to deploy large language models (LLMs) with up to 13B parameters and diffusion models for generating images, video, and audio.</p> \n<p>Amazon EC2 G6e instances are available on SageMaker notebook instances in the AWS US East (N. Virginia and Ohio), US West (Oregon), Asia Pacific (Tokyo), Middle East (Dubai) and Europe (Frankfurt, Sweden, Spain) regions.</p> \n<p>Visit developer guides for instructions on setting up and using <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl.html\"><u>JupyterLab</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/code-editor.html\"><u>CodeEditor</u></a> applications on <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated.html\"><u>SageMaker Studio</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/nbi.html\"><u>SageMaker notebook instances</u></a>.</p>"
  "95e0877b9cf443f4afb6b0cadb664689":
    "id": "95e0877b9cf443f4afb6b0cadb664689"
    "title": "Amazon Cognito now supports customer managed key for encryption at rest"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cognito-customer-managed-key"
    "published": "2026-06-24 02:00:46"
    "fetched": "2026-06-24 08:05:33"
    "summary": "<p>Amazon Cognito now supports customer managed keys in AWS Key Management Service (KMS) for encrypting user pool data at rest. While AWS owned keys are used by default to protect your data, customer managed keys give you full control over the encryption keys, helping you achieve your organization's data governance objectives.&nbsp;</p> \n<p>&nbsp;</p> \n<p>With customer managed keys, you can define organizational policies and revoke access to encrypted data by disabling or deleting your key. You create and manage the customer managed key lifecycle and usage permissions in AWS KMS. You can configure a customer managed key when creating a new user pool or update an existing user pool to use one. You can also use AWS CloudTrail to monitor and audit all usage of your customer managed keys, giving you visibility into when and how your identity data is accessed.</p> \n<p>&nbsp;</p> \n<p>Customer managed keys are available in user pools in Essentials and Plus tiers at no additional costs. <a href=\"https://aws.amazon.com/kms/pricing/\">Standard AWS KMS charges</a> apply. To get started, configure your customer managed keys using the&nbsp;<a href=\"https://console.aws.amazon.com/cognito/home\">AWS Management Console</a>, AWS CLI, or AWS SDKs. Visit the&nbsp;<a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/data-protection.html\">developer guide</a>&nbsp;for instructions.</p>"
  "762a464b82f0625c907d4cdafaf6a629":
    "id": "762a464b82f0625c907d4cdafaf6a629"
    "title": "Amazon CloudWatch launches OTel Container Insights for Amazon EKS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-otel-amazon-eks/"
    "published": "2026-06-24 00:12:00"
    "fetched": "2026-06-24 08:05:33"
    "summary": "<p>CloudWatch OTel Container Insights for Amazon EKS collects infrastructure metrics at 30-second granularity using open-source receivers including cAdvisor, Kube State Metrics, and NVIDIA DCGM. Each metric carries OpenTelemetry semantic conventions and Kubernetes labels, making it straightforward to correlate across nodes, pods, and workloads in a single PromQL query.</p> \n<p>Pre-built dashboards give you immediate visibility into cluster health, node performance, and pod-level resource usage. The CloudWatch PromQL endpoint lets you connect existing Prometheus and Grafana dashboards directly to CloudWatch.</p> \n<p>Enable it from the EKS console or via the CloudWatch Observability add-on (v6.2.0+), Helm, or CloudFormation.</p> \n<p>Available in all commercial AWS Regions except Middle East (UAE), Middle East (Bahrain), and Israel (Tel Aviv). For pricing details, see the Amazon CloudWatch <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">pricing page</a>. To get started, see the OTel Container Insights <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/container-insights-eks-otel.html\">documentation</a>.</p>"
"last_updated": "2026-06-24 08:05:33 JST"
