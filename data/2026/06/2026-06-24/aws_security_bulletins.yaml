    "title": "CVE-2026-12957 and CVE-2026-12958 - Issues in Language Servers for AWS and Amazon Q Developer Plugins"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-047-aws/"
    "published": "2026-06-24 01:11:40"
    "fetched": "2026-06-24 02:14:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-047-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 06/23/2026 09:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Language Servers for AWS provide the underlying language-server runtime that powers Amazon Q Developer's AI coding assistance across its IDE plugins (Visual Studio Code, JetBrains, Eclipse, and Visual Studio).</p> \n<p>We identified CVE-2026-12957, an improper trust boundary enforcement issue in Language Servers for AWS before version 1.65.0. If a local user opens a maliciously crafted workspace, any commands within the project configuration files may be automatically executed. This issue requires the user to trust the workspace when prompted.</p> \n<p>We identified CVE-2026-12958, a missing symlink-validation issue in Language Servers for AWS before version 1.69.0. This may occur when a local user opens a workspace with a maliciously crafted symlink that resolves to a file path outside the workspace trust boundary.</p> \n<p>These issues affect the Amazon Q Developer IDE plugins, which bundle Language Servers for AWS. Both issues are remediated in Language Servers for AWS version 1.69.0.</p> \n<p><b>Affected products &amp; versions:</b><br />- Language Servers for AWS: &lt; 1.69.<br /> - Amazon Q Developer for Visual Studio Code: &lt; 2.20<br />- Amazon Q Developer for JetBains: &lt; 4.3<br />- Amazon Q Developer for Eclipse: &lt; 2.7.4<br />- AWS Toolkit with Amazon Q for Visual Studio: &lt; 1.94.0.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-06-24 02:14:11 JST"
