  "e2aac41fb95d36ed5d0c812bff062ca5":
    "id": "e2aac41fb95d36ed5d0c812bff062ca5"
    "title": "Evaluate AI agents systematically with Agent-EvalKit"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluate-ai-agents-systematically-with-agent-evalkit/"
    "published": "2026-06-12 00:49:47"
    "fetched": "2026-06-12 01:51:11"
    "summary": "Agent-EvalKit is an open-source toolkit (Apache 2.0) that makes this evaluation infrastructure available by integrating with AI coding assistants, including Claude Code, Kiro CLI, and Kilo Code. This post walks through how Agent-EvalKit works across its six evaluation phases, using a travel research agent built with the Strands Agents SDK and Amazon Bedrock as a running example."
  "bed40de0c1c18117ab8c4130c5681c29":
    "id": "bed40de0c1c18117ab8c4130c5681c29"
    "title": "Spot trends faster, sort smarter: Unlocking Sparklines and Custom Sort in Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/spot-trends-faster-sort-smarter-unlocking-sparklines-and-custom-sort-in-amazon-quick/"
    "published": "2026-06-12 00:36:31"
    "fetched": "2026-06-12 01:51:11"
    "summary": "Today, we’re excited to announce two new capabilities that make Quick Sight dashboards even more expressive and business-aligned: sparklines and custom sort for controls. In this post, we walk through both features, what they are, when to use them, and how to configure them, with real-world scenarios that bring them together in a practical, decision-ready dashboard."
  "228f0d2cc67f63c6e8006e0a882cff9e":
    "id": "228f0d2cc67f63c6e8006e0a882cff9e"
    "title": "Optimize blueprint extraction accuracy in Amazon Bedrock Data Automation"
    "link": "https://aws.amazon.com/blogs/machine-learning/optimize-blueprint-extraction-accuracy-in-amazon-bedrock-data-automation/"
    "published": "2026-06-12 00:11:56"
    "fetched": "2026-06-12 01:51:11"
    "summary": "Blueprint instruction optimization is a BDA feature that automatically refines your extraction instructions to address this challenge directly. You provide three to ten example documents with expected values, and BDA refines your blueprint instructions to improve accuracy in minutes, not weeks. No separate model fine-tuning is required. By the end of this post, you can optimize your blueprints to improve accuracy, run the optimization workflow through the Amazon Bedrock console or the API, and apply best practices for selecting examples and ground truth."
  "e148d5a86c2ba723ee29969f6f5355aa":
    "id": "e148d5a86c2ba723ee29969f6f5355aa"
    "title": "Extract Data with On-demand and Batch Pipelines Dynamically"
    "link": "https://aws.amazon.com/blogs/machine-learning/extract-data-with-on-demand-and-batch-pipelines-dynamically/"
    "published": "2026-06-12 04:40:33"
    "fetched": "2026-06-12 06:59:36"
    "summary": "This post demonstrates an intelligent document processing pipeline that consists of both on-demand inference and batch inference options on Amazon Bedrock to enable the flexibility on the document processing time and cost."
  "6a69f7c989cefd287e3613a10ed6fad7":
    "id": "6a69f7c989cefd287e3613a10ed6fad7"
    "title": "Build a meeting prep and follow-up assistant with Amazon Quick and Cisco Webex MCP servers"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-meeting-prep-and-follow-up-assistant-with-amazon-quick-and-cisco-webex-mcp-servers/"
    "published": "2026-06-12 23:49:40"
    "fetched": "2026-06-13 01:14:42"
    "summary": "This post shows how to build a custom meeting prep and follow-up assistant using Amazon Quick and Cisco Webex MCP servers. From a single prompt, the agent finds an upcoming Webex meeting, reviews prior meeting summaries and transcripts, and pulls related Vidcast highlights and transcript context. It then searches Webex message threads for unresolved follow-ups and creates a concise prep brief. After the meeting, the same assistant can summarize the discussion and identify action items. It can also find related Vidcast updates and draft a follow-up message for the right Webex space."
  "f757670c3c9ec33a05b1f42092580459":
    "id": "f757670c3c9ec33a05b1f42092580459"
    "title": "From PDFs to insights: Architecting an intelligent document processing pipeline with AWS generative AI services"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-pdfs-to-insights-architecting-an-intelligent-document-processing-pipeline-with-aws-generative-ai-services/"
    "published": "2026-06-12 23:43:11"
    "fetched": "2026-06-13 01:14:42"
    "summary": "This post outlines the development of a cost-effective and scalable intelligent document processing pipeline on AWS, powered by Amazon Bedrock and its features. BDA is a managed service within Amazon Bedrock that automates the extraction of insights from documents. We demonstrate how BDA extracts and analyzes document content, while Strands Agent hosted on Amazon Bedrock AgentCore Runtime coordinate specialized processing tasks, and Amazon Bedrock Knowledge Base enable contextual understanding across multiple documents. By combining these capabilities within a unified architecture, organizations can transform their document processing workflows with minimal development effort."
  "ec95b6f69a5413dd43e8137dd6eb648c":
    "id": "ec95b6f69a5413dd43e8137dd6eb648c"
    "title": "Built from the inside out: How AWS Professional Services became a frontier team first"
    "link": "https://aws.amazon.com/blogs/machine-learning/built-from-the-inside-out-how-aws-professional-services-became-a-frontier-team-first/"
    "published": "2026-06-12 22:00:10"
    "fetched": "2026-06-13 01:14:42"
    "summary": "AWS Professional Services (AWS ProServe) compressed engagement timelines from months to days, not by adding artificial intelligence (AI) tools to an existing process, but by fundamentally rebuilding how we deliver from the inside out. In this post, we share how AWS ProServe became a frontier team, the practices that enabled it, and what your engineering organization can take from our experience."
