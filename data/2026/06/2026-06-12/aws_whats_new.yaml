  "80b624fb62baf43c61b72a7d00fa8a7d":
    "id": "80b624fb62baf43c61b72a7d00fa8a7d"
    "title": "AWS Elastic Beanstalk console now integrates CloudWatch Logs in the Logs tab"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/elastic-beanstalk-cloudwatch-logs/"
    "published": "2026-06-12 02:00:00"
    "fetched": "2026-06-12 04:32:56"
    "summary": "<p>AWS Elastic Beanstalk now provides a CloudWatch Logs integration directly in the environment Logs tab of the Elastic Beanstalk console. Previously, customers had to navigate to the CloudWatch console to find the relevant log groups and log streams for their environments. With this launch, customers can view CloudWatch log events without leaving the Elastic Beanstalk console.&nbsp;&nbsp;</p> \n<p>The Logs tab displays log groups that an environment streams logs to, as well as log groups matching the <i>aws/elasticbeanstalk/&lt;env-name&gt;/*</i> prefix. Customers can select a log group to view its log streams, with the most recently active stream selected by default. A log stream dropdown allows switching between streams and filtering results. For deeper analysis, a View in CloudWatch dropdown provides direct links to the log group, log stream, or CloudWatch Logs Insights in the CloudWatch console.</p> \n<p>This feature is available across all Elastic Beanstalk platform branches in all AWS Commercial Regions and AWS GovCloud (US) Regions where Elastic Beanstalk is available. For a complete list of supported Regions, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" title=\"AWS Regions where Elastic Beanstalk is generally available\">AWS Regions</a>.</p> \n<p>For more information about using Elastic Beanstalk with Amazon CloudWatch, see the <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/AWSHowTo.cloudwatchlogs.html\" title=\"Guide on setting up CloudWatch with Elastic Beanstalk\">AWS Elastic Beanstalk developer guide</a>. To learn more, visit the <a href=\"https://aws.amazon.com/elasticbeanstalk/\" title=\"AWS Elastic Beanstalk Product Page\">AWS Elastic Beanstalk product page</a>.</p>"
  "16150cb56ebf6c7948410cf3052c475d":
    "id": "16150cb56ebf6c7948410cf3052c475d"
    "title": "Amazon MWAA Serverless now supports Amazon EventBridge notifications/"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-mwaa-serverless-eventbridge/"
    "published": "2026-06-12 02:00:00"
    "fetched": "2026-06-12 04:32:56"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) Serverless now supports workflow and task state change events to <a href=\"https://aws.amazon.com/eventbridge/\">Amazon EventBridge</a>, enabling data engineering and platform teams to build event-driven automation for their Apache Airflow workflows. </p> \n<p>Previously, monitoring workflow execution required custom polling logic or manual observation. With this launch, MWAA Serverless can emit events when workflows transition between states, including started, running, succeeded, or failed, and when individual tasks change state, such as scheduled, succeeded, failed, or up for retry. With this feature, you can further automate your existing workflows - for example, using EventBridge notifications to trigger alerts when a production workflow fails, automatically restart dependent pipelines when an upstream workflow succeeds, or log state transitions to Amazon S3 for compliance and auditing.</p> \n<p><br /> This feature is available in all AWS Regions where <a href=\"https://aws.amazon.com/managed-workflows-for-apache-airflow/\">Amazon MWAA Serverless</a> is available. For the complete list of supported Regions, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/what-is-mwaa-serverless.html#mwaa-serverless-regions\">Regions</a> in the Amazon MWAA Serverless User Guide. For pricing details, see <a href=\"https://aws.amazon.com/eventbridge/pricing/\">Amazon EventBridge pricing</a>.</p> \n<p><br /> To learn more, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/monitoring.html\">Monitoring Amazon MWAA Serverless</a> in the Amazon MWAA Serverless User Guide and <a href=\"https://docs.aws.amazon.com/eventbridge/latest/ref/events-ref-airflow-serverless.html\">Amazon MWAA Serverless events</a> in the Amazon EventBridge Events Reference.</p>"
  "8f50d3ac5ea2070fb82b60f04ab32a13":
    "id": "8f50d3ac5ea2070fb82b60f04ab32a13"
    "title": "Amazon CloudWatch Application Signals now supports infrastructure, logs, and traces context for faster troubleshooting"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/cloudwatch-application-signals-supports infrastructure-logs-traces-context-for-faster troubleshooting/"
    "published": "2026-06-12 05:10:00"
    "fetched": "2026-06-12 08:44:06"
    "summary": "<p>Amazon CloudWatch Application Signals introduces service health ranking on the application map and new infrastructure, logs, and traces tabs on the service overview page. These capabilities let operators triage unhealthy services and inspect the underlying compute environment, log snippets, and trace details in one place, making it easier to find root causes without switching tools.<br /> Customers use Application Signals to monitor the health of distributed applications, but identifying why a service was unhealthy often required leaving CloudWatch to correlate infrastructure data across separate tools. The application map now ranks services by health and shows runtime indicators on service nodes for Amazon EKS, Amazon ECS, AWS Lambda, and Amazon EC2, along with a new infrastructure tab that surfaces the compute and runtime environment, its components, and curated default metrics with deep links to the relevant monitoring tools. In addition, the service overview page provides the infrastructure, logs, and traces tab, helping operators spot issues in context of their application. With health-ranked services on the application map and new infrastructure, logs, and traces tabs, operators can instantly identify their most degraded services and drill into the compute environment, error-producing log snippets, and slow or failing transactions — all without leaving Application Signals. These capabilities span workloads running on Amazon EKS, Amazon ECS, AWS Lambda, and Amazon EC2, giving teams a single pane to move from symptom to root cause in minutes instead of hours.<br /> <br /> These capabilities are available in all AWS Regions where Amazon CloudWatch Application Signals is supported. To learn more about this feature, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Monitoring-Sections.html\">Amazon CloudWatch Application Signals documentation</a> . For pricing details, see the <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing page</a></p>"
  "f7c1b357236b4af6fd521a2f96fb803c":
    "id": "f7c1b357236b4af6fd521a2f96fb803c"
    "title": "Amazon Aurora now supports PostgreSQL major version 18"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-aurora-postgresql-major-version-18/"
    "published": "2026-06-12 03:59:00"
    "fetched": "2026-06-12 08:44:06"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/\">Amazon Aurora PostgreSQL-Compatible Edition</a> now supports PostgreSQL major version 18, starting with version 18.3. This release brings community improvements to query performance and database management, and introduces support for pg_roaringbitmap, a new extension that performs fast, memory-efficient set operations on large collections of integers. This enables use cases such as audience segmentation, tag-based filtering, and permission checks directly in the database without application-layer processing.<br /> <br /> PostgreSQL 18 introduces B-tree skip scans, which improve query performance, and reduce index storage and maintenance overhead. Major version upgrades now retain optimizer statistics, ensuring consistent query performance immediately after upgrading without waiting for statistics to be regenerated. Logical replication can now stream large transactions in parallel, reducing replication lag and keeping downstream systems more current. Please refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/AuroraPostgreSQL.Updates.html\">Amazon Aurora PostgreSQL release notes</a> for details.<br /> <br /> You can upgrade your database using several options including <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments-overview.html\">RDS Blue/Green deployments</a>, upgrade in-place, or restoring a snapshot. Learn more about upgrading your database instances in the <a href=\"http://add%20link/\">Amazon Aurora User Guide</a>. Aurora PostgreSQL 18.3 is available in all commercial AWS Regions and AWS GovCloud (US) Regions.<br /> <br /> Amazon Aurora is designed for unparalleled high performance and availability at global scale with full PostgreSQL and MySQL compatibility. It provides built-in security, continuous backups, serverless compute, up to 15 read replicas, automated multi-Region replication, and integrations with other AWS services. To get started with Amazon Aurora, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\">getting started page</a>.</p>"
  "adeb7a30f1a25e34e979c7754d36e5bb":
    "id": "adeb7a30f1a25e34e979c7754d36e5bb"
    "title": "Amazon MWAA Serverless now supports Amazon EventBridge notifications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-mwaa-serverless-eventbridge/"
    "published": "2026-06-12 02:00:00"
    "fetched": "2026-06-12 08:44:06"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) Serverless now supports workflow and task state change events to <a href=\"https://aws.amazon.com/eventbridge/\">Amazon EventBridge</a>, enabling data engineering and platform teams to build event-driven automation for their Apache Airflow workflows.</p> \n<p>Previously, monitoring workflow execution required custom polling logic or manual observation. With this launch, MWAA Serverless can emit events when workflows transition between states, including started, running, succeeded, or failed, and when individual tasks change state, such as scheduled, succeeded, failed, or up for retry. With this feature, you can further automate your existing workflows - for example, using EventBridge notifications to trigger alerts when a production workflow fails, automatically restart dependent pipelines when an upstream workflow succeeds, or log state transitions to Amazon S3 for compliance and auditing.</p> \n<p>This feature is available in all AWS Regions where <a href=\"https://aws.amazon.com/managed-workflows-for-apache-airflow/\">Amazon MWAA Serverless</a> is available. For the complete list of supported Regions, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/what-is-mwaa-serverless.html#mwaa-serverless-regions\">Regions</a> in the Amazon MWAA Serverless User Guide. For pricing details, see <a href=\"https://aws.amazon.com/eventbridge/pricing/\">Amazon EventBridge pricing</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/monitoring.html\">Monitoring Amazon MWAA Serverless</a> in the Amazon MWAA Serverless User Guide and <a href=\"https://docs.aws.amazon.com/eventbridge/latest/ref/events-ref-airflow-serverless.html\">Amazon MWAA Serverless events</a> in the Amazon EventBridge Events Reference.</p>"
  "f41904a4e56071bd635bc4dc1101a642":
    "id": "f41904a4e56071bd635bc4dc1101a642"
    "title": "Amazon Quick now integrates with Snowflake Cortex AI"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-quick-snowflake-cortex-ai/"
    "published": "2026-06-12 07:02:00"
    "fetched": "2026-06-13 01:14:40"
    "summary": "<p>Amazon Quick now integrates with Snowflake Cortex AI through the Model Context Protocol (MCP), enabling teams to query their Snowflake data and documents using natural language, and automate multi-step workflows directly within their Quick workspace. After setting up the connection using Snowflake's managed MCP server with OAuth authentication, you can ask questions across structured data through Cortex Analyst and retrieve insights from unstructured documents through Cortex Search.</p> \n<p>With this integration, you can build Flows in Quick that orchestrate Snowflake Cortex Agents to execute repeatable, governed workflows with consistent structured output. This is ideal for any multi-step process that spans structured data and unstructured documents. The same MCP connection is also accessible from Quick Chat and other Quick features. For example, users can ask ad-hoc follow-up questions or explore their Snowflake data conversationally alongside their automated flows. Quick intelligently routes relevant prompts to Snowflake Cortex AI and returns contextualized answers alongside enterprise knowledge stored in Quick Spaces, giving teams both the rigor of a structured process and the flexibility of a conversational interface.</p> \n<p>The Snowflake Cortex AI integration with Amazon Quick is available in all <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" target=\"_blank\">AWS Regions</a> where Amazon Quick is available.</p> \n<p>Visit the Amazon Quick website to learn more and <a href=\"https://aws.amazon.com/quick/\" target=\"_blank\">start your Quick free trial</a>. To learn more about the Snowflake Cortex AI integration, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/automate-aml-alert-triage-with-amazon-quick-and-snowflake-cortex-ai/\" target=\"_blank\">blog</a>. To learn more about Quick integrations, visit the <a href=\"https://aws.amazon.com/quick/integrations/\" target=\"_blank\">integrations page</a>.</p>"
  "b1ea2eb1a4b6e66ec92554644e3af7f2":
    "id": "b1ea2eb1a4b6e66ec92554644e3af7f2"
    "title": "Amazon EC2 Capacity Blocks for ML is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-capacity-blocks-ml-govcloud/"
    "published": "2026-06-12 23:00:00"
    "fetched": "2026-06-13 04:01:59"
    "summary": "<p>Amazon EC2 Capacity Blocks for ML is now available in AWS GovCloud (US-West) and AWS GovCloud (US-East), enabling government and regulated-industry customers to reserve GPU capacity for machine learning workloads.</p> \n<p>EC2 Capacity Blocks for ML allows you to reserve GPU instances in advance for a defined duration, giving you assured access to accelerated compute for short-duration pre-training, fine-tuning, rapid prototyping, and inference demand surges. Capacity Blocks deliver low-latency, high-throughput connectivity through colocation in Amazon EC2 UltraClusters.</p> \n<p>You can reserve capacity up to eight weeks in advance for durations up to 6 months, in cluster sizes of one to 64 instances. Capacity Blocks can also be shared across multiple accounts using AWS Resource Access Manager (RAM), helping organizations coordinate ML infrastructure investments and keep reserved capacity in continuous use across workloads.</p> \n<p>In AWS GovCloud (US), EC2 Capacity Blocks for ML is available on P6-B200 instances in AWS GovCloud (US-West), and P6-B200 and P6-B300 instances in AWS GovCloud (US-East). To get started, visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-blocks.html\">EC2 Capacity Blocks documentation</a>.</p>"
  "08729d4f86420e314071ed82b7f08176":
    "id": "08729d4f86420e314071ed82b7f08176"
    "title": "Amazon EC2 High Memory U7i-8TB instances now available in AWS Europe (Paris) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ec2-u7i-8tb-europe-paris/"
    "published": "2026-06-12 08:00:00"
    "fetched": "2026-06-13 04:01:59"
    "summary": "<p>Amazon EC2 High Memory U7i-8TB instances (u7i-8tb.112xlarge) are now available in AWS Europe (Paris) region. U7i instances are part of the AWS 7th generation and are powered by custom fourth-generation Intel Xeon Scalable processors (Sapphire Rapids). U7i-8TB instances offer 8 TiB of DDR5 memory, enabling customers to scale transaction processing throughput in a fast-growing data environment.&nbsp;U7i instances offer up to 45% better price performance over existing U-1 instances.</p> \n<p>U7i-8TB instances deliver 448 vCPUs and support up to 100 Gbps of Amazon EBS bandwidth for faster data loading and backups, 100 Gbps of network bandwidth, and ENA Express. U7i instances are ideal for customers running mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.</p> \n<p>To learn more about U7i instances, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High Memory instances page</a>.</p>"
  "208838a27c6da13b691852e7c001ded6":
    "id": "208838a27c6da13b691852e7c001ded6"
    "title": "Amazon EKS now supports local clusters on AWS Outposts with Amazon EC2 instance store"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-eks-aws-outposts-ec2-instance-store/"
    "published": "2026-06-12 05:52:00"
    "fetched": "2026-06-13 04:01:59"
    "summary": "<p>Today, AWS is expanding support for Amazon Elastic Kubernetes Service (EKS) local clusters on AWS Outposts to first-generation and second-generation AWS Outposts racks running Amazon EC2 instances that boot from Amazon EC2 instance store. AWS Outposts <a href=\"https://aws.amazon.com/about-aws/whats-new/2024/11/static-stability-amazon-ec2-instances-store-aws-outposts/\">offers static stability for Amazon EC2 instances backed by EC2 instance store</a>, and AWS is now extending that benefit to Amazon EKS local clusters customers. With local clusters, the entire Kubernetes control plane runs on AWS Outposts, supporting advanced data residency requirements and mitigating the risk of impact from temporary network disconnects to the cloud.<br /> <br /> Amazon EKS local clusters on AWS Outposts backed by Amazon EC2 instance store use an updated architecture that brings greater operational and feature-level parity with Amazon EKS clusters in the cloud. The Kubernetes control plane on your Outpost&nbsp;is managed by Amazon EKS in a service-owned account, so you don’t need to manage etcd backups or logging agents on control plane instances. New Kubernetes versions and Amazon EKS platform versions are made available for local clusters as they’re released for Amazon EKS in the cloud. Local clusters deployed with the updated architecture support Amazon EKS add-ons, <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html\">IAM Roles for Service Accounts</a>, <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html\">EKS Pod Identity</a>, <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/authenticate-oidc-identity-provider.html\">OIDC authentication</a>, <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html\">access entries</a>, and <a href=\"https://aws.amazon.com/bottlerocket/\">Bottlerocket</a> worker nodes (in addition to Amazon Linux 2023).<br /> <br /> The updated architecture and new capabilities are generally available on AWS Outposts racks backed by Amazon EC2 instance store in all commercial AWS Regions that support AWS Outposts racks. AWS Outposts that boot Amazon EC2 instances from Amazon EBS will continue to use the original local clusters architecture. For more information, see local clusters in the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/eks-outposts-local-cluster-overview.html\">Amazon EKS user guide</a>.</p>"
  "22bd4a78d18cc1e63ebc0ce29dd6a425":
    "id": "22bd4a78d18cc1e63ebc0ce29dd6a425"
    "title": "AWS Lake Formation extends table permissions to access underlying data in Amazon S3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-lake-formation-access-data-amazon-s3"
    "published": "2026-06-12 01:00:00"
    "fetched": "2026-06-13 04:01:59"
    "summary": "<p>AWS Lake Formation now enables you to read and write the underlying data files in Amazon S3 for tables registered in the AWS Glue Data Catalog. This provides you with a single set of permissions for both SQL queries and direct file access using your existing Lake Formation table grants.<br /> <br /> With this launch, Lake Formation provides temporary, scoped credentials for registered S3 locations based on your table permissions. SELECT permissions grant read access, and SUPER permissions grant read and write access to the data at that location. This capability comes built-in with Amazon EMR 7.13 or later. As a result, you can access data files directly from your Spark jobs for tasks that require file level access such as model training, feature engineering, or debugging data quality issues.<br /> <br /> You can also integrate your Apache Spark or Trino applications using APIs or through an open source plugin provided by AWS. Additionally, all access is logged in AWS CloudTrail to provide a unified audit trail across SQL and file-based operations on your tables.<br /> <br /> This feature is available at no additional charge in all AWS Regions where AWS Lake Formation is available. To learn more, see Lake Formation&nbsp;<a href=\"https://docs.aws.amazon.com/lake-formation/latest/dg/accessing-s3-locations.html\">documentation</a>, EMR <a href=\"https://docs.aws.amazon.com/emr/latest/ManagementGuide/lake-formation-path-based-credential-vending.html\">documentation</a>, API <a href=\"https://docs.aws.amazon.com/boto3/latest/reference/services/lakeformation/client/get_temporary_data_location_credentials.html\">reference</a>, and open source <a href=\"https://github.com/aws/aws-lakeformation-accessgrants-plugin-java-v2\">plug-in</a>.</p>"
"last_updated": "2026-06-13 04:01:59 JST"
