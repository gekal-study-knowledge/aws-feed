    "title": "Accelerate campaign workflow with insights from Adobe Marketing Agent for Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerate-campaign-workflow-with-insights-from-adobe-marketing-agent-for-amazon-quick/"
