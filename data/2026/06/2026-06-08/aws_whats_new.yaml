    "title": "Amazon OpenSearch Serverless now supports Agentic Search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/opensearch-agentic-search/"
    "published": "2026-06-08 15:58:00"
    "fetched": "2026-06-09 02:19:53"
    "summary": "<p>Amazon OpenSearch Serverless now offers Agentic Search — a capability that lets users query their data using natural language. Users simply describe what they are looking for, and the system interprets intent, plans the optimal search strategy, generates the appropriate DSL (domain-specific language) query, and returns results with a transparent explanation of its reasoning.<br /> <br /> Users can ask \"Find available flights to Tokyo under $800\" or \"Show top-selling products in the electronics category this month.\" Behind the scenes, a built-in QueryPlanningTool powered by large language models (LLMs) translates natural language into DSL queries and orchestrates the right tools to retrieve results. Users can configure and customize behavior through APIs or OpenSearch Dashboards. OpenSearch UI provides a guided experience for creating agents and executing agentic searches, with an application available for each collection accessible from the AWS console.<br /> <br /> Agentic Search is available in all AWS Commercial Regions where OpenSearch Serverless is available. See <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">here</a> for a full listing of Regions.<br /> <br /> Learn more about Agentic Search, visit the OpenSearch <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-configure-agentic-search.html\">technical documentation</a>.</p>"
  "3892ade013730291c9269157d25cc9a6":
    "id": "3892ade013730291c9269157d25cc9a6"
    "title": "Amazon RDS for SQL Server migration cost assessment capabilities now available in AWS Transform"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-rds-sql-server-cost-assessment-aws-transform/"
    "published": "2026-06-08 16:00:00"
    "fetched": "2026-06-09 07:23:09"
    "summary": "<p><b>Amazon RDS for SQL Server</b> now offers TCO assessment in AWS Transform, so you can estimate costs when migrating on-premises SQL Server databases to RDS for SQL Server. Using AI-powered agents, AWS Transform analyzes your on-premises SQL Server environment and provides optimal database instance recommendations that meet your workload requirements and reduce cost. With AI-powered what-if analysis, you can evaluate different options, compare costs, and choose the best option for your migration.<br /> <br /> RDS for SQL Server assessment within AWS Transform supports both Bring Your Own Media (BYOM), which allows you to use your existing SQL Server licenses, and License Included (LI) options. The assessments include cost optimization using Database Savings Plans, which offer up to 20% savings compared to On-Demand pricing, and eligibility for the AWS Migration Acceleration Program (MAP), which provides credits and support to offset migration costs. You can start your assessment with any data format you have, including RVTools exports, Configuration management database exports (CMDB) data, exports from the AWS Transform discovery tool, and other third-party discovery tools. Create what-if scenarios to compare multiple cost models with customized assumptions including region, resource utilization, and pricing terms.<br /> <br /> RDS for SQL Server joins the existing migration assessment capabilities in AWS Transform, so you can combine it with cost modeling of Amazon EC2, Amazon FSx, Amazon S3, SQL Server on EC2, and virtual desktops in what-if scenarios. You can also enhance your assessment with additional pillars of the <a href=\"https://aws.amazon.com/executive-insights/content/business-value-on-aws/\" target=\"_blank\">Cloud Value Proposition</a> such as staff productivity, operational resilience, business agility, and sustainability.<br /> <br /> To get started, sign in to the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/getting-started.html\" target=\"_blank\">AWS Transform console</a> and select <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\" target=\"_blank\">Migration Assessment</a>. AWS Transform migration assessments are available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\" target=\"_blank\">AWS Transform is offered</a>.</p>"
"last_updated": "2026-06-09 07:23:09 JST"
