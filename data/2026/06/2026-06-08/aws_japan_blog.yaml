    "fetched": "2026-06-08 17:50:43"
    "summary": "Amazon Bedrock で OpenAI の GPT-5.5、GPT-5.4、Codex が一般提供開始, Amazon Bedrock AgentCore Identity で AWS Secrets Manager の既存シークレットを利用可能に, Amazon Quick が MCP 接続で VPC connectivity をサポート, Amazon RDS for SQL Server が Bring Your Own Media をサポート, Amazon ElastiCache for Valkey の durability サポートを発表, AWS Config が internal service linked rules をサポート開始, AWS Config が 9 つの新しいリソースタイプに対応, AWS Step Functions が AgentCore を活用したエージェント推論ステップに対応, Amazon Bedrock が OpenAI および Anthropic 互換 API に最適化された再設計コンソールを発表, Amazon Cognito がマルチリージョンレプリケーションに対応, Amazon SageMaker Data Agent がビジネスコンテキストを会話に統合, AWS MCP Server が cross-account および cross-role アクセスに対応, Amazon Bedrock AgentCore Runtime に対話型シェル (インタラクティブターミナル) 機能を導入"
