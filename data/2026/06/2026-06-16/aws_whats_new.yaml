"entries":
  "61b83de52e611197b65f78127109e9b8":
    "id": "61b83de52e611197b65f78127109e9b8"
    "title": "AWS DevOps Agent expands with custom SRE agents and MCP/A2A protocols"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-devops-agent-custom-agents/"
    "published": "2026-06-16 00:47:00"
    "fetched": "2026-06-16 01:13:47"
    "summary": "<p>AWS DevOps Agent now supports custom SRE agents, bring-your-own sub-agents, and headless access via MCP and A2A protocols. These capabilities enable teams to automate recurring SRE workflows, extend DevOps Agent by connecting it to other agents, and access its capabilities from the tools they already use, including Kiro, Claude, and other coding assistants.<br /> <br /> With custom SRE agents, teams can create and schedule agents within Agent Spaces that run on a cadence. For example, create a daily database health report that checks for slow queries and parameters that need tuning, or build an agent that reviews logs from the past 24 hours and flags anomalies. In headless mode, developers can invoke DevOps Agent from the tools and agents they already use via A2A or MCP protocols. For example, the Kiro power for AWS DevOps Agent lets developers check production health and investigate issues without leaving their IDE. Teams can also connect their own sub-agents built with Amazon Bedrock or third-party frameworks via A2A to extend DevOps Agent capabilities.<br /> <br /> AWS DevOps Agent also introduces chat enhancements, incident-skip support based on customer-defined rules, enhanced knowledge with memories and Git-managed skills, human labeling and customer-created dashboards for tracking task quality, and is available in five new Regions. See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/recent-fixes-and-improvements.html\">recent improvements page</a>.<br /> <br /> For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">supported Regions table</a>.</p>"
  "a328eb68ce15e82983d7c8b1f59c8bbf":
    "id": "a328eb68ce15e82983d7c8b1f59c8bbf"
    "title": "Amazon Route 53 Resolver DNS Firewall now supports Palo Alto Networks Advanced DNS Security (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-route-53-resolver-dns/"
    "published": "2026-06-16 02:06:00"
    "fetched": "2026-06-16 05:25:36"
    "summary": "<p>Amazon Web Services announces the preview of Palo Alto Networks (PANW) Advanced DNS Security on Amazon Route 53 Resolver DNS Firewall. Security administrators can now enforce DNS threat protections from Palo Alto Networks directly on Route 53 DNS Firewall rules, without deploying separate firewalls or modifying VPC configurations — by subscribing to PANW from the DNS Firewall console through the embedded AWS Marketplace widget.<br /> <br /> With this launch, you can enforce DNS threat protections from Palo Alto Networks by deploying one or more security categories including Command and Control, Malware, Phishing, Newly Registered Domains, and more, directly within the DNS Firewall rule creation workflow. You can apply these protections for your DNS query traffic from Amazon VPCs and hybrid-cloud, forwarded via Route 53 Resolver Endpoints, providing unified DNS threat protection across AWS and on-premises environments. This integration complements AWS-managed domain lists with Palo Alto Networks' threat intelligence, including fast-flux protection, DNS tunneling detection, DNS rebinding protections, and DGA detection. It simplifies security operations by eliminating the need to deploy separate PANW firewalls per VPC or account, and supports multi-account management through AWS Resource Access Manager (RAM), Route 53 Profiles, and AWS Firewall Manager. Customers gain centralized visibility through AWS Security Hub findings and query logs stored in Amazon S3, Amazon Data Firehose, or Amazon CloudWatch Logs.<br /> <br /> Palo Alto Networks Advanced DNS Security on Route 53 DNS Firewall is available in preview in the following AWS Regions: US East (Ohio), US West (N. California), Europe (London), Europe (Frankfurt), Asia Pacific (Tokyo), Asia Pacific (Mumbai), Asia Pacific (Singapore), and Africa (Cape Town). DNS Firewall Advanced customers can add PANW rules to existing rule groups at no additional DNS Firewall charge, and the Palo Alto Networks Advanced DNS Security Marketplace subscription is free during preview.<br /> <br /> To get started, see the Route 53 DNS Firewall <a>documentation</a>. To view Route 53 pricing, visit the <a>Route 53 pricing page</a>. To learn more about the AWS Marketplace listing and pricing for PANW Advanced DNS Security, <a>see here.</a></p> \n<p>&nbsp;</p>"
  "bbefe42420e16910da253aeab1f055e8":
    "id": "bbefe42420e16910da253aeab1f055e8"
    "title": "Amazon ECS Express Mode is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ecs-express-mode-govcloud/"
    "published": "2026-06-16 02:00:00"
    "fetched": "2026-06-16 05:25:36"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) Express Mode is now available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. ECS Express Mode empowers developers to rapidly launch containerized applications, including web applications and APIs, making it easy to orchestrate and manage cloud architecture while maintaining full control over infrastructure resources.</p> \n<p>Every Express Mode service automatically receives an AWS-provided domain name, making your application immediately accessible without additional configuration. Applications using ECS Express Mode incorporate AWS operational best practices, serve either public or private HTTPS requests, and scale in response to traffic patterns. ECS Express Mode automatically consolidates up to 25 services behind a single Application Load Balancer, using intelligent rule-based routing to maintain isolation between services. All resources provisioned by ECS Express Mode remain fully accessible in your account, ensuring you never sacrifice control or flexibility. As your application requirements evolve, you can directly access and modify any infrastructure resource, leveraging the complete feature set of Amazon ECS and related services without disruption to your running applications.</p> \n<p>To get started, provide your container image and ECS Express Mode deploys your application and auto-generates a URL. ECS Express Mode is available at no additional charge, you pay only for the AWS resources created to run your application. To deploy, use the Amazon ECS Console, SDK, CLI, CloudFormation, CDK, and Terraform. For more information, see the <a href=\"https://aws.amazon.com/blogs/aws/build-production-ready-applications-without-infrastructure-complexity-using-amazon-ecs-express-mode/\" target=\"_blank\">AWS News blog</a>, or the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html\" target=\"_blank\">documentation</a>.</p>"
  "8470b1a0615ddcfd2f3234180703ef75":
    "id": "8470b1a0615ddcfd2f3234180703ef75"
    "title": "AWS launches Cost Explorer historical data retention for accounts in billing groups"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-cost-explorer/"
    "published": "2026-06-16 01:07:00"
    "fetched": "2026-06-16 05:25:36"
    "summary": "<p>Today, AWS announces Cost Explorer historical data retention for accounts in billing groups. &nbsp;</p> \n<p>Customers can use AWS Billing Conductor and Billing Transfer to map accounts to billing groups, enabling them to view billing data priced at the pro forma rates supplied by the payer account or Bill-Transfer account. Previously, the billing group configuration resulted in restricted access to historical billing data (priced at AWS billable rates) for accounts mapped to billing groups.</p> \n<p>With this launch, accounts included in billing groups retain access to their historical billing data in Cost Explorer at their original billable rates. Accounts previously on-boarded to Billing Conductor and Billing Transfer will gain access to their historical data with no additional action required. This enables reporting continuity for customers opting into AWS Billing Conductor and Billing Transfer.</p> \n<p>Billing Transfer is available today in all AWS Regions, excluding the GovCloud, China (Beijing) and China (Ningxia) Regions.</p> \n<p>To learn more about using Billing Transfer to centralize billing and cost management across your multi-organization environment, visit <a href=\"https://aws.amazon.com/aws-cost-management/aws-billing-transfer/\">Billing Transfer product page</a>, <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/orgs_transfer_billing.html\">AWS Billing documentation</a>, <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/what-is-costmanagement.html\">AWS Cost Management documentation</a>, and news blog.</p>"
  "cbb91d78b5c0f9fd76ccc02f7423cad2":
    "id": "cbb91d78b5c0f9fd76ccc02f7423cad2"
    "title": "AWS Lambda Managed Instances now supports Tag Propagation for Managed Resources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-lambda-managed-instances-tag-propagation/"
    "published": "2026-06-16 00:55:00"
    "fetched": "2026-06-16 05:25:36"
    "summary": "<p>AWS Lambda Managed Instances (LMI) now supports tag propagation, enabling you to automatically apply tags to managed resources such as Amazon EC2 instances, Amazon EBS volumes, and Amazon ENIs. This helps you enforce cost allocation, service control policies (SCPs), and compliance requirements across all resources provisioned by your capacity providers.</p> \n<p>LMI lets you run Lambda functions on managed EC2 instances with built-in routing, load balancing, and auto scaling, giving you access to specialized compute configurations including the latest-generation processors and high-bandwidth networking, with no operational overhead. Organizations that use resource tagging for cost tracking, governance, or security previously had no way to propagate tags to the underlying managed resources that LMI provisions on their behalf. This made it difficult to track costs accurately, enforce SCPs, or meet compliance standards that require approved tags on all resources. Now, with tag propagation, you can specify a set of tags on your capacity provider configuration, and LMI automatically applies those tags to all managed resources it creates. This ensures consistent tagging across your EC2 instances, EBS volumes, and ENIs without requiring manual intervention or custom automation.</p> \n<p>This feature is available in all AWS commercial Regions where LMI is generally available. To get started, configure the PropagateTags setting on your capacity provider using the CreateCapacityProvider or UpdateCapacityProvider APIs. Set the mode to Explicit and provide your desired tags as key-value pairs. Tag propagation applies to all new managed resources provisioned after the configuration is applied. You can configure these settings using the AWS Management Console, AWS CLI, AWS CloudFormation, AWS CDK, or AWS SAM. To learn more, visit the AWS Lambda Managed Instances <a href=\"https://aws.amazon.com/lambda/lambda-managed-instances/\">product page</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">documentation</a>.</p>"
  "f6593478965d840c8e5c3a6d660c3999":
    "id": "f6593478965d840c8e5c3a6d660c3999"
    "title": "Amazon Bedrock AgentCore Memory now supports strictly consistent metadata for long-term memory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/agentcore-memory-scmetadata"
    "published": "2026-06-16 05:00:00"
    "fetched": "2026-06-16 07:59:50"
    "summary": "<p>Amazon Bedrock AgentCore Memory extracts useful information from short-term memory and stores it as long-term memory records. Metadata on these records helps organize, filter, and route them for retrieval. Previously, metadata values could only be inferred by the LLM during extraction. Now, you can also attach metadata values directly from your application, ensuring they pass through extraction and consolidation exactly as supplied with no LLM inference. When you set a metadata key's extraction type to STRICTLY_CONSISTENT, the value you provide on the short-term memory event is the value that lands on the resulting long-term memory record unchanged.</p> \n<p>Strictly consistent metadata also isolates how events are grouped. Events sharing the same values are extracted together and consolidated together. Records with different values are never merged, even if semantically similar. This enables department-scoped retrieval, compliance boundaries between regulated and standard records, and multi-tenant memory where each tenant's data is processed independently.</p> \n<p>You can configure up to three strictly consistent keys per strategy. The feature is supported on semantic, user preference, and episodic strategies, including custom overrides. Keys must be of type STRING and declared in the memory's indexed keys. Both LLM-inferred and strictly consistent keys can coexist on the same memory resource. To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-memory-metadata.html\">Long-term memory metadata</a>. Amazon Bedrock AgentCore Memory strictly consistent metadata is available in all AWS Regions where AgentCore Memory is supported.</p>"
  "3562c4a64ab957f1e60babbc83e7de92":
    "id": "3562c4a64ab957f1e60babbc83e7de92"
    "title": "Amazon CloudWatch introduces Log Analytics for unified log analysis"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-cloudwatch-log-analytics/"
    "published": "2026-06-16 03:00:00"
    "fetched": "2026-06-16 07:59:50"
    "summary": "<p>Amazon CloudWatch now offers Log Analytics, a unified console experience that brings together CloudWatch Logs Insights for querying and analyzing log data, Live Tail for real-time log streaming, and Contributor Insights for identifying top contributors - all in one place.<br /> <br /> With this launch, customers can execute multiple queries in different tabs and use all existing Logs Insights features such as patterns, saved queries with parameters, facets for interactive log exploration, natural language query generation, and visualizations. Live Tail and Contributor Insights are also accessible from within Log Analytics, which is the default experience. Customers who opt out will see Logs Insights, Live Tail, and Contributor Insights alongside Log Analytics.<br /> <br /> Log Analytics is available in all commercial AWS Regions. Log Analytics uses the same pricing as its underlying capabilities - Logs Insights queries, Live Tail, and Contributor Insights. For pricing details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing</a>. To get started, select Log Analytics in the CloudWatch console. Learn more in the CloudWatch Logs <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html\">documentation.</a></p>"
  "1add85e10efb05e392f9d1f0ba9c7b2e":
    "id": "1add85e10efb05e392f9d1f0ba9c7b2e"
    "title": "AWS Management Console Private Access now works without internet connectivity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-management-console-private/"
    "published": "2026-06-16 08:00:00"
    "fetched": "2026-06-16 10:44:17"
    "summary": "<p>AWS Management Console Private Access now enables customers to access the AWS Console from VPCs without internet connectivity, allowing enterprises to manage their AWS infrastructure through the console while maintaining strict network security controls in air-gapped environments.<br /> <br /> Previously, AWS Management Console Private Access allowed customers to restrict console access to authorized AWS accounts and corporate networks but still required internet connectivity. With this launch, AWS Console traffic can flow through VPC endpoints for the supported service consoles, eliminating the need for any internet access.&nbsp;This capability is particularly valuable for customers in regulated industries such as financial services, government and defense, and healthcare, and for enterprises with strict security requirements who need to access sensitive data only from controlled environments and use the console in classified or networks without internet connectivity.<br /> <br /> AWS Management Console Private Access uses AWS PrivateLink to establish secure network paths between customer VPCs and the console. Customers can apply VPC endpoint policies to restrict access to specific AWS accounts and organizations, and use IAM, Service Control, and Resource Control policies to require that employees access resources only from authorized networks.</p> \n<p>This capability is available in all AWS commercial regions. You pay only for the underlying AWS PrivateLink VPC endpoint usage and data processing. To get started and learn about the supported services, visit the <a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/console-private-access.html\">Management Console Private Access documentation</a>.</p>"
  "7c8bb413c3c6347671b62388f6b80b79":
    "id": "7c8bb413c3c6347671b62388f6b80b79"
    "title": "Amazon FSx for OpenZFS now supports on-demand data replication across AWS opt-in Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/on-demand-cross-region-replication/"
    "published": "2026-06-16 03:30:00"
    "fetched": "2026-06-16 10:44:17"
    "summary": "<p><a href=\"https://aws.amazon.com/fsx/openzfs/\">Amazon FSx for OpenZFS</a> now supports on-demand data replication across AWS opt-in Regions, enabling you to easily and efficiently transfer incremental point-in-time snapshots of your volumes beyond AWS Regions that are enabled by default. On-demand data replication provides a simple and resilient way to implement disaster recovery, replicate production data to a different Region or account, and enable lower latency data access for your global customer base or workforce.</p> \n<p>Amazon FSx for OpenZFS provides fully managed, cost-effective, shared file storage powered by the popular OpenZFS file system, with rich data management capabilities like snapshots, data cloning, and compression, along with sub-millisecond latencies and up to 10 GB/s of throughput. Opt-in Regions are AWS Regions that are disabled by default, in contrast to regions that are enabled by default. Previously, on-demand data replication was supported only between accounts in AWS Regions that are enabled by default. Starting today, you can replicate snapshots to and from opt-in Regions, expanding the AWS Regions where you can build cross-Region disaster recovery and data distribution architectures.</p> \n<p>On-demand data replication across opt-in Regions is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon FSx for OpenZFS is offered, including the supported opt-in Regions. There is no additional charge for on-demand data replication. Standard AWS data transfer charges apply when replicating across AWS Regions or accounts. To get started, visit the <a href=\"https://console.aws.amazon.com/fsx/\">Amazon FSx console</a> or refer to the <a href=\"https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/on-demand-replication.html\">on-demand replication documentation</a>. To learn more, visit the <a href=\"https://aws.amazon.com/fsx/openzfs/\">Amazon FSx for OpenZFS product page</a>.</p>"
  "01524269618793d3b5da2472e55ea0fb":
    "id": "01524269618793d3b5da2472e55ea0fb"
    "title": "AWS Transform now supports Amazon FSx for NetApp ONTAP (Public Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-transform-vmware-fsx-for-ontap-preview"
    "published": "2026-06-16 13:00:00"
    "fetched": "2026-06-16 21:49:35"
    "summary": "<p>Today, AWS announces the public preview of a new storage migration capability for AWS Transform that enables application owners, database administrators, and cloud migration teams to migrate block storage workloads from any on-premises or cloud source to Amazon FSx for NetApp ONTAP (FSx for ONTAP), alongside the existing Amazon EBS option. AWS Transform for migrations is an agentic AI service that automates the discovery, planning, and migration of workloads, accelerating infrastructure modernization with increased speed and confidence. FSx for ONTAP is a fully managed shared storage service built on NetApp's ONTAP file system, allowing you to migrate on-premises applications that rely on NetApp ONTAP or other storage appliances to AWS without having to change how you manage your data.</p> \n<p>Customers migrating to AWS have traditionally managed storage migration separately, using additional tools and workflows. With this new capability, AWS Transform replicates block storage data directly to FSx for ONTAP volumes as part of the same migration wave that handles compute and network, eliminating the need for intermediate storage platforms, separate migration tools, and the additional cost and risk they introduce. Whether migrating from NetApp ONTAP or any other storage platform, including block storage or NFS datastores in VMware environments, customers access a fully managed service that combines ONTAP's enterprise capabilities with the scalability and resiliency of AWS.</p> \n<p>To get started, visit <a href=\"https://aws.amazon.com/transform/migrations/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform for migrations</a>. To learn more about the storage destination service, see the <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon FSx for NetApp ONTAP</a> product page.</p>"
  "236c3d381fa89c3aa50ae9ba3e49e638":
    "id": "236c3d381fa89c3aa50ae9ba3e49e638"
    "title": "Grok 4.3 from xAI now available in Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/grok-amazon-bedrock/"
    "published": "2026-06-16 05:04:00"
    "fetched": "2026-06-16 21:49:35"
    "summary": "<p>Today, AWS announces the availability of xAI's Grok 4.3 model on Amazon Bedrock. With this launch, xAI joins Amazon Bedrock as a model provider, giving you even more choice as you build generative AI applications across reasoning, agentic, and enterprise workflows.</p> \n<p>Grok 4.3 is a reasoning-first model that offers always-on and configurable reasoning effort (none, low, medium, high). Because reasoning is always active rather than optional, it behaves more consistently across multi-step agent loops than models that can skip thinking. It also offers strong tool use and instruction-following capabilities for building multi-step agents, and token efficiency to help keep high-volume inference cost-effective. Grok 4.3 is especially well suited to enterprise workloads such as contract review, case law research, credit agreement analysis, and financial document Q&amp;A, while delivering consistent, high-quality results across conversational AI, search, chat, and multi-turn workflows. Grok 4.3 runs on Mantle, a new inference engine in Amazon Bedrock designed for price performance, with support for tool calling, structured output, and response streaming.</p> \n<p>See <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">region availability</a> of Grok 4.3 for list of supported regions. To get started, visit the Grok 4.3 <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html\">model detail page</a> in our documentation.</p>"
  "d094042729e5fdb300a52aae7177621d":
    "id": "d094042729e5fdb300a52aae7177621d"
    "title": "AWS Partner Central agents now accelerate co-selling on every deal"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/accelerate-co-selling-with-agents/"
    "published": "2026-06-16 22:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>Starting today, AWS Partner Central agents qualify every co-sell opportunity in real time and make recommendations that drive AWS engagement and accelerate deal progression. Building on the <a href=\"https://aws.amazon.com/blogs/apn/introducing-aws-partner-central-agents/\">AWS Partner Central agents</a> released on March 16, 2026, the agent can act on the partner's behalf through conversation to enrich the opportunity details. This eliminates waiting for manual review, so partners build a stronger pipeline and progress deals faster.<br /> <br /> Now, each opportunity is matched to a co-sell motion that determines AWS engagement: AWS field-engaged, where an AWS sales team collaborates directly; Agent-engaged, where the agent strengthens the submission to increase AWS engagement; and Partner-led, where the partner drives the deal with agent support. Across all motions, the agent provides customer insights, recommendations, and sales plays, and each opportunity receives an Opportunity Quality Score that measures co-sell readiness and directly influences how AWS engages. The agent recommends how to improve this score, and as the opportunity improves, the score and motion recalculate in real time, moving it closer to AWS engagement.<br /> <br /> The new enhanced experience is available today to AWS Partners in all commercial AWS Regions. To get started, log in to AWS Partner Central and access opportunity management. Partners can also use the agentic experience in native AI tools like Amazon Quick and Kiro, or through MCP in their own CRM. See the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/partner-central-mcp-server.html\">Partner Central agents MCP server guide</a> to get started.</p>"
  "36b6273a99980c3d58f9db0ff034fbe8":
    "id": "36b6273a99980c3d58f9db0ff034fbe8"
    "title": "AWS Marketplace announces AI-assisted product listing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/ai-assisted-product-listing/"
    "published": "2026-06-16 21:30:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>Today, AWS Marketplace announces AI-assisted product listing in Partner Assistant chat, helping Independent Software Vendors (ISVs) and Consulting Partners create high-quality product listings on AWS Marketplace using their existing digital assets. This new capability helps partners create listings optimized for discovery by buyers, while eliminating the time-consuming manual data entry and guesswork around meeting AWS Marketplace requirements.</p> \n<p>Partner Assistant automatically generates and validates product listing content by importing information from your existing digital assets, including website URLs, PDFs, case studies, and product documentation. The AI-powered assistant creates content across all required product information fields, validates it against AWS Marketplace size and format requirements, and optimizes it for search. You'll receive field-level recommendations based on AWS Marketplace best practices, with a quality score indicating where your listing stands relative to the standards that drive buyer engagement. Whether you're creating your first listing or managing multiple products, Partner Assistant streamlines the process while helping ensure your listings are best positioned to be discoverable and considered by customers in AWS Marketplace.</p> \n<p>AI-assisted product listing capability is available through the Partner Assistant chat in <a href=\"https://partnercentral.awspartner.com/partnercentral2/s/login?ec=302&amp;inst=aq&amp;startURL=%2Fpartnercentral2\">AWS Partner Central</a> and the <a href=\"https://aws.amazon.com/marketplace/management/products\">AWS Marketplace Management Portal</a> (AMMP). For programmatic access, you can use the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/partner-central-mcp-server.html\">Partner Agent MCP server</a>. This feature is not available in AWS GovCloud (US) Regions or China Regions.</p> \n<p>To learn more about creating product listings with AI assistance, visit <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/ai-assisted-product-listing.html\">AI-assisted Product Listing</a>.&nbsp;</p>"
  "e95f082e1659e052e7f3d6bd9a28a116":
    "id": "e95f082e1659e052e7f3d6bd9a28a116"
    "title": "AWS Partner Central now validates Foundational Technical Review in minutes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-partner-central-foundational-technical-review/"
    "published": "2026-06-16 16:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Partner Central now accepts SOC 2 Type II audit reports or AWS Well-Architected Framework Reviews (WAFR) reports to complete Foundational Technical Review (FTR) in minutes. This streamlined process with AI-powered validation provides AWS partners with immediate feedback on their solution’s validation against AWS Partner Network (APN) requirements. Partners now receive approval or actionable feedback within minutes to accelerate validation of their solutions and unlock the qualified software badge, APN program eligibility, and access to co-selling and funding benefits.<br /> <br /> The streamlined FTR aligns AWS partner validation with industry compliance standards that enterprise customers already recognize and often require. Partners with SOC 2 certifications can satisfy FTR requirements by submitting third party reports&nbsp;in AWS Partner Central, while partners without SOC 2 can submit WAFR reports generated in the <a href=\"https://aws.amazon.com/well-architected-tool/\">AWS Well-Architected Tool</a> as an alternate validation pathway. When issues are identified, partners receive specific AI-generated feedback with remediation steps for each failing control, enabling immediate iteration and re-submission.&nbsp;<br /> <br /> FTR is available to all partners, and can be attained on software solutions deployed on AWS and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">AWS Partner Revenue Measurement</a> enabled. To learn more about the streamlined Foundational Technical Review process and submission requirements, visit the AWS Partner Central <a href=\"https://docs.aws.amazon.com/partner-central/latest/builder-guide/requesting-ftr.html\">Builder Guide</a>.</p>"
  "c51ad542ccaff257857d7033049dcb79":
    "id": "c51ad542ccaff257857d7033049dcb79"
    "title": "AWS Partner Central launches new funding benefits for Business Value Realization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-partner-business-value-realization/"
    "published": "2026-06-16 16:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Partner Central now supports the Business Value Realization (BVR) motion, a new experience and funding motion for partners who drive customer adoption and business outcomes after deploying strategic AWS services. BVR helps partners drive business outcomes for their customers by structuring the AWS service adoption journey across defined stages, with funding tied to proven demonstrated value realization.<br /> <br /> Partners can now enroll in BVR through a self-service registration flow in AWS Partner Central, nominate customer opportunities, and track customer progress towards value realization. The new experience enables partners to track customer progression across structured adoption stages, with guided activities to help customers achieve desired outcomes. As partners drive customer adoption, AI agents in AWS Partner Central generate weekly adoption reports that surface highlights, risks, and recommendations, helping partners identify where customer users drop off and how tooling adoption is accelerating. When partners complete stages, funding is automatically disbursed through the AWS Partner Funding Portal without requiring separate requests.<br /> <br /> BVR is available in AWS Partner Central for consulting, system integrator, and managed services partners with advance or premier tier status and a qualifying domain competency. Learn more in the <a href=\"http://aws.amazon.com/blogs/apn/accelerate-customer-outcomes-with-the-aws-business-value-realization-motion/\">APN blog </a>or visit AWS Partner Central guide for <a href=\"http://docs.aws.amazon.com/partner-central/latest/getting-started/bvr-overview.html\">Business Value Realization.</a></p>"
  "d198aee955991d1c3887c20fd36cf568":
    "id": "d198aee955991d1c3887c20fd36cf568"
    "title": "AWS Marketplace reduces listing fee for professional services to 0.5%"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/reduce-listing-fee-professional-services-aws-marketplace"
    "published": "2026-06-16 14:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Marketplace now offers a 0.5% listing fee for professional services private offers, reduced from 2.5%. This makes it more cost-effective for consulting partners, systems integrators, managed services providers and independent software vendors to transact their services through AWS Marketplace, while retaining the procurement and billing benefits that come with it.</p> \n<p>Professional services is an established and growing category on AWS Marketplace, with hundreds of partners actively transacting. The reduced fee complements capabilities purpose-built for the discovery and purchase of services through AWS Marketplace. Customers can find the right Partner through AI-powered discovery in Agent Mode, procure complete solutions through multi-product solutions that combine software and services in a single transaction, and pay through variable billing models like time-and-materials — all through AWS Marketplace. For Partners, these improvements make it simpler and more economical to transact professional services through AWS Marketplace.</p> \n<p>Partners with existing professional services listings benefit automatically, with the reduced fee applying to all new private offers going forward while existing offers and subscriptions continue at their original terms. The fee applies in all <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/supported-regions.html\">AWS Regions</a> where AWS Marketplace operates, across all pricing models and currencies.<br /> <br /> To get started, Partners can review the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/listing-fees.html#regional-offer-listing-fees\">seller documentation</a> and <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/proserv-getting-started.html\">list professional services</a> through <a href=\"https://us-east-1.console.aws.amazon.com/partnercentral/solutions?region=us-east-1\">AWS Partner Central</a>. Customers can explore professional services directly in <a href=\"https://aws.amazon.com/marketplace/search/results?ref_=header_nav_dm_professional_services&amp;FULFILLMENT_OPTION_TYPE=PROFESSIONAL_SERVICES&amp;filters=FULFILLMENT_OPTION_TYPE\">AWS Marketplace.</a></p>"
  "f98dd03ae5c2ed679118759aabcb78be":
    "id": "f98dd03ae5c2ed679118759aabcb78be"
    "title": "AWS Partners can now accelerate co-sell deals with express private offers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-partners-express-private-offers"
    "published": "2026-06-16 14:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Partners co-selling with AWS can now use express private offers to automate pricing within co-sell workflows. Partners configure their pricing rules, discount boundaries, and eligible products once, and when AWS sales representatives identify their solution as a fit for a customer's needs, the deal can move from opportunity to private offer in minutes rather than weeks of manual negotiation.</p> \n<p>As AWS sellers identify relevant Partner solutions through co-sell tools, they can see which Partners have express private offers enabled and directly invite customers to receive personalized pricing. Customers specify their purchase requirements, contract duration, and configuration needs, and receive a tailored private offer based on the Partner's pre-configured pricing rules. Partners receive the customer's contact details and can follow up at any time to assist with offer acceptance or provide additional context. This gives Partners increased visibility in AWS-led sales motions, faster deal conversion, and the ability to engage with customers who have expressed purchase intent, while giving AWS sellers confidence that matched Partners can deliver customized pricing without delays.</p> \n<p>To get started, Partners can onboard their products to express private offers by following the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/express-private-offers.html\">AWS Marketplace Seller Guide</a>. For best practices on co-selling with AWS, review this&nbsp;guide on <a href=\"https://aws.amazon.com/blogs/awsmarketplace/improving-your-visibility-to-aws-sales-a-practical-guide-for-partners/\">improving your visibility to AWS Sales</a>.</p>"
  "4ba916b16a88510770ebf0bef0d3f716":
    "id": "4ba916b16a88510770ebf0bef0d3f716"
    "title": "AWS announces Amazon Connect Customer Services Competency"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-announces-amazon-connect-customer-services-competency"
    "published": "2026-06-16 13:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS announces the Amazon Connect Customer Competency, a new AWS Specialization that helps customers identify Services Partners with proven expertise in transforming enterprise-wide customer experience on Amazon Connect Customer.</p> \n<p>Today's customers expect seamless, personalized experiences at every touchpoint, but legacy contact centers fall short — relying on queues, manual routing, and handle-time metrics, with AI added as a separate layer rather than built in from the start.</p> \n<p>The Amazon Connect Customer Competency recognizes Services Partners across two categories: <b>Contact Center Transformation</b> and <b>AI-Powered Customer Experience</b>. Partners validated in this Competency have demonstrated technical depth and proven success in migrating legacy contact centers and operationalizing AI at scale on Amazon Connect. Customers gain confidence working with validated Partners who can deliver AI-native transformations spanning voice, chat, email, SMS, and social channels.</p> \n<p>This is the first AWS Competency directly aligned to an AWS service, replacing the Amazon Connect Service Delivery Program designation, which will be deprecated on June 1, 2027.</p> \n<p>AWS Partners on the Services Path who are validated or differentiated members and have demonstrated customer success with Amazon Connect are encouraged to apply. To learn more and discover validated Partners, visit the <a href=\"https://aws.amazon.com/products/connect/customer/partners/\">Amazon Connect Customer Competency page</a>.</p>"
  "b6c784c82405791023a231c9864dbc31":
    "id": "b6c784c82405791023a231c9864dbc31"
    "title": "AWS Marketplace Storefront is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-marketplace-storefront/"
    "published": "2026-06-16 13:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Marketplace Storefront is now generally available, enabling AWS Partners to create and deploy their own branded catalog of solutions and services on their website or application in hours. Channel Partners and Independent Software Vendors can now simplify how they manage their cloud marketplace business and make it easier for customers to discover and purchase their solutions from AWS Marketplace.<br /> <br /> With AWS Marketplace Storefront, Partners can configure a fully branded storefront with no code required, importing listings from AWS Marketplace and going live the same day. Transactions flow through AWS Marketplace billing infrastructure and appear automatically on customers' AWS invoices, eliminating the need to build or maintain separate payment systems. Partners can automate deal workflows with private offer templates, approval automation, and native CRM connectivity to tools like Salesforce and HubSpot. The storefront supports a curated catalog on the Partner's own domain, helping them maintain and strengthen customer relationships. For Channel Partners who resell multiple vendors' solutions, this means presenting each customer a tailored catalog of approved products and expanding it as their channel business grows, with listing automation and catalog management tools.<br /> <br /> This new capability is available in all <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/supported-regions.html\">AWS Regions</a> where AWS Marketplace operates.<br /> <br /> To learn more, visit the <a href=\"http://aws.amazon.com/marketplace/partners/storefront\">AWS Marketplace Storefront product page</a>.</p>"
  "9ff99ca388464bc45236250bda8ec439":
    "id": "9ff99ca388464bc45236250bda8ec439"
    "title": "AWS Partner Central agents now guide new partners from registration to ready-to-sell"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-partner-central/"
    "published": "2026-06-16 13:00:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>Today, AWS announces the general availability of onboarding capabilities for AWS Partner Central agents. The agent acts as an always-available advisor that guides new partners through every step required to be ready to sell with AWS, from profile setup to guidance to complete compliance requirements like verifications, tax, and payment setup, all the way to being ready to create listings on Marketplace. Partners can engage with the onboarding agent directly in the AWS Partner Central console or programmatically through Model Context Protocol (MCP).</p> \n<p>The agent builds complete partner profiles automatically, pulling facts from your company website to populate industries served, solutions offered, and key capabilities. The agent identifies what each partner needs to do next to be ready to sell with AWS and why, and provides step-by-step guidance through tax, banking, and compliance requirements. Partners who previously had to research across several documents to understand the quickest path to start selling with AWS now get a personalized roadmap on demand.</p> \n<p>These agentic onboarding capabilities are available today in all commercial AWS Regions. To get started, log in to <a href=\"https://partnercentral.awspartner.com\">AWS Partner Central</a> in the AWS Management Console and access agents by clicking on any of the default prompts available on the dashboard, or review the <a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/partner-onboarding-agent.html\">agents guide</a>. To integrate into your own CRM or partner management tools, visit the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/partner-central-mcp-server.html\">Partner Central agents MCP server guide</a>.</p>"
  "a73f819aab70889cb6298ac7c1476091":
    "id": "a73f819aab70889cb6298ac7c1476091"
    "title": "AWS Partner Central now provides lead enrichment and prospecting"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/lead-enrichment-and-prospecting"
    "published": "2026-06-16 00:37:00"
    "fetched": "2026-06-17 03:02:26"
    "summary": "<p>AWS Partner Central now provides lead enrichment and prospecting, enabling AWS Partners to enrich AWS-sourced leads or partner-sourced leads with AWS-generated propensity insights, and recommendations for program, funding, and sales motion eligibility.&nbsp;</p> \n<p>Partners can upload leads in the AWS Partner Central console or programmatically using the AWS Partner Central API. For each lead, Partners receive propensity-to-buy signals including likelihood of purchasing through AWS Marketplace and alignment with solution categories along with account eligibility for Partner Greenfield Program (PGP), Pioneer Credits, and Partner-Led Sales Motion.&nbsp;</p> \n<p>Lead enrichment and prospecting is available to all APN Customer Engagements (ACE) eligible AWS Partners through both AWS Partner Central and the AWS Partner Central API, which is available in the US East (N. Virginia) Region.</p> \n<p>To get started, visit the Leads page in&nbsp;<a href=\"https://aws.amazon.com/partners/partner-central/\">AWS Partner Central</a>&nbsp;or see the AWS&nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/working-with-your-leads.html\">Partner Central API documentation</a>. For more details, read the <a href=\"https://aws.amazon.com/blogs/apn/sell-smarter-with-aws/\">launch blog</a>.</p>"
"last_updated": "2026-06-17 03:02:26 JST"
