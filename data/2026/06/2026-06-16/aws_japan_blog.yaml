    "fetched": "2026-06-16 16:23:11"
    "summary": "2026 年 6 月 15 日、Kiro 公式グッズストアを shop.kiro.dev にてオープンします。これまで Kiro を使って最高の仕事を生み出してきた皆さんが、今度はそれを身にまとえるようになりました。Kiro コミュニティは、オープンに開発し、プロジェクトを共有し、ハッカソンに参加し、ワークショップに加わるなど、さまざまな活動を続けてきました。このたび Kiro グッズをお届けできることを、私たちは大変うれしく思っています。コミュニティの選択肢がさらに広がり、カンファレンス会場の向こうに別の Kiro ユーザーを見つけたり、お気に入りの Kiro グッズを身につけてハッカソンに参加したり、ラバーダックの代わりに Kiro のぬいぐるみを使ってデバッグしたり——そんな楽しみが生まれます。"
