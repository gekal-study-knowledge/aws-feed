    "summary": "Kiro は月額 $40 の Pro+ と月額 $200 の Power プランの間のギャップを埋める新プラン「Kiro Pro Max（月額 $100）」を発表しました。月 5,000 クレジット、全プレミアムモデルへのアクセス、スペックやカスタムサブエージェントなど Power プランと同等の機能を提供します。Kiro を日常的な主要ツールとして使うプロフェッショナル開発者向けのプランです。"
