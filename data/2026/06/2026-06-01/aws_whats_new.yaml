  "4ff810df5e95eb9811e2d865dbd404c1":
    "id": "4ff810df5e95eb9811e2d865dbd404c1"
    "title": "Amazon Bedrock adds Amazon CloudWatch metrics for OpenAI- and Anthropic-compatible APIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-supports-cloudwatch-metrics-bedrock-mantle-endpoint/"
    "published": "2026-06-01 22:38:00"
    "fetched": "2026-06-02 02:31:24"
    "summary": "<p>Amazon Bedrock is a fully managed service that provides secure, enterprise-grade access to high-performing foundation models from leading AI companies, enabling you to build and scale generative AI applications. Amazon Bedrock customers can now monitor inference traffic to the bedrock-mantle endpoint with Amazon CloudWatch metrics, the same way they already do for the bedrock-runtime endpoint and other AWS services. The <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/endpoints.html\">bedrock-mantle endpoint</a> supports the OpenAI Responses API, OpenAI Chat Completions API, and the Anthropic Messages API, letting customers run existing OpenAI- or Anthropic-based applications on Amazon Bedrock with minimal code changes.<br /> <br /> CloudWatch metrics for the bedrock-mantle endpoint are published under the AWS/BedrockMantle namespace and include inference counts, input and output token totals, and client error counts. Metrics are published at multiple granularity levels, including account, project, model, and project-and-model, so customers can attribute usage and costs to the right workloads and teams.<br /> <br /> With this launch, customers can monitor production inference, set up alarms, and plan capacity on the bedrock-mantle endpoint. To get started, open the Amazon CloudWatch console, choose Metrics, and select the AWS/BedrockMantle namespace to view metrics for your account. CloudWatch metrics for the bedrock-mantle endpoint are available in all AWS Regions where the endpoint is offered: US East (N. Virginia, Ohio), US West (Oregon), Asia Pacific (Jakarta, Mumbai, Sydney, Tokyo), Europe (Frankfurt, Ireland, London, Milan, Stockholm), and South America (São Paulo). To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-mantle-metrics.html\">CloudWatch metrics for the bedrock-mantle endpoint</a>.</p>"
  "e8b15c6ee6d4425f7a9351385fc51d37":
    "id": "e8b15c6ee6d4425f7a9351385fc51d37"
    "title": "Amazon SES now supports tenant-level suppression lists"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-ses-tenant-level-suppression-lists/"
    "published": "2026-06-01 21:00:00"
    "fetched": "2026-06-02 02:31:24"
    "summary": "<p>Amazon Simple Email Service (Amazon SES) now supports tenant-level suppression lists, allowing email senders to isolate bounces and complaints per tenant. Previously, all tenants in an account shared a single suppression list, meaning one tenant's email issues caused emails for other tenants to be suppressed. With this feature, each tenant maintains a separate suppression list, ensuring that bounces and complaints affect only the tenant that generated them.<br /> <br /> This capability benefits any sender managing distinct email streams from a single SES account. Key use cases include SaaS providers sending on behalf of multiple customers, enterprises separating transactional and marketing mail across business units, agencies managing campaigns for different brands, or any application where a complaint from one sending program shouldn't suppress delivery for another.&nbsp;</p> \n<p>You can configure suppression behavior using two settings: suppression scope (TENANT or ACCOUNT) and suppressed reasons (BOUNCE, COMPLAINT, or both). Amazon SES automatically records bounces and complaints to the appropriate tenant's list. You can also manually manage suppressed addresses using API operations including PutSuppressedDestination, GetSuppressedDestination, DeleteSuppressedDestination, and ListSuppressedDestinations with the TenantName parameter.</p> \n<p>To learn more about tenant-level suppression lists in Amazon SES, visit the <a href=\"https://console.aws.amazon.com/ses\">Amazon SES console</a> or refer to the <a href=\"https://docs.aws.amazon.com/ses/latest/dg/sending-email-suppression-list-tenant-level.html\">documentation</a>.</p>"
  "7f3f7c169a842a1b29117efe42542ad0":
    "id": "7f3f7c169a842a1b29117efe42542ad0"
    "title": "GPT-5.5, GPT-5.4, and Codex from OpenAI are now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-bedrock-openai-models-codex-generally-available/"
    "published": "2026-06-01 22:00:00"
    "fetched": "2026-06-02 08:24:52"
    "summary": "<p>You can now use GPT-5.5 and GPT-5.4 in production workloads on Amazon Bedrock and build with Codex for AI-powered software development, with the same security, governance, and operational controls you already use across AWS.</p> \n<p>GPT-5.5 is the most capable model from OpenAI, excelling at agentic coding, data analysis, and multi-step autonomous tasks. It runs on the Bedrock next-generation inference engine, built for high performance, reliability, and security. Codex is available through the Codex App, the Codex CLI, and IDE integrations with Visual Studio Code, JetBrains, and Xcode. You can now configure Codex to run inference through Bedrock. Pricing matches OpenAI first-party rates, and usage counts toward existing AWS commitments.</p> \n<p>For Regional availability of GPT-5.5 and GPT-5.4 see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions page</a>. Read <a href=\"https://aws.amazon.com/blogs/machine-learning/openai-models-and-codex-on-amazon-bedrock-are-now-generally-available\">the launch blog</a> to learn more, for documentation and a step-by-step walkthrough, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock docs</a> and the<a href=\"https://aws.amazon.com/blogs/aws/get-started-with-openai-gpt-5-5-gpt-5-4-models-and-codex-on-amazon-bedrock\"> getting started blog</a>.</p>"
"last_updated": "2026-06-02 08:24:52 JST"
