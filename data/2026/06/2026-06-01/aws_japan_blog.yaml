    "title": "週刊生成AI with AWS – 2026/5/25週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260525/"
    "published": "2026-06-01 13:02:47"
    "fetched": "2026-06-01 14:58:56"
    "summary": "週刊生成AI with AWS,AWS Summit Japan まで1ヶ月を切った2026年6月1日号 – JPX総研様がAmazon BedrockとOpenSearch Serviceで構築したAI開示情報検索サービス「J-LENS」の寄稿記事、Physical AIのためのデータ収集基盤の解説記事含む5件のブログ記事を紹介。サービスアップデートでは、Claude Opus 4.8の提供開始、次世代Amazon OpenSearch Serverlessの一般提供開始、P5.48xl/P4deインスタンスの東京リージョン拡大含む9件を紹介。"
  "586b9e5d5fcdf8dce9232f961733a657":
