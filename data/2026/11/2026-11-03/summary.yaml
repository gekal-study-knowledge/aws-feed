"overview": |
  この日はセキュリティ速報が 4 件 (CVE-2026-119301 AWS SDK for pandas、CVE-2026-119085 Virtual Engineering Workbench、CVE-2026-120497 aidlc-traceability、CVE-2026-116635 AWS Serverless MCP Server) 公開された。AWS Lambda が Kafka Share Groups による Apache Kafka のキュー消費モードに対応し、セルフマネージド Kafka や Confluent Cloud でも利用可能になった。Aurora MySQL 8.4.10 と 3.14 (MySQL 8.0.46 互換) の一般提供、RDS のスナップショット単位課金、RDS for Oracle の M8i/R8i リージョン拡大、Amazon Connect Customer のフローでの MCP ツール呼び出し、Kiro の AWS GovCloud (US) での Haiku 5.5 提供も発表。ブログでは DR (災害復旧) シリーズ 4 本、Circle K のインシデントトリアージ短縮事例、Kiro が自身のハーネスの性質を Lean で証明する取り組みなどが出た。あわせて AWS Transform for mainframe が、同じテーブルやファイルを使う業務機能をまとめていた従来の挙動を改め、データフィールド単位で業務機能を識別できるようになり、画面やキューも含めた要件カバレッジレポートを生成できるようになった。Amazon EKS Capabilities の Argo CD は Argo CD Notifications に対応し、クラスター内でトリガーとメッセージテンプレートを定義して Slack・PagerDuty・Opsgenie・Amazon SQS・Amazon EventBridge など 16 の通知サービスへ配信できる (SQS と EventBridge は IAM Capability Role で認証するため、クラスターに資格情報を置かずに済む)。また Amazon RDS for SQL Server が Microsoft SQL Server の最新の累積更新プログラム (CU) と GDR 更新に対応した。さらに Amazon CloudWatch が、AWS X-Ray の OTLP トレースエンドポイントへ OpenTelemetry トレースを送る際の認証方式として、API キー (ベアラートークン) による認証に対応した。
