    "title": "CVE-2026-119085 - Template injection in the publishing component of Virtual Engineering Workbench"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-162-aws/"
    "published": "2026-11-03 02:41:34"
    "fetched": "2026-11-03 04:05:58"
    "summary": "<p><b>Bulletin ID:</b> 2026-162-AWS<br /> <b>Publication Date:</b> 11/02/2026 09:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>Virtual Engineering Workbench (VEW) is an open-source platform where platform engineers define and publish development environments, and developers provision them on demand through a web portal. We identified CVE-2026-119085, where improper neutralization of special elements used in a template engine in the publishing component of Amazon Virtual Engineering Workbench (VEW) could allow a remote authenticated third party to run arbitrary code with the permissions of the publishing Lambda's IAM role.</p> \n<p><b>Impacted versions:</b> All commits before c146486 (PR #31, merged 2026-05-04)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-162-aws/\">Read this article</a></p>"
  "df25af21ee7ffb0e7fe22780d9388c9d":
    "id": "df25af21ee7ffb0e7fe22780d9388c9d"
    "title": "CVE-2026-119301 - Improper neutralization of quoting syntax in Apache Iceberg SQL identifier generation in AWS SDK for pandas"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-161-aws/"
    "published": "2026-11-03 01:40:57"
    "fetched": "2026-11-03 04:05:58"
    "summary": "<p><b>Bulletin ID:</b> 2026-161-AWS<br /> <b>Publication Date:</b> 11/02/2026 08:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>We are aware of CVE-2026-119301 in the Apache Iceberg write component, where improper neutralization of quoting syntax in SQL identifier construction could allow an authenticated user with permission to modify AWS Glue Data Catalog metadata to read any table that a separate, more privileged principal can access and write to the table that principal is updating via a crafted column name.</p> \n<p><b>Impacted versions:</b> awswrangler &gt;= 3.5.2, &lt; 3.17.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-161-aws/\">Read this article</a></p>"
