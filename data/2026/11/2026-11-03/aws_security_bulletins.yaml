    "title": "CVE-2026-119085 - Template injection in the publishing component of Virtual Engineering Workbench"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-162-aws/"
    "published": "2026-11-03 02:41:34"
    "fetched": "2026-11-03 04:05:58"
    "summary": "<p><b>Bulletin ID:</b> 2026-162-AWS<br /> <b>Publication Date:</b> 11/02/2026 09:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>Virtual Engineering Workbench (VEW) is an open-source platform where platform engineers define and publish development environments, and developers provision them on demand through a web portal. We identified CVE-2026-119085, where improper neutralization of special elements used in a template engine in the publishing component of Amazon Virtual Engineering Workbench (VEW) could allow a remote authenticated third party to run arbitrary code with the permissions of the publishing Lambda's IAM role.</p> \n<p><b>Impacted versions:</b> All commits before c146486 (PR #31, merged 2026-05-04)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-162-aws/\">Read this article</a></p>"
  "df25af21ee7ffb0e7fe22780d9388c9d":
    "id": "df25af21ee7ffb0e7fe22780d9388c9d"
    "title": "CVE-2026-119301 - Improper neutralization of quoting syntax in Apache Iceberg SQL identifier generation in AWS SDK for pandas"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-161-aws/"
    "published": "2026-11-03 01:40:57"
    "fetched": "2026-11-03 04:05:58"
    "summary": "<p><b>Bulletin ID:</b> 2026-161-AWS<br /> <b>Publication Date:</b> 11/02/2026 08:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>We are aware of CVE-2026-119301 in the Apache Iceberg write component, where improper neutralization of quoting syntax in SQL identifier construction could allow an authenticated user with permission to modify AWS Glue Data Catalog metadata to read any table that a separate, more privileged principal can access and write to the table that principal is updating via a crafted column name.</p> \n<p><b>Impacted versions:</b> awswrangler &gt;= 3.5.2, &lt; 3.17.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-161-aws/\">Read this article</a></p>"
  "5dddc5396f9b750310a3d8d58ea1d429":
    "id": "5dddc5396f9b750310a3d8d58ea1d429"
    "title": "CVE-2026-120497 - Stored cross-site scripting in the HTML report generator of aidlc-traceability in AWS AI-DLC Workflows"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-163-aws/"
    "published": "2026-11-03 04:19:50"
    "fetched": "2026-11-03 10:57:56"
    "summary": "<p><b>Bulletin ID:</b> 2026-163-AWS<br /> <b>Publication Date:</b> 11/02/2026 11:00 AM PST</p> \n<p><b>Description:</b></p> \n<p>aidlc-traceability is an open source command-line tool, formerly published in the awslabs/aidlc-workflows repository, that generates traceability-matrix reports from a project's AI-DLC artifact files. We identified CVE-2026-120497, where stored cross-site scripting (XSS) in the HTML report generator in the aidlc-traceability CLI could allow an actor who can modify a project's AI-DLC artifact files to execute arbitrary script in the browser of a user who opens a generated HTML traceability report via crafted artifact titles or descriptions.</p> \n<p><b>Impacted versions:</b> &gt;=0.1.0 AND &lt;commit 96cf0ea (fixed 2026-07-03)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-163-aws/\">Read this article</a></p>"
  "049a887792a38400757d90d69f5cd226":
    "id": "049a887792a38400757d90d69f5cd226"
    "title": "CVE-2026-116635 - Improper limitation of a pathname to a restricted directory in the deployment status component of the AWS Serverless MCP Server"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-164-aws/"
    "published": "2026-11-03 06:43:24"
    "fetched": "2026-11-03 10:57:56"
    "summary": "<p><b>Bulletin ID:</b> 2026-164-AWS<br /> <b>Publication Date:</b> 11/02/2026 13:30 PM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-116635. Under certain conditions, improper limitation of a pathname to a restricted directory in the deployment status component of the MCP server might allow an actor who can influence the MCP agent to read the contents of JSON files outside the intended deployment status directory. Where write access has been enabled, to create or overwrite JSON files outside that directory.</p> \n<p><b>Impacted versions:</b> &lt; v0.2.1 of awslabs.aws-serverless-mcp-server</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-164-aws/\">Read this article</a></p>"
