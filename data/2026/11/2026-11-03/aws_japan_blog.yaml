    "title": "Kiro が自身のハーネスの性質を Lean で証明する"
    "link": "https://aws.amazon.com/jp/blogs/news/harness-properties-in-lean/"
    "published": "2026-11-03 11:03:10"
    "fetched": "2026-11-03 18:08:09"
    "summary": "Kiro が自身のコードの一部を Lean でモデル化し、そのモデルについての定理を証明し、各モデルを TypeScript、Rust、Python のコードと照らし合わせる作業を、自動で進める仕組みを作りました。最初に適用した対象は Kiro 自身です。"
