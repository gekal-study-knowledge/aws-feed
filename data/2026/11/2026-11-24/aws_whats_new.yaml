"entries":
  "d4cbfa417fa4a88d72ab842111ebcb30":
    "id": "d4cbfa417fa4a88d72ab842111ebcb30"
    "title": "AWS WAF introduces simplified pricing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-waf-introduces-simplified-pricing/"
    "published": "2026-11-24 03:51:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS WAF now offers simplified pricing that follows what you protect instead of how you configure it. Previously, you paid separate charges for each web ACL, rule, rule group subscription, and capacity tier, making every security decision a billing calculation. Now, your bill follows three dimensions: the resources you protect, the traffic AWS WAF inspects, and the level of protection you apply. This makes the cost-benefit trade-off easy to understand, and adding or changing rules no longer changes your rate.</p> \n<p>The new model makes protection costs predictable before you deploy. Each web ACL now includes up to 2,500 WCU at no extra charge, up from 1,500, and you can add rules such as Bot Control common protections or the Anti-DDoS rule group without additional fees. You pay a resource fee for each protected resource, a base request fee for every request AWS WAF inspects, and a premium request fee only for traffic evaluated by advanced protections like Bot Control targeted protections, Fraud Control, API Security, and AI Security.</p> \n<p>AWS WAF's new pricing is available today in all AWS commercial Regions, including Cape Town, Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Mumbai, New Zealand, Osaka, Seoul, Singapore, Sydney, Taipei, Thailand, Tokyo, Calgary, Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich, Tel Aviv, Sao Paulo, N. Virginia, Ohio, N. California, Oregon, as well as in AWS GovCloud, China Regions, and AWS Isolated Regions.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/waf/pricing/\">AWS WAF pricing page</a> and review the <a href=\"https://docs.aws.amazon.com/waf/\">AWS WAF Developer Guide</a>&nbsp;as well as the blog post&nbsp;<a href=\"https://aws.amazon.com/blogs/security/introducing-aws-waf-simplified-pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF pricing now follows what you protect, not how you configure it</a>.</p>"
  "cf502d320b3e914e28d898f4f22d5363":
    "id": "cf502d320b3e914e28d898f4f22d5363"
    "title": "AWS WAF announces automated discovery and protection for LLM, MCP, and A2A endpoints using Amazon Bedrock Guardrails"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/waf-ai-endpoint-discovery-protection/"
    "published": "2026-11-24 03:47:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Automated AI endpoint discovery and protection are now generally available, enabling you to discover language model (LLM), Model Context Protocol (MCP), and Agent2Agent (A2A) endpoints behind Amazon API Gateway, Application Load Balancers, and Amazon CloudFront across your AWS Organization and protect them using AWS WAF.</p> \n<p>Discovery is available through the new API Gateway API Portal, which recognizes the AI endpoints among the APIs it discovers automatically from traffic logs and service configuration records, with no agents to deploy or logs to forward. An undocumented, public-facing MCP server appears as a shadow API. For unprotected AI endpoints, customers can enable protection using WAF.</p> \n<p>Protection is available through the new AWS WAF AI Security managed rule group, which protects your AI endpoints. AWS WAF implements protocol recognition and compliance checks to block malformed MCP and A2A messages. When you enable content inspection, the rule group calls Amazon Bedrock Guardrails InvokeGuardrailsCheck API to detect prompt injection, jailbreak attempts, harmful content in requests, and sensitive information in responses. You can use AI Security alongside other AWS Managed Rules or your own custom rules to protect your applications. Additional fees apply, and Amazon Bedrock charges separately for content inspection calls.</p> \n<p>Together, API Portal and AI Security provide you a complete solution from discovery of all AI endpoints in your AWS environment to protecting them, without having to write any custom rules.</p> \n<p>API Portal is available in 32 AWS Regions. See the <a href=\"https://aws.amazon.com/api-gateway/faqs/\">Amazon API Gateway FAQ</a> for the list. AI Security is available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (London), Europe (Stockholm), Asia Pacific (Tokyo), and Asia Pacific (Sydney).</p> \n<p>To get started, see the following resources:</p> \n<p><a href=\"https://aws.amazon.com/waf/features/ai-security/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF product page</a></p> \n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-ai-security.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF AI Security in the AWS WAF Developer Guide</a></p> \n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apiportal.html\" rel=\"noopener noreferrer\" target=\"_blank\">API Portal Developer Guide</a></p> \n<p><a href=\"https://aws.amazon.com/blogs/security/introducing-api-and-ai-security-on-aws-from-discovery-to-protection/\" rel=\"noopener noreferrer\" target=\"_blank\">Introducing API and AI security on AWS, from discovery to protection blog post</a></p> \n<p>&nbsp;</p>"
  "7b422df64b777ec9c64b8f702fea244c":
    "id": "7b422df64b777ec9c64b8f702fea244c"
    "title": "Amazon Connect Customer launches the ability to force logout agents directly from the analytics dashboard"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-force-logout/"
    "published": "2026-11-24 03:35:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon Connect Customer now allows supervisors to force logout agents directly from the real-time analytics dashboard, eliminating the need to manually contact agents to end their sessions. Force logout ends all active agent sessions and records the logout event in the Login/Logout report, so agent timecards stay complete. For example, a supervisor identifies an agent who left their workstation without logging out after a shift, and force logs them out from the dashboard, preventing idle time from accruing on the agent's timecard.</p> \n<p>Agent force logout is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">Regions</a> where Amazon Connect Customer is offered. To learn more about analytics dashboards, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/dashboards.html\">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.&nbsp;</p> \n<p>&nbsp;</p>"
  "4002f9c39147edbc2cb5a37cf9a8c58c":
    "id": "4002f9c39147edbc2cb5a37cf9a8c58c"
    "title": "Amazon Connect Customer now lets you test AI model version upgrades for automated evaluations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-customer-test-ai-model-version-upgrades-automated-evaluations"
    "published": "2026-11-24 03:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon Connect Customer now enables managers to test new AI model versions for automated evaluations before switching, so evaluation scores remain consistent through model upgrades. When a new version becomes available, managers can test how it would score the same contacts compared to the current version of the model. This lets managers catch scoring differences across models and adjust evaluation criteria before those differences affect agent performance results. Managers also have the flexibility to choose how evaluation forms handle model updates. They can automatically upgrade to the latest model version for ongoing accuracy improvements or stay on a specific version for consistent scoring.</p> \n<p>This feature is supported in all <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#contactlens_region\">AWS commercial regions</a> where Amazon Connect Customer is offered. To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/create-evaluation-forms.html#step-automate\">documentation</a> and our <a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>.&nbsp;</p>"
  "0bd861124c858ea8497d3afbd6345746":
    "id": "0bd861124c858ea8497d3afbd6345746"
    "title": "Amazon Connect Customer expands automated performance evaluations to 45 new languages"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-customer-expands-automated-performance-evaluations-new-languages/"
    "published": "2026-11-24 03:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon Connect Customer now uses generative AI to automate evaluations of human and AI agent performance in 45 additional languages, such as Arabic, Dutch, Indonesian, and Polish.&nbsp;Managers define custom evaluation criteria in natural language and receive AI-generated evaluations with justifications in their preferred language. Performance evaluations also support cross-language evaluation and can complete assessments in English, even when the conversation is in another language. This enables multilingual contact centers to use a standardized evaluation framework across languages.</p> \n<p>This feature is supported in all <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#contactlens_region\">AWS commercial regions</a> where Amazon Connect Customer is offered. For information about Amazon Connect pricing, please visit our <a href=\"https://aws.amazon.com/connect/pricing/\">pricing page</a>. To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/generative-ai-performance-evaluations.html#set-up-generative-ai-evals-in-non-english-language\">documentation</a> and our <a href=\"https://aws.amazon.com/connect/contact-lens/\">webpage</a>.</p>"
  "a944738833ce02ff42d4d1380ff23462":
    "id": "a944738833ce02ff42d4d1380ff23462"
    "title": "Amazon CloudFront is now available in the AWS European Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-european-sovereign-cloud"
    "published": "2026-11-24 03:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon CloudFront is now available in the AWS European Sovereign Cloud. Organizations with strict EU sovereignty requirements can now deliver websites, applications, and APIs with the performance, security, and scale of CloudFront, all within the EU. Until now, customers had to build and run their own delivery and TLS termination infrastructure to keep traffic and data inside the EU.</p> \n<p>With CloudFront in the AWS European Sovereign Cloud, content delivery, TLS termination, logs, and customer configuration stay within the European Sovereign Cloud boundary. The AWS European Sovereign Cloud is physically and logically separate from other AWS Regions, and only EU-resident personnel operate it. This helps governments, healthcare, financial services and other regulated industries meet data residency and operational sovereignty requirements without trading away performance and scale. Customers use the same CloudFront APIs and console experience they already know making it easy to transfer over existing deployments and automations.&nbsp;If you plan to run media streaming or other high-volume workloads, contact your AWS account team and we can help you find the right solution, including options in AWS commercial Regions.</p> \n<p>To get started, sign in to your AWS European Sovereign Cloud account and create a distribution in the CloudFront console. To learn more about available features and pricing, see the <a href=\"https://docs.aws.eu/esc/latest/userguide/cloudfront.html\">CloudFront Developer Guide</a>&nbsp;and <a href=\"https://www.aws.eu/cloudfront/pricing/\">CloudFront pricing page in ESC</a>.</p>"
  "02ab73f8dc540f0e8c1f0a6fdaa18a6e":
    "id": "02ab73f8dc540f0e8c1f0a6fdaa18a6e"
    "title": "AWS Partner Central expands analytics access with Partner Central Agents and Data Subscriptions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-analytics-agent-s3/"
    "published": "2026-11-24 02:36:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS Partners and AWS Marketplace sellers now have two new ways to access their analytics data in AWS Partner Central. Partner Central Agents answer questions in plain language, and Data Subscriptions deliver Partner Central data to an Amazon Simple Storage Service (Amazon S3) bucket every day.</p> \n<p>Partner Central Agents answer questions about leads, marketing campaigns, opportunities and pipeline, and funding, without navigating dashboards or exporting to spreadsheets. AWS Marketplace sellers can also ask about usage, agreements and renewals, billing, collections, and disbursements. Partners can get the same answers in their own artificial intelligence (AI) assistants and agents through the Partner Central Model Context Protocol (MCP) server.</p> \n<p>Data Subscriptions deliver ready-to-use datasets to an S3 bucket daily, covering leads, marketing campaigns, partner account relationships, opportunities and pipeline, and AWS Marketplace usage, agreements, and renewals. Because the data lives in a partner's own S3 bucket, partners can connect it to the tools of their choice, such as a business intelligence (BI) tool, a customer relationship management (CRM) system like Salesforce or HubSpot, or a generative AI assistant, and build the reports they need.</p> \n<p>Both features use existing AWS Identity and Access Management (IAM) policies and permissions, so partners see only the data they are already allowed to see, and exported data stays in their own AWS account.</p> \n<p>These capabilities are available in all AWS Regions where AWS Partner Central is available.</p> \n<p>To get started, sign in to AWS Partner Central and ask an analytics question, such as \"What are my top opportunities this quarter?\" To set up Data Subscriptions, choose <b>Settings</b>, and then choose <b>Data Subscriptions</b>. To learn more, see <a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/data-subscriptions.html\">Data Subscriptions</a> in the <i>Partner Central Guide</i>.</p>"
  "ed448efca18d5b3a1325d4b797c3490a":
    "id": "ed448efca18d5b3a1325d4b797c3490a"
    "title": "AgentCore runtime instances are now generally available in the AWS GovCloud (US-West) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agentcore-runtime-instances-govcloud"
    "published": "2026-11-24 02:21:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon Bedrock AgentCore runtime instances are now available in the AWS GovCloud (US-West) Region. Runtime instances run your agents on Amazon EC2 instances in your own account, while AgentCore handles provisioning, patching, scaling, and lifecycle management.</p> \n<p>With runtime instances, teams in AWS GovCloud (US) can choose GPU-accelerated, memory-optimized, or compute-optimized instance types for their agents and run agent sessions of up to 14 days. Agent instances, storage volumes, and session data stay in the AWS GovCloud (US-West) Region, which helps public sector organizations and their partners meet data residency and compliance requirements. Runtime instances work alongside the default serverless, microVM-based AgentCore runtime, so you can pick the right compute for each agent without changing how you deploy or invoke it.</p> \n<p>You are charged for the management of the compute provisioned, in addition to your Amazon EC2 costs.&nbsp;To get started, visit <a href=\"https://aws.amazon.com/blogs/aws/runtime-instances-persistent-compute-for-production-ai-agents-on-amazon-bedrock-agentcore/\">AWS News Blog</a> or <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-how-it-works.html\">AgentCore documentation</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>.</p>"
  "e5f22c1ad11dbe9ab95909c88b000d9f":
    "id": "e5f22c1ad11dbe9ab95909c88b000d9f"
    "title": "Amazon CloudFront Announces HTTP/2 Support for Connections to Origins"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-cloudfront-http2-origins/"
    "published": "2026-11-24 02:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Amazon CloudFront now supports HTTP/2 connections to custom origins and VPC origins. HTTP/2 lets CloudFront send many requests over fewer connections to your origin. This means fewer connections and TLS handshakes for your origin to handle, which improves performance for API and agentic workloads, such as AI agents calling MCP servers or mobile and web apps calling backend APIs.</p> \n<p>Until now, CloudFront connected to origins only over HTTP/1.1, which handles one request at a time per connection. When traffic spiked, for example when an AI agent made many tool calls at once, CloudFront had to open more origin connections. Each new connection added latency and load. With HTTP/2, those requests share connections, so your origin does less work and responds faster. HTTP/2 is also supported for WebSocket connections that support extended CONNECT. If your origin doesn't support HTTP/2, CloudFront automatically falls back to HTTP/1.1, so you don't need to change anything on your origin.</p> \n<p>HTTP/2 to origins is available from all CloudFront edge locations. There is no additional cost for using HTTP/2 to origins. To learn more, visit <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesOrigin.html#DownloadDistValuesOriginHttpVersion\">Origin HTTP version</a> in the CloudFront Developer Guide.</p>"
  "057ab00941af4d3ed81868ed019d6dd3":
    "id": "057ab00941af4d3ed81868ed019d6dd3"
    "title": "AWS Global Accelerator now preserves client IPs for NLBs with TLS listeners"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/global-accelerator-client-ip-nlb-tls/"
    "published": "2026-11-24 01:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS Global Accelerator now preserves the client IP address for traffic sent to Network Load Balancer (NLB) endpoints with TLS listeners. You can terminate TLS at your NLB and still see the original client IP address in your application. This means you can apply security groups, geo-blocking, rate limiting, fraud detection, audit logging, allowlists, and compliance controls based on the real client IP.</p> \n<p>Previously, you couldn't add an NLB with a TLS listener to an accelerator that had client IP address preservation enabled. You had to choose between terminating TLS at the NLB and seeing the real client IP address. With this launch, you get both. This helps with workloads that need TLS termination at Layer 4, such as non-HTTP TCP protocols, applications that require static or Elastic IP addresses, and high-throughput traffic where a Layer 7 load balancer isn't a fit.</p> \n<p>To enable this feature, add an NLB with a TLS listener as an endpoint to an accelerator with client IP address preservation setting turned on, the same way you add any NLB. No additional configuration is required! Client IP address preservation for NLBs with TLS listeners is available at no additional charge in all AWS commercial Regions, excluding the AWS GovCloud (US) and China Regions. Standard Global Accelerator pricing applies.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/preserve-client-ip-address.html\" rel=\"noopener noreferrer\" target=\"_blank\">Client IP address preservation</a> in the AWS Global Accelerator Developer Guide and <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/create-listener.html\" rel=\"noopener noreferrer\" target=\"_blank\">Create a listener for your Network Load Balancer</a> in the User Guide for Network Load Balancers.</p>"
  "850f0ab06cf5ec0de0efb7fef0062f6b":
    "id": "850f0ab06cf5ec0de0efb7fef0062f6b"
    "title": "Amazon Aurora serverless for MySQL now supports up to 384 ACUs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-serverless-mysql-supports-384-acu/"
    "published": "2026-11-24 01:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\" target=\"_blank\">Amazon Aurora serverless</a> now supports database capacity of up to 384 Aurora Capacity Units (ACUs) for Aurora MySQL-Compatible Edition, a 50% increase from the previous maximum of 256 ACUs. Each ACU provides approximately 2 gibibytes (GiB) of memory with corresponding CPU and networking, so a single Aurora serverless database can now scale up to 768 GiB of memory. When the workload completes, Aurora serverless automatically scales down to zero. This makes Aurora serverless especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable traffic patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents, so you only pay for what you use.&nbsp;<br /> &nbsp;<br />  With 384 ACU support, customers can now use Aurora serverless for even more demanding workloads while continuing to scale down to zero when not in use, paying only for the capacity consumed. For new clusters, select a supported Aurora MySQL engine version and set your maximum capacity up to 384 ACUs. For existing clusters on Platform Version 4, simply modify the cluster to update the maximum capacity setting (and the engine version if needed). There will be no downtime if your database is already on Platform Version 4. For existing clusters on older platform versions, upgrade to Platform Version 4 through a pending maintenance action. 384 ACU support is available for Aurora MySQL versions 3.14 and 8.4.10, running on Platform Version 4.&nbsp;<br /> &nbsp;<br /> To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html#aurora-serverless-v2.how-it-works.capacity\" target=\"_blank\">Aurora serverless capacity</a> in the Amazon Aurora User Guide. For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\" target=\"_blank\">Amazon Aurora Pricing</a>.  To get started, create or modify an Aurora serverless database in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\" target=\"_blank\">AWS Management Console</a>.</p>"
  "b5cf3d60cf009f55b975cf48dada37dc":
    "id": "b5cf3d60cf009f55b975cf48dada37dc"
    "title": "Announcing metal size for Amazon EC2 G7 instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-g7-metal-size/"
    "published": "2026-11-24 01:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>Today, AWS announces the general availability of the metal size for Amazon Elastic Compute Cloud (Amazon EC2) G7 instances, accelerated by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs. G7 instances deliver up to 4.6x AI inference performance and up to 2.1x graphics performance compared to G6.</p> \n<p>Customers can use the metal size of G7 instances to run physical AI simulations, deploy AI agent sandboxes, and accelerate graphics workloads that need direct access to bare metal infrastructure. G7 metal instances enable customers to run specialized workloads that require a custom virtualization stack, hypervisor-level GPU drivers, or licensing-restricted applications. The metal size of G7 instances feature 8 NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs with 32 GB of memory per GPU and custom Intel Xeon 6 processors. They support 192 virtual CPUs (vCPUs), 768 GiB of system memory, and 700 Gbps of Elastic Fabric Adapter (EFA) networking bandwidth.</p> \n<p>The new metal size is available in the AWS US East (N. Virginia) Region. You can purchase G7 metal instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p> \n<p>To get started, use the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface</a> (AWS CLI), or AWS SDKs. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\">G7 instance page</a>.</p>"
"last_updated": "2026-11-24 08:19:09 JST"
