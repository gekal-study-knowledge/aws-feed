"overview": |
  この日は 5 ソースから 26 本で、セキュリティ速報 2 件と、AWS WAF の料金体系の刷新と API・AI エンドポイントの保護、ID まわりの機能強化が中心でした。セキュリティ速報では、Bulletin 2026-196-AWS として CVE-2026-134056 が公開され、AWS-LC のパディング付きブロック暗号の復号に境界外書き込みの問題があり、PKCS7 パディングの CBC・ECB 暗号文を複数回の update 呼び出しで復号し、出力バッファーが文書化された最小サイズの場合に 1 バイト先まで書き込み、アプリのクラッシュや隣接メモリの破損を招くおそれがあります (データの漏えいはなし)。aws-lc-rs の StreamingDecryptingKey API の cbc_pkcs7・ecb_pkcs7 にも同様の問題があり、less_safe_update は最大 1 ブロック (AES で 16 バイト) 先まで書き込み得ます。1 回の呼び出しでの復号、パディングなしの復号、CTR・CFB・GCM は影響せず、AWS サービスの利用者は対応不要です。続く 2026-197-AWS の CVE-2026-134069 は、2026-09-09 より前に公開された AWS 提供の Windows Server AMI 上の Amazon SSM Agent (3.3.5226.0 未満) で、同じ AMI から起動したインスタンスが 1 つのインスタンス登録キーを共有しており、Default Host Management Configuration で管理されるインスタンスでは管理者権限のないローカルユーザーがそのロールの認証情報を取得できるおそれがあるというもので、これらの AMI から起動したインスタンスはエージェントをインプレースでアップグレードしても影響が残ります。AWS WAF は、ウェブ ACL・ルール・ルールグループのサブスクリプション・キャパシティ階層ごとの課金をやめ、保護するリソース・検査するトラフィック・適用する保護レベルの 3 軸で課金する簡素化された料金を導入し、既存の利用者は 2027 年 2 月 1 日に新料金へ移行します。あわせて、API Gateway・ALB・CloudFront の背後にある LLM・MCP・A2A のエンドポイントを API Gateway API Portal で自動検出し、Amazon Bedrock Guardrails を使って AWS WAF で保護する機能が一般提供となり、セキュリティブログでも API と AI のセキュリティを発見から保護まで解説しています。ID では、AWS Sign-In で IAM ユーザー・ロールごとに OAuth のサインインセッションを最長 90 日まで保てるようになり (静的アクセスキーより安全な代替として開発者や AI エージェントの長時間ワークフロー向け)、IAM ロールの背後にいるユーザーやワークロードの ID を各リクエストに載せて認可・監査に使える trusted identity propagation、Amazon Cognito のポイントインタイムリカバリーも紹介されました。Amazon Bedrock は、モデル提供者のプログラムを見つけて申請・登録できる Trusted Access API を公開し、最初の 2 つとして Anthropic の Enterprise Frontier Safeguards (EFS) と Enterprise Data Controls (EDC) をパブリックプレビューで提供しています (Claude Fable モデル利用時のデータ管理)。インフラでは、Aurora Serverless for MySQL の上限が 256 ACU から 384 ACU (メモリ最大 768 GiB) に、NVIDIA RTX PRO 4500 Blackwell を積む EC2 G7 の metal サイズが一般提供 (G6 比で AI 推論最大 4.6 倍)、X8i のアジアパシフィック (ニュージーランド) 提供、CloudFront のカスタムオリジン・VPC オリジンへの HTTP/2 接続、CloudFront の AWS European Sovereign Cloud 提供、Global Accelerator の TLS リスナー付き NLB でのクライアント IP 保持、AgentCore runtime instances の GovCloud (US-West) 提供 (セッション最長 14 日)、HyperPod の Slurm クラスター向けマネージド拡張 (可観測性・ユーザー管理) が発表されました。Amazon Connect Customer は自動評価の対象を 45 言語追加し、評価用 AI モデルのバージョンアップを切り替え前に試す機能と、リアルタイムダッシュボードからの強制ログアウトを加え、Partner Central には自然言語で答える Partner Central Agents と S3 へ毎日データを届ける Data Subscriptions が加わりました。日本語ブログでは、NEC の開発チームが Kiro を使い着手から 5 週間で本番デプロイまで進めた全社利用システムの開発、半導体設計者向けリファレンスアーキテクチャ日本版 (解釈・実行・基盤の 3 構成)、チャネルコーポレーションが約 16.8 億件・1.8 TB の User テーブルからバッジ機能を分離し移行時間を 128 時間から 5.5〜6 時間に縮めコストを 36% 削減した DynamoDB 事例、AgentCore 上のエージェントが SAP の agent gateway 経由で Joule エージェントを呼び出す A2A による AWS と SAP の相互運用が紹介されています。
