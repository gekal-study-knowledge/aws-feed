"overview": |
  この日は 5 ソースから 41 本 (Bedrock Trusted Access API の紹介は ML ブログに 2 本重複) で、セキュリティ速報 2 件と、AWS WAF の料金体系の刷新と API・AI エンドポイントの保護、ID まわりの機能強化が中心でした。セキュリティ速報では、Bulletin 2026-196-AWS として CVE-2026-134056 が公開され、AWS-LC のパディング付きブロック暗号の復号に境界外書き込みの問題があり、PKCS7 パディングの CBC・ECB 暗号文を複数回の update 呼び出しで復号し、出力バッファーが文書化された最小サイズの場合に 1 バイト先まで書き込み、アプリのクラッシュや隣接メモリの破損を招くおそれがあります (データの漏えいはなし)。aws-lc-rs の StreamingDecryptingKey API の cbc_pkcs7・ecb_pkcs7 にも同様の問題があり、less_safe_update は最大 1 ブロック (AES で 16 バイト) 先まで書き込み得ます。1 回の呼び出しでの復号、パディングなしの復号、CTR・CFB・GCM は影響せず、AWS サービスの利用者は対応不要です。続く 2026-197-AWS の CVE-2026-134069 は、2026-09-09 より前に公開された AWS 提供の Windows Server AMI 上の Amazon SSM Agent (3.3.5226.0 未満) で、同じ AMI から起動したインスタンスが 1 つのインスタンス登録キーを共有しており、Default Host Management Configuration で管理されるインスタンスでは管理者権限のないローカルユーザーがそのロールの認証情報を取得できるおそれがあるというもので、これらの AMI から起動したインスタンスはエージェントをインプレースでアップグレードしても影響が残ります。AWS WAF は、ウェブ ACL・ルール・ルールグループのサブスクリプション・キャパシティ階層ごとの課金をやめ、保護するリソース・検査するトラフィック・適用する保護レベルの 3 軸で課金する簡素化された料金を導入し、既存の利用者は 2027 年 2 月 1 日に新料金へ移行します。あわせて、API Gateway・ALB・CloudFront の背後にある LLM・MCP・A2A のエンドポイントを API Gateway API Portal で自動検出し、Amazon Bedrock Guardrails を使って AWS WAF で保護する機能が一般提供となり、セキュリティブログでも API と AI のセキュリティを発見から保護まで解説しています。ID では、AWS Sign-In で IAM ユーザー・ロールごとに OAuth のサインインセッションを最長 90 日まで保てるようになり (静的アクセスキーより安全な代替として開発者や AI エージェントの長時間ワークフロー向け)、IAM ロールの背後にいるユーザーやワークロードの ID を各リクエストに載せて認可・監査に使える trusted identity propagation、Amazon Cognito のポイントインタイムリカバリーも紹介されました。Amazon Bedrock は、モデル提供者のプログラムを見つけて申請・登録できる Trusted Access API を公開し、最初の 2 つとして Anthropic の Enterprise Frontier Safeguards (EFS) と Enterprise Data Controls (EDC) をパブリックプレビューで提供しています (Claude Fable モデル利用時のデータ管理)。インフラでは、Aurora Serverless for MySQL の上限が 256 ACU から 384 ACU (メモリ最大 768 GiB) に、NVIDIA RTX PRO 4500 Blackwell を積む EC2 G7 の metal サイズが一般提供 (G6 比で AI 推論最大 4.6 倍)、X8i のアジアパシフィック (ニュージーランド) 提供、CloudFront のカスタムオリジン・VPC オリジンへの HTTP/2 接続、CloudFront の AWS European Sovereign Cloud 提供、Global Accelerator の TLS リスナー付き NLB でのクライアント IP 保持、AgentCore runtime instances の GovCloud (US-West) 提供 (セッション最長 14 日)、HyperPod の Slurm クラスター向けマネージド拡張 (可観測性・ユーザー管理) が発表されました。Amazon Connect Customer は自動評価の対象を 45 言語追加し、評価用 AI モデルのバージョンアップを切り替え前に試す機能と、リアルタイムダッシュボードからの強制ログアウトを加え、Partner Central には自然言語で答える Partner Central Agents と S3 へ毎日データを届ける Data Subscriptions が加わりました。日本語ブログでは、NEC の開発チームが Kiro を使い着手から 5 週間で本番デプロイまで進めた全社利用システムの開発、半導体設計者向けリファレンスアーキテクチャ日本版 (解釈・実行・基盤の 3 構成)、チャネルコーポレーションが約 16.8 億件・1.8 TB の User テーブルからバッジ機能を分離し移行時間を 128 時間から 5.5〜6 時間に縮めコストを 36% 削減した DynamoDB 事例、AgentCore 上のエージェントが SAP の agent gateway 経由で Joule エージェントを呼び出す A2A による AWS と SAP の相互運用が紹介されています。 後から追加された分では、Amazon API Gateway の新機能 API Portal が正式に発表され、AWS 側のトラフィックログとサービスの設定記録から API Gateway・ALB・CloudFront の背後にある API と AI エンドポイント (MCP サーバー、A2A サーバー、LLM エンドポイント) の台帳を継続的に作り、見つけた API はまずシャドー API として扱い、管理対象にした API についてはトラフィックが途絶えたものやオーナーがいなくなったものを示し、認証・スロットリング・AWS WAF 保護などのベストプラクティスに照らしてセキュリティ態勢を評価し、社内チームや外部パートナー向けのドキュメントポータルに公開できます。Amazon OpenSearch Service は OpenSearch 3.9 に対応し、16 ビットの half-float ベクトル型と bf16 エンコーダー、2 ビット・4 ビットのスカラー量子化、Base64 エンコードでのベクトル取り込み、再設計されたグラフ探索による radial search の改善、Search Relevance Workbench の LLM-as-a-Judge の Bedrock などへの対応、モデル予測とエージェント実行の gRPC ストリーミングが加わりました。Amazon RDS Database Preview Environment では PostgreSQL 19.0 が試せるようになり、CONCURRENTLY オプション付きの REPACK コマンド、並列 autovacuum、論理レプリケーションでのシーケンス値の同期、プランナーを誘導する拡張 pg_plan_advice と pg_stash_advice が使えます (プレビュー環境のクラスターは最長 60 日で自動削除され、スナップショットは本番環境にコピーできません)。日本語ブログでは、何日も開いたままのセッションでもメモリが増え続けなくなり、ダウンロードの縮小と起動の高速化も図られた Kiro CLI の改善、10 月 27・28 日に幕張メッセで開かれた地方自治情報化推進フェア 2026 の AWS 出展報告 (協賛パートナー 11 社、奈良市 CIO によるガバメントクラウドでの生成 AI 活用の講演)、11/16 週の週刊 AWS (S3 Vectors のハイブリッド検索、Bedrock での OpenAI GPT-6.2 Astra・GPT-6.2 Sol の一般提供、AgentCore ランタイムインスタンスの privileged mode、FSx for NetApp ONTAP の最大 3.6 倍の性能の新世代ファイルシステムなど) と週刊生成 AI with AWS (BTM のログ分析エージェントの AgentCore での作り直し、Kiro for VS Code の一般提供、AgentCore の Web 検索 5,000 件無料枠、Amazon Polly の音声クローンなど) が公開されています。 さらに後から、SageMaker HyperPod の耐障害性の強化がまとめて発表されました。Slurm クラスターで AMI の自動パッチ適用が始まり、EKS で推論ワークロードを動かすクラスター向けの新しいパッチ適用戦略も加わったほか (従来の EKS の自動パッチはノードがアイドルになるのを待つため、推論ノードに更新が届きにくかった)、Slurm クラスターでは NCCL のタイムアウトやデータパイプラインの停滞、デッドロックで進まなくなった学習ジョブを出力・GPU の稼働状況や利用者定義のログパターンから数分で検知してジョブキューに戻し、EKS クラスターでは新しい Kubernetes Resource Monitoring Agent がクラッシュループするデバイスプラグインや欠けた DaemonSet など学習を妨げる問題を検知し、Megatron-LM のワークロードをインスタンス単体と EFA 経由の複数インスタンスで学習させて正しく計算できるかを確かめる深いヘルスチェック MultiNodeTrainingValidation も使えるようになりました。Amazon RDS for SQL Server は 1 インスタンスあたりのデータベース数の上限を 100 から 500 に引き上げ (4 vCPU 以上の xlarge 以上で、バースト可能なクラスを除く)、SaaS やマルチテナントの集約に向きます。AWS Quick は Snowflake と Databricks で three-legged OAuth (3LO) に対応し、Chat・ダッシュボード・Apps のクエリを利用者本人の ID で実行して Snowflake や Databricks Unity Catalog の行・列レベルの制御をそのまま適用できるようになり、既存のデータセットもビジュアルなデータ準備の新しい基盤で開いてデータセットの説明・列の説明・カスタム指示を加え、意味付けの前後で AI の回答精度を比べられるようになりました。
