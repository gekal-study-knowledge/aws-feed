    "title": "CVE-2026-122266 - Improper isolation of shared resources in aws-network-policy-agent in Amazon EKS"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-170-aws/"
    "published": "2026-11-05 06:53:42"
    "fetched": "2026-11-05 09:05:26"
    "summary": "<p><b>Bulletin ID:</b> 2026-170-AWS<br /> <b>Publication Date:</b> 11/04/2026 13:30 PM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-122266, an issue in Amazon EKS Network Policy Agent (aws-network-policy-agent). Improper isolation of shared eBPF connection tracking state might allow an authenticated adjacent user to bypass NetworkPolicy ingress enforcement on co-located pods.</p> \n<p><b>Impacted versions:</b><br /> - aws-network-policy-agent &lt; 1.3.7<br /> - Amazon VPC CNI Managed Add-on &lt; 1.22.3</p> \n<p><b>Refer to the article below for the most up-to-date and complete information.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-170-aws/\">Read this article</a></p>"
  "8c629ad95a8a3a3945058b4b6d7b6f40":
    "id": "8c629ad95a8a3a3945058b4b6d7b6f40"
    "title": "CVE-2026-122192 - Guest Access to Firecracker Process Memory After a Failed Memory Discard"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-169-aws/"
    "published": "2026-11-05 04:40:33"
    "fetched": "2026-11-05 09:05:26"
    "summary": "<p><b>Bulletin ID:</b> 2026-169-AWS<br /> <b>Publication Date:</b> 11/04/2026 11:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-122192, an issue in Firecracker v0.23.0 through v1.16.1 that, under certain host memory conditions, can let a root user in a guest read or modify memory of the Firecracker process. It affects VMs restored from a snapshot using the File memory backend with a balloon or virtio-mem device.</p> \n<p><b>Impacted versions:</b> Firecracker v0.23.0 through v1.16.1, inclusive.</p> \n<p><b>Refer to the article below for the most up-to-date and complete information.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-169-aws/\">Read this article</a></p>"
