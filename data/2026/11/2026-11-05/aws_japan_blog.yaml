  "e5e8db2d20ae0af47fbf9e77841ef794":
    "id": "e5e8db2d20ae0af47fbf9e77841ef794"
    "title": "クレジットプーリングで Kiro のクレジットをチーム全体で共有する"
    "link": "https://aws.amazon.com/jp/blogs/news/credit-pooling/"
    "published": "2026-11-05 17:03:25"
    "fetched": "2026-11-06 07:29:42"
    "summary": "Kiro Enterprise で、チーム全体の Kiro クレジットを 1 つの共有プールにまとめて使える「クレジットプーリング」が提供開始されました。パワーユーザーはライトユーザーの余剰クレジットを使えるため、無駄を減らせます。管理者は個人・グループ・プロファイルの各レベルで利用上限やしきい値アラートを設定でき、請求は AWS アカウント経由で行われます。"
"last_updated": "2026-11-06 07:29:42 JST"
