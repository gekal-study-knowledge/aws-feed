  "0b38603699f39634e37e3c4c13f62d6e":
    "id": "0b38603699f39634e37e3c4c13f62d6e"
    "title": "AWS announces AWS Interconnect - last mile preview with Equinix"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/interconnect-last-mile-preview-equinix/"
    "published": "2026-11-05 02:00:00"
    "fetched": "2026-11-05 03:24:15"
    "summary": "<p>AWS Interconnect - last mile is now available in preview with Equinix. You can connect your infrastructure across Equinix's global network of 282 data centers worldwide to AWS in a few clicks.</p> \n<p>Interconnect - last mile gives you managed, private, and resilient connections to AWS, so you don't have to order cross-connects or configure routers. To set up in the AWS Management Console, choose an AWS Region, a bandwidth speed, a Direct Connect gateway, and your Equinix Fabric One project ID. AWS generates an activation key, which you enter in the Equinix Fabric One portal to complete the setup. You can also initiate the connection from the Equinix Fabric One portal. AWS and Equinix set up quad-redundant capacity in advance, across two locations and four separate links, with BGP peering, VLANs and ASNs configured for you. Every connection is built for maximum resilience and comes with a 99.99% availability SLA. Traffic between AWS and Equinix edge devices is encrypted with MACsec by default.</p> \n<p>During the preview, you can order 1 Gbps Interconnect - last mile connections at no charge to the US West (N. California) Region through the San Jose metro and to the US East (N. Virginia) Region through the Northern Virginia metro. When Interconnect - last mile with Equinix becomes generally available, you'll be able to scale bandwidth from 1 Gbps to 100 Gbps in the console. You can create connections using the console, the AWS CLI, or the API. Partners can integrate using the open API package on <a href=\"https://github.com/aws/Interconnect\">GitHub</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/interconnect/\">AWS Interconnect - last mile documentation</a>.</p>"
  "024a633afb1113462563db82b2a504fb":
    "id": "024a633afb1113462563db82b2a504fb"
    "title": "Amazon ECS Managed Daemons can now collect json-file logs from application containers on Amazon ECS Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ecs-managed-instances-json-file-log-driver/"
    "published": "2026-11-05 06:29:00"
    "fetched": "2026-11-05 09:05:25"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) introduces json-file log driver support for Amazon ECS Managed Instances and log driver volumes for Amazon ECS Managed Daemons. Together, these features let you collect application logs with the observability agent of your choice and forward them to any destination you choose.<br /> <br /> With this launch, your application containers on ECS Managed Instances can write their logs as local files in standard Docker json-file format, which most observability agents read natively. Your managed daemons can directly read these files through a volume mount, without specifying host bind mount paths or requiring root privileges. As a result, one managed daemon on each instance can collect logs from every application container that uses the json-file log driver. Amazon ECS keeps each container's logs in a dedicated directory named with the container ID and retains them until the container is removed, so your managed daemon can use native file-based log collection and trace every log back to the container that produced it.<br /> <br /> To get started, set the log driver to json-file in the logConfiguration of your application task definition. Next, register a daemon task definition that specifies a volume with logDriverVolumeConfiguration, and mount the volume into your daemon container using mountPoints. You can configure this using the AWS Management Console, AWS CLI, API, AWS SDKs or AWS CloudFormation. This feature is available in all commercial AWS Regions where Amazon ECS Managed Instances and Managed Daemons are available, at no additional cost. To learn more, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-daemons-task-definitions.html#managed-daemons-volumes\">documentation</a> page and visit <a href=\"https://aws.amazon.com/ecs/managed-instances/\">Amazon ECS Managed Instances</a>.</p>"
  "a2ccdd1cb99942c5dfd7955e5261f811":
    "id": "a2ccdd1cb99942c5dfd7955e5261f811"
    "title": "Amazon DocumentDB (with MongoDB compatibility) is now available in the Asia Pacific (Taipei) and Asia Pacific (New Zealand) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-documentdb-mongodb-compatibility-asia-pacific-taipei-new-zealand-regions/"
    "published": "2026-11-05 04:00:00"
    "fetched": "2026-11-05 09:05:25"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) is now available in the Asia Pacific (Taipei) and Asia Pacific (New Zealand) Regions, adding to the <a>list of </a><a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">available Regions</a> where you can use Amazon DocumentDB.</p> \n<p>Amazon DocumentDB is a fully managed, native JSON database that makes it simple and cost-effective to operate critical document workloads at virtually any scale without managing infrastructure. Amazon DocumentDB is designed to give you the scalability and durability you need when operating mission-critical MongoDB workloads. Storage scales automatically up to 128 TiB without any impact to your application. In addition, Amazon DocumentDB natively integrates with Amazon CloudWatch, AWS CloudTrail, AWS Lambda, AWS Backup, and more. Amazon DocumentDB supports millions of requests per second and can be scaled out to 15 low-latency read replicas in minutes with no application downtime.</p> \n<p>To learn more about Amazon DocumentDB, please visit the <a>Amazon DocumentDB </a><a href=\"https://aws.amazon.com/documentdb/\">product page</a> and <a></a><a href=\"https://aws.amazon.com/documentdb/pricing/\">pricing page</a>. You can create an Amazon DocumentDB cluster from the <a></a><a href=\"https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-documentdb-mongodb-compatibility-asia-pacific-melbourne-region/#:~:text=AWS%20Management%20console\">AWS Management Console</a>, <a></a><a href=\"https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-documentdb-mongodb-compatibility-asia-pacific-melbourne-region/#:~:text=AWS%20Command%20Line%20Interface%20(CLI)\">AWS Command Line Interface (CLI)</a>, or AWS SDKs.</p>"
  "e2b4f2f9135c6f379c4473cddaeea97e":
    "id": "e2b4f2f9135c6f379c4473cddaeea97e"
    "title": "Amazon RDS for Oracle now supports copying option groups during cross-Region snapshot copy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-oracle-cross-region-snapshot-copy-option-group/"
    "published": "2026-11-05 03:40:00"
    "fetched": "2026-11-05 09:05:25"
    "summary": "<p>Amazon RDS for Oracle now lets you copy the option group associated with a DB snapshot when you copy that snapshot to another AWS Region.</p> \n<p>Amazon RDS for Oracle uses option groups to enable and configure features that make it simple to manage your databases. Option groups are specific to the AWS Region where you create them. Previously, customers wanting to replicate RDS backups that had option groups to a different AWS Region had to copy the snapshot without the option group and then recreate the option group in the target Region before restoring the snapshot. Now, you no longer need to separate the steps and can instead initiate the snapshot copy and specify the option group copy in the same request as the snapshot copy.</p> \n<p>The existing boolean parameter <b>CopyOptionGroup</b> on the <b>CopyDBSnapshot</b> API and CLI commands now also support cross-Region copy, along with cross-account copy. You can now copy options groups to the destination snapshot in the target AWS Region from the source snapshot by setting this parameter to <b>true</b>.</p> \n<p>This capability is available on Amazon RDS for Oracle in all commercial AWS Regions and the AWS GovCloud (US) Regions. To learn more, review the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CopyDBSnapshot.html\" target=\"_blank\">Amazon RDS API Documentation</a>.&nbsp;</p>"
  "a1630090d65bfa39ad738f051cd2cbef":
    "id": "a1630090d65bfa39ad738f051cd2cbef"
    "title": "Amazon Connect Customer now shows associated cases in contact records"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-cases-contact-records/"
    "published": "2026-11-05 02:00:00"
    "fetched": "2026-11-05 09:05:25"
    "summary": "<p>Amazon Connect Customer now includes case IDs and reference numbers in contact records, helping supervisors and analysts understand which customer issues drive contact volume. Cases track issues, such as refund requests or billing disputes, across interactions and teams. Supervisors can now identify the cases associated with an interaction directly on the Contact Details page without searching individual cases. Analysts can access the same information through the DescribeContact API and contact event streams to measure the number of interactions per case.</p> \n<p>Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\" target=\"_blank\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases.html\" target=\"_blank\">documentation</a>.</p>"
  "eb16fa73671d1451fac66b8c3da0d0bf":
    "id": "eb16fa73671d1451fac66b8c3da0d0bf"
    "title": "Amazon RDS for Oracle now supports Kerberos authentication with self-managed Active Directory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/rds-oracle-kerberos-self-managed-ad/"
    "published": "2026-11-05 19:30:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Amazon Relational Database Service (Amazon RDS) for Oracle (<a href=\"https://aws.amazon.com/rds/oracle/\">Amazon Relational Database Service (Amazon RDS) for Oracle</a>) now allows customers to join their RDS for Oracle DB instances directly to their self-managed Microsoft Active Directory (AD) domain. Your self-managed AD can run on premises, on Amazon EC2, or with another cloud provider. Users in your AD domain can authenticate to RDS for Oracle DB instances using Kerberos.</p> \n<p>Previously, in order to use Kerberos authentication with self-managed AD for their RDS for Oracle instances, customers were required to deploy AWS Managed Microsoft AD and establish trust between AWS managed domain and self-managed domain. Now, customers can join their existing self-managed AD directly to authenticate and authorize users without setting up an additional directory or trust relationship. You can set this up using the AWS Management Console, AWS CLI, or AWS SDK. You can use self-managed AD without any additional charge.</p> \n<p>Kerberos authentication with self-managed Active Directory in Amazon RDS for Oracle is available in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all commercial AWS Regions</a> where Amazon RDS for Oracle is available. To learn more about Kerberos authentication with self-managed Active Directory, visit <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/oracle-smad.html\" rel=\"noopener noreferrer\" target=\"_blank\">Working with self-managed Active Directory with an Amazon RDS for Oracle DB instance</a> in the Amazon RDS User Guide.</p>"
  "bba0e705a1fb985d885484b7e6dd1982":
    "id": "bba0e705a1fb985d885484b7e6dd1982"
    "title": "AWS Security Hub Network Scanning now available in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-network-scanning-govcloud/"
    "published": "2026-11-05 18:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>AWS Security Hub Network Scanning feature is now supported in AWS GovCloud (US).</p> \n<p>Network Scanning probes your resources from the internet to detect actual reachability, not just what could be reachable based on security group rules and route tables. It discovers public IP addresses, virtual machines, and load balancers across your AWS environments, identifies reachable ports, and determines what services are running behind them. This complements Security Hub's existing network reachability findings, which identify configurations that could make a resource reachable from the internet. Network Scanning confirms that configurations do exist which make a resource reachable from the internet. Each reachable port generates a Security Hub finding with evidence of the port and service discovered. Security Hub Exposures then automatically correlates these findings with other findings and resource configurations to determine broader risk.</p> \n<p>Existing customers can enable Network Scanning in individual accounts and regions, or across an organization via a configuration policy. For new Security Hub customers, Network Scanning is on by default. Network Scanning is included with Security Hub Essentials at no additional cost in all AWS commercial and GovCloud (US) Regions that support Security Hub. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-network-scanning.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "5f60e43d9a536181783266838f6137b4":
    "id": "5f60e43d9a536181783266838f6137b4"
    "title": "Amazon SageMaker AI Studio Now Supports IAM Identity Center Multi-Region Replication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-sagemaker-ai-studio-iam/"
    "published": "2026-11-05 17:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Amazon SageMaker AI now supports IAM Identity Center (IdC) multi-region replication, enabling you to deploy SageMaker AI Studio domains in different regions from your IdC instance's primary region. Previously, the primary IdC instance had to reside in the same region as the SageMaker AI Studio domain; now customers can replicate their primary IdC instance into the region where they wish to use SageMaker AI Studio domains. This capability helps customers maintain compliance while utilizing centralized workforce identity management.</p> \n<p>As an Amazon SageMaker AI Studio administrator, you can deploy SageMaker AI domains that align with your workforce's location and data residency requirements, independent of where your primary IdC instance is set up. Organizations can retain their primary IdC instance in one region while operating SageMaker AI Studio workloads in compliance-mandated regions, support global operations through centralized identity management, and satisfy data sovereignty requirements without compromising single sign-on (SSO) capabilities.</p> \n<p>To get started see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-custom.html\">SageMaker AI documentation</a> and to learn about setting up IAM Identity Center multi-region support see the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\">IAM Identity Center User Guide</a>.</p> \n<p>Multi-region IdC replication is available in all standard <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon SageMaker AI Studio is supported, including: Asia Pacific (Tokyo), Europe (Ireland), US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), South America (São Paulo), Asia Pacific (Seoul), Europe (London), Asia Pacific (Singapore), Asia Pacific (Sydney), Canada (Central), Asia Pacific (Mumbai), Europe (Paris), Europe (Stockholm).</p>"
  "6c5f916bbdae3c4c948a96abc8c87bfd":
    "id": "6c5f916bbdae3c4c948a96abc8c87bfd"
    "title": "AWS WAF AI traffic monetization now supports fiat payouts through Stripe"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-waf-stripe-fiat-payouts/"
    "published": "2026-11-05 17:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>AWS WAF AI traffic monetization now integrates with Stripe. Publishers, content owners, and API providers can collect stablecoin payments from AI bots and agents that settle in local currency directly to their Stripe balance. With this launch, customers can monetize agent access without holding stablecoins or managing a crypto wallet. Stripe is now available as a new payout method alongside existing stablecoin payouts.</p> \n<p>To get started, connect your Stripe account to AWS WAF through Stripe Connect in the AWS WAF console. Your existing pricing and agent policies work unchanged. When an agent requests protected content, AWS WAF returns an HTTP 402 response with the valid payment credential types that it accepts. Once the agent returns with a valid payment credential and makes the request again, the content is returned ungated. Revenue from all payment providers appears in the AWS WAF console revenue analytics.</p> \n<p>The Stripe integration is available at no additional charge to all AWS WAF customers using Amazon CloudFront, in all edge locations where AWS WAF web ACLs are associated with CloudFront distributions. Standard AWS WAF and Stripe processing fees apply. See <a href=\"https://aws.amazon.com/waf/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF pricing</a> for details.</p> \n<p>To get started, visit the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF console</a> or explore the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-ai-traffic-monetization-getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF Developer Guide</a>.</p>"
  "1a4d2cc601d77ef34adc56c6d9835bad":
    "id": "1a4d2cc601d77ef34adc56c6d9835bad"
    "title": "\uFEFF\uFEFFAWS Systems Manager Parameter Store now allows organization and validation with built-in data types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-ssm-parameter-store-allows-organization-validation-with-new-data-types/"
    "published": "2026-11-05 14:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>AWS Systems Manager Parameter Store now supports 13 new parameter data types that automatically validate parameter values when you create or update a parameter. With built-in validation, you can stop malformed configuration values, such as an invalid IP address, AWS account ID, or JSON document, before your applications read them, without writing your own validation logic.&nbsp;These types allow you to better organize your parameters across your workloads. You can filter by type when calling the DescribeParameters API or when browsing parameters in the Parameter Store console.<br /> <br /> The following data types are available for both standard and advanced parameters:&nbsp; aws:region, aws:account:id, boolean, integer, float, binary, hostname, email, ipv4-address, and ipv6-address. Three more data types, url, json, and jsonc, are available for advanced parameters. Parameter Store checks the value when you call PutParameter and rejects any value that doesn't match its data type. New data types work with String and SecureString parameters, and several also support StringList parameters, where each item in the list is validated. You can combine a data type with an AllowedPattern for additional constraints, and you can change the data type of an existing text parameter.</p>"
  "b2a89c0661ba694155ba824f796dfb1e":
    "id": "b2a89c0661ba694155ba824f796dfb1e"
    "title": "Amazon MWAA now supports cost allocation tags"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-mwaa-cost-allocation-tags/"
    "published": "2026-11-05 08:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (Amazon MWAA) now supports <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html\" target=\"_blank\">cost allocation tags</a>. Tags you apply to an Amazon MWAA environment now propagate to the compute that runs it, including workers, schedulers, and web servers. You can then track Amazon MWAA spend by tag in AWS Cost Explorer and AWS Cost and Usage Reports.</p>\n<p>With this launch, platform teams can show back or charge back Airflow costs to the team, project, or cost center that owns each environment. You can use cost allocation tags when you create a new environment or update an existing one. To get started, tag your environment using the Amazon MWAA console, AWS CLI, or Amazon MWAA API, then activate the tag key as a cost allocation tag in the AWS Billing and Cost Management console.</p>\n<p>This feature is available in all AWS Regions where Amazon MWAA is available. For more information, see the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/get-started.html#regions\" target=\"_blank\">AWS Region table</a>. To learn more, visit <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/cost-allocation-tags.html\" target=\"_blank\">Cost allocation tags in Amazon MWAA</a> in the Amazon MWAA User Guide.</p>"
"last_updated": "2026-11-06 07:29:42 JST"
