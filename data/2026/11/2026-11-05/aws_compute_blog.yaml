    "summary": "Amazon EC2 Capacity Manager offers real-time supportability checks and capacity fulfillment metrics for large EC2 fleets. This post shows how to measure how well your instance type and Availability Zone flexibility performs, find where capacity is strongest before a scale-up, and add it to Auto Scaling groups, Amazon EC2 Fleet, or Karpenter."
