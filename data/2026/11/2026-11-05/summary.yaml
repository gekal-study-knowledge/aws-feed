"overview": |
  この日はセキュリティ速報と ID・認証まわりの強化、データ基盤の移行支援が中心でした。セキュリティ速報は 2 件で、Firecracker v0.23.0〜v1.16.1 でメモリ破棄の失敗後にゲストがプロセスメモリへアクセスできる CVE-2026-122192 と、EKS の aws-network-policy-agent における共有リソースの分離不備 CVE-2026-122266 です。認証では AWS Sign-In が OAuth 2.0 Token Exchange (RFC 8693) に対応し、サードパーティの OIDC トークンを短命な AWS サービス向けアクセストークンに交換できるようになりました。RDS for Oracle は自己管理 Active Directory での Kerberos 認証と、クロスリージョンのスナップショットコピー時のオプショングループ複製に対応し、EC2 は IMDSv1 が有効なインスタンスを把握できる ImdsV1Enabled メトリクスを公開しました。データでは S3 Tables が Glue Data Catalog 上の Hive テーブルから Iceberg へのマネージド移行に対応しています。ほかに Equinix との AWS Interconnect - last mile プレビュー (282 データセンター)、Parameter Store の 13 種類の組み込みデータ型、DocumentDB の台北・ニュージーランド提供、MWAA のコスト配分タグ、Lambda durable functions のクォータ引き上げ、コンソールの Amazon Q Developer の「AWS assistant」への改称がありました。AI 関連では Amazon Quick の Smart Approvals、Kiro Enterprise のクレジットプーリング、トヨタの BasisPilot 事例が紹介されています。
