"overview": |
  この日はセキュリティ速報が 2 件公開された。CVE-2026-122192 は Firecracker v0.23.0 から v1.16.1 で、特定のホストメモリ条件下でメモリの破棄に失敗した後にゲストが Firecracker プロセスのメモリにアクセスできる問題、CVE-2026-122266 は Amazon EKS の Network Policy Agent (aws-network-policy-agent) における共有リソースの不適切な分離の問題。前日に発表された Amazon S3 Tables の Apache Hive から Apache Iceberg へのマネージド移行は、AWS News Blog と AWS Japan Blog でも詳しく紹介され、AWS Glue Data Catalog に登録された Parquet 形式の Hive テーブルを、パイプライン構築やコンピューティングのプロビジョニングなしに本番ワークロードを動かしたまま移行でき、料金はコピーしたデータ分のみとされた。AWS Interconnect - last mile が Equinix とのプレビューとして提供され、Equinix の世界 282 のデータセンターから数クリックで AWS に接続できるようになった。Amazon DocumentDB (MongoDB 互換) はアジアパシフィック (台北) とアジアパシフィック (ニュージーランド) リージョンで利用可能になり、Amazon RDS for Oracle はクロスリージョンのスナップショットコピー時にオプショングループもコピーできるようになった。Amazon ECS では、Managed Instances で json-file ログドライバーが、Managed Daemons でログドライバーボリュームがサポートされ、デーモンがアプリケーションコンテナのログを収集できるようになった。Amazon Connect Customer の問い合わせレコードにはケース ID と参照番号が含まれるようになった。AWS Machine Learning Blog は 5 本で、U Mobile が Bedrock AgentCore で構築したエージェント型通信運用基盤 AiDaH、Indegene のライフサイエンス向け LLM データ品質エージェント、Deep Insight による本番 AI エージェントの 4 層のコンテキストエンジニアリング、Amazon Quick の Smart Approvals による人間の承認の絞り込み、AgentCore Evaluations で Jev と Strands Decider の決定モデルを使う評価を扱った。AWS Compute Blog では EC2 Capacity Manager でインスタンスタイプとアベイラビリティーゾーンの柔軟性を計測する方法と、別々の AWS Outposts 上の RDS for PostgreSQL 間で論理レプリケーションを構成する手順が紹介され、AWS Japan Blog では Toyota Motor North America が 20 の SAP システムと 60 台以上の EC2 ホストを対象に AI アシスト型 SAP 運用基盤 BasisPilot を構築した事例が出た。
