"overview": |
  この日はセキュリティ速報が 2 件公開された。CVE-2026-122192 は Firecracker v0.23.0 から v1.16.1 で、特定のホストメモリ条件下でメモリの破棄に失敗した後にゲストが Firecracker プロセスのメモリにアクセスできる問題、CVE-2026-122266 は Amazon EKS の Network Policy Agent (aws-network-policy-agent) における共有リソースの不適切な分離の問題。前日に発表された Amazon S3 Tables の Apache Hive から Apache Iceberg へのマネージド移行は、AWS News Blog と AWS Japan Blog でも詳しく紹介され、AWS Glue Data Catalog に登録された Parquet 形式の Hive テーブルを、パイプライン構築やコンピューティングのプロビジョニングなしに本番ワークロードを動かしたまま移行でき、料金はコピーしたデータ分のみとされた。AWS Interconnect - last mile が Equinix とのプレビューとして提供され、Equinix の世界 282 のデータセンターから数クリックで AWS に接続できるようになった。Amazon DocumentDB (MongoDB 互換) はアジアパシフィック (台北) とアジアパシフィック (ニュージーランド) リージョンで利用可能になり、Amazon RDS for Oracle はクロスリージョンのスナップショットコピー時にオプショングループもコピーできるようになった。Amazon ECS では、Managed Instances で json-file ログドライバーが、Managed Daemons でログドライバーボリュームがサポートされ、デーモンがアプリケーションコンテナのログを収集できるようになった。Amazon Connect Customer の問い合わせレコードにはケース ID と参照番号が含まれるようになった。AWS Machine Learning Blog は 5 本で、U Mobile が Bedrock AgentCore で構築したエージェント型通信運用基盤 AiDaH、Indegene のライフサイエンス向け LLM データ品質エージェント、Deep Insight による本番 AI エージェントの 4 層のコンテキストエンジニアリング、Amazon Quick の Smart Approvals による人間の承認の絞り込み、AgentCore Evaluations で Jev と Strands Decider の決定モデルを使う評価を扱った。AWS Compute Blog では EC2 Capacity Manager でインスタンスタイプとアベイラビリティーゾーンの柔軟性を計測する方法と、別々の AWS Outposts 上の RDS for PostgreSQL 間で論理レプリケーションを構成する手順が紹介され、AWS Japan Blog では Toyota Motor North America が 20 の SAP システムと 60 台以上の EC2 ホストを対象に AI アシスト型 SAP 運用基盤 BasisPilot を構築した事例が出た。このほか Amazon RDS for Oracle が、オンプレミス・Amazon EC2・他クラウドで動くセルフマネージドの Microsoft Active Directory ドメインへ直接参加できるようになり、AWS Managed Microsoft AD を立てて信頼関係を結ばなくても Kerberos 認証が使えるようになった。AWS Security Hub の Network Scanning が AWS GovCloud (US) に対応し、セキュリティグループやルートテーブルから到達可能性を推測するのではなく、インターネット側から実際に到達できるかを検査して公開 IP アドレス・仮想マシン・ロードバランサーと到達可能なポート、その背後で動くサービスを特定する。Amazon SageMaker AI Studio は IAM Identity Center のマルチリージョンレプリケーションに対応し、IdC インスタンスのプライマリリージョン以外のリージョンにもドメインを配置できるようになった。AWS WAF の AI トラフィック収益化は Stripe Connect 経由の法定通貨での受け取りに対応し、ステーブルコインや暗号ウォレットを保有せずにエージェントからのアクセスを収益化できるようになった。AWS Systems Manager Parameter Store は 13 の新しいパラメータデータ型を追加し、IP アドレスや AWS アカウント ID、JSON などの不正な値を作成・更新時に自動で検証できるようになり、Amazon MWAA はコスト割り当てタグに対応してワーカー・スケジューラー・ウェブサーバーまでタグが伝播するようになった。ブログでは Serverless ICYMI Q3 2026 (34 回目の四半期まとめ) に加え、日本語で dSPACE と AWS による車載ソフト開発のクラウドネイティブ化 (dSPACE Japan User Conference 2026 での発表) と、Kiro Enterprise のクレジットプーリングでチーム全体のクレジットを 1 つの共有プールにまとめる記事が出た。後から追加された発表として、AWS Lambda durable functions のデフォルトクォータが引き上げられ、アカウントあたりの実行中の durable execution 数が 100 万から 500 万に、durable execution を開始する関数呼び出しレートが毎秒 300 から 3,000 リクエストに、CheckpointDurableExecution と GetDurableExecutionState が毎秒 1,000 から 10,000 リクエストになるなど各 API のレートが 10 倍になった (米国東部 (バージニア北部)・米国西部 (オレゴン)・欧州 (アイルランド) はさらにその 2 倍)。AWS マネジメントコンソールとコンソールモバイルアプリの Amazon Q Developer は「AWS assistant」に名称が変わり、現時点では無料で提供され、既存の Amazon Q Developer Pro の契約者は Pro Tier の機能をそのまま引き継ぐ。AWS CodeConnections は AWS GovCloud (US-East) に続いて AWS GovCloud (US-West) リージョンでも利用可能になった。
