    "title": "Accelerating product development with AI-driven lifecycle management (AI-PDLC) in AWS Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerating-product-development-with-ai-driven-lifecycle-management-ai-pdlc-in-aws-quick/"
    "published": "2026-11-12 01:05:33"
    "fetched": "2026-11-12 03:19:04"
    "summary": "Learn how to build an AI-driven product development lifecycle (AI-PDLC) with a suite of six AWS Quick agents that take you from scattered customer signals to a validated prototype across Discover, Decide, Design, and Prototype, with human approval at every gate and a specification ready to hand to coding agents like Kiro."
  "f14d44165415c2893023db4b4a1da1ce":
    "id": "f14d44165415c2893023db4b4a1da1ce"
    "title": "UAEF: A framework-agnostic system for closed-loop evaluation of AI agents"
    "link": "https://aws.amazon.com/blogs/machine-learning/uaef-a-framework-agnostic-system-for-closed-loop-evaluation-of-ai-agents/"
    "published": "2026-11-12 00:50:55"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The Universal Agent Evaluation Framework (UAEF) is a framework-agnostic system for evaluating AI agents. UAEF converts each framework's traces into one canonical format, scores them with 36 built-in metrics across 7 dimensions, and stores results so teams can compare agent versions and catch regressions."
  "eedc6b5d1b13f1d1573c8b1ff01622cb":
    "id": "eedc6b5d1b13f1d1573c8b1ff01622cb"
    "title": "Introducing usage-based pricing for Amazon SageMaker AI bidirectional streaming"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-usage-based-pricing-for-amazon-sagemaker-ai-bidirectional-streaming/"
    "published": "2026-11-12 00:10:23"
    "fetched": "2026-11-12 03:19:04"
    "summary": "AWS Marketplace now supports usage-based metering for Amazon SageMaker bidirectional streaming inference, so model providers can charge for what customers actually consume during a live stream. Deepgram is the launch partner, bringing usage-based speech-to-text and text-to-speech billing to AWS Marketplace."
