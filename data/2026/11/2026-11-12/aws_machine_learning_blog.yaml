"entries":
  "ff992e7fb8d5e5b6f5793813477d53e6":
    "id": "ff992e7fb8d5e5b6f5793813477d53e6"
    "title": "Accelerating product development with AI-driven lifecycle management (AI-PDLC) in AWS Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerating-product-development-with-ai-driven-lifecycle-management-ai-pdlc-in-aws-quick/"
    "published": "2026-11-12 01:05:33"
    "fetched": "2026-11-12 03:19:04"
    "summary": "Learn how to build an AI-driven product development lifecycle (AI-PDLC) with a suite of six AWS Quick agents that take you from scattered customer signals to a validated prototype across Discover, Decide, Design, and Prototype, with human approval at every gate and a specification ready to hand to coding agents like Kiro."
  "f14d44165415c2893023db4b4a1da1ce":
    "id": "f14d44165415c2893023db4b4a1da1ce"
    "title": "UAEF: A framework-agnostic system for closed-loop evaluation of AI agents"
    "link": "https://aws.amazon.com/blogs/machine-learning/uaef-a-framework-agnostic-system-for-closed-loop-evaluation-of-ai-agents/"
    "published": "2026-11-12 00:50:55"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The Universal Agent Evaluation Framework (UAEF) is a framework-agnostic system for evaluating AI agents. UAEF converts each framework's traces into one canonical format, scores them with 36 built-in metrics across 7 dimensions, and stores results so teams can compare agent versions and catch regressions."
  "eedc6b5d1b13f1d1573c8b1ff01622cb":
    "id": "eedc6b5d1b13f1d1573c8b1ff01622cb"
    "title": "Introducing usage-based pricing for Amazon SageMaker AI bidirectional streaming"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-usage-based-pricing-for-amazon-sagemaker-ai-bidirectional-streaming/"
    "published": "2026-11-12 00:10:23"
    "fetched": "2026-11-12 03:19:04"
    "summary": "AWS Marketplace now supports usage-based metering for Amazon SageMaker bidirectional streaming inference, so model providers can charge for what customers actually consume during a live stream. Deepgram is the launch partner, bringing usage-based speech-to-text and text-to-speech billing to AWS Marketplace."
  "09c32b3dee276413378566a96c9c8128":
    "id": "09c32b3dee276413378566a96c9c8128"
    "title": "OpenAI Codex on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/openai-codex-on-amazon-bedrock/"
    "published": "2026-11-12 08:35:47"
    "fetched": "2026-11-12 10:15:19"
    "summary": "A practical guide for enterprises rolling out OpenAI Codex to developers on AWS, with Amazon Bedrock as the model backend, covering the access, governance, and cost decisions that platform, security, and finance teams need to align on."
  "86aad7970327595c59f264a232f2e0e8":
    "id": "86aad7970327595c59f264a232f2e0e8"
    "title": "Semantic diffing of formal policies with anti-unification"
    "link": "https://aws.amazon.com/blogs/machine-learning/semantic-diffing-of-formal-policies-with-anti-unification/"
    "published": "2026-11-12 08:33:03"
    "fetched": "2026-11-12 10:15:19"
    "summary": "A textual diff of two formal policies flags every cosmetic change and hides the one that alters behavior. This post shows how to compute a symbolic, deterministic semantic diff with an open-source anti-unification engine, so reviewers see only the genuine disagreements between two candidate authorization policies."
  "083b4b1b67669a892cbcb399fda53dc0":
    "id": "083b4b1b67669a892cbcb399fda53dc0"
    "title": "Detecting and recovering from silent data corruption on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/detecting-and-recovering-from-silent-data-corruption-on-amazon-sagemaker-hyperpod/"
    "published": "2026-11-12 08:30:03"
    "fetched": "2026-11-12 10:15:19"
    "summary": "Silent data corruption is a GPU fault that returns wrong but plausible numbers with no error, quietly poisoning distributed training. This post adds three checks to a PyTorch DDP loop to detect it, localize the faulty node on Amazon SageMaker HyperPod, and hand the node to automatic recovery for replacement."
  "651d911c6b1602921cb969537caa22cf":
    "id": "651d911c6b1602921cb969537caa22cf"
    "title": "Introducing the Web Search API on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-the-web-search-api-on-amazon-bedrock-agentcore/"
    "published": "2026-11-12 08:13:16"
    "fetched": "2026-11-12 10:15:19"
    "summary": "Today we're announcing the Web Search API on Amazon Bedrock AgentCore: your own code can search the web with a single signed API call, with no gateway and no resources to create. Call it from the AWS SDKs or the AWS CLI and use it in applications, agent loops, and data pipelines."
  "209a9065ce934cceb1992d43af17852d":
    "id": "209a9065ce934cceb1992d43af17852d"
    "title": "ICYMI: What landed for AI builders in October 2026"
    "link": "https://aws.amazon.com/blogs/machine-learning/icymi-what-landed-for-ai-builders-in-october-2026/"
    "published": "2026-11-12 07:26:40"
    "fetched": "2026-11-12 10:15:19"
    "summary": "A recap of the major Amazon Bedrock, Amazon Bedrock AgentCore, and Strands updates from October 2026: new models to match each task, updates that keep agents available and grounded, and clearer cost reporting for AI builders."
  "0b040eb3fe6c8f1f397cbc57960fb81d":
    "id": "0b040eb3fe6c8f1f397cbc57960fb81d"
    "title": "The attendee’s guide to the AWS re:Invent 2026 AI/ML track"
    "link": "https://aws.amazon.com/blogs/machine-learning/the-attendees-guide-to-the-aws-reinvent-2026-ai-ml-track/"
    "published": "2026-11-12 06:05:59"
    "fetched": "2026-11-12 10:15:19"
    "summary": "AWS re:Invent 2026 includes more than 140 AI/ML track sessions. This attendee's guide helps you find the breakouts, chalk talks, workshops, and builders' sessions that fit your role and goals, spanning AI chips, models and inference, agents, agent trust, and sustainability, so you can build a smarter re:Invent schedule."
  "16f36c065ccd47eed01e3d603f8eb8e8":
    "id": "16f36c065ccd47eed01e3d603f8eb8e8"
    "title": "Automating AWS Agent Registry updates with push-based architecture"
    "link": "https://aws.amazon.com/blogs/machine-learning/automating-aws-agent-registry-updates-with-push-based-architecture/"
    "published": "2026-11-12 05:52:48"
    "fetched": "2026-11-12 10:15:19"
    "summary": "This post shows how to keep the AWS Agent Registry current automatically. Using AWS CloudTrail, Amazon EventBridge, AWS Lambda, and AgentCore Identity, an event-driven pipeline detects MCP server changes and pushes updated tool metadata to the registry with no stored secrets, across single- and multi-account environments."
  "b0b66fe4474334ce8918226a43185ebf":
    "id": "b0b66fe4474334ce8918226a43185ebf"
    "title": "How DXC Technology built a multi-model AI substrate on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-dxc-technology-built-a-multi-model-ai-substrate-on-amazon-bedrock/"
    "published": "2026-11-12 05:45:45"
    "fetched": "2026-11-12 10:15:19"
    "summary": "DXC Technology runs mission-critical managed IT services for regulated organizations across 70 countries. Learn how DXC built DCX OASIS, its Human+AI operating model, on a governed multi-model substrate in Amazon Bedrock, separating a resilient model substrate from a trusted harness that orchestrates, governs, and audits AI agents at scale."
  "a2911e73a74ea2e6ac532accea142916":
    "id": "a2911e73a74ea2e6ac532accea142916"
    "title": "Accelerating generative AI delivery with reusable assets"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerating-generative-ai-delivery-with-reusable-assets/"
    "published": "2026-11-12 04:19:21"
    "fetched": "2026-11-12 10:15:19"
    "summary": "Every generative AI team keeps rebuilding the same components: RAG pipelines, document processors, and agent scaffolding. This post shows how to access a curated catalog of 23 production-ready, open source reusable assets from the AWS Generative AI Innovation Center, with real delivery results from DoorDash, Lyft, and Ricoh."
  "3f2112338ac176deeac9d10c73acdc78":
    "id": "3f2112338ac176deeac9d10c73acdc78"
    "title": "Build autonomous AI agents with Amazon Bedrock and Spring AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-autonomous-ai-agents-with-amazon-bedrock-and-spring-ai/"
    "published": "2026-11-12 10:18:23"
    "fetched": "2026-11-12 18:12:07"
    "summary": "Learn how Java developers can build production-ready autonomous AI agents using Amazon Bedrock and Spring AI. This post walks through tool calling, conversation memory, resilience patterns, and multi-agent orchestration, then deploys the agent to AWS with Amazon Bedrock AgentCore."
"last_updated": "2026-11-12 18:12:07 JST"
