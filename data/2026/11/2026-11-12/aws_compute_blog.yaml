  "68aa56bd0356efb668a1f0ae718b1903":
    "id": "68aa56bd0356efb668a1f0ae718b1903"
    "title": "Monitor application health with Amazon EC2 application status checks"
    "link": "https://aws.amazon.com/blogs/compute/monitor-application-health-with-amazon-ec2-application-status-checks/"
    "published": "2026-11-12 00:48:19"
    "fetched": "2026-11-12 03:19:04"
    "summary": "Amazon EC2 application status checks detect application-layer failures with an HTTP or HTTPS health check, publish the result to Amazon CloudWatch, and let Amazon EC2 Auto Scaling replace impaired instances. Catch a stuck application without running a separate monitoring system."
  "66aec84c1aac900652a85ee421b90dd0":
    "id": "66aec84c1aac900652a85ee421b90dd0"
    "title": "Building a GPU workstation for visual effects with Amazon EC2: Part 5 – Security"
    "link": "https://aws.amazon.com/blogs/compute/building-a-gpu-workstation-for-visual-effects-with-amazon-ec2-part-5-security/"
    "published": "2026-11-12 00:27:23"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The final post in our GPU workstation series covers security for visual effects workstations on Amazon EC2: controlling who can reach the desktop, protecting the Amazon DCV session in transit, and safeguarding credentials, images, and storage, plus IAM, encryption, monitoring, and patch management best practices for production VFX environments."
  "40ea412d8540e42b9d25f844fd85f625":
    "id": "40ea412d8540e42b9d25f844fd85f625"
    "title": "Building a GPU workstation for visual effects with Amazon EC2: Part 4 – Optimizations"
    "link": "https://aws.amazon.com/blogs/compute/building-a-gpu-workstation-for-visual-effects-with-amazon-ec2-part-4-optimizations/"
    "published": "2026-11-12 00:27:19"
    "fetched": "2026-11-12 03:19:04"
    "summary": "Part 4 of our series on building GPU workstations for visual effects on Amazon EC2. This post covers standardizing VFX workstation configurations with custom AMIs and launch templates, GPU performance optimizations such as disabling ECC, and security considerations when sharing machine images."
  "412f4f651acc95abf45b158729a6635e":
    "id": "412f4f651acc95abf45b158729a6635e"
    "title": "Building a GPU workstation for visual effects with Amazon EC2: Part 3 – Windows"
    "link": "https://aws.amazon.com/blogs/compute/building-a-gpu-workstation-for-visual-effects-with-amazon-ec2-part-3-windows/"
    "published": "2026-11-12 00:27:16"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The third post in a five-part series on building GPU-backed VFX workstations on Amazon EC2. This post walks through deploying a Windows Server 2025 workstation with NVIDIA GPU drivers, Amazon DCV as the remote display protocol, and Wacom stylus support for a high-performance remote creative environment."
  "e915cde1b4305bc909a851f7cfe445bc":
    "id": "e915cde1b4305bc909a851f7cfe445bc"
    "title": "Building a GPU workstation for visual effects on Amazon EC2: Part 2 – Linux"
    "link": "https://aws.amazon.com/blogs/compute/building-a-gpu-workstation-for-visual-effects-on-amazon-ec2-part-2-linux/"
    "published": "2026-11-12 00:27:12"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The second post in a five-part series on building GPU-backed visual effects (VFX) workstations on Amazon EC2. You deploy and configure a Rocky Linux 9.5 workstation with NVIDIA GPU drivers, Wacom drivers, and Amazon DCV as a high-performance desktop display protocol."
  "9e13f0cfd273179894e4afbf5793becb":
    "id": "9e13f0cfd273179894e4afbf5793becb"
    "title": "Build a GPU workstation for visual effects on Amazon EC2: Part 1 – Setup"
    "link": "https://aws.amazon.com/blogs/compute/build-a-gpu-workstation-for-visual-effects-on-amazon-ec2-part-1-setup/"
    "published": "2026-11-12 00:27:06"
    "fetched": "2026-11-12 03:19:04"
    "summary": "The first in a five-part series on building NVIDIA GPU-powered virtual workstations on Amazon EC2 G-series instances. Part 1 covers the G instance families, Amazon DCV desktop streaming, connectivity options, and the account, service quota, networking, and IAM prerequisites for deploying GPU-accelerated workstations."
