"entries":
  "4fdfd5da3bdbdcc3cf4e9b58eae26cf7":
    "id": "4fdfd5da3bdbdcc3cf4e9b58eae26cf7"
    "title": "AWS Quick apps are now available in Asia Pacific (Singapore)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-quick-apps-available-in-asia-pacific-singapore/"
    "published": "2026-11-12 00:20:00"
    "fetched": "2026-11-12 03:19:01"
    "summary": "<p>The AWS Quick desktop app for macOS and Windows and the Quick mobile app for iOS and Android are now available in the Asia Pacific (Singapore) Region. This launch builds on the recent <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-quick-now-available-in-the-aws-singapore-region/\">availability of Quick in Singapore</a>.</p> \n<p>The desktop app works with your local files and connects to your calendar, email, and business apps. The mobile app lets you chat with Quick, review your activity feed, and open dashboards. Your conversations, context, and agents stay in sync across web, desktop, and mobile, so you can start an agent on your desktop, check on it from your phone, and let it keep running after you close your computer.&nbsp;</p> \n<p>To get started, download the desktop app from the <a href=\"https://aws.amazon.com/quick/download/\">AWS Quick download page</a> or the mobile app from the <a href=\"https://apps.apple.com/us/app/amazon-quick/id1148226615\">Apple App Store</a> or <a href=\"https://play.google.com/store/apps/details?id=com.amazonaws.quicksight.mobile&amp;hl=en_US&amp;trk=e0dcca02-d7b6-48fd-a721-6f3538a9b485&amp;sc_channel=el\" target=\"_blank\">Google Play</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/amazon-quick-mobile.html\">AWS Quick on mobile</a> in the AWS Quick User Guide and the <a href=\"https://aws.amazon.com/quick/\">AWS Quick product page</a>.</p>"
  "d8825eca14f215a4c4d1e3f5c05dc3d3":
    "id": "d8825eca14f215a4c4d1e3f5c05dc3d3"
    "title": "Ornith-1.0-9B and Ornith-1.0-35B models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/ornith-1-0-9b-ornith-1-0-35b-on-sagemaker-jumpstart/"
    "published": "2026-11-12 08:36:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>DeepReinforce AI's Ornith-1.0-9B and Ornith-1.0-35B models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These two models are part of the Ornith 1.0 family of open-source, self-scaffolding agentic coding models released under the MIT license, achieving state-of-the-art performance among open-source models of comparable size on coding benchmarks such as Terminal-Bench 2.1, SWE-Bench, NL2Repo, and OpenClaw.</p> \n<p>These models address different agentic coding challenges with specialized capabilities:</p> \n<p>Ornith-1.0-9B is a lightweight 9B-parameter dense model post-trained on Qwen 3.5 9B, designed for efficient single-GPU deployment. With a 256K-token context window and 32 decoder layers, it is well-suited for individual developers and small teams running agentic coding workflows on a single GPU — including laptops with consumer-grade hardware. Its self-improving training framework uses reinforcement learning to jointly optimize scaffold generation and solution rollouts, enabling the model to discover better search trajectories and generate higher-quality code solutions.</p> \n<p>Ornith-1.0-35B is a 35B-parameter Mixture-of-Experts (MoE) model post-trained on Qwen 3.5, delivering stronger agentic coding performance while remaining deployable on a single 24GB consumer GPU. Like its smaller sibling, it employs reinforcement learning to jointly optimize the scaffolds that drive coding tasks and the resulting solution rollouts, discovering superior code trajectories. Its MoE architecture activates only a subset of parameters per token, providing a strong balance of quality and efficiency for production agentic coding workloads.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "f6cee2e7a4b8e3a63e4d99366713f939":
    "id": "f6cee2e7a4b8e3a63e4d99366713f939"
    "title": "DeepSeek-V4-Pro, DeepSeek-V4-Flash, and DeepSeek-V4.1-Flash models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/deepseek-v4-pro-v4-flash-v4.1-flash-on-sagemaker-jumpstart/"
    "published": "2026-11-12 08:18:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>DeepSeek's DeepSeek-V4-Pro, DeepSeek-V4-Flash, and DeepSeek-V4.1-Flash models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three open-weight Mixture-of-Experts (MoE) language models, released under the MIT license, deliver frontier-class performance across reasoning, coding, and agentic workloads while activating only a fraction of their total parameters per token, enabling high efficiency at scale.</p> \n<p>These models address different AI challenges with specialized capabilities:</p> \n<p>DeepSeek-V4-Pro is designed for complex reasoning and high-quality text generation at flagship scale. This 1.6T-parameter MoE model activates 49B parameters per token and supports a 1M-token context window, making it well-suited for long-document analysis, multi-step reasoning, and demanding generation tasks that require maximum model capacity.</p> \n<p>DeepSeek-V4-Flash delivers strong performance at significantly lower compute cost as an efficient 284B-parameter MoE model activating 13B parameters per token. It supports the same 1M-token context window as V4-Pro, making it ideal for latency-sensitive and cost-conscious production deployments across a wide range of language tasks.</p> \n<p>DeepSeek-V4.1-Flash provides next-generation agentic efficiency with native multimodal support. Built on a novel Causal Encoder-Decoder (CED) architecture with a 552B-parameter backbone, it activates just 8B parameters during prefill and 16B during decode, supporting a 1M-token context window and 384K max output tokens. Its Compressed Sparse Attention 2 (CSA2) and FP4 KV caching reduce the global KV cache footprint to roughly 1/4 of V4-Flash, delivering substantially improved cost efficiency for agentic workloads, coding, and vision tasks.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "857ecb3ce0824a6d25f4f29fc1fdaf32":
    "id": "857ecb3ce0824a6d25f4f29fc1fdaf32"
    "title": "AWS Network Security Manager now available in AWS European Sovereign Cloud and Additional New Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-security-mgr-eu-sovereign-cloud/"
    "published": "2026-11-12 06:00:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>AWS Network Security Manager is now available in AWS European Sovereign Cloud Region and Thirty-One new Regions<br /> <br /> Today, AWS announces the general availability of AWS Network Security Manager in the AWS European Sovereign Cloud Region and additional regions. Network Security Manager is a comprehensive network security management solution designed to simplify security policy deployment and enforcement at scale. Network Security Manager supports AWS WAF and AWS Shield in AWS European Sovereign Cloud Region.&nbsp;The additional regions are: US East (Ohio);&nbsp; US West (N. California); US West (Oregon); Asia Pacific (Mumbai); Asia Pacific (Hong Kong); Asia Pacific (Taipei); Asia Pacific (Seoul); Asia Pacific (Osaka); Asia Pacific (Hyderabad); Asia Pacific (Singapore); Asia Pacific (Sydney); Asia Pacific (Melbourne); Asia Pacific (Malaysia); Asia Pacific (New Zealand); Asia Pacific (Thailand); Asia Pacific (Johor); Asia Pacific (Tokyo); Canada (Central);&nbsp; Canada West (Calgary); Mexico (Central); Europe (Frankfurt); Europe (Zurich); Europe (Stockholm); Europe (Ireland); Europe (Milan); Europe (Spain); Europe (London); Europe (Paris); Israel (Tel Aviv); South America (São Paulo), Africa (Cape Town).<br /> <br /> Network Security Manager features always-on security deployment automation that applies AWS WAF security protection to Internet facing assets like AWS Application Load Balancer. This automated approach helps security teams deploy and manage WAF rules and AWS Shield Advanced protections efficiently, ensuring consistent security posture across targeted accounts and resources. Teams can centrally manage security policies, automatically detect configuration drift, and apply remediation by reducing the operational overhead of manual security management while maintaining comprehensive protection.<br /> <br /> To see which regions AWS Network Security Manager is available in, visit the <u><a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region Table</a></u>. For pricing information, visit the <u><a href=\"https://aws.amazon.com/network-security-manager/pricing/\">AWS Network Security Manager Pricing page</a></u>. for standard regions, and the&nbsp;<u><a href=\"https://aws.eu/network-security-manager/pricing/\">European Sovereign Cloud Pricing</a></u>&nbsp;page.</p>"
  "9d88183c951690dfb05a9ac46a849735":
    "id": "9d88183c951690dfb05a9ac46a849735"
    "title": "AWS Cloud WAN now supports Flow Logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-cloud-wan-flow-logs/"
    "published": "2026-11-12 05:05:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>AWS Cloud WAN now supports VPC Flow Logs, giving you central visibility into IP traffic across your global network. Flow Logs capture detailed information for each flow, so you can understand how traffic moves across your core network without leaving your AWS Cloud WAN account.</p> \n<p>Until now, network administrators had to stitch together VPC Flow Logs from many VPCs, accounts, and Regions to see traffic across their global network. They often depended on other teams for access to those logs. Cloud WAN Flow Logs give core network owners one consolidated view of traffic between VPCs, Regions, and on-premises networks connected over AWS Direct Connect, AWS Site-to-Site VPN, or SD-WAN. You can use this data to troubleshoot connectivity and performance problems, plan capacity from historical bandwidth trends, find unusual traffic patterns, and keep records for security and compliance. Flow log records include IP addresses, ports, protocol, traffic volume, and packet-loss counters, along with Cloud WAN metadata such as segment, Region, service insertion hops and attachment details. You can turn on Flow Logs for an entire core network, a single core network edge, or individual attachments. You can publish them to Amazon CloudWatch Logs, Amazon Simple Storage Service (Amazon S3), or Amazon Data Firehose. Cloud WAN adds no charge for Flow Logs. Standard charges apply for each destination.</p> \n<p>Cloud WAN Flow Logs are available in all AWS Regions where AWS Cloud WAN is available. You can get started with the AWS Management Console, AWS CLI, or API. To learn more, see AWS Cloud WAN Flow Logs&nbsp;<a href=\"https://docs.aws.amazon.com/network-manager/latest/cloudwan/cwan-flow-logs\">user guide</a>.</p>"
  "e267baaa42c065cd0c6c007a29a40863":
    "id": "e267baaa42c065cd0c6c007a29a40863"
    "title": "Amazon EKS Provisioned Control Plane now offers a 24 GB etcd database on 4XL and 8XL tiers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-eks-provisioned-control-plane-larger-etcd-database/"
    "published": "2026-11-12 04:45:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p><a href=\"https://aws.amazon.com/pm/eks/\">Amazon Elastic Kubernetes Service (Amazon EKS)</a> now offers a larger 24 GB etcd database, up from 16 GB, for 4XL and 8XL <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/eks-provisioned-control-plane.html\">Provisioned Control Plane</a> clusters. etcd is the key-value store in the Kubernetes control plane that holds your cluster state, so its size limits how many Kubernetes objects your cluster can store. With 50% more capacity, you can run bigger clusters with more pods, jobs, events, and custom resources.</p> \n<p>The larger database gives more headroom to workloads that create and update many Kubernetes objects, such as large-scale AI/ML training and inference, batch processing, and CI/CD pipelines. When the etcd database fills up, you can’t add or change objects in your cluster, so the extra headroom helps keep these workloads running as they scale.</p> \n<p>To get the larger database,&nbsp;choose the 4XL or 8XL tier of Provisioned Control Plane on a cluster running EKS version 1.34 or later. Existing clusters on the 4XL and 8XL tiers running these versions get the larger database automatically, with no action required. The 24 GB etcd database is available in all commercial AWS Regions where Provisioned Control Plane is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/eks-provisioned-control-plane.html\">Amazon EKS Provisioned Control Plane user guide</a>.&nbsp;<br /> </p>"
  "6469a5d80f273ea28f43581e7c7e774f":
    "id": "6469a5d80f273ea28f43581e7c7e774f"
    "title": "Amazon Cognito now supports user pool session management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cognito-session-management/"
    "published": "2026-11-12 04:00:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>Amazon Cognito now supports session management for user pools, giving you visibility into and control over the sessions your users establish when they sign in to your applications. Single sign-on (SSO) sessions are created when a user signs in through managed login and let them access other app clients without re-authenticating. Token sessions are created when a user signs in to an app client and receives tokens. Session management lets you list a user's active SSO and token sessions across all devices and app clients and revoke any of them on demand. You can also now configure how long each app client reuses an SSO session before requiring re-authentication, instead of the previous fixed one-hour duration.</p> \n<p>Each session includes details such as session type, app client ID, device type, last activity time and location, and initial sign-in time, so you can build your own end-user or admin session experiences. You can revoke an individual session, optionally with its linked sessions, or use global sign-out to end all sessions associated with one user. You can also set a maximum number of active token sessions per user.</p> \n<p>Session management is available for user pools in the Essentials or Plus feature plans in all AWS Regions where Amazon Cognito is available.<i> </i>You can manage sessions using the AWS Management Console, API, AWS Command Line Interface, and AWS Software Development Kits, and configure settings with AWS CloudFormation. Visit the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/managing-user-sessions.html\">Developer Guide</a> and <a href=\"https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_Operations.html\">API Reference</a> for details.&nbsp;</p>"
  "36df89de46ed6eb9df8ee8cfdbaca6e7":
    "id": "36df89de46ed6eb9df8ee8cfdbaca6e7"
    "title": "AWS Lambda MicroVMs now supports the x86 CPU architecture"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-microvms-x86-architecture/"
    "published": "2026-11-12 03:00:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>AWS Lambda MicroVMs now supports the x86 CPU architecture, so you can run your existing x86 applications, tools, and software dependencies without recompiling or porting them. When you create a MicroVM image, you can now choose between x86 and Arm (AWS Graviton) to give each user or job an isolated MicroVM on the architecture your workload uses.</p> \n<p>Lambda MicroVMs is a serverless compute primitive that provides VM-level isolation, near-instant launch and resume, and state preservation for running user or AI-generated code, in applications such as AI coding assistants, CI/CD runners, interactive development environments, and vulnerability scanners. Today’s launch enables you to run x86-based workloads on Lambda MicroVMs as-is. For workloads that run on Arm, you can continue using AWS Graviton processors which is the default CPU architecture option.</p> \n<p>To start building x86 workloads on Lambda MicroVMs, choose the x86 architecture when you create a MicroVM image from your Dockerfile, then launch MicroVMs from that image. You can use&nbsp;MicroVMs through the AWS Lambda console, AWS CloudFormation, AWS Cloud Development Kit, or with your preferred agentic development tools using the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/serverless-skills/aws-lambda-microvms\">Agent Toolkit for AWS</a>.</p> \n<p>Support for the x86&nbsp;CPU architecture is available in all AWS Regions where Lambda MicroVMs is available, except Asia Pacific (Hong Kong), Asia Pacific (Malaysia), Asia Pacific (Thailand), and Europe (Spain). To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html\">AWS Lambda MicroVMs developer guide</a>. For information on pricing, see <a href=\"https://aws.amazon.com/lambda/pricing/\">Lambda MicroVMs pricing</a>.</p>"
  "d42da8b608c76719bdb7a9c233f1a1b2":
    "id": "d42da8b608c76719bdb7a9c233f1a1b2"
    "title": "Amazon EKS Auto Mode now supports security groups for Pods"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-eks-auto-mode-security-groups-for-pods/"
    "published": "2026-11-12 02:26:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p>Amazon EKS Auto Mode now supports security groups for Pods, letting you apply dedicated Amazon EC2 security group rules to individual Pods. Different workloads on the same node can carry different security groups, giving your Pods network-level segmentation without creating separate node pools for each application.</p> \n<p>Security groups for Pods extends your existing AWS network controls to the Pod level, so your Pods can reach resources such as Amazon RDS and Amazon ElastiCache databases that authorize connections by security group under the same rules the rest of your VPC uses. You define which Pods receive which security groups with a SecurityGroupPolicy resource, and Pods not matched by a policy keep using their node’s security groups.</p> \n<p>Security groups for Pods is included as part of EKS Auto Mode at no additional charge and is available on clusters running Kubernetes version 1.36 or later, in all AWS Regions where EKS Auto Mode is supported. To learn more, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/auto-sgp.html\">Security groups for Pods</a> in the Amazon EKS User Guide and the <a href=\"https://aws.amazon.com/eks/auto-mode/\">Amazon EKS Auto Mode</a> product page.</p>"
  "fa126aa1ec2d227c31d64627b0acb15d":
    "id": "fa126aa1ec2d227c31d64627b0acb15d"
    "title": "AWS Emulator is now available for building and testing AWS applications locally"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-emulator-now-available/"
    "published": "2026-11-12 02:00:00"
    "fetched": "2026-11-12 10:15:17"
    "summary": "<p><a href=\"https://aws.amazon.com/products/developer-tools/emulator/\">AWS Emulator</a> is now available for building and testing AWS applications locally.</p> \n<p>Starting today, you can use AWS Emulator to build and test AWS applications on your computer or in your continuous integration (CI) environment. Your existing AWS SDK and CLI calls go to AWS Emulator and come back in milliseconds, so you and your coding agents can find and fix errors locally, with no deployments or AWS account required.</p> \n<p>You create and manage resources with the same AWS SDK and AWS CLI calls you use with AWS, signed with credentials the emulator provides. <i>For the operations it supports, AWS Emulator returns the same result as AWS for valid calls and the same errors for invalid ones. Operations it doesn’t yet support return 501 Not Implemented.</i>&nbsp;AWS Emulator keeps the state of your resources in memory until you stop it. Each copy you start gets its own port, keys and in-memory state, so agents, test suites, and CI jobs never see each other’s resources. For example, a coding agent can create an Amazon DynamoDB table, test against it offline, and fix its code before it deploys.</p> \n<p>Services in AWS Emulator are generated from the API models AWS publishes, the same models behind the AWS SDKs. When AWS adds a service or API, it shows up in AWS Emulator, and its behavior is filled in and verified release by release. To see how its responses compare to AWS, review the <a href=\"http://docs.aws.amazon.com/emulator/latest/userguide/fidelity.html\">AWS Emulator fidelity report</a>.</p> \n<p>AWS Emulator doesn’t depend on an AWS Region. AWS Emulator has no additional service fee. You pay only for AWS resources when you deploy to AWS. Its source code is published under the CC0 1.0 Universal public domain dedication. To get started, see the <a href=\"https://docs.aws.amazon.com/emulator\">AWS Emulator documentation</a>, or view the source in the <a href=\"https://github.com/aws/aws-emulator\">AWS Emulator GitHub repository</a>.</p>"
  "4c0c0c409304e8c0da17d12b60bd1439":
    "id": "4c0c0c409304e8c0da17d12b60bd1439"
    "title": "AWS Quick enhances granular governance with the ability to restrict structured data sources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-quick-structured-data-source-restrictions/"
    "published": "2026-11-12 18:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Today, AWS Quick is announcing the general availability of structured data connector restrictions through custom permissions. This capability gives administrators granular control over which types of data sources users can create, update, or share, helping organizations enforce data governance requirements while enabling self-service analytics.<br /> <br /> With this feature, administrators can configure <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html\">custom permissions profiles</a> in Enterprise edition through the Quick UI, APIs, or AWS Command Line Interface. For example, an organization can allow users to create Amazon Redshift data sources while restricting the creation of file-upload data sources. Administrators can also prevent users from sharing data sources for a particular connector. Create, update, and share restrictions can be configured independently, providing more precise controls than restrictions that apply to all data source types.<br /> <br /> This feature is now available in all supported AWS Quick Regions listed <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\">here</a>. To learn more, check our documentation <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions.html\">here</a>.</p>"
  "e396156df170f13d5fbc605de6d154f5":
    "id": "e396156df170f13d5fbc605de6d154f5"
    "title": "Amazon Route 53 Domains now supports self-service restore for expired and deleted domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-domains-self-service-restore/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Amazon Route 53 Domains now lets you restore an expired or recently deleted domain yourself, using the Amazon Route 53 console, AWS CLI, or AWS SDKs. Previously, restoring a domain required a request to AWS Support. Now you can recover a domain lost to a missed renewal, an expired payment method, or an accidental deletion, and restore the website, email, and applications that depend on it.</p> \n<p>To restore a domain, you enter the domain name, review the restoration price, accept the charge, and submit the request. Route 53 works with the top-level domain (TLD) registry to reactivate the registration and return the domain to your AWS account. Most TLD registries support restoration, and each registry sets how long after expiration or deletion a domain can still be restored. Restoring a domain typically costs more than registering or renewing one.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/domain-restore-expired.html\" rel=\"noopener noreferrer\" target=\"_blank\">Restoring an expired or deleted domain</a> in the Route 53 Developer Guide, or visit the <a href=\"https://aws.amazon.com/route53/domains/\" target=\"_blank\">Amazon Route 53 Domains page</a>. For a complete list of supported TLDs, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/registrar-tld-list.html\" rel=\"noopener noreferrer\" target=\"_blank\">Route 53 TLD list</a>. For pricing, visit the Route 53 <a href=\"https://aws.amazon.com/route53/pricing/\" target=\"_blank\">pricing page</a>.</p>"
  "a3f45e0646844f72b58bb4def5a95dea":
    "id": "a3f45e0646844f72b58bb4def5a95dea"
    "title": "EC2 Image Builder console now integrates with the DevOps Agent for troubleshooting and resource creation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/ec2-image-builder-devops-agent-integration"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>EC2 Image Builder now integrates with the AWS DevOps Agent directly in the Image Builder console, enabling you to troubleshoot failed image pipelines and create resources directly from the console chat panel. You can diagnose up to 50 failed pipelines at once and ask follow-up questions in the same conversation. You can also choose to create resources by describing what you want, and the agent populates the console with values the service has already validated.</p> \n<p>With this integration, diagnosing a failed pipeline no longer requires manually inspecting build logs, cross-referencing error codes, or iterating through configuration fixes, saving you significant time and expertise. The agent reads build logs, workflow steps, components, and network configuration, then provides the root cause and the steps to fix it. For resource creation,&nbsp; the agent verifies the configuration before populating the console for you to review and submit. If you troubleshoot or build with your own AI agents, the new EC2 Image Builder skill in the AWS Agent Toolkit provides you the same troubleshooting and creation capabilities.</p> \n<p>This feature is available in all commercial regions. To get started, open the EC2 Image Builder console and use the DevOps Agent from the console panel. For more information, see the <a href=\"https://docs.aws.amazon.com/imagebuilder/latest/userguide/ai-image-builder.html\">EC2 Image Builder documentation</a> and for pricing refer <a href=\"https://aws.amazon.com/devops-agent/pricing/\">DevOps agent Pricing page</a>.&nbsp;</p>"
  "8781dda3e3c17c8d01d57b781046055c":
    "id": "8781dda3e3c17c8d01d57b781046055c"
    "title": "Amazon FSx for Lustre lowers the entry cost of Intelligent-Tiering file systems by 75%"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/fsx-lustre-intelligent-tiering-lower-throughput/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p><a href=\"https://aws.amazon.com/fsx/lustre/\">Amazon FSx for Lustre</a> is reducing the minimum provisioned throughput capacity and metadata IOPS on Intelligent-Tiering file systems by 75%, allowing you to use Intelligent-Tiering even more cost-effectively for high-performance computing (HPC) and machine learning workloads that start with small datasets and grow over time.</p> \n<p>The FSx for Lustre Intelligent-Tiering storage class delivers the lowest-cost and only fully elastic Lustre file storage in the cloud. It is optimized for workloads that mix hot and cold data and do not require consistent SSD-level performance. A file system's throughput capacity determines the read and write speeds supported by its underlying file servers, and its level of metadata IOPS determines how many files and directories you can create, read, and delete per second. Today’s launch reduces the minimum throughput capacity on an Intelligent-Tiering file system from 4,000 to 1,000 MBps and the minimum metadata performance from 6,000 to 1,500 IOPS.&nbsp;</p> \n<p>The lower throughput capacity and metadata IOPS levels are available on new FSx for Lustre Intelligent-Tiering file systems in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where the Intelligent-Tiering storage class is available. To learn more, see Performance characteristics of Intelligent-Tiering storage class in the <a href=\"https://docs.aws.amazon.com/fsx/latest/LustreGuide/intelligent-tiering-file-systems.html\">Amazon FSx for Lustre User Guide.</a></p>"
  "fcbe0114344102f8501967a848488e85":
    "id": "fcbe0114344102f8501967a848488e85"
    "title": "AWS Backup now supports resource modifiers for Amazon EKS restores"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-backup-resource-modifiers-eks/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Today, AWS Backup announces support for resource modifiers when restoring Amazon Elastic Kubernetes Service (Amazon EKS) backups. Resource modifiers let you transform Kubernetes resources during a restore, so you can adapt a restored cluster to its target environment.</p> \n<p>When you restore an EKS backup that has been copied across accounts or across AWS Regions, the restored cluster can carry references tied to the source environment, such as IAM roles, database endpoints, and Amazon ECR registry URIs. Previously, you had to locate and update these references manually after every restore, which was time consuming and error prone. With resource modifiers, you can define transformation rules once via a YAML file, and AWS Backup applies them automatically as part of the restore, improving the reliability of your cross-account and cross-Region disaster recovery workflows.</p> \n<p>AWS Backup support for resource modifiers for Amazon EKS backups is available in all commercial AWS Regions and AWS GovCloud (US) Regions. To get started, see the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/restoring-eks.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Backup Documentation</a> and read the <a href=\"https://aws.amazon.com/blogs/storage/remap-amazon-eks-namespaces-on-restore-with-aws-backup-resource-modifiers/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog</a>.</p>"
  "ace4ae22321457eb0dadbece4dfd487e":
    "id": "ace4ae22321457eb0dadbece4dfd487e"
    "title": "AWS Cloud WAN now supports BGP communities on Direct Connect attachments for routing policy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloud-wan-bgp-community-directconnect/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>AWS Cloud WAN now supports BGP communities on Direct Connect attachments, enabling advanced routing controls for enterprise hybrid networks. Previously, Cloud WAN Routing Policy evaluated BGP communities only on Site-to-Site VPN and Connect attachments. Now, customers can tag routes with routing intent on-premises, apply filtering and path preference rules inside Cloud WAN, and propagate communities back to their on-premises routers over Direct Connect.</p> \n<p>With this capability, enterprises can simplify hybrid network orchestration by signaling routing policies dynamically from on-premises environments. Customers can match community tags to filter production versus disaster recovery traffic, prioritize preferred paths, or restrict regional propagation. This eliminates the need for VPN overlay workarounds and manual policy replication, reducing operational complexity and misconfiguration risk.</p> \n<p>BGP community support on AWS Cloud WAN Direct Connect attachments is available in all AWS Regions where both AWS Direct Connect and AWS Cloud WAN are available. For the complete list of available Regions, see the <a href=\"https://docs.aws.amazon.com/network-manager/latest/cloudwan/cloudwan-routing-policies.html\" target=\"_blank\">Cloud WAN Routing Policies documentation</a>.</p>"
  "1354278df6d83b83160c6472f7e4f8ac":
    "id": "1354278df6d83b83160c6472f7e4f8ac"
    "title": "Amazon Managed Service for Apache Flink introduces enhanced snapshots"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/managed-flink-enhanced-snapshots/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Amazon Managed Service for Apache Flink now supports enhanced snapshots, a capability that lets you capture, export, and restore application state across Apache Flink applications and AWS Regions, so you can run blue/green deployments, easily migrate self-managed workloads to Amazon Managed Service for Apache Flink without losing state, and keep backup in a secondary Region for cross-Region recovery.</p>\n<p>To deploy an application update without pausing processing for blue/green deployments, create an enhanced snapshot from an application and use it to start a second application. To migrate a self-managed workload, import its Apache Flink savepoint into Amazon Managed Service for Apache Flink as an enhanced snapshot. For cross-Region recovery, export an enhanced snapshot to an Amazon Simple Storage Service (Amazon S3) bucket, and replicate the exported state to a bucket in a secondary Region.</p>\n<p>Enhanced snapshots are available today for applications on Apache Flink 1.20 and later in all AWS Regions where Amazon Managed Service for Apache Flink is available except European Sovereign Cloud (Germany). You pay for enhanced snapshot storage per GB-month as durable application backups. To learn more and get started, see <a href=\"https://docs.aws.amazon.com/managed-flink/latest/java/snapshots-how-it-works.html\" target=\"_blank\">enhanced snapshots</a> in the Amazon Managed Service for Apache Flink Developer Guide. You can also use <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/what-is-agent-toolkit.html\" target=\"_blank\">Agent Toolkit for AWS</a> with Kiro, Claude Code, or Cursor for guidance on building and operating Flink applications with enhanced snapshots.</p>"
  "9a7aa6eb416628d8b3c49a2cb53e7245":
    "id": "9a7aa6eb416628d8b3c49a2cb53e7245"
    "title": "Amazon RDS for SQL Server now supports M8id and R8id instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/rds-sqlserver-supports-m8id-r8id-instances"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> now supports M8id and R8id instances. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, and include local NVMe SSD storage. They scale up to 384 vCPUs, 3 TiB of memory, and 22.8 TB of local NVMe SSD storage. That's 4x the vCPUs and memory and more than 6x the local storage of M5d and R5d instances.</p> \n<p>When you create or modify a DB instance to use M8id or R8id, RDS for SQL Server automatically places the tempdb data and log files on the local NVMe instance store. This gives tempdb lower read and write latency than Amazon EBS storage. Your database data and log files stay on Amazon EBS. Because snapshots don't include tempdb files on the instance store, your snapshots are smaller and use less of your free backup storage. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.InstanceStore.html\" rel=\"noopener noreferrer\" target=\"_blank\">Instance store support for the tempdb database on Amazon RDS for SQL Server</a>.</p> \n<p>To use the new M8id and R8id instances, you can modify your existing RDS database instance or create a new RDS database instance from the RDS Management Console, or using the AWS SDK or CLI. M8id and R8id instances are available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Stockholm), Europe (Spain), Asia Pacific (Tokyo), Asia Pacific (Mumbai), Asia Pacific (Sydney), and Asia Pacific (Malaysia). For pricing details, see <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server Pricing</a>.</p>"
  "6323a7f9b850156ea3fb1c6ad8da1d12":
    "id": "6323a7f9b850156ea3fb1c6ad8da1d12"
    "title": "The next generation AgentCore runtime is now the default"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/new-agentcore-runtime-default/"
    "published": "2026-11-12 14:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Starting today, new runtimes in Amazon Bedrock AgentCore use the next generation of AgentCore runtime by default. The new runtime restores each session from a snapshot of your initialized agent, scales compute and memory with the work, and scales idle agents to zero. Every session still runs in its own hardware-isolated Firecracker microVM. Your agents can run heavy work like compiling a large codebase, driving a browser, or loading a local model inside the session.&nbsp;</p> \n<p>Sessions scale to 8 vCPU and 32 GB of memory and support container images up to 10 GB. On a 2 GB image, sessions start in under 2 seconds at P75, down from 29.7 seconds on the previous generation. Idle agents scale to zero, and memory is reclaimed within minutes of release. For multi-turn agents, that means up to 68% less billed memory per session.</p> \n<p>Existing runtimes stay on the current version until you move them. To move an existing runtime, or to use the next generation in a Region where it isn't the default yet, set platformVersion to V2 when you create or update a runtime. To keep a new runtime on the current version, set platformVersion to V1.</p> \n<p>The new AgentCore Runtime is now the default runtime in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), South America (São Paulo), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Milan), Europe (Paris), Europe (Spain), Europe (Stockholm), Asia Pacific (Malaysia), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Thailand), and Asia Pacific (Tokyo). &nbsp;To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html\">AgentCore runtime documentation</a> or the AWS Blog. For pricing details, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>.</p>"
  "f17375bce4d197ab85a9f3778b530640":
    "id": "f17375bce4d197ab85a9f3778b530640"
    "title": "AWS Backup adds logically air-gapped vault support for Amazon EBS Snapshots Archive"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-backup-lag-vault-ebs-archive/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 13:52:30"
    "summary": "<p>AWS Backup logically air-gapped vault now supports Amazon EBS Snapshots Archive. Logically air-gapped vaults are a type of AWS Backup vault that allows secure sharing of backups across accounts and AWS Organizations, supporting direct restore to reduce recovery time from a data loss event.</p> \n<p>You can now archive Amazon EBS backups held in a logically air-gapped vault to Amazon EBS Snapshots Archive, a low-cost tier for snapshots you rarely access. A logically air-gapped vault stores immutable backups that are locked by default, and isolated with encryption using AWS owned keys or customer-managed keys. This helps you meet long-term retention and compliance requirements at lower storage cost.</p> \n<p>You can get started using the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. In a backup plan rule that runs monthly or less often, specify a logically air-gapped vault as the primary backup destination or copy destination. Then enable Archive Amazon EBS snapshots in the backup rule lifecycle or copy lifecycle and set the time in warm storage before the backup transitions.</p> \n<p>This support is available in all AWS Regions where both logically air-gapped vault and Amazon EBS Snapshots Archive are available. For more information and detailed regional availability, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Backup documentation</a>. To learn more about logically air-gapped vaults, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html\" rel=\"noopener noreferrer\" target=\"_blank\">product documentation</a> and <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>.</p>"
  "33871b545982af523ab549c763dc6e81":
    "id": "33871b545982af523ab549c763dc6e81"
    "title": "AWS Glue announces automatic version upgrades for Apache Spark jobs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/glue-spark-auto-upgrades/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-13 13:52:30"
    "summary": "<p>AWS Glue introduces automatic version upgrades, a capability that keeps your Apache Spark jobs current on the latest AWS Glue runtime without manual coordination. Staying current on supported runtimes gives your jobs the latest security patches, performance improvements, and support for evolving table formats such as Apache Iceberg. Auto upgrades include multiple levels of validations including assessing jobs for compatibility with the upgraded runtime, obtaining your consent before executing jobs on a newer version, and validating upgraded job runs against each job's established output profile, so your jobs upgrade with the right guardrails in place.</p>\n<p>By setting a job's version to \"Auto\", upgrades that once required weeks of planning and execution now happen automatically. Platform teams can standardize runtime versions across large fleets without chasing individual job owners, and business units without a central upgrade team can keep their jobs current hands-free. Each job is validated against its established output schema, data volume, latency, and format before it upgrades, so you can advance with confidence. Jobs that need code changes keep running safely on their current version, and AWS Glue provides an upgrade analysis with specific fixes you can apply directly or with the Apache Spark upgrade agent.</p>\n<p>Auto upgrades for AWS Glue are available in all AWS Commercial Regions.</p>\n<p>To get started, select \"Auto\" as the AWS Glue version when creating or updating an Apache Spark job using the AWS Glue Studio or AWS CLI, API, and SDKs. Alternatively, you can update multiple jobs at once using the AWS Glue <a href=\"https://github.com/aws-samples/aws-glue-samples/blob/8d52b2c004d48b4d15c20cb1b0bd161da0c98a0d/utilities/skills/managing-glue-jobs/README.md\" target=\"_blank\">skill to manage your jobs</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/auto-version-upgrades.html\" target=\"_blank\">AWS Glue documentation</a>.</p>"
  "f32cde370d598fc95184883b79a25b40":
    "id": "f32cde370d598fc95184883b79a25b40"
    "title": "Amazon Connect Customer now supports batch actions on up to 100 cases at once"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-batch-actions-100-cases/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>Cases in Amazon Connect Customer now lets agents and supervisors assign, comment on, and update the status of up to 100 cases at once, so teams spend less time on repetitive case updates. When one issue affects many customers, such as a shipping delay or a service outage, teams no longer need to update each case one at a time. Agents and supervisors with the appropriate permissions can select the related cases and change the assignee, add a comment, or close them in a single action. Developers can also use batch APIs to make the same updates programmatically.</p>\n<p>Cases is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/batch-actions-cases.html\" target=\"_blank\">documentation</a>.</p>"
  "73ccaf329560d250fde540f1cac648c0":
    "id": "73ccaf329560d250fde540f1cac648c0"
    "title": "Amazon Route 53 now supports record set protection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-route-53-record-set-protection/"
    "published": "2026-11-12 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>Amazon Route 53 now supports record set protection, which helps DNS administrators prevent accidental changes to critical DNS records in their hosted zones. This feature allows you to protect records such as those at the zone apex, MX records, and production endpoints directly in the hosted zone. Any change to a protected record is blocked until the protection is removed by an authorized user.</p>\n<p>Previously, to lock specific records, you had to write record-level conditions into the IAM policies of every user and role that could change your hosted zones. When those policies blocked a change, the caller had no indication of whether the record was protected or why. Now you can protect records by name and type directly in the hosted zone. A single protection covers all records with that name and type, including records with different set identifiers; weighted, latency, and other routing policy records are protected together. You can also create a protection proactively before the record exists, preventing records from being created for that name and type. Each protection can include an optional comment of up to 256 characters, allowing you to indicate the reason for the protection. You can manage protections using the Route 53 console, AWS CLI, or AWS SDKs through the CreateResourceRecordSetProtections, DeleteResourceRecordSetProtections, and ListResourceRecordSetProtections API actions. To control who can remove protections, restrict the DeleteResourceRecordSetProtections permission in IAM policies.</p>\n<p>Record set protection is available in all AWS commercial Regions where public and private hosted zones are available today. To learn more, see <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/rrset-protection.html\" target=\"_blank\">Protecting records from changes</a> in the Amazon Route 53 Developer Guide.</p>"
"last_updated": "2026-11-14 05:16:47 JST"
