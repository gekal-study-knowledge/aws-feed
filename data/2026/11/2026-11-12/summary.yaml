"overview": |
  この日は 8 ソースから 37 本で、生成 AI・機械学習の記事が 13 本と最多となり、セキュリティ速報 2 件、ローカルで AWS を再現する AWS Emulator の提供開始、EC2 上の VFX 向け GPU ワークステーション構築シリーズなどが並びました。セキュリティ速報では Amazon mcp-gateway-registry の脆弱性が 2 件公表されています。CVE-2026-100307 は外部管理 API の認可漏れで、1.0.9 から 1.24.7 では認証済みのリモートユーザーが細工したグループインポート要求によって自分の ID グループにレジストリ管理者スコープを割り当て、登録済みのすべてのゲートウェイ資産を管理できてしまうおそれがあります。CVE-2026-125926 はサーバー登録・更新 API のサーバーサイドリクエストフォージェリ (SSRF) で、1.35.0 より前 (影響範囲は v1.0.3 以上 1.34.0 以下) では認証済みのリモートユーザーがゲートウェイから内部ネットワークのサービスやクラウドのインスタンスメタデータエンドポイントに要求を送り、応答を読めるおそれがあります。AWS Emulator は Rust で書かれた無料のオープンソースのローカルエミュレーターで、同じ CLI / SDK コマンドのままほぼすべての AWS サービスに対してアプリケーションを手元の PC や CI でテストできるようになり、News Blog と What's New の両方で発表されました。コンテナ・サーバーレスでは、EKS Auto Mode が Pod 単位のセキュリティグループに対応して同じノード上のワークロードに別々のセキュリティグループのルールを適用できるようになり、EKS Provisioned Control Plane の 4XL / 8XL ティアでは etcd データベースが 16 GB から 24 GB に拡張され、Lambda MicroVMs が x86 CPU アーキテクチャに対応して既存の x86 アプリケーションを再コンパイルせずに動かせるようになりました。ネットワーク・セキュリティでは、AWS Cloud WAN が VPC フローログに対応してグローバルネットワーク全体の IP トラフィックを可視化でき、AWS Network Security Manager が AWS European Sovereign Cloud リージョンと新たに 31 のリージョンで一般提供となり、Amazon Cognito がユーザープールのセッション管理に対応してサインイン後のセッションの可視化と制御ができるようになりました。セキュリティブログでは新しい AWS エクスペリエンスの使いやすさと安全なデフォルト設定の解説と、サイバーセキュリティのキャリアを振り返るシリーズの Part 4 が公開されています。機械学習では、SageMaker JumpStart で DeepSeek-V4-Pro・DeepSeek-V4-Flash・DeepSeek-V4.1-Flash と DeepReinforce AI の Ornith-1.0-9B・Ornith-1.0-35B が利用可能になり、AgentCore ではゲートウェイやリソースを作らずに署名付きの API 呼び出し 1 回でウェブ検索ができる Web Search API が発表されました。Machine Learning Blog ではほかに、AWS Marketplace が SageMaker AI の双方向ストリーミング推論で従量課金の計測に対応し、モデル提供者がライブストリーム中の実使用量に応じて課金できるようになったこと (Deepgram の事例)、トレースを共通形式に変換して 36 種類の組み込みメトリクスで評価するフレームワーク非依存の Universal Agent Evaluation Framework (UAEF)、AWS Quick の 6 つのエージェントによる AI 駆動の製品開発ライフサイクル (AI-PDLC)、RAG パイプラインなどを再利用できる 23 個の本番対応オープンソース資産のカタログ、DXC Technology が 70 か国の規制業界向けに Bedrock 上へ統制されたマルチモデル基盤 DCX OASIS を構築した事例、CloudTrail・EventBridge・Lambda・AgentCore Identity で MCP サーバーの変更を検知して AWS Agent Registry を自動更新するプッシュ型の構成、SageMaker HyperPod の分散学習で GPU のサイレントデータ破損を検出・回復する 3 つのチェック、反単一化 (anti-unification) による形式ポリシーの意味的な差分計算、Bedrock をモデルのバックエンドにして OpenAI Codex を企業内に展開するガイド、Spring AI と Bedrock で Java の自律型エージェントを作る方法、2026 年 10 月の Bedrock・AgentCore・Strands のアップデートのまとめ、140 以上のセッションがある re:Invent 2026 の AI/ML トラックの案内が公開されました。Compute Blog では NVIDIA GPU を積んだ EC2 G 系インスタンスで VFX 用の仮想ワークステーションを作る全 5 回のシリーズ (Amazon DCV によるセットアップ、Rocky Linux 9.5 編、Windows Server 2025 編、カスタム AMI と起動テンプレートによる最適化、セキュリティ) と、HTTP / HTTPS ヘルスチェックの結果を CloudWatch に発行して Auto Scaling で異常なインスタンスを置き換えられる EC2 アプリケーションステータスチェックが紹介されました。Architecture Blog では、Zillow が 1 日 1 億件以上のパーソナライズ通知をそれぞれ短命な Step Functions Express ワークフローとして処理し、10 以上のキャンペーン生成系を置き換えた事例が取り上げられています。リージョンでは AWS Quick のデスクトップアプリ (macOS / Windows) とモバイルアプリ (iOS / Android) がアジアパシフィック (シンガポール) で利用可能になりました。日本のブログでは、IHI と AWS プロフェッショナルサービスによる業務部門が自ら改善できる AI Ready Data づくりの記事と、re:Invent 2026 (11 月 30 日〜12 月 4 日、ラスベガス) のデジタル主権関連セッションを 5 つのテーマで紹介する記事が出ました。
