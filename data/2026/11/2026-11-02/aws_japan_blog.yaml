  "c163d09b6b0542f6db364a9bcda40a4b":
    "id": "c163d09b6b0542f6db364a9bcda40a4b"
    "title": "Amazon EVS と FSx for ONTAP 上で高可用性の Oracle Database を設計する"
    "link": "https://aws.amazon.com/jp/blogs/news/architect-highly-available-oracle-database-on-amazon-evs-and-fsx-for-ontap/"
    "published": "2026-11-02 16:51:22"
    "fetched": "2026-11-02 17:48:07"
    "summary": "VMware Cloud Foundation (VCF) への既存投資がある企業は、アプリケーションの再設計や運用チームの再教育を行うことなく、Oracle データベースを AWS に移行したいと考えています。Amazon Elastic VMware Service (Amazon EVS) 上の Oracle は、既存の VMware 運用ワークフローを維持しながら、サブミリ秒のストレージレイテンシー、スナップショットベースのバックアップ、クロスリージョンディザスタリカバリ (DR)、および独立したストレージスケーリングを活用できます。 この記事では、Amazon FSx for NetApp ONTAP を使用して Amazon EVS 上に完全な Oracle Database 環境を設計する方法を紹介します。使い慣れた VMware 運用ツールを維持しながら、ストレージ、コンピューティング、ネットワーキング、ディザスタリカバリの各レイヤーがどのように連携して高可用性、クロスリージョン DR、サブミリ秒のストレージレイテンシーを実現するかを学びます。"
  "ecc334eee9b7e22c551055877749e9a5":
    "id": "ecc334eee9b7e22c551055877749e9a5"
    "title": "Amazon EVS と FSx for ONTAP における Oracle Database のデプロイステップ"
    "link": "https://aws.amazon.com/jp/blogs/news/deploy-oracle-database-step-by-step-on-amazon-evs-with-fsx-for-ontap/"
    "published": "2026-11-02 16:51:05"
    "fetched": "2026-11-02 17:48:07"
    "summary": "この記事では、NFS データストアストレージとして Amazon FSx for NetApp ONTAP を使用して、Amazon Elastic VMware Service (Amazon EVS) 上に Oracle Database をデプロイするためのステップバイステップの手順を紹介します。ストレージボリュームのプロビジョニング、NFS データストアのマウント、Oracle のインストール、そしてクロスリージョンディザスタリカバリのための SnapMirror レプリケーションの設定を行います。 VMware 上で Oracle データベースを稼働させている企業は、再設計や再教育を行うことなく既存の運用ワークフローを維持できる AWS への移行パスを求めています。関連記事「Amazon EVS と FSx for ONTAP 上で高可用性の Oracle Database を設計する」では、Amazon Elastic Compute Cloud (Amazon EC2) ベアメタルインスタンスの選択、VM のサイジング、vSAN と FSx for ONTAP 間でのストレージの分割、クロスリージョン DR のための SnapMirror レプリケーションの計画など、環境を設計する方法を説明しました。 この記事は、アーキテクチャ編の続きです。Oracle VM のプロビジョニングと FSx for ONTAP ボリュームの作成から、NFS データストアのマウント、Oracle 19c のインストール、SnapMirror と SnapCenter の設定まで、スタック全体をデプロイするためのステップバイステップの手順を紹介します。また、既存のオンプレミス Oracle ワークロードを Amazon EVS に移行するための 4 つの移行パスと、スナップショットバックアップ、ポイントインタイムリカバリ、データベースクローニングを含む Day 2 運用についても説明します。"
  "215574cfc7c225bdb95b08af86ac4b29":
    "id": "215574cfc7c225bdb95b08af86ac4b29"
    "title": "【開催報告】フロンティア AI 時代のサイバー攻撃に備える ― 臨時開催 AWS セキュリティセミナー"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-security-seminar-frontier-ai-report/"
    "published": "2026-11-02 16:10:46"
    "fetched": "2026-11-02 17:48:07"
    "summary": "2026年10月23日と30日に、臨時のAWSセキュリティセミナー「フロンティアAI時代のサイバー攻撃に備える」をオンラインで開催しました。AWSが基盤側で行っている対策と、AWS WAF、Amazon Inspector、AWS Security Agentなどお客様の側で取り組める対策を、2回分まとめてご報告します。11月からは週次のオンラインハンズオンも開催しています。"
  "8eaaf164db5f77b194270d6be2739987":
    "id": "8eaaf164db5f77b194270d6be2739987"
    "title": "週刊生成AI with AWS – 2026/10/26 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20261026/"
    "published": "2026-11-02 14:32:10"
    "fetched": "2026-11-02 17:48:07"
    "summary": "今週の「週刊生成 AI with AWS」は、ドコモSMTBネット銀行が Amazon Connect Customer AI agents で電話とチャットの自動応対を始めた国内事例や、AMOREPACIFIC が Kiro でレガシー SAP ECC に AI 駆動開発を導入した事例を紹介しています。 サービスアップデートでは、Amazon Bedrock での OpenAI GPT-6.1 Terra の一般提供、Amazon Bedrock AgentCore CLI 1.0 の公開、AWS Step Functions のワークフローを AI エージェントのツールとして使える機能などを取り上げています。 Kiro では、ハロウィンハッカソン Kiroween 2026 の開始、11 月 1 日からの新しい無料トライアル、週 1,000 件の PR を支える Kiro Crew チームの品質管理の記事をまとめています。"
  "7ccdfdeaa163e1266507b07b462ffe11":
    "id": "7ccdfdeaa163e1266507b07b462ffe11"
    "title": "AI ガードレールによるコンタクトセンターでの責任ある AI の実装"
    "link": "https://aws.amazon.com/jp/blogs/news/implementing-responsible-ai-in-contact-centers-with-connect-ai-agents-guardrails/"
    "published": "2026-11-02 14:23:14"
    "fetched": "2026-11-02 17:48:07"
    "summary": "Amazon Connect Customer のネイティブ機能 AI ガードレールは、コンタクトセンターにおける AI の安全で倫理的な導入を実現します。本記事では、プロンプト攻撃検出、コンテンツフィルタリング、PII 保護、コンテキストグラウンディングなど 7 つの保護コンポーネントの詳細と、AWS の責任ある AI フレームワークの 8 つの側面に沿った実装ガイダンスを解説します。"
"last_updated": "2026-11-02 17:48:07 JST"
