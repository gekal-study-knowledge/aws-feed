  "62a32fa04bda276a588b6e7303ace1bb":
    "id": "62a32fa04bda276a588b6e7303ace1bb"
    "title": "Amazon Textract now available in Asia Pacific (Tokyo) and Europe (Zurich)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/textract-tokyo-zurich/"
    "published": "2026-11-02 17:00:00"
    "fetched": "2026-11-03 10:57:54"
    "summary": "<p>Amazon Textract is now available in the Asia Pacific (Tokyo) and Europe (Zurich) Regions. Amazon Textract is a machine learning service that automatically extracts text, handwriting, and data from scanned documents, going beyond simple optical character recognition (OCR) to identify and extract text and structured data.</p>\n<p>At launch in these Regions, Amazon Textract supports text detection and document analysis. This includes the DetectDocumentText, AnalyzeDocument, StartDocumentTextDetection, GetDocumentTextDetection, StartDocumentAnalysis, and GetDocumentAnalysis operations. The AnalyzeExpense, AnalyzeID, and AnalyzeLending operations, and Custom Queries (adapters), are not available in these Regions at this time.</p>\n<p>With this launch, Amazon Textract is available in a total of 18 AWS Regions: US East (Ohio), US East (N. Virginia), US West (N. California), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Spain), the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions, and the newly added Asia Pacific (Tokyo) and Europe (Zurich) Regions.</p>\n<p>To learn more, see the <a href=\"https://aws.amazon.com/textract/\">Amazon Textract product page</a> and the <a href=\"https://docs.aws.amazon.com/textract/\">Amazon Textract Developer Guide</a>. For pricing and Region availability, see the <a href=\"https://aws.amazon.com/textract/pricing/\">Amazon Textract pricing page</a> and <a href=\"https://docs.aws.amazon.com/general/latest/gr/textract.html\">Amazon Textract endpoints and quotas</a>.</p>"
  "ad438dae4f1768d0b04bb614b4d8a8df":
    "id": "ad438dae4f1768d0b04bb614b4d8a8df"
    "title": "EC2 Amazon Machine Images can now be scanned for vulnerabilities through Amazon Inspector"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/ec2-amis-scanned-through-inspector/"
    "published": "2026-11-02 17:00:00"
    "fetched": "2026-11-03 10:57:54"
    "summary": "<p>Amazon Inspector now extends its vulnerability scanning to EC2 Amazon Machine Images (AMIs), enabling you to identify software vulnerabilities in your AMIs without launching instances or installing additional software. This helps you fix issues at the source before AMIs are used to launch instances across your fleet.</p> \n<p>With this capability, you can run continuous evaluations to monitor your AMI catalog for newly discovered vulnerabilities, or perform targeted one-time scans for specific AMIs directly from the EC2 Console. You can enable AMI scanning for an account or across your entire organization in Amazon Inspector. For AWS Security Hub customers, you can enable AMI scanning as an add-on across your organization, and findings are also delivered to Security Hub. Based on the scan results, you can enable the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-allowed-amis.html\">Allowed AMIs</a> setting and specify security criteria that AMIs must meet to be available within your account and enforce this setting across the entire organization using Declarative Policies. Customers building AMIs with <a href=\"https://docs.aws.amazon.com/imagebuilder/latest/userguide/integ-inspector.html#integ-inspector-ami-scan\">EC2 Image Builder</a> can integrate scanning directly into their pipelines and restrict distribution of AMIs that do not meet their security standards.</p> \n<p>AMI Scanning helps you detect and remediate vulnerabilities earlier in your deployment pipeline, reducing the risk of deploying compromised compute resources. Security teams can now establish a consistent vulnerability scanning process across all AMIs improving their security posture before instances are launched.</p> \n<p>This capability is available in all commercial AWS Regions where Amazon Inspector is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-scanning.html\">EC2 User Guide</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html\">Amazon Inspector User Guide</a>,&nbsp;the <a href=\"https://aws.amazon.com/inspector/pricing/\">Amazon Inspector pricing page</a>, and the <a href=\"https://aws.amazon.com/inspector/\">Amazon Inspector product page</a>.</p>"
  "02d70c82a89f24c8bc1384cf341090a5":
    "id": "02d70c82a89f24c8bc1384cf341090a5"
    "title": "Amazon CloudFront now supports self-service increases in AWS Service Quotas"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-self-service-quotas/"
    "published": "2026-11-02 17:00:00"
    "fetched": "2026-11-03 10:57:54"
    "summary": "<p>Amazon CloudFront now supports AWS Service Quotas, so you can view, monitor, and request increases for 28 CloudFront quotas from the Service Quotas console or API.</p> \n<p>Until now, increasing a quota on resources such as distributions, cache policies, origins, or alternate domain names meant opening a support case and waiting for manual review. If you have AWS Business Support or higher, requests for limit increases within published thresholds are now approved automatically. For example, you can raise your distribution quota from 500 to 1,000, or the number of alternate domain names per distribution from 100 to 500, without opening a support case. Some quotas also publish usage metrics to Amazon CloudWatch every 5 minutes, so you can set alarms and request an increase before you reach a limit..</p> \n<p>This feature is available in all AWS Regions where Amazon CloudFront is supported.</p> \n<p>To get started, visit <a href=\"https://console.aws.amazon.com/servicequotas/home#!/services/cloudfront/quotas\">the Service Quotas console</a> to view and request increases for your CloudFront quotas. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-limits.html\">Amazon CloudFront quotas</a> in the Amazon CloudFront Developer Guide.</p>"
  "429052c52e52c743a114ad072b03781a":
    "id": "429052c52e52c743a114ad072b03781a"
    "title": "Announcing an updated text detection model for Amazon Textract"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/textract-text-detection-model/"
    "published": "2026-11-02 17:00:00"
    "fetched": "2026-11-03 10:57:54"
    "summary": "<p>Amazon Textract now provides an updated text detection model that improves accuracy, expands language support, and enhances multilingual table extraction. The updated model applies to the DetectDocumentText and AnalyzeDocument APIs and requires no changes to your Amazon Textract API requests or response schema. Your applications are served by the updated model automatically, so you can continue calling Amazon Textract exactly as before.</p>\n<p>The updated model expands language coverage to more than 40 languages, including Albanian, Arabic, Basque, Belarusian, Bosnian, Bulgarian, Chinese (Simplified and Traditional), Croatian, Czech, Danish, Dutch, English, Estonian, Finnish, French, German, Hebrew, Hindi, Hungarian, Icelandic, Italian, Japanese, Korean, Latvian, Lithuanian, Luxembourgish, Norwegian, Polish, Portuguese, Romanian, Russian, Serbian Cyrillic, Serbian Latin, Slovak, Slovenian, Spanish, Swedish, Turkish, Turkmen, and Ukrainian, enabling reliable processing of previously unsupported scripts. Accuracy improvements include enhanced long-word recognition and handwriting detection. Additionally, multilingual table extraction is more robust on merged cells, skewed or rotated tables, and partial or corrupted tables. These improvements help you accurately process invoices, forms, identity documents, and other multilingual or complex documents, including those with tables, at scale.</p>\n<p>The updated Amazon Textract model is available in all AWS Regions where Amazon Textract is available. To learn more, see the <a href=\"https://aws.amazon.com/textract/\">Amazon Textract product page</a> and the <a href=\"https://docs.aws.amazon.com/textract/\">Amazon Textract Developer Guide</a>.</p>"
  "b986cf4bd6958e8cfa32df6620f5ad09":
    "id": "b986cf4bd6958e8cfa32df6620f5ad09"
    "title": "Announcing AWS for Fluent Bit 3.0.0 based on Fluent Bit 4.1.1"
    "link": "https://aws.amazon.com/about-aws/whats-new/2025/10/aws-fluent-bit-3-0-0-based-4-1-1"
    "published": "2026-11-02 17:00:00"
    "fetched": "2026-11-03 18:08:08"
    "summary": "<p>AWS for Fluent Bit announces version <a href=\"https://github.com/aws/aws-for-fluent-bit/releases/tag/v3.0.0\" rel=\"noopener noreferrer\" target=\"_blank\">3.0.0</a>, based on Fluent Bit version 4.1.1 and Amazon Linux 2023. Container logging using AWS for Fluent Bit is now more performant and more feature-rich for AWS customers, including those using <a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Services</a> (Amazon ECS) and <a href=\"https://aws.amazon.com/eks/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Kubernetes Service</a> (Amazon EKS).<br /> <br /> AWS for Fluent Bit enables Amazon ECS and Amazon EKS customers to collect, process, and route container logs to destinations including Amazon CloudWatch Logs, Amazon Data Firehose, Amazon Kinesis Data Streams, and Amazon S3 without changing application code. AWS for Fluent Bit 3.0.0 upgrades the Fluent Bit version to 4.1.1, and upgrades the base image to Amazon Linux 2023. These updates deliver access to the latest Fluent Bit features, significant performance improvements, and enhanced security. New features include native OpenTelemetry (OTel) support for ingesting and forwarding OTLP logs, metrics, and traces with AWS SigV4 authentication. Performance improvements include faster JSON parsing, processing more logs per vCPU with lower latency. Security enhancements include TLS min version and cipher controls, which enforce your TLS policy on outputs from AWS for Fluent Bit for stronger protocol posture.<br /> <br /> You can use AWS for Fluent Bit 3.0.0 on both ECS and EKS. On ECS, update the FireLens log-router container image in your task definition to the 3.0.0 tag from the Amazon ECR Public Gallery. On EKS, upgrade by either updating the Helm release or setting the DaemonSet image to the 3.0.0 version.<br /> <br /> The <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/firelens-using-fluentbit.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS for Fluent Bit image</a> is available in the <a href=\"https://gallery.ecr.aws/aws-observability/aws-for-fluent-bit\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ECR Public Gallery</a> and in the Amazon ECR repository. You can also find it on <a href=\"https://github.com/aws/aws-for-fluent-bit\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub</a> for source code and additional guidance.</p> \n<p>&nbsp;</p> \n<p><i>10/29/2025 - This post has been updated to accurately reflect the Fluent Bit version at launch.<br /> 11/02/2026 - This post has been updated to clarify the scope of OpenTelemetry support.</i></p> \n<p>&nbsp;</p>"
"last_updated": "2026-11-03 18:08:08 JST"
