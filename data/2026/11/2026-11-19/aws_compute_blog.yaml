    "summary": "AWS Lambda customer-managed runtimes give you full control over the contents, updates, access, and lifecycle of the runtime your Lambda Event Functions use. Package a runtime once, share it across your organization, and roll out updates centrally. Functions pick up the change automatically, keeping the same .zip deployment experience."
