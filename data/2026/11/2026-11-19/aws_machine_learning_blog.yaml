    "title": "How Social Department built culture-aware video discovery"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-social-department-built-culture-aware-video-discovery/"
    "published": "2026-11-19 04:27:56"
    "fetched": "2026-11-19 04:54:41"
    "summary": "Social Department, an AI operating system for entertainment marketing, worked with TrackIt and AWS to build QuickSearch: single-action queries that surface shareable scenes, quotable lines, memeable frames, and trend-aligned moments across large video libraries, using TwelveLabs models on Amazon Bedrock and Amazon OpenSearch Serverless."
  "a233fc364236aae7d658d3c7497918fe":
    "id": "a233fc364236aae7d658d3c7497918fe"
    "title": "Connect Amazon Bedrock AgentCore Gateway to private APIs in a hub-and-spoke network with centralized inspection"
    "link": "https://aws.amazon.com/blogs/machine-learning/connect-amazon-bedrock-agentcore-gateway-to-private-apis-in-a-hub-and-spoke-network-with-centralized-inspection/"
    "published": "2026-11-19 04:05:45"
    "fetched": "2026-11-19 04:54:41"
    "summary": "Many enterprises run a centralized network model: one account owns every VPC and a central firewall inspects all traffic. This post shows a tested pattern for connecting Amazon Bedrock AgentCore Gateway to private APIs and MCP servers in that model, with the VPC Lattice resource gateway in the network account so every hop crosses the firewall."
  "1efa69dc8fc5d6c0c1da487ebd943086":
