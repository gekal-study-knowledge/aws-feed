  "337f2e536fb5c22684a0bd8ee3c2a1f2":
    "id": "337f2e536fb5c22684a0bd8ee3c2a1f2"
    "title": "How Social Department built culture-aware video discovery"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-social-department-built-culture-aware-video-discovery/"
    "published": "2026-11-19 04:27:56"
    "fetched": "2026-11-19 04:54:41"
    "summary": "Social Department, an AI operating system for entertainment marketing, worked with TrackIt and AWS to build QuickSearch: single-action queries that surface shareable scenes, quotable lines, memeable frames, and trend-aligned moments across large video libraries, using TwelveLabs models on Amazon Bedrock and Amazon OpenSearch Serverless."
  "a233fc364236aae7d658d3c7497918fe":
    "id": "a233fc364236aae7d658d3c7497918fe"
    "title": "Connect Amazon Bedrock AgentCore Gateway to private APIs in a hub-and-spoke network with centralized inspection"
    "link": "https://aws.amazon.com/blogs/machine-learning/connect-amazon-bedrock-agentcore-gateway-to-private-apis-in-a-hub-and-spoke-network-with-centralized-inspection/"
    "published": "2026-11-19 04:05:45"
    "fetched": "2026-11-19 04:54:41"
    "summary": "Many enterprises run a centralized network model: one account owns every VPC and a central firewall inspects all traffic. This post shows a tested pattern for connecting Amazon Bedrock AgentCore Gateway to private APIs and MCP servers in that model, with the VPC Lattice resource gateway in the network account so every hop crosses the firewall."
  "1efa69dc8fc5d6c0c1da487ebd943086":
    "id": "1efa69dc8fc5d6c0c1da487ebd943086"
    "title": "How Stretto built an AI voice agent with Amazon Nova 2 Sonic"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-stretto-built-an-ai-voice-agent-with-amazon-nova-2-sonic/"
    "published": "2026-11-19 03:58:42"
    "fetched": "2026-11-19 04:54:41"
    "summary": "Stretto replaced its web-form lead capture with Tara, an AI voice agent built on Amazon Nova 2 Sonic that conducts bankruptcy intake interviews by phone and qualifies leads. See how Stretto, the AWS Generative AI Innovation Center, and CI&amp;T designed the voice architecture, validated it for sensitive conversations, and moved it to production."
  "60ddeb9b4fe6811ee5cf83b11751e15f":
    "id": "60ddeb9b4fe6811ee5cf83b11751e15f"
    "title": "From reporting to reasoning: Getting enterprise data ready for AI agents"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-reporting-to-reasoning-getting-enterprise-data-ready-for-ai-agents/"
    "published": "2026-11-19 03:54:08"
    "fetched": "2026-11-19 04:54:41"
    "summary": "A recap of the inaugural AWS Quick User Group DC meetup, where data leaders explored getting enterprise data ready for AI agents. It covers what's new in AWS Quick, Financial Independence Group's AI analytics journey, and hands-on app and no-code flow building."
  "a5cdeed4d508715d05e743c79f1224c7":
    "id": "a5cdeed4d508715d05e743c79f1224c7"
    "title": "Full Fine-Tuning (FFT) on SageMaker AI Serverless Model Customization"
    "link": "https://aws.amazon.com/blogs/machine-learning/full-fine-tuning-fft-on-sagemaker-ai-serverless-model-customization/"
    "published": "2026-11-19 09:15:58"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Amazon SageMaker AI Serverless Model Customization now supports Full Fine-Tuning (FFT). This post explores when FFT outperforms LoRA across key benchmarks, examines the spectral properties of model weight matrices behind the quality gap, shares practical hyperparameter tuning guidelines, and shows how to get started."
  "d9e4c8bd05a2a2b92b648487b6157e9c":
    "id": "d9e4c8bd05a2a2b92b648487b6157e9c"
    "title": "Exa boosts embedding throughput by 50% to index billions of documents on AWS AI chips"
    "link": "https://aws.amazon.com/blogs/machine-learning/exa-boosts-embedding-throughput-by-50-to-index-billions-of-documents-on-aws-ai-chips/"
    "published": "2026-11-19 08:58:22"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Exa's neural search engine is backed by an in-house vector database, so the unit economics of embedding tens of billions of web documents drive the business. This post shares how Exa optimized embedding inference on AWS Neuron hardware (Inferentia2 and Trainium2) with custom NKI kernels, reaching a 47% gain in performance and cost per million documents."
  "9c25d5c08c0b8e0357de7764cc0fcbad":
    "id": "9c25d5c08c0b8e0357de7764cc0fcbad"
    "title": "Introducing workload recovery and expanded infrastructure checks on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-workload-recovery-and-expanded-infrastructure-checks-on-amazon-sagemaker-hyperpod/"
    "published": "2026-11-19 08:03:29"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Large training jobs can stall or compute wrong results even when every node looks healthy. Amazon SageMaker HyperPod now adds workload recovery and expanded infrastructure checks that catch these failures sooner and raise the goodput of your training workloads."
  "201dd3d3aa59f0a903af7b4bfc1841c4":
    "id": "201dd3d3aa59f0a903af7b4bfc1841c4"
    "title": "Introducing the Amazon SageMaker JumpStart Model Leaderboard"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-the-amazon-sagemaker-jumpstart-model-leaderboard/"
    "published": "2026-11-19 07:31:04"
    "fetched": "2026-11-19 10:40:08"
    "summary": "The Amazon SageMaker JumpStart Model Leaderboard compares 70+ foundation models side by side on quality, speed, and cost, directly in SageMaker Studio. Learn what the leaderboard shows, how AWS benchmarks models, and how to go from a shortlist to a deployed model."
  "f7d74aa61746d4ca3213ca95fd5b6039":
    "id": "f7d74aa61746d4ca3213ca95fd5b6039"
    "title": "How Airbnb uses cost per task to operate coding agents on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-airbnb-uses-cost-per-task-to-operate-coding-agents-on-amazon-bedrock/"
    "published": "2026-11-19 06:48:19"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Airbnb runs evals on real engineering tasks and uses Amazon Bedrock observability to choose models for its coding agents and control production costs. This post shows how cost per task guides model selection, why production spending can differ from eval results, and how to monitor latency, manage quotas, and attribute spend."
  "f5d3b72a46ba9630027daeb3a9b816a3":
    "id": "f5d3b72a46ba9630027daeb3a9b816a3"
    "title": "Design responsible AI controls for Amazon Aurora PostgreSQL"
    "link": "https://aws.amazon.com/blogs/machine-learning/design-responsible-ai-controls-for-amazon-aurora-postgresql/"
    "published": "2026-11-19 06:38:22"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Learn how to make RAG chatbot answers traceable with Amazon Aurora PostgreSQL, pgvector, and Amazon Bedrock Guardrails, logging sources, scores, and guardrail traces in SQL."
  "4419073996dd695795bb0268eb7f3692":
    "id": "4419073996dd695795bb0268eb7f3692"
    "title": "Private certificate authority support in Amazon Bedrock AgentCore Identity"
    "link": "https://aws.amazon.com/blogs/machine-learning/private-certificate-authority-support-in-amazon-bedrock-agentcore-identity/"
    "published": "2026-11-19 05:53:41"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Amazon Bedrock AgentCore Identity now supports private certificate authorities (CAs), so your agents can connect to self-hosted identity providers that use a private CA. This post shows how to issue an IdP certificate with AWS Private CA, configure a credential provider to trust it, rotate the CA, and protect the certificate."
  "271278616f69930a2ca5a800dd8ca631":
    "id": "271278616f69930a2ca5a800dd8ca631"
    "title": "How Salesforce is advancing global-scale model serving with cross-Region inference routing in Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-salesforce-is-advancing-global-scale-model-serving-with-cross-region-inference-routing-in-amazon-sagemaker-ai/"
    "published": "2026-11-19 05:13:18"
    "fetched": "2026-11-19 10:40:08"
    "summary": "Learn how Salesforce uses the cross-Region inference router in Amazon SageMaker AI to turn fragmented Regional capacity into reliable model serving. Salesforce adds capacity securely across Regions and accounts while keeping its data residency commitments, and sees per request where each call was served and why."
