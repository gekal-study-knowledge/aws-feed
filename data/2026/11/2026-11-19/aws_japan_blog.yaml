    "title": "re:Invent 2026 の AWS クラウドレジリエンス関連セッションガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/your-guide-to-aws-cloud-resilience-sessions-at-reinvent-2026/"
    "published": "2026-11-19 14:29:43"
    "fetched": "2026-11-19 18:48:45"
    "summary": "レジリエンスは、AWS 上で構築したものを稼働させ続けるための基盤です。お客様にとっても、ステークホルダーにとっても、そしてビジネスにとっても重要です。re:Invent 2026 には、皆さんのアプローチを強化するのに役立つクラウドレジリエンスのセッションが用意されています。今年のラインナップはブレイクアウトセッション、チョークトーク、コードトーク、ワークショップ、ライトニングトークにわたっており、1 週間の計画を立てやすいよう整理しました。ラスベガスでお会いしましょう!"
  "d0d3cf6fbbefe3c7f7b27462dff9c222":
    "id": "d0d3cf6fbbefe3c7f7b27462dff9c222"
    "title": "Amazon Aurora DSQL の監査ログの使い方"
    "link": "https://aws.amazon.com/jp/blogs/news/how-to-use-amazon-aurora-dsql-audit-logs/"
    "published": "2026-11-19 13:43:35"
    "fetched": "2026-11-19 18:48:45"
    "summary": "Amazon Aurora DSQL の監査ログで、SELECT を含む SQL ステートメントをロールごとに記録する方法を紹介します。AWS CLI と psql による設定手順、DBA と監査チームの職務分離、監査レコードの主なフィールド、Amazon Athena でのクエリ、CDC レコードや CloudTrail の接続イベントとの突き合わせ方を解説します。"
  "f876cfb44d9ceeb6d0bdbae753454d54":
    "id": "f876cfb44d9ceeb6d0bdbae753454d54"
    "title": "新しい AWS エクスペリエンスにおける使いやすさと安全なデフォルト設定"
    "link": "https://aws.amazon.com/jp/blogs/news/ease-of-use-and-secure-defaults-in-the-new-aws-experience/"
    "published": "2026-11-19 12:52:59"
    "fetched": "2026-11-19 18:48:45"
    "summary": "新しい AWS エクスペリエンスでは、すばやく使い始められる使いやすさとセキュリティを両立させるため、安全なデフォルト設定を最初から適用します。MFA を登録できる AWS ビルダー ID でのサインイン、AWS が AWS Organizations を使って管理する組織とプロジェクト、データ境界、単一の AWS リージョン、月額 20 USD から設定できる支出上限、IAM ロールを作成してアタッチする IAM Role Manager を、その狙いとともに紹介します。"
"last_updated": "2026-11-19 18:48:45 JST"
