"entries":
  "14712f05124d428881982757705ca2d7":
    "id": "14712f05124d428881982757705ca2d7"
    "title": "Amazon RDS for MySQL supports MySQL minor version 8.4.13"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-mysql-8413-available/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/mysql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for MySQL</a> supports MySQL minor version 8.4.13, the latest minor released by community MySQL. We recommend upgrading to the newer minor versions to accept fixes for Common Vulnerabilities and Exposures (CVEs) in prior versions of MySQL and to benefit from bug fixes, performance improvements, and new functionality added by the MySQL community. Learn more about the enhancements in RDS for MySQL 8.4.13 in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS user guide</a> and <a href=\"https://dev.mysql.com/doc/relnotes/mysql/8.4/en/news-8-4-13.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL 8.4.13</a> release notes.</p> \n<p>You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Upgrading.html\" rel=\"noopener noreferrer\" target=\"_blank\">automatic minor version upgrades</a> and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate upgrades across your instances in phases, validating on lower-priority environments before upgrading your most critical ones. You can perform minor version upgrades in-place or via snapshot restore. Learn more about performing version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MySQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS User Guide</a>. This release is supported in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RegionsAndAvailabilityZones.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon RDS for MySQL is available.</p> \n<p>Amazon RDS for MySQL makes it simple to set up, operate, and scale MySQL deployments in the cloud. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (AWS CLI).</p>"
  "26e9b369221ed5a1a1c450db773ce2b9":
    "id": "26e9b369221ed5a1a1c450db773ce2b9"
    "title": "Amazon Cognito now supports point-in-time recovery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-point-in-time-recovery/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now supports point-in-time recovery (PITR), so you can restore the user data in a user pool to an earlier time. Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices. Previously, you had to build and maintain your own export and restore process, and restored users received new identifiers and had to reset their passwords.</p> \n<p>With PITR, you choose a recovery point, preview how many users, groups, multi-factor authentication (MFA) settings, and passkeys the recovery will create, update, or delete, and then start or cancel the recovery. Recovered users keep their identifiers, passwords, MFA settings, and passkeys, so they can sign in without resetting their credentials. For example, if a script deletes or modifies users by mistake, you can restore the user data to the moment before it ran.</p> \n<p>PITR is enabled automatically for user pools on the Essentials and Plus feature plans at no additional charge. The recovery window is up to 1 day on Essentials and up to 14 days on Plus. You can initiate and manage a recovery using the AWS Management Console, the Amazon Cognito API, AWS Command Line Interface (AWS CLI), or AWS SDKs. PITR is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To learn more, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-point-in-time-recovery.html\">Point-in-time recovery</a> in the Amazon Cognito Developer Guide.</p>"
  "a9127236866ae5ae22b52ed42f052941":
    "id": "a9127236866ae5ae22b52ed42f052941"
    "title": "Amazon RDS now supports fast storage volume initialization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-fast-storage-volume-initialization/"
    "published": "2026-11-19 01:00:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p>Amazon RDS now initializes storage volumes faster when you perform a point-in-time restore (PITR), create a read replica, or convert a Single-AZ instance to Multi-AZ. Each of these operations creates storage volumes from a snapshot, and the data blocks are downloaded from Amazon S3 before you can access them. With fast storage volume initialization, you get a fully performant DB instance in a predictable amount of time.</p> \n<p>Previously, the initialization rate varied with your workload and with which blocks were accessed. As there was no dedicated bandwidth, so you could see increased I/O latency and had no way to tell when an instance would reach full performance. Now, each database instance is initialized at up to 4 TiB per hour, across every gp3 and io2 storage volume attached to the instance. If concurrent initialization across your account exceeds the available bandwidth, the remaining blocks initialize on a best-effort basis, so initialization is never slower than today. Your DB instance stays available and usable while initialization runs.</p> \n<p>Fast storage volume initialization is enabled by default and no action is required. To follow progress, use the StorageOperationStatus and StorageOperationPercentProgress fields in the Amazon RDS console, the DescribeDBInstances API, the AWS Command Line Interface (CLI), or AWS SDKs.</p> \n<p>This capability is available at no additional cost for RDS for MariaDB, RDS for MySQL, RDS for PostgreSQL, RDS for Db2, RDS for Microsoft SQL Server, and RDS for Oracle, in all commercial AWS Regions and the AWS GovCloud (US) Regions. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html\" target=\"_blank\">Amazon RDS storage</a> in the Amazon RDS User Guide.</p>"
  "cd6d3cebfc3d903c8a6e89078307c7e0":
    "id": "cd6d3cebfc3d903c8a6e89078307c7e0"
    "title": "Amazon OpenSearch Memory is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-memory-generally-available/"
    "published": "2026-11-19 06:09:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Today, AWS announced the general availability of Amazon OpenSearch Memory, a new serverless capability in Amazon OpenSearch Service for adding persistent memory to AI agents. OpenSearch Memory stores agent interactions as searchable events, derives useful memories, and retrieves relevant context across sessions, so agents can recall prior decisions, earlier interactions, and user preferences without replaying the full conversation history to the model. Customers can give agents long-term memory without provisioning infrastructure or building separate extraction, indexing, consolidation, and retrieval systems.</p> \n<p>OpenSearch Memory stores the original events verbatim, makes them searchable within seconds, and asynchronously derives structured memories. It manages the full memory lifecycle, including extraction, embedding, indexing, consolidation (adding, updating, or skipping memories as new information arrives), and retrieval using keyword, semantic, and hybrid search. Customers control access with AWS Identity and Access Management (IAM) for each memory store, with actor and session scoping, and can set expiration periods for events and memories. Because it is serverless, there are no clusters to provision, instance types to choose, or indexes to create, and capacity for extraction and search scales automatically.</p> \n<p>Amazon OpenSearch Memory is available today in US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt), and Asia Pacific (Tokyo) Regions. For pricing details about Amazon OpenSearch Memory, visit the <a href=\"https://aws.amazon.com/opensearch-service/pricing/\">pricing page</a>.</p> \n<p>To learn more about Amazon OpenSearch Memory, see the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/memory.html\">technical documentation</a> and <a href=\"https://aws.amazon.com/blogs/big-data/introducing-amazon-opensearch-memory-persistent-memory-for-ai-agents/\">launch blog</a>. You can get started by visiting the technical launch blog that details how to add persistent memory to your agents with Amazon OpenSearch Memory.&nbsp;</p>"
  "1ab52daee5d7715c5feeade510775614":
    "id": "1ab52daee5d7715c5feeade510775614"
    "title": "Amazon SageMaker AI now supports cross-Region inference routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-cross-region-routing/"
    "published": "2026-11-19 05:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Today, Amazon SageMaker AI announces cross-Region inference routing, which helps keep inference applications available when a region runs short of capacity by sending requests to endpoints deployed in other AWS Regions and AWS accounts. Models served on accelerated instances can reach capacity limits in a single Region, and an unhealthy endpoint can lead to throttling and errors for end users. Previously, teams had to build and maintain their own routing, health checks, and retry logic across Regions.<br /> <br /> With cross-Region inference routing in SageMaker AI, developers create an inference router, register the real-time endpoints, asynchronous endpoints, and inference components they already run, and point their applications at the router. The router prefers endpoints in its own Region, shifts new requests to healthy destinations in other Regions as errors rise, and returns traffic gradually after the local endpoint recovers. Existing endpoints, models, and containers do not change. Endpoint owners stay in control: an endpoint policy determines which routers in other accounts can use an endpoint, and an optional cross-Region traffic cap reserves capacity for the endpoint’s local callers. Each real-time response identifies the endpoint that served the request and the reason, and router metrics in Amazon CloudWatch show where traffic went.<br /> <br /> Cross-Region inference routing is available for real-time inference in 32 commercial AWS Regions, and for asynchronous inference in 25 Regions. There is no additional charge for cross-Region inference routing. Customers pay standard SageMaker AI pricing for the endpoints that serve requests and standard Amazon CloudWatch rates for router metrics. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/inference-router.html\">Amazon SageMaker AI Developer Guide</a> and <a href=\"https://aws.amazon.com/sagemaker/ai/deploy/\">SageMaker AI Deployment page</a>.</p>"
  "abecebadc1d3e6a305015663022295ea":
    "id": "abecebadc1d3e6a305015663022295ea"
    "title": "Introducing the Apache Spark Optimization Agent for AWS Glue ETL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/apache-spark-aws-glue-etl/"
    "published": "2026-11-19 05:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>AWS Glue ETL now offers the Apache Spark Optimization Agent, which analyzes completed Spark job runs and delivers cost and performance optimization recommendations within minutes. You can select a cost or performance goal, and the agent returns specific configuration changes with the telemetry evidence and reasoning behind each suggestion. You can use the agent on any completed job run from the AWS Glue console, or from your own tools through the Amazon SageMaker Unified Studio MCP Server.</p> \n<p>The agent takes the job's configuration, logs, and Spark telemetry together with your chosen goal and returns recommendations computed by a deterministic recommendation engine. The engine reads all job artifacts together to identify what is driving runtime and cost: too little parallelism, a skewed join key, memory pressure forcing spill, idle executors, or capacity provisioned beyond what the job uses. When cost and performance trade off, the agent improves the metric you chose while keeping any regression of the other within defined limits. The engine also checks best practices such as platform-level improvements like upgrading to a newer AWS Glue version or using AWS Graviton processors. Each recommendation is labeled by the area it modifies: infrastructure, Spark configuration, code, or data layout. All access is authenticated with AWS Identity and Access Management (IAM) and logged in AWS CloudTrail.</p> \n<p>The Apache Spark Optimization Agent is available at no additional charge for AWS Glue versions 4.0 and later in all Regions where AWS Glue is available, except the AWS GovCloud (US) and China Regions. To get started, see <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-optimization-agent.html\">Apache Spark Optimization Agent for Amazon EMR and AWS Glue</a> and the blog post - <a href=\"https://aws.amazon.com/blogs/big-data/introducing-the-apache-spark-optimization-agent-for-amazon-emr-serverless-and-aws-glue-etl/\">Introducing the Apache Spark optimization agent for Amazon EMR Serverless and AWS Glue ETL</a>.</p>"
  "07717c28a7af9011734f54e30c25c670":
    "id": "07717c28a7af9011734f54e30c25c670"
    "title": "AWS announces ExtendDB 1.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-extenddb-1-0/"
    "published": "2026-11-19 05:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Today, Amazon Web Services (AWS) announced version 1.0 of ExtendDB, the first release of the open source Amazon DynamoDB-compatible adapter for production use. ExtendDB is fully compatible with the DynamoDB API and runs on a database backend that you choose, so developers and infrastructure teams can run DynamoDB workloads in on-premises data centers, in private or public clouds, and at the edge without rewriting application code.</p> \n<p>ExtendDB 1.0 supports four storage backends, PostgreSQL, SQLite, Cassandra, and MongoDB. For local development and continuous integration (CI), the <a href=\"https://hub.docker.com/r/extenddb/extenddb-dev\">extenddb-dev container image</a> and the <a href=\"https://www.npmjs.com/package/@extenddb/dev\">@extenddb/dev npm</a> package run a DynamoDB-compatible endpoint over SQLite, so you don’t have to set up an external database.</p> \n<p>ExtendDB is maintained by AWS, released under the Apache 2.0 license, and developed in the open on GitHub. To learn more, see the <a href=\"https://extenddb.org\">ExtendDB project page</a>. To get started or contribute, visit the <a href=\"https://github.com/ExtendDB/extenddb\">GitHub repository</a>.</p>"
  "133db0e8dd869af77ad5c1737d69124c":
    "id": "133db0e8dd869af77ad5c1737d69124c"
    "title": "AWS Transform custom now supports cross-account sharing of transformation definitions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-custom-cross-account-td/"
    "published": "2026-11-19 04:30:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>AWS Transform custom now enables you to share transformation definitions (TDs) and their associated lessons across AWS accounts, organizational units (OUs), or your entire organization in AWS Organizations through AWS Resource Access Manager (AWS RAM). AWS Transform custom is a capability of AWS Transform that performs transformations across your technology stack, including API and framework upgrades, migrations, and language translations.</p> \n<p>With this launch, you can share TDs as live resources rather than static copies, so consumers run the owner's latest published version by default while the owner maintains full control. As the TD owner, you select from four managed permissions ranging from execute-only (the default) to permissions that allow consumers to use your lessons, contribute lessons back to you, or download the TD. Lessons flow back to the owner only when the permission allows it and the consumer opts in.</p> \n<p>This capability is particularly valuable for platform engineering teams and AWS Partners who need to deploy standardized transformations across multiple accounts. A central team can create a TD once and share it organization-wide.</p> \n<p>This feature is available via the AWS Transform CLI and AWS RAM in US East (N. Virginia), Europe (Frankfurt), Europe (London), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Canada (Central) Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom-sharing.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform User Guide</a>.</p>"
  "531dcb25b7d82b59ae59c2705e50142d":
    "id": "531dcb25b7d82b59ae59c2705e50142d"
    "title": "Amazon CloudFront standard logging now supports CMCD and additional log fields"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-standard-logging-cmcd-fields"
    "published": "2026-11-19 04:28:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon CloudFront standard logging now supports additional access log fields that were previously available only in CloudFront real-time logs. You can now include these fields in your standard logs and deliver them to Amazon S3, Amazon CloudWatch Logs, or Amazon Data Firehose, without setting up an additional data stream for real-time logs.</p> \n<p>The new fields include the IP address of the CloudFront server that handled the request, identifiers that separate traffic on a primary distribution from traffic on a staging distribution, and a media quality confidence score. They also include Common Media Client Data (CMCD) fields, which video players send with each request to report details like bitrate, buffer length, and playback session ID. Streaming teams can use these fields to match playback problems that viewers see with CloudFront delivery data, which makes troubleshooting faster.</p> \n<p>These fields are available in all CloudFront edge locations, and standard logging pricing applies. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/standard-logging.html\">Standard logging page in the Amazon CloudFront Developer Guide</a>.</p>"
  "e6723aad5babca6af559a54a1d2dc65f":
    "id": "e6723aad5babca6af559a54a1d2dc65f"
    "title": "Amazon CloudFront Announces WebSocket and gRPC Support for Origin Mutual TLS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cloudfront-origin-mtls-websockets-grpc/"
    "published": "2026-11-19 03:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon CloudFront (CF) now supports WebSocket and gRPC traffic to application origins in AWS regions, with mutual TLS authentication between CF and the application origin (origin mTLS). Customers can now use TLS certificates to authenticate requests from CloudFront while setting up WebSocket or gRPC connections to their origins. Origin mTLS protects internet facing applications that need persistent, bidirectional or streaming connections, such as chat platforms, collaborative editing tools or live dashboards from unauthenticated requests.</p> \n<p>Previously, customers serving WebSocket or gRPC traffic through CloudFront had to use shared secrets or IP allow-lists to identify requests originating from CloudFront. This was operationally complex and did not provide strong authentication. With Origin mTLS, customers can use one TLS based authentication for HTTP, WebSocket and gRPC traffic to an application origin. This works with application origins within AWS such as Application Load Balancer and API Gateway, on-premises origins, and origins hosted outside AWS.</p> \n<p>There is no additional charge for origin mTLS, and it is available with pay-as-you-go pricing and in the Business and Premium flat-rate pricing plans. To learn more, visit the CloudFront <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-mtls-authentication.html\">origin mutual TLS documentation</a>.</p>"
  "3898b80737ba338fd85033dadac7b292":
    "id": "3898b80737ba338fd85033dadac7b292"
    "title": "AWS Lambda adds support for GPU instances on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-gpu-managed-instances/"
    "published": "2026-11-19 03:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>AWS Lambda now supports GPU-accelerated <a href=\"https://aws.amazon.com/lambda/lambda-functions/\">Event Functions</a> on <a href=\"https://aws.amazon.com/lambda/lambda-managed-instances/\">Lambda Managed Instances</a> using <a href=\"https://aws.amazon.com/ec2/instance-types/accelerated-computing/\">EC2 G-series instances</a>. You can now run GPU-accelerated workloads including AI&nbsp;inference, media processing, 3D rendering, scientific computing, and financial simulations on Lambda without managing&nbsp;GPU drivers, frameworks, or scaling. Lambda runs multiple invocations concurrently in each execution environment and scales responsively based on GPU utilization, CPU utilization, and concurrency to keep your GPUs busy&nbsp;and reduce costs. GPU-accelerated functions integrate with the same 200+ AWS event sources as other&nbsp;Event Functions, so you can add GPU compute as another step in your serverless application.</p> \n<p>Running GPU workloads today requires customers to provision hardware, manage&nbsp;driver and framework dependencies, and build custom scaling and capacity management. With this launch, you can go from code to a running GPU workload in minutes. Lambda provides GPU base images preconfigured with frameworks such as&nbsp;vLLM, SGLang, and PyTorch.&nbsp;You can run workloads with large artifacts using container images and NVMe ephemeral storage of up to 32 GB each. To reduce startup time, Lambda supports <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-seekable-oci.html\">Seekable OCI (SOCI) lazy loading</a> and streaming artifacts directly from Amazon S3.&nbsp;For resilience, you can select G-series instance types from multiple generations in the allowed instance types for your capacity provider. Lambda provisions instances from the newest generation that meets your function requirements and falls back to older generations when capacity is unavailable.</p> \n<p>GPU-accelerated Event Functions on Lambda Managed Instances is available in all <a href=\"https://builder.aws.com/build/capabilities\">AWS Commercial Regions</a> where Lambda Managed Instances and EC2 G-series instances are available. You can configure GPU-accelerated functions using the AWS Console, AWS CLI, AWS SDKs,&nbsp;AWS CloudFormation, AWS CDK, or AWS SAM.&nbsp;You can also use this feature through&nbsp;coding assistants such as Kiro, Claude Code, or Codex by installing the Lambda Managed Instances skill&nbsp;from the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html#agent-setup-additional-lambda-skills\">Agent Toolkit for AWS</a>. You pay the EC2 On-Demand price&nbsp;(Savings Plans and Reserved Instances apply)&nbsp;for your instance, plus a 9.75% Lambda management fee and $0.20 per million requests. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-gpu.html\">AWS Lambda Developer Guide</a> and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda Pricing</a>.</p>"
  "b93e8db681fbf9130f01f76de8e7324d":
    "id": "b93e8db681fbf9130f01f76de8e7324d"
    "title": "Amazon RDS for MySQL now supports MySQL major version 9.7"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-mysql-974-available/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Starting today, Amazon RDS for MySQL supports MySQL major version 9.7, the latest Long-Term Support release from MySQL community. Amazon RDS for MySQL 9.7 launches with community MySQL 9.7.4. This launch introduces support for the Replication Applier Metrics component, JSON Duality Views, and Hypergraph Optimizer. &nbsp;</p> \n<p>The Replication Applier Metrics help you diagnose replication lag by adding two Performance Schema tables that report per-channel applier backlog, throughput, and wait statistics, along with each worker's progress on its current transaction. JSON Duality Views let applications read and write the same relational tables as JSON documents. The Hypergraph Optimizer is an opt-in query optimizer that can improve execution plans for complex, multi-join queries. For more details, refer to the <a href=\"https://dev.mysql.com/doc/relnotes/mysql/9.7/en/news-9-7-4.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL 9.7.4 release notes</a> and the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MySQL release notes</a>.</p> \n<p>You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. Learn more about performing version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MySQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS User Guide</a>. This release is supported in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RegionsAndAvailabilityZones.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Amazon RDS for MySQL is available. Learn more about pricing details at <a href=\"https://aws.amazon.com/rds/mysql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MySQL pricing</a>.</p> \n<p>Amazon RDS for MySQL makes it simple to set up, operate, and scale MySQL deployments in the cloud. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (AWS CLI).</p>"
  "8108612e1f98b0edbc8ded99ad145a2a":
    "id": "8108612e1f98b0edbc8ded99ad145a2a"
    "title": "Amazon EKS Hybrid Nodes reduces price for large hosts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-eks-hybrid-nodes-pricing-change/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon&nbsp;Elastic Kubernetes Service (Amazon EKS) Hybrid Nodes now has lower pricing for large nodes, capping the billed vCPU per node at 32 vCPU, so you are no longer charged for vCPUs above that per node threshold. Amazon EKS Hybrid Nodes lets you use your existing on-premises and edge infrastructure as nodes in Amazon EKS clusters. You can now use your largest servers, including those with GPUs, with Amazon EKS Hybrid Nodes at lower cost.</p> \n<p>With this change, the Amazon EKS Hybrid Nodes cost of a large server no longer grows with its vCPU count. At the first pricing tier, a 64 vCPU node now costs 50% less than before, and a 256 vCPU node costs 88% less, as both are now billed only for 32 vCPUs. This makes Amazon EKS Hybrid Nodes more cost-effective for large bare-metal and GPU servers running compute-intensive workloads, such as AI/ML training and inference, that must stay on-premises for data residency, latency, or regulatory reasons. The pricing change applies automatically to all new hybrid nodes. For the new pricing to take effect for existing hybrid nodes attached to clusters, delete and reattach them. Nodes with 32 vCPUs or fewer are still billed for their actual vCPUs, and existing tiered pricing still applies, so your effective rate falls as monthly usage grows.</p> \n<p>The new pricing is available in all AWS Regions where Amazon EKS Hybrid Nodes is available. To learn more about getting started and updated pricing details, visit the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/hybrid-nodes-overview.html\">Amazon EKS Hybrid Nodes documentation</a> and <a href=\"https://aws.amazon.com/eks/pricing/\">Amazon EKS pricing page</a>.</p>"
  "846c7ada6c354653294b09bb2a93c815":
    "id": "846c7ada6c354653294b09bb2a93c815"
    "title": "Amazon CloudFront Functions now supports network calls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-functions-network-calls/"
    "published": "2026-11-19 01:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon CloudFront Functions can now make network calls and act on the response during a request. CloudFront Functions runs lightweight JavaScript at CloudFront edge locations to customize requests and responses. Previously, if your logic depended on data from another service, you had to use Lambda@Edge or move that logic to your origin. Now your functions can use real-time data to personalize, authenticate, or route requests at the edge, close to your viewers.</p> \n<p>With the new <i>cf.fetch()</i> method, your functions can call your API endpoints and use the response to decide how to handle each request. For example, you can check an AI agent's permissions and usage budget so that only authorized requests reach your API or MCP server, or send request signals to a security or fraud detection service to block or challenge bad traffic. With <i>cf.beacon()</i>, you can send analytics events in the background without slowing down viewers, even for content served from cache. Both methods take advantage of the origin settings already on your distribution, including origin access control (OAC), VPC origins, and connection reuse.</p> \n<p>Network calls are available at all CloudFront edge locations. They cost $0.10 per million calls, on top of CloudFront Functions invocation charges, and are included at no additional cost in the Pro plan and above in CloudFront flat-rate plans. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/helper-functions-network-calls.html\" rel=\"noopener noreferrer\" target=\"_blank\">Helper methods for network calls</a> in the <i>Amazon CloudFront Developer Guide</i> and <a href=\"https://aws.amazon.com/cloudfront/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudFront pricing</a>.</p>"
  "89e2686869106d0d9431a3fb277b009e":
    "id": "89e2686869106d0d9431a3fb277b009e"
    "title": "AWS Clean Rooms supports writing PySpark job results to intermediate tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-clean-rooms-pyspark-intermediate-table"
    "published": "2026-11-19 00:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>AWS Clean Rooms now supports <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/create-intermediate-table.html\" rel=\"noopener noreferrer\" target=\"_blank\">intermediate tables for PySpark jobs</a>, offering increased flexibility for organizations running complex, multi-step analytical workflows with their partners. With this launch, customers can write the results of a PySpark job to an intermediate table for reuse in subsequent analyses.&nbsp;For example, a measurement vendor can perform feature engineering with PySpark, then use those results as input into an ML model training job to identify new high-value customers to inform audience targeting and bid optimization for their campaigns. &nbsp;</p> \n<p>AWS Clean Rooms helps companies and their partners easily analyze and collaborate on their collective datasets without revealing or copying one another’s underlying data. For more information about the AWS Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Clean Rooms</a>.</p> \n<p>&nbsp;</p>"
  "851aba01ca875d8b3281e4ed84e90dce":
    "id": "851aba01ca875d8b3281e4ed84e90dce"
    "title": "AWS Lambda now supports customer-managed runtimes, giving platform teams centralized control over runtime contents and updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-customer-managed-runtimes/"
    "published": "2026-11-19 00:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>AWS Lambda now supports customer-managed runtimes for Lambda Event Functions (formerly Lambda functions). Customer-managed runtimes are a standalone resource type that fully decouples runtime management from function deployment. Platform teams gain centralized control over the runtime contents,&nbsp;updates, access, and lifecycle, including the ability to push updates to shared components without per-function redeployments. Application teams consume the runtime from their functions in the same way as a Lambda-managed runtime, preserving their familiar developer experience.</p> \n<p>Many organizations require every function to include approved components, such as SDKs, certificates, and security or monitoring tools. Previously, sharing these through Lambda Layers or container images meant redeploying every function to pick up a change. With customer-managed runtimes, platform teams manage these components in a central runtime, packaged as OCI container images in Amazon ECR and compatible with existing Docker and CI/CD tooling. Functions pick up updates automatically as Lambda recycles execution environments, so there's no need to redeploy each function or coordinate rollouts. Updates can be scheduled and staged to match change control policies, with centralized health metrics and rapid rollback. With this launch, the existing custom runtimes feature is renamed \"bring your own language.\"</p> \n<p>AWS Lambda customer-managed runtimes is now generally available in all commercial AWS Regions. There is no additional charge for customer-managed runtimes; functions are billed at standard Lambda rates and standard Amazon ECR pricing applies to runtime images.</p> \n<p>To get started, build your runtime as a container image in Amazon ECR, starting from a Lambda base image or from scratch, then create a runtime, a version, and an alias. Application teams reference the runtime alias in their function configuration and keep deploying their code as .zip files. Share runtimes with other accounts or an AWS Organization by using a resource-based policy. You can create and manage customer-managed runtimes using the AWS CLI, AWS SDKs, CloudFormation, or AWS CDK. To learn more, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/runtimes-customer-managed.html\" rel=\"noopener noreferrer\" target=\"_blank\">customer-managed runtimes documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/control-your-aws-lambda-runtimes-with-customer-managed-runtimes/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog post</a>.</p>"
  "782b7b89efa7f6f02576f3806aa0ab16":
    "id": "782b7b89efa7f6f02576f3806aa0ab16"
    "title": "AWS Marketplace now supports buyer contact sharing at subscription"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/marketplace-buyer-contact-sharing/"
    "published": "2026-11-19 22:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p><a href=\"https://aws.amazon.com/marketplace\">AWS Marketplace</a> now supports buyer contact sharing. When customers subscribe to a third-party product, they can share their contact information with the seller. This helps sellers onboard new customers, send deployment guides and setup instructions, provide technical support, and share product updates from the start of the subscription.</p> \n<p>Customers share their first name, last name, email address, company name, and country or region in the deployment contact information section of the AWS Marketplace procurement page. AWS Marketplace pre-fills this section from the customer's previous purchases, <a href=\"https://aws.amazon.com/profile\">AWS Profile</a>, or AWS account details where available, so customers don't need to enter it again for each subscription. Customers can complete or edit any field before they subscribe, and view what they shared on the agreement details page in the AWS Marketplace console.</p> \n<p>Sellers can view the customer's contact information on the agreement details page in AWS Partner Central, or retrieve it with the new <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/API_marketplace-agreements_GetAgreementContacts.html\" rel=\"noopener noreferrer\" target=\"_blank\">GetAgreementContacts API</a> to bring it into their onboarding and support workflows. Sellers of software as a service (SaaS) products can call the API to pre-fill their registration page, so customers confirm their details instead of entering them again. This capability is available in all commercial AWS Regions where AWS Marketplace is available.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/buyer-sharing-contact-information.html\" rel=\"noopener noreferrer\" target=\"_blank\">Sharing your contact information</a> at subscription in the AWS Marketplace Buyer Guide and <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/receiving-buyer-contact-information.html\" rel=\"noopener noreferrer\" target=\"_blank\">Receiving buyer contact information</a> in the AWS Marketplace Seller Guide.</p>"
  "209c780140cc191c030bce4cfcdbb4dd":
    "id": "209c780140cc191c030bce4cfcdbb4dd"
    "title": "AWS Systems Manager Parameter Store raises API throughput limits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/parameter-store-raises-api-throughput-limits/"
    "published": "2026-11-19 18:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p>AWS Systems Manager <a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html\">Parameter Store</a>&nbsp;has increased the default throughput limits for five API operations. For accounts that have turned on the higher throughput setting, the quotas have changed as follows, in transactions per second (TPS):</p> \n<ul> \n <li>GetParametersByPath (from 100 to 500 TPS)</li> \n <li>PutParameter (10 to 50)</li> \n <li>DeleteParameter (5 to 50)</li> \n <li>DescribeParameters (10 to 100)</li> \n <li>GetParameterHistory (10 to 100)</li> \n</ul> \n<p>Parameter Store provides powerful, hierarchical storage for configuration data. The higher quotas give more headroom to workloads that call these operations in bursts. Examples include applications that load configuration by path when many AWS Lambda functions start at once, infrastructure as code deployments that create or update many parameters, and cleanup jobs that bulk-delete stale parameters.</p>"
  "2631d07bf0438e4c55750d2eeaaf7bf6":
    "id": "2631d07bf0438e4c55750d2eeaaf7bf6"
    "title": "AWS Transform supports optimized storage for server migration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-optimized-storage/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p>AWS Transform for migrations now recommends the optimized storage type and configuration for every server you migrate, so you no longer do it server by server. Building on <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/assess-and-migrate-storage-to-the-cloud-with-aws-transform/\" rel=\"noopener noreferrer\" target=\"_blank\">recent storage assessment capabilities</a>, AWS Transform's recommendations use each server's observed performance and capacity data to reduce overprovisioning costs and avoid performance issues after cutover. You see the expected cost before you migrate, and AWS Transform applies the approved settings automatically at launch.</p> \n<p>Recommendations cover Amazon EBS and Amazon FSx for NetApp ONTAP. For FSx for NetApp ONTAP, they include the file system layout and sizing. You choose whether to optimize for cost or for performance, and recommendations stay consistent from assessment through launch.</p> \n<p>This capability is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where AWS Transform for migrations is available</a>. </p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-migrate-servers.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform user guide</a>.</p>"
  "59d5284c901551797104cb7370000cf2":
    "id": "59d5284c901551797104cb7370000cf2"
    "title": "AWS Marketplace now supports buyer approval workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/marketplace-buyer-approvals/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p>Today, AWS Marketplace announces the general availability of buyer approvals. This lets you decide which AWS Marketplace purchases need sign-off, who approves them, and where approval happens. You can define buying policies for the conditions that matter to you, such as purchase amount, product type, pricing, and whether an offer is public or private. Additionally, you can choose to route each purchase request to the right place: the AWS Marketplace console, a chain of approvers by email, or your procurement system in Coupa or SAP Ariba.</p>\n<p>When you route approvals by email, procurement, finance, legal, and cloud governance teams can approve requests without needing to sign into the AWS console. They see the product, price, terms, and can approve right from their email. For example, you can route large software commitments to Coupa or SAP Ariba for review, send mid-size purchases to multiple approvers by email, and let low-cost or pay-as-you-go purchases go through without approval. When a purchase is routed to your procurement system, it follows your existing approval flows and gets a dedicated purchase order for cleaner spend tracking and reconciliation.</p>\n<p>With AWS Marketplace, customers can already choose which subset of available products their teams can buy, track each purchase with purchase orders, and require their employees to enter a purchase order when buying. Now, with buyer approvals, you can also control how each purchase is approved before making a financial commitment.</p>\n<p>Customers can now create buying policies and approvals in all AWS Marketplace commercial Regions. To get started, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/buying-policies.html\" target=\"_blank\">AWS Marketplace Buyer Guide</a>.</p>"
  "09c10687f1add519fd618c7ea1fd4ba9":
    "id": "09c10687f1add519fd618c7ea1fd4ba9"
    "title": "Amazon Connect Customer enables Cases by default for new instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-cases-enabled-by-default/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p>Amazon Connect Customer enables Cases by default for new instances, so operations teams can start tracking and resolving customer issues on day one without any setup work. New instances come with Cases connected to rules for setting SLAs, Customer Profiles for personalizing customer experiences, and Amazon EventBridge for triggering actions in other business applications when a case is updated.</p> \n<p>Administrators of existing instances can enable these integrations with one click in the AWS Management Console. Newly added case fields sync automatically, so admins don't have to update integrations each time they create fields.</p> \n<p>Cases is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/enable-cases.html#configure-cases-integrations\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "684dc1684062baffbe6d45efe3742107":
    "id": "684dc1684062baffbe6d45efe3742107"
    "title": "AWS Transform automates source and migration target actions to accelerate cutover"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-automates-source-actions/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p>AWS Transform now automates the tasks that prepare and validate your servers during a migration, before they move and after they launch on AWS. AWS Transform is the agentic AI service that speeds up cloud migration, application modernization, and continuous tech debt reduction. With the new source actions capability, you can create actions and run them securely on your source servers at the right point in the migration, from the early stages through cutover. Post-launch actions complement this by automatically configuring and validating each workload as soon as it launches on AWS.</p> \n<p>Cutover preparation and validation are often manual, time-consuming tasks in large-scale migrations. Traditionally, migration teams log in to each source server to stop services and freeze database writes before shutdown, and then check connectivity, application health, and monitoring on each server after it launches.</p> \n<p>With source actions in AWS Transform, you define each action once, run it in bulk on the servers and waves you choose, and reuse it across accounts and migrations. AWS Transform manages these actions centrally, so you can reuse them across accounts and migrations instead of rebuilding them each time. You can monitor the status of each action and confirm your go/no-go decision before moving to the next step. Source preparation and post-launch actions are now part of the migration plan itself, so you no longer have to coordinate and run these activities by hand.</p> \n<p>This capability is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where AWS Transform for migrations is available</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-vmware.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform documentation</a> or visit the <a href=\"https://aws.amazon.com/transform/migrations/\">AWS Transform product page</a>.</p>"
  "efb18c5733222a02516f5b9f440bb149":
    "id": "efb18c5733222a02516f5b9f440bb149"
    "title": "AWS Revenue Measurement now supports closed-source models in Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/revenue-measurement-bedrock/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Revenue Measurement (previously Partner Revenue Measurement) provides measurement of AWS consumption driven by Partner solutions. Today, AWS announces expanded Amazon Bedrock support in AWS Revenue Measurement. Partners can now gain attributed revenue visibility for their solutions' use of closed-source models in Amazon Bedrock, giving them a more complete view of the revenue their solutions drive.</p> \n<p>Until now, only Amazon models (such as Amazon Nova) and open-weight models in Amazon Bedrock were included in AWS Revenue Measurement. With this update, attributed revenue for Amazon Bedrock reflects the total Bedrock charges, including closed-source model usage. Partners who already use Resource Tagging, User Agent string, Identity Tagging, or SaaS Account Tagging for Amazon Bedrock automatically benefit from the expanded coverage, with no additional implementation needed.</p> \n<p>AWS Revenue Measurement is generally available in all commercial regions. To learn more, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/bedrock-best-practices.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock best practices</a> in the AWS Revenue Measurement onboarding guide.</p>"
  "c5e85cccba889534cb9388c405fffce5":
    "id": "c5e85cccba889534cb9388c405fffce5"
    "title": "AWS Revenue Measurement now supports Identity Tagging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/revenue-measurement-identity-tagging/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Revenue Measurement (previously Partner Revenue Measurement) provides measurement of AWS consumption driven by Partner solutions. Today, AWS announces Identity Tagging in AWS Revenue Measurement, a new way for Partners to get attributed revenue visibility for the AWS usage their solutions drive. Partners can now tag the IAM user or role their solution uses instead of tagging individual resources or decorating individual SDK/API calls. This makes attribution simpler and needs no code changes.</p> \n<p>Until now, Partners using Resource Tagging had to apply tags to each resource their solution created or managed. That could be hard to keep consistent across customer environments. With Identity Tagging, Partners apply a tag to the IAM role or user their solution uses in the AWS account. AWS Revenue Measurement then attributes usage from resources created by that identity to the Partner's product. Identity Tagging works alongside existing methods such as Resource Tagging, User Agent string, and SaaS Account Tagging, so Partners can pick the method that best fits their architecture.</p> \n<p>AWS Revenue Measurement is generally available in all commercial regions. To learn more, review the AWS Revenue Measurement <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">onboarding guide</a>.</p>"
  "25e08e137de73a43bb3dcf8ab413427f":
    "id": "25e08e137de73a43bb3dcf8ab413427f"
    "title": "Amazon WorkSpaces now lets developers enable Nested Virtualization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/workspaces-nested-virtualization/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Developers on Amazon WorkSpaces Personal can now turn on Nested Virtualization for their own WorkSpaces from the Windows WorkSpaces client, without asking an administrator to make each change. Once an administrator grants self-service permission for the directory, developers can run Docker Desktop, Windows Subsystem for Linux (WSL2), and Android emulators directly on their WorkSpaces.</p> \n<p>Administrators can now grant a directory-level self-service permission for Nested Virtualization. Once granted, end users can turn the setting on or off for their own Windows WorkSpace from the WorkSpaces client. Administrators keep control because the permission is set per directory.</p> \n<p>Self-service is supported on WorkSpaces Personal, using the Desktop Cloud Visualization (DCV) protocol, on Standard bundles and higher. Power (4 vCPU) or higher is recommended. Value and Graphics bundles are not supported. Nested virtualization is available in all AWS Regions where Amazon WorkSpaces is available, excluding the China (Ningxia) Region. There is no additional charge for supported bundles. For more information, visit the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/nested-virtualization.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon WorkSpaces documentation on Nested Virtualization</a>. For pricing, visit the <a href=\"https://aws.amazon.com/workspaces/pricing/\">Amazon WorkSpaces pricing page</a>.</p>"
  "c9e5da737177b1d0efd1bfedab1ba839":
    "id": "c9e5da737177b1d0efd1bfedab1ba839"
    "title": "Amazon Aurora DSQL now supports PL/pgSQL functions and procedures"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-plpgsql-support/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\" target=\"_blank\">Amazon Aurora DSQL</a> now supports PL/pgSQL, enabling developers to create and execute stored functions and procedures directly in the database. Amazon Aurora DSQL is a serverless, distributed SQL database designed for applications requiring active-active availability across multiple AWS Regions with fast reads and writes. You can now encapsulate procedural programming constructs such as IF/ELSE statements, loops, and variable assignments alongside SQL operations within the database.</p>\n<p>PL/pgSQL support reduces network round trips and improves application performance for data validation workflows, complex calculations, and transactional operations requiring multiple steps. Financial applications can implement account transfer procedures that validate balances, update multiple tables, and handle error conditions within a single database function.</p>\n<p>PL/pgSQL support is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a> where Aurora DSQL is available. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-plpgsql.html\" target=\"_blank\">PL/pgSQL</a> in the Aurora DSQL User Guide.</p>"
  "a06a830f332c7da3bcd6dd3c65593694":
    "id": "a06a830f332c7da3bcd6dd3c65593694"
    "title": "AWS Data Competency adds Open Data and Interoperability category for Software Partners"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/data-competency-open-data-category/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces the Open Data and Interoperability category within the AWS Data Competency. The new category recognizes AWS Software Partners whose solutions keep customer data open and under customer control, letting multiple analytics engines and AI agents work on a single shared copy without moving or duplicating data.</p>\n<p>AI agents need current, governed data they can reach. According to Gartner, Inc., most organizations are prioritizing AI-ready data investments, yet many Chief Data and Analytics Officers report their current data architecture needs modernization.</p>\n<p>Partners in the Open Data and Interoperability category are validated for the following capabilities:</p>\n<p>- Open formats: Data stored in Apache Iceberg, readable by any tool.<br /> <br />- Interoperable storage: One copy of data on AWS.<br /> <br />- Bidirectional catalogs: Metadata synced through the Iceberg REST Catalog.<br /> <br />- Interchangeable engines: Customers pick the right engine for each job.</p>\n<p>AWS Data Competency Partners also earn performance-based benefits including additional marketing and deal funding in 2027 and access to the AWS Data and AI Workshop.</p>\n<p>Customers now have a trusted way to find Software Partners whose solutions are built from the ground up for openness and interoperability, and those Partners gain a clear way to stand out.</p>\n<p>To learn more, read the <a href=\"https://aws.amazon.com/blogs/apn/new-categories-and-benefits-for-aws-data-competency-partners/\" target=\"_blank\">APN Blog</a> or visit the <a href=\"https://aws.amazon.com/big-data/datalakes-and-analytics/partner-solutions/\">AWS Data Competency page</a>.</p>"
  "638d742a46faabafbfe6c0516c2488e9":
    "id": "638d742a46faabafbfe6c0516c2488e9"
    "title": "AWS Partner Central Agents now guide higher-quality co-sell submissions and explain co-sell motions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-central-agents-guide-high-quality-opp"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces that AWS Partner Central Agents now guide AWS Partners to create and enrich opportunities for a high-quality submission, and explain the assigned co-sell motion of each opportunity and why AWS assigned it. Since the launch of <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/06/accelerate-co-selling-with-agents/\">Agentic co-selling</a> on June 16, 2026, AWS Partner Central Agents score every opportunity with an Opportunity Quality Score and assign co-sell motions including AWS Field-engaged, Agent-engaged, or Partner-led.</p> \n<p>When partners create an opportunity, the agents now guide them to a high-quality submission by asking for the details the Opportunity Quality Score measures, such as the customer's business problem, dated next steps, the Partner Primary Need from AWS, and the AWS services the customer will adopt, based on the <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/co-sell-engagement.html#cosell-best-practices\">co-selling best-practice guidance</a>. After submission, the agents explain the reason behind each opportunity's co-sell motion and why AWS assigned it. Where the partner can act, the agents recommend the next step: for Agent-engaged opportunities, how to raise the Opportunity Quality Score; for Partner-led opportunities where AWS co-sell support was not requested, how to progress using agents. As partners act on these recommendations, the score and motion recalculate, and Agent-engaged opportunities move closer to AWS Field-engaged.</p> \n<p>The new enhanced experience is available today to AWS Partners in the US East (N. Virginia) Region. Partners can also use the agentic experience in native AI tools like AWS Quick and Kiro, or through MCP in their own CRM. To get started, partners sign in to <a href=\"https://aws.amazon.com/partners/partner-central/\">AWS Partner Central</a> and open opportunity management. To learn more, see <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/co-sell-engagement.html\">Agentic Co-sell engagement</a> and the <a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/partner-central-mcp-server.html\">AWS Partner Central Agents MCP</a> guide.</p>"
  "07af236d50a80460f7f33a5581ef2057":
    "id": "07af236d50a80460f7f33a5581ef2057"
    "title": "Amazon EC2 launches performance status checks and new utilization metrics for EC2 Detailed Monitoring"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/ec2-performance-status-checks/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Customers can now use Amazon EC2 performance status checks and new utilization metrics for EC2 Detailed Monitoring to observe and act on the performance of their EC2 workloads without setup within the instance, complementing their in-guest tooling. Customers running performance-sensitive EC2 workloads can use these signals to monitor their CPU and GPU resources, tune capacity needs, and troubleshoot application issues.</p> \n<p>EC2 performance status checks identify nonterminal hardware conditions that impact performance on accelerated computing instances. These checks also recommend an action, such as rebooting to complete GPU memory row remapping without replacing the instance. The additions to Detailed Monitoring include support for OpenTelemetry metrics, one-minute GPU metrics that help teams tune accelerated workloads, and a new, higher resolution 10-second CPU utilization metric that helps customers size and scale compute capacity using EC2 Auto Scaling. Customers can selectively opt into these new metrics using categories that they can easily apply to their instances across their fleet. Together, these new capabilities make it easier for customers to manage their compute resources.</p> \n<p>EC2 performance status checks are available at no additional charge. EC2 Detailed Monitoring metrics are opt-in and incur standard CloudWatch charges for EC2 Detailed Monitoring. These capabilities are available in all commercial AWS Regions and the AWS GovCloud (US) Regions.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/manage-detailed-monitoring.html\" rel=\"noopener noreferrer\" target=\"_blank\">EC2 Detailed Monitoring documentation</a> and <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring-system-instance-status-check.html\" rel=\"noopener noreferrer\" target=\"_blank\">EC2 performance status checks documentation</a>.</p>"
  "e4e0522e8ad16ee07e374ca605e8d095":
    "id": "e4e0522e8ad16ee07e374ca605e8d095"
    "title": "Announcing Data as a Service for AWS Marketplace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace-data-as-a-service/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS Marketplace announces the general availability of Data as a Service, a new product type that lets customers buy third-party datasets and licensed content. Customers often have the models and compute they need, but buying third-party data means adding each provider as a new supplier, negotiating separate contracts, and waiting on procurement cycles. Customers can now find and subscribe to Data as a Service products from AWS Marketplace sellers, and use them to enrich artificial intelligence (AI) applications, analytics, and other workloads.</p>\n<p>Customers purchase Data as a Service products through public or private offers, and charges appear on their existing AWS invoice. For example, an investment team evaluating private companies can connect its AI agents to private-market data through an API and to credit analysis through a Model Context Protocol (MCP) server.</p>\n<p>Sellers set their own prices and license terms, using a contract, pay-as-you-go, or contract with consumption pricing model for each product. They can add a free trial to any of these models, or offer a product for free. They also define the onboarding and delivery experience, from setting up the customer's account to providing the data through an API, a web portal, a real-time feed, an Amazon Simple Storage Service (Amazon S3) bucket, or another approach.</p>\n<p>To learn more, explore <a href=\"https://aws.amazon.com/marketplace/solutions/data-as-a-service/\">Data as a Service products</a> on AWS Marketplace, the <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/buyer-daas-products.html\" target=\"_blank\">AWS Marketplace Buyer Guide</a>, and the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/daas-products.html\" target=\"_blank\">AWS Marketplace Seller Guide</a>.</p>"
  "df2e9552417485c03209cb97db441cee":
    "id": "df2e9552417485c03209cb97db441cee"
    "title": "AWS Marketplace now offers Express Checkout for buyers without an AWS account"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace-express-checkout/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces <a href=\"https://aws.amazon.com/marketplace/features/getting-started/express-checkout/\">AWS Marketplace Express Checkout</a>, a simpler way for businesses that don't have an existing AWS account to buy software from established vendors in <a href=\"https://aws.amazon.com/marketplace/\">AWS Marketplace</a>.</p> \n<p>Express Checkout is built for businesses that don't use AWS today and just want to buy software. With no cloud setup required, buyers sign in with an email address or a social login, pay with a credit or debit card, and check out in a few steps. Businesses that buy multiple applications this way can manage all of their Express Checkout subscriptions in one place, without a separate billing login for each vendor. From there, they can update their card, download invoices, or cancel a subscription themselves.</p> \n<p>For sellers, Express Checkout opens a new segment of self-serve business buyers, using the same listing and AWS Marketplace integration they use today. Sellers with an eligible public SaaS listing can request to add their product to the Express Checkout catalog.</p> \n<p>Express Checkout is available for eligible SaaS products to buyers in the United States and Canada. Businesses that already use AWS can continue to buy in AWS Marketplace with their AWS account.</p> \n<p>To get started, visit the <a href=\"https://aws.amazon.com/marketplace/features/getting-started/express-checkout/\">AWS Marketplace Express Checkout page</a>.&nbsp;To learn more, see the&nbsp; <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/express-checkout.html\">AWS Marketplace Buyer Guide</a> and the&nbsp; <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/saas-express-checkout.html\">AWS Marketplace Seller Guide</a>.</p>"
  "d3d87931711535f2e198154270f33cc2":
    "id": "d3d87931711535f2e198154270f33cc2"
    "title": "AWS expands Amazon Connect Customer Competency to Software Partners"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-competency-software-partners/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS announces the expansion of the Amazon Connect Customer Competency to Software Partners. The AWS Specialization now recognizes both Services and Software Partners with technical depth and proven success on Amazon Connect Customer—from migrating legacy contact centers and operationalizing AI at scale, to building new solutions on top of Amazon Connect Customer.</p>\n<p>Modern customers want smooth, tailored interactions wherever they engage, but legacy customer experience systems weren't designed to provide them. They rely on queues, manual routing, and handle-time metrics as control mechanisms, with AI added as a separate layer rather than built in from the start.</p>\n<p>The Competency adds three new categories for Software Partners: <strong>Customer Experience – Solution Extensions</strong>, for solutions that integrate with Amazon Connect Customer across the customer experience lifecycle; <strong>Connect A2A Collaboration – Agent Certification</strong>, for third-party AI agents certified to work alongside Amazon Connect Customer native AI agents during live customer contacts; and <strong>Connect Customer – Powered Partner Platform</strong>, for Partner-owned solutions that include Amazon Connect Customer as a core component. These join the two existing categories for Services Partners: Contact Center Transformation and AI-Powered Customer Experience.</p>\n<p>As the first AWS Competency directly aligned to an AWS service, it gives customers confidence they're working with Partners validated by AWS experts to deliver AI-native customer experiences.</p>\n<p>AWS Partners looking to get their solutions validated through the <a href=\"https://aws.amazon.com/partners/programs/specializations/\">AWS Specialization Program</a> must be at Advanced or Premier tier (Services Partners) or have an approved Foundational Technical Review (Software Partners) prior to applying. To learn more and discover validated Partners, visit the <a href=\"https://aws.amazon.com/products/connect/customer/partners/\">Amazon Connect Customer Competency page</a> or the <a href=\"https://aws.amazon.com/blogs/apn/from-legacy-to-ai-powered-transform-your-customer-experience-with-amazon-connect-customer-competency-partners/\">APN blog</a>.</p>"
  "469d86bdb0a335dc66152498ad1f55a1":
    "id": "469d86bdb0a335dc66152498ad1f55a1"
    "title": "AWS Site-to-Site VPN now supports post-quantum key exchanges"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/site-to-site-vpn-post-quantum/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Site-to-Site VPN now supports post-quantum key exchanges to help improve the security posture of your VPN tunnels. This feature supports your migration to post-quantum cryptography based on NIST guidelines.<br /> <br /> AWS Site-to-Site VPN is a fully managed service that creates an encrypted connection between your data center or branch office and your AWS resources using IPsec tunnels. With AWS Site-to-Site VPN, you can now configure post-quantum key exchange methods in your VPN tunnel options using the CreateVpnConnection and ModifyVpnTunnelOptions APIs.<br /> <br /> There is no additional charge for using post-quantum key exchanges. This capability is available in all AWS commercial Regions and AWS GovCloud (US) Regions where AWS Site-to-Site VPN is available. To learn more, visit the AWS Site-to-Site VPN documentation.</p>"
  "9dda724dad6b3bbf15802c2d56cefae8":
    "id": "9dda724dad6b3bbf15802c2d56cefae8"
    "title": "AWS Health now supports resource and account tags"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-health-supports-tags/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Health now supports resource and account tags in Health events. This new capability enables you to enrich Health events with resource tags and account tags, providing additional context to help you manage and respond to events more effectively.</p> \n<p>With this feature, you can now view resource tags directly within Health events for supported AWS services. This allows you to quickly identify which resources are affected and understand their business context without needing to navigate to individual service consoles. Additionally, account-level tags help you categorize and filter events across your organization, making it easier to route notifications and automate responses based on your organizational structure.</p> \n<p>This enhancement is particularly valuable for organizations managing large-scale AWS deployments. By leveraging tags in Health events, you can streamline incident response workflows, improve cost allocation tracking for health-related events, and enable more granular event filtering in AWS Health Dashboard and AWS Health API responses.</p> \n<p>The feature integrates seamlessly with Amazon EventBridge, allowing you to create event-driven automation that responds to tagged resources and accounts. This enables sophisticated routing and handling of Health events based on tag values, supporting use cases such as automatically creating tickets in your IT service management system or sending targeted notifications to specific teams.</p> \n<p>To enable tag enrichment, visit the <a href=\"https://health.console.aws.amazon.com/health/home?region=us-east-1#/account/configurations\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Health Dashboard</a> or view the <a href=\"https://docs.aws.amazon.com/health/latest/ug/health-tags.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Health User Guide</a> for more information.</p>"
  "9215151c36bc51f4e6e282bcbf15fb19":
    "id": "9215151c36bc51f4e6e282bcbf15fb19"
    "title": "AWS Revenue Measurement now supports Account Tagging for SaaS Products"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/revenue-measurement-account-tagging/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Revenue Measurement (previously Partner Revenue Measurement) provides measurement of AWS consumption driven by Partner solutions. Today, AWS announces Account Tagging for SaaS Products for AWS Revenue Measurement. Partners can now measure the AWS revenue impact of their SaaS solutions by tagging the AWS accounts that host them, instead of tagging individual resources.</p> \n<p>Until now, Partners with SaaS listings measured that impact through Resource Tagging, User Agent strings, or AWS Marketplace Metering. With Account Tagging for SaaS products, a Partner uses AWS Organizations to tag partner-owned member accounts dedicated to a single SaaS product. The tag key is aws-apn-id-&lt;partner-central-aws-account-id&gt; and the tag value is pc:&lt;AWS Marketplace product-code&gt;. AWS Revenue Measurement then attributes all eligible AWS consumption in each tagged account to that product.</p> \n<p>Account Tagging for SaaS Products is available for products with a SaaS listing on AWS Marketplace. Each tagged account must be dedicated to one product. Partners whose products share an account can continue to use Resource Tagging, User Agent string, or Identity Tagging. AWS Revenue Measurement is generally available in all commercial regions. To learn more about implementing AWS Revenue Measurement, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">onboarding guide</a> for more information.</p>"
  "2bd524a5ebba4ba9d0e01a37660233a7":
    "id": "2bd524a5ebba4ba9d0e01a37660233a7"
    "title": "AWS Partner Central Agents now generate Value Realization Plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-central-agents-bvr-vrp"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces that AWS Partner Central Agents can now generate Value Realization Plans (VRPs) for the Business Value Realization (BVR) motion in <a href=\"https://aws.amazon.com/partners/partner-central/\">AWS Partner Central</a>. The VRP is the plan of record for a BVR engagement. The agentic experience generates a VRP that includes the customer's business goals; plan for adoption, change management, and governance; and baseline key performance indicators (KPIs) for Partners to review and finalize.</p> \n<p>AWS Partner Central launched the <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/06/aws-partner-business-value-realization/\">BVR motion</a> on June 16, 2026, to help Partners drive business outcomes for their customers by structuring AWS service adoption into defined stages, with funding tied to demonstrated value. With this launch, Partners in the BVR motion no longer start a VRP from a blank page. The agents recommend KPIs, ramp targets, and baseline measurements based on nomination data, opportunity context, and service benchmarks. They also flag gaps before submission, such as a lack of customer sponsorship, and identify next steps. Partners start from a complete draft and refine it with their customer.</p> \n<p>BVR is available in AWS Partner Central for consulting, system integrator, and managed services partners with Advanced or Premier tier status and a qualifying domain competency. This capability is available in the US East (N. Virginia) Region.</p> \n<p>To get started, partners sign in to AWS Partner Central and choose Funding benefits, Business Value Realization. After AWS approves a nomination, partners ask AWS Partner Central Agents, \"Help me draft a Value Realization Plan for my BVR engagement.\" To learn more, see <a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/bvr-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">Business Value Realization</a>.</p>"
  "37e1b79ee9fecf3e37467a806496bd3c":
    "id": "37e1b79ee9fecf3e37467a806496bd3c"
    "title": "AWS License Manager now supports AWS Managed Microsoft AD (Hybrid Edition)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/license-manager-hybrid-ad-support/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/license-manager/\">AWS License Manager</a> now supports <a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/aws-hybrid-directory.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Managed Microsoft AD (Hybrid Edition)</a>, so you can use your existing Microsoft Active Directory (AD) to manage user-based subscriptions for Microsoft Office, Visual Studio, and Remote Desktop Services Subscriber Access License (RDS SAL). Hybrid Edition, a feature of AWS Directory Service for Microsoft Active Directory, extends your existing directory into AWS. License Manager now works with that directory directly, so you no longer need to bear the cost of duplicating and maintaining the directory in AWS for licensing.</p> \n<p>Previously, onboarding Microsoft user-based subscriptions required a trust relationship between your directory and a second directory in AWS. If your security policies didn't allow that trust, you couldn't onboard without changing those policies. Now, license-included Microsoft Office and Visual Studio instances that you launch on Amazon Elastic Compute Cloud (Amazon EC2) join your existing directory and apply the same Group Policy settings, such as security baselines and audit policies, so you don't need to recreate them in a second directory.</p> \n<p>This feature is available in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all AWS Regions</a> where AWS License Manager user-based subscriptions and AWS Managed Microsoft AD (Hybrid Edition) are available. To learn more, see the <a href=\"https://docs.aws.amazon.com/license-manager/latest/userguide/user-based-subscriptions.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS License Manager User Guide</a>, or get started in the <a href=\"https://us-east-1.console.aws.amazon.com/license-manager/home?region=us-east-1#/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS License Manager console</a>.</p>"
  "1d5f4758f68d2259175f65357cb9dfd5":
    "id": "1d5f4758f68d2259175f65357cb9dfd5"
    "title": "Amazon Connect Customer now provides AI chat summaries in the CCP"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-ai-chat-summaries-ccp/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer</a> now provides agents with a generative AI-powered post-contact summary of each chat conversation inside the Contact Control Panel (CCP) within seconds after the chat ends, so agents can complete after contact work from the summary instead of rereading the transcript. The summary covers what the customer needed, the actions the agent took, and any open items, and it appears at the end of the chat transcript. Conversational analytics already generates these summaries for voice and email contacts in the CCP, and this launch adds chat.<br /> <br /> An airline agent who finishes a flight rebooking chat sees the new travel date, the fare difference charged, and the confirmation sent, then writes the wrap-up note from those three facts. Summaries follow your flow's redaction settings and use the same security profile permissions as voice summaries, so administrators who already enabled voice summaries can turn on chat analytics with post-contact summary in the Set recording and analytics behavior block.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/view-generative-ai-contact-summaries.html\">View generative AI-powered post-contact summaries in Connect Customer</a>.</p>"
  "7a483add82b5a2000f77f40509e9f06a":
    "id": "7a483add82b5a2000f77f40509e9f06a"
    "title": "Amazon Polly now supports voice cloning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-polly-now-supports-voice-cloning/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, we are excited to announce the general availability of voice cloning in Amazon Polly, as a gated release. Using a few minutes of recordings from a consenting speaker, you can now create a cloned voice that sounds like that speaker. The cloned voices run on the Amazon Polly Generative engine, which delivers similar naturalness and accuracy as the rest of the generative voices. Voice cloning launches in seven languages: English, Spanish, German, French, Italian, Portuguese, and Hindi. Each cloned voice speaks the language it was recorded in. The cloned voices are automatically encrypted and access-controlled: only you can access your cloned voices.</p>\n<p>Amazon Polly is a managed service that turns text into natural-sounding speech. With voice cloning, you can give your brand one recognizable voice across IVR and contact centers, voice agents, mobile apps, advertising, and connected devices. You can also create multiple voices for content creation use cases such as audiobooks, e-learning, podcasts, videos, and game characters. Amazon Polly does not retain a copy of your voice recordings once the voice is created and doesn't use them to train Polly models.</p>\n<p>Voice cloning is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt), Europe (Zurich), Europe (London), Asia Pacific (Sydney), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Tokyo), Canada (Central), and AWS GovCloud (US-West).</p>\n<p>Voice cloning is already enabled for select Amazon Polly customers. To request access, contact your AWS account team or <a href=\"https://pages.awscloud.com/amazon-polly-voice-cloning-20261119.html\" target=\"_blank\">apply here</a>. Building a cloned voice is free for Amazon Polly customers, and you pay for the speech you synthesize, on a pay-as-you-go basis. For more details, see the <a href=\"https://docs.aws.amazon.com/polly/latest/dg/what-is.html\" target=\"_blank\">Amazon Polly documentation</a>, and <a href=\"https://aws.amazon.com/polly/pricing/\">Amazon Polly Pricing</a> page. For speech AI use cases, you can build with Amazon Polly, including voice cloning. Check out the <a href=\"https://github.com/aws-samples/amazon-ai-samples/tree/main/text-to-speech\" target=\"_blank\">Amazon Polly GitHub repo</a>.</p>"
  "bf50fe7f65e3e9d5148b15740b5199df":
    "id": "bf50fe7f65e3e9d5148b15740b5199df"
    "title": "AWS Lambda Durable Execution SDK for Rust is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-durable-execution-sdk-rust/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces the general availability of the open source AWS Lambda Durable Execution SDK for Rust. Rust developers can use the SDK to build resilient, long-running workflows using Lambda durable functions, to create multi-step applications like infrastructure automation, deployment rollouts with approval gates, and pipelines that call AI models and pause for human review directly in their Rust code without implementing custom progress tracking.</p>\n<p><a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\">Lambda durable functions</a> extend Lambda's event-driven programming model with operations that checkpoint progress automatically and pause execution for up to one year when waiting on external events. With the SDK, developers write a durable function as an ordinary async Rust function that awaits each durable operation like any other future and can run independent operations concurrently. The SDK includes steps that save their results, callbacks for human-in-the-loop and agent-in-the-loop workflows, invocations of other durable functions, and timed waits.</p>\n<p>The SDK works with the Rust tools developers already use. Developers add the <a href=\"https://crates.io/crates/aws-durable-execution-sdk\" target=\"_blank\">aws-durable-execution-sdk</a> crate with cargo add, build with Cargo Lambda, and deploy a single binary on the provided.al2023 runtime. Before deploying, they can test complete workflows with cargo test and the SDK's LocalRunner without requiring network access or AWS credentials.</p>\n<p>To get started, see the Lambda durable functions <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\" target=\"_blank\">developer guide</a>, the <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/languages/rust/\" target=\"_blank\">Rust SDK guide</a>, and the <a href=\"https://github.com/aws/aws-durable-execution-sdk-rust\" target=\"_blank\">AWS Lambda Durable Execution SDK for Rust on GitHub</a>. For Regional availability and pricing details for Lambda durable functions, see the AWS Capabilities by Region <a href=\"https://builder.aws.amazon.com/build/capabilities?refid=2abe6167-e3db-40c4-a9fa-b283e7b4d7c8\" target=\"_blank\">page</a> and AWS Lambda <a href=\"https://aws.amazon.com/lambda/pricing/\">Pricing</a>.</p>"
  "5863e62ba6b12d9aa13f07779265bf16":
    "id": "5863e62ba6b12d9aa13f07779265bf16"
    "title": "Amazon VPC Flow Logs now supports Amazon EKS metadata"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-vpc-flow-logs-amazon-eks-metadata/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon VPC Flow Logs now adds Amazon Elastic Kubernetes Service (Amazon EKS) metadata to flow log records. Each record identifies the pod that sent or received the traffic, along with its cluster, namespace and labels. This makes it faster to investigate security events, understand traffic patterns, and troubleshoot network issues in your EKS clusters, without running monitoring software on your nodes.</p>\n<p>Amazon EKS runs pods on Amazon EC2 instances, called nodes, and many pods can share one node's network interfaces. Previously, flow log records showed the network interface and IP address for each flow, not the pod behind it. Pods are short-lived, so by the time you investigated unexpected traffic, that IP address could belong to a different pod. To trace traffic back to the right pod, teams built custom tools or ran monitoring software on every node. Now, each record names the pod that sent or received the traffic, so one log gives you both VPC and Kubernetes context. For example, if a pod sends unexpected traffic to a database in your VPC, the record shows the pod and its namespace, even after that pod is replaced.</p>\n<p>To get started, create a flow log for your cluster's VPC or subnets, and add the EKS fields to the log format. You don't need to change your cluster or applications. The fields are available for pods on Amazon EC2 instances, including EKS Auto Mode, managed node groups and self-managed nodes, that use the Amazon VPC CNI plugin for Kubernetes. Logs go to the same destinations as before, so your existing analytics tools keep working. EKS metadata is available at no additional charge. Standard VPC Flow Logs charges for log delivery and storage still apply. This feature is supported in all AWS Regions where Amazon EKS is available. For more information, visit the <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html\" target=\"_blank\">Amazon VPC Flow Logs</a>.</p>"
  "a654f26b5bfce35f6251efe4db4856a2":
    "id": "a654f26b5bfce35f6251efe4db4856a2"
    "title": "Amazon SageMaker AI now detects rising response times, idle GPUs, and missed optimizations on your generative AI inference endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-monitors-endpoints/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon SageMaker AI now monitors the response time and GPU use of generative AI inference endpoints by default and notifies customers when responses slow down, GPUs sit mostly idle, or a configuration falls behind. Customers run GenAI Inference Recommendations to test configurations designed to restore response time or lower cost on their recent traffic, and they see measured results before anything changes in production.</p> \n<p>The best configuration for generative AI inference endpoints changes after deployment, as traffic shifts and new serving techniques become available. An endpoint whose latency rises or whose GPUs sit idle keeps running until users complain or the bill arrives.</p> \n<p>With this launch, SageMaker AI tracks response time and GPU capacity use and checks each endpoint's configuration. It does not read customer requests or responses. Findings include slower response times, unused GPU capacity, and configuration gaps such as an older serving container, missing speculative decoding, or missing GPU kernel tuning. When a change holds across the past week or a configuration gap is found, customers receive one AWS Health notification per endpoint in the AWS Management Console.</p> \n<p>Each notification links to the SageMaker AI Agentic Experience in SageMaker Studio with the endpoint and recent traffic already filled in. Customers run Generative AI Inference Recommendations, which compares the current configuration and options on response time, traffic handled, and cost per million tokens. Tests leave the production endpoint untouched, and nothing changes until the customer applies a result. Customers can turn off monitoring anytime.</p> \n<p>This capability is available in US East (N. Virginia, Ohio), US West (Oregon), Europe (Ireland, Frankfurt), Asia Pacific (Singapore, Tokyo) with no additional charge for monitoring. Standard compute costs apply for recommendation jobs. To learn more, visit the <a href=\"https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-ai-now-detects-latency-drift-idle-gpus-and-missed-optimizations-on-your-inference-endpoints/\">blog post</a> or the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-improvement-notifications.html\">documentation</a>.</p>"
  "26694b6b83cc7a861ca7b96e6e1e6bde":
    "id": "26694b6b83cc7a861ca7b96e6e1e6bde"
    "title": "Amazon Inspector Code Security adds GitHub Enterprise Server and private connectivity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/inspector-code-ghes-private-network/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon Inspector Code Security now supports GitHub Enterprise Server (GHES) integration and private network connectivity for GHES and GitLab Self-Managed. Code Security is also launching automatic fix pull requests in public preview. Organizations that host GHES or GitLab Self-Managed in private networks can now connect through Amazon Virtual Private Cloud (Amazon VPC) configurations or AWS CodeConnections, so they can scan repositories without opening their firewalls to the entire AWS IP address range.</p> \n<p>Amazon Inspector Code Security scans first-party application source code, third-party dependencies, and Infrastructure as Code for vulnerabilities in repositories on GitHub, GHES, and GitLab Self-Managed. With automatic fix pull requests, Amazon Inspector turns its suggested fix into a pull request that developers review and choose whether to merge, instead of applying the fix by hand. It opens pull requests only for high-confidence fixes to static application security testing (SAST) findings at or above a severity you set.</p> \n<p>These features are available in all 10 AWS Regions where Amazon Inspector Code Security is available: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Stockholm), Asia Pacific (Tokyo), Asia Pacific (Sydney), and Asia Pacific (Singapore). To learn more, see the <a href=\"https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Inspector User Guide</a> and the <a href=\"https://aws.amazon.com/inspector/\">Amazon Inspector product page</a>.</p>"
  "0b3afd6a84f6ffeb23877e3e4e0cb3c9":
    "id": "0b3afd6a84f6ffeb23877e3e4e0cb3c9"
    "title": "AWS Network Firewall launches explicit proxy functionality and NAT Gateway association"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-firewall-proxy-nat-gateway/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>You can now associate AWS Network Firewall with NAT Gateway and use it both as an explicit proxy and a transparent firewall with native network address translation. You can use this capability with existing Network Firewall features to filter traffic to and from your applications and prevent data exfiltration and malware injection.</p>\n<p>AWS Network Firewall is a stateful, managed, network firewall and intrusion detection and prevention service for your VPC. Customers use it to filter their traffic and secure AWS resources. With this launch, you can configure Network Firewall with native NAT Gateway association and use it for both explicit proxy and routed filtering functionalities. Both these functionalities are governed by a single security policy that you maintain centrally. This capability works with existing Network Firewall features including managed rule groups from Amazon or Marketplace, active threat defense, Geo-IP filtering, URL and domain category filtering, container attribute-based rules for Amazon EKS and Amazon ECS, etc. You can access Network Firewall from any VPC in your environment, even the ones with overlapping IP CIDR space, using VPC endpoints. Your traffic reaches the firewall via the VPC endpoint and the filtered traffic exits directly from the NAT Gateway using its IP address.</p>\n<p>This capability is available in US East (N. Virginia), US West (Oregon), US East (Ohio), US West (N. California), Europe (Ireland), Europe (London), Europe (Frankfurt), Asia Pacific (Hong Kong), Asia Pacific (Tokyo), Europe (Stockholm), Asia Pacific (Thailand), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Mumbai), Asia Pacific (Malaysia), Europe (Spain). To learn more about Network Firewall proxy and NAT Gateway association, please visit Network Firewall <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html\" target=\"_blank\">documentation</a> and <a href=\"https://aws.amazon.com/network-firewall/pricing/\">pricing page</a></p>"
  "94448bd293fc9c868c0f0a8326b6df7a":
    "id": "94448bd293fc9c868c0f0a8326b6df7a"
    "title": "Amazon Cognito now supports dynamic client registration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-dynamic-client-registration/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now supports OAuth dynamic client registration (DCR, RFC 7591). Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices in minutes. With DCR support, Model Context Protocol (MCP) clients and AI agents can register themselves at runtime. Previously, you had to create an application client in advance for each AI client before it could connect to an MCP server that uses Cognito for authorization.</p> \n<p>With DCR, Cognito advertises a registration endpoint in its OAuth authorization server metadata. MCP clients that support dynamic client registration discover the endpoint, register to receive a client ID, and then sign users in. You control who can register: either require registration requests to present an access token with a registration scope, or turn on open registration so that any client can register. Dynamically registered clients appear with your other app clients with a client ID prefix and a client type you can filter on, so you can manage them with the same console and APIs.</p> \n<p>DCR is available on the Essentials and Plus feature plans in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To learn more, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-dynamic-client-registration.html\" rel=\"noopener noreferrer\" target=\"_blank\">Dynamic client registration</a> in the Amazon Cognito Developer Guide.</p>"
  "06cc939c832c22520d811a62dfea1d19":
    "id": "06cc939c832c22520d811a62dfea1d19"
    "title": "Amazon Bedrock AgentCore Identity adds private certificate authority support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/bedrock-agentcore-identity-private-ca/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon Bedrock AgentCore Identity now supports private certificate authorities (CAs) for custom OAuth 2.0 credential providers. If you already connect your agents to identity providers (IdPs) hosted in your VPC, you can now configure those connections to trust certificates issued by your own CA — including AWS Private CA, enterprise CAs, and self-signed root CAs.</p>\n<p>AgentCore Identity has supported private IdP connectivity through Amazon VPC Lattice, but until now the IdP still had to present a publicly trusted TLS certificate over that private connection. With private CA support, you store your CA certificate in AWS Secrets Manager or Amazon S3 and reference it from your credential provider configuration. AgentCore Identity uses it to verify the IdP's server certificate directly, removing the need for a publicly trusted certificate or additional infrastructure on the private network path.</p>\n<p>You can rotate the CA certificate without downtime by combining the current and new certificates in a single PEM file, and remove private CA trust by updating the credential provider without the certificate reference.</p>\n<p>Private CA support for AgentCore Identity is available in all AWS Regions where AgentCore Identity supports private IdP connectivity. To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-private-idp.html\" target=\"_blank\">Connect to private identity providers</a> in the Amazon Bedrock AgentCore Developer Guide. To learn more, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">Amazon Bedrock AgentCore product page</a>.</p>"
  "aec9825b008407389ac3517b51ebe83b":
    "id": "aec9825b008407389ac3517b51ebe83b"
    "title": "AWS Network Load Balancer now supports mutual TLS authentication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-load-balancer-mtls/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Network Load Balancer (NLB) now supports mutual TLS (mTLS) authentication for clients that present X.509 certificates. Until now, customers who needed mTLS with NLB built their own solutions or ran third-party proxies to authenticate clients. With this launch, NLB verifies client certificates on its TLS listeners, so only trusted clients can reach your targets. You can offload the compute-intensive processing required for mTLS authentication to NLB, without adding certificate logic to your backend applications.</p> \n<p>Mutual TLS is commonly used to secure communication between IoT devices, APIs, and microservices, and in regulated environments where both sides must prove their identity. To use mTLS, create a trust store with a certificate authority (CA) certificate bundle from a CA of your choice or AWS Private Certificate Authority, and attach it to a new or existing NLB TLS listener. To block certificates you no longer trust, add one or more certificate revocation lists (CRLs) to the trust store. To admit only specific clients, add client certificate filters that match the Common Name, Organizational Unit, or the DNS name or URI in the Subject Alternative Name, such as a SPIFFE ID. You can set up mTLS with the AWS Management Console, AWS Command Line Interface (AWS CLI), or APIs.</p> \n<p>Mutual TLS for NLB is available in all AWS commercial and AWS GovCloud (US) Regions where NLB is available. To learn more, visit the <a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/introducing-mtls-for-network-load-balancer/\">AWS Blog</a> and the NLB <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/mutual-authentication.html\">User Guide.</a></p>"
  "f670ec5df6b2cd86a64206a75c363023":
    "id": "f670ec5df6b2cd86a64206a75c363023"
    "title": "Amazon S3 Tables now support promoting replicas to writable tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-tables-replication-writable-tables/"
    "published": "2026-11-19 15:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon S3 Tables replication now lets you make a read-only replica of your Apache Iceberg table a standalone, writable table with a single API call. S3 Tables replication keeps read-only replica tables in sync with your source tables across table buckets, AWS Regions, and accounts. Instead of copying a replica into a new table, you can promote it in place to move writes to another Region.</p> \n<p>When you disassociate a replica from replication, the standalone table keeps its namespace and table name, so your queries and pipeline code carry over when you point your applications at it. The promoted table then works like an S3 table you created, and you can use it as a source for new replicas.</p> \n<p>This capability is available in all AWS Regions where S3 Tables replication is supported. You can use the AWS Management Console, AWS CLI, AWS SDKs, or S3 Tables API. For pricing details, visit the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 pricing page</a>. To learn more, see the <a href=\"https://aws.amazon.com/s3/features/tables/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables overview page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-replication-tables.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "2a5d71854d6c12093934ff459f9246df":
    "id": "2a5d71854d6c12093934ff459f9246df"
    "title": "AWS AppConfig launches support for managing native AI model and AI prompt configuration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-appconfig-native-ai-model-invocation-prompt-configurations/"
    "published": "2026-11-19 14:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS AppConfig introduces two new configuration profile types to help you manage the settings for your generative AI applications: AI model invocation configurations, and AI prompt configurations. You can now change model settings and prompts while your application is running, without redeploying code. These updates use AWS AppConfig's safe deployment practices, including gradual rollouts and automatic rollback. This can allow you to move faster and safer, and avoid unexpected behaviors and tokenomics results with rapidly evolving AI solutions.</p> \n<p>AI model invocation configurations store the settings your application uses to call an AI model. These include the model identifier, inference parameters such as temperature and maximum tokens, and messages such as system prompts and example conversation turns. Provider-specific options are managed in custom parameters, so the same schema works across AI providers. Similarly, AI prompt configurations store prompts as separately versioned artifacts. You can update&nbsp; and optimize a prompt on its own,without changing the model configuration, and reuse it across multiple applications. This allows for powerful prompt engineering.</p> \n<p>You can roll out a change to these gradually, for example to 10%, then 20%, then 30% of your traffic. Along the way, you can measure the change's effect on operational metrics, customer experience, and token usage. If an alarm in Amazon CloudWatch, Datadog, New Relic, or another observability solution goes off during the rollout, AWS AppConfig can automatically roll the change back to the previous state.</p>"
  "719d46d17d7829423f7f188bad96b450":
    "id": "719d46d17d7829423f7f188bad96b450"
    "title": "AWS CloudFormation StackSets adds progress visibility to simplify tracking deployments at scale"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudformation-stacksets-progress/"
    "published": "2026-11-19 09:45:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html\">AWS CloudFormation StackSets</a> now shows stage-by-stage progress for deployments across accounts and AWS Regions, whether you target tens of accounts or thousands. You can follow each deployment as it progresses and take action when needed, without waiting for it to finish. StackSets lets you consistently apply the same infrastructure or application components, such as networking and security settings, across many accounts and Regions in one operation. With this launch, you can see how many stack instances are deployed, how many remain, and which ones need attention. This gives you confidence that a rollout is on track at every stage.</p> \n<p>Stage-level progress gives you a clear, detailed view of where each deployment stands. Previously, a StackSets deployment showed an overall status while it ran. Now, StackSets also reports progress for two stages. The first is role provisioning, which prepares access in each target account of a service-managed stack set. The second is stack deployment, which deploys your template as a stack instance in each account and Region. For example, in a deployment to 2,000 accounts in 3 Regions, you can see that role provisioning is complete and stack deployment has reached 40 percent, with 2,400 stack instances completed and 3,600 pending. Progress for each Region and the result of each stage remain available after the deployment completes.</p> \n<p>To get started, open the Progress view for a stack set operation in the CloudFormation console, or use the AWS CLI or AWS SDKs. Existing integrations continue to work without changes. Visit the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html#stackset-operation-progress\" rel=\"noopener noreferrer\" target=\"_blank\">StackSets documentation</a> to learn more.</p> \n<p>Deployment progress is available at no additional charge in all AWS Regions where CloudFormation StackSets is supported. Refer to the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a> for service availability details.</p>"
  "f916adedfc5a38960565082e00ef7af0":
    "id": "f916adedfc5a38960565082e00ef7af0"
    "title": "AgentCore runtime instances now support Nested Virtualization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agentcore-nested-virtualization/"
    "published": "2026-11-19 19:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>Amazon Bedrock AgentCore <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances.html\">runtime instances</a> now support nested virtualization, so your agents can run their own virtual machines and emulators inside a session with Kernel-based Virtual Machine (KVM). Runtime instances run your agents on Amazon EC2 instances while AgentCore handles provisioning, patching, scaling, and lifecycle management. Nested virtualization serves agents that rely on tools that run in a virtual machine, such as mobile emulators or virtual machine sandboxes.</p> \n<p>You turn on nested virtualization when you create a Linux capacity provider, and agents in every session on its instances can use KVM. For example, your agents can run Android emulators to build and test mobile apps, or start lightweight virtual machines to isolate the code that they run. Nested virtualization works on supported Intel-based instance types, including the C7i, C8i, M7i, M8i, R7i, and R8i families.</p> \n<p>Nested virtualization is available on supported instance types in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AgentCore runtime instances are available.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-nested-virtualization.html\">Run virtual machines in agents on runtime instances</a> in the Amazon Bedrock AgentCore Developer Guide</li> \n <li><a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a></li> \n</ul>"
  "47b2a943e9693f1d21d9a7b65e8c119c":
    "id": "47b2a943e9693f1d21d9a7b65e8c119c"
    "title": "AWS Continuum for Penetration Testing now supports pause and resume"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/continuum-pentest-pause-resume/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>AWS Continuum for Penetration Testing (formerly AWS Security Agent) now lets you pause a running penetration test job and resume it later from its last saved checkpoint. Continuum for Penetration Testing runs on-demand, AI-driven penetration tests against your web applications and APIs. Previously, a pen test job that failed due to client configuration error could not continue, so security teams had to start a new pen test job and repeat work the agent had already done.</p>\n<p>When you resume a paused or failed pen test job, it keeps its findings and completed work and continues where it left off. You can pause a pen test job during a deployment or maintenance window, raise the task-hour limit of a pen test job that has reached it, or replace test credentials that expired mid-test. Before you resume, you can also update the network traffic settings or VPC configuration, while the pen test job's scope, including its target endpoints, stays the same.</p>\n<p>You can pause and resume pen test jobs in the web application or with the StopPentestJob and ResumePentestJob APIs. You can resume a pen test job within 7 days of its creation. Pause and resume is available in all AWS Regions where AWS Continuum for Penetration Testing is available. To learn more, visit our <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/pause-resume-penetration-test.html\" target=\"_blank\">documentation page</a>.</p>"
  "001afc5d25b87df41424787595d1746d":
    "id": "001afc5d25b87df41424787595d1746d"
    "title": "AWS STS announces GetScopedCredentials to scope down permissions at runtime"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sts-getscopedcredentials/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>AWS Security Token Service (AWS STS) announces GetScopedCredentials, a new API that lets you scope down the permissions of existing temporary security credentials. With GetScopedCredentials, you can give your agents, sub agents and workloads their own set of credentials with only the permissions they need.</p> \n<p>You can call GetScopedCredentials with the temporary security credentials you already use to reduce permissions, session duration, or both. The resulting credentials preserve the caller's original identity, and permissions and session duration are monotonically narrowed so they never exceed those of the caller. Access to the API is controlled with IAM policies, and each call is logged to AWS CloudTrail for traceability. These capabilities make it easier to scope down permissions at runtime without changing how you manage identities.</p> \n<p>GetScopedCredentials is available in all AWS commercial Regions, AWS GovCloud (US) Regions, AWS European Sovereign Cloud (Germany) Regions and China Regions. To get started, see the <a href=\"https://docs.aws.amazon.com/STS/latest/APIReference/API_GetScopedCredentials.html\" rel=\"noopener noreferrer\" target=\"_blank\">GetScopedCredentials API reference</a> and <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_control-access_getscopedcredentials.html\" rel=\"noopener noreferrer\" target=\"_blank\">Permissions for GetScopedCredentials</a>.</p>"
  "8a1cd6388aaa5347183a169b252cfa71":
    "id": "8a1cd6388aaa5347183a169b252cfa71"
    "title": "Second-generation AWS Outposts racks now supported in the AWS European Sovereign Cloud (Germany) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-outposts-thf-european-sovereign/"
    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the AWS European Sovereign Cloud (Germany) Region. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.</p> \n<p>Organizations of every size, from startups to enterprises to public sector agencies, can now order Outposts racks connected to this newly supported Region to optimize for latency and data residency needs. This regional expansion provides additional flexibility in the number of AWS Regions that customers' Outposts can connect to.</p> \n<p>To learn more about second-generation Outposts racks, read the <a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255,255,255);\" target=\"_blank\">AWS Outposts blog post</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255,255,255);\" target=\"_blank\">user guide</a>.&nbsp;For the latest list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, see the&nbsp;<a href=\"https://aws.amazon.com/outposts/rack/faqs/\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255,255,255);\" target=\"_blank\">AWS Outposts FAQs page</a>. For pricing information in the AWS European Sovereign Cloud (Germany) Region, please refer to this <a href=\"https://www.aws.eu/outposts/rack/pricing/\">page</a>.</p>"
"last_updated": "2026-11-20 17:20:08 JST"
