"overview": |
  この日は 8 ソースから 83 本で、セキュリティ速報 2 件、Lambda の GPU 対応とカスタマーマネージドランタイム、CloudFront の機能拡張、データベースと AI エージェント基盤の発表が中心でした。セキュリティ速報では、CVE-2026-130638 (11 月 18 日 10:00 PST 公開) が AutoGluon MultiModal 1.6.0 より前の物体検出用データセット準備ツールにおける相対パストラバーサル、CVE-2026-114938 (11 月 18 日 17:00 PST 公開) が AVX-512 VBMI に対応した x86-64 プロセッサ上の OpenJDK 17.0.6 以降の Base64 デコーダーのイントリンシックにおける範囲外書き込みで、2026 年 11 月の OpenJDK 更新で修正され、AWS は影響を受けるサービスへの修正の展開を進めています。AWS Lambda は Lambda Managed Instances 上の Event Functions (旧 Lambda 関数) で EC2 G 系の GPU インスタンスに対応し、AI 推論やメディア処理、レンダリングをサーバーレスで動かせるようになったほか、ランタイムの中身・更新・アクセス・ライフサイクルを利用者が管理し、一度パッケージ化して組織で共有できるカスタマーマネージドランタイムを導入しました。CloudFront は CloudFront Functions が cf.fetch() によるネットワーク呼び出しと cf.beacon() による分析イベントの送信に対応してエッジでの認可やルーティングに外部データを使えるようになり、オリジン相互 TLS で WebSocket と gRPC をサポートし、標準ログで CMCD などリアルタイムログ限定だったフィールドを使えるようになりました。データベースでは、Amazon RDS for MySQL がコミュニティの LTS であるメジャーバージョン 9.7 (9.7.4、Replication Applier Metrics・JSON Duality Views・Hypergraph Optimizer) とマイナーバージョン 8.4.13 に対応し、RDS は PITR・リードレプリカ作成・マルチ AZ 変換時のストレージボリュームを高速に初期化するようになり、Amazon Cognito はユーザープールのポイントインタイムリカバリに対応しました。DynamoDB 互換のオープンソースアダプター ExtendDB 1.0 は PostgreSQL・SQLite・Cassandra・MongoDB の 4 つのバックエンドで DynamoDB のワークロードをオンプレミスやエッジでも動かせるようにし、Aurora DSQL の監査ログの使い方も日本語ブログで解説されています。AI 関連では、AI エージェントに永続メモリを与えるサーバーレスの Amazon OpenSearch Memory の一般提供、容量不足時に別リージョンのエンドポイントへ振り分ける SageMaker AI のクロスリージョン推論ルーティング (Salesforce の事例も公開)、70 以上の基盤モデルを品質・速度・コストで比較する SageMaker JumpStart Model Leaderboard、HyperPod のワークロード復旧とインフラチェックの拡充、SageMaker AI Serverless Model Customization のフルファインチューニング、AgentCore Identity のプライベート CA 対応、AWS Glue ETL の Apache Spark 最適化エージェントが発表されました。そのほか、EKS Hybrid Nodes が大型ノードの課金 vCPU を 1 ノード 32 vCPU で頭打ちにする値下げ、Clean Rooms の PySpark ジョブの中間テーブル、AWS Transform custom の変換定義のアカウント間共有、Route 53 Resolver DNS Firewall の Infoblox ルール (プレビュー)、Security Hub によるクラウドをまたぐラテラルムーブメントの検知、リスクに応じたステップアップ認証が取り上げられました。日本語ブログでは、MFA 付きの AWS ビルダー ID や月額 20 USD から設定できる支出上限などを最初から適用する新しい AWS エクスペリエンスの安全なデフォルト設定、SATv2 によるマルチアカウント環境の LLM ジャッキング対策、Kiro の数百万回の評価から得た教訓、re:Invent 2026 のクラウドレジリエンス関連セッションガイド、AWS Weekly Roundup (Nitro Sandboxes、AWS Emulator など) が公開され、事例として United Airlines の Aurora MySQL から Apache Iceberg への CDC、Aderant の Iceberg と Lambda によるパイプライン刷新、Airbnb のコーディングエージェントのタスク単価による運用、Exa の AWS AI チップでの埋め込みスループット 50% 向上、Stretto の Nova 2 Sonic 音声エージェントなどが紹介されました。後から追加された発表として、AWS Marketplace が承認の要る購入・承認者・承認の場所を決められる購入者承認ワークフローを一般提供とし、サードパーティ製品のサブスクリプション時に購入者が連絡先を販売者と共有できる機能にも対応しました。AWS Transform for migrations は移行するすべてのサーバーに最適なストレージタイプと構成を推奨するようになり、移行前と AWS での起動後にサーバーを準備・検証するタスクも自動化してカットオーバーを早められるようになりました。AWS Systems Manager Parameter Store は 5 つの API 操作のスループット上限を引き上げ、Amazon Connect Customer は新規インスタンスで Cases を既定で有効にしました。日本語ブログでは、Agent Toolkit for AWS が提供する Amazon MWAA 向けエージェントスキルで Airflow 環境のアップグレード、DAG のトラブルシューティング、ワークフローの作成とテストを行う手順も紹介されました。さらに後から多数の発表が追加されました。セキュリティ・ネットワークでは、AWS Site-to-Site VPN が NIST のガイダンスに基づく耐量子暗号の鍵交換に対応し、AWS Network Firewall が NAT Gateway と関連付けて明示的プロキシと透過型ファイアウォールを兼ねられるようになり、Network Load Balancer が X.509 証明書を提示するクライアントとの相互 TLS 認証に対応し、AWS STS は既存の一時認証情報の権限を実行時に絞り込む新 API GetScopedCredentials を発表しました。ID まわりでは Amazon Cognito が OAuth の動的クライアント登録 (RFC 7591) に対応し、Amazon Inspector Code Security は GitHub Enterprise Server 連携と GHES・GitLab Self-Managed へのプライベート接続を、AWS Continuum for Penetration Testing (旧 AWS Security Agent) はペネトレーションテストジョブの一時停止と再開を追加しました。データ・アプリ基盤では、Aurora DSQL の PL/pgSQL によるストアド関数・プロシージャ、S3 Tables のレプリカを書き込み可能なテーブルへ昇格する機能、AWS AppConfig の AI モデル呼び出し設定と AI プロンプト設定のプロファイル、CloudFormation StackSets のステージごとの進捗表示、AWS Lambda Durable Execution SDK for Rust の一般提供が発表されました。運用面では、EC2 のパフォーマンスステータスチェックと Detailed Monitoring の新しい使用率メトリクス、生成 AI 推論エンドポイントの応答時間悪化やアイドル GPU を既定で検知して通知する SageMaker AI の機能、Pod やクラスターを識別する EKS メタデータを付ける VPC Flow Logs、AWS Health イベントへのリソース・アカウントタグの付与が加わりました。AgentCore のランタイムインスタンスは KVM による入れ子の仮想化に対応し、Amazon WorkSpaces Personal でも開発者が Windows クライアントから自分で入れ子の仮想化を有効にできるようになりました。Amazon Polly は同意を得た話者の数分の録音から声を複製するボイスクローニングを (限定公開で) 一般提供とし、Amazon Connect Customer は CCP でチャット終了後数秒の生成 AI 要約を提供し、AWS License Manager は AWS Managed Microsoft AD (Hybrid Edition) に対応し、第 2 世代の AWS Outposts ラックが AWS European Sovereign Cloud (ドイツ) リージョンで使えるようになりました。マーケットプレイス・パートナー向けには、第三者のデータセットやライセンスコンテンツを購入できる新しい製品タイプ Data as a Service の一般提供、AWS アカウントを持たない企業向けの Express Checkout、AWS Revenue Measurement (旧 Partner Revenue Measurement) の Bedrock のクローズドソースモデル対応・Identity Tagging・SaaS 製品の Account Tagging、Partner Central Agents による共同販売の申請支援と Value Realization Plan の生成、AWS Data Competency の Open Data and Interoperability カテゴリ新設、Amazon Connect Customer Competency のソフトウェアパートナーへの拡大が発表されました。ブログでは、AgentCore 上のエージェントにツール障害を注入してレジリエンスを検証する方法、AgentCore Gateway をハブアンドスポーク構成のプライベート API に集中検査付きで接続するパターン、Aurora PostgreSQL と pgvector、Bedrock Guardrails で RAG チャットボットの回答を追跡可能にする責任ある AI の設計、Social Department のカルチャーを踏まえた動画検索、AWS Quick User Group DC のミートアップの振り返りも公開されました。
