"overview": |
  この日は 8 ソースから 44 本で、セキュリティ速報 2 件、Lambda の GPU 対応とカスタマーマネージドランタイム、CloudFront の機能拡張、データベースと AI エージェント基盤の発表が中心でした。セキュリティ速報では、CVE-2026-130638 (11 月 18 日 10:00 PST 公開) が AutoGluon MultiModal 1.6.0 より前の物体検出用データセット準備ツールにおける相対パストラバーサル、CVE-2026-114938 (11 月 18 日 17:00 PST 公開) が AVX-512 VBMI に対応した x86-64 プロセッサ上の OpenJDK 17.0.6 以降の Base64 デコーダーのイントリンシックにおける範囲外書き込みで、2026 年 11 月の OpenJDK 更新で修正され、AWS は影響を受けるサービスへの修正の展開を進めています。AWS Lambda は Lambda Managed Instances 上の Event Functions (旧 Lambda 関数) で EC2 G 系の GPU インスタンスに対応し、AI 推論やメディア処理、レンダリングをサーバーレスで動かせるようになったほか、ランタイムの中身・更新・アクセス・ライフサイクルを利用者が管理し、一度パッケージ化して組織で共有できるカスタマーマネージドランタイムを導入しました。CloudFront は CloudFront Functions が cf.fetch() によるネットワーク呼び出しと cf.beacon() による分析イベントの送信に対応してエッジでの認可やルーティングに外部データを使えるようになり、オリジン相互 TLS で WebSocket と gRPC をサポートし、標準ログで CMCD などリアルタイムログ限定だったフィールドを使えるようになりました。データベースでは、Amazon RDS for MySQL がコミュニティの LTS であるメジャーバージョン 9.7 (9.7.4、Replication Applier Metrics・JSON Duality Views・Hypergraph Optimizer) とマイナーバージョン 8.4.13 に対応し、RDS は PITR・リードレプリカ作成・マルチ AZ 変換時のストレージボリュームを高速に初期化するようになり、Amazon Cognito はユーザープールのポイントインタイムリカバリに対応しました。DynamoDB 互換のオープンソースアダプター ExtendDB 1.0 は PostgreSQL・SQLite・Cassandra・MongoDB の 4 つのバックエンドで DynamoDB のワークロードをオンプレミスやエッジでも動かせるようにし、Aurora DSQL の監査ログの使い方も日本語ブログで解説されています。AI 関連では、AI エージェントに永続メモリを与えるサーバーレスの Amazon OpenSearch Memory の一般提供、容量不足時に別リージョンのエンドポイントへ振り分ける SageMaker AI のクロスリージョン推論ルーティング (Salesforce の事例も公開)、70 以上の基盤モデルを品質・速度・コストで比較する SageMaker JumpStart Model Leaderboard、HyperPod のワークロード復旧とインフラチェックの拡充、SageMaker AI Serverless Model Customization のフルファインチューニング、AgentCore Identity のプライベート CA 対応、AWS Glue ETL の Apache Spark 最適化エージェントが発表されました。そのほか、EKS Hybrid Nodes が大型ノードの課金 vCPU を 1 ノード 32 vCPU で頭打ちにする値下げ、Clean Rooms の PySpark ジョブの中間テーブル、AWS Transform custom の変換定義のアカウント間共有、Route 53 Resolver DNS Firewall の Infoblox ルール (プレビュー)、Security Hub によるクラウドをまたぐラテラルムーブメントの検知、リスクに応じたステップアップ認証が取り上げられました。日本語ブログでは、MFA 付きの AWS ビルダー ID や月額 20 USD から設定できる支出上限などを最初から適用する新しい AWS エクスペリエンスの安全なデフォルト設定、SATv2 によるマルチアカウント環境の LLM ジャッキング対策、Kiro の数百万回の評価から得た教訓、re:Invent 2026 のクラウドレジリエンス関連セッションガイド、AWS Weekly Roundup (Nitro Sandboxes、AWS Emulator など) が公開され、事例として United Airlines の Aurora MySQL から Apache Iceberg への CDC、Aderant の Iceberg と Lambda によるパイプライン刷新、Airbnb のコーディングエージェントのタスク単価による運用、Exa の AWS AI チップでの埋め込みスループット 50% 向上、Stretto の Nova 2 Sonic 音声エージェントなどが紹介されました。
