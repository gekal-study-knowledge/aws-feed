    "title": "CVE-2026-127119 - Unverified ownership of the default EMR cluster log location in AWS SDK for pandas"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-181-aws/"
    "published": "2026-11-13 04:07:08"
    "fetched": "2026-11-13 08:09:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-181-AWS<br /> <b>Publication Date:</b> 11/12/2026 13:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-127119, an issue in the EMR module of AWS SDK for pandas (awswrangler) from version 1.1.0 before 3.18.0. When a cluster is created without an explicit log location, the library uses a predictable default S3 bucket name for the cluster logs without verifying that the caller's account owns that bucket. A remote actor who creates that bucket first could read the cluster's logs, including job step output.</p> \n<p><b>Impacted versions:</b> &gt;= 1.1.0 AND &lt; 3.18.0</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-181-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "19cea5c03a68f7695b7bf77b62a46833":
    "id": "19cea5c03a68f7695b7bf77b62a46833"
    "title": "CVE-2026-126793 - Privilege escalation in Aurora PostgreSQL dialect detection in AWS Advanced Go Wrapper"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-182-aws/"
    "published": "2026-11-13 06:11:28"
    "fetched": "2026-11-13 08:09:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-182-AWS<br /> <b>Publication Date:</b> 11/12/2026 13:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>An untrusted search path issue in Aurora PostgreSQL dialect detection in the AWS Advanced Go Wrapper from release 2026-04-06 (awssql/v2.0.0) and before release 2026-07-29 (awssql/v2.0.3) could allow a remote authenticated user to escalate privileges to those of another database user, including a member of the rds_superuser role, via a crafted function that runs when that user connects to an Aurora PostgreSQL cluster through an affected version of the wrapper.</p> \n<p><b>Impacted versions:</b> AWS Advanced Go Wrapper &gt;=2026-04-06, &lt;2026-07-29</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-182-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
"last_updated": "2026-11-13 08:09:11 JST"
