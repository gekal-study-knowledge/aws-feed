"overview": |
  この日は 6 ソースから 43 本で、セキュリティ速報 2 件、ID とセキュリティまわりの機能追加、AWS Quick の日本語解説シリーズが中心でした。まず AWS Machine Learning Blog の 4 本は、いずれも Amazon Bedrock を中心としたエージェント構築がテーマです。Agent DLC の記事では、エージェントがデモからリリースまでの間で停滞する原因として、エージェントの良し悪しや直前の変更の効果を測る再現可能な方法がないことを挙げ、従来の手法が通用しなくなるエージェントの 3 つの性質を解説しています。Amazon Bedrock Managed Knowledge Base を Amazon Bedrock AgentCore Gateway 経由で MCP ツールとして AI エージェントに公開しつつ、リクエストインターセプターでユーザーごとのアクセス制御を保つ方法も紹介されました。さらに、Agent-to-Agent (A2A) プロトコルを使い、Amazon ECS 上の LangChain オーケストレーターと Amazon Bedrock AgentCore 上の Strands エージェントを連携させる、組み合わせ可能で相互運用性のあるマルチエージェントシステムの構築例が示されています。最後に、amazon-bedrock スキルの移行ガイドを使い、コーディングエージェントが読み取り専用の調査で計画を立てながら、顧客管理の Bedrock ナレッジベースを Managed Knowledge Base へ移行する手順が公開されました。セキュリティ速報は 2 件です。CVE-2026-127119 は AWS SDK for pandas (awswrangler) 1.1.0 以上 3.18.0 未満の EMR モジュールの問題で、ログの保存先を明示せずにクラスターを作成すると予測可能な既定の S3 バケット名を使い、そのバケットが呼び出し元アカウントの所有かを検証しないため、先にそのバケットを作成したリモートの攻撃者がクラスターのログを読める可能性があります。CVE-2026-126793 は AWS Advanced Go Wrapper の Aurora PostgreSQL 方言判定における信頼できない検索パスの問題で、2026-04-06 リリース (awssql/v2.0.0) 以降 2026-07-29 リリース (awssql/v2.0.3) より前が対象です。認証済みのリモートユーザーが、他のデータベースユーザー (rds_superuser ロールのメンバーを含む) の接続時に実行される関数を細工することで、そのユーザーの権限まで昇格できる可能性があります。What’s New では、Graviton5 ベースの R9g データベースインスタンスが Aurora の PostgreSQL / MySQL 互換と RDS for PostgreSQL・MySQL・MariaDB で一般提供となり、Aurora では同サイズの Graviton4 ベースと比べて最大 30% の性能向上、オンデマンド料金で最大 22% の価格性能向上が得られるとされています (データベースエンジン・バージョン・ワークロードによる)。Amazon MWAA は IAM Identity Center 統合とマルチチーム環境による詳細なアクセス制御に対応し、Amazon Connect Customer はエージェントワークスペースで関連ケースの結合とリンクができるようになり、Amazon SNS はアジアパシフィック (ハイデラバード・メルボルン)、欧州 (チューリッヒ)、AWS GovCloud (US-East) でプッシュ通知に対応しました。Architecture Blog では、本番トラフィックのサンプルを新しいコードに再生して本番と一致した結果の割合でデプロイを自動ゲートするモジュール式の回帰テストフレームワーク、Ray と Anyscale で Amazon EC2 上の分散 AI ワークロードをコード変更なしにスケールさせる構成、API ゲートウェイ・5 フェーズのエージェントランタイム・ナレッジと状態の層・プラットフォームサービス・横断的な信頼と統制のフレームワークからなる 5 層のエンタープライズ AI エージェント参照アーキテクチャが公開されました。Compute Blog では、顧客ごとに異なる請求サイクルを Amazon EventBridge Scheduler で扱い、定期請求と一度だけのリマインダーをスケジューリング基盤なしに実現する方法が紹介されています。Machine Learning Blog の追加分では、AWS Deep Learning Container として公開された SGLang-Neuron で AWS Trainium 上にフロンティアモデルをデプロイする方法、Natera が AgentCore 上に構築したラボ運用のエージェント型システム SWARM (初回応答が約 130 倍速く、サポートチケットの 96.2% を自動対応)、Bedrock のコストを左右する 4 つのリクエスト単位の選択 (キャッシュ期間・サービスティア・reasoning effort・maxTokens)、IAM プリンシパルごとの Bedrock 支出を CUR 2.0 と AWS Budgets で追跡し上限超過時に Deny ポリシーを適用する方法、タスクあたりのコスト最適化とエージェントの ROI 証明、LiteLLM と AWS Fargate で Bedrock の基盤モデルを OpenAI 互換 API として提供するセルフサービス LLM ゲートウェイ、次世代 AgentCore ランタイムの解説が取り上げられています。遅れて届いた What’s New は 7 件です。Amazon Cognito が OAuth 2.0 トークン交換 (RFC 8693) に対応し、ユーザーの代理で動くサービスや AI エージェントが、ユーザーのトークンを下流サービス向けにスコープを絞った新しいトークンへ交換できるようになりました。Amazon Bedrock AgentCore Identity は、受信側の JWT 認可と送信側の OAuth クレデンシャルプロバイダーの双方で OAuth 2.0 認可サーバーのディスカバリー URL に対応し、OIDC を使わない認可サーバーも設定できるようになりました。AWS Secrets Manager はクロスアカウントレプリケーションに対応し、既存のマルチリージョンレプリケーションをアカウント境界をまたいで拡張して、プラットフォームやセキュリティのチームがシークレットを中央で保有・ローテーションできます。AWS Security Hub CSPM は AWS Organizations の宣言型ポリシーに対応し、組織内の全アカウント・全リージョンでの有効化や、有効にするセキュリティ標準とコントロールの定義ができるようになりました。AWS Batch on Amazon EKS は Linux ケイパビリティ・seccomp プロファイル・ポッドレベル設定に対応し、Pod Security Standards の restricted プロファイルを強制するクラスターでも必要な権限とシステムコールだけでジョブを動かせます。Amazon RDS for Oracle はマイナーバージョンの自動アップグレードとメンテナンスウィンドウでの OS 更新のダウンタイムを短縮し、Kiro では AWS GovCloud (US) でも Grok 4.7 が使えるようになりました。日本語ブログは 11 本で、AWS Quick シリーズとして Smart Approvals による人の監督、AgentCore 上で動く冪等で監査可能な MCP サーバー Quick Resource Migrator によるアカウント間のリソース昇格、AWS PrivateLink による社内ネットワークからの接続、スキルとエージェントの仕組み、CloudFront・Cognito・API Gateway・Lambda を組み合わせたチャットエージェントの企業ポータルへの埋め込みが公開されました。ほかに AWS Emulator を使ったローカルでのテスト、Kiro for Android の提供開始、Grok 4.7 の Kiro 対応、GxP 環境で AI エージェントを構築するためのリスクベースのガイド、臨床開発での AI 活用の現在地、AWS Weekly Roundup (11 月 9 日) が出ています。遅れて取得した What's New は 4 件です。AWS Systems Manager の Cloud Connector が Google Cloud の VM にも対応し、手作業でエージェントを入れずに AWS・オンプレミス・Azure のリソースと並べて一元管理できるようになりました。Amazon MWAA Serverless ではネイティブの Apache Airflow UI が使えるようになり、開いた IAM ID の権限でワークフローの閲覧、実行やタスクインスタンスの確認、タスクログやソース・バージョンの参照、ワークフローの実行開始ができます。Amazon SageMaker Unified Studio はドメイン管理者が役割 (designation) ごとにプロジェクトメンバーに見せるツールや左ナビゲーションを制御できるレイアウトのカスタマイズに対応し、AWS Marketplace の出品者は払い戻されたみなし供給取引の VAT クレジットノートを AWS Partner Central からセルフサービスで提出できるようになりました。
