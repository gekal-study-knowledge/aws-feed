"entries":
  "1a30d1c8dc6f8ab8ea00e7cb60fd2183":
    "id": "1a30d1c8dc6f8ab8ea00e7cb60fd2183"
    "title": "Amazon Aurora and RDS now support Graviton5-based R9g database instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-aurora-rds-postgresql-mysql-mariadb-r9g-instances/"
    "published": "2026-11-13 04:02:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>AWS Graviton5-based R9g database instances are now generally available for Amazon Aurora with PostgreSQL compatibility and MySQL compatibility, and for Amazon RDS for PostgreSQL, MySQL, and MariaDB.<br /> &nbsp;<br /> Graviton5-based R9g instances provide up to a 30% performance improvement and up to a 22% price-performance improvement for on-demand pricing over Graviton4-based instances of equivalent sizes on Amazon Aurora, depending on database engine, version, and workload. Built on the AWS Nitro System, R9g instances are available in nine sizes, from large to 48xlarge. They deliver up to 192 vCPUs, an 8:1 ratio of memory to vCPU, up to 100 Gbps of networking bandwidth, and up to 72 Gbps of bandwidth to Amazon Elastic Block Store (Amazon EBS).&nbsp;</p> \n<p>You can get started using the R9g database instances through the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\">Amazon RDS Management Console</a> or by using the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be#Aurora.CreateInstance.Creating\">AWS Command Line Interface </a>(CLI). The instances are available in US East (N. Virginia, Ohio), US West (Oregon), and Europe (Frankfurt) regions. For the specific engine versions that support these instance classes, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.DBInstanceClass.SupportAurora.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\">Aurora</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\">RDS</a> documentation. For pricing, see <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora pricing</a> and <a href=\"https://aws.amazon.com/rds/pricing/\">Amazon RDS pricing</a>.</p>"
  "9ee3565cadb662621b39989f3dd5ece9":
    "id": "9ee3565cadb662621b39989f3dd5ece9"
    "title": "Amazon MWAA now supports fine-grained access control with IAM Identity Center and multi-team environments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/mwaa-fine-grained-access-control/"
    "published": "2026-11-13 03:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (Amazon MWAA) now supports fine-grained access control, giving administrators precise control over who can access which workflows and resources in an Apache Airflow environment. Fine-grained access control is delivered through two new capabilities: IAM Identity Center integration and multi-team environments.</p>\n<p>With IAM Identity Center integration, users sign in to the Apache Airflow UI with their corporate identity provider. Authorization is evaluated per request using IAM policies attached to IAM Identity Center Permission Sets, with condition keys that scope access by resource type (DAGs, connections, variables, pools, and more), action, and specific resource ID.</p>\n<p>With multi-team environments, several teams can share a single MWAA environment. Each team gets its own DAG folder in Amazon S3, and users see only shared DAGs plus their own teams' DAGs based on IAM Identity Center group membership. Teams reduce cost through shared infrastructure and simplify management by configuring environment settings once. Multi-team environments are based on the Apache Airflow multi-team feature, which is currently in preview.</p>\n<p>These features are available in all <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/get-started.html#regions\" target=\"_blank\">AWS Regions</a> where Amazon MWAA is available.</p>\n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/identity-center-integration.html\" target=\"_blank\">IAM Identity Center integration documentation</a> and the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/multi-team-environments.html\" target=\"_blank\">multi-team environments documentation</a>.</p>"
  "480e777fabdddbc7175fd0b1be2c925c":
    "id": "480e777fabdddbc7175fd0b1be2c925c"
    "title": "Amazon Connect Customer supports merging and linking related cases in the agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-cases-merge-link/"
    "published": "2026-11-13 02:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p>Amazon Connect Customer now lets agents merge and link related cases in the agent workspace, so they can resolve customer issues faster and respond consistently. When a customer contacts a business about the same issue more than once, or on different channels, the history can end up split across several cases. Agents can merge those cases into one case with a single, consolidated history. For example, an agent can merge the chat and email cases a customer opened about a delayed shipment.</p> \n<p>Agents can also link related cases, such as cases from different customers affected by the same issue, so they can coordinate one consistent response for every affected customer.</p> \n<p>Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\" target=\"_blank\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases.html\" target=\"_blank\">documentation</a>.</p>"
  "cceb8fac1084af44eb78a1947af0b44b":
    "id": "cceb8fac1084af44eb78a1947af0b44b"
    "title": "Amazon SNS now supports push notifications in four additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-sns-push-four-regions/"
    "published": "2026-11-13 01:00:00"
    "fetched": "2026-11-13 08:09:10"
    "summary": "<p><a href=\"https://aws.amazon.com/sns/\">Amazon Simple Notification Service (Amazon SNS)</a> now supports sending push notifications in the Asia Pacific (Hyderabad), Asia Pacific (Melbourne), Europe (Zurich), and AWS GovCloud (US-East) Regions.</p> \n<p>Amazon SNS is a fully managed pub/sub service that provides message delivery to multiple endpoints, including AWS Lambda, Amazon SQS, Amazon Data Firehose, HTTP, SMS (via AWS End User Messaging), push notifications, and email. With this launch, customers in these four additional Regions can use Amazon SNS to send push notifications to the following supported push notification services: Amazon Device Messaging (ADM), Apple Push Notification Service (APNs), Baidu Cloud Push (Baidu), Firebase Cloud Messaging (FCM), and Windows Push Notification Services (WNS).</p> \n<p>For the full list of Regions from which you can send push notifications, see <a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-mobile-push-supported-regions.html\">Supported Regions and Countries</a> in the Amazon SNS Developer Guide. For more information, see the <a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-mobile-application-as-subscriber.html\">Amazon SNS push notifications documentation</a>.</p>"
  "f744b56356848f5490d854ed553b5834":
    "id": "f744b56356848f5490d854ed553b5834"
    "title": "Amazon Cognito now supports OAuth 2.0 token exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-token-exchange/"
    "published": "2026-11-13 07:00:00"
    "fetched": "2026-11-13 13:52:30"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now supports OAuth 2.0 token exchange (RFC 8693). Amazon Cognito helps you add sign-up, sign-in, and access control to your web applications, mobile applications, and AI agents. With token exchange, a service or AI agent acting on a user's behalf can exchange the user's token for a new token scoped to a specific downstream service. Previously, a service that called another service on a user's behalf had to forward the user's original token or build and maintain its own token minting logic.</p> \n<p>With token exchange, you can issue a new token that has a narrower scope than the original token, is bound to a single audience, and comes without a refresh token. When you include an actor token, Cognito adds an act claim that identifies the intermediary, so downstream services can tell a request that an agent made on a user's behalf from one the user made directly. For example, a Model Context Protocol (MCP) server can exchange a user's token for a narrowly scoped token to call a backend API, with the act&nbsp;claim recording the MCP server as the actor.</p> \n<p>You can exchange tokens through the token endpoint or with the new <a href=\"https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_GetDerivedToken.html\">GetDerivedToken API</a>. Token exchange is available on the Essentials and Plus feature plans in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To learn more, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-token-exchange.html\">exchanging tokens for downstream services</a> in the Amazon Cognito Developer Guide.</p>"
  "e02ae61caf30cd7ff26931d56e98e782":
    "id": "e02ae61caf30cd7ff26931d56e98e782"
    "title": "Grok 4.7 now available on Kiro in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/kiro-grok-4-7-aws-govcloud-us/"
    "published": "2026-11-13 22:13:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>A new model is now available in the Kiro IDE and CLI for the AWS GovCloud (US) Regions.</p> \n<p>Grok 4.7 is SpaceXSI's most capable model for coding and knowledge work. It's built to stay focused through hard tasks that run for hours, and it checks its work before moving on. Compared with Grok 4.6, it plans and recovers from errors more reliably in repo-scale coding work. Grok 4.7 is available with experimental support and a 500K context window. Requests up to 200K tokens use a 2.7x credit multiplier, and requests over 200K tokens are billed at 5.4x.</p> \n<p>Kiro administrators control which models are available to their users, so organizations can align model access with their internal policies.</p> \n<p>Ensure your IDE or CLI is updated to the latest version, then restart it to access the new model from the model selector. For more details, visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">GovCloud documentation</a>, the <a href=\"https://kiro.dev/docs/enterprise/monitor-and-track/\">monitoring and tracking guide</a>, or contact your AWS account team. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "2734cb47cc2ee89534963648d0197dea":
    "id": "2734cb47cc2ee89534963648d0197dea"
    "title": "Amazon RDS for Oracle reduces downtime for automatic minor version upgrades and scheduled maintenance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/rds-oracle-reduces-maintenance-downtime-for-amvu-scheduled-upgrades/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> now reduces downtime for automatic minor version upgrades, as well as minor version upgrades and operating system updates scheduled for your maintenance window. Shorter maintenance makes it easier to stay current on the latest Oracle minor versions and operating system updates with less disruption to your applications. If you turned on automatic minor version upgrade, your DB instances benefit automatically.</p> \n<p>To apply these upgrades and updates, RDS has to set up new resources as part of the maintenance. Previously, RDS set up these resources after the maintenance started, which made your downtime longer. Now, RDS prepares them up to 30 minutes before your maintenance window, while your DB instance keeps serving your workload. When the maintenance window opens, your DB instance is offline for less time because resources required for the maintenance are already prepared. This applies to both Enterprise Edition and Standard Edition 2 DB instances.</p> \n<p>The preparation never blocks or delays your own operations, and your DB instance stays available while RDS prepares. If a change that you make conflicts with the preparation, RDS rolls back the staged resources, and your change goes ahead. If the preparation can't finish, RDS still applies the maintenance in your window, without the preparation. New RDS events tell you when the preparation starts, when it finishes, and when it can't finish.&nbsp;RDS for Oracle will continue to introduce improvements that further reduce maintenance downtime.</p> \n<p>This capability is available at no additional cost in all commercial AWS Regions and the AWS GovCloud (US) Regions where Amazon RDS for Oracle is available. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/maintenance-preparation.html\" rel=\"noopener noreferrer\" target=\"_blank\">Maintenance preparation</a>, <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Messages.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS event categories and event messages</a>, and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html\" rel=\"noopener noreferrer\" target=\"_blank\">Maintaining a DB instance</a> in the Amazon RDS User Guide.</p>"
  "4a640fd56aaf853a7017cd8e4cbf1f86":
    "id": "4a640fd56aaf853a7017cd8e4cbf1f86"
    "title": "AWS Security Hub CSPM now supports centralized configuration with AWS Organizations declarative policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-cspm-org-policies/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p><a href=\"https://aws.amazon.com/security-hub/cspm/\">AWS Security Hub CSPM</a> now supports AWS Organizations declarative policies. You can use them to enable Security Hub CSPM across all accounts and Regions in your organization and to define which security standards and controls are enabled.</p>\n<p>Policies can apply broadly to every account and Region, or target specific account and Region combinations. Declarative policies help keep each account's configuration aligned with its attached policy, which helps prevent configuration drift. You can also apply them automatically to new accounts, so each account starts with a baseline configuration as soon as it's created.</p>\n<p>Declarative policies are now the recommended way to manage Security Hub CSPM across an organization. They align with how other security services, such as Amazon GuardDuty, Amazon Inspector, and AWS Security Hub allow customers to manage configuration of the service. They also provide more flexibility, such as configuring Region-specific settings. You can continue to use central configuration until you're ready to migrate. When you are, use the migration process in the Security Hub CSPM console. It converts your existing central configuration policies into declarative policies and applies them to the appropriate accounts and regions.</p>\n<p>Declarative policies for Security Hub CSPM are available in all commercial, AWS GovCloud (US), and China Regions. To get started, see <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/orgs-policies-and-central-config.html#orgs-policies-import-tool\" target=\"_blank\">Migrating central configuration policies</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/accounts-orgs-policies.html\" target=\"_blank\">Declarative policies</a> in the AWS Security Hub CSPM User Guide and <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_security_hub_cspm.html\" target=\"_blank\">Security Hub CSPM policies</a> in the AWS Organizations User Guide. To receive notifications about new Security Hub CSPM features and controls, subscribe to the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-announcements.html\" target=\"_blank\">Security Hub SNS topic</a>. You can also <a href=\"https://aws.amazon.com/security-hub/cspm/pricing/\">try Security Hub CSPM at no cost for 30 days</a> with the AWS Free Tier offering.</p>"
  "0bcf956a742e3bf602d8012d5b206b5c":
    "id": "0bcf956a742e3bf602d8012d5b206b5c"
    "title": "Amazon Bedrock AgentCore Identity now supports OAuth 2.0 discovery URLs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/bedrock-agentcore-oauth2-discovery/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>Amazon Bedrock AgentCore Identity now supports OAuth 2.0 authorization server discovery URLs for both inbound JWT authorization and outbound OAuth credential providers. This update enables developers to configure AgentCore with OAuth 2.0 authorization servers that do not use OpenID Connect (OIDC).</p> \n<p>Previously, AgentCore Identity accepted only OIDC discovery URLs. Authorization servers that implement OAuth 2.0 without OIDC publish their metadata at a different well-known path and could not be used with AgentCore. With this launch, you can use either OIDC or OAuth 2.0 authorization server discovery URLs when you configure a JWT authorizer or a custom OAuth credential provider on AgentCore.</p> \n<p>This feature is available in all AWS Regions where Amazon Bedrock AgentCore is available, at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/inbound-jwt-authorizer.html\" rel=\"noopener noreferrer\" target=\"_blank\">Configure inbound JWT authorizer</a> and <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-add-oauth-client-custom.html\" rel=\"noopener noreferrer\" target=\"_blank\">Add OAuth client using custom provider</a> in the <i>Amazon Bedrock AgentCore Developer Guide</i>.</p>"
  "c697c48a76967728f98682224e23a5fc":
    "id": "c697c48a76967728f98682224e23a5fc"
    "title": "AWS Batch on Amazon EKS adds Linux capabilities, seccomp, and pod-level settings"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-batch-eks-security-context/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>AWS Batch now supports additional Kubernetes security context settings in Amazon EKS job definitions, including Linux capabilities, seccomp profiles, and pod-level settings.&nbsp;For EKS clusters that enforce the Kubernetes Pod Security Standards restricted profile, you can now run AWS Batch jobs with only the privileges and system calls they require.</p> \n<p>To get started, use the <i>RegisterJobDefinition</i> API to set <i>capabilities</i> and <i>seccompProfile</i> in a container's <i>securityContext</i>, or set <i>securityContext</i> in <i>podProperties</i> to define pod-wide settings such as <i>fsGroup</i>. Container-level settings override pod-level defaults. You can configure these settings through the AWS Management Console, AWS CLI, AWS SDKs, or AWS CloudFormation.</p> \n<p>The additional security context settings for AWS Batch on Amazon EKS are now supported in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where AWS Batch is available. For more information, see the Amazon EKS properties section in the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/job_definition_parameters.html#job-definition-parameters-eks-properties\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Batch User Guide</a>.</p>"
  "ab94bd8651e2baae883c5521298a1758":
    "id": "ab94bd8651e2baae883c5521298a1758"
    "title": "AWS Secrets Manager now supports cross-account replication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/secrets-manager-cross-account/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 05:16:46"
    "summary": "<p>AWS Secrets Manager now supports cross-account replication, enabling you to maintain a synchronized copy of a primary secret in a secondary AWS account for cross-account access, backup, and disaster recovery. Cross-account replication extends the existing multi-Region replication capability across account boundaries.</p> \n<p>With cross-account replication, platform or security teams can own and rotate a secret centrally, and each consuming account gets a local, always-current copy without any shared KMS keys or cross-account secret policies. The replica secret is a full, independent resource, encrypted with a customer managed KMS key owned by the replica account. Secrets Manager updates it automatically whenever the primary secret's value changes, including rotations.</p> \n<p>You can keep a live copy of critical secrets in a dedicated recovery or failover account, isolated from ransomware or a compromised primary account. If needed, the replica can be promoted to a standalone secret.</p> \n<p>Cross-account replication is available in all AWS Regions where Secrets Manager is available. For a list of regions where Secrets Manager is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/cross-account-replicate-secrets.html\" rel=\"noopener noreferrer\" target=\"_blank\">Replicate secrets across AWS accounts in the Secrets Manager User Guide</a> and the <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_AssociateCrossAccountReplica.html\" rel=\"noopener noreferrer\" target=\"_blank\">AssociateCrossAccountReplica API reference</a>. For pricing details, see <a href=\"https://aws.amazon.com/secrets-manager/pricing/\">AWS Secrets Manager pricing</a>.</p>"
  "3336dfbce6dc66fb3deb099248031da1":
    "id": "3336dfbce6dc66fb3deb099248031da1"
    "title": "Amazon SageMaker Unified Studio now supports layout customization for designations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-studio-layout-customization/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 10:13:51"
    "summary": "<p>Amazon SageMaker Unified Studio now supports layout customization, a new capability that gives domain administrators control over which tools and left navigation items project members see based on their designation. Organizations with data engineering, analytics, and machine learning teams on a single platform can configure a layout within each designation definition, and that layout applies across every project in the domain without per-project configuration.</p> \n<p>Previously, all project members saw the same interface regardless of their role, creating confusion and potential governance issues. With layout customization, administrators define a layout as part of a designation that specifies which left navigation items are visible for project members assigned to that designation. When a project member opens a project, SageMaker Unified Studio resolves the member's designation and renders only the tools included in their designation's layout. For example, a SQL analyst designation can be configured to show only the Query Editor, while an ML engineer designation shows notebooks, training jobs, and model endpoints. Navigation items are configurable across categories including Data Analytics, artificial intelligence and machine learning (AI/ML), Generative AI, and IDEs. If a project member navigates directly to a hidden page, they see an access-denied page. For members with multiple designations, visible tools are the union of all their designations' layouts. New navigation items added to SageMaker Unified Studio remain hidden for designations with a configured layout until an administrator adds them.</p> \n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">AWS Regions</a> where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/designations.html\">Designations</a> documentation.</p>"
  "8c204d2ff082f1f392608e04bdd78144":
    "id": "8c204d2ff082f1f392608e04bdd78144"
    "title": "AWS Marketplace now supports VAT credit notes for deemed supply refunds"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace-vat-credit-notes/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 10:13:51"
    "summary": "<p>AWS Marketplace sellers can now submit Value Added Tax (VAT) credit notes for refunded deemed supply transactions through a self-service experience in AWS Partner Central. Previously, VAT was disbursed to sellers for eligible transactions, and when a buyer was later refunded, sellers had to contact AWS to submit the corresponding credit note. This launch simplifies post-refund VAT documentation for sellers.</p>\n<p>Sellers can view eligible refund line items in the VAT on deemed supply section, select the refunds covered by a credit note, upload a PDF or the applicable electronic invoice format, and track the submission status. Sellers can consolidate multiple eligible refunds into a single credit note where applicable and review the associated financial adjustment in the Seller Insights reporting.</p>\n<p>These capabilities are available for eligible AWS Marketplace transactions, including Channel Partner Private Offer (CPPO) transactions, in supported EU member states, Norway, and the United Kingdom. Country-specific invoicing and electronic-invoicing requirements continue to apply.</p>\n<p>To get started, sign in to AWS Partner Central and go to Settings → Tax information → VAT on deemed supply. To learn more, visit the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/vat-on-deemed-supply.html\" target=\"_blank\">AWS Marketplace Seller Guide</a> or <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/vat-deemed-supply-faq.html\" target=\"_blank\">Deemed Supply FAQs</a>.</p>"
  "0a95df53544e01cc24100983853b98ca":
    "id": "0a95df53544e01cc24100983853b98ca"
    "title": "AWS Systems Manager simplifies onboarding of Google Cloud VMs for centralized management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/systems-manager-google-cloud-support/"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 10:13:51"
    "summary": "<p>AWS Systems Manager Cloud Connector now extends simplified multicloud onboarding support to Google Cloud, making it easy to connect your existing Google Cloud VMs to Systems Manager for centralized management alongside AWS, on-premises, and Azure resources without manual agent installation. Previously, managing virtual machines across multiple cloud providers often required coordinating and setting up configurations separately in each environment.</p> \n<p>With Cloud Connector for Google Cloud, you can automatically deploy the SSM Agent to Google Cloud VMs at scale. Once connected, Google Cloud VMs appear alongside EC2 instances, on-premises servers, and other multicloud resources in a unified view, enabling you to use Session Manager, Automation runbooks, Run Command, State Manager, Patch Manager, and Inventory across AWS, on-premises, Azure, and Google Cloud from a single workflow. This simplifies operations for teams managing infrastructure across multiple clouds, enabling them to standardize management practices and reduce operational complexity.</p> \n<p>Cloud Connector for Google Cloud is available in Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad, Jakarta, Malaysia, Melbourne, Mumbai, New Zealand, Osaka, Seoul, Singapore, Sydney, Taipei, Thailand, Tokyo), Canada (Central, Calgary), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), Israel (Tel Aviv), Mexico (Central), South America (Sao Paulo), US East (N. Virginia, Ohio), and US West (N. California, Oregon).</p> \n<p>To learn more, visit the AWS Systems Manager documentation.</p>"
  "97a90f31e527fddbe1f412079d5b7195":
    "id": "97a90f31e527fddbe1f412079d5b7195"
    "title": "Apache Airflow UI available in Amazon MWAA Serverless"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/airflow-ui-for-mwaa-serverless/"
    "published": "2026-11-13 03:00:00"
    "fetched": "2026-11-14 10:13:51"
    "summary": "<p>Amazon MWAA Serverless provides the native Apache Airflow UI for your workflows. You can browse workflows, inspect workflow runs and task instances, read task logs, view a workflow's source and versions, and start a workflow run. The UI uses the permissions of the IAM identity that opens it and shows only what that identity can read, so read-only access is possible. AWS CloudTrail records the calls the UI makes under your identity.</p>\n<p>You can open the Airflow UI from the Amazon MWAA console, the AWS CLI, or the API. Teams already familiar with Airflow can use the interface they know to work with their workflows.</p>\n<p>This feature is available in all AWS Regions where Amazon MWAA Serverless is available. For more information, see the <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/what-is-mwaa-serverless.html#regions\" target=\"_blank\">AWS Region table</a>.</p>\n<p>To get started, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/workflows-airflow-ui.html\" target=\"_blank\">Access the Airflow UI</a>. Apache Airflow is a trademark of the <a href=\"https://www.apache.org/\" target=\"_blank\">Apache Software Foundation</a>.</p>"
"last_updated": "2026-11-14 10:13:51 JST"
