"entries":
  "8ca61c84821dceee2e1a284f1dae6a83":
    "id": "8ca61c84821dceee2e1a284f1dae6a83"
    "title": "Migrate to Amazon Bedrock Managed Knowledge Base with your coding agent"
    "link": "https://aws.amazon.com/blogs/machine-learning/migrate-to-amazon-bedrock-managed-knowledge-base-with-your-coding-agent/"
    "published": "2026-11-13 01:16:45"
    "fetched": "2026-11-13 02:53:00"
    "summary": "The migration guide in the amazon-bedrock skill helps you migrate a customer-managed Amazon Bedrock knowledge base to a Managed Knowledge Base. Your coding agent plans the move with read-only discovery, creates the new knowledge base or an infrastructure-as-code template alongside the original, and validates retrieval before you cut over."
  "e9faaef67df8f04989fa4b9d02eb711e":
    "id": "e9faaef67df8f04989fa4b9d02eb711e"
    "title": "Build composable, interoperable multi-agent systems with A2A on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-composable-interoperable-multi-agent-systems-with-a2a-on-aws/"
    "published": "2026-11-13 00:42:21"
    "fetched": "2026-11-13 02:53:00"
    "summary": "Build a composable, interoperable multi-agent system on AWS with the Agent-to-Agent (A2A) protocol. A LangChain orchestrator on Amazon ECS communicates with a Strands agent on Amazon Bedrock AgentCore across organizational boundaries, using bidirectional, OAuth-authenticated calls, with neither side depending on the other's framework or SDK."
  "77f3bc333156b274661353d076ce05d1":
    "id": "77f3bc333156b274661353d076ce05d1"
    "title": "Fine-grained access control for Amazon Bedrock Managed Knowledge Base tools"
    "link": "https://aws.amazon.com/blogs/machine-learning/fine-grained-access-control-for-amazon-bedrock-managed-knowledge-base-tools/"
    "published": "2026-11-13 00:40:24"
    "fetched": "2026-11-13 02:53:00"
    "summary": "Learn how to expose an Amazon Bedrock Managed Knowledge Base to AI agents as MCP tools through Amazon Bedrock AgentCore Gateway while keeping per-user access control. A request interceptor injects verified identity, Policy in AgentCore validates it independently, and a resource-based policy restricts direct access to the knowledge base."
  "acc289516f999b4445756a3d7781ebb8":
    "id": "acc289516f999b4445756a3d7781ebb8"
    "title": "From prototype to production: Engineering agents with Agent DLC"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-prototype-to-production-engineering-agents-with-agent-dlc/"
    "published": "2026-11-13 00:38:47"
    "fetched": "2026-11-13 02:53:00"
    "summary": "Agents stall between demo and release when teams lack a repeatable way to measure how good an agent is and whether the last change helped. This post covers three agent properties that break traditional CI/CD, a measured case where an aggregate metric hides a coverage gap, and Agent DLC: one lifecycle, two loops, and one explicit standard for judging every change."
  "df8825a36885b8465ac06ed5539148ee":
    "id": "df8825a36885b8465ac06ed5539148ee"
    "title": "Deploy frontier AI models on AWS Trainium with SGLang-Neuron"
    "link": "https://aws.amazon.com/blogs/machine-learning/deploy-frontier-ai-models-on-aws-trainium-with-sglang-neuron/"
    "published": "2026-11-13 07:03:34"
    "fetched": "2026-11-13 08:09:12"
    "summary": "SGLang-Neuron is now publicly available through an AWS Deep Learning Container. With SGLang-Neuron, you can serve models and generate reinforcement learning rollouts with SGLang on AWS Trainium using the same SGLang interface you already know, all running on native PyTorch."
  "fa2583dd38f815710f2e73a5d615094b":
    "id": "fa2583dd38f815710f2e73a5d615094b"
    "title": "How Natera designed an agentic AI system for lab ops with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-natera-designed-an-agentic-ai-system-for-lab-ops-with-amazon-bedrock-agentcore/"
    "published": "2026-11-13 06:47:07"
    "fetched": "2026-11-13 08:09:12"
    "summary": "Natera built SWARM, an agentic AI system on Amazon Bedrock AgentCore that captures institutional lab-operations knowledge and deploys it at scale. This post walks through the full architecture, from knowledge base construction to deployment and evaluation, delivering about 130x faster first response and 96.2% automated coverage across support tickets."
  "408e1d46a9e738e7364ac1b7d8fe1f11":
    "id": "408e1d46a9e738e7364ac1b7d8fe1f11"
    "title": "Four Amazon Bedrock inference choices that affect cost"
    "link": "https://aws.amazon.com/blogs/machine-learning/four-amazon-bedrock-inference-choices-that-affect-cost/"
    "published": "2026-11-13 05:51:55"
    "fetched": "2026-11-13 08:09:12"
    "summary": "Your Amazon Bedrock inference bill can keep climbing even after you tune prompts and application logic. Four request-level choices (cache duration, service tier, reasoning effort, and maxTokens) change how many tokens the service processes and the rate applied. We show how we tested each and how to verify the effect."
  "f150dbd78a901dfa566dc87f427956ad":
    "id": "f150dbd78a901dfa566dc87f427956ad"
    "title": "Tokenomics at scale: Track and cap Amazon Bedrock spend per IAM principal with CUR 2.0 and AWS Budgets"
    "link": "https://aws.amazon.com/blogs/machine-learning/tokenomics-at-scale-track-and-cap-amazon-bedrock-spend-per-iam-principal-with-cur-2-0-and-aws-budgets/"
    "published": "2026-11-13 04:29:55"
    "fetched": "2026-11-13 08:09:12"
    "summary": "Get per-identity Amazon Bedrock cost visibility and enforceable spend limits using only AWS-native features, with no application code for the common case. Attribute spend with IAM principal tags, report with CUR 2.0 or Cost Explorer, and enforce with AWS Budgets actions that apply a Deny policy when a threshold is crossed."
  "1047a94153531bee451d383044fae5bc":
    "id": "1047a94153531bee451d383044fae5bc"
    "title": "Optimizing cost per task and proving agent ROI on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/optimizing-cost-per-task-and-proving-agent-roi-on-amazon-bedrock/"
    "published": "2026-11-13 03:43:19"
    "fetched": "2026-11-13 08:09:12"
    "summary": "Comparing per-token prices hides the real cost of running a model on Amazon Bedrock. This post shows how to calculate the true cost per task across four hidden cost drivers, reduce it with caching, routing, and output constraints, and prove agent ROI with human baselines, holdout experiments, and a five-dimension scorecard."
  "d26211a1e86d20cc31e006ba4f5a6781":
    "id": "d26211a1e86d20cc31e006ba4f5a6781"
    "title": "Building a self-service LLM gateway with Amazon Bedrock and LiteLLM"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-a-self-service-llm-gateway-with-amazon-bedrock-and-litellm/"
    "published": "2026-11-13 03:41:12"
    "fetched": "2026-11-13 08:09:12"
    "summary": "Build a self-service LLM gateway with LiteLLM on AWS Fargate that puts Amazon Bedrock foundation models behind an OpenAI-compatible API. Developers get instant access through a single API key, while platform teams gain per-user cost controls, quota isolation, and observability."
  "be4ac4731687912a8fe4c896d5f4d118":
    "id": "be4ac4731687912a8fe4c896d5f4d118"
    "title": "Run agents securely and efficiently with the next generation AgentCore runtime"
    "link": "https://aws.amazon.com/blogs/machine-learning/run-agents-securely-and-efficiently-with-the-next-generation-agentcore-runtime/"
    "published": "2026-11-13 02:59:59"
    "fetched": "2026-11-13 08:09:12"
    "summary": "AI agents now run multi-step workloads for hours and act on behalf of users, raising the bar for secure, scalable agent compute. Learn how the next generation of Amazon Bedrock AgentCore runtime delivers hardware-isolated sessions with faster starts, more compute, usage-based billing, and isolation that now extends to your data."
"last_updated": "2026-11-13 08:09:12 JST"
