"overview": |
  この日は Amazon Bedrock AgentCore を軸にした AI エージェントの記事と、セキュリティ速報、データ分析サービスの機能追加が中心でした。セキュリティ速報では、Trusted Remote Execution (REX) のセットアップガイドに含まれる SSM ドキュメント例の OS コマンドインジェクション CVE-2026-122193 と、Babelfish for Aurora PostgreSQL の TDS プロトコル層の問題 CVE-2026-119923 / CVE-2026-119924 が公表されました。AgentCore 関連では、Claude Code をリモートセッションとして AgentCore 上で動かす方法、Okta Cross App Access と組み合わせたエージェントのアクセス統制 (2 部作)、Greenlight Financial の自律型 SOC、Taxbit Assist の事例が紹介され、Amazon Quick のエージェントプリミティブの分類も公開されています。データ分析では MWAA Serverless が Airflow の connections / variables と、プロバイダーパッケージやカスタムのオペレーターに対応し、Redshift の SUPER 型は最大 1,600 万バイトの文字列を扱えるようになりました。ほかに SageMaker Inference の NVIDIA MIG 対応、EC2 Capacity Blocks for ML の前払い料金の償却表示、MSK Replicator と Agent Registry の GovCloud 提供、Bedrock での Kimi K3.1 Pro (Highspeed) 提供がありました。
