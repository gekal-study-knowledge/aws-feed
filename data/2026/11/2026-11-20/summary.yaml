"overview": |
  この日は 7 ソースから 97 本で、セキュリティ速報 4 件、Lambda の 30 分タイムアウトと Durable Functions の OpenTelemetry 対応、AI エージェントによる決済と購買、Aurora・Cognito・CloudFront の機能拡張が中心でした。セキュリティ速報では、PHP Foundation が 11 月 19 日に公開したセキュリティリリース (PHP 8.2.36、8.3.37 など、Bulletin 2026-190-AWS) の告知に続き、CVE-2026-132607 (2026-191-AWS) として AWS SDK for PHP の Amazon S3 Encryption Client for PHP の復号処理がオブジェクトのメタデータに記録された AES-GCM 認証タグの長さを検証しておらず、暗号化オブジェクトへの読み書き権限を持ち平文を知る・推測できるユーザーが、繰り返し書き込むことで同じ長さの任意の平文に復号される暗号文を作れるおそれがあること (平文や鍵は漏れない)、2026-192-AWS として 11 月 18 日に公開された nginx の HTTP/2 実装の問題 (CVE-2026-123007、CVE-2026-123633、CVE-2026-123634、CVE-2026-113425、CVE-2026-121810、CVE-2026-118899) が nginx 1.30.7 (stable) と 1.31.9 (mainline) で修正済みで、AWS は世界中で緩和策を展開中であり、完全な HTTP リクエストが形成される前の HTTP/2 プロトコル層で悪用され得るため AWS WAF のマネージドルールやカスタムルールでは検知・ブロックできないこと、2026-193-AWS として CRuby の正規表現エンジンと一部の非 UTF-8 エンコーディングでの文字列の大文字小文字変換にある 7 件のメモリ安全性の問題 (CVE-2026-132825 など、Ruby 4.0.10、3.4.13、3.3.14 より前が影響) で、第三者が制御する入力を処理するとリモートの未認証攻撃者がプロセスのクラッシュ・メモリの読み取り・任意コード実行を行えるおそれがあり、Rails や Sinatra など Rack ベースのアプリは既定のリクエスト処理で到達し得ることが公開されました。AWS Lambda はオンデマンドの Event Functions と Lambda Managed Instances での同期呼び出しのタイムアウトを従来の 15 分から 30 分に倍増し、Lambda durable functions は OpenTelemetry によるトレースに対応して多数の呼び出しにまたがるワークフローのトレースを 1 本にまとめられるようになり、Lambda Managed Instances で予測できるトラフィックの急増 (コンサートのチケット販売) の前に容量を温めておく参照実装も紹介されました。日本語ブログでも Lambda Managed Instances のイベント関数の GPU 対応が取り上げられています。エージェントと購買では、AWS Marketplace が x402 プロトコルによるエージェント決済に対応し、AI エージェントが AgentCore payments を通じて対象製品をリクエスト単位で米ドル建てで購入して AWS の請求にまとめられるようになり、Marketplace の agent mode は販売者のセキュリティ評価から購入・デプロイまでを 1 回の会話で行えるようになりました。AgentCore harness はオープンソースの Strands harness 上で動くようになり、推奨モデル、自動プロンプトキャッシュ、コンテキスト管理、組み込みツール、ライフサイクルフックが加わりました。データベースでは、Aurora DSQL がストレージ層の改良で書き込みスループットを最大 50% 高め、異なる大陸のリージョン (例: 米国東部 (バージニア北部) と欧州 (アイルランド)) でマルチリージョンクラスターを作れるようになり、Aurora PostgreSQL と Aurora MySQL のクラスターはデータ移行なしで別の VPC へ移動でき、express configuration で作った Aurora PostgreSQL も VPC へ移せるようになりました。ID・ネットワークでは、Amazon Cognito が OAuth のクライアント ID メタデータドキュメント (CIMD) とアプリクライアントシークレットの Secrets Manager 保管に対応し、Route 53 がインターネットに出ないプライベートエンドポイントのヘルスチェックを提供し、CloudFront の SaaS Manager はダウンタイムなしのドメイン移行、IP アドレスによるルーティング、接続ログに対応しました。AWS WAF はアカウント内のすべての保護対象アプリのトラフィックをまとめて調査できる新しいセキュリティ分析ダッシュボードを公開しています。そのほか、Amazon Connect Customer の返金や取引の異議申し立てなど大量の業務をエンドツーエンドで処理するエージェント型ソリューション Resolutions の一般提供、AWS Transform の移行評価と移行計画の統合およびアプリケーション中心の移行の全工程への拡大、MSK Connect のコネクタ再起動、Amazon IVS Real-Time Streaming の Linux ブロードキャスト SDK、MediaTailor のライブ HLS 向け Dynamic Avail Sizing、WorkSpaces Applications の WebAuthn リダイレクト、Partner Central の AI 支援によるリスティング作成、Revenue Measurement の案件単位の収益帰属、コロンビアのボゴタの新しい Local Zone の一般提供が発表されました。Amazon EC2 の Detailed Monitoring による GPU ごとの 1 分間隔メトリクスとパフォーマンスステータスチェック、SageMaker HyperPod の強化されたインフラ可観測性、SageMaker AI のクロスリージョン推論ルーティングと推論エンドポイントのレイテンシ変化・アイドル GPU の既定監視、2026 年の SageMaker 推論の新機能 13 件の振り返り、PolyAI Dialog-RSN-1 の SageMaker JumpStart と Marketplace での提供、Polly のボイスクローニング、Kimi Code CLI v2.7.0 の Bedrock ネイティブ対応 (Kimi K3.1 Pro など)、Skyflow と AgentCore Gateway による機密データの非識別化、NVIDIA Run:ai GPU Fractioning で EKS 上の A10G GPU 1 枚に 2 つの Pod を載せる手順も紹介されました。事例では、Cognition が EC2 Mac で Devin に毎セッション新しい macOS VM を割り当てる仕組み、Country Road Group の BizTalk からサーバーレス統合基盤への移行、BMW Group の数百のエージェントのガバナンス、Accenture の Bedrock のトークンコスト最適化、Cisco が AWS AI League で 1,200 人のエンジニアを育成した事例 (2025 年の世界大会で Cisco のエンジニアが優勝)、コーエーテクモゲームス「信長の野望 出陣」の API サーバーの Graviton4 移行、BTM のシステム調査エージェントの AgentCore での再構築が公開され、AWS Security Incident Response による検出結果のトリアージの解説、re:Invent 2026 (11 月 30 日〜12 月 4 日、ラスベガス) のセキュリティ・アイデンティティ・ガバナンスのガイド、4 人の新しい AWS ヒーローの紹介もありました。後から追加された分では、AWS DevOps Agent が Slack のコードチャネル (調査ごとに専用チャネルを作り、エージェントを @メンションせずに追加の質問ができる) と Microsoft Teams での双方向の会話に対応し、オンコール担当者が普段のツールの中でインシデントを調査・解決できるようになりました。日本語ブログでは、AI エージェントと並行して 1 つの機能の各部分を開発する Kiro Crew の Conductor mode の紹介と、生成 AI 実用化推進プログラムの第 9 回 AWS ジャパン 生成 AI Frontier Meetup の開催報告が公開されています。さらに後から追加された分では、Lambda が Python 3.15 に対応し (Event Functions は一般提供、Web Functions では初の Python ランタイムとしてパブリックプレビュー)、AWS CloudFormation のアカウント・リージョンあたりの既定のスタック数クォータが 2,000 から 300,000 に引き上げられました。Route 53 は誤ったレコード削除を防ぐ Change Guardrails やレコード単位の変更履歴を備えた新しい階層 Advanced Hosted Zones、プライベートホストゾーンのパブリック DNS フォールバック、クライアントと同じ AZ のリソースに DNS クエリを振り向ける AZ アフィニティルーティングを発表し、VPC IPAM ポリシーは Network Firewall の自動インターネットファイアウォールと Lambda Web Functions・MicroVMs に対応しました。AWS DevOps Agent はチャット機能を Kiro や Claude Code などの MCP クライアントへ広げ、コミュニティとパートナーのツールリポジトリを追加し、調査の所要時間も短縮しています。ストレージ・データでは、第 3 世代の Amazon FSx for NetApp ONTAP (ファイルシステムあたり最大 216 GB/s、860 万 SSD IOPS) と、AWS Backup による DynamoDB の増分バックアップ (最短 1 時間間隔) が登場し、SageMaker は Unified Studio のブループリントとカタログの改善、データ品質監視の簡素化、DuckDB 2.0 対応を発表しました。生成 AI 機能を加えた Amazon Textract Insights が米国東部 (バージニア北部) などで一般提供となり、Textract Core には AI エージェント向けのスキルが加わり、AgentCore runtime instances は NVIDIA RTX PRO 4500 Blackwell を搭載する EC2 G7 に対応しました。AWS Agent Registry は WebBotAuth ボットの登録と検証済みドメイン名による公開ディスカバリーに対応し、Lambda MicroVMs の KMS カスタマー管理キー、Secrets Store CSI Driver Provider の AssumeRole によるクロスアカウントアクセス、IAM Roles Anywhere のエイリアス、VPC Lattice の VPC リソース向け CloudWatch メトリクス、Continuum for Penetration Testing (旧 AWS Security Agent) のタスク時間の事前見積もりも発表されました。そのほか、CUR 2.0 と Cost Explorer の標準化されたコスト・レート列、第 2 世代 Outposts ラックのアジアパシフィック (大阪) 対応、Amazon Transcribe の AWS European Sovereign Cloud (ドイツ) 提供、RDS for Db2 のデータベース名変更・カナダの新しいタイムゾーン 4 種・オブジェクト単位の監査ポリシー、RDS Custom for SQL Server の最新 CU・GDR 対応、Device Farm の Test Insights、AWS RTB Fabric Modules の Marketplace での一般提供、Partner Central のガイドが続きました。さらにその後に追加された分では、プレビューで AWS Blocks と呼ばれていた AWS CDK Blocks が一般提供となり、データの保存・処理、バックグラウンドジョブ、AI エージェントの構築といったよくあるアプリ機能を本番品質の部品として CDK コンストラクトの上に提供します。AWS DevOps Agent は、エージェントが実行できるスクリプトを含むスキルを書いたりエージェント自身がスクリプトを書いて実行したりできるサンドボックスと、調査で根本原因を見つけた頻度・所要時間・コンテキストが足りなかった箇所などを追う品質・レイテンシのダッシュボードを追加しました。AWS Parallel Computing Service は、GPU メモリの訂正不能エラーのように EC2 が検出できないアクセラレーテッドインスタンスのハードウェア・ソフトウェアの問題を見つけ、計算ノードをスケジューリングから外してインスタンスを置き換えるマネージドなヘルスチェックに対応し、AWS Elemental MediaLive は AWS Elemental Inference Smart Subtitles の AI 生成字幕や Teletext・WebVTT などから CEA-608/708 の埋め込み字幕を作れるようになりました。
