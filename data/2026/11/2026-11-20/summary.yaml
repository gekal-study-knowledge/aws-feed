"overview": |
  この日は 7 ソースから 57 本で、セキュリティ速報 4 件、Lambda の 30 分タイムアウトと Durable Functions の OpenTelemetry 対応、AI エージェントによる決済と購買、Aurora・Cognito・CloudFront の機能拡張が中心でした。セキュリティ速報では、PHP Foundation が 11 月 19 日に公開したセキュリティリリース (PHP 8.2.36、8.3.37 など、Bulletin 2026-190-AWS) の告知に続き、CVE-2026-132607 (2026-191-AWS) として AWS SDK for PHP の Amazon S3 Encryption Client for PHP の復号処理がオブジェクトのメタデータに記録された AES-GCM 認証タグの長さを検証しておらず、暗号化オブジェクトへの読み書き権限を持ち平文を知る・推測できるユーザーが、繰り返し書き込むことで同じ長さの任意の平文に復号される暗号文を作れるおそれがあること (平文や鍵は漏れない)、2026-192-AWS として 11 月 18 日に公開された nginx の HTTP/2 実装の問題 (CVE-2026-123007、CVE-2026-123633、CVE-2026-123634、CVE-2026-113425、CVE-2026-121810、CVE-2026-118899) が nginx 1.30.7 (stable) と 1.31.9 (mainline) で修正済みで、AWS は世界中で緩和策を展開中であり、完全な HTTP リクエストが形成される前の HTTP/2 プロトコル層で悪用され得るため AWS WAF のマネージドルールやカスタムルールでは検知・ブロックできないこと、2026-193-AWS として CRuby の正規表現エンジンと一部の非 UTF-8 エンコーディングでの文字列の大文字小文字変換にある 7 件のメモリ安全性の問題 (CVE-2026-132825 など、Ruby 4.0.10、3.4.13、3.3.14 より前が影響) で、第三者が制御する入力を処理するとリモートの未認証攻撃者がプロセスのクラッシュ・メモリの読み取り・任意コード実行を行えるおそれがあり、Rails や Sinatra など Rack ベースのアプリは既定のリクエスト処理で到達し得ることが公開されました。AWS Lambda はオンデマンドの Event Functions と Lambda Managed Instances での同期呼び出しのタイムアウトを従来の 15 分から 30 分に倍増し、Lambda durable functions は OpenTelemetry によるトレースに対応して多数の呼び出しにまたがるワークフローのトレースを 1 本にまとめられるようになり、Lambda Managed Instances で予測できるトラフィックの急増 (コンサートのチケット販売) の前に容量を温めておく参照実装も紹介されました。日本語ブログでも Lambda Managed Instances のイベント関数の GPU 対応が取り上げられています。エージェントと購買では、AWS Marketplace が x402 プロトコルによるエージェント決済に対応し、AI エージェントが AgentCore payments を通じて対象製品をリクエスト単位で米ドル建てで購入して AWS の請求にまとめられるようになり、Marketplace の agent mode は販売者のセキュリティ評価から購入・デプロイまでを 1 回の会話で行えるようになりました。AgentCore harness はオープンソースの Strands harness 上で動くようになり、推奨モデル、自動プロンプトキャッシュ、コンテキスト管理、組み込みツール、ライフサイクルフックが加わりました。データベースでは、Aurora DSQL がストレージ層の改良で書き込みスループットを最大 50% 高め、異なる大陸のリージョン (例: 米国東部 (バージニア北部) と欧州 (アイルランド)) でマルチリージョンクラスターを作れるようになり、Aurora PostgreSQL と Aurora MySQL のクラスターはデータ移行なしで別の VPC へ移動でき、express configuration で作った Aurora PostgreSQL も VPC へ移せるようになりました。ID・ネットワークでは、Amazon Cognito が OAuth のクライアント ID メタデータドキュメント (CIMD) とアプリクライアントシークレットの Secrets Manager 保管に対応し、Route 53 がインターネットに出ないプライベートエンドポイントのヘルスチェックを提供し、CloudFront の SaaS Manager はダウンタイムなしのドメイン移行、IP アドレスによるルーティング、接続ログに対応しました。AWS WAF はアカウント内のすべての保護対象アプリのトラフィックをまとめて調査できる新しいセキュリティ分析ダッシュボードを公開しています。そのほか、Amazon Connect Customer の返金や取引の異議申し立てなど大量の業務をエンドツーエンドで処理するエージェント型ソリューション Resolutions の一般提供、AWS Transform の移行評価と移行計画の統合およびアプリケーション中心の移行の全工程への拡大、MSK Connect のコネクタ再起動、Amazon IVS Real-Time Streaming の Linux ブロードキャスト SDK、MediaTailor のライブ HLS 向け Dynamic Avail Sizing、WorkSpaces Applications の WebAuthn リダイレクト、Partner Central の AI 支援によるリスティング作成、Revenue Measurement の案件単位の収益帰属、コロンビアのボゴタの新しい Local Zone の一般提供が発表されました。Amazon EC2 の Detailed Monitoring による GPU ごとの 1 分間隔メトリクスとパフォーマンスステータスチェック、SageMaker HyperPod の強化されたインフラ可観測性、SageMaker AI のクロスリージョン推論ルーティングと推論エンドポイントのレイテンシ変化・アイドル GPU の既定監視、2026 年の SageMaker 推論の新機能 13 件の振り返り、PolyAI Dialog-RSN-1 の SageMaker JumpStart と Marketplace での提供、Polly のボイスクローニング、Kimi Code CLI v2.7.0 の Bedrock ネイティブ対応 (Kimi K3.1 Pro など)、Skyflow と AgentCore Gateway による機密データの非識別化、NVIDIA Run:ai GPU Fractioning で EKS 上の A10G GPU 1 枚に 2 つの Pod を載せる手順も紹介されました。事例では、Cognition が EC2 Mac で Devin に毎セッション新しい macOS VM を割り当てる仕組み、Country Road Group の BizTalk からサーバーレス統合基盤への移行、BMW Group の数百のエージェントのガバナンス、Accenture の Bedrock のトークンコスト最適化、Cisco が AWS AI League で 1,200 人のエンジニアを育成した事例 (2025 年の世界大会で Cisco のエンジニアが優勝)、コーエーテクモゲームス「信長の野望 出陣」の API サーバーの Graviton4 移行、BTM のシステム調査エージェントの AgentCore での再構築が公開され、AWS Security Incident Response による検出結果のトリアージの解説、re:Invent 2026 (11 月 30 日〜12 月 4 日、ラスベガス) のセキュリティ・アイデンティティ・ガバナンスのガイド、4 人の新しい AWS ヒーローの紹介もありました。
