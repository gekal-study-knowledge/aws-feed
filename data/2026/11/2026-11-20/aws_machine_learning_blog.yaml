  "f8d1215d4240105601aa72a64f486ca8":
    "id": "f8d1215d4240105601aa72a64f486ca8"
    "title": "From learning to leaderboard: How Cisco upskilled 1,200 engineers in agentic AI with AWS AI League"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-learning-to-leaderboard-how-cisco-upskilled-1200-engineers-in-agentic-ai-with-aws-ai-league/"
    "published": "2026-11-20 03:26:22"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Cisco and AWS used Cisco Transformation Fest and AWS AI League to turn hands-on AI learning into a culture of building. A Cisco engineer won the 2025 AWS AI League global title and 1,200 engineers competed in 2026. This post shares Cisco's journey, lessons from the 2026 winning agent built on Amazon Bedrock AgentCore, and how to host your own league."
  "06cd415955a31b80429c9e1b5c37d41c":
    "id": "06cd415955a31b80429c9e1b5c37d41c"
    "title": "Keep inference running through regional capacity shortfalls with cross-Region inference routing in Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/keep-inference-running-through-regional-capacity-shortfalls-with-cross-region-inference-routing-in-amazon-sagemaker-ai/"
    "published": "2026-11-20 03:20:54"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Cross-Region inference routing in Amazon SageMaker AI gives your application one invocation path across the endpoints and inference components you already run, in one or more AWS Regions and AWS accounts. The router prefers its own Region and shifts new requests to another destination only when the local one can't serve reliably."
  "6c14e03b2274ee04a488d943081d6f59":
    "id": "6c14e03b2274ee04a488d943081d6f59"
    "title": "Protect agent tool calls with Skyflow and Amazon Bedrock AgentCore Gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/protect-agent-tool-calls-with-skyflow-and-amazon-bedrock-agentcore-gateway/"
    "published": "2026-11-20 03:14:36"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Learn how Skyflow and Amazon Bedrock AgentCore Gateway keep sensitive data out of the tools your AI agents call. Added as a gateway interceptor, Skyflow de-identifies data before any tool, model, or log sees it, and restores it for authorized callers, with no change to your agent code."
  "1a620e0629976e84e91df312086e6c1d":
    "id": "1a620e0629976e84e91df312086e6c1d"
    "title": "PolyAI Dialog-RSN-1 is now on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/blogs/machine-learning/polyai-dialog-rsn-1-is-now-on-amazon-sagemaker-jumpstart/"
    "published": "2026-11-20 02:28:47"
    "fetched": "2026-11-20 03:48:48"
    "summary": "PolyAI Dialog-RSN-1, a reasoning model built for real-time complex dialog, is available today on AWS Marketplace and Amazon SageMaker JumpStart. Discover it, evaluate it on your own data, and deploy it to a secure SageMaker endpoint in your own AWS account."
  "9916358d3dd1bc77cbb024e442564882":
    "id": "9916358d3dd1bc77cbb024e442564882"
    "title": "Introducing enhanced infrastructure observability in Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-enhanced-observability-in-amazon-sagemaker-hyperpod-to-diagnose-gpu-training-issues/"
    "published": "2026-11-20 01:41:35"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Amazon SageMaker HyperPod now offers enhanced observability to help you diagnose GPU training issues faster. It brings together diagnostic and profiling capabilities for training workloads on both Amazon EKS and Slurm orchestrators, pinpointing issues across GPU, network, and host layers."
  "0805ffb75d0ae5e88a5e8274b97cc20f":
    "id": "0805ffb75d0ae5e88a5e8274b97cc20f"
    "title": "Using NVIDIA Run:ai GPU Fractioning on Amazon EKS"
    "link": "https://aws.amazon.com/blogs/machine-learning/using-nvidia-runai-gpu-fractioning-on-amazon-eks/"
    "published": "2026-11-20 01:13:51"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Learn how to run two memory-bounded Kubernetes Pods on a single NVIDIA A10G GPU using open-source NVIDIA Run:ai GPU Fractioning on Amazon EKS. This walkthrough builds a custom Amazon Linux 2023 image, installs KAI Scheduler and the GPU Fractioning Operator, and validates per-Pod GPU-memory contracts with enforcement and metrics."
"last_updated": "2026-11-20 03:48:48 JST"
