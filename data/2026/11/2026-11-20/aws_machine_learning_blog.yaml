"entries":
  "f8d1215d4240105601aa72a64f486ca8":
    "id": "f8d1215d4240105601aa72a64f486ca8"
    "title": "From learning to leaderboard: How Cisco upskilled 1,200 engineers in agentic AI with AWS AI League"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-learning-to-leaderboard-how-cisco-upskilled-1200-engineers-in-agentic-ai-with-aws-ai-league/"
    "published": "2026-11-20 03:26:22"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Cisco and AWS used Cisco Transformation Fest and AWS AI League to turn hands-on AI learning into a culture of building. A Cisco engineer won the 2025 AWS AI League global title and 1,200 engineers competed in 2026. This post shares Cisco's journey, lessons from the 2026 winning agent built on Amazon Bedrock AgentCore, and how to host your own league."
  "06cd415955a31b80429c9e1b5c37d41c":
    "id": "06cd415955a31b80429c9e1b5c37d41c"
    "title": "Keep inference running through regional capacity shortfalls with cross-Region inference routing in Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/keep-inference-running-through-regional-capacity-shortfalls-with-cross-region-inference-routing-in-amazon-sagemaker-ai/"
    "published": "2026-11-20 03:20:54"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Cross-Region inference routing in Amazon SageMaker AI gives your application one invocation path across the endpoints and inference components you already run, in one or more AWS Regions and AWS accounts. The router prefers its own Region and shifts new requests to another destination only when the local one can't serve reliably."
  "6c14e03b2274ee04a488d943081d6f59":
    "id": "6c14e03b2274ee04a488d943081d6f59"
    "title": "Protect agent tool calls with Skyflow and Amazon Bedrock AgentCore Gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/protect-agent-tool-calls-with-skyflow-and-amazon-bedrock-agentcore-gateway/"
    "published": "2026-11-20 03:14:36"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Learn how Skyflow and Amazon Bedrock AgentCore Gateway keep sensitive data out of the tools your AI agents call. Added as a gateway interceptor, Skyflow de-identifies data before any tool, model, or log sees it, and restores it for authorized callers, with no change to your agent code."
  "1a620e0629976e84e91df312086e6c1d":
    "id": "1a620e0629976e84e91df312086e6c1d"
    "title": "PolyAI Dialog-RSN-1 is now on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/blogs/machine-learning/polyai-dialog-rsn-1-is-now-on-amazon-sagemaker-jumpstart/"
    "published": "2026-11-20 02:28:47"
    "fetched": "2026-11-20 03:48:48"
    "summary": "PolyAI Dialog-RSN-1, a reasoning model built for real-time complex dialog, is available today on AWS Marketplace and Amazon SageMaker JumpStart. Discover it, evaluate it on your own data, and deploy it to a secure SageMaker endpoint in your own AWS account."
  "9916358d3dd1bc77cbb024e442564882":
    "id": "9916358d3dd1bc77cbb024e442564882"
    "title": "Introducing enhanced infrastructure observability in Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-enhanced-observability-in-amazon-sagemaker-hyperpod-to-diagnose-gpu-training-issues/"
    "published": "2026-11-20 01:41:35"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Amazon SageMaker HyperPod now offers enhanced observability to help you diagnose GPU training issues faster. It brings together diagnostic and profiling capabilities for training workloads on both Amazon EKS and Slurm orchestrators, pinpointing issues across GPU, network, and host layers."
  "0805ffb75d0ae5e88a5e8274b97cc20f":
    "id": "0805ffb75d0ae5e88a5e8274b97cc20f"
    "title": "Using NVIDIA Run:ai GPU Fractioning on Amazon EKS"
    "link": "https://aws.amazon.com/blogs/machine-learning/using-nvidia-runai-gpu-fractioning-on-amazon-eks/"
    "published": "2026-11-20 01:13:51"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Learn how to run two memory-bounded Kubernetes Pods on a single NVIDIA A10G GPU using open-source NVIDIA Run:ai GPU Fractioning on Amazon EKS. This walkthrough builds a custom Amazon Linux 2023 image, installs KAI Scheduler and the GPU Fractioning Operator, and validates per-Pod GPU-memory contracts with enforcement and metrics."
  "1900991e79d1b7d6b0b8bf973c729705":
    "id": "1900991e79d1b7d6b0b8bf973c729705"
    "title": "Amazon SageMaker Inference: 2026 launches in review, part 2"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-inference-2026-launches-in-review-part-2/"
    "published": "2026-11-20 09:34:07"
    "fetched": "2026-11-20 10:00:08"
    "summary": "This second installment reviews 13 more Amazon SageMaker AI inference launches from 2026, spanning configuration recommendations, fitting more models onto each GPU, serving models too large for one instance, cross-Region routing, and post-launch tuning, bringing the year's total to 26."
  "bf1cd7c351b522a42040aeba6e17e7f4":
    "id": "bf1cd7c351b522a42040aeba6e17e7f4"
    "title": "Use Kimi Code CLI with models on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/use-kimi-code-cli-with-models-on-amazon-bedrock/"
    "published": "2026-11-20 09:33:30"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Kimi Code CLI v2.7.0 adds a native Amazon Bedrock provider, so you can connect the open source coding agent to models like Kimi K3.1 Pro using your standard AWS credential chain (named profiles or SSO) instead of a separate API key. This post shows how to configure the provider and send your first request."
  "424763cac8a1fabcf2468b21f1f883ff":
    "id": "424763cac8a1fabcf2468b21f1f883ff"
    "title": "Enable AI agents to pay for AWS Marketplace x402 products with Amazon Bedrock AgentCore payments"
    "link": "https://aws.amazon.com/blogs/machine-learning/enable-ai-agents-to-pay-for-aws-marketplace-x402-products-with-amazon-bedrock-agentcore-payments/"
    "published": "2026-11-20 08:02:16"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Amazon Bedrock AgentCore payments now supports AWS Marketplace, so agents can discover and buy x402-enabled products, APIs, data, and content and pay in USD on the developer's AWS bill, with no stablecoin wallets or API keys. This post walks through a research agent that finds a tool, pays per request through AWS Billing, and answers with sources."
  "b2fa353d5666fd838058804eed604c8d":
    "id": "b2fa353d5666fd838058804eed604c8d"
    "title": "How the BMW Group governs hundreds of agents across thousands of developers"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-the-bmw-group-governs-hundreds-of-agents-across-thousands-of-developers/"
    "published": "2026-11-20 07:20:23"
    "fetched": "2026-11-20 10:00:08"
    "summary": "When hundreds of agents serve thousands of developers, governance cannot be an afterthought. The BMW Group shares the practices and patterns its R&amp;D teams use to build, govern, and operate AI agents at enterprise scale without sacrificing speed, quality, or compliance."
  "49d0c31f9222520fa3b9e8c5f05fe1f5":
    "id": "49d0c31f9222520fa3b9e8c5f05fe1f5"
    "title": "Run your whole selling business in AWS Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/run-your-whole-selling-business-in-aws-quick/"
    "published": "2026-11-20 07:16:22"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Most sellers do not need another AI product to learn. They need the tools and information they already use brought together, so they can see what is happening in their business and act on it."
  "97e73c01312ca219cb69602a82265ca2":
    "id": "97e73c01312ca219cb69602a82265ca2"
    "title": "Amazon SageMaker AI now detects latency drift, idle GPUs, and missed optimizations on your inference endpoints"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-ai-now-detects-latency-drift-idle-gpus-and-missed-optimizations-on-your-inference-endpoints/"
    "published": "2026-11-20 06:28:18"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Amazon SageMaker AI now monitors your generative AI inference endpoints by default and tells you when a change could improve performance or lower cost. It tracks latency, GPU utilization, and serving configuration, then sends a finding through AWS Health with a one-click path to benchmark alternatives in SageMaker Studio before you apply any change."
  "5c78bb428c930de21b7bdd38a2ce198b":
    "id": "5c78bb428c930de21b7bdd38a2ce198b"
    "title": "Inside Amazon Connect Talent: The science of structured AI interviews"
    "link": "https://aws.amazon.com/blogs/machine-learning/inside-amazon-connect-talent-the-science-of-structured-ai-interviews/"
    "published": "2026-11-20 06:23:20"
    "fetched": "2026-11-20 10:00:08"
    "summary": "For organizations hiring hundreds or thousands of people, every interview presents the same challenge: How do you give candidates a consistent opportunity to demonstrate their skills while gathering the evidence needed to make informed hiring decisions?&nbsp; Structured behavioral interviews offer a research-backed approach to this challenge. They use consistent, job-related questions and clear scoring criteria […]"
  "1ebf605f4eaad00ccc8082d3f9f35c20":
    "id": "1ebf605f4eaad00ccc8082d3f9f35c20"
    "title": "Amazon Bedrock AgentCore harness adds Strands harness defaults, built-in tools, and lifecycle hooks"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-bedrock-agentcore-harness-adds-strands-harness-defaults-built-in-tools-and-lifecycle-hooks/"
    "published": "2026-11-20 05:01:06"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Amazon Bedrock AgentCore harness now runs on the open-source Strands harness, bringing a recommended model, task-oriented defaults, automatic prompt caching, proactive context management, and new built-in tools. It also adds lifecycle hooks so you can run deterministic allow or deny checks at defined points in the agent loop."
  "9bf22296ad06ebabd9d5fec6046749e9":
    "id": "9bf22296ad06ebabd9d5fec6046749e9"
    "title": "Amazon Polly launches voice cloning: A unique voice for your brand"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-polly-launches-voice-cloning-a-unique-voice-for-your-brand/"
    "published": "2026-11-20 04:53:32"
    "fetched": "2026-11-20 10:00:08"
    "summary": "Voice cloning in Amazon Polly is now generally available. Give Amazon Polly a few minutes of recordings from a consenting speaker, and it builds a custom voice that reads new text in that speaker's voice. Cloned voices run on the Amazon Polly generative engine and support seven languages."
  "24f8404f7cba1d9ec9e0fc82fea4dd60":
    "id": "24f8404f7cba1d9ec9e0fc82fea4dd60"
    "title": "Optimize AI economics on Amazon Bedrock with Accenture’s sequenced approach"
    "link": "https://aws.amazon.com/blogs/machine-learning/optimize-ai-economics-on-amazon-bedrock-with-accentures-sequenced-approach/"
    "published": "2026-11-20 03:48:55"
    "fetched": "2026-11-20 10:00:08"
    "summary": "As enterprises scale AI on Amazon Bedrock, token spend can grow even as per-token prices fall. This post walks through six composable optimization levers, shows how Accenture applied them across four client engagements, and recommends a sequence for cutting AI token spend on your own workloads."
"last_updated": "2026-11-20 10:00:08 JST"
