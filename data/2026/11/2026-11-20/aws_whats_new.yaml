"entries":
  "69ca9fb8b2c5016bf705d3c464cb6533":
    "id": "69ca9fb8b2c5016bf705d3c464cb6533"
    "title": "Amazon Aurora DSQL now supports multi-Region peering across continents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-intercontinental-multi-region-clusters/"
    "published": "2026-11-20 00:56:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now lets you create multi-Region clusters whose Regions are on different continents, such as US East (N. Virginia) and Europe (Ireland). Until now, the Regions in a multi-Region cluster had to be in the same geographic Region set.</p> \n<p>With intercontinental multi-Region clusters, applications on two continents read and write to one strongly consistent database. If a Region becomes unavailable, committed writes are preserved and applications keep reading and writing in the other Region. You choose the two peer Regions and the witness Region. Place your database close to users on each continent, or separate failure domains as widely as your resilience needs require.</p> \n<p>Intercontinental multi-Region clusters are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL supports multi-Region clusters. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html#aurora-dsql-multi-region-availability\">Multi-Region cluster availability</a> in the Aurora DSQL User Guide.</p>"
  "aba3076effa5ca8a3ee752998dd4f70e":
    "id": "aba3076effa5ca8a3ee752998dd4f70e"
    "title": "AWS Marketplace now supports agentic payments with AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/marketplace-agentic-payments-agentcore/"
    "published": "2026-11-20 06:30:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Marketplace now supports agentic payments over the x402 protocol, so AI agents can discover and buy select products and pay per request in US dollars through AgentCore payments, part of Amazon Bedrock AgentCore. Agents often need paid APIs, data, or content mid-task, but access usually requires a person to sign up, add a payment method, and create an API key. With agentic payments, customers skip that per-seller setup, and charges settle on their existing AWS bill with no crypto wallet required.</p> \n<p>Customers enable the AWS Marketplace payment connector in AgentCore payments, then they or their agents find listings through the AWS Marketplace connector in AgentCore Gateway. For example, a research agent can buy a single web search, or a coding agent can call a paid guardrail service. Customers can set spending limits, approved sellers, and guardrails before agents transact, Private Marketplace policies still apply, and transactions appear in AWS CloudTrail and AWS Cost Explorer.</p> \n<p>AWS Marketplace sellers can charge AI agents per request without building a sign-up flow or billing system. They register with AWS Marketplace, configure agentic payments for their listings, and integrate the <a href=\"https://github.com/aws/fiat-extension-for-x402/blob/main/docs/sdk-guide.md\">AWS Marketplace x402 SDK</a>. AWS Marketplace collects customer payments and pays sellers through their AWS Marketplace seller disbursements, like other AWS Marketplace transactions.</p> \n<p>The capability is available in all AWS Regions where AgentCore payments is available. To learn more, see <a href=\"https://aws.amazon.com/marketplace/solutions/ai-agents-and-tools?ams%23interactive-card-vertical%23pattern-data-843993407.filters=((id:GLOBAL%23local-tags-aws-marketplace-agentic-ai-x402-support.and,value:(x402-support)))\">AWS Marketplace</a> and the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/payments-process-payment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock AgentCore Developer Guide</a>. To list as a seller, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/agentic-commerce-products.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Marketplace Seller Guide.</a></p>"
  "265fe390c813c378809c832a2f5045c0":
    "id": "265fe390c813c378809c832a2f5045c0"
    "title": "Amazon Cognito now supports client ID metadata documents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-client-id-metadata-documents/"
    "published": "2026-11-20 06:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now supports OAuth client ID metadata documents (CIMD). Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices in minutes. With CIMD, Model Context Protocol (MCP) clients and AI agents can sign users in to your user pool without registering a separate app client. Previously, each external client needed its own app client, either created in advance or through dynamic client registration, and you had to manage and clean up those clients over time.</p>\n<p>With CIMD, a client uses an HTTPS URL as its client ID and publishes a JSON metadata document at that URL. When the client starts sign-in, Cognito fetches and validates the document and uses it to identify the client and validate its sign-in request. You decide which clients to accept with CIMD policies that map URL patterns to one of your app clients, and Cognito grants only the scopes and grant types that both the app client and the metadata document allow. For example, a company that runs an MCP server can accept an AI assistant by allowing the URL where that assistant publishes its metadata without creating or maintaining an app client for it.</p>\n<p>CIMD is available on the Essentials and Plus feature plans in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To learn more, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-client-id-metadata.html\" target=\"_blank\">Client ID metadata documents (CIMD)</a> in the Amazon Cognito Developer Guide.</p>"
  "a31430fcda6bd4af1863d1f14bff4adb":
    "id": "a31430fcda6bd4af1863d1f14bff4adb"
    "title": "Amazon Aurora DSQL now delivers up to 50% higher write throughput"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-higher-write-throughput/"
    "published": "2026-11-20 05:53:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>With upgrades to its storage layer, <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now delivers up to 50% higher write throughput for many transactional workloads. Data loads finish sooner, and tables whose primary key always increases, such as tables keyed by a timestamp, an identity column, or a time-ordered ID like ULID or UUIDv7, see even greater benefits.</p> \n<p>Applications such as audit logs, ledgers, and event feeds are read in time order, and keying them by time keeps those reads fast. You can now use that design for write-heavy tables too. In our tests, an audit log table keyed by event time accepted up to 200% more inserts per second.</p> \n<p>The improvement is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL is available, for new and existing clusters, at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">Aurora DSQL User Guide</a>.</p>"
  "4cb239fd6594872560451e50e866faee":
    "id": "4cb239fd6594872560451e50e866faee"
    "title": "Amazon CloudFront adds IP based routing and connection logs to SaaS Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-ip-based-routing-connection-logging"
    "published": "2026-11-20 05:26:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon CloudFront now allows web development and SaaS platforms to serve different tiers of customers on the same wildcard domain by using IP addresses to route them to the right configuration. For example, these platforms can serve premium and pro customers from dedicated Anycast static IP address lists, each with its own configuration, and serve free-tier customers on the shared CloudFront IP addresses, all under *.<a href=\"http://example.com\">example.com</a>. Additionally, these customers also have visibility into viewer connections with connection logging.</p> \n<p>Previously, CloudFront chose the configuration from the domain name alone, so the same domain always went to the same configuration. With address-based selection, you can register the same wildcard domain on several IP lists and send each list to its own tenant. Because you control which clients resolve to which IP list, you can shift traffic between your service tiers without your customers needing to make any changes. You can also serve IoT devices, embedded SDKs, and older TLS clients that connect by IP address without sending a domain name in the TLS handshake (Server Name Indication, or SNI). With viewer fallback, you choose a distribution to accept these connections, and CloudFront uses the Host header in each request to serve the right content. Connection logs now also record HTTPS connections to these tenants which helps you troubleshoot how clients connect.</p> \n<p>These features are available at all CloudFront edge locations. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/address-based-selection.html\">Address-based selection</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/connection-logs.html\">Connection Logs</a> in the Amazon CloudFront Developer Guide.</p>"
  "d2514128874cfb35519a41638bf90c43":
    "id": "d2514128874cfb35519a41638bf90c43"
    "title": "Amazon CloudFront simplifies domain moves and onboarding for SaaS Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-domain-moves-distribution-tenants"
    "published": "2026-11-20 05:22:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon CloudFront now lets web development platforms and SaaS providers move a customer's domain to their platform in a single request with no downtime, and serve requests to the domain while the TLS certificate is being configured. The CloudFront multi-tenant distributions allow these platforms to serve many customer domains from one shared configuration. Together, these features help move existing AWS customers to multi-tenant distributions without impacting their traffic.</p> \n<p>Previously, moving a domain that was already in use required disabling the original distribution, using a wildcard workaround, or contacting AWS Support. Now you can bring customer domains onto your multi-tenant setup as part of creating or updating a tenant. With the new OnDomainTakeover option, CloudFront checks domain ownership through DNS records and then moves one or more domains in a single request. This works within an AWS account or across accounts. If you add a domain before its certificate is issued, CloudFront serves it over HTTP until you attach a certificate. That gives you time to validate the domain with AWS Certificate Manager (ACM) or another certificate authority and attach the certificate once it's issued.</p> \n<p>These features are available in all edge locations at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/alternate-domain-names-move-options.html\">Move domains</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/tenant-domains-without-certificate.html\">Domains without a certificate</a> in the Amazon CloudFront Developer Guide.</p>"
  "043a30f40da9e670af4ba3c1a5eec283":
    "id": "043a30f40da9e670af4ba3c1a5eec283"
    "title": "Amazon Connect launches Resolutions, an agentic solution for high-volume operational work"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-resolutions/"
    "published": "2026-11-20 05:06:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon Connect Customer announces the general availability of Resolutions, an agentic operations solution that resolves high-volume work end-to-end, including refund requests, transaction disputes, fraud investigations, and insurance claims. Resolutions helps businesses reduce resolution times and cost to serve by combining the reasoning of AI agents with the reliability of deterministic workflows. Every request follows business policy, gets the oversight it requires, and ends in a verifiable outcome.</p> \n<p>Managers describe a process in natural language or upload standard operating procedures (SOPs), and Resolutions generates a Work plan in minutes. As it builds the Work plan, Resolutions asks clarifying questions that surface exceptions, set decision rules, and define approval thresholds, closing the gaps an SOP leaves open. Resolutions then opens a Resolutions Case for each incoming request and applies the right Work plan. AI agents gather information, apply policy, act across your business applications, and ask customers for missing details to drive every Case to completion. Each Step can run on prebuilt AI agents, AI agents configured in Amazon Connect Customer, or your own, while human specialists handle approvals and exceptions with the context they need to act.</p> \n<p>For example, a bank resolving a transaction dispute can have AI agents pull the transaction history, check the claim against chargeback rules, email the cardholder for a missing receipt, and issue a provisional credit, so a specialist reviews only the disputes that need judgment. Resolutions verifies each outcome and records every action and decision, giving operations leaders an auditable, real-time view of progress, workload, and service level risk.</p> \n<p>To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-get-started.html\">documentation,</a> <a href=\"https://aws.amazon.com/products/connect/customer/?trk=25b81a8c-c9b1-4866-9ba5-f9cb1c5e792a&amp;sc_channel=ps&amp;ef_id=Cj0KCQiA2frXBhC_ARIsAPTFcdPy7k_--3zFXuoVNfszpx_W8hiYrEB8MQvqdwmwAyaVmbZVy16FsEcaAlx0EALw_wcB:G:s&amp;gclid=Cj0KCQiA2frXBhC_ARIsAPTFcdPy7k_--3zFXuoVNfszpx_W8hiYrEB8MQvqdwmwAyaVmbZVy16FsEcaAlx0EALw_wcB\">webpage</a>, and <a href=\"https://aws.amazon.com/products/connect/customer/pricing/appendix/?refid=758059ab-77e5-44fc-8a4a-1be845ee42b9\">pricing page</a>.</p>"
  "6ac3980aa26ef13153e2bce165292e14":
    "id": "6ac3980aa26ef13153e2bce165292e14"
    "title": "AWS Lambda durable functions now supports OpenTelemetry tracing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-durable-otel/"
    "published": "2026-11-20 05:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Lambda announces OpenTelemetry (OTel) support for Lambda durable functions. You can now trace your durable executions and emit traces to Amazon CloudWatch and other industry-standard observability tools.&nbsp;This helps you find bottlenecks in your system, root cause failures faster, and understand how your workflows behave in production.</p> \n<p>With Lambda durable functions, you can build resilient, multi-step applications and AI workflows that run for up to one year, with built-in checkpointing and automatic retries. Durable functions can run for&nbsp;hours, or days, suspending and resuming across many Lambda invocations. The new OpenTelemetry plugin emits a unified trace that spans a full durable execution, including steps, waits, callbacks, and chained function invocations. You can use the trace to gain operational insights across your executions including step durations, retries, and failures across executions.&nbsp;&nbsp;</p> \n<p>The OpenTelemetry plugin is available for the TypeScript, Python, and Java SDKs. You can enable OpenTelemetry support by adding the OpenTelemetry plugin package alongside the Durable Execution SDK and register it on your durable handler or using an environment variable. OpenTelemetry support for Lambda durable functions is available in all AWS Regions that support Lambda durable functions.</p> \n<p>To get started, see the&nbsp; <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/observability/opentelemetry\">OpenTelemetry plugin documentation</a>, the <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/observability/plugins/\">plugin interface documentation</a>, and the <a href=\"https://github.com/aws-samples/sample-lambda-durable-functions-otel-tracing\">sample application</a>. To learn more, read <a href=\"https://aws.amazon.com/blogs/compute/aws-lambda-durable-functions-observability-with-opentelemetry/\">the blog post</a>.&nbsp;</p>"
  "baa659a91f51c5ea07b89d4344dd7fd6":
    "id": "baa659a91f51c5ea07b89d4344dd7fd6"
    "title": "AWS Marketplace agent mode now helps you assess, buy, and deploy solutions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace/aws-marketplace-agent-mode-expansion"
    "published": "2026-11-20 05:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>You can now assess a seller's security, buy, and deploy supported products in one conversation with AWS Marketplace agent mode, the conversational AI experience for procuring cloud solutions. You share your requirement once, and agent mode applies them as it guides you through discovery, purchase, and deployment.</p> \n<p>Describe your use case in natural language to get recommended software, services, AI agents and tools, and multi-product solutions that fit your business needs. To assess a seller's security, request documents such as System and Organization Controls (SOC) 2 reports, and get a criterion-by-criterion assessment against a standard cloud security questionnaire, the Consensus Assessments Initiative Questionnaire (CAIQ).</p> \n<p>When you're ready to buy, sign in with your AWS account. Agent mode explains pricing and terms so you know what you're committing to, shows your organizations' purchase requirements, and completes the purchase after you review the terms and confirm. For supported products, agent mode reviews your AWS environment, proposes a deployment plan with the estimated monthly cost, and deploys after you approve. It then shows you how to start using the product and helps you troubleshoot if a step fails.</p> \n<p>Agent mode is available in all AWS Regions where AWS Marketplace is available.</p> \n<p>To get started, open <a href=\"https://aws.amazon.com/marketplace/agentmode\">agent mode</a> on the AWS Marketplace website. To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/agent-mode.html\">Agent mode for AWS Marketplace</a> in the AWS Marketplace Buyer Guide.</p>"
  "206503c37d4c900e43cd327f673d2970":
    "id": "206503c37d4c900e43cd327f673d2970"
    "title": "Amazon WorkSpaces Applications now supports WebAuthn redirection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-workspaces-applications-webauthn-redirection/"
    "published": "2026-11-20 04:57:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon WorkSpaces Applications now supports WebAuthn redirection, so users can sign in to websites and applications in their streaming session with a FIDO2 authenticator on their local device, such as a security key, Windows Hello, or Touch ID. Previously, an authenticator attached to the user's computer was not available inside the streaming session, so organizations that require phishing-resistant multi-factor authentication (MFA) had to use weaker sign-in methods or keep those applications off WorkSpaces Applications. This helps organizations with FIDO2 requirements stream those applications.</p> \n<p>When an application in the session makes a WebAuthn request, WorkSpaces Applications forwards it to the user's device, where the authenticator signs it and returns the response. Private keys never leave the user's device. Administrators turn it on per stack in the console or API, and on Windows fleets can limit it to an allow list of processes. For example, a bank can let employees sign in to Microsoft 365 in their streaming session with the same security key they use on their laptop.</p> \n<p>WebAuthn redirection is available at no additional charge in all AWS commercial Regions and AWS GovCloud (US) Regions where WorkSpaces Applications is available.</p> \n<p>To get started, select Enable WebAuthn redirection under User Settings for your stack, use an image with the WorkSpaces Applications agent released on or after October 20, 2026, and connect with the WorkSpaces Applications client for Windows (1.5.0 or later) or macOS (1.6.0 or later). To learn more, see <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/feature-support-webauthn-redirection.html\" target=\"_blank\">WebAuthn redirection</a> in the Amazon WorkSpaces Applications Administration Guide, or visit the <a href=\"https://aws.amazon.com/workspaces/applications/\" target=\"_blank\">Amazon WorkSpaces Applications</a> product page.</p>"
  "1cd91f97dd2fdbb9174e2df87ca958a1":
    "id": "1cd91f97dd2fdbb9174e2df87ca958a1"
    "title": "Amazon Route 53 now supports health checks for private endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-private-endpoint-health-checks/"
    "published": "2026-11-20 04:50:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 0px 0px 16px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Amazon Route 53 now offers Private Endpoint Health Checks, enabling business-critical workloads that never touch the public internet, such as internal APIs, databases, and self-hosted nodes behind internal load balancers or in private subnets, to use native health monitoring and automatic DNS failover. Customers can health-check any reachable private target by IP address, domain, or port over HTTP, HTTPS, or TCP. Customers can associate these health checks with Route 53 DNS records across routing policies in private hosted zones, so Route 53 routes traffic only to healthy endpoints and manages failover automatically.</span></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 16px 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Previously, teams built custom control loops using Amazon CloudWatch alarms, AWS Lambda functions, and the Route 53 API to achieve DNS failover for private resources. With t</span><span class=\"NormalTextRun CommentStart SCXW180369299 BCX2\">his approach</span><span class=\"NormalTextRun SCXW180369299 BCX2\">, failover took several minutes and added </span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW180369299 BCX2\">operational</span><span class=\"NormalTextRun SCXW180369299 BCX2\"> burden. Detection and DNS failover with Private Endpoint Health Checks are designed to complete in seconds rather than </span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW180369299 BCX2\">minutes,</span><span class=\"NormalTextRun SCXW180369299 BCX2\"> the service is fully managed, and nothing is exposed to the public internet.</span></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 16px 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">The feature supports on-premises and hybrid endpoints reachable from the VPC over AWS Direct Connect or AWS Site-to-Site VPN, enabling resilience patterns such as active-passive disaster recovery and cross-Region DR over AWS Transit Gateway or AWS Cloud WAN. Amazon Route 53 Private Endpoint Health Checks is available today in all AWS commercial regions. To learn more, visit the </span></span><a class=\"Hyperlink SCXW180369299 BCX2\" href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-private-endpoints.html\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentStart SCXW180369299 BCX2\">Amazon Route 53 Developer Guide</span></span></a><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\"> and the </span></span><a class=\"Hyperlink SCXW180369299 BCX2\" href=\"https://aws.amazon.com/route53/pricing/\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Route 53 pricing page.</span></span></a><span class=\"TextRun EmptyTextRun SCXW180369299 BCX2\" lang=\"EN-US\"></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<p>&nbsp;</p>"
  "792e822649a637bd203b3c018d90aa2b":
    "id": "792e822649a637bd203b3c018d90aa2b"
    "title": "AWS Revenue Measurement now supports deal-level revenue attribution for AWS Marketplace offers and opportunities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-revenue-measurement-deal-attribution/"
    "published": "2026-11-20 04:25:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces deal-level revenue attribution for AWS Revenue Measurement (previously Partner Revenue Measurement) capabilities. AWS Partners can now see how the AWS revenue measured for their products maps to specific AWS Marketplace offers and/or APN Customer Engagements (ACE) opportunities. Until now, partners who implemented AWS Revenue Measurement via <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/resource-tagging.html\">Resource Tagging</a>, <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent String</a> or <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering.html\">AWS Marketplace Metering</a> could view aggregated, product-level attributed revenue. With this launch, partners can view attributed revenue by offers and opportunities on the Attributed Revenue dashboard in AWS Partner Central for components hosted in partners' own AWS accounts. Two new capabilities make this possible: Revenue Attribution IDs and Marketplace Revenue Share.</p> \n<p>A Revenue Attribution ID is a unique identifier that allows partners to allocate a product's measured AWS revenue to specific offers and opportunities. Partners create a Revenue Attribution ID, associate it with their deals, and enter a monthly attributed revenue allocation percentage for each deal. Partners with SaaS products on AWS Marketplace can automate allocation to offers with Marketplace Revenue Share. Each month, partners enter the percentage of the product's attributed revenue contributed by AWS Marketplace deals in the Revenue Attribution page, and AWS then calculates the attributed revenue for each active offer. Partners can use Revenue Attribution IDs alongside Marketplace Revenue Share to adjust a calculated offer amount or attribute revenue to opportunities for future months. Both capabilities build on AWS Revenue Measurement, so partners can extend their current product-level implementations to gain deal-level insights.</p> \n<p>Partners can manage <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/revenue-attribution-id.html\">Revenue Attribution IDs</a> and Marketplace Revenue Share in AWS Partner Central or through the <a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/working-with-revenue-attribution.html\">AWS Revenue Measurement</a> and <a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/working-with-marketplace-revenue-share.html\">Marketplace Revenue Share APIs</a>. AWS Revenue Measurement is generally available in all commercial Regions. To learn more, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a>. &nbsp;</p>"
  "88a3899516b70a8602a8acc5c71440bc":
    "id": "88a3899516b70a8602a8acc5c71440bc"
    "title": "AWS Lambda now supports a 30-minute timeout for on-demand Event Functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-30-minute-ondemand-event-functions/"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Lambda now supports a 30-minute function timeout for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-functions-chapter.html\">Event Functions</a> that run on demand, doubling the 15-minute limit for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-sync.html\">synchronous</a>, <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html\">asynchronous</a>, and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html\">event source mapping (ESM)</a> invocations. On <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances</a>, synchronous invocations also support up to 30 minutes, while asynchronous and ESM invocations keep the <a href=\"https://aws.amazon.com/blogs/compute/announcing-90-minute-function-timeout-on-aws-lambda-managed-instances/\">90-minute timeout</a> launched in September 2026. You can now run long-running workloads such as AI inference, media transcoding, and financial calculations for spiky or steady-state traffic without re-architecting your applications.</p> \n<p>Customers use&nbsp;Event Functions to build event-driven processors, API backends, and data pipelines. By default, Event Functions run on demand, and Lambda scales them automatically to handle spiky traffic. For steady-state traffic, you can also run them on Lambda Managed Instances, which runs functions on Amazon EC2 instances and&nbsp;maintains&nbsp;the operational simplicity of Lambda.&nbsp;For data-intensive workloads such as AI inference and media processing that run on demand and need longer continuous execution, the 15-minute function timeout had required customers to adopt&nbsp;architectural workarounds. With today's launch, these workloads can run for up to 30 minutes, including when you use <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions</a> or invoke your functions from <a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html\">AWS Step Functions Standard workflows</a>.</p> \n<p>For Event Functions that run on demand, the 30-minute timeout is available in all&nbsp;commercial <a href=\"https://builder.aws.com/build/capabilities\">AWS Regions</a>. On Lambda Managed Instances, it is available for synchronous invocations in all Regions where Lambda Managed Instances is available. You can set the function timeout by using the Lambda console, AWS CLI, AWS SDKs, AWS CloudFormation, AWS CDK, or AWS SAM. You can also use coding assistants such as Kiro, Claude Code, or Codex with the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html\">Agent Toolkit for AWS</a>. Standard <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a> applies. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/configuration-timeout.html\">AWS Lambda Developer Guide</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "5081098e7f8fce43edf1ebedbe1cc7fc":
    "id": "5081098e7f8fce43edf1ebedbe1cc7fc"
    "title": "AWS Transform combines migration assessment and planning in one experience"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-assessment-and-planning"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Transform for migrations now combines migration assessment and migration planning into a single migration job. Previously, you ran separate jobs to build a total cost of ownership (TCO) business case and to plan your migration. With this launch, you upload your on-premises inventory once and use it for both assessment and planning, in any order.</p> \n<p>After you upload your inventory data, you can estimate your AWS costs and build a business case, group your infrastructure into applications and plan migration waves, or do both. You can rerun either workflow as your data improves. For example, build a business case first and then plan waves from the same inventory, or plan your waves first and then estimate the cost of a single wave. Because assessment and planning share one inventory, your business case and migration plan stay consistent without moving data between jobs. After you finalize your plan and assessment, you can continue in the same job to migrate your networks, deploy landing zones, and migrate servers, storage, and containers.</p> \n<p>This newest release is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html#default-regions\">AWS Regions where AWS Transform is offered</a>. To learn more about migrating with AWS Transform, visit the <a href=\"https://aws.amazon.com/transform/migrations/\">product page</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-migrations-discover-assess-plan.html\">documentation</a>.</p>"
  "4a9baeb98d977fb833cc3591aa6d33ee":
    "id": "4a9baeb98d977fb833cc3591aa6d33ee"
    "title": "AWS Transform extends application-centric migration across the lifecycle"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-application-centric-migration"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Transform now puts applications at the center of every stage of the migration journey, so you can discover, plan, migrate, validate, and track the applications your business runs on rather than just the servers underneath them. Application-level grouping has been part of AWS rehost workflows for years, and AWS Transform now carries that same view through your entire migration.</p> \n<p>Enterprise migrations typically involve thousands of servers, but the questions that drive decisions are about applications. Using discovery data, AWS Transform identifies application boundaries and dependencies, then surfaces logical groupings of applications, each with its own total cost of ownership (TCO) and migration tracking. AWS Transform also adds built-in surveys, letting application owners validate ownership, system boundaries, and business criticality.&nbsp;</p> \n<p>A new migration dashboard keeps everyone aligned as the migration moves forward. It gives your team, partners, and leadership one current view of your applications, inventory, assessments, wave plans, and migration status. The dashboard pulls in data from every job in a workspace and updates as work progresses, so no one has to build or maintain separate status reports. You can customize the dashboard and ask questions about migration progress in chat.&nbsp;</p> \n<p>With a more connected workflow and improved visibility across the migration, AWS Transform lets you move to the cloud with more confidence.&nbsp;This capability is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html#default-regions\">AWS Regions where AWS Transform is offered</a>. To learn more about migrating with AWS Transform, visit the <a href=\"https://aws.amazon.com/transform/migrations/\">product page</a>.</p>"
  "d000ae947c39f1dbe936d79b9969dc34":
    "id": "d000ae947c39f1dbe936d79b9969dc34"
    "title": "Amazon IVS Real-Time Streaming now provides a Linux broadcast SDK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ivs-real-time-streaming-linux-broadcast-sdk"
    "published": "2026-11-20 03:49:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>The Amazon Interactive Video Service (Amazon IVS) Linux broadcast SDK is now available for IVS Real-Time Streaming. Applications running on Linux can join an IVS stage, receive audio from participants, and send audio back to the stage in real time. The SDK provides a C API and Go language bindings.</p> \n<p>The Linux broadcast SDK is ideal for AI applications that enrich live streams by processing audio, such as transcription, translation, and content moderation, as well as voice agents that converse with participants.</p> \n<p><a href=\"https://aws.amazon.com/ivs/\">Amazon IVS</a> is a managed live streaming solution designed to make low-latency or real-time video available to viewers around the world. Visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a> for a full list of AWS Regions where the Amazon IVS console and APIs for control and creation of video streams are available.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/ivs/latest/RealTimeUserGuide/broadcast-linux.html\">IVS Broadcast SDK: Linux Guide</a>.</p>"
  "94724c62552ee41795f1ddcf3f057a03":
    "id": "94724c62552ee41795f1ddcf3f057a03"
    "title": "AWS Elemental MediaTailor adds Dynamic Avail Sizing for live HLS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-elemental-mediatailor-dynamic-avail-sizing-live-hls"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Elemental MediaTailor now supports Dynamic Avail Sizing, which reduces the slate viewers see when ad breaks, also called avails, in live HLS streams go unfilled. MediaTailor is a server-side ad insertion and channel assembly service that personalizes ads in live and on-demand video streams.</p> \n<p>When the ad decision server returns fewer ads than a break allows, dynamic avail sizing omits the unfilled time and resumes programming early instead of showing slate. To keep playback continuous, MediaTailor holds back a configurable reserve of content behind the live edge and draws on it when a break ends early. When the reserve runs low, MediaTailor requests extra ad time in later breaks to refill it. Free ad-supported streaming TV (FAST) channel operators can use dynamic avail sizing to keep viewers watching programming instead of filler content.</p> \n<p>Customers turn on dynamic avail sizing for each playback session by adding query parameters to the session initialization URL, with no change to their playback configuration. To learn more, see <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/dynamic-avail-sizing.html\">Dynamic avail sizing</a> in the AWS Elemental MediaTailor User Guide.</p>"
  "71e1fa7fcd67589199bdd6e10f89a01b":
    "id": "71e1fa7fcd67589199bdd6e10f89a01b"
    "title": "Amazon Cognito now supports AWS Secrets Manager for app client secrets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-secrets-manager-integration/"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now integrates with <a href=\"https://aws.amazon.com/secrets-manager/\">AWS Secrets Manager</a>, so you can store and manage your user pool app client secrets in Secrets Manager. Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices in minutes. An app client secret authenticates your application to Cognito. Previously, you had to manage and rotate these secrets in Cognito directly.</p>\n<p>With this integration, you can leverage Secrets Manager for capabilities including rotation, access control with AWS Identity and Access Management (IAM) policies, and encryption with an AWS managed key or your own AWS Key Management Service (AWS KMS) customer managed key. This can help with periodic credential rotation or compliance requirements; this also helps with keeping secrets out of the console. You can enable this integration for either a new or an existing app client, and disable it at any time.</p>\n<p>This integration is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito and AWS Secrets Manager are available, except AWS European Sovereign Cloud (Germany). Standard <a href=\"https://aws.amazon.com/secrets-manager/pricing/\">AWS Secrets Manager charges</a> apply. To learn more, see the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html\" target=\"_blank\">Amazon Cognito Developer Guide</a> for instructions.</p>"
  "a3b28f0580994c576791af6994c33cc5":
    "id": "a3b28f0580994c576791af6994c33cc5"
    "title": "AWS WAF launches new Security Analytics Dashboard for real-time investigations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/aws-waf-security-analytics-dashboard/"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS WAF now gives you one place to find and stop unwanted traffic across every application in your account. The new AWS WAF security analytics dashboard brings together traffic from all of your protection packs (web ACLs), whether they protect Regional resources or Amazon CloudFront distributions, into a single view. The dashboard also lets you search request logs right in the console, with no logging pipeline to build, and includes 21 days of full-fidelity request data at no additional cost. It is available alongside the existing dashboard for each protection pack (WebACL), which continues to work as it does today.</p> \n<p>Until now, spotting a trend across your applications, such as a bot campaign hitting several endpoints or a spike in blocked requests, meant opening each web ACL in turn or individually querying AWS WAF logs. With the AWS WAF security analytics dashboard, you can analyze traffic data from every protection pack (WebACL) at once. You can filter and group traffic by dimensions such as client IP address, country, ASN, user agent, JA4 fingerprint, host, path, rule triggered, and labels. You can see which endpoints are affected and how traffic is changing across all of them. The data is full-fidelity rather than sampled, and filters apply across the whole dashboard.</p> \n<p>Investigating individual requests has also required delivering AWS WAF logs to Amazon CloudWatch Logs, Amazon S3, or Amazon Data Firehose and writing queries. AWS WAF Security analytics dashboard includes a logs widget that lets you search and explore raw request logs in the console, down to the full HTTP request, with no log delivery to configure. When you find unwanted traffic, you can block an IP address or a country directly from the page. You can also filter by the labels that managed rules attach to requests to see what a rule in Count mode would block before you enforce it.</p> \n<p>The AWS WAF security analytics dashboard is available at no additional cost in all commercial AWS Regions where AWS WAF is available. This feature is not available in the AWS GovCloud (US) Regions and China Regions. To get started, open the AWS WAF console and choose Security analytics in the navigation pane.&nbsp;To learn more, see the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-security-analytics.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF Developer Guide</a>&nbsp;and <a href=\"https://aws.amazon.com/blogs/security/introducing-the-new-aws-waf-security-analytics-dashboard/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog post</a>.</p>"
  "8e5c39a2076fe52bb749716d1c8f2df0":
    "id": "8e5c39a2076fe52bb749716d1c8f2df0"
    "title": "AWS Partner Central now supports AI-assisted listing experience for product, services, and solutions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-central-ai-listing/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Marketplace search, Agent Mode, and AWS sales teams use listings to recommend partner offerings to AWS customers. Partners who sell software and services can now create and improve their listings in AWS Partner Central with the new AI-assisted listing experience. It drafts content from a partner's website and other materials, then shows which sections need clearer details, use cases, or evidence of customer outcomes. For single-AMI products, it also drafts the usage instructions buyers see after subscribing. Partners see, for each section, whether it meets what buyers look for, and choose which suggestions to use and review all content before publishing.</p> \n<p>Partners can position products and professional services as distinct solutions for different industries, use cases, or outcomes. Each solution gets its own AWS Marketplace page, bringing its case studies and AWS Specializations together with the listing's pricing, reviews, and trust information, so buyers can evaluate and buy from the same page. Buyers can filter search results by Specialization. Partners not ready to share public pricing can publish without it using leads-only listings, through which interested customers request a private offer that reaches the partner as a lead in AWS Partner Central. Partners can test metering and billing setup before publishing, and ask the assistant metering questions while integrating.</p> \n<p>These capabilities are available now to <a href=\"https://aws.amazon.com/marketplace/\">AWS Marketplace</a> partners in all AWS Regions, except the AWS GovCloud (US) Regions and the China Regions. To get started, open AWS Partner Central and choose \"Products and services\" or \"Solutions\". To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/ai-assisted-listing.html\" rel=\"noopener noreferrer\" target=\"_blank\">AI-assisted listing experience</a> and <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/deciding-what-to-list.html\" rel=\"noopener noreferrer\" target=\"_blank\">Deciding what to list</a> in the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/index.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Marketplace Seller Guide</a>.</p>"
  "c2d9fb66ed5c188e15d03a12f44c3777":
    "id": "c2d9fb66ed5c188e15d03a12f44c3777"
    "title": "Aurora PostgreSQL with express configuration now supports Amazon VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-postgresql-express-vpc/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Aurora PostgreSQL databases created with express configuration can now move into an Amazon Virtual Private Cloud (VPC) with a single API call or a modify action in the Amazon RDS console. This helps you take AI-built prototypes and other applications to production without migrating data, while meeting your security and compliance requirements. You can also create a new database cluster inside a VPC using express configuration.</p> \n<p>With express configuration, Aurora PostgreSQL lets you create and query a serverless database in seconds. Connectivity runs through an internet access gateway, which makes this a good fit for rapid prototyping and AI agent-driven development. When your application is ready for production, a single ModifyDBCluster API call moves the cluster into a VPC and turns off the internet access gateway. That gives you security groups, private subnets, and features such as Aurora Global Database, Amazon RDS Blue/Green Deployments, and Amazon RDS Proxy. The move requires no data migration, keeps your cluster endpoint the same, and interrupts connectivity only briefly. You can also reverse it with the same API call.</p> \n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.SupportedRegions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora PostgreSQL with express configuration is available. To get started, use the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS console</a>, AWS CLI, or AWS SDKs. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.MoveIntoVPC\" target=\"_blank\">Aurora User Guide</a>.</p>"
  "ea975f39cf1e8dcf0828327adc7004c0":
    "id": "ea975f39cf1e8dcf0828327adc7004c0"
    "title": "Amazon Aurora now supports moving clusters to a different VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-move-clusters-to-different-vpc/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Aurora PostgreSQL and Aurora MySQL clusters can now move from one Amazon Virtual Private Cloud (VPC) to another without data migration. You can move a cluster with a single API call or a modify action in the Amazon RDS console. This lets you move a cluster to a VPC with more IP address space or a non-overlapping CIDR range, consolidate your network architecture, or meet changing security and compliance requirements.</p> \n<p>Previously, moving an Aurora cluster to a different VPC meant creating a new cluster in the target VPC, migrating your data, and updating your applications with new connection strings. Now, a single ModifyDBCluster API call moves your existing cluster to the new VPC. Your data stays in place, your cluster endpoint stays the same, and connectivity is interrupted only briefly during the move. Before you start, turn off features that are tied to the cluster's current VPC, such as Aurora Global Database, Amazon RDS Proxy, and Amazon RDS Blue/Green Deployments. You can set them up again in the new VPC after the move.</p> \n<p>This feature is available for Aurora PostgreSQL and Aurora MySQL in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.SupportedRegions\" target=\"_blank\">AWS Regions</a> where Aurora PostgreSQL with express configuration is available. To get started, use the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS console</a>, AWS CLI, or AWS SDKs. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html#USER_VPC.WorkingWithRDSInstanceinaVPC.UpdatingVPC\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora User Guide</a>.</p>"
  "6855a8d9a3333f6722fd77e1ac6db424":
    "id": "6855a8d9a3333f6722fd77e1ac6db424"
    "title": "Amazon MSK Connect now supports restarting existing connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-msk-connect-restart-existing-connectors"
    "published": "2026-11-20 01:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/msk-connect/\">Amazon MSK Connect</a> (Amazon Managed Streaming for Apache Kafka Connect) now supports restarting both existing and newly created connectors and their tasks in place, enabling fast recovery for streaming data pipelines.</p> \n<p>Amazon MSK Connect is a fully managed service that allows you to deploy, monitor, and scale Apache Kafka Connect connectors with Amazon MSK (Managed Streaming for Apache Kafka). Previously, recovering from failures required deleting and recreating the connector, resulting in downtime and operational overhead. With this feature, you can restart your connector and all its tasks in place, or selectively restart only the failed tasks, making recovery seamless. You can also restart connectors that have no failed tasks to recover from transient issues or to pick up changes in external systems or dependencies.</p> \n<p>This restart capability is available at no additional cost through the Amazon MSK Console, AWS CLI, AWS SDK, and AWS CDK in all AWS Regions where Amazon MSK Connect is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/mskconnect.html\"><u>Amazon MSK Connect documentation</u></a>. To get started, visit the <a href=\"https://console.aws.amazon.com/msk\"><u>Amazon MSK Console</u></a>.</p>"
  "e493f18a83289bd52e5b6d6246232a2e":
    "id": "e493f18a83289bd52e5b6d6246232a2e"
    "title": "Announcing the general availability of a new AWS Local Zone in Bogotá, Colombia"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-local-zone-bogota-colombia/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>Today, AWS announces the general availability of a new Local Zone in Bogotá, Colombia, bringing AWS infrastructure closer to end users for applications that require single-digit millisecond latency. You can use the Bogotá Local Zone for workloads such as real-time gaming, live video streaming, medical imaging, and financial transaction processing.</p> \n<p>AWS Local Zones are infrastructure deployments that place compute, storage, networking, and other select AWS services closer to metropolitan areas, with the same APIs and tools as AWS Regions. You pay only for what you use, with no minimum commitment. Pricing options include On-Demand, Savings Plans, and Spot Instances. AWS Local Zones are available in more than 30 locations worldwide.</p> \n<p>The AWS Local Zone in Bogotá supports&nbsp;Amazon Elastic Compute Cloud (Amazon EC2) with C7i, M7i, and R7i instances, Amazon S3 with the One Zone-Infrequent Access storage class, Amazon EBS with local snapshots and volume types gp3, gp2, and io1, Amazon Elastic Container Service (Amazon ECS), Amazon Elastic Kubernetes Service (Amazon EKS), Amazon Virtual Private Cloud (Amazon VPC), AWS Direct Connect, and Application Load Balancer. &nbsp;</p> \n<p>To get started, enable the AWS Local Zone in Bogotá (us-east-1-bog-1a) from the <a href=\"https://us-east-1.console.aws.amazon.com/ec2globalview/home\">Regions and Zones</a> tab in the AWS Global View or by using the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyAvailabilityZoneGroup.html?refid=769a1a2b-8c19-4976-9c45-b6b1226c7d20\">ModifyAvailabilityZoneGroup</a> API. For pricing information, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/pricing/?nc=sn&amp;loc=4\">AWS Local Zones pricing page</a>.&nbsp;To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones overview page</a>.</p>"
