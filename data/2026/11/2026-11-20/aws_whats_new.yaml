"entries":
  "69ca9fb8b2c5016bf705d3c464cb6533":
    "id": "69ca9fb8b2c5016bf705d3c464cb6533"
    "title": "Amazon Aurora DSQL now supports multi-Region peering across continents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-intercontinental-multi-region-clusters/"
    "published": "2026-11-20 00:56:00"
    "fetched": "2026-11-20 03:48:46"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now lets you create multi-Region clusters whose Regions are on different continents, such as US East (N. Virginia) and Europe (Ireland). Until now, the Regions in a multi-Region cluster had to be in the same geographic Region set.</p> \n<p>With intercontinental multi-Region clusters, applications on two continents read and write to one strongly consistent database. If a Region becomes unavailable, committed writes are preserved and applications keep reading and writing in the other Region. You choose the two peer Regions and the witness Region. Place your database close to users on each continent, or separate failure domains as widely as your resilience needs require.</p> \n<p>Intercontinental multi-Region clusters are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL supports multi-Region clusters. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html#aurora-dsql-multi-region-availability\">Multi-Region cluster availability</a> in the Aurora DSQL User Guide.</p>"
  "aba3076effa5ca8a3ee752998dd4f70e":
    "id": "aba3076effa5ca8a3ee752998dd4f70e"
    "title": "AWS Marketplace now supports agentic payments with AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/marketplace-agentic-payments-agentcore/"
    "published": "2026-11-20 06:30:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Marketplace now supports agentic payments over the x402 protocol, so AI agents can discover and buy select products and pay per request in US dollars through AgentCore payments, part of Amazon Bedrock AgentCore. Agents often need paid APIs, data, or content mid-task, but access usually requires a person to sign up, add a payment method, and create an API key. With agentic payments, customers skip that per-seller setup, and charges settle on their existing AWS bill with no crypto wallet required.</p> \n<p>Customers enable the AWS Marketplace payment connector in AgentCore payments, then they or their agents find listings through the AWS Marketplace connector in AgentCore Gateway. For example, a research agent can buy a single web search, or a coding agent can call a paid guardrail service. Customers can set spending limits, approved sellers, and guardrails before agents transact, Private Marketplace policies still apply, and transactions appear in AWS CloudTrail and AWS Cost Explorer.</p> \n<p>AWS Marketplace sellers can charge AI agents per request without building a sign-up flow or billing system. They register with AWS Marketplace, configure agentic payments for their listings, and integrate the <a href=\"https://github.com/aws/fiat-extension-for-x402/blob/main/docs/sdk-guide.md\">AWS Marketplace x402 SDK</a>. AWS Marketplace collects customer payments and pays sellers through their AWS Marketplace seller disbursements, like other AWS Marketplace transactions.</p> \n<p>The capability is available in all AWS Regions where AgentCore payments is available. To learn more, see <a href=\"https://aws.amazon.com/marketplace/solutions/ai-agents-and-tools?ams%23interactive-card-vertical%23pattern-data-843993407.filters=((id:GLOBAL%23local-tags-aws-marketplace-agentic-ai-x402-support.and,value:(x402-support)))\">AWS Marketplace</a> and the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/payments-process-payment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Bedrock AgentCore Developer Guide</a>. To list as a seller, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/agentic-commerce-products.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Marketplace Seller Guide.</a></p>"
  "265fe390c813c378809c832a2f5045c0":
    "id": "265fe390c813c378809c832a2f5045c0"
    "title": "Amazon Cognito now supports client ID metadata documents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-client-id-metadata-documents/"
    "published": "2026-11-20 06:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now supports OAuth client ID metadata documents (CIMD). Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices in minutes. With CIMD, Model Context Protocol (MCP) clients and AI agents can sign users in to your user pool without registering a separate app client. Previously, each external client needed its own app client, either created in advance or through dynamic client registration, and you had to manage and clean up those clients over time.</p>\n<p>With CIMD, a client uses an HTTPS URL as its client ID and publishes a JSON metadata document at that URL. When the client starts sign-in, Cognito fetches and validates the document and uses it to identify the client and validate its sign-in request. You decide which clients to accept with CIMD policies that map URL patterns to one of your app clients, and Cognito grants only the scopes and grant types that both the app client and the metadata document allow. For example, a company that runs an MCP server can accept an AI assistant by allowing the URL where that assistant publishes its metadata without creating or maintaining an app client for it.</p>\n<p>CIMD is available on the Essentials and Plus feature plans in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To learn more, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-client-id-metadata.html\" target=\"_blank\">Client ID metadata documents (CIMD)</a> in the Amazon Cognito Developer Guide.</p>"
  "a31430fcda6bd4af1863d1f14bff4adb":
    "id": "a31430fcda6bd4af1863d1f14bff4adb"
    "title": "Amazon Aurora DSQL now delivers up to 50% higher write throughput"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-higher-write-throughput/"
    "published": "2026-11-20 05:53:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>With upgrades to its storage layer, <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now delivers up to 50% higher write throughput for many transactional workloads. Data loads finish sooner, and tables whose primary key always increases, such as tables keyed by a timestamp, an identity column, or a time-ordered ID like ULID or UUIDv7, see even greater benefits.</p> \n<p>Applications such as audit logs, ledgers, and event feeds are read in time order, and keying them by time keeps those reads fast. You can now use that design for write-heavy tables too. In our tests, an audit log table keyed by event time accepted up to 200% more inserts per second.</p> \n<p>The improvement is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL is available, for new and existing clusters, at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">Aurora DSQL User Guide</a>.</p>"
  "4cb239fd6594872560451e50e866faee":
    "id": "4cb239fd6594872560451e50e866faee"
    "title": "Amazon CloudFront adds IP based routing and connection logs to SaaS Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-ip-based-routing-connection-logging"
    "published": "2026-11-20 05:26:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon CloudFront now allows web development and SaaS platforms to serve different tiers of customers on the same wildcard domain by using IP addresses to route them to the right configuration. For example, these platforms can serve premium and pro customers from dedicated Anycast static IP address lists, each with its own configuration, and serve free-tier customers on the shared CloudFront IP addresses, all under *.<a href=\"http://example.com\">example.com</a>. Additionally, these customers also have visibility into viewer connections with connection logging.</p> \n<p>Previously, CloudFront chose the configuration from the domain name alone, so the same domain always went to the same configuration. With address-based selection, you can register the same wildcard domain on several IP lists and send each list to its own tenant. Because you control which clients resolve to which IP list, you can shift traffic between your service tiers without your customers needing to make any changes. You can also serve IoT devices, embedded SDKs, and older TLS clients that connect by IP address without sending a domain name in the TLS handshake (Server Name Indication, or SNI). With viewer fallback, you choose a distribution to accept these connections, and CloudFront uses the Host header in each request to serve the right content. Connection logs now also record HTTPS connections to these tenants which helps you troubleshoot how clients connect.</p> \n<p>These features are available at all CloudFront edge locations. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/address-based-selection.html\">Address-based selection</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/connection-logs.html\">Connection Logs</a> in the Amazon CloudFront Developer Guide.</p>"
  "d2514128874cfb35519a41638bf90c43":
    "id": "d2514128874cfb35519a41638bf90c43"
    "title": "Amazon CloudFront simplifies domain moves and onboarding for SaaS Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-domain-moves-distribution-tenants"
    "published": "2026-11-20 05:22:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon CloudFront now lets web development platforms and SaaS providers move a customer's domain to their platform in a single request with no downtime, and serve requests to the domain while the TLS certificate is being configured. The CloudFront multi-tenant distributions allow these platforms to serve many customer domains from one shared configuration. Together, these features help move existing AWS customers to multi-tenant distributions without impacting their traffic.</p> \n<p>Previously, moving a domain that was already in use required disabling the original distribution, using a wildcard workaround, or contacting AWS Support. Now you can bring customer domains onto your multi-tenant setup as part of creating or updating a tenant. With the new OnDomainTakeover option, CloudFront checks domain ownership through DNS records and then moves one or more domains in a single request. This works within an AWS account or across accounts. If you add a domain before its certificate is issued, CloudFront serves it over HTTP until you attach a certificate. That gives you time to validate the domain with AWS Certificate Manager (ACM) or another certificate authority and attach the certificate once it's issued.</p> \n<p>These features are available in all edge locations at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/alternate-domain-names-move-options.html\">Move domains</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/tenant-domains-without-certificate.html\">Domains without a certificate</a> in the Amazon CloudFront Developer Guide.</p>"
  "043a30f40da9e670af4ba3c1a5eec283":
    "id": "043a30f40da9e670af4ba3c1a5eec283"
    "title": "Amazon Connect launches Resolutions, an agentic solution for high-volume operational work"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-resolutions/"
    "published": "2026-11-20 05:06:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon Connect Customer announces the general availability of Resolutions, an agentic operations solution that resolves high-volume work end-to-end, including refund requests, transaction disputes, fraud investigations, and insurance claims. Resolutions helps businesses reduce resolution times and cost to serve by combining the reasoning of AI agents with the reliability of deterministic workflows. Every request follows business policy, gets the oversight it requires, and ends in a verifiable outcome.</p> \n<p>Managers describe a process in natural language or upload standard operating procedures (SOPs), and Resolutions generates a Work plan in minutes. As it builds the Work plan, Resolutions asks clarifying questions that surface exceptions, set decision rules, and define approval thresholds, closing the gaps an SOP leaves open. Resolutions then opens a Resolutions Case for each incoming request and applies the right Work plan. AI agents gather information, apply policy, act across your business applications, and ask customers for missing details to drive every Case to completion. Each Step can run on prebuilt AI agents, AI agents configured in Amazon Connect Customer, or your own, while human specialists handle approvals and exceptions with the context they need to act.</p> \n<p>For example, a bank resolving a transaction dispute can have AI agents pull the transaction history, check the claim against chargeback rules, email the cardholder for a missing receipt, and issue a provisional credit, so a specialist reviews only the disputes that need judgment. Resolutions verifies each outcome and records every action and decision, giving operations leaders an auditable, real-time view of progress, workload, and service level risk.</p> \n<p>To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-get-started.html\">documentation,</a> <a href=\"https://aws.amazon.com/products/connect/customer/?trk=25b81a8c-c9b1-4866-9ba5-f9cb1c5e792a&amp;sc_channel=ps&amp;ef_id=Cj0KCQiA2frXBhC_ARIsAPTFcdPy7k_--3zFXuoVNfszpx_W8hiYrEB8MQvqdwmwAyaVmbZVy16FsEcaAlx0EALw_wcB:G:s&amp;gclid=Cj0KCQiA2frXBhC_ARIsAPTFcdPy7k_--3zFXuoVNfszpx_W8hiYrEB8MQvqdwmwAyaVmbZVy16FsEcaAlx0EALw_wcB\">webpage</a>, and <a href=\"https://aws.amazon.com/products/connect/customer/pricing/appendix/?refid=758059ab-77e5-44fc-8a4a-1be845ee42b9\">pricing page</a>.</p>"
  "6ac3980aa26ef13153e2bce165292e14":
    "id": "6ac3980aa26ef13153e2bce165292e14"
    "title": "AWS Lambda durable functions now supports OpenTelemetry tracing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-durable-otel/"
    "published": "2026-11-20 05:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Lambda announces OpenTelemetry (OTel) support for Lambda durable functions. You can now trace your durable executions and emit traces to Amazon CloudWatch and other industry-standard observability tools.&nbsp;This helps you find bottlenecks in your system, root cause failures faster, and understand how your workflows behave in production.</p> \n<p>With Lambda durable functions, you can build resilient, multi-step applications and AI workflows that run for up to one year, with built-in checkpointing and automatic retries. Durable functions can run for&nbsp;hours, or days, suspending and resuming across many Lambda invocations. The new OpenTelemetry plugin emits a unified trace that spans a full durable execution, including steps, waits, callbacks, and chained function invocations. You can use the trace to gain operational insights across your executions including step durations, retries, and failures across executions.&nbsp;&nbsp;</p> \n<p>The OpenTelemetry plugin is available for the TypeScript, Python, and Java SDKs. You can enable OpenTelemetry support by adding the OpenTelemetry plugin package alongside the Durable Execution SDK and register it on your durable handler or using an environment variable. OpenTelemetry support for Lambda durable functions is available in all AWS Regions that support Lambda durable functions.</p> \n<p>To get started, see the&nbsp; <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/observability/opentelemetry\">OpenTelemetry plugin documentation</a>, the <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/observability/plugins/\">plugin interface documentation</a>, and the <a href=\"https://github.com/aws-samples/sample-lambda-durable-functions-otel-tracing\">sample application</a>. To learn more, read <a href=\"https://aws.amazon.com/blogs/compute/aws-lambda-durable-functions-observability-with-opentelemetry/\">the blog post</a>.&nbsp;</p>"
  "baa659a91f51c5ea07b89d4344dd7fd6":
    "id": "baa659a91f51c5ea07b89d4344dd7fd6"
    "title": "AWS Marketplace agent mode now helps you assess, buy, and deploy solutions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace/aws-marketplace-agent-mode-expansion"
    "published": "2026-11-20 05:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>You can now assess a seller's security, buy, and deploy supported products in one conversation with AWS Marketplace agent mode, the conversational AI experience for procuring cloud solutions. You share your requirement once, and agent mode applies them as it guides you through discovery, purchase, and deployment.</p> \n<p>Describe your use case in natural language to get recommended software, services, AI agents and tools, and multi-product solutions that fit your business needs. To assess a seller's security, request documents such as System and Organization Controls (SOC) 2 reports, and get a criterion-by-criterion assessment against a standard cloud security questionnaire, the Consensus Assessments Initiative Questionnaire (CAIQ).</p> \n<p>When you're ready to buy, sign in with your AWS account. Agent mode explains pricing and terms so you know what you're committing to, shows your organizations' purchase requirements, and completes the purchase after you review the terms and confirm. For supported products, agent mode reviews your AWS environment, proposes a deployment plan with the estimated monthly cost, and deploys after you approve. It then shows you how to start using the product and helps you troubleshoot if a step fails.</p> \n<p>Agent mode is available in all AWS Regions where AWS Marketplace is available.</p> \n<p>To get started, open <a href=\"https://aws.amazon.com/marketplace/agentmode\">agent mode</a> on the AWS Marketplace website. To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/agent-mode.html\">Agent mode for AWS Marketplace</a> in the AWS Marketplace Buyer Guide.</p>"
  "206503c37d4c900e43cd327f673d2970":
    "id": "206503c37d4c900e43cd327f673d2970"
    "title": "Amazon WorkSpaces Applications now supports WebAuthn redirection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-workspaces-applications-webauthn-redirection/"
    "published": "2026-11-20 04:57:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Amazon WorkSpaces Applications now supports WebAuthn redirection, so users can sign in to websites and applications in their streaming session with a FIDO2 authenticator on their local device, such as a security key, Windows Hello, or Touch ID. Previously, an authenticator attached to the user's computer was not available inside the streaming session, so organizations that require phishing-resistant multi-factor authentication (MFA) had to use weaker sign-in methods or keep those applications off WorkSpaces Applications. This helps organizations with FIDO2 requirements stream those applications.</p> \n<p>When an application in the session makes a WebAuthn request, WorkSpaces Applications forwards it to the user's device, where the authenticator signs it and returns the response. Private keys never leave the user's device. Administrators turn it on per stack in the console or API, and on Windows fleets can limit it to an allow list of processes. For example, a bank can let employees sign in to Microsoft 365 in their streaming session with the same security key they use on their laptop.</p> \n<p>WebAuthn redirection is available at no additional charge in all AWS commercial Regions and AWS GovCloud (US) Regions where WorkSpaces Applications is available.</p> \n<p>To get started, select Enable WebAuthn redirection under User Settings for your stack, use an image with the WorkSpaces Applications agent released on or after October 20, 2026, and connect with the WorkSpaces Applications client for Windows (1.5.0 or later) or macOS (1.6.0 or later). To learn more, see <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/feature-support-webauthn-redirection.html\" target=\"_blank\">WebAuthn redirection</a> in the Amazon WorkSpaces Applications Administration Guide, or visit the <a href=\"https://aws.amazon.com/workspaces/applications/\" target=\"_blank\">Amazon WorkSpaces Applications</a> product page.</p>"
  "1cd91f97dd2fdbb9174e2df87ca958a1":
    "id": "1cd91f97dd2fdbb9174e2df87ca958a1"
    "title": "Amazon Route 53 now supports health checks for private endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-private-endpoint-health-checks/"
    "published": "2026-11-20 04:50:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" lang=\"EN-US\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 0px 0px 16px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Amazon Route 53 now offers Private Endpoint Health Checks, enabling business-critical workloads that never touch the public internet, such as internal APIs, databases, and self-hosted nodes behind internal load balancers or in private subnets, to use native health monitoring and automatic DNS failover. Customers can health-check any reachable private target by IP address, domain, or port over HTTP, HTTPS, or TCP. Customers can associate these health checks with Route 53 DNS records across routing policies in private hosted zones, so Route 53 routes traffic only to healthy endpoints and manages failover automatically.</span></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 16px 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Previously, teams built custom control loops using Amazon CloudWatch alarms, AWS Lambda functions, and the Route 53 API to achieve DNS failover for private resources. With t</span><span class=\"NormalTextRun CommentStart SCXW180369299 BCX2\">his approach</span><span class=\"NormalTextRun SCXW180369299 BCX2\">, failover took several minutes and added </span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW180369299 BCX2\">operational</span><span class=\"NormalTextRun SCXW180369299 BCX2\"> burden. Detection and DNS failover with Private Endpoint Health Checks are designed to complete in seconds rather than </span><span class=\"NormalTextRun ContextualSpellingAndGrammarErrorV2Themed SCXW180369299 BCX2\">minutes,</span><span class=\"NormalTextRun SCXW180369299 BCX2\"> the service is fully managed, and nothing is exposed to the public internet.</span></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW180369299 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW180369299 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: justify; margin: 16px 0px; padding-left: 0px; padding-right: 0px; text-indent: 0px;\"><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">The feature supports on-premises and hybrid endpoints reachable from the VPC over AWS Direct Connect or AWS Site-to-Site VPN, enabling resilience patterns such as active-passive disaster recovery and cross-Region DR over AWS Transit Gateway or AWS Cloud WAN. Amazon Route 53 Private Endpoint Health Checks is available today in all AWS commercial regions. To learn more, visit the </span></span><a class=\"Hyperlink SCXW180369299 BCX2\" href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-private-endpoints.html\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun CommentStart SCXW180369299 BCX2\">Amazon Route 53 Developer Guide</span></span></a><span class=\"TextRun SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\"> and the </span></span><a class=\"Hyperlink SCXW180369299 BCX2\" href=\"https://aws.amazon.com/route53/pricing/\" rel=\"noreferrer noopener\" style=\"text-decoration: none; color: inherit;\" target=\"_blank\"><span class=\"TextRun Underlined SCXW180369299 BCX2\" lang=\"EN-US\"><span class=\"NormalTextRun SCXW180369299 BCX2\">Route 53 pricing page.</span></span></a><span class=\"TextRun EmptyTextRun SCXW180369299 BCX2\" lang=\"EN-US\"></span><span class=\"EOP Selected SCXW180369299 BCX2\">&nbsp;</span></p> \n</div> \n<p>&nbsp;</p>"
  "792e822649a637bd203b3c018d90aa2b":
    "id": "792e822649a637bd203b3c018d90aa2b"
    "title": "AWS Revenue Measurement now supports deal-level revenue attribution for AWS Marketplace offers and opportunities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-revenue-measurement-deal-attribution/"
    "published": "2026-11-20 04:25:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Today, AWS announces deal-level revenue attribution for AWS Revenue Measurement (previously Partner Revenue Measurement) capabilities. AWS Partners can now see how the AWS revenue measured for their products maps to specific AWS Marketplace offers and/or APN Customer Engagements (ACE) opportunities. Until now, partners who implemented AWS Revenue Measurement via <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/resource-tagging.html\">Resource Tagging</a>, <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent String</a> or <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering.html\">AWS Marketplace Metering</a> could view aggregated, product-level attributed revenue. With this launch, partners can view attributed revenue by offers and opportunities on the Attributed Revenue dashboard in AWS Partner Central for components hosted in partners' own AWS accounts. Two new capabilities make this possible: Revenue Attribution IDs and Marketplace Revenue Share.</p> \n<p>A Revenue Attribution ID is a unique identifier that allows partners to allocate a product's measured AWS revenue to specific offers and opportunities. Partners create a Revenue Attribution ID, associate it with their deals, and enter a monthly attributed revenue allocation percentage for each deal. Partners with SaaS products on AWS Marketplace can automate allocation to offers with Marketplace Revenue Share. Each month, partners enter the percentage of the product's attributed revenue contributed by AWS Marketplace deals in the Revenue Attribution page, and AWS then calculates the attributed revenue for each active offer. Partners can use Revenue Attribution IDs alongside Marketplace Revenue Share to adjust a calculated offer amount or attribute revenue to opportunities for future months. Both capabilities build on AWS Revenue Measurement, so partners can extend their current product-level implementations to gain deal-level insights.</p> \n<p>Partners can manage <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/revenue-attribution-id.html\">Revenue Attribution IDs</a> and Marketplace Revenue Share in AWS Partner Central or through the <a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/working-with-revenue-attribution.html\">AWS Revenue Measurement</a> and <a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/working-with-marketplace-revenue-share.html\">Marketplace Revenue Share APIs</a>. AWS Revenue Measurement is generally available in all commercial Regions. To learn more, review the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a>. &nbsp;</p>"
  "88a3899516b70a8602a8acc5c71440bc":
    "id": "88a3899516b70a8602a8acc5c71440bc"
    "title": "AWS Lambda now supports a 30-minute timeout for on-demand Event Functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-30-minute-ondemand-event-functions/"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Lambda now supports a 30-minute function timeout for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-functions-chapter.html\">Event Functions</a> that run on demand, doubling the 15-minute limit for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-sync.html\">synchronous</a>, <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html\">asynchronous</a>, and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html\">event source mapping (ESM)</a> invocations. On <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances</a>, synchronous invocations also support up to 30 minutes, while asynchronous and ESM invocations keep the <a href=\"https://aws.amazon.com/blogs/compute/announcing-90-minute-function-timeout-on-aws-lambda-managed-instances/\">90-minute timeout</a> launched in September 2026. You can now run long-running workloads such as AI inference, media transcoding, and financial calculations for spiky or steady-state traffic without re-architecting your applications.</p> \n<p>Customers use&nbsp;Event Functions to build event-driven processors, API backends, and data pipelines. By default, Event Functions run on demand, and Lambda scales them automatically to handle spiky traffic. For steady-state traffic, you can also run them on Lambda Managed Instances, which runs functions on Amazon EC2 instances and&nbsp;maintains&nbsp;the operational simplicity of Lambda.&nbsp;For data-intensive workloads such as AI inference and media processing that run on demand and need longer continuous execution, the 15-minute function timeout had required customers to adopt&nbsp;architectural workarounds. With today's launch, these workloads can run for up to 30 minutes, including when you use <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions</a> or invoke your functions from <a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html\">AWS Step Functions Standard workflows</a>.</p> \n<p>For Event Functions that run on demand, the 30-minute timeout is available in all&nbsp;commercial <a href=\"https://builder.aws.com/build/capabilities\">AWS Regions</a>. On Lambda Managed Instances, it is available for synchronous invocations in all Regions where Lambda Managed Instances is available. You can set the function timeout by using the Lambda console, AWS CLI, AWS SDKs, AWS CloudFormation, AWS CDK, or AWS SAM. You can also use coding assistants such as Kiro, Claude Code, or Codex with the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html\">Agent Toolkit for AWS</a>. Standard <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a> applies. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/configuration-timeout.html\">AWS Lambda Developer Guide</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "5081098e7f8fce43edf1ebedbe1cc7fc":
    "id": "5081098e7f8fce43edf1ebedbe1cc7fc"
    "title": "AWS Transform combines migration assessment and planning in one experience"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-assessment-and-planning"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Transform for migrations now combines migration assessment and migration planning into a single migration job. Previously, you ran separate jobs to build a total cost of ownership (TCO) business case and to plan your migration. With this launch, you upload your on-premises inventory once and use it for both assessment and planning, in any order.</p> \n<p>After you upload your inventory data, you can estimate your AWS costs and build a business case, group your infrastructure into applications and plan migration waves, or do both. You can rerun either workflow as your data improves. For example, build a business case first and then plan waves from the same inventory, or plan your waves first and then estimate the cost of a single wave. Because assessment and planning share one inventory, your business case and migration plan stay consistent without moving data between jobs. After you finalize your plan and assessment, you can continue in the same job to migrate your networks, deploy landing zones, and migrate servers, storage, and containers.</p> \n<p>This newest release is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html#default-regions\">AWS Regions where AWS Transform is offered</a>. To learn more about migrating with AWS Transform, visit the <a href=\"https://aws.amazon.com/transform/migrations/\">product page</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-migrations-discover-assess-plan.html\">documentation</a>.</p>"
  "4a9baeb98d977fb833cc3591aa6d33ee":
    "id": "4a9baeb98d977fb833cc3591aa6d33ee"
    "title": "AWS Transform extends application-centric migration across the lifecycle"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-transform-application-centric-migration"
    "published": "2026-11-20 04:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Transform now puts applications at the center of every stage of the migration journey, so you can discover, plan, migrate, validate, and track the applications your business runs on rather than just the servers underneath them. Application-level grouping has been part of AWS rehost workflows for years, and AWS Transform now carries that same view through your entire migration.</p> \n<p>Enterprise migrations typically involve thousands of servers, but the questions that drive decisions are about applications. Using discovery data, AWS Transform identifies application boundaries and dependencies, then surfaces logical groupings of applications, each with its own total cost of ownership (TCO) and migration tracking. AWS Transform also adds built-in surveys, letting application owners validate ownership, system boundaries, and business criticality.&nbsp;</p> \n<p>A new migration dashboard keeps everyone aligned as the migration moves forward. It gives your team, partners, and leadership one current view of your applications, inventory, assessments, wave plans, and migration status. The dashboard pulls in data from every job in a workspace and updates as work progresses, so no one has to build or maintain separate status reports. You can customize the dashboard and ask questions about migration progress in chat.&nbsp;</p> \n<p>With a more connected workflow and improved visibility across the migration, AWS Transform lets you move to the cloud with more confidence.&nbsp;This capability is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html#default-regions\">AWS Regions where AWS Transform is offered</a>. To learn more about migrating with AWS Transform, visit the <a href=\"https://aws.amazon.com/transform/migrations/\">product page</a>.</p>"
  "d000ae947c39f1dbe936d79b9969dc34":
    "id": "d000ae947c39f1dbe936d79b9969dc34"
    "title": "Amazon IVS Real-Time Streaming now provides a Linux broadcast SDK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ivs-real-time-streaming-linux-broadcast-sdk"
    "published": "2026-11-20 03:49:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>The Amazon Interactive Video Service (Amazon IVS) Linux broadcast SDK is now available for IVS Real-Time Streaming. Applications running on Linux can join an IVS stage, receive audio from participants, and send audio back to the stage in real time. The SDK provides a C API and Go language bindings.</p> \n<p>The Linux broadcast SDK is ideal for AI applications that enrich live streams by processing audio, such as transcription, translation, and content moderation, as well as voice agents that converse with participants.</p> \n<p><a href=\"https://aws.amazon.com/ivs/\">Amazon IVS</a> is a managed live streaming solution designed to make low-latency or real-time video available to viewers around the world. Visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a> for a full list of AWS Regions where the Amazon IVS console and APIs for control and creation of video streams are available.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/ivs/latest/RealTimeUserGuide/broadcast-linux.html\">IVS Broadcast SDK: Linux Guide</a>.</p>"
  "94724c62552ee41795f1ddcf3f057a03":
    "id": "94724c62552ee41795f1ddcf3f057a03"
    "title": "AWS Elemental MediaTailor adds Dynamic Avail Sizing for live HLS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-elemental-mediatailor-dynamic-avail-sizing-live-hls"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Elemental MediaTailor now supports Dynamic Avail Sizing, which reduces the slate viewers see when ad breaks, also called avails, in live HLS streams go unfilled. MediaTailor is a server-side ad insertion and channel assembly service that personalizes ads in live and on-demand video streams.</p> \n<p>When the ad decision server returns fewer ads than a break allows, dynamic avail sizing omits the unfilled time and resumes programming early instead of showing slate. To keep playback continuous, MediaTailor holds back a configurable reserve of content behind the live edge and draws on it when a break ends early. When the reserve runs low, MediaTailor requests extra ad time in later breaks to refill it. Free ad-supported streaming TV (FAST) channel operators can use dynamic avail sizing to keep viewers watching programming instead of filler content.</p> \n<p>Customers turn on dynamic avail sizing for each playback session by adding query parameters to the session initialization URL, with no change to their playback configuration. To learn more, see <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/dynamic-avail-sizing.html\">Dynamic avail sizing</a> in the AWS Elemental MediaTailor User Guide.</p>"
  "71e1fa7fcd67589199bdd6e10f89a01b":
    "id": "71e1fa7fcd67589199bdd6e10f89a01b"
    "title": "Amazon Cognito now supports AWS Secrets Manager for app client secrets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cognito-secrets-manager-integration/"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> now integrates with <a href=\"https://aws.amazon.com/secrets-manager/\">AWS Secrets Manager</a>, so you can store and manage your user pool app client secrets in Secrets Manager. Amazon Cognito helps you implement secure sign-in and access control for users, AI agents, and microservices in minutes. An app client secret authenticates your application to Cognito. Previously, you had to manage and rotate these secrets in Cognito directly.</p>\n<p>With this integration, you can leverage Secrets Manager for capabilities including rotation, access control with AWS Identity and Access Management (IAM) policies, and encryption with an AWS managed key or your own AWS Key Management Service (AWS KMS) customer managed key. This can help with periodic credential rotation or compliance requirements; this also helps with keeping secrets out of the console. You can enable this integration for either a new or an existing app client, and disable it at any time.</p>\n<p>This integration is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito and AWS Secrets Manager are available, except AWS European Sovereign Cloud (Germany). Standard <a href=\"https://aws.amazon.com/secrets-manager/pricing/\">AWS Secrets Manager charges</a> apply. To learn more, see the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html\" target=\"_blank\">Amazon Cognito Developer Guide</a> for instructions.</p>"
  "a3b28f0580994c576791af6994c33cc5":
    "id": "a3b28f0580994c576791af6994c33cc5"
    "title": "AWS WAF launches new Security Analytics Dashboard for real-time investigations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/02/aws-waf-security-analytics-dashboard/"
    "published": "2026-11-20 03:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS WAF now gives you one place to find and stop unwanted traffic across every application in your account. The new AWS WAF security analytics dashboard brings together traffic from all of your protection packs (web ACLs), whether they protect Regional resources or Amazon CloudFront distributions, into a single view. The dashboard also lets you search request logs right in the console, with no logging pipeline to build, and includes 21 days of full-fidelity request data at no additional cost. It is available alongside the existing dashboard for each protection pack (WebACL), which continues to work as it does today.</p> \n<p>Until now, spotting a trend across your applications, such as a bot campaign hitting several endpoints or a spike in blocked requests, meant opening each web ACL in turn or individually querying AWS WAF logs. With the AWS WAF security analytics dashboard, you can analyze traffic data from every protection pack (WebACL) at once. You can filter and group traffic by dimensions such as client IP address, country, ASN, user agent, JA4 fingerprint, host, path, rule triggered, and labels. You can see which endpoints are affected and how traffic is changing across all of them. The data is full-fidelity rather than sampled, and filters apply across the whole dashboard.</p> \n<p>Investigating individual requests has also required delivering AWS WAF logs to Amazon CloudWatch Logs, Amazon S3, or Amazon Data Firehose and writing queries. AWS WAF Security analytics dashboard includes a logs widget that lets you search and explore raw request logs in the console, down to the full HTTP request, with no log delivery to configure. When you find unwanted traffic, you can block an IP address or a country directly from the page. You can also filter by the labels that managed rules attach to requests to see what a rule in Count mode would block before you enforce it.</p> \n<p>The AWS WAF security analytics dashboard is available at no additional cost in all commercial AWS Regions where AWS WAF is available. This feature is not available in the AWS GovCloud (US) Regions and China Regions. To get started, open the AWS WAF console and choose Security analytics in the navigation pane.&nbsp;To learn more, see the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-security-analytics.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS WAF Developer Guide</a>&nbsp;and <a href=\"https://aws.amazon.com/blogs/security/introducing-the-new-aws-waf-security-analytics-dashboard/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog post</a>.</p>"
  "8e5c39a2076fe52bb749716d1c8f2df0":
    "id": "8e5c39a2076fe52bb749716d1c8f2df0"
    "title": "AWS Partner Central now supports AI-assisted listing experience for product, services, and solutions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-central-ai-listing/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>AWS Marketplace search, Agent Mode, and AWS sales teams use listings to recommend partner offerings to AWS customers. Partners who sell software and services can now create and improve their listings in AWS Partner Central with the new AI-assisted listing experience. It drafts content from a partner's website and other materials, then shows which sections need clearer details, use cases, or evidence of customer outcomes. For single-AMI products, it also drafts the usage instructions buyers see after subscribing. Partners see, for each section, whether it meets what buyers look for, and choose which suggestions to use and review all content before publishing.</p> \n<p>Partners can position products and professional services as distinct solutions for different industries, use cases, or outcomes. Each solution gets its own AWS Marketplace page, bringing its case studies and AWS Specializations together with the listing's pricing, reviews, and trust information, so buyers can evaluate and buy from the same page. Buyers can filter search results by Specialization. Partners not ready to share public pricing can publish without it using leads-only listings, through which interested customers request a private offer that reaches the partner as a lead in AWS Partner Central. Partners can test metering and billing setup before publishing, and ask the assistant metering questions while integrating.</p> \n<p>These capabilities are available now to <a href=\"https://aws.amazon.com/marketplace/\">AWS Marketplace</a> partners in all AWS Regions, except the AWS GovCloud (US) Regions and the China Regions. To get started, open AWS Partner Central and choose \"Products and services\" or \"Solutions\". To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/ai-assisted-listing.html\" rel=\"noopener noreferrer\" target=\"_blank\">AI-assisted listing experience</a> and <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/deciding-what-to-list.html\" rel=\"noopener noreferrer\" target=\"_blank\">Deciding what to list</a> in the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/index.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Marketplace Seller Guide</a>.</p>"
  "c2d9fb66ed5c188e15d03a12f44c3777":
    "id": "c2d9fb66ed5c188e15d03a12f44c3777"
    "title": "Aurora PostgreSQL with express configuration now supports Amazon VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-postgresql-express-vpc/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Aurora PostgreSQL databases created with express configuration can now move into an Amazon Virtual Private Cloud (VPC) with a single API call or a modify action in the Amazon RDS console. This helps you take AI-built prototypes and other applications to production without migrating data, while meeting your security and compliance requirements. You can also create a new database cluster inside a VPC using express configuration.</p> \n<p>With express configuration, Aurora PostgreSQL lets you create and query a serverless database in seconds. Connectivity runs through an internet access gateway, which makes this a good fit for rapid prototyping and AI agent-driven development. When your application is ready for production, a single ModifyDBCluster API call moves the cluster into a VPC and turns off the internet access gateway. That gives you security groups, private subnets, and features such as Aurora Global Database, Amazon RDS Blue/Green Deployments, and Amazon RDS Proxy. The move requires no data migration, keeps your cluster endpoint the same, and interrupts connectivity only briefly. You can also reverse it with the same API call.</p> \n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.SupportedRegions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora PostgreSQL with express configuration is available. To get started, use the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS console</a>, AWS CLI, or AWS SDKs. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.MoveIntoVPC\" target=\"_blank\">Aurora User Guide</a>.</p>"
  "ea975f39cf1e8dcf0828327adc7004c0":
    "id": "ea975f39cf1e8dcf0828327adc7004c0"
    "title": "Amazon Aurora now supports moving clusters to a different VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-move-clusters-to-different-vpc/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p>Aurora PostgreSQL and Aurora MySQL clusters can now move from one Amazon Virtual Private Cloud (VPC) to another without data migration. You can move a cluster with a single API call or a modify action in the Amazon RDS console. This lets you move a cluster to a VPC with more IP address space or a non-overlapping CIDR range, consolidate your network architecture, or meet changing security and compliance requirements.</p> \n<p>Previously, moving an Aurora cluster to a different VPC meant creating a new cluster in the target VPC, migrating your data, and updating your applications with new connection strings. Now, a single ModifyDBCluster API call moves your existing cluster to the new VPC. Your data stays in place, your cluster endpoint stays the same, and connectivity is interrupted only briefly during the move. Before you start, turn off features that are tied to the cluster's current VPC, such as Aurora Global Database, Amazon RDS Proxy, and Amazon RDS Blue/Green Deployments. You can set them up again in the new VPC after the move.</p> \n<p>This feature is available for Aurora PostgreSQL and Aurora MySQL in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html#CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.SupportedRegions\" target=\"_blank\">AWS Regions</a> where Aurora PostgreSQL with express configuration is available. To get started, use the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS console</a>, AWS CLI, or AWS SDKs. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html#USER_VPC.WorkingWithRDSInstanceinaVPC.UpdatingVPC\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora User Guide</a>.</p>"
  "6855a8d9a3333f6722fd77e1ac6db424":
    "id": "6855a8d9a3333f6722fd77e1ac6db424"
    "title": "Amazon MSK Connect now supports restarting existing connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-msk-connect-restart-existing-connectors"
    "published": "2026-11-20 01:00:00"
    "fetched": "2026-11-20 10:00:05"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/msk-connect/\">Amazon MSK Connect</a> (Amazon Managed Streaming for Apache Kafka Connect) now supports restarting both existing and newly created connectors and their tasks in place, enabling fast recovery for streaming data pipelines.</p> \n<p>Amazon MSK Connect is a fully managed service that allows you to deploy, monitor, and scale Apache Kafka Connect connectors with Amazon MSK (Managed Streaming for Apache Kafka). Previously, recovering from failures required deleting and recreating the connector, resulting in downtime and operational overhead. With this feature, you can restart your connector and all its tasks in place, or selectively restart only the failed tasks, making recovery seamless. You can also restart connectors that have no failed tasks to recover from transient issues or to pick up changes in external systems or dependencies.</p> \n<p>This restart capability is available at no additional cost through the Amazon MSK Console, AWS CLI, AWS SDK, and AWS CDK in all AWS Regions where Amazon MSK Connect is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/mskconnect.html\"><u>Amazon MSK Connect documentation</u></a>. To get started, visit the <a href=\"https://console.aws.amazon.com/msk\"><u>Amazon MSK Console</u></a>.</p>"
  "e493f18a83289bd52e5b6d6246232a2e":
    "id": "e493f18a83289bd52e5b6d6246232a2e"
    "title": "Announcing the general availability of a new AWS Local Zone in Bogotá, Colombia"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-local-zone-bogota-colombia/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-20 17:20:08"
    "summary": "<p>Today, AWS announces the general availability of a new Local Zone in Bogotá, Colombia, bringing AWS infrastructure closer to end users for applications that require single-digit millisecond latency. You can use the Bogotá Local Zone for workloads such as real-time gaming, live video streaming, medical imaging, and financial transaction processing.</p> \n<p>AWS Local Zones are infrastructure deployments that place compute, storage, networking, and other select AWS services closer to metropolitan areas, with the same APIs and tools as AWS Regions. You pay only for what you use, with no minimum commitment. Pricing options include On-Demand, Savings Plans, and Spot Instances. AWS Local Zones are available in more than 30 locations worldwide.</p> \n<p>The AWS Local Zone in Bogotá supports&nbsp;Amazon Elastic Compute Cloud (Amazon EC2) with C7i, M7i, and R7i instances, Amazon S3 with the One Zone-Infrequent Access storage class, Amazon EBS with local snapshots and volume types gp3, gp2, and io1, Amazon Elastic Container Service (Amazon ECS), Amazon Elastic Kubernetes Service (Amazon EKS), Amazon Virtual Private Cloud (Amazon VPC), AWS Direct Connect, and Application Load Balancer. &nbsp;</p> \n<p>To get started, enable the AWS Local Zone in Bogotá (us-east-1-bog-1a) from the <a href=\"https://us-east-1.console.aws.amazon.com/ec2globalview/home\">Regions and Zones</a> tab in the AWS Global View or by using the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyAvailabilityZoneGroup.html?refid=769a1a2b-8c19-4976-9c45-b6b1226c7d20\">ModifyAvailabilityZoneGroup</a> API. For pricing information, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/pricing/?nc=sn&amp;loc=4\">AWS Local Zones pricing page</a>.&nbsp;To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones overview page</a>.</p>"
  "d6882337492956ed7f53b72f3b50822f":
    "id": "d6882337492956ed7f53b72f3b50822f"
    "title": "AWS DevOps Agent now supports Slack code channels and Microsoft Teams two-way conversations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-devops-agent-slack-code-channels-teams-two-way/"
    "published": "2026-11-20 07:30:00"
    "fetched": "2026-11-21 02:29:53"
    "summary": "<p>AWS DevOps Agent now supports dedicated Slack code channels and two-way conversations in Microsoft Teams, so on-call engineers and DevOps teams can investigate and resolve incidents where they already work together. AWS DevOps Agent investigates incidents across AWS, multicloud, and on-premises environments.</p> \n<p>Slack code channels give each investigation its own channel. Choose <b>Open in code channel</b> on an investigation card, and your team and the agent work on the investigation together in that channel. You can ask follow-up questions without @mentioning the agent. If you registered your Slack workspace before this launch, update your Slack permissions to use code channels.</p> \n<p>For Microsoft Teams, before this launch, users received only one-way notifications from AWS DevOps Agent. Now you can mention AWS DevOps Agent in a connected private or shared channel to ask questions, explore your AWS resources, and steer investigations. The agent replies in a thread under your message. To get started, turn on Bidirectional mode when you associate the channel with your Agent Space. A channel member then authorizes the association before the agent posts.</p> \n<p>These capabilities are available in all commercial AWS Regions where AWS DevOps Agent is currently supported.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><p><a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/connecting-to-ticketing-and-chat-using-slack-code-channels.html\">Using Slack code channels</a></p> </li> \n <li><p><a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/connecting-to-ticketing-and-chat-connecting-microsoft-teams.html\">Connecting Microsoft Teams</a></p> </li> \n <li><p><a href=\"https://aws.amazon.com/devops-agent/\">AWS DevOps Agent product page</a></p> </li> \n</ul>"
  "66727d550f59e6a725170b8f4a65cf1c":
    "id": "66727d550f59e6a725170b8f4a65cf1c"
    "title": "AWS Lambda adds support for Python 3.15"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-python-315/"
    "published": "2026-11-20 23:59:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Lambda now supports creating serverless applications using Python 3.15. Python 3.15 is generally available for Lambda Event Functions and is available in public preview for Lambda Web Functions. This is the first Python runtime for Web Functions, which until now only supported Node.js. With this launch, developers can also build web applications and APIs on Web Functions in Python. Developers can use Python 3.15 as both a managed runtime and a base container image (Event Functions only), and AWS will automatically apply updates to the managed runtime and base image as they become available.<br /> <br /> Python 3.15 is the latest release of Python. With this release, you can use the latest Python 3.15 features in Lambda, such as explicit lazy imports that can reduce function startup time, the new frozendict and sentinel built-in types, and an improved JIT compiler. You can use Python 3.15 with <a href=\"https://docs.aws.amazon.com/powertools/python/latest/\" rel=\"noopener noreferrer\" target=\"_blank\">Powertools for AWS Lambda (Python)</a>, a developer toolkit to implement serverless best practices and increase developer velocity. You can also use the full range of AWS deployment tools, including the Lambda console, AWS CLI, AWS Serverless Application Model (AWS SAM), AWS CDK, and AWS CloudFormation to deploy and manage serverless applications written in Python 3.15.<br /> <br /> The Python 3.15 runtime is available in all Regions where Event Functions and Web Functions are available.<br /> <br /> For more information about Python 3.15 in Lambda, refer to the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-python.html\" rel=\"noopener noreferrer\" target=\"_blank\">Event Function</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/web-functions-python.html\" rel=\"noopener noreferrer\" target=\"_blank\">Web Function</a> documentation. For more information about AWS Lambda, visit our <a href=\"https://aws.amazon.com/lambda/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>.</p>"
  "917676e321b8cbd9f9705c6ff1a50fee":
    "id": "917676e321b8cbd9f9705c6ff1a50fee"
    "title": "AWS launches standardized cost and rate columns in CUR 2.0 and Cost Explorer"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-cur-cost-explorer/"
    "published": "2026-11-20 23:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Data Exports for Cost and Usage Report (CUR) 2.0 now includes standardized cost and rate columns that represent cost consistently across AWS purchase options, including On Demand, Savings Plans, Reserved Instances, EC2 Spot, and EC2 Capacity Blocks for ML. These 14 columns are added&nbsp;when you enable Include Standardized cost and rate columns&nbsp;while setting up a new&nbsp;CUR 2.0 export or editing an existing CUR 2.0 and these columns have&nbsp;the prefix cost_analytics_. With these new columns, you can quantify the savings you realize from commitments, discounts, and tiered pricing, and analyze amortized cost the same way for every pricing model with multiple payment options, directly in CUR 2.0.</p> \n<p>Previously, calculating savings required combining CUR with Savings Plans rates and public price lists, and amortized cost used different columns for each pricing model. Now each line item carries billed, effective, list, contracted, public on-demand cost, the public equivalent of billed and effective cost before discounts, and a rate for each, so you can measure savings and amortized cost without building your own calculations. To add the columns, select Include&nbsp;standardized cost and rate columns&nbsp;when you create or edit a CUR 2.0 export. In Cost Explorer, choose the new cost types under Advanced options to see the same costs.</p> \n<p>Standardized cost and rate&nbsp;columns are available at no additional charge in all AWS Regions except the AWS GovCloud (US) Regions and the China Regions. To learn more, see the <a href=\"https://docs.aws.amazon.com/cur/latest/userguide/table-dictionary-cur2.html\">CUR 2.0 data dictionary</a> and the <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-advanced.html\">user guide for Cost Explorer</a>.</p>"
  "405a19af79f07745b5d50a33394faf5b":
    "id": "405a19af79f07745b5d50a33394faf5b"
    "title": "AgentCore runtime instances now support Amazon EC2 G7 instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agentcore-ec2-g7/"
    "published": "2026-11-20 19:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Amazon Bedrock AgentCore <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances.html\">runtime instances</a> now support Amazon EC2 G7 instances, powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs. Runtime instances run your agents on Amazon EC2 instances while AgentCore handles provisioning, patching, scaling, and lifecycle management. G7 instances give agents that do 3D rendering or model inference another GPU option, alongside families such as G6e and G7e.</p> \n<p>To use G7, add G7 instance types, from g7.2xlarge to g7.48xlarge, to the allowed instance types of your capacity provider. AgentCore installs the NVIDIA drivers on the instance, so standard container images run GPU workloads without bundling drivers. For example, an agent can render 3D scenes or run a vision model on its own GPU, in <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/\">sessions of up to 14 days</a>.</p> \n<p>G7 instances on runtime instances are available in select AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (London), Europe (Stockholm), Asia Pacific (Mumbai), and Asia Pacific (Sydney). You are charged for managing the provisioned compute, in addition to your Amazon EC2 costs.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances-how-it-works.html#runtime-instances-gpu\">Use GPU instance types</a> in the Amazon Bedrock AgentCore Developer Guide</li> \n <li><a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a></li> \n</ul>"
  "e3447b7c7eab839220c27b9a03cc6ff9":
    "id": "e3447b7c7eab839220c27b9a03cc6ff9"
    "title": "​​​Amazon RDS for Db2 now supports renaming databases​"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-db2-supports-rename-databases"
    "published": "2026-11-20 17:53:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>​​Amazon Relational Database Service (Amazon RDS) for Db2 now supports renaming databases in place. You can rename a database on your DB instance by calling the new rdsadmin.rename_database stored procedure. Previously, renaming a database required you to back it up and restore it under a new name. With rename, the database keeps its data in place, so it's faster than backing up and restoring the database.​</p> \n<p>​​Database rename simplifies workflows such as replacing a database with a restored copy. For example, after you restore a copy of a database from a backup, you can rename the original database, and then give its name to the restored copy, without changing your application connection strings. Database rename runs as a background task that you can monitor with rdsadmin.get_task_status.​&nbsp;</p> \n<p>​​Database rename is available in all AWS Regions where Amazon RDS for Db2 is offered. To get started, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/db2-managing-databases.html#db2-renaming-database\" target=\"_blank\">Amazon RDS User Guide</a>.​​</p>"
  "894d4d010d74e1aa6ffa0aeb5b1f78c5":
    "id": "894d4d010d74e1aa6ffa0aeb5b1f78c5"
    "title": "Amazon RDS for Db2 now supports new Canadian time zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-db2-supports-new-canadian-time"
    "published": "2026-11-20 17:49:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>​​Amazon RDS for Db2 now supports four new time zones, America/Vancouver, America/Edmonton, America/Inuvik, and America/Winnipeg, that reflect the updated local time rules for British Columbia, Alberta, the Northwest Territories, and Manitoba in Canada. As of November 1, 2026, these provinces and territories observe permanent daylight saving time and no longer set their clocks back by an hour.​</p> \n<p>​Data stored in UTC is unaffected, but values based on the instance's local time, such as CURRENT TIMESTAMP, CURRENT DATE, default timestamp columns, scheduled jobs, and business-day batch logic, can be affected. With these new time zones, you can keep local time values accurate for workloads operating in these regions.&nbsp;</p> \n<p>​​You can select the new time zones when you create a new RDS for Db2 instance. To change the time zone of an existing instance, contact AWS Support, as modifying the time zone of an existing instance is not supported through the AWS CLI, API, or SDK. If your instances serve workloads in these regions, we recommend reviewing them and updating your time zone configuration to avoid incorrect local times in your applications.​</p> \n<p>​The new time zones are available in all AWS Regions where Amazon RDS for Db2 is offered. To learn more and see the full list of supported time zones, visit the Amazon RDS for Db2 time zone <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/db2-time-zone.html\" target=\"_blank\">documentation</a>.​&nbsp;</p>"
  "36d7e8ec6a2b6446ca4969a566c1c52e":
    "id": "36d7e8ec6a2b6446ca4969a566c1c52e"
    "title": "Amazon RDS for Db2 now supports object-level audit policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-db2-supports-object-level-audit-policies"
    "published": "2026-11-20 17:34:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Amazon RDS for Db2 now supports object-level audit policies, giving you fine-grained control over which database objects are audited. You can create custom audit policies and attach them to specific tables, users, groups, roles, and authorities in your RDS for Db2 databases.</p> \n<p>With object-level audit policies, you can focus on auditing the objects that matter most — for example, a single table that contains sensitive data or a specific user — without generating audit records for your entire database. Object-level audit policies complement the existing database-level audit logging in Amazon RDS for Db2. You can use both at the same time, and they operate independently.&nbsp;</p> \n<p>Amazon RDS provides stored procedures to create, modify, attach, detach, and drop object-level audit policies. Audit records are uploaded to the same Amazon S3 bucket that you configured for Db2 audit logging.</p> \n<p>Object-level audit policies for Amazon RDS for Db2 are available in all AWS Regions where Amazon RDS for Db2 is available. To get started see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/db2-object-level-audit.html\" target=\"_blank\">Amazon RDS User Guide.</a>&nbsp;</p>"
  "b485426c6a0ae161258bb0db854cbe90":
    "id": "b485426c6a0ae161258bb0db854cbe90"
    "title": "Amazon RDS Custom now supports the latest Cumulative Update and GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-rds-custom-supports-latest-cumulative-update-gdr-microsoft-sql-server/"
    "published": "2026-11-20 17:30:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest Cumulative Updates (CU) and General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for SQL Server 2019 CU32 + GDR <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2019/cumulative-update/kb5128494-cu32-gdr-october-2026\" target=\"_blank\">KB5128494</a> (RDS version 15.00.4500.2.v1) and SQL Server 2022 CU27 + GDR <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2022/cumulative-update/kb5126934-cu27-gdr-october-2026\" target=\"_blank\">KB5126934</a> (RDS version 16.00.4305.5.v1). </p> \n<p>For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5128494 and KB5126934. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
  "748829d2f28e9e8937cc541d12c3b108":
    "id": "748829d2f28e9e8937cc541d12c3b108"
    "title": "AWS Continuum for Penetration Testing now estimates task hours before you run a test"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/continuum-pentest-cost-estimates/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Continuum for Penetration Testing (formerly AWS Security Agent) now lets you estimate task hours before running a penetration test, so developers and security teams can see how many billable task hours a test is likely to need and choose a maximum task-hours limit with confidence. Continuum for Penetration Testing runs on-demand, AI-driven penetration tests against your web applications and APIs. Previously, the only way to know how long a test would take was to run it, making it difficult to plan budgets and set appropriate usage limits.</p>\n<p>With task-hour estimates, you open a penetration test, choose the Pentest cost estimate tab, and request an estimate. AWS Continuum runs a short preliminary analysis of your application's scope. It then draws on expertise from past penetration tests to estimate the task hours needed and shows the task hours that most similar applications finish within, and the higher range a few applications require. Requesting an estimate is free, and the estimate is a guide, not a quote or a limit. Actual task hours can be higher or lower, and only the maximum task-hours limit caps usage.</p>\n<p>Task-hour estimates are available in all AWS Regions where AWS Continuum for Penetration Testing is available.</p>\n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/perform-penetration-test.html#task-hour-estimate\" target=\"_blank\">documentation</a>. To get started, visit the <a href=\"https://aws.amazon.com/continuum/\">AWS Continuum product page</a>.</p>"
  "55009bdbe39172cdfff19dcb47b4b18f":
    "id": "55009bdbe39172cdfff19dcb47b4b18f"
    "title": "Second-generation AWS Outposts racks now supported in the AWS Asia Pacific (Osaka)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-outposts-racks-osaka/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the AWS Asia Pacific (Osaka) Region. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.</p> \n<p>Organizations of every size, from startups to enterprises to public sector agencies, can now order Outposts racks connected to this newly supported Region to optimize for latency and data residency needs. This regional expansion provides additional flexibility in the number of AWS Regions that customers' Outposts can connect to.</p> \n<p>To learn more about second-generation Outposts racks, read the <a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Outposts blog post</a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\" rel=\"noopener noreferrer\" target=\"_blank\">user guide</a>. For the latest list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, see the <a href=\"https://aws.amazon.com/outposts/rack/faqs/\">AWS Outposts FAQs page</a>.</p>"
  "e0bd049d651a24e4ed9e69c368b62d7d":
    "id": "e0bd049d651a24e4ed9e69c368b62d7d"
    "title": "Amazon Transcribe now available in AWS European Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-transcribe-germany/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Amazon Transcribe is now available in the AWS European Sovereign Cloud (Germany) Region. Customers who need to keep data and operations within the EU for regulatory compliance and data sovereignty requirements can now use automatic speech recognition (ASR) in the Region to turn speech into text.</p> \n<p>Amazon Transcribe offers two ways to transcribe audio in this Region. Batch transcription processes media files stored in Amazon S3, and streaming transcription returns text in real time from live audio over HTTP/2 or WebSocket. Both support custom vocabularies, so you can improve recognition of domain-specific terms such as product names, industry jargon, and proper nouns.</p> \n<p>To learn more, see <a href=\"https://docs.aws.eu/transcribe/latest/dg/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Getting started with Amazon Transcribe</a>, <a href=\"https://docs.aws.eu/transcribe/latest/dg/supported-languages.html\" rel=\"noopener noreferrer\" target=\"_blank\">Supported languages and language-specific features</a>, and <a href=\"https://www.aws.eu/european-sovereign-cloud/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS European Sovereign Cloud pricing</a>.</p>"
  "cf1a13e028ee1c9073d7a9aaecadae5a":
    "id": "cf1a13e028ee1c9073d7a9aaecadae5a"
    "title": "AWS Agent Registry now supports WebBotAuth bot registration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agent-registry-webbotauth-support/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Agent Registry now supports registering <a href=\"https://datatracker.ietf.org/wg/webbotauth/about/\" target=\"_blank\">WebBotAuth</a> (WBA) bots as a new record type, making it easier to verify legitimate bot traffic through a standardized protocol. Previously, organizations lacked a standardized way to distinguish verified bots from malicious traffic. Now, bots can prove domain ownership through WebBotAuth, and you can integrate this verification with <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/11/aws-waf-bot-control-onboarding/\" target=\"_blank\">AWS WAF Bot Control</a> to write rules that combine verification status and bot identity.</p>\n<p>This new capability gives content providers and application developers fine-grained control over which bots can access your resources. You can enhance security and improve traffic management by distinguishing legitimate bots from malicious actors. For example, you can allow WBA verified search engine crawlers while blocking unverified traffic or create custom access policies based on both bot identity and verification status.</p>\n<p>This feature is available in all AWS Regions where AWS Agent Registry is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html\" target=\"_blank\">AWS Agent Registry documentation</a> and the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-bot-control.html\" target=\"_blank\">AWS WAF Bot Control documentation</a>.</p>"
  "05b0c2233e67111087bfe0182b9b7570":
    "id": "05b0c2233e67111087bfe0182b9b7570"
    "title": "Amazon VPC Lattice now supports CloudWatch metrics for VPC resources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/vpc-lattice-cloudwatch-metrics/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Amazon VPC Lattice now publishes Amazon CloudWatch metrics for VPC resources. Resource owners — those who share resources via VPC Lattice — and resource consumers — those who access those shared resources — can now see TCP traffic to resources such as databases, clusters, and on-premises endpoints. Resource owners get metrics for resource gateways and resource configurations. Consumers get metrics for resource endpoints, service network endpoints, and service network VPC associations. Previously, resource access logs were the primary way to see this traffic, but they required additional processing and provided limited real-time visibility. Now you can monitor your layer-4 resources directly in CloudWatch.</p> \n<p>With these metrics, you can proactively catch connectivity issues and optimize resource capacity. Capacity planning metrics — including bytes processed, new flows, and active flows — let resource owners monitor traffic per resource gateway and per resource configuration to track load on shared resources. Reliability metrics, such as dropped packets, help you detect problems early. Resource gateways also report port allocation errors, which show when a resource gateway needs more IPv4 addresses per network interface. Consumers can monitor traffic per resource endpoint, service network endpoint, or service network VPC association. They can set CloudWatch alarms for when new flows drop to zero or dropped packets increase, catching an unreachable resource before their applications do. Both owners and consumers can break metrics down by Availability Zone to isolate zonal issues or verify connections after configuration changes.</p> \n<p>CloudWatch metrics for VPC resources are available in all AWS Regions where Amazon VPC Lattice is available. For the list of Regions, see the <a href=\"https://docs.aws.amazon.com/vpc-lattice/latest/ug/what-is-vpc-lattice.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon VPC Lattice FAQs</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/vpc-lattice/latest/ug/monitoring-cloudwatch.html\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch metrics for Amazon VPC Lattice</a> in the Amazon VPC Lattice User Guide, or visit the <a href=\"https://docs.aws.amazon.com/vpc-lattice/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon VPC Lattice product page</a>.</p>"
  "0492eb73283572f4487df6751ff723db":
    "id": "0492eb73283572f4487df6751ff723db"
    "title": "AWS DevOps Agent adds community and partner tools repository"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/devops-agent-tools-repository/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS DevOps Agent now gives you ways to share and leverage skills, MCP servers, connectors, and custom agents that enhance the capabilities of your AWS DevOps Agent instances.</p>\n<p>The <a href=\"https://aws.github.io/tools-for-devops-agent/\" target=\"_blank\">AWS DevOps Agent Tools open source repository</a> is a centralized, AWS-curated collection of tools that extend AWS DevOps Agent capabilities. Customers can import ready-to-use, quality-controlled tools directly into their DevOps Agent configurations to improve investigation quality and expand operational context. A growing community of AWS DevOps Agent users and partners, and AWS service and support teams, have contributed a growing collection of tools to the community, including several partner-managed connectors that simplify connecting AWS DevOps Agent to third party MCP servers. Partners providing connectors include: Bluebox, Bronto, Celonis, Clickhouse Observability, Coralogix, Cribl, Elastic, Halo, Honeycomb, LaunchDarkly, Neo4j, Sumo Logic, and Wiz.</p>\n<p>To get started, browse the skills and connector catalogs from within your AWS DevOps Agent instance, or add and share your own tools by creating a PR within the AWS DevOps Agent Tools repository.</p>\n<p>See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\" target=\"_blank\">release history</a> page. For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\" target=\"_blank\">supported Regions table</a>.</p>"
  "baed674d731b6d8ccd1c7bc52cb8c870":
    "id": "baed674d731b6d8ccd1c7bc52cb8c870"
    "title": "AWS DevOps Agent adds new chat capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/devops-agent-new-chat-capabilities/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS DevOps Agent now extends its chat capabilities across MCP clients like Kiro and Claude Code, as well as Slack and Microsoft Teams channels. With Model Context Protocol (MCP) support, AWS DevOps Agent can now take directed chat actions including support for GitHub, GitLab, Azure DevOps, ServiceNow, and PagerDuty MCP tools, giving developers and operations teams powerful workflow automation directly from their preferred chat interface.</p>\n<p>This launch also adds auto-creation of per-incident Slack code channels and bi-directional chat within Microsoft Teams. AWS DevOps Agent has access to a compute sandbox that it can use to execute scripts and access the network to work more efficiently, and users can now rename and archive chats across all supported platforms.</p>\n<p>See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\" target=\"_blank\">release history</a> page. For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\" target=\"_blank\">supported Regions table</a>.</p>"
  "18ed8c1059e6b0ad8722c02aedf12bb9":
    "id": "18ed8c1059e6b0ad8722c02aedf12bb9"
    "title": "Amazon Textract Insights is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/textract-insights-ga/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>Amazon Textract Insights brings document understanding to Amazon Textract. It is a new generative AI feature of Amazon Textract, and is now generally available in the US East (N. Virginia) and US West (Oregon) AWS Regions. Amazon Textract Insights splits, classifies, and extracts structured data from documents in a single asynchronous request. Documents like insurance claims, tax packets, and onboarding packages often arrive as one long scan that holds many documents in no fixed order. Processing them has meant assembling and operating separate steps for text detection, splitting, classification, and extraction. Amazon Textract Insights handles that work in one managed request, with no AI models to train.</p>\n<p>How it works: You define the fields you need in a blueprint, a JSON schema that describes each field in natural language, or you can start from a library of AWS public blueprints for common document types such as W-2s, invoices, and bank statements. Amazon Textract Insights can split each file into separate sub-documents, classify each one by matching it to the best-fitting blueprint, and extract your fields. It returns a confidence score for every value and grounds each one to its location on the page, so you can automate high-confidence results and route the rest to human review. It can also return Markdown, HTML, and plain text for retrieval-augmented generation (RAG) applications, generate document summaries and figure captions, and detect and redact personally identifiable information. Amazon Textract Insights reads documents from and writes results to your own Amazon S3 buckets.</p>\n<p>You can use Amazon Textract Insights through the AWS SDKs and the AWS CLI. To learn more, see the <a href=\"https://aws.amazon.com/textract/\">Amazon Textract product page</a> and the Amazon Textract Insights section of the <a href=\"https://docs.aws.amazon.com/textract/latest/dg/what-is.html\" target=\"_blank\">Amazon Textract Developer Guide</a>.</p>\n<p>Regional Availability: US East (N. Virginia), US West (Oregon)</p>"
  "46db1d1dc3180703c7cbde0ecc4234f2":
    "id": "46db1d1dc3180703c7cbde0ecc4234f2"
    "title": "AWS DevOps Agent reduces investigation latency"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/devops-agent-reduces-latency/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>When an incident is occurring, mean time to recover needs to be as fast as possible.</p>\n<p>With this launch, incident investigations performed by AWS DevOps Agent complete faster. Investigations now also include a real-time summary that is updated with the current state of an investigation, so initial findings and observations surface quickly, before a final root cause and mitigation plan are created. For customers using AWS DevOps Agent's built in Slack integration, these summaries are also automatically pushed to the relevant Slack channel.</p>\n<p>See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\" target=\"_blank\">release history</a> page. For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\" target=\"_blank\">supported Regions table</a>.</p>"
  "64ab0c7368c61dd740bac08c707c9bea":
    "id": "64ab0c7368c61dd740bac08c707c9bea"
    "title": "AWS Lambda MicroVMs now supports customer managed keys in AWS KMS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-microvms-customer-managed-keys/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Lambda MicroVMs now supports customer managed keys (CMK) in <a href=\"https://aws.amazon.com/kms/\">AWS Key Management Service</a> (KMS) for data encryption at rest. CMK gives you full control over the lifecycle and usage of your KMS keys<a href=\"https://aws.amazon.com/cloudtrail/\">,</a> helping meet compliance requirements in regulated industries like financial services and healthcare.</p> \n<p>Lambda MicroVMs is a serverless compute primitive that provides VM-level isolation, near-instant launch and resume, and state preservation for executing user or AI generated code. Use MicroVMs to build applications like AI coding assistants, interactive development environments, and vulnerability scanners.</p> \n<p>To get started, create a CMK in AWS KMS and configure its cryptographic properties, metadata, and <a href=\"https://aws.amazon.com/iam/\">AWS IAM</a> access permissions.&nbsp;Then, specify this CMK as a parameter when you create a MicroVM image or run a MicroVM. Lambda uses this CMK to encrypt your MicroVM image, MicroVM image environment variables, and the payload passed to the MicroVM run hook.&nbsp; You can use CMK with Lambda MicroVMs&nbsp;through the <a href=\"https://console.aws.amazon.com/lambda/\">AWS Lambda console</a>, <a href=\"https://aws.amazon.com/cloudformation/\">AWS CloudFormation</a>, <a href=\"https://aws.amazon.com/cdk/\">AWS Cloud Development Kit</a>, or with your preferred Agentic development tools using the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/serverless-skills/aws-lambda-microvms\">Agent Toolkit for AWS</a>.</p> \n<p>​​CMK support for MicroVMs is available in the following AWS Regions:&nbsp;Asia Pacific (Hong Kong), Asia Pacific (Malaysia), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Thailand), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (Spain), Europe (Stockholm), South America (São Paulo),&nbsp;US East (N. Virginia), US East (Ohio), and US West (Oregon). To learn more about Lambda MicroVMs, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html\">AWS Lambda MicroVMs developer guide</a>. For information on pricing for&nbsp;CMK, see <a href=\"https://aws.amazon.com/kms/pricing/\">AWS KMS pricing</a>.​</p>"
  "f8ef04e9c95c8544adffbba2d3a69f83":
    "id": "f8ef04e9c95c8544adffbba2d3a69f83"
    "title": "AWS Secrets Store CSI Driver Provider now supports AssumeRole for cross-account secret access"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/secrets-store-csi-driver-assumerole/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>The AWS Secrets Store CSI Driver Provider now supports AssumeRole (role-chaining), allowing Kubernetes pods to access secrets and parameters across AWS accounts by assuming an IAM role in the account where the secrets are stored. Previously, customers reading cross-account secrets needed to add a resource policy to each secret and use a customer-managed KMS key, as the AWS managed key (aws/secretsmanager) cannot be used for cross-account access. Now, teams can name a target role in the SecretProviderClass, and the provider assumes that role to fetch the secrets.</p>\n<p>With AssumeRole support, customers managing hundreds of AWS accounts and thousands of services can simplify cross-account secret access. A single trust policy on one target role replaces resource policies on each secret. Secrets encrypted with the AWS managed key (aws/secretsmanager) and SSM parameters become readable across accounts. The target account sees workload-specific session names in CloudTrail events for better attribution. This feature works with both IAM Roles for Service Accounts (IRSA) and EKS Pod Identity on initial mount and rotation, and supports failover regions.</p>\n<p>AssumeRole support is available in all AWS Regions where Amazon EKS and the AWS Secrets Store CSI Driver Provider are available.</p>\n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/integrating_ascp_assume_role.html\" target=\"_blank\">Assume an IAM role to retrieve secrets with the ASCP</a> documentation.</p>"
  "32aa08de5e14dac8b6e04d9396a9d5ba":
    "id": "32aa08de5e14dac8b6e04d9396a9d5ba"
    "title": "AWS Agent Registry now offers naming and public discovery capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agent-registry-naming-public-discovery/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS Agent Registry now offers public naming capabilities, making it easy to attach verified domain names to your agents and AI tools. Developers and network admins can perform domain verification checks to prove domain ownership, then associate the verified domain names with their agents to promote them for public visibility beyond their registry and AWS account.</p>\n<p>Previously, developers had to manually configure how agents discover and connect to one another, which added complexity to building multi-agent systems. With this launch, since the public agent records are anchored to a verified domain identity, you can confirm the source of an agent before connecting to it. Once published, agent records are searchable by any AWS-authenticated user using both semantic and lexical search.</p>\n<p>This capability is available at no additional charge at this time in all AWS Regions where AWS Agent Registry is available. To learn more about naming and public discovery, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html\" target=\"_blank\">AWS Agent Registry documentation</a>.</p>"
  "49a56e6afc90d60cc9f5dd563a5cd0cc":
    "id": "49a56e6afc90d60cc9f5dd563a5cd0cc"
    "title": "AWS Partner Central guides now available in the console and through AWS Partner Central Agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/partner-central-guides-mcp/"
    "published": "2026-11-20 06:51:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS announces AWS Partner Central guides with access through the &nbsp;<a href=\"https://us-east-1.console.aws.amazon.com/partnercentral/content?region=us-east-1\">AWS Partner Central console&nbsp;</a> and the AWS Partner Central Agents Model Context Protocol (MCP) server. The guides give AWS Partners one place to search, read, and share content that AWS organizes to help partners grow and expand their business. The guides hold authoritative, partner-specific knowledge on programs, benefits, technical topics, marketing, funding, and more, which requires sign-in and permissions. Partners benefit from more accurate answers about programs, benefits, and requirements.</p> \n<p>Partners can browse by topic, search instantly across every guide, and see content based on their recent activity and AWS program updates. Partners can also ask AWS Partner Central Agents questions in their own words, such as \"Which guides explain the requirements for the AWS Foundational Technical Review?\" or \"Show me everything in Migration Acceleration Program quick reference.\" Partner Central guides complement the public information about AWS Partner Central features in AWS documentation.</p> \n<p>AWS Partner Central guides are available to all AWS Partners in the AWS Partner Central console and through the AWS Partner Central Agents MCP server in the US East (N. Virginia) Region in English. Partners can bring these guides into tools such as Kiro, AWS Quick, CRM systems, and other AI clients. To learn more, visit &nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/guides.html\">Guides in the AWS Partner Central console&nbsp;</a> or &nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/mcp-getting-started.html\">Getting started with the Partner Central Agents MCP server&nbsp;</a>.</p>"
  "66bbad249fa0f948a526984f828621aa":
    "id": "66bbad249fa0f948a526984f828621aa"
    "title": "IAM Roles Anywhere now supports aliases to simplify workload configuration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-roles-anywhere-alias/"
    "published": "2026-11-20 04:23:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/roles-anywhere\">AWS Identity and Access Management (IAM) Roles Anywhere</a> now supports aliases, which are readable names that you assign to trust anchors, profiles, and certificate revocation lists (CRLs). Your workloads can request temporary credentials using a trust anchor or profile alias Amazon Resource Name (ARN) instead of an ARN with a system-generated ID, and you can use alias ARNs in many of the operations that manage these resources. Aliases make configurations easier to read and review: an alias ARN that ends in alias/trust-anchor/production-ca can show which certificate authority (CA) a workload uses.</p> \n<p>Previously, workload configurations, such as credential helper settings in machine images and configuration management templates, referenced trust anchors and profiles by ARNs that contain system-generated IDs, which differ in every account and Region. With this launch, you can assign the same alias in each account and Region, so one configuration template works across them with only the account and Region values changed. To set an alias, specify an alias name when you create, import, or update a resource using the IAM Roles Anywhere console, AWS SDKs, or AWS CLI.</p> \n<p>This feature is available at no additional cost in all commercial AWS Regions, the AWS GovCloud (US) Regions, the China Regions, and the AWS European Sovereign Cloud (Germany) Region. To learn more, see <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/resource-aliases.html\">Using aliases for trust anchors, profiles, and CRLs</a> in the IAM Roles Anywhere User Guide.</p>"
  "df3adad12fa47c36677410938c4bfebe":
    "id": "df3adad12fa47c36677410938c4bfebe"
    "title": "AWS RTB Fabric Modules are now generally available through AWS Marketplace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-rtb-fabric-modules-marketplace/"
    "published": "2026-11-20 00:00:00"
    "fetched": "2026-11-21 08:38:17"
    "summary": "<p>AWS RTB Fabric Modules from AdTech partners including Pixalate, WURFL by ScientiaMobile, and Picnic are now available through AWS Marketplace. With AWS RTB Fabric Modules, any demand-side platform (DSP), supply-side platform (SSP), and publisher on RTB Fabric can discover, configure, and deploy partner modules for use cases such as brand safety, fraud detection, device detection, and inventory quality directly in their real-time bidding workloads. Modules run inline at single-digit millisecond performance, with no custom integration, and partner charges appear on your single AWS bill.</p> \n<p>To optimize advertising revenue, AdTech companies rely on&nbsp;partner signals to increase bid rates. Previously, each new partner required a custom integration that could take weeks to months, its own contract and procurement cycle, and added latency to the bid path. Now, DSPs, SSPs, and publishers can find modules in AWS Marketplace and attach them to RTB Fabric in minutes. Modules filter, enrich, or observe bid requests before they reach the bidder, to improve bid performance and effectiveness without needing to make any code changes. At launch, modules are available from AdTech partners including Pixalate for invalid traffic filtering (IVT) and screening, WURFL by ScientiaMobile for device detection and contextual signals, and Picnic for inventory quality.&nbsp;For third-party AdTech module providers, they can now more easily reach AWS RTB Fabric customers from a single AWS Marketplace listing.</p> \n<p>AWS RTB Fabric helps optimize real-time bidding for supply, demand, and third-party vendors. Supply and demand partners such as Amazon Ads, Azerion, Bigabid, GumGum, Kargo, MobileFuse, TripleLift, UNICORN, Viant, Yieldmo, and more run bidding traffic over a private, high-performance network with single-digit millisecond latency and up to 80% lower networking costs than standard cloud networking, with no upfront commitments. Third-party vendors such as Pixalate, WURFL by ScientiaMobile, and Picnic now deliver their signals directly in the hot path through AWS RTB Fabric Modules. AWS RTB Fabric is generally available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (Ireland). See the&nbsp;AWS RTB Fabric <a href=\"https://aws.amazon.com/rtb-fabric/features/modules\" target=\"_blank\">Product Page</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/rtb-fabric/latest/userguide/discovering-attaching-modules.html\" rel=\"noopener noreferrer\" target=\"_blank\">User Guide</a>&nbsp;to learn more.</p>"
  "bf6314725dd07cf6bb29b052c4f47fcd":
    "id": "bf6314725dd07cf6bb29b052c4f47fcd"
    "title": "AWS CloudFormation increases the default stacks per account quota to 300,000"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudformation-stacks-per-account-quota/"
    "published": "2026-11-20 21:35:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>AWS CloudFormation now supports up to 300,000 stacks in each AWS account and Region by default (previously 2,000), which enables you to add stacks as your workloads grow without requesting a quota increase. CloudFormation manages related AWS resources as a stack that you create, update, and delete as one unit. Teams that deploy a separate stack for each customer, environment, or developer can now scale those patterns within a single account.</p> \n<p>A higher default quota allows you to keep growing workloads in the accounts where they already run. Previously, accounts that needed more than 2,000 stacks in a Region requested a quota increase through Service Quotas. Now, the default quota covers these workloads without a request. For example, a software provider that deploys one stack for each customer can grow from 2,000 to 300,000 customer stacks in one account and Region. Existing stacks work without changes.</p> \n<p>The higher quota applies to stacks you create in the CloudFormation console or with the AWS CLI, AWS SDKs, AWS CDK, or AWS SAM. To view your stacks per account quota, open the Service Quotas console. For more information, see <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-limits.html\" rel=\"noopener noreferrer\" target=\"_blank\">CloudFormation quotas</a> in the AWS CloudFormation User Guide. The increased quota is available at no additional charge in all AWS Regions where AWS CloudFormation is supported. For Region availability, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p>"
  "f918fff8b83b05acef41bb7f12a8d8c4":
    "id": "f918fff8b83b05acef41bb7f12a8d8c4"
    "title": "Amazon Route 53 now supports Availability Zone (AZ) affinity routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-affinity-routing/"
    "published": "2026-11-20 17:21:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Amazon Route 53 now supports Availability Zone (AZ) affinity routing, which routes DNS queries from your VPCs to resources in the same AZ as the client that sends the query. This helps you keep traffic within the same AZ as the client, reducing latency and improving application performance.</p> \n<p>Until now, customers who wanted lower latency used other routing policies, such as latency-based or geoproximity routing. With this launch, DNS queries from your clients are answered with resources in the same AZ. This keeps traffic within the AZ and gives your clients faster responses. If there's no record for the client's AZ, Route 53 falls back to a record for a less specific location: the Zone Group, then the AWS Region, and then Global, in the same order.</p> \n<p>To get started, create AZ-affinity records and choose a location type for each: Availability Zone, Zone Group, Region, or Global. For Availability Zone records, specify the AZ ID, such as use1-az1. You can associate a health check with any AZ-affinity record, whether it's for an AZ, a Zone Group, or a Region. If the endpoint is unhealthy, Route 53 answers with the record for the next location. You can use AZ-affinity routing for records in both public and private hosted zones. The Global record answers queries that don't come from your VPCs, such as queries from the internet. You can create AZ-affinity records with the Route 53 console, API, AWS CLI, AWS SDKs, and AWS CloudFormation.</p> \n<p>AZ-affinity routing is available in all AWS commercial Regions where Route 53 public and private hosted zones are available. To learn more, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-azaffinity.html\">AZ-affinity routing</a> topic in the Route 53 Developer Guide. For pricing, see the <a href=\"https://aws.amazon.com/route53/pricing/\">Route 53 pricing page</a>.</p>"
  "7bcd178381eca192771820dea84a1563":
    "id": "7bcd178381eca192771820dea84a1563"
    "title": "Amazon VPC IPAM policies now support automated internet firewall and AWS Lambda Web Functions and MicroVMs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/vpc-ipam-policies-firewall-lambda/"
    "published": "2026-11-20 17:06:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Amazon Virtual Private Cloud (VPC) IP Address Manager (IPAM) policies now support AWS Network Firewall automated internet firewall and AWS Lambda Web Functions and MicroVMs. You can centrally configure IPAM policies across AWS accounts and AWS Regions to allocate public IPv4 addresses to these resources from specific IPAM pools, such as Bring Your Own IP (BYOIP) addresses or Amazon-provided contiguous IPv4 blocks. This enables a stronger security posture, simplifies network and security operations, and can reduce public IPv4 costs when you use BYOIP.</p> \n<p>Many customers allowlist the public IPs of their AWS resources in network access control lists (ACLs) and firewalls. Previously, keeping these resources on allowlisted addresses depended on each application team. With this launch, you can define allocation rules for them alongside existing resource types, so security teams can add IP-based filters with confidence that these resources draw addresses from approved ranges. For Lambda Web Functions and MicroVMs, this covers the public IPv4 addresses used for outbound traffic through Lambda Network Connectors. If a pool runs out of addresses, resources fall back to Amazon-provided addresses. You can also share allocated ranges with partners through IPAM integration with AWS prefix lists.</p> \n<p>The feature is available in all AWS commercial Regions, in both the Free Tier and Advanced Tier of VPC IPAM. To learn more, see the <a href=\"https://docs.aws.amazon.com/vpc/latest/ipam/define-public-ipv4-allocation-strategy-with-ipam-policies.html\">IPAM policies documentation page</a> and the <a href=\"https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html\">IPAM documentation</a>. For pricing details, see the IPAM tab on the <a href=\"https://aws.amazon.com/vpc/pricing/\">Amazon VPC Pricing page</a></p>"
  "e6d5ee56d7dae7304d1b7fa73ed9e787":
    "id": "e6d5ee56d7dae7304d1b7fa73ed9e787"
    "title": "Announcing a new skill for AI agents in Amazon Textract Core"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-textract-core-skill-ai-agents/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Amazon Textract Core now lets AI agents extract text, tables, forms, and other data from documents through a skill, with no server to run or infrastructure to deploy. The skill guides an agent to the right Amazon Textract Core API for each document and includes a tested parser that converts the output into reading-order text and structured fields, such as answers to questions, receipt and invoice details, and identity document fields. Previously, teams that connected an agent to Amazon Textract had to build and maintain their own integration.</p>\n<p>You ask in natural language, and the agent returns the answers you need. The skill processes multi-page PDFs and returns every page in reading order. It uses confidence scores to accept high-confidence results and flags the rest, so you can route them to your own review process. For example, you can ask an agent to turn a patient's intake form into structured data and flag unclear fields for staff review.</p>\n<p>The skill is available at no additional charge, and standard <a href=\"https://aws.amazon.com/textract/pricing/\" target=\"_blank\">Amazon Textract pricing applies</a>. It is available in all commercial AWS Regions where Amazon Textract is available, including: US East (Ohio), US East (N. Virginia), US West (N. California), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Spain), and Europe (Zurich). If you use the AWS MCP server with the aws-core plugin, your agent can load the skill automatically. The skill is also published in the AWS Agent Toolkit, so agents including Kiro, Claude Code, and Cursor can use it. To learn more, see the AWS <a href=\"https://github.com/aws/agent-toolkit-for-aws\" target=\"_blank\">Agent Toolkit on GitHub</a>.</p>"
  "f53098e77f75c95b9e054b902505a9bd":
    "id": "f53098e77f75c95b9e054b902505a9bd"
    "title": "AWS Backup now supports incremental backups for Amazon DynamoDB"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-backup-incremental-backups-dynamodb/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>AWS Backup now supports incremental backups of Amazon DynamoDB tables, enabling you to reduce backup storage while maintaining backup schedules as frequent as one hour.</p> \n<p>Until now, AWS Backup created a full copy of your DynamoDB tables. With this launch, after an initial full backup, each incremental backup now captures only the data that changed, and AWS Backup takes a new full backup every 15 days. This lets you store less data and back up more often. You can restore from any recovery point in the chain, and you can schedule incremental backups anywhere from hourly to weekly frequencies. You can store incremental backups in both AWS Backup vaults and logically air-gapped vaults. Cross-Region backup copies are also incremental, further increasing your savings.</p> \n<p>AWS Backup turns on incremental backups automatically for new customers who protect DynamoDB. If you already back up DynamoDB with AWS Backup, you can turn on incremental backups under advanced features in AWS Backup settings, which lets you manage your backup preferences at the account and region level. You can create and manage incremental backups from the AWS Backup console, the AWS CLI, or the API.</p> \n<p>Incremental backups for DynamoDB are available in all AWS Regions where AWS Backup protects DynamoDB. To learn more, see <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/working-with-supported-services.html#working-with-ddb\" rel=\"noopener noreferrer\" target=\"_blank\">working with supported services</a> in the AWS Backup Developer Guide, read the <a href=\"https://aws.amazon.com/blogs/storage/reduce-amazon-dynamodb-backup-storage-costs-with-incremental-backups-in-aws-backup/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog</a>, and visit the <a href=\"https://aws.amazon.com/backup/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Backup product page</a>. To get started, open the AWS Backup console.</p>"
  "396134822f7145c43137cc0be884834f":
    "id": "396134822f7145c43137cc0be884834f"
    "title": "Amazon Route 53 private hosted zones now support public DNS fallback"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-public-dns-fallback/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Amazon Route 53 private hosted zones now support public DNS fallback. When a query for a name in your private hosted zone's domain doesn't match a record in the zone, Route 53 returns the answer from public DNS instead of a \"name not found\" (NXDOMAIN) error. Public DNS fallback is part of the <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-offers-advanced-hosted-zones/\">Advanced Hosted Zones</a> offering.</p>\n<p>Until now, Route 53 treated an associated private hosted zone as fully authoritative for its domain, so queries for names that weren't in the zone returned NXDOMAIN. To resolve a few names privately, customers also had to copy every other record from their public zone into the private hosted zone and keep the two in sync. With public DNS fallback, you add only the names you need privately, and every other name resolves from your existing public DNS. For example, your private hosted zone for example.com points example.com to a private endpoint, while partner.example.com exists only in public DNS. Before, a lookup for partner.example.com returned NXDOMAIN. Now it resolves from public DNS.</p>\n<p>To get started, create a private Advanced Hosted Zone or upgrade an existing private hosted zone, and then turn on public DNS fallback. You can use the Route 53 console, API, AWS CLI, AWS SDKs, or AWS CloudFormation.</p>\n<p>Public DNS fallback is available in all AWS commercial Regions where Route 53 private hosted zones are available. To learn more, see <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-public-dns-fallback.html\" target=\"_blank\">Enabling public DNS fallback for a private hosted zone</a> in the Route 53 Developer Guide and the <a href=\"https://aws.amazon.com/route53/pricing/\">Route 53 pricing page</a>.</p>"
  "972b741ec184709f070344ab78716570":
    "id": "972b741ec184709f070344ab78716570"
    "title": "Amazon Route 53 now offers Advanced Hosted Zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-offers-advanced-hosted-zones/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Amazon Route 53 now offers Advanced Hosted Zones, a new hosted zone tier with additional guardrails, visibility, and resilience features. Advanced Hosted Zones include Change Guardrails that prevent accidental record deletions, record-level Change History, and public DNS fallback in private hosted zones.</p>\n<p>A single mistaken DNS change can take part of your domain offline, such as deleting a record that is still serving traffic or removing a delegation that resolvers are still using. To protect against this, customers build their own validation pipelines, review processes, and audit tooling. With Change Guardrails turned on, Route 53 checks each change before applying it. It blocks deleting a record that is still receiving DNS queries, a record that an alias record in the same hosted zone points to, or a delegation that is still in use. When a guardrail blocks a change, Route 53 rejects the whole request with an error that explains why, and no records change. Guardrails apply to every change, including changes from infrastructure as code tools. Change History gives you a record-level history of changes to your hosted zone, retained for 365 days, so you can see what changed and when.</p>\n<p>To get started, create a new Advanced Hosted Zone or upgrade an existing hosted zone, then turn on the guardrails you want. You can use the Route 53 console, API, AWS CLI, AWS SDKs, or AWS CloudFormation. Advanced Hosted Zones are priced separately from Standard Hosted Zones. For rates, see the <a href=\"https://aws.amazon.com/route53/pricing/\">Route 53 pricing page</a>.</p>\n<p>Advanced Hosted Zones are available in all AWS commercial Regions where Route 53 public and private hosted zones are available. To learn more, see <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-tiers.html\" target=\"_blank\">Advanced Hosted Zones</a> in the Route 53 Developer Guide.</p>"
  "2bfe02aaa34d228f53043c2f336fa063":
    "id": "2bfe02aaa34d228f53043c2f336fa063"
    "title": "Announcing Test Insights for AWS Device Farm"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/device-farm-test-insights/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p><a href=\"https://aws.amazon.com/device-farm/\">AWS Device Farm</a>, a service for testing mobile and web apps, now provides Test Insights for Appium, Espresso, and XCUITest runs across multiple devices. Test Insights helps you and AI agents understand the health of your tests and resolve failures faster by providing a detailed breakdown of your test suite by device and by test.</p>\n<p>With Test Insights, Device Farm's existing APIs now return enhanced test metadata, failure root cause with stack trace, a video for each test, start and stop times, median and average times spent on each device and test, and test counts by result. With this data in one place, your agents spend less time and fewer tokens looking for the root cause of test failures, and the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/web-and-mobile-development/troubleshooting-aws-device-farm-runs\" target=\"_blank\">AWS Device Farm troubleshooting skill</a> uses it to help diagnose failed runs and suggest fixes. Test Insights is available alongside any default and custom test reports you generate, at no additional cost.</p>\n<p>Test Insights is included in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Device Farm is available.</p>\n<p>To get started, see <a href=\"https://docs.aws.amazon.com/devicefarm/latest/developerguide/reports.html#reports-test-insights\" target=\"_blank\">Test Insights</a> in the AWS Device Farm Developer Guide.</p>"
  "f58adfc14f0f35f0d344dca36518bf28":
    "id": "f58adfc14f0f35f0d344dca36518bf28"
    "title": "Amazon SageMaker adds new capabilities – improved blueprints and catalog experience, simplified data quality monitoring, and support for DuckDB 2.0 and DuckDB extensions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-sagemaker-adds-new-capabilities/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p><b>Improved blueprints:</b> Amazon SageMaker Unified Studio now gives project teams more ownership of their data and resources, within governance policies that administrators set centrally. Additional releases include faster notebook queries through DuckDB 2.0 support and data quality monitoring at catalog scale.</p>\n<p><b>Improved data quality monitoring:</b> Teams can also profile entire catalogs and databases to keep data statistics current. Project members can get email notifications for all supported notification types, including data quality and data profiling runs.</p>\n<p><b>Improved catalog experience:</b> Administrators can now manage metadata forms, business glossaries, and custom asset types in one place, with a consistent experience across all domain types. They can also transfer asset ownership to the project that knows the data best. Members of that project can then curate those assets and approve or reject subscription requests themselves. With resource blueprints, administrators can allow projects to deploy approved resources, such as Amazon EMR Serverless applications. Teams can then provision what they need without waiting for an administrator.</p>\n<p><b>Support for DuckDB 2.0 and extensions:</b> SageMaker notebooks now support DuckDB 2.0 and DuckDB extensions. Data engineers, analysts, and data scientists get faster queries over Amazon S3 data, plus access to more file formats, data source connectors, and functions such as excel, geospatial and full-text search.</p>\n<p>These capabilities are available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\" target=\"_blank\">AWS Regions</a> where SageMaker Unified Studio is supported. To learn more, visit <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/catalog-manage.html\" target=\"_blank\">Manage the catalog</a>, <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/catalog-iam-based-domains.html\" target=\"_blank\">Working with data and catalog in IAM-based domains</a>, <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/resource-blueprints.html\" target=\"_blank\">Deploy on-demand blueprints</a>, and <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\" target=\"_blank\">Notebooks</a>.</p>"
  "30428dfb332f00a9a8e53291811ae679":
    "id": "30428dfb332f00a9a8e53291811ae679"
    "title": "Amazon FSx for NetApp ONTAP launches a new generation of file systems with up to 3.6x higher performance"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-fsx-for-netapp-ontap-third-generation/"
    "published": "2026-11-20 14:00:00"
    "fetched": "2026-11-21 14:27:21"
    "summary": "<p>Today, we're announcing third-generation Amazon FSx for NetApp ONTAP file systems, which deliver up to 216 GB/s of throughput and 8.6 million SSD IOPS per file system, up to 3x more throughput and up to 3.6x more SSD IOPS than previous-generation file systems. Built on the latest AWS compute and storage technologies, third-generation file systems give you even more flexibility to scale performance as your workloads and usage patterns evolve.</p> \n<p>FSx for ONTAP is the first and only storage service that allows you to launch and run fully managed, fully featured ONTAP file systems in the cloud. FSx for ONTAP file systems are powered by up to 12 highly available (HA) pairs of file servers to deliver storage and performance scalability.&nbsp;With previous-generation file systems, each HA pair delivers up to 6 GB/s of throughput and 200,000 SSD IOPS. With third-generation file systems, each HA pair delivers up to 18 GB/s of throughput and 720,000 SSD IOPS, giving you even more flexibility to scale your most demanding ONTAP workloads, such as chip design and verification, media rendering and video editing, and mission-critical databases.</p> \n<p>FSx for ONTAP third-generation file systems are available today in the following AWS Regions: US East (N. Virginia, Ohio) and US West (Oregon). To learn more, visit the <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\">Amazon FSx for NetApp ONTAP product page</a> and <a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html\">user guide</a>.</p>"
  "76349ea46e7001bc6cb49d44503d9b67":
    "id": "76349ea46e7001bc6cb49d44503d9b67"
    "title": "AWS CDK Blocks reaches general availability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-cdk-blocks-ga/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS Cloud Development Kit (AWS CDK) Blocks, known as AWS Blocks in preview, is now generally available. It is an expansion of the CDK that simplifies building production-grade applications on AWS, by providing production-ready building blocks for common app features, such as data storage and processing, background jobs, and building AI agents.</p> \n<p>CDK Blocks build upon CDK constructs. CDK constructs are reusable pieces of code that define AWS infrastructure, such as a database or a storage bucket. CDK Blocks packages a CDK construct along with the connecting code applications need to use that infrastructure, incorporating AWS service-specific best practices, such as safe retries, dead-letter routing and partial-batch failures, and a local testing setup, reducing the code and configuration you need to write and maintain. It also enables you to compose and share your own custom components that incorporate your organization's requirements, helping teams build production ready applications faster.</p> \n<p>CDK Blocks is available to use in all regions.</p> \n<p>CDK Blocks has no additional service fee, and you pay only for AWS resources when you deploy to AWS. Its source code is published under the Apache License 2.0. To get started, see the <a href=\"https://docs.aws.amazon.com/cdk/blocks/devguide/what-is-blocks.html\">CDK Blocks documentation</a>, or view the source in the <a href=\"https://github.com/aws/cdk-blocks\">CDK Blocks GitHub repository</a>.</p>"
  "61070fddf9429b27a8ab39460d76c1ad":
    "id": "61070fddf9429b27a8ab39460d76c1ad"
    "title": "AWS Parallel Computing Service now supports managed instance health checks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-pcs-instance-health-checks/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS Parallel Computing Service (AWS PCS) now supports instance health checks, which can find hardware faults and software problems on accelerated instances beyond what Amazon EC2 detects today. For example, a fault such as an uncorrectable GPU memory error can stop or slow every job on a compute node. Instead of losing the next job to the same bad GPU, AWS PCS can take the compute node out of scheduling and replace its instance with a new one.</p>\n<p>You can turn on instance health checks for a compute node group in the AWS PCS console, AWS CLI, or AWS SDKs. Health monitoring watches NVIDIA GPUs, AWS Neuron devices, and Elastic Fabric Adapter (EFA) devices continuously, including while jobs run. Optional deep health checks run NVIDIA Data Center GPU Manager (DCGM) diagnostics each time an instance starts, from the GPU software stack to stress tests of the hardware, so a faulty GPU can be caught before a job lands on it. You choose what AWS PCS does next: replace the instance, isolate the compute node for investigation, or only report the fault. You can see each result and repair action in Slurm, alongside the compute node's other status information.</p>\n<p>AWS PCS is a managed service that simplifies running and scaling high performance computing (HPC) workloads on AWS using Slurm. You can build complete, elastic environments that integrate compute, storage, networking, and visualization tools, and the service manages cluster updates and provides built-in observability.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/cng-instance-health-checks.html\" target=\"_blank\">Detecting and repairing hardware faults with instance health checks</a> in the AWS PCS User Guide. Instance health checks require Slurm 26.05 or later and an AMI with AWS PCS agent 1.6.0-1 or later, and are available in all AWS Regions where AWS PCS is available.</p>"
  "e6b07c7a0f3961530cb2c0c24a579f7c":
    "id": "e6b07c7a0f3961530cb2c0c24a579f7c"
    "title": "AWS DevOps Agent adds agent sandboxes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-devops-agent-adds-agent-sandboxes/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS DevOps Agent now gives you more ways to make your agents smarter. Sandboxes give you the ability to write skills that include scripts your agent can run, and a way for agents themselves to write and run scripts that make them more efficient.</p> \n<p>Most teams already have the scripts that answer their hardest questions. Without a sandbox, the best you can do is describe those scripts in a skill and hope the agent rebuilds them correctly. With a sandbox, you put the script in the skill. The agent runs your team's own diagnostic script in its sandbox and spends its reasoning on what the numbers mean.</p> \n<p>With this launch AWS DevOps Agent can also write and execute its own scripts. For example, with a sandbox the agent can write a script that runs four log queries in parallel, one for each step of a request flow, join them, time every step, and replay the same analysis across earlier request flows. Without sandboxes agents rely on tool calls to APIs to perform log and metric analysis which can be cumbersome and slow. With sandboxes and the ability to write and execute scripts they can perform this kind of analysis much more efficiently.</p> \n<p>See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\">release history</a> page. For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">supported Regions table</a>.</p>"
  "2ceeba2656faad023dc3c962a785ba0f":
    "id": "2ceeba2656faad023dc3c962a785ba0f"
    "title": "AWS Elemental MediaLive can now create embedded captions from AI-generated subtitles and more caption sources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/medialive-embedded-captions/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS Elemental MediaLive can now create CEA-608/708 embedded captions from additional caption sources, including AI-generated subtitles from AWS Elemental Inference Smart Subtitles. This means channels can deliver broadcast-standard embedded captions even when the source has no captions at all.</p>\n<p>The new embedded caption encoder creates CEA-608/708 output captions from Teletext, WebVTT and other input formats. The captions are encoded as part of the live channel and delivered in HLS, TS and other outputs, with no external caption encoder or pre-processing step. MediaLive can also accept WebVTT captions directly from HLS sources and deliver CEA-608/708 out. This makes it easier to bring OTT and web-originated content into your live channels without converting captions first.</p>\n<p>Together, these capabilities enable a MediaLive channel to ingest captions in the most widely used formats and output CEA-608/708, WebVTT, TTML or burn-in captions for each destination. This means fewer moving parts in your caption chain, fewer points of failure during live events and an easier path to accessibility compliance across outputs.</p>\n<p>These features are available at no additional cost for MediaLive in all AWS Regions where MediaLive is available. When <a href=\"https://docs.aws.amazon.com/medialive/latest/ug/elemental-inference-automatic-subtitling.html\" target=\"_blank\">AWS Elemental Inference smart subtitles</a> is enabled as an input source, usage is billed separately at standard <a href=\"https://aws.amazon.com/elemental-inference/pricing/\">AWS Elemental Inference pricing</a> and available in the following regions: US East (N. Virginia), US West (Oregon), Europe (Ireland), Asia Pacific (Mumbai), and Asia Pacific (Sydney).</p>\n<p>To get started, visit the <a href=\"https://docs.aws.amazon.com/medialive/latest/ug/captions-embedded-encoder.html\" target=\"_blank\">caption encoder guide</a> or the <a href=\"https://aws.amazon.com/medialive/\">AWS Elemental MediaLive</a> documentation.</p>"
  "bcb0d9d7cec708b30ee65f87a03185fe":
    "id": "bcb0d9d7cec708b30ee65f87a03185fe"
    "title": "AWS DevOps Agent adds quality improvement dashboards and tools"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-devops-agent-quality-dashboards/"
    "published": "2026-11-20 17:00:00"
    "fetched": "2026-11-24 08:19:09"
    "summary": "<p>AWS DevOps Agent now gives you dashboards and tools to enable you to understand and improve the quality of your AWS DevOps Agent instances in your environments.</p> \n<p>With this launch AWS DevOps Agent now helps you measure the quality of its work. New quality and latency dashboards track the results. For investigations, you see how often AWS DevOps Agent finds the root cause, how long it takes, and where it lacked context. For mitigations, you see the time to the first plan and how your operators rated each plan. Trend views show whether quality improves over time. A new grader agent rates each investigation. Its dashboard compares those ratings with your operators' ratings, so you can focus on the cases where they disagree. Both grader agent and human ratings become memories that improve the quality of future task runs.</p> \n<p>Once you understand the quality and performance of your instance of AWS DevOps Agent, you can improve it by configuring or modifying its skills, memories, and tools. To ensure that changes improve your instance, AWS DevOps Agent now provides a replay capability that lets you test changes before you rely on them. You can replay a past investigation to see whether a change to a skill, memory, or instruction makes AWS DevOps better. Start a replay from any past investigation, and note what you changed. The replay uses your current configuration on live data, without changing anything. When it finishes, compare it side by side with the original: grader score, duration, root cause, and the tools and skills each run used. If the comparison shows a gap, adjust your change and replay again.</p> \n<p>See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\" rel=\"noopener noreferrer\" target=\"_blank\">release history</a> page. For the list of AWS Regions where AWS DevOps Agent is available, see the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\" rel=\"noopener noreferrer\" target=\"_blank\">supported Regions table</a>.</p>"
"last_updated": "2026-11-24 08:19:09 JST"
