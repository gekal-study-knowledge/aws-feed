  "93a0c63f1f434d843a4e702128998448":
    "id": "93a0c63f1f434d843a4e702128998448"
    "title": "Monitor the efficiency and availability of accelerated computing instances with Amazon EC2 Detailed Monitoring and performance status checks"
    "link": "https://aws.amazon.com/blogs/compute/monitor-the-efficiency-and-availability-of-accelerated-computing-instances-with-amazon-ec2-detailed-monitoring-and-performance-status-checks/"
    "published": "2026-11-20 03:34:57"
    "fetched": "2026-11-20 03:48:48"
    "summary": "Amazon EC2 now reports one-minute per-GPU metrics through Detailed Monitoring and surfaces recoverable hardware conditions with a new performance status check, giving infrastructure teams agentless visibility into accelerated computing efficiency and availability across their fleet."
  "db6926bd61c88dd4d195b9b8360bb24d":
    "id": "db6926bd61c88dd4d195b9b8360bb24d"
    "title": "Handling large volume of transactions with AWS Lambda Managed Instances"
    "link": "https://aws.amazon.com/blogs/compute/handling-large-volume-of-transactions-with-aws-lambda-managed-instances/"
    "published": "2026-11-20 06:20:28"
    "fetched": "2026-11-20 10:00:09"
    "summary": "AWS Lambda Managed Instances keeps compute capacity warm before a predictable traffic burst and scales it back down afterward. This post walks through a concert-ticketing reference implementation that sustains 40,000 transactions per second for 120 seconds, with a deployable sample you can run, test, and clean up."
  "b8c0277a66dea4f0a0c1bc59953e7165":
    "id": "b8c0277a66dea4f0a0c1bc59953e7165"
    "title": "Announcing 30-minute timeout for on-demand AWS Lambda Event Functions"
    "link": "https://aws.amazon.com/blogs/compute/announcing-30-minute-timeout-for-on-demand-aws-lambda-event-functions/"
    "published": "2026-11-20 04:28:52"
    "fetched": "2026-11-20 10:00:09"
    "summary": "AWS Lambda now supports a 30-minute function timeout for on-demand Event Functions and for synchronous invocations on Lambda Managed Instances, doubling the previous 15-minute limit. You can run AI inference, media transcoding, and other long-running jobs without re-architecting your applications."
  "08b98ecc33afc345af3d24f0f6b7e247":
    "id": "08b98ecc33afc345af3d24f0f6b7e247"
    "title": "AWS Lambda Durable Functions observability with OpenTelemetry"
    "link": "https://aws.amazon.com/blogs/compute/aws-lambda-durable-functions-observability-with-opentelemetry/"
    "published": "2026-11-20 04:09:43"
    "fetched": "2026-11-20 10:00:09"
    "summary": "A single AWS Lambda Durable Functions workflow can span many invocations, fragmenting its traces. This post shows how the OpenTelemetry plugin for the AWS Durable Execution SDK generates deterministic trace IDs that unify every invocation into one distributed trace, and how to set it up, read the traces, and apply best practices."
"last_updated": "2026-11-20 10:00:09 JST"
