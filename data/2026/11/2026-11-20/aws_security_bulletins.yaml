    "title": "PHP Foundation Security Releases – November 19, 2026"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-190-aws/"
    "published": "2026-11-20 03:30:09"
    "fetched": "2026-11-20 03:48:47"
    "summary": "<p><b>Bulletin ID:</b> 2026-190-AWS<br /> <b>Publication Date:</b> 11/19/2026 10:00 AM PST</p> \n<p><b>Description:</b></p> \n<p>AWS is aware of security releases that the PHP Foundation published on November 19, 2026. PHP versions 8.2.36, 8.3.37, 8.4.28, and 8.5.13 address 17 issues across the PHP 8.2, 8.3, 8.4, and 8.5 branches. The issues are in the following components:<br /> - The PHP engine<br /> - PHP-FPM and the PHP CGI binary<br /> - The SOAP, Phar, session, DOM, and date extensions<br /> - The HTTP and FTP stream wrappers<br /> - The PHP 8.5 RFC 3986 URI implementation</p> \n<p><b>Patching the affected software remains the only complete fix and should be the first priority.</b> We will update this bulletin as more information becomes available.</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-190-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "6e8b52e5dd6fa6903d54040f38a19b50":
    "id": "6e8b52e5dd6fa6903d54040f38a19b50"
    "title": "CVE-2026-132607 - GCM authentication tag length downgrade in Amazon S3 Encryption Client for PHP"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-191-aws/"
    "published": "2026-11-20 06:46:07"
    "fetched": "2026-11-20 10:00:07"
    "summary": "<p><b>Bulletin ID:</b> 2026-191-AWS<br /> <b>Publication Date:</b> 11/19/2026 13:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-132607, an issue in the decryption component of Amazon S3 Encryption Client for PHP in the AWS SDK for PHP. The client did not verify the length of the AES-GCM authentication tag recorded in an object's metadata. A user with read and write access to an encrypted object, who knows or can guess its plaintext, might craft a ciphertext that decrypts to plaintext of their choice of the same length. This requires repeated writes to the object. The issue does not disclose the plaintext or the encryption key.</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-191-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "a39281301fa7667647370e4d7bac0d64":
    "id": "a39281301fa7667647370e4d7bac0d64"
    "title": "Issue with nginx HTTP/2 Implementation"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-192-aws/"
    "published": "2026-11-20 07:48:05"
    "fetched": "2026-11-20 10:00:07"
    "summary": "<p><b>Bulletin ID:</b> 2026-192-AWS<br /> <b>Publication Date:</b> 11/19/2026 15:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>AWS is aware of the nginx issues published on November 18, 2026 (CVE-2026-123007, CVE-2026-123633, CVE-2026-123634, CVE-2026-113425, CVE-2026-121810 and CVE-2026-118899). These issues have been addressed in nginx version 1.30.7 (stable) and 1.31.9 (mainline). We recommend upgrading to the latest version. We are actively deploying mitigations worldwide to address these issues.</p> \n<p>Because these issues can be leveraged at the HTTP/2 protocol layer before a complete HTTP request is formed, AWS WAF managed and custom rules cannot effectively detect or block them.</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-192-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "877c4ddc99de21c51adfbfa73e480ddd":
    "id": "877c4ddc99de21c51adfbfa73e480ddd"
    "title": "CVE-2026-132825 and related issues – Ruby regular expression engine and string case conversion"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-193-aws/"
    "published": "2026-11-20 08:06:34"
    "fetched": "2026-11-20 10:00:07"
    "summary": "<p><b>Bulletin ID:</b> 2026-193-AWS<br /> <b>Publication Date:</b> 11/19/2026 15:05 PM PST</p> \n<p><b>Description:</b></p> \n<p>On November 18, 2026, the Ruby maintainers published fixes for seven issues in CRuby's regular expression engine and string case conversion, including CVE-2026-132825. These issues affect Ruby versions before 4.0.10, 3.4.13, and 3.3.14 and could allow remote code execution in some configurations.</p> \n<p>These issues are memory-safety issues in Ruby's regular expression engine and in string case conversion on certain non-UTF-8 encodings. When an application processes third party-controlled input through these code paths, a remote, unauthenticated actor might be able to crash the process, read memory, or run arbitrary code. Applications built on Rack, including Rails and Sinatra, might be reachable through default request handling.</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-193-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
