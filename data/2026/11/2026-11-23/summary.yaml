"overview": |
  この日は 2 ソースから 13 本 (AWS WAF の API 自動検出・保護の発表は What's New に 2 本重複) で、マルチクラウド運用、セキュリティ、ML インフラの使い勝手の改善が中心でした。AWS Systems Manager Automation は、Microsoft Azure・Google Cloud・AWS のリソースにまたがる運用タスクを自動化するカスタムのランブックを作れるようになり、段階的なロールアウト、承認待ち、エラーがしきい値を超えたときの停止も使えます。セキュリティでは、API Gateway・ALB・CloudFront の背後にある API を AWS Organization 全体で自動検出して AWS WAF で保護する機能が一般提供となり、新しい API Gateway API Portal がトラフィックログとサービスの設定記録から API を見つけます (エージェントの導入やログ転送は不要)。Amazon Inspector は ECR と EC2 の検出結果に実行時の到達可能性分析を広げ、アプリが実際に使っていないパッケージの脆弱性と区別できるようになりました。ML では、SageMaker Studio から EKS オーケストレーションの SageMaker HyperPod クラスターに分散学習ジョブの投入・モデルのデプロイ・監視ができるようになり、HyperPod の EKS クラスター作成コンソールもガイド付きのワークフローに刷新され、EC2 Capacity Blocks for ML は複数のインスタンスタイプとリージョンを 1 回で検索できるようになりました (P6-B300、P6-B200、Trn2 などを最大 6 か月予約)。そのほか、FSx for NetApp ONTAP のスナップショット・クローン・レプリケーションのコンソールと CloudFormation 対応、EC2 のインプレースデプロイ中に Auto Scaling のプロセスを一時停止できる CodeDeploy の機能、Amazon Connect Customer の AI エージェントによるステップバイステップガイドの入力、自分や AI エージェントがローカルの IDE や端末からリモートの Android 端末を使える Device Farm の Device Connect が発表されました。日本語ブログでは、CloudFormation のスタック 1 つで Amazon EVS に VMware Cloud Foundation 9 をデプロイするオープンソースツール EVS Deployment Orchestrator (EDO、solutions-for-amazon-evs リポジトリで公開) が紹介されています。 後から追加された分では、AWS Parallel Computing Service (PCS) が Split Cost Allocation Data に対応し、Cost and Usage Reports (CUR) で Slurm ジョブが共有の EC2 の CPU・GPU・メモリをどれだけ要求・消費したかに基づいてコストをチームやプロジェクトに配分できるようになりました。ジョブ・ユーザー・Slurm アカウント・キュー・コンピュートノードグループ・ノード・クラスター単位で集計でき、どのジョブにも割り当てられていないアイドルなコアやノードも把握できます (PCS が使える全商用リージョンで提供)。
