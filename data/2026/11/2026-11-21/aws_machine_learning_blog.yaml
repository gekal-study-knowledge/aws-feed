    "id": "14e3bcbbb94e7b448f67acf29738b9c5"
    "title": "Introducing managed cluster extensions for observability and user management in Amazon SageMaker HyperPod Slurm"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-managed-cluster-extensions-for-observability-and-user-management-in-amazon-sagemaker-hyperpod-slurm/"
    "published": "2026-11-21 08:07:03"
    "fetched": "2026-11-21 08:38:20"
    "summary": "Amazon SageMaker HyperPod now offers managed cluster extensions for observability and user management, bringing declarative, API- and console-driven configuration to the software running on Slurm cluster nodes. This post explains how the extensions work and follows a platform team through a quarter of running a shared Slurm cluster with them."
  "534a090db7a70304373d945ae54ebe6c":
    "id": "534a090db7a70304373d945ae54ebe6c"
    "title": "Introducing Amazon SageMaker HyperPod Global Inference Gateway: One endpoint across Regions and clusters"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-amazon-sagemaker-hyperpod-global-inference-gateway-one-endpoint-across-regions-and-clusters/"
    "published": "2026-11-21 07:35:24"
    "fetched": "2026-11-21 08:38:20"
    "summary": "Amazon SageMaker HyperPod introduces the Global Inference Gateway, one managed endpoint that routes inference requests across your HyperPod clusters in one Region or across Regions. It picks the best cluster, fails over automatically, and authenticates every request with SigV4 and IAM over AWS PrivateLink."
  "8c59c7ac386f3b88a32eeb2f60964423":
    "id": "8c59c7ac386f3b88a32eeb2f60964423"
    "title": "How Standard Bank Group automates AI risk assessment for generative AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-standard-bank-group-automates-ai-risk-assessment-for-generative-ai/"
    "published": "2026-11-21 05:37:31"
    "fetched": "2026-11-21 08:38:20"
    "summary": "Standard Bank Group automated the evidence behind its generative AI approval gates. Working with AWS Professional Services, the bank built an assessment in its own AWS account that scores each use case against international AI standards and its own policies using LLM-as-a-judge on Amazon Bedrock, giving risk committees consistent, traceable evidence."
  "dda12531be6fd492f7d68fee6e95f8d4":
    "id": "dda12531be6fd492f7d68fee6e95f8d4"
    "title": "Announcing Amazon Textract Insights: Verifiable generative AI for documents"
    "link": "https://aws.amazon.com/blogs/machine-learning/announcing-amazon-textract-insights-verifiable-generative-ai-for-documents/"
    "published": "2026-11-21 05:22:00"
    "fetched": "2026-11-21 08:38:20"
    "summary": "Announcing the general availability of Amazon Textract Insights, a new generative AI feature of Amazon Textract. Describe the fields you need in natural language, submit a document or a mixed packet, and receive structured results with a confidence score and page-level grounding for each value, with no model training required."
