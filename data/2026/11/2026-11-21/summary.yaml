"overview": |
  この日は 6 ソースから 73 本 (Network Firewall の自動インターネットファイアウォールのプレビューは What's New に 2 本重複) で、セキュリティ速報 2 件、Lambda の Node.js 26 対応をはじめとする大量のアップデート、CloudWatch の Kubernetes・マルチクラウド監視、Kiro の新機能、AI エージェントを使った攻撃の調査報告が中心でした。セキュリティ速報では、Bulletin 2026-194-AWS として CVE-2026-133199 が公開され、AWS ssosync の 2.9.5 より前のバージョンのユーザーとグループの照合ロジックに不適切な権限割り当ての問題があり、Google Workspace で再利用されたメールアドレスやグループ名を割り当てられた認証済みのリモートユーザーが、以前に同期された無関係な ID の IAM Identity Center のグループメンバーシップと権限セットの割り当てを引き継いでしまうおそれがあります。続いて 2026-195-AWS として CVE-2026-130901 が公開され、awslabs.document-loader-mcp-server の 1.0.10〜1.0.20 のファイルアクセスチェックにパス制限の不備があり、DOCUMENT_BASE_DIR が未設定か空で、CI・GITHUB_ACTIONS・PYTEST_CURRENT_TEST のいずれかの環境変数がある場合に、MCP クライアントが処理する細工された文書によって基準ディレクトリ外のファイルを読まれ、1.0.12〜1.0.20 では PNG のスライド画像を基準ディレクトリ外に書き込まれるおそれがあります (影響は 1.0.21 未満、1.0.10 より前はそもそも基準ディレクトリへの制限なし)。Amazon Threat Intelligence は、中国と関連のある脅威アクターがオープンソースの AI ペネトレーションテストフレームワーク Cairn に「シェルアクセスを取得する」という目標だけを与え、エージェントが人間の指示なしに医用画像 AI アプリケーションのゼロデイ脆弱性を見つけて悪用した事例を英語・日本語の両ブログで報告し、既存の一時認証情報の権限を絞り込む新しい AWS STS API の GetScopedCredentials も紹介されました。コンピュートとサーバーレスでは、Lambda が Node.js 26 (2029 年 4 月までサポート予定の LTS) を Web Functions と Event Functions で使えるようになり、Lambda MicroVMs が大阪・ソウル・カナダ (中部)・ロンドン・パリ・サンパウロなど 7 リージョンに拡大し、SQS FIFO のイベントソースマッピング (プロビジョンドモード) のバッチサイズが 10 件から 10,000 件に、Event Functions の状態変化イベントの EventBridge への発行、Trusted Advisor での Lambda Managed Instances への移行によるコスト最適化の推奨も加わりました。Graviton5 を搭載したバースト可能な EC2 T9g インスタンス (T4g 比で最大 45% の価格性能向上、nano〜medium の 4 サイズ) も一般提供となっています。ストレージ・データでは、S3 の汎用バケットの読み取りリクエストレートが 5,500 から 11,000 GET/HEAD 毎秒以上に倍増し、S3 Vectors のフィルター可能なメタデータが 2 KB から 40 KB に、DynamoDB のベクトル検索のインラインフィルターに範囲比較や論理演算子が加わり、Glue Data Catalog のカタログ・データベース単位のデータ品質監視、MSK の Standard ブローカーから Express ブローカーへのインプレースアップグレードと Apache Kafka 4.2 (Queues for Kafka が本番対応) のサポート、Aurora MySQL 8.4.12 の一般提供、RDS for Oracle の Primary Endpoint と Replica First Patching、Graviton4 で最大 30% 性能が上がった Neptune Serverless が発表されました。可観測性では、CloudWatch の PromQL のクエリ期間が 7 日から 30 日に延び、CloudWatch Query Studio で PromQL と SQL のメトリクスクエリを保存して再利用できるようになり、EKS Container Insights が Karpenter・KEDA・vLLM・KServe・Ray などのオープンソースツールを標準で監視し、CloudWatch Observability EKS アドオンが独自の OpenTelemetry・Prometheus テレメトリとテレメトリのフィルタリングに対応したほか、CloudWatch Omni が Azure のリソースログ・プラットフォームメトリクス・VNet フローログ・Application Insights のトレースを収集できるようになり、Managed Service for Prometheus はワークスペースあたり 20 億のアクティブ時系列と 30 万ルールに対応し AWS European Sovereign Cloud (ドイツ) でも提供開始されました。ネットワーク・統合では、全 VPC のインターネットゲートウェイに NAT 付きの Network Firewall を一元適用する自動インターネットファイアウォールのパブリックプレビュー、Cognito のマルチリージョンレプリケーションの対象リージョン拡大、EventBridge のカスタムイベントバスの Webhook Events と MSK ターゲット、EventBridge Scheduler の 81 サービス 589 件の API アクション追加、CloudFormation のサービスマネージド StackSets のカスタム実行ロール、ECS Action Logs の対象拡大が並びました。コスト管理では、Billing and Cost Management の Data Hub (プレビュー) と支払い状況を確認する API、Pricing Calculator の見積もり API (GetUsageLinesEstimatedCost)、新しい AWS エクスペリエンスの支出上限の SMS 通知が登場しています。AI・ML では、Textract Insights の一般提供、SageMaker HyperPod の Global Inference Gateway と Slurm 向けマネージドクラスター拡張、SageMaker JumpStart のモデルリーダーボード、Transcribe の同期 API (TranscribeAudio)、Bedrock の Web Search の対応言語拡大、ElastiCache による分散 KV キャッシュで自前ホストの LLM の推論コストを最大 40% 下げるエージェントスキル、AWS Quick のエンタープライズガードレール (プレビュー)・グループ単位の権限割り当てに加え、チャットで自動化を作成・実行・改善できる Flows の強化、デスクトップ版と同じエージェント・スキル・コネクタを使える Web 版の刷新 (ブラウザ拡張と Microsoft 365 アドインも更新)、エージェント・スキル・コネクタ・フローをタスクや役割ごとにまとめるプラグイン、日本語・ドイツ語・ベトナム語・中国語 (簡体字・繁体字) への対応、AWS Transform の .NET 11 対応と ASP.NET のサードパーティ UI コンポーネント移植の一般提供が発表されました。日本語ブログでは、Kiro for VS Code の一般提供 (macOS・Windows・Linux)、Kiro のクラウドセッションから管理者が設定した VPC 経由でプライベートネットワークにアクセスする機能、クラウドセッションや Dev Container、既存マシンでワークスペースを動かすリモートワークスペース、既存のソースコードから根拠付きで検証済みの AI エージェント向け仕様書を起こすワークフロー Reverse Spec Flow (Apache Roller での実績を紹介)、re:Invent 2026 (11 月 30 日〜12 月 4 日、ラスベガス) のセキュリティセッションの見どころが公開されました。そのほか、Bee の個人向け AI ウェアラブルにおける Zero Operator Access の実装、Standard Bank Group の生成 AI リスク評価の自動化、Amazon Connect Customer のケースの SLA 強化、Partner Central の Account Mapping and Planning・Demand Center (Marketing Central の後継)・リードグループ・サポートケース対応エージェントも紹介されています。後から追加された分では、証明書まわりの更新が目立ちました。ACM のパブリック証明書が WebPKI の要件に沿ってクライアント認証を含まなくなったことを受け、ACM がブラウザ以外の mTLS などの認証に使う Amazon N2 証明書の発行を始め、AWS Private CA は発行する証明書のサブジェクト・SAN・公開鍵・署名アルゴリズム・有効期間・キー使用法・基本制約などに基づいて許可・拒否できる IAM 条件キーに対応しました。あわせて、AWS Compute Optimizer の自動化ルールが AWS Organizations の OU を対象にできるようになり (従来は 1 ルールあたりメンバーアカウント 50 個まで、後から追加されたアカウントも対象、子 OU やアカウントの除外も可能)、AWS DevOps Agent は AWS GovCloud (US-West) で FedRAMP Class D の認定を取得しています。
