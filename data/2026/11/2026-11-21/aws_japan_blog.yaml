"entries":
  "819e01dd56bb819bcd5d3349b30c903c":
    "id": "819e01dd56bb819bcd5d3349b30c903c"
    "title": "Kiro のリモートワークスペース: コードとコンピューティングリソースがすでにある場所で IDE を使う"
    "link": "https://aws.amazon.com/jp/blogs/news/remote-workspaces/"
    "published": "2026-11-21 11:52:51"
    "fetched": "2026-11-21 14:27:21"
    "summary": "ワークスペースを手元のノート PC に直接置いておく必要はなくなりました。本日から Kiro IDE で、Kiro のクラウドセッションを開く、ローカルやリモートホストの Dev Container の中でワークスペースを動かす、チームがすでに持っているマシンに接続する、の 3 つができるようになりました。"
  "f0bbfcea43971602804a38a77f1fc7cf":
    "id": "f0bbfcea43971602804a38a77f1fc7cf"
    "title": "Kiro のクラウドセッションからプライベートネットワークにアクセスできるようになりました"
    "link": "https://aws.amazon.com/jp/blogs/news/private-networks/"
    "published": "2026-11-21 11:51:34"
    "fetched": "2026-11-21 14:27:21"
    "summary": "Kiro のクラウドセッションを、管理者が設定した VPC に接続できるようになりました。これまでのクラウドセッションは、パブリックなインターネットと Kiro 自身のサービスにはアクセスできても、プライベートネットワーク内のリソースにはアクセスできませんでした。"
  "f5d0a02113c6fcf969f4261a454a19c1":
    "id": "f5d0a02113c6fcf969f4261a454a19c1"
    "title": "Kiro for VS Code のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-for-vs-code/"
    "published": "2026-11-21 11:50:43"
    "fetched": "2026-11-21 14:27:21"
    "summary": "本日、Kiro for VS Code の一般提供を macOS、Windows、Linux で開始しました。VS Code Marketplace か Open VSX からインストールしてサインインすれば、今使っているエディタを離れずに Kiro のエージェントと一緒に開発できます。"
  "f326b0adee90b8558bef1d46cffad26b":
    "id": "f326b0adee90b8558bef1d46cffad26b"
    "title": "re:Invent 2026 の AWS Security, Identity, and Governance ガイド: セキュリティセッションの見どころ"
    "link": "https://aws.amazon.com/jp/blogs/news/your-aws-security-identity-and-governance-guide-to-reinvent-2026/"
    "published": "2026-11-21 10:12:36"
    "fetched": "2026-11-21 14:27:21"
    "summary": "2026 年 11 月 30 日～12 月 4 日にラスベガスで開催される re:Invent 2026 に向けて、AWS の Security, Identity, and Governance トラックの見どころを紹介します。ブレイクアウトセッション、チョークトーク、ワークショップなど 120 件近くのセキュリティセッションから、AI エージェントの保護、脅威検出、アイデンティティ、クラウドガバナンス、デジタル主権などの分野別の注目セッションを取り上げます。12 月 3 日 (木) に Wynn で終日開催されるセッションや、初参加者向けのヒントも解説します。日本語版では、re:Invent 2026 で発表されるセキュリティの最新情報を日本語で解説するオンラインイベント「Security re:Cap」もご案内します。"
  "8ab74541c7f1b04c621dc679cc02da73":
    "id": "8ab74541c7f1b04c621dc679cc02da73"
    "title": "中国と関連のある脅威アクターが使用した Cairn の AI エージェントがゼロデイ脆弱性を自律的に発見した事例"
    "link": "https://aws.amazon.com/jp/blogs/news/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/"
    "published": "2026-11-21 09:57:57"
    "fetched": "2026-11-21 14:27:21"
    "summary": "Amazon Threat Intelligence が調査した、中国と関連のある脅威アクターによる自律型 AI エージェントを使った攻撃を紹介します。アクターがオープンソースの AI ペネトレーションテストフレームワーク Cairn に「シェルアクセスを取得する」という目標を与えると、エージェントは人間の指示なしに攻撃を進めました。その結果、医用画像 AI アプリケーションのゼロデイ脆弱性を発見し、root として動作するリバースシェルを確立しました。攻撃のスピードと持続性に備えて防御側が取るべき対策も解説します。"
"last_updated": "2026-11-21 14:27:21 JST"
