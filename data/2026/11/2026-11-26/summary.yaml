"overview": |
  この日は 4 ソースから 25 本 (日本語ブログの WAF 新料金・TIP・週次まとめは既出の英語記事の翻訳)で、エージェントのアクセス制御とセキュリティ速報、Graviton5 世代インスタンスのリージョン拡大が中心でした。AWS Sign-In は Enterprise-Managed Authorization (EMA) に対応し、Identity Assertion JWT Authorization Grant (ID-JAG) を使って Okta などの既存の企業 IdP 経由で AI エージェントに AWS MCP Server へのアクセスを認可できるようになりました。どのアプリケーションが AWS リソースにアクセスできるかを組織として一元的に管理できます。セキュリティ速報は 2 件です。CVE-2026-136267 は、ブラウザー上で AI エージェントが開発作業を行うクラウド型 IDE の Kiro Web において、エージェントのセッションが読み込んだリポジトリのファイルや Web ページに含まれるツール呼び出しのマークアップを一部のモデルがそのまま繰り返してしまい、同意のプロンプトなしにホストされた開発環境でコマンドとして実行されうるというものです (DeepSeek v3.2、GLM-5、MiniMax M2.1 / M2.5、Qwen3-coder-next を使ったセッションが 2026-05-18 から 2026-10-30 まで影響、Bulletin 2026-202-AWS)。CVE-2026-134070 は、AWS Config の修復などから実行される AWS 管理の Systems Manager Automation ランブック AWSConfigRemediation-EnableSystemsManagerSessionManagerAuditLogsToS3 の入力検証が不十分で、ランブックを実行できる認証済みのリモートユーザーがアカウントのリージョンごとの Session Manager 設定 (SSM-SessionManagerRunShell ドキュメント) に意図しない設定を行えるおそれがあるというものです (2026-203-AWS)。そのほかセキュリティブログでは、AWS CloudHSM から AWS KMS への移行が取り上げられ、KMS が CloudHSM のワークロードの多くが必要とする認証・アルゴリズム・性能に対応しているため、移行した組織は HSM のプロビジョニングやパッチ適用、高可用性の管理をなくしつつコストも大きく減らせたと説明されています。サインインはアプリケーションの入り口で、そこが落ちるとユーザーはログインもトークンの更新もできなくなることから、Amazon Cognito の Plus 機能プランで 99.99% の可用性を見込んで設計する方法も解説されました。インスタンスでは Graviton5 世代の展開が進み、M9gd がアジアパシフィック (ソウル)、C9gd が欧州 (アイルランド、スペイン)、C9g がアジアパシフィック (シドニー)・欧州 (アイルランド、スペイン)・南米 (サンパウロ)、M9g が米国西部 (北カリフォルニア)・カナダ (中部)・南米 (サンパウロ)・アジアパシフィック (ソウル) で利用できるようになりました。いずれも Graviton4 世代に比べて計算性能が最大 25% 向上し、第 6 世代の AWS Nitro System 上で形式検証を用いた Nitro Isolation Engine を初めて搭載します。Graviton4 ベースの M8g もイスラエル (テルアビブ) に追加され、アプリケーションサーバーやマイクロサービスなどの汎用ワークロード向けに Graviton3 ベースの M7g から最大 30% の性能向上を提供します。 後から追加された分では、What's New で、オープンソースの Envoy プロキシを動かす新しいロードバランサーの種類 ELB for Envoy が一般提供となりました。ロードバランサーごとに Nitro System でハードウェア分離された専用の EC2 インスタンス上でプロキシが動くため Envoy のゼロデイの影響がそのロードバランサー内に閉じ、CVE の監視と Envoy・OS のパッチ適用も自動で行われ、既存の Envoy 設定・拡張・コントロールプレーンをそのまま持ち込んで ACM や AWS WAF と組み合わせられ、Kubernetes の Envoy Gateway からも移行できます。Lambda durable functions で Lambda MicroVMs をオーケストレーションする拡張が開発者プレビューとなり、エージェントが生成したコードなど信頼できないコードを隔離されたサンドボックスで動かすソフトウェアファクトリーやセキュリティスキャナー、CI/CD ジョブを、チェックポイントと自動再試行付きで最長 1 年動く durable function から組めます。CloudWatch Omni のアラートからは PagerDuty のインシデントを自動作成でき、既存のオンコールスケジュールとエスカレーションポリシーに沿って通知されます。セキュリティブログでは、AWS-LC でポスト量子暗号への更新を日常的な作業にする暗号アジリティの考え方と、2026 年 10 月の AWS セキュリティのニュースのまとめが公開されました。日本語ブログでは、AWS WAF の新料金体系 (保護リソース・検査リクエスト・高度な保護が評価するリクエストの 3 要素、2027 年 2 月 1 日以降の利用分に適用、Bot Control の共通保護や Anti-DDoS ルールグループを有効にしてもサブスクリプションは追加されない) の計算例付きの解説、すべての保護パック (ウェブ ACL)・リージョンリソース・CloudFront ディストリビューションのトラフィックを 1 ページで調査・対処できる WAF セキュリティ分析ダッシュボード、High・Medium・Low の信頼度レベルごとにアクションを選べ CloudFront では 1 つのトグルで有効にできる Bot Control のターゲットを絞った検査レベルの簡素化されたオンボーディングと、WAF の記事が 3 本並びました。ID では、TIP の IAM フェデレーション・IAM Roles Anywhere への拡張の解説 (GitHub Actions による Lambda デプロイの追跡やリスクスコアに基づく S3 バケットポリシーの例) と、トラストアンカー中心の信頼モデル、証明書属性による信頼ポリシーの条件、TPM 2.0 や PKCS #11 によるプライベートキーの保護、証明書のローテーションなど IAM Roles Anywhere と PKI を統合するベストプラクティスが紹介されています。そのほか、週次まとめ (ボゴタのローカルゾーン、30 分の Lambda タイムアウト) の翻訳、よく知らないコードベースではコーディングエージェントにまず影響経路の追跡や現在の振る舞いのテストといった確かめられる証拠を作らせる方法、Ｓｋｙ株式会社が 2026 年 6 月 9〜11 日に 4 チーム 36 名で Claude Code を使って取り組んだ AI-DLC Unicorn Gym の実践レポート、三菱電機ビルソリューションズによる昇降機のグローバル遠隔保守システムの AWS 移行の寄稿、Pixalate・WURFL by ScientiaMobile・Picnic などのパートナーの機能を RTB ワークロードに組み込める AWS RTB Fabric Modules の AWS Marketplace での提供 (11 月 19 日に一般提供) が公開されました。
