    "summary": "本稿は、三菱電機ビルソリューションズ株式会社による昇降機グローバル遠隔保守サービス「M’s BR […]"
  "9493ef2cc5b54451874f802016660ebe":
    "id": "9493ef2cc5b54451874f802016660ebe"
    "title": "AWS RTB Fabric Modules を AWS Marketplace で提供開始：AdTech パートナーの知見・データを bid に組み込む"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-rtb-fabric-modules-available-through-aws-marketplace-adtech-partner-intelligence-inline-in-the-bid-path/"
    "published": "2026-11-26 09:11:31"
    "fetched": "2026-11-26 13:40:57"
    "summary": "2026 年 11 月 19 日、AWS RTB Fabric Modules の一般提供を開始しました。AdTech 企業とそのパートナーは、Real Time Bidding (RTB) ワークロードに広告インテリジェンスと意思決定の機能を追加できるようになります。Pixalate、WURFL by ScientiaMobile、Picnic などの AdTech パートナーが提供する AWS RTB Fabric Modules を、AWS Marketplace から利用できます。"
  "c8606f58a1a5e3ab74a3a3385c30b0fe":
    "id": "c8606f58a1a5e3ab74a3a3385c30b0fe"
    "title": "開発者が Kiro に持ち込む作業で、コーディングエージェントをベンチマークする"
    "link": "https://aws.amazon.com/jp/blogs/news/kirobench/"
    "published": "2026-11-26 22:42:52"
    "fetched": "2026-11-26 23:41:09"
    "summary": "開発者は Kiro を、ちょっとした質問から、多くのファイルにまたがり何往復も会話が続く作業まで、あらゆることに使っています。そうした使い方のすべてにわたってエージェントを測るために、私たちは「KiroBench」と呼ぶ社内ベンチマークを作りました。"
  "2d15216d9ceb359ec79088ba99db644c":
    "id": "2d15216d9ceb359ec79088ba99db644c"
    "title": "人の注意を中心にソフトウェアファクトリーを作る"
    "link": "https://aws.amazon.com/jp/blogs/news/software-factory-human-attention/"
    "published": "2026-11-26 14:52:18"
    "fetched": "2026-11-26 23:41:09"
    "summary": "Kiro の中のエージェントを作っているチームが、人の注意をどこにどう使うかを中心にソフトウェアファクトリーを作りました。判断をライフサイクル全体に分散させ、1 回 1 回のレビューを楽にし、要らないコンテキストの切り替えを減らす仕組みと、運用してわかったことを紹介します。"
