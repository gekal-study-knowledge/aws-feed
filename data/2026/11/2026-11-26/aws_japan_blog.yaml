    "summary": "一部の制限は、どの機能よりもアーキテクチャを形作ります。AWS Lambda は 2014 年に 60 秒のタ […]"
  "067373c889e0146589e63c79e241c33f":
    "id": "067373c889e0146589e63c79e241c33f"
    "title": "Ｓｋｙ株式会社様の AI-DLC Unicorn Gym 実践レポート：4 チームの実践から各事業本部に広がる AI 駆動開発"
    "link": "https://aws.amazon.com/jp/blogs/news/sky-ai-dlc/"
    "published": "2026-11-26 10:56:36"
    "fetched": "2026-11-26 13:40:57"
    "summary": "本稿は、AI 駆動開発ライフサイクル（AI-Driven Development Life Cycle、以下 AI-DLC）Unicorn Gym を Ｓｋｙ株式会社様（以下、同社）向けに実施した際に得られた学びと成果をお伝えするものです。 AI-DLC は、要件定義からリリースまでの開発プロセス全体に AI を深く組み込む、AWS が提唱する開発方法論です。AI が開発プロセス全体をオーケストレーション（計画策定、タスク分解、アーキテクチャ提案など）し、人間が検証・意思決定・監督の責任を保持します。従来は数週間を要していた開発の 1 サイクルを、「Bolt」と呼ぶ半日〜1 日単位の短い反復に圧縮できる点が特徴です。AI-DLC の詳細は、AI-DLC のホワイトペーパーと日本語の解説ブログをご覧ください。 本ブログでは、2026 年 6 月 9 日から 11 日の 3 日間にわたり同社向けに実施された AI-DLC Unicorn Gym について紹介します。AI-DLC Unicorn Gym は、座学ではなく実際のプロダクト開発を題材に AI-DLC を実践し、その効果を検証する実践型プログラムです。実案件を持ち込むことで、プログラムでの学びがそのまま本番開発へつながる点が特徴です。今回はエンジニア・PM・PdM・デザイナーを含む 4 チーム・計 36 名 が参加し、AI-DLC workflow v1 に沿って、Claude Code を用いて開発を進めました。"
  "4185cd62f5c1c757c41ba7283b2a4bd4":
    "id": "4185cd62f5c1c757c41ba7283b2a4bd4"
    "title": "よく知らないコードベースでコーディングエージェントを使う方法"
    "link": "https://aws.amazon.com/jp/blogs/news/unfamiliar-codebase/"
    "published": "2026-11-26 10:49:59"
    "fetched": "2026-11-26 13:40:57"
    "summary": "よく知らないリポジトリでは、エージェントがコードを書く前に、確かめられる証拠を作らせます。影響を受ける経路をたどり、今の振る舞いをテストに記録し、変更が守るべきことを書き出してから、証拠と影響の広さに応じて任せる範囲を広げる方法を紹介します。"
  "19319dcb24fb87e460f60275799f3a94":
    "id": "19319dcb24fb87e460f60275799f3a94"
    "title": "IAM ロールの背後にいるユーザーやワークロードの ID を把握: 信頼できる ID の伝播 (TIP) による認可と監査"
    "link": "https://aws.amazon.com/jp/blogs/news/know-the-identity-behind-the-role-authorize-and-audit-with-trusted-identity-propagation/"
    "published": "2026-11-26 10:46:47"
    "fetched": "2026-11-26 13:40:57"
    "summary": "信頼できる ID の伝播 (TIP) が IAM フェデレーションと IAM Roles Anywhere に拡張され、IAM Identity Center でもより簡単に使用できるようになりました。この記事では、IAM ロールの背後にいるユーザーまたはワークロードの ID コンテキストをロールセッションに伝達し、IAM ポリシーでの認可や AWS CloudTrail での監査に活用する仕組みを説明します。GitHub Actions による Lambda デプロイの追跡やリスクスコアに基づく S3 バケットポリシーの例、考慮事項と開始方法も紹介します。"
  "a687323dc16783aeaba16a0d7ebac4ed":
    "id": "a687323dc16783aeaba16a0d7ebac4ed"
    "title": "IAM Roles Anywhere と PKI を統合するためのベストプラクティス"
    "link": "https://aws.amazon.com/jp/blogs/news/best-practices-for-integrating-iam-roles-anywhere-with-your-pki/"
    "published": "2026-11-26 10:44:48"
    "fetched": "2026-11-26 13:40:57"
    "summary": "AWS IAM Roles Anywhere を使用すると、AWS の外部で実行されるワークロードが X.509 証明書を使って一時的な認証情報を取得し、AWS リソースにアクセスできます。この記事では、PKI を IAM Roles Anywhere と統合するためのベストプラクティスを紹介します。具体的には、トラストアンカーを中心とした信頼モデル、証明書属性を使った信頼ポリシーの条件、認証情報ヘルパーの使い方、TPM 2.0 や PKCS #11 によるプライベートキーの保護、証明書の有効期限のモニタリングとローテーションを取り上げます。"
