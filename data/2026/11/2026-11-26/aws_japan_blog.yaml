"entries":
  "f6cdca7c281185c21398e55ed64765c3":
    "id": "f6cdca7c281185c21398e55ed64765c3"
    "title": "AWS WAF のシンプルで予測しやすい新しい料金体系のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-waf-simplified-pricing/"
    "published": "2026-11-26 13:26:40"
    "fetched": "2026-11-26 13:40:57"
    "summary": "AWS は 2026 年 11 月 23 日、保護するリソース、AWS WAF が検査するリクエスト、高度な保護が評価するリクエストという 3 つの要素に基づく AWS WAF の新しい料金体系を発表しました。新しい料金体系は 2027 年 2 月 1 日以降の利用分に適用されます。ルールを追加・変更しても料金単価は変わりません。また、Bot Control の共通保護や Anti-DDoS ルールグループを有効にしてもサブスクリプションは追加されないため、コストを予測しやすくなります。この記事では、新しい料金体系の仕組みと、計算例を使った請求額の見積り方法を紹介します。"
  "59a7fd108e669a4ce0ba7970787a3ec1":
    "id": "59a7fd108e669a4ce0ba7970787a3ec1"
    "title": "新しい AWS WAF セキュリティ分析ダッシュボードのご紹介: すべての保護パックのトラフィックを単一ページで調査・対処"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-the-new-aws-waf-security-analytics-dashboard/"
    "published": "2026-11-26 13:25:01"
    "fetched": "2026-11-26 13:40:57"
    "summary": "AWS WAF セキュリティ分析ダッシュボードを使うと、すべての保護パック (ウェブ ACL)、リージョンリソース、Amazon CloudFront ディストリビューションにわたるトラフィックを単一のグローバルページで調査し、同じページから対処できます。この記事では、ホストやラベルなどのディメンションと、フィルターやグループ化などのコントロールを紹介します。また、トラフィックの急増の調査と、誤検知を減らすためのルールのチューニングという 2 つのユースケースを説明します。"
  "24c5396833f8eed837d346bd3813ce4c":
    "id": "24c5396833f8eed837d346bd3813ce4c"
    "title": "AWS WAF Bot Control のターゲットを絞った検査レベルでオンボーディングを簡素化"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-simplified-onboarding-for-aws-waf-bot-control-at-the-targeted-inspection-level/"
    "published": "2026-11-26 13:23:29"
    "fetched": "2026-11-26 13:40:57"
    "summary": "ターゲットを絞った検査レベルの AWS WAF Bot Control で、簡素化されたオンボーディングとボット信頼度レベルの提供を開始しました。ラベルルールを記述する代わりに High、Medium、Low の信頼度レベルごとにアクションを選べるため、AI を活用したボットを含む自動化されたトラフィックへの対処に役立ちます。Amazon CloudFront では、1 つのトグルで Targeted bot control を有効にでき、自動 SDK 統合によってアプリケーションコードを変更せずに導入できる場合が多くあります。この記事では、コンソールと API での設定手順と考慮事項を紹介します。"
  "fcc2b093987ddcc64d35f6a26ae3654d":
    "id": "fcc2b093987ddcc64d35f6a26ae3654d"
    "title": "AWS Weekly Roundup: ボゴタのローカルゾーン、30 分の Lambda タイムアウト、その他 (2026 年 11 月 24 日)"
