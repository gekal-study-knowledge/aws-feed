    "published": "2026-11-26 01:17:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C9g instances are available in the Asia Pacific (Sydney), Europe (Ireland, Spain), and South America (São Paulo) regions. These instances are powered by AWS Graviton5 processors, the fifth generation of custom-designed CPUs, which deliver the best price performance for a broad range of workloads running on Amazon EC2.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">C9g instances</a> deliver up to 25% better compute performance than AWS Graviton4-based C8g instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>. The Isolation Engine uses formal verification to provide mathematical assurance that customer workloads are isolated from each other and from AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>C9g instances are ideal for compute-intensive workloads such as high-performance computing (HPC), batch processing, gaming, video encoding, scientific modeling, distributed analytics, CPU-based machine learning (ML) inference, real-time analytics, and ad serving.</p> \n<p>C9g instances are available for purchase in these regions via Savings Plans, On-Demand, Spot Instances, Dedicated Instances, or Dedicated Hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">get started with C9g today</a>.</p>"
  "e41c63e92d6427443fb51f50c1ab90de":
    "id": "e41c63e92d6427443fb51f50c1ab90de"
    "title": "Amazon EC2 M9g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ec2-m9g-instances-additional-regions/"
    "published": "2026-11-26 01:06:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M9g instances, powered by AWS Graviton5 processors, are available in US West (N. California), Canada (Central), South America (São Paulo), and Asia Pacific (Seoul) regions. AWS Graviton5 processors are the fifth generation of custom-designed CPUs, delivering the best price performance for memory-intensive workloads running on Amazon EC2.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">M9g instances</a> deliver up to 25% better performance compared to AWS Graviton4-based M8g instances. They are up to 30% faster for databases. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>M9g instances are ideal for workloads such as open-source databases, in-memory caches, big data analytics, and memory-intensive applications.</p> \n<p>M9g instances are available for purchase in these four regions via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">get started today.</a></p>"
  "2195aaddc69af86f2617c408078cf99f":
    "id": "2195aaddc69af86f2617c408078cf99f"
    "title": "AWS Lambda now supports orchestrating MicroVMs with Lambda durable functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-durable-microvm/"
    "published": "2026-11-26 05:00:00"
    "fetched": "2026-11-26 13:40:56"
    "summary": "<p>Today, AWS announces a developer preview of a new extension for orchestrating <a href=\"https://aws.amazon.com/lambda/lambda-microvms/\">Lambda MicroVMs</a> with <a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\">Lambda durable functions</a>. The extension adds durable operations for running work on MicroVMs and managing their lifecycle. You can use the new operations to build software factories, security scanners, or orchestrate CI/CD jobs that run untrusted or agent-generated code in isolated sandboxes.</p> \n<p>With Lambda durable functions, you can build resilient, multi-step applications and AI workflows that run for up to one year, with built-in checkpointing and automatic retries. Lambda MicroVMs are a serverless compute primitive that provides VM-level isolation, near-instant launch and resume, and state preservation for running user-generated or AI-generated code. With this launch, you can run individual tasks in a MicroVM or launch a MicroVM session, where tasks share the same files and memory. The durable function manages the MicroVM lifecycle and runs each task as a durable operation. It checkpoints progress, retries failed tasks, and refreshes MicroVM tokens as needed. A single durable function can orchestrate multiple MicroVMs in parallel, and you can trigger it from event sources such as <a href=\"https://aws.amazon.com/sqs/\">Amazon SQS</a> or <a href=\"https://aws.amazon.com/eventbridge/\">Amazon EventBridge</a>. An optional worker library runs inside your MicroVM image to receive tasks, send heartbeats, and report results.</p> \n<p>The MicroVM extension is available as a developer preview for the AWS Durable Execution SDK for <a href=\"https://github.com/aws/aws-durable-execution-sdk-js/tree/main/packages/aws-durable-execution-sdk-js-extensions\">TypeScript </a>and <a href=\"https://github.com/aws/aws-durable-execution-sdk-python/tree/main/packages/aws-durable-execution-sdk-python-extensions\">Python</a>. To get started, add the extensions package to your function alongside the Durable Execution SDK (<a href=\"https://github.com/aws/aws-durable-execution-sdk-js/tree/main\">JS/TS</a>, <a href=\"https://github.com/aws/aws-durable-execution-sdk-python/tree/main\">Python</a>) and add the MicroVM worker library (<a href=\"https://github.com/aws/aws-durable-execution-sdk-js/tree/main/packages/aws-durable-execution-sdk-js-compute-worker\">JS/TS</a>, <a href=\"https://github.com/aws/aws-durable-execution-sdk-python/tree/main/packages/aws-durable-execution-sdk-python-compute-worker\">Python</a>) to your MicroVM image. Developer preview features may change, so do not use them for production workloads. The extension is available in all AWS Regions that support Lambda durable functions and Lambda MicroVMs.</p> \n<p>To learn more, see the MicroVM orchestration <a href=\"https://github.com/aws/aws-durable-execution-sdk-js/tree/main/packages/aws-durable-execution-sdk-js-extensions\">documentation </a>and the <a href=\"https://github.com/aws/aws-durable-execution-sdk-js/tree/main/packages/aws-durable-execution-sdk-js-examples\">sample application</a>. To share feedback, open an issue in the Durable Execution SDK GitHub repository in <a href=\"https://github.com/aws/aws-durable-execution-sdk-js/issues\">JavaScript </a>or <a href=\"https://github.com/aws/aws-durable-execution-sdk-python/issues\">Python</a>.</p>"
  "77c82a98aa7b56a92e2d1e56608d5724":
    "id": "77c82a98aa7b56a92e2d1e56608d5724"
    "title": "Amazon CloudWatch Omni now integrates with PagerDuty"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cloudwatch-omni-pagerduty/"
    "published": "2026-11-26 05:00:00"
    "fetched": "2026-11-26 13:40:56"
    "summary": "<p>Amazon CloudWatch Omni alerts can now automatically create PagerDuty incidents, so notifications flow directly into your existing incident management workflows. This reduces mean time to resolution (MTTR) by eliminating manual notification steps and ensuring consistent incident workflows.&nbsp;</p> \n<p>CloudWatch Omni is a fully managed AI-powered observability experience built on open standards that unifies monitoring for AI agents, applications, and infrastructure. PagerDuty is an incident management platform that routes alerts to the right on-call responders and coordinates their response. When an Omni alert fires, Omni creates a PagerDuty incident. In PagerDuty, Omni alerts follow your existing on-call schedules and escalation policies, so critical alerts reach the right responder wherever they are, at any hour. Omni alerts include severity, the affected service, and a link back to the related data in Omni, so responders have the context they need to diagnose the problem.</p> \n<p>For PagerDuty integration in Amazon CloudWatch Omni regional availability, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/omni-supported-regions.html\">Supported Regions for CloudWatch Omni</a>.</p> \n<p>To learn more, visit <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-omni.html\">Amazon CloudWatch Omni documentation</a> and refer to the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/omni-connect-pagerduty.html\">Omni PagerDuty integration</a> page.</p>"
  "cec8774839c4adc0f879bb6a4b23add9":
    "id": "cec8774839c4adc0f879bb6a4b23add9"
    "title": "Elastic Load Balancing for Envoy is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/elastic-load-balancing-for-envoy-generally-available"
    "published": "2026-11-26 01:00:00"
    "fetched": "2026-11-26 13:40:56"
    "summary": "<p>Today, AWS announces the general availability of ELB for Envoy, a new load balancer type in Elastic Load Balancing (ELB) that runs open-source Envoy proxies. Platform teams that run Envoy themselves own upgrades, security patching, and capacity across Availability Zones (AZs). ELB for Envoy takes on that work. Each load balancer runs its proxies on dedicated Amazon Elastic Compute Cloud (Amazon EC2) instances with hardware isolation from the AWS Nitro System, so a zero-day in Envoy stays contained to your load balancer. ELB for Envoy also monitors for security vulnerabilities (CVEs) and applies Envoy and operating system patches automatically, so you can focus on your applications instead of your proxy fleet.</p> \n<p>You can bring your existing Envoy configurations, extensions, and control planes as they are, and add AWS&nbsp;integrations such as AWS&nbsp;Certificate Manager (ACM)&nbsp;and AWS WAF&nbsp;with minimal configuration. If you run Envoy Gateway on Kubernetes, install the <a href=\"https://github.com/aws/elb-envoy-remote-infra-provider\" rel=\"noopener noreferrer\" target=\"_blank\">ELB for Envoy remote infrastructure provider</a>&nbsp;alongside Envoy Gateway to move your proxies to ELB&nbsp;for Envoy without rewriting your Gateway API&nbsp;resources.</p> \n<p>You can add custom logic with WebAssembly, Lua scripting, or external processing. ELB for Envoy runs inside your VPC, integrates with Amazon Virtual Private Cloud (Amazon VPC) security groups, and supports VPC encryption. It's well suited to workloads that need Envoy's extensibility, such as custom authentication, request transformation, or advanced traffic routing, along with Kubernetes ingress and migrations from self-managed Envoy.</p> \n<p>At general availability, ELB for Envoy is available in 14 AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Ireland), Europe (Frankfurt), Europe (Stockholm), Europe (Spain), Asia Pacific (Sydney), Asia Pacific (Hong Kong), Asia Pacific (Tokyo), Asia Pacific (Singapore), Asia Pacific (Mumbai), Asia Pacific (Malaysia), and Asia Pacific (Thailand). To learn more, visit the <a href=\"https://aws.amazon.com/elasticloadbalancing/elbproxy\" rel=\"noopener noreferrer\" target=\"_blank\">ELB for Envoy product page</a>, <a href=\"https://aws.amazon.com/elasticloadbalancing/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">ELB pricing page</a>, and <a href=\"http://docs.aws.amazon.com/elasticloadbalancing/latest/elbproxy/what-is.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>. To get started, visit the <a href=\"https://aws.amazon.com/elasticloadbalancing/getting-started/#Getting_started_with_the_AWS_Management_Console\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>.</p>"
  "6788a40b325b39607f9ac9decdf58b14":
    "id": "6788a40b325b39607f9ac9decdf58b14"
    "title": "Amazon OpenSearch Service optimised engine now publishes data to Amazon S3 Tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-service-publish-s3-tables"
    "published": "2026-11-26 02:00:00"
    "fetched": "2026-11-28 10:00:55"
    "summary": "<p>The optimized engine for observability in Amazon OpenSearch Service now lets customers who send observability data directly to OpenSearch publish that data to Amazon S3 Tables. These customers can search and analyze data in OpenSearch, but reusing it with other analytics and AI tools often requires a parallel ingestion or custom export pipeline. This integration provides an open-table reuse path without changing how data enters OpenSearch.</p> \n<p>Publish policies make selected indexes available as Apache Iceberg tables in your AWS account. Engineers and AI agents can query the same observability data with Amazon EMR Serverless, DuckDB, and other Iceberg-compatible tools without adding query load to OpenSearch. They can reuse it for historical investigations, cross-dataset analysis, audits, and long-term trend analysis while retaining it at lower cost.</p> \n<p>This feature is available at no additional charge on the new engine for observability with OpenSearch 3.9 in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (London), and Europe (Spain). Amazon S3 Tables storage and the services you use to query the data incur standard charges. To get started, add a publish policy to your <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/optimized-log-analytics.html\">optimized domain</a> and see Publish indexes to Amazon S3 Tables in the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/publishing-indices-s3-tables.html\">documentation</a>.</p>"
"last_updated": "2026-11-28 10:00:55 JST"
