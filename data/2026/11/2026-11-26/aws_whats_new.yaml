  "83358696df436b9bb12c9be9cb698803":
    "id": "83358696df436b9bb12c9be9cb698803"
    "title": "Amazon EC2 M8g instances are now available in Israel (Tel Aviv)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ec2-m8g-instances-telaviv-region/"
    "published": "2026-11-26 02:15:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M8g instances are available in the Israel (Tel Aviv) region. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 M8g instances are built for general-purpose workloads, such as application servers, microservices, gaming servers, midsize data stores, and caching fleets.<br /> <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">M8g instances</a> are up to 40% faster for databases, up to 30% faster for web applications, and up to 45% faster for large Java applications than AWS Graviton3-based M7g instances. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which offloads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads. M8g instances offer larger instance sizes with up to 3x more vCPUs and memory than Graviton3-based M7g instances.<br /> M8g instances are available for purchase in this region via Savings Plans, On-Demand, Spot Instances, Dedicated Instances, or Dedicated Hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">get started with M8g today</a>.</p>"
  "2848f217db184150e21ffaeeafd058a5":
    "id": "2848f217db184150e21ffaeeafd058a5"
    "title": "Amazon EC2 M9gd instances are now available in Asia Pacific (Seoul)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ec2-m9gd-asiapacific-seoul/"
    "published": "2026-11-26 02:10:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M9gd instances are available in the Asia Pacific (Seoul) region. These instances are powered by AWS Graviton5 processors, the fifth generation of custom-designed CPUs, which deliver the best price performance for a broad range of workloads running on Amazon EC2.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">M9gd instances</a> deliver up to 25% better compute performance than AWS Graviton4-based M8gd instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>. The Isolation Engine uses formal verification to provide mathematical assurance that customer workloads are isolated from each other and from AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>M9gd instances serve a broad range of general-purpose workloads, including application servers, microservices, gaming, caching, and containers. They also deliver the performance needed for agentic AI use cases like real-time reasoning, code generation, and multi-step orchestration. M9gd instances also offer local NVMe-based SSD block-level storage for workloads that need high-speed, low-latency local storage for scratch space, temporary files, and caches.</p> \n<p>M9gd instances are available for purchase in this region via Savings Plans, On-Demand, Spot Instances, Dedicated Instances, or Dedicated Hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">get started with M9gd today</a>.</p>"
