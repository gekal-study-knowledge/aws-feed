  この日は 2 ソースから 14 本で、うち 13 本が日本語ブログです。What's New では、Amazon RDS for PostgreSQL が最新のマイナーバージョン 18.7、17.12、16.16、15.20、14.25 に対応し、既知の問題への対処のため最新のマイナーバージョンへのアップグレードが推奨されています。日本語ブログでは、金融リファレンスアーキテクチャ日本版で公開しているランサムウェア対策の検討を支援する Agent Skills が紹介され、侵入を前提に異常に早く気づき、影響範囲を見極め、安全な状態に戻せるようにする「サイバーレジリエンス」の観点が解説されたほか、AWS Backup の委任管理者の登録とポリシー管理の委任という 2 種類の委任の違いと委任先の権限の絞り方、11 月 16 日公開の英語記事の翻訳として AWS オブザーバビリティ成熟度アセスメントで改善計画へ進める方法が紹介されました。後から日本語ブログにセキュリティ関連の 10 本が加わりました。AWS Network Firewall では、アクセス制御のファイアウォールエンジンと脅威防御の IPS エンジンを分離してそれぞれ独自のルール容量を持たせる Next Generation ポリシー、IP アドレスではなく VPC・サブネット・セキュリティグループ・Transit Gateway アタッチメントといった AWS リソースでトラフィックを照合するコンテキスト対応ルール、一元的に定義したルールを各 VPC のインターネットゲートウェイで適用し、アウトバウンド専用の IPv4 には組み込みの NAT を使う自動インターネットファイアウォールモード (プレビュー) の 3 本が紹介されています。Amazon Cognito では、Plus 機能プランのユーザープールの SLA が 2026 年 11 月 1 日から 99.9% から 99.99% に引き上げられたことを踏まえた可用性計画 (5 分単位の区間での可用性測定やサービスクレジット) と、誤った一括操作の後にユーザープールを復旧するポイントインタイムリカバリ (PITR) の開始・プレビューでの影響件数確認・承認またはキャンセルの 3 ステップが説明されました。さらに、AWS サインインが ID-JAG を使った Enterprise-Managed Authorization (EMA) に対応し、Okta などの既存 IdP を通じて AI エージェントによる AWS MCP Server へのアクセスを長期的な認証情報なしで一元的に認可できるようになったこと、2026 年 11 月に一般提供された API と AI エンドポイントの検出・保護の 3 機能 (シャドー API や MCP サーバーを同じインベントリにまとめる Amazon API Gateway の API Portal など)、OpenSSL 互換 API・形式的検証・ML-KEM と ML-DSA の最適化でポスト量子暗号の更新を日常的な作業にする AWS-LC の考え方、Xen ハイパーバイザーから Nitro Card への移行やメモリ暗号化などで AWS のオペレーターもデータにアクセスできない AWS Nitro System の仕組み、AI エージェントへの独自アイデンティティ付与・最小権限・封じ込めの境界・独立した監視・自動推論による検証など、緊急ブレーキ頼みではなくエンジニアリングで AI の安全性を確保する考え方が紹介されています。
