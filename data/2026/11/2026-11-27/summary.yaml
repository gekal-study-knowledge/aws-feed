  この日は 2 ソースから 4 本です。What's New では、Amazon RDS for PostgreSQL が最新のマイナーバージョン 18.7、17.12、16.16、15.20、14.25 に対応し、既知の問題への対処のため最新のマイナーバージョンへのアップグレードが推奨されています。日本語ブログでは、金融リファレンスアーキテクチャ日本版で公開しているランサムウェア対策の検討を支援する Agent Skills が紹介され、侵入を完全に防ぐことに加えて、侵入を前提に異常に早く気づき、影響範囲を見極め、安全な状態に戻せるようにする「サイバーレジリエンス」の観点と、金融業界のお客様の検討を支援する中で見えてきた考え方が解説されました。また、AWS Backup の管理を管理アカウントからメンバーアカウントに委任する際の、委任管理者の登録とポリシー管理の委任という 2 種類の委任でそれぞれできることと、委任先に許す権限の範囲を絞るときの注意点が説明されたほか、11 月 16 日公開の英語記事の翻訳として AWS オブザーバビリティ成熟度アセスメントで推測から改善計画へ進める方法が紹介されています。
