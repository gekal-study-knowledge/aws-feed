    "title": "ランサムウェア対策の検討を支援する Agent Skills のご紹介 ― Skills の根底にある考え方と観点"
    "link": "https://aws.amazon.com/jp/blogs/news/fsi-ransomware-resilience-agent-skills-intro/"
    "published": "2026-11-27 09:48:38"
    "fetched": "2026-11-27 15:30:29"
    "summary": "ランサムウェアへの備えとして、侵入を完全に防ぐことに加え、侵入されることを前提に異常に早く気づき、影響の範囲を見極め、安全な状態に戻せるようにしておく「サイバーレジリエンス」の観点が重要になっています。本記事では、金融リファレンスアーキテクチャ日本版で公開している、ランサムウェア対策の検討を支援する Agent Skills をご紹介します。あわせて、金融業界のお客様の検討をご支援する中で見えてきた、Skills の根底にある考え方と観点として、保護・検知・対応・復旧・組織対応の 5 つの要素とそのつながり、要素をまたいで共通する考え方、検討の中で向き合うトレードオフをご紹介します。"
"last_updated": "2026-11-27 15:30:29 JST"
