  "c673082d26d07b2e44be58fef359d1df":
    "id": "c673082d26d07b2e44be58fef359d1df"
    "title": "AWS Backup の管理を委任するときに知っておきたい、委任の種類と権限の範囲"
    "link": "https://aws.amazon.com/jp/blogs/news/delegating-aws-backup-management-delegation-types-permission-scope/"
    "published": "2026-11-27 13:14:29"
    "fetched": "2026-11-27 15:30:29"
    "summary": "AWS Backup では、バックアップの管理を管理アカウントからメンバーアカウントに委任できます。本記事では、委任管理者の登録とポリシー管理の委任という 2 種類の委任でそれぞれできることと、委任先アカウントに許す権限の範囲を絞るときに知っておきたい点を説明します。"
