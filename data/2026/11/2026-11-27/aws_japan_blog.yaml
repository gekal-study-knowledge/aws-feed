    "published": "2026-11-27 10:52:47"
    "fetched": "2026-11-27 15:30:29"
    "summary": "本記事は、2026 年 11 月 16 日 に公開された AWS observability maturity […]"
  "a6ec77dcd02a38abd153bfcb60f4c8bf":
    "id": "a6ec77dcd02a38abd153bfcb60f4c8bf"
    "title": "ランサムウェア対策の検討を支援する Agent Skills のご紹介 ― Skills の根底にある考え方と観点"
    "link": "https://aws.amazon.com/jp/blogs/news/fsi-ransomware-resilience-agent-skills-intro/"
    "published": "2026-11-27 09:48:38"
    "fetched": "2026-11-27 15:30:29"
    "summary": "ランサムウェアへの備えとして、侵入を完全に防ぐことに加え、侵入されることを前提に異常に早く気づき、影響の範囲を見極め、安全な状態に戻せるようにしておく「サイバーレジリエンス」の観点が重要になっています。本記事では、金融リファレンスアーキテクチャ日本版で公開している、ランサムウェア対策の検討を支援する Agent Skills をご紹介します。あわせて、金融業界のお客様の検討をご支援する中で見えてきた、Skills の根底にある考え方と観点として、保護・検知・対応・復旧・組織対応の 5 つの要素とそのつながり、要素をまたいで共通する考え方、検討の中で向き合うトレードオフをご紹介します。"
  "2497eb7b368a3ce5596e35708a1e8cb0":
    "id": "2497eb7b368a3ce5596e35708a1e8cb0"
    "title": "AI の安全性は緊急ブレーキ頼みではなく、より優れたエンジニアリングで実現"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-ceo-ai-safety-engineering/"
    "published": "2026-11-27 21:24:32"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AI の安全性は、緊急ブレーキだけに頼るのではなく、エンジニアリングで確保すべきです。信頼できる AI システムを構築するための実践的なツールは既に存在します。本記事では、AI エージェントへの独自のアイデンティティの付与、最小権限、封じ込めの境界、監視対象から独立した監視、自動推論による制御の検証など、実績のあるセキュリティの基本原則を AI に適用する方法を紹介します。また、Nitro や Firecracker を活用し、モデルとは独立してインフラストラクチャレベルで分離を強制する AWS の取り組みも解説します。"
  "41f7662881d11029ad1dfc503eede055":
    "id": "41f7662881d11029ad1dfc503eede055"
    "title": "AWS のセキュリティ新機能: API と AI エンドポイントの検出から保護までを実現"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-api-and-ai-security-on-aws-from-discovery-to-protection/"
    "published": "2026-11-27 21:23:09"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AI エージェントが API を直接呼び出すようになった今、API と AI エンドポイントを検出して保護するために AWS が 2026 年 11 月に一般提供を開始した 3 つの新機能を紹介します。Amazon API Gateway の API Portal は、シャドー API を含む各種 API と、MCP サーバーなどの AI エンドポイントを同じインベントリにまとめます。AWS WAF の API Security マネージドルールグループは、トークン改ざんやオブジェクトレベルの認可の不備 (BOLA) などの不正使用に対応します。AI Security マネージドルールグループは、MCP と A2A のプロトコル違反を検出し、Amazon Bedrock Guardrails と連携してプロンプト攻撃をチェックします。ラベルを使った独自ルールの作成方法も解説します。"
  "9998f6a97c833f86258f921714261d4b":
    "id": "9998f6a97c833f86258f921714261d4b"
    "title": "Enterprise-Managed Authorization で実現する AI エージェントによる AWS への安全なアクセス"
    "link": "https://aws.amazon.com/jp/blogs/news/secure-agentic-access-to-aws-with-enterprise-managed-authorization/"
    "published": "2026-11-27 21:22:24"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS サインインが、ID-JAG を使用した Enterprise-Managed Authorization (EMA) のサポートを開始しました。Okta などの既存のエンタープライズ IdP を通じて、AI エージェントによる AWS MCP Server へのアクセスを一元的かつ安全に認可できます。ユーザーが追加の長期的な認証情報を管理する必要はありません。この記事では、EMA と ID-JAG の仕組み、Okta と IAM ロールを使った設定手順、AWS CloudTrail による認可アクティビティの確認方法、セキュリティのベストプラクティスを紹介します。"
  "8ed4abd35e428e4d51544cd302059a63":
    "id": "8ed4abd35e428e4d51544cd302059a63"
    "title": "AWS Network Firewall で自動インターネットファイアウォールモード (プレビュー) の提供を開始"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-network-firewall-introduces-automated-internet-firewall-mode-preview/"
    "published": "2026-11-27 21:21:30"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS Network Firewall の自動インターネットファイアウォールモード (プレビュー) では、一元的に定義したルールを各 VPC のインターネットゲートウェイで適用します。アウトバウンド専用の IPv4 接続には、組み込みの NAT を使用します。VPC ごとにファイアウォールエンドポイントや NAT ゲートウェイをデプロイする必要はありません。この記事では、仕組みとサブネットの接続タイプ、AWS Network Security Manager でのポリシー管理、監視モードから始める導入手順、既存の VPC の移行方法を紹介します。"
  "0983dbdb4debac69ba725958f09b7ddc":
    "id": "0983dbdb4debac69ba725958f09b7ddc"
    "title": "AWS Network Firewall のコンテキスト対応ルールのご紹介: IP アドレスではなく AWS リソースに基づくトラフィック照合"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-context-aware-rules-for-aws-network-firewall/"
    "published": "2026-11-27 21:20:58"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS Network Firewall がコンテキスト対応ルールをサポートするようになりました。このルールは、IP アドレスではなく送信元や送信先の AWS リソースに基づいてトラフィックを照合します。VPC、サブネット、セキュリティグループ、Transit Gateway アタッチメントを指定でき、VPC に接続された Lambda 関数がスケールアウトする場合など、短期間しか存在しないワークロードにもルールが追随します。この記事では、コンテキストストアとトランジットゲートウェイによる仕組み、複数のアカウントにわたる設定手順、ログに記録されるコンテキストを紹介します。"
  "4b0c0f424ae138fcf7bbb1b0820e61c2":
    "id": "4b0c0f424ae138fcf7bbb1b0820e61c2"
    "title": "AWS Network Firewall の Next Generation ポリシーの紹介: アクセス制御と脅威防御を個別のエンジンで実現"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-network-firewall-next-generation-policy/"
    "published": "2026-11-27 21:20:13"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS Network Firewall の Next Generation ポリシーでは、アクセス制御を担うファイアウォールエンジンと脅威防御を担う IPS エンジンが分離され、それぞれが独自のルール容量を持ちます。この記事では、Classic ポリシーとの違い、ファイアウォールエンジンがフックとアクションスコープを使ってトラフィックを評価する仕組み、各エンジンが記録するログの読み方、監視モードでの検証方法を説明します。さらに、ドメイン許可リストと脅威防御を組み合わせたポリシーの作成例も紹介します。"
  "a58affdd3616b440a6641bc8dbc98734":
    "id": "a58affdd3616b440a6641bc8dbc98734"
    "title": "AWS-LC でポスト量子暗号の更新を日常的な作業にするアプローチ"
    "link": "https://aws.amazon.com/jp/blogs/news/make-post-quantum-cryptography-updates-routine-with-aws-lc/"
    "published": "2026-11-27 21:19:13"
    "fetched": "2026-11-28 02:10:58"
    "summary": "ポスト量子暗号 (PQC) への移行を見据え、暗号アルゴリズムの更新を日常的な作業にするための考え方を紹介します。AWS が保守する暗号ライブラリ AWS-LC が、互換性、保証、パフォーマンスという 3 つの特性をどのように実現しているかを説明します。OpenSSL 互換の API、形式的検証、ML-KEM と ML-DSA の最適化に加え、ハイブリッドポスト量子鍵交換と ML-DSA 証明書が TLS ハンドシェイクに与える影響の測定結果も紹介します。"
  "63e02043f19f4593c11129dd9a014095":
    "id": "63e02043f19f4593c11129dd9a014095"
    "title": "Amazon Cognito の Plus 機能プラン: 99.99% のサービスコミットメントを踏まえた可用性計画"
    "link": "https://aws.amazon.com/jp/blogs/news/planning-for-99-99-percent-availability-with-the-amazon-cognito-plus-feature-plan/"
    "published": "2026-11-27 21:17:52"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS は、Amazon Cognito の Plus 機能プランのユーザープールについて、2026 年 11 月 1 日から月間稼働率に関する SLA のサービスコミットメントを従来の 99.9% から 99.99% に引き上げました。既に Plus を利用しているユーザープールには自動的に適用されます。この記事では、引き上げの理由、サービスクレジット、5 分単位の区間で可用性を測定する方法、2025 年 11 月から 2026 年 10 月までの可用性の実績を紹介します。あわせて、AWS マネジメントコンソールなどでユーザープールを Plus に切り替える手順も説明します。"
  "c857d9696df361ea6d2a938cd01bd3ee":
    "id": "c857d9696df361ea6d2a938cd01bd3ee"
    "title": "Amazon Cognito のポイントインタイムリカバリ (PITR) によるアイデンティティデータの保護"
    "link": "https://aws.amazon.com/jp/blogs/news/protect-identity-data-with-point-in-time-recovery-in-amazon-cognito/"
    "published": "2026-11-27 21:17:00"
    "fetched": "2026-11-28 02:10:58"
    "summary": "Amazon Cognito ユーザープールのポイントインタイムリカバリ (PITR) を使用して、誤った一括操作の後にユーザープールを復旧し、アイデンティティデータを保護する方法を紹介します。リカバリの開始、プレビューでの影響件数の確認、承認またはキャンセルという 3 つのステップを説明します。あわせて、sub 識別子やアプリケーションの統合が変わらない点や、開始と承認の権限分離などのセキュリティに関する考慮事項も解説します。"
  "971bb8b69c18fa9227511b6367ab7ad8":
    "id": "971bb8b69c18fa9227511b6367ab7ad8"
    "title": "AWS Nitro System がお客様の最も機密性の高いデータを保護する仕組み"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-nitro-system-customer-data-privacy/"
    "published": "2026-11-27 21:15:56"
    "fetched": "2026-11-28 02:10:58"
    "summary": "AWS Nitro System は、新しい世代のすべての Amazon EC2 インスタンスを支える独自のハードウェアとソフトウェアです。AWS のオペレーターがお客様のデータにアクセスする手段を一切持たないように設計されています。本記事では、Xen ハイパーバイザーから Nitro Card への処理の移行と、転送中の暗号化やメモリ暗号化などの保護機能を紹介します。さらに、分離を担う Nitro Isolation Engine の仕組みと、AWS が形式的検証によって証明したその 4 つの性質を解説します。"
"last_updated": "2026-11-28 02:10:58 JST"
