"entries":
  "7dfd2f83decc1303515d30ba5d8cd8c6":
    "id": "7dfd2f83decc1303515d30ba5d8cd8c6"
    "title": "Amazon Bedrock adds bedrock-runtime endpoint support for OpenAI Daybreak Red in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/gpt-daybreak-red-runtime-govcloud/"
    "published": "2026-11-25 06:27:00"
    "fetched": "2026-11-25 12:19:49"
    "summary": "<p>Eligible customers can now access OpenAI’s specialized cybersecurity models Daybreak Red: GPT-5.6 Cyber through the bedrock-runtime endpoint on Amazon Bedrock in AWS GovCloud (US).<br /> <br /> Daybreak Red is designed for advanced, authorized tasks such as vulnerability research, exploit reproduction, and mitigation development. For these tasks, a lower refusal threshold, matched by stronger identity verification, monitoring, and access controls, improves the speed and depth of an investigation. Your inference data is not used for model training, and you are not required to opt in to sharing your data with OpenAI.<br /> <br /> On the bedrock-runtime endpoint, the model is available through the US Gov Geo cross-Region inference (CRIS) profile. Access to the model requires enrollment in <a href=\"https://openai.com/form/enterprise-trusted-access-for-cyber/\">Daybreak access</a> from OpenAI. To enroll, contact OpenAI or reach out to your AWS account team for guidance on eligibility. Once approved, work with your account team to request access on AWS. For regional availability through the bedrock-mantle endpoint and more information, view the<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-cyber.html\"> documentation.</a></p>"
  "82fe768bd8c9ff044360d61db3951e88":
    "id": "82fe768bd8c9ff044360d61db3951e88"
    "title": "Amazon OpenSearch Serverless is now available in the Africa (Cape Town) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-serverless-available-cape-town-region/"
    "published": "2026-11-25 05:22:00"
    "fetched": "2026-11-25 12:19:49"
    "summary": "<p>Starting today, the next generation of Amazon OpenSearch Serverless is available in the AWS Africa (Cape Town) Region. Customers can now use a fully managed search, vector and analytics engine that provisions resources in seconds, auto scales instantly to meet changing demand, and scales to zero when idle, so customers only pay for the compute they use.</p> \n<p>With this launch, customers in the Africa (Cape Town) Region can run agentic AI, search, and&nbsp;observability workloads without provisioning or managing clusters. Compute is fully separated from storage, which lets customers scale compute independently to reduce costs during low-traffic periods while remaining ready for traffic spikes. With scale-to-zero and pay-per-usage pricing, customers can save up to 60% compared to provisioning OpenSearch clusters for peak loads.</p> \n<p>To learn more, see the OpenSearch Serverless <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and <a href=\"https://aws.amazon.com/opensearch-service/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>. For the full list of AWS Regions where OpenSearch Serverless is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">Regional Services List.</a></p>"
  "46b41fbc4a7353d841e52c2f7401548a":
    "id": "46b41fbc4a7353d841e52c2f7401548a"
    "title": "AWS CloudFormation makes resource coverage comprehensive with 206 new types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudformation-coverage-expansion/"
    "published": "2026-11-25 05:00:00"
    "fetched": "2026-11-25 12:19:49"
    "summary": "<p>AWS CloudFormation now supports 206 additional resource types across 88 services, including Amazon SageMaker Hub, Amazon Bedrock AgentCore PolicyEngine, and Amazon EC2 Snapshot. This closes key gaps in CloudFormation coverage and helps customers to standardize on safe and scalable infrastructure management workflows. The launch utilized a new AI-driven internal framework to collapse the costs of onboarding resource types to CloudFormation, setting up CloudFormation for continued coverage expansion. AWS Cloud Control API supports all new resource types that CloudFormation supports. Additionally, Cloud Control API now supports 224 read-only resource types across 99 services, making it easier to find and inspect existing AWS resources.</p> \n<p><br /> CloudFormation resource coverage is available across all AWS Regions where the underlying service is available.</p> \n<p><br /> To learn more, visit the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-template-resource-type-ref.html\">AWS resource and property types reference</a>, the <a href=\"https://docs.aws.amazon.com/cloudcontrolapi/latest/userguide/supported-resources.html\">Cloud Control API resource list</a>, and the <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html\">AWS CloudFormation User Guide</a>.</p>"
  "35e3d5c5a454e65c5d72f63eefe14511":
    "id": "35e3d5c5a454e65c5d72f63eefe14511"
    "title": "Amazon Connect Customer dashboards now support grouping historical metrics by time interval"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-time-interval/"
    "published": "2026-11-25 02:00:00"
    "fetched": "2026-11-25 12:19:49"
    "summary": "<p>Amazon Connect Customer analytics dashboards now support grouping historical metrics by time interval on trailing widgets, giving contact center managers granular control over how performance data is visualized over time. Trailing widgets now display data grouped by 15-minute, 30-minute, one-hour, daily, and weekly intervals. For example, a workforce manager investigating a spike in average handle time can switch from a daily view to 15-minute intervals to pinpoint the exact period the spike occurred, then zoom out to a weekly view to confirm whether it reflects a broader trend.</p> \n<p>Time interval grouping on dashboards is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">regions</a> where Amazon Connect Customer is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/dashboard-customize-widgets.html#configure-groupings\">Amazon Connect Customer Administrator Guide.</a>&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.</p>"
  "176676253460883192ab6ac652ae4a07":
    "id": "176676253460883192ab6ac652ae4a07"
    "title": "AWS IoT Core now uses dedicated IPv6 address ranges for the HTTP rule action"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-iot-core-dedicated-ipv6-ranges/"
    "published": "2026-11-25 17:00:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p><a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> can now send traffic to HTTPS endpoints within a dedicated, published IPv6 address range. This launch enables you to configure your HTTPS endpoints to accept requests only from AWS IoT Core and block all other traffic, thereby reducing your endpoint's exposure to public internet.</p>\n<p>AWS IoT Core is a fully managed service that securely connects&nbsp;IoT devices at scale to the AWS cloud and routes IoT device data to AWS and third-party services. AWS IoT Core's <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/https-rule-action.html\" target=\"_blank\">HTTP rule action</a> delivers IoT device data to any HTTPS endpoint, such as your application servers, on-premises systems, or partner services. With this launch, you can choose from AWS IoT Core's published IPv6 range, and add the fixed IPv6 range to an <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-resource-policies.html\" target=\"_blank\">Amazon API Gateway resource policy</a>, a <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html\" target=\"_blank\">security group</a>, or your <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/rule-groups.html\" target=\"_blank\">firewall rules</a>. Your HTTPS endpoints will then accept traffic only from AWS IoT Core, giving you network layer control over who can reach your endpoint.</p>\n<p>To get started, configure your HTTPS endpoint destination to be reachable only over IPv6 by publishing AAAA DNS records (and removing the A DNS records). This allows IoT Core's HTTP rule action to use only IPv6 addresses when sending data to your HTTP destination. Then allow AWS IoT Core's published IPv6 range for your Region, and create or update your HTTP rule action with the endpoint destination. Dedicated IPv6 ranges are available at no additional charge in all AWS Global Regions where AWS IoT Core is available, including AWS GovCloud (US). To find the range for your Region, see <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/iot-create-role.html#rules-engine-ip-ranges\" target=\"_blank\">Restricting HTTP action traffic to the rules engine IPv6 ranges</a> in the AWS IoT Core Developer Guide.</p>"
  "3f625ff8008ab9691c679de5f0ab0f87":
    "id": "3f625ff8008ab9691c679de5f0ab0f87"
    "title": "AWS IoT Core quotas and usage are now visible in AWS Service Quotas console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-iot-core-quota-usage-monitoring/"
    "published": "2026-11-25 17:00:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p><a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> now publishes its most used service quotas and your current usage against the quotas in <a href=\"https://us-east-1.console.aws.amazon.com/servicequotas/home/dashboard\" target=\"_blank\">AWS Service Quotas console</a>, improving observability and monitoring of API limits and quotas. This launch enables you to monitor your service quota usage, set alarms before you are throttled, and request quota increases ahead of planned growth.</p>\n<p>AWS IoT Core is a fully managed service that securely connects IoT devices at scale to the AWS cloud and routes IoT device data to AWS and third-party services. As your device fleet grows, your applications depend on quotas for operations, such as connecting and authenticating devices, publishing and subscribing to messages. Previously, service quotas and usage were not visibile in AWS Service Quotas Console and you had to contact AWS Support to learn about your current utilization before throttling occured. Now you can view quotas and usage for both device messaging (data plane) and resource management (control plane) APIs. You can also use <a href=\"https://aws.amazon.com/cloudwatch/\">Amazon CloudWatch</a> usage metrics to create alarms that notify you when your usage approaches a quota.</p>\n<p>To get started, visit AWS Service Quotas console and choose AWS IoT Core. This capability is available at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/general/latest/gr/iot-core.html\" target=\"_blank\">AWS IoT Core quotas</a> in the AWS General Reference and <a href=\"https://docs.aws.amazon.com/servicequotas/latest/userguide/gs-request-quota.html\" target=\"_blank\">Viewing service quotas</a> in the Service Quotas User Guide.</p>"
  "75883994cad76d4393c5439fce08222c":
    "id": "75883994cad76d4393c5439fce08222c"
    "title": "AWS IAM extends trusted identity propagation to IAM federation and IAM Roles Anywhere, and simplifies it in IAM Identity Center"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-iam/"
    "published": "2026-11-25 15:00:00"
    "fetched": "2026-11-26 07:55:11"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/trustedidentitypropagation-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">Trusted identity propagation (TIP)</a> carries the identity of a human user or workload with requests to supported AWS Services. Customers can use that identity in IAM policy conditions for access control and to identify the originating human user or workload in AWS CloudTrail. AWS is expanding TIP to <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html#id_roles_providers_federation\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Identity and Access Management (IAM) federation</a> and <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html\" rel=\"noopener noreferrer\" target=\"_blank\">IAM Roles Anywhere</a>, while simplifying the existing TIP experience in AWS IAM Identity Center. In addition, <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound.html\" rel=\"noopener noreferrer\" target=\"_blank\">IAM outbound identity federation</a> now enables customers to request an AWS-signed JSON Web Token (JWT) that includes identity information from TIP sessions, allowing external services to identify the human user or workload that originated the request.</p> \n<p>With TIP for IAM federation, customers can map the human or workload identity, along with optional runtime claims such as a risk score or a CI/CD workflow name, from the SAML assertion or OIDC token used for federation to the role session. IAM Roles Anywhere extends TIP to identities sourced from X.509 certificates. For IAM Identity Center, which supports workforce identities, the simplified experience adds the username, an identifier provided by your identity source, alongside the user ID that IAM Identity Center generates, and carries this information uniformly whether users access applications or AWS accounts. Across all supported paths, TIP preserves identity information as requests move between IAM roles and AWS services without requiring per-role trust policy updates.&nbsp;</p> \n<p>TIP for IAM federation, IAM Roles Anywhere, IAM outbound identity federation, and the simplified IAM Identity Center experience are available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the AWS European Sovereign Cloud (Germany) Region. To get started, see the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_tip.html\" rel=\"noopener noreferrer\" target=\"_blank\">Trusted Identity Propagation for IAM documentation</a>, <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/simplified-tip-overview.html\" rel=\"noopener noreferrer\" target=\"_blank\">Trusted Identity Propagation in IAM Identity Center documentation</a>, and the&nbsp;<a href=\"https://aws.amazon.com/blogs/security/know-the-identity-behind-the-role-authorize-and-audit-with-trusted-identity-propagation/\" rel=\"noopener noreferrer\" target=\"_blank\">TIP launch blog</a>.</p> \n<h3>&nbsp;</h3>"
  "e43b7d5d8c6b5021547f5ba50744cc2c":
    "id": "e43b7d5d8c6b5021547f5ba50744cc2c"
    "title": "Amazon Transcribe Turbo: more accurate transcripts and natural turn-taking for voice agents, now in public preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/transcribe-turbo-preview/"
    "published": "2026-11-25 17:00:00"
    "fetched": "2026-11-26 13:40:56"
    "summary": "<p>Amazon Transcribe Turbo, our next-generation speech-to-text model, is now in public preview in US East (Ohio) for batch and streaming. Turbo improves accuracy, supports custom vocabulary, and formats numbers, dates, currency, phone numbers and addresses following each locale's conventions.</p> \n<ul> \n <li><p><b>Streaming:</b> English, Portuguese, French, Italian, German and Spanish supported. Word Error Rate (WER) drops ~14% relative in English and 11% relative in the other languages versus the current production model, and formatting accuracy improves by more than 20 points.</p> </li> \n <li><p><b>Batch:</b> English Turbo is generally available in most AWS Regions. Portuguese, French, Italian, German, Spanish, Chinese, Japanese, Korean and Arabic are now in preview, with ~16% lower word error rate.</p> </li> \n</ul> \n<p>The base model needs no API, code, or SDK changes.</p> \n<p>Turbo streaming also adds two new features for voice agents in English at launch and for other languages by the end of December 2026.</p> \n<p><b>Semantic turn-taking</b> detects when a caller is done speaking from <i>what</i> they said and their <i>prosody </i>in speech, not silence alone. It won't cut callers off mid-sentence (\"I'd like to transfer… $250 to savings\") or make short answers like \"yes\", \"no\" wait on silence timeouts. It responds in about 615 ms with a 5% interruption rate, and you can tune it.</p> \n<p><b>Runtime ASR hints</b> give your agent context at every turn. Unlike static custom vocabulary, set once per session, hints enable your client application to send menu options, expected names and the expected entity type (date, phone number, currency) before each turn. On English customer service data, hints raise menu-routing accuracy from 87% to 97%.</p> \n<p>Both features come at no additional charge. To try them, turn on EndOfTurnDetection and send hints in a ConfigureEvent.</p> \n<p>Learn more in the <a href=\"https://builder.aws.com/content/3MbnTQKvOMxTZQbm34D6XV7hv8q/getting-started-with-amazon-transcribe-turbo-and-voice-agent-features\" rel=\"noopener noreferrer\" target=\"_blank\">Builder Center blog</a> and the <a href=\"https://github.com/aws-samples/amazon-ai-samples/tree/main/speech-to-text/turbo/features/javascript\" rel=\"noopener noreferrer\" target=\"_blank\">sample voice agent on GitHub</a>.</p>"
  "32c3cfc9d2bdbcb6b05fbc2a31e5a02c":
    "id": "32c3cfc9d2bdbcb6b05fbc2a31e5a02c"
    "title": "AWS Device Farm now supports Android emulators and iOS simulators"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/device-farm-virtual-devices/"
    "published": "2026-11-25 17:00:00"
    "fetched": "2026-11-26 13:40:56"
    "summary": "<p><a href=\"https://aws.amazon.com/device-farm/\">AWS Device Farm</a>, a service for testing mobile and web apps, now supports Android emulators and iOS simulators alongside real devices for automated and manual testing, enabling faster testing at scale early in your development pipeline. With virtual devices, you can shift testing left to stages that need high speed and volume, such as pull requests, code merges, and smoke tests, and keep real devices for later stages that need high fidelity, such as regression and release testing. Virtual devices running the latest device and OS typically start in seconds, and others start in around a minute.</p>\n<p>Previously, you could build and maintain your own Android emulator and iOS simulator infrastructure, which requires separate tooling and compute such as Mac hosts for iOS, or run every stage on real devices, which is slower, limited by device availability, and costs more than early-stage testing needs. Now you can use the same fully managed Device Farm APIs, test environment, private endpoint access, and test frameworks for both virtual and real devices. To switch, you change only the device type, so your pipeline and tests stay the same and you avoid maintaining two separate orchestration layers.</p>\n<p>Virtual devices use the existing metered <a href=\"https://aws.amazon.com/device-farm/pricing/\">pricing</a>. For Android, your existing unmetered slots now go further and run either a real or a virtual device at no additional charge.</p>\n<p>Android emulators and iOS simulators are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Device Farm is offered.</p>\n<p>To get started, see the AWS Device Farm <a href=\"https://docs.aws.amazon.com/devicefarm/latest/developerguide/virtual-devices.html\" target=\"_blank\">Developer Guide</a>.</p>"
  "176ec06961498e63470e8cf29e88328a":
    "id": "176ec06961498e63470e8cf29e88328a"
    "title": "Amazon OpenSearch Service new engine now joins logs, traces, and metadata"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-service-distributed-joins"
    "published": "2026-11-25 02:00:00"
    "fetched": "2026-11-27 08:27:49"
    "summary": "<p>Amazon OpenSearch Service now supports distributed joins, high-cardinality aggregations, and OpenSearch query DSL on the new engine. Observability data often spans logs, traces, service metadata, deployment records, and tenant data. Engineers and their AI agents must connect these datasets to determine what failed, where it failed, and who was affected.</p> \n<p>With Piped Processing Language (PPL) or SQL, engineers and agents can query multiple petabytes of data to connect an error log to its trace, and enrich telemetry with service ownership or deployment metadata, in one query. High-cardinality aggregations measure incident impact across millions of distinct hosts, users, or tenants. The new engine spreads aggregations and joins across data nodes, so you don't need to copy related data into a single index first. With routing key support, you can keep related documents on the same shard, so lookups and joins on that key stay fast.</p> \n<p>In addition to PPL and SQL, the new engine now supports OpenSearch query DSL. You get the engine's cost savings and performance improvements for supported analytics workloads without rewriting queries in PPL or SQL. Applications, alerts, and integrations that send query DSL keep working.</p> \n<p>These features are available on OpenSearch 3.9, at no additional charge, in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (London), and Europe (Spain). To get started, create or upgrade a domain to OpenSearch 3.9 with the new engine. To learn more, see the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/optimized-log-analytics-queries.html\">documentation</a>.</p>"
"last_updated": "2026-11-27 08:27:49 JST"
