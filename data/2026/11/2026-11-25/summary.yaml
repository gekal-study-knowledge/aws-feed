"overview": |
  この日は 3 ソースから 7 本で、セキュリティ速報 4 件が中心でした。Bulletin 2026-198-AWS の CVE-2026-134068 は、PostgreSQL のアクティブ・アクティブレプリケーションを提供する AWS のオープンソース拡張 pgactive のレプリケーションオリジン名の解析にスタックベースのバッファーオーバーフローがあり、特定の権限を持つ認証済みのデータベースユーザーが、データベースの OS ユーザーとして任意の OS コマンドを実行できるおそれがあるもので、影響するのは 2.1.0 以上 2.1.10 未満です。2026-199-AWS の CVE-2026-134066 は、Amazon Neptune などに対してセルフホストするオープンソースの Graph Explorer (3.2.1 未満) が、接続先のグラフデータベースから読んだプロパティキーやラベルをエスケープせずに Gremlin・openCypher・SPARQL のクエリに埋め込んでいた問題で、データベースへの書き込み権限を持つユーザーが細工したキーやラベルを作ると、別のユーザーの検索時に Graph Explorer の権限で意図しないクエリが走りデータの参照・変更が起き得ます (Neptune の SPARQL パスは影響なし)。2026-200-AWS の CVE-2026-135614 は、AI エージェントが運用者の認証情報で ECS を管理する Amazon ECS MCP Server (awslabs.ecs-mcp-server) 0.1.36 未満のトラブルシューティングツールが、機密データ設定が既定のままでもタスク定義のコンテナー環境変数の値とシークレット参照をマスクせずに返していた問題で、プロンプトインジェクションなどでエージェントの入力に影響を与えられる遠隔の攻撃者がそれらの値を得るおそれがあります。2026-201-AWS の CVE-2026-135414 は、Amazon OpenSearch Service のスナップショットリポジトリ登録でのサーバーサイドリクエストフォージェリで、ドメインのスナップショット管理権限を持つユーザーが、サービスが運用するノードから任意のネットワーク宛先へリクエストを送らせることができたもので、サービスソフトウェア R20260720 で修正されており、R20260720 以降への更新が推奨されています。セキュリティブログでは、AWS 欧州 (スペイン) リージョンがスペインの国家機密区分 Difusión Limitada (限定配布) と NATO Restricted の認定を取得したこと、AWS が ISO/IEC 42001:2023 (AI マネジメントシステム) の 2 回目のサーベイランス監査を 2026 年 11 月に完了したことが報告されました。ニュースブログの週次まとめ (11 月 24 日) は、ボゴタの Local Zone、Lambda のタイムアウトが 15 分から 30 分に倍増したこと、同じ週に Lambda が GPU で動くようになったことなどを取り上げています。
