"overview": |
  この日は 5 ソースから 25 本で、セキュリティ速報 4 件と、後から追加された AWS Network Firewall の新機能群が中心でした。Bulletin 2026-198-AWS の CVE-2026-134068 は、PostgreSQL のアクティブ・アクティブレプリケーションを提供する AWS のオープンソース拡張 pgactive のレプリケーションオリジン名の解析にスタックベースのバッファーオーバーフローがあり、特定の権限を持つ認証済みのデータベースユーザーが、データベースの OS ユーザーとして任意の OS コマンドを実行できるおそれがあるもので、影響するのは 2.1.0 以上 2.1.10 未満です。2026-199-AWS の CVE-2026-134066 は、Amazon Neptune などに対してセルフホストするオープンソースの Graph Explorer (3.2.1 未満) が、接続先のグラフデータベースから読んだプロパティキーやラベルをエスケープせずに Gremlin・openCypher・SPARQL のクエリに埋め込んでいた問題で、データベースへの書き込み権限を持つユーザーが細工したキーやラベルを作ると、別のユーザーの検索時に Graph Explorer の権限で意図しないクエリが走りデータの参照・変更が起き得ます (Neptune の SPARQL パスは影響なし)。2026-200-AWS の CVE-2026-135614 は、AI エージェントが運用者の認証情報で ECS を管理する Amazon ECS MCP Server (awslabs.ecs-mcp-server) 0.1.36 未満のトラブルシューティングツールが、機密データ設定が既定のままでもタスク定義のコンテナー環境変数の値とシークレット参照をマスクせずに返していた問題で、プロンプトインジェクションなどでエージェントの入力に影響を与えられる遠隔の攻撃者がそれらの値を得るおそれがあります。2026-201-AWS の CVE-2026-135414 は、Amazon OpenSearch Service のスナップショットリポジトリ登録でのサーバーサイドリクエストフォージェリで、ドメインのスナップショット管理権限を持つユーザーが、サービスが運用するノードから任意のネットワーク宛先へリクエストを送らせることができたもので、サービスソフトウェア R20260720 で修正されており、R20260720 以降への更新が推奨されています。セキュリティブログでは、AWS 欧州 (スペイン) リージョンがスペインの国家機密区分 Difusión Limitada (限定配布) と NATO Restricted の認定を取得したこと、AWS が ISO/IEC 42001:2023 (AI マネジメントシステム) の 2 回目のサーベイランス監査を 2026 年 11 月に完了したことが報告されました。ニュースブログの週次まとめ (11 月 24 日) は、ボゴタの Local Zone、Lambda のタイムアウトが 15 分から 30 分に倍増したこと、同じ週に Lambda が GPU で動くようになったことなどを取り上げています。 後から追加された分では、セキュリティブログで AWS Network Firewall の新機能が 3 本紹介されました。各 VPC のインターネットゲートウェイで一元定義したルールを適用し、送信のみの接続には組み込みの NAT を行う自動インターネットファイアウォールモード (プレビュー)、IP アドレスではなく VPC・サブネット・セキュリティグループ・Transit Gateway アタッチメントといった AWS リソースでトラフィックを照合するコンテキスト認識ルール、アプリケーションごとに必要な通信だけを許可しつつ許可した接続を既知の脅威に照らして検査する Next Generation ポリシーです。あわせて、Amazon Cognito のトークン交換で AI エージェントにユーザーのアクセスを委任する方法も解説されています。What's New では、CloudFormation が 88 サービスにわたる 206 のリソースタイプ (SageMaker Hub、Bedrock AgentCore PolicyEngine、EC2 Snapshot など) を追加し、Cloud Control API も 99 サービス 224 の読み取り専用リソースタイプに対応したほか、次世代の OpenSearch Serverless のアフリカ (ケープタウン) リージョン提供、Amazon Connect Customer のダッシュボードでの 15 分・30 分・1 時間・日・週単位の集計、AWS GovCloud (US) の Bedrock の bedrock-runtime エンドポイントでの OpenAI のサイバーセキュリティ向けモデル Daybreak Red: GPT-5.6 Cyber の提供 (脆弱性調査やエクスプロイトの再現など承認されたタスク向け) が発表されました。日本語ブログでは、Greenlight Financial が Bedrock AgentCore 上に 30 を超える専門エージェントの階層型 SOC を作り、毎月最大 4,000 件のセキュリティ・リスクのケースの 90% 超を人の介入なしで解決した事例、GuardDuty の Custom Detection Rules のドライランや抑制ルールでアラート疲れを減らす方法、AWS Security Incident Response による検出結果のトリアージの仕組み、STS GetScopedCredentials によるセッション権限のスコープダウン (IAM Policy Autopilot の活用を含む) が公開されています。 さらに後から日本語ブログに 3 本が加わり、タグエディタが AWS Resource Explorer に移行して複数のリージョンにまたがるリソースにタグを一括付与できるようになったこと (11 月 3 日公開の英語記事の翻訳)、FinOps チームとプラットフォームチーム向けに Amazon Bedrock のコストを一連の流れで管理するプレイブック (10 月 30 日公開の英語記事の翻訳)、Oracle・SQL Server・Db2・Sybase から Amazon RDS や Aurora PostgreSQL へのスキーマ移行の手動ステップを AWS DMS Schema Conversion のエージェンティック AI で効率化する方法が紹介されました。さらに 3 件が遅れて届きました。AWS IoT Core の HTTP ルールアクションが専用の公開された IPv6 アドレス範囲からトラフィックを送るようになり、HTTPS エンドポイント側で Amazon API Gateway のリソースポリシーやセキュリティグループ、ファイアウォールのルールにその固定の範囲を設定すれば、AWS IoT Core からのリクエストだけを受け付けてインターネットへの露出を減らせます。また AWS IoT Core は、よく使われるサービスクォータと現在の使用量を AWS Service Quotas コンソールに公開するようになりました。これまでは現在の使用状況を知るのに AWS Support へ問い合わせる必要がありましたが、スロットリングされる前にアラームを設定したり、増加を見越して引き上げを申請したりできます。AWS IAM は、人やワークロードの ID をリクエストとともに運んで IAM ポリシーの条件や CloudTrail での追跡に使える trusted identity propagation (TIP) を、IAM フェデレーションと IAM Roles Anywhere に拡張し、IAM Identity Center での既存の TIP も設定しやすくしました。あわせて IAM の送信 ID フェデレーションで、TIP セッションの ID 情報を含む AWS 署名付きの JWT を要求できるようになり、外部サービス側でもリクエスト元の人やワークロードを識別できます。
