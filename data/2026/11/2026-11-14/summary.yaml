"overview": |
  この日は 5 ソースから 11 本で、AI エージェントを悪用したサイバー犯罪の観測報告と、Amazon Bedrock・SageMaker のコスト最適化や運用の記事が中心でした。Amazon Threat Intelligence は、2026 年 10 月 3 日から 11 月 5 日にかけて、おとりの脅威センサー網 MadPot が、オープンソースのエージェント型 AI ペネトレーションテストフレームワーク ARTEX で脅威アクターが実行した攻撃キャンペーンの記録を捕捉したと報告しました (Security Blog と日本語ブログの両方に掲載)。AI エージェントによる AI モデルの認証情報の大規模な窃取や、ディープフェイクで暗号資産取引所の本人確認 (KYC) を回避しようとした手口を解説し、防御策と侵害指標 (IOC) も示しています。Machine Learning Blog では、計測コードなしで推論呼び出しを IAM プリンシパルまで遡れる Bedrock の組み込みコスト帰属を IAM Identity Center・セッションタグ・CUR 2.0 と組み合わせてユーザー単位のコストを把握し上限を強制する方法、AWS CDK で LiteLLM と NVIDIA NeMo Switchyard のルーティングプラグインを Bedrock 上に展開し、解決したタスクあたりのコストで単一モデルと比較する方法、AgentCore ランタイム V2 が初期化済み環境のスナップショットから各セッションを復元する仕組みとセッション開始を速く保つ 4 つのパターンが取り上げられました。ほかに、SageMaker HyperPod Data Capture で本番推論の入出力を S3 に記録し Athena で盲点を見つけてファインチューニングするモデル改善サイクル、SageMaker JumpStart から OpenFold3-preview をデプロイしてタンパク質・DNA・RNA・リガンド複合体の 3D 構造を予測する方法、GS Caltex が SageMaker Canvas と SageMaker Pipelines をつないでデプロイを約 1 週間から数時間に短縮し 30 分ごとにバッチ推論を回す事例 (Part 1)、AssemblyAI が ECS・EC2 スポット GPU・SQS ベースのリトライで欧州リージョンの SLA を守りながら音声認識推論のコストを 70% 削減した事例が紹介されています。Architecture Blog では Thermo Fisher Scientific が AWS 上に構築した AI による治験の患者マッチング基盤 (AWS Countdown Premium で本番ローンチのリスクを低減) が、What's New ではエクスプレス構成の Aurora PostgreSQL の AWS CloudFormation 対応が発表されました。
