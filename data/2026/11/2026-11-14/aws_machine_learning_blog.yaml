"entries":
  "032efc7f2ca45c793e7181eb37b2d8b7":
    "id": "032efc7f2ca45c793e7181eb37b2d8b7"
    "title": "Cost-optimizing AssemblyAI speech-to-text inference on AWS with Amazon EC2 Spot"
    "link": "https://aws.amazon.com/blogs/machine-learning/cost-optimizing-assemblyai-speech-to-text-inference-on-aws-with-amazon-ec2-spot/"
    "published": "2026-11-14 04:35:35"
    "fetched": "2026-11-14 05:16:49"
    "summary": "Learn how AssemblyAI runs cost-optimized speech-to-text inference at scale on AWS, using Amazon ECS, Amazon EC2 Spot GPU instances, and an Amazon SQS-based retry architecture to achieve 70% cost savings while maintaining SLA commitments across European Regions."
  "f02513c671702ace80c43823983accf1":
    "id": "f02513c671702ace80c43823983accf1"
    "title": "Cost attribution and controls for AI developer and productivity tools on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/cost-attribution-and-controls-for-ai-developer-and-productivity-tools-on-amazon-bedrock/"
    "published": "2026-11-14 03:44:02"
    "fetched": "2026-11-14 05:16:49"
    "summary": "Amazon Bedrock provides built-in, zero-instrumentation cost attribution that traces every inference call back to the IAM principal that made it. This post shows how to attribute per-user Bedrock costs for AI developer and productivity tools using IAM Identity Center, session tags, and CUR 2.0, and how to enforce per-user usage limits."
  "5ac45e1cf5f09bda936dec5a9fb2b105":
    "id": "5ac45e1cf5f09bda936dec5a9fb2b105"
    "title": "Build a model improvement flywheel with Amazon SageMaker HyperPod Data Capture"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-model-improvement-flywheel-with-amazon-sagemaker-hyperpod-data-capture/"
    "published": "2026-11-14 03:01:15"
    "fetched": "2026-11-14 05:16:49"
    "summary": "Amazon SageMaker HyperPod Data Capture records live inference inputs and outputs to Amazon S3. This post walks through one end-to-end example: capturing a support router's production traffic, surfacing a new-product blind spot with Amazon Athena, fine-tuning on the captured data with the HyperPod training operator, and measuring the before-and-after lift."
  "b7a26347225ba1c6177aa14e35f93675":
    "id": "b7a26347225ba1c6177aa14e35f93675"
    "title": "Production MLOps at GS Caltex with Amazon SageMaker Canvas, part 1"
    "link": "https://aws.amazon.com/blogs/machine-learning/production-mlops-at-gs-caltex-with-amazon-sagemaker-canvas-part-1/"
    "published": "2026-11-14 08:22:09"
    "fetched": "2026-11-14 10:13:54"
    "summary": "GS Caltex connects Amazon SageMaker Canvas to Amazon SageMaker Pipelines so process engineers' no-code models run in production. This post shows how ML engineers reuse validated preprocessing flows and models, cutting deployment from about a week to a few hours and running batch inference every 30 minutes."
  "ef9a831edac95f2250a38834cc89a612":
    "id": "ef9a831edac95f2250a38834cc89a612"
    "title": "Route coding agent requests to the right model on Amazon Bedrock with NVIDIA NeMo Switchyard"
    "link": "https://aws.amazon.com/blogs/machine-learning/route-coding-agent-requests-to-the-right-model-on-amazon-bedrock-with-nvidia-nemo-switchyard/"
    "published": "2026-11-14 07:30:12"
    "fetched": "2026-11-14 10:13:54"
    "summary": "Coding agents work in tasks, and the number that matters is cost per solved task, not price per token. In this post, you use the AWS CDK to deploy LiteLLM with the NVIDIA NeMo Switchyard routing plugin on Amazon Bedrock, then measure cost per solved task for a routed model group against single-model baselines."
  "6b395e34e9695d3521f375daaf69b6fc":
    "id": "6b395e34e9695d3521f375daaf69b6fc"
    "title": "Architecture patterns for fast session startup on Amazon Bedrock AgentCore runtime"
    "link": "https://aws.amazon.com/blogs/machine-learning/architecture-patterns-for-fast-session-startup-on-amazon-bedrock-agentcore-runtime/"
    "published": "2026-11-14 07:02:39"
    "fetched": "2026-11-14 10:13:54"
    "summary": "Amazon Bedrock AgentCore runtime V2 snapshots your initialized environment and restores it for each new session, so session start no longer grows with image size. This post explains how V2 starts a session, how to measure session start time, and four patterns to keep work off the first request."
  "205b47a6db7182a91ab30dcc58a8af7c":
    "id": "205b47a6db7182a91ab30dcc58a8af7c"
    "title": "OpenFold3 on Amazon SageMaker JumpStart: Predict biomolecular structures"
    "link": "https://aws.amazon.com/blogs/machine-learning/openfold3-on-amazon-sagemaker-jumpstart-predict-biomolecular-structures/"
    "published": "2026-11-14 06:53:40"
    "fetched": "2026-11-14 10:13:54"
    "summary": "Deploy OpenFold3-preview from Amazon SageMaker JumpStart to predict 3D structures of proteins, DNA, RNA, and ligand complexes in your own AWS account. The post covers asynchronous inference, multi-GPU parallelism, bringing your own MSAs for accuracy and privacy, and scaling to zero to reduce cost."
"last_updated": "2026-11-14 10:13:54 JST"
