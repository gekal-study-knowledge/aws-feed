    "title": "CVE-2026-121652 - Stored cross-site scripting (XSS) in AWS Amplify maplibre-gl-js-amplify popup rendering"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-167-aws/"
    "published": "2026-11-04 03:54:53"
    "fetched": "2026-11-04 07:50:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-167-AWS<br /> <b>Publication Date:</b> 11/03/2026 10:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>maplibre-gl-js-amplify is an open-source AWS Amplify library that integrates Amazon Location Service with MapLibre GL JS to render maps, markers, popups, and geofencing controls in web applications. We identified CVE-2026-121652, where a stored cross-site scripting (XSS) issue in the library's popup and geofence-control rendering.</p> \n<p><b>Impacted versions:</b> &lt;= 4.0.2</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-167-aws/\">Read this article</a></p>"
  "3665e720e3b0338dfad121650e48763f":
    "id": "3665e720e3b0338dfad121650e48763f"
    "title": "CVE-2026-119084 - Remote Code Execution via Unsafe Class Loading in Amazon Redshift JDBC Driver Connection Parameters"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-168-aws/"
    "published": "2026-11-04 06:32:29"
    "fetched": "2026-11-04 07:50:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-168-AWS<br /> <b>Publication Date:</b> 11/03/2026 13:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-119084, an issue in Amazon Redshift JDBC Driver versions prior to 2.3.0. Under certain conditions, the driver could load and execute arbitrary classes when processing JDBC connection URL parameters or AWS credentials profile fields.</p> \n<p><b>Impacted versions:</b> Amazon Redshift JDBC Driver &lt; 2.3.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-168-aws/\">Read this article</a></p>"
  "39ff124510b46490897b505713180433":
    "id": "39ff124510b46490897b505713180433"
    "title": "CVE-2026-119922 - Babelfish for PostgreSQL Privilege Escalation"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-165-aws/"
    "published": "2026-11-04 03:26:54"
    "fetched": "2026-11-04 07:50:11"
    "summary": "<p><b>Bulletin ID:</b> 2026-165-AWS<br /> <b>Publication Date:</b> 11/03/2026 10:00 AM PST</p> \n<p><b>Description:</b></p> \n<p>Improper access control in the Babelfish for PostgreSQL extension versions 1.2-1.5, 2.1-2.15, 3.1-3.12, 4.0-4.8, 5.1-5.4 allows remote authenticated users to elevate their privileges. We recommend you upgrade to Babelfish for PostgreSQL extension versions</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-165-aws/\">Read this article</a></p>"
