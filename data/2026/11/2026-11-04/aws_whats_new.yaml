    "title": "Amazon Connect Customer lets agents pause and resume emails"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-pause-resume-email/"
    "published": "2026-11-04 05:15:00"
    "fetched": "2026-11-04 07:50:10"
    "summary": "<p>Amazon Connect Customer lets agents pause emails while waiting for information or approvals, freeing them to handle higher-priority contacts and resume their work later. For example, an agent waiting for a supervisor to approve a refund can pause the email and take an incoming call. Paused time is tracked separately from active handling time, giving supervisors a more accurate view of the time agents spend working on emails.</p> \n<p>Agents can pause and resume emails directly from the Agent Workspace or Contact Control Panel (CCP) and see how long each email has been paused. Supervisors can monitor paused emails and pause duration in real time, and use flows to automatically resume or transfer emails that remain paused beyond a configured threshold.</p> \n<p>Amazon Connect Customer email pause and resume is available in the US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), and Europe (London) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">regions</a>. To learn more and get started, please refer to the help <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/concepts-pause-and-resume-emails.html\">documentation</a> or visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer</a> website.</p>"
  "d3c4c78a5f655d40b33fa309306ba92a":
    "id": "d3c4c78a5f655d40b33fa309306ba92a"
    "title": "Amazon Connect Customer prefills the email address for new threads started from cases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-cases-email-addresses/"
    "published": "2026-11-04 02:00:00"
    "fetched": "2026-11-04 07:50:10"
    "summary": "<p>Amazon Connect Customer automatically fills in the customer’s email address from the linked customer profile when agents start a new email thread from a case. This saves agents time and reduces manual entry errors by eliminating the need to look up or type the address.</p> \n<p>Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\" rel=\"noopener noreferrer\" target=\"_blank\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "db2099c98ed09f2cf8899d4e4f8a9d7f":
    "id": "db2099c98ed09f2cf8899d4e4f8a9d7f"
    "title": "AWS Config now supports 10 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-config-new-resource-types"
    "published": "2026-11-04 01:00:00"
    "fetched": "2026-11-04 07:50:10"
    "summary": "<p>AWS Config now supports 10 additional AWS resource types across key services including Amazon ElastiCache and Amazon QuickSight. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p> \n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p> \n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\">AWS Regions</a> where the resources are available:</p> \n<p><br /> Resource Types:</p> \n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"174\"> \n <tbody>\n  <tr>\n   <td height=\"21\" width=\"87\">AWS::Billing::BillingView</td> \n   <td width=\"87\">AWS::MPA::IdentitySource</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::HoursOfOperation</td> \n   <td>AWS::Notifications::OrganizationalUnitAssociation</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ElastiCache::CacheCluster</td> \n   <td>AWS::NotificationsContacts::EmailContact</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ElastiCache::ReplicationGroup</td> \n   <td>AWS::Oam::Link</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::MediaLive::SignalMap</td> \n   <td>AWS::QuickSight::Agent</td> \n  </tr>\n </tbody>\n</table>"
  "2f73e86c8e8a09f4e34e2c6557cef02d":
    "id": "2f73e86c8e8a09f4e34e2c6557cef02d"
    "title": "Amazon WorkSpaces for AI agents now supports Linux and Windows 11 cloud desktops"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/workspaces-ai-agents-linux-windows-11"
    "published": "2026-11-04 03:00:00"
    "fetched": "2026-11-05 03:24:15"
    "summary": "<p>WorkSpaces for AI agents now supports Linux and Windows 11 cloud desktops, in addition to Windows Server. You can run each AI agent on the operating system that its workflows and applications require. Your agents can then work in the same environments that your workforce already uses, without re-platforming.&nbsp;</p> \n<p>Linux desktops give agents full root access to the operating system where many developers already build, test, and automate agentic workflows. Agents can take on developer tasks, such as running builds, tests, and scripts, within the enterprise-grade security and governance controls you already rely on. Windows 11 desktops let agents work in the enterprise applications your teams depend on every day.</p> \n<p>Linux and Windows 11 desktops have the same security and governance controls as Windows Server desktops. These include network isolation, IAM-based access, and the compliance boundaries your organization already has in place.</p> \n<p>To get started operating AI agents on WorkSpaces, visit: <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html</a>.</p>"
"last_updated": "2026-11-05 03:24:15 JST"
