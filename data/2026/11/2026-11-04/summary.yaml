  この日はセキュリティ速報が 3 件 (CVE-2026-121652 maplibre-gl-js-amplify、CVE-2026-119084 Amazon Redshift JDBC Driver、CVE-2026-119922 Babelfish for PostgreSQL) 公開された。AWS Machine Learning Blog の記事は 6 本で、生成 AI とエージェント関連が中心。Amazon Bedrock で Kimi K3 のインド国内推論が提供され、処理をムンバイとハイデラバードのリージョン内にとどめられるようになった。Bedrock AgentCore 関連では、EDB Postgres AI と Strands Agents によるガバナンス付きセマンティックレイヤーの構築、Gen Digital が AgentCore Web Search で構築した Norton Revamp の AI ニュースエンジン事例、AgentCore Gateway と Microsoft Entra ID による on-behalf-of トークン交換で ServiceNow REST API を呼び出す構成が紹介された。ほかに Cartesia の State Space Model による 100ms 未満の音声 AI と、Amazon Quick で構造化・非構造化データを統合する手順を扱った。このほか Amazon Connect Customer で、エージェントがメールを一時停止して後から再開できるようになり (一時停止時間はアクティブな処理時間と分けて計測される)、ケースから新しいメールスレッドを開始するときに顧客プロファイルのメールアドレスが自動入力されるようになった。AWS Config は Amazon ElastiCache や Amazon QuickSight などの 10 のリソースタイプを新たにサポートし、全リソースタイプの記録を有効にしている場合は自動で追跡対象に加わる。
