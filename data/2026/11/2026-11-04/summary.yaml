"overview": |
  この日はセキュリティ速報が 3 件 (CVE-2026-121652 maplibre-gl-js-amplify、CVE-2026-119084 Amazon Redshift JDBC Driver、CVE-2026-119922 Babelfish for PostgreSQL) 公開された。AWS Machine Learning Blog の記事は 6 本で、生成 AI とエージェント関連が中心。Amazon Bedrock で Kimi K3 のインド国内推論が提供され、処理をムンバイとハイデラバードのリージョン内にとどめられるようになった。Bedrock AgentCore 関連では、EDB Postgres AI と Strands Agents によるガバナンス付きセマンティックレイヤーの構築、Gen Digital が AgentCore Web Search で構築した Norton Revamp の AI ニュースエンジン事例、AgentCore Gateway と Microsoft Entra ID による on-behalf-of トークン交換で ServiceNow REST API を呼び出す構成が紹介された。ほかに Cartesia の State Space Model による 100ms 未満の音声 AI と、Amazon Quick で構造化・非構造化データを統合する手順を扱った。Amazon S3 Tables では、Apache Hive テーブルを Apache Iceberg へマネージドに移行できるようになり、ACID トランザクション・スキーマ進化・タイムトラベルを備えたデータレイクへ移りやすくなった。EC2 関連では、Amazon EC2 Capacity Manager にリアルタイムのサポート可否チェック (インスタンスタイプごとの容量確保のしやすさのスコア) と容量充足メトリクスが加わり、EC2・VPC・AWS Global View のコンソールで、これまでセキュリティグループなどに限られていた関連リソースの表示が全リソースタイプに広がった。AWS DataSync の Enhanced mode は、Google Cloud Storage と Microsoft Azure Blob Storage のロケーションで OpenID Connect (OIDC) 認証に対応した。Amazon WorkSpaces Personal には Rocky Linux 10・Red Hat Enterprise Linux 10・Ubuntu 26.04 LTS のバンドルが追加され、WorkSpaces for AI agents も従来の Windows Server に加えて Linux と Windows 11 のクラウドデスクトップに対応した。このほか Amazon Connect Customer で、エージェントがメールを一時停止して後から再開できるようになり、ケースから新しいメールスレッドを開始するときに顧客プロファイルのメールアドレスが自動入力されるようになった。AWS Config は Amazon ElastiCache や Amazon QuickSight などの 10 のリソースタイプを新たにサポートした。AWS Japan Blog では AWS Weekly Roundup (11 月 2 日号) の日本語版が公開され、GPT-6.1 Terra on Bedrock やエージェントツールとしての Step Functions など 10 月 26 日週の発表を振り返った。
