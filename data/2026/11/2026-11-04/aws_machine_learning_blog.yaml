    "title": "Bring structured and unstructured data together with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/bring-structured-and-unstructured-data-together-with-amazon-quick/"
    "published": "2026-11-04 01:49:29"
    "fetched": "2026-11-04 02:29:24"
    "summary": "Amazon Quick brings structured and unstructured data together in one experience. In this post, you connect Amazon S3 as a knowledge base, enrich a dataset, build a Space, and create a custom chat agent that answers business questions across both data types through a single conversational interface."
  "e167f9bfc1a4eaae0c55241aedf130ab":
    "id": "e167f9bfc1a4eaae0c55241aedf130ab"
    "title": "ServiceNow on-behalf-of token exchange with Bedrock AgentCore Gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/servicenow-on-behalf-of-token-exchange-with-bedrock-agentcore-gateway/"
    "published": "2026-11-04 01:47:40"
    "fetched": "2026-11-04 02:29:24"
    "summary": "Learn how to configure Amazon Bedrock AgentCore Gateway for an on-behalf-of (OBO) token exchange with Microsoft Entra ID, so an AI agent can call the ServiceNow REST API while preserving the calling user's identity. AgentCore Gateway performs the exchange natively, with no interceptor Lambda or custom code."
  "ec674e8312141bf1005d1748a6bca814":
    "id": "ec674e8312141bf1005d1748a6bca814"
    "title": "How Gen Digital built Norton Revamp’s AI-curated News Engine with Amazon Bedrock AgentCore Web Search"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-gen-digital-built-norton-revamps-ai-curated-news-engine-with-amazon-bedrock-agentcore-web-search/"
    "published": "2026-11-04 01:43:20"
    "fetched": "2026-11-04 02:29:24"
    "summary": "Gen Digital built Norton Revamp, a generative AI-powered professional reputation management platform, with an AI-curated News Engine grounded by Web Search on Amazon Bedrock AgentCore. See how the Gen team delivers real-time, cited content suggestions, goal setting, and news feeds with zero data egress and Norton-grade privacy."
  "e9ffeb3b07e0476e081d16c4485c6e8d":
    "id": "e9ffeb3b07e0476e081d16c4485c6e8d"
    "title": "Build a semantic layer for agentic AI with EDB Postgres AI and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-semantic-layer-for-agentic-ai-with-edb-postgres-ai-and-amazon-bedrock-agentcore/"
    "published": "2026-11-04 01:41:13"
    "fetched": "2026-11-04 02:29:24"
    "summary": "Learn how to build a governed semantic layer for agentic AI inside EDB Postgres AI and query it from a Strands Agents agent on Amazon Bedrock AgentCore. Business meaning, join paths, and access control all live in Postgres, with GRANT and row-level security enforcing what each agent can read."
  "3e0a6382a4ca5d5d3925fb135622f07c":
