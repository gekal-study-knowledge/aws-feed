"entries":
  "da8cf295ef5f2aca776b2091abbd0ab6":
    "id": "da8cf295ef5f2aca776b2091abbd0ab6"
    "title": "Amazon Bedrock AgentCore now offers a Web Search API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-web-search-api/"
    "published": "2026-11-10 09:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Today, AWS announces the general availability of the Web Search API on Amazon Bedrock AgentCore, which lets you search the web with a single API call. Web Search on AgentCore has been available as an MCP tool through AgentCore Gateway. The new InvokeWebSearch API gives applications, custom agent loops, and data pipelines search results with no resources to create.</p> \n<p>The API returns ranked results from the Amazon-operated web index behind Web Search on AgentCore. Each result includes a text extract and, when available, the page title, URL, and publication time. You can filter each request by domain and publication time, for example to find recent product announcements or check a claim against trusted domains.</p> \n<p>You call the API with the AWS SDKs or the AWS Command Line Interface (AWS CLI) and authorize calls with AWS Identity and Access Management (IAM). You can call it from your virtual private cloud (VPC) through AWS PrivateLink and log requests as AWS CloudTrail data events. Web Search API queries are billed at $7 per 1,000 queries, the same rate as Web Search through AgentCore Gateway, with no gateway charges.</p> \n<p>The Web Search API is available in US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Europe (Ireland). To learn more, see&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/web-search-api.html\">Search the web with the InvokeWebSearch API</a>&nbsp;in the AgentCore Developer Guide, the&nbsp;<a href=\"https://aws.amazon.com/bedrock/grounding/web-search/\">Web Search&nbsp;</a> page, and <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing&nbsp;</a>.</p>"
  "fdafa21a67862988538671f2622d327a":
    "id": "fdafa21a67862988538671f2622d327a"
    "title": "Amazon CloudWatch Logs announces account-level retention policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cloudwatch-log-retention/"
    "published": "2026-11-10 07:15:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Amazon CloudWatch Logs now supports account-level retention policies, so you can use a single policy to set how long log data is kept across all or subset of log groups in an AWS account. Account-level policies allow platform and security teams to bring each log group in line with their retention standards.</p> \n<p>With today's launch, you can create policies that cover all log groups in the account or apply to a specific set of log groups with names that start with a prefix, such as /aws/lambda. You can additionally choose whether it applies to existing log groups or only new ones. When more than one policy matches a log group, the longest retention period applies. For example, a central platform team can set a 90-day baseline for the account and a 1-year policy for log groups that start with /security to meet audit requirements, without tracking individual log group names.</p> \n<p>Account-level retention policies are available in all commercial AWS Regions except Middle East (Bahrain), and Middle East (UAE) at no additional cost . You can create and manage up to 20 policies per account and region using the AWS Management Console, AWS CLI, and AWS SDKs. Learn more in the &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html#account-level-retention-policies\">CloudWatch Logs documentation</a>, and the &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutAccountPolicy.html\">API reference&nbsp;</a>.</p>"
  "fb548286859a63373f3fd1cadae4717b":
    "id": "fb548286859a63373f3fd1cadae4717b"
    "title": "AWS Glue adds 100 new native connectors for popular SaaS applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-glue-adds-100-new-native-connectors/"
    "published": "2026-11-10 06:33:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>AWS Glue now supports 100 new native connectors that simplify access to data in popular SaaS and REST API-based applications. Previously, bringing data from SaaS applications into AWS required writing custom code. Now, teams can create a connection once in the AWS Glue Data Catalog and reuse it across ETL jobs with the same permissions model they already use for AWS Glue.</p> \n<p>The new connectors span generative AI, finance, payments, marketing, product analytics, human resources, engineering, IT operations, and collaboration tools. AI teams can bring usage and cost data from model providers such as Anthropic to track generative AI adoption and spend. Finance teams can consolidate transactions from applications such as Adyen, Square, and Xero for faster reporting. Product and marketing teams can combine billing, usage, and campaign data from tools such as Chargebee, Amplitude, and Klaviyo to understand customer lifetime value. HR teams can unify workforce data from systems such as BambooHR and Gusto for headcount planning. Engineering teams can join incident and deployment data from tools such as PagerDuty, Sentry, Jenkins, and Vercel to track reliability. You can load the integrated data into Amazon S3 or Amazon Redshift for analytics and reporting.</p> \n<p>The 100 new AWS Glue connectors are available in all AWS Commercial Regions on Glue versions 5.0 and above.</p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/available-connections.html\">complete list of available connectors</a> and learn about <a href=\"https://docs.aws.amazon.com/glue/latest/dg/console-connections.html\">connecting to individual connectors</a> in the AWS Glue documentation.</p>"
  "8ef4373b33e2940da7c0e3c807211cc9":
    "id": "8ef4373b33e2940da7c0e3c807211cc9"
    "title": "AWS STS now supports cross-partition federation for AWS identities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-sts-cross-partition"
    "published": "2026-11-10 05:03:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>AWS Security Token Service (AWS STS) now lets your workloads use their AWS Identity and Access Management (IAM) identity in one partition to get temporary credentials for an IAM role in a different partition, without storing long-term credentials, which can help improve your security posture. <a href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/partitions.html\">Partitions</a> are groups of AWS Regions, such as the commercial and AWS GovCloud (US) Regions, and each partition has an independent instance of IAM, creating a hard boundary between them. Previously, organizations that run workloads across partitions commonly relied on long-term credentials, such as IAM user access keys, that don't expire automatically.</p> \n<p>With this launch, your workload requests a short-lived token from AWS STS in its own partition and exchanges it for temporary AWS credentials in the other partition, using the existing <a href=\"https://docs.aws.amazon.com/STS/latest/APIReference/API_GetWebIdentityToken.html\">GetWebIdentityToken</a> and <a href=\"https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html\">AssumeRoleWithWebIdentity</a> APIs. You control which identities can access each role, apply governance across your organization, and audit token use in AWS CloudTrail in both partitions. This launch helps with scenarios such as consolidated security and compliance reporting, and centralized operations tooling. If your organization already operates a public key infrastructure (PKI), <a href=\"https://aws.amazon.com/iam/roles-anywhere/\">IAM Roles Anywhere</a> is another option for cross-partition access.</p> \n<p>Cross-partition federation is available at no additional charge in all commercial AWS Regions, the AWS GovCloud (US) Regions, the China Regions, and the AWS European Sovereign Cloud (Germany) Region. To learn more, see <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound_cross_partition.html\">Federating AWS identities across AWS partitions</a> in the IAM User Guide and the blog post <a href=\"https://aws.amazon.com/blogs/security/simplify-cross-partition-access-with-aws-iam-outbound-identity-federation/\">Simplify cross-partition access with AWS IAM outbound identity federation</a>.</p>"
  "050723eeaf8e0fe021922af92c07772e":
    "id": "050723eeaf8e0fe021922af92c07772e"
    "title": "Amazon Quick is now AWS Quick"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-quick-aws-quick/"
    "published": "2026-11-10 04:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Amazon Quick, the AI workspace built only for work, is now AWS Quick, a name that reflects the enterprise security and governance built into Quick from the start as an AWS service. The new name now appears across the Quick website, the web, desktop, and mobile apps, and AWS documentation. Existing customers don't need to take any action, and Quick works the same way it did before.</p> \n<p>Amazon Quick Sight, the business intelligence capability in Quick, is now AWS Quick Sight. Quick Sight customers&nbsp;can keep using their dashboards, datasets, and analyses just as they do today, with no changes to their data, settings, or pricing.</p> \n<p>With Quick, teams use AI agents to research, analyze, and act across the data and applications they already use, regardless of vendor. Quick understands your role, your team, and how your work connects, and anyone can build agents, apps, and automations in plain language that become shared assets for the whole team. Quick is HIPAA eligible and holds compliance certifications including FedRAMP, SOC 2, and ISO 27001. Your data stays in your environment and never trains&nbsp;someone else's models.</p> \n<p>AWS Quick is available in many AWS Regions. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a>.</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/quick/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Quick</a>.</p>"
  "da004132cf36d529ab414030fb6e6b3e":
    "id": "da004132cf36d529ab414030fb6e6b3e"
    "title": "Claude Fable 5.2 is now available on AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/claude-fable-5-2-aws-govcloud/"
    "published": "2026-11-10 03:30:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Claude Fable 5.2 is now available on AWS GovCloud (US) and brings Anthropic's most capable generally available model for technical work&nbsp;to regulated customers. Fable 5.2 sets a new standard on the hardest projects in coding, math, and science, and Anthropic recommends it for fields like software engineering, scientific research, and finance, where judgment, iteration, and accuracy are critical. Claude Mythos 5.2, the same underlying model as Claude Fable 5.2, with its full cyber and bio capabilities retained for cybersecurity and biology research, is available through Anthropic’s verification programs.</p> \n<p>Claude Fable 5.2 can work for hours and up to days unattended, driving autonomous work and taking on bigger, more challenging projects. It takes on large, loosely defined engineering problems across multiple repositories and monorepos, tests its own work as it goes, and is more willing to question inherited conclusions, so it finds root causes previous Claude models miss. In Anthropic’s testing, it coordinated hundreds of subagents as a lead agent and flagged results that don't reproduce. Beyond coding, it develops new analytical methods for scientific research and brings frontier reasoning to quantitative finance.</p> \n<p>Anthropic has designated Fable 5.2 and Mythos 5.2 as covered models, which require data retention for safety monitoring. Until Enterprise Frontier Safeguards is available, eligible customers can use Fable 5.2 with zero data retention. Visit the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html\">abuse detection</a> page to learn more about details regarding data retention for these models.</p> \n<p>To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-2.html\">documentation</a>, and&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability</a>.</p>"
  "bba6d331b92253c83dc960b24ffb78bf":
    "id": "bba6d331b92253c83dc960b24ffb78bf"
    "title": "Amazon Bedrock now offers Claude Mythos 5.2 to Eligible Customers in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/bedrock-claude-mythos-5-2-govcloud/"
    "published": "2026-11-10 03:30:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Amazon Bedrock, the platform for building generative AI applications and agents at production scale, now offers Claude Mythos 5.2 to eligible customers in AWS GovCloud (US). Claude Mythos 5.2 is Anthropic's most advanced AI model to date for use cases across cybersecurity, software coding, and complex reasoning tasks. The model can identify sophisticated security vulnerabilities in software and demonstrate exploitability. It can also comprehend large codebases and deliver actionable findings with less manual guidance than previous AI models. This enables security teams to accelerate defensive cybersecurity work, find and fix security vulnerabilities in the world's most critical software, and address them before threats emerge. Claude Mythos 5.2 is the first of Anthropic's AI models with powerful cybersecurity capabilities to be available in AWS GovCloud (US).</p> \n<p>Claude Mythos 5.2 is available to eligible customers in AWS GovCloud (US) Regions through <a href=\"https://aws.amazon.com/bedrock/anthropic/\">Amazon Bedrock</a>. Access is limited to allow-listed organizations; to get started, visit <a href=\"https://support.claude.com/en/articles/14604842-cyber-verification-program\">Anthropic's Cyber Verification Program</a>.&nbsp;</p>"
  "bdff6fe2a01633b9cdf62c55eee8defe":
    "id": "bdff6fe2a01633b9cdf62c55eee8defe"
    "title": "Amazon Connect Customer launches evaluation form templates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-customer-evaluation-form-templates/"
    "published": "2026-11-10 03:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Amazon Connect Customer now provides evaluation form templates so managers don't have to build forms from scratch, reducing the time to deploy automated evaluations of human and AI agent performance. These templates cover typical customer interaction scenarios: customer service, inbound sales, and self-service. Each template assesses human and AI agent behaviors. For example, the customer service template includes questions such as \"Did the agent show empathy toward the customer's issue?\" Templates also include questions that assess business outcomes such as customer satisfaction and attrition risk, so managers can see how agent behaviors relate to outcomes. Managers can use the templates as-is or customize them before deploying.</p> \n<p>This feature is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Singapore), Asia Pacific (Sydney), and Asia Pacific (Tokyo). To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/create-evaluation-forms.html#step-title\">documentation</a> and our <a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>. For Amazon Connect Customer pricing, visit our <a href=\"https://aws.amazon.com/products/connect/customer/pricing/?trk=758059ab-77e5-44fc-8a4a-1be845ee42b9&amp;sc_channel=ps&amp;ef_id=Cj0KCQiA-8XXBhDaARIsADnEOrC6AcGdc359ptTkUc4LUTvbjzEeQ5z7gYhB7FnoadVenwtyW0c3VoAaApRdEALw_wcB:G:s&amp;gclid=Cj0KCQiA-8XXBhDaARIsADnEOrC6AcGdc359ptTkUc4LUTvbjzEeQ5z7gYhB7FnoadVenwtyW0c3VoAaApRdEALw_wcB\">pricing</a> page.</p>"
  "ecb697f43b5e369e74dc2d47cd721939":
    "id": "ecb697f43b5e369e74dc2d47cd721939"
    "title": "Introducing an open-source UI for graph analytics over data lakes with Amazon Neptune Analytics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-graphover-datalakes-generally-available"
    "published": "2026-11-10 02:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Today, AWS is introducing an open-source solution with a local web UI that helps customers turn data lake records into graphs for analysis with Amazon Neptune Analytics. By projecting selected records and relationships, customers can investigate connections across tables and run graph algorithms without building their own ETL pipelines.</p> \n<p>For example, a customer could project accounts and transactions into a graph to explore how accounts are connected or identify communities that may warrant investigation. Doing this today often means writing queries to prepare node and relationship data, creating a Neptune Analytics graph, and managing the import. Customers may also need to build a selective projection so they do not load an entire dataset for a narrower question.</p> \n<p>The new UI brings those steps into single workflow. To run graph analytics over iceberg tables, customers select an Athena catalog and database, define a property graph using SQL/PGQ, and preview rows before import. The solution runs the projection queries through Athena, stages the selected data in Amazon S3, and imports it into Neptune Analytics. The UI helps customers manage the resulting graph. They can open the loaded graph in Graph Explorer to query and visualize relationships. <a href=\"https://github.com/awslabs/nx-neptune\"><b>[1]</b></a></p> \n<p>The UI runs locally and it is available in all regions where Amazon Neptune Analytics is available. To get started, see the <a href=\"https://github.com/awslabs/nx-neptune/blob/main/proxy/README.md\"><b>setup instructions</b></a>.</p>"
  "523b5053adf1065182a62b1a4950fc0e":
    "id": "523b5053adf1065182a62b1a4950fc0e"
    "title": "Amazon DocumentDB Serverless now provides up to 35% higher throughput"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/documentdb-serverless-platform-version-4/"
    "published": "2026-11-10 01:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Amazon DocumentDB Serverless now provides up to 35% higher throughput with the launch of platform version 4. Platform versions represent improvements in performance, scaling capabilities, or features, and are automatically managed at the cluster level.</p> \n<p>All new serverless clusters launch on the latest platform version available in your AWS Region. You can upgrade existing clusters on platform version 3 to platform version 4 by applying the serverless-platform-version-update pending maintenance action. This gives you control over when to apply the update, either immediately or during your next scheduled maintenance window. After you upgrade to a newer platform version, you can't downgrade to a previous version.<a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-serverless-how-it-works.html#docdb-serverless-scaling-capacity\"></a><a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-serverless-how-it-works.html#docdb-serverless-scaling-capacity\"></a></p> \n<p>You can view the platform version of a cluster in the AWS Management Console or through the ServerlessV2PlatformVersion field of the DescribeDBClusters API. For more information, see <a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-serverless-how-it-works.html#docdb-serverless-scaling-capacity\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon DocumentDB serverless scaling capacity</a> and <a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-serverless-managing.html#docdb-serverless-platform-version\" rel=\"noopener noreferrer\" target=\"_blank\">Checking and upgrading the platform version of a serverless cluster</a>.</p>"
  "4b41a987dca2a3032d59c17e8e11c88f":
    "id": "4b41a987dca2a3032d59c17e8e11c88f"
    "title": "Amazon Athena introduces system tables for observability, auditing, and usage analytics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/athena-system-tables/"
    "published": "2026-11-10 01:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p><a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a> now offers system tables which automatically capture your usage data and make it available for observability, usage analysis, and audit use cases. When you enable system tables, usage data is available within minutes of query completion across your workgroups and stored as service-managed, read-only Iceberg tables on <a href=\"https://aws.amazon.com/s3/features/tables/\">Amazon S3 Tables</a> with configurable retention. You can query it directly with Athena, while AWS manages the tables for you, including schema definition, partitioning, compaction, and snapshot maintenance, removing all operational burden.</p> \n<p>Athena provides usage data through APIs like GetQueryExecution, CloudWatch metrics, and CloudTrail logs. With this launch, usage data is also available as iceberg tables that you can search, filter, aggregate, and join directly without building or maintaining custom pipelines. Platform teams can query the query_executions table to build cost allocation dashboards that show data scanned by workgroup, by user, or by table using simple SQL statements, and without custom ETL. Additionally, the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/system-table-skills\">AWS Agent Toolkit</a> provides skills for querying system tables to surface usage patterns and optimization recommendations. Because the data is stored in the open Apache Iceberg format, you can also query it with <a href=\"https://duckdb.org/\">DuckDB</a>, <a href=\"https://aws.amazon.com/pm/redshift/?trk=de3518c5-eb66-4ef5-ab94-ec69c34b86df&amp;sc_channel=ps&amp;ef_id=CjwKCAjws_DTBhB_EiwAXZknGRt-CfJCeVl3UL127isQ9p0q7arv1kekRNZF_pd22P4m8ReyZkhvahoCNwYQAvD_BwE&amp;gads_camp=23522747487&amp;gads_ag=196433734207&amp;gads_ad=795876995213&amp;gads_kw=amazon%20redshift&amp;gads_matchtype=e&amp;gads_network=g&amp;gads_device=c&amp;gads_geo=1027744&amp;gad_campaignid=23522747487&amp;gbraid=0AAAAADjHtp9cwZBKiv30JXu5qrPDkKSyb&amp;gclid=CjwKCAjws_DTBhB_EiwAXZknGRt-CfJCeVl3UL127isQ9p0q7arv1kekRNZF_pd22P4m8ReyZkhvahoCNwYQAvD_BwE\">Amazon Redshift,</a> <a href=\"https://aws.amazon.com/emr/\">Amazon EMR</a> or any other Iceberg-compatible engine.</p> \n<p>Athena system tables are available in all AWS Regions where Athena and Amazon S3 Tables are available. To get started, enable system tables from the Athena console or API. To learn more, visit the Amazon Athena <a href=\"https://docs.aws.amazon.com/athena/latest/ug/athena-system-tables.html\">documentation </a>or the &nbsp;<a href=\"https://aws.amazon.com/blogs/big-data/amazon-athena-introduces-system-tables-for-query-execution-observability/\" style=\"background-color: rgb(255,255,255);\">blog</a>.</p>"
  "d5dee6029001a0c3dc369243060ed624":
    "id": "d5dee6029001a0c3dc369243060ed624"
    "title": "Claude Fable 5.2 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/claude-fable-5-2-aws/"
    "published": "2026-11-10 00:00:00"
    "fetched": "2026-11-10 10:51:35"
    "summary": "<p>Claude Fable 5.2 is now available on AWS and brings Anthropic's most capable generally available model for technical work&nbsp;to all customers. Fable 5.2 sets a new standard on the hardest projects in coding, math, and science, and Anthropic recommends it for fields like software engineering, scientific research, and finance, where judgment, iteration, and accuracy are critical. Claude Mythos 5.2, the same underlying model as Claude Fable 5.2 with its full cyber and bio capabilities retained for cybersecurity and biology research, is available through Anthropic’s verification programs.</p> \n<p>Claude Fable 5.2 can work for hours and up to days unattended, driving autonomous work and taking on bigger, more challenging projects. It takes on large, loosely defined engineering problems across multiple repositories and monorepos, tests its own work as it goes, and is more willing to question inherited conclusions, so it finds root causes previous Claude models miss. In Anthropic’s testing, it coordinated hundreds of subagents as a lead agent and flagged results that don't reproduce. Beyond coding, it develops new analytical methods for scientific research and brings frontier reasoning to quantitative finance.</p> \n<p>Anthropic has designated Fable 5.2 and Mythos 5.2 as covered models, which require data retention for safety monitoring. Until Enterprise Frontier Safeguards is available, eligible customers can use Fable 5.2 with zero data retention. Visit the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/abuse-detection.html\" rel=\"noopener noreferrer\" target=\"_blank\">abuse detection</a> page to learn more about details regarding data retention for these models.</p> \n<p>Customers have two ways to access Claude Fable 5.2: Amazon Bedrock and Claude Platform on AWS. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-fable-5-2.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability</a>, and <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/welcome.html\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Platform on AWS</a> documentation.&nbsp;</p>"
  "35600807757f57f16788c690e5577513":
    "id": "35600807757f57f16788c690e5577513"
    "title": "Amazon MWAA now supports DuckDB operators"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-mwaa-supports-duckdb-operators/"
    "published": "2026-11-10 03:00:00"
    "fetched": "2026-11-10 18:09:21"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (Amazon MWAA) now supports DuckDB operators. DuckDB is an embedded analytical database that lets customers perform data quality checks, summaries, and transformations on data from sources DuckDB supports, including Amazon S3.</p> \n<p>Native support is available for DuckDB on Amazon MWAA Provisioned environments running Apache Airflow 3.3.1. DuckDB comes preinstalled and preconfigured for AWS connections in the latest MWAA Airflow 3.3.1 update. After updating their MWAA environment to Airflow 3.3.1 and adding execution role access to their data stores, customers can start writing tasks with DuckDBExecuteQueryOperator with no additional setup.</p> \n<p>This feature is available in all AWS Regions where Amazon MWAA is available. For more information, see the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/get-started.html#regions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/samples-duckdb.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using DuckDB with Amazon MWAA</a> in the Amazon MWAA User Guide.</p>"
  "52e42111e1c3cdadbfaf4f146ba3fa88":
    "id": "52e42111e1c3cdadbfaf4f146ba3fa88"
    "title": "CloudWatch PromQL alarms now support EC2 and Application Auto Scaling"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cloudwatch-alarms-autoscaling-group-actions"
    "published": "2026-11-10 12:00:00"
    "fetched": "2026-11-11 02:26:41"
    "summary": "<p>Amazon CloudWatch alarms that use Prometheus Query Language (PromQL) can now trigger Amazon EC2 and Application Auto Scaling step and simple scaling policies. You can scale your EC2 Auto Scaling groups on CloudWatch OpenTelemetry metrics using the same kind of PromQL queries you use for dashboards and alerting.</p> \n<p> </p> \n<p>In this release, PromQL alarms also support EC2 Auto Scaling simple and step scaling policies. Target tracking is not currently a supported policy type for PromQL alarms. Teams moving to OpenTelemetry can scale capacity on the same metrics as the rest of their monitoring, instead of keeping separate classic metric alarms for scaling. For step scaling, how far the value is past the threshold in your PromQL query decides which step applies. The query must return a single series and compare it to a threshold.</p> \n<p> </p> \n<p>You can add EC2 Auto Scaling and Application Auto Scaling actions in the CloudWatch console when you create or edit an alarm, or with the PutMetricAlarm API, AWS CLI, AWS SDKs, or AWS CloudFormation. You can also use the PutMetricAlarm API, AWS CLI, AWS SDKs, or AWS CloudFormation.</p> \n<p>This feature is available in all AWS Regions where CloudWatch PromQL alarms are available. Standard CloudWatch alarm pricing applies. To get started, see &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-PromQL-Alarms.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using PromQL in alarms&nbsp;</a> and &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-actions.html\" rel=\"noopener noreferrer\" target=\"_blank\">Alarm actions&nbsp;</a> in the Amazon CloudWatch User Guide.</p>"
  "ed69791010d39fe548f6aa69fe67a90a":
    "id": "ed69791010d39fe548f6aa69fe67a90a"
    "title": "Amazon OpenSearch Service now lets you validate and roll back version upgrades"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-service/upgrades/"
    "published": "2026-11-10 11:30:00"
    "fetched": "2026-11-11 02:26:41"
    "summary": "<p>Amazon OpenSearch Service now supports clone-based upgrades, which let you validate a new OpenSearch version alongside your current one and cut over to it only when you're satisfied. If you find a problem, you can cancel before you cut over or roll back afterward. With clone-based upgrades, you can move to new versions with more confidence.</p> \n<p>When you start a clone-based upgrade, OpenSearch Service copies the data from your existing cluster (the primary cluster) to a second cluster running the new version (the cloned cluster). While the primary cluster keeps serving your workload, you can run the same search queries on both clusters and compare their performance using Amazon CloudWatch metrics. After you finish validating, you can cut over to the cloned cluster. If you keep the previous version for a retention period you choose, you can roll back to it at any time during that period. You can start and manage a clone-based upgrade from the AWS Management Console, the AWS CLI, or the OpenSearch Service APIs.</p> \n<p>Clone-based upgrades are available for domains running OpenSearch 1.1 or later, or Elasticsearch 7.10,&nbsp;in AWS Commercial Regions where Amazon OpenSearch Service is offered, except Asia Pacific (New Zealand), Asia Pacific (Taipei), Asia Pacific (Thailand), and Mexico (Central). For a complete list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Region Table</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/version-migration.html\" target=\"_blank\">Upgrading Amazon OpenSearch Service domains</a> in the Amazon OpenSearch Service Developer Guide. To get started, visit the <a href=\"https://aws.amazon.com/opensearch-service/\" target=\"_blank\">Amazon OpenSearch Service product page</a>.</p>"
  "e3b4301155a774a26ea5052ecfd37975":
    "id": "e3b4301155a774a26ea5052ecfd37975"
    "title": "Amazon ElastiCache Serverless now supports vector, full-text and hybrid searches plus aggregations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-elasticache-serverless-search-aggregations/"
    "published": "2026-11-10 17:00:00"
    "fetched": "2026-11-11 07:46:18"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache</a> Serverless for Valkey now supports vector, full-text, and hybrid search, along with aggregations. Applications searching live data often face a hard trade-off between latency and recall, along with delays before updates become searchable. With search on ElastiCache Serverless, applications can search data with latency as low as microseconds at up to 99% recall for vector search, while serving billions of queries per day. Updates are searchable in as little as microseconds, as soon as writes complete.</p> \n<p>Search on ElastiCache Serverless is ideal for latency-sensitive applications with unpredictable traffic and for teams that want to get started with search quickly. You can combine search types in a single query, tune recall as needed, and analyze results with server-side aggregations. Developers can give every agent, session, or task its own datastore for memory and context retrieval, so agents can experiment, fail, and retry without touching production or each other. Each datastore is ready in seconds, reachable over a <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Endpoints.html\" rel=\"noopener noreferrer\" target=\"_blank\">public endpoint</a> with no network setup, and billed only for what it uses, with zero infrastructure to manage. Applications can also power product discovery, recommendation systems, and retrieval-augmented generation (RAG).</p> \n<p>Search is available on ElastiCache Serverless for Valkey in all commercial AWS Regions, AWS GovCloud (US) Regions, and the AWS European Sovereign Cloud Region on ElastiCache version 9 for Valkey. Valkey is the most permissive open source and vendor-neutral alternative to Redis and the recommended engine for ElastiCache. To get started, create a new serverless cache or upgrade an existing one to Valkey 9 using the AWS Management Console, AWS SDK, or AWS CLI. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/search.html\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache documentation</a>. For pricing, see the&nbsp;<a href=\"https://aws.amazon.com/elasticache/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">ElastiCache pricing page</a>.</p>"
  "23e2f856c93ba219ef4c4dbe93d35d9c":
    "id": "23e2f856c93ba219ef4c4dbe93d35d9c"
    "title": "Amazon S3 Access Grants now support listing grants across multiple AWS accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-access-grants-list-across-regions/"
    "published": "2026-11-10 23:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Amazon S3 Access Grants can now discover and list all your grants across multiple AWS accounts with a single API call, eliminating the need to query each account separately. A single <i>ListCallerAccessGrants</i> call returns grants from your own S3 Access Grants instance and every instance shared with you, giving you a complete view of the S3 data you can access.</p> \n<p>By setting the new <i>InstanceScope</i> parameter to <i>ALL</i> in your <i>ListCallerAccessGrants</i> request, S3 Access Grants queries every instance shared with you through AWS Resource Access Manager (AWS RAM) and returns all the grants in one combined response, each identifying the account that owns it. Additionally, when you request credentials with <i>GetDataAccess</i> for an S3 path and set <i>InstanceScope</i> to <i>ALL</i>, S3 Access Grants locates the owning account for you, routes the request to its instance, and returns credentials for the matching grant.</p> \n<p>This capability is now available in all AWS Regions where S3 Access Grants is available, at no additional cost. You can use the AWS SDK, API, or CLI to list and access grants across accounts. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/access-grants/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Access Grants overview page</a> and the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-grants-list-grants.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 documentation</a>.</p>"
  "1f81006a0a4da0ca51dfbbbb289dd891":
    "id": "1f81006a0a4da0ca51dfbbbb289dd891"
    "title": "Amazon Bedrock adds bedrock-runtime endpoint support for Daybreak models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/openai-gpt-daybreak-on-amazon-bedrock-runtime/"
    "published": "2026-11-10 19:14:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Eligible customers can now access OpenAI’s specialized cybersecurity models Daybreak Red: GPT-5.6 Cyber and Daybreak Blue: GPT-5.6 Sol through the bedrock-runtime endpoint on Amazon Bedrock.<br /> <br /> Daybreak Blue is the starting point for most security teams across defensive workflows, including vulnerability discovery, detection engineering, and incident response. Daybreak Red is designed for advanced, authorized tasks such as vulnerability research, exploit reproduction, and mitigation development. For these tasks, a lower refusal threshold, matched by stronger identity verification, monitoring, and access controls, improves the speed and depth of an investigation. Your inference data is not used for model training, and neither model requires you to opt in to sharing your data with OpenAI.<br /> <br /> On the bedrock-runtime endpoint, the models are available through US and Global cross-Region inference (CRIS) profiles. Access to the models requires enrollment in <a href=\"https://openai.com/form/enterprise-trusted-access-for-cyber/\">Daybreak access</a> from OpenAI. To enroll, contact OpenAI or reach out to your AWS account team for guidance on eligibility. Once approved, work with your account team to request access on AWS. For regional availability through the bedrock-mantle endpoint and more information, view the<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\"> documentation.</a></p>"
  "df5d8e2259063db9b96d5ae0dd5ef2af":
    "id": "df5d8e2259063db9b96d5ae0dd5ef2af"
    "title": "Amazon S3 Tables now support S3 server access logging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-tables-server-access-logging/"
    "published": "2026-11-10 17:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Amazon S3 Tables now support server access logging, providing you detailed records of the requests made to your table buckets. You can now track table operations, namespace management, and data access to support security audits, access analysis, and cost attribution. Log delivery is available at no additional cost, and you pay only for the storage of the log files.</p> \n<p>When you enable server access logging on a table bucket, S3 delivers logs for requests to all tables and namespaces in that bucket to a general purpose bucket in the same account and Region. Each record captures the requester, operation, table name, namespace, response status, and request timing, using the same space-delimited format as S3 server access logs for general purpose buckets. This lets you reuse your existing log analysis workflows to query S3 Table logs with any query engine of your choice such as Amazon Athena and DuckDB.</p> \n<p>Server access logging for S3 Tables is available in all <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-regions-quotas.html#s3-tables-regions\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where S3 Tables are available. You can enable it using the AWS Management Console, AWS CLI, AWS SDKs, or AWS CloudFormation. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/tables/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables overview page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-server-logs\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables server access logging</a> in the Amazon S3 User Guide.</p>"
  "bb20e4c6d7985dee7f5d52afa48b7ae5":
    "id": "bb20e4c6d7985dee7f5d52afa48b7ae5"
    "title": "AWS Marketplace SaaS free trials now convert automatically to paid subscriptions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace-free-trial-conversion/"
    "published": "2026-11-10 17:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Today,&nbsp;<a href=\"https://aws.amazon.com/marketplace\">AWS Marketplace</a> announces that free trials of usage-based software as a service (SaaS) products can now convert automatically to paid subscriptions. When a free trial ends, the buyer's subscription continues at the seller's usage-based pricing, so buyers pay only for what they use after the trial. This helps sellers turn more trial users into paying customers. Buyers get a simple way to evaluate software before they buy, with no new subscription and no interruption in access.</p> \n<p>Sellers can offer a free trial of 7 to 90 days that converts to a paid subscription at the price they set. For example, a data team can try an analytics product for 30 days and, if it meets their needs, keep using it after the trial ends. Buyers see the trial length, conversion date, and pricing before they subscribe. They receive reminder emails before the trial converts and can cancel at any time before conversion at no charge.</p> \n<p>Sellers can create a free trial in AWS Partner Central, or update an existing free trial offer to convert automatically. This capability is available for public offers in all AWS Regions where AWS Marketplace is available.</p> \n<p>To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/saas-free-trials.html\">AWS Marketplace Seller Guide</a> and the <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/saas-free-trials.html\">AWS Marketplace Buyer Guide</a>.</p>"
  "21a9754dacc6e00236db55bc847de9e1":
    "id": "21a9754dacc6e00236db55bc847de9e1"
    "title": "AWS Network Firewall launches next-generation firewall policy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-firewall-launches-ngfw-policy/"
    "published": "2026-11-10 17:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Today, AWS announces next-generation firewall (NGFW) policy for AWS Network Firewall, a new policy model that provides security teams with a simpler policy structure and increased rule capacity. AWS Network Firewall is a managed network security service that protects your Amazon VPCs with access control and threat detection.</p>\n<p>The new policy model strengthens your security posture by layering firewall and IPS protections instead of combining them, which also makes policies easier to manage. You author firewall rules that enforce deny-by-default access control, such as allowing traffic only to approved domains. For IPS rules, you can use managed rule groups from AWS or AWS Marketplace partners, which update automatically as new threats emerge. You can also create your own custom IPS rule groups. Firewall and IPS rules each have their own capacity, so you no longer trade one off against the other. For rules you don't share across policies, you can create embedded rule groups that draw capacity on demand without pre-allocation. With NGFW policy, all rules are stateful and evaluate with full connection context, for consistent, predictable traffic handling. Your existing policies continue to operate without changes, and IPS rules remain backward compatible.</p>\n<p>NGFW policy is available at no additional charge in all commercial AWS Regions and AWS GovCloud (US) Regions. For a full list of supported regions, visit the <a href=\"https://builder.aws.com/build/capabilities/explore?f=eJxVirEKg0AQBX9FXq1FWiGFjZAmRVKkcC0uusji4cneqYj477lcEUg3b94c8Gy5C9w_eBA3eZRoCIsv2PhQXAgt8l9TrUaseYuVsMewmvbsT-WY1c2sYa_FBtbYHIRAKJs2J8wRCE4JcQxfG98xSc-6Sse3Pn0uuWviNXH1emZ3DpvTMatFeTPWEs72xPkBR_VAow&amp;tab=service-feature&amp;refid=d08148e0-c462-4c19-ae34-467de69e31c6\" target=\"_blank\">AWS Capabilities by Region page</a>.</p>\n<p>To learn more, see the AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\">product page</a> and <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-policies-v2.html\" target=\"_blank\">documentation</a>.</p>"
  "0ad0d8476f031ed8c79f75eb8a3b83df":
    "id": "0ad0d8476f031ed8c79f75eb8a3b83df"
    "title": "Amazon GameLift Servers now supports Game Session Placement Insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/gamelift-game-session-insights/"
    "published": "2026-11-10 17:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Amazon GameLift Servers now offers Game Session Placement Insights, delivering detailed, per-placement diagnostic logs for game session queue routing. Amazon GameLift Servers routes game session placement requests through queues that evaluate multiple fleet locations based on latency and cost factors. This feature is designed for game developers and engineers who need greater transparency into how their game session queues operate.</p>\n<p>Previously, developers had limited visibility into why placements succeeded, failed, or timed out, making queue optimization difficult. Game Session Placement Insights captures which fleet locations were evaluated, the player latency and cost factors that influenced routing decisions, and the final placement outcome for every placement. This enables teams to identify patterns such as consistently slow placements, repeated failures, or sessions landing in unexpected locations, and to tune their queues to improve the overall player experience.</p>\n<p>You can enable this feature per queue and deliver logs to Amazon CloudWatch Logs, Amazon S3, and Amazon Data Firehose. Game Session Placement Insights is available in all supported Amazon GameLift Servers regions.</p>\n<p>To learn more about Game Session Placement Insights and how to get started, visit the <a href=\"https://docs.aws.amazon.com/gameliftservers/latest/developerguide/queues-placement-insights.html\" target=\"_blank\">Amazon GameLift Servers documentation</a>.</p>"
  "08cce15c12f9dc751fd07aacedcea384":
    "id": "08cce15c12f9dc751fd07aacedcea384"
    "title": "Amazon DocumentDB (with MongoDB compatibility) now supports post-quantum TLS, wildcard indexes, and $unionWith in version 8.0.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-documentdb-8-0-3/"
    "published": "2026-11-10 09:00:00"
    "fetched": "2026-11-11 11:29:35"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) 8.0.3 adds hybrid post-quantum key exchange for TLS, wildcard indexes, the $unionWith aggregation stage, and new change stream events. Post-quantum TLS protects data in transit from traffic that is recorded today and decrypted later with a quantum computer. The new MongoDB APIs let you move more MongoDB workloads to Amazon DocumentDB without changing application code.</p> \n<p>What's new in 8.0.3:</p> \n<ul> \n <li><p>Post-quantum TLS: TLS 1.3 connections use hybrid key exchange based on the Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM) when the client supports it. Other clients keep using classical key exchange. Two new Amazon CloudWatch metrics, TLSHandshakesClassical and TLSHandshakesPostQuantum, count the handshakes of each type.</p> </li> \n</ul> \n<ul> \n <li><p>Wildcard indexes: index every field, or every field under a path, to query documents with dynamic schemas.</p> </li> \n</ul> \n<ul> \n <li><p>Aggregation: $unionWith combines results from multiple collections in one pipeline. $lookup and $graphLookup work in views, and correlated $lookup sub-pipelines accept $unionWith and $facet.</p> </li> \n</ul> \n<ul> \n <li><p>Change streams: dropIndex() and dropIndexes() now emit dropIndexes events.</p> </li> \n</ul> \n<ul> \n <li><p>Compression metrics: collStats and stats() report per-collection input bytes, output bytes, and compression ratio.</p> </li> \n</ul> \n<p>Amazon DocumentDB 8.0.3 is available in all AWS Regions where Amazon DocumentDB is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/\" target=\"_blank\">Amazon DocumentDB Developer Guide</a>.</p>"
"last_updated": "2026-11-11 11:29:35 JST"
