    "title": "How DeepL keeps closest-exit routing during maintenance with AWS Cloud WAN"
    "link": "https://aws.amazon.com/blogs/architecture/how-deepl-keeps-closest-exit-routing-during-maintenance-with-aws-cloud-wan/"
    "published": "2026-11-10 05:15:09"
    "fetched": "2026-11-10 10:51:38"
    "summary": "DeepL runs a multi-Region hybrid network across multiple AWS Regions and AWS Direct Connect locations. See how DeepL drains a single Direct Connect link for planned maintenance without packet loss or cross-Region rerouting, using AWS Cloud WAN and an on-premises AS_PATH prepend so every other Region keeps its closest-exit routing."
