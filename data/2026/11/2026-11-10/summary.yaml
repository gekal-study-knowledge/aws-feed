"overview": |
  この日は Claude Fable 5.2 の AWS 提供と Amazon Quick の AWS Quick への改称、AgentCore まわりの拡充が中心でした。Claude Fable 5.2 と Claude Mythos 5.2 が Amazon Bedrock と Claude Platform on AWS で使えるようになり、Fable 5.2 は GovCloud (US) でも提供、Mythos 5.2 は GovCloud (US) の対象顧客に提供されます。Amazon Quick は AWS Quick に名称を変え、初のブランドキャンペーンや skills と agents の仕組みも紹介されました。AgentCore では Web Search API が一般提供となり、Managed Knowledge Base の single-shot RAG、Cedar を採用した AgentCore Policy、Memory へのメモリポイズニング対策、Runtime V2 の国内事例が取り上げられています。セキュリティでは、STS と IAM outbound identity federation によるパーティション間フェデレーションが加わり、AWS ParallelCluster CLI のログエクスポートのパストラバーサル CVE-2026-124033 と、Amazon Braket SDK の CVE-2026-124034 / CVE-2026-124035 が公表されました。データ分析では Athena のシステムテーブル (query_executions)、Glue の SaaS 向けネイティブコネクター 100 種、DocumentDB Serverless のスループット最大 35% 向上 (プラットフォームバージョン 4)、MWAA の DuckDB オペレーター、Neptune Analytics 向けオープンソース UI、CloudWatch Logs のアカウントレベル保持ポリシーが発表されました。ほかに SageMaker JumpStart の NVIDIA Nemotron 3.5 Super VL や、re:Invent 2026 (11 月 30 日〜12 月 4 日) の分野別ガイドもありました。
