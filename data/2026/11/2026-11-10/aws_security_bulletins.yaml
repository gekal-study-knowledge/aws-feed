    "title": "CVE-2026-124034, CVE-2026-124035: Issues with Amazon Braket SDK"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-175-aws/"
    "published": "2026-11-10 07:42:12"
    "fetched": "2026-11-10 10:51:37"
    "summary": "<p><b>Bulletin ID:</b> 2026-175-AWS<br /> <b>Publication Date:</b> 11/09/2026 14:15 PM PST</p> \n<p><b>Description:</b></p> \n<p>Amazon Braket SDK is an open source Python library that customers use to run quantum tasks and hybrid jobs on Amazon Braket.</p> \n<p>We identified CVE-2026-124034, an issue in the local hybrid job input data download in the Amazon Braket SDK. And we identified CVE-2026-124035, an issue in the error mitigation schema validation in Amazon Braket Schemas, the library the Amazon Braket SDK uses to parse quantum task results.</p> \n<p><b>Impacted versions:</b><br /> - amazon-braket-sdk &gt;= 1.10.0 AND &lt; 1.127.7<br /> - amazon-braket-schemas &gt;= 1.17.0 AND &lt; 1.32.2</p> \n<p><b>Refer to the article for the most up-to-date and complete information.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-175-aws/\">Read this article</a></p>"
  "31cba51eb26a4ede68ed92f6395b7532":
    "id": "31cba51eb26a4ede68ed92f6395b7532"
    "title": "CVE-2026-124033 - Relative path traversal in the log export commands in AWS ParallelCluster CLI"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-174-aws/"
    "published": "2026-11-10 06:12:17"
    "fetched": "2026-11-10 10:51:37"
    "summary": "<p><b>Bulletin ID:</b> 2026-174-AWS<br /> <b>Publication Date:</b> 11/09/2026 13:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>AWS ParallelCluster CLI is an open source command line tool, distributed on PyPI as aws-parallelcluster. We identified CVE-2026-124033, an issue where the export-cluster-logs and export-image-logs commands in the AWS ParallelCluster CLI before version 3.16.0 contain a relative path traversal issue. An authenticated remote user with write access to the log export Amazon S3 bucket could use a crafted S3 object key to write files outside the intended export directory on the machine running the command.</p> \n<p><b>Impacted versions:</b> &gt;= 3.0.0 AND &lt; 3.16.0</p> \n<p><b>Refer to the article for the most up-to-date and complete information.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-174-aws/\">Read this article</a></p>"
