    "title": "第 1 回: 電子カルテベンダーのためのガバメントクラウド入門 — ガバクラ・公共 SaaS を理解する"
    "link": "https://aws.amazon.com/jp/blogs/news/emr-govcloud-saas-japan/"
    "published": "2026-11-10 11:40:19"
    "fetched": "2026-11-10 18:09:22"
    "summary": "みなさん、こんにちは。AWS ジャパン 執行役員 パブリックセクター技術統括本部長の瀧澤です。 電子カルテベン […]"
  "573265ed8392e56ee7ae149bf59f9498":
    "id": "573265ed8392e56ee7ae149bf59f9498"
    "title": "AMS Trusted Remediator でコスト最適化とセキュリティ修復を自動化する"
    "link": "https://aws.amazon.com/jp/blogs/news/optimize-cost-and-automate-security-remediation-with-ams-trusted-remediator/"
    "published": "2026-11-10 11:02:53"
    "fetched": "2026-11-10 18:09:22"
    "summary": "Amazon Web Services (AWS) を活用している組織は、セキュリティとコスト最適化に関する推奨事項を毎月数千件も受け取ります。しかし、優先順位の問題やリソースの制約からその多くは実施されないままとなっています。AWS Managed Services (AMS) の Trusted Remediator はこの課題を解決するため、複数の AWS アカウントにわたる修復を自動化し、手作業による修復にかかる時間と手間を大幅に減らします。あらかじめ用意された修復ライブラリは、116 件の推奨事項に対応しており、新しい機能が加わるたびに増え続けています。これらの自動化は、セキュリティ、コスト最適化、運用上の優秀性の各分野にわたります。企業はセキュリティホールを効率よくふさぎ、コストを最適化し、コンプライアンスを維持しながら AWS のベストプラクティスの変化にも柔軟に対応できます。"
  "be7f190ae9abbf2beb64c8c5e3351805":
    "id": "be7f190ae9abbf2beb64c8c5e3351805"
    "title": "Amazon Athena がクエリ実行のオブザーバビリティを高めるシステムテーブルを導入"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-athena-introduces-system-tables-for-query-execution-observability/"
    "published": "2026-11-10 03:06:44"
    "fetched": "2026-11-10 18:09:22"
    "summary": "Amazon Athena にシステムテーブルが加わり、第一弾として query_executions の提供が始まりました。すべてのワークグループで実行したクエリの記録が Amazon S3 Tables 上の Apache Iceberg テーブルに自動で保存され、Athena から直接クエリできます。本記事では、システムテーブルの概要と始め方に加え、コストの配分、パフォーマンス分析、監査、運用監視、キャパシティ予約の最適化に使えるクエリの例を紹介します。"
"last_updated": "2026-11-10 18:09:22 JST"
