  "6c1be58e2dc43b0a6d0d6f31f1d16e34":
    "id": "6c1be58e2dc43b0a6d0d6f31f1d16e34"
    "title": "AWS 上の Microsoft ワークロード: re:Invent 2026 完全ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/microsoft-workloads-on-aws-your-complete-reinvent-2026-guide/"
    "published": "2026-11-10 10:14:18"
    "fetched": "2026-11-10 10:51:36"
    "summary": "AWS re:Invent 2026 では、AWS 上で Microsoft ワークロードを実行しているお客様向けに充実したセッションを用意しています。AWS Transform と Kiro によるエージェンティック AI での .NET と SQL Server のモダナイゼーション、ライセンスコストの削減、VMware からの移行、レジリエンスの高い運用まで、ぜひ参加していただきたいセッションを紹介します。"
  "49b1abbc321275593c84c0cc714a6797":
    "id": "49b1abbc321275593c84c0cc714a6797"
    "title": "【開催報告】ランサムウェアに備える「防御」「復旧」「説明責任」— AI エージェント時代に見直す対策と次の一歩"
    "link": "https://aws.amazon.com/jp/blogs/news/ransomware-security-seminar-oct-2026/"
    "published": "2026-11-10 10:03:44"
    "fetched": "2026-11-10 10:51:36"
    "summary": "2026 年 10 月 26 日に開催したセキュリティセミナーの開催報告です。「防御・検知」「説明責任」「復旧」の 3 つの軸で、AWS とパートナー 5 社のセッション内容と、軸ごとにまず着手したい対策をまとめました。"
  "b322337978681a8e1b8a105a24b65514":
    "id": "b322337978681a8e1b8a105a24b65514"
    "title": "インフラストラクチャの移行: AWS re:Invent 2026 完全ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/infrastructure-migrations-your-complete-aws-reinvent-2026-guide/"
    "published": "2026-11-10 09:58:06"
    "fetched": "2026-11-10 10:51:36"
    "summary": "AWS re:Invent 2026 (11 月 30 日〜12 月 4 日、ラスベガス) では、AWS Transform のエージェント型 AI が移行ライフサイクル全体をどのように自動化するかを紹介するセッションが多数用意されています。本記事では、移行戦略とお客様事例、ビジネスケースの構築、AWS Transform と Amazon EVS のハンズオンセッション、AWS Outposts への移行、そして移行後のモダナイゼーションまで、インフラ移行に関するセッションを厳選して紹介します。"
  "f0bf5e4107b5ec7d1e16b3f5c2e61ee5":
    "id": "f0bf5e4107b5ec7d1e16b3f5c2e61ee5"
    "title": "Amazon Bedrock を活用したアプリケーションの設計に信頼と安全性を組み込む"
    "link": "https://aws.amazon.com/jp/blogs/news/designing-trust-and-safety-into-amazon-bedrock-powered-applications/"
    "published": "2026-11-10 09:18:41"
    "fetched": "2026-11-10 10:51:36"
    "summary": "Amazon Bedrock を活用した生成 AI アプリケーションでは、設計段階から安全性を組み込むことが重要です。本記事では、責任ある AI の主要な側面と、設計と開発、デプロイ、運用の各フェーズで安全性を確保するための考え方を解説します。さらに、Amazon CloudWatch による監視や Amazon Bedrock Guardrails による保護措置のカスタマイズなど、不正使用を防止する方法を紹介します。AWS Trust &amp; Safety チームから不正使用の報告を受けた際の対応プロセスも説明します。"
  "4ea44ead96b9f851a0f7e729790c07f0":
    "id": "4ea44ead96b9f851a0f7e729790c07f0"
    "title": "Amazon Bedrock AgentCore Policy がエージェンティックワークフローの保護に Cedar を採用した理由"
    "link": "https://aws.amazon.com/jp/blogs/news/why-policy-in-amazon-bedrock-agentcore-chose-cedar-for-securing-agentic-workflows/"
    "published": "2026-11-10 09:09:29"
    "fetched": "2026-11-10 10:51:36"
    "summary": "AI エージェントの中核にある大規模言語モデル (LLM) は非決定論的で、ハルシネーションやプロンプトインジェクションのリスクがあります。本記事では、LLM を信頼できないアクターとして扱う考え方を説明します。そのうえで、Amazon Bedrock AgentCore Gateway でツール呼び出しを認可制御する AgentCore Policy が Cedar を採用した理由を解説します。可読性、決定論的な動作、自動推論による分析可能性を活かして、ニューロシンボリック AI でポリシーを作成し、Cedar Analysis で論理エラーや競合を検出する仕組みも紹介します。"
  "0a6c21850d78257568d75d44d236bc6d":
    "id": "0a6c21850d78257568d75d44d236bc6d"
    "title": "国内大手製造業のグローバル製品サポートを支える Amazon Bedrock AgentCore Runtime V2"
    "link": "https://aws.amazon.com/jp/blogs/news/japan-customer-usecase-bedrock-agentcore-runtime-v2/"
    "published": "2026-11-10 08:51:55"
    "fetched": "2026-11-10 10:51:36"
    "summary": "30 以上の言語に対応する製品サポートチャットを Amazon Bedrock AgentCore で実現した、国内大手製造業の事例です。Runtime V2 による起動の高速化、会話文脈の保持、回答品質の評価の工夫を紹介します。"
  "df489ac99db00bec88d2ff50eda6d735":
    "id": "df489ac99db00bec88d2ff50eda6d735"
    "title": "AWS Nitro Sandboxes: Amazon EKS で実現するハードウェア強制型ワークロード分離"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-nitro-sandboxes-hardware-enforced-workload-isolation-on-amazon-eks/"
    "published": "2026-11-10 13:22:48"
    "fetched": "2026-11-10 18:09:22"
    "summary": "Amazon Elastic Kubernetes Service (Amazon EKS) 向けに AWS Nitro Sandboxes の提供を開始しました。サンドボックス化されたポッドは AWS Nitro System を基盤とする専用の軽量 VM で実行されるため、ポッドごとにハードウェアベースのセキュリティ境界を設けられます。EKS Auto Mode ではポッド仕様を 1 行変更するだけで有効にでき、分離モードと機密モードを選べます。AI エージェント、マルチテナント SaaS、規制対象のワークロードを安全かつ効率的に実行する方法を、AI コーディングエージェントの実行例とともに紹介します。"
