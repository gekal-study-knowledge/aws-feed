  "8c1822b2c02812b262613168be914472":
    "id": "8c1822b2c02812b262613168be914472"
    "title": "Modernizing mainframe Assembler to Java using Amazon Bedrock and AWS Transform"
    "link": "https://aws.amazon.com/blogs/machine-learning/modernizing-mainframe-assembler-to-java-using-amazon-bedrock-and-aws-transform/"
    "published": "2026-11-17 02:29:29"
    "fetched": "2026-11-17 02:51:50"
    "summary": "Legacy mainframe Assembler applications are costly to maintain and hard to staff. This post presents a multi-stage, AI-powered methodology using Amazon Bedrock, Kiro IDE, and AWS Transform to extract business rules, convert Assembler through an intermediate COBOL stage, and deploy modernized Java Spring Boot applications on AWS."
  "2461b10882613fb52582e673a58f9268":
    "id": "2461b10882613fb52582e673a58f9268"
    "title": "Novo Nordisk modernizes manufacturing process documents with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/novo-nordisk-modernizes-manufacturing-process-documents-with-amazon-bedrock-agentcore/"
    "published": "2026-11-17 02:04:11"
    "fetched": "2026-11-17 02:51:50"
    "summary": "Novo Nordisk's Manufacturing Technology team within the Tablet area team built a process-intelligence assistant on Amazon Bedrock AgentCore, using a GraphRAG architecture that pairs a knowledge graph in Amazon Neptune with hybrid search in Amazon OpenSearch Serverless to turn millions of controlled manufacturing documents into grounded, cited answers."
  "c5177c548039f17261a4c32958bd48a9":
    "id": "c5177c548039f17261a4c32958bd48a9"
    "title": "Get answers from tables with tabular search in Amazon Bedrock Managed Knowledge Base"
    "link": "https://aws.amazon.com/blogs/machine-learning/get-answers-from-tables-with-tabular-search-in-amazon-bedrock-managed-knowledge-base/"
    "published": "2026-11-17 01:12:16"
    "fetched": "2026-11-17 02:51:50"
    "summary": "Amazon Bedrock Managed Knowledge Base now supports tabular search, so agentic retrieval can answer questions over CSV, XLSX, and XLS files. It looks up values and runs calculations across every relevant row, then combines the results with facts from related documents to answer multi-step analytical questions."
  "18a9f921d2c4bcf69a0829c8c1ce3136":
    "id": "18a9f921d2c4bcf69a0829c8c1ce3136"
    "title": "Best practices for writing Denied Topics in Amazon Bedrock Guardrails"
    "link": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-writing-denied-topics-in-amazon-bedrock-guardrails/"
    "published": "2026-11-17 00:48:01"
    "fetched": "2026-11-17 02:51:50"
    "summary": "With Denied Topics in Amazon Bedrock Guardrails, you block a content category by describing it in plain language, and the guardrail matches by meaning rather than keyword, which can block more than you intend. This post presents eight best practices for writing a topic precisely enough that the guardrail blocks what you mean and passes what you don't."
  "3984a5a3822ce9f436584adeb48558f7":
    "id": "3984a5a3822ce9f436584adeb48558f7"
    "title": "Customize answers per tenant in Amazon Bedrock Managed Knowledge Base"
    "link": "https://aws.amazon.com/blogs/machine-learning/customize-answers-per-tenant-in-amazon-bedrock-managed-knowledge-base/"
    "published": "2026-11-17 00:46:28"
    "fetched": "2026-11-17 02:51:50"
    "summary": "Retrieval instructions in Amazon Bedrock Managed Knowledge Base set the voice, format, retrieval guidance, and answer policy for each tenant on shared knowledge bases. This post shows how to give each tenant its own answers, keep tenant data apart with metadata filters, scope access with IAM tags, and roll out changes one tenant at a time."
  "bdb95ef104ae888d27ea44ac9c194f45":
    "id": "bdb95ef104ae888d27ea44ac9c194f45"
    "title": "Use prompt caching with open-weight models on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/use-prompt-caching-with-open-weight-models-on-amazon-bedrock/"
    "published": "2026-11-17 00:42:41"
    "fetched": "2026-11-17 02:51:50"
    "summary": "Many generative AI applications resend the same long context on every request. Prompt caching lets open-weight models on Amazon Bedrock reuse it to reduce input cost and latency. This post shows implicit and explicit caching through the Chat Completions API and applies caching to an OpenCode coding agent session."
"last_updated": "2026-11-17 02:51:50 JST"
