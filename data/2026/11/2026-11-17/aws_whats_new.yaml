"entries":
  "5b7bf77cd984ebab1ec6a55b47eba107":
    "id": "5b7bf77cd984ebab1ec6a55b47eba107"
    "title": "Amazon ECR now replicates image deletions across regions and accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/replication-deletes-amazon-ecr"
    "published": "2026-11-17 07:07:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Amazon Elastic Container Registry (Amazon ECR) now supports replicating image deletions and tag removals to your replication destinations. Previously, ECR replication copied images to destination regions and accounts but did not replicate deletions, requiring you to manage deletions separately in each location. With replication of deletes, your destination repositories stay consistent with the source automatically.</p> \n<p>Teams running multi-region or multi-account architectures no longer need to script or manually track image cleanup across every destination. When you delete an image or remove a tag in your source registry, whether directly or through a lifecycle policy, ECR propagates that deletion to each destination in the replication rule. Replicated deletions emit EventBridge events and are recorded in CloudTrail, so you have the same visibility into deletions as you do for image pushes.</p> \n<p>Replication of deletes is available in all AWS Regions where Amazon ECR is available, at no additional cost. To get started, update your replication configuration in the Amazon ECR console or AWS CLI. For more information, see the <a href=\"https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication-delete.html\">Amazon ECR User Guide</a>.</p>"
  "3f7fbc84e8cf9e955b56279306b2d418":
    "id": "3f7fbc84e8cf9e955b56279306b2d418"
    "title": "Amazon EBS now supports associating additional KMS keys with snapshots"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/ebs-snapshots-associate-kms-keys/"
    "published": "2026-11-17 07:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<div>\n <p>Amazon Elastic Block Store (EBS) now supports associating additional AWS Key Management Service (KMS) keys with EBS snapshots. This new capability enables you to share and copy encrypted snapshots across accounts without first re-encrypting them, simplifying your disaster recovery and backup workflows.</p> \n</div> \n<div>\n <p>Customers use EBS snapshots as durable, point-in-time backups of EBS volumes. By associating an additional customer-managed KMS key (CMK) with a snapshot encrypted with an AWS managed key (AMK), for example, you enable cross-account sharing for that snapshot without re-encrypting its data. This feature accelerates your disaster recovery workflows and enhances operational efficiency for enterprise backup administrators and disaster recovery teams.</p> \n</div> \n<div>\n <p>Support for associating additional KMS keys with Amazon EBS snapshots is available in all AWS commercial, China, AWS GovCloud (US), and AWS European Sovereign Cloud (Germany) Regions, plus AWS Local Zones and AWS Outposts. You can access this capability through the AWS Console, AWS Command Line Interface (CLI), and AWS SDKs. To learn more, see the <a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/associated-kms-keys.html\" target=\"_blank\">Amazon EBS documentation</a>.</p> \n</div>"
  "f4950f63789054148e896cedac750328":
    "id": "f4950f63789054148e896cedac750328"
    "title": "Amazon S3 Vectors now supports hybrid search combining vector and full text for more relevant search results"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/s3-vectors-hybrid-search/"
    "published": "2026-11-17 06:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Amazon S3 Vectors now supports hybrid search that combines vector similarity search with full-text search within a single query.&nbsp;By combining semantic meaning and exact term matching into a single ranked list of results, hybrid search captures both intent and precise terms for retrieval-augmented generation (RAG), agent memory, and search applications. This can deliver more relevant ranked results than either method alone. Hybrid search works with the same S3 Vectors APIs and maintains subsecond latency for infrequent queries and latency around 100 milliseconds or less for frequent queries.</p> \n<p>S3 Vectors is designed to provide the same elasticity, durability, and availability as Amazon S3, and it reduces the total costs of storing and querying vectors by up to 90% compared to alternative vector solutions. With hybrid search, customers can now store the data that they want to make full-text searchable alongside the vectors. Customers write data with the PutVectors API as they do today and include the searchable text as another metadata field. S3 Vectors then automatically indexes that field for full-text search with BM25 relevance scoring. By default, S3 Vectors uses a language-agnostic text analyzer to index this data which works across most languages, and customers can optionally select a language-specific analyzer for more accurate language-aware matching. To perform a hybrid query, customers send their query text strings alongside their query vector in a single QueryVectors call; S3 Vectors runs both a vector search and a full-text search, fuses the two with Reciprocal Rank Fusion (RRF), and returns a single ranked list of the top K requested results. Customers can also run full-text and vector queries separately to apply own ranking logic, search across multiple text fields in a single query, and enable full-text search on existing data in place.</p> \n<p>Hybrid search is available today in all commercial AWS Regions where Amazon S3 Vectors is available, and in the AWS China Regions. To get started, use the AWS CLI, AWS SDKs, or the Amazon S3 console. To learn more, visit the Amazon S3 Vectors <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-hybrid-search.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, and the Amazon S3 <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a> for pricing.</p>"
  "9b2012e06bdbb4997b9a981207fa83ab":
    "id": "9b2012e06bdbb4997b9a981207fa83ab"
    "title": "Amazon Redshift now supports multi-statement transactions, conflict resolution, and time travel for Apache Iceberg"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/redshift-time-travel-multi-statement"
    "published": "2026-11-17 05:30:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Amazon Redshift now supports multi-statement transactions, automatic write-conflict resolution, and time travel for Apache Iceberg tables. You can run multi-step, concurrent transformation pipelines directly on Iceberg tables and audit the results, with the transaction semantics you expect from a data warehouse. This helps anyone writing to Iceberg tables at production scale. Batch jobs get all-or-nothing commits across multiple steps. Streaming and scheduled jobs can write to the same tables at the same time. Analysts, auditors, and AI agents can query a table as it existed at any point in time.</p> \n<p>With multi-statement transactions, you group several statements in a single BEGIN…COMMIT statement and publish them as one atomic Iceberg snapshot. This means a multi-step load such as a MERGE followed by a DELETE, can be commited together as one atomic operation, are never queryable in a half-applied state, and roll back cleanly if there's a failure. Automatic conflict resolution lets concurrent writes, such as streaming inserts alongside scheduled deletes, write to the same table and commit together when their changes don't overlap, instead of failing and retrying. Time travel lets you query a table as it existed at a past point in time with AS OF TIMESTAMP. You can use it to reproduce reports, audit changes, or recover from a bad write without keeping extra copies. These capabilities are available in all AWS commercial Regions for Amazon Redshift’s provisioned RG or serverless clusters that are writing to or querying Iceberg tables.. To get started, see the following list of resources:</p> \n<p>1/ <a href=\"https://aws.amazon.com/blogs/big-data/resolving-concurrent-write-conflicts-for-apache-iceberg-tables-in-amazon-redshift/\">Resolving concurrent writes for Apache Iceberg tables using Amazon Redshift</a></p> \n<p>2/ <a href=\"https://aws.amazon.com/blogs/big-data/multi-statement-transactions-for-apache-iceberg-tables-in-amazon-redshift/\">Multi-statement transactions for Apache Iceberg tables in Amazon Redshift</a></p> \n<p>3/ <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-time-travel.html\">Time travel support for Apache Iceberg&nbsp;</a></p>"
  "72674bd2f9094299d70fcf17d4f41c3e":
    "id": "72674bd2f9094299d70fcf17d4f41c3e"
    "title": "AWS DevOps Agent is now available in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-devops-agent-govcloud-west/"
    "published": "2026-11-17 04:55:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Now available in AWS GovCloud (US-West), AWS DevOps Agent is your always-available operations teammate that resolves and proactively prevents incidents, optimizes application reliability and performance, and handles on-demand SRE tasks across AWS, multicloud, and on-prem environments.</p> \n<p>DevOps Agent investigates incidents and identifies operational improvements as an experienced teammate would: by learning your applications and their relationships, working with your observability tools, runbooks, code repositories, and CI/CD pipelines, and correlating telemetry, code, and deployment data. It autonomously triages incidents and guides teams to rapid resolution, reducing mean time to resolution (MTTR) from hours to minutes, while analyzing patterns across historical incidents to deliver actionable recommendations that prevent future outages.<br /> <br /> For the full list of AWS Regions where AWS DevOps Agent is available, visit the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">Regions</a> list. Pricing details are available on the AWS DevOps Agent<a href=\"https://aws.amazon.com/devops-agent/pricing\"> pricing page</a>. AWS Support customers receive monthly DevOps Agent credits based on the prior month's AWS Support charge: 100% for Unified Operations, 75% for Enterprise Support, or 30% for Business Support+. For many customers, this significantly reduces or eliminates DevOps Agent costs. For details, visit the <a href=\"https://aws.amazon.com/premiumsupport/plans/\">support compare page</a>.<br /> <br /> To learn more, read the <a href=\"https://aws.amazon.com/blogs/mt/announcing-general-availability-of-aws-devops-agent/\">launch blog</a> and see<a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/\"> getting started</a>.</p>"
  "08ca7c69b2ec3685db61e5a6eeeb5431":
    "id": "08ca7c69b2ec3685db61e5a6eeeb5431"
    "title": "Amazon Connect Health medical coding is now available in public preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-connect-health-medical-coding/"
    "published": "2026-11-17 04:18:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Today, AWS announces the public preview of medical coding in <a href=\"https://aws.amazon.com/health/connect-health/\">Amazon Connect Health</a>, a HIPAA-eligible AI service that works alongside healthcare teams across patient engagement and point-of-care workflows. Medical coding uses existing clinical documentation to suggest ICD-10-CM and CPT codes, including E&amp;M levels and modifiers, for a provider or coder to review and approve before submission. You can integrate medical coding into your EHR or billing application through the Amazon Connect Health SDK, or use it with Amazon Connect Health ambient documentation.</p> \n<p>Each code links to the evidence that supports it and carries a confidence score, so reviewers can confirm a code before a claim goes out. In this public preview, you can choose to upload your organization's previously coded encounters, and the service builds a coding reference set specific to your organization. The corrections coders make feed that reference set and improve future coding suggestions.<br /> <br /> Medical coding is available in public preview in the US East (N. Virginia) and US West (Oregon) AWS Regions.&nbsp;To learn more, see <a href=\"https://docs.aws.amazon.com/connecthealth/latest/userguide/medical-coding.html\">medical coding</a> in the Amazon Connect Health user guide.&nbsp;</p>"
  "cb5dfe0512a1d2d92516aea1e141a8b4":
    "id": "cb5dfe0512a1d2d92516aea1e141a8b4"
    "title": "AWS KMS now supports key sharing with AWS Resource Access Manager"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/kms-key-sharing-resource-access-manager/"
    "published": "2026-11-17 03:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS Key Management Service (KMS) now integrates with AWS Resource Access Manager (RAM), giving you a simpler and more consistent way to share KMS keys across your AWS accounts, within your organization in AWS Organizations, and with specific IAM roles and users. You can now let trusted parties define the access they need through reusable managed permissions in RAM, while keeping full control of your keys and key policies. To share a key, create a resource share by selecting the keys to share, choosing a managed permission, and specifying the principals. You can use AWS managed permissions for common scenarios, or customer managed permissions (CMPs) authored by you or by trusted parties such as SaaS providers and central security teams.</p> \n<p>Sharing KMS keys through RAM makes enabling cross-account access faster to set up and safer to maintain. The trusted parties who need access to your keys can publish the policy once as a CMP, without the need for you to modify the key policies by hand. You simply fill in the values that scope it to your environment and attach it to the resource share. Your existing key policy is untouched, so you are always in control of your key as your environment grows. When a new policy version is available via an updated CMP, you decide when to apply it to your resource shares.</p> \n<p>This enhancement is built on new AWS RAM capabilities that are available for every resource type RAM supports. CMPs now support multiple policy statements and additional IAM condition operators, including StringNotEquals, BoolIfExists, and ArnLike, along with the ForAnyValue and ForAllValues prefixes, so you can express precise, least-privilege access. The&nbsp;parameterized managed permissions lets you place a temporary placeholder in CMPs that allows each resource share owner to customize and scope down CMPs to their environment, enabling CMPs to be reused and serve many accounts. CMPs can now be published and shared across accounts, so the authors can maintain one permission, manage its versions centrally, and see every resource share that uses it, while other accounts can use it directly without keeping their own copy.</p> \n<p>KMS key sharing with RAM is available in all AWS Regions where both services are available, except the Middle East (UAE) and Middle East (Bahrain).&nbsp;For more information, see <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/key-sharing-ram.html\">Sharing KMS keys with AWS RAM</a> in the AWS KMS Developer Guide and <a href=\"https://docs.aws.amazon.com/ram/latest/userguide/working-with.html\">Working with shared AWS resources</a> in the AWS RAM Developer Guide.</p>"
  "ba357223af769ae943a31266c506bd11":
    "id": "ba357223af769ae943a31266c506bd11"
    "title": "Set up, connect, and govern AI agents faster with Amazon WorkSpaces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-workspaces-AI-agents-connect-govern"
    "published": "2026-11-17 03:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Building AI agents has become essential. Across your organization, teams want agents to handle ERP transactions, work through a claims queue, and operate the same applications your people use every day. But how do you move from experiments to production? Before an agent touches real systems and real data, you need to verify who it acted on behalf of, what it did, and whether it stayed within the limits you set. Without that visibility, the agent stays stuck in testing, and the value is never realized.</p> \n<p>Earlier this year, we <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/06/amazon-workspaces-ai/\">launched Amazon WorkSpaces for AI agents</a>, extending the power and security of a cloud work environment to agents, not just people. Today, we're excited to announce new capabilities that make it even easier to operate agents confidently across your enterprise and move them from proof of concept to governed production in fewer steps.&nbsp; You can set up new agents or connect the ones your builders have already built, run them under your own identity providers and policies, and keep a record of everything they do. You don't need to stitch together new tools or build custom monitoring.</p> \n<p>Setup used to mean configuring the machine by hand. Now, you can just describe what your agent needs to your AI coding assistant such as Claude Code, Codex, and Kiro. Guided by AWS MCP skills, the assistant builds the WorkSpace from defaults you can adjust. If your teams build on Amazon Bedrock AgentCore, you can connect an agent directly with your AWS credentials and skip writing any agent code. New tools also reduce agent costs and increase accuracy by letting an agent carry out a series of actions in a single call and use the computer-use actions its model already knows.</p> \n<p>But an agent that can work is not necessarily an agent you can trust with mission-critical work and sensitive data. This release gives you the same oversight over an agent that you have over the employees you manage. First, agents can now sign in through any identity provider (IdP) that supports OIDC, in addition to the existing SAML support. Administrators can send sign-in straight to their IdP, so users authenticate with their usual corporate credentials, and you don't build custom authentication. Second, with on-behalf-of (OBO) sign-in, an agent works as the signed-in user, with that user's existing directory identity, permissions, and Group Policies on the desktop.&nbsp;</p> \n<p>WorkSpaces now offers session replay, giving you a reviewable record of what your agent did. Session replay turns session screenshots into a video and pairs it with a plain-language transcript of the agent's actions. Both are stored in your own Amazon S3 bucket and encrypted with your own keys. Your security team can see what the agent saw, and your compliance team gets evidence to support audits.</p> \n<p>Together, these updates help move agents out of pilots and into real production scale. Your teams can keep working the way they do today, with agents working alongside them in familiar and trusted cloud work environments. And every one of those agents is held to the same identity, policy, and audit standards as the rest of your workforce. With WorkSpaces, you can bring AI agents into your business without rebuilding decades of software or needing a separate environment to govern them.</p> \n<p>To get started operating AI agents on WorkSpaces, <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">visit our documentation page</a>.&nbsp;</p>"
  "6edc0b545193270085ee3d3a7813ce89":
    "id": "6edc0b545193270085ee3d3a7813ce89"
    "title": "AWS Marketplace Metering Service now supports decimal usage quantities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-marketplace-metering-service-decimal-usage-quantities/"
    "published": "2026-11-17 02:39:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p><a href=\"https://aws.amazon.com/marketplace\">AWS Marketplace</a> Metering Service now supports decimal usage quantities in the MeterUsage and BatchMeterUsage APIs. Previously, AWS Marketplace sellers reported usage to both APIs in whole numbers, and now they can report usage with up to six decimal places.</p> \n<p>Sellers can price and meter in the units that match how customers consume their product, for example reporting 1.5 terabytes (TB) of storage instead of 1 or 2 TB. To report decimal quantities, sellers use the new UsageQuantityAsDecimal parameter in MeterUsage and QuantityAsDecimal parameter in BatchMeterUsage, and existing integrations that report whole numbers continue to work without changes. Usage allocations, which split reported usage into buckets by tags, also support decimal quantities with the new AllocatedUsageQuantityAsDecimal parameter.</p> \n<p>This new feature is available in all AWS <a href=\"https://docs.aws.amazon.com/marketplace/latest/developerguide/metering-regions.html\">Regions</a> where AWS Marketplace Metering Service is available. To learn more, see <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/API_marketplace-metering_MeterUsage.html\">MeterUsage</a> and <a href=\"https://docs.aws.amazon.com/marketplace/latest/APIReference/API_marketplace-metering_BatchMeterUsage.html\">BatchMeterUsage</a> in the AWS Marketplace API Reference.</p>"
  "5be9199e0335df4d06e72418a9087225":
    "id": "5be9199e0335df4d06e72418a9087225"
    "title": "Amazon Connect Customer agent assist now supports interactive responses"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/Connect-Custom-agent-interactive-responses"
    "published": "2026-11-17 04:02:00"
    "fetched": "2026-11-17 19:05:04"
    "summary": "<p>Amazon Connect Customer agent assist now supports interactive components, including cards, carousels, buttons, and input fields. The AI agent analyzes conversation context in real time, recommends actions, retrieves information, and executes tasks on behalf of contact center agents using MCP tools in Connect Customer or third-party services. Interactive responses let agents review information, provide details, select options, and confirm actions without manually typing a separate request for each action. The AI agent can also recommend step-by-step guides, cases, customer profiles, and third-party applications that agents can open with one click.</p> \n<p>For example, when a customer calls to dispute a charge, the AI agent can dynamically generate an interactive list of the customer’s recent transactions. The agent can select the disputed transaction, provide or confirm the required details, and approve the action. The AI agent can then use a connected tool to create the dispute request and display confirmation in the agent workspace.</p> \n<p>This feature is available in all AWS Regions where Amazon Connect Customer agent assist is available. To learn more and get started, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agentic-assistance.html\">Agent Assist</a> in the Amazon Connect Administrator Guide.&nbsp;</p>"
  "df8acbe03ef08ec23af4b68cee556e87":
    "id": "df8acbe03ef08ec23af4b68cee556e87"
    "title": "AWS launches credit splitting and transfers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-credit-splitting-transfers/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>AWS now supports credit splitting and transfers, enabling customers to divide any AWS credit into multiple smaller credits and transfer them to other linked accounts within their payer account. Previously, AWS applied credits starting with the owning account, then shared any excess with other accounts based on their usage, making it difficult for customers with large credits to direct precise amounts to specific teams or business units. FinOps teams can now split credits by dollar amounts, percentages, or even splits, and transfer each portion to the team that earned it.</p> \n<p>Credit splitting and transfers eliminate hours of monthly manual chargeback work for FinOps teams and provide predictable credit budgets per team or business unit. Each split credit inherits the same expiration date and service eligibility as the original, and split credits retain sharing settings by default so unused balances flow to other eligible accounts. Accounts receive first-priority consumption for transferred credits.</p> \n<p>Credit splitting and transfers compose naturally with existing credit features, including credit-level sharing and credit pausing. After a split, customers have full control over each resulting credit. For example, customers can split and share one credit across all intended accounts so multiple teams benefit, while restricting another split credit to a single account. They can also pause a credit earmarked for a future project, then resume it when needed.</p> \n<p>You can split any credit type via the AWS Billing Console, CLI, or API. Partially consumed credits can be split, with the split applying to remaining balance only. Each credit family supports up to 100 splits, with a $100 minimum per split credit. Splits are permanent with no undo operation.</p> \n<p><a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/credits-split-transfer.html\" target=\"_blank\">Credit splitting and transfers</a> are available in all AWS commercial regions at no additional cost.</p>"
  "6f5aa9ca2745b33a02bd07fef7bfc23c":
    "id": "6f5aa9ca2745b33a02bd07fef7bfc23c"
    "title": "AWS IAM announces Access Troubleshooter to debug access denied errors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-access-troubleshooter/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>AWS Identity and Access Management (IAM) introduces <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied-authorization-id.html\" target=\"_blank\">Access Troubleshooter</a>, a new capability that gives you visibility into the full authorization context behind access denied errors so you can resolve them without trial-and-error. Previously, developers relied on the Amazon Resource Name (ARN) of the denying policy to debug a denial, with no visibility into the authorization context or other policies evaluated in the request that could contribute to the denial. This made troubleshooting access issues time-consuming and inefficient.</p>\n<p>Starting today, access denied error messages for <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied-authorization-id.html#access-troubleshooter-supported-services\" target=\"_blank\">supported services</a> and APIs will include a unique identifier that you can use to retrieve details of the authorization performed by the service. You gain visibility into what policies were evaluated for each request, the authorization context of those requests, and the results of the evaluation. This enables you to identify the root cause of authorization issues quickly, streamlining your access management workflows and reducing time spent debugging permission problems.</p>\n<p>To learn more about Access Troubleshooter and how it can help you resolve access denied errors efficiently, see the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied-authorization-id.html\" target=\"_blank\">User Guide on troubleshooting access denied error messages</a>.</p>"
  "e2fc3d94c37a2b087cfe7864fcf7150b":
    "id": "e2fc3d94c37a2b087cfe7864fcf7150b"
    "title": "AWS Security Hub extends unified security management to Google Cloud Platform"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-gcp/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Today, AWS announces that AWS Security Hub now monitors Google Cloud Platform (GCP) resources, extending risk analytics, cloud security posture management, vulnerability management, and security response management across both clouds. Many AWS customers running workloads in AWS and GCP have had to operate separate security tools for each environment, making it difficult to prioritize risks holistically or respond consistently. Security Hub now provides a single, unified experience to detect and respond to risks across your AWS and GCP environments in addition to existing support for monitoring Microsoft Azure environments.</p> \n<p>Security Hub automatically discovers GCP resources, including GCP Virtual Machines (VMs), GCP Google Artifact Registry (GAR) container images, GCP Cloud Run functions, and GCP identities, and evaluates them for misconfigurations, internet exposure, and software vulnerabilities. You receive posture checks against security standards including the CIS Benchmarks™ for Google Cloud Platform Foundations, unified resource inventory, risk and exposure analysis, and automated response through existing EventBridge integrations. AWS and GCP findings appear in the same prioritized view with the same finding formats and automation workflows, so security teams can operate from one console rather than switching between tools.</p> \n<p>Security Hub includes an independent 30-day free trial to monitor GCP resources that begins once you create your integration with Google Cloud Platform. After the trial, you pay the same price for monitoring GCP resources and equivalent AWS resources. You can create an integration to GCP from all AWS Regions where Security Hub is available except Middle East (UAE), Middle East (Bahrain), Asia Pacific (Taipei), and Asia Pacific (New Zealand). You can also create integrations to Google Cloud Platform for AWS Security Hub CSPM for posture management checks and Amazon Inspector for vulnerability management independently from AWS Security Hub. To learn more, see <a href=\"https://aws.amazon.com/security-hub/pricing/\" target=\"_blank\">AWS Security Hub Pricing</a> and <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\" target=\"_blank\">AWS Security Hub documentation</a>.</p>"
  "11f961c80727be8edc692cf55dbb7e31":
    "id": "11f961c80727be8edc692cf55dbb7e31"
    "title": "AWS announces consistent sharing controls for credits, Savings Plans, and Reserved Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-benefits-sharing-capabilities/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>AWS Billing and Cost Management now gives customers symmetric, granular control over how credits, Reserved Instances, and Savings Plans are shared across their organization. Organizations with grant funding, regulatory obligations, or multi-entity structures can now automate benefit allocation that previously required manual chargeback reconciliation. With these new capabilities, customers can set default sharing preferences that automatically apply to all cost-saving benefits, and override those defaults for individual benefits when business requirements demand it.</p> \n<p>Customers configure Credit Group Sharing through the Billing Preferences page to set a single default that every new credit inherits automatically, ending the cycle of per-credit manual configuration. For Reserved Instances and Savings Plans, customers configure sharing preferences at the individual commitment level through the Savings Plans or Reserved Instances inventory pages, whether purchased at a linked account or at the payer level. All sharing configurations use Cost Categories, the same grouping construct customers already use in Cost Explorer, AWS Budgets, and the Cost and Usage Report.</p> \n<p>These capabilities are available starting November 17, 2026, in all AWS Regions through the AWS Billing and Cost Management Console and public APIs. There is no additional charge. To learn more, visit the for documentations for <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-pref.html\" target=\"_blank\">Credit Group Sharing</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html\">Savings Plan and Reserved Instances Level Sharing</a>.</p>"
  "4fb5726d0a9fad4d8a69d9c73481cd44":
    "id": "4fb5726d0a9fad4d8a69d9c73481cd44"
    "title": "Amazon Route 53 Resolver DNS Firewall now supports Infoblox Threat Defense (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route53-dns-firewall-infoblox-preview/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Amazon Web Services announces the preview of Infoblox Threat Defense on <a href=\"https://aws.amazon.com/route53/resolver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Route 53 Resolver DNS Firewall</a>. Security administrators can now apply Infoblox threat intelligence directly in DNS Firewall rules to preemptively protect applications in their Amazon Virtual Private Clouds (VPCs) from cyber threats, by subscribing to the Infoblox product listing on AWS Marketplace from the Route 53 DNS Firewall console.</p> \n<p>With this launch, you can add Infoblox managed rules to your DNS Firewall rule groups to filter and block queries to malicious and high-risk domains at the DNS layer. Infoblox continuously updates its threat intelligence feeds to preemptively protect cloud workloads from phishing, malware, ransomware and other advanced attacks. You can apply these protections to DNS queries from your VPCs and to hybrid traffic forwarded through Route 53 Resolver endpoints, so security teams keep consistent DNS policies across AWS and on-premises environments and add a layer of protection on top of AWS managed domain lists.</p> \n<p>Infoblox Threat Defense on Route 53 DNS Firewall is available in preview in all AWS commercial Regions where Route 53 Resolver DNS Firewall is available. DNS Firewall Advanced customers can add Infoblox rules to existing rule groups at no additional DNS Firewall charge, and the Infoblox subscription in AWS Marketplace is free during preview.</p> \n<p>To get started, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/firewall-partner-infoblox.html\" rel=\"noopener noreferrer\" target=\"_blank\">Route 53 DNS Firewall documentation</a>. To view Route 53 pricing, visit the <a href=\"https://aws.amazon.com/route53/pricing/\">Route 53 pricing page</a>. To learn more about the AWS Marketplace listing and pricing for Infoblox Threat Defense for Route 53 DNS Firewall, <a href=\"https://aws.amazon.com/marketplace/pp/prodview-sempmhxl3aqgg\" rel=\"noopener noreferrer\" target=\"_blank\">see here</a>.</p>"
  "232db2de50a33d7a1d071470045c15d3":
    "id": "232db2de50a33d7a1d071470045c15d3"
    "title": "AWS announces agentic account creation for agentic coding harnesses"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agentic-account-creation/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>AWS now enables agentic coding harnesses to open the new AWS sign-up experience for developers who don't have an AWS account yet. Previously, developers working in agentic coding environments like Claude Code, Codex, and Cursor had to manually navigate to <a href=\"https://aws.amazon.com/\">aws.amazon.com</a>, sign up for an AWS account and configure credentials before deploying workloads, interrupting the developer's experience. Now, developers can go from an idea to deploying a running application by the browser automatically opening, completing sign up and returning short-lived credentials to the harness.</p>\n<p>When developers sign up for AWS from their coding agent, they start with the new AWS experience. Their first project comes set up with a home Region, IAM role manager, and short-term credentials that refresh automatically, so the agent can start deploying right away.</p>\n<p>To try the new experience, install the AWS plugin or configure the AWS Agent Toolkit in your agentic coding harness. To learn more, see the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/\">AWS Agent Toolkit documentation</a> or the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/accounts-welcome.html\">AWS Account Documentation</a>.</p>"
  "1cc15ef79f3c83aa0f279cba2a5133c6":
    "id": "1cc15ef79f3c83aa0f279cba2a5133c6"
    "title": "Amazon EKS Auto Mode now rightsizes Pods to reduce compute costs (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/eks-auto-mode-pod-rightsizing-preview/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) introduces resource optimization for EKS Auto Mode, a new capability that rightsizes the CPU and memory requests of running Pods based on their actual usage. CPU and memory requests are often set at deploy time and rarely revisited, and Auto Mode provisions EC2 instances to fit them. Rightsizing lets Auto Mode run the same Deployments and StatefulSets on fewer or smaller instances, without hand tuning and at no additional charge.</p>\n<p>Turn on resource optimization by creating a ClusterResourceOptimizationPolicy in your EKS cluster, review its recommendations in the default Recommend mode, and switch to Apply mode when you're ready to resize running Pods in place, without recreating them. For example, a platform team running Java services under Argo CD can rightsize every application namespace without editing templates or creating GitOps drift, while resource optimization keeps memory above each Java heap and raises memory after an out-of-memory kill. It doesn't change the CPU or memory that a Horizontal Pod Autoscaler or KEDA scales on, and you can exclude workloads that the Vertical Pod Autoscaler already manages.</p>\n<p>You can use resource optimization on EKS Auto Mode clusters running Kubernetes 1.36 or later in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Asia Pacific (Seoul), and Asia Pacific (Tokyo).</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/auto-resource-optimization.html\" target=\"_blank\">Rightsize workloads with resource optimization</a> in the Amazon EKS User Guide and the <a href=\"https://aws.amazon.com/eks/auto-mode/\">EKS Auto Mode product page</a>.</p>"
  "b6ad62fcd4676e368aac95f639293dd0":
    "id": "b6ad62fcd4676e368aac95f639293dd0"
    "title": "AWS Split Cost Allocation Data now supports Amazon S3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/s3-split-cost-allocation/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>You can now allocate the storage and request costs of a shared Amazon S3 general purpose bucket to its prefixes in the AWS Cost and Usage Report (CUR). Many organizations store data for multiple teams, applications, or tenants in one bucket under different prefixes such as \"marketing/\" and \"finance/\". Previously, splitting that bucket's bill by prefix required custom pipelines and your own pricing logic.</p>\n<p>With this new capability, S3 Storage Lens publishes prefix-level storage and request metrics to AWS Billing and Cost Management. Billing and Cost Management then allocates the bucket's storage and Tier 1 and Tier 2 request costs to the deepest matching prefix in the range of prefix levels you choose. Each prefix line item carries its full prefix path as AWS-generated cost allocation tags, so you can total costs by top-level prefix, team, or application, and reconcile it back to the bucket. You can use this data for chargeback and showback, and to see which prefixes drive your S3 spend.</p>\n<p>To get started, enable AWS Billing and Cost Management publishing in your S3 Storage Lens advanced tier configuration, then enable split cost allocation data for S3 in the AWS Billing and Cost Management console. This feature is available in all AWS Regions, except the AWS China Regions and the AWS GovCloud (US) Regions, at no additional charge beyond S3 Storage Lens advanced tier pricing. To learn more, visit the AWS Cost and Usage Reports product page, Understanding split cost allocation data, and Estimating Amazon S3 costs by prefix with S3 Storage Lens.</p>"
  "b43a1c672789a921ce134a300856135e":
    "id": "b43a1c672789a921ce134a300856135e"
    "title": "Amazon S3 Storage Lens now tracks S3 Intelligent-Tiering access tiers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-storage-lens-s3-intelligent-tiering-access-tiers/"
    "published": "2026-11-17 16:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Amazon S3 Storage Lens now provides storage metrics for each S3 Intelligent-Tiering access tier. You can see object counts and storage bytes in every tier across your buckets. This helps you track how your data moves between tiers, estimate storage costs, and measure your savings.</p> \n<p>S3 Storage Lens gives you visibility across your organization into storage usage and activity to help you optimize costs and performance. Access tier metrics appear in your S3 Storage Lens dashboards and metrics exports alongside your existing metrics. S3 Storage Lens also now publishes prefix metrics to AWS Billing and Cost Management, so you can allocate shared bucket costs to teams and applications with split cost allocation data for S3.</p> \n<p>To get started, enable access tier metrics in your S3 Storage Lens advanced tier configuration. Access tier metrics are available in all AWS Regions, except the AWS China Regions and the AWS GovCloud (US) Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage_lens.html\" target=\"_blank\">S3 Storage Lens documentation</a>. For pricing, visit the <a href=\"https://aws.amazon.com/s3/pricing/\" target=\"_blank\">S3 pricing page</a>.</p>"
  "046916fd3d23f90a26da1226cb0fb40e":
    "id": "046916fd3d23f90a26da1226cb0fb40e"
    "title": "Amazon S3 adds post-quantum TLS key exchange support to additional S3 endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-post-quantum-tls-key-exchange-support/"
    "published": "2026-11-17 23:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon S3 adds post-quantum TLS (PQ-TLS) key exchange support to S3 Vectors and AWS PrivateLink for Amazon S3 interface endpoints. This extends the post-quantum cryptography support already available on regional S3, S3 Tables, and S3 Express One Zone endpoints.</p> \n<p>S3 Vectors endpoints and PrivateLink interface endpoints now support Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM), one of the National Institute of Standards and Technology (NIST) standardized post-quantum cryptographic algorithms. PQ-TLS key exchange is available to all clients configured to use the ML-KEM key exchange algorithm. S3 Vectors and PrivateLink endpoints automatically negotiate the strongest key exchange that your client software supports, so clients that support ML-KEM receive the benefits of PQ-TLS key exchange without any changes to your applications or endpoint configuration.</p> \n<p>PQ-TLS key exchange for S3 Vectors and AWS PrivateLink for S3 is supported at no additional cost in all AWS Regions. To learn more about PQ-TLS support in S3, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryptionInTransit.PQ-TLS.html\">Amazon S3 User Guide</a>.</p>"
  "844c3f95c28e69bea23238b2a6107871":
    "id": "844c3f95c28e69bea23238b2a6107871"
    "title": "Amazon S3 now provides post-quantum TLS visibility in AWS CloudTrail"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-post-quantum-tls-aws-cloudtrail/"
    "published": "2026-11-17 23:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon S3 now records the TLS key exchange algorithm in AWS CloudTrail for S3 requests, so you can see which requests and clients use post-quantum TLS (PQ-TLS). With this visibility, you can measure the share of your S3 traffic that is protected with post-quantum cryptography, and identify the applications, SDK versions, and IAM principals that still connect with classical key exchange and need to be upgraded.</p> \n<p>The new keyExchange value in the tlsDetails field of CloudTrail management and data events shows the key exchange negotiated on each TLS connection, such as the hybrid post-quantum algorithm X25519MLKEM768 or a traditional algorithm such as x25519. For example, you can query your CloudTrail logs to find the user agents of S3 requests that did not use ML-KEM, then prioritize those clients for your post-quantum migration. The keyExchange value is recorded for requests to general purpose buckets, directory buckets, table buckets, and vector buckets, including requests made through AWS PrivateLink.</p> \n<p>Key exchange details for S3 requests are available in all AWS Regions at no additional cost. Standard AWS CloudTrail pricing applies for S3 data events. To learn more, visit <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryptionInTransit.PQ-TLS.html\" rel=\"noopener noreferrer\" target=\"_blank\">post-quantum TLS in the Amazon S3 User Guide</a> and the <a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html\" rel=\"noopener noreferrer\" target=\"_blank\">CloudTrail record contents reference</a>.</p>"
  "a685d7369e20c753d323364f6fea3d5e":
    "id": "a685d7369e20c753d323364f6fea3d5e"
    "title": "Amazon SageMaker HyperPod now supports cluster operations for tracking scaling and on-demand Deep Health Check requests"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-hyperpod-cluster-ops/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon SageMaker HyperPod introduces cluster operations, giving you visibility into every scaling and on-demand deep health check request from submission to completion. When a request runs into errors, the SageMaker AI console shows an alert that links directly to that request's error events.</p> \n<p>With continuous provisioning, HyperPod brings capacity online in the background as it becomes available, retries failed nodes automatically, and lets you run multiple scaling requests at the same time. Cluster operations show you when each request finishes and which request caused the activity on your cluster. When a scale-up falls short of its target, you can go directly to the failure reason.</p> \n<p>Each scaling or on-demand deep health check request creates a cluster operation that tracks the request from submission to completion, including whether it is still in progress and what it changed on each instance group. Events that HyperPod records while working on the request are linked to its operation. For example, if a scale-up of your training instance group doesn't reach its target, you can open the operation and see only the events for that request, without sorting through unrelated cluster activity. If you or an autoscaler such as Karpenter send several requests to the same instance group, for example during a burst of inference traffic, each operation shows whether it completed or was replaced by a newer request. That way you can tell which request actually changed your cluster. After you run an on-demand deep health check before a large training job, you can follow its operation to confirm when it finished and which instances it affected. In the SageMaker AI console, operations appear on the cluster's Events tab. To build the same visibility into your own dashboards, alerting, or CI/CD pipelines, use the new ListClusterOperations and DescribeClusterOperation APIs, and filter ListClusterEvents by operation.</p> \n<p>Cluster operations are created automatically for every request, with no changes to your existing workflows.</p> \n<p>Cluster operations are available at no additional cost for SageMaker HyperPod clusters that use continuous provisioning, in all AWS Regions where SageMaker HyperPod is available. To learn more, please check the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-cluster-operations.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "fef65a3305c38de0522e8e638878d8e4":
    "id": "fef65a3305c38de0522e8e638878d8e4"
    "title": "AWS Split Cost Allocation Data now supports Amazon S3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/split-cost-allocation-data-s3/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Starting today, you can allocate the storage and request costs of a shared Amazon S3 general purpose bucket to the prefixes in that bucket in the AWS Cost and Usage Report (CUR). Organizations often store data for many teams, applications, or tenants in one bucket under different prefixes, such as `marketing/` and `finance/`. Until now, attributing that bucket's bill to each prefix required custom pipelines built on S3 Inventory or Storage Lens reports and your own pricing logic.</p> \n<p>With Split Cost Allocation Data for Amazon S3, Amazon S3 Storage Lens publishes prefix-level storage and request metrics to AWS Billing and Cost Management, which allocates the bucket's storage and Tier 1 and Tier 2 request costs to the deepest matching prefix in the range of prefix levels you choose. Each prefix line item carries its full prefix path as AWS-generated cost allocation tags, so you can total cost by top-level prefix, team, or application, and reconcile it back to the bucket. You can use this data for chargeback, showback, and to see which prefixes drive your S3 spend.</p> \n<p>To get started, enable AWS Billing and Cost Management publishing in an S3 Storage Lens advanced tier dashboard configuration, then enable split cost allocation data for Amazon S3 in the AWS Billing and Cost Management console. Prefix cost data appears in your CUR after the next daily Storage Lens metrics are published. Split Cost Allocation Data for Amazon S3 is available in all AWS commercial Regions where S3 Storage Lens advanced metrics are available, at no additional charge beyond S3 Storage Lens advanced tier pricing. To learn more, visit the <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-and-usage-reporting/\">AWS Cost and Usage Reports</a> product page, <a href=\"https://docs.aws.amazon.com/cur/latest/userguide/split-cost-allocation-data.html#split-cost-allocation-data-s3\" rel=\"noopener noreferrer\" target=\"_blank\">Understanding split cost allocation data</a>, and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-lens-cost-and-usage-reports.html\" rel=\"noopener noreferrer\" target=\"_blank\">Estimating Amazon S3 costs by prefix with S3 Storage Lens</a>.</p>"
  "cc1fba6b151eb9e2f108022e7383e3bb":
    "id": "cc1fba6b151eb9e2f108022e7383e3bb"
    "title": "Amazon Route 53 Resolver DNS Firewall now supports automated allow-list generation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-dns-firewall-auto-allowlists/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Route 53 Resolver DNS Firewall now automatically generates domain allow-lists from your VPCs' observed DNS query traffic, helping you enforce least-privilege DNS access and reduce the risk of DNS-based data exfiltration.</p>\n<p>Previously, implementing a least-privilege model required security teams to manually analyze DNS query logs to identify the domains their VPCs depend on before deploying allow-list rules. This created operational overhead and delayed enforcement of a deny-by-default (walled-garden) posture.</p>\n<p>With automated allow-list generation, DNS Firewall analyzes DNS query traffic using a lookback window configurable from 1 hour to 7 days to create an allow-list of observed domains. It then continuously monitors DNS queries and flags newly observed domains, so you can review them before adding them to the allow-list. You can deploy the rule across multiple VPCs and accounts using AWS Firewall Manager or Route 53 Profiles.</p>\n<p>This capability is available at no additional cost to DNS Firewall Advanced customers, in all AWS Regions where Route 53 DNS Firewall is supported, except in AWS GovCloud (US) and Amazon Web Services China Regions. To get started, use the Route 53 DNS Firewall console, AWS CLI, or API.</p>\n<p>To learn more, visit the <a href=\"https://aws.amazon.com/route53/resolver-dns-firewall/\">Amazon Route 53 Resolver DNS Firewall product page</a> and the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/firewall-advanced.html\" target=\"_blank\">Route 53 DNS Firewall Developer Guide</a>.</p>"
  "8898d376538b687828c21535cddb8696":
    "id": "8898d376538b687828c21535cddb8696"
    "title": "AWS Elemental MediaConnect expands routing control and protocol support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/rtmp-support-aws-elemental-mediaconnect/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>With <a href=\"https://aws.amazon.com/mediaconnect/\" target=\"_blank\">AWS Elemental MediaConnect</a>, you now have more protocol support and routing control for your live video workflows.</p>\n<p>First, MediaConnect now supports more protocols, including RTMP, RTMPS, and eRTMP, across both <a href=\"https://docs.aws.amazon.com/mediaconnect/latest/ug/flows.html\" target=\"_blank\">flows</a> and <a href=\"https://docs.aws.amazon.com/mediaconnect/latest/ug/routers.html\" target=\"_blank\">router</a>. RTMP is widely used by live streaming encoders and software such as OBS. With this support, you can now bring RTMP sources into MediaConnect and deliver to RTMP endpoints, such as social and live streaming platforms.</p>\n<p>Second, the service adds three new routing capabilities:</p>\n<p>- PID remapping on MediaConnect router reassigns transport stream PIDs inline, without transcoding.<br />- Clean switch aligns input transitions on video boundaries for a more seamless switching experience.<br />- SRT merge input mode bonds redundant SRT streams of the same content, reconstructing a clean feed when one path degrades to add resilience for lossy or long-haul contribution.</p>\n<p>These capabilities are available in all AWS Regions where MediaConnect Router is available.</p>\n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/mediaconnect/latest/ug/what-is.html\" target=\"_blank\">AWS Elemental MediaConnect documentation</a>.</p>"
  "a0e16929daad431d89c53431dd4f73f5":
    "id": "a0e16929daad431d89c53431dd4f73f5"
    "title": "AWS Transit Gateway now shares resource context with firewalls for segmentation policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/transit-gateway-firewall-context-sharing/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Transit Gateway now supports context sharing with security services, such as attached firewalls, allowing you to use Amazon Virtual Private Clouds (VPCs), VPC subnets, VPC security groups, and transit gateway attachments in firewall policies alongside IP addresses. Until now, attached firewalls segmented traffic by IP address, which is hard to plan and maintain, or by resource tags, which firewalls periodically synchronize with IP addresses and can miss new workloads in between. With this feature, you can enforce segmentation based on how workloads and attachments are defined in AWS.</p>\n<p>Transit Gateway embeds resource context in the traffic it sends to your firewall, which can enforce the right policy from the first packet. For example, you can apply threat protection to traffic between web-tier and database-tier security groups, block development VPCs from reaching production VPCs, apply a common inspection policy to traffic entering AWS through AWS Direct Connect and AWS Site-to-Site VPN attachments, or apply policies to short-lived AWS Lambda functions as soon as they send traffic, all without updating rules as IP addresses change.</p>\n<p>AWS Network Firewall and Palo Alto Networks Software Firewalls support policies using resource context alongside IP-based rules. To get started, create a context store in AWS Network Manager and associate your transit gateways. The context store monitors resources connected to those transit gateways and shares their context with firewalls.</p>\n<p>Context sharing with security services is available in all commercial AWS Regions where AWS Transit Gateway is available, except Middle East (Bahrain) and Middle East (UAE). It is also available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions.</p>\n<p>To learn more, visit the <a href=\"https://aws.amazon.com/transit-gateway/\">AWS Transit Gateway product page</a> and <a href=\"https://docs.aws.amazon.com/network-manager/latest/tgwnm/context-stores.html\" target=\"_blank\">context sharing with security services documentation</a>.</p>"
  "c9dc7112003894fd73a31a4305cccef4":
    "id": "c9dc7112003894fd73a31a4305cccef4"
    "title": "AWS Workload Credentials Provider adds container support for ACM certificates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/acm-certificates-container-support/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>The open source <a href=\"https://github.com/aws/aws-workload-credentials-provider\" target=\"_blank\">AWS Workload Credentials Provider</a> can now export AWS Certificate Manager (ACM) certificates to applications running in containers on Amazon Elastic Container Service (Amazon ECS), including AWS Fargate, Amazon Elastic Kubernetes Service (Amazon EKS), and Docker on Amazon EC2. You can now automate certificate deployment and renewal for containerized TLS workloads the same way you do on EC2 instances, on both Linux and Windows.</p>\n<p>The provider runs as a sidecar in your ECS task or EKS pod. It exports each certificate and private key to a shared volume and writes the renewed files when ACM rotates the certificate. For TLS servers that don't reload certificate files on their own, such as NGINX, Apache, HAProxy, or IIS, a companion watcher in the TLS container runs your reload command after each renewal. The watcher needs no AWS credentials. TLS servers that reload automatically, such as Envoy, Traefik, and Caddy, need only the shared volume. Access is controlled through IAM: the sidecar assumes a per-workload role that is allowed to export only that workload's certificates.</p>\n<p>To get started, download the provider and watcher binaries for Linux (x86_64 and Arm64) or Windows, and follow the <a href=\"https://github.com/aws/aws-workload-credentials-provider#-running-as-a-container-sidecar-\" target=\"_blank\">setup steps and ECS and EKS examples</a> in the AWS Workload Credentials Provider README on GitHub. The provider is available at no additional charge, and standard <a href=\"https://aws.amazon.com/certificate-manager/pricing/\">ACM charges</a> apply to exported certificates. To learn more, see the <a href=\"https://docs.aws.amazon.com/acm/\" target=\"_blank\">AWS Certificate Manager documentation</a>.</p>"
  "83465a5848969253668cfc6ab648c100":
    "id": "83465a5848969253668cfc6ab648c100"
    "title": "AWS Lambda durable functions now supports pausing and deleting executions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/lambda-durable-pause-delete/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Lambda durable functions now lets you pause a running durable execution and resume it later without losing its progress. When you resume an execution, it continues from its last checkpoint on the same function version. By default, time spent paused doesn't count toward the execution timeout. You can also now delete a completed execution's data before its retention period ends.</p>\n<p>With Lambda durable functions, you can build resilient multi-step applications and AI workflows that run for up to one year, with built-in checkpointing and automatic retries. With this launch, when a downstream service is degraded or a model provider's rate limit is reached, you can pause affected executions while you resolve the issue instead of letting the retries run out. You can also delete an execution's history, checkpoint data, and input and output payloads after it succeeds, fails, stops, or times out. For example, you can delete an execution whose input contains personal data, or clean up failed executions that a bug left behind.</p>\n<p>You can pause, resume, and delete executions using the Lambda console, the AWS CLI, or the AWS SDKs in all AWS Regions where AWS Lambda durable functions is available.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-managing-executions.html\" target=\"_blank\">Managing durable executions</a> in the AWS Lambda Developer Guide, or visit the <a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\">AWS Lambda durable functions</a> product page. If you build with an AI coding assistant such as Kiro, the <a href=\"https://github.com/aws/agent-toolkit-for-aws\" target=\"_blank\">Agent Toolkit for AWS</a> gives it skills and guidance for building on AWS.</p>"
  "0285546028e87898696bf4545847d669":
    "id": "0285546028e87898696bf4545847d669"
    "title": "Amazon Route 53 Global Resolver is now available over AWS Cloud WAN for hybrid networks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/route-53-global-resolver-cloud-wan/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Route 53 Global Resolver now supports anycast DNS resolution for private connections managed through your AWS Cloud WAN configuration. This enables organizations with hybrid networks to resolve DNS queries to public and private domains over existing AWS Direct Connect or AWS VPN connections, with automatic multi-region failover for high availability.</p> \n<p>Previously, customers had to either deploy and manage separate Resolver endpoints in each AWS Region and customer location, with no automatic failover between AWS Regions, or use Global Resolver with internet-reachable anycast IPs, making it hard for clients without internet access or those restricted by compliance requirements to take advantage of Global Resolver's anycast DNS resolution. With this launch, customers with clients configured with private connectivity over your Cloud WAN network get all the benefits of Global Resolver: automatic regional failover for higher availability, centralized DNS filtering with Route 53 DNS Firewall to prevent DNS-based data exfiltration, and simplified query resolution of both public internet domains and private domains (hosted on Route 53).</p> \n<p>You can get started by enabling Global Resolver, for two or more AWS Regions, and associating it with your Cloud WAN network configuration. You can select one or more privately routable IP addresses (IPv4, IPv6) that do not conflict with addresses already in use in your Cloud WAN and define DNS Views to specify which private hosted zones and DNS filtering rules apply to your Cloud WAN segments. Then configure your on-premises clients to forward DNS queries to the private IP address configured with your Global Resolver.</p> \n<p>This feature is available in AWS Regions where both Global Resolver and AWS Cloud WAN are available. To learn more about Global Resolver, see the <a href=\"https://aws.amazon.com/route53/global-resolver/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>. To get started, see Route 53 Global Resolver <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/gr-what-is-global-resolver.html\" rel=\"noopener noreferrer\" target=\"_blank\">Developer Guide</a>.</p>"
  "1cf99fa26409d5ffb465e06988f74d3f":
    "id": "1cf99fa26409d5ffb465e06988f74d3f"
    "title": "Amazon Kinesis Data Streams announces queues to simplify and reduce costs of real-time processing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/kinesis-data-streams-queues/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p><a href=\"https://aws.amazon.com/kinesis/data-streams/\">Amazon Kinesis Data Streams</a> now supports queues, a simpler and more cost-effective way to process a stream. Because queues track the delivery state of each record, your consumer instances receive records instead of leasing shards, acknowledge each record when processing is complete, and scale beyond the number of shards. Kinesis Data Streams consumers can reduce the cost of processing data by up to 43% by using queues instead of the Kinesis Client Library.&nbsp;You no longer run a DynamoDB table or custom metrics, and you use compute more efficiently.</p> \n<p>Queues in Kinesis Data Streams are powered by Amazon SQS. Built on that foundation, a queue delivers records at least once, redelivers records your consumers do not acknowledge, and provides built-in dead-letter handling for records that keep failing. Each queue publishes its own CloudWatch metrics, so you can scale consumer instances on records waiting to be received and alarm on records that repeatedly fail.</p> \n<p>Use queues for applications that process each record independently, such as log processing, order fulfillment, and notifications. Use a stream consumer when processing one record depends on the records before it, such as live analytics, personalization, and anomaly detection. You ingest data once and let each application consume records through a queue or directly from the stream, with no change to your producers or existing stream consumers. For point-to-point messaging between application components, start with Amazon SQS. Choose queues in Kinesis Data Streams when the same records are needed by multiple applications.</p> \n<p>Queues are available for data streams in On-demand capacity mode. For regional availability, see <a href=\"https://docs.aws.amazon.com/streams/latest/dev/consuming-with-queues.html#queues-supported-regions\" target=\"_blank\">Supported AWS Regions</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/streams/latest/dev/consuming-with-queues.html\" target=\"_blank\">developer guide</a>, install the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/analytics-skills/managing-amazon-kinesis-data-streams\" target=\"_blank\">Kinesis Data Streams skill</a> from the Agent Toolkit for AWS, read the <a href=\"https://aws.amazon.com/blogs/big-data/reduce-the-complexity-and-cost-of-real-time-processing-with-queues-in-amazon-kinesis-data-streams/\">launch blog</a>, and see the <a href=\"https://aws.amazon.com/kinesis/data-streams/pricing/\">pricing page</a>.</p>"
  "c1352a769c89e3d774f1a536ee15559f":
    "id": "c1352a769c89e3d774f1a536ee15559f"
    "title": "Amazon Connect Customer now supports case and calculated template variables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/connect-case-and-calculated-attributes/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p><a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer</a> message templates, which personalize each message with details about its recipient, now support case fields from Cases and calculated attributes from Customer Profiles, such as a customer's most frequent contact channel. Companies that send updates about a claim, an order, or an application need each message to reflect that customer's record. Template authors can insert case fields, including custom fields that administrators define, and Connect Customer fills in the current value for each recipient every time it sends a message that uses the template.</p>\n<p>A claims manager at an insurance company can build one email template that pulls each claim's reference number and status from its case, so every policyholder receives an update about their own claim. A retailer can add a custom calculated attribute, such as each customer's total orders in the past year, to a loyalty email so every customer sees their own count. Developers can pass these values when they render a template with the <a href=\"https://docs.aws.amazon.com/connect/latest/APIReference/API_amazon-q-connect_RenderMessageTemplate.html\" target=\"_blank\">RenderMessageTemplate</a> API.</p>\n<p>You can use case and calculated attributes in message templates in the following AWS Regions: US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), and Europe (London).</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/personalize-templates.html\" target=\"_blank\">Add personalized content to message templates</a> in the Amazon Connect Customer Administrator Guide.</p>"
  "a15b120f04e440d7ea259be9b86e08a6":
    "id": "a15b120f04e440d7ea259be9b86e08a6"
    "title": "Cost Optimization Hub now supports stopping idle Amazon EC2 instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/cost-hub-stop-idle-ec2/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>AWS Cost Optimization Hub now lets you stop idle Amazon EC2 instances directly from your recommendations. Cost Optimization Hub consolidates and prioritizes cost optimization recommendations across your AWS accounts and Regions, including idle resources. Previously, stopping an idle instance required you to leave Cost Optimization Hub and identify the specific instance in the Amazon EC2 console. Now you can stop it from the Savings opportunities page in Cost Optimization Hub.</p> \n<p>When you choose Stop next to an idle instance recommendation, a confirmation shows the instance, its account and Region, what the instance loses when it stops, such as instance store data and data in memory, and what continues to bill, such as EBS volumes and Elastic IP addresses. Stopping does not terminate the instance or delete its EBS volumes, and you can start it again from the EC2 console. Stop needs no separate setup and uses your existing permissions. To receive idle resource recommendations, turn on Cost Optimization Hub and AWS Compute Optimizer.</p> \n<p>This feature is available at no additional charge in all AWS Regions except the AWS GovCloud (US) Regions and the China Regions.</p> \n<p>To get started, open Cost Optimization Hub in the AWS Billing and Cost Management console and go to Savings opportunities. To learn more, see the <a href=\"https://aws.amazon.com/aws-cost-management/cost-optimization-hub/\">Cost Optimization Hub product page</a> and <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/cost-optimization-hub.html\">user guide</a>.</p>"
  "3caee1998f7efd5d6bf54c8f2dd35870":
    "id": "3caee1998f7efd5d6bf54c8f2dd35870"
    "title": "AWS Transit Gateway supports native integration with Gateway Load Balancer"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/transit-gateway-gwlb-integration/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>AWS Transit Gateway now supports network function attachments of type Gateway Load Balancer, simplifying the deployment and management of network security across your AWS network.</p> \n<p>With a network function attachment, you can connect your transit gateway to a Gateway Load Balancer VPC endpoint service that fronts firewalls and other security appliances without complex VPC configurations. Transit Gateway creates and manages the Gateway Load Balancer endpoints in the Availability Zones you choose, removing the need to create dedicated endpoint subnets and route tables. The endpoint service can be in another AWS account.</p> \n<p>Network function attachments also support context sharing with security services. Transit Gateway adds resource context to traffic sent to your firewall, including the transit gateway attachment, VPC, subnet, and security groups. Your firewall can use this context alongside IP addresses to enforce segmentation policies.</p> \n<p>This capability is available in all commercial AWS Regions where both AWS Transit Gateway and Gateway Load Balancer are available, except Middle East (Bahrain) and Middle East (UAE). It is also available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/vpc/latest/tgw/tgw-nf-fw.html\">Network function attachments</a> in the AWS Transit Gateway Guide and visit the <a href=\"https://aws.amazon.com/transit-gateway/\">AWS Transit Gateway product page</a>.</p>"
  "1050ce7adbd092ef0a9ad400ed2ab54a":
    "id": "1050ce7adbd092ef0a9ad400ed2ab54a"
    "title": "AWS WAF announces simplified onboarding for Bot Control targeted protection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-waf-bot-control-onboarding/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>Today, AWS WAF announces a simplified console experience for Bot Control at the targeted inspection level. A single setting, Targeted bot control, turns on targeted protection for your Amazon CloudFront distributions with the configuration AWS recommends. It comes with two additions to the Bot Control managed rule group: bot confidence levels, which summarize the targeted detections on each request as High, Medium, or Low, and a LATEST version that keeps you on the newest detections automatically. Together, they help you protect your applications against sophisticated and AI-powered bots without writing label match rules or changing application code.</p> \n<p>The targeted inspection level uses machine learning and client-side signals to detect evasive bots. Previously, acting on those signals meant integrating the AWS WAF JavaScript SDK into every page, learning dozens of labels, and writing label match rules to combine them. Now, the rule group combines the detections into one confidence level per request, with one rule per level, and the Targeted bot control setting adds the rule group, applies the recommended action for each level, sets the version to LATEST, and turns on automatic SDK integration so CloudFront adds the SDK to your pages. You can change any action or start in Count.</p> \n<p>The Targeted bot control setting is available today for protection packs (web ACLs) used with Amazon CloudFront. Bot confidence levels and the LATEST version are available in all AWS Regions where AWS WAF Bot Control is available. Standard pricing for the targeted inspection level applies, with no additional charge for the setting or automatic SDK integration. To get started, open the AWS WAF console. To learn more, see <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-bot-control-targeted-console.html\" rel=\"noopener noreferrer\" target=\"_blank\">Turning on Targeted bot control</a> and <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-bot-confidence.html\" rel=\"noopener noreferrer\" target=\"_blank\">Bot confidence levels</a> in the AWS WAF Developer Guide, and read the <a href=\"https://aws.amazon.com/blogs/security/introducing-simplified-onboarding-for-aws-waf-bot-control-at-the-targeted-inspection-level/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Security Blog post</a>.</p>"
"last_updated": "2026-11-18 20:01:26 JST"
