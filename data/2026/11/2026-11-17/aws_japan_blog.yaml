    "title": "NTTドコモにおけるレシート OCR サーバーレスシステムの多重処理流量制御"
    "link": "https://aws.amazon.com/jp/blogs/news/docomo-receipt-ocr-system/"
    "published": "2026-11-17 09:59:52"
    "fetched": "2026-11-17 10:29:52"
    "summary": "NTTドコモは「つなごう。驚きを。幸せを。」をブランドスローガンとして掲げ、コンシューマ通信事業をはじめ金融・決済、マーケティングソリューション、スマートライフ領域など多岐にわたる事業を展開しています。本記事では、その中からマーケティングソリューションの1つであり、dポイント経済圏や販促ソリューションを支える「レシートでためる」サービスでの取り組みをご紹介します。"
  "b787ecd2ae833becbd79395e635e0da2":
    "id": "b787ecd2ae833becbd79395e635e0da2"
    "title": "週刊AWS – 2026/11/09週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20261109/"
    "published": "2026-11-17 03:03:21"
    "fetched": "2026-11-17 10:29:52"
    "summary": "Amazon S3 Access Points for Amazon FSx が追加リージョンで利用可能に、Claude Fable 5.2 が AWS で利用可能に、Amazon Bedrock AgentCore が Web Search API の提供を開始、AWS Network Firewall が次世代ファイアウォール (NGFW) ポリシーを発表、Amazon ElastiCache Serverless がベクトル検索、全文検索、ハイブリッド検索および集計に対応、AWS Billing and Cost Management がカスタム請求ビューのソースビューとして AWS Billing Conductor と AWS Billing Transfer のビューをサポート、AWS Emulator の提供を開始、AWS アプリケーションをローカルで構築・テスト可能に、Amazon Cognito がユーザープールのセッション管理に対応、AWS Network Security Manager が AWS European Sovereign Cloud リージョンと新たな 31 リージョンで利用可能に、AWS Quick が構造化データソースを制限できる詳細なガバナンス機能を追加、AWS Secrets Manager がクロスアカウントレプリケーションをサポート、Amazon Bedrock AgentCore Identity が OAuth 2.0 discovery URL をサポート"
  "53cf7cc819eb353cb304bb74511f3ffc":
    "id": "53cf7cc819eb353cb304bb74511f3ffc"
    "title": "AWS KMS: キーはいくつ必要か? 4 つの原則から考えるキー管理戦略"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-kms-how-many-keys-do-i-need/"
    "published": "2026-11-17 16:10:28"
    "fetched": "2026-11-17 19:05:05"
    "summary": "AWS KMS を使用する際、「実際にいくつのキーが必要か?」は多くのお客様が抱く疑問です。この記事では、データ分類、アプリケーション、AWS サービス、職務の分離という 4 つの指針となる原則に基づき、必要な KMS キーの数を判断する方法を解説します。一元的なアプローチ、分散型アプローチ、ハイブリッドモデルの比較と具体例に加え、AWS マネージドキーとカスタマーマネージドキーの選択基準、コスト、管理性といった考慮事項も紹介します。"
  "509d1273b86e6499ff2ff7c4d7aa75f6":
    "id": "509d1273b86e6499ff2ff7c4d7aa75f6"
    "title": "AWS KMS か AWS CloudHSM か: 適切なキー管理ソリューションの選び方"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-kms-or-aws-cloudhsm-choose-the-right-key-management-solution/"
    "published": "2026-11-17 12:41:40"
    "fetched": "2026-11-17 19:05:05"
    "summary": "AWS Key Management Service (AWS KMS) と AWS CloudHSM は、どちらも HSM を基盤とするキー管理を提供しますが、適したユースケースは大きく異なります。本記事では、両サービスに共通するセキュリティとコンプライアンスの特長を整理します。そのうえで、AWS サービスとの統合、運用のシンプルさ、コストの観点から AWS KMS を選択すべきケースを解説します。PKCS#11 などの従来型の HSM インターフェイスやレガシーアルゴリズムが必要な場合に AWS CloudHSM を選択すべき理由と、損益分岐点の分析も紹介します。"
