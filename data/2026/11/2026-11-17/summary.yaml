"overview": |
  この日は 6 ソースから 57 本で、セキュリティ速報 3 件、KMS を中心とした暗号鍵管理、ネットワークセキュリティ、請求・コスト管理の機能追加、Bedrock Managed Knowledge Base と AgentCore の記事が目立ちました。セキュリティ速報 (いずれも 11 月 16 日 PST 公開) では、CVE-2026-129266 が Amazon Deep Java Library (DJL) 0.7.0 から 0.38.0 でモデルアーカイブのメタデータ内のリソース位置が検証されず、リモートの未認証の攻撃者が任意のローカルファイルを読めるおそれがあるもの、CVE-2026-126816 が AWS Pricing MCP Server (aws-pricing-mcp-server) のコストレポート生成ツールのパストラバーサルによる任意ファイル書き込み、CVE-2026-126681 が AWS Labs Timestream for InfluxDB MCP Server の接続設定処理で意図したエンドポイントへの制限が不適切なものです。セキュリティ機能では、IAM が Access Denied エラーの背後にある認可コンテキスト全体を可視化する Access Troubleshooter を導入し、AWS Security Hub が Google Cloud Platform (GCP) のリソースも監視してリスク分析・CSPM・脆弱性管理・セキュリティ対応を広げました。Route 53 Resolver DNS Firewall は Infoblox Threat Defense の脅威インテリジェンスを直接適用できるプレビューに加え、VPC で観測した DNS クエリから許可リストを自動生成する機能に対応し、AWS Transit Gateway はアタッチしたファイアウォールに VPC・サブネット・セキュリティグループなどのコンテキストを共有してセグメンテーションポリシーに使えるようにしたほか、Gateway Load Balancer をネットワーク機能アタッチメントとしてネイティブに統合しました。AWS WAF は Bot Control の対象を絞った保護を 1 つの設定で有効にできる簡素化したオンボーディングを発表し、Amazon S3 は耐量子 TLS (PQ-TLS) の鍵交換を S3 Vectors と S3 の PrivateLink インターフェイスエンドポイントに広げ、CloudTrail に TLS の鍵交換アルゴリズムを記録して PQ-TLS を使うリクエストとクライアントを確認できるようにしました。鍵管理では、AWS KMS が AWS Resource Access Manager (RAM) と統合されて組織内のアカウント間で KMS キーを共有しやすくなり、Amazon EBS はスナップショットに追加の KMS キーを関連付けて暗号化スナップショットをアカウントやリージョンをまたいで共有・コピーできるようになり、オープンソースの AWS Workload Credentials Provider は ACM 証明書を ECS などのコンテナで動くアプリケーションへ書き出せるようになりました。日本語ブログでも、データ分類・アプリケーション・AWS サービス・職務の分離の 4 原則から必要な KMS キーの数を考える記事と、KMS と CloudHSM の選び方を整理する記事が公開されています。請求・コスト管理では、AWS クレジットを小さなクレジットに分割して支払いアカウント配下のリンクアカウントへ移せるクレジットの分割と移転、クレジット・Reserved Instances・Savings Plans の組織内での共有を対称かつきめ細かく制御する共有コントロール、共有された S3 汎用バケットのストレージとリクエストのコストを CUR でプレフィックスごとに配分できる Split Cost Allocation Data の S3 対応、Cost Optimization Hub の推奨から直接アイドル状態の EC2 インスタンスを停止できる機能が発表され、Amazon EKS Auto Mode では実際の使用量に基づいて実行中の Pod の CPU とメモリのリクエストを適正化するリソース最適化がプレビューになりました。ストリーミング・データでは、Amazon Kinesis Data Streams がレコードごとに配信状態を追跡するキューに対応し、Kinesis Client Library の代わりに使うことで処理コストを最大 43% 削減でき、DynamoDB テーブルも不要になります。Amazon S3 Vectors はベクトル類似検索と全文検索を 1 クエリで組み合わせるハイブリッド検索に対応し、S3 Storage Lens が S3 Intelligent-Tiering のアクセス階層ごとのオブジェクト数とストレージ量を表示するようになり、Amazon Redshift が Apache Iceberg テーブルのマルチステートメントトランザクション、書き込み競合の自動解決、タイムトラベルに対応し、Amazon ECR がイメージの削除とタグの除去をレプリケーション先に複製するようになりました。コンピュート・ネットワークでは、AWS Lambda の durable functions が実行の一時停止と最後のチェックポイントからの再開、削除に対応し、SageMaker HyperPod がスケーリングとオンデマンドの Deep Health Check の要求を追跡するクラスターオペレーションを導入し、Route 53 Global Resolver が AWS Cloud WAN 経由のプライベート接続でエニーキャスト DNS 解決に対応し、AWS Elemental MediaConnect が RTMP・RTMPS・eRTMP などのプロトコルとルーティング制御を拡充しました。そのほか、AWS アカウントを持たない開発者がエージェント型コーディング環境から新しい AWS サインアップ体験を開けるエージェント型アカウント作成、AWS DevOps Agent の AWS GovCloud (米国西部) での提供、Amazon Connect Health の医療コーディングの HIPAA 対象パブリックプレビュー、Amazon Connect Customer のエージェントアシストの対話型コンポーネント対応とメッセージテンプレートでのケースフィールド・計算属性の利用、AWS Marketplace Metering Service の MeterUsage / BatchMeterUsage API の小数使用量対応、Amazon WorkSpaces で AI エージェントのセットアップ・接続・ガバナンスを素早く行う方法が発表されました。Architecture Blog では Well-Architected Framework を Well-Architected Cloud Foundations と Well-Architected Cloud Workloads に再編し新しいベストプラクティスを加える更新が発表されました。Machine Learning Blog では、Bedrock のオープンウェイトモデルでのプロンプトキャッシュ、Managed Knowledge Base のテナントごとの回答カスタマイズ (検索指示) と CSV / XLSX / XLS を対象とする表形式検索、AgentCore メモリと組み合わせて長期記憶を AgenticRetrieveStream 1 回で扱う Agentic Retrieve、Bedrock Guardrails の Denied Topics の書き方、Bedrock・Kiro IDE・AWS Transform によるメインフレーム Assembler の Java へのモダナイズ、製造業の知見に基づくマルチエージェントの設計パターンとアンチパターン、Novo Nordisk (GraphRAG による製造工程文書のアシスタント)・MoEngage (Merlin AI)・Duco (テナント分離と MCP を用いた金融データ自動化) の AgentCore 事例が公開されました。News Blog の週次まとめは AWS Nitro Sandboxes や AWS Emulator を取り上げ、日本語ブログでは週刊AWS (11 月 9 日週)、NTT ドコモのレシート OCR サーバーレスシステムにおける多重処理の流量制御、NESIC ホールディングス傘下 3 社の 99 名が AI エージェント Kiro でトラブルシューティングに挑んだ NESICホールディングス Cup 2026 の開催レポートが公開されました。移行関連では、AWS Transform がネットワーク移行の一環として F5 BIG-IP ロードバランサーの設定を Elastic Load Balancing (ALB / NLB) へ移行できるようになり、AWS Outposts を移行先として選べるようになった (オンプレミス、別の Outpost、別のアベイラビリティーゾーンやリージョンから移行可能) ほか、移行時にターゲットネットワークを AWS Well-Architected Agent がレビューして推奨事項を示す Well-Architected レビューも加わりました。
