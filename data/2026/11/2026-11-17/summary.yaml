"overview": |
  この日は 6 ソースから 30 本で、セキュリティ速報 3 件、KMS を中心とした暗号鍵管理、Bedrock Managed Knowledge Base と AgentCore の記事が目立ちました。セキュリティ速報 (いずれも 11 月 16 日 PST 公開) では、CVE-2026-129266 が Amazon Deep Java Library (DJL) 0.7.0 から 0.38.0 でモデルアーカイブのメタデータ内のリソース位置が検証されず、リモートの未認証の攻撃者が任意のローカルファイルを読めるおそれがあるもの、CVE-2026-126816 が AWS Pricing MCP Server (aws-pricing-mcp-server) のコストレポート生成ツールのパストラバーサルによる任意ファイル書き込み、CVE-2026-126681 が AWS Labs Timestream for InfluxDB MCP Server の接続設定処理で意図したエンドポイントへの制限が不適切なものです。鍵管理では、AWS KMS が AWS Resource Access Manager (RAM) と統合されて組織内のアカウント間で KMS キーを共有しやすくなり、Amazon EBS はスナップショットに追加の KMS キーを関連付けて暗号化スナップショットをアカウントやリージョンをまたいで共有・コピーできるようになりました。日本語ブログでも、データ分類・アプリケーション・AWS サービス・職務の分離の 4 原則から必要な KMS キーの数を考える記事と、KMS と CloudHSM の選び方を整理する記事が公開されています。ストレージ・データでは、Amazon S3 Vectors がベクトル類似検索と全文検索を 1 クエリで組み合わせるハイブリッド検索に対応し、Amazon Redshift が Apache Iceberg テーブルのマルチステートメントトランザクション、書き込み競合の自動解決、タイムトラベルに対応し、Amazon ECR がイメージの削除とタグの除去をレプリケーション先に複製するようになりました。そのほか、AWS DevOps Agent が AWS GovCloud (米国西部) で利用可能になり、Amazon Connect Health の医療コーディングが HIPAA 対象のパブリックプレビューとして公開され、Amazon Connect Customer のエージェントアシストがカード・カルーセル・ボタン・入力フィールドなどの対話型コンポーネントに対応し、AWS Marketplace Metering Service の MeterUsage / BatchMeterUsage API が小数の使用量に対応し、Amazon WorkSpaces で AI エージェントのセットアップ・接続・ガバナンスを素早く行う方法が紹介されました。Architecture Blog では Well-Architected Framework を Well-Architected Cloud Foundations と Well-Architected Cloud Workloads に再編し新しいベストプラクティスを加える更新が発表されました。Machine Learning Blog では、Bedrock のオープンウェイトモデルでのプロンプトキャッシュ、Managed Knowledge Base のテナントごとの回答カスタマイズ (検索指示) と CSV / XLSX / XLS を対象とする表形式検索、AgentCore メモリと組み合わせて長期記憶を AgenticRetrieveStream 1 回で扱う Agentic Retrieve、Bedrock Guardrails の Denied Topics の書き方、Bedrock・Kiro IDE・AWS Transform によるメインフレーム Assembler の Java へのモダナイズ、製造業の知見に基づくマルチエージェントの設計パターンとアンチパターン、Novo Nordisk (GraphRAG による製造工程文書のアシスタント)・MoEngage (Merlin AI)・Duco (テナント分離と MCP を用いた金融データ自動化) の AgentCore 事例が公開されました。News Blog の週次まとめは AWS Nitro Sandboxes や AWS Emulator を取り上げ、日本語ブログでは週刊AWS (11 月 9 日週)、NTT ドコモのレシート OCR サーバーレスシステムにおける多重処理の流量制御、NESIC ホールディングス傘下 3 社の 99 名が AI エージェント Kiro でトラブルシューティングに挑んだ NESICホールディングス Cup 2026 の開催レポートが公開されました。
