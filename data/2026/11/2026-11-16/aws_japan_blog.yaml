  "a41069b6e695c1617de1a4ac8d75929f":
    "id": "a41069b6e695c1617de1a4ac8d75929f"
    "title": "AWS セキュリティ運用を定着させる: AWS Security Hub と Amazon GuardDuty を活用する成熟度ロードマップ"
    "link": "https://aws.amazon.com/jp/blogs/news/operationalizing-aws-security-a-maturity-roadmap/"
    "published": "2026-11-16 09:35:16"
    "fetched": "2026-11-16 09:41:15"
    "summary": "AWS Security Hub と Amazon GuardDuty を有効化したものの、検出結果を運用に活かしきれていない組織に向けて、6 つのフェーズからなる成熟度ロードマップを紹介します。現状評価から始め、抑制ルールやコントロールの無効化によるノイズ削減、Amazon EventBridge と AWS Lambda を使った重要度別の通知、高信頼度の検出結果に対する自動修復の判断フレームワークを解説します。さらに、週次レビューや月次メトリクスによる運用サイクルの確立と、予防的コントロールによるアーキテクチャの成熟までを説明します。"
  "12e4e158f1381a2233497723f12385bf":
    "id": "12e4e158f1381a2233497723f12385bf"
    "title": "週刊生成AI with AWS – 2026/11/9週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20261109/"
    "published": "2026-11-16 15:40:12"
    "fetched": "2026-11-16 16:35:44"
    "summary": "週刊生成AI with AWS, re:Invent まであと 2 週間の 2026 年 11 月 9 日週号 – 東京製鐵様、IHI 様、国内大手製造業様の AWS 生成 AI 国内事例を含む 32 件のブログ記事を紹介。サービスアップデートでは、Claude Fable 5.2 の提供開始、次世代 AgentCore Runtime のデフォルト化、Amazon Bedrock AgentCore の Web Search API 含む 37 件を紹介。"
  "63eab5607f6911076999fdbb9380d13f":
    "id": "63eab5607f6911076999fdbb9380d13f"
    "title": "AWS でのマルウェア解析: 安全な環境の構築"
    "link": "https://aws.amazon.com/jp/blogs/news/malware-analysis-on-aws-setting-up-a-secure-environment/"
    "published": "2026-11-16 09:50:12"
    "fetched": "2026-11-16 16:35:44"
    "summary": "AWS でマルウェア解析を行うための、安全でコンプライアンスに準拠した環境の構築方法を紹介します。AWS 適正利用規約と AWS サービス条件への準拠を前提に、Amazon VPC によるネットワーク分離と送信トラフィックの遮断、IAM のアクセス許可の境界や SCP による権限昇格の防止、インスタンスの強化、暗号化された Amazon S3 ストレージ、Amazon GuardDuty や AWS CloudTrail によるモニタリングまでを扱います。多層防御のアプローチとセットアップチェックリストもあわせて解説します。"
  "fd5807754f4355cbcf5be99390629cdf":
    "id": "fd5807754f4355cbcf5be99390629cdf"
    "title": "S3 バケットへフォレンジックアーティファクトを安全に収集するためのフレームワーク"
    "link": "https://aws.amazon.com/jp/blogs/news/a-framework-for-securely-collecting-forensic-artifacts-into-s3-buckets/"
    "published": "2026-11-16 09:45:11"
    "fetched": "2026-11-16 16:35:44"
    "summary": "セキュリティインシデントの発生時に、フォレンジックアーティファクトを Amazon S3 バケットへ安全に収集するためのフレームワークを紹介します。AWS STS とセッションポリシーを組み合わせて、有効期限付きで権限を絞り込んだ一時的な認証情報を払い出します。これにより、既存のフォレンジックツールを変更せずに最小権限を実現できます。また、暗号化やバージョニングなどの S3 バケット設定のベストプラクティスを解説します。さらに、Step Functions、AWS Systems Manager、AWS CDK を使用した収集ワークフローの自動化とデプロイの手順も説明します。"
  "8df679c98d9ec35a8034098688afc586":
    "id": "8df679c98d9ec35a8034098688afc586"
    "title": "AWS Systems Manager と Amazon Security Lake を使用したファイル整合性監視"
    "link": "https://aws.amazon.com/jp/blogs/news/file-integrity-monitoring-with-aws-systems-manager-and-amazon-security-lake/"
    "published": "2026-11-16 09:41:09"
    "fetched": "2026-11-16 16:35:44"
    "summary": "Amazon EC2 インスタンス上の不正なファイル変更を検出する、サーバーレスのファイル整合性監視ソリューションの構築方法を紹介します。AWS Systems Manager Inventory でファイルメタデータを収集し、バージョニングを有効にした Amazon S3 バケットに保存します。AWS Lambda 関数でバージョン間の差分を比較して AWS Security Hub に検出結果を作成します。さらに、Amazon Security Lake で OCSF 形式に正規化し、Amazon Athena で分析する手順も解説します。"
"last_updated": "2026-11-16 16:35:44 JST"
