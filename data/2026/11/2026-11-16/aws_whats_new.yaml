"entries":
  "bc0fe7f39229068f9c25753bc64f5c2b":
    "id": "bc0fe7f39229068f9c25753bc64f5c2b"
    "title": "AWS Secrets Manager adds managed external secrets support for Auth0, Okta, and Palo Alto Networks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/secrets-manager-managed-external-secrets-auth0-okta-palo-alto/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS Secrets Manager now supports managed external secrets for Auth0, Okta, and Palo Alto Networks. Long-lived credentials that are not rotated increase the risk of unauthorized access if exposed. Rotating a third-party credential requires coordinated updates to the external service and every application that uses it. You set a rotation schedule from the AWS Management Console or API. Secrets Manager rotates the credential and stores the current value without a custom rotation Lambda function.</p> \n<p>Secrets Manager offers self-rotation and administrator-assisted rotation for Auth0 credentials. With self-rotation, the target application replaces its own secret. With administrator-assisted rotation, a separate Auth0 application with Management API permissions replaces the target application's secret. For Okta, Secrets Manager offers administrator-assisted rotation with a separate administrator JSON Web Token (JWT) key and validates the replacement before deactivating the old secret. For Palo Alto Networks, Secrets Manager offers self-rotation, in which the current API key authorizes its replacement.</p> \n<p>Applications that already retrieve credentials from Secrets Manager receive the rotated value without a code change or deployment. </p> \n<p>These integrations join existing managed external secrets support for BigID, Cisco Security Platform, Confluent Cloud, Databricks, Datadog, GitLab, Jenkins, MongoDB Atlas, Netskope, Paddle, Salesforce, Snowflake, SonarQube, and Twilio.</p> \n<p>Auth0, Okta, and Palo Alto Networks managed external secrets are available in all AWS Regions where AWS Secrets Manager managed external secrets is supported. To learn more, visit the &nbsp;<a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/managed-external-secrets.html\">AWS Secrets Manager managed external secrets documentation&nbsp;</a>.</p>"
  "edd0f9a1e8808299493eaaceee886097":
    "id": "edd0f9a1e8808299493eaaceee886097"
    "title": "IAM Identity Center now supports VPC endpoints and network access controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-identity-center-vpc-endpoints/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS IAM Identity Center now supports interface VPC endpoints powered by AWS PrivateLink and network access controls, enabling you to keep IAM Identity Center traffic private and restrict which networks can reach your&nbsp;IAM Identity Center services.</p> \n<p>Previously, IAM Identity Center rejected traffic arriving through VPC endpoints, requiring all sign-in and API traffic to use public endpoints. With this launch, you can create interface VPC endpoints for&nbsp;AWS access portal and service APIs to route traffic over the AWS private network. IAM Identity Center sign-in traffic flows through the AWS Sign-in VPC endpoint. You can attach VPC endpoint policies to each endpoint to scope which AWS organizations, accounts and resources are reachable through your private connection.</p> \n<p>Network access controls add a second layer of enforcement at the IAM Identity Center instance level. When enabled, you can require that all access arrive through a VPC endpoint, allow specific IP address ranges or VPCs as trusted sources, and exclude individual applications from enforcement to accommodate services that connect from outside your VPC. SCIM provisioning traffic from your external identity provider can be independently restricted to known IP address ranges. Network access controls are configured through the IAM Identity Center API and are disabled by default.</p> \n<p>This capability is available in all commercial AWS Regions and the AWS GovCloud (US) Regions at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/vpc-interface-endpoints.html\" rel=\"noopener noreferrer\" target=\"_blank\">Interface VPC endpoints</a> in the IAM Identity Center User Guide.&nbsp;For more information, visit the <a href=\"https://aws.amazon.com/iam/identity-center/\" rel=\"noopener noreferrer\" target=\"_blank\">IAM Identity Center product page</a>.</p>"
  "4897cf7545ece45b60b98ff7093188ee":
    "id": "4897cf7545ece45b60b98ff7093188ee"
    "title": "AWS Backup adds logically air-gapped vault support for Amazon RDS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-backup-air-gapped-vault-rds/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS Backup logically air-gapped vault now supports Amazon Relational Database Service (Amazon RDS) DB instances. Logically air-gapped vaults are a type of AWS Backup vault that stores immutable, isolated backups, which are locked by default with AWS Backup Vault Lock in compliance mode. Secure sharing across accounts and AWS Organizations enables direct restore, reducing recovery time from a data loss event.</p> \n<p>You can now protect your Amazon RDS DB instances in logically air-gapped vaults. A logically air-gapped vault stores immutable backups that are locked by default, and isolated with encryption using AWS owned keys or customer-managed keys. This helps reduce the risk of downtime, ensure business continuity, and meet compliance requirements.</p> \n<p>To get started, use the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. Assign your RDS DB instances to a backup plan and specify a logically air-gapped vault in the same AWS Region as the copy destination. Share the vault for recovery or restore testing with other accounts using AWS Resource Access Manager (RAM), or safeguard vault access during account compromise using <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/multipartyapproval.html\" rel=\"noopener noreferrer\" target=\"_blank\">Multi-party approval</a>. Once shared, you can initiate direct restore jobs from that account.</p> \n<p>This support is available in most AWS Regions where both logically air-gapped vault and Amazon RDS are available. For more information and detailed regional availability, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-resource\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Backup documentation</a>. To learn more about logically air-gapped vaults for RDS, read the <a href=\"https://aws.amazon.com/blogs/storage/introducing-aws-backup-logically-air-gapped-vault-support-for-amazon-rds/\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog</a> and visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html\" rel=\"noopener noreferrer\" target=\"_blank\">feature documentation</a> and <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>.</p>"
  "289e855bd36e49fe46394c9c2170aecc":
    "id": "289e855bd36e49fe46394c9c2170aecc"
    "title": "AWS WAF advanced rate-based rules are now available in AWS GovCloud (US), Thailand, and Mexico"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/waf-advanced-rate-rules-available/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS WAF advanced rate-based rules are now available in the Asia Pacific (Thailand), Mexico (Central), AWS GovCloud (US-East), and AWS GovCloud (US-West) Regions. Customers in these Regions can now aggregate requests using custom keys and choose a 1 or 2 minute evaluation window in addition to the existing 5 and 10 minute options, the same capabilities already available in other AWS Regions.</p>\n<p>A rate-based rule counts requests and applies an action, such as Block or CAPTCHA, when the request rate exceeds a limit you set. Previously, rate-based rules in these Regions could aggregate requests only by IP address and used a 5 or 10 minute evaluation window. Now you can aggregate by request components such as HTTP headers, cookies, query strings, URI paths, HTTP methods, and label namespaces, and combine up to five of them into a composite key. For example, you can limit login attempts per IP address and User-Agent pair, or per session cookie, which helps against attacks spread across many IP addresses. A shorter evaluation window detects request floods sooner, and a longer window catches slower, sustained attacks.</p>\n<p>You can configure these options in the AWS WAF console, the AWS CLI and SDKs, and AWS CloudFormation. There is no additional charge for these capabilities, and standard AWS WAF pricing applies. Advanced rate-based rules are now available in all commercial AWS Regions where AWS WAF is available and in the AWS GovCloud (US) Regions. To learn more, see <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html\" target=\"_blank\">Using rate-based rule statements</a> in the AWS WAF Developer Guide.</p>"
  "642728a12d84f407abfda083d8d2989f":
    "id": "642728a12d84f407abfda083d8d2989f"
    "title": "AWS announces Networking Flexible Cost Allocation for Amazon VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/networking-flexible-cost-allocation/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Amazon Virtual Private Cloud (VPC) now supports Networking Flexible Cost Allocation (FCA), which splits shared networking costs by the resources that actually drive them, so you can see what each team or application used. Until now, <a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-and-usage-reporting/\">AWS Cost and Usage Report</a> (CUR), including CUR 2.0 in AWS Data Exports, showed networking usage as a single item, and most customers split it across teams with custom scripts and manual estimates. FCA splits this line item by the resources that generated it. It supports NAT gateway data processing and data transfer, including traffic to the internet, and in-Region Amazon Elastic Compute Cloud (Amazon EC2) and VPC peering data transfer.</p>\n<p>Today, when several teams share a resource such as a NAT gateway, the account that owns it pays the full cost and can't see which team or application drove it. To work around this, some customers built custom scripts to analyze VPC Flow Logs, which takes ongoing engineering effort. Others used fixed-percentage splits, which overcharge some teams and undercharge others. FCA breaks down usage based on traffic sources, helping you accurately track financial metrics based on applications and teams. To get started, attach a cost allocation policy to a NAT gateway, VPC peering connection, or Amazon EC2 instance, then select Networking flexible cost allocation under split cost allocation data in the AWS Billing and Cost Management console. Allocated line items appear in your CUR within 24 hours. FCA changes only how costs are shown in your reports. Your bill and total charges stay the same.</p>\n<p>FCA is available at no additional charge. It's supported in all AWS commercial Regions except Middle East (Bahrain) and Middle East (UAE). It's also available in the China Regions. It is not available in the AWS GovCloud (US) Regions. To learn more, visit the <a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/networking-flexible-cost-allocation.html\" target=\"_blank\">Networking FCA product page</a>.</p>"
  "07bf7a89520058a3df4f6acd714286a0":
    "id": "07bf7a89520058a3df4f6acd714286a0"
    "title": "AWS IAM Identity Center now supports ForceAuthn in SAML requests"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-identity-center-reauth/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>AWS IAM Identity Center now gives you the option to require workforce users to re-authenticate with your external identity provider (IdP) each time their user interactive session expires. By default, when a user's session expires, IAM Identity Center renews it through the user's existing IdP session, and the user isn't prompted to sign in again. For organizations with strict security or compliance requirements that mandate explicit user verification at regular intervals, this automatic renewal may not meet policy requirements.</p> \n<p>When you set user re-authentication to Required and a user's user interactive session expires, IAM Identity Center prompts the user to re-authenticate with your external IdP. This helps you enforce stronger sign-in controls for regulated workloads. IAM Identity Center implements this by adding the SAML 2.0 ForceAuthn attribute to the SAML request sent to your IdP.</p> \n<p>You can configure user re-authentication for any IAM Identity Center instance (organization or account) that's connected to an external IdP as its identity source. The setting applies only to service provider initiated sign-ins, where users sign in through your AWS access portal URL. Changes to the user re-authentication setting are logged in AWS CloudTrail, so you can audit when it was turned on or off.</p> \n<p>User re-authentication is available in all AWS Regions where IAM Identity Center is available at no additional cost. To learn more, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/require-user-reauthentication.html\" rel=\"noopener noreferrer\" target=\"_blank\">Require user re-authentication</a> in the AWS IAM Identity Center User Guide.</p>"
  "2efe30d107a30e9184ef937261f24f74":
    "id": "2efe30d107a30e9184ef937261f24f74"
    "title": "AgentCore runtime instances are now available in six more AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/agentcore-aws-regions/"
    "published": "2026-11-16 16:30:00"
    "fetched": "2026-11-17 10:29:51"
    "summary": "<p>Amazon Bedrock AgentCore <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances.html\">runtime instances</a> are now available in six additional AWS Regions: US West (N. California), Canada (Central), Europe (London), Europe (Paris), Europe (Stockholm), and Asia Pacific (Seoul). Runtime instances run your agents on Amazon EC2 instances while AgentCore handles provisioning, patching, scaling, and lifecycle management.</p> \n<p>By expanding to these AWS Regions, more teams can use <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/08/aws-bedrock-agentcore-runtime-instances-generally-available/\">runtime instance capabilities</a> such as GPU-accelerated, memory-optimized, or compute-optimized instance types, and long-running agent sessions of up to 14 days. You can run your agents closer to your users to reduce invocation latency, and keep agent instances, storage volumes, and session data in the Region that your data residency requirements call for.</p> \n<p>With this expansion, you can use runtime instances in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), and Asia Pacific (Tokyo). You are charged for managing the provisioned compute, in addition to your Amazon EC2 costs.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a> in the Amazon Bedrock AgentCore Developer Guide</li> \n <li><a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a></li> \n <li><a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-instances.html\">Runtime instances and capacity providers</a> in the Amazon Bedrock AgentCore Developer Guide</li> \n</ul>"
  "f6153c8977768ea2dfc4f9e819552287":
    "id": "f6153c8977768ea2dfc4f9e819552287"
    "title": "Amazon SageMaker AI now supports KV cache-aware routing for real-time inference endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-kv-cache-routing/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-17 19:05:04"
    "summary": "<p>Amazon SageMaker AI now supports KV cache-aware routing for real-time inference endpoints, enabling you to reduce time to first token for LLM workloads with long or repeated prompts. Serving engines such as vLLM store the computed key-value (KV) cache for repeated prompt starts such as shared system prompts, documents, and conversation history, to skip repeated work. Across several instances, a request that lands where the cache is missing recomputes it. Under high load, instances also evict cached blocks to free GPU memory, including shared prompts and earlier conversation turns.</p>\n<p>KV cache-aware routing sends each request to the instance that holds the longest matching part of its prompt in cache. The vLLM container reports the cache blocks it stores and evicts, and SageMaker routes with that live view. If the lookup is slow or finds no match, the endpoint falls back to load-aware routing, so the request is still served. Prefix-aware routing suits stable shared prompts, short prompts, or moderate load. KV cache-aware routing suits long prompts, high load, and limited GPU memory.</p>\n<p>Customers can now enable this feature by setting `RoutingStrategy` to `KV_AWARE` on a production variant and adding one environment variable so the container reports cache events. Customer can invoke the endpoint with the same APIs and OpenAI-compatible payloads. It supports single-model endpoints and inference components, including LoRA adapters, on GPU instances. It requires the AWS vLLM Deep Learning Container version 0.33.0 or later with at least two instances or inference component copies. Detailed observability metrics show KV cache hit rate. There is no additional charge for KV cache-aware routing.</p>\n<p>KV cache-aware routing is available today in all AWS Regions where Amazon SageMaker AI is available. To get started, update to the latest AWS SDK or CLI. To learn more, visit the <a href=\"https://aws.amazon.com/sagemaker/ai/deploy/\">Amazon SageMaker AI inference page</a> and see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_ProductionVariantRoutingConfig.html\" target=\"_blank\">API documentation</a>.</p>"
  "82918577ab0285c95094a09eba603ce1":
    "id": "82918577ab0285c95094a09eba603ce1"
    "title": "AWS Network Firewall now supports context-aware rules with AWS Transit Gateway-attached firewalls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-firewall-context-aware-rules/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Network Firewall attached to AWS Transit Gateway now allows you to use context-aware rules in your firewall policy. Network Firewall is a managed firewall and intrusion prevention service that inspects and filters traffic across your virtual private clouds (VPCs). With context-aware rules, you write rules that reference context from VPC resources instead of IP addresses. This makes it easier to apply consistent security controls as your organization grows. Existing rules automatically cover new workloads, so you don't need to update rules manually.</p> \n<p>Context-aware rules match traffic using VPCs, subnets, security groups, and Transit Gateway attachment identifiers, collectively known as context identifiers. You can reference context identifiers in a rule's source for any protocol, and in its destination for TCP-based protocols such as HTTP, TLS, and SSH. Flow and alert logs include context identifiers, so you can investigate activity based on context.</p> \n<p>Context-aware rules are available at no additional charge in all commercial and AWS GovCloud (US) Regions. For a full list of supported Regions, see the <a href=\"https://builder.aws.com/build/capabilities/explore?f=eJxVirEKg0AQBX9FXq1FWiGFjZAmRVKkcC0uusji4cneqYj477lcEUg3b94c8Gy5C9w_eBA3eZRoCIsv2PhQXAgt8l9TrUaseYuVsMewmvbsT-WY1c2sYa_FBtbYHIRAKJs2J8wRCE4JcQxfG98xSc-6Sse3Pn0uuWviNXH1emZ3DpvTMatFeTPWEs72xPkBR_VAow&amp;tab=service-feature&amp;refid=d08148e0-c462-4c19-ae34-467de69e31c6\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Capabilities by Region page</a>.</p> \n<p>To learn more, see the AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\">product page</a> and <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/context-aware-rules.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "9446c39f68692094b85cf9da38bc7ca9":
    "id": "9446c39f68692094b85cf9da38bc7ca9"
    "title": "AWS Security Hub now detects when vulnerable software is running on Amazon EC2 instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-detects-vulnerable-software/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Security Hub now detects when software with a known vulnerability is actively running on your Amazon EC2 instances. Exposure findings now include a new trait, *The EC2 instance is running software with a known vulnerability*. These findings get a higher severity rating than findings for the same vulnerability where the software isn't running. This helps your security team focus on the vulnerabilities that pose the greatest risk,&nbsp;without investing time and resources to investigate if the software is actually in use.</p> \n<p>Security teams managing thousands of instances can now prioritize patching based on actual runtime risk.&nbsp; Security Hub correlates data from Amazon GuardDuty Runtime Monitoring and Amazon Inspector VM Scanner to detect running vulnerable software. It then combines this with other signals to generate exposure findings for EC2 resources that may be at risk, so you can prioritize response and remediation.</p> \n<p>This capability is available at no additional cost with the AWS Security Hub Essentials plan in all AWS Regions where Security Hub is available . To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Security Hub User Guide</a>, the exposure definition in <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/exposure-ec2-instance.html#vulnerable-software-currently-running\" rel=\"noopener noreferrer\" target=\"_blank\">Remediating exposures for EC2</a>, the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>, the <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/runtime-monitoring.html\" rel=\"noopener noreferrer\" target=\"_blank\">GuardDuty Runtime Monitoring User Guide</a>, and the <a href=\"https://docs.aws.amazon.com/inspector/latest/user/inspector-vm-scanner.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Inspector VM Scanner User Guide</a>. For the full list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "2a51e62acf3ed804749ba081b6582428":
    "id": "2a51e62acf3ed804749ba081b6582428"
    "title": "AWS Security Hub Network Scanning now supports scanning Amazon Relational Database Service (Amazon RDS) database instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-network-scanning-rds/"
    "published": "2026-11-16 17:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Security Hub Network Scanning now scans Amazon RDS DB instances to identify those that are reachable from the internet. Network Scanning automatically discovers existing and new RDS DB instances in your accounts and scans each instance that has Public Access configured. For each reachable port associated with a DB instance, Security Hub creates a finding with details about the instance and the reachable port.</p>\n<p>RDS scanning gives you more visibility into which resources in your environment are reachable from the internet. You can then investigate and update their access settings as needed. RDS scanning is turned on automatically for all customers who already have Network Scanning enabled.</p>\n<p>Network Scanning probes your resources from the internet to detect reachability, beyond what security group rules and route tables suggest. Security Hub Exposures then correlates these findings with other findings and resource configurations to assess broader risk.</p>\n<p>Existing Security Hub customers can enable Network Scanning in individual accounts and Regions, or across an organization with a configuration policy. For new Security Hub customers, Network Scanning is on by default. Network Scanning is included with Security Hub Essentials at no additional cost in all AWS commercial and AWS GovCloud (US) Regions that support Security Hub. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-network-scanning.html\" target=\"_blank\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
"last_updated": "2026-11-18 11:02:39 JST"
