"overview": |
  この日は AWS 日本語ブログ 1 ソースから 5 本で、セキュリティ運用とインシデント対応を扱う記事が 4 本並びました。AWS Security Hub と Amazon GuardDuty を有効化したものの検出結果を運用に活かしきれていない組織向けに、現状評価から始めて抑制ルールやコントロールの無効化によるノイズ削減、Amazon EventBridge と AWS Lambda による重要度別の通知、高信頼度の検出結果に対する自動修復の判断へと進む 6 フェーズの成熟度ロードマップが紹介されました。Amazon EC2 上の不正なファイル変更を検出するサーバーレスのファイル整合性監視では、AWS Systems Manager Inventory でファイルメタデータを収集してバージョニングを有効にした Amazon S3 に保存し、Lambda でバージョン間の差分を比較して Security Hub に検出結果を送る構成と Amazon Security Lake の活用が解説されています。インシデント発生時にフォレンジックアーティファクトを S3 へ安全に収集するフレームワークでは、AWS STS とセッションポリシーで有効期限付きの絞り込んだ一時認証情報を払い出し、既存のフォレンジックツールを変更せずに最小権限を実現します。マルウェア解析環境の記事では、AWS 適正利用規約とサービス条件への準拠を前提に、Amazon VPC によるネットワーク分離と送信トラフィックの遮断、IAM のアクセス許可の境界や SCP による権限昇格の防止、暗号化された S3 ストレージ、GuardDuty などによる監視を組み合わせる方法が示されました。週刊生成AI with AWS の 11 月 9 日週号は re:Invent まで 2 週間のタイミングで、東京製鐵、IHI などの国内事例を含む 32 件のブログを紹介し、Claude Fable 5.2 の提供開始や次世代 AgentCore Runtime のデフォルト化といったアップデートを取り上げています。
