"overview": |
  この日はコンテナの分離とネットワーク・DNS セキュリティ、SAP 関連の生成 AI 活用が中心でした。コンテナでは AWS Nitro Sandboxes が登場し、Nitro Hypervisor が管理する軽量 VM として EKS のポッド、ECS のタスク、軽量 VM をハードウェアで分離できるようになりました。EKS Auto Mode と Karpenter は NVIDIA GPU と EFA の Dynamic Resource Allocation (DRA) に対応しています。ネットワークでは Route 53 Profiles が 1 つの VPC に複数の Profile を関連付けられるようになり、日本語ブログでも Route 53 Resolver DNS Firewall による DNS トンネリングや DGA への対策、ハイブリッド環境への拡張、10 月 21 日にリリースされた Network Firewall 向け Route 53 Resolved IP Validation が解説されました。データでは AWS の分析サービスと Workday Data Cloud の双方向・ゼロコピー統合が発表され、FSx for NetApp ONTAP は 4 リージョン、FSx for OpenZFS は 20 リージョンで S3 Access Points に対応しました。国内記事では SAP 向けの生成 AI 活用 (Rivian の財務オペレーション、価格モニタリング、Multi-Channel Fulfillment アクセラレーター、CFO 向けユースケース) や、東京製鐵の Kiro 全社導入事例、週刊 AWS、週刊生成 AI、月刊 AWS 製造 11 月号が並びました。
