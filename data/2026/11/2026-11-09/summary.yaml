"overview": |
  この日は AWS Japan Blog のみの更新で、DNS セキュリティと SAP 向け生成 AI の記事が中心だった。Amazon Route 53 Resolver DNS Firewall については、VPC 内の DNS クエリが Route 53 Resolver を経由する独自の経路をたどるためセキュリティグループや AWS Network Firewall の制御をバイパスする点を踏まえ、従来のブロックリストでは捕捉できない DNS トンネリングやドメイン生成アルゴリズム (DGA) を防ぐ方法と、AWS Direct Connect や Site-to-Site VPN、インターネット向け Network Load Balancer を使って保護をオンプレミスワークロードへ拡張し、ハイブリッド環境全体で統一した DNS セキュリティポリシーを実現する方法が紹介された。また 2026 年 10 月 21 日に追加料金なしでリリースされた AWS Network Firewall 向け Route 53 Resolved IP Validation の解説も出た。Network Firewall が新しいアウトバウンド接続の宛先を Route 53 Resolver が返した IP アドレスと照合する機能で、SFTP や SSH などの非ウェブトラフィックをドメイン名で制御でき、SNI スプーフィングも防げる。SAP 関連では、Amazon Supply Chain Services の中核である Amazon Multi-Channel Fulfillment (MCF) を AWS 上の SAP ECC・SAP S/4HANA から SAP BTP Integration Suite と MCF API 経由で利用できるアクセラレーターの登場、SAP のマテリアルマスターデータと Amazon ECS Fargate 上の Strands Agents・Amazon Bedrock・MCP を組み合わせた競合価格モニタリング、Agentic AI が SAP ワークフローを自律実行する 7 つのユースケースを紹介するシリーズの第 1 回 (Amazon Bedrock AgentCore・Lambda・Bedrock Knowledge Bases・SNS による共通アーキテクチャとセキュリティ設計) が取り上げられた。事例では、Rivian が Bedrock AgentCore 上の ERP AI エージェント (Strands Agent が MCP サーバー経由で SAP S/4HANA と連携) で発注の会計計上を自動化し月次決算の手作業をサイクルあたり 15 日超削減した事例と、東京製鐵が AI コーディングツール Kiro を全社導入し現場の従業員が業務システムを内製する文化づくりを進めている事例が紹介された。週刊AWS (2026/11/02 週) では Amazon Textract の日本語対応と東京リージョンでの提供、Amazon Inspector の AMI 脆弱性スキャン対応、CloudFront の Service Quotas によるクォータ引き上げ対応、Lambda のセルフマネージド Kafka のキュー対応、S3 Tables の Hive から Iceberg へのマネージド移行などがまとめられ、週刊生成AI with AWS (2026 年 11 月 2 日週) ではニッセイ情報テクノロジーの国内事例、Toyota Motor North America の AI アシスト型 SAP 運用プラットフォーム BasisPilot、Kiro Crew の Bot や Kiro のモデルカスケードなどが紹介された。
