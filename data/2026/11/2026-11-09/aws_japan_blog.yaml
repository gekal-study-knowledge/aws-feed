  "700474eddea37e1927af1f906fd55f77":
    "id": "700474eddea37e1927af1f906fd55f77"
    "title": "週刊生成AI with AWS – 2026年11月2日週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20261102/"
    "published": "2026-11-09 14:31:50"
    "fetched": "2026-11-09 16:35:10"
    "summary": "週刊生成AI with AWS, Kiro と AI エージェントの話題が充実した2026年11月2日号 - ニッセイ情報テクノロジー株式会社様の国内事例ブログを紹介。また、Toyota Motor North America の AI アシスト型 SAP 運用プラットフォーム BasisPilot や Kiro Crew の Bot、Kiro のモデルカスケードなどのブログ記事も。サービスアップデートでは Amazon Bedrock での Kimi K3.1 Pro の提供開始や Amazon Bedrock AgentCore の Web Answer の一般提供開始をはじめとする 12 件のアップデートを紹介。"
  "252c17c0363c93f17cc238312d0ed7ba":
    "id": "252c17c0363c93f17cc238312d0ed7ba"
    "title": "CFO は次の四半期に SAP AI の成果を求めている – どこから始めるべきか"
    "link": "https://aws.amazon.com/jp/blogs/news/your-cfo-wants-sap-ai-results-next-quarter-heres-where-to-start/"
    "published": "2026-11-09 11:52:09"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Agentic AI エージェントが SAP ワークフローを自律的に実行する 7 つのユースケースを紹介するシリーズの第 1 回です。Amazon Bedrock AgentCore、AWS Lambda、Amazon Bedrock Knowledge Bases、Amazon SNS などを組み合わせた共通アーキテクチャとセキュリティ設計を解説します。最初のユースケースとして、サプライヤーのドキュメントから SAP GTS の貿易申告を自動作成し、手入力ゼロと 24 時間 365 日の処理を実現する方法を紹介します。"
  "34af48047f63cdce99e592b774f6b49c":
    "id": "34af48047f63cdce99e592b774f6b49c"
    "title": "SAP のお客様向けに Amazon のサプライチェーン機能を拡大: Multi-Channel Fulfillment アクセラレーター"
    "link": "https://aws.amazon.com/jp/blogs/news/expanding-amazons-supply-chain-capabilities-for-sap-customers-multi-channel-fulfillment-accelerator/"
    "published": "2026-11-09 11:50:47"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Amazon Supply Chain Services の中核である Amazon Multi-Channel Fulfillment (MCF) を、AWS 上の SAP ECC および SAP S/4HANA から利用できるアクセラレーターが登場しました。SAP BTP Integration Suite と MCF API により、既存の SAP の受注・出荷プロセスを変えずに Amazon のフルフィルメントネットワークと連携し、ステータスを自動で SAP に同期できます。さらに AWS for SAP MCP Server と Amazon Quick を組み合わせ、SAP と MCF のデータに自然言語で問い合わせる将来像も紹介します。"
  "3a570f6aa707d7facb1310caf0a95b5a":
    "id": "3a570f6aa707d7facb1310caf0a95b5a"
    "title": "従来の市場価格追跡を超えて: SAP のお客様向け生成AIソリューション"
    "link": "https://aws.amazon.com/jp/blogs/news/beyond-traditional-market-price-tracking-a-generative-ai-solution-for-sap-customers/"
    "published": "2026-11-09 11:48:28"
    "fetched": "2026-11-09 16:35:10"
    "summary": "SAP のマテリアルマスターデータ抽出と生成AIを組み合わせ、小売業のお客様向けに自動化された競合価格モニタリングシステムを構築するソリューションを解説します。Amazon ECS Fargate 上で Strands Agents と Amazon Bedrock、Model Context Protocol を用いてオンラインマーケットプレイスの価格とセンチメントを分析し、AWS Step Functions・Lambda・DynamoDB・S3 でワークフローをオーケストレーションします。SAP BDC や BTP Integration Suite、ABAP SDK for AWS を通じて結果を SAP に戻し、データドリブンな価格意思決定を実現します。アーキテクチャ、実装のベストプラクティス、コスト見積もり（月額約 $103.58、Fargate Spot 利用で約 $57.50）まで網羅します。"
  "8698d96a59c5d3b3fdaafe731f294741":
    "id": "8698d96a59c5d3b3fdaafe731f294741"
    "title": "Rivian が Amazon Bedrock 上の AI エージェントで財務オペレーションを加速した方法"
    "link": "https://aws.amazon.com/jp/blogs/news/how-rivian-accelerated-finance-operations-with-ai-agents-on-amazon-bedrock/"
    "published": "2026-11-09 11:48:02"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Rivian は Amazon Bedrock AgentCore 上に構築した ERP AI エージェントで発注（PO）の会計計上を自動化し、月次決算の手作業をサイクルあたり 15 日超削減しました。SOP をナレッジベースに保存し、Strands Agent が MCP サーバー経由で SAP S/4HANA と連携、Amazon DynamoDB・AWS Lambda・Amazon SES を活用してヒューマン・イン・ザ・ループで会計計上を実行します。R2 ローンチに伴う発注急増にもスケールし、精度・コンプライアンス・決算早期化を実現した事例を紹介します。"
  "e8c7ef91e1558d9742160ad76dfdf1ab":
    "id": "e8c7ef91e1558d9742160ad76dfdf1ab"
    "title": "週刊AWS – 2026/11/02週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20261102/"
    "published": "2026-11-09 11:03:05"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Amazon Textract が日本語に対応し東京リージョンでも利用可能に、Amazon Inspector が AMI の脆弱性スキャンに対応、Amazon CloudFront が Service Quotas でのクォータ引き上げに対応、AWS Lambda がセルフマネージド Kafka のキューに対応、Amazon S3 Tables が Hive から Iceberg へのマネージド移行に対応、Amazon DynamoDB の bulk put items が GA、Amazon Bedrock AgentCore の Web Answer が GA、AWS Security Hub が SBOM インベントリを提供など"
  "b12aa13c5bb7a7f7d1a9c4f056bb9097":
    "id": "b12aa13c5bb7a7f7d1a9c4f056bb9097"
    "title": "東京製鐵株式会社が挑む、一人ひとりの生産性向上への道 ― AI コーディングツール Kiro の全社導入で、スタッフが自ら業務システムを内製する文化へ"
    "link": "https://aws.amazon.com/jp/blogs/news/tokyo-steel-kiro-case-study/"
    "published": "2026-11-09 10:00:25"
    "fetched": "2026-11-09 16:35:10"
    "summary": "こんにちは。AWS の犬塚と山澤です。国内最大手の電炉メーカーである東京製鐵株式会社（以下、東京製鐵）では、一人ひとりの生産性向上に向けて、AI コーディングツール「Kiro」を全社に導入し、現場の従業員が自らの手で業務システムを内製する取り組みを進めています。本ブログでは、東京製鐵の皆さまに、Kiro 導入の背景や具体的な活用、成果、今後の展望について伺いました。"
  "91e8ce9b037119ef0b9cf79cae5f03ea":
    "id": "91e8ce9b037119ef0b9cf79cae5f03ea"
    "title": "Amazon Route 53 Resolver DNS Firewall によるハイブリッドワークロードの保護"
    "link": "https://aws.amazon.com/jp/blogs/news/securing-hybrid-workloads-using-amazon-route-53-resolver-dns-firewall/"
    "published": "2026-11-09 09:45:36"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Amazon Route 53 Resolver DNS Firewall による保護をオンプレミスワークロードへ拡張し、ハイブリッド AWS 環境全体で統一された DNS セキュリティポリシーを実現する方法を紹介します。AWS Direct Connect や AWS Site-to-Site VPN を使ったプライベート接続と、インターネット向け Network Load Balancer を使ったパブリック接続について、DNS クエリのフローを解説します。スケーラビリティ、高可用性、パフォーマンス、セキュリティに関する設計上の考慮事項も取り上げます。さらに、AWS Firewall Manager と AWS Security Hub を使って、マルチアカウント環境で DNS 保護を一元管理する方法も説明します。"
  "bbdb0f616de21b5f03e25bbd0c354b1d":
    "id": "bbdb0f616de21b5f03e25bbd0c354b1d"
    "title": "AWS Network Firewall 向け Route 53 Resolved IP Validation の紹介: ドメイン名による非ウェブトラフィック制御と SNI スプーフィング防止"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-route-53-resolved-ip-validation-for-aws-network-firewall/"
    "published": "2026-11-09 09:35:44"
    "fetched": "2026-11-09 16:35:10"
    "summary": "AWS は 2026 年 10 月 21 日、AWS Network Firewall 向け Route 53 Resolved IP Validation を追加料金なしでリリースしました。Network Firewall は、新しいアウトバウンド接続の宛先を、Amazon Route 53 Resolver が返した IP アドレスと照合します。これにより、SFTP や SSH などの非ウェブトラフィックをドメイン名でフィルタリングでき、TLS インスペクションなしで SNI スプーフィングも防止できます。この記事では、機能の仕組み、アラートモードで有効化する手順、2 つのユースケース、ベストプラクティスを紹介します。"
  "6626db0ed12ca6216aa7822f3d958ee7":
    "id": "6626db0ed12ca6216aa7822f3d958ee7"
    "title": "Amazon Route 53 Resolver DNS Firewall で高度な DNS 脅威を防ぐ"
    "link": "https://aws.amazon.com/jp/blogs/news/protect-against-advanced-dns-threats-with-amazon-route-53-resolver-dns-firewall/"
    "published": "2026-11-09 09:30:01"
    "fetched": "2026-11-09 16:35:10"
    "summary": "Amazon VPC 内の DNS クエリは Amazon Route 53 Resolver を経由する独自の経路をたどるため、セキュリティグループや AWS Network Firewall などの制御をバイパスします。この記事では、従来のブロックリストでは捕捉できない DNS トンネリングやドメイン生成アルゴリズム (DGA) の仕組みに加え、Amazon Route 53 Resolver DNS Firewall Advanced によるリアルタイム検出と信頼度のしきい値の選び方を解説します。さらに、コンソールでのルール作成、AWS CloudFormation テンプレートによる推奨ルールグループのデプロイ、クエリログ記録、AWS Security Hub との統合も紹介します。"
