    "title": "AIが進め、人が決める ― AI駆動開発の本当のボトルネックはどこにあったか"
    "link": "https://aws.amazon.com/jp/blogs/news/mbk-wellness-ai-dlc-workshop/"
    "published": "2026-11-11 08:48:12"
    "fetched": "2026-11-11 11:29:36"
    "summary": "こんにちは。AWS ソリューションアーキテクトの崔 祐碩（Woosuk Choi）です。AI 開発を進めている多くのお客様から「開発を加速したい」というご相談をいただいています。お客様と議論を重ねるたびに、本当のボトルネックは開発そのものではなく、意思決定をめぐるプロセスと組織ではないか、と感じることが増えてきました。本ブログでは、2026年7月29日に MBK Wellness 株式会社と実施した AI-DLC ワークショップを題材に、私たちがこの仮説をどう確かめ、どんな答えが返ってきたのかをご紹介します。"
