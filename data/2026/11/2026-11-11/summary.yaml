"overview": |
  この日はセキュリティ速報 3 件と、AWS Nitro Sandboxes・AgentCore まわりの記事が中心でした。セキュリティでは CVE-2026-125271 が公表され、AWS API MCP Server が操作名を誤って正規化してから比較していたため、セキュリティポリシーを回避できる問題があったとされています。Architecture Blog では、規制業界の企業で中央管理された ingress プロキシの背後にあっても、Amazon Application Recovery Controller (ARC) Region Switch を使ってアプリケーションチームがセルフサービスでリージョンフェイルオーバーを実行する構成が紹介されました。Machine Learning Blog では、複数アカウントの Bedrock 呼び出しログを集約してトークン消費を分析する観測用データレイク (tokenomics data lake) の構築方法と、Tata Consultancy Services (TCS) が AgentCore 上で要件から統制されたテストを生成・実行するエージェント型テストオーケストレーターを構築した BFSI 向け事例が取り上げられています。あわせて CVE-2026-124848 と CVE-2026-126087 も公表されました。CVE-2026-124848 は macOS と Linux の Kiro CLI 2.27.0 より前のバージョンで、ローカルのセッション記録とプロンプト履歴のファイルが全ローカルユーザーから読める権限で作られていた問題で、同じホストの他のユーザーが記録に含まれる認証情報やソースコードを読めるおそれがあります (影響範囲は 1.16.0 以上 2.27.0 未満)。CVE-2026-126087 は OpenJD Sessions for Python 0.11.0 未満 (AWS Deadline Cloud ワーカーエージェント 0.33.0 未満が利用) のクロスユーザープロセスランチャーにおける信頼できない検索パスの問題で、キューにジョブを投入できる認証済みリモートユーザーが PATH 環境変数を書き換えるジョブを送ることで、ワーカーエージェントの OS ユーザーとして任意コードを実行し、そのエージェントが保持する AWS 認証情報を取得できるおそれがあります。Compute Blog では、コンテナ・EKS ポッド・ECS タスクのそれぞれにハードウェア分離された仮想マシンの境界を与える新しい Amazon EC2 のビルディングブロック AWS Nitro Sandboxes が解説され、Nitro System の強い分離・オペレーターアクセスなし・暗号的な構成証明をほぼネイティブの性能でコンテナワークロードに持ち込むとしています。Machine Learning Blog では、AgentCore Evaluations の組み込み評価器・DeepEval・AutoEval を使い分けて、エージェントがタスクを完了したか、話題から逸れていないか、データを漏らしていないか、手順を飛ばしていないかを評価する方法と、Trovata が Bedrock と AgentCore 上に RBAC で保護した銀行ブランド向けの自律型トレジャリーエージェントを構築した事例が公開されました。このほか Amazon RDS for PostgreSQL が Extended Support のマイナーバージョン 13.23-rds.20260819・12.22-rds.20260820・11.22-rds.20260822 を提供し、Amazon RDS for MySQL 26.10 が RDS Database Preview Environment で評価できるようになり、AWS Partner Central の事業計画機能が刷新されて AI による計画の準備状況スコアやリアルタイムの進捗追跡、計画のエクスポートが加わりました。セキュリティブログでは AWS ProcessUnity Global Risk Exchange 評価の更新と、re:Invent 2026 (11 月 30 日〜12 月 4 日、2,200 以上のセッション) のデジタルソブリンティ関連セッションの案内が出ています。
