    "title": "CVE-2026-125271 - AWS API MCP Server Security Policy Bypass via Incorrect Operation Name Normalization"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-176-aws/"
    "published": "2026-11-11 01:42:37"
    "fetched": "2026-11-11 02:26:42"
    "summary": "<p><b>Bulletin ID:</b> 2026-176-AWS<br /> <b>Publication Date:</b> 11/10/2026 08:30 AM PST</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-125271 of AWS API MCP Server. The server normalized operation names incorrectly before comparing them to the operator ' s security policy, so operations whose names contain consecutive capital letters never matched a correctly written denyList or elicitList entry. This might allow an actor to execute AWS API operations that the operator's security policy was configured to deny or require elicitation for.</p> \n<p><b>Impacted versions:</b> &gt;= 0.2.13 AND &lt; 1.5.1</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-176-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "dc61b74506e210b03f89df0789ecaf82":
    "id": "dc61b74506e210b03f89df0789ecaf82"
    "title": "CVE-2026-124848 - Incorrect default permissions on session transcripts and prompt history in Kiro CLI"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-178-aws/"
    "published": "2026-11-11 05:05:36"
    "fetched": "2026-11-11 07:46:19"
    "summary": "<p><b>Bulletin ID:</b> 2026-178-AWS<br /> <b>Publication Date:</b> 11/10/2026 12:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>Incorrect default file permissions in Kiro CLI before version 2.27.0 on macOS and Linux might allow other local users on the same host to read a user's session transcripts and prompt history, including any credentials or source code they contain. The CLI created its local session storage files with permissions that made them readable by all local users.</p> \n<p><b>Impacted versions:</b> Kiro CLI &gt;= 1.16.0 AND &lt; 2.27.0</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-178-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "e8713a589b9f4ee5952b9a670b9d36d3":
    "id": "e8713a589b9f4ee5952b9a670b9d36d3"
    "title": "CVE-2026-126087 - Untrusted search path in OpenJD Sessions for Python and the AWS Deadline Cloud worker agent"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-177-aws/"
    "published": "2026-11-11 03:53:11"
    "fetched": "2026-11-11 07:46:19"
    "summary": "<p><b>Bulletin ID:</b> 2026-177-AWS<br /> <b>Publication Date:</b> 11/10/2026 10:45 AM PST</p> \n<p><b>Description:</b></p> \n<p>Untrusted search path in the cross-user process launcher in Open Job Description (OpenJD) Sessions for Python before 0.11.0, as used in the AWS Deadline Cloud worker agent before 0.33.0, on Linux might allow an authenticated remote user with permission to submit jobs to a queue to execute arbitrary code as the worker agent OS user and obtain the AWS credentials held by the worker agent via a crafted job that modifies the PATH environment variable.</p> \n<p><b>Impacted versions:</b><br /> - openjd-sessions &lt; 0.11.0<br /> - deadline-cloud-worker-agent &lt; 0.33.0</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-177-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
