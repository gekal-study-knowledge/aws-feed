    "title": "CVE-2026-130621- Time-of-check time-of-use race condition in the port selection in AWS efs-utils"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-186-aws/"
    "published": "2026-11-18 04:18:32"
    "fetched": "2026-11-18 04:33:22"
    "summary": "<p><b>Bulletin ID:</b> 2026-186-AWS<br /> <b>Publication Date:</b> 11/17/2026 11:00 AM PST</p> \n<p><b>Description:</b></p> \n<p>A time-of-check time-of-use (TOCTOU) race condition in the local port selection in AWS efs-utils (amazon-efs-utils) before 3.3.5 might allow a user that can start EFS mounts on a shared host to read and write a different Amazon EFS or S3 Files file system that is mounted on that same host, under that mount's IAM identity and access point, via concurrent mount operations. Only file systems mounted on the same host at the same time can be affected.</p> \n<p><b>Impacted versions:</b><br /> - amazon-efs-utils &lt; v3.3.5<br /> - aws-efs-csi-driver &lt; v3.5.4</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-186-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
  "5c2dc0ad99e85fc1312ad486a859af03":
    "id": "5c2dc0ad99e85fc1312ad486a859af03"
    "title": "CVE-2026-130622 and CVE-2026-130623 - Incorrect authorization in credential loading and handling for namespace-scoped issuers in AWS Private CA Connector for Kubernetes (aws-privateca-issuer)"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-187-aws/"
    "published": "2026-11-18 05:11:26"
    "fetched": "2026-11-18 11:02:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-187-AWS<br /> <b>Publication Date:</b> 11/17/2026 12:00 PM PST</p> \n<p><b>Description:</b></p> \n<p>Incorrect authorization in the credential loading logic in AWS Private CA Connector for Kubernetes(aws-privateca-issuer) before 1.12.0 might allow an authenticated remote user with permission to create namespace-scoped issuers to obtain certificates, including subordinate CA certificates, signed by another namespace's AWS Private CA with that namespace's stored AWS credentials, via a namespace-scoped issuer that references a credentials Secret in that namespace.</p> \n<p><b>Impacted versions:</b><br /> - aws-privateca-issuer before v1.12.0<br /> - AWS Private CA Connector for Kubernetes EKS add-on before v1.12.0-eksbuild.1</p> \n<p><b><a href=\"https://aws.amazon.com/security/security-bulletins/2026-187-aws/\">Refer to the article</a> for the most up-to-date and complete information.</b></p>"
"last_updated": "2026-11-18 11:02:40 JST"
