"entries":
  "91c8f5991e2e881e1d04c08075cd39c1":
    "id": "91c8f5991e2e881e1d04c08075cd39c1"
    "title": "Getting AI out of the demo and into businesses globally"
    "link": "https://aws.amazon.com/blogs/machine-learning/getting-ai-out-of-the-demo-and-into-businesses-globally/"
    "published": "2026-11-18 04:05:22"
    "fetched": "2026-11-18 04:33:22"
    "summary": "Most enterprises have AI that works in a demo but stalls before production. AWS Forward Deployed Engineering closes that gap. AWS engineers embed with customer teams to take high-value workflows to production in 45-day sprints, leaving a foundation, workflows, and governance the customer owns."
  "94522c9c71e3653fa9eddb35150cd43f":
    "id": "94522c9c71e3653fa9eddb35150cd43f"
    "title": "Build WhatsApp AI agents with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-whatsapp-ai-agents-with-amazon-bedrock-agentcore/"
    "published": "2026-11-18 03:48:50"
    "fetched": "2026-11-18 04:33:22"
    "summary": "SMART, an open-source Python SDK and Terraform stack, deploys the full WhatsApp channel layer to your AWS account with one command. Bring any agent that runs on Amazon Bedrock AgentCore, and SMART handles webhook ingestion, media, conversation memory, scheduling, and Meta message templates."
  "7de5788bb93df5a536a387c27a3e3392":
    "id": "7de5788bb93df5a536a387c27a3e3392"
    "title": "Reason over time-series data with OpenTSLM on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/blogs/machine-learning/reason-over-time-series-data-with-opentslm-on-amazon-sagemaker-jumpstart/"
    "published": "2026-11-18 03:06:44"
    "fetched": "2026-11-18 04:33:22"
    "summary": "OpenTSLM, an open source family of time-series language models, is now available in Amazon SageMaker JumpStart. See how Nexthink and Aionic Labs apply it to proactive IT support, then deploy OpenTSLM to a real-time endpoint and fine-tune it on your own data with TimeNet and a SageMaker training job."
  "f7b5f3c4909555f33c55343204b686ce":
    "id": "f7b5f3c4909555f33c55343204b686ce"
    "title": "Your complete guide to AWS Quick at AWS re:Invent 2026"
    "link": "https://aws.amazon.com/blogs/machine-learning/your-complete-guide-to-aws-quick-at-aws-reinvent-2026/"
    "published": "2026-11-18 02:08:21"
    "fetched": "2026-11-18 04:33:22"
    "summary": "AWS Quick gives your whole organization AI that knows your business, respects your security rules, and acts on your behalf. At AWS re:Invent 2026, customers including Allianz, Cox Automotive, and Southwest Airlines share how they govern, extend, and scale Quick. Use this guide to find the sessions that fit your goals."
  "2efae4a668ce94ab56ed3b23600aaa08":
    "id": "2efae4a668ce94ab56ed3b23600aaa08"
    "title": "How LoanPro built an agentic AI loan servicing assistant with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-loanpro-built-an-agentic-ai-loan-servicing-assistant-with-amazon-bedrock-agentcore/"
    "published": "2026-11-18 02:01:08"
    "fetched": "2026-11-18 04:33:22"
    "summary": "LoanPro worked with AWS Partner AllCloud and the AWS Generative AI Innovation Center to build a multi-agent AI assistant on Amazon Bedrock and Amazon Bedrock AgentCore. It gives loan servicing agents instant borrower context and next-best-action recommendations, reducing customer call times by up to 15 percent."
  "a2ed87d29d341be6a94e6eaa0c827a7d":
    "id": "a2ed87d29d341be6a94e6eaa0c827a7d"
    "title": "Responsible AI for agentic AI: A phased roadmap for platform and application teams"
    "link": "https://aws.amazon.com/blogs/machine-learning/responsible-ai-for-agentic-ai-a-phased-roadmap-for-platform-and-application-teams/"
    "published": "2026-11-18 01:56:31"
    "fetched": "2026-11-18 04:33:22"
    "summary": "Enterprises adopting agentic AI at scale need platforms that embed responsible AI from the start. This post gives platform and application teams a three-phase roadmap (governance foundation, pilot deployment, and evaluation and hardening) that maps the AWS Responsible AI Lens pillars to each phase, with guidance on when to revisit each one."
  "7a96fd05da6b11486bdb56c7bdcc84b5":
    "id": "7a96fd05da6b11486bdb56c7bdcc84b5"
    "title": "How ArisGlobal scaled generative AI inference on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-arisglobal-scaled-generative-ai-inference-on-amazon-bedrock/"
    "published": "2026-11-18 00:57:09"
    "fetched": "2026-11-18 04:33:22"
    "summary": "ArisGlobal runs NavaX, its life-sciences AI engine, on Amazon Bedrock. By caching the shared prompt prefix instead of each per-case document, ArisGlobal cut effective input cost by about 50% and overall monthly inference spend by about 40%, while onboarding more tenants without proportional cost growth."
  "142a462a1db15f86aeeae1455051a517":
    "id": "142a462a1db15f86aeeae1455051a517"
    "title": "Managed NVIDIA Dynamo on Amazon SageMaker HyperPod Inference"
    "link": "https://aws.amazon.com/blogs/machine-learning/managed-nvidia-dynamo-on-amazon-sagemaker-hyperpod-inference/"
    "published": "2026-11-18 08:33:26"
    "fetched": "2026-11-18 11:02:41"
    "summary": "Amazon SageMaker HyperPod Inference now supports NVIDIA Dynamo for distributed inference, with multi-node and disaggregated serving, KV-aware routing, and automatic fault recovery. Serve large models across many nodes without building the orchestration layer yourself."
  "97b966fac2a91acea0fcfaad8eb52a71":
    "id": "97b966fac2a91acea0fcfaad8eb52a71"
    "title": "Reducing token costs and latency in Amazon Bedrock AgentCore JSON workloads"
    "link": "https://aws.amazon.com/blogs/machine-learning/reducing-token-costs-and-latency-in-amazon-bedrock-agentcore-json-workloads/"
    "published": "2026-11-18 07:44:51"
    "fetched": "2026-11-18 11:02:41"
    "summary": "As production agents on Amazon Bedrock AgentCore process multi-megabyte JSON payloads, token costs and latency climb. This post shares three composable strategies: offloading heavy artifacts to Amazon S3, on-demand result paging, and dictionary compaction. Together they cut per-turn token use by up to 71% and latency by up to 80%."
  "ba082b1842f75ed55297ee643fa675bd":
    "id": "ba082b1842f75ed55297ee643fa675bd"
    "title": "Cut generative AI costs: Code for rules, models for judgment"
    "link": "https://aws.amazon.com/blogs/machine-learning/cut-generative-ai-costs-code-for-rules-models-for-judgment/"
    "published": "2026-11-18 06:14:55"
    "fetched": "2026-11-18 11:02:41"
    "summary": "The biggest cost lever in a generative AI system is whether you call a model at all. Learn how to decide whether each workflow step needs a model, and map each option to AWS: deterministic code, a constrained decision call, or a right-sized model on Amazon Bedrock."
  "30b2be5d82b636fefac47f4bf2cf2ac9":
    "id": "30b2be5d82b636fefac47f4bf2cf2ac9"
    "title": "Amazon SageMaker AI real-time endpoints now support KV cache aware routing"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-ai-real-time-endpoints-now-support-kv-cache-aware-routing/"
    "published": "2026-11-18 06:11:51"
    "fetched": "2026-11-18 11:02:41"
    "summary": "Amazon SageMaker AI real-time endpoints now support KV cache-aware routing, a new strategy that routes each request to the instance holding the longest cached match for its prompt. Learn how it works, when to use it compared with prefix-aware routing, and how to enable, invoke, and verify it on single model and inference component endpoints."
  "a2e98e89af74e1cfab00ae44788dd42e":
    "id": "a2e98e89af74e1cfab00ae44788dd42e"
    "title": "Govern and discover records with common metadata in AWS Agent Registry"
    "link": "https://aws.amazon.com/blogs/machine-learning/govern-and-discover-records-with-common-metadata-in-aws-agent-registry/"
    "published": "2026-11-18 05:31:04"
    "fetched": "2026-11-18 11:02:41"
    "summary": "Custom metadata schemas in AWS Agent Registry let an administrator define typed, validated fields that every agent, MCP server, and skill must carry. This post follows an MCP record from schema definition through registration, enrichment, approval, and discovery, so teams govern and find resources with one shared set of facts."
  "2f6d1e9a382b6ad6be73586e257624bd":
    "id": "2f6d1e9a382b6ad6be73586e257624bd"
    "title": "Secure OAuth patterns for Snowflake Cortex AI through Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/secure-oauth-patterns-for-snowflake-cortex-ai-through-amazon-bedrock-agentcore/"
    "published": "2026-11-18 05:25:23"
    "fetched": "2026-11-18 11:02:41"
    "summary": "When an AI agent on Amazon Bedrock AgentCore calls Snowflake Cortex AI over MCP, how does it authenticate? This post walks through three OAuth patterns we tested on AgentCore Identity: Snowflake OAuth, three-legged OAuth with a corporate IdP, and two-legged OAuth, so you can match your organization's identity, audit, and compliance needs."
  "ba8dbf57bdcd2ae73d013b8e53d16f23":
    "id": "ba8dbf57bdcd2ae73d013b8e53d16f23"
    "title": "Announcing AI data preparation capabilities in Amazon SageMaker: Build high-quality datasets for model development workflows"
    "link": "https://aws.amazon.com/blogs/machine-learning/announcing-ai-data-preparation-capabilities-in-amazon-sagemaker-build-high-quality-datasets-for-model-development-workflows/"
    "published": "2026-11-18 04:40:01"
    "fetched": "2026-11-18 11:02:41"
    "summary": "Amazon SageMaker AI now offers AI data preparation capabilities for building high-quality training and evaluation data. Generate synthetic examples, assess and improve datasets, auto-label at scale, and bring in expert review through Python SDK APIs and an agent skill, all from your own notebook or IDE."
"last_updated": "2026-11-18 11:02:41 JST"
