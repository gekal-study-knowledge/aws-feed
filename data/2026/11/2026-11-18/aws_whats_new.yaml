"entries":
  "5fe859de5fce50ca6db1b8386852a56b":
    "id": "5fe859de5fce50ca6db1b8386852a56b"
    "title": "OpenAI GPT-6.2 Astra, and GPT-6.2 Sol are now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/openai-gpt-6-2-astra-sol-amazon-bedrock/"
    "published": "2026-11-18 02:17:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Today, AWS announces the general availability of OpenAI GPT-6.2 Astra and GPT-6.2 Sol on Amazon Bedrock. GPT-6.2 Astra brings frontier-level reasoning and judgment to your most ambitious work, including complex business problems, demanding research, and advanced coding and agentic workflows. Astra also includes an Ultrafast mode for latency-sensitive applications that need fast responses. GPT-6.2 Sol is designed for recurring coding, agentic, and professional workflows with clear outcomes, where speed and cost per task matter.</p> \n<p>Use GPT-6.2 Astra for challenging work that calls for expert judgment and a finished deliverable, such as reconciling competing inputs, investigating complex codebases, reasoning across text and images, and creating professional artifacts. Select ultrafast mode for Astra for interactive coding assistants, real-time agents, and customer-facing applications where latency shapes the customer experience. Use GPT-6.2 Sol for recurring, high-volume work with verifiable outcomes, such as implementing and debugging software, analyzing documents and data, and automating multistep workflows. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.&nbsp;</p> \n<p>You can get started in the Amazon Bedrock console or programmatically through supported Amazon Bedrock APIs. For information about supported AWS Regions, endpoints, APIs, features, inference profiles and pricing, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock documentation.</a></p>"
  "1f034ee9fcbd2b9b40724354edc379e4":
    "id": "1f034ee9fcbd2b9b40724354edc379e4"
    "title": "Amazon VPC, AWS Transit Gateway, and AWS Cloud WAN now offer a 99.999% availability SLA for cross-Region traffic"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/vpc-tgw-cloudwan-99999-sla/"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>AWS now offers a 99.999% availability service level agreement (SLA) for cross-Region traffic over Amazon Virtual Private Cloud (Amazon VPC) cross-Region peering, AWS Transit Gateway, and AWS Cloud WAN, with a new capability called Multipath Resilience. Multipath Resilience makes it easier to improve the resilience of mission-critical applications that send traffic across Regions, such as payment processing, financial trading, telephony, and live media streaming.</p> \n<p>The AWS backbone is highly resilient and connects Regions over physically diverse fiber paths. When a path fails, such as during a fiber cut, the network's automatic sub-second rerouting moves traffic to a healthy path. In the rare event that such mechanisms do not resolve the issue in a timely manner, such as when there's a partial degradation, it might take minutes for connectivity to be reestablished. Some applications, such as payment processing, financial trading, telephony, and live media streaming, can't tolerate single-digit seconds interruptions, let alone minutes of unavailability. Until now, customers running these applications relied on workarounds, including modifying their applications and operating systems to split a single connection into multiple connections, or replicating data into every Region to avoid cross-Region calls. These workarounds add complexity and don't always work, because applications can't control which network paths their traffic takes.</p> \n<p>Now, when you turn on Multipath Resilience for a cross-Region VPC peering connection, cross-Region Transit Gateway peering attachment, or cross-Region traffic on Cloud WAN, the network sends copies of each packet across physically diverse paths. It delivers whichever copy reaches your resources in the destination Region first and discards the duplicates. If one path drops packets, a copy is already in flight on another path, so your applications stay connected without waiting for the network protocols to reroute. Multipath Resilience moves this work out of your applications and into the network. Your applications keep using a single connection, with no changes to application code or operating systems, and no need to duplicate data to keep calls within a single Region.</p> \n<p>Multipath Resilience is now generally available in US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), and Europe (Ireland).</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/vpc/features/vpc-multipath-resilience/\" rel=\"noopener noreferrer\" target=\"_blank\">Multipath Resilience documentation</a>. For SLA details, visit the <a href=\"https://aws.amazon.com/vpc/features/vpc-multipath-resilience/sla\" rel=\"noopener noreferrer\" target=\"_blank\">Multipath Resilience SLA</a>. For pricing, visit the <a href=\"https://aws.amazon.com/vpc/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon VPC pricing page</a>.</p>"
  "7cec597cca3343729d34a76536083e16":
    "id": "7cec597cca3343729d34a76536083e16"
    "title": "Amazon WorkSpaces Advisor now helps you find issues before your users notice them (Public Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/workspaces-advisor-proactive-troubleshooting-preview"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>When a WorkSpace is slow or won't connect, the IT administrator trying to help has traditionally had to dig through Amazon CloudWatch metrics, logs, and configuration data across multiple tools to find out why. And in the meantime, the user on the other end can't get their work done. In April this year, we launched Amazon WorkSpaces Advisor, an AI-powered agent that helps IT administrators diagnose and fix WorkSpaces performance, connectivity and provisioning issues and get users back to work faster. With Advisor, administrators can investigate a WorkSpace from the console and, in minutes, see the likely root cause and recommended actions they can take right away. Since then, we've continued to invest in Advisor so your team can spend less time chasing down issues one by one, and more time on the projects your business is counting on you to deliver.</p> \n<p>Today, we're excited to announce the preview of proactive troubleshooting in WorkSpaces Advisor, which moves your team from reacting to individual tickets to staying ahead of issues across your whole environment. Advisor can identify issues across your WorkSpaces, explain the likely cause of each one and recommend a fix. You don't need to start an investigation, wait for a user to report a problem, or set alarm thresholds first. &nbsp;</p> \n<p>If the same problem affects many WorkSpaces, Advisor will show it as a single issue with the likely cause and a recommended fix. &nbsp;Your team fixes the root cause once instead of chasing the same symptom one WorkSpace at a time. For example, Advisor can tell you when a group of WorkSpaces became unhealthy at the same time, when WorkSpaces are running low on CPU or memory, or when a certificate your users need to sign in is about to expire. That gives you time to act before a small issue turns into an outage or a queue of support tickets. You'll find these issues in the WorkSpaces console.</p> \n<p>Proactive troubleshooting also extends Advisor to your users, which means fewer tickets reach your help desk and the ones that do come with better information. When a session is slow or won't connect, Advisor will tell users whether the problem is with their device, their network, or their WorkSpace. It then walks them through the fixes you've approved, such as restarting their WorkSpace. When an issue does need IT, the user gets a clear explanation to pass along, so your team starts from a diagnosis instead of \"my WorkSpace is slow.\" &nbsp;You stay in control because you decide which fixes users can make on their own, and you can turn this off for any directory.</p> \n<p>Proactive troubleshooting is available in preview at no additional charge in AWS commercial Regions where Amazon WorkSpaces Personal is available. Troubleshooting for end users requires version 5.37 or later of the WorkSpaces client for Windows, with the new experience turned on.&nbsp;Troubleshooting for users requires the WorkSpaces client for Windows version 5.37 or later with new experience. To get started, see the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/workspaces-advisor.html\">Amazon WorkSpaces Advisor Administration Guide.</a></p>"
  "3ec27b9bcd11fe0737dc6f713472123e":
    "id": "3ec27b9bcd11fe0737dc6f713472123e"
    "title": "Amazon API Gateway REST APIs now support JWT authorizers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-api-gateway-rest-jwt-authorizers"
    "published": "2026-11-18 00:00:00"
    "fetched": "2026-11-18 04:33:21"
    "summary": "<p>Amazon API Gateway now offers a native JWT authorizer for REST APIs, a new authorizer type that validates JSON Web Tokens directly in the gateway. Until now, validating tokens from an OpenID Connect or OAuth 2.0 identity provider other than Amazon Cognito required a Lambda authorizer. You now configure token validation instead of writing and operating code for it.</p> \n<p>You can define one or more issuers, the audiences accepted for each, the signing algorithms you permit, and any additional claims a token may present. API Gateway verifies each token's signature, issuer, audience, expiry, and claims on every request. You can attach one authorizer to many methods and require different scopes on each. This fits machine-to-machine APIs, mobile and web backends, and multi-tenant APIs that accept tokens from several identity providers.</p> \n<p>The JWT authorizer works on Regional, edge-optimized, and private REST APIs, and is available in all commercial AWS Regions and the AWS GovCloud (US) Regions. To get started, see <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-jwt-authorizer.html\">Amazon API Gateway documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/securing-rest-apis-with-jwt-authorizers-in-amazon-api-gateway/\">AWS blog post</a>.&nbsp;</p>"
  "0b6a05eece3cbc34ae0098c6fef48bb4":
    "id": "0b6a05eece3cbc34ae0098c6fef48bb4"
    "title": "Amazon EMR 8.2 is now available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-emr-8.2/"
    "published": "2026-11-18 07:25:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon EMR 8.2 is now available with new features across Amazon EMR on EC2, Amazon EMR on EKS, and Amazon EMR Serverless. This release upgrades Apache Spark to 4.1.3, Apache Iceberg to 1.11.0, and Delta Lake to 4.2.0, and it is designated a Long Term Support (LTS) release. This release makes it easier to run secure, governed analytics at scale — you can now write to the same Delta Lake table on Amazon S3 from multiple clusters concurrently, refresh Iceberg materialized views incrementally, and propagate end-user identity from Spark jobs and interactive sessions all the way to AWS Lake Formation and Amazon S3 so access is authorized and audited as the original user.</p> \n<p>Amazon EMR 8.2 expands governance and performance across all three deployment options. New features include concurrent Delta Lake writes using Amazon S3 conditional writes (no DynamoDB log store required), and Lake Formation fine-grained access control (FGAC) now covers materialized views, governed user-defined functions, more Iceberg operations, and a broader set of Spark SQL features. The release also adds OpenLineage-based lineage capture to the AWS Glue Data Catalog and trusted identity propagation for steps and sessions. With EMR 8.2, data engineers can now precompute each pipeline stage as an Iceberg materialized view in SQL. Each materialized view refreshes only the changes instead of recomputing the entire source table across projections, inner joins, filters and SUM, COUNT aggregations. Specific to EMR on EC2, this release adds Spark Connect support on multi-primary clusters, along with Secret Agent improvements that cut user-provisioning latency by up to 97% under high concurrency. On EMR Serverless, new scaling profiles for Spark (performance-optimized, balanced, or cost-optimized) let you tune how quickly executors scale, and applications can now run Lake Formation-governed Glue UDFs. On EMR on EKS, the Spark Operator is upgraded to version 2 (based on open-source Spark Operator 2.5.0).</p> \n<p>Amazon EMR 8.2 is available in all AWS Regions where Amazon EMR is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/release-version-emr-spark-8.2.0.html\"><u>Amazon EMR 8.2 Release Guide</u></a> for EMR on EC2, the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/release-version-emr-spark-8.2.0.html\"><u>EMR Serverless release notes</u></a>, and the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-spark-8.2.0.html\"><u>EMR on EKS release notes</u></a>, or get started by creating a cluster from the <a href=\"https://console.aws.amazon.com/emr\"><u>Amazon EMR console</u></a>.</p>"
  "0d46a435c949779111a9d0ca8078de0c":
    "id": "0d46a435c949779111a9d0ca8078de0c"
    "title": "Introducing the Apache Spark Optimization Agent for Amazon EMR Serverless"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/apache-spark-optimization-agent/"
    "published": "2026-11-18 07:25:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon EMR Serverless now offers the Apache Spark optimization agent, which analyzes completed Spark job runs and delivers cost and performance optimization recommendations in seconds. You can select a cost or performance goal, and the agent returns specific configuration changes with the telemetry evidence and plain-language reasoning behind each suggestion. The agent can analyze a single run or compare it against a known-good baseline to pinpoint what changed. You access it from the EMR Serverless console or through the SageMaker Unified Studio MCP Server.</p> \n<p>The agent takes the job's configuration, logs, and Spark telemetry together with your chosen intent and returns recommendations computed by a deterministic recommendation engine. The engine reads all job artifacts together to identify what is driving runtime and cost: too little parallelism, a skewed join key, memory pressure forcing spill, idle executors, or capacity provisioned beyond what the job uses. The configurations the engine targets are the settings most commonly tuned across millions of Spark jobs running on AWS. When cost and performance trade off, the recommendation improves the metric you asked for while keeping degradation of the other within defined limits. The engine also evaluates a best practices checklist covering platform-level improvements such as upgrading to a newer Spark version or using Graviton processors. Each recommendation is labeled by the surface it modifies: infrastructure, Spark configuration, code, or data layout. Data engineers can also use the agent during development to tune configurations before promoting to production. All access is authenticated with AWS IAM and logged in AWS CloudTrail.</p> \n<p>The Apache Spark Optimization Agent is available at no additional charge in all Regions where EMR Serverless is available, except GovCloud (US) and China Regions, for EMR release versions 7.6 and later. To get started, see <a href=\"https://docs.aws.amazon.com/emr/latest/ReleaseGuide/spark-optimization-agent.html\">Apache Spark Optimization Agent for Amazon EMR Serverless</a>.</p>"
  "d085615c3d05c032beb25e9152f948b4":
    "id": "d085615c3d05c032beb25e9152f948b4"
    "title": "AWS Transform now accelerates migration deals for Migration Acceleration Program (MAP) benefits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/map-integration-with-aws-transform/"
    "published": "2026-11-18 07:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Partners can now expedite Migration Acceleration Program (MAP) deals, from qualification to incentive payout, with an end-to-end agentic workflow in AWS Transform. Partners can manage the full MAP lifecycle without leaving AWS Transform, including deal qualification, funding approvals, agreement execution, migration planning and execution, resource tagging, and incentive disbursement.</p>\n<p>Previously, Partners had to switch between separate systems for opportunity discovery, assessments, deal qualification, funding approvals, agreement execution, resource tagging, and incentive disbursement. This fragmentation, along with manual handoffs between steps, led to longer qualification cycles.</p>\n<p>Now, with the agentic MAP experience in AWS Transform, Partners connect their AWS Partner Central account and invite customers into the same engagement. Partners start by scoping customer environments with the built-in agentic discovery tool, or by importing data from RVTools or AWS-validated ISV tools listed in AWS Marketplace. AWS Transform then combines this discovery data with opportunity details from APN Customer Engagements (ACE) to automatically qualify Partner-initiated opportunities in a guided flow, so Partners get eligibility decisions sooner and close deals faster. As the migration progresses, MAP resource tags are applied automatically, and Partner cash and customer credits are disbursed based on actual usage data. Throughout, customers get shared, real-time visibility into migration projects alongside their Partner.</p>\n<p>AWS Transform with integrated MAP is now available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\" target=\"_blank\">AWS Regions where AWS Transform is supported</a>. To learn more, visit the <a href=\"https://aws.amazon.com/migration-acceleration-program/\">AWS Migration Acceleration Program (MAP)</a> page. Partners can get started with the <a href=\"https://us-east-1.console.aws.amazon.com/partnercentral/content/guidedetails/6955b492-4e51-4de6-9da9-c92f2e2920f8?region=us-east-1\" target=\"_blank\">AWS Partner Central user guide</a> (login required) or by contacting their Partner Development Manager. Customers can contact their AWS account team or AWS Partner.</p>"
  "839e7a2c365254be0323dba969a9e02c":
    "id": "839e7a2c365254be0323dba969a9e02c"
    "title": "Amazon EC2 C8gn instances are now available in AWS Israel (Tel Aviv) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ec2-c8gn/"
    "published": "2026-11-18 07:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances, powered by the latest-generation AWS Graviton4 processors, are available in the AWS Israel (Tel Aviv) region. The C8gn instances provide up to 30% better compute performance than Graviton3-based Amazon EC2 C7gn instances. Amazon EC2 C8gn instances feature the latest 6th generation AWS Nitro Cards, and offer up to 600 Gbps network bandwidth, the highest network bandwidth among network optimized EC2 instances.&nbsp;</p> \n<p>Take advantage of the enhanced networking capabilities of C8gn to scale performance and throughput, while optimizing the cost of running network-intensive workloads such as network virtual appliances, data analytics, CPU-based artificial intelligence and machine learning (AI/ML) inference.&nbsp;</p> \n<p>For increased scalability, C8gn instances offer instance sizes up to 48xlarge, up to 384 GiB of memory, and up to 120 Gbps of bandwidth to Amazon Elastic Block Store (EBS). C8gn instances support Elastic Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes, which enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.&nbsp;</p> \n<p>C8gn instances are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon, N.California), Europe (Frankfurt, Stockholm, Ireland, London, Spain, Zurich, Milan, Paris), Asia Pacific (Singapore, Malaysia, Sydney, Thailand, Mumbai, Seoul, Melbourne, Jakarta, Hyderabad, Tokyo, Hong Kong), Middle East (UAE), Israel (Tel Aviv), Africa (Cape Town), Canada West (Calgary, Central), South America (Sao Paulo), AWS GovCloud (US-East, US-West).<br /> &nbsp;<br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon C8gn Instances</a>. To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>.</p>"
  "816e1332d2fabdd223618c9b4a41d19a":
    "id": "816e1332d2fabdd223618c9b4a41d19a"
    "title": "Amazon EC2 C8ine instances are now available in AWS Europe (Ireland) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-ec2-c8ine"
    "published": "2026-11-18 07:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8ine instances are available in the AWS Europe (Ireland) region. C8ine instances are powered by custom sixth generation Intel Xeon Scalable processors, available only on AWS. These instances feature the latest sixth generation AWS Nitro cards, delivering up to 43% higher performance compared to previous generation C6in instances.</p> \n<p>C8ine instances offer up to 2.5 times higher packet performance per vCPU versus prior generation network optimized instances, providing up to 2x higher network throughput for traffic going through Internet gateways compared to existing C6in network optimized instances. C8ine instances are designed for security and network virtual appliances, including virtual firewalls, load balancers, and Telco 5G UPF workloads.</p> \n<p>Amazon EC2 C8ine instances are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland, Frankfurt) regions. C8ine instances are available via Savings Plans, On-Demand, and Spot instances. For more information, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\">Amazon EC2 C8i instance</a> pages.</p>"
  "ac2443fda2f9a4dca106cfaaa8effbc8":
    "id": "ac2443fda2f9a4dca106cfaaa8effbc8"
    "title": "Amazon ECR now supports global authentication tokens for private registries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/global-authentication-amazon-ecr"
    "published": "2026-11-18 06:37:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Elastic Container Registry (Amazon ECR) now supports global authentication tokens for private registries. Previously, you needed to request a separate authentication token in each AWS Region where you push or pull container images. Now, you can request a single token from the AWS Sign-In CreateBearerToken API and use it across all ECR private registries in the same AWS partition.</p> \n<p>Teams that run proxy services to route container pulls across Regions, a common pattern for optimizing latency or availability, previously had to request, refresh, and coordinate a separate token for every Region behind the proxy. With global tokens, the proxy manages one token for all Regions in the AWS partition. Global tokens are valid for 12 hours by default, but can be configured to be as low as 5 minutes. These tokens work with the Docker CLI, and the Amazon ECR Docker Credential Helper. Existing regional authentication tokens continue to work as before.</p> \n<p>Global authentication tokens are available in all commercial AWS Regions where Amazon ECR is supported. To learn more, see Private registry authentication in the <a href=\"https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry_auth.html\">Amazon ECR User Guide</a>.&nbsp;</p>"
  "3d317da66ba3d1eae5b72f7148fe8770":
    "id": "3d317da66ba3d1eae5b72f7148fe8770"
    "title": "AWS Security Hub now infers resource criticality from installed software and usage"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-resource-criticality/"
    "published": "2026-11-18 05:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Today, AWS Security Hub adds installed software and resource usage as signals for resource criticality, which indicates how important a resource is to your business. Security Hub uses criticality to rank exposure findings, so that central security teams can prioritize the exposures that affect their most important resources.</p> \n<p>Security Hub already infers criticality from resource tags and names, but inconsistently tagged resources often have an Unknown criticality, which makes their exposures harder to prioritize. With installed software and resource usage as additional signals, more of your resources receive a meaningful criticality with no tagging or configuration required. For example, an EC2 instance that runs a database engine and serves steady traffic receives a higher criticality than an instance that runs only monitoring agents and sits idle.</p> \n<p>These signals are included with the Security Hub Essentials plan at no additional cost and require no new enablement. To learn more, see Resources in Security Hub in the AWS Security Hub <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/resources-adv.html\" rel=\"noopener noreferrer\" target=\"_blank\">User Guide</a> and the AWS Security Hub <a href=\"https://aws.amazon.com/security-hub/\">product page</a>. For a list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p>"
  "4c12e5f9758c9648620bbb8b5e112b41":
    "id": "4c12e5f9758c9648620bbb8b5e112b41"
    "title": "Amazon API Gateway REST APIs now support JWT authorizers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-api-gateway-rest-authorizers-jwt/"
    "published": "2026-11-18 04:22:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon API Gateway now offers a native JWT authorizer for REST APIs, a new authorizer type that validates JSON Web Tokens directly in the gateway. Until now, validating tokens from an OpenID Connect or OAuth 2.0 identity provider other than Amazon Cognito required a Lambda authorizer. You now configure token validation instead of writing and operating code for it.</p> \n<p>You can define one or more issuers, the audiences accepted for each, the signing algorithms you permit, and any additional claims a token may present. API Gateway verifies each token's signature, issuer, audience, expiry, and claims on every request. You can attach one authorizer to many methods and require different scopes on each. This fits machine-to-machine APIs, mobile and web backends, and multi-tenant APIs that accept tokens from several identity providers.</p> \n<p>The JWT authorizer works on Regional, edge-optimized, and private REST APIs, and is available in all commercial AWS Regions and the AWS GovCloud (US) Regions. To get started, see <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-jwt-authorizer.html\">Amazon API Gateway documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/securing-rest-apis-with-jwt-authorizers-in-amazon-api-gateway/\">AWS blog post</a>.&nbsp;</p>"
  "5434fe057f07035ad7d823699426865c":
    "id": "5434fe057f07035ad7d823699426865c"
    "title": "Amazon Bedrock AgentCore Memory now supports short-term memory retention of up to 10 years"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-memory-10-year-retention"
    "published": "2026-11-18 04:22:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Bedrock AgentCore Memory now lets you keep short-term memory events for up to 10 years, up from one year. Developers can now use short-term memory as a long-lived record of agent conversations and interactions. This helps when that history needs to stay available for a long time, such as for compliance and audit, for users who come back after months away, or for agents that need to look back at past sessions.</p> \n<p>You set retention on the memory resource, and it's applied to each event when the event is created, so existing events keep their original retention. Standard short-term memory storage charges apply for as long as you keep the data.</p> \n<p>This feature is available in all AWS Regions where AgentCore Memory is available. To get started, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html\">AgentCore Memory documentation</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "c45721a5f13f0a07bd7c4487ca92d91e":
    "id": "c45721a5f13f0a07bd7c4487ca92d91e"
    "title": "Amazon Bedrock AgentCore Memory now provides full session summaries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-memory-full-session-summaries"
    "published": "2026-11-18 04:17:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Bedrock AgentCore Memory now keeps a full session summary for every session. It's a single record that gives a snapshot of what happened in the conversation. Summary chunks cover the conversation in more detail, while the full session summary captures the overall picture of where the session stands. AgentCore Memory updates it as new events arrive, so it always reflects the session so far. This works well for developers who want a quick recap rather than a play-by-play.</p> \n<p>Full session summaries come with the summary strategy and need no extra setup. Every memory that has a summary strategy gets them automatically, including existing sessions. Each summary is stored as a long-term memory record next to the session's summary chunks. You retrieve it with the Memory operations you already use, and you can filter by record type to return only full session summaries.</p> \n<p>This feature is available in all AWS Regions where AgentCore Memory is available. To get started, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/summary-strategy.html#summary-strategy-full-session-summary\">Summary strategy documentation</a>.</p>"
  "0dd50e3de9bef918a6e3d71b80470a45":
    "id": "0dd50e3de9bef918a6e3d71b80470a45"
    "title": "Amazon SageMaker now supports AI data preparation capabilities to build high-quality datasets for model development"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-ai-data-prep-capabilities/"
    "published": "2026-11-18 04:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Building high-quality training datasets has traditionally required weeks of manual labeling and data cleaning. Amazon SageMaker now offers AI data preparation capabilities that help data scientists and ML engineers build high-quality training and evaluation datasets for both text-based model customization and traditional ML.</p> \n<p>Teams can generate synthetic examples grounded in their own documents, auto-label records at scale with confidence scores, incorporate expert feedback through human review, evaluate data quality, and transform data for their chosen training or evaluation technique. Synthetic data generation creates training, evaluation, and test data from a specification grounded in your documents. Auto-labeling labels data at scale with built-in task types including classification, named entity recognition, extractive question answering, ordinal rating, and summarization, plus custom tasks. Rows below your confidence threshold go to a human review queue in the Label Studio Community Edition in SageMaker AI Studio. Data quality evaluation finds duplicates and surfaces issues such as tone and insufficient diversity with both quality metrics and rules. Data transformation cleans and reshapes data for your training or evaluation technique, using operators such as dedupe, filter, and format conversion.</p> \n<p>Teams can start with just a few examples, production traces, or existing data in <a href=\"https://aws.amazon.com/s3/\">Amazon S3</a>, <a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a>, or <a href=\"https://aws.amazon.com/glue/\">AWS Glue Data Catalog</a>. Developers access these capabilities directly through the SageMaker Python SDK API or in natural language through the latest version of the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/core-skills/aws-ai-ml\" rel=\"noopener noreferrer\" target=\"_blank\">AWS AI-ML skill in the Agent Toolkit for AWS</a>. Your source data, generated datasets, and labels stay in your own Amazon S3 buckets, controlled by an IAM role you manage.</p> \n<p>These capabilities are available in the US East (N. Virginia) (us-east-1) and US West (Oregon) (us-west-2) regions.</p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/ai-data-prep.html\" rel=\"noopener noreferrer\" target=\"_blank\">AI data preparation documentation</a>.</p>"
  "c31a7c856b7cdfab1f889f64282c54e6":
    "id": "c31a7c856b7cdfab1f889f64282c54e6"
    "title": "Amazon DynamoDB caching is now available with Amazon ElastiCache Serverless for Valkey"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/dynamodb-caching-elasticache/"
    "published": "2026-11-18 03:54:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Today, AWS announces the general availability of DynamoDB caching with Amazon ElastiCache Serverless for Valkey, enabling sub-millisecond read latency for frequently accessed DynamoDB data. Previously, if you required faster reads than DynamoDB's single-digit millisecond latency, you had to manually manage cache infrastructure or keep a separate cache in sync. Now you can access DynamoDB table data from a write-through cache that updates as data changes and automatically scales to meet changing workload demands.</p> \n<p>DynamoDB caching requires no application logic changes and minimal configuration. You choose which DynamoDB tables and APIs to cache and how long to retain cached data. Your application's IAM credentials are used to access DynamoDB, so existing access control policies are automatically applied.</p> \n<p>DynamoDB caching is available in all commercial and AWS GovCloud (US) Regions. DynamoDB caching is offered at no additional cost, so you pay only for the ElastiCache Serverless and DynamoDB resources your applications use. To get started, see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/ddb-caching.html\">ElastiCache Developer Guide</a>.</p>"
  "284293a59b413635416f29287f5cfd69":
    "id": "284293a59b413635416f29287f5cfd69"
    "title": "Amazon OpenSearch UI is now available in the Africa (Cape Town) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/opensearch-ui-available-africa-cape-town-region"
    "published": "2026-11-18 03:34:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon OpenSearch UI has expanded to the AWS Africa (Cape Town) Region, bringing availability to 25 AWS Regions. OpenSearch UI provides a single endpoint to query, visualize, and analyze data across Amazon OpenSearch Service domains running OpenSearch version 1.3 or later and OpenSearch Serverless collections, including Classic and NextGen.<br /> <br /> One OpenSearch UI application can connect to multiple domains and collections. Workspaces organize dashboards, saved queries, and other content, with purpose-built experiences for observability, security analytics, and search. The Discover interface supports multiple data sources and query languages, including Piped Processing Language (PPL) and SQL. It also includes a data selector, query autocomplete, and an updated design. OpenSearch UI runs separately from your domains and collections, giving you access to the latest UI capabilities without requiring cluster upgrades.<br /> <br /> To get started, create an OpenSearch UI application using the Amazon OpenSearch Service console, AWS CLI, or AWS SDKs. OpenSearch UI is available at no additional charge. You pay only for the domains and collections it connects to. For the complete list of supported Regions, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-ui-endpoints-quotas.html\">OpenSearch UI endpoints and quotas</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/application.html\">Using OpenSearch UI in Amazon OpenSearch Service</a>&nbsp;in the Amazon OpenSearch Service Developer Guide.</p>"
  "dbb0b9c950835c19672a3a16490600a8":
    "id": "dbb0b9c950835c19672a3a16490600a8"
    "title": "Amazon Bedrock AgentCore now offers free monthly web search queries"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/bedrock-agentcore-free-web-search-queries/"
    "published": "2026-11-18 03:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon Bedrock AgentCore now offers 5,000 free web search queries per month through the Web Search Tool in AgentCore gateway and the Web Search API. AgentCore helps developers build, deploy, and operate highly effective agents securely at scale. Developers can now build and test agents with web search capabilities at no cost for their first 5,000 queries each month.</p> \n<p>The free allowance applies automatically, with no setup required. It is shared across supported AWS Regions and by all accounts in an organization, and resets each month. Additional queries are billed at standard rates without interrupting your agents.</p> \n<p>Free web search queries are available in all AWS Regions that support the Web Search Tool and Web Search API: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Ireland), Asia Pacific (Sydney), and Asia Pacific (Tokyo).</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/web-search-api.html\">Web Search Tool in the AgentCore Developer Guide</a>, and the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">AgentCore product page</a>.</p>"
  "080090551facf1b9aeae729d769bc010":
    "id": "080090551facf1b9aeae729d769bc010"
    "title": "AWS Config announces managed conformance packs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-config-managed-conformance-packs"
    "published": "2026-11-18 02:49:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Config now offers managed conformance packs. AWS builds and maintains these packs for specific compliance and governance frameworks. When you deploy one, you choose a framework, and AWS Config evaluates your resources against it. AWS keeps the pack up to date as things change. When new AWS Config managed rules map to the framework's controls, or when the framework itself is revised, AWS updates your deployed pack automatically. Because AWS maintains a consistent pack definition in every supported Region, you can deploy the same framework across Regions without building or maintaining Region-specific rule sets. With managed conformance packs you no longer have to track framework changes or update rules yourself.</p> \n<p>Previously, to evaluate resources against a framework such as PCI DSS or SOC 2, you started from a sample conformance pack template, customized it for your environment, and then updated it yourself whenever new rules became available or the framework changed. Managed conformance packs remove that work, so your coverage stays current without manual template changes. Each pack includes the managed rules available in the Region where you deploy it and adds new rules as they become available there, so you don't need a separate template for each Region. You can set rule parameters to fit your environment. Compliance results and compliance scores appear in the AWS Config console alongside your other rules and conformance packs.</p> \n<p>Managed conformance packs cover frameworks including PCI DSS v4, SOC 2, NIST SP 800-53 Rev. 5, ISO/IEC 27001:2022, and CIS Controls, along with AI governance frameworks such as the EU AI Act and NIST AI RMF 1.0.&nbsp;For the full list, see the <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/conformance-packs.html\">AWS Config documentation page</a>.</p> \n<p>Managed conformance packs are available in all AWS commercial Regions except Middle East (UAE) and Middle East (Bahrain). For the full list of supported Regions, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Capabilities by Region</a>. Evaluations are billed at standard conformance pack evaluation rates. To get started, open the AWS Config console and choose Conformance packs. To learn more, see the <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html\">AWS Config Developer Guide</a> and the <a href=\"https://aws.amazon.com/config/pricing/\">AWS Config pricing page</a>.</p>"
  "bb8e491dd9d2c2be9e51704b404df274":
    "id": "bb8e491dd9d2c2be9e51704b404df274"
    "title": "Amazon Aurora DSQL now offers SQL statement statistics in Database Insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aurora-dsql-statement-statistics/"
    "published": "2026-11-18 02:37:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now records statistics for each SQL statement your cluster runs and publishes them as Amazon CloudWatch OpenTelemetry (OTel) metrics. You can view them in Amazon CloudWatch Database Insights. For each statement, you see how often it runs, how long it takes, the rows it scans, returns, or changes, and the DPUs it uses.</p> \n<p>Statement statistics measure every successful statement rather than sampling activity. Use them to find the statements that take the most time, run most often, or cost the most. In Database Insights, choose a statement under Top SQL to see its normalized SQL text and per-call charts. You can also query the metrics with PromQL in CloudWatch. Turn on statement statistics for each cluster in the Aurora DSQL console or the API when you create or update the cluster.</p> \n<p>Statement statistics are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL is available. Standard CloudWatch metrics and Logs charges apply, with no additional Aurora DSQL charge. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/dsql-statement-statistics.html\">monitoring SQL statements with statement statistics</a> in the Aurora DSQL User Guide and <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing</a>.</p>"
  "bb5a9a276b53a69824e14833310d3076":
    "id": "bb5a9a276b53a69824e14833310d3076"
    "title": "Amazon EVS launches support for r7i.metal instances, external principal storage, and an Agent Skill"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-evs-r7i-agent-skill-support/"
    "published": "2026-11-18 02:27:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Today, we are announcing that Amazon Elastic VMware Service (Amazon EVS) now supports the r7i.metal-24xl and r7i.metal-48xl Amazon Elastic&nbsp;Compute Cloud (EC2) bare metal instance types for VMware Cloud Foundation (VCF) 9.x deployments. EC2 r7i instances are memory optimized, with custom 4th Generation Intel Xeon Scalable (Sapphire Rapids) processors, and designed to be used with external storage. With these instances possessing no local NVMe disks, Amazon EVS now supports VCF external principal storage with solutions such as Amazon FSx for NetApp ONTAP. With this launch, you can use the Amazon EVS Deployment Orchestrator (EDO) within the <a href=\"https://github.com/aws/solutions-for-amazon-evs\">Solutions for EVS GitHub repository</a> to fully automate the <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/one-stack-full-vcf-deploying-vmware-cloud-foundation-9-on-amazon-evs-with-the-evs-deployment-orchestrator/\">end-to-end deployment and configuration of your VCF 9.x environment</a> on EVS.</p> \n<p>With this release, you now have more options for running VMware-based Virtual Machines (VM) in your Amazon VPC - while keeping the same tools, skills, and operational processes, and full control of your architecture, configuration, and lifecycle of your environment.&nbsp;</p> \n<p>We are also launching a new Amazon EVS Agent Skill, which gives your AI Agents context to&nbsp;help you plan, deploy, and operate your Amazon EVS environments - from answering questions and recommending designs to generating blueprints and driving deployments with EDO. To get started, point the AI agent of your choice to the EVS Agent Skill file in the latest <a href=\"https://github.com/aws/solutions-for-amazon-evs/releases\">release of the EVS GitHub repository</a>.&nbsp;&nbsp;</p> \n<p>This release is available in all regions where Amazon EVS is offered. To learn more about Amazon EVS, visit the <a href=\"https://aws.amazon.com/evs/\">product detail page</a>&nbsp;and the <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>.</p>"
  "2f76c5bc636f36418bb83680321c38dd":
    "id": "2f76c5bc636f36418bb83680321c38dd"
    "title": "AWS announces general availability of AWS Interconnect - multicloud connectivity with Microsoft Azure"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-announces-AWS-interconnect-multicloud-azure-ga/"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS announces the general availability of AWS Interconnect - multicloud with Microsoft Azure. </p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. They do so for many reasons including interoperability requirements, the freedom to choose technology that best suits their needs, and the ability to build and deploy applications on any environment with greater ease and speed. Previously, when interconnecting workloads across multiple cloud providers (CSPs), customers had to go the route of a ‘do-it-yourself’ multicloud approach, leading to complexities of building and managing global multi-layered networks at scale. AWS Interconnect - multicloud is the first purpose-built product of its kind and a new way of how clouds connect and talk to each other, allowing customers to quickly provision resilient, scalable private connections to other cloud providers.</p> \n<p>In August, Microsoft Azure launched support for AWS Interconnect in public preview and became the latest CSP to adopt the <a href=\"https://github.com/aws/Interconnect?refid=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e\" target=\"_blank\"><u>open specification</u></a> that powers the service. With today’s GA launch, AWS customers can now rely on the same consistent, simple experience to interconnect their workloads on Microsoft Azure, Google Cloud, and Oracle Cloud Infrastructure (OCI).</p> \n<p>Interconnect - multicloud is available with Microsoft Azure in the us-east-1 (N. Virginia), ap-southeast-2 (Sydney), and eu-central-1 (Frankfurt) AWS Regions. You can create an Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/latest/userguide/what-is-interconnect.html?refid=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e\" target=\"_blank\"><u>AWS Interconnect - multicloud documentation</u></a>.</p>"
  "5d5b6edd99edbd61b50af289497ff194":
    "id": "5d5b6edd99edbd61b50af289497ff194"
    "title": "Amazon WorkSpaces provides a new Windows client experience"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/workspaces-new-windows-client"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon WorkSpaces provides a new Windows client experience for Amazon WorkSpaces Personal. The new client experience includes an updated interface, a simplified connection flow, easier-to-find settings, and the new WorkSpaces Advisor proactive troubleshooting (Public Preview) that suggests actions you can take to resolve common issue</p> \n<p>WorkSpaces Advisor proactive troubleshooting (Public Preview) is an intelligent new capability that monitors key metrics from your device, network, and the WorkSpace itself, and provides you with actionable recommendations if there are issues with registration, sign-in, or the connection in general. The new client experience also includes an improved full screen experience, a welcome tour to help orient you, and for WorkSpaces that are admin-enabled, a self-service option to enable nested virtualization.</p> \n<p>The new client experience is available at no additional cost in all AWS Regions where Amazon WorkSpaces Personal is available.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/workspaces/latest/userguide/amazon-workspaces-windows-client.html\">Amazon WorkSpaces Windows client documentation</a>&nbsp;or download the <a href=\"https://clients.amazonworkspaces.com/\">Amazon WorkSpaces client</a>.</p>"
  "0f2bea6343f8c971ef49aedecc3bb5cd":
    "id": "0f2bea6343f8c971ef49aedecc3bb5cd"
    "title": "Amazon MSK Standard Brokers now support Graviton4-based M8g instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-msk-standard-brokers-graviton4-m8g-instances/"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Graviton4-based M8g instances are now generally available for Standard Brokers in Amazon Managed Streaming for Apache Kafka (Amazon MSK). Compared to Standard Brokers on M7g, M8g delivers up to 35% lower P99 produce latency and 30% faster catch-up for consumers that fall behind.</p> \n<p>Standard Brokers on M8g are available today across all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS regions</a> where MSK Standard Brokers and M8g instances are available. For pricing, refer to the Amazon <a href=\"https://aws.amazon.com/msk/pricing/\">MSK pricing page</a>. To get started, use the AWS Management Console or API to create a new cluster with Standard Brokers on M8g or start an in-place migration of an existing cluster from Standard Brokers on M7g to M8g. To learn more, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MSK Developer Guide</a>.</p>"
  "43647c11df95939b1a9c4e607dd89702":
    "id": "43647c11df95939b1a9c4e607dd89702"
    "title": "Amazon MSK Express Brokers now support Graviton4-based M8g instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-msk-express-brokers-graviton4-m8g-instances/"
    "published": "2026-11-18 01:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>AWS Graviton4-based M8g instances are now generally available for Express Brokers in Amazon Managed Streaming for Apache Kafka (Amazon MSK). Compared to Express Brokers on M7g, M8g delivers 15% lower compute costs, up to 45% lower P99 produce latency, and 2x faster catch-up for consumers that fall behind. Additionally, customers no longer pay the broker-side cost when moving data across Availability Zones between clients and brokers, reducing total cross-AZ data transfer costs by 50%. Together, lower data transfer and broker-hour charges result in up to 30% cost savings compared to Express Brokers on M7g.</p> \n<p>MSK Express Brokers are designed to deliver up to 3x more throughput per broker, scale up to 20x faster, and reduce recovery time by 90% compared to Standard Brokers running Apache Kafka. Express Brokers on M8g further improve on M7g with better economics and performance along with existing Express capabilities. Customers running Apache Kafka on external clusters, including on-premises, self-managed on AWS, or other cloud providers, can use Amazon MSK Replicator to seamlessly migrate to Express Brokers on M8g and immediately benefit from the improved price and performance. Existing Express customers can upgrade from M7g to M8g through in-place migration while client applications keep producing and consuming without interruption.</p> \n<p>Express Brokers on M8g are available today across all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS regions</a> where MSK Express Brokers and M8g instances are available. For pricing, refer to the Amazon <a href=\"https://aws.amazon.com/msk/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">MSK pricing page</a>. To get started, use the AWS Management Console or API to create a new cluster with Express Brokers on M8g, start an in-place migration of an existing cluster from Express Brokers on M7g to M8g, or set up a replicator from an external Kafka cluster with Amazon MSK Replicator. To learn more, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/getting-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MSK Developer Guide</a>.</p>"
  "ee70ff0a815592dd5b655818cb9dae1e":
    "id": "ee70ff0a815592dd5b655818cb9dae1e"
    "title": "Amazon API Gateway REST APIs now support JWT authorizers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-api-gateway-rest-jwt-authorizers/"
    "published": "2026-11-18 00:00:00"
    "fetched": "2026-11-18 11:02:39"
    "summary": "<p>Amazon API Gateway now offers a native JWT authorizer for REST APIs, a new authorizer type that validates JSON Web Tokens directly in the gateway. Until now, validating tokens from an OpenID Connect or OAuth 2.0 identity provider other than Amazon Cognito required a Lambda authorizer. You now configure token validation instead of writing and operating code for it.</p> \n<p>You can define one or more issuers, the audiences accepted for each, the signing algorithms you permit, and any additional claims a token may present. API Gateway verifies each token's signature, issuer, audience, expiry, and claims on every request. You can attach one authorizer to many methods and require different scopes on each. This fits machine-to-machine APIs, mobile and web backends, and multi-tenant APIs that accept tokens from several identity providers.</p> \n<p>The JWT authorizer works on Regional, edge-optimized, and private REST APIs, and is available in all commercial AWS Regions and the AWS GovCloud (US) Regions. To get started, see <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-jwt-authorizer.html\">Amazon API Gateway documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/securing-rest-apis-with-jwt-authorizers-in-amazon-api-gateway/\">AWS blog post</a>.&nbsp;</p>"
  "113e3dbec3559b273e09891ab9412b6f":
    "id": "113e3dbec3559b273e09891ab9412b6f"
    "title": "Amazon WorkSpaces Applications adds support for smart card redirection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-workspaces-applications-smart-card-redirection/"
    "published": "2026-11-18 08:46:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>Amazon WorkSpaces Applications now supports smart card redirection on single-session and multi-session fleets, so users can access the smart card connected to their local device from applications inside their streaming session. It also extends smart card sign-in, previously limited to single-session fleets, to multi-session fleets. This launch helps public sector, healthcare, and other regulated organizations that use Common Access Card (CAC) or Personal Identity Verification (PIV) cards run those workflows on multi-session fleets.</p> \n<p>Administrators can turn smart card sign-in for Active Directory and smart card redirection on or off independently for each stack. Smart card sign-in lets users sign in to domain-joined streaming instances with their smart card instead of a password, while redirected smart cards support in-session authentication, digital signing, and email encryption. For example, a government agency can move CAC users from single-session to multi-session fleets and keep CAC sign-in.</p> \n<p>These capabilities are available today in all AWS commercial and AWS GovCloud (US) regions that offer WorkSpaces Applications.</p> \n<p>To get started, turn on either setting under User settings for your stack, use a Windows image with the latest WorkSpaces Applications agent, and connect with the WorkSpaces Applications client for Windows. New stacks have both settings turned off by default, and existing stacks that use smart card redirection keep it turned on. To learn more, see <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/set-up-stacks-fleets-install.html\" rel=\"noopener noreferrer\" target=\"_blank\">Create a stack</a> in the Amazon WorkSpaces Applications Administration Guide, or visit the <a href=\"https://aws.amazon.com/workspaces/applications/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon WorkSpaces Applications</a> product page.</p>"
  "d029a0700af9cd499ff63300487d692a":
    "id": "d029a0700af9cd499ff63300487d692a"
    "title": "Customize AWS Elemental Inference with custom models, prompts, and decisions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/elemental-inference-functions-decisions/"
    "published": "2026-11-18 05:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>AWS Elemental Inference now lets you customize how it analyzes your live video in two ways. You can create functions that ask custom questions of the video using multi-modal foundational models in Amazon Bedrock, or add contextual metadata decisions using labels and questions you define. Both run on the same pipeline as built-in features such as vertical video creation and smart subtitles, and return results through the GetMetadata API, with no separate pipeline to build.</p> \n<p>Use contextual metadata decisions when the answer you need fits labels and yes/no questions. You define yes/no questions, such as whether a scene is a weather report, or \"pick-one\" categories, such as genre. For each scene, contextual metadata returns a decision and a confidence score for every label and question, alongside the standard Interactive Advertising Bureau (IAB), Global Alliance for Responsible Media (GARM), and mood fields, so your workflows can act when confidence meets a threshold you set. No model selection or prompt writing is required.</p> \n<p>Use functions for open-ended answers, custom response formats, or analysis contextual metadata doesn't cover, such as sponsor logo exposure. A function specifies an Amazon Bedrock model and JSONata expressions that shape the request and response. You attach it to a feed and choose how frequently it runs.</p> \n<p>Contextual-metadata decisions configuration is included in the contextual metadata price. Functions are available at no additional charge on feeds with at least one feature active; Amazon Bedrock usage is billed separately. Both are available in all AWS Regions where AWS Elemental Inference is available.</p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/elemental-inference/latest/userguide/what-is.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Elemental Inference user guide</a>.</p>"
  "d2ac580ec3e5eb7f1f348d7b57eb714c":
    "id": "d2ac580ec3e5eb7f1f348d7b57eb714c"
    "title": "AWS Lambda now supports scale to and from zero for Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-managed-instances-scale-to-zero/"
    "published": "2026-11-18 04:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>AWS Lambda now supports scale to and from zero for Event Functions running on&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances</a> (LMI). Lambda automatically scales execution environments for your function to zero&nbsp;during idle periods and scales them back up when requests arrive, without requiring you to provision minimum capacity. This makes LMI cost-effective for intermittent workloads such as asynchronous processing, development, and test environments.</p> \n<p>Lambda Managed Instances lets you run Lambda functions on your Amazon EC2 instances while maintaining the operational simplicity of Lambda. With Lambda Managed Instances, you can access specialized compute configurations and drive cost efficiency through EC2 pricing advantages, without managing infrastructure.&nbsp;Previously, customers needed to keep a minimum number of execution environments running even when there was no traffic. With this launch, Lambda scales execution environments for your function to zero after a period with no activity, and provisions them again when requests arrive. This improves cost efficiency for workloads with periods of no traffic.</p> \n<p>This feature is available today in all <a href=\"https://builder.aws.com/build/capabilities\">AWS commercial Regions</a> where Lambda Managed Instances is available. To get started, set&nbsp;MinExecutionEnvironments to zero for your function using the Lambda console, AWS CLI, AWS SDKs, AWS CloudFormation, AWS SAM, or AWS CDK. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-scaling.html\">AWS Lambda Developer Guide</a>&nbsp;and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>.<br /> </p>"
  "bf4eafa998d8814808d301997999d887":
    "id": "bf4eafa998d8814808d301997999d887"
    "title": "Amazon Corretto November 2026 Critical Security Patch Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-corretto-nov-2026-updates/"
    "published": "2026-11-18 00:00:00"
    "fetched": "2026-11-18 20:01:26"
    "summary": "<p>On Nov 17, 2026, Amazon announced critical security patch update (CSPU) for Amazon Corretto Long-Term Support (LTS) and Feature Release (FR) versions of OpenJDK. Corretto 27.0.1.1.4, 25.0.5.1.2, 21.0.13.1.2, 17.0.21.1.2, 11.0.33.1.1, and 8u514 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK.</p> \n<p>Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 27, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-27-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.</p> \n<p>Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "297e34ba09600ed0faaecb8ece4c1e20":
    "id": "297e34ba09600ed0faaecb8ece4c1e20"
    "title": "AWS Control Tower now supports existing Amazon S3 bucket for log delivery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/control-tower-existing-s3-log-bucket/"
    "published": "2026-11-18 17:00:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p>AWS Control Tower now lets you use an existing Amazon S3 bucket in your landing zone to store AWS Config and AWS CloudTrail logs. Previously, AWS Control Tower required you to use the Amazon S3 bucket it creates and manages for log storage. Now, customers who want full control of bucket policies, lifecycle rules, and logging infrastructure can consolidate centralized logs in an Amazon S3 bucket they already manage.</p>\n<p>You can use your own Amazon S3 bucket for both AWS Config and AWS CloudTrail, giving you full control of bucket policies, lifecycle rules, and logging infrastructure. You can switch between self-managed and AWS Control Tower managed buckets at any time, and your Amazon S3 buckets are preserved during landing zone updates, resets, and decommissioning. The bucket must be owned by an AWS account in your organization, be located in your AWS Control Tower home Region, and be preconfigured with the bucket policy that AWS Control Tower requires.</p>\n<p>This feature is supported in landing zone version 4.0 and later and is available in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a>, the AWS GovCloud (US) Regions, and the AWS European Sovereign Cloud where AWS Control Tower is available.</p>\n<p>To learn more about configuring self-managed Amazon S3 bucket for your AWS Control Tower landing zone, visit the <a href=\"https://docs.aws.amazon.com/controltower/latest/userguide/custom-logging-bucket.html\" target=\"_blank\">AWS Control Tower documentation</a>.</p>"
  "b42f5cc0317a2c210e87688a07b7b575":
    "id": "b42f5cc0317a2c210e87688a07b7b575"
    "title": "Amazon Cognito now supports authentication level and method token claims"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cognito-acr-amr-token/"
    "published": "2026-11-18 04:00:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p>Amazon Cognito now supports authentication context class reference (ACR) and authentication methods reference (AMR), by adding ACR and AMR claims to access, ID, and refresh tokens. Your application can use the authentication level (ACR) to make authorization decisions, such as requiring additional factors for sensitive operations. It can also use completed methods (AMR), such as time-based one-time password (TOTP), for auditing and compliance.</p> \n<p>Amazon Cognito defines four authentication levels based on the factors a user completes, from password-only (level 1) to a password with a TOTP (level 4). Each token reflects the level achieved during sign-in, so your application can make authorization decisions based on how a user authenticated. If your application requires a stronger level, you can request a target level in your application's sign-in flow or through managed login, and Amazon Cognito issues new tokens once the user completes the required factors. You can also customize ACR level URIs for your user pool. For federated users from an OpenID Connect (OIDC) provider, Amazon Cognito maps the provider's ACR and AMR values to your levels.</p> \n<p>ACR and AMR token claims are available in all AWS Regions where Amazon Cognito is offered. Every user pool includes ACR and AMR token claims, regardless of feature plan. Requesting a target authentication level and configuring custom ACR level URIs are available with the Essentials or Plus feature plan. To get started, configure ACR and AMR using the AWS Management Console, AWS CLI, or AWS SDKs. See <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-step-up-authentication.html\">developer guide</a> for details.</p>"
  "518e86e63d1146107555c0c3fd7da1fc":
    "id": "518e86e63d1146107555c0c3fd7da1fc"
    "title": "Amazon OpenSearch Serverless now supports ingest pipelines"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/opensearch-serverless-support-ingest-pipelines"
    "published": "2026-11-18 03:43:00"
    "fetched": "2026-11-19 04:54:38"
    "summary": "<p>Amazon OpenSearch Serverless now supports ingest pipelines, so you can clean, enrich, and vectorize documents inside your collection as they are indexed, without running separate preprocessing infrastructure. Teams building search, log analytics, and generative AI applications can replace data-prep code in Lambda functions or ETL jobs with transformations that apply consistently to every document, regardless of how it is ingested.</p> \n<p>You can use ingest pipelines to normalize and clean data with processors such as copy, date, dot_expander, join, lowercase, uppercase, remove, rename, set, and trim. For semantic and AI search, you can chunk long text with text_chunking and generate embeddings at ingest time with text_embedding, text_image_embedding, and sparse_encoding. The ml_inference processor calls any model you have connected and lets you map its input and output fields yourself. You create and manage pipelines with the familiar OpenSearch _ingest/pipeline APIs. You can test a pipeline against sample documents with the _simulate API before sending it live traffic, then apply it as an index's default pipeline or on individual indexing and bulk requests.</p> \n<p>Pipeline processing uses your collection's indexing OpenSearch Compute Units (OCUs) and is billed the same way as other indexing activity. If you use a remote model with an ML processor, the model provider bills inference separately. Ingest pipelines are available in all AWS Regions where Amazon OpenSearch Serverless is <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\">available</a>.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-ingest-pipelines.html\">Ingest pipelines in Amazon OpenSearch Serverless</a> in the Amazon OpenSearch Service Developer Guide. To learn more about OpenSearch Serverless, visit the <a href=\"https://aws.amazon.com/opensearch-service/features/serverless/\">Amazon OpenSearch Serverless product page</a>.</p> \n<p>&nbsp;</p>"
  "fac12c6ae1494a2539548792a9cf879b":
    "id": "fac12c6ae1494a2539548792a9cf879b"
    "title": "Amazon Aurora DSQL now supports audit logging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-aurora-dsql-audit-logging/"
    "published": "2026-11-18 17:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/?refid=f1097432-a884-4027-abe8-3dbd6d9c5cdc\">Amazon Aurora DSQL</a> now supports database-internal audit logging, a fully managed capability that captures SQL statements executed on your cluster. Previously, AWS CloudTrail recorded who connected to a DSQL cluster, but not what they did once inside it. Now, financial institutions and regulated enterprises can meet production compliance requirements by capturing DDL, DML, DCL, and SELECT statements with full statement text, bind parameters, acting principal (both PostgreSQL role and AWS IAM identity), timestamp, table name, and transaction identifier.</p> \n<p>With audit logging, you can feed SIEM systems directly from Amazon S3, satisfy auditor requirements for change accountability, and reconstruct events after security incidents. Logs are delivered as structured JSON to your S3 bucket via CloudWatch Vended Logs. Configuration requires a single SQL setting—no extension to load and no log-shipping pipeline to build.</p> \n<p>Audit logging is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora DSQL is available. Audit logging will incur Aurora DSQL DPU charges, charges for log delivery through CloudWatch Logs, and charges for storing audit records in Amazon S3. For pricing information, see <a href=\"https://aws.amazon.com/rds/aurora/dsql/pricing/\">Aurora DSQL pricing</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/audit-logging.html\" rel=\"noopener noreferrer\" target=\"_blank\">audit logging</a> in the Aurora DSQL User Guide.</p>"
  "01acd6ea09f53c95fd932fa51d956f93":
    "id": "01acd6ea09f53c95fd932fa51d956f93"
    "title": "Amazon ElastiCache now supports distributed KV caching for self-hosted LLM inference"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/announcing-distributed-kv-caching-for-self-hosted-llms-with-amazon-elasticache/"
    "published": "2026-11-18 17:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache for Valkey</a> now offers fully managed distributed KV caching, a new capability that reduces self-hosted large language model (LLM) inference costs by up to 40% and time to first token (TTFT) by up to 80%. Customers who self-host LLMs pay for redundant GPU work because small, isolated caches on each server can't hold or share the growing context AI agents and chat applications resend. Distributed KV caching extends GPU-local caches with a shared tier so any server can reuse KV state for days across sessions, routing shifts, and server failures. GPUs can fetch cached KV state in milliseconds to serve more requests and respond faster.</p> \n<p>Distributed KV caching runs on cache.i8ge.48xlarge nodes in the same Availability Zone as the GPU fleet and connects to GPUs through Remote Direct Memory Access (RDMA) over <a href=\"https://aws.amazon.com/hpc/efa/\" rel=\"noopener noreferrer\" target=\"_blank\">Elastic Fabric Adapter (EFA).</a>&nbsp;Distributed KV caching works with open-weight, fine-tuned, and custom models, whether they use full, sparse, hybrid, or other attention designs. You can add distributed KV caching to the inference engines you already use, including vLLM, SGLang, and TensorRT-LLM, through the LMCache connector with a configuration change. You can also use the <a href=\"https://github.com/aws-samples/amazon-elasticache-samples/tree/main/kvtrace\" rel=\"noopener noreferrer\" target=\"_blank\">open-source KVTrace tool</a> to estimate the cost and latency reductions on your own application traffic before deploying anything, at no charge.</p> \n<p>Distributed KV caching is available today on ElastiCache for Valkey in 13 AWS Regions across the US, Europe, and Asia Pacific. To get started, create a cluster with cache.i8ge.48xlarge nodes using the <a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS CLI</a>&nbsp;in the same AZ as your GPU fleet and adding the endpoint to your inference engine. To learn more, read the <a href=\"https://aws.amazon.com/blogs/database/announcing-distributed-kv-caching-for-self-hosted-llms-with-amazon-elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS blog</a> for a technical deep dive and performance results, or visit the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/distributed-kv-caching.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache documentation</a>. For pricing, see the <a href=\"https://aws.amazon.com/elasticache/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache pricing page</a>.</p>"
  "7ce52495a6d68674c23342f431136f55":
    "id": "7ce52495a6d68674c23342f431136f55"
    "title": "AWS IAM account access manager is now even easier to deploy and use"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-account-access-manager-easier/"
    "published": "2026-11-18 17:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Deploying and using AWS Identity and Access Management (IAM) account access manager is now even easier: you can use AWS managed policies to enable and administer it; you can include it in your infrastructure-as-code (IaC) configurations; and its role assignments are integrated in a growing number of third-party identity and entitlement management solutions.</p> \n<p>Administering workforce access with account access manager requires permissions across several services, including AWS IAM Identity Center, AWS Organizations, AWS KMS, and AWS IAM. Previously, defining administrative access required hand-assembling multi-service IAM policies. The new AWS managed policies enable faster ramp up with broadly scoped job-aligned permissions for: 1/ Full administrator (AWSAccountAccessManagerAdministrator) - used to enable and manage account access manager in the AWS organization management account and to map users/groups to IAM roles; 2/ Entitlement Manager (AWSAccountAccessManagerEntitlementManager) - used to assign and remove user access without the ability to change service configuration; and 3/ ReadOnly (AWSAccountAccessManagerReadOnlyAccess) - used by auditors and compliance reviewers for visibility into user access.</p> \n<p>Account access manager streamlines assignment of IAM roles to workforce users and groups in IAM Identity Center, bringing together access management flexibility, user awareness, and a single point of federation. You can include account access manager in your IaC configurations managed through Terraform, Pulumi, or AWS CloudFormation. The entitlements that you assign with account access manager are reflected in your identity provider (IdP) and entitlements management system, including those offered by AWS partners Okta, PingIdentity, Cisco Duo, Apono, BeyondTrust, Britive, Sonrai Security, C1.ai, Lumos, and SailPoint.</p> \n<p>IAM account access manager is provided at no additional cost and available in all AWS Commercial Regions enabled by default. To learn more and get started, visit the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/account-access-manager.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Identity and Access Management User Guide</a>.</p>"
  "e7a5d041b422835868372304dbfc38fb":
    "id": "e7a5d041b422835868372304dbfc38fb"
    "title": "Amazon S3 Replication adds exclusions and Multi-Region key resolution"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-s3-replication-exclusions-multi-region-key-resolution/"
    "published": "2026-11-18 16:00:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>You can now replicate data in Amazon S3 buckets with fewer replication rules using two new S3 Replication capabilities, exclusions and Multi-Region key resolution. Buckets that many tenants or applications share often need many rules to skip certain data or to match encryption keys in each AWS Region. With these capabilities, customers who manage multi-tenant and shared buckets can replace many replication rules with a single rule.</p> \n<p>With exclusions, you can replicate an entire bucket while skipping specific prefixes or tagged objects, such as logs or experimental data. With Multi-Region key resolution, S3 Replication encrypts each replica with the matching AWS Key Management Service (AWS KMS) Multi-Region key in the destination Region, so replicas meet the same encryption requirements as their source objects. For example, a bucket that stores data for hundreds of tenants, each with its own Multi-Region key, can replicate with a single rule, including tenants you add later.</p> \n<p>Exclusions and Multi-Region key resolution are optional and available at no additional charge in all AWS Regions. To get started, use the AWS SDKs, AWS CLI, S3 API, or S3 console. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/replication/\" target=\"_blank\">S3 Replication product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html\" target=\"_blank\">Replicating objects within and across Regions</a> in the S3 User Guide.</p>"
  "3cdb3511d01954ebebef4cb16874dd18":
    "id": "3cdb3511d01954ebebef4cb16874dd18"
    "title": "Amazon SageMaker HyperPod now supports higher pod density on EKS-orchestrated clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-hyperpod-higher-pod-density/"
    "published": "2026-11-18 10:45:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon SageMaker HyperPod now supports higher pod density per node on EKS-orchestrated clusters, allowing you to get more out of every instance. This leaves more room for your applications alongside system DaemonSets for monitoring, logging, and security, and helps increase GPU, CPU and memory utilization on nodes, allowing you to run the same work using fewer instances.</p> \n<p>As you schedule more pods, the Amazon VPC CNI automatically adds network capacity to the node. Autoscaling with Karpenter also supports the higher pod capacity, so new nodes take on more pods as your cluster scales out.</p> \n<p>Here are a few examples of workloads that benefit from higher pod density:</p> \n<ul> \n <li><p>Model inference - Serve more model replicas or more models from each GPU instance, including on smaller types such as ml.g5 and ml.g6.</p> </li> \n <li><p>Interactive development - Host more notebooks, IDEs, and data science environments on each node.</p> </li> \n <li><p>GPU partitioning - Use all the Multi-Instance GPU (MIG) slices on instances such as ml.p5en.48xlarge, where each slice runs its own pod.</p> </li> \n <li><p>Operators and Controllers - Run operators, controllers, and observability agents on CPU nodes alongside your workloads, without crowding them out.</p> </li> \n</ul> \n<p>This feature is available for HyperPod EKS-orchestrated clusters in all AWS Regions where SageMaker HyperPod is available. To get started, update your cluster's IAM permissions, cluster software, and Amazon VPC CNI add-on. To learn more, please check the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-eks-dynamic-eni-attachment.html\">documentation</a>.</p>"
  "991ae786ab13d004e326d72610aa6713":
    "id": "991ae786ab13d004e326d72610aa6713"
    "title": "Amazon OpenSearch Ingestion Service now supports next-generation time series collections"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-ingestion-service-nextgen-time-series-collections"
    "published": "2026-11-18 03:20:00"
    "fetched": "2026-11-19 10:40:05"
    "summary": "<p>Amazon OpenSearch Ingestion service now supports time series collections in the next generation of Amazon OpenSearch Serverless as a pipeline destination. You can stream logs, metrics, traces and event data into time series collections with fully managed pipelines. You don't have to run your own collectors or write custom ingestion code.</p> \n<p>OpenSearch Ingestion delivers data from the sources you already use, including OpenTelemetry, Amazon S3, Amazon Kinesis Data Streams, Amazon MSK, Amazon DynamoDB, and HTTP endpoints. Before indexing, pipelines can filter, enrich, transform, and route data with built-in processors. For example, you can parse and normalize log fields, mask sensitive data, or split a stream into separate indexes. Pipelines scale automatically with your workload. Time series collections add a lower-cost warm storage tier and built-in alerting and anomaly detection. Together they give you an observability pipeline from collection to analysis with no clusters to manage.</p> \n<p>To get started, create a pipeline in the Amazon OpenSearch Service console, through the AWS CLI, or with AWS CloudFormation, and choose a time series collection as the sink. OpenSearch Ingestion is billed in Ingestion OpenSearch Compute Units (OCUs), separately from your collection. For details, see <a href=\"https://aws.amazon.com/opensearch-service/pricing/\">Amazon OpenSearch Service pricing</a>.</p> \n<p>This capability is available in all AWS Regions where both Amazon OpenSearch Ingestion and the next generation of Amazon OpenSearch Serverless are <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\">available</a>. To get started, create a pipeline in the Amazon OpenSearch Service console, through the AWS CLI, or with AWS CloudFormation, and choose a next-generation time series collection as the sink. To learn more, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ingestion.html\">Overview of Amazon OpenSearch Ingestion</a> in the Amazon OpenSearch Service Developer Guide.</p>"
"last_updated": "2026-11-19 10:40:05 JST"
