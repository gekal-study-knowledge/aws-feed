"overview": |
  この日は 8 ソースから 70 本で、セキュリティ速報 2 件と Corretto の重要なセキュリティパッチ、API Gateway の JWT オーソライザー、Bedrock AgentCore と SageMaker の機能追加、KMS を中心とした日本語ブログが目立ちました。セキュリティ速報 (いずれも 11 月 17 日 PST 公開) の CVE-2026-130621 は、AWS efs-utils (amazon-efs-utils) 3.3.5 より前のローカルポート選択における TOCTOU 競合状態で、共有ホストで EFS をマウントできるユーザーが同時にマウント操作を行うことで、同じホストにマウントされている別の Amazon EFS または S3 Files ファイルシステムを、そのマウントの IAM ID とアクセスポイントで読み書きできるおそれがあるものです (影響は amazon-efs-utils v3.3.5 未満と aws-efs-csi-driver v3.5.4 未満)。CVE-2026-130622 と CVE-2026-130623 は、AWS Private CA Connector for Kubernetes (aws-privateca-issuer) の認証情報の読み込みの認可不備で、名前空間スコープの issuer を作成できる認証済みユーザーが、別の名前空間の AWS Private CA と保存済み認証情報で署名された下位 CA 証明書を含む証明書を取得できるおそれがあるものです (影響は aws-privateca-issuer v1.12.0 未満と EKS アドオン v1.12.0-eksbuild.1 未満)。Amazon Corretto は 11 月 17 日に重要なセキュリティパッチ更新として 27.0.1.1.4、25.0.5.1.2、21.0.13.1.2、17.0.21.1.2、11.0.33.1.1、8u514 を公開しました。Amazon API Gateway の REST API はネイティブの JWT オーソライザーに対応し、OIDC 互換の ID プロバイダーのトークンを Lambda オーソライザーなしでゲートウェイ内で検証できるようになり、Compute Blog でも使い方が解説されました。ネットワークでは Amazon VPC のクロスリージョンピアリング、AWS Transit Gateway、AWS Cloud WAN のクロスリージョン通信に 99.999% の可用性 SLA が設けられ、Microsoft Azure との AWS Interconnect - multicloud が一般提供になりました。AI 関連では、Amazon Bedrock で OpenAI GPT-6.2 Astra と GPT-6.2 Sol が一般提供になり、AgentCore は Web Search Tool と Web Search API で月 5,000 回の無料ウェブ検索を提供し、AgentCore Memory が各セッションの完全な要約と最長 10 年 (従来 1 年) の短期メモリ保持に対応し、SageMaker は合成データ生成や自動ラベル付けなどの AI データ準備機能を、SageMaker HyperPod Inference は NVIDIA Dynamo による分散推論を導入しました。データ・コンピュートでは、ElastiCache Serverless for Valkey による DynamoDB キャッシュの一般提供、Amazon EMR 8.2 (Apache Spark 4.1.3、Iceberg 1.11.0) と EMR Serverless の Apache Spark 最適化エージェント、Aurora DSQL の SQL ステートメント統計の Database Insights 表示、Lambda Managed Instances のゼロへのスケール、ECR のプライベートレジストリ向けグローバル認証トークン、MSK の Standard / Express ブローカーでの Graviton4 ベース M8g インスタンス、EC2 C8gn のイスラエル (テルアビブ) と C8ine の欧州 (アイルランド) への展開、OpenSearch UI のアフリカ (ケープタウン) 提供 (25 リージョン目) が発表されました。運用・ガバナンスでは、AWS Config のマネージド適合パック、Security Hub がインストール済みソフトウェアと使用状況からリソースの重要度を推定する機能、Amazon WorkSpaces Advisor のパブリックプレビュー、WorkSpaces Personal の新しい Windows クライアント、WorkSpaces Applications のスマートカードリダイレクト、Amazon EVS の r7i.metal インスタンス対応、AWS Transform による MAP 案件の迅速化、Elemental Inference のカスタムモデル・プロンプト対応、WAF Bot Control の簡素化したオンボーディングとボット信頼度が発表されました。日本語ブログでは、KMS の対称キーの自動ローテーション間隔を 90〜2,560 日で設定できるようになったことの考察、新しい GetKeyLastUsage API による未使用キーの特定、マルチテナント SaaS での KMS データキーのキャッシュ、すべての EKS ポッド・ECS タスク・EC2 ワークロードをハードウェアで分離する Nitro Sandboxes、DynamoDB caching、SSM for SAP の SAP HANA スケールアウト対応、AWS for SAP MCP Server の新機能、Well-Architected Framework の更新が紹介されました。Machine Learning Blog では、共有プロンプトのプレフィックスをキャッシュして実効入力コストを約 50% 削減した ArisGlobal (NavaX)、AllCloud と Generative AI Innovation Center と組んだ LoanPro のローン管理向けマルチエージェントアシスタントの事例、エージェント型 AI に責任ある AI を組み込む 3 段階のロードマップ、AgentCore 上のエージェントを WhatsApp につなぐ SMART、Snowflake Cortex AI を呼ぶ際の OAuth パターン、AWS Agent Registry のカスタムメタデータスキーマ、SageMaker JumpStart の時系列言語モデル OpenTSLM、ルールはコード・判断はモデルに任せるコスト削減、AgentCore の JSON ワークロードのトークン削減、re:Invent 2026 での AWS Quick のガイドなどが公開されました。そのほか、Rakbank が Fluent Bit で 1 日約 150 GB を取り込む Amazon OpenSearch Service で集中オブザーバビリティを構築した事例、AgentCore Runtime を安全に公開する方法、マレーシア中央銀行 (BNM) 向けの RMiT ワークブックと ISO コンプライアンスガイド、4 大陸からの新しい AWS Heroes の紹介が公開されました。後から追加された発表として、AWS Control Tower がランディングゾーン内の既存の Amazon S3 バケットを AWS Config と AWS CloudTrail のログ保存先に使えるようになり、Amazon Cognito がアクセストークン・ID トークン・リフレッシュトークンに認証コンテキストクラス参照 (ACR) と認証方式参照 (AMR) のクレームを付与してアプリケーション側で認証レベルや方式を判断できるようにし、Amazon OpenSearch Serverless がインデックス時にコレクション内でドキュメントのクレンジング・エンリッチ・ベクトル化を行う取り込みパイプラインに対応しました。さらに後から、Amazon Aurora DSQL がクラスターで実行された SQL ステートメントを記録するデータベース内部の監査ログに対応し、Amazon ElastiCache for Valkey が自前でホストする LLM 推論のコストを最大 40% 削減し最初のトークンまでの時間を短縮するフルマネージドな分散 KV キャッシュを提供し、IAM account access manager は AWS マネージドポリシーで有効化・管理できるなど導入と利用が容易になりました。Amazon S3 レプリケーションは除外とマルチリージョンキーの解決によって少ないルールでレプリケーションを構成できるようになり、SageMaker HyperPod は EKS でオーケストレーションするクラスターでノードあたりの Pod 密度を高められるようになり、OpenSearch Ingestion は次世代 OpenSearch Serverless の時系列コレクションをパイプラインの送信先に使えるようになり、Amazon CloudWatch Network Monitoring はパフォーマンスモニターでワークロードが通る AWS ネットワーク経路の状態をほぼリアルタイムに監視できるようになりました。
