  "86f66920f3454cd324b37dd366a41aa0":
    "id": "86f66920f3454cd324b37dd366a41aa0"
    "title": "AWS Interconnect - last mile announces new metro in Northern Virginia, USA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/interconnect-last-mile-northern-virginia/"
    "published": "2026-11-06 06:30:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, AWS announced a new AWS Interconnect - last mile metro in Northern Virginia, USA. Northern Virginia joins New York as the second metro where you can connect your data center, branch office, or colocation facility to AWS.&nbsp;</p> \n<p>AWS Interconnect - last mile gives you managed, private, resilient connections to AWS, so you don't have to order cross-connects or configure routers. Every connection is provisioned by default across two physically diverse locations with four redundant links, providing maximum resilience out of the box and backed by a 99.99% availability SLA up to the Direct Connect port. Traffic between AWS and partner edge devices is encrypted with MACsec by default.</p> \n<p>Lumen customers anywhere in the continental United States can order generally available connections through the Northern Virginia metro to reach all public AWS Regions (except those in China) and AWS Local Zones. AWS Interconnect - last mile is also available in preview through Megaport and Equinix in the Northern Virginia metro. You can create connections using the AWS Management Console, AWS CLI, or AWS Interconnect API. For pricing, see <a href=\"https://aws.amazon.com/interconnect/lastmile/pricing/\">AWS Interconnect - last mile pricing</a>.</p>"
  "559ff0c2fffe12b65b8eb4e2127579b6":
    "id": "559ff0c2fffe12b65b8eb4e2127579b6"
    "title": "Announcing Web Answer on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/web-answer-amazon-bedrock/"
    "published": "2026-11-06 05:56:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, we are announcing the general availability of Web Answer on Amazon Bedrock AgentCore. Web Answer is a managed tool that returns a synthesized, grounded, cited answer to a natural-language question in a single call, so agent builders can attach it to an agent and get back a finished answer grounded in current web sources, without building and maintaining their own search, retrieve, synthesis, and citation pipeline.&nbsp;</p> \n<p>Web Answer builds on Web Search on Amazon Bedrock AgentCore, which launched in June, extending it from \"find the web content\" to \"return the finished answer,\" a capability customers have been asking for. With Web Answer, your agent sends a question and receives a synthesized cited answer in one tool call. Web Answer works like an agent; it plans its own searches, runs several in parallel, and decides when it has gathered enough evidence to answer. You stay in control of the boundaries, with domain include, deny lists and publish-date filters that scope where it looks. It attaches as a target on an AgentCore Gateway and is called over MCP, authenticated with IAM, with zero data egress.&nbsp;</p> \n<p>Web Answer is available in the US East (N. Virginia) Region, with per-tool call pricing.&nbsp;</p> \n<p>To learn more about Web Answer on Amazon Bedrock AgentCore, see Web Answer’s documentation <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-answer-tool.html\">page</a> and Web Answer’s <a href=\"http://aws.amazon.com/bedrock/grounding/web-answer/\">website</a>. For Region availability, see the AWS Region <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">table</a>.&nbsp;</p>"
  "9991fd1ff24c8efe5c396e14c7a2f8fb":
    "id": "9991fd1ff24c8efe5c396e14c7a2f8fb"
    "title": "Amazon DynamoDB now supports bulk put items"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-dynamodb-now-supports-bulk-put-items/"
    "published": "2026-11-06 03:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, AWS announces the general availability of bulk put items for Amazon DynamoDB, a fully managed feature that writes data from Amazon S3 into your existing DynamoDB tables. Many DynamoDB applications use data that other systems produce and store in Amazon S3. Writing this data into existing DynamoDB tables has typically meant building custom pipelines and managing table capacity. With bulk put items, developers and data engineers can write this data without impacting existing workloads or building a custom ingestion pipeline, in a cost-efficient way.</p> \n<p>You point bulk put items at the S3 location of your input files, and DynamoDB handles the rest. Each item supports its own condition expression, so you can enforce insert-only or version-guarded writes. The Standard tier fits most workloads, and the Accelerated tier is for more time-sensitive workloads. Common use cases include daily refreshes, large catalog enrichments, backfills, and migrations.</p> \n<p>Bulk put items with Standard tier is available in all commercial AWS Regions and the AWS GovCloud (US) Regions, to see the list where the Accelerated tier is available see the <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BulkPutItems.Tiers.html#BulkPutItems.Tiers.Accelerated\" target=\"_blank\">regional availability.</a> To learn more, visit the <a href=\"https://aws.amazon.com/blogs/database/introducing-bulk-put-items-for-amazon-dynamodb-load-data-from-amazon-s3-into-existing-tables-at-scale/\" target=\"_blank\">Introducing bulk put items for Amazon DynamoDB</a> blog and the <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BulkPutItems.HowItWorks.html\" target=\"_blank\">Amazon DynamoDB Developer Guide</a>.</p>"
  "433afaafdc8b0451ae00cbff5143ee6b":
    "id": "433afaafdc8b0451ae00cbff5143ee6b"
    "title": "Amazon Cognito announces 99.99% Service Level Agreement for the Plus feature plan"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cognito-sla-update/"
    "published": "2026-11-06 03:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Starting November 1, 2026, the Amazon Cognito Service Level Agreement (SLA) commits to a Monthly Uptime Percentage of 99.99% for user pools on the Plus feature plan, up from 99.9%. User pools already on Plus are automatically covered by the new Service Commitment. User pools on Essentials and Lite stay at the 99.9% Service Commitment with no change to their terms.</p> \n<p>To qualify for the 99.99% Service Commitment, you can switch a user pool to the Plus feature plan using the AWS Management Console, AWS Command Line Interface (CLI), or AWS Software Development Kits (SDKs). The Plus feature plan also includes threat protection features such as adaptive authentication, compromised credentials detection, and threat and user activity logging and export.</p> \n<p>For full terms and exclusions, see the <a href=\"https://aws.amazon.com/cognito/sla/\">Amazon Cognito SLA</a>.&nbsp;To learn more about feature plans, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-sign-in-feature-plans.html\">user pool feature plans</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "a22e6c7c276e0ecb0d76d93601a2a4e9":
    "id": "a22e6c7c276e0ecb0d76d93601a2a4e9"
    "title": "IAM Roles Anywhere now supports automatic certificate revocation checking"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-roles-anywhere-cdp/"
    "published": "2026-11-06 02:38:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/roles-anywhere\">AWS Identity and Access Management (IAM) Roles Anywhere</a> now supports automatic revocation checking using certificate revocation list (CRL) distribution points (CDPs). This helps keep revocation checks in sync with your certificate authority (CA) and can help improve your security posture. When you enable this capability on a trust anchor, IAM Roles Anywhere reads the CDP URLs embedded in authenticating certificates, downloads the corresponding CRLs, and denies credential requests that use revoked certificates.</p> \n<p>Previously, to check revocation status, you had to import CRLs into IAM Roles Anywhere and re-import them each time your CA published an update, which added operational overhead. With this launch, IAM Roles Anywhere downloads CRLs from your CDPs and refreshes them periodically, so you no longer need to re-import them. You can use this capability with <a href=\"https://aws.amazon.com/private-ca/\">AWS Private Certificate Authority</a> or your own public key infrastructure (PKI), provided your certificates include publicly accessible CDP URLs that meet the <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html#crl-distribution-point-revocation\">distribution point requirements</a>. To enable it on a trust anchor, use the IAM Roles Anywhere console, AWS SDKs, or AWS CLI.</p> \n<p>This feature is available at no additional cost in all commercial AWS Regions. To learn more, see <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html#crl-distribution-point-revocation\">Automatic revocation checking with CRL distribution points</a> in the IAM Roles Anywhere User Guide.</p>"
