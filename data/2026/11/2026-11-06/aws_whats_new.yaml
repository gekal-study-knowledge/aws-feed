  "86f66920f3454cd324b37dd366a41aa0":
    "id": "86f66920f3454cd324b37dd366a41aa0"
    "title": "AWS Interconnect - last mile announces new metro in Northern Virginia, USA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/interconnect-last-mile-northern-virginia/"
    "published": "2026-11-06 06:30:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, AWS announced a new AWS Interconnect - last mile metro in Northern Virginia, USA. Northern Virginia joins New York as the second metro where you can connect your data center, branch office, or colocation facility to AWS.&nbsp;</p> \n<p>AWS Interconnect - last mile gives you managed, private, resilient connections to AWS, so you don't have to order cross-connects or configure routers. Every connection is provisioned by default across two physically diverse locations with four redundant links, providing maximum resilience out of the box and backed by a 99.99% availability SLA up to the Direct Connect port. Traffic between AWS and partner edge devices is encrypted with MACsec by default.</p> \n<p>Lumen customers anywhere in the continental United States can order generally available connections through the Northern Virginia metro to reach all public AWS Regions (except those in China) and AWS Local Zones. AWS Interconnect - last mile is also available in preview through Megaport and Equinix in the Northern Virginia metro. You can create connections using the AWS Management Console, AWS CLI, or AWS Interconnect API. For pricing, see <a href=\"https://aws.amazon.com/interconnect/lastmile/pricing/\">AWS Interconnect - last mile pricing</a>.</p>"
  "559ff0c2fffe12b65b8eb4e2127579b6":
    "id": "559ff0c2fffe12b65b8eb4e2127579b6"
    "title": "Announcing Web Answer on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/web-answer-amazon-bedrock/"
    "published": "2026-11-06 05:56:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, we are announcing the general availability of Web Answer on Amazon Bedrock AgentCore. Web Answer is a managed tool that returns a synthesized, grounded, cited answer to a natural-language question in a single call, so agent builders can attach it to an agent and get back a finished answer grounded in current web sources, without building and maintaining their own search, retrieve, synthesis, and citation pipeline.&nbsp;</p> \n<p>Web Answer builds on Web Search on Amazon Bedrock AgentCore, which launched in June, extending it from \"find the web content\" to \"return the finished answer,\" a capability customers have been asking for. With Web Answer, your agent sends a question and receives a synthesized cited answer in one tool call. Web Answer works like an agent; it plans its own searches, runs several in parallel, and decides when it has gathered enough evidence to answer. You stay in control of the boundaries, with domain include, deny lists and publish-date filters that scope where it looks. It attaches as a target on an AgentCore Gateway and is called over MCP, authenticated with IAM, with zero data egress.&nbsp;</p> \n<p>Web Answer is available in the US East (N. Virginia) Region, with per-tool call pricing.&nbsp;</p> \n<p>To learn more about Web Answer on Amazon Bedrock AgentCore, see Web Answer’s documentation <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-answer-tool.html\">page</a> and Web Answer’s <a href=\"http://aws.amazon.com/bedrock/grounding/web-answer/\">website</a>. For Region availability, see the AWS Region <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">table</a>.&nbsp;</p>"
  "9991fd1ff24c8efe5c396e14c7a2f8fb":
    "id": "9991fd1ff24c8efe5c396e14c7a2f8fb"
    "title": "Amazon DynamoDB now supports bulk put items"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-dynamodb-now-supports-bulk-put-items/"
    "published": "2026-11-06 03:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Today, AWS announces the general availability of bulk put items for Amazon DynamoDB, a fully managed feature that writes data from Amazon S3 into your existing DynamoDB tables. Many DynamoDB applications use data that other systems produce and store in Amazon S3. Writing this data into existing DynamoDB tables has typically meant building custom pipelines and managing table capacity. With bulk put items, developers and data engineers can write this data without impacting existing workloads or building a custom ingestion pipeline, in a cost-efficient way.</p> \n<p>You point bulk put items at the S3 location of your input files, and DynamoDB handles the rest. Each item supports its own condition expression, so you can enforce insert-only or version-guarded writes. The Standard tier fits most workloads, and the Accelerated tier is for more time-sensitive workloads. Common use cases include daily refreshes, large catalog enrichments, backfills, and migrations.</p> \n<p>Bulk put items with Standard tier is available in all commercial AWS Regions and the AWS GovCloud (US) Regions, to see the list where the Accelerated tier is available see the <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BulkPutItems.Tiers.html#BulkPutItems.Tiers.Accelerated\" target=\"_blank\">regional availability.</a> To learn more, visit the <a href=\"https://aws.amazon.com/blogs/database/introducing-bulk-put-items-for-amazon-dynamodb-load-data-from-amazon-s3-into-existing-tables-at-scale/\" target=\"_blank\">Introducing bulk put items for Amazon DynamoDB</a> blog and the <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BulkPutItems.HowItWorks.html\" target=\"_blank\">Amazon DynamoDB Developer Guide</a>.</p>"
  "433afaafdc8b0451ae00cbff5143ee6b":
    "id": "433afaafdc8b0451ae00cbff5143ee6b"
    "title": "Amazon Cognito announces 99.99% Service Level Agreement for the Plus feature plan"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cognito-sla-update/"
    "published": "2026-11-06 03:00:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p>Starting November 1, 2026, the Amazon Cognito Service Level Agreement (SLA) commits to a Monthly Uptime Percentage of 99.99% for user pools on the Plus feature plan, up from 99.9%. User pools already on Plus are automatically covered by the new Service Commitment. User pools on Essentials and Lite stay at the 99.9% Service Commitment with no change to their terms.</p> \n<p>To qualify for the 99.99% Service Commitment, you can switch a user pool to the Plus feature plan using the AWS Management Console, AWS Command Line Interface (CLI), or AWS Software Development Kits (SDKs). The Plus feature plan also includes threat protection features such as adaptive authentication, compromised credentials detection, and threat and user activity logging and export.</p> \n<p>For full terms and exclusions, see the <a href=\"https://aws.amazon.com/cognito/sla/\">Amazon Cognito SLA</a>.&nbsp;To learn more about feature plans, see <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-sign-in-feature-plans.html\">user pool feature plans</a>.&nbsp;&nbsp;&nbsp;&nbsp;</p>"
  "a22e6c7c276e0ecb0d76d93601a2a4e9":
    "id": "a22e6c7c276e0ecb0d76d93601a2a4e9"
    "title": "IAM Roles Anywhere now supports automatic certificate revocation checking"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/iam-roles-anywhere-cdp/"
    "published": "2026-11-06 02:38:00"
    "fetched": "2026-11-06 07:29:42"
    "summary": "<p><a href=\"https://aws.amazon.com/iam/roles-anywhere\">AWS Identity and Access Management (IAM) Roles Anywhere</a> now supports automatic revocation checking using certificate revocation list (CRL) distribution points (CDPs). This helps keep revocation checks in sync with your certificate authority (CA) and can help improve your security posture. When you enable this capability on a trust anchor, IAM Roles Anywhere reads the CDP URLs embedded in authenticating certificates, downloads the corresponding CRLs, and denies credential requests that use revoked certificates.</p> \n<p>Previously, to check revocation status, you had to import CRLs into IAM Roles Anywhere and re-import them each time your CA published an update, which added operational overhead. With this launch, IAM Roles Anywhere downloads CRLs from your CDPs and refreshes them periodically, so you no longer need to re-import them. You can use this capability with <a href=\"https://aws.amazon.com/private-ca/\">AWS Private Certificate Authority</a> or your own public key infrastructure (PKI), provided your certificates include publicly accessible CDP URLs that meet the <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html#crl-distribution-point-revocation\">distribution point requirements</a>. To enable it on a trust anchor, use the IAM Roles Anywhere console, AWS SDKs, or AWS CLI.</p> \n<p>This feature is available at no additional cost in all commercial AWS Regions. To learn more, see <a href=\"https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html#crl-distribution-point-revocation\">Automatic revocation checking with CRL distribution points</a> in the IAM Roles Anywhere User Guide.</p>"
  "d2300da71ef3f9659a6348b6576c23be":
    "id": "d2300da71ef3f9659a6348b6576c23be"
    "title": "AWS Security Hub now provides an SBOM inventory for your compute resources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/security-hub-sbom-inventory/"
    "published": "2026-11-06 09:30:00"
    "fetched": "2026-11-06 12:04:48"
    "summary": "<p>Today, AWS announces that AWS Security Hub now provides a Software Bill of Materials (SBOM) inventory, giving central security teams a continuously updated, organization-wide view of the software packages and applications installed on their compute resources.</p> \n<p>Security Hub builds the inventory from the SBOMs that Amazon Inspector generates for Amazon EC2 instances, Amazon ECR container images, and AWS Lambda functions, with no additional configuration. The SBOM page lists each package with its version, type, and the number of resources where it is installed. You can filter and group the list by package attributes, account, and region. On the resource detail page, the Installed software tab lists every package on that resource, so you can judge its function and criticality while triaging any finding. You can also query the inventory through the Security Hub API.</p> \n<p>The SBOM inventory is included with Security Hub Essentials at no additional cost. It requires no new enablement and populates automatically where Amazon Inspector is enabled. It is available in all AWS Regions where Security Hub is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>.</p>"
  "2b65460d8399adca3921636368313a34":
    "id": "2b65460d8399adca3921636368313a34"
    "title": "AWS Network Load Balancer is now available in the AWS Phoenix Local Zone"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-nlb-available-phx-local-zone/"
    "published": "2026-11-06 05:00:00"
    "fetched": "2026-11-06 12:04:48"
    "summary": "<p>AWS Network Load Balancer is now available in the Phoenix Local Zone (us-west-2-phx-2a). AWS Local Zones is a type of AWS infrastructure deployment that places AWS compute, storage, database, and other select services closer to large population, industry, and IT centers where no AWS Region exists today.</p> \n<p>With this launch, you can create an AWS Network Load Balancer directly in the Phoenix Local Zone. Previously, if your targets ran in the Phoenix Local Zone, you had to place the load balancer in an Availability Zone in the parent Region, so connections and their traffic had to travel to the parent Region and back. This added latency and routed traffic outside the zone where your application runs. Now, connection routing stays local to your targets, delivering lower and more consistent latency to end users in the Phoenix metro area and keeping traffic within the Local Zone. This is especially valuable for latency-sensitive workloads such as real-time gaming, media streaming, and live financial applications serving users in the region.</p> \n<p>To learn more about Network Load Balancer, visit the <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">documentation</a>. For more information on AWS Local Zones, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones website</a>. The <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/locations/\">Locations webpage</a> lists the available and announced Local Zones. You can enable AWS Local Zones from the <a href=\"https://us-east-1.console.aws.amazon.com/awsglobalview/home#RegionsAndZones:tabId=lz\">Local Zones </a>tab in the AWS Global View console, or the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyAvailabilityZoneGroup.html\">ModifyAvailabilityZoneGroup</a> API.</p>"
  "1045223b6e62918b9237f2f759cd0a40":
    "id": "1045223b6e62918b9237f2f759cd0a40"
    "title": "Amazon OpenSearch Service optimized engine now supports agent traces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-opensearch-service-support-traces"
    "published": "2026-11-06 02:00:00"
    "fetched": "2026-11-06 12:04:48"
    "summary": "<p>Today, the Amazon OpenSearch Service optimized engine adds support for agent traces, including OpenTelemetry traces. Your traces and logs now live in the same place. You can follow a request or an agent session from start to finish, find the step that failed or slowed down, and check the related logs without switching tools.&nbsp;</p> \n<p>The optimized engine maps OpenTelemetry logs and traces to object, nested, and flat object fields, with support for multi-valued arrays. Span events, span links, prompts, and tool calls retain their nested structure, allowing field-level queries without flattening data during ingestion.</p> \n<p>On hot-tier data, the engine supports update, delete, and upsert operations by document ID.&nbsp;When data arrives late or with errors, you can correct it in place, so your dashboards and alerts work from accurate data. In OpenSearch UI, you can analyze this data with Discover Traces, application performance monitoring, the service map, and the agent traces and sessions views.</p> \n<p>These features are available on OpenSearch 3.7, at no additional charge in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), Europe (London), and Europe (Spain).&nbsp;&nbsp;To get started, send OpenTelemetry data to your domain, for example by using Amazon OpenSearch Ingestion. To learn more, see the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/optimized-log-analytics.html\">documentation</a>.</p>"
  "2d2874280efccdf3f477160784931919":
    "id": "2d2874280efccdf3f477160784931919"
    "title": "Amazon FSx for Lustre delivers 16x higher metadata IOPS on Intelligent-Tiering file systems"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-fsx-for-lustre-intelligent-tiering-16x-higher-metadata-iops"
    "published": "2026-11-06 00:39:00"
    "fetched": "2026-11-06 12:04:48"
    "summary": "<p><a></a><a href=\"https://aws.amazon.com/fsx/lustre/\">Amazon FSx for Lustre</a> now supports up to 192,000 metadata I/O operations per second (IOPS) on file systems that use the Intelligent-Tiering storage class, 16x higher than the previous maximum of 12,000 IOPS.</p> \n<p>The FSx for Lustre Intelligent-Tiering storage class delivers the lowest-cost and only fully elastic Lustre file storage in the cloud. It is optimized for workloads that mix hot and cold data and do not require consistent SSD-level performance. A file system's metadata IOPS determine how many files and directories you can create, list, read, and delete per second. Today's launch allows you to scale to even higher levels of performance, accelerate time-to-results, and optimize your storage costs for metadata-intensive machine learning research and high-performance computing (HPC) workloads.</p> \n<p>Higher metadata IOPS are available on new FSx for Lustre Intelligent-Tiering file systems in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where the Intelligent-Tiering storage class is available. For more information about the file system metadata performance, see the Amazon FSx for Lustre <a href=\"https://docs.aws.amazon.com/fsx/latest/LustreGuide/performance.html#dne-metadata-performance\">User Guide</a>.</p>"
  "802ffbf58b1f74c602abb7424466cb43":
    "id": "802ffbf58b1f74c602abb7424466cb43"
    "title": "Capacity Reservation Resource Groups now support Amazon EC2 Capacity Blocks and interruptible Capacity Reservations in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/capacity-reservation-resource-groups-support-in-aws-govcloud-regions"
    "published": "2026-11-06 23:00:00"
    "fetched": "2026-11-07 03:49:32"
    "summary": "<p>Starting today, you can add Amazon EC2 Capacity Blocks for ML and interruptible Capacity Reservations to Capacity Reservation Resource Groups in AWS GovCloud (US) Regions. Amazon EC2 offers different reservation offerings such as On-Demand Capacity Reservations (ODCRs), interruptible Capacity Reservations, and Capacity Blocks for ML. Previously, a Capacity Reservation Resource Group could only include ODCRs. Now you can add any type of Capacity Reservation to a Capacity Reservation Resource Group, making it easier to launch EC2 instances across your entire portfolio of reserved capacity.</p> \n<p>To use this feature, create a Capacity Reservation Resource Group, add any Capacity Reservation to it, and then target the group in your launch request. When using EC2 Fleet and EC2 Auto Scaling groups, you can also specify your prioritization preferences across reservation types, and configure automatic fall back to EC2 On-Demand capacity when there is no capacity remaining across your reservations.</p> \n<p>There are no additional charges for using this feature. With the addition of AWS GovCloud (US) Regions, this feature is now available in all AWS Regions where Capacity Blocks for ML and interruptible ODCRs are supported, excluding China Regions. To get started, see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-cr-group.html\">Capacity Reservation Resource Groups</a> and the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html\">Capacity Reservations user guide</a>.</p>"
  "9eb4b12d2f91fc02a6ee9cf2f3995d47":
    "id": "9eb4b12d2f91fc02a6ee9cf2f3995d47"
    "title": "Amazon Simple Email Service is now available in six new AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-simple-email-service-new-aws-regions/"
    "published": "2026-11-06 17:00:00"
    "fetched": "2026-11-07 03:49:32"
    "summary": "<p><a href=\"https://aws.amazon.com/ses/\">Amazon Simple Email Service (Amazon SES)&nbsp;</a> is now available in the Asia Pacific (New Zealand, Melbourne, Taipei, Thailand), Mexico (Central), EU (Spain). Customers can now use these new Regions to leverage Amazon SES to send emails and, if needed, to help manage data requirements.</p> \n<p>Amazon SES is a scalable, cost-effective, and flexible cloud-based email service that allows digital marketers and application developers to send marketing, notification, and transactional emails from within any application. To learn more about Amazon SES, visit this&nbsp;<a href=\"https://aws.amazon.com/ses/\">page&nbsp;</a>.</p> \n<p>With this launch, Amazon SES is available in 35 AWS Regions globally: US East (N. Virginia, Ohio), US West (N. California, Oregon), AWS GovCloud (US-West, US-East), Asia Pacific (Osaka, Mumbai, Hyderabad, Sydney, Singapore, Seoul, Tokyo, Jakarta, Malaysia, New Zealand, Melbourne, Taipei, Thailand), Canada (Central, Calgary), EU (Ireland, Frankfurt, London, Paris, Stockholm, Milan, Zurich,Spain), Middle East (Bahrain, UAE), Israel (Tel Aviv), South America (Sao Paulo), Mexico (Central) and Africa (Cape Town).</p> \n<p>For a complete list of all of the regional endpoints for Amazon SES, see &nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/ses.html\">AWS Service Endpoints&nbsp;</a> in the AWS General Reference.</p>"
  "0d584480c5a91f840886f7a7dc4f05fd":
    "id": "0d584480c5a91f840886f7a7dc4f05fd"
    "title": "AWS Glue Data Catalog now supports catalog-vended credentials with Apache Iceberg REST catalog federation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/11/glue-catalog-vended-credentials-iceberg/"
    "published": "2026-11-06 17:00:00"
    "fetched": "2026-11-07 03:49:32"
    "summary": "<p>AWS Glue Data Catalog now supports external catalog's vended credentials in Apache Iceberg REST catalog federation. You can now read external Iceberg tables from Amazon Athena, Amazon EMR, Amazon Redshift, and AWS Glue using coarse-grained table grants in your external Iceberg catalog.</p> \n<p>Glue Data Catalog already federates to external Iceberg REST catalogs through an AWS IAM role that you configure with access to your Amazon S3 buckets. This enhancement in Glue Data Catalog provides another way to connect to an external Iceberg catalog and read only the tables that the external catalog authorizes. It uses temporary security credentials that are scoped to the Amazon S3 storage prefix and vended by your external Iceberg catalog. AWS Lake Formation manages access control when you query an external table using any AWS analytics engine, letting you restrict access further down to specific rows and columns and share external Iceberg tables across AWS accounts.</p> \n<p>This feature is available through the AWS Lake Formation Management Console, AWS CLI, and the AWS Glue and Lake Formation SDKs. This feature is available in all commercial AWS Regions where Glue and Lake Formation are supported. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lake-formation/latest/dg/catalog-federation.html\">documentation</a>.</p>"
"last_updated": "2026-11-07 03:49:32 JST"
