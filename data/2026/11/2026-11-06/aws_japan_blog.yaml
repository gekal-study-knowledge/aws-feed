    "title": "Kiro Crew の Bot のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/crew-bots/"
    "published": "2026-11-06 08:31:49"
    "fetched": "2026-11-06 12:04:49"
    "summary": "2026 年 11 月 5 日、Kiro Crew で Kiro の Bot の一般提供が始まりました。Bot は、エージェントによる作業を組み立てて進めるための新しい方法です。ばらばらのセッションで作業する代わりに、作業の特定の部分を受け持つエージェントを Bot として定義し、カスタマイズします。Bot はそれぞれ名前を持ち、長く動き続けます。Bot は自分のメモリを持ち、自分でセッションを動かすので、あなたがセッションを 1 つずつ追いかける必要はなくなります。Kiro Crew はもともと、あなたの仕事の進め方から学習します。Bot によって、その学習が蓄積される場所が変わります。"
"last_updated": "2026-11-06 12:04:49 JST"
