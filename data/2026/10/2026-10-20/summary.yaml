"overview": |
  この日は 22 件で、生成 AI アプリケーションのネットワークセキュリティ、推論基盤の KV キャッシュ最適化、Claude モデルの構造化出力に加えて、ID 管理とデータ連携、パートナー向け機能の更新が中心でした。日本のブログではネットワークセキュリティの記事が 4 本公開されました。生成 AI アプリケーションが DDoS 攻撃・SQL インジェクション・悪意のあるボットなど外部脅威にさらされることを踏まえ、AWS PrivateLink による Amazon Bedrock へのプライベート接続、AWS WAF と AWS Shield によるエッジでの保護、AWS Network Firewall による境界防御、Amazon GuardDuty による検知を組み合わせたセキュアなネットワークアーキテクチャが示されました。データ流出の防止については、見落とされがちなアウトバウンドトラフィックを悪用した流出を防ぐ多層的なエグレス制御として、ハブアンドスポーク型アーキテクチャを基盤に AWS Network Firewall と Amazon Route 53 Resolver DNS Firewall で予防的コントロールを構成し、さらに SCP・RCP・VPC エンドポイントを重ねる方法が解説されています。AWS Network Firewall のアクティブ脅威防御も紹介されました。潜在的な問題を抱えるワークロードは 90 秒以内に脅威アクターに発見されるという前提のもと、Amazon のハニーポットネットワーク MadPot の脅威インテリジェンスを活用し、30 分以内に保護ルールを自動でデプロイして DNS・HTTP・TLS SNI・IP を見ます。あわせて、脅威アクターがダングリング DNS レコードを悪用してトラフィックを攻撃者が管理するリソースへリダイレクトするサブドメイン乗っ取りの仕組みと対策も公開され、S3・CloudFront・Elastic Beanstalk といった対象になり得るリソースの整理と、AWS Config カスタムルールによるプロアクティブな検出が示されています。モデルでは、Amazon Bedrock が bedrock-runtime と bedrock-mantle の両エンドポイントで、すべての Anthropic Claude モデルについて構造化出力に対応しました。定義した構造に準拠するスキーマ適合の JSON を受け取れます。あわせて TwelveLabs の Pegasus 1.5 が Amazon Bedrock で利用可能になりました。長尺の動画を構造化されたタイムスタンプ付きのメタデータに変換する動画言語モデルで、重要な場面を定義すると該当するすべての区間が得られます。推論基盤では、vLLM の KV キャッシュ転送に関する記事が 2 本公開されました。1 本はマルチターンのエージェント型ワークロードが毎ターン増えていく会話コンテキストを再処理してレイテンシーが上がる問題に対し、双方向の KV キャッシュ転送によって prefill ノードと decode ノードが以前に計算したコンテキストを再利用して TTFT を改善する手法、もう 1 本は vLLM の prefill-decode 分離において必要になるエンジンインスタンス間の KV キャッシュ転送について、転送の調整をプッシュ型にする NIXL コネクタで TTFT と TPOT を改善する手法です。あわせて、Deepgram が AWS Forward Deployed Engineering チームと協力して音声認識モデル Nova-3 をオフラインのバッチ推論向けに AWS Trainium2 へ移植した事例 (AWS Neuron スタックへの移植とカーネルの最適化) が公開されました。Amazon SageMaker JumpStart については、2026 年の第 1〜3 四半期で 30 のプロバイダーから 100 を超える新しいモデルを追加したことを振り返る記事と、新規の Amazon SageMaker AI の利用者が Amazon・Apple・GitHub・Google など既に持つ ID でサインアップして、わずかな手順で構成済みの SageMaker Studio 環境に入れるようになったことが紹介されています。サービス更新では、Amazon GuardDuty の Runtime Monitoring に任意の脅威検知ルールが追加され、プロセス・ファイル・ネットワークの活動から疑わしい挙動を検出する 50 以上のルールを有効化できるようになりました。EC2 Image Builder は Auto Scaling Group (ASG) の既存インスタンスをイメージのビルドに使えるようになり、新しいインスタンスの起動とブートストラップにかかる時間をなくしてビルドを高速化します。Amazon CloudWatch Omni が 8 つのリージョンで追加提供となり、Amazon Connect Customer Global Resiliency は管理サイトに Global Resiliency ページを追加して、リンクされたリージョン間のリージョン切り替え準備状況を 1 箇所で確認できるようになりました。日本のブログでは、日本電気株式会社 (NEC) が Anthropic Japan の協力のもと、約 3 万人の AI ネイティブエンジニア体制を目指して Claude Code を全社展開している取り組みが、CoE とチャンピオン制度を軸に紹介されました。ニュースブログでは、AWS Lambda Web Functions や Amazon S3 の Vercel Marketplace 対応などを扱う週刊まとめ (2026 年 10 月 19 日) が公開されています。ID 管理では、AWS IAM Identity Center が ID ソースを Active Directory から外部 ID プロバイダー (Okta や Microsoft Entra ID など) や Identity Center ディレクトリへ変更する際に、ユーザー、グループ、グループメンバーシップ、許可セットの割り当て、アプリケーションの割り当てをそのまま保持するようになりました。従来はこの変更のたびに作り直す必要がありました。データ連携では、AWS Clean Rooms が Databricks をデータソースとしてサポートしました。Delta Sharing で共有された Databricks のテーブルをコラボレーション内から直接クエリでき、元データを移動したり開示したりせずに分析できます。従来は Amazon S3 へエクスポートまたは複製する必要があり、パイプラインの手間とガバナンス対象のコピーが増えていました。Databricks は AWS Glue、Snowflake、Amazon Athena に続く対応データソースです。移行支援では、AWS Transform for migrations が既存環境へのランディングゾーン構築で対応範囲を広げ、AWS Control Tower のランディングゾーンや AWS Organizations で構築したランディングゾーンも扱えるようになりました。現状の環境を AWS のベストプラクティスと比べる基盤ギャップ分析を行い、移行先アカウントに既にあるものの上にランディングゾーンを拡張します。あわせて Infrastructure as Code のみのモードも追加されました。パートナー向けには AWS Partner Central に Program Navigator が追加され、AWS スペシャライゼーションプログラムの発見・申請・追跡を一か所で行えるようになりました。Case Study Generator も新設され、AI の支援で直接作る、既存の顧客事例の URL から取り込む、商談から自動入力するの 3 つの出発点が選べます。スペシャライゼーションの審査も簡素化されています。
