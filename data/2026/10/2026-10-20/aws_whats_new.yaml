"entries":
  "2da13b9e1eafd319e014ee4567905277":
    "id": "2da13b9e1eafd319e014ee4567905277"
    "title": "Amazon GuardDuty adds optional threat detection rules for Runtime Monitoring"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/guardduty-runtime-optional-detection-rules/"
    "published": "2026-10-20 01:01:00"
    "fetched": "2026-10-20 03:37:06"
    "summary": "<p>Amazon GuardDuty now supports optional detection rules for Runtime Monitoring. You can enable more than 50 Runtime Monitoring rules that help detect process, file, and network activity that might be routine in one environment but a sign of compromise in another, such as modifying sudoers files or disabling audit logging.</p>\n<p>The new rules provide detections for Amazon EC2 instances, Amazon EKS, and Amazon ECS on both EC2 and AWS Fargate, and span 13 finding types mapped to MITRE ATT&amp;CK® tactics including persistence, privilege escalation, execution, defense evasion, discovery, exfiltration, and command and control. This release introduces four new finding types: CommandAndControl:Runtime/SuspiciousCommand, CredentialAccess:Runtime/SensitiveFileRead, Discovery:Runtime/SensitiveFileRead, and Exfiltration:Runtime/SuspiciousCommand.</p>\n<p>To get started, visit the GuardDuty console. You can enable rules in dry-run mode to evaluate detection efficacy before enabling live detection.</p>\n<p>Custom Detection Rules for Runtime Monitoring is available in all AWS commercial Regions and the AWS GovCloud (US) Regions. To learn more, see <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/custom-detection-rules.html\">Amazon GuardDuty Custom Detection Rules</a>. To receive programmatic updates on new Amazon GuardDuty features and threat detections, subscribe to the <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_sns.html\">Amazon GuardDuty SNS topic</a>.</p>"
  "90ad38268f679faa866948b3d94be589":
    "id": "90ad38268f679faa866948b3d94be589"
    "title": "Amazon Connect Customer Global Resiliency now provides business users visibility into resiliency readiness across linked Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-connect-global-resiliency-readiness-overview"
    "published": "2026-10-20 06:45:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>Amazon Connect Customer Global Resiliency now provides a Global Resiliency page in the admin website, giving administrators a single place to review their Region switch readiness. The page shows an overall readiness status and lists the resources that Global Resiliency natively replicates, including which resource types are in sync, which are still pending synchronization, and which need action. For example, if a phone number or user is not associated with a traffic distribution group, the page flags it and lets the administrator associate the affected resources directly from the page. With this readiness overview, administrators can review their resiliency posture at any time and verify that their instance is ready for a Region switch.</p>\n<p>This feature is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/get-started-connect-global-resiliency.html\">Amazon Connect Customer Global Resiliency is supported</a>. To learn more, see <a href=\"https://aws.amazon.com/products/connect/customer\">Amazon Connect Customer</a> admin guide.</p>"
  "22b170cf9906cf046535dd12255bde60":
    "id": "22b170cf9906cf046535dd12255bde60"
    "title": "Amazon CloudWatch Omni is now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-cloudwatch-omni-8-regions/"
    "published": "2026-10-20 04:10:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>AWS announces that Amazon CloudWatch Omni is now available in eight additional AWS Regions. CloudWatch Omni is an AI-powered observability experience, organized around your teams and the applications they run, that helps you observe and troubleshoot your applications and agents in one place. It combines the interoperability of OpenTelemetry with the scale and reliability of CloudWatch, and meets you where you work — a standalone web experience with single sign-on (SSO), or a local IDE extension.</p>\n<p>With CloudWatch Omni, You create spaces in your central accounts to see telemetry across your AWS accounts, Regions, and other clouds, including Azure and GCP. Omni discovers services, maps dependencies, and surfaces golden metrics automatically and you can interact with telemetry through chat, point-and-click, or your own tool via Agent Toolkit for AWS to find signals, build dynamic views, and reach root cause powered by AWS DevOps Agent. A dedicated agent observability experience adds an evaluation-driven workflow for frameworks including LangGraph, CrewAI, OpenAI Agents SDK, Vercel AI SDK, and Strands.</p>\n<p>With this expansion, CloudWatch Omni is now available in Canada (Central), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London), and South America (São Paulo), in addition to US East (N. Virginia), US West (Oregon), and Europe (Ireland).</p>\n<p>To get started, create your Omni space from the CloudWatch console, configure SSO, and sign in. Agent developers can install the free <a href=\"https://marketplace.visualstudio.com/items?itemName=AmazonWebServices.amazon-cloudwatch-omni\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Omni extension for VS Code</a>, Cursor, and Kiro. To learn more, see the <a href=\"https://aws.amazon.com/cloudwatch/omni/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch Omni product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-omni.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>. For pricing, see the <a href=\"https://aws.amazon.com/cloudwatch/omni/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Omni pricing page.</a></p>"
  "907c5840627e6181bffa818d9025619a":
    "id": "907c5840627e6181bffa818d9025619a"
    "title": "EC2 Image Builder now integrates with ASG for faster image builds"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/ec2-image-builder-asg-faster-builds/"
    "published": "2026-10-20 02:30:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>EC2 Image Builder now supports using existing instances from an Auto Scaling Group (ASG) for building images, enabling faster builds by eliminating the time spent in launching and bootstrapping new instances and reusing already running EC2 instances.</p>\n<p>With this feature, you can provide an ASG in your Image Builder infrastructure configuration. Instead of launching a new instance at the build time, Image Builder selects an already-running instance from this ASG, applies your build components, and creates the image. The ASG continuously replenishes the pool as instances are used for builds, ensuring instances are always available for subsequent pipeline runs.</p>\n<p>This feature is fully opt-in and does not affect existing pipelines. Pipelines without an ASG configured continue to use the default launch path with no behavior change.</p>\n<p>This feature is available in all AWS Regions at no additional cost. To configure ASG integration in your Image Builder pipelines, see the <a href=\"https://docs.aws.amazon.com/imagebuilder/latest/userguide/infra-config-parent-instance.html\">EC2 Image Builder documentation</a>.</p>"
  "d0bd1b7bf28c30647887b8792e247881":
    "id": "d0bd1b7bf28c30647887b8792e247881"
    "title": "AWS IAM Identity Center simplifies identity source changes from Active Directory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/iam-identity-center-chg-id-src-from-ad/"
    "published": "2026-10-20 17:00:00"
    "fetched": "2026-10-21 03:17:01"
    "summary": "<p>AWS IAM Identity Center now retains your workforce identities and their assignments when you change your identity source from Active Directory to an external identity provider (IdP), such as Okta or Microsoft Entra ID, or to the Identity Center directory. Specifically, it preserves your users, groups, group memberships, permission set assignments, and application assignments. Previously, this change required you to recreate them in IAM Identity Center.</p>\n<p>IAM Identity Center helps you connect your workforce identities to AWS once and manage their access centrally across AWS applications and accounts. When you change your identity source from Active Directory, your existing identity store remains in place, so your users and groups keep the same IDs. As a result, users retain their access to AWS accounts and applications, and policies that reference your user IDs, group IDs, or identity store ID continue to work.</p>\n<p>To make this change, configure your new identity source with the standard setup required for users to sign in. After the change, your workforce signs in through your dual-stack AWS access portal URL. Changing your identity source in the other direction, to Active Directory, works as before. This feature is available for organization instances of IAM Identity Center in all AWS Regions where IAM Identity Center is available. IAM Identity Center is provided at no additional cost.</p>\n<p>To get started, navigate to the IAM Identity Center console. For more information, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-change.html\">Change your identity source</a> in the IAM Identity Center User Guide. To learn more about IAM Identity Center, visit the <a href=\"https://aws.amazon.com/iam/identity-center/\">product detail page</a>.</p>"
  "675bd00911dd2fb664f3e4292261bc07":
    "id": "675bd00911dd2fb664f3e4292261bc07"
    "title": "Structured outputs for Claude models available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/claude-structured-outputs-bedrock/"
    "published": "2026-10-20 23:00:00"
    "fetched": "2026-10-21 07:02:36"
    "summary": "<p>Amazon Bedrock now supports structured outputs for all Anthropic Claude models across both the bedrock-runtime and the bedrock-mantle endpoint. Whether you call Claude through boto3 and the bedrock-runtime APIs or through the Messages API and the bedrock-mantle endpoint, you can now receive schema-compliant JSON responses that conform to a defined structure, without custom parsing, retry logic, or post-processing.</p>\n<p>With structured outputs for Claude on Amazon Bedrock, you can automate reliable, schema-compliant tasks across industries. Examples include extracting every required field from financial earnings reports and compliance documents, parsing clinical notes into Electronic Health Records (EHR), and enriching product catalogs with consistent, validated results. You can also analyze contracts for key terms, parties, and obligations, or power intelligent support ticket routing where intents, sentiments, and entities always match your application's data model.</p>\n<p>To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/claude-messages-structured-outputs.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>&nbsp;. Structured outputs is available where claude models are available. For more information check the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability</a> details page.</p>"
  "8b499bed5602ab81627281b98d4aa37d":
    "id": "8b499bed5602ab81627281b98d4aa37d"
    "title": "AWS Clean Rooms now supports Databricks as a data source"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-clean-rooms-supports-databricks"
    "published": "2026-10-20 21:23:00"
    "fetched": "2026-10-21 07:02:36"
    "summary": "<p>AWS Clean Rooms now supports <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/prepare-data-databricks.html\" target=\"_blank\">Databricks as a data source</a>, so collaboration members and their partners can securely analyze data managed in Databricks without moving or revealing the source data. Members query a Databricks table shared through Delta Sharing directly in a collaboration. Databricks joins AWS Glue, Snowflake, and Amazon Athena as supported data sources in AWS Clean Rooms.</p>\n<p>Previously, members with data in Databricks had to export or replicate it into Amazon S3 to use it as a table in a collaboration, which added pipeline work and an extra copy of the data to govern. Now members can register a Databricks table directly by providing the workspace URL, schema, and table along with a Delta Sharing share, and make it available to a collaboration. For example, a retailer that manages its customer data in Databricks can collaborate with a media partner on campaign measurement in AWS Clean Rooms, running approved analyses against its Databricks data without first building and maintaining an export to S3.</p>\n<p>AWS Clean Rooms helps companies and their partners easily analyze and collaborate on their collective datasets without revealing or copying one another’s underlying data. For more information about the AWS Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\" target=\"_blank\">AWS Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\" target=\"_blank\">AWS Clean Rooms</a>.</p>"
  "f35305e9d0692652763285431791bc9b":
    "id": "f35305e9d0692652763285431791bc9b"
    "title": "AWS Partner Central launches Program Navigator, Case Study Generator, and streamlined specialization review"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/partner-central-program-navigator/"
    "published": "2026-10-20 17:00:00"
    "fetched": "2026-10-21 07:02:36"
    "summary": "<p>AWS Partner Central now features Program Navigator, a unified experience that lets partners discover, apply for, and track AWS Specialization program applications in one place. Partners can browse specialization designations, view requirements and benefits, and submit applications through a guided, step-by-step workflow.</p>\n<p>The new Case Study Generator in AWS Partner Central gives partners a redesigned creation experience with three starting paths: build a case study directly with AI assistance, import from an existing customer success story URL, or auto-populate from an opportunity. Case studies created for go-to-market purposes now follow a streamlined review path, a lightweight policy validation that lets partners publish directly to AWS domains without a specialization review. The deeper specialization-level review applies only to case studies associated with Program Navigator applications.</p>\n<p>Additionally, AWS has streamlined the specialization application review process through Program Navigator. Partners submitting applications can expect faster review times and more detailed, requirement-level feedback throughout the process. Partners applying for non-specialization programs continue to access those programs through the existing experience.</p>\n<p>Program Navigator and Case Study Generator are available to all AWS Partners in <a href=\"https://console.aws.amazon.com/partnercentral/home?region=us-east-2\">AWS Partner Central</a>. To get started, navigate to Program Navigator and Case Studies under the Go to Market section in the left navigation panel.</p>"
  "4cee4aeed82f0580db51123c99832e6b":
    "id": "4cee4aeed82f0580db51123c99832e6b"
    "title": "AWS Transform for migrations expands support for existing landing zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transform-migrations-landing-zones/"
    "published": "2026-10-20 17:00:00"
    "fetched": "2026-10-21 07:02:36"
    "summary": "<p>AWS Transform now supports more types of existing AWS environments when building landing zones for your migration, including AWS Control Tower landing zones and landing zones built with AWS Organizations. AWS Transform runs a foundation gap analysis of your current environment against AWS best practices and expands your landing zone on top of what's already in your target accounts, so your team can start migrating sooner.</p>\n<p>AWS Transform also now supports an Infrastructure as Code (IaC)-only mode for building landing zones for your migration. In this mode, AWS Transform analyzes your organization, generates recommendations, and produces IaC tailored to your migration plan in AWS CDK, Terraform, or Landing Zone Accelerator (LZA) format. IaC-only mode is designed for organizations that prefer not to grant AWS Transform direct access to their management account. AWS Transform can now connect through a delegated administrator (DA) account instead. It also benefits customers who manage their own deployment pipeline and don't need the agent to deploy automatically.</p>\n<p>The AWS Transform for migrations landing zone agent automates landing zone design end to end, including foundation setup, organizational unit (OU) and account structure, service control policies (SCPs), and workload accounts aligned to your migration planning and waves. You can deploy directly or generate IaC for your own pipeline.</p>\n<p>These new capabilities are available in <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\">all target AWS Regions supported by AWS Transform for migrations</a>.</p>\n<p>To learn more, please visit the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-landing-zone.html\">AWS Transform User Guide</a>.</p>"
  "64093bff0d8d1bd109fef0342fe2a3fb":
    "id": "64093bff0d8d1bd109fef0342fe2a3fb"
    "title": "Amazon Bedrock Guardrails now supports Standard tier for contextual grounding checks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/bedrock-guardrails-grounding-standard/"
    "published": "2026-10-20 17:00:00"
    "fetched": "2026-10-21 10:13:43"
    "summary": "<p>Amazon Bedrock Guardrails now offers a Standard tier for contextual grounding checks, which detect and filter hallucinations by checking whether a model response is grounded in your reference source and relevant to the user's query. The Standard tier is more robust than the Classic tier. It supports responses that include reasoning or conversational content, scores differently worded responses with the same meaning more consistently, and provides more comprehensive language support, matching the Standard tier for content filters and denied topics. Amazon Bedrock Guardrails provides configurable safeguards for generative AI applications on any foundation model through the ApplyGuardrail API.</p>\n<p>Until now, contextual grounding checks applied strict grounding suited to summarization, paraphrasing, and question answering. With the Standard tier, you can also apply contextual grounding checks to conversational applications and to responses that reason over the source. You choose the tier for each guardrail in the Amazon Bedrock console or API. Existing guardrails keep the Classic tier until you change them. Pricing is the same for both tiers. To use the Standard tier, your guardrail must use cross-Region inference with a guardrail profile.</p>\n<p>The Standard tier for contextual grounding checks is available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Europe (Milan), Europe (Paris), Europe (Spain), Europe (Stockholm), and Asia Pacific (Tokyo). To learn more, see the Amazon Bedrock Guardrails documentation on <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html\">contextual grounding checks</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tiers.html\">safeguard tiers</a>, or visit the <a href=\"https://aws.amazon.com/bedrock/guardrails\">Amazon Bedrock Guardrails product page</a>.</p>"
  "63ecd4650fd0729d281a92216ceb5f46":
    "id": "63ecd4650fd0729d281a92216ceb5f46"
    "title": "Amazon Bedrock Advanced Prompt Optimization now supports prompt shortening"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/bedrock-prompt-optimization-shortening/"
    "published": "2026-10-20 17:00:00"
    "fetched": "2026-10-21 10:13:43"
    "summary": "<p>Amazon Bedrock Advanced Prompt Optimization now supports prompt shortening, an optional setting that reduces the length of your prompt while maintaining or improving your evaluation scores. Advanced Prompt Optimization optimizes prompts for any model on Amazon Bedrock against your own evaluation criteria. Until now, optimization focused on quality alone. Optimized prompts were often longer than the original. Longer prompts raise input token costs and can increase time to first token, which matters at scale and in latency-sensitive applications.</p> \n<p>When you turn on prompt shortening for a prompt template in your input dataset, the optimizer reduces the prompt's length. The optimized prompt is returned only when it is shorter than your original prompt and scores at least as high on your evaluation. Otherwise your original prompt is returned, so the setting never leaves you with a longer or lower-scoring prompt. Results include a compression ratio and the original and optimized token counts, in the output file and on the console results page. For example, a compression ratio of 0.7 means the optimized prompt uses 30% fewer tokens. Prompt shortening works with any evaluation method, including steering criteria, LLM-as-a-judge rubrics, and custom Lambda evaluators.&nbsp;&nbsp;&nbsp;&nbsp;</p> \n<p>Prompt shortening is available in all AWS Regions where Advanced Prompt Optimization is available. To get started, enable prompt shortening for a prompt template in your input dataset and create an optimization job as usual. To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompt-optimization-shorten.html\">Shorten prompts</a> in the Amazon Bedrock User Guide, the <a href=\"https://aws.amazon.com/bedrock/pricing/\">Amazon Bedrock pricing page</a>, and the <a href=\"https://aws.amazon.com/bedrock/\">Amazon Bedrock product page</a>.</p>"
  "bc513dc4e46fdb6aa6e600dcc6402d1d":
    "id": "bc513dc4e46fdb6aa6e600dcc6402d1d"
    "title": "Amazon ElastiCache Serverless for Valkey now supports online migration with zero downtime"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-elasticache-serverless-valkey-online-migration/"
    "published": "2026-10-20 16:00:00"
    "fetched": "2026-10-21 10:13:43"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\">Amazon ElastiCache</a> Serverless for Valkey now supports online migration from self-managed Valkey and Redis OSS on Amazon EC2 with zero downtime. Zero downtime means zero Errors returned to the client during migration, measured the same way the <a href=\"https://aws.amazon.com/elasticache/sla/\">ElastiCache SLA</a> measures availability. Your application continues reading and writing through cutover, and you do not need third-party replication tools.</p> \n<p>Online migration runs in three steps. You prepare the migration, start the data sync, and complete the cutover. ElastiCache gives you a migration endpoint your application can point to when you prepare the migration, and data replicates continuously from your source once you start the sync. You choose when writes move to the serverless cache, with a manual cutover or an automatic one once your data is in sync. ElastiCache records each step as an event on the cache’s Events tab, with the reason for any failed step.</p> \n<p>Online migration connects to your source using encryption in transit (TLS) and authentication, and reads credentials from AWS Secrets Manager, so your existing security controls stay in place. Online migration supports self-managed caches in cluster mode on Amazon EC2 running Redis OSS 4.0 through 7.2 or Valkey 7.2 through 8.1, and you can migrate them straight to Valkey 9.0.</p> \n<p>Migration usage is free for the first 180 days per AWS account, starting when the account first prepares a migration. After that, you pay per node-hour for the migration nodes that ElastiCache runs to replicate your data, for as long as a migration is active. The ElastiCache Serverless cache is billed separately at standard data storage and ECPU rates, including during the free period. For pricing details, see <a href=\"https://aws.amazon.com/elasticache/pricing/\">Amazon ElastiCache pricing</a>. Online migration is available in all commercial AWS Regions, the China Regions, and the AWS GovCloud (US) Regions.&nbsp;</p> \n<p>To get started, create or select an empty ElastiCache Serverless cache to migrate into, then start the migration from the <a href=\"https://console.aws.amazon.com/elasticache/\">ElastiCache console</a> or the AWS CLI. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/migration-to-serverless.html\">documentation</a>.</p>"
"last_updated": "2026-10-21 10:13:43 JST"
