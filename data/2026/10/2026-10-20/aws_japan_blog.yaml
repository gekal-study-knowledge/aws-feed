  "ca3c10047f55caffb49e0960323f1adc":
    "id": "ca3c10047f55caffb49e0960323f1adc"
    "title": "リアルタイムのマルウェア防御: AWS Network Firewall のアクティブ脅威防御の活用"
    "link": "https://aws.amazon.com/jp/blogs/news/real-time-malware-defense-leveraging-aws-network-firewall-active-threat-defense/"
    "published": "2026-10-20 09:17:17"
    "fetched": "2026-10-20 10:30:57"
    "summary": "サイバー脅威は急速に進化しており、潜在的な問題を抱えるワークロードは 90 秒以内に脅威アクターに発見されます。この記事では、AWS Network Firewall のアクティブ脅威防御を紹介します。アクティブ脅威防御は、Amazon のハニーポットネットワーク MadPot の脅威インテリジェンスを活用し、30 分以内に保護ルールを自動でデプロイします。DNS、HTTP、TLS SNI、IP の各レイヤーでブロックするスイスチーズモデルの多層防御によって、攻撃キルチェーンの各段階を阻止します。また、Amazon GuardDuty との連携に加え、CVE-2025-48703 を悪用して Mythic C2 フレームワークをデプロイしようとした実際の攻撃を阻止した事例も解説します。"
  "82e0c49311d7c03cb91f95acf1df0ec6":
    "id": "82e0c49311d7c03cb91f95acf1df0ec6"
    "title": "データ流出の防止: AWS で実現するクラウドワークロードのエグレス制御"
    "link": "https://aws.amazon.com/jp/blogs/news/prevent-data-exfiltration-aws-egress-controls-for-cloud-workloads/"
    "published": "2026-10-20 09:11:30"
    "fetched": "2026-10-20 10:30:57"
    "summary": "見落とされがちなアウトバウンドトラフィックを悪用したデータ流出を防ぐため、AWS のサービスを組み合わせた多層的なエグレス制御の実装方法を紹介します。ハブアンドスポーク型アーキテクチャを基盤に、AWS Network Firewall と Amazon Route 53 Resolver DNS Firewall による予防的コントロールを構成します。さらに、SCP、RCP、VPC エンドポイントポリシーによるデータ境界、Amazon GuardDuty や AWS Security Hub による発見的コントロールを組み合わせます。あわせて、段階的な導入アプローチと、これらの制御がエージェンティック AI のワークロードにも有効であることを解説します。"
  "82890658ac4c9aeaf1608911cc70294e":
    "id": "82890658ac4c9aeaf1608911cc70294e"
    "title": "AWS のサービスで構築する生成 AI アプリケーションのセキュアなネットワークアーキテクチャ"
    "link": "https://aws.amazon.com/jp/blogs/news/build-secure-network-architectures-for-generative-ai-applications-using-aws-services/"
    "published": "2026-10-20 09:06:49"
    "fetched": "2026-10-20 10:30:57"
    "summary": "生成 AI アプリケーションは、DDoS 攻撃、SQL インジェクション、悪意のあるボットなど、さまざまな外部脅威にさらされています。この記事では、AWS PrivateLink による Amazon Bedrock へのプライベート接続、AWS WAF と AWS Shield によるエッジでの保護、AWS Network Firewall による境界防御、Amazon GuardDuty による監視を組み合わせた多層防御について、リファレンスアーキテクチャを交えて解説します。"
"last_updated": "2026-10-20 10:30:57 JST"
