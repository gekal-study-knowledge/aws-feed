    "title": "脅威の手口を解説: サブドメイン乗っ取りの仕組みと対策"
    "link": "https://aws.amazon.com/jp/blogs/news/threat-tactic-spotlight-subdomain-takeover/"
    "published": "2026-10-20 09:25:43"
    "fetched": "2026-10-20 10:30:57"
    "summary": "このブログ記事では、脅威アクターがダングリング DNS レコードを悪用し、トラフィックを攻撃者が管理するリソースにリダイレクトするサブドメイン乗っ取りの仕組みと対策を説明します。S3、CloudFront、Elastic Beanstalk など乗っ取りの対象になり得るリソースを整理し、具体的なシナリオを分析します。さらに、AWS Config カスタムルールによるプロアクティブな検出、DNS レコードを先に削除する標準作業手順、Security Hub や SNS による通知と修復の方法を紹介します。"
