  "486a1ead394511facb41e6ab41d35698":
    "id": "486a1ead394511facb41e6ab41d35698"
    "title": "Pegasus 1.5 from TwelveLabs is now available in Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/pegasus-1-5-from-twelvelabs-is-now-available-in-amazon-bedrock/"
    "published": "2026-10-20 01:49:19"
    "fetched": "2026-10-20 03:37:09"
    "summary": "TwelveLabs Pegasus 1.5 is now available in Amazon Bedrock. The video language model turns long-form video into structured, timestamped metadata: define the moments that matter and get every matching segment back as JSON, with new video segmentation, multimodal prompting with reference images, and on-the-fly processing of up to two hours of video."
  "08488633f4d3a1ce138e4f93b0c893de":
    "id": "08488633f4d3a1ce138e4f93b0c893de"
    "title": "How Deepgram optimized voice AI at scale with AWS Trainium"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-deepgram-optimized-voice-ai-at-scale-with-aws-trainium/"
    "published": "2026-10-20 01:23:22"
    "fetched": "2026-10-20 03:37:09"
    "summary": "Deepgram worked with the AWS Forward Deployed Engineering team to port its Nova-3 speech-to-text model to AWS Trainium2 for offline batch inference. This post covers porting to the AWS Neuron stack, kernel-level tuning, a data-parallel Rust runtime, and the throughput and cost results on batch transcription."
  "0247958d6fdb7d0ab79290d75376ad47":
    "id": "0247958d6fdb7d0ab79290d75376ad47"
    "title": "Push-based KV transfer to improve TTFT and TPOT for disaggregated inference in vLLM"
    "link": "https://aws.amazon.com/blogs/machine-learning/push-based-kv-transfer-to-improve-ttft-and-tpot-for-disaggregated-inference-in-vllm/"
    "published": "2026-10-20 01:05:17"
    "fetched": "2026-10-20 03:37:09"
    "summary": "vLLM's prefill-decode disaggregation splits LLM inference across engine instances but must transfer the KV cache between them. This post introduces a push-based NIXL connector that moves transfer coordination off the critical path, delivering up to 3x better TTFT and 30% better TPOT in benchmarks on Amazon EC2 P5en instances with AWS EFA."
  "be59061c8428dc0493e537c14b38c9e5":
    "id": "be59061c8428dc0493e537c14b38c9e5"
    "title": "Improve TTFT for multi-turn agentic workloads with bi-directional KV transfer in vLLM"
    "link": "https://aws.amazon.com/blogs/machine-learning/improve-ttft-for-multi-turn-agentic-workloads-with-bi-directional-kv-transfer-in-vllm/"
    "published": "2026-10-20 01:03:23"
    "fetched": "2026-10-20 03:37:09"
    "summary": "Multi-turn agentic workloads reprocess growing conversation context each turn, driving up latency. See how bi-directional KV cache transfer lets prefill and decode nodes reuse previously computed context across turns, cutting time to first token by up to 1.6x for Qwen3-32B and 3.3x for GLM-5-FP8 on Amazon EC2 P5en instances with EFA."
  "eaa1eda884fac11c5f9a7413e11372cf":
    "id": "eaa1eda884fac11c5f9a7413e11372cf"
    "title": "Developers can now access SageMaker Studio through the new AWS experience"
    "link": "https://aws.amazon.com/blogs/machine-learning/developers-can-now-access-sagemaker-studio-through-the-new-aws-experience/"
    "published": "2026-10-20 07:39:24"
    "fetched": "2026-10-20 07:47:13"
    "summary": "New Amazon SageMaker AI customers can now land in a fully configured SageMaker Studio environment in only a few steps. Sign up with an identity you already have, such as Amazon, Apple, GitHub, or Google, with no advanced AWS account or credit card required for most customers, plus $100 in AWS Free Tier credits."
  "0a0eee761fda72f816bb39c45a450e55":
    "id": "0a0eee761fda72f816bb39c45a450e55"
    "title": "Amazon SageMaker JumpStart: 2026 year-to-date in review"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-jumpstart-2026-year-to-date-in-review/"
    "published": "2026-10-20 06:14:44"
    "fetched": "2026-10-20 07:47:13"
    "summary": "Amazon SageMaker JumpStart onboarded over 100 new models from 30 providers in the first three quarters of 2026. This recap covers the model-onboarding highlights and JumpStart enhancements, including the simplified Model Hub, pre-configured deployment options, and Hugging Face deep link integration."
"last_updated": "2026-10-20 07:47:13 JST"
