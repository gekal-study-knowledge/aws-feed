"overview": |
  この日は 28 件で、AWS Well-Architected Agent のプレビュー公開と、エージェントの実装パターン、そしてセキュリティ速報が中心でした。ニュースブログとサービス更新の両方で、AWS Well-Architected Agent のパブリックプレビューが発表されました。AWS Trusted Advisor と AWS Well-Architected Tool の次世代形にあたる AI 搭載のサービスで、環境を分析してアプリケーションの改善に向けた的を絞った文脈のある推奨を提示します。セキュリティ速報は 3 件で、いずれも Important (要対応) です。CVE-2026-97662 はオープンソースの Model Context Protocol サーバーである security-agent-mcp-server の差分スキャンにおける引数インジェクション (Bulletin ID: 2026-121-AWS、2026 年 10 月 1 日 10:30 PDT 公開)、CVE-2026-104020 は Amazon Ion の Python 実装 Amazon Ion Python の Ion リーダーにおける制御されない再帰 (Bulletin ID: 2026-122-AWS、同日 13:30 PDT 公開)、CVE-2026-104002 は Powertools for AWS Lambda (Python) のデータマスキングユーティリティにおける fail-open なエラー処理 (Bulletin ID: 2026-123-AWS、同日 14:00 PDT 公開) です。機械学習ブログでは、Amazon Bedrock AgentCore 上でアンビエントエージェントを構築する方法が解説されました。チャットのプロンプトを待つのではなく、Amazon S3 へのアップロード、スケジュール、アラートといったイベントに反応するエージェントで、フレームワークに依存しない構成とヒューマンインザループのワークフローまでを扱います。あわせて、台湾の統一企業グループの小売プラットフォームである uniopen が、Amazon SageMaker AI の教師ありファインチューニングで Amazon Nova 2 Lite を自社のコンテンツモデレーションポリシーに適応させ本番投入した事例、Amazon Payments が SageMaker AI 上の多目的コンテキストバンディットを使って獲得ファネル全体のコンバージョンを改善したパーソナライゼーションの事例、NVIDIA NeMo Agent Toolkit (NAT) を Amazon EKS 上にデプロイし Amazon S3 Vectors を永続的なメモリ層として使うエージェントメモリの構築方法が公開されました。Claude Platform on AWS については、1 つのサブスクリプションから安全なマルチ環境アクセスを構成する方法 (AWS ワークロード向けのクロスアカウント SigV4、開発者向けのワークスペース単位の API キー、OIDC) が解説されています。BI 関連では、Amazon Quick Sight の新しい階層フィルターでダッシュボードのドリルダウンを簡素化する記事と、Amazon Quick の Live Data in Apps により AI が作ったアプリがビルド時の静的なスナップショットではなく統制された Quick Sight のデータセットをリアルタイムにクエリし、各クエリがアプリを見ている本人として実行される仕組みが紹介されました。アーキテクチャブログでは、航空会社の EC で先行する Datalex が AWS との 3 日間の Experience-Based Acceleration (EBA) ワークショップでモダナイゼーションの実現性を検証し、中核の予約系コンポーネントを移行した取り組みが公開されました。サービス更新では、Amazon GuardDuty が AWS Organizations の宣言型ポリシーに対応し、組織内のすべてのアカウントとリージョンで脅威検知を一元的に有効化できるようになりました。あわせて GuardDuty Runtime Monitoring が AWS Security Hub の Threat Analytics プランに含まれるようになり、OS・ネットワーク・ファイルの活動を検査できます。エージェント基盤では、Amazon Bedrock AgentCore Gateway が MCP・OpenAPI・HTTP プロキシの各ターゲットでプライベート認証局 (CA) が署名した TLS 証明書に対応し、VPC エンドポイント経由で安全に接続できるようになりました。AWS MCP Server はアジアパシフィック (シンガポール・シドニー・東京)、ヨーロッパ (アイルランド・ロンドン)、米国西部 (オレゴン) の 6 リージョンで追加提供となりました。データベースと分析では、Amazon DynamoDB Accelerator (DAX) がアジアパシフィック (香港・ハイデラバード・ジャカルタ・マレーシア) などを含む 17 リージョンで追加提供となり、Amazon DynamoDB の Amazon S3 へのエクスポートがフィルター付きエクスポートに対応、Amazon Redshift は別リージョンにある Amazon S3 のデータレイクテーブルをクエリできるようになりました (拡張 VPC ルーティングにより S3 と Redshift 間のクエリトラフィックは AWS ネットワーク内に留まります)。Amazon ElastiCache for Valkey はノードベースのクラスターについて OpenTelemetry メトリクスを Amazon CloudWatch へ発行するようになり、各メトリクスには Prometheus 互換のツールでフィルターや集約に使える属性が付きます。日本のブログでは、2026 年 9 月 15 日に開催した「AI ペルソナワークショップ — 自社だけの AI ペルソナを作って、試してみよう」の開催報告 (自社データから AI ペルソナを作り実際のビジネス課題にぶつける半日のワークショップ)、2026 年 8 月 19 日開催の「AWS Future of Money ～AI × ブロックチェーンが創る新金融エコシステム～」の開催報告、2026 年 9 月の AWS ヒーロー紹介、Amazon S3 Tables の Apache Iceberg V3 全データ型対応の日本語記事、そして 8 月と 9 月のオブザーバビリティ更新をまとめた「今月の AWS オブザーバビリティ」が公開されました。後者では Amazon CloudWatch Omni の一般提供、アラームへのウォームアップ期間とウォールクロック評価ウィンドウの追加、データベースオブザーバビリティの自己管理型 PostgreSQL と Amazon Aurora DSQL への対応、AWS CloudTrail について Amazon Q Console にふだんの言葉で質問できるようになったことなどが取り上げられています。サービス更新では、AWS マネジメントコンソールの Amazon Q Developer の可視化が強化されました。Amazon Q が数百の AWS API をまたいで推論し、全リージョン・全サービスにわたるアカウント全体について複雑な問いに答えられるようになり、今年前半に入ったリソースの表とコストのグラフに加えて、ステータス表示付きのヘルスダッシュボード、トレンドと異常検出を伴う時系列グラフ、トラブルシューティングの診断、リソースの詳細ビューを描けるようになっています。従来は「本番環境のヘルスを見せて」と尋ねてもテキストの要約が返るだけで 1 行ずつ読む必要がありましたが、現在は複数サービスへの呼び出しをまとめてヘルスデータを集め、一目で全体像がつかめるダッシュボードを描きます。「EC2 インスタンスのネットワーク使用率を 12 時間分グラフにして」であれば、トレンド線と異常のハイライトが付いた対話的な時系列グラフが生成されます。応答自体も明確に速くなっており、Amazon Q Developer が提供されている全リージョンで利用できます。サービス更新ではさらに、Amazon OpenSearch Service がドメインの構成変更に対する検証のアドバイザリを提供するようになりました。リスクはあるが適用自体は可能な変更について、情報を得たうえで判断できるようにするもので、各構成の検証結果が、変更を止める Critical と、了承すれば先に進める助言としての Warning に分類されます。従来は検証結果が成功か拒否の2 択で、成功はするがリスクを伴う変更に印を付ける手段がありませんでした。例としては、データノードの構成に対して小さすぎるかもしれない専用のコーディネーターノードや、クラスターの推奨上限を超えるシャード数などが挙げられています。変更を最初に送るときに警告を了承する、適用前にドライランの結果で深刻度を確認する、AWS CloudFormation のテンプレートに了承を直接書く、API のレスポンスや Amazon EventBridge の通知で深刻度を見る、といった使い方ができます。OpenSearch と Elasticsearch のどちらのバージョンで動いているドメインでも使えて、Amazon OpenSearch Service が提供されている全リージョンで利用できます。
