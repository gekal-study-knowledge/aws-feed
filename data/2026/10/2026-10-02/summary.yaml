"overview": |
  この日は 25 件で、AWS Well-Architected Agent のプレビュー公開と、エージェントの実装パターン、そしてセキュリティ速報が中心でした。ニュースブログとサービス更新の両方で、AWS Well-Architected Agent のパブリックプレビューが発表されました。AWS Trusted Advisor と AWS Well-Architected Tool の次世代形にあたる AI 搭載のサービスで、環境を分析してアプリケーションの改善に向けた的を絞った文脈のある推奨を提示します。セキュリティ速報は 3 件で、いずれも Important (要対応) です。CVE-2026-97662 はオープンソースの Model Context Protocol サーバーである security-agent-mcp-server の差分スキャンにおける引数インジェクション (Bulletin ID: 2026-121-AWS、2026 年 10 月 1 日 10:30 PDT 公開)、CVE-2026-104020 は Amazon Ion の Python 実装 Amazon Ion Python の Ion リーダーにおける制御されない再帰 (Bulletin ID: 2026-122-AWS、同日 13:30 PDT 公開)、CVE-2026-104002 は Powertools for AWS Lambda (Python) のデータマスキングユーティリティにおける fail-open なエラー処理 (Bulletin ID: 2026-123-AWS、同日 14:00 PDT 公開) です。機械学習ブログでは、Amazon Bedrock AgentCore 上でアンビエントエージェントを構築する方法が解説されました。チャットのプロンプトを待つのではなく、Amazon S3 へのアップロード、スケジュール、アラートといったイベントに反応するエージェントで、フレームワークに依存しない構成とヒューマンインザループのワークフローまでを扱います。あわせて、台湾の統一企業グループの小売プラットフォームである uniopen が、Amazon SageMaker AI の教師ありファインチューニングで Amazon Nova 2 Lite を自社のコンテンツモデレーションポリシーに適応させ本番投入した事例、Amazon Payments が SageMaker AI 上の多目的コンテキストバンディットを使って獲得ファネル全体のコンバージョンを改善したパーソナライゼーションの事例、NVIDIA NeMo Agent Toolkit (NAT) を Amazon EKS 上にデプロイし Amazon S3 Vectors を永続的なメモリ層として使うエージェントメモリの構築方法が公開されました。Claude Platform on AWS については、1 つのサブスクリプションから安全なマルチ環境アクセスを構成する方法 (AWS ワークロード向けのクロスアカウント SigV4、開発者向けのワークスペース単位の API キー、OIDC) が解説されています。BI 関連では、Amazon Quick Sight の新しい階層フィルターでダッシュボードのドリルダウンを簡素化する記事と、Amazon Quick の Live Data in Apps により AI が作ったアプリがビルド時の静的なスナップショットではなく統制された Quick Sight のデータセットをリアルタイムにクエリし、各クエリがアプリを見ている本人として実行される仕組みが紹介されました。アーキテクチャブログでは、航空会社の EC で先行する Datalex が AWS との 3 日間の Experience-Based Acceleration (EBA) ワークショップでモダナイゼーションの実現性を検証し、中核の予約系コンポーネントを移行した取り組みが公開されました。サービス更新では、Amazon GuardDuty が AWS Organizations の宣言型ポリシーに対応し、組織内のすべてのアカウントとリージョンで脅威検知を一元的に有効化できるようになりました。あわせて GuardDuty Runtime Monitoring が AWS Security Hub の Threat Analytics プランに含まれるようになり、OS・ネットワーク・ファイルの活動を検査できます。データベースと分析では、Amazon DynamoDB Accelerator (DAX) がアジアパシフィック (香港・ハイデラバード・ジャカルタ・マレーシア) などを含む 17 リージョンで追加提供となり、Amazon DynamoDB の Amazon S3 へのエクスポートがフィルター付きエクスポートに対応、Amazon Redshift は別リージョンにある Amazon S3 のデータレイクテーブルをクエリできるようになりました (拡張 VPC ルーティングにより S3 と Redshift 間のクエリトラフィックは AWS ネットワーク内に留まります)。日本のブログでは、2026 年 9 月 15 日に開催した「AI ペルソナワークショップ — 自社だけの AI ペルソナを作って、試してみよう」の開催報告 (自社データから AI ペルソナを作り実際のビジネス課題にぶつける半日のワークショップ)、2026 年 8 月 19 日開催の「AWS Future of Money ～AI × ブロックチェーンが創る新金融エコシステム～」の開催報告、2026 年 9 月の AWS ヒーロー紹介、そして Amazon S3 Tables の Apache Iceberg V3 全データ型対応の日本語記事が公開されました。エージェント向けの基盤では、Agent Toolkit for AWS の一部であるマネージドな Model Context Protocol サーバー、AWS MCP Server が 6 つのリージョン (アジアパシフィック (シンガポール、シドニー、東京)、ヨーロッパ (アイルランド、ロンドン)、米国西部 (オレゴン)) に広がりました。AI コーディングエージェントに AWS API への単一のインターフェイスを提供し、サービスごとの連携を作って維持しなくても、エージェントが AWS のサービスを見つけて呼び出せるようにするものです。今回の拡大で、これらのリージョンの利用者は開発者の近くで低レイテンシーに動かせ、リクエストのデータをリージョン内に留めてデータレジデンシーの要件にも応えられます。可観測性では、Amazon ElastiCache for Valkey がノードベースのクラスターについて OpenTelemetry のメトリクスを Amazon CloudWatch に発行するようになり、各メトリクスには Prometheus Query Language (PromQL) の式で絞り込みや集計ができる属性が付きます。監視モードは 2 つになり、従来どおりの標準監視は CloudWatch Metrics (Classic) を 60 秒ごとに発行しつつ、同じ間隔で OpenTelemetry メトリクスの基本セットも追加費用なしで発行します。新しい詳細監視では、OpenTelemetry メトリクスの全セットから選んで 15 秒ごとに発行できます。日本語ブログでは、2026 年 8 月と 9 月の AWS オブザーバビリティのまとめが公開されました。Amazon CloudWatch Omni の一般提供、アラームへのウォームアップ期間とウォールクロック評価ウィンドウの追加、データベースの可観測性が自己管理型 PostgreSQL と Amazon Aurora DSQL にも対応したこと、AWS CloudTrail について Amazon Q Console にふだんの言葉で質問できるようになったこと、ログ収集の対応範囲の拡大、そしてポートフォリオ全体のサービスがより充実したテレメトリを CloudWatch に発行し始めており、その多くが OpenTelemetry で構築されていることが取り上げられています。
