  "fbb7d27df4397c93b92ed286008931ae":
    "id": "fbb7d27df4397c93b92ed286008931ae"
    "title": "AWS Well-Architected Agent is now available in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-well-architected-agent/"
    "published": "2026-10-02 05:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>AWS announces the preview of AWS Well-Architected Agent, a AI-powered service that is the next-gen evolution of AWS Trusted Advisor and the AWS Well-Architected Tool. The agent analyzes and optimizes AWS infrastructure across cost, security, performance, and reliability, delivering contextualized recommendations prioritized by business goals. It automatically correlates key metrics and application topology against Well-Architected best practices and analyzes Terraform, CDK templates and CloudFormation templates to deliver automation-ready fixes where applicable.</p>\n<p>With AWS Well-Architected Agent, teams can define their business goals and get prioritized recommendations prioritized by impact and effort at the resource, application, and architecture levels. For example, a team prioritizing reliability can receive recommendations to add multi-AZ failover to a critical database, complete with an SSM runbook that automates the configuration change and a cross-pillar analysis showing how this change affects cost and performance before you commit. Where applicable, recommendations are delivered with SSM runbooks, prescriptive CLI scripts, and guided console walkthroughs so teams can move quickly. The agent can also conduct automated reviews of your IaC templates that include Terraform, CloudFormation, or CDK templates, identifying&nbsp;gaps, and returning the IaC code changes needed to align with Well-Architected best practices.</p>\n<p>Access to the AWS Well-Architected Agent and its recommendations is available in US East (N. Virginia), US East (Ohio), and US West (Oregon). You can onboard workloads from any AWS commercial Region. AWS Well-Architected Agent is delivered by AWS Support and available to AWS customers with an AWS Support plan.</p>\n<p>Learn more about AWS Well-Architected Agent in the <a href=\"https://docs.aws.amazon.com/wellarchitected/latest/userguide/wa-agent.html\">User Guide</a>. Get started <a href=\"https://us-east-1.console.aws.amazon.com/wellarchitected/home?region=us-east-1#/\">here</a>.</p>"
  "c7c058ac08644ccec05548d27c4ff8d7":
    "id": "c7c058ac08644ccec05548d27c4ff8d7"
    "title": "Amazon Redshift now supports cross-Region queries for your data lake"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/redshift-cross-Region-queries-for-data-lake"
    "published": "2026-10-02 03:41:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Amazon Redshift now supports querying Amazon S3 data lake tables located in a different AWS Region. With enhanced VPC routing, data lake query traffic between Amazon S3 and Amazon Redshift stays within your own VPC.&nbsp;Both capabilities are powered by the integrated data lake query engine that runs directly on the compute of RG provisioned and Serverless clusters. These features are aimed at enterprises with globally distributed data and at security-sensitive customers who need tight control over how their data travels.</p>\n<p>With cross-Region support, you can use Amazon Redshift to query S3 data in another Region directly, without first copying or replicating it. This makes it easier to run global analytics, consolidate reporting across Regions, and query data that must remain in a specific Region for residency requirements. Cross-Region queries incur standard data transfer charges. Because the query engine runs on your cluster's compute, data moving between Amazon S3 and Amazon Redshift flows entirely over your VPC when you use enhanced VPC routing, never over public networks. Regulated industries such as financial services, healthcare, and government benefit from this feature as it keeps data lake queries within the network boundaries their compliance requirements demand.&nbsp;&nbsp;Both capabilities work with the integrated data lake query engine, which is available in all regions where RG provisioned and Serverless clusters are available. To learn more, see <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/spectrum-enhanced-vpc.html#spectrum-enhanced-vpc-integrated-engine\"><u>Querying your data lake</u>&nbsp;tables with enhanced VPC routing</a>&nbsp;in the <a href=\"https://docs.aws.amazon.com/redshift/\" style=\"background-color: rgb(255,255,255);\">Amazon Redshift documentation</a>.</p>"
  "6c132cc7ba03ca8a681a8a82db18df12":
    "id": "6c132cc7ba03ca8a681a8a82db18df12"
    "title": "Amazon DynamoDB introduces filtered export to Amazon S3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-dynamodb-introduces-filtered-export/"
    "published": "2026-10-02 02:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Amazon DynamoDB export to Amazon S3 allows you to export your table data for analytics, data sharing, and other offline uses, as either a full export or an incremental export over a time window. Filtered export enables you to specify exactly which items and attributes to export, producing a dataset that contains only the data relevant to your use case.</p>\n<p>With filtered export, you use a key condition expression on a key attribute and a filter expression on any attribute to select which items to export, and a projection expression to choose which attributes to include. The export then returns only the items and attributes you want. You can use that subset of data to perform granular data recovery, move a slice of data between accounts, or run analytics while meeting your compliance rules. Filtered export works with both full exports and incremental exports.</p>\n<p>Filtered export is available in all AWS Regions, except the AWS GovCloud (US) Regions. To get started, see the following resources:</p>\n<ul>\n <li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.HowItWorks.html\" rel=\"noopener noreferrer\" target=\"_blank\">DynamoDB data export to Amazon S3</a>&nbsp;in the DynamoDB developer guide</li>\n</ul>\n<ul>\n <li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.Filtered.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Filtering a table export\">Filtering a table export</a>&nbsp;in the DynamoDB developer guide</li>\n</ul>\n<ul>\n <li><a href=\"https://aws.amazon.com/blogs/database/introducing-filtered-export-from-amazon-dynamodb-to-amazon-s3/\" rel=\"noopener noreferrer\" target=\"_blank\">Introducing filtered export from Amazon DynamoDB to Amazon S3</a> blog post</li>\n</ul>"
  "b6e4839f36961bf0d8524f2846cc8474":
    "id": "b6e4839f36961bf0d8524f2846cc8474"
    "title": "Amazon DynamoDB Accelerator (DAX) is now available in additional Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-dynamodb-accelerator/"
    "published": "2026-10-02 01:44:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Today, AWS announces the availability of Amazon DynamoDB Accelerator (DAX) in 17 additional AWS Regions: Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Jakarta), Asia Pacific (Malaysia), Asia Pacific (Melbourne), Asia Pacific (New Zealand), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Taipei), Asia Pacific (Thailand), Canada West (Calgary), Europe (Milan), Europe (Zurich), Israel (Tel Aviv), Mexico (Central), AWS GovCloud (US-East), and AWS GovCloud (US-West). DAX is a fully managed, highly available, in-memory cache for Amazon DynamoDB that delivers up to 10 times performance improvement—from single-digit milliseconds to microseconds—even at millions of requests per second. This expansion brings DAX to more geographies, helping customers accelerate read-heavy DynamoDB workloads without managing their own cache infrastructure.</p>\n<p>With DAX, you can accelerate read-intensive and bursty workloads such as real-time bidding, gaming leaderboards, and retail product catalogs, while offloading read traffic from your DynamoDB tables. DAX is API-compatible with DynamoDB, so you can add microsecond-latency caching to your applications with minimal code changes. Customers in these Regions can now meet local data residency and low-latency requirements while benefiting from DAX's fully managed operations, including automated patching, failover, and scaling.</p>\n<p>To see the full list of Regions where DAX is available, see the following resources: <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region</a>.</p>"
  "963b38f25e9b8eb5d08188b5111f3fef":
    "id": "963b38f25e9b8eb5d08188b5111f3fef"
    "title": "Amazon GuardDuty now supports centralized management using AWS Organizations declarative policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/guardduty-org-enablement-policies/"
    "published": "2026-10-02 01:01:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Amazon GuardDuty now supports AWS Organizations declarative policies, enabling you to centrally enable GuardDuty threat detection across every account and Region in your AWS organization. Using an organization policy, you can now apply a centrally managed GuardDuty enablement configuration. The configuration applies to existing accounts and is automatically maintained as new accounts join your organization.</p>\n<p>Enabling GuardDuty across all relevant accounts and Regions helps ensure comprehensive threat detection coverage. Previously, keeping enablement aligned across a large multi-account, multi-Region environment meant configuring GuardDuty's enablement settings separately in each Region, which could drift over time. Now you can define a central GuardDuty policy from your delegated administrator account that sets an enablement baseline across your organization (at the organization root, OUs, or individual accounts). The policy supports a default configuration that applies in every Region where GuardDuty is available, as well as per-Region overrides for Regions that require different enablement. Enablement set by a policy cannot be overridden via the GuardDuty console or API.</p>\n<p>GuardDuty declarative policy support is available in all AWS commercial Regions and the AWS GovCloud (US) Regions. To get started, make sure the delegated administrator has permission to manage GuardDuty policies. Then, sign in to the GuardDuty console and choose Organization policies, or create a policy programmatically using AWS Organizations APIs. To learn more, see <a href=\"https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-organization-policies.html\">Managing accounts using organization policies</a> in the Amazon GuardDuty User Guide and <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_guardduty.html\">Amazon GuardDuty policies</a> in the AWS Organizations User Guide.</p>"
  "43409d7e5260ba512cd7d77ceb0abb56":
    "id": "43409d7e5260ba512cd7d77ceb0abb56"
    "title": "GuardDuty Runtime Monitoring is now included in the AWS Security Hub Threat Analytics plan"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-security-hub-runtime-monitoring/"
    "published": "2026-10-02 12:35:00"
    "fetched": "2026-10-02 17:00:48"
    "summary": "<p>Today, AWS announces that Amazon GuardDuty Runtime Monitoring is now included in the AWS Security Hub Threat Analytics plan. Runtime Monitoring inspects operating system, network, and file activity to surface threats such as container escapes, privilege escalation, and cryptomining on Amazon EC2 instances, Amazon EKS clusters, and Amazon ECS tasks on AWS Fargate. Security Hub now bills this coverage through streamlined pricing.</p>\n<p>If you have Security Hub enabled in an account and region, you no longer receive separate Amazon GuardDuty charges for Runtime Monitoring for that account and region. That usage now appears on your bill under AWS Security Hub, where Security Hub meters it as a single usage type that spans Amazon EC2, Amazon EKS, and Amazon ECS on AWS Fargate rather than as separate charges for each resource type.</p>\n<p>Your detection coverage, your finding types, and your GuardDuty security agents all remain the same, and you do not need to reconfigure anything. Please note that the free trial for the Threat Analytics plan remains separate from the free trial for the Security Hub Essentials plan, and that this change does not add a new free trial for Runtime Monitoring. To see how the change affects your bill, you can use AWS Cost Explorer or the Security Hub usage page.</p>\n<p>For a list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>. For pricing details, see the AWS Security Hub <a href=\"https://aws.amazon.com/security-hub/pricing/\">pricing page</a>. To get started, visit the AWS Security Hub <a href=\"https://aws.amazon.com/security-hub/\">product page</a> or <a href=\"https://console.aws.amazon.com/securityhub/v2/home\">console</a>.</p>"
  "606255654f95da08e6f9bc31efa5bac9":
    "id": "606255654f95da08e6f9bc31efa5bac9"
    "title": "The AWS MCP Server is now available in six additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-mcp-server-six-additional-regions/"
    "published": "2026-10-02 17:00:00"
    "fetched": "2026-10-03 05:18:40"
    "summary": "<p>The AWS MCP Server is now available in six additional AWS Regions: Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Ireland), Europe (London), and US West (Oregon). The AWS MCP Server, part of the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws\">Agent Toolkit for AWS</a>, is a managed Model Context Protocol server that gives AI coding agents a single interface to AWS APIs, so agents can discover and call AWS services without building and maintaining per-service integrations.</p>\n<p>With this expansion, customers in these Regions can run the AWS MCP Server closer to their developers with lower latency, and keep request data within the Region to meet data residency requirements. For example, a development team in London can point its coding agents at a local endpoint to provision infrastructure, inspect running workloads, and debug failures without routing requests to another geography. The AWS MCP Server can access services in all commercial AWS Regions, while the AWS MCP Server itself runs in the Regions listed below.</p>\n<p>You can use AWS MCP Server in the following AWS Regions: US East (N. Virginia), US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (Ireland), and Europe (London).</p>\n<p>To get started, see the following resources:</p>\n<p>- <a href=\"https://docs.aws.amazon.com/aws-mcp/latest/userguide/getting-started-aws-mcp-server.html\">Getting started with the AWS MCP Server</a></p>\n<p>- <a href=\"https://docs.aws.amazon.com/general/latest/gr/aws-mcp.html\">AWS MCP Server endpoints and quotas</a></p>"
  "cf44c197a5074b86d92eda3bc62e00a1":
    "id": "cf44c197a5074b86d92eda3bc62e00a1"
    "title": "Amazon ElastiCache for Valkey now supports OpenTelemetry metrics and detailed monitoring"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-elasticache-valkey-opentelemetry-metrics-detailed-monitoring"
    "published": "2026-10-02 16:00:00"
    "fetched": "2026-10-03 05:18:40"
    "summary": "<p><a href=\"https://aws.amazon.com/elasticache/\">Amazon ElastiCache</a> for Valkey now publishes OpenTelemetry metrics to Amazon CloudWatch for your node-based clusters, and each metric carries attributes you can filter and aggregate on with Prometheus Query Language (PromQL) expressions. ElastiCache now offers two monitoring modes. Standard monitoring, the existing experience, continues to publish CloudWatch Metrics (Classic) every 60 seconds and now also publishes a core set of OpenTelemetry metrics at the same interval at no additional charge. Detailed monitoring, the new mode, lets you select from the full set of OpenTelemetry metrics and publish them every 15 seconds.</p>\n<p>With OpenTelemetry metrics, you can detect any node in a cluster nearing its connection limit, break errors down by type during an incident, or forecast if a node will run out of memory. You can run these queries in CloudWatch and Grafana, keeping PromQL skills your team already has. With detailed monitoring, you can balance diagnostic depth and cost, with 15-second metrics enabling detection of short-lived events like latency spikes. The core set of OpenTelemetry metrics also powers <a href=\"https://console.aws.amazon.com/cloudwatch/home#dashboards/insights/elasticache\">ElastiCache Insights</a>, a pre-built dashboard in Amazon CloudWatch.</p>\n<p>To get started, open the Metrics tab for a cluster in the <a href=\"https://console.aws.amazon.com/elasticache/\">Amazon ElastiCache console</a>, select Detailed, and choose Configure detailed metrics.</p>\n<p>OpenTelemetry metrics and detailed monitoring are available for node-based Valkey clusters in all AWS Regions where Amazon CloudWatch supports OpenTelemetry metrics. There is no additional charge from ElastiCache for detailed monitoring. <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">CloudWatch pricing for OpenTelemetry metrics</a> applies to the detailed monitoring metrics you select, alarms you create, and PromQL API queries you run.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/otel-metrics.html\">Monitoring ElastiCache with OpenTelemetry metrics</a> in the Amazon ElastiCache User Guide.</p>"
  "52cdb4cd6649058cacc821ac591b7916":
    "id": "52cdb4cd6649058cacc821ac591b7916"
    "title": "AgentCore Gateway supports private TLS certificates for VPC endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-gateway-private-tls-vpc/"
    "published": "2026-10-02 17:00:00"
    "fetched": "2026-10-03 09:06:40"
    "summary": "<p>Amazon Bedrock AgentCore Gateway now supports TLS certificates signed by private certificate authorities (CAs) on MCP, OpenAPI, and HTTP proxy targets. This feature enables you to connect securely to gateway targets that use TLS certificates issued by your own private certificate authority. With this feature, you can establish native connections to private endpoints in your VPC without requiring an intermediate Application Load Balancer.</p>\n<p>You can register a private CA certificate with gateway targets that use private endpoints powered by Amazon VPC Lattice. The gateway fetches your PEM-encoded CA certificate from Amazon S3 or AWS Secrets Manager and uses it as the trust anchor for outbound TLS connections. Private CA support is available for MCP server targets, OpenAPI targets, and HTTP proxy (passthrough) targets.</p>\n<p>Support for private certificates on AgentCore Gateway is available in all Regions where both AgentCore Gateway and Amazon VPC Lattice are available. To learn more, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-vpc-egress.html#gateway-private-certificate\">AgentCore Developer Guide</a>.</p>"
"last_updated": "2026-10-03 09:06:40 JST"
