  "9671674a6e0c57234d2ab485de73239c":
    "id": "9671674a6e0c57234d2ab485de73239c"
    "title": "Amazon EC2 G7 instances now available in Europe (Frankfurt) and Europe (Stockholm) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-g7-european-regions/"
    "published": "2026-10-13 07:30:00"
    "fetched": "2026-10-13 08:26:39"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) G7 instances powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs are now available in Europe (Frankfurt) and Europe (Stockholm) Regions. G7 instances deliver up to 4.6x AI inference performance and up to 2.1 graphics performance compared to G6 instances. G7 instances also deliver faster performance for GPU-accelerated data analytics workloads.</p>\n<p>Customers can use G7 instances for deploying AI models for language translation, video and image analysis, speech recognition and recommender systems. They also accelerate graphics workloads such as creating and rendering real-time, cinematic-quality graphics and game streaming. Additionally, G7 instances support video transcoding, spatial computing, and data analytics workloads. G7 instances feature up to 8 NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs with 32 GB of memory per GPU and custom Intel Xeon 6 processors. They support up to 192 virtual CPUs (vCPUs) and up to 700 Gbps of Elastic Fabric Adapter (EFA) networking bandwidth. They also support up to 768 GiB of system memory, and up to 7.6 TB of local NVMe SSD storage.</p>\n<p>You can use G7 instances for Amazon EC2 in the following AWS Regions: US West (Oregon), US East (N. Virginia, Ohio) and Europe (Spain, Frankfurt, Stockholm). You can purchase G7 instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p>\n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface</a> (CLI), and AWS SDKs. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\">G7 instance page</a>.</p>"
  "8499b18ff79c996148e9d9531d067af5":
    "id": "8499b18ff79c996148e9d9531d067af5"
    "title": "AWS Lambda announces Lambda Web Functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-lambda-web-functions/"
    "published": "2026-10-13 04:30:00"
    "fetched": "2026-10-13 08:26:39"
    "summary": "<p>AWS Lambda announces Lambda Web Functions, a new serverless compute primitive where your code handles HTTP requests directly. Your code listens on a port and handles requests as it would on any HTTP server. You use frameworks you already know, such as Express or Hono, with no adapters or custom configuration. This enables you to serve workloads such as AI inference endpoints, server-side rendered (SSR) web apps, streaming API endpoints, microservices, and webhooks. You pay for active CPU time and the memory your environment holds, not for idle CPU time your code spends waiting on databases or downstream services. With this launch, we are also renaming existing Lambda functions to Lambda Event Functions, a naming change only that requires no code changes or redeployments for your existing functions.</p>\n<p>Builders use Lambda to go from code to production quickly and without managing servers, across event-driven pipelines, request-response APIs, and data processing. As AI-driven development accelerates, they want to build locally and deploy with a familiar programming model and pay for workloads based on active CPU usage, while serving users with low latency. Lambda Web Functions delivers this. Today, Lambda Web Functions supports the Node.js runtime. A single warm execution environment can serve multiple concurrent requests, which reduces cold starts by orders of magnitude. You can stream results to clients incrementally with native HTTP streaming.</p>\n<p>You can create and configure Lambda Web Functions using the AWS Lambda API, <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html\">Agent Toolkit for AWS</a>, AWS Management Console, AWS CLI, AWS CloudFormation, AWS SAM, AWS CDK, or the AWS SDKs. With multi-Region routing, you can deploy once and serve each request from the Region closest to the end user. Web Functions support <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/web-functions-networking.html\">Amazon Virtual Private Cloud (VPC)</a> connectivity, allowing your function to access resources that exist within a VPC.</p>\n<p>Lambda Web Functions is available today in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). For the current list, see the <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region</a> page. To learn more, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/web-functions.html\">Lambda Web Functions developer guide</a>. For pricing details, see <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda Pricing</a>.  To see Lambda Web Functions in action, see the <a href=\"https://aws.amazon.com/blogs/aws/announcing-aws-lambda-web-functions-for-fast-consistent-web-app-performance-anywhere/\">AWS News Blog announcement</a>.</p>"
  "8a16ed4f8c494c4a307652ced161e269":
    "id": "8a16ed4f8c494c4a307652ced161e269"
    "title": "Announcing consumption-based pricing for short-term memory in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-memory-consumption-based-pricing"
    "published": "2026-10-13 01:00:00"
    "fetched": "2026-10-13 08:26:39"
    "summary": "<p><b>Announcing consumption-based pricing for short-term memory in Amazon Bedrock AgentCore</b></p>\n<p>Amazon Bedrock AgentCore memory now prices short-term memory (STM) based on the data your agents ingest, retrieve, and store, replacing the previous flat rate per event. AgentCore memory gives agents in-session context through short-term memory and persistent knowledge across sessions through long-term memory. With consumption-based pricing, developers building agents that write frequent, small events pay in proportion to what they use.</p>\n<p>STM is priced across three dimensions: ingestion at $1.00 per GB, retrieval at $0.20 per GB, and storage at $0.10 per GB-month. Ingestion and retrieval are billed per event with a 12 KB minimum and 64 KB maximum billable size, while storage is billed on each event's actual size. Most workloads see lower costs, with small-payload use cases seeing the largest reductions. You can manage storage costs by setting a shorter time to live (TTL) on your memory resources. Long-term memory pricing is unchanged.</p>\n<p>Consumption-based pricing for AgentCore Memory short-term memory is available in all AWS Regions where AgentCore Memory is offered. To get started, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">Amazon Bedrock AgentCore pricing page</a>.</p>"
  "0d15edb55a5c269130339575f50d53d1":
    "id": "0d15edb55a5c269130339575f50d53d1"
    "title": "Amazon CloudFront now supports AWS Lambda Web Functions as an origin"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudfront-lambda-web-functions-origin/"
    "published": "2026-10-13 08:10:00"
    "fetched": "2026-10-13 14:15:44"
    "summary": "<p>Starting today, you can deliver web applications built on AWS Lambda Web Functions through CloudFront's global edge network. &nbsp;</p>\n<p>With CloudFront in front of a Lambda Web Function, you get TLS termination at the edge for lower latency and faster connections, caching for better performance, and custom domains with managed TLS certificates. No changes to application code are needed. CloudFront Origin Access Control (OAC) restricts your Lambda Web Function so it's reachable only through CloudFront, so unintended requests that bypass your security protections do not reach your origin. With OAC in place, CloudFront's edge network protects your Lambda Web Function from network-layer DDoS attacks, and you can attach AWS WAF for additional application-layer security. For applications that authenticate their own users, OAC ensures that original credentials reach the application unchanged, so existing sign-in flows keep working.</p>\n<p>CloudFront support for AWS Lambda Web Functions is available worldwide, except in the CloudFront China region. To get started, use the CloudFront Console, SDK, CLI, or CloudFormation to configure your Lambda Web Function as a CloudFront origin. For more information, refer to the <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-lambda-web.html\" rel=\"noopener noreferrer\" target=\"_blank\">CloudFront Developer Guide</a>. There are no additional fees associated with this feature.</p>"
  "575cdfb1143d433505e166f3ebe9ad3f":
    "id": "575cdfb1143d433505e166f3ebe9ad3f"
    "title": "Amazon Connect Customer now prefills step-by-step guides for after contact work"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-prefills-guides-acw"
    "published": "2026-10-13 07:28:00"
    "fetched": "2026-10-13 14:15:44"
    "summary": "<p>Amazon Connect Customer can now fill in the step-by-step guides that agents complete after a contact, using information extracted from customer conversations, such as booking identifiers, claim numbers, and conversation summaries. Managers can set which information populates each form field. Agents can review and submit rather than manually typing in each field, saving time and improving data accuracy during after contact work.</p>\n<p>Contact center agents spend time after each contact entering frequently used information into a step-by-step guide. For example, an insurance agent who finishes a claims call might record the customer’s policy number, a summary of the call, and a disposition code. Now, managers can define rules for which information to extract from the conversation and which fields to automatically fill in the guide. The agent can then check the information, make any necessary corrections, and submit the guide, shortening after contact work and reducing data entry errors.</p>\n<p>You can use step-by-step guides with information extraction in the following AWS Regions: US East (N. Virginia), US West (Oregon), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), and Europe (London). Contact summaries are also available in Africa (Cape Town).</p>\n<p>To learn more and get started, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/integrate-views-conversational-analytics.html\">step-by-step guides</a> in the Amazon Connect Customer administrator guide.&nbsp;&nbsp;</p>"
  "410aee96ca43a5e436091b5e3ff91763":
    "id": "410aee96ca43a5e436091b5e3ff91763"
    "title": "Bring deep SageMaker AI expertise to your coding agent with the AWS AI/ML skill in the Agent Toolkit for AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/bring-sagemaker-ai-expertise-to-your-coding-agent/"
    "published": "2026-10-13 23:00:00"
    "fetched": "2026-10-14 05:02:49"
    "summary": "<p>Your coding agent can select, train, optimize and deploy models on Amazon SageMaker AI while working across the rest of your AWS environment in a single natural-language workflow. The AWS AI/ML skill is now a core skill in the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main\">Agent Toolkit for AWS</a>, so it works alongside the toolkit's other AWS skills like EC2, Bedrock, and more.</p>\n<p>We released the new AWS AI/ML skill on the Agent Toolkit for AWS. The toolkit is now the single, supported integration point, replacing the previous AWS Labs skills and plugins, with a consistent and easy install and update path. The skill is also pre-installed into SageMaker Studio JupyterLab for use with Kiro or your coding agent of choice.</p>\n<p>Moreover, we extended the SageMaker AI capability areas supported by skills.</p>\n<ul>\n <li>\n  <p><a href=\"https://aws.amazon.com/blogs/machine-learning/new-agent-skill-amazon-sagemaker-optimized-generative-ai-inference-for-your-coding-agent/\">Inference optimization</a>: optimize deployed models for latency, throughput, and cost</p>\n </li>\n <li>\n  <p><a href=\"https://builder.aws.com/content/3BRdZnv6dY63soyl4qn7FJMQdqd/agentic-model-customization-simplifying-fine-tuning-with-ai-guided-workflows-in-amazon-sagemaker-ai\">Model customization</a>: end-to-end guided fine-tuning workflows, from use case definition through training, evaluation and deployment</p>\n </li>\n <li>\n  <p>Serverful training for both traditional ML and generative AI</p>\n </li>\n <li>\n  <p>MLflow: experiment tracking and model lifecycle management</p>\n </li>\n <li>\n  <p>JumpStart model deployment and model recommendations: deploy pre-built JumpStart models and get guided recommendations on the right model for the use case</p>\n </li>\n <li>\n  <p>Processing jobs: data preparation and ETL on managed compute</p>\n </li>\n</ul>\n<p>The AWS AI/ML skill is available at no additional charge; you pay only for the AWS resources your agents use. To get started, install the skill from the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main\">Agent Toolkit for AWS</a> on GitHub, or use it pre-installed in SageMaker Studio JupyterLab. To learn more about <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-updated-jl-coding-assistant.html\">using a coding assistant with your SageMaker AI workflows</a>, see the Amazon SageMaker AI documentation.</p>"
  "e7187e7f01a560ecb6530ddbbadc3d13":
    "id": "e7187e7f01a560ecb6530ddbbadc3d13"
    "title": "AWS DataSync Enhanced mode now supports FSx for OpenZFS, NFS 4.2, and object metadata controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/datasync-enhanced-openzfs-nfs42-metadata/"
    "published": "2026-10-13 17:00:00"
    "fetched": "2026-10-14 05:02:49"
    "summary": "<p>AWS DataSync Enhanced mode now supports Amazon FSx for OpenZFS as a source or destination location, NFS version 4.2 for on-premises NFS servers and FSx for OpenZFS file systems, and a new ObjectMetadata option for object storage transfers. Previously, customers transferring data to or from FSx for OpenZFS were limited to Basic mode.</p>\n<p>NFS 4.2 lets you transfer data from NFS servers on the latest version without reconfiguring them to an older protocol version. The ObjectMetadata option gives you control over whether an object's user metadata is copied to the destination, which helps when destination metadata must stay intact, such as buckets served by AWS Storage Gateway, or when source metadata keys are not compatible with the destination, such as Azure Blob Storage. Existing tasks remain unaffected and continue to run as scheduled.</p>\n<p>These capabilities are available for Enhanced mode tasks in all AWS Regions where AWS DataSync Enhanced mode is supported. To learn more, visit the <a href=\"https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html\">AWS DataSync documentation</a>.</p>"
  "ff50d10546b7413823fa53425d606bd9":
    "id": "ff50d10546b7413823fa53425d606bd9"
    "title": "Amazon RDS now supports the latest CU for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-supports-latest-cu-microsoft-sql-server/"
    "published": "2026-10-13 16:30:00"
    "fetched": "2026-10-14 05:02:49"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server </a>now supports the latest Cumulative Updates (CU) for Microsoft SQL Server. This release includes support for Microsoft SQL Server 2025 CU8 <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2025/cumulative-update/kb5104822-cu8\" target=\"_blank\">KB5104822</a> (RDS version 17.00.4075.5.v1).\n <br />\n <br />\n For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5104822. We recommend that you upgrade your Amazon RDS for SQL Server instances to apply these updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can learn more about upgrading your database instance in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html\" target=\"_blank\">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft SQL Server DB engine</a>.\n <br /></p>"
"last_updated": "2026-10-14 05:02:49 JST"
