"overview": |
  この日は 29 件で、AWS Lambda Web Functions の発表、耐量子署名の実践、そして AI 主権とコンプライアンスの話題が中心でした。ニュースブログとサービス更新の両方で AWS Lambda Web Functions が発表されました。コードが HTTP リクエストを直接扱う新しいサーバーレスのコンピュートプリミティブで、ポートを listen して通常の HTTP サーバーと同じようにリクエストを処理でき、マルチコンカレントな実行と自動的なグローバル配信によって高速で一貫した応答を返します。Amazon CloudFront は Lambda Web Functions をオリジンとしてサポートするようになり、CloudFront のグローバルなエッジネットワーク経由で TLS 終端などを伴って Web アプリケーションを配信できます。セキュリティでは、耐量子署名に関する 2 部構成の記事が公開されました。パート 1 は「今収集し、後で偽造する」脅威に備え、AWS KMS・AWS Private CA・IAM Roles Anywhere を組み合わせて ML-DSA による耐量子のソフトウェアサプライチェーンを構築する方法で、ML-DSA の PKI 階層の構築から CI/CD パイプラインでのバイナリ・コンテナイメージ・SBOM への署名、デプロイ時の検証、SCP による予防的コントロールまでを扱います。パート 2 は組織の暗号アルゴリズムポリシーを AWS の予防的・発見的コントロールへ落とし込む方法で、ML-DSA-65 と ML-DSA-87 を承認し ML-DSA-44 を除外する例を用いて、kms:KeySpec 条件キーと SCP、IAM ポリシー、アクセス許可の境界、キーポリシーを組み合わせた多層防御を解説します。あわせて、Amazon GuardDuty 拡張脅威検出の攻撃シーケンスの検出結果に 5 つの新しいインジケーターが追加されました。Amazon Inspector・Amazon VPC Reachability Analyzer・Amazon Macie・AWS Security Hub から得られる脆弱性・悪意のあるパッケージ・到達可能性・設定ミス・機密データの情報を、弱いランタイムシグナルと相関付けるものです。AI 主権とガバナンスでは、データ主権と運用主権を基盤に、AI の出力において文化的規範・価値観・現地の言語を守るという考慮事項を加えた「AI 主権」の考え方が紹介されました。チップ・デプロイ先・モデルを自由に選べる AI スタック全体でのコントロールと選択肢、Meltemi や SEA-LION のような現地言語対応モデルの支援、AWS Nitro System による検証可能なデータアクセスのコントロールなどが取り上げられています。あわせて、コンプライアンスガイド「ISO/IEC 42001:2023 on AWS」が公開され、AI マネジメントシステム (AIMS) の設計・運用方法として ISO 42001:2023 の箇条 4〜10 と附属書 A の管理策を AWS サービスにマッピングし、AI ワークロードへの責任共有モデルの適用を解説しています。ISO/IEC 42005:2025 に基づく AI システム影響評価の概要と既存のリスク管理プロセスへの統合方法 (再評価のトリガーやトリアージを含む評価プロセスの構築、ISO/IEC 42001 認証取得との関係) も公開されました。機械学習ブログでは、マルチノードの Ray LLM Deep Learning Containers を使って 1 つの大規模言語モデルを Amazon EKS の 2 つの GPU ノードにまたがってデプロイし、prefill と decode のノードを分けて 1 つの OpenAI 互換エンドポイントの背後に置く方法、llama.cpp 用の AWS Deep Learning Container を使って Amazon SageMaker AI 上で意思決定モデルをデプロイし OpenAI 互換のチャット補完を提供する方法、そして OpenAI の GPT-6 Sol・Luna・Astra を Amazon Bedrock のグローバルなクロスリージョン推論でシンガポール・ジャカルタ・タイ・マレーシア・台北から利用する方法が公開されました。アーキテクチャブログでは、Bulk Executor for Amazon DynamoDB シリーズのパート 2 として、DynamoDB と AWS Glue を扱う中での設計上のトレードオフや想定外の挙動、回避策が共有され、VIPRE Security が機械学習とサーバーレスアーキテクチャでビジネスメール詐欺 (BEC) を止める AI 主導のメールセキュリティを AWS 上に構築した事例も紹介されました。サービス更新では、Amazon Bedrock AgentCore の短期メモリ (STM) が、エージェントが取り込み・取得するデータ量に基づく従量課金になりました。Amazon Route 53 Domains がプレミアムドメイン名の検索・登録・移管・更新・復旧に対応し、AWS DataSync の Enhanced モードが Amazon FSx for OpenZFS をソースまたは宛先として、オンプレミスの NFS サーバーと FSx for OpenZFS に対する NFS 4.2、そして新しい ObjectMetadata の制御に対応しました。Amazon RDS for SQL Server は Microsoft SQL Server 2025 CU8 を含む最新の累積更新に対応し、Amazon EC2 G7 インスタンス (NVIDIA RTX PRO 4500 Blackwell Server Edition GPU 搭載) がヨーロッパ (フランクフルト) とヨーロッパ (ストックホルム) で利用可能になりました。Amazon Connect Customer はコンタクト後の作業で担当者が記入する手順ガイドを、予約番号や請求番号といった会話から抽出した情報で事前入力するようになりました。開発支援では、Agent Toolkit for AWS の AWS AI/ML スキルによって、コーディングエージェントが単一の自然言語ワークフローの中で SageMaker AI 上のモデル選択・学習・最適化・デプロイを扱えるようになっています。日本のブログでは、ソニー銀行が勘定系システムの開発に AI エージェントを適用して基本設計から結合テストまでの開発期間を 30% 短縮した事例 (ソニー銀行株式会社および富士通株式会社監修)、Kiro のエンタープライズ向けサインイン制御の強化 (管理者が利用できるサインイン方法を決められるようになり、IAM Identity Center の利用を必須にしていても個人アカウントでサインインできてしまう状況を解消)、「フィジカル AI 開発支援プログラム by AWS ジャパン」第 2 期の応募受付開始、そして週刊 AWS と週刊生成 AI with AWS の 2026 年 10 月 5 日週号が公開されました。
