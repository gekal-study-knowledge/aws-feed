"overview": |
  この日は 28 件と多く、ポスト量子暗号と脅威検出のセキュリティ速報、Lambda の新しい実行形態、AI ガバナンスと AI 主権、それに生成 AI 関連の提供拡大が中心でした。英語記事の多くは同日に日本語版も公開されています。まずセキュリティでは、ポスト量子暗号への移行を扱う 2 部構成の記事が公開されました。前編はソフトウェアサプライチェーン攻撃の増加を背景に、署名アルゴリズムを RSA や楕円曲線から ML-DSA へ移すサプライチェーンの構築を扱い、後編は選んだ ML-DSA のアルゴリズムとパラメーターセットを組織のポリシーとして定め、SCP と IAM で非準拠の選択を防ぐ方法を示しています。Amazon GuardDuty Extended Threat Detection では、2026 年 5 月 20 日から攻撃シーケンスの検出結果に MALICIOUS_PACKAGE、MISCONFIGURATION、REACHABILITY、SENSITIVE_DATA、VULNERABILITY の 5 つの新しいインジケータータイプが付与されるようになりました。コンピュートでは AWS Lambda Web Functions が発表され、コードが直接 HTTP リクエストを処理する新しいサーバーレスの実行形態として、Express や Hono などのフレームワークをアダプターや独自設定なしでそのまま動かせます。AI 推論エンドポイントやサーバーサイドレンダリング、ストリーミング API、マイクロサービス、Webhook といった用途が想定され、課金はアクティブな CPU 時間と確保したメモリに対して行われ、データベース待ちなどのアイドル時間は対象外です。あわせて既存の Lambda 関数は Lambda Event Functions へ改称されますが、名称変更のみでコード変更や再デプロイは不要です。生成 AI 関連では、Amazon Bedrock AgentCore の短期メモリ (STM) の課金が、イベントごとの定額から取り込み・取得・保存のデータ量に応じた従量課金へ変更されました。取り込みが 1 GB あたり 1.00 USD、取得が 0.20 USD、保存が 1 GB 月あたり 0.10 USD で、取り込みと取得はイベントごとに最小 12 KB・最大 64 KB の課金サイズが適用されます。また、タイ、マレーシア、シンガポール、インドネシア、台湾のリージョンから、グローバルなクロスリージョン推論を通じて Amazon Bedrock 上の OpenAI GPT-6 Sol・Luna・Astra を利用する方法が紹介されました。インスタンスでは、NVIDIA RTX PRO 4500 Blackwell Server Edition GPU を搭載した Amazon EC2 G7 インスタンスが欧州 (フランクフルト) と欧州 (ストックホルム) で利用可能になりました。G6 比で AI 推論が最大 4.6 倍、グラフィックスが最大 2.1 倍の性能とされています。残りの 2 件は、いずれも AWS Machine Learning Blog による推論基盤の構築手順でした。1 つは llama.cpp 向けの AWS Deep Learning Container を使って Amazon SageMaker AI 上に意思決定モデルをデプロイする方法で、OpenAI 互換のチャット補完を提供したうえで、SemIf でランタイムを拡張し、CPU でも GPU でも宣言した選択肢に対する確率を返せるようにします。もう 1 つはマルチノード対応の Ray LLM Deep Learning Containers を用い、Amazon EKS 上で 1 つの大規模言語モデルを 2 つの GPU ノードにまたがって動かす構成で、prefill と decode をノードごとに分け、OpenAI 互換の単一エンドポイントの背後にまとめます。いずれも推論スタックを組み立てる代わりに、事前ビルド済みコンテナを設定するだけで済む点が共通しています。AI ガバナンス関連では、日本語ブログで国際規格に沿った取り組みが 3 本まとまって公開されました。1 本は ISO/IEC 42005:2025 に基づく AI システム影響評価の概要と既存のリスク管理プロセスへの統合方法で、再評価のトリガーやトリアージを含む評価プロセスの作り方、ISO/IEC 42001 認証取得における ISO/IEC 42005 の位置づけ、AWS Well-Architected Responsible AI Lens などの支援ツールを扱っています。もう 1 本はコンプライアンスガイド「ISO/IEC 42001:2023 on AWS」の公開で、ISO 42001:2023 の箇条 4〜10 と附属書 A の管理策を AWS サービスにマッピングし、AI ワークロードへの責任共有モデルの適用、エビデンス収集の自動化、Infrastructure as Code による AI コンプライアンス活動の運用組み込みを解説します。3 本目は AI 主権を扱ったもので、データ主権と運用主権を土台に、AI の出力において文化的規範や価値観、現地の言語を守るという観点を加えた概念として整理し、チップ・デプロイ先・モデルを選べること、Meltemi や SEA-LION といった現地語対応モデルの支援、AWS Nitro System による検証可能なデータアクセス制御、ISO/IEC 42001 認証による透明性を挙げています。コンピュートとネットワークでは、Amazon CloudFront が AWS Lambda Web Functions をオリジンとしてサポートしました。エッジでの TLS 終端やキャッシュ、マネージド証明書によるカスタムドメインがアプリケーションのコード変更なしで使え、Origin Access Control (OAC) によって Lambda Web Function を CloudFront 経由のみ到達可能に制限できます。データ転送では AWS DataSync の Enhanced モードが Amazon FSx for OpenZFS をソースまたは宛先として扱えるようになり、オンプレミスの NFS サーバーと FSx for OpenZFS に対する NFS 4.2、オブジェクトストレージ転送向けの ObjectMetadata オプションも追加されました。従来 FSx for OpenZFS は Basic モードに限られていました。データベースでは Amazon RDS for SQL Server が最新の累積更新に対応し、Microsoft SQL Server 2025 CU8 KB5104822 (RDS バージョン 17.00.4075.5.v1) が利用できます。コンタクトセンターでは Amazon Connect Customer が、通話後に担当者が記入するステップバイステップガイドを会話から抽出した情報 (予約 ID、請求番号、会話の要約など) で自動入力できるようになり、管理者がフィールドごとに何を埋めるか設定できます。開発者向けには、Agent Toolkit for AWS のコアスキルとして AWS AI/ML スキルが追加され、コーディングエージェントが Amazon SageMaker AI でのモデル選択・学習・最適化・デプロイを、EC2 や Bedrock など他の AWS スキルと同じ自然言語のワークフローの中で扱えるようになりました。従来の AWS Labs のスキルやプラグインはこのツールキットに統合され、SageMaker Studio JupyterLab には事前インストールされます。Kiro については、管理対象デバイスでのサインイン方法を管理者が制御できるようになりました。これまでは組織として IAM Identity Center の利用を必須にしていても、ユーザーが個人アカウント (Google、GitHub、Builder ID) でサインインできてしまっていました。アーキテクチャ事例では、VIPRE Security がビジネスメール詐欺 (BEC) を止めるための AI 主導のメールセキュリティを AWS 上に構築した例が紹介され、Amazon ECS、Amazon SQS、Amazon S3 を使ったサーバーレス構成と機械学習で、MX レコードを変更せずに巧妙な なりすましをリアルタイムに検知・遮断します。また Bulk Executor for Amazon DynamoDB シリーズの後編では、DynamoDB と AWS Glue を組み合わせてツールを作る際の設計上のトレードオフや想定外の挙動、回避策が共有されています。国内事例では、ソニー銀行が勘定系システムの開発に AI エージェントを適用し、基本設計から結合テストまでの開発期間を 30% 短縮した取り組みが公開されました。あわせて「フィジカル AI 開発支援プログラム by AWS ジャパン」第 2 期の応募受付開始、週刊 AWS (2026/10/05 週) と週刊生成 AI with AWS (2026/10/5 週) も掲載されています。
