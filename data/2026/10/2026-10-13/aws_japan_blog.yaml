"entries":
  "b15f910c17abf6759c5db93392033145":
    "id": "b15f910c17abf6759c5db93392033145"
    "title": "責任ある AI ガバナンス: お客様が ISO/IEC 42005:2025 との整合を図れるよう AWS が支援する方法"
    "link": "https://aws.amazon.com/jp/blogs/news/responsible-ai-governance-how-aws-positions-customers-to-align-with-iso-iec-420052025/"
    "published": "2026-10-13 10:19:29"
    "fetched": "2026-10-13 14:15:45"
    "summary": "生成 AI の導入が急速に進む中、組織には責任ある AI ガバナンスへの体系的なアプローチが求められています。本記事では、国際規格 ISO/IEC 42005:2025 に基づく AI システム影響評価の概要と、既存のリスク管理プロセスへの統合方法を解説します。再評価のトリガーやトリアージを含む評価プロセスの構築方法も取り上げます。また、ISO/IEC 42001 認証の取得における ISO/IEC 42005 の役割や、AWS Well-Architected Responsible AI Lens をはじめとする規格との整合を支援する AWS のツールも紹介します。"
  "006781f575ca73790da6b07c8f851771":
    "id": "006781f575ca73790da6b07c8f851771"
    "title": "新しいコンプライアンスガイド「ISO/IEC 42001:2023 on AWS」を公開 – AI マネジメントシステムの設計と運用を支援"
    "link": "https://aws.amazon.com/jp/blogs/news/new-compliance-guide-available-iso-iec-420012023-on-aws/"
    "published": "2026-10-13 10:14:41"
    "fetched": "2026-10-13 14:15:45"
    "summary": "AWS は、コンプライアンスガイド「ISO/IEC 42001:2023 on AWS」を公開しました。このガイドでは、AWS サービスを使用して AI マネジメントシステム (AIMS) を設計、運用する方法を説明します。ISO 42001:2023 の箇条 4～10 と附属書 A の管理策を AWS サービスにマッピングし、AI ワークロードへの AWS 責任共有モデルの適用方法も解説します。エビデンス収集の自動化や、Infrastructure as Code を活用して AI コンプライアンス活動を運用に組み込む方法も取り上げ、AI ガバナンスの強化と認証審査への準備を支援します。"
  "73fe8a7211c045b3acfbc7c7c6af73f9":
    "id": "73fe8a7211c045b3acfbc7c7c6af73f9"
    "title": "AWS で実現する AI 主権"
    "link": "https://aws.amazon.com/jp/blogs/news/enabling-ai-sovereignty-on-aws/"
    "published": "2026-10-13 10:11:05"
    "fetched": "2026-10-13 14:15:45"
    "summary": "AI 主権は、データ主権と運用主権を基盤に、AI の出力で文化的規範や価値観、現地の言語を守るという新たな考慮事項を加えた概念です。本記事では、チップ、デプロイ先、モデルを自由に選べる AI スタック全体でのコントロールと選択肢を紹介します。また、Meltemi や SEA-LION などの現地の言語に対応したモデルの支援、AWS Nitro System による検証可能なデータアクセスのコントロール、ISO/IEC 42001 認証による透明性と保証についても説明します。"
