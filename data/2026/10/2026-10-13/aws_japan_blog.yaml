  "c90aaa701a5fba416f16f73c0b1d03e2":
    "id": "c90aaa701a5fba416f16f73c0b1d03e2"
    "title": "エンタープライズ向けサインイン制御を強化しました"
    "link": "https://aws.amazon.com/jp/blogs/news/sign-in-controls/"
    "published": "2026-10-13 19:59:53"
    "fetched": "2026-10-13 22:27:43"
    "summary": "これまで、管理対象デバイスでエンタープライズユーザーが Kiro にどの方法でサインインするかを制御する手段はありませんでした。組織として IAM Identity Center の利用を必須にしていても、ユーザーは個人アカウント（Google、GitHub、Builder ID）で Kiro にサインインできてしまっていました。Kiro では、利用できるサインイン方法を管理者が決められるようになりました。ユーザーには組織が許可した選択肢だけが表示されます。"
  "d8d2c4480b9ea7447b3f0025fba489d5":
    "id": "d8d2c4480b9ea7447b3f0025fba489d5"
    "title": "GuardDuty 拡張脅威検出に 5 つの新しいインジケーターを追加: 攻撃シーケンスの検出を強化"
    "link": "https://aws.amazon.com/jp/blogs/news/guardduty-extended-threat-detection-has-added-five-new-indicators-to-surface-attack-sequences/"
    "published": "2026-10-13 17:52:20"
    "fetched": "2026-10-13 22:27:43"
    "summary": "Amazon GuardDuty 拡張脅威検出の攻撃シーケンスの検出結果に、5 つの新しいインジケーターが追加されました。Amazon Inspector、Amazon VPC Reachability Analyzer、Amazon Macie、AWS Security Hub から得られる脆弱性、悪意のあるパッケージ、到達可能性、設定ミス、機密データの情報を、弱いランタイムシグナルと相関付けます。これにより、ノイズは重要度が CRITICAL の対応可能な検出結果に変わります。この記事では、Amazon EKS と Amazon EC2 での実例に加えて、EPSS を重視した優先順位付けによるインシデント対応の手順を解説します。"
  "b1498a0dfdfcdc189681266ff4e4a9d4":
    "id": "b1498a0dfdfcdc189681266ff4e4a9d4"
    "title": "AWS における耐量子署名、パート 2: SCP と IAM による ML-DSA アルゴリズムポリシーの強制"
    "link": "https://aws.amazon.com/jp/blogs/news/quantum-resistant-signing-on-aws-part-2-enforce-your-ml-dsa-algorithm-policy-with-scps-and-iam/"
    "published": "2026-10-13 17:01:10"
    "fetched": "2026-10-13 22:27:43"
    "summary": "この記事では、組織の暗号アルゴリズムポリシーを AWS の予防的コントロールと発見的コントロールに変換する方法を紹介します。ML-DSA-65 と ML-DSA-87 を承認し、ML-DSA-44 を除外する例を用いて、kms:KeySpec 条件キーと SCP、IAM ポリシー、アクセス許可の境界、キーポリシーを組み合わせた多層防御を解説します。AWS Private CA や TLS 証明書に対するプロビジョニング制御、AWS CloudTrail と AWS Config によるドリフト検出、暗号アジリティを実現する設計のポイントも説明します。"
  "4637065a67015165cebda36d9d82e3b2":
    "id": "4637065a67015165cebda36d9d82e3b2"
    "title": "AWS における耐量子署名、パート 1: ML-DSA によるソフトウェアサプライチェーンの構築"
    "link": "https://aws.amazon.com/jp/blogs/news/quantum-resistant-signing-on-aws-part-1-build-a-software-supply-chain-with-ml-dsa/"
    "published": "2026-10-13 16:59:14"
    "fetched": "2026-10-13 22:27:43"
    "summary": "「今収集し、後で偽造する」脅威に備え、AWS KMS、AWS Private CA、IAM Roles Anywhere を組み合わせて、ML-DSA による耐量子ソフトウェアサプライチェーンを構築する方法を紹介します。ML-DSA PKI 階層の構築から、CI/CD パイプラインでのバイナリ、コンテナイメージ、SBOM への署名、デプロイ時の検証、SCP による予防的コントロールまでを解説します。さらに、CNSA 2.0 や EU サイバーレジリエンス法の期限に向けた推奨アクションもまとめます。"
  "ee890cda0b41a1b773065f6e47ba4f4f":
    "id": "ee890cda0b41a1b773065f6e47ba4f4f"
    "title": "週刊AWS – 2026/10/05週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20261005/"
    "published": "2026-10-13 15:26:21"
    "fetched": "2026-10-13 22:27:43"
    "summary": "Amazon Nova 2.5 Sonic が GA、Claude Haiku 5.5 が AWS で利用可能に、Amazon GuardDuty RDS Protection が Aurora / RDS のデータ流出と破壊を検知、AWS Security Hub が検出結果の S3 エクスポートに対応など"
  "0b570f48433fdd283017722c8e8a6286":
    "id": "0b570f48433fdd283017722c8e8a6286"
    "title": "週刊生成AI with AWS – 2026/10/5 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20261005/"
    "published": "2026-10-13 15:17:46"
    "fetched": "2026-10-13 22:27:43"
    "summary": "今回の週刊生成 AI with AWSでは、Claude Haiku 5.5 や Amazon Nova 2.5 Sonic など、新モデルの提供開始が相次いだ 1 週間でした。 Claude Code on Amazon Bedrock を非エンジニア中心に全社展開したアテナ様の事例や、Kiro CLI V3 への切り替え案内もまとめています。 Amazon Bedrock の自動推論チェックを扱う記事 や、AI エージェントに移行作業を任せる AI Modernization Flow など今週も盛りだくさんです。"
