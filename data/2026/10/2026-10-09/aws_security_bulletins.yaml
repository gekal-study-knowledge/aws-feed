    "title": "CVE-2026-107332 - Insecure default file permissions on cached credentials in AWS Toolkit for Visual Studio Code"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-129-aws/"
    "published": "2026-10-09 02:43:09"
    "fetched": "2026-10-09 07:48:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-129-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/08/2026 10:30 PM PDT</p>\n<p><b>Description:</b></p>\n<p>AWS Toolkit for Visual Studio Code is an open source extension that lets developers work with AWS services, including Amazon CodeCatalyst, from within Visual Studio Code. We identified CVE-2026-107332, an issue in the CodeCatalyst connection handler. When a user connected to a CodeCatalyst Dev Environment, the extension cached the user's CodeCatalyst bearer token to a file with world-readable permissions and did not remove the file after the session ended. A local user or process on the same machine with access to the file system was able to read this file and obtain the bearer token.</p>\n<p><b>Impacted versions:</b> &lt; 4.10.0</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "1a51709b89816902b56032727847b60a":
    "id": "1a51709b89816902b56032727847b60a"
    "title": "CVE-2026-107322 - OS command injection in Amazon Agent Plugins for AWS databases-on-aws"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-130-aws/"
    "published": "2026-10-09 04:29:19"
    "fetched": "2026-10-09 07:48:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-130-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/08/2026 11:30 AM PDT</p>\n<p><b>Description:</b></p>\n<p>Amazon Agent Plugins for AWS is an open source collection of plugins that extends supported AI coding agents with AWS-focused workflows and tool integrations. The databases-on-aws plugin provides database design, development, migration, and operational guidance, including Aurora DSQL helper scripts.</p>\n<p>We identified CVE-2026-107322, where an incomplete list of disallowed inputs in databases-on-aws versions before 1.7.1 could allow a remote unauthenticated actor to supply crafted content that an agent ingests. The affected code is not a listening network service; operating-system command execution on the host is possible only if the agent subsequently invokes the local helper with the crafted database command value. Any resulting command runs with the permissions of the process running the helper. This issue does not affect the Aurora DSQL service or bypass database privileges.</p>\n<p><b>Impacted versions:</b> databases-on-aws versions 1.0.0 through 1.7.0</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "7c72fdebf73e0af9c882a57d60c3ae71":
    "id": "7c72fdebf73e0af9c882a57d60c3ae71"
    "title": "CVE-2026-107608: Improper link resolution in asset bundling output handling in aws-cdk-lib"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-131-aws/"
    "published": "2026-10-09 04:44:26"
    "fetched": "2026-10-09 07:48:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-131-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/08/2026 12:30 PM PDT</p>\n<p><b>Description:</b></p>\n<p>AWS CDK is an open source framework that allows customers to build cloud infrastructure using their favorite programming language (Python, Typescript, C#, Go). That infrastructure is then able to be deployed with AWS CDK command line commands to AWS CloudFormation. We identified CVE-2026-107608, which is an issue where Docker files could be configured to insert symlinked files into the output of the AWS CDK asset bundling process when it was invoked with a Docker file. When bundling an asset using AWS CDK with a docker file, prior to 2.267.0, it was possible for a docker file to insert a symlinked file or directory into the output of asset bundling without the symlink having been provided as input to the bundling process.</p>\n<p><b>Impacted versions:</b> All aws-cdk-lib versions before 2.267.0</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
