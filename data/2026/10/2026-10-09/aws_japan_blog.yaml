  "5063c47bb257730bfc115c1c66c32c4f":
    "id": "5063c47bb257730bfc115c1c66c32c4f"
    "title": "AI を活用した脆弱性検出ハーネス (パート 2 設定編): ステアリングファイルで実現する証拠ベースの脆弱性トリアージ"
    "link": "https://aws.amazon.com/jp/blogs/news/configuring-your-ai-vulnerability-harness-part-2-the-steering-file/"
    "published": "2026-10-09 12:37:58"
    "fetched": "2026-10-09 18:57:44"
    "summary": "AI モデルに経験豊富なセキュリティアナリストと同等の一貫性で脆弱性トリアージを実行させる、ステアリングファイルの設計と使い方を紹介します。重要な 5 つのセクションとして、構造的検証によるハルシネーションの抑制、証拠ベースの信頼度スコアリング、AWS WAF などの補完的コントロールを考慮したインフラストラクチャの評価、CISA KEV や EPSS を活用した脅威インテリジェンスの統合、P0～P3 の優先度分類を解説します。検証結果に加え、Kiro や Claude Code での導入方法も説明します。"
  "d87da76f99a4efa6908e9675c5efc608":
    "id": "d87da76f99a4efa6908e9675c5efc608"
    "title": "AI を活用した脆弱性検出ハーネス (パート 1 構築編): 3 層パイプラインによる検出結果の絞り込み"
    "link": "https://aws.amazon.com/jp/blogs/news/building-your-ai-vulnerability-harness-part-1/"
    "published": "2026-10-09 12:30:05"
    "fetched": "2026-10-09 18:57:44"
    "summary": "脆弱性スキャナーの検出結果は、手動のトリアージでは処理しきれないほど増え続けています。この記事では、AI を活用した脆弱性検出ハーネスを紹介します。複数スキャナー間の一致、AST による構造検証、IaC テンプレートを用いたデプロイコンテキストの 3 層で検出結果をフィルタリングし、悪用可能性の証拠を備えた優先順位付きの少数の検出結果に絞り込みます。パイプラインの構築から得られた 4 つの原則と、段階的な導入手順も解説します。"
