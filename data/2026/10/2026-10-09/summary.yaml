"overview": |
  この日は 5 件で、セキュリティ速報が 3 件と、SageMaker HyperPod の共有、エージェントの従量課金でした。セキュリティ速報の 1 件目は、AWS Toolkit for Visual Studio Code でキャッシュされた認証情報のファイル権限が安全でなかった問題です (CVE-2026-107332、Bulletin ID 2026-129-AWS、公開日は 2026 年 10 月 8 日)。この拡張機能は Visual Studio Code の中から Amazon CodeCatalyst を含む AWS サービスを扱えるようにするもので、CodeCatalyst の接続ハンドラーに問題がありました。利用者が CodeCatalyst Dev Environment に接続すると、拡張機能が CodeCatalyst のベアラートークンを誰でも読めるファイル権限で保存し、セッション終了後もそのファイルを削除していなかったため、同じマシン上でファイルシステムにアクセスできるローカルのユーザーやプロセスがこのファイルを読んでトークンを取得できました。影響を受けるのは 4.10.0 より前のバージョンです。2 件目は Amazon Agent Plugins for AWS の databases-on-aws プラグインにおける OS コマンドインジェクションです (CVE-2026-107322、Bulletin ID 2026-130-AWS)。このプラグイン群は AI コーディングエージェントに AWS 向けのワークフローとツール統合を足すオープンソースのコレクションで、databases-on-aws はデータベースの設計・開発・移行・運用の指針と Aurora DSQL のヘルパースクリプトを提供します。1.7.1 より前のバージョンで許可しない入力のリストが不完全だったため、リモートの未認証の第三者が、エージェントが取り込む細工されたコンテンツを与えられる可能性がありました。該当するコードはネットワークを待ち受けるサービスではなく、ホストでの OS コマンドの実行は、エージェントがその後に細工されたデータベースコマンドの値でローカルのヘルパーを呼び出した場合にのみ起こります。実行されるコマンドはヘルパーを動かしているプロセスの権限で動き、Aurora DSQL のサービス自体やデータベースの権限の回避には影響しません。影響を受けるのは 1.0.0 から 1.7.0 です。3 件目は aws-cdk-lib のアセットバンドルの出力処理におけるリンク解決の不備です (CVE-2026-107608、Bulletin ID 2026-131-AWS)。Docker ファイルを指定して AWS CDK でアセットをバンドルする際、2.267.0 より前のバージョンでは、バンドル処理の入力としてシンボリックリンクを与えていなくても、Docker ファイルがシンボリックリンクのファイルやディレクトリをバンドルの出力に差し込めてしまう状態でした。影響を受けるのは 2.267.0 より前のすべての aws-cdk-lib です。機械学習では、1 つの Amazon SageMaker HyperPod の EKS クラスターを複数チームで安全に共有するリファレンスアーキテクチャが示されました。認証に AWS IAM Identity Center、分離にチームごとの SageMaker ドメインと Kubernetes の名前空間、公平性に HyperPod Task Governance、チャージバックに名前空間単位のコスト配分を使う構成です。エージェントの決済では、Amazon Bedrock AgentCore payments によって AI エージェントが必要に応じてサービスの代金を支払うマネージドな手段を得られ、支出の上限はインフラ側で強制されます。記事では Incarna のエージェントが x402 を使ってモデル推論の代金を 1 リクエストずつ BlockRun へ支払う仕組みと、x402 の決済対応を足す作業が数か月から数日に縮んだことが紹介されています。
