"overview": |
  この日は 17 件で、セキュリティ速報が 3 件と、脆弱性トリアージのハーネス、そしてモデルとコスト管理のサービス更新が中心でした。セキュリティ速報の 1 件目は、AWS Toolkit for Visual Studio Code でキャッシュされた認証情報のファイル権限が安全でなかった問題です (CVE-2026-107332、Bulletin ID 2026-129-AWS、公開日は 2026 年 10 月 8 日)。この拡張機能は Visual Studio Code の中から Amazon CodeCatalyst を含む AWS サービスを扱えるようにするもので、CodeCatalyst の接続ハンドラーに問題がありました。利用者が CodeCatalyst Dev Environment に接続すると、拡張機能が CodeCatalyst のベアラートークンを誰でも読めるファイル権限で保存し、セッション終了後もそのファイルを削除していなかったため、同じマシン上でファイルシステムにアクセスできるローカルのユーザーやプロセスがこのファイルを読んでトークンを取得できました。影響を受けるのは 4.10.0 より前のバージョンです。2 件目は Amazon Agent Plugins for AWS の databases-on-aws プラグインにおける OS コマンドインジェクションです (CVE-2026-107322、Bulletin ID 2026-130-AWS)。このプラグイン群は AI コーディングエージェントに AWS 向けのワークフローとツール統合を足すオープンソースのコレクションで、databases-on-aws はデータベースの設計・開発・移行・運用の指針と Aurora DSQL のヘルパースクリプトを提供します。1.7.1 より前のバージョンで許可しない入力のリストが不完全だったため、リモートの未認証の第三者が、エージェントが取り込む細工されたコンテンツを与えられる可能性がありました。該当するコードはネットワークを待ち受けるサービスではなく、ホストでの OS コマンドの実行は、エージェントがその後に細工されたデータベースコマンドの値でローカルのヘルパーを呼び出した場合にのみ起こります。実行されるコマンドはヘルパーを動かしているプロセスの権限で動き、Aurora DSQL のサービス自体やデータベースの権限の回避には影響しません。影響を受けるのは 1.0.0 から 1.7.0 です。3 件目は aws-cdk-lib のアセットバンドルの出力処理におけるリンク解決の不備です (CVE-2026-107608、Bulletin ID 2026-131-AWS)。Docker ファイルを指定して AWS CDK でアセットをバンドルする際、2.267.0 より前のバージョンでは、バンドル処理の入力としてシンボリックリンクを与えていなくても、Docker ファイルがシンボリックリンクのファイルやディレクトリをバンドルの出力に差し込めてしまう状態でした。影響を受けるのは 2.267.0 より前のすべての aws-cdk-lib です。機械学習では、1 つの Amazon SageMaker HyperPod の EKS クラスターを複数チームで安全に共有するリファレンスアーキテクチャが示されました。認証に AWS IAM Identity Center、分離にチームごとの SageMaker ドメインと Kubernetes の名前空間、公平性に HyperPod Task Governance、チャージバックに名前空間単位のコスト配分を使う構成です。エージェントの決済では、Amazon Bedrock AgentCore payments によって AI エージェントが必要に応じてサービスの代金を支払うマネージドな手段を得られ、支出の上限はインフラ側で強制されます。記事では Incarna のエージェントが x402 を使ってモデル推論の代金を 1 リクエストずつ BlockRun へ支払う仕組みと、x402 の決済対応を足す作業が数か月から数日に縮んだことが紹介されています。セキュリティでは、AI を活用した脆弱性検出ハーネスの日本語記事が 2 部で公開されました。パート 1 の構築編は、複数スキャナー間の一致、AST による構造検証、IaC テンプレートを使ったデプロイコンテキストという 3 層で検出結果を絞り込み、悪用可能性の証拠を備えた優先順位付きの少数の結果にするパイプラインで、構築から得られた 4 つの原則と段階的な導入手順も解説されています。パート 2 の設定編はステアリングファイルの設計と使い方で、構造的検証によるハルシネーションの抑制、証拠ベースの信頼度スコアリング、AWS WAF などの補完的コントロールを踏まえたインフラの評価、CISA KEV や EPSS を活用した脅威インテリジェンスの統合、P0 から P3 の優先度分類という 5 つのセクションを扱い、Kiro や Claude Code での導入方法も示しています。あわせて、Agent Skills で Amazon Bedrock の自動推論ポリシーのライフサイクルをコーディングエージェントからコードで実行する方法も公開されました。builder や validator など 6 つのスキルの役割と構成を紹介し、育児休暇ポリシーを例に構築からデプロイ、検証までを順に解説し、SATISFIABLE という判定の解釈といった教訓にも触れています。モデルでは、OpenAI の GPT-6.1 Sol が Amazon Bedrock で Ultrafast モードに対応しました。速度が最も重要なワークロード向けに高速な推論を提供するもので、リアルタイムのコーディングアシスタント、対話的なエージェント、顧客に向き合う体験のようにレイテンシーに敏感な用途に向きます。TwelveLabs Pegasus 1.5 も Amazon Bedrock で利用可能になりました。動画から構造化された時刻付きのメタデータを生成する動画からテキストへのモデルで、これまでは大きな動画ライブラリで特定の場面を探すには、尋ねる前にどこを見ればよいか分かっている必要がありました。Pegasus 1.5 は動画全体を読んで何がいつ起きたかをラベル付けし、映像をアプリケーションから問い合わせられるデータに変えます。編集上のセグメント、話者の交代、スポーツのプレー、ブランドの登場のように業務上の関心を定義すると、該当する場面をタイムスタンプ付きで返し、見えるもの・聞こえるもの・画面上の文字を 1 回の処理で分析するため、事前のインデックス作成や取り込みのパイプラインを作る必要がありません。Anthropic の Claude Sonnet 5.5 と Claude Opus 5.5 は、AWS GovCloud (US) リージョンの Kiro の IDE と CLI で利用可能になりました。Opus 5.5 はこれまでで最も高性能な Opus で、長時間のエージェント型のコーディング作業で Opus 5 から一段進歩しており、リクエストごとに適応的に考えてタスクに必要な労力を自ら決め、Kiro の社内ベンチマーキングでは Opus 5 に比べてツール呼び出しが約 40% 少なく、トークンは約半分でタスクを完了します。1M のコンテキストウィンドウで、クレジットの倍率は Opus 5 の 2.2 倍から 2.0 倍に下がっています。Sonnet 5.5 はこれまでで最も高速な Sonnet で、出力は 30% 以上速くなっています。コスト管理では、AWS Cost Explorer、AWS Budgets、AWS Cost Management Dashboards が Amazon Bedrock の製品属性に対応しました。Bedrock のコストをモデル、モデルプロバイダ、推論タイプ、機能に分解する新しいディメンションで、Cost Explorer とダッシュボードではこれらの属性でグループ化とフィルタができ、Budgets では同じ属性で予算を絞り込めます。財務とプラットフォームのチームが、どのモデルとワークロードが Bedrock の支出を押し上げているかを、すでに使っている請求のツールの中で直接見て手を打てるようになります。データベースでは、Amazon RDS for Oracle がマイナーバージョンアップグレードの事前チェックを利用者自身で実行できるようになり、アップグレードの開始前やメンテナンスウィンドウの前に確認できるようになりました。あわせてパッチ適用中に、DB インスタンスが再び接続を受け付けるようになったことを知らせる新しいイベントが発行されるようになり、残りのメンテナンス作業が進んでいる間にアプリケーションを戻せるため、パッチ適用時のアプリケーションのダウンタイムを減らせます。ネットワークでは、AWS Network Firewall がコンテナ属性に基づく検査フィルタでワイルドカードの一致に対応しました (Amazon EKS と Amazon ECS)。app=payments-* のようなパターンで payments-api・payments-worker・payments-cron といった派生をまとめて対象にできるため、派生が頻繁に増える動的なコンテナ環境でのルール管理が簡単になります。開発基盤では、Amazon SageMaker Unified Studio がカスタムの Tooling ブループリントに対応し、ドメイン管理者が自分の AWS CloudFormation テンプレートでプロジェクトの土台を定義できるようになりました。会社の命名規則に沿った IAM ロール名や、AWS 管理ポリシーの代わりのカスタムの権限境界といった組織固有の要件に合わせられます。コンピュートブログでは、大規模な強化学習が数千の隔離されたロールアウトのサンドボックスを並列に動かすことを踏まえ、Amazon EC2 のメタルインスタンス上で Firecracker のマイクロ VM の密度をチューニングする方法と、自分のレイテンシーと密度の曲線を描くためのハーネスである labsweep が紹介されました。日本のブログではさらに、自治体のためのクラウドコスト最適化シリーズの第 3 回 (予算要求・執行・決算の実務) と、公共向けの AWS WAF 実践ワークショップの開催報告が公開されました。
