  "620ab5d5f5bf4997bb88bdab1714b748":
    "id": "620ab5d5f5bf4997bb88bdab1714b748"
    "title": "OpenAI GPT-6.1 Sol now supports Ultrafast mode on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-sol-ultrafast-amazon/"
    "published": "2026-10-09 04:41:00"
    "fetched": "2026-10-09 11:43:23"
    "summary": "<p>Today, AWS announces the availability of Ultrafast mode for GPT-6.1 Sol from OpenAI on Amazon Bedrock.&nbsp;Ultrafast mode provides faster inference for workloads where speed matters most. The Amazon Bedrock inference engine delivers the performance, security, and reliability required for production workloads.</p>\n<p>Use GPT-6.1 Sol&nbsp;Ultrafast for latency-sensitive applications such as real-time coding assistants, interactive agents, and customer-facing experiences that require fast, high-quality responses. GPT-6.1 Sol helps developers build features, debug issues, investigate complex codebases, and complete multistep workflows. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.</p>\n<p>You can get started in the <a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\">Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported AWS Regions, endpoints, APIs, features, inference profiles, and pricing, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-1-sol.html\">Amazon Bedrock documentation</a>.</p>"
  "9e8a1d07c372cb430e9eb496799e779b":
    "id": "9e8a1d07c372cb430e9eb496799e779b"
    "title": "AWS Cost Explorer, Budgets, and Dashboards now support Amazon Bedrock product attributes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-bedrock-attributes-in-cost-explorer/"
    "published": "2026-10-09 03:51:00"
    "fetched": "2026-10-09 11:43:23"
    "summary": "<p>AWS Cost Explorer, AWS Budgets, and AWS Cost Management Dashboards now let you analyze Amazon Bedrock costs by product attributes, a new dimension that breaks down Bedrock cost by model, model provider, inference type, and feature. In Cost Explorer and Dashboards, you can group and filter costs by these attributes. In Budgets, you can filter budgets by the same attributes.</p>\n<p>With this launch, finance and platform teams get a direct view of which models and workloads drive their Bedrock spend, and can act on it in the billing tools they already use. The attributes include model (such as Claude Sonnet 5 or Claude Haiku 4.5), model provider (such as Anthropic or Cohere), inference type (such as input tokens or output tokens), and feature (such as on-demand inference or reranker). You can combine product attributes with cost allocation tags on application inference profiles, projects, or workspaces to see which applications drive spend on each model, and with IAM principal tags to see which users or roles drive it. Group a month of Bedrock spend by model in Cost Explorer to find your most expensive models, build a dashboard widget that tracks cost per provider, or set a budget that alerts on spend for a single model.</p>\n<p>The Amazon Bedrock product attribute dimension is available today at no additional charge in all AWS Regions, excluding the AWS GovCloud (US) Regions and the China (Beijing) and China (Ningxia) Regions. To learn more, see the user guides for&nbsp;<a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">Cost Explorer</a>, <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html\">Budgets</a>, and <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/dashboards.html\">Dashboards</a>.</p>"
  "bc801ca24e14cadd17842ef581ff1253":
    "id": "bc801ca24e14cadd17842ef581ff1253"
    "title": "Amazon RDS for Oracle now supports minor version upgrade prechecks and a new RDS event to help reduce patching downtime"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-oracle-minor-version-upgrade-precheck-new-patching-rds-event/"
    "published": "2026-10-09 03:00:00"
    "fetched": "2026-10-09 11:43:23"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> now lets you run a minor version upgrade precheck yourself, before you start an upgrade or before your scheduled maintenance window. RDS for Oracle now also emits a new event during patching that tells you when your DB instance is accepting connections again. With this event, you can bring your applications back while the remaining maintenance tasks are still in progress, which can reduce your application downtime during patching.</p>\n<p>At the start of every minor version upgrade, RDS for Oracle checks for conditions that would prevent the upgrade from completing, such as insufficient free storage, invalid Oracle-maintained objects, or invalid triggers. If a check finds a problem, the upgrade stops, and you must fix the problem and schedule the upgrade again. Previously, these checks ran only as part of the upgrade itself. With the new rdsadmin.rdsadmin_precheck_tasks.precheck_minor_upgrade procedure, you can run the checks at any time. The precheck is read-only and doesn't affect your workload. It reports every issue it finds in a single log so you can fix them and run the precheck again until it passes before your maintenance window.</p>\n<p>During a minor version upgrade or an operating system update, RDS for Oracle now emits RDS-EVENT-0596 as soon as your DB instance is accepting connections. Any remaining maintenance tasks then complete while your database is online. You can subscribe to this event through Amazon RDS event notifications or Amazon EventBridge to automate application reconnection or notify your teams that the database is back online.</p>\n<p>These capabilities are available in all AWS commercial and AWS GovCloud (US) Regions where Amazon RDS for Oracle is available. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Oracle.Precheck.html\">Running minor version upgrade prechecks in Amazon RDS for Oracle</a>, <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Events.Messages.html\">Amazon RDS event categories and event messages</a>, and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/working-with-events.html\">Monitoring Amazon RDS events</a> in the Amazon RDS User Guide.</p>"
  "3c8f9c08534a52b275dc19b7cfa174fa":
    "id": "3c8f9c08534a52b275dc19b7cfa174fa"
    "title": "AWS Network Firewall adds wildcard support for container attribute filters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-network-firewall-container-attributes-wildcard"
    "published": "2026-10-09 01:00:00"
    "fetched": "2026-10-09 11:43:23"
    "summary": "<p>AWS Network Firewall now supports wildcard matching in container attribute-based inspection filters for Amazon Elastic Kubernetes Service (Amazon EKS) and Amazon Elastic Container Service (Amazon ECS). This enhancement allows you to define attribute filters using wildcard patterns to match multiple container workloads in a single rule, eliminating the need to create individual container associations for each variant.</p>\n<p>With wildcard support, you can use patterns like app=payments-* to automatically cover all variants of an application, such as payments-api, payments-worker, and payments-cron. This simplifies firewall rule management for dynamic container environments where new application variants are frequently deployed, reducing operational overhead and ensuring consistent security coverage across your containerized workloads.&nbsp;</p>\n<p>Wildcard support for container attribute filters is available in all AWS Regions where AWS Network Firewall container attribute-based inspection is supported. For a full list of supported Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region Table</a>.</p>\n<p>To get started, visit AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a> and service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/container-associations.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.&nbsp;</p>"
  "ea242fcca54e644caeff7ffb711b5ead":
    "id": "ea242fcca54e644caeff7ffb711b5ead"
    "title": "Amazon SageMaker Unified Studio now supports custom Tooling blueprints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/sagemaker-custom-tooling-blueprints/"
    "published": "2026-10-09 17:00:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon SageMaker Unified Studio now supports custom Tooling blueprints, giving domain administrators the ability to define the foundation of every project by using their own AWS CloudFormation templates. Administrators can tailor project environments to meet organization-specific requirements, such as IAM role names that comply with company naming standards or custom permissions boundaries instead of AWS managed policies.</p>\n<p>Amazon SageMaker Unified Studio administrators start by authoring a CloudFormation template that describes the project environment they need, then register it as a custom Tooling blueprint. The service validates the template at registration and again after each project deployment, confirming that the required resources exist before any team member uses the project. Templates can include any CloudFormation-supported resource, such as AWS Lake Formation grants, Amazon Athena workgroups, or VPC security groups, and work across multiple AWS accounts and Regions without per-project edits. At deployment time, the service automatically populates reserved template parameters, such as the project ID and domain ID, so administrators define the template once and apply it everywhere.</p>\n<p>This feature is available in all <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">AWS Regions</a> where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/tooling-custom-blueprints.html\">Custom blueprints as Tooling documentation</a>.</p>"
  "b4ca532e5b4245e7d6ce3b4d3713250c":
    "id": "b4ca532e5b4245e7d6ce3b4d3713250c"
    "title": "TwelveLabs Pegasus 1.5 model now available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/twelve-labs-pegasus-1-5-aws/"
    "published": "2026-10-09 14:32:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon Bedrock now supports TwelveLabs Pegasus 1.5, a video-to-text model that generates structured, time-coded metadata from video. Until now, finding a moment in a large video library meant knowing where to look before you could ask about it. Pegasus 1.5 reads an entire video and labels what happens and when, turning footage into data your applications can query.</p>\n<p>You define what matters to your business, such as editorial segments, speaker changes, sports plays, or brand appearances, and Pegasus 1.5 finds those moments across the video and returns them with timestamps. It analyzes what it sees, hears, and reads on screen in a single pass, with no pre-indexing or ingestion pipeline to build first.</p>\n<p>Pegasus 1.5 is accessible through the US and Global cross-Region inference profiles. To get started, visit the Amazon Bedrock product page, access the model in the Amazon Bedrock console, or see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-twelvelabs-pegasus-v1-5.html\">Amazon Bedrock documentation</a> for supported Regions, APIs, features, and pricing.</p>"
"last_updated": "2026-10-10 06:26:46 JST"
