  "256b3f6f2b01562ffbdf475f3d48b5a0":
    "id": "256b3f6f2b01562ffbdf475f3d48b5a0"
    "title": "Grok 4.7 is now available on Amazon Bedrock in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-bedrock-grok-4-7-govcloud/"
    "published": "2026-10-19 22:00:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>Amazon Bedrock now supports SpaceXAI Grok 4.7, a frontier model built for coding, agentic tasks, and knowledge work in AWS GovCloud (US).</p>\n<p>Grok 4.7 builds on Grok 4.6 with better mixed-document handling, more dependable repo-scale coding with planning and error recovery, and enhanced browser-use agents for form fills and portal navigation. &nbsp;</p>\n<p>Get started with Grok 4.7 in the<a href=\"https://console.amazonaws-us-gov.com/bedrock/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-7.html\">Amazon Bedrock documentation</a>. To learn more, read the launch <a href=\"https://aws.amazon.com/blogs/machine-learning/grok-4-7-is-now-available-on-amazon-bedrock/\">blog post</a>.</p>"
  "d4959429000f2c9611df0367035dfebe":
    "id": "d4959429000f2c9611df0367035dfebe"
    "title": "AWS IAM Identity Center now supports optimistic locking for users and groups in its identity store"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/iam-identity-store-optimistic-locking/"
    "published": "2026-10-19 17:00:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>IAM Identity Center helps you configure the single sign-on experience of your workforce to AWS accounts and applications. You can now use optimistic locking for users and groups in the identity store, so that update and delete requests succeed only if the user or group hasn't changed since you last read it. This helps when multiple administrators or automated workflows modify the same user or group at nearly the same time, where previously one write could silently overwrite another.\n <br />\n <br />\n Each user and group now has a Revision value that changes every time the user's or group's attributes are modified, including through SCIM provisioning, Active Directory sync, or the IAM Identity Center console. Create, describe, update, and list operations return the current Revision, and you can pass it on a later UpdateUser, UpdateGroup, DeleteUser, or DeleteGroup request. The request succeeds only if the supplied Revision matches the current Revision. Otherwise, it returns a ConflictException, so your workflow can re-read the user or group and retry with the latest values.\n <br />\n <br />\n Providing a Revision is optional. Requests that omit it behave as before, so existing integrations continue to work without changes. Conditional requests are supported through the Identity Store API, not the SCIM endpoint. Group membership operations don't accept a Revision, and adding or removing members doesn't change the Revision of the user or the group. This capability is available in all AWS Regions where IAM Identity Center is available. IAM Identity Center is provided at no additional cost.\n <br />\n <br />\n To learn more about IAM Identity Center, visit the product detail page. To get started, see UpdateUser in the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_UpdateUser.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"identity store update user API\">Identity Store API Reference</a>.</p>"
  "c138074da949ca8ba6c65be6b7211b0b":
    "id": "c138074da949ca8ba6c65be6b7211b0b"
    "title": "Amazon RDS Custom now supports the latest Cumulative Update and GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-custom-supports-latest-cumulative-update-gdr-microsoft-sql-server/"
    "published": "2026-10-19 16:30:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest Cumulative Updates (CU) and General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2019/cumulative-update/kb5122772-cu32-gdr-september-2026\" target=\"_blank\">KB5122772</a>(RDS version 15.00.4490.9.v1) and SQL Server 2022 CU26 + GDR <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2022/cumulative-update/kb5122768-cu26-gdr-september-2026\" target=\"_blank\">KB5122768</a> (RDS version 16.00.4275.2.v1).\n <br />\n <br />\n For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5122772 and KB5122768. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
  "69c778c06d036d81480e5169edafde30":
    "id": "69c778c06d036d81480e5169edafde30"
    "title": "Amazon RDS for SQL Server now supports snapshots on read replicas"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/rds-sqlserver-supports-snapshots-on-read-replicas"
    "published": "2026-10-19 16:01:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> now supports creating DB snapshots directly on read replica instances. Previously, you could create snapshots only on standalone and primary DB instances. You can now snapshot a read replica without promoting it first, giving you more flexibility in your backup and disaster recovery (DR) workflows.</p>\n<p>Previously, enabling Multi-AZ on a promoted read replica meant waiting for an initial full snapshot to finish before the conversion could begin. On larger storage configurations—such as io2 volumes up to 64 TiB—that first snapshot could take a long time, making DR timelines hard to predict. Now, Amazon RDS for SQL Server maintains snapshot data on the read replica throughout its lifecycle, so the first snapshot after promotion completes faster. This shortens the time to enable Multi-AZ and helps you plan DR exercises with more predictable recovery timelines. You can take manual snapshots of a read replica, turn on automated backups by setting a backup retention period greater than zero, and retain automated backups when you delete the replica; however, point-in-time recovery (PITR) from a read replica isn't supported.</p>\n<p>This feature works for both in-region and cross-region read replicas. It's available for SQL Server Enterprise Edition on all SQL Server versions that support read replicas, in all AWS Regions where Amazon RDS for SQL Server read replicas are available, including the AWS GovCloud (US) Regions.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.ReadReplicas.html\" rel=\"noopener noreferrer\" target=\"_blank\">Working with read replicas for Microsoft SQL Server</a>. For pricing details, see <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server Pricing</a>.</p>"
