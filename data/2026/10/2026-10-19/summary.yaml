"overview": |
  この日は 13 件で、AWS ジャパンブログの認証情報とアクセス制御に関する記事に加えて、EKS のネットワークポリシー、国内事例とガイダンス、それにサービス更新が並びました。まず認証情報とアクセス制御です。Amazon Bedrock の API キーについては、安全に実装・管理するためのベストプラクティスが紹介されました。AWS STS の一時的な認証情報を優先し、それが使えない場合は短期 API キー、最終手段として長期 API キーを選ぶという判断基準を整理したうえで、SCP と条件キーによる作成および使用の制御、CloudTrail・Amazon EventBridge・AWS Config ルールによる監視を扱います。アクセスキーの漏えいについては、漏えいした長期的な認証情報が AWS Customer Incident Response Team (CIRT) の観測したセキュリティインシデントにおいて現在も脅威アクターに最も多く使われる侵入経路であることを踏まえ、Amazon Q Developer や AWS IAM Access Analyzer を使って漏えいしたキーや未使用のアクセスを検出する実践的な手順が示されました。あわせて、Amazon Bedrock における最小権限アクセスの実装も公開されました。生成 AI アプリケーションでは Amazon Bedrock や大規模言語モデル (LLM) を組み合わせるためさまざまなレベルでのアクセスコントロールが欠かせないという前提で、モデルの選択・適応・テスト・運用の各フェーズに最小権限の原則を適用する方法を、サービスコントロールポリシー (SCP)、VPC エンドポイントポリシー、KMS キーポリシーなどを使って解説しています。ネットワークセキュリティでは、Amazon EKS のネットワークポリシー機能の強化が紹介されました。2025 年 12 月に Admin Policy と Application Network Policy の両方へ対応したことで、クラスター管理者がクラスター全体に適用されるルールを設定でき、Namespace の管理者はドメイン名をフィルターとして Pod から外部リソースへのトラフィックを制御できます。頻繁に変わる IP アドレスの一覧や、企業のセキュリティポリシーと衝突しやすい広い CIDR ブロックを管理せずに、Pod がアクセスしてよい外部サイトやサービスの信頼済みリスト (アウトバウンドの「許可された宛先」リスト) を作れるようになります。国内事例では、株式会社コーテッグの AI 分析基盤「Dotta」を Amazon Bedrock AgentCore で実現した取り組みが公開されました。「聞くだけ」で分析が完結する構成です。ガイダンスとしては、AI を活用したスタジオ (AI-Powered Studio) の構築方法が紹介されました。生成 AI はプレミアムコンテンツ制作のあり方を変えつつあるが、高品質なコンテンツを自動で作る魔法のボタンではなく、熟練したストーリーテラーが使うことで速く高品質で費用対効果の高い成果につながる道具だという立場から、Consistency (一貫性)、Context (コンテキスト)、Control (コントロール)、Compliance (コンプライアンス)、Cost (コスト) の 5 つの規律を軸にアーキテクチャを構成しています。あわせて AWS Physical AI Toolchain の発表 (2026 年 10 月 7 日公開記事の日本語版) と、週刊 AWS (2026/10/12 週)、週刊生成 AI with AWS (2026 年 10 月 12 日週) も掲載されました。後者では国内事例 5 件 (ソニー銀行、日本通運、東京会計パートナーズ、エナリス、インフキュリオン) が紹介されています。サービス更新では、Amazon Bedrock が AWS GovCloud (US) で SpaceXAI の Grok 4.7 に対応しました。Grok 4.6 を踏まえて、混在文書の扱い、計画と誤り回復を伴うリポジトリ規模のコーディング、フォーム入力やポータル操作を行うブラウザ利用エージェントが改善されています。AWS IAM Identity Center は ID ストアのユーザーとグループに楽観的ロックを導入し、最後に読み取ってから変更がない場合だけ更新・削除が成功するようになりました。各ユーザーとグループに属性変更ごとに変わる Revision 値が付き、複数の管理者や自動化が同じ対象をほぼ同時に変更したときに、一方の書き込みが黙って上書きされる事態を防げます。データベースでは、Amazon RDS for SQL Server がリードレプリカ上での DB スナップショット作成に対応しました。従来はスタンドアロンとプライマリのインスタンスでしか作成できず、昇格させた リードレプリカで Multi-AZ を有効にするには最初のフルスナップショットの完了を待つ必要があり、io2 で最大 64 TiB といった大きな構成では時間がかかっていました。また Amazon RDS Custom for SQL Server が最新の累積更新と GDR 更新に対応し、SQL Server 2019 CU32+GDR KB5122772 (RDS 15.00.4490.9.v1) と SQL Server 2022 CU26+GDR KB5122768 (RDS 16.00.4275.2.v1) が利用できます。
