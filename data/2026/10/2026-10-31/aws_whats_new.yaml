  "1efe145c11df37b755014768d83acd45":
    "id": "1efe145c11df37b755014768d83acd45"
    "title": "Amazon Bedrock expands API support and introduces Cross Region Inferencing for OpenAI models in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/bedrock-openai-runtime-govcloud/"
    "published": "2026-10-31 05:43:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Amazon Bedrock now supports the OpenAI GPT-5.6 models (Terra and Luna) on the bedrock-runtime endpoint, with support for the Responses, Converse, and Chat Completions APIs in AWS GovCloud (US). It also adds support for cross-Region inference, allowing customers to use cross-Region inference within AWS GovCloud (US) regions to access higher throughput and increased redundancy.&nbsp;&nbsp;</p> \n<p>Cross-Region inference automatically routes inference requests across both AWS GovCloud (US) Regions to give you higher throughput, without you needing to manage capacity across multiple Regions. Cross region inference within AWS GovCloud (US) routes requests across both regions so you can scale while maintaining US data sovereighnty, giving you the broadest access to Bedrock capacity and the highest throughput during demand spikes. This launch also expands API support; you can use OpenAI GPT models with the Responses API, Chat Completions API, and the Converse API on the bedrock-runtime endpoint. Because these native OpenAI APIs now run on bedrock-runtime, the models work with the same account-level controls you already use for other models on Bedrock: usage appears in Bedrock model invocation logging (deliverable to Amazon S3 or Amazon CloudWatch Logs) and in Amazon CloudWatch metrics covering invocation counts, token counts, latency, throttles, and errors, and it is itemized in AWS Cost Explorer and the AWS Cost and Usage Report so you can attribute spend by model.</p> \n<p>Cross-Region inference for OpenAI models is available in all AWS Regions where OpenAI models on Amazon Bedrock are offered. To get started, review the model cards for GPT 5.6 (Terra and Luna) in the <a href=\"https://docs.aws.amazon.com/bedrock/\">Amazon Bedrock User Guide.</a></p>"
  "bc669dab0ea2561422f10ad4526d98b9":
    "id": "bc669dab0ea2561422f10ad4526d98b9"
    "title": "Web Search now available on Kiro in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/kiro-web-search-aws-govcloud-us/"
    "published": "2026-10-31 04:40:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Kiro web search gives the agent real-time access to current information on the internet, so its answers draw on up-to-date search results and page content. The agent uses web search automatically when a question involves recent changes or topics beyond the model's training data. Answers that use web results include citations.</p> \n<p>Kiro enterprise administrators can turn off web search and web fetch for their organization from the Kiro console under Settings. Teams can also remove web tools from individual custom agents, or block them with capability-based permission rules.</p> \n<p>For more details, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">AWS GovCloud (US) documentation</a>, the <a href=\"https://kiro.dev/docs/enterprise/monitor-and-track/\">monitoring and tracking guide</a>, or contact your AWS account team. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "6cb5ef5749d6722ca47c5b724492581d":
    "id": "6cb5ef5749d6722ca47c5b724492581d"
    "title": "Amazon Connect Customer automatically saves in-progress emails as drafts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-connect-email-draft-save/"
    "published": "2026-10-31 04:30:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Amazon Connect Customer automatically saves in-progress emails as drafts, helping agents resume work without losing progress when connectivity is interrupted or when their browser is accidentally closed or refreshed. When agents return, their drafts are restored with the message body, recipients, subject line, and attachment references intact. Customers can also access saved draft data in their Amazon S3 buckets to build integrations with other applications.</p>"
  "68c38f43f732fe9887b97a2b9dd11827":
    "id": "68c38f43f732fe9887b97a2b9dd11827"
    "title": "Daybreak Red from OpenAI now available to eligible customers on Amazon Bedrock in AWS GovCloud (US-East)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/openai-daybreak-red-govcloud-east/"
    "published": "2026-10-31 03:20:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Security teams need powerful tools to find vulnerabilities, test exploits, and build defenses. Daybreak Red from OpenAI is now available to eligible customers on Amazon Bedrock in AWS GovCloud (US-East), bringing advanced AI to this work.</p> \n<p>&nbsp;</p> \n<p>Part of OpenAI’s Daybreak cyber defense initiative, Daybreak Red: GPT-5.6 Cyber is built for authorized vulnerability research, exploit reproduction, and mitigation development. It gives verified defenders more room to investigate complex security problems, with fewer refusals for this work and stronger identity verification, monitoring, and access controls.</p> \n<p>Daybreak Red runs on Bedrock’s next-generation inference engine, with zero-operator access enforced at the chip. Your inference data is not used to train models, and you do not need to share your Daybreak Red data with OpenAI.</p> \n<p>&nbsp;</p> \n<p>The model is available in US East (Ohio) and AWS GovCloud (US-East). Access to the model requires <a href=\"https://openai.com/form/enterprise-trusted-access-for-cyber/\">enrollment in Daybreak access</a> from OpenAI.&nbsp;To get started, contact OpenAI or your AWS account team about Daybreak eligibility. Once approved, work with your AWS account team to enable access.&nbsp;Learn more in the <a href=\"https://aws.amazon.com/blogs/machine-learning/accelerate-cyber-defense-with-openai-and-aws-daybreak-red-daybreak-blue-now-available-to-eligible-customers-on-amazon-bedrock/\">blog</a>.</p>"
  "66ecc24346de29e6ba56e3090d811ca2":
    "id": "66ecc24346de29e6ba56e3090d811ca2"
    "title": "Amazon CloudFront now provides viewer ISP and post-quantum TLS details"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudfront-viewer-isp-post-quantum-visbility/"
    "published": "2026-10-31 03:15:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Amazon CloudFront can now forward two new optional headers to your origin. The CloudFront-Viewer-ISP header contains the name of the viewer's internet service provider (ISP), so you can see which network a request came from. The CloudFront-Viewer-TLS-Details header describes the cryptography used on each viewer's TLS connection, so you can see whether a connection used post-quantum cryptography (PQC).</p> \n<p>With CloudFront-Viewer-ISP, you can break down traffic and performance by network. You can also isolate unusual traffic from a single provider. CloudFront-Viewer-TLS-Details includes the key exchange, signature scheme, and signature public key type for each connection. You can use it to measure the share of viewers that actually connect with PQC and identify clients that do not yet do so. To forward either header to your origin, add it to an origin request policy and attach the policy to your distribution.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html\">adding CloudFront headers</a> and&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/controlling-origin-requests.html\">controlling origin requests with a policy</a> in the Amazon CloudFront Developer Guide</p>"
  "04bbc7c0a64fb9087cb5ca5e9e26ffdd":
    "id": "04bbc7c0a64fb9087cb5ca5e9e26ffdd"
    "title": "Amazon MSK now supports TLS 1.3 for data in transit"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-msk-tls/"
    "published": "2026-10-31 02:00:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>Amazon MSK now supports version 1.3 of Transport Layer Security (TLS) protocol for MSK Provisioned clusters through encryption policies. TLS 1.3 delivers faster, more secure encryption for streaming data and is increasingly required by compliance frameworks and enterprise security standards. It is also one of the prerequisites for post-quantum cryptography for protecting data against attacks that collect encrypted traffic now with the intent to decrypt it later.</p> \n<p>Customers can opt in to TLS 1.3 by selecting a named security policy in their MSK cluster configuration, with no change to existing clusters until a policy is applied. A named security policy defines which TLS version and cipher suites a cluster can accept. With this launch, Amazon MSK provides a set of policies customers can select and any connection that does not meet the selected policy requirements is rejected. This allows customers to stay in control of their security and compliance posture. Policies that support both TLS 1.2 and TLS 1.3 allow connections to negotiate the highest version the client supports allowing clients that support TLS 1.3 to connect on it immediately while clients on TLS 1.2 continue to connect on TLS 1.2. This lets customers upgrade their clients at their pace before applying a stricter policy. Customers can also select stricter policies that align closer with their compliance requirements to restrict connections to TLS 1.3 only.</p> \n<p>This capability is available at no additional cost in all AWS Regions where Amazon MSK Provisioned is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/security.html\">Amazon MSK documentation</a>.</p>"
  "e9ee3998ae61d9831f159aae26690cda":
    "id": "e9ee3998ae61d9831f159aae26690cda"
    "title": "Amazon RDS for Oracle no longer requires automatic minor version upgrades for JVM, Spatial, Locator, and OLAP options"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/oracle-jvm-spatial-locator-olap-options-amvu-optional/"
    "published": "2026-10-31 02:00:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> now lets you turn off automatic minor version upgrades on new and existing DB instances that use the JVM, Spatial, Locator, or OLAP option. Previously, these options required automatic minor version upgrades to be enabled.</p> \n<p>With this change, you decide when to apply minor version upgrades to DB instances using these options. If you turn off automatic minor version upgrades, we recommend that you apply new minor versions regularly so your DB instances keep the latest Oracle security fixes. To keep automatic minor version upgrades turned on and still control the order in which your environments are upgraded, you can use <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html\">AWS Organizations upgrade rollout policy</a>.</p> \n<p>This change is available in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all commercial AWS Regions and the AWS GovCloud (US) Regions</a> where Amazon RDS for Oracle is available. To learn more about options available in Amazon RDS for Oracle, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Appendix.Oracle.Options.html\">Adding options to Oracle DB instances</a> in the Amazon RDS User Guide.</p>"
  "3e3b2351730985f54b3fc10abe9a5e4f":
    "id": "3e3b2351730985f54b3fc10abe9a5e4f"
    "title": "AWS WAF announces automatic SDK integration for Amazon CloudFront distributions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-waf-automatic-sdk-integration-amazon-cloudfront/"
    "published": "2026-10-31 00:57:00"
    "fetched": "2026-10-31 06:21:30"
    "summary": "<p>AWS WAF announces automatic SDK integration for Amazon CloudFront distributions. When you enable it, CloudFront adds the script tag for the AWS WAF JavaScript SDK to the HTML it serves, with no change to your application code, build process, or deployment. The SDK supplies the client-side signals used by three AWS WAF managed rule groups: Bot Control at the targeted inspection level, Fraud Control account takeover prevention (ATP), and Fraud Control account creation fraud prevention (ACFP).<br /> <br /> Previously, supplying those signals required you to add a script tag to every page of every application you wanted to protect, and to maintain that tag across releases. For teams running many applications, or serving pages produced by systems they do not control, this created recurring work and a common source of misconfiguration, where a protection was enabled in AWS WAF but the client-side integration was missing. Enabling automatic SDK integration on the web ACL protecting your CloudFront distribution removes that per-application work.<br /> <br /> Automatic SDK integration is available for web ACLs that are used with Amazon CloudFront and contain at least one of those managed rule groups. You can configure it using the AWS Management Console, CLI, SDK, CDK, or CloudFormation. In the AWS WAF console, the setting appears with the managed rule group settings and is on by default for new web ACLs that you create with one of those rule group. When you create a web ACL programmatically, the setting is off by default. Web ACLs created before this release are unchanged.<br /> <br /> There is no additional charge for automatic SDK integration. For requirements, limitations, and Content Security Policy guidance, see <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-challenge-javascript-sdk-injection.html\">Automatic SDK integration for CloudFront distributions</a> in the AWS WAF Developer Guide.</p>"
