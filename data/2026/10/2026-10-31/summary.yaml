"overview": |
  この日は 4 ソースから 20 本。セキュリティ速報は 4 件で、合計 5 件の CVE が公開された。CVE-2026-98432 は Linux カーネルの IPv4 TCP ハンドシェイク経路における解放後使用の問題である (Bulletin ID: 2026-160-AWS、2026 年 10 月 30 日 22:15 PDT 公開)。カーネル 4.4 以降が影響を受け、リモートコード実行につながるおそれがある。Amazon Linux 2 と Amazon Linux 2023 には更新済みのカーネルパッケージが提供されており、自分で管理する Linux インスタンスは更新と再起動が推奨される。マネージドサービスには AWS が更新を適用しており、それらについて利用者の対応は不要である。CVE-2026-119117 は Amazon Kinesis Producer Library for Java の問題である (Bulletin ID: 2026-159-AWS、2026 年 10 月 30 日 11:00 PDT 公開)。1.0.8 より前のバージョンでライブラリのロガーを DEBUG レベルに設定している場合、ローカルのユーザーがライブラリがアプリケーション向けに解決した AWS の認証情報をログファイルから取得できる可能性がある。さらに、対象バージョンはこの認証情報をネイティブの子プロセスへコマンドライン引数として渡すため、ローカルのユーザーがプロセスの引数一覧から読み取れる。対象は com.amazonaws:amazon-kinesis-producer の 0.15.12 以下である。CVE-2026-119086 は FreeRTOS-Kernel のキューセット選択の経路で、対象のカーネルオブジェクトが本当にキューセットかを十分に検証していなかった問題である (Bulletin ID: 2026-158-AWS、同日 10:30 PDT 公開)。MPU を有効にしてキューセットを使うビルドでは、権限を持たないタスクがカーネルに特権コンテキストで意図した範囲の外へ書き込ませられるため、特権実行の整合性に影響する。キューセットを使わないビルドは影響を受けない。CVE-2026-119116 と CVE-2026-119148 は AWS Nitro Enclaves SDK for C の問題である (Bulletin ID: 2026-157-AWS、同日 09:00 PDT 公開)。前者は kmstool-enclave のサンプルアプリケーションの SetClient コマンドハンドラーにおける解放後使用で、親の EC2 インスタンス上で動くアプリケーションが vsock 越しに細工したメッセージを送ることで、エンクレーブ内のヒープメモリを壊して任意のコードを実行できる。影響を受けるのは kmstool-enclave またはそれを元にしたコードを含むエンクレーブイメージのみである。後者は SDK ライブラリで AWS KMS のサーバー名を呼び出し側が渡すリージョン文字列から組み立てていた入力検証の問題である。モデルでは、AWS GovCloud (US) の Amazon Bedrock が bedrock-runtime エンドポイントで OpenAI GPT-5.6 (Terra と Luna) に対応し、Responses・Converse・Chat Completions の各 API が使えるようになった。あわせてクロスリージョン推論にも対応し、2 つの AWS GovCloud (US) リージョンにまたがって推論リクエストを自動で振り分けることで、複数リージョンの容量を自分で管理せずに高いスループットと冗長性を得られる。セキュリティ向けのモデルとしては、OpenAI の Daybreak Red が AWS GovCloud (US-East) の Amazon Bedrock で対象顧客に提供開始となった。OpenAI の Daybreak サイバー防御の取り組みの一部である Daybreak Red: GPT-5.6 Cyber は、許可された脆弱性研究、エクスプロイトの再現、緩和策の開発のために作られたモデルで、この種の作業に対する拒否が少なく、より強い本人確認・監視・アクセス制御を備える。開発ツールでは、Kiro の Web 検索が AWS GovCloud (US) で利用できるようになった。エージェントがインターネット上の最新の情報にアクセスできるようになり、最近の変更やモデルの学習データの範囲を超える話題が関わるときに自動で検索を使い、検索結果を使った回答には引用が付く。企業の管理者は Kiro コンソールの Settings から組織全体で Web 検索と Web 取得を無効にでき、個々のカスタムエージェントから Web ツールを外すことや、ケイパビリティベースの権限ルールで止めることもできる。セキュリティとネットワークでは、Amazon CloudFront がオリジンへ転送できる任意のヘッダーを 2 つ追加した。CloudFront-Viewer-ISP は視聴者のインターネットサービスプロバイダー名を含み、リクエストがどのネットワークから来たかが分かるため、トラフィックや性能をネットワーク別に分けたり、特定のプロバイダーからの異常なトラフィックを切り出したりできる。CloudFront-Viewer-TLS-Details は各接続の暗号方式 (鍵交換、署名方式、署名公開鍵など) を示し、その接続がポスト量子暗号 (PQC) を使ったかどうかを確認できる。Amazon MSK は MSK Provisioned クラスターで暗号化ポリシーを通じて TLS 1.3 に対応した。ストリーミングデータの暗号化が速く安全になり、コンプライアンスの枠組みや企業のセキュリティ基準で求められることが増えているほか、暗号化された通信をいま集めて後で復号しようとする攻撃に備えるポスト量子暗号の前提条件の 1 つでもある。既存のクラスターはポリシーを適用するまで変わらず、名前付きのセキュリティポリシーを選んで有効にする。AWS WAF は Amazon CloudFront ディストリビューション向けの SDK 自動統合を発表した。有効にすると CloudFront が配信する HTML に AWS WAF の JavaScript SDK のスクリプトタグを追加するため、アプリケーションのコード・ビルド・デプロイを変える必要がない。この SDK は Bot Control の targeted 検査レベル、Fraud Control のアカウント乗っ取り防止 (ATP)、アカウント作成の不正防止 (ACFP) という 3 つのマネージドルールグループが使うクライアント側のシグナルを供給する。従来は保護したいアプリケーションの全ページにスクリプトタグを自分で入れて保守する必要があった。データベースでは、Amazon RDS for Oracle が JVM・Spatial・Locator・OLAP のオプションを使う DB インスタンスで、マイナーバージョンの自動アップグレードを無効にできるようになった。従来はこれらのオプションを使う場合に自動アップグレードが必須だった。無効にする場合は、Oracle の最新のセキュリティ修正を取り込むために定期的にマイナーバージョンを適用することが推奨されている。コンタクトセンターでは、Amazon Connect Customer が作成中のメールを自動で下書きとして保存するようになった。接続が切れたときやブラウザを誤って閉じた・再読み込みしたときでも、本文・宛先・件名・添付の参照が保たれた状態で作業を再開できる。保存された下書きのデータは Amazon S3 のバケットからも参照でき、他のアプリケーションとの連携を作れる。機械学習ブログでは 2 本。Worldwide Express が LTL (混載) 輸送の請求例外処理を Amazon Bedrock 上のマルチエージェント構成で自動化した事例では、稼働から 6 か月で未処理の例外を 75% 削減し、入金までの期間を 4 週間短縮して 1,000 万ドルのフリーキャッシュフローを生み出した。もう 1 本は ChatGPT デスクトップアプリが AWS GovCloud (US) の Amazon Bedrock で使えるようになったことを受けた構成手順で、API モードのサインイン、管理されたデバイスポリシー、名前付きの AWS プロファイル、ネットワーク制限を使って推論を AWS GovCloud (US-West) の Amazon Bedrock へ向ける、統制されたローカル環境でのデプロイを、セキュリティチームが広く展開する前に検証できる形で解説している。 遅れて取得した記事はほかに 5 本。Amazon Connect Customer はフローとフローモジュールのバージョニングとエイリアスに対応した。変更できないバージョンを作成してエイリアスを付け、キュー、クイック接続、電話番号をエイリアスに向けておけば、本番のトラフィックを現行バージョンに残したまま新バージョンを検証し、エイリアスの付け替え 1 回で全電話番号を切り替えられる。機械学習ブログでは、セッションごとに認証付き URL を発行して HTTP と WebSocket を許可したポートへ転送する Amazon Bedrock AgentCore の Session エンドポイントを使い、コーディングエージェントが編集する Vite サイトをブラウザでライブに確認する手順と、コストの所有者への帰属、リクエストの可観測性、予算の強制、プラットフォームの既定値の最適化、定期レビューの 5 段階からなる FinOps・プラットフォームチーム向けの Amazon Bedrock コスト管理のプレイブックが公開された。AWS Japan Blog では、セキュリティ要件で仕様をハードニングしてシフトレフトを実現する spec 駆動開発の記事 Spec it safe と、Kiro のハッカソン Kiroween 2026 の開始が案内された。Kiroween の提出締め切りは日本時間 2026 年 12 月 5 日 (土) 午前 7 時で、賞金総額は 10 万ドルである。
