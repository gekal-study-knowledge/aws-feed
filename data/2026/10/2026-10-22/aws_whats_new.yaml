  "47b57f1dfe621daa31ed0734610f2c34":
    "id": "47b57f1dfe621daa31ed0734610f2c34"
    "title": "Amazon Cognito extends multi-Region replication to AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cognito-multi-region-us-govcloud/"
    "published": "2026-10-22 02:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Amazon Cognito multi-Region replication (MRR) now supports AWS GovCloud (US) Regions, extending the resilience benefits of MRR to more workloads. MRR lets you synchronize user and machine identity data, including credentials, user pool configurations, and federation setups, to a secondary user pool in a standby Region you designate, in near real-time. With user data in the standby Region, you can redirect traffic and keep authentication available if there is a disruption in your primary Region.<br /> <br /> Previously, MRR was available in 16 commercial Regions. You can now also use MRR to replicate between additional AWS Regions, helping you meet resilience, data residency, and compliance requirements in the Regions that best align with your business needs.<br /> <br /> MRR is available as an add-on for user pools in the Essentials or Plus feature tiers, and requires a multi-Region AWS KMS customer managed key (CMK). For the full list of AWS Regions where Amazon Cognito is available, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Capabilities by Region</a>. To get started, visit the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-multi-region.html\">developer guide</a> for instructions and the <a href=\"https://aws.amazon.com/cognito/pricing/\">pricing page</a> for pricing details.</p>"
  "26ad080230d14b80a1611d2580786857":
    "id": "26ad080230d14b80a1611d2580786857"
    "title": "AWS Neuron 2.33 adds native PyTorch support, Neuron Observer, and other new features"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announce-neuron-2-33-0"
    "published": "2026-10-22 00:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>AWS Neuron 2.33 is now available, introducing TorchNeuron, the native PyTorch backend for AWS Trainium, in public beta. You can run models written with the standard PyTorch APIs on Amazon EC2 Trn2 and Trn3 instances, in eager mode or with torch.compile. This release also introduces Neuron Observer in public beta, which detects Trainium health issues in under a second and identifies the affected node or device.</p> \n<p>The vLLM Neuron plugin upgrades to vLLM 0.29.0, and the vLLM Omni Neuron plugin for Wan2.2 video generation is now part of the Neuron release. Both support native PyTorch compilation through TorchNeuron. A new Neuron Deep Learning AMI and Deep Learning Container for PyTorch training include TorchNeuron, PyTorch 2.14, and TorchTitan. Neuron Explorer opens profiles captured with torch.profiler. From a PyTorch memory snapshot, it now attributes allocations to the Python source lines that made them, for debugging out-of-memory errors in eager mode.</p> \n<p>Kernels written with the Neuron Kernel Interface (NKI) can now use the full Python language for metaprogramming, including generators and class inheritance. The NKI Library adds 25 new experimental kernels, including kernels for DeepSeek-V3.2, Qwen3.5, and Kimi Delta Attention.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/release-notes/index.html\">AWS Neuron 2.33.0 Release Notes</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/torch/index.html\">AWS TorchNeuron documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/tools/neuron-observer/index.html\" target=\"_blank\">AWS Neuron Observer documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/index.html\" target=\"_blank\">AWS Neuron Kernel Interface documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://aws.amazon.com/ai/machine-learning/neuron/\">AWS Neuron</a></p> </li> \n</ul>"
  "ee75e1de4e300b59f6ca0c2192eaa437":
    "id": "ee75e1de4e300b59f6ca0c2192eaa437"
    "title": "AWS announces AWS Interconnect - last mile preview with Megaport"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announces-AWS-interconnect-last-mile-megaport-preview/"
    "published": "2026-10-22 21:00:00"
    "fetched": "2026-10-23 01:33:06"
    "summary": "<p>AWS launches AWS Interconnect - last mile preview with Megaport, a fully managed connectivity offering that allows customers to connect their branch offices, data centers, and remote locations to AWS with just a few clicks, eliminating the friction and complexity of network setup. As a milestone collaboration between AWS and Megaport, AWS Interconnect - last mile combines AWS cloud innovation with Megaport operating one of the world's largest Software Defined Networks (SDN), with 1,200+ enabled data centers across 31 countries.</p> \n<p>Through the AWS Management Console, customers can now instantly establish private, high-speed connections to AWS by simply choosing their preferred AWS Region, bandwidth speed, Direct Connect Gateway ID and partner subscriber ID. Once initiated, AWS generates an activation key to complete connectivity provisioning with Megaport. The launch simplifies the connectivity experience by pre-provisioning capacity and automating complex network configuration including BGP peering, VLAN configuration, and ASN assignment. At GA, customers will also be able to dynamically scale bandwidth from 1 Gbps to 100 Gbps through the AWS Console. The service is designed for high availability, with zero down-time maintenance, backed by a 99.99% SLA.&nbsp;</p> \n<p>AWS Interconnect - last mile is available in the San Jose (us-west-1) and N. Virginia (us-east-1) metros through Megaport. You can create a preview Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. Partners can also easily adopt via a published open API package on <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub</a>. For more information, see the AWS Interconnect - last mile <a href=\"https://docs.aws.amazon.com/interconnect/\">documentation</a> and <a href=\"https://aws.amazon.com/interconnect/lastmile/pricing/\">pricing pages</a>.</p>"
"last_updated": "2026-10-23 01:33:06 JST"
