  "296339e75da97094a6a27720b142c851":
    "id": "296339e75da97094a6a27720b142c851"
    "title": "Amazon Aurora and Amazon RDS now support On-Demand Capacity Reservation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-aurora-rds-on-demand-capacity-reservations/"
    "published": "2026-10-22 01:00:00"
    "fetched": "2026-10-22 02:52:11"
    "summary": "<p>Starting today, you can reserve compute capacity for your Amazon Aurora and Amazon RDS DB instances in one or more Availability Zones for as long as you need it. Reserving capacity helps ensure that DB instance create, restore, scale-compute, and start operations don't fail because of insufficient capacity.</p> \n<p>On-Demand Capacity Reservation is designed for workloads that need assurance that specific DB instance capacity will be available when they need it for business-critical events, such as migrations, product launches, seasonal peaks, high-availability deployments, or disaster recovery. You choose the DB instance class, engine, Availability Zones, and reserved capacity per Availability Zone, and RDS holds that capacity for you. Capacity can be reserved in two or more Availability Zones to support Multi-AZ deployments. To use the reserved capacity, reference the reservation when you create, restore, modify, or start a DB instance.</p> \n<p>You can reserve capacity for immediate use with no commitment and cancel at any time, or schedule a reservation to begin 5 to 120 days in the future with a minimum commitment. Reserved capacity is billed at On-Demand rates while the reservation is active, whether or not DB instances within the reservation are running. Discounts from your existing Reserved DB Instances or Database Savings Plans apply automatically.</p> \n<p>On-Demand Capacity Reservation is available for <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a> in all AWS commercial Regions. To learn more about On-Demand Capacity Reservation, visit the documentation for <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/capacity-reservations.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/capacity-reservations.html\" target=\"_blank\">Amazon RDS</a>.&nbsp;</p>"
  "25dbad74590275829c25e0464e591453":
    "id": "25dbad74590275829c25e0464e591453"
    "title": "AWS Transform adds storage migration assessments for Amazon S3, EBS, EFS, and FSx"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/transform-assess-s3-ebs-efs-fsx/"
    "published": "2026-10-22 04:10:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\" target=\"_blank\">Migration assessments in AWS Transform</a> now evaluate on-premises storage for migration to AWS. Instead of manually analyzing thousands of volumes across protocols, capacity, and performance, you upload a storage inventory and AWS Transform does the mapping for you. It matches each workload to the best-fit service, sizes the recommendation, and projects costs to produce a total cost of ownership business case. Bring NAS shares, SAN LUNs, direct-attached disks, or backup repositories via a NetApp Digital Advisor export, RVTools file, or other inventory. AWS Transform routes workloads across Amazon S3, Amazon EBS, Amazon EFS, and Amazon FSx (NetApp ONTAP, Windows File Server, OpenZFS, Lustre). Run what-if scenarios to compare deployment options such as Single-AZ vs. Multi-AZ or cost-optimized vs. performance-optimized, then ask follow-up questions about any result in chat.</p> \n<p>Storage migration assessments are available in all AWS Regions where AWS Transform is available. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\" target=\"_blank\">AWS Transform User Guide</a>.</p>"
  "00af2d785bb8676bfc9b0802f682f8e4":
    "id": "00af2d785bb8676bfc9b0802f682f8e4"
    "title": "AWS Direct Connect announces 100G expansion in Manchester, England"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-direct-connect-100g-manchester/"
    "published": "2026-10-22 02:21:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Today, AWS announced the expansion of 10 Gbps and 100 Gbps dedicated connections with MACsec encryption capabilities at the existing <a href=\"https://aws.amazon.com/directconnect\">AWS Direct Connect</a> location in the Equinix MA3 data center near Manchester, England. You can now establish private, direct network access to all public AWS Regions (except those in China), AWS GovCloud Regions, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones</a> from this location. This is the third AWS Direct Connect location in England to provide 100 Gbps connections with MACsec encryption capabilities.</p> \n<p>The Direct Connect service enables you to establish a private, physical network connection between AWS and your data center, office, or colocation environment. These private connections can provide a more consistent network experience than those made over the public internet.</p> \n<p>For more information on the over 150 Direct Connect locations worldwide, visit the <a href=\"https://aws.amazon.com/directconnect/locations/\">locations</a> section of the Direct Connect <a href=\"https://aws.amazon.com/directconnect\">product detail pages</a>. Or, visit our <a href=\"https://aws.amazon.com/directconnect/getting-started/\">getting started</a> page to learn more about how to purchase and deploy Direct Connect.</p>"
  "06cd1759ac3f84bbdebfbe33cd030f35":
    "id": "06cd1759ac3f84bbdebfbe33cd030f35"
    "title": "Amazon Aurora and Amazon RDS now support On-Demand Capacity Reservations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-aurora-rds-on-demand-capacity-reservations/"
    "published": "2026-10-22 02:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Starting today, you can reserve compute capacity for your Amazon Aurora and Amazon RDS DB instances in one or more Availability Zones for as long as you need it. Reserving capacity helps ensure that DB instance create, restore, scale-compute, and start operations don't fail because of insufficient capacity.</p> \n<p>On-Demand Capacity Reservations are designed for workloads that need assurance that specific DB instance capacity will be available when they need it for business-critical events, such as migrations, product launches, seasonal peaks, high-availability deployments, or disaster recovery. You choose the DB instance class, engine, Availability Zones, and reserved capacity per Availability Zone, and RDS holds that capacity for you. Capacity can be reserved in two or more Availability Zones to support Multi-AZ deployments. To use the reserved capacity, reference the reservation when you create, restore, modify, or start a DB instance.</p> \n<p>You can reserve capacity for immediate use with no commitment and cancel at any time, or schedule a reservation to begin 5 to 120 days in the future with a minimum commitment. Reserved capacity is billed at On-Demand rates while the reservation is active, whether or not DB instances within the reservation are running. Discounts from your existing Reserved DB Instances or Database Savings Plans apply automatically.</p> \n<p>On-Demand Capacity Reservations are available for <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a> in all AWS commercial Regions. To learn more about On-Demand Capacity Reservations, visit the documentation for <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/capacity-reservations.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://docs.aws.amazon.com/Amazon