  "296339e75da97094a6a27720b142c851":
    "id": "296339e75da97094a6a27720b142c851"
    "title": "Amazon Aurora and Amazon RDS now support On-Demand Capacity Reservation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-aurora-rds-on-demand-capacity-reservations/"
    "published": "2026-10-22 01:00:00"
    "fetched": "2026-10-22 02:52:11"
    "summary": "<p>Starting today, you can reserve compute capacity for your Amazon Aurora and Amazon RDS DB instances in one or more Availability Zones for as long as you need it. Reserving capacity helps ensure that DB instance create, restore, scale-compute, and start operations don't fail because of insufficient capacity.</p> \n<p>On-Demand Capacity Reservation is designed for workloads that need assurance that specific DB instance capacity will be available when they need it for business-critical events, such as migrations, product launches, seasonal peaks, high-availability deployments, or disaster recovery. You choose the DB instance class, engine, Availability Zones, and reserved capacity per Availability Zone, and RDS holds that capacity for you. Capacity can be reserved in two or more Availability Zones to support Multi-AZ deployments. To use the reserved capacity, reference the reservation when you create, restore, modify, or start a DB instance.</p> \n<p>You can reserve capacity for immediate use with no commitment and cancel at any time, or schedule a reservation to begin 5 to 120 days in the future with a minimum commitment. Reserved capacity is billed at On-Demand rates while the reservation is active, whether or not DB instances within the reservation are running. Discounts from your existing Reserved DB Instances or Database Savings Plans apply automatically.</p> \n<p>On-Demand Capacity Reservation is available for <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a> in all AWS commercial Regions. To learn more about On-Demand Capacity Reservation, visit the documentation for <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/capacity-reservations.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/capacity-reservations.html\" target=\"_blank\">Amazon RDS</a>.&nbsp;</p>"
  "25dbad74590275829c25e0464e591453":
    "id": "25dbad74590275829c25e0464e591453"
    "title": "AWS Transform adds storage migration assessments for Amazon S3, EBS, EFS, and FSx"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/transform-assess-s3-ebs-efs-fsx/"
    "published": "2026-10-22 04:10:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\" target=\"_blank\">Migration assessments in AWS Transform</a> now evaluate on-premises storage for migration to AWS. Instead of manually analyzing thousands of volumes across protocols, capacity, and performance, you upload a storage inventory and AWS Transform does the mapping for you. It matches each workload to the best-fit service, sizes the recommendation, and projects costs to produce a total cost of ownership business case. Bring NAS shares, SAN LUNs, direct-attached disks, or backup repositories via a NetApp Digital Advisor export, RVTools file, or other inventory. AWS Transform routes workloads across Amazon S3, Amazon EBS, Amazon EFS, and Amazon FSx (NetApp ONTAP, Windows File Server, OpenZFS, Lustre). Run what-if scenarios to compare deployment options such as Single-AZ vs. Multi-AZ or cost-optimized vs. performance-optimized, then ask follow-up questions about any result in chat.</p> \n<p>Storage migration assessments are available in all AWS Regions where AWS Transform is available. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\" target=\"_blank\">AWS Transform User Guide</a>.</p>"
  "00af2d785bb8676bfc9b0802f682f8e4":
    "id": "00af2d785bb8676bfc9b0802f682f8e4"
    "title": "AWS Direct Connect announces 100G expansion in Manchester, England"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-direct-connect-100g-manchester/"
    "published": "2026-10-22 02:21:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Today, AWS announced the expansion of 10 Gbps and 100 Gbps dedicated connections with MACsec encryption capabilities at the existing <a href=\"https://aws.amazon.com/directconnect\">AWS Direct Connect</a> location in the Equinix MA3 data center near Manchester, England. You can now establish private, direct network access to all public AWS Regions (except those in China), AWS GovCloud Regions, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones</a> from this location. This is the third AWS Direct Connect location in England to provide 100 Gbps connections with MACsec encryption capabilities.</p> \n<p>The Direct Connect service enables you to establish a private, physical network connection between AWS and your data center, office, or colocation environment. These private connections can provide a more consistent network experience than those made over the public internet.</p> \n<p>For more information on the over 150 Direct Connect locations worldwide, visit the <a href=\"https://aws.amazon.com/directconnect/locations/\">locations</a> section of the Direct Connect <a href=\"https://aws.amazon.com/directconnect\">product detail pages</a>. Or, visit our <a href=\"https://aws.amazon.com/directconnect/getting-started/\">getting started</a> page to learn more about how to purchase and deploy Direct Connect.</p>"
  "06cd1759ac3f84bbdebfbe33cd030f35":
    "id": "06cd1759ac3f84bbdebfbe33cd030f35"
    "title": "Amazon Aurora and Amazon RDS now support On-Demand Capacity Reservations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-aurora-rds-on-demand-capacity-reservations/"
    "published": "2026-10-22 02:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Starting today, you can reserve compute capacity for your Amazon Aurora and Amazon RDS DB instances in one or more Availability Zones for as long as you need it. Reserving capacity helps ensure that DB instance create, restore, scale-compute, and start operations don't fail because of insufficient capacity.</p> \n<p>On-Demand Capacity Reservations are designed for workloads that need assurance that specific DB instance capacity will be available when they need it for business-critical events, such as migrations, product launches, seasonal peaks, high-availability deployments, or disaster recovery. You choose the DB instance class, engine, Availability Zones, and reserved capacity per Availability Zone, and RDS holds that capacity for you. Capacity can be reserved in two or more Availability Zones to support Multi-AZ deployments. To use the reserved capacity, reference the reservation when you create, restore, modify, or start a DB instance.</p> \n<p>You can reserve capacity for immediate use with no commitment and cancel at any time, or schedule a reservation to begin 5 to 120 days in the future with a minimum commitment. Reserved capacity is billed at On-Demand rates while the reservation is active, whether or not DB instances within the reservation are running. Discounts from your existing Reserved DB Instances or Database Savings Plans apply automatically.</p> \n<p>On-Demand Capacity Reservations are available for <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a> in all AWS commercial Regions. To learn more about On-Demand Capacity Reservations, visit the documentation for <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/capacity-reservations.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/capacity-reservations.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS</a>.&nbsp;</p>"
  "47b57f1dfe621daa31ed0734610f2c34":
    "id": "47b57f1dfe621daa31ed0734610f2c34"
    "title": "Amazon Cognito extends multi-Region replication to AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cognito-multi-region-us-govcloud/"
    "published": "2026-10-22 02:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>Amazon Cognito multi-Region replication (MRR) now supports AWS GovCloud (US) Regions, extending the resilience benefits of MRR to more workloads. MRR lets you synchronize user and machine identity data, including credentials, user pool configurations, and federation setups, to a secondary user pool in a standby Region you designate, in near real-time. With user data in the standby Region, you can redirect traffic and keep authentication available if there is a disruption in your primary Region.<br /> <br /> Previously, MRR was available in 16 commercial Regions. You can now also use MRR to replicate between additional AWS Regions, helping you meet resilience, data residency, and compliance requirements in the Regions that best align with your business needs.<br /> <br /> MRR is available as an add-on for user pools in the Essentials or Plus feature tiers, and requires a multi-Region AWS KMS customer managed key (CMK). For the full list of AWS Regions where Amazon Cognito is available, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Capabilities by Region</a>. To get started, visit the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-multi-region.html\">developer guide</a> for instructions and the <a href=\"https://aws.amazon.com/cognito/pricing/\">pricing page</a> for pricing details.</p>"
  "26ad080230d14b80a1611d2580786857":
    "id": "26ad080230d14b80a1611d2580786857"
    "title": "AWS Neuron 2.33 adds native PyTorch support, Neuron Observer, and other new features"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announce-neuron-2-33-0"
    "published": "2026-10-22 00:00:00"
    "fetched": "2026-10-22 06:11:13"
    "summary": "<p>AWS Neuron 2.33 is now available, introducing TorchNeuron, the native PyTorch backend for AWS Trainium, in public beta. You can run models written with the standard PyTorch APIs on Amazon EC2 Trn2 and Trn3 instances, in eager mode or with torch.compile. This release also introduces Neuron Observer in public beta, which detects Trainium health issues in under a second and identifies the affected node or device.</p> \n<p>The vLLM Neuron plugin upgrades to vLLM 0.29.0, and the vLLM Omni Neuron plugin for Wan2.2 video generation is now part of the Neuron release. Both support native PyTorch compilation through TorchNeuron. A new Neuron Deep Learning AMI and Deep Learning Container for PyTorch training include TorchNeuron, PyTorch 2.14, and TorchTitan. Neuron Explorer opens profiles captured with torch.profiler. From a PyTorch memory snapshot, it now attributes allocations to the Python source lines that made them, for debugging out-of-memory errors in eager mode.</p> \n<p>Kernels written with the Neuron Kernel Interface (NKI) can now use the full Python language for metaprogramming, including generators and class inheritance. The NKI Library adds 25 new experimental kernels, including kernels for DeepSeek-V3.2, Qwen3.5, and Kimi Delta Attention.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/release-notes/index.html\">AWS Neuron 2.33.0 Release Notes</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/torch/index.html\">AWS TorchNeuron documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/tools/neuron-observer/index.html\" target=\"_blank\">AWS Neuron Observer documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/index.html\" target=\"_blank\">AWS Neuron Kernel Interface documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://aws.amazon.com/ai/machine-learning/neuron/\">AWS Neuron</a></p> </li> \n</ul>"
  "ee75e1de4e300b59f6ca0c2192eaa437":
    "id": "ee75e1de4e300b59f6ca0c2192eaa437"
    "title": "AWS announces AWS Interconnect - last mile preview with Megaport"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announces-AWS-interconnect-last-mile-megaport-preview/"
    "published": "2026-10-22 21:00:00"
    "fetched": "2026-10-23 01:33:06"
    "summary": "<p>AWS launches AWS Interconnect - last mile preview with Megaport, a fully managed connectivity offering that allows customers to connect their branch offices, data centers, and remote locations to AWS with just a few clicks, eliminating the friction and complexity of network setup. As a milestone collaboration between AWS and Megaport, AWS Interconnect - last mile combines AWS cloud innovation with Megaport operating one of the world's largest Software Defined Networks (SDN), with 1,200+ enabled data centers across 31 countries.</p> \n<p>Through the AWS Management Console, customers can now instantly establish private, high-speed connections to AWS by simply choosing their preferred AWS Region, bandwidth speed, Direct Connect Gateway ID and partner subscriber ID. Once initiated, AWS generates an activation key to complete connectivity provisioning with Megaport. The launch simplifies the connectivity experience by pre-provisioning capacity and automating complex network configuration including BGP peering, VLAN configuration, and ASN assignment. At GA, customers will also be able to dynamically scale bandwidth from 1 Gbps to 100 Gbps through the AWS Console. The service is designed for high availability, with zero down-time maintenance, backed by a 99.99% SLA.&nbsp;</p> \n<p>AWS Interconnect - last mile is available in the San Jose (us-west-1) and N. Virginia (us-east-1) metros through Megaport. You can create a preview Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. Partners can also easily adopt via a published open API package on <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub</a>. For more information, see the AWS Interconnect - last mile <a href=\"https://docs.aws.amazon.com/interconnect/\">documentation</a> and <a href=\"https://aws.amazon.com/interconnect/lastmile/pricing/\">pricing pages</a>.</p>"
  "f8efdc155d1a3bac1142c60a717170b8":
    "id": "f8efdc155d1a3bac1142c60a717170b8"
    "title": "Amazon SageMaker AI now supports serverless model customization for Muse Glimmer, Qwen 3.8 and Ministral 3 models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-sagemaker-muse-qwen-ministral/"
    "published": "2026-10-22 17:00:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for Muse Glimmer, Qwen3.8 27B, and Ministral 3 3B, 8B, and 14B models. In addition to deploying these models on SageMaker AI, you can now adapt them to your specific domains and workflows, using supervised fine-tuning (SFT), direct preference optimization (DPO), and reinforcement fine-tuning (RFT) techniques. You can also adapt these models with either low-rank adaptation (LoRA) or full fine-tuning techniques. This launch adds these models to a wide variety of models available for serverless customization on SageMaker AI, including models from the Nova, Gemma 4, Nemotron 3.5, Qwen, Llama, gpt-oss, and DeepSeek families.</p>\n<p>Model customization lets you tailor foundation models with your proprietary data so a smaller, right-sized model can match frontier-model quality on your tasks, while also reducing cost and latency. You can use labeled data with SFT to improve accuracy on domain-specific tasks, preference data with DPO to align outputs with your organization's tone, or reward signals with RFT to improve performance on new tasks. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.</p>\n<p>Serverless model customization on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a> or use our <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-agent-skills.html\">Agent skills</a> with your choice of coding assistant. To learn more and see the full supported list of models, see the Amazon SageMaker AI model customization <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models.html#customizing-models-supported\">documentation</a>.</p>"
  "93e768e535268f8df55d871a22f60a08":
    "id": "93e768e535268f8df55d871a22f60a08"
    "title": "AWS Lambda MicroVMs is now available in 4 additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/lambda-microvms-4-additional-regions"
    "published": "2026-10-22 16:06:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p>AWS Lambda MicroVMs is now available in 4 additional AWS Regions: Asia Pacific (Hong Kong), Asia Pacific (Malaysia), Asia Pacific (Thailand), and Europe (Spain). With this launch, you can use Lambda MicroVMs in a total of 14 AWS Regions.</p> \n<p>Lambda MicroVMs is a serverless compute primitive that provides VM-level isolation, near-instant launch and resume speeds, and state preservation for executing user or AI generated code.&nbsp; Developers can use Lambda MicroVMs to give each user or job their own isolated compute environment without managing virtualization infrastructure or choosing between isolation, speed, and state retention. MicroVMs enable secure, stateful, and responsive code execution for applications including AI coding assistants, interactive development environments, and vulnerability scanners.</p> \n<p>With today's launch, developers can run Lambda MicroVMs closer to their end-users in 4 additional Regions, helping meet latency and data residency requirements. To get started, create a MicroVM image from your Dockerfile, then launch MicroVMs from that image. Give each user or job their own MicroVM with a dedicated HTTPS URL that supports popular connectivity protocols such as HTTP/2, gRPC, and WebSockets. You can use MicroVMs through the AWS Lambda console, AWS CloudFormation, AWS Cloud Development Kit, or with your preferred Agentic development tools using the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/serverless-skills/aws-lambda-microvms\">Agent Toolkit for AWS</a>.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-microvms-guide.html\">AWS Lambda MicroVMs developer guide</a>. For information on pricing, see <a href=\"https://aws.amazon.com/lambda/pricing/\">Lambda MicroVMs pricing</a>. Visit the <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region page</a> for the latest region availability.</p>"
  "ed314faedb26135dc3bf788f9fd8e878":
    "id": "ed314faedb26135dc3bf788f9fd8e878"
    "title": "Amazon Quick Now Available in the AWS Singapore Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-quick-now-available-in-the-aws-singapore-region/"
    "published": "2026-10-22 16:00:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p>Amazon Quick is now available in the AWS Asia Pacific (Singapore) region (ap-southeast-1). This launch allows customers in Singapore to access the full power of Amazon Quick while meeting local requirements for data sovereignty.</p> \n<p>Amazon Quick provides business users an agentic teammate that quickly answers questions at work and turns those answers into actions. With Amazon Quick, every user is empowered to make better decisions faster and take actions without switching applications using AI they can trust. Today’s launch allows customers to take advantage of Amazon Quick’s capabilities including AI-powered chat, Research, Spaces, and QuickSight dashboards — with their data stored and processed locally within the AWS Singapore region.&nbsp;</p> \n<p>For a full list of AWS regions where Amazon Quick is available, visit the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\">Quick regional availability page.</a> To learn more, visit the <a href=\"https://docs.aws.amazon.com/quick/\">Amazon Quick documentation</a> or <a href=\"https://aws.amazon.com/quick/\">product detail page</a>.</p>"
  "6b4d8417fcfba4e6737694cc4e006d67":
    "id": "6b4d8417fcfba4e6737694cc4e006d67"
    "title": "AWS Service Reference Information now supports global condition keys, service names, and data plane classification"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-service-reference-information-global-condition-keys-service-names-data-plane/"
    "published": "2026-10-22 03:00:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p>AWS is expanding programmatic service reference information to help you automate IAM policy management and keep your policies aligned with the latest service updates. The service reference now includes all aws:-prefixed global condition keys in a single machine-readable file, a ServiceName field mapping service identifiers to human-readable names, and an IsDataPlane property identifying which actions are data plane operations.</p> \n<p>You can automate retrieval of this information to eliminate manual effort, and incorporate it directly into your existing policy management tools and processes. This feature is available at no additional cost. To get started, refer to the <a></a><a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/service-reference.html\">documentation on programmatic service reference information</a>.</p>"
  "f02bc988ae9ecfd1edbb333b91931a4a":
    "id": "f02bc988ae9ecfd1edbb333b91931a4a"
    "title": "AgentCore Gateway now supports Bedrock InvokeModel APIs and model fallback"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-gateway-invokemodel-fallback/"
    "published": "2026-10-22 17:00:00"
    "fetched": "2026-10-23 08:51:16"
    "summary": "<p>Amazon Bedrock AgentCore Gateway now supports the Amazon Bedrock InvokeModel and InvokeModelWithResponseStream APIs on its inference endpoint, along with model fallback routing for inference traffic. With InvokeModel support, you can point your existing Amazon Bedrock SDK integration at the gateway and reach any model provider through one governed endpoint, without rewriting client code for each provider. With model fallback, the gateway automatically routes a request to an alternative model or provider when the primary destination is throttled, out of capacity, or unreachable, so your agents stay available without each client implementing its own retry logic.</p> \n<p>For fallback routing, you define an ordered chain of alternative destinations in a gateway rule, along with the conditions that trigger a switch, such as throttling, server errors, or response timeouts. A built-in circuit breaker skips destinations that are currently failing, so requests reach a healthy destination faster and you avoid added latency for failed attempts. Fallback routing happens behind the scenes, which means you send one request and receive one response, regardless of the internal trial and error on a given request.</p> \n<p>These features are available in all AWS Regions where Amazon Bedrock AgentCore Gateway is available (except those in China). To learn more, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-rules-fallback.html\">Amazon Bedrock AgentCore Gateway User Guide</a>.</p>"
"last_updated": "2026-10-23 08:51:16 JST"
