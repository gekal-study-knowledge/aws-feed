    "title": "CVE-2026-112408 - Missing bucket ownership verification in Amazon SageMaker Python SDK default_bucket()"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-142-aws/"
    "published": "2026-10-22 04:54:30"
    "fetched": "2026-10-22 06:11:15"
    "summary": "<p><b>Bulletin ID:</b> 2026-142-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/21/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>The Amazon SageMaker Python SDK is an open-source library for training and deploying machine learning models on Amazon SageMaker. We identified CVE-2026-112408, an issue in the default_bucket() function. The SDK uses a predictably named Amazon S3 bucket and does not check that the caller's AWS account owns it. A remote actor who creates that bucket first could achieve code execution in a remote SageMaker execution environment and obtain IAM credentials.</p> \n<p><b>Impacted versions:</b><br /> - V2: &lt; 2.257.3<br /> - V3: &gt;= 3.0.0 and &lt; 3.10.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-142-aws/\">Read the article</a></p>"
  "30846d268b59300a326c589645098e2f":
    "id": "30846d268b59300a326c589645098e2f"
    "title": "PHP web runtimes (CVE-2026-109618 and CVE-2026-109619)"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-143-aws/"
    "published": "2026-10-22 06:34:50"
    "fetched": "2026-10-22 09:23:59"
    "summary": "<p><b>Bulletin ID:</b> 2026-143-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/21/2026 14:30 PM PDT</p> \n<p><b>Summary:</b></p> \n<p>Two critical vulnerabilities in PHP (CVE-2026-109618 and CVE-2026-109619) allow an unauthenticated remote actor to execute code, access process-accessible data, or cause denial of service on affected PHP workers. Customers running affected PHP versions (8.2–8.5 below the fixed releases, and end-of-life 5.4–8.1) should upgrade immediately to a patched release (8.5.12, 8.4.27, 8.3.36, or 8.2.35); configuration changes alone are not complete mitigations. AWS has identified a limited set of services that run affected PHP versions and is actively deploying mitigations and updates. Review the full bulletin for per-service status, mitigation guidance, and AWS WAF compensating controls.</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-143-aws/\">Read this article</a></p>"
"last_updated": "2026-10-22 09:23:59 JST"
