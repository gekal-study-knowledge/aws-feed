  "0d80fc69c8ca8e1e0b6df91846255756":
    "id": "0d80fc69c8ca8e1e0b6df91846255756"
    "title": "Train Qwen3 on AWS Trainium with torchtitan"
    "link": "https://aws.amazon.com/blogs/machine-learning/train-qwen3-on-aws-trainium-with-torchtitan/"
    "published": "2026-10-22 05:00:22"
    "fetched": "2026-10-22 06:11:15"
    "summary": "Train Qwen3 on AWS Trainium with torchtitan three ways on a single trn2.48xlarge: the Hugging Face Transformers v5 modeling backend, torchtitan's native Qwen3, and NKI mixture-of-experts kernels. The same torchrun launcher and config structure work unchanged across all three paths, including loading and saving published Hugging Face safetensors."
  "252c4a25695417a95ef139513ec36a4e":
    "id": "252c4a25695417a95ef139513ec36a4e"
    "title": "How U.S. Hunger connects leaders and data using Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-u-s-hunger-connects-leaders-and-data-using-amazon-quick/"
    "published": "2026-10-22 04:19:50"
    "fetched": "2026-10-22 06:11:15"
    "summary": "U.S. Hunger, a nonprofit addressing food insecurity, uses Amazon Quick to connect organizational data with leadership decisions. Leaders explore applicant data directly, share KPI definitions and financial context in Quick Spaces, and investigate policy questions with Quick Research."
  "0f38012c0175dae5fb54a47861ca4d55":
    "id": "0f38012c0175dae5fb54a47861ca4d55"
    "title": "Securing Quick access from corporate networks with AWS PrivateLink"
    "link": "https://aws.amazon.com/blogs/machine-learning/securing-quick-access-from-corporate-networks-with-aws-privatelink/"
    "published": "2026-10-22 08:38:38"
    "fetched": "2026-10-22 09:24:00"
    "summary": "Learn how to connect on-premises data sources to Amazon Quick privately with AWS PrivateLink, keeping analytics traffic off the public internet. This walkthrough covers VPC endpoints for user and API access, VPC connections for data sources, DNS and endpoint policies, identity federation, and enforcing VPC-endpoint-only access for compliance."
  "cb6af9cea51a00ac4a2b926b87ba2b39":
    "id": "cb6af9cea51a00ac4a2b926b87ba2b39"
    "title": "5 production challenges in multi-agent systems and how Deep Insight solved them"
    "link": "https://aws.amazon.com/blogs/machine-learning/5-production-challenges-in-multi-agent-systems-and-how-deep-insight-solved-them/"
    "published": "2026-10-22 08:36:47"
    "fetched": "2026-10-22 09:24:00"
    "summary": "Many teams build a multi-agent AI prototype in days but hit a wall in production. This post defines five production challenges (orchestration, per-agent model selection, reliable operation, secure code execution, and monitoring) and shows how Deep Insight, an open source multi-agent system on AWS, solves each."
  "85395e2cd9b52d3c2220c63a32633ab1":
    "id": "85395e2cd9b52d3c2220c63a32633ab1"
    "title": "Adaptive agentic intelligence framework using Strands Agents"
    "link": "https://aws.amazon.com/blogs/machine-learning/adaptive-agentic-intelligence-framework-using-strands-agents/"
    "published": "2026-10-22 06:23:26"
    "fetched": "2026-10-22 09:24:00"
    "summary": "The Adaptive Agentic Intelligence Framework (AAIF), built with Strands Agents, handles routine tasks locally with small language models and routes complex requests to cloud models through Amazon Bedrock. This post walks through building AAIF with local SLMs through Ollama and Amazon Bedrock, using an Internet of Things monitoring scenario."
