"overview": |
  この日は 32 件で、PHP の重大な脆弱性、AWS Security Incident Response の活用、ネットワークスキャンのガイドライン導入、そして接続性とモデルカスタマイズの更新が中心でした。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-112408 は Amazon SageMaker Python SDK の default_bucket() におけるバケット所有者の検証欠落 (Bulletin ID: 2026-142-AWS、2026 年 10 月 21 日 12:30 PDT 公開)、もう 1 件は PHP の Web ランタイムにおける 2 つの重大な脆弱性 CVE-2026-109618 と CVE-2026-109619 (Bulletin ID: 2026-143-AWS、同日 14:30 PDT 公開) です。セキュリティブログでは、Amazon Threat Intelligence が MadPot のテレメトリーから、この 2 つの CVE の公開 4 日前となる 2026 年 10 月 17 日時点の PHP2Shell のエクスプロイト試行を特定していたことが報告されました。あわせて、AWS はお客様のワークロードを対象としたネットワークスキャンのガイドラインを導入しました。ネットワークスキャンは正当なセキュリティ目的にも脅威アクターによる偵察にも使われ、両者を見分けるのが難しいという前提のもと、セキュリティデータに利害を持つ関係者を整理し、ガイドラインに準拠したスキャナーが従うべき 4 つの原則 (観察のみ、識別可能、協調的、機密保持) が示されています。インシデント対応では、AWS Security Incident Response に関する記事が 2 本公開されました。1 本は有効化して概念実証 (POC) を実施し、Amazon GuardDuty の検出結果と AWS Security Hub でサードパーティ製ツールから取り込む一部の検出結果を自動トリアージする仕組み、成功基準の設定、委任管理者やエスカレーションの構成を扱うもの、もう 1 本はランサムウェアの可能性がある不審なアクティビティへの対応シナリオを通じて、GuardDuty や Security Hub と統合した自動トリアージ、AWS Systems Manager による自動封じ込めなど、インシデント対応ライフサイクルの各段階がどう加速されるかを示すものです。あわせて、公共部門の組織がランサムウェアなどのインシデントや自然災害に備えてワークロードを復旧できるようにするためのプロアクティブな戦略が、NIST CSF 2.0 と AWS Well-Architected フレームワークを踏まえて解説され、マルチアカウント戦略と Infrastructure as Code (IaC) によるインフラ構築の自動化が取り上げられました。セキュリティブログではさらに、AWS IAM Roles Anywhere を自社の PKI と統合するベストプラクティスが公開されました。一時的な認証情報の利用は認証情報が侵害されたときのリスクを下げるセキュリティのベストプラクティスであり、IAM Roles Anywhere によって AWS 外のワークロードもその恩恵を受けられるという位置づけです。推論基盤では、AWS Neuron 2.33 が公開され、AWS Trainium 向けのネイティブ PyTorch バックエンド TorchNeuron がパブリックベータとして導入されました。標準の PyTorch API で書いたモデルを Amazon EC2 Trn2 などで動かせるようになり、Neuron Observer などの新機能も加わっています。あわせて、Qwen3 を単一の trn2.48xlarge 上で torchtitan を使って学習する 3 つの方法 (Hugging Face Transformers v5 のモデリングバックエンド、torchtitan ネイティブの Qwen3、NKI の Mixture-of-Experts カーネル) が解説されました。エージェント関連では、Strands Agents で構築した Adaptive Agentic Intelligence Framework (AAIF) が紹介されました。定型的なタスクは小規模言語モデルでローカルに処理し、複雑なリクエストは Amazon Bedrock 経由でクラウドのモデルへ振り分ける構成です。あわせて、マルチエージェントの試作は数日でできても本番で壁に当たるという問題意識から、オーケストレーション・エージェントごとのモデル選択・安定した運用・安全なコード実行といった 5 つの本番課題と Deep Insight による解決方法が示され、AWS Step Functions の決定論的なオーケストレーションと Amazon Bedrock AgentCore のハーネスによる範囲を限定したエージェント的推論を組み合わせ、安い手段から順にエスカレーションする医療コーディングのワークフローも公開されました。分析では、Amazon Quick へオンプレミスのデータソースを AWS PrivateLink で private に接続し、分析トラフィックをパブリックインターネットに出さない構成 (ユーザー用と API 用の VPC エンドポイント) が解説され、食の不安に取り組む非営利団体 U.S. Hunger が Amazon Quick で組織のデータと経営判断を結びつけ、リーダー自身が申請者データを直接探索し KPI の定義を共有している事例も紹介されました。サービス更新では、Amazon Aurora と Amazon RDS がオンデマンドキャパシティ予約に対応し、1 つ以上のアベイラビリティゾーンで DB インスタンス用のコンピュート容量を必要な期間だけ確保できるようになりました。Amazon Cognito のマルチリージョンレプリケーション (MRR) が AWS GovCloud (US) リージョンに拡大し、AWS Direct Connect はイングランドのマンチェスター近郊にある Equinix MA3 データセンターの既存ロケーションで、MACsec 暗号化に対応した 10 Gbps および 100 Gbps の専用接続を拡張しました。AWS Transform の移行アセスメントはオンプレミスのストレージを対象に加え、Amazon S3・EBS・EFS・FSx への移行について、プロトコル・容量・性能にまたがる数千のボリュームを手で分析せずに評価できるようになりました。PHP の脆弱性については記事が 4 本 (日英 2 本ずつ) 追加されました。PHP プロジェクトは 2026 年 10 月 21 日に、PHP コアランタイムの 2 件の重大なリモートコード実行の脆弱性 CVE-2026-109618 と CVE-2026-109619 (総称 PHP2Shell) に対する緊急修正を公開しました。いずれも CVSS v4.0 で 9.2 (Critical) と評価され、認証なしの攻撃者が脆弱なサーバーでコードを実行できます。完全な修正は PHP のアップグレードのみですが、パッチ適用期間中に AWS WAF で露出を下げる方法として、セッションアップロード進捗フィールドや multipart リクエストのブロック、本文サイズの上限設定、レートベースのルールが、AWS WAFv2 の JSON ルール例と Count モードから Block への段階的なデプロイ手順とともに示されました。AWS WAF による保護の限界と、補完するサーバー側の緩和策にも触れています。あわせて Amazon Threat Intelligence が、MadPot のテレメトリから公開の 4 日前にあたる 2026 年 10 月 17 日の悪用の試みを特定したことを公表しました。試みは商用の匿名化ネットワークに関連する IP アドレスからのもので、エンバーゴ期間中にハニーポットが匿名化 IP から狙われていたことになります。記事はエンバーゴの限界、AI を活用した分析でパッチ公開からエクスプロイト作成までの時間が短くなっている現状、時間単位でのパッチ適用やシグネチャに依存しない検出といった前提の見直し、直ちに実施すべき対策と侵害指標 (IOC) を扱っています。日本のブログではさらに 3 本が公開されました。Amazon EKS Auto Mode のノード障害の扱いを解説する記事では、ノードモニタリングエージェントと Karpenter が既定で連携して検出・ドレイン・置き換えのサイクルを回す仕組み、どの障害が置き換えを引き起こすのか、SSH を使わずに診断情報を集める方法が示されています。残りの 2 本は Amazon ECS ゲートウェイの紹介と、AWS Lambda Web Functions や Vercel Marketplace の Amazon S3 などを扱う週刊まとめ (2026 年 10 月 19 日) の日本語版です。ネットワークでは AWS Interconnect - last mile のプレビューが Megaport との協業で始まりました。支社・データセンター・遠隔拠点を数クリックで AWS に接続できるフルマネージドの接続サービスで、Megaport は 31 か国 1,200 以上のデータセンターで有効化された大規模な SDN を運用しています。マネジメントコンソールで希望する AWS リージョン、帯域、Direct Connect ゲートウェイ ID、パートナーのサブスクライバー ID を選ぶと、AWS がアクティベーションキーを生成して Megaport 側のプロビジョニングを完了させます。モデルカスタマイズでは、Amazon SageMaker AI のサーバーレスモデルカスタマイズが Muse Glimmer、Qwen3.8 27B、Ministral 3 の 3B・8B・14B に対応しました。これらのモデルをデプロイするだけでなく、教師ありファインチューニング (SFT)、直接選好最適化 (DPO)、強化ファインチューニング (RFT) で自社のドメインやワークフローに合わせられ、LoRA と完全なファインチューニングのどちらも選べます。コンピュートでは AWS Lambda MicroVMs がアジアパシフィック (香港・マレーシア・タイ) とヨーロッパ (スペイン) の 4 リージョンに追加され、合計 14 リージョンになりました。VM レベルの分離、ほぼ即時の起動と再開、状態の保持を備えたサーバーレスのコンピュートプリミティブで、ユーザーや AI が生成したコードの実行に使えます。分析では Amazon Quick がアジアパシフィック (シンガポール) リージョン (ap-southeast-1) で利用可能になり、データをシンガポール内に保存・処理したままチャット・Research・Spaces・QuickSight ダッシュボードを使えるようになりました。IAM では、プログラムから取得できるサービスリファレンス情報が拡張され、aws: で始まるグローバル条件キーを 1 つの機械可読ファイルにまとめ、サービス識別子を人間が読める名前に対応づける ServiceName フィールドと、どのアクションがデータプレーンの操作かを示す IsDataPlane プロパティが加わりました。追加費用はかかりません。エージェント基盤では、Amazon Bedrock AgentCore Gateway が推論エンドポイントで Amazon Bedrock の InvokeModel と InvokeModelWithResponseStream API に対応し、推論トラフィックのモデルフォールバックのルーティングも加わりました。InvokeModel に対応したことで、既存の Amazon Bedrock SDK の組み込みをゲートウェイに向けるだけで、プロバイダーごとにクライアントのコードを書き換えずに、統制された 1 つのエンドポイントからどのモデルプロバイダーにも到達できます。モデルフォールバックでは、主たる宛先がスロットリングされた場合、容量が足りない場合、到達できない場合に、ゲートウェイが自動的に別のモデルやプロバイダーへリクエストを振り向けるため、クライアントごとにリトライのロジックを実装しなくてもエージェントを動かし続けられます。
