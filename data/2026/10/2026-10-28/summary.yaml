"overview": |
  この日はセキュリティとコンプライアンス、データベースやコンテナの機能強化、そして生成 AI の事例が並びました。セキュリティでは、AWS がカナダの Cloud High (PBHH) プロファイル評価を 172 のサービスと機能を対象に完了した初の CSP となったことが発表され、11 月 9 日にフランス語訳へのリンクが追加されました。AWS API MCP Server の OAuth トークンの audience 検証をバイパスできる脆弱性 CVE-2026-115413 の速報 (Important) も出ており、Route 53 Resolved IP Validation for AWS Network Firewall の解説もありました。データベースでは Aurora serverless の上限が 256 から 384 ACU へ 50% 拡大し、ElastiCache for Valkey は既存クラスターでの durability 切り替えと、欧州 (スペイン)・アジアパシフィック (ハイデラバード) での R8gd / R7gd データ階層化に対応しました。ECS は NVIDIA MPS による GPU 共有、SageMaker AI は SOCI インデックスによるジョブ起動の高速化と MLflow 3.16 に対応しています。ほかに AWS Backup の Redshift 復元テスト、IAM Identity Center の Identity Store の EventBridge 通知、AWS Marketplace と Amazon Business の統合ストアフロント、AWS Agent Registry の 4 リージョン追加がありました。国内ではドコモSMTBネット銀行の Amazon Connect 活用事例や、11 月 1 日からの Kiro 無料トライアル変更 (500 クレジット付与) が紹介されています。
