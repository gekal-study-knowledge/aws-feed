"overview": |
  この日は 7 ソースから 19 本。セキュリティ速報は 1 件で Important (要対応)。CVE-2026-115413 は AWS API MCP Server における OAuth トークンのオーディエンス検証の不備である (Bulletin ID: 2026-152-AWS、2026 年 10 月 27 日 11:00 PDT 公開)。1.3.0 以上 1.6.0 未満では、streamable-http トランスポートと OAuth 認証の構成でトークンの署名・発行者・有効期限は検証するものの、発行先アプリケーションを示すクレームを検証していなかった。What's New では Amazon Aurora serverless が Aurora PostgreSQL 互換エディションで最大 384 ACU (従来上限 256 ACU から 50% 増、最大 768 GiB メモリ) に対応、Amazon ECS が NVIDIA Multi-Process Service (MPS) による GPU 共有に対応し 1 つの GPU で複数タスクを同時実行可能に、ElastiCache for Valkey が既存のノードベースクラスターで耐久性 (durability) の有効化・無効化に対応、SageMaker AI MLflow Apps が MLflow 3.16 (トレーシング体験の刷新と実験追跡の高速化) に対応した。Security Blog では AWS Network Firewall 向けの Route 53 Resolved IP Validation の紹介、AWS が 172 のサービスと機能を対象とする Cloud High (PBHH) 評価を完了し最初の CSP になったこと、サイバーセキュリティのキャリア連載の第 3 回。機械学習では SageMaker AI の学習・処理ジョブ向けの SOCI (Seekable OCI) インデックス付きイメージ、Exowatt のサーバーレスモデルカスタマイズ事例、Property Finder の評価バイアス是正 (評価ラベルの 96.8% が既存モデル由来)、AWS Connect Customer の 2026 年 Gartner Magic Quadrant for CCaaS でのリーダー選出。Compute Blog では Lambda と Bedrock AgentCore エージェントが Amazon S3 Files 越しに文書群を調査する構成、アーキテクチャでは Anchorage Digital と Turnkey の Nitro Enclaves によるコード検証、Manta Marine Technologies の船舶ごとの航海最適化、Kiro による SCORM パッケージ作成パイプライン。AWS Japan Blog では、11 月 1 日から Kiro の無料トライアルが変わり初回 Pro アップグレード時にその月の残りが無料かつ 12 か月有効な 500 トライアルクレジットが付与されること、北米の大手電力会社による Bedrock AgentCore 上のマルチエージェントでのアラーム管理 (トリアージが数時間から数分に)、ドコモSMTBネット銀行の Amazon Connect Customer AI agents による電話・チャット応対の高度化が公開された。
