    "title": "CVE-2026-115413 - AWS API MCP Server OAuth token audience validation bypass"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-152-aws/"
    "published": "2026-10-28 03:14:19"
    "fetched": "2026-10-28 06:46:06"
    "summary": "<p><b>Bulletin ID:</b> 2026-152-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/27/2026 11:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The AWS API MCP Server is an open source Model Context Protocol (MCP) server that enables AI assistants to interact with AWS services and resources through AWS CLI commands. It can be configured to serve the streamable-http transport with OAuth authentication, validating a bearer token against an identity provider nominated by the operator. We identified CVE-2026-115413 in versions &gt;=1.3.0 and &lt;1.6.0, the server validates a token's signature, issuer and expiry, but not the claim identifying the application the token was issued for.</p> \n<p><b>Impacted versions:</b> &gt;=1.3.0 AND &lt;1.6.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-152-aws/\">Read this article</a></p>"
"last_updated": "2026-10-28 06:46:06 JST"
