  "87d30500e0ec4f55f548a8f7386a0c94":
    "id": "87d30500e0ec4f55f548a8f7386a0c94"
    "title": "Amazon Bedrock AgentCore を使用した電力・公益事業向けのインテリジェントなアラーム管理"
    "link": "https://aws.amazon.com/jp/blogs/news/intelligent-alarm-management-for-power-and-utilities-using-amazon-bedrock-agentcore/"
    "published": "2026-10-28 09:46:01"
    "fetched": "2026-10-28 09:56:19"
    "summary": "北米の大手電力会社が Amazon Bedrock AgentCore 上で運用しているマルチエージェント AI アーキテクチャを紹介します。このアーキテクチャにより、オペレーターがシフトごとに何十回も、複数のシステムをまたいで手作業で行っていた調査が不要になり、アラームのトリアージにかかる時間が数時間から数分に短縮されています。業界の課題、マルチエージェントの設計、GitHub 上のリファレンス実装について説明します。"
  "2d9140325f02d2fe78cabc2dcaf66792":
    "id": "2d9140325f02d2fe78cabc2dcaf66792"
    "title": "Kiro の新しい無料トライアルで 500 クレジットを追加提供"
    "link": "https://aws.amazon.com/jp/blogs/news/kiros-new-free-trial-gives-you-500-extra-credits/"
    "published": "2026-10-28 15:20:37"
    "fetched": "2026-10-28 15:38:13"
    "summary": "11 月 1 日から Kiro の無料トライアルが変わります。初めて Pro にアップグレードすると、その月の残りは無料になり、12 か月間使える 500 トライアルクレジットも付与されます。プラン料金とクレジットは秒単位で日割り計算されます。上位プランで開始した場合は、日割りの Pro 料金との差額のみを支払います。本記事では、変更内容、計算方法、15 日にアップグレードした場合の各プランの金額とクレジットを紹介します。"
  "22d27d556b6fb2e0abea6adc24a39879":
    "id": "22d27d556b6fb2e0abea6adc24a39879"
    "title": "ドコモSMTBネット銀行が電話・チャット両チャネルで実践する Amazon Connect Customer AI agents による応対高度化"
    "link": "https://aws.amazon.com/jp/blogs/news/docomo-smtb-net-bank-amazon-connect-customer-ai-agents/"
    "published": "2026-10-28 12:14:59"
    "fetched": "2026-10-28 15:38:13"
    "summary": "コンタクトセンターへの生成 AI 導入は、すでに「試してみる」段階を越えつつあります。導入から数年が経ったコンタクトセンターでよく伺うのは、FAQ の回答精度が思ったほど伸びないという悩みです。窓口を増やすたびに開発が必要になる、利用量が増えたときのコストが読めない、といった二周目の課題もここに重なります。 株式会社ドコモSMTBネット銀行（以下、ドコモSMTBネット銀行）は、生成 AI による自動応対をすでに本番で運用していました。その基盤を Amazon Connect Customer AI agents に移し、2026 年 9 月から電話とチャットの両チャネルで応対を開始しました。本ブログでは、なぜ基盤を移したのか、そして本番導入に向けて何を作り込んだのかをご紹介します。"
  "004a350c8ac6a70499bef1fab151ca2e":
    "id": "004a350c8ac6a70499bef1fab151ca2e"
    "title": "週 1,000 件の PR でもソフトウェアファクトリーを安定させる方法"
    "link": "https://aws.amazon.com/jp/blogs/news/software-factory-stability/"
    "published": "2026-10-28 19:59:02"
    "fetched": "2026-10-28 22:47:14"
    "summary": "Kiro Crew チームが、週 1,000 件のプルリクエストをマージしながら品質を保つ方法を紹介します。人間がすべての行を読まなくても確信を得られるよう、レビューの重大度分け、役割別の AI レビュアー、80 件以上のチェックを 1 つにまとめる PR Readiness 判定、prepare-pr スキルによる自動修正ループ、マージ後のセキュリティ対策へと段階的に発展させた過程を解説します。過剰なエンジニアリングへの対処法も紹介します。"
