  "51701ecae2134ec3ac6fcaf5e5a713f3":
    "id": "51701ecae2134ec3ac6fcaf5e5a713f3"
    "title": "Amazon Aurora serverless now supports up to 384 ACUs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aurora-serverless-supports-384-acu/"
    "published": "2026-10-28 01:00:00"
    "fetched": "2026-10-28 06:46:04"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\" target=\"_blank\">Amazon Aurora serverless</a> now supports database capacity of up to 384 Aurora Capacity Units (ACUs) for Aurora PostgreSQL-Compatible Edition, a 50% increase from the previous maximum of 256 ACUs. Each ACU provides approximately 2 gibibytes (GiB) of memory with corresponding CPU and networking, so a single Aurora serverless database can now scale up to 768 GiB of memory. When the workload completes, Aurora serverless automatically scales down to zero. This makes Aurora serverless especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable traffic patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents, so you only pay for what you use.</p> \n<p>With 384 ACU support, customers can now use Aurora serverless for even more demanding workloads while continuing to scale down to zero when not in use, paying only for the capacity consumed. For new clusters, select a supported Aurora PostgreSQL engine version and set your maximum capacity up to 384 ACUs. For existing clusters on Platform Version 4, simply modify the cluster to update the maximum capacity setting (and the engine version if needed). There will be no downtime if your database is already on Platform Version 4. For existing clusters on older platform versions, upgrade to Platform Version 4 through a pending maintenance action. 384 ACU support is available for Aurora PostgreSQL versions 18.4, 17.10, 16.14, 15.18, and 14.23, running on Platform Version 4.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html#aurora-serverless-v2.how-it-works.capacity\" target=\"_blank\">Aurora serverless capacity</a> in the Amazon Aurora User Guide. For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\" target=\"_blank\">Amazon Aurora Pricing</a>. &nbsp;To get started, create or modify an Aurora serverless database in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\" target=\"_blank\">AWS Management Console</a>.</p>"
  "085be3a265348df072a9af63800d9f53":
    "id": "085be3a265348df072a9af63800d9f53"
    "title": "SageMaker MLflow Apps now support MLflow 3.16"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/mflow-version-3-16/"
    "published": "2026-10-28 05:40:00"
    "fetched": "2026-10-28 09:56:18"
    "summary": "<p>Amazon SageMaker AI MLflow Apps now support MLflow 3.16, bringing a redesigned tracing experience and faster experiment tracking to your generative AI and machine learning workflows.</p> \n<p>MLflow 3.16 improves debugging and analysis of generative AI applications and agents. The redesigned trace explorer is now the default, with adjustable row height, reorderable columns, custom columns from any trace tag or metadata field. This release also accelerates metric charts for experiments with large metric histories.</p> \n<p>New MLflow Apps are created on MLflow 3.16 by default. Existing MLflow Apps will be upgraded to MLflow 3.16 during an upcoming maintenance window, with no action required.</p> \n<p>MLflow 3.16 is available in all AWS Regions where MLflow Apps are available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html\">SageMaker AI MLflow developer guide</a>.</p>"
  "31673d871d3f2e7edc89435957d4059c":
    "id": "31673d871d3f2e7edc89435957d4059c"
    "title": "Amazon ElastiCache for Valkey now supports changing durability on existing clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/elasticache-changing-durability/"
    "published": "2026-10-28 00:21:00"
    "fetched": "2026-10-28 09:56:18"
    "summary": "<p>Amazon ElastiCache for Valkey now lets you enable or disable durability on your existing node-based clusters without creating a new cluster. Previously, you couldn't change the durability configuration of an existing cluster in place. This made it harder to move from caching to persistent data store use cases, or to adapt as your application requirements change. Now you can change durability at any point in your application's lifecycle.</p> \n<p>You can choose between two durability options: synchronous and asynchronous writes. Synchronous writes persist data across at least two AZs before responding to the client, designed for zero data loss at single-digit millisecond write latency. Asynchronous writes persist data after responding to the client, maintaining microsecond write latency at no additional cost. However, up to 10 seconds of uncommitted data could be lost in the rare event of a failure. Both options maintain microsecond read latency. You can now use ElastiCache for a broader set of use cases beyond caching where data loss is unacceptable such as AI agent long-term memory, AI agent workflow state, knowledge bases for RAG applications, payment tokenization, and real-time inventory management.</p> \n<p>This feature is available in all AWS Regions where ElastiCache for Valkey 9.0 and later is available. To get started, use the AWS Management Console, AWS SDK, or AWS CLI. For pricing, see the &nbsp;<a href=\"https://aws.amazon.com/elasticache/pricing/\">Amazon ElastiCache pricing page&nbsp;</a>. To learn more, see &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/\">Durability&nbsp;</a> in the ElastiCache documentation.</p>"
  "71cc3d0871751abfebe507dacd68a0de":
    "id": "71cc3d0871751abfebe507dacd68a0de"
    "title": "Amazon ECS now supports GPU sharing with NVIDIA Multi-Process Service (MPS)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ecs-gpu-sharing-nvidia-mps/"
    "published": "2026-10-28 08:31:00"
    "fetched": "2026-10-28 15:38:13"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now supports GPU sharing with NVIDIA Multi-Process Service (MPS), enabling you to run multiple Amazon ECS tasks concurrently on a single NVIDIA GPU. GPU sharing helps you increase GPU utilization and reduce infrastructure costs for workloads that use only part of a GPU's capacity, such as small-model inference, AV/ADAS simulations, embedding generation, and multi-model serving.</p> \n<p>With GPU sharing, you can pack more workloads onto each GPU instance without changing your application code. You define the GPU memory each container needs and can optionally set a maximum share of GPU compute, and Amazon ECS places tasks on GPUs with available capacity as your services scale and deploy. GPU sharing is supported on Amazon ECS Managed Instances and Amazon ECS on Amazon EC2. On Amazon ECS Managed Instances, Amazon ECS also monitors the MPS control daemon that enables sharing on each instance. If the daemon stops or becomes unhealthy, Amazon ECS automatically replaces the instance and moves your tasks to healthy capacity, so your GPU workloads keep running without manual intervention.</p> \n<p>To get started, use the AWS Management Console, AWS CLI, AWS SDKs, AWS CloudFormation, or other infrastructure-as-code tools to create a capacity provider with NVIDIA GPU instances, set the GPU sharing strategy and memory in the container definition of your task definition, and create a service on that capacity provider. This capability is available in all AWS commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Regions</a>. To learn more, visit the Amazon ECS GPU sharing <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu-sharing.html\" target=\"_blank\">documentation</a>.</p>"
  "7a89f67360d9c2c15d5e0c4c1164ee1b":
    "id": "7a89f67360d9c2c15d5e0c4c1164ee1b"
    "title": "AWS Backup adds restore testing support for Amazon Redshift"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-backup-adds-redshift-restore-testing/"
    "published": "2026-10-28 17:00:00"
    "fetched": "2026-10-29 08:51:21"
    "summary": "<p>AWS Backup restore testing now supports Amazon Redshift. Restore testing helps you automate and periodically run restore tests of your backups, so you can confirm that your Amazon Redshift backups restore successfully and measure how long the restores take.</p> \n<p>You can now include Amazon Redshift in your restore testing plans alongside other supported AWS resources across storage, compute, and database services. Restore testing plans automatically select recovery points, run restores on a schedule, and measure restore job completion time against your recovery time objectives (RTO). This helps you evaluate recovery readiness and meet regulatory and compliance requirements for disaster recovery and business continuity.</p> \n<p>To get started, create a restore testing plan and assign your Amazon Redshift resources by Amazon Resource Name (ARN) or tag. Choose whether each test restores the latest or a random eligible recovery point. Optionally, use restore testing validation to confirm the restored resource before AWS Backup deletes the test resources.</p> \n<p>This support is available in all AWS Regions where both restore testing and Amazon Redshift are supported by AWS Backup. You can use the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. For a complete list of supported Regions and features, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\" target=\"_blank\">AWS Backup documentation</a>. To learn more about restore testing, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/restore-testing.html\" target=\"_blank\">product page</a> and <a href=\"https://aws.amazon.com/backup/pricing/\" target=\"_blank\">pricing page</a>.</p>"
  "d944fa1712afb66460a7270aa4ebcff5":
    "id": "d944fa1712afb66460a7270aa4ebcff5"
    "title": "AWS IAM Identity Center's Identity Store now supports change notifications through Amazon EventBridge"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-identity-store-change-notifications/"
    "published": "2026-10-28 17:00:00"
    "fetched": "2026-10-29 08:51:21"
    "summary": "<p>AWS IAM Identity Center's Identity Store now delivers real-time events to Amazon EventBridge when users, groups, or group memberships or the identity store itself is created, updated, or deleted. AWS IAM Identity Center Identity Store is a central repository that allows you to manage identities and access across AWS accounts and applications, serving as the identity source for AWS IAM Identity Center. This new capability helps you automatically respond to identity lifecycle events and support your security and compliance processes by detecting changes as they happen.</p> \n<p>With Identity Store change notifications, you can build automated workflows that respond to identity changes in your organization. For example, security teams can create EventBridge rules that trigger AWS Lambda functions to audit user provisioning activity, send alerts to security information and event management (SIEM) systems, or update access in downstream applications when users or groups change. Organizations that manage large workforces can also use this data to automate onboarding and offboarding when users are added to or removed from specific groups.</p> \n<p>Change notifications are available in all AWS Regions where IAM Identity Center is available, and events are sent in each enabled Region of your instance. For the list of Regions, see <a href=\"https://builder.aws.com/build/capabilities/explore?tab=service-feature&amp;f=eJwdi0EKhDAUQ68yZK2L2fYAc4DZ-ouIZqQgtrRfQaR3909XeeElNwo3zsrlyzXEvcBhEByl51S0fws8OqQcE7Oen7Ap8_jjpEemTW9BEjhBzIJOoFYGb7D-wWxs1jV5NggLdw16vWZL2q36ivoAQn8tDw\">AWS capabilities by Regions</a>. Change notifications are available at no additional cost beyond standard Amazon EventBridge usage charges. To learn more, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/event-notifications.html\">Event notifications</a> in the AWS IAM Identity Center User Guide and <a href=\"https://docs.aws.amazon.com/eventbridge/latest/ref/events-ref-identitystore.html\">Identity Store events</a> in the Amazon EventBridge Events Reference.</p>"
  "7240c95abafa83ac6a7158eda0cb9f9c":
    "id": "7240c95abafa83ac6a7158eda0cb9f9c"
    "title": "Amazon Connect Customer supports inline attachment previews"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-attachment-previews/"
    "published": "2026-10-28 04:15:00"
    "fetched": "2026-10-29 08:51:21"
    "summary": "<p>Amazon Connect Customer lets agents preview attachments directly in the agent workspace, reducing contact handling time and limiting the need to download sensitive customer information. Agents can preview PDFs, images, and text files across email, chat, and cases, navigate between attachments, and view multi-page documents without leaving the conversation.</p> \n<p>Amazon Connect Customer attachment previews is available in the US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), and Europe (London) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">regions</a>.</p> \n<p>To learn more and get started, please refer to the help <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/preview-attachments.html\">documentation</a> or visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer</a> website.</p>"
  "6ac7b7ea184b80b1ea5421cfcf3a47aa":
    "id": "6ac7b7ea184b80b1ea5421cfcf3a47aa"
    "title": "Amazon ElastiCache expands data tiering to R8gd and R7gd nodes in Europe (Spain) and Asia Pacific (Hyderabad)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/elasticache-data-tiering-spain/"
    "published": "2026-10-28 00:25:00"
    "fetched": "2026-10-29 08:51:21"
    "summary": "<p>Amazon ElastiCache for Valkey data tiering is now available on Graviton4-based R8gd nodes in the AWS Europe (Spain) Region, and on Graviton3-based R7gd nodes in the Europe (Spain) and Asia Pacific (Hyderabad) Regions. Data tiering is a lower-cost way to scale your Valkey clusters to hundreds of terabytes of capacity. It uses solid state drives (SSDs) on each node alongside memory. When memory fills up, ElastiCache automatically moves the least recently used items to SSD. When your application reads an item stored on SSD, ElastiCache moves it back into memory before serving the request. Data tiering is a good fit for workloads that regularly access up to 20% of their dataset, and for applications that can tolerate some extra latency when they read data from SSD.</p> \n<p>R8gd nodes are powered by AWS Graviton4 processors. They deliver up to 47% higher throughput, up to 43% lower P99 latency, and up to 31% better price-performance than Graviton3-based nodes of the same size. R7gd nodes are powered by AWS Graviton3 processors. They deliver up to 28% more throughput (read and write operations per second), up to 21% better P99 latency, and up to 25% more network bandwidth than Graviton2-based nodes. Actual performance varies by node size and workload.</p> \n<p>You can use data tiering on R8gd and R7gd nodes with Valkey 7.2 and later. To get started, create a new cluster or upgrade an existing one with the AWS Management Console, the AWS CLI, or the AWS SDKs. For pricing, see the &nbsp;<a href=\"https://aws.amazon.com/elasticache/pricing/\">Amazon ElastiCache pricing page&nbsp;</a>. To learn more, see &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/data-tiering.html\">Data tiering&nbsp;</a> and &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheNodes.SupportedTypes.html\">Supported node types&nbsp;</a> in the ElastiCache documentation.</p>"
  "b1e1cbf0e9d8667ec1ebe3f208fc6b9a":
    "id": "b1e1cbf0e9d8667ec1ebe3f208fc6b9a"
    "title": "Announcing the AWS Marketplace and Amazon Business unified storefront"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/marketplace-business-storefront/"
    "published": "2026-10-28 17:00:00"
    "fetched": "2026-10-29 13:10:27"
    "summary": "<p>Today, AWS Marketplace and Amazon Business announced the unified storefront. Organizations can now give their teams one curated catalog that puts software, data, and AI tools from AWS Marketplace alongside physical goods and supplies from Amazon Business. Many enterprises already buy from both, but they manage two catalogs with duplicated approval rules and separate reporting. The unified storefront can now give procurement teams one front door for both.</p>\n<p>Built on AWS Marketplace Storefront, the unified storefront lets administrators connect their organization's Amazon Business account and import Amazon Business products into their branded storefront. Administrators set governance rules once, and they apply across both catalogs. Buyers can browse AWS Marketplace listings and Amazon Business products in one place. Purchases of AWS Marketplace listings complete directly in the storefront and appear on the customer's AWS invoice. When a buyer selects an Amazon Business product, single sign-on takes them to an authenticated Amazon Business cart, so they don't need a second login. Each storefront connects only to the accounts its administrator sets up.</p>\n<p>The Amazon Business connector is available in all AWS Regions where AWS Marketplace operates to AWS Marketplace Storefront customers who have access to both the AWS Marketplace and Amazon Business APIs.</p>\n<p>To learn more, visit the <a href=\"https://aws.amazon.com/marketplace/partners/storefront\">AWS Marketplace Storefront product page</a> and the <a href=\"https://docs.aws.amazon.com/marketplace/latest/storefrontguide/what-is-marketplace-storefront.html\">AWS Marketplace Storefront User Guide</a>.</p>"
