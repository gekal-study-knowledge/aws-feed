"overview": |
  この日は 26 件 (重複を除くと 25 件) で、AWS Continuum for code vulnerabilities の一般提供、セキュリティ速報 4 件、SageMaker AI のトレーニングセッション API、そして検索と分析の更新が中心でした。セキュリティ速報はいずれも Important (要対応) です。CVE-2026-115419 は AI エージェント構築用のオープンソース SDK である Strands Agents の Agent2Agent (A2A) サーバーコンポーネントで、呼び出し元ごとの会話状態が適切に分離されていなかった問題です (Bulletin ID: 2026-146-AWS、2026 年 10 月 22 日 13:00 PDT 公開)。マルチテナントの構成では、認証済みのリモートユーザーが他の呼び出し元の会話履歴にアクセスしたり、他の呼び出し元に対するモデルの振る舞いに影響を与えられる可能性があります。CVE-2026-115414 は AWS SAM CLI の Terraform フック (sam build --hook-name terraform) における OS コマンドインジェクションです (Bulletin ID: 2026-145-AWS、同日 11:30 PDT 公開)。フックが生成する Makefile のレシピが Terraform のリソースアドレスをシェルのメタ文字を十分に無効化せずに埋め込むため、ビルドが読み込む Terraform の構成やプランファイルに影響を与えられる者が、ビルド実行ユーザーとして任意のコマンドを実行できる可能性があります。CVE-2026-115416 は Amazon Athena エンジンバージョン 3 のクエリ処理における認可チェックの誤りです (Bulletin ID: 2026-144-AWS、同日 09:30 PDT 公開)。認証済みユーザーが他の AWS アカウントの AWS アカウント識別子と SQL ステートメントのテキストというクエリメタデータを読める可能性がありましたが、クエリ結果や Amazon S3 などのデータソースに保存されたデータにはアクセスできません。モデルカスタマイズでは、Amazon SageMaker AI のサーバーレスモデルカスタマイズにトレーニングセッション API が加わり一般提供となりました。GPU インフラをプロビジョニングも管理もせずに、事後学習のアルゴリズムを完全に自分で制御できます。従来のマネージドな手法では SFT・DPO などの強化学習の技法とモデルを選べば SageMaker AI が学習を実行していましたが、トレーニングセッション API では学習ループ自体を書けるため、SFT や DPO を自分の条件で再現することも、独自の損失関数、新しい強化学習の報酬信号、データカリキュラム、最新の研究論文のアルゴリズムを実装することもできます。GPU の割り当て、分散実行、障害からの復旧、チェックポイントの保存はサービスが扱います。機械学習ブログでは、このプログラミングモデルと 3 つの SDK クライアントを紹介し、GSM8K での GRPO ループと競技プログラミングの強化学習ワークロードを通して解説する記事が公開されました。音声では、Amazon Polly の Generative エンジンが大きく更新されました。より表現力があり正確な音声を低レイテンシーで提供し、9 つのロケールで 14 の新しい声が加わり、ヒンディー語とフィンランド語が一般提供となりました。コードの変更が不要なドロップインの更新で、本番環境で一般提供されています。あわせて機械学習ブログでは音声関連が 2 本公開されました。1 本は Amazon SageMaker AI 上のカスタム音声合成モデルのオートスケーリングで、しきい値を勘で決めると GPU の費用を無駄にするかレイテンシーの SLO を破るかのどちらかになるため、Kokoro-82M をカスタムコンテナとしてデプロイし、稼働中のエンドポイントから Q_max と T_total の 2 つを実測して自動スケーリングのポリシーを導く方法です。もう 1 本は、エージェントの応答全体を待たずに文ごとに Kokoro-82M へ流し込んで音声を生成し、Server-Sent Events または統合されたバイナリ転送でブラウザへ返す低レイテンシーのストリーミング手法です。運用では、AWS CloudFormation の更新ロールバックが簡単になりました。一部のリソースが自動でロールバックできない場合に、強制ロールバックによって 1 回の操作でロールバックを完了させ、スタックをデプロイ可能な状態へ戻せます。従来は影響を受けたリソースを特定・列挙して個別にリトライする必要がありました。AWS CLI・SDK から AWS CDK や AI エージェントまで、あらゆる CloudFormation のワークフローで使えます。コンピュートブログでは、Amazon EC2 の Replace Root Volume を直接 Amazon EBS ボリュームを指定する方式で使い、置き換え用のルートボリュームを事前に用意して検証してから、稼働中の本番インスタンスに 1 回の再起動で差し替える手順が解説されました。インスタンスの本番 ID を保ったまま OS のアップグレードとパッチ適用ができ、Auto Scaling グループ内のインスタンスも対象です。事例としては、Rescale が AWS 上で AI 駆動開発ライフサイクル (AI-DLC) のフレームワークを使い、Strands Agents と Amazon Bedrock でテストのトリアージを行うエージェントを数週間で構築した取り組みと、イベリア半島のペットケア企業 IskayPet が Amazon Bedrock Managed Knowledge Bases 上に多言語の社内ナレッジアシスタントを構築し、小売・動物病院・オンボーディング・調達にまたがる従業員の質問に 4 言語・3 か国で答えている事例 (RAG のインフラ管理なし) が紹介されました。あわせて Amazon Quick は HIPAA 対象サービスではあるものの対象であることと準拠は別だという観点から、HIPAA が誰に適用されるのか、PHI が Amazon Quick をどう流れるのか、規制環境向けにプラットフォームが何を提供するのか、そして医療環境で準拠した AI エージェントをデプロイする手順が解説されています。ニュースブログでは、AWS Continuum for code vulnerabilities が一般提供となりました。AI を使って環境内のコードの脆弱性を自動で見つけ、検証し、優先度を付けたうえで、レビューできる状態の修正をプルリクエストとして届ける新しいセキュリティサービスです。従来は手作業の調査に数時間、チームをまたぐ調整に数日かかっていた部分を置き換えます。セキュリティ速報はもう 1 件あり、CVE-2026-115417 は AWS Common Runtime (CRT) の一部として配布され AWS IoT Device SDK for C++ v2 に同梱される aws-c-mqtt の、MQTT 3.1.1 互換アダプターにおける過大なサイズ値でのメモリ割り当て (CWE-789) です (Bulletin ID: 2026-147-AWS、2026 年 10 月 22 日 13:30 PDT 公開)。一定の条件下でリモートの第三者がクライアントプロセスのサービス拒否を引き起こせる可能性があり、対象は 0.9.1 以上 0.16.2 未満です。検索では、Amazon OpenSearch Serverless の既定のリフレッシュ間隔が検索コレクションとベクトルコレクションの両方で 10 秒から 5 秒に短縮されました。取り込んだドキュメントが検索可能になるまでの時間が縮まり、書き込み直後の読み取りがより速く反映されます。設定の変更は不要で、次世代の Amazon OpenSearch Serverless に既定で適用されます。あわせて Amazon OpenSearch Service に intelligent ingestion が加わりました。Amazon S3 に置いたログやドキュメントを Amazon OpenSearch Serverless (NextGen) のコレクションで検索できる状態にするフルマネージドの機能で、マネジメントコンソールでの数クリックか API 呼び出し 1 回で設定でき、取り込みのためのインフラを持つ必要がありません。JSON・NDJSON・JSON 配列の可観測性ログや構造化データと、PDF・Word・プレーンテキスト・Markdown の非構造化ファイルに対応し、S3 のソースとコレクションのインデックスを選べば、データ型の判別、ドキュメントの解析、画像の説明、テキストのチャンク分割などを自動で行います。分析では、Amazon EMR on EKS の EMR 料金が 30% 引き下げられました。vCPU 時間あたりと GB 時間あたりの両方の課金が対象で、下敷きになる Amazon EKS の料金は変わりません。EMR on EKS が利用できるすべてのリージョンで、追加の操作なしに新しい料金が適用されます。Amazon MWAA のプロビジョンド環境はメキシコ (中部) リージョン (mx-central-1) で利用可能になりました。同リージョンでは MWAA Serverless が既に使えており、プロビジョンド環境も選べるようになったことになります。Amazon MSK Connect はコネクタの一時停止と再開に対応しました。ソースのデータベースやシンク先の保守中にデータの流れを止めたい場合や、上流・下流の問題を調べる間だけ処理を止めたい場合に使えます。従来はコネクタを削除して作り直す必要があり、より破壊的でリスクと運用の手間がありました。コンタクトセンターでは、Amazon Connect Customer Profiles が、エージェントワークスペースに表示する顧客データとその表示方法を Profile Explorer で作ったレイアウトでカスタマイズできるようになりました。問い合わせ履歴・連絡先情報・算出された生涯価値といったウィジェットのレイアウトを管理者が作って保存し、従来の Customer Profiles ビューの代わりにエージェントへ割り当てられます。扱う依頼の種類によって必要な顧客データが違うという前提に立った機能です。ネットワークでは、インドのバンガロール近郊にある Netmagic DC2 データセンターの AWS Direct Connect ロケーションで 100 Gbps の専用接続が追加され、中国を除くすべての商用リージョン、AWS GovCloud リージョン、AWS Local Zones へのプライベートな直接接続ができるようになりました。言語ランタイムでは、Amazon Corretto の 2026 年 10 月の四半期更新が公開され、LTS 版の Corretto 27.0.1.0.10・25.0.5.0.9・21.0.13.0.10・17.0.21.0.10・11.0.33.0.9・8u512 がダウンロードできるようになりました。日本のブログでは、2026 年 10 月 7 日に開催された AWS 秋のクラウドオペレーション祭り 2026 の開催報告と資料が公開されています。
