"entries":
  "1ac94e9d35929f304b3089f84472b374":
    "id": "1ac94e9d35929f304b3089f84472b374"
    "title": "Stop guessing auto scaling targets for TTS on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/stop-guessing-auto-scaling-targets-for-tts-on-amazon-sagemaker-ai/"
    "published": "2026-10-23 01:30:06"
    "fetched": "2026-10-23 01:33:08"
    "summary": "Teams deploying custom text-to-speech models on Amazon SageMaker AI often guess at autoscaling thresholds, and a wrong guess either wastes GPU spend or breaches a latency SLO. This post deploys Kokoro-82M as a custom container and derives a measured autoscaling policy from two live-endpoint measurements, Q_max and T_total, instead of guesswork."
  "7cd0826fbeb6d8b45503291a59ad0198":
    "id": "7cd0826fbeb6d8b45503291a59ad0198"
    "title": "How Rescale built an AI triage agent with Strands Agents and AI-DLC"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-rescale-built-an-ai-triage-agent-with-strands-agents-and-ai-dlc/"
    "published": "2026-10-23 01:25:57"
    "fetched": "2026-10-23 01:33:08"
    "summary": "Rescale used the AI-Driven Development Lifecycle (AI-DLC) framework on AWS, with Strands Agents and Amazon Bedrock, to build an intelligent test-triage agent in weeks. Learn how AI-DLC structures AI-assisted development and how Rescale is scaling the practice across its engineering organization."
  "86a704f5aa026750f422ef892b8cbc77":
    "id": "86a704f5aa026750f422ef892b8cbc77"
    "title": "Amazon Polly delivers a major upgrade to its Generative engine"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-polly-delivers-a-major-upgrade-to-its-generative-engine/"
    "published": "2026-10-23 03:06:35"
    "fetched": "2026-10-23 05:23:41"
    "summary": "The Amazon Polly Generative engine gets a major upgrade: more expressive, more accurate speech with low latency, plus 14 new voices across 9 locales and general availability of Hindi and Finnish. This drop-in upgrade requires no code changes and is now generally available in production."
  "6abc1a875c17e96ea2dfeb6b17d670e8":
    "id": "6abc1a875c17e96ea2dfeb6b17d670e8"
    "title": "How IskayPet unified corporate knowledge with Amazon Bedrock Managed Knowledge Bases"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-iskaypet-unified-corporate-knowledge-with-amazon-bedrock-managed-knowledge-bases/"
    "published": "2026-10-23 03:01:53"
    "fetched": "2026-10-23 05:23:41"
    "summary": "Learn how IskayPet, a leading pet care company in Iberia, built a multilingual corporate knowledge assistant on Amazon Bedrock Managed Knowledge Bases. The assistant answers employee questions across retail, veterinary, onboarding, and procurement in four languages and three countries, with no RAG infrastructure to manage."
  "3e0f73a82bb1d9b4ff1a0f7f56570066":
    "id": "3e0f73a82bb1d9b4ff1a0f7f56570066"
    "title": "Announcing new ways to customize models with SageMaker AI, without managing GPUs"
    "link": "https://aws.amazon.com/blogs/machine-learning/announcing-new-ways-to-customize-models-with-sagemaker-ai-without-managing-gpus/"
    "published": "2026-10-23 03:00:04"
    "fetched": "2026-10-23 05:23:41"
    "summary": "Amazon SageMaker AI serverless model customization now includes training sessions, generally available today. You write and coordinate your own post-training loop (custom loss functions, reward signals, or multi-turn reinforcement learning) while SageMaker AI handles GPU allocation, distributed execution, fault recovery, and checkpoint storage."
  "e418f2cdc8d515afba95a753c180f0d5":
    "id": "e418f2cdc8d515afba95a753c180f0d5"
    "title": "Write your own training loop — without managing GPUs — with Amazon SageMaker training session APIs"
    "link": "https://aws.amazon.com/blogs/machine-learning/write-your-own-training-loop-without-managing-gpus-with-amazon-sagemaker-training-sessions/"
    "published": "2026-10-23 03:00:01"
    "fetched": "2026-10-23 05:23:41"
    "summary": "Amazon SageMaker AI training session APIs let you write your own LLM training loop (SFT, RL, or custom objectives) in a Python script while the service runs the GPUs. This post introduces the programming model and three SDK clients, then walks through a GRPO loop on GSM8K and a reinforcement learning workload on competitive programming."
  "58db4904c93d39275a0ce32207a6274f":
    "id": "58db4904c93d39275a0ce32207a6274f"
    "title": "Deploy AI in a HIPAA-eligible environment with Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/deploy-ai-in-a-hipaa-eligible-environment-with-amazon-quick/"
    "published": "2026-10-23 02:48:22"
    "fetched": "2026-10-23 05:23:41"
    "summary": "Amazon Quick is a HIPAA-eligible service, but eligibility is not the same as compliance. This post explains who HIPAA applies to, how PHI flows through Amazon Quick, what the platform provides for regulated environments, and a step-by-step guide to deploying compliant AI agents in a healthcare environment."
  "c7da9a44671c28ba5df78a6efc284c8a":
    "id": "c7da9a44671c28ba5df78a6efc284c8a"
    "title": "Stream low-latency speech from AI agents using Kokoro TTS on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/stream-low-latency-speech-from-ai-agents-using-kokoro-tts-on-amazon-sagemaker-ai/"
    "published": "2026-10-23 02:45:58"
    "fetched": "2026-10-23 05:23:41"
    "summary": "Voice agents often wait for an agent's full response before starting speech synthesis, adding latency users feel directly. This post shows how to stream each sentence to a Kokoro-82M text-to-speech model on Amazon SageMaker AI as the agent produces it, and how to get that audio back to a browser over Server-Sent Events or a unified binary transport."
"last_updated": "2026-10-23 05:23:41 JST"
