  "2c54e4091c02624788f256db5895813b":
    "id": "2c54e4091c02624788f256db5895813b"
    "title": "AWS CloudFormation now simplifies stack update rollback operations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-cloudformation-cdk/"
    "published": "2026-10-23 02:30:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/cloudformation/\">AWS CloudFormation</a>&nbsp;now makes it simpler to complete an update rollback and get back to deploying. An update rollback returns your stack to a known good state. Starting today, if some resources cannot roll back automatically, force rollback enables you to complete the rollback it in a single operation. It works across every CloudFormation workflow, from the <a href=\"https://docs.aws.amazon.com/cli/latest/reference/cloudformation/\">AWS CLI</a>, and SDKs to <a href=\"https://docs.aws.amazon.com/cdk/v2/guide/\">AWS CDK</a>&nbsp;and AI agents.</p> \n<p>With force rollback, CloudFormation completes the update rollback and returns your stack to a deployable state in a single operation, instead of requiring you to identify, list, and retry the operation for each affected resource. Any resource that still needs attention, such as one affected a change outside CloudFormation, is recorded for you to review and resolve it before your next deployment.</p> \n<p>To get started, run continue update rollback with the force rollback option, then create a <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/drift-aware-change-sets.html\">drift-aware change set</a> to review any configuration differences before your next deployment. To learn more, see &nbsp;<a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-continueupdaterollback.html\">Continue rolling back an update&nbsp;</a> in the AWS CloudFormation User Guide.</p> \n<p>Force rollback is available in all Regions at no additional cost. Refer to the &nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/cfn.html#cfn_region\">AWS Region table&nbsp;</a> for service availability details.</p>"
  "af0cf2d4af22f11193d83ef1c9357a50":
    "id": "af0cf2d4af22f11193d83ef1c9357a50"
    "title": "Amazon SageMaker AI announces training session APIs for serverless model customization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/training-session-apis-on-sagemaker-ai"
    "published": "2026-10-23 01:30:00"
    "fetched": "2026-10-23 05:23:38"
    "summary": "<p>Amazon SageMaker AI serverless model customization now supports training session APIs, giving customers full control over their post-training algorithm without provisioning or managing GPU infrastructure. Managed techniques, including SFT, DPO, and other reinforcement learning methods, let customers pick a technique and a model and have SageMaker AI run the training. With training session APIs, teams get to write the training loop, whether that's reproducing SFT or DPO on their own terms or implementing a custom loss, a new RL reward signal, a data curriculum, or an algorithm straight from the latest research. Operations such as forward_backward(), optim_step(), and sample() become API calls against a live, stateful session, so customers compose whatever training procedure their technique requires while SageMaker AI handles GPU allocation, model and LoRA loading, distributed execution, fault recovery, checkpoint storage, and security.<br /> <br /> Customers can call these operations directly from their own Python code to drive reinforcement learning, supervised fine-tuning, or custom training objectives against a live session, with checkpointing and resume built in. Billing is per token processed, so local computation like reward scoring isn't billed as GPU time. SageMaker AI is also releasing the <a href=\"https://github.com/aws/sagemaker-training-sessions-cookbook\">SageMaker training sessions cookbook</a>, a set of ready-to-run SFT and RL recipes customers can use as blueprints for their own training loops.<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-training-sessions.html\"></a></p> \n<p>Training session APIs are generally available today in US East (N. Virginia), US West (Oregon), and Asia Pacific (Mumbai). To get started, install the SageMaker Python SDK and clone the cookbook, or launch a notebook in SageMaker Studio and connect a coding agent. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models-training-sessions.html\">documentation&nbsp;</a>and the <a href=\"https://aws.amazon.com/sagemaker/ai/model-customization/\">Amazon SageMaker AI webpage.</a></p>"
  "9f09988b53d3fa8ad36fc6ae3c92a90b":
    "id": "9f09988b53d3fa8ad36fc6ae3c92a90b"
    "title": "Amazon Connect Customer now supports customizing the Customer Profiles app on the agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-customize-cp"
    "published": "2026-10-23 06:10:00"
    "fetched": "2026-10-23 08:51:16"
    "summary": "<p>Amazon Connect Customer Profiles now allows administrators to customize which customer data that agents see in the agent workspace, and how it is displayed, using layouts they build in Profile Explorer. Customer Profiles provides agents with a real-time, unified view of each customer during interactions, combining contact history with customer data from multiple sources. Agents who handle different kinds of requests need different customer data in front of them.<br /> <br /> Within Profile Explorer, administrators can create and save each layout of Customer Profiles widgets, such as contact history, contact information, and lifetime value calculated attributes, and assign it to agents in place of the legacy Customer Profiles view. For example, an airline baggage claims agent sees contact history, active flights, and baggage ticket information, while a loyalty agent sees loyalty status, preferences, and upcoming flights. Layouts can also include an AI Profile Summary that focuses the agent's attention on key customer insights by summarizing the customer profile.<br /> <br /> You can use Profile Explorer in the following AWS Regions: US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Canada (Central), Europe (Frankfurt), and Europe (London).<br /> <br /> To learn more about Profile Explorer, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/customer-profiles-profile-explorer.html\">Profile Explorer</a> in the Amazon Connect Customer administrator guide.</p>"
  "ce342a24e2e3cf906f7e822788a17f63":
    "id": "ce342a24e2e3cf906f7e822788a17f63"
    "title": "AWS Continuum for code vulnerabilities is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-continuum-for-code-vulnerabilities-is-now-generally-available"
    "published": "2026-10-23 06:00:00"
    "fetched": "2026-10-23 08:51:16"
    "summary": "<p>Today, AWS announces the general availability of AWS Continuum for code vulnerabilities. Continuum for code vulnerabilities&nbsp;discovers, validates, prioritizes, and remediates code vulnerabilities at machine speed.</p> \n<p>Continuum for code vulnerabilities builds a context graph from your AWS environment, including resource topology, identity relationships, and network reachability. It knows which resources are part of your application, and which findings carry real business risk. It ingests your existing vulnerability findings, scans your code, and then confirms which findings are exploitable by testing them in an isolated sandbox. The findings are prioritized by business impact. And finally, it provides remediation patches as pull requests directly to developer workflows with exploitability proof and blast radius assessment attached.</p> \n<p>Continuum for code vulnerabilities picks the right AI model for each task. Continuum starts in Learn mode where it proposes the remediation fixes that you approve. When it builds sufficient trust in its precision, you switch to the Enforce mode and let it act autonomous within the guardrails you set.&nbsp;</p> \n<p>AWS Continuum works alongside your existing AWS security services, including Amazon GuardDuty and AWS Security Hub. For more information about the AWS Regions where AWS Continuum is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"AWS Regional Table\">AWS Region table.</a> To learn more, see the AWS Continuum <a href=\"https://aws.amazon.com/continuum/\">product page</a>.</p>"
  "cee4934800d3a62f8c466062064dd92b":
    "id": "cee4934800d3a62f8c466062064dd92b"
    "title": "Amazon OpenSearch Serverless now supports a 5-second default refresh interval"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-opensearch-serverless-supports-5-second-refresh-interval/"
    "published": "2026-10-23 03:34:00"
    "fetched": "2026-10-23 08:51:16"
    "summary": "<p>Starting today, Amazon OpenSearch Serverless reduces the default refresh interval to 5 seconds for both search and vector collections. The refresh interval controls how quickly newly ingested documents become available for search. By lowering the default from 10 seconds to 5 seconds, newly written data becomes searchable faster, giving applications quicker read-after-write visibility automatically, with no configuration changes and no action required on your part.</p> \n<p>This improvement applies to the next generation of Amazon OpenSearch Serverless and takes effect by default on both search and vector collections. Faster refresh is valuable for workloads that continuously ingest data and need near real-time retrieval, including full-text search over frequently updated content as well as vector use cases such as retrieval-augmented generation (RAG), semantic search, and recommendation and personalization systems. This means applications and AI agents can retrieve and act on the most recently ingested data sooner, improving the relevance and accuracy of search results and RAG responses for datasets that change frequently.</p> \n<p>The 5-second default refresh interval is available in all&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\" rel=\"noopener noreferrer\" target=\"_blank\">24 regions</a>&nbsp;where Amazon OpenSearch Serverless is available today. To learn more, see the Amazon OpenSearch Serverless <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "9874f76717639dfd52ee7e6d268fbdde":
    "id": "9874f76717639dfd52ee7e6d268fbdde"
    "title": "AWS Direct Connect announces 100G expansion in Bangalore, India"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-direct-connect-100g-bangalore/"
    "published": "2026-10-23 01:00:00"
    "fetched": "2026-10-23 08:51:16"
    "summary": "<p>Today, AWS announced the expansion of 100 Gbps dedicated connections at the existing <a href=\"https://aws.amazon.com/directconnect\">AWS Direct Connect</a> location in the Netmagic DC2 data center near Bangalore, India. You can now establish private, direct network access to all public AWS Regions (except those in China), AWS GovCloud Regions, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones</a> from this location.</p> \n<p>The Direct Connect service enables you to establish a private, physical network connection between AWS and your data center, office, or colocation environment. These private connections can provide a more consistent network experience than those made over the public internet.</p> \n<p>For more information on the over 150 Direct Connect locations worldwide, visit the <a href=\"https://aws.amazon.com/directconnect/locations/\">locations</a> section of the Direct Connect <a href=\"https://aws.amazon.com/directconnect\">product detail pages</a>. Or, visit our <a href=\"https://aws.amazon.com/directconnect/getting-started/\">getting started</a> page to learn more about how to purchase and deploy Direct Connect.</p>"
"last_updated": "2026-10-23 08:51:16 JST"
