    "title": "CVE-2026-115419 - Unintended disclosure of data element to wrong session in Strands Agents SDK A2A Server"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-146-aws/"
    "published": "2026-10-23 05:07:11"
    "fetched": "2026-10-23 05:23:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-146-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/22/2026 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Strands Agents is an open-source SDK, available for Python and TypeScript, for building AI agents. The SDK includes an Agent2Agent (A2A) server component that exposes an agent over HTTP so other agents and clients can call it. We identified CVE-2026-115419, an issue where the A2A server did not properly isolate conversation state between callers. An authenticated remote user could access another caller's conversation history or influence model behavior for other callers in multi-tenant deployments.</p> \n<p><b>Impacted versions:</b><br /> - strands-agents (Python): all versions containing the multiagent.a2a module, &lt; 1.43.0<br /> - @strands-agents/sdk (TypeScript): &lt; 1.5.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-146-aws/\">Read this article</a></p>"
  "1a16e15133e20b840b8d817744939165":
    "id": "1a16e15133e20b840b8d817744939165"
    "title": "CVE-2026-115414 - OS Command Injection Issue in SAM CLI Terraform Hook"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-145-aws/"
    "published": "2026-10-23 03:50:58"
    "fetched": "2026-10-23 05:23:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-145-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/22/2026 11:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS SAM CLI is an open-source framework for building serverless applications. We identified CVE-2026-115414, an OS command injection issue in the Terraform hook (sam build --hook-name terraform) in AWS SAM CLI. The Terraform hook generates a Makefile recipe that interpolates a Terraform resource address without fully neutralizing shell metacharacters, which could allow an actor who can influence the Terraform configuration or plan file consumed by a build to execute arbitrary commands as the build user on the host running the build.</p> \n<p><b>Impacted versions:</b> &gt;=1.63.0, &lt;=1.166.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-145-aws/\">Read this article</a></p>"
  "96e45845cf8f2d492d3c2aa2bf1fec7d":
    "id": "96e45845cf8f2d492d3c2aa2bf1fec7d"
    "title": "CVE-2026-115416 - Incorrect authorization checks in Amazon Athena engine version 3 query processing"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-144-aws/"
    "published": "2026-10-23 01:58:02"
    "fetched": "2026-10-23 05:23:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-144-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/22/2026 09:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon Athena is an interactive query service that allows you to analyze data in Amazon S3 using standard SQL. We identified CVE-2026-115416, an issue in Amazon Athena engine version 3 query processing where incorrect authorization checks could have allowed an authenticated user to read AWS account identifiers and SQL statement text query metadata from other AWS accounts. Query results, and data stored in Amazon S3 or other data sources, were not accessible through this issue.</p> \n<p><b>Impacted versions:</b> Amazon Athena engine version 3</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-144-aws/\">Read this article</a></p>"
