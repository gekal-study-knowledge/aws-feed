    "title": "CVE-2026-102551 & CVE-2026-102552 - Issue with FreeRTOS-Plus-TCP"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-139-aws/"
    "published": "2026-10-17 02:34:49"
    "fetched": "2026-10-17 04:14:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-139-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/16/2026 10:15 AM PDT</p>\n<p><b>Description:</b></p>\n<p>FreeRTOS-Plus-TCP is an open-source, thread-safe TCP/IP stack for the FreeRTOS kernel, distributed by Amazon for use on embedded and IoT devices. AWS identified two issues with FreeRTOS-Plus-TCP, affecting multiple versions.</p>\n<p><b>CVE-2026-102551:</b> improper verification of the source of a communication channel in the IPv6 Router Advertisement handler. The handler does not fully validate that a received Router Advertisement originates from an on-link source before acting on it. Under certain conditions, a remote third-party might influence an endpoint's IPv6 gateway, prefix, and address configuration, potentially enabling interception of the device's IPv6 traffic. This issue is reachable in the library's default configuration, where ipconfigUSE_IPv6 and ipconfigUSE_RA are both enabled.</p>\n<p><b>CVE-2026-102552:</b> improper verification of the source of a communication channel in the DNS resolver. The resolver does not fully validate that a DNS reply originates from the server that was queried before accepting it. Under certain conditions, a remote third-party might insert a chosen address into the device's DNS cache, potentially redirecting the device's subsequent connections for the affected name.</p>\n<p><b>Impacted versions:</b></p>\n<p>- CVE-2026-102551 (Router Advertisement): &lt;= V4.4.1\n <br />\n - CVE-2026-102552 (DNS resolver): &lt;= V4.4.1</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "108c4eb906eabde4daa2a73b88a031b1":
    "id": "108c4eb906eabde4daa2a73b88a031b1"
    "title": "CVE-2026-109587 & CVE-2026-109588 - Issue with FreeRTOS-Kernel"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-138-aws/"
    "published": "2026-10-17 02:34:49"
    "fetched": "2026-10-17 04:14:40"
    "summary": "<p><b>Bulletin ID:</b> 2026-138-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/16/2026 10:00 AM PDT</p>\n<p><b>Description:</b></p>\n<p>FreeRTOS-Kernel is a real-time operating system kernel for microcontrollers and small microprocessors, distributed by Amazon. AWS identified two issues with the FreeRTOS-Kernel Arm Cortex-R82 (Armv8-R AArch64) MPU port, affecting multiple versions.</p>\n<p><b>CVE-2026-109587:</b> incorrect authorization in the Arm Cortex-R82 MPU port. On MPU-enabled builds, the port does not correctly enforce the memory-region boundaries assigned to an unprivileged task when it passes a buffer argument to an MPU system call. Under certain conditions, an unprivileged task might read and write privileged kernel memory outside the regions assigned to it. This issue affects Arm Cortex-R82 builds with configENABLE_MPU=1; applications that do not use the FreeRTOS MPU are not affected.</p>\n<p><b>CVE-2026-109588:</b> numeric truncation in the MPU buffer authorization check on the Arm Cortex-R82 MPU port. On MPU-enabled builds, the buffer-length validation does not correctly account for the full length of a buffer passed to a stream buffer system call. Under certain conditions, an unprivileged task might read or write privileged kernel memory beyond the validated buffer window. This issue affects Arm Cortex-R82 builds with configENABLE_MPU=1; applications that do not use the FreeRTOS MPU are not affected.</p>\n<p><b>Impacted versions:</b></p>\n<p>- CVE-2026-109587 (MPU region authorization): V11.3.0 and V11.3.1 (Arm Cortex-R82 builds with configENABLE_MPU=1)\n <br />\n - CVE-2026-109588 (MPU buffer length truncation): V11.3.0 and V11.3.1 (Arm Cortex-R82 builds with configENABLE_MPU=1)</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
