"overview": |
  この日は 10 件で、FreeRTOS に関するセキュリティ速報 2 件 (計 4 件の CVE) と、オープンウェイトモデルの追加が中心でした。セキュリティ速報の 1 件目は FreeRTOS-Plus-TCP の問題です (Bulletin ID 2026-139-AWS、Important、2026 年 10 月 16 日 10:15 PDT 公開)。FreeRTOS-Plus-TCP は組み込みや IoT 機器向けに Amazon が配布している、スレッドセーフな TCP/IP スタックで、複数バージョンが影響を受けます。CVE-2026-102551 は IPv6 の Router Advertisement ハンドラーにおける通信チャネルの送信元検証の不備で、受信した Router Advertisement がオンリンクの送信元から来たものかを十分に検証していません。あわせて CVE-2026-102552 も公開されています。2 件目は FreeRTOS-Kernel の問題です (Bulletin ID 2026-138-AWS、Important、同日 10:00 PDT 公開)。マイクロコントローラーや小型マイクロプロセッサー向けのリアルタイム OS カーネルで、Arm Cortex-R82 (Armv8-R AArch64) の MPU ポートに 2 件の問題があり、複数バージョンが影響を受けます。CVE-2026-109587 は同 MPU ポートにおける不適切な認可で、MPU を有効にしたビルドで非特権タスクに割り当てたメモリ領域の境界を正しく強制しません。あわせて CVE-2026-109588 も公開されています。モデルでは、Reflection AI のオープンウェイトモデル Beam が Amazon SageMaker JumpStart と AWS Trainium で利用可能になりました。米国の Reflection が初めて公開したオープンウェイトモデルで、同クラスのオープンウェイトモデルの最前線にあり、推論・コーディング・エージェント系のベンチマークで高い性能を示すとしています。データとインフラを自分の管理下に置いたまま、高度なコーディングエージェントや自動化ワークフローを構築できる点が強調されています。機械学習ブログでは Beam を AWS にデプロイする手順も公開され、Amazon SageMaker JumpStart のリアルタイムエンドポイントから始める方法と、Kubernetes ネイティブに分散 GPU インフラを制御したい場合に JumpStart、SGLang、vLLM と組み合わせて Amazon SageMaker HyperPod Inference を使う方法が示されています。もう 1 つのモデル追加は NVIDIA の Nemotron 3.5 Super VL で、画像・動画・テキストを入力してテキストを生成するビジョン言語モデルとして SageMaker JumpStart に加わりました。文書理解、GUI の把握、動画への質問応答、マルチモーダルなエージェント用途を想定し、総パラメーター 120B・活性 12B のハイブリッド Mixture-of-Experts の言語バックボーンにビジョンエンコーダーを組み合わせています。エージェントの評価では、Amazon Bedrock AgentCore 上に構築した 9 段階の評価フレームワークが紹介されました。自律型エージェントの障害は静かに進むため、レイテンシーは変わらないまま回答品質だけが徐々に劣化するという問題意識から、最初のコミットから本番稼働までのライフサイクル全体で品質の退行を捉えます。サービス更新は 2 件で、AWS Lambda の durable functions が AWS GovCloud (US-West) と AWS GovCloud (US-East) で利用可能になり、Amazon CloudWatch のログ集約が AWS GovCloud (US) と追加 13 の商用リージョンで使えるようになりました。このほか、Amazon EMR Serverless が IPv6 とデュアルスタックの接続に対応し、デュアルスタックまたは IPv6 専用のサブネットを指定して VPC 内で Apache Spark や Apache Hive のジョブを IPv6 上で実行できるようになりました (既存の IPv4 ワークロードとの後方互換性は維持されます)。また AWS Partner Central の Partner Analytics に Solution Matching Engine (SME) のパフォーマンスを見るセクションが追加され、パートナーは推奨、SME に帰属する商談、AWS 起点の商談に占める割合、停滞率、SME 由来のパイプラインを確認できるようになりました。
