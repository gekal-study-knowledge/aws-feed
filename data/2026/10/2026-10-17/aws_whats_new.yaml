"entries":
  "76d0a8fb777674e44c03fd33ff25a6b9":
    "id": "76d0a8fb777674e44c03fd33ff25a6b9"
    "title": "AWS Lambda durable functions are now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/durablefunctions-govcloud/"
    "published": "2026-10-17 03:26:00"
    "fetched": "2026-10-17 04:14:39"
    "summary": "<p>AWS Lambda durable functions are now available in the AWS GovCloud (US-West) and AWS GovCloud (US-East) Regions. Lambda durable functions enable developers to build reliable multi-step applications and AI workflows within the Lambda developer experience.</p>\n<p>Lambda durable functions extend the Lambda programming model with new primitives in your event handler, such as \"step\" and \"wait\", allowing you to checkpoint progress, automatically recover from failures, and pause executions without incurring compute charges for on-demand functions. With availability in the AWS GovCloud (US) Regions, government customers and regulated industries can orchestrate complex processes such as order workflows, user onboarding, and AI-assisted tasks while meeting stringent compliance and security requirements.</p>\n<p>You can activate durable functions for new Python (versions 3.13 and 3.14), Node.js (versions 22 and 24), Go (versions 1.24 or later), .Net (version 2.2), or Java (17+) based Lambda functions using the AWS Lambda API, AWS Management Console, or AWS SDK. You can also use infrastructure as code tools such as AWS CloudFormation, AWS Serverless Application Model (AWS SAM), and the AWS Cloud Development Kit (AWS CDK).</p>\n<p>For more information on durable functions, visit the <a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\">AWS Lambda durable functions product page</a> or the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/\">AWS Lambda Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>. For region availability, visit the <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region page</a>.&nbsp;</p>"
  "3087544003f44613c9e6e8971efaa625":
    "id": "3087544003f44613c9e6e8971efaa625"
    "title": "Nemotron 3.5 Super VL model now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/nvidia-nemotron-3.5-super-vl-on-sagemaker-jumpstart/"
    "published": "2026-10-17 02:59:00"
    "fetched": "2026-10-17 04:14:39"
    "summary": "<p>NVIDIA's Nemotron 3.5 Super VL is now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. This vision-language model from the Nemotron 3.5 family accepts images, video, and text as input and generates text, enabling customers to deploy multimodal AI solutions on AWS infrastructure.</p>\n<p>Nemotron 3.5 Super VL is designed for document intelligence, GUI understanding, video question answering, and multimodal agentic applications. It pairs a 120B-parameter hybrid Mixture-of-Experts (MoE) language backbone with 12B active parameters and a vision encoder, supporting context lengths of up to 1 million tokens. The model includes a built-in Multi-Token Prediction (MTP) head for speculative decoding to accelerate text generation, with reasoning configurable per request. It supports ten languages including English, French, Spanish, German, Japanese, Hindi, Korean, and Chinese. Post-trained with multimodal supervised fine-tuning on image, video, document, chart, and GUI data followed by GRPO reinforcement learning, it delivers structured JSON output, tool calling, and configurable reasoning for enterprise agent workflows. SageMaker JumpStart offers two variants: NVFP4 for optimized inference on G7 instances with NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs, and BF16 reference weights on ml.p5en.48xlarge for customization including SFT, RL, distillation, and domain adaptation.</p>\n<p>With SageMaker JumpStart, customers can deploy Nemotron 3.5 Super VL with just a few clicks to address their specific AI use cases.</p>\n<p>To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "f477a54d82571dc6045a4f3d7f84a7a3":
    "id": "f477a54d82571dc6045a4f3d7f84a7a3"
    "title": "Beam model by Reflection is now available on Amazon SageMaker JumpStart and AWS Trainium"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/reflection-beam-on-sagemaker-jumpstart-and-aws-trainium/"
    "published": "2026-10-17 01:00:00"
    "fetched": "2026-10-17 04:14:39"
    "summary": "<p>Beam, the first open weight model offered by US-based Reflection, is now available in Amazon SageMaker JumpStart, the model hub in Amazon SageMaker AI. According to Beam, they operate at the frontier of open weight models in its class, with strong performance across reasoning, coding, and agentic benchmarks. With it, customers can now build advanced coding agents and automated workflows on a frontier open weight model while keeping control of their data and infrastructure and adapting the model to their business. Beam runs alongside other models that customers already use in SageMaker AI and scales to meet production demand with the same controls, audit trails, and monitoring built into every SageMaker AI deployment. Additionally, Beam was ported and optimized for AWS Trainium3, giving customers a high-performance, cost-efficient option for deploying and scaling the model from day one. “<i>Reflection is delivering frontier AI that developers can actually control, not just rent through an API. Bringing Beam to SageMaker AI puts that capability in front of millions of developers on infrastructure they already trust, running in their own AWS account, on their own data, fully in their control,</i>\" said Misha Laskin, co-founder and CEO, Reflection.</p>\n<p>Engineering teams can use Beam to resolve software issues, generate and review code, and automate routine operations work. Businesses can also use it for complex workflows that span many steps and tools, and for advanced math and science reasoning. Because Beam is released under the Apache 2.0 license, customers can inspect and customize the model, while also running it in their own AWS accounts, so data stays private and under their control, protected by the same AWS security and compliance capabilities they already rely on.&nbsp; “<i>Advanced AI models like Beam, now available on Amazon SageMaker, let us run open weight frontier AI entirely inside our own secure environments, with full visibility into the weights, the data, and the pipeline. In the age of multi-model AI, the pairing of openness and managed infrastructure is an essential addition to the AI ecosystem. The freedom to deploy and adapt advanced AI, tailored to mission problems with client-specific security and controls, gives more agencies greater flexibility to deploy advanced AI across their enterprise.</i>\" said Garrett Berntsen, Chief AI Officer, Accenture Federal Services.</p>\n<p>Beam is initially available in Amazon SageMaker JumpStart in US East (N. Virginia) and US East (Ohio). To start, search for \"Beam\" in SageMaker JumpStart within Amazon SageMaker Studio, or deploy it directly on <a href=\"http://aws.amazon.com/sagemaker/ai/\">SageMaker AI</a>.&nbsp; To learn more, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-reflection-beam-an-open-weight-model-for-agentic-coding-on-aws/\">AWS/Beam launch blog</a>, <a href=\"https://docs.aws.amazon.com/sagemaker/\">SageMaker AI documentation</a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">SageMaker JumpStart documentation</a>.</p>"
  "91ea2a0a1aaabf6524dfeca32ed5830b":
    "id": "91ea2a0a1aaabf6524dfeca32ed5830b"
    "title": "Amazon CloudWatch log centralization now available in AWS GovCloud and additional commercial Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-cloudwatch-centralization-region-expansion"
    "published": "2026-10-17 05:04:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>Amazon CloudWatch log centralization is now available in AWS GovCloud (US) and 13 additional commercial Regions. CloudWatch log centralization copies log data from multiple AWS accounts and Regions into a single destination account, integrating with AWS Organizations for efficient aggregation without the need for custom solutions.</p>\n<p>With this launch, organizations in the AWS GovCloud (US) partition and commercial partition can each centralize logs across their accounts and Regions for centralized monitoring. You can scope centralization rules to your entire organization, specific organizational units, or selected accounts and copy logs into a single account while preserving source context through enriched system fields.</p>\n<p>CloudWatch log centralization is now additionally available in Africa (Cape Town), Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Jakarta), Asia Pacific (Malaysia), Asia Pacific (Melbourne), Canada West (Calgary), Europe (Milan), Europe (Spain), Europe (Zurich), Israel (Tel Aviv), Middle East (Bahrain), Middle East (UAE), AWS GovCloud (US-East), and AWS GovCloud (US-West). For a complete list of supported Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p>\n<p>To get started, create a centralization rule in the Amazon CloudWatch console, or by using the AWS CLI or AWS SDKs. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/\">Log centralization</a> in the Amazon CloudWatch Logs User Guide. Customers can centralize one copy of logs for free; additional copies are charged at $0.05/GB. For details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing</a>.</p>"
  "7e8b12f58047cce9b71269e9a1fca810":
    "id": "7e8b12f58047cce9b71269e9a1fca810"
    "title": "AWS Partner Central adds Solution Matching Engine performance insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/solution-matching-engine-performance"
    "published": "2026-10-17 12:00:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>AWS Partner Central now gives AWS Partners more visibility into how the Solution Matching Engine (SME) contributes to their co-sell pipeline. The Solution Matching Engine performance section in Partner Analytics helps partners understand how SME performs for their company and AWS Marketplace listings.</p>\n<p>Partners can view recommendations, SME-attributed opportunities, their share of AWS-originated opportunities, stall rate, and pipeline attributed to SME. They can filter by recommendation type or AWS Marketplace listing and explore top customer profiles by Region, industry, and segment. These insights help partners assess their visibility and decide where to improve their listings and opportunity information.</p>\n<p>All partners eligible for <a href=\"https://aws.amazon.com/partners/programs/ace/\">APN Customer Engagements (ACE)</a> can find the section on the Opportunity pipeline analysis page under Partner Analytics in <a href=\"https://aws.amazon.com/partners/partner-central/\" title=\"Link to AWS Partner Central\">AWS Partner Central</a>.&nbsp;To learn more about SME and how to strengthen your visibility with AWS sellers, read <a href=\"https://aws.amazon.com/blogs/apn/solution-matching-engine-your-gateway-to-aws-sellers/\">Solution Matching Engine: Your Gateway to AWS Sellers</a>.</p>"
  "26c20cd55953cf6fef7f5cbfcb8c7cbe":
    "id": "26c20cd55953cf6fef7f5cbfcb8c7cbe"
    "title": "Amazon EMR Serverless now supports IPv6 and dual-stack connectivity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-emr-serverless/"
    "published": "2026-10-17 04:20:00"
    "fetched": "2026-10-20 07:47:09"
    "summary": "<p>Amazon EMR Serverless now supports IPv6 and dual-stack connectivity, expanding beyond the IPv4-only connectivity that was previously available. You can now run your Apache Spark and Apache Hive jobs over IPv6 in your Amazon Virtual Private Cloud (VPC) by supplying dual-stack (IPv4 and IPv6) or IPv6-only subnets. This gives you greater flexibility in how your applications connect to data stores and services, while maintaining full backward compatibility with your existing IPv4 workloads.</p>\n<p>As Spark and Hive workloads scale to many workers, the IPv4 address space in your VPCs and subnets can become a constraint, and a growing number of organizations face compliance mandates that require IPv6 adoption. With dual-stack connectivity, your EMR Serverless applications accept both IPv4 and IPv6, making it easy to adopt IPv6 gradually while maintaining backward compatibility with your existing IPv4 workloads. With IPv6-only subnets, you can eliminate the need for IPv4 addresses entirely, overcoming IPv4 address exhaustion and meeting the networking standards and compliance requirements that call for IPv6, while your jobs reach IPv6 endpoints and services both inside and outside your VPC.</p>\n<p>IPv6 and dual-stack connectivity for Amazon EMR Serverless is available at no additional cost in all AWS Regions where Amazon EMR Serverless is available. IPv6 and dual-stack subnets are supported on all EMR Serverless release versions. To get started, see <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/ipv6-subnets.html\">Configure IPv6 subnets for EMR Serverless applications</a> and <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/vpc-access.html\">Configuring VPC access for EMR Serverless applications</a>.</p>"
  "b0ddfa9351aab91a1d82e0748e1d2f0b":
    "id": "b0ddfa9351aab91a1d82e0748e1d2f0b"
    "title": "Amazon Connect Customer now enables you to use flow modules in agentic CX designer"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/agentic-cx-designer-flow-modules/"
    "published": "2026-10-17 01:19:00"
    "fetched": "2026-10-28 06:46:04"
    "summary": "<p>Amazon Connect Customer now enables you to use flow modules as data requests in agentic CX designer, so you can build and apply reusable logic across your customer experience flows. You can run a flow module at a fixed step in a conversation with a Data request node, or give it to a Generative journey as a tool to call when the conversation needs it.</p> \n<p>With this launch, you can use flow modules to update customer profiles and cases, create tasks, look up data tables, send an SMS confirmation, or check hours of operation and staffing before escalating to a human agent. You can also retrieve data that sits inside a private network, such as core banking, policy, or claims systems. For example, a flow module can invoke an AWS Lambda function in your VPC to return an account balance or claim status in the middle of an interaction.</p> \n<p>This feature is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Europe (Frankfurt), and Europe (London). To learn more, refer to <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/acxd-data-requests.html\">Data requests</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/contact-flow-modules.html\">Flow modules</a> in the Connect Customer documentation. To learn more about Amazon Connect Customer, an agentic AI solution that helps enterprises deliver exceptional customer experiences, visit the Amazon Connect Customer <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/acxd.html\">website</a>.</p>"
"last_updated": "2026-10-28 06:46:04 JST"
