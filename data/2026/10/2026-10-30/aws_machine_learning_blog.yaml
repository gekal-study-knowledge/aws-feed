    "title": "Lend and borrow resources across teams with AWS Batch’s quota management for SageMaker Training jobs"
    "link": "https://aws.amazon.com/blogs/machine-learning/lend-and-borrow-resources-across-teams-with-aws-batchs-quota-management-for-sagemaker-training-jobs/"
    "published": "2026-10-30 01:58:57"
    "fetched": "2026-10-30 02:58:28"
    "summary": "AWS Batch quota management is a new scheduling capability you can use to divide GPU capacity into quota shares per team or project, automatically lend idle capacity across shares, and use preemption to run your highest-priority SageMaker Training jobs first, all without manual coordination."
  "6e6ff1def8bfd27ce4d95599f62d55f4":
    "id": "6e6ff1def8bfd27ce4d95599f62d55f4"
    "title": "How MoEngage turned over 400 APIs into agent tools with AgentCore Gateway"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-moengage-turned-over-400-apis-into-agent-tools-with-agentcore-gateway/"
    "published": "2026-10-30 01:54:52"
    "fetched": "2026-10-30 02:58:28"
    "summary": "MoEngage turned roughly 400 private REST APIs across 7 AWS Regions into permission-scoped agent tools with Amazon Bedrock AgentCore Gateway. No per-service MCP servers, no public endpoints, and no 400-tool context bloat. See how OpenAPI specs, Cedar policies, and managed Amazon VPC Lattice egress made it work."
  "7117fb389424b1c9c7975297c69ba65e":
    "id": "7117fb389424b1c9c7975297c69ba65e"
    "title": "Accelerate agentic AI with NVIDIA Nemotron models on Amazon EKS and SageMaker HyperPod EKS"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerate-agentic-ai-with-nvidia-nemotron-models-on-amazon-eks-and-sagemaker-hyperpod-eks/"
    "published": "2026-10-30 01:11:08"
    "fetched": "2026-10-30 02:58:28"
    "summary": "NVIDIA Nemotron 3.5 Super VL is a 120B-parameter mixture-of-experts model that pairs reasoning and tool use with multimodal understanding. This post explores its architecture and use cases, then shows how to deploy it on Amazon EKS, EKS Auto Mode, and Amazon SageMaker HyperPod EKS with NVIDIA Dynamo and vLLM."
  "379328750fffccc9950ba29f8b56028b":
    "id": "379328750fffccc9950ba29f8b56028b"
    "title": "How the UK Amazon Quick User Group grew in 2026"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-the-uk-amazon-quick-user-group-grew-in-2026/"
    "published": "2026-10-30 05:16:40"
    "fetched": "2026-10-30 07:35:10"
    "summary": "The UK Amazon Quick User Group's 2026 roundup: three quarterly meetups, 150+ attendees, and customer stories from Arriva, Carsa, and Propulse Lab on using agentic AI and Amazon Quick to turn data into faster decisions, higher satisfaction, and scalable growth."
  "ced8dc39c867b7e1d3e228d514f46911":
    "id": "ced8dc39c867b7e1d3e228d514f46911"
    "title": "Building intent-driven UI testing with Amazon Nova Act"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-intent-driven-ui-testing-with-amazon-nova-act/"
    "published": "2026-10-30 03:20:27"
    "fetched": "2026-10-30 07:35:10"
    "summary": "Epsilon's Agentic Platform team delivers UI testing as a managed, multi-tenant service built on Amazon Nova Act and Amazon Bedrock AgentCore Browser Tool. Tests are written in plain English and run on browsers managed by AWS, giving every product team resilient, intent-driven testing with zero per-team infrastructure overhead."
  "a77044c84dc94411ed47c30f8fbbb065":
    "id": "a77044c84dc94411ed47c30f8fbbb065"
    "title": "Build a repeatable PHP-to-Java migration engine with Kiro"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-repeatable-php-to-java-migration-engine-with-kiro/"
    "published": "2026-10-30 03:14:17"
    "fetched": "2026-10-30 07:35:10"
    "summary": "Turn a PHP-to-Java migration from a one-time leap of faith into a measurable, repeatable process with Kiro. This post walks through a reusable engine: a mechanical discovery scanner and an eight-phase, parity-first workflow that treats the original PHP application as the specification and verifies the Java port with a parity harness."
