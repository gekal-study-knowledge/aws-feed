    "title": "Amazon RDS for Oracle and SQL Server now support storage autoscaling on additional storage volumes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-oracle-sqlserver-autoscaling-additional-storage-volumes"
    "published": "2026-10-30 03:06:00"
    "fetched": "2026-10-30 07:35:07"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\"><u>Amazon RDS for SQL Server</u></a> and <a href=\"https://aws.amazon.com/rds/oracle/\" target=\"_blank\"><u>Amazon RDS for Oracle</u></a> now support RDS storage autoscaling on <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.ModifyingExisting.AdditionalVolumes.html\" target=\"_blank\">additional storage volumes</a>. RDS storage autoscaling automatically scales storage capacity in response to growing database workloads, with zero downtime.</p> \n<p>Additional storage volumes allow you to add up to three additional volumes to increase your storage capacity up to 256 TiB. Previously, you had to manually provision storage capacity on the additional storage volumes based on anticipated application capacity demands while autoscaling could be enabled on the primary storage volume. Under-provisioning could result in application downtime, and over-provisioning could result in under-utilized resources and&nbsp;higher costs. With RDS storage autoscaling, you simply set your desired maximum storage limit for each additional storage volume, and autoscaling takes care of the rest.</p> \n<p>RDS storage autoscaling continuously monitors actual storage consumption, and scales capacity up automatically when actual utilization approaches provisioned storage capacity. Autoscaling works with new and existing database instances. Autoscaling has no additional charges and you only pay for the provisioned storage resources. You can enable it by using the AWS Management Console, AWS CLI, or Amazon RDS API.</p> \n<p>RDS storage autoscaling for additional storage volumes is available for Amazon RDS for SQL Server and Amazon RDS for Oracle in all commercial AWS Regions and the AWS GovCloud (US) Regions. To learn more, please visit&nbsp;the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html\">Amazon RDS storage autoscaling</a> documentation.&nbsp;</p>"
  "7c676c32bf1ed3d05b51a1841c70c3e4":
    "id": "7c676c32bf1ed3d05b51a1841c70c3e4"
    "title": "Amazon Aurora now supports post-quantum TLS key exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aurora-postgresql-post-quantum-tls-key-exchange/"
    "published": "2026-10-30 01:00:00"
    "fetched": "2026-10-30 07:35:07"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora PostgreSQL-Compatible Edition</a>&nbsp;introduces support for post-quantum TLS (PQ-TLS) key exchange, providing you with post-quantum cryptography options for encrypting your data in transit.</p> \n<p>Amazon Aurora PostgreSQL versions 18 and higher support modification of the ssl_groups parameter. You can <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.Security.html#PostgreSQL.Concepts.General.SSL.Groups\" rel=\"noopener noreferrer\" target=\"_blank\">select cryptographic groups</a> from the&nbsp;Amazon Aurora PostgreSQL allow list to align with your organization's security standards.</p> \n<p>Amazon Aurora is designed for high performance and availability at global scale with full PostgreSQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
"last_updated": "2026-10-30 07:35:07 JST"
