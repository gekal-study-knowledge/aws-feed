  "887a7072eff473e6050ec5c75e08b1c8":
    "id": "887a7072eff473e6050ec5c75e08b1c8"
    "title": "Amazon RDS for Oracle and SQL Server now support storage autoscaling on additional storage volumes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-oracle-sqlserver-autoscaling-additional-storage-volumes"
    "published": "2026-10-30 03:06:00"
    "fetched": "2026-10-30 07:35:07"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\"><u>Amazon RDS for SQL Server</u></a> and <a href=\"https://aws.amazon.com/rds/oracle/\" target=\"_blank\"><u>Amazon RDS for Oracle</u></a> now support RDS storage autoscaling on <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.ModifyingExisting.AdditionalVolumes.html\" target=\"_blank\">additional storage volumes</a>. RDS storage autoscaling automatically scales storage capacity in response to growing database workloads, with zero downtime.</p> \n<p>Additional storage volumes allow you to add up to three additional volumes to increase your storage capacity up to 256 TiB. Previously, you had to manually provision storage capacity on the additional storage volumes based on anticipated application capacity demands while autoscaling could be enabled on the primary storage volume. Under-provisioning could result in application downtime, and over-provisioning could result in under-utilized resources and&nbsp;higher costs. With RDS storage autoscaling, you simply set your desired maximum storage limit for each additional storage volume, and autoscaling takes care of the rest.</p> \n<p>RDS storage autoscaling continuously monitors actual storage consumption, and scales capacity up automatically when actual utilization approaches provisioned storage capacity. Autoscaling works with new and existing database instances. Autoscaling has no additional charges and you only pay for the provisioned storage resources. You can enable it by using the AWS Management Console, AWS CLI, or Amazon RDS API.</p> \n<p>RDS storage autoscaling for additional storage volumes is available for Amazon RDS for SQL Server and Amazon RDS for Oracle in all commercial AWS Regions and the AWS GovCloud (US) Regions. To learn more, please visit&nbsp;the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html\">Amazon RDS storage autoscaling</a> documentation.&nbsp;</p>"
  "7c676c32bf1ed3d05b51a1841c70c3e4":
    "id": "7c676c32bf1ed3d05b51a1841c70c3e4"
    "title": "Amazon Aurora now supports post-quantum TLS key exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aurora-postgresql-post-quantum-tls-key-exchange/"
    "published": "2026-10-30 01:00:00"
    "fetched": "2026-10-30 07:35:07"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora PostgreSQL-Compatible Edition</a>&nbsp;introduces support for post-quantum TLS (PQ-TLS) key exchange, providing you with post-quantum cryptography options for encrypting your data in transit.</p> \n<p>Amazon Aurora PostgreSQL versions 18 and higher support modification of the ssl_groups parameter. You can <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.Security.html#PostgreSQL.Concepts.General.SSL.Groups\" rel=\"noopener noreferrer\" target=\"_blank\">select cryptographic groups</a> from the&nbsp;Amazon Aurora PostgreSQL allow list to align with your organization's security standards.</p> \n<p>Amazon Aurora is designed for high performance and availability at global scale with full PostgreSQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
  "bf9b991de4c032733185df94b9378c35":
    "id": "bf9b991de4c032733185df94b9378c35"
    "title": "AWS Marketplace now enables partners to list once and sell through multiple subsidiary accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-marketplace-subsidiary-account-authorization"
    "published": "2026-10-30 05:12:00"
    "fetched": "2026-10-30 11:22:45"
    "summary": "<p>Today, AWS announces that AWS partners who operate multiple legal entities can publish a product listing once in their primary account and enable their local subsidiaries to sell it through direct private offers — eliminating the need to recreate and maintain duplicate listings across every account.</p> \n<p>From the primary account, which retains ownership of the listing, partners authorize which products each subsidiary can sell and which buyer countries it can extend private offers to. Each subsidiary transacts under its own local tax identity, selects the local currencies it supports, and sets its own disbursement preferences and bank account. The AWS Marketplace insights report in the primary account provides a consolidated view of offers, agreements, and renewals across all connected subsidiary accounts. Partners can revoke a subsidiary authorization or a subsidiary connection at any time, which immediately stops that subsidiary from creating new offers — agreements and offers already extended to buyers remain unchanged.</p> \n<p>This capability is available today at no additional cost in all AWS Regions where AWS Marketplace is available. To get started, see &nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/getting-started/manage-subsidiary.html\">Managing subsidiary account connections&nbsp;</a> and &nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/subsidiary-offers.html\">Creating private offers as a subsidiary account&nbsp;</a>.</p>"
  "148ee2d4b0afc2b75ed62dca0ae0dffb":
    "id": "148ee2d4b0afc2b75ed62dca0ae0dffb"
    "title": "Amazon MSK Connect now supports updating connector plugins and worker configurations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-msk-connect-update-plugin-worker-configurations"
    "published": "2026-10-30 00:00:00"
    "fetched": "2026-10-30 11:22:45"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/msk-connect/\"><u>Amazon MSK Connect</u></a> (Amazon Managed Streaming for Apache Kafka Connect) now lets you update the custom plugin and worker configuration of an existing connector. This is useful when you need to update the custom plugin to run a new version of your connector code, for example one with updated dependencies. You can also update the worker configuration to change worker-level settings, such as switching key and value converters or tuning producer and consumer properties for throughput and latency.</p> \n<p>Amazon MSK Connect is a fully managed service that allows you to deploy, monitor, and scale Apache Kafka Connect connectors with <a href=\"https://aws.amazon.com/msk/\"><u>Amazon MSK</u></a> (Managed Streaming for Apache Kafka). Previously, updating a connector's plugin or worker configuration meant deleting the connector and recreating it - a disruptive operation that added risk and operational overhead. With this launch, you can update a connector's plugin and worker configuration in place. The connector keeps its committed offsets, so its tasks continue processing from where they left off once the update completes.</p> \n<p>This capability is available at no additional cost in all AWS Regions where Amazon MSK Connect is supported. To learn more, visit <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-connect.html\"><u>Amazon MSK Connect developer guide</u></a>.</p>"
  "d921d6c5a3df57e6fc1426da0bcd7ac7":
    "id": "d921d6c5a3df57e6fc1426da0bcd7ac7"
    "title": "AWS Glue Data Catalog now supports Apache Iceberg table optimization in the US West (N. California) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/glue-data-catalog-optimizers-us-west-1/"
    "published": "2026-10-30 17:00:00"
    "fetched": "2026-10-31 01:30:22"
    "summary": "<p>AWS Glue Data Catalog now supports automatic table optimization for Apache Iceberg tables in the US West (N. California) Region. Apache Iceberg is an open table format that delivers fast query performance over large tables in data lakes. With this launch, you can enable table optimization for individual tables or for all tables in your Data Catalog.</p>\n<p>Apache Iceberg tables accumulate small files, snapshots, and unreferenced files with every write, which slows queries and increases storage costs over time. Table optimization continuously monitors your tables to compact small files in the background, remove snapshots that are past your retention settings, and delete unreferenced files that are no longer needed. You can monitor each run from the AWS Glue console, Amazon CloudWatch metrics, and logs.</p>\n<p>You can enable table optimization using the AWS Glue console, AWS CLI, or AWS SDKs. For the full list of Regions where table optimization is available, see Supported Regions for table optimizers. To learn more, see Optimizing Iceberg tables in the AWS Glue Developer Guide. To get started, visit the AWS Glue product page.</p>"
  "ee587b984d35f9684e2f808b3796444b":
    "id": "ee587b984d35f9684e2f808b3796444b"
    "title": "Managed Prometheus collectors now support Amazon MSK consumer-group metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/prometheus-collectors-msk-metrics/"
    "published": "2026-10-30 17:00:00"
    "fetched": "2026-10-31 10:24:08"
    "summary": "<p>Managed Prometheus collectors now support Amazon MSK consumer-group metrics for <a href=\"https://aws.amazon.com/prometheus/\">Amazon Managed Service for Prometheus</a> and <a href=\"https://aws.amazon.com/cloudwatch/\">Amazon CloudWatch</a>. The integration collects Kafka exporter metrics and consumer-group lag metrics from your Amazon MSK clusters.</p>\n<p>Managed Prometheus collectors discover and collect Prometheus metrics from your workloads, so you don't run and operate collection agents yourself. You ingest the collected metrics into an Amazon Managed Service for Prometheus workspace or into Amazon CloudWatch, where you query and analyze them. You monitor Kafka stream health and consumer performance with consumer-group metrics. This helps you detect processing bottlenecks in your streaming applications.</p>\n<p>This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where managed Prometheus collectors are generally available. To learn more, see the documentation for <a href=\"https://docs.aws.amazon.com/prometheus/latest/userguide/prom-msk-kafka-exporter.html\">Amazon Managed Service for Prometheus</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/managed-prometheus-collectors-msk-kafka-exporter.html\">Amazon CloudWatch</a>.</p>"
  "2c499675cc0e85c0f84fe500958e4a5e":
    "id": "2c499675cc0e85c0f84fe500958e4a5e"
    "title": "Amazon SageMaker AI inference now supports GPU partitioning for real-time endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/sagemaker-gpu-partitioning/"
    "published": "2026-10-30 17:00:00"
    "fetched": "2026-10-31 10:24:08"
    "summary": "<p>Amazon SageMaker AI inference now supports GPU partitioning, enabling you to run several models on a single GPU instead of dedicating a whole accelerator to each one. Using NVIDIA Multi-Instance GPU (MIG) technology, SageMaker AI divides a GPU into as many as seven isolated partitions, each with its own memory and compute. Customers serving small and mid-size models, such as fine-tuned variants, embedding models, rerankers, and classifiers, previously had to give every model an entire accelerator, so an instance hosted no more models than it had GPUs and paid for GPU capacity those models could never use.</p>\n<p>With GPU partitioning, you choose how to divide the GPUs behind your endpoint and place each model on a partition sized to fit it. Several models then share one accelerator with hardware-enforced isolation, so a busy model cannot take memory or throughput from the models beside it. Right-sizing an accelerator to a workload also opens up newer instance generations that would otherwise be more capacity than a single model needs. You configure GPU partitioning when you create an endpoint that hosts inference components, and you continue to invoke each model by name, so your application code doesn't change.</p>\n<p>GPU partitioning is available on P4d, P5, G7, and G7e instances in US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (Ireland). To learn more, visit the <a href=\"https://aws.amazon.com/sagemaker/ai/deploy/\">Amazon SageMaker AI deployment page</a> and see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/inference-components-accelerator-partitioning.html\">Amazon SageMaker AI Developer Guide</a>.</p>"
