"overview": |
  この日は 6 ソースから 23 本。セキュリティ速報は CVE-2026-119115 (Bulletin ID: 2026-156-AWS、2026 年 10 月 29 日 09:30 PDT 公開) の 1 件で、AWS Private CA Connector for Kubernetes の issuer 解決ロジックにおける不適切な認可の問題。機械学習では、120B パラメータの MoE モデル NVIDIA Nemotron 3.5 Super VL を Amazon EKS と SageMaker HyperPod EKS で動かしてエージェント型 AI を加速する方法、MoEngage が 7 リージョンにまたがる約 400 のプライベート REST API を Amazon Bedrock AgentCore Gateway で権限スコープ付きのエージェントツールに変えた事例 (サービスごとの MCP サーバーや公開エンドポイントは不要)、GPU キャパシティをチームやプロジェクトごとのクォータシェアに分け、空きを自動で貸し借りしプリエンプションで取り戻せる AWS Batch のクォータ管理を SageMaker Training ジョブで使う方法が紹介された。What's New は 2 件。Amazon RDS for SQL Server と Amazon RDS for Oracle が、追加のストレージボリュームでもストレージの自動スケーリングに対応した。追加ボリュームは最大 3 本まで足して容量を 256 TiB まで増やせるが、従来は主ボリュームでしか自動スケーリングが使えず、追加ボリュームは見込みに基づいて手で容量を確保する必要があり、少なく見れば停止、多く見れば無駄が出ていた。Amazon Aurora PostgreSQL 互換エディションはポスト量子 TLS (PQ-TLS) の鍵交換に対応し、転送中のデータの暗号化にポスト量子暗号を選べるようになった。バージョン 18 以降で ssl_groups パラメータを変更でき、許可リストから組織のセキュリティ基準に合う暗号グループを選べる。アーキテクチャブログでは 3 本。BMW Group がコネクテッドカーのプラットフォームを x86 から AWS Graviton へ移行した事例では、Karpenter、マルチアーキテクチャのコンテナビルド、Graviton ベースの CI/CD ランナーを使って停止なしに移行し、NGINX イングレスの CPU を約 57% 削減して価格性能を約 40% 改善した。boAt は Amazon Bedrock と AWS Lambda で AI Coach を作り、インド国内の数百万人のスマートウォッチ利用者にリアルタイムのパーソナライズされたフィットネスコーチングを届けている。コンピュートブログでは AWS Outposts のオブザーバビリティを、ネットワーク・ストレージ・コンピュート・コンテナの 4 つの観点から AWS Systems Manager・Amazon CloudWatch・Amazon EventBridge で組み立て、データセンターと AWS リージョンにまたがるハイブリッド環境を一元的に可視化して対応を自動化する方法が解説された。機械学習ブログではさらに 4 本。Epsilon の Agentic Platform チームが Amazon Nova Act と Amazon Bedrock AgentCore Browser Tool で UI テストをマネージドなマルチテナントのサービスとして提供し、平文の英語でテストを書いて AWS が管理するブラウザで実行する仕組み、Kiro を使って PHP から Java への移行を繰り返し可能な工程に変える方法 (機械的な棚卸しスキャナーと、元の PHP アプリケーションを仕様として扱い parity harness で移植を検証する 8 フェーズのワークフロー)、英国の Amazon Quick ユーザーグループの 2026 年の振り返り (四半期ごとに 3 回の集まりで参加者 150 名超、Arriva・Carsa・Propulse Lab の事例) が公開された。 遅れて取得した記事が 8 本。What's New では、Amazon MSK Connect が既存コネクタのカスタムプラグインとワーカー設定のインプレース更新に対応し、従来必要だったコネクタの削除・再作成なしに、コミット済みオフセットを保ったまま処理を再開できるようになった。AWS Marketplace は複数の法人を持つパートナーが主アカウントで 1 度出品すれば、各国の子会社アカウントがそれぞれの税務 ID・現地通貨・支払先口座でダイレクトプライベートオファーとして販売できるようにした (追加料金なし)。AWS Japan Blog では、2026 年 10 月 22 日に一般提供となった AWS Continuum for code vulnerabilities の紹介、KDDI が 2026 年 7 月にマネージドノードグループから Amazon EKS Auto Mode へ移行し、最長 21 日でノードが自動で入れ替わることで脆弱性対応のノード更新作業をなくした一方、起動時の CPU 需要の集中や入れ替え時刻の制御といった課題を Pod 配置の適正化とカスタムコントローラー node-rotation-controller で解決した事例、Kiro CLI を実装役とする仕組み (BRIDGE) を約 1 か月運用し、AI エージェントに書き込みを任せるときの権限・変更範囲・マージ条件の 4 つの境界を整理した記録、re:Invent 2026 の AIOps セッション (AWS DevOps Agent を含むインシデント調査・修復・リリース検証など) の紹介、2026 年 11 月 18 日から 20 日に開かれる Inter BEE 2026 の AWS ブースの案内、10 月 26 日の Weekly Roundup の日本語版が公開された。 さらに What's New で、AWS Glue Data Catalog の Apache Iceberg テーブルの自動最適化が米国西部 (北カリフォルニア) リージョンでも利用できるようになった。 遅れて取得した What's New がさらに 2 件。Amazon SageMaker AI の推論がリアルタイムエンドポイントでの GPU パーティショニングに対応した。NVIDIA Multi-Instance GPU (MIG) で 1 つの GPU を最大 7 つの分離されたパーティションに分け、それぞれが専用のメモリとコンピュートを持つため、ファインチューニング済みモデル、埋め込み、リランカー、分類器といった小中規模のモデルをハードウェアレベルで分離したまま 1 基のアクセラレーターに同居させられる。推論コンポーネントをホストするエンドポイントの作成時に設定し、アプリケーションのコードは変わらない。対象は P4d、P5、G7、G7e インスタンスで、米国東部 (バージニア北部)、米国東部 (オハイオ)、米国西部 (オレゴン)、アジアパシフィック (シンガポール)、アジアパシフィック (東京)、欧州 (フランクフルト)、欧州 (アイルランド) で利用できる。マネージド Prometheus コレクターは Amazon MSK のコンシューマーグループのメトリクスに対応し、Kafka exporter のメトリクスとコンシューマーグループのラグを Amazon Managed Service for Prometheus または Amazon CloudWatch へ取り込めるようになり、ストリーミングアプリケーションの処理のボトルネックを検知できる。
