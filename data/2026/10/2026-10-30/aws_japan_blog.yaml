    "title": "AI エージェントに書き込みを任せるとき、境界をどこに置くか ― Kiro CLI で仕組みを作り、1 か月運用した記録"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-cli-agent-write-boundaries/"
    "published": "2026-10-30 10:04:45"
    "fetched": "2026-10-30 11:22:46"
    "summary": "AI エージェント同士を組み合わせること自体は、いまではさまざまな方法で実現できます。2 つのコーディングエージェントを対話させる方法もあれば、Kiro のように公式の機能で複数のエージェントを段階的に動かす方法もあります。本記事が扱うのは、組み合わせ方そのものではありません。組み合わせた AI に書き込みを任せるとき、誰が権限を持ち、どこまで変更してよく、何を条件にマージするのか、という境界の置き方です。私は、自社プロダクトの開発のために、Kiro CLI を実装役とする仕組み（以下 BRIDGE）を作り、約 1 か月運用しました。本記事では、BRIDGE を作ったきっかけ、その構成と 4 つの境界、運用で分かったことを紹介し、最後に 2026 年 10 月時点の Kiro の標準機能と比較します。"
"last_updated": "2026-10-30 11:22:46 JST"
