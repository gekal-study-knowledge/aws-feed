  "18bc38446df61b85a5a1b49607bdff53":
    "id": "18bc38446df61b85a5a1b49607bdff53"
    "title": "KDDI における Amazon EKS Auto Mode 商用導入：カスタムコントローラーによる運用課題の解決"
    "link": "https://aws.amazon.com/jp/blogs/news/202611-kddi-eks-auto-mode-case-study/"
    "published": "2026-10-30 13:12:08"
    "fetched": "2026-10-30 18:32:34"
    "summary": "KDDI 株式会社では 2026 年 7 月、通信事業のお客さま向けサービスを支える Amazon EKS のクラスタを、マネージドノードグループから Amazon EKS Auto Mode へ移行しました。ノードが最長 21日で自動的に入れ替わる仕組みにより、脆弱性対応のたびに発生していたノードの更新作業がなくなりました。一方で、無人でのノード更新を前提にしたことで、起動時の CPU 需要の集中や、失効によるノード入れ替え時刻の制御といった課題が表面化しました。本稿では、Pod 配置の適正化と、カスタムコントローラ node-rotation-controller の開発による対処を、実測値とあわせて紹介します。"
