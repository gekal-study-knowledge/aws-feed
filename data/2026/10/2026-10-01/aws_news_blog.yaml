    "title": "Amazon S3 Vectors now supports metadata pre-filtering for higher recall on filtered searches"
    "link": "https://aws.amazon.com/blogs/aws/amazon-s3-vectors-now-supports-metadata-pre-filtering-for-higher-recall-on-filtered-searches/"
    "published": "2026-10-01 05:03:34"
    "fetched": "2026-10-01 08:24:26"
    "summary": "Amazon S3 Vectors now supports metadata pre filtering, delivering up to 5x higher recall on filtered searches. Filters evaluate before similarity search so scoped queries return more relevant results. Ideal for RAG, agentic apps, and document search."
