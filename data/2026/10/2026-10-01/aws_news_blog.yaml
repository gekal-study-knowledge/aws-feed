    "title": "Amazon S3 Tables now support all Apache Iceberg V3 data types"
    "link": "https://aws.amazon.com/blogs/aws/amazon-s3-tables-now-support-all-apache-iceberg-v3-data-types/"
    "published": "2026-10-01 07:10:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "Amazon S3 Tables now offer complete support for the Apache Iceberg V3 spec. Upgrade existing V2 tables or create new V3 tables with built-in compaction, maintenance, and engine compatibility."
  "120b5e88ddb094bc1d8b2c8fb675b4e5":
