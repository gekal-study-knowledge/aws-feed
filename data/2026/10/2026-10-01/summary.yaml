"overview": |
  この日は 31 件で、Aurora PostgreSQL からデータレイクを直接クエリできるようになったこと、Kiro の新機能、そしてエージェント活用の事例が中心でした。データベースでは、Amazon Aurora PostgreSQL がデータレイクに保存された Apache Iceberg および Apache Parquet 形式のデータを直接クエリできるようになりました。DuckDB が Aurora PostgreSQL に組み込まれており、ETL パイプラインを組まずに、既存の PostgreSQL アプリケーションとツールのまま運用データとデータレイクのデータを 1 つのクエリで横断的に分析できます。あわせて Amazon Aurora serverless のスケールが速くなり、1 秒以内に現在の容量へ最大 16 ACU を追加し、ワークロードの増加に応じて 256 ACU まで伸びるようになりました。エージェント型 AI のようなバースト性のあるワークロードを想定した変更です。Amazon Aurora と Amazon RDS は第 5 世代 AMD EPYC プロセッサ搭載の R8a インスタンスに、Amazon RDS for PostgreSQL・MySQL・MariaDB は同じ第 5 世代 AMD EPYC の M8a インスタンスに対応し、Amazon RDS Database Preview Environment では MySQL 26.7 を評価できるようになりました。Amazon OpenSearch Ingestion と Amazon Aurora / Amazon RDS (MySQL / PostgreSQL) の統合も一般提供となり、自前の ETL パイプラインなしにデータベースの内容をニアリアルタイムで OpenSearch へ同期できます。開発ツールでは Kiro workflows が発表されました。複数のエージェントを使い、少ない監督で複雑なタスクを最初から最後までやり遂げる機能で、Kiro 自身の開発にも使われ、新しいクラウド構成・クラウドセッション・workflows 体験の大部分がその成果だとされています。あわせて、Kiro をベースにしたサンプルエージェントによる SAP モダナイゼーションが 2 本の記事で紹介されました。カスタム SAP ABAP プログラム、SAP BW、SAP PI/PO のモダナイゼーションを単一のプロンプトで一括実行でき、社内ベンチマークでは ABAP コードのモダナイゼーション工数を最大 87% 削減、SAP ECC の ABAP コード 88 オブジェクトを 4.5 時間で SAP S/4HANA 準拠に変換し、SAP PI/PO の 22 インターフェースを約 2 時間で SAP BTP Integration Suite へ移行した結果が示されています。検索・ベクトルでは、Amazon S3 Vectors がメタデータの事前フィルタリングに対応し、類似度検索の前にフィルターを評価することで、絞り込みのあるクエリでの再現率が最大 5 倍に向上しました。Amazon S3 Tables は Apache Iceberg V3 仕様のデータ型をすべてサポートし、既存の V2 テーブルのアップグレードや、コンパクション・メンテナンス・エンジン互換性を備えた V3 テーブルの新規作成ができます。アーキテクチャブログでは、MHK が Amazon Bedrock・Amazon ECS・イベント駆動パターンで HIPAA 適格のエージェント型ワークフローフレームワーク SmartProminence AI Orchestrator を構築し医療レビューの手作業を削減した事例と、ARC Zonal Shift を使って Amazon ECS や Amazon EKS を横断する 48〜72 時間のアベイラビリティゾーン退避訓練を行い、マルチ AZ 構成が実際の障害に耐えられることを検証する方法が公開されました。機械学習ブログでは、Amazon Bedrock AgentCore Runtime Instances が GPU・永続ボリューム・複数日にわたるセッションを備えた AWS 管理の EC2 インフラをマルチエージェントのワークフローに提供することを使い、3 エージェント構成の音楽制作パイプラインをデプロイする方法と、Amazon Bedrock Knowledge Bases で保険請求の文書を取り込み、引用付きで自然言語の質問に答える対話型アシスタントを作る手順が解説されています。日本のブログでは、オリックス株式会社の SaaS「PATPOST」の既存 REST API を、既存資産に手を入れずに Amazon Bedrock AgentCore Gateway で MCP サーバー化した取り組み、Amazon Bedrock Guardrails の自動推論チェックを使って LLM の回答を反復的に書き換えハルシネーションを抑えるオープンソースのサンプルチャットボット (VALID・INVALID・SATISFIABLE といった検出結果に応じた優先順位付けと書き換えループ、数学的に検証可能な説明と監査証跡)、世界最大の株式デリバティブ清算機関である The Options Clearing Corporation (OCC) が Amazon Bedrock で構築した「SOC エージェント」でセキュリティアラートの調査を自動化し解釈可能かつ監査可能な結果を得ている事例、そして 2026 年 7 月 29 日から 2 日間パシフィコ横浜で開催された KubeCon + CloudNativeCon Japan 2026 の AWS ブースで Amazon EKS の最新ソリューションに関するデモセッションを 12 回実施した開催報告が公開されました。そのほかサービス更新では、AWS CloudTrail が Event Coverage を導入してアカウントおよび組織レベルでデータプレーン操作の記録範囲を可視化できるようになり、Amazon Bedrock が英国 (ロンドン) リージョンで Claude Opus 5.5 と Claude Sonnet 5 のリージョン内処理に対応、OpenAI の GPT-6 Astra が Amazon Bedrock で速度重視のプレミアム階層 UltraFast モードに対応しました。AWS Parallel Computing Service はクラスターのコンピュートノードグループのスケーリングを 1 件 1 状態遷移として記録するスケーリングログに対応し、Amazon Managed Grafana は Grafana 13.2 のワークスペース作成に対応 (ダッシュボードの Git Sync など 13.0〜13.2 の機能を含む)、AWS CLI は Agent Toolkit for AWS 向けにスキルの一括更新とバージョン確認のコマンドを追加しました。Amazon WorkSpaces Core Managed Instances は NVIDIA RTX PRO 4500 Blackwell Server Edition GPU と Intel Xeon 6 を搭載した Graphics G7 インスタンスに対応しています。ニュースブログでは 2026 年 9 月の新しい AWS Heroes が紹介され、日本のブログでは週刊まとめ (2026 年 9 月 28 日) も公開されました。
