"overview": |
  この日は 20 件で、データベースからデータレイクを直接照会できるようになった更新と、可用性や監査のための運用パターンが中心でした。データベースでは、Amazon Aurora PostgreSQL がデータレイクにある Apache Iceberg と Parquet のデータを直接照会できるようになりました。既存の PostgreSQL のアプリケーションやツールから、運用データとデータレイクのデータを ETL のパイプラインもデータの二重持ちもなしに一緒に扱えます。これまでは、データレイクから Aurora へデータを写すパイプラインが必要で、スキーマが変わるたびにコストと開発の手間が膨らんでいました。今回の対応では、Iceberg や Parquet のデータを参照する PostgreSQL の外部テーブルを作れます。Aurora に組み込まれた DuckDB を使っており、慣れた PostgreSQL の構文でトランザクションデータと履歴データを 1 つのクエリで結合でき、AWS Glue Data Catalog・Amazon S3・S3 Tables に対応し、述語のプッシュダウンやキャッシュによる最適化も入っています。監査では、AWS CloudTrail に Event Coverage という新しいコンソール体験が加わりました。アカウントおよび組織のレベルで、データプレーンの操作をどれだけ記録できているかを俯瞰でき、環境内のどの AWS サービスとリソースタイプでデータイベントのログが有効になっていて、どれが無効なのかが分かります。組織内のアカウントを手作業で見て回らずに、ログ取得の抜けを素早く見つけられます。データイベントは AWS サービスのデータプレーン操作の追跡に使うもので、たとえば Amazon S3 の GetObject や PutObject といったオブジェクト単位の操作を記録して、不正なデータアクセスや持ち出しの試みを検知できます。アーキテクチャブログでは、ARC Zonal Shift を使ってアベイラビリティーゾーンの退避ドリルを 48〜72 時間にわたって実施し、マルチ AZ 構成が実際の障害に耐えられることを確かめる方法が紹介されました。Amazon ECS・Amazon EKS・Amazon RDS for PostgreSQL・Amazon Aurora PostgreSQL を対象に、前提条件、CLI のコマンド、観測すべきメトリクス、復旧手順が順を追ってまとめられています。あわせて、MHK が Amazon Bedrock・Amazon ECS・イベント駆動のパターンを使って HIPAA 適格のエージェント型ワークフローの枠組み SmartProminence AI Orchestrator を構築した事例が紹介されました。医療審査の手作業を 90% 削減し、新しい AI 機能の投入を数か月から数週間に短縮しており、ヘルスケアの AI のために再利用できるマルチテナントのオーケストレーターとしてどう設計したかが解説されています。機械学習ブログでは、Amazon Bedrock Knowledge Bases 上に、出典つきで自然言語の質問に答える対話型の保険金請求アシスタントを作る手順が公開されました。Amazon S3 からの請求文書の取り込み、AgenticRetrieveStream API による問い合わせ、複数ターンの追問、メタデータによる絞り込み、文脈に基づく根拠づけのガードレールまでを扱っています。あわせて、Amazon Bedrock AgentCore Runtime Instances 上にマルチエージェントの音楽制作パイプラインを組む記事も公開されました。AgentCore Runtime Instances は GPU・永続ボリューム・数日にわたるセッションを備えた AWS 管理の EC2 インフラをマルチエージェントのワークフローに提供するもので、3 つのエージェントが 1 つの GPU インスタンスに同居してファイルシステムを共有し、互いに仕事を引き渡して 1 曲を完成させます。このほか、2026 年 9 月の AWS Heroes の新メンバー紹介が公開されています。ストレージと検索では、Amazon S3 Tables が Apache Iceberg V3 仕様に完全対応しました。既存の V2 テーブルをアップグレードするか、V3 のテーブルを新規に作成でき、コンパクションやメンテナンス、エンジンとの互換性は組み込みで提供されます。Amazon S3 Vectors はメタデータの事前フィルタリングに対応し、類似度検索を走らせる前にメタデータのフィルターを評価するようになりました。フィルターの選択性が高い場合に、条件に合うベクトルを最大 5 倍多く返せる (再現率が最大 5 倍) ようになり、パスや URL のような値を絞り込むための前方一致演算子 ($startsWith) も加わったため、RAG・エージェント型・セマンティック検索のアプリケーションが、絞り込んだときにもより網羅的な結果を得られます。モデルでは、OpenAI の GPT-6 Astra が Amazon Bedrock で UltraFast モードに対応しました。速度が最も重要なワークロードのための上位の速度階層で、OpenAI によれば API での推論が最大 6 倍速く、毎秒最大 300 トークンに達します。リアルタイムのコーディングアシスタント、対話型エージェント、顧客向けの体験のように遅延に敏感な用途に向きます。データベースでは、Amazon Aurora serverless のスケールアップの刻みが大きくなり、現在の容量に対して 1 秒以内に最大 16 ACU を追加し、ワークロードの伸びに応じて最大 256 ACU まで伸ばせるようになりました。処理が終われば自動でゼロまで縮退するため使った分だけの課金で、活動のバースト・長いアイドル・予測しづらいトラフィックというエージェント型 AI のアプリケーションに特に向きます (全 Aurora serverless で既定で有効)。あわせて、第 5 世代 AMD EPYC を搭載した R8a データベースインスタンスが Amazon Aurora と Amazon RDS で、M8a が Amazon RDS for PostgreSQL・MySQL・MariaDB でサポートされました。いずれも 1 vCPU が物理 CPU コア 1 つに対応してコアあたりの性能が安定し、I/O 要求の高いワークロード向けに最大 75 Gbps のネットワーク帯域と 60 Gbps の Amazon EBS 帯域を提供します (第 6 世代 Nitro カードを使う AWS Nitro System 上に構築)。また Amazon RDS Database Preview Environment で MySQL 26.7 が利用可能になりました。YY.M (年.月) のカレンダーバージョニングを採用した最初の Innovation リリースで、バグ修正とセキュリティパッチに加えて、テストワークロードで適用スループットと遅延の回復を改善するモジュール型のレプリケーションアプライヤー Change Stream Applier などの新機能を含みます。可観測性では、Amazon Managed Grafana で Grafana 13.2 のワークスペースを作成できるようになりました。OSS の Grafana 13.0〜13.2 の機能が入り、ダッシュボードの Git Sync (ワークスペースを Git リポジトリに紐づけてダッシュボードをコードとして扱い、変更の追跡・レビュー・巻き戻しができる)、動的ダッシュボード、Amazon CloudWatch データソースプラグインでの PromQL クエリのサポートが含まれます。HPC では、AWS Parallel Computing Service (AWS PCS) がスケーリングログに対応し、クラスター内のコンピュートノードグループをどうスケールしたかが記録されるようになりました。ログ 1 件がコンピュートノード 1 台の状態遷移 (インスタンスの起動、ノードの登録、スケールダウン、理由付きの起動失敗など) を表すため、目標サイズに届かなかった理由、容量を理由に失敗した起動、特定のノードが動き出した / 止まった時刻を調べやすくなります (配信はオプトイン)。開発ツールでは、Agent Toolkit for AWS 向けの AWS CLI コマンドが拡張され、aws agent-toolkit check-skill-updates でインストール済みのスキルをレジストリの最新版と一括で比較し、aws agent-toolkit update-skill --all で古いスキルをまとめて更新できるようになりました。Agent Toolkit for AWS は、15,000 を超える AWS API への安全で監査可能なエージェントインターフェイスを提供する AWS MCP Server と、エージェントに専門的な指針を与えるエージェントスキルから成ります。日本語ブログでは、オリックス株式会社の SaaS 「PATPOST」の既存 REST API を、Amazon Bedrock AgentCore Gateway で MCP サーバー化した取り組みが紹介されました。既存資産に手を入れずに MCP サーバー化する方法が解説されています。
