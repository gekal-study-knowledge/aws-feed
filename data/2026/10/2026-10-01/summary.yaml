"overview": |
  この日は 43 件で、Aurora PostgreSQL からデータレイクを直接クエリできるようになったこと、Kiro の新機能、そしてエージェント活用の事例が中心でした。データベースでは、Amazon Aurora PostgreSQL がデータレイクに保存された Apache Iceberg および Apache Parquet 形式のデータを直接クエリできるようになりました。DuckDB が Aurora PostgreSQL に組み込まれており、ETL パイプラインを組まずに、既存の PostgreSQL アプリケーションとツールのまま運用データとデータレイクのデータを 1 つのクエリで横断的に分析できます。あわせて Amazon Aurora serverless のスケールが速くなり、1 秒以内に現在の容量へ最大 16 ACU を追加し、ワークロードの増加に応じて 256 ACU まで伸びるようになりました。エージェント型 AI のようなバースト性のあるワークロードを想定した変更です。Amazon Aurora と Amazon RDS は第 5 世代 AMD EPYC プロセッサ搭載の R8a インスタンスに、Amazon RDS for PostgreSQL・MySQL・MariaDB は同じ第 5 世代 AMD EPYC の M8a インスタンスに対応し、Amazon RDS Database Preview Environment では MySQL 26.7 を評価できるようになりました。Amazon OpenSearch Ingestion と Amazon Aurora / Amazon RDS (MySQL / PostgreSQL) の統合も一般提供となり、自前の ETL パイプラインなしにデータベースの内容をニアリアルタイムで OpenSearch へ同期できます。開発ツールでは Kiro workflows が発表されました。複数のエージェントを使い、少ない監督で複雑なタスクを最初から最後までやり遂げる機能で、Kiro 自身の開発にも使われ、新しいクラウド構成・クラウドセッション・workflows 体験の大部分がその成果だとされています。あわせて、Kiro をベースにしたサンプルエージェントによる SAP モダナイゼーションが 2 本の記事で紹介されました。カスタム SAP ABAP プログラム、SAP BW、SAP PI/PO のモダナイゼーションを単一のプロンプトで一括実行でき、社内ベンチマークでは ABAP コードのモダナイゼーション工数を最大 87% 削減、SAP ECC の ABAP コード 88 オブジェクトを 4.5 時間で SAP S/4HANA 準拠に変換し、SAP PI/PO の 22 インターフェースを約 2 時間で SAP BTP Integration Suite へ移行した結果が示されています。検索・ベクトルでは、Amazon S3 Vectors がメタデータの事前フィルタリングに対応し、類似度検索の前にフィルターを評価することで、絞り込みのあるクエリでの再現率が最大 5 倍に向上しました。Amazon S3 Tables は Apache Iceberg V3 仕様のデータ型をすべてサポートし、既存の V2 テーブルのアップグレードや、コンパクション・メンテナンス・エンジン互換性を備えた V3 テーブルの新規作成ができます。アーキテクチャブログでは、MHK が Amazon Bedrock・Amazon ECS・イベント駆動パターンで HIPAA 適格のエージェント型ワークフローフレームワーク SmartProminence AI Orchestrator を構築し医療レビューの手作業を削減した事例と、ARC Zonal Shift を使って Amazon ECS や Amazon EKS を横断する 48〜72 時間のアベイラビリティゾーン退避訓練を行い、マルチ AZ 構成が実際の障害に耐えられることを検証する方法が公開されました。機械学習ブログでは、Amazon Bedrock AgentCore Runtime Instances が GPU・永続ボリューム・複数日にわたるセッションを備えた AWS 管理の EC2 インフラをマルチエージェントのワークフローに提供することを使い、3 エージェント構成の音楽制作パイプラインをデプロイする方法と、Amazon Bedrock Knowledge Bases で保険請求の文書を取り込み、引用付きで自然言語の質問に答える対話型アシスタントを作る手順が解説されています。日本のブログでは、オリックス株式会社の SaaS「PATPOST」の既存 REST API を、既存資産に手を入れずに Amazon Bedrock AgentCore Gateway で MCP サーバー化した取り組み、Amazon Bedrock Guardrails の自動推論チェックを使って LLM の回答を反復的に書き換えハルシネーションを抑えるオープンソースのサンプルチャットボット (VALID・INVALID・SATISFIABLE といった検出結果に応じた優先順位付けと書き換えループ、数学的に検証可能な説明と監査証跡)、世界最大の株式デリバティブ清算機関である The Options Clearing Corporation (OCC) が Amazon Bedrock で構築した「SOC エージェント」でセキュリティアラートの調査を自動化し解釈可能かつ監査可能な結果を得ている事例、そして 2026 年 7 月 29 日から 2 日間パシフィコ横浜で開催された KubeCon + CloudNativeCon Japan 2026 の AWS ブースで Amazon EKS の最新ソリューションに関するデモセッションを 12 回実施した開催報告が公開されました。そのほかサービス更新では、AWS CloudTrail が Event Coverage を導入してアカウントおよび組織レベルでデータプレーン操作の記録範囲を可視化できるようになり、Amazon Bedrock が英国 (ロンドン) リージョンで Claude Opus 5.5 と Claude Sonnet 5 のリージョン内処理に対応、OpenAI の GPT-6 Astra が Amazon Bedrock で速度重視のプレミアム階層 UltraFast モードに対応しました。AWS Parallel Computing Service はクラスターのコンピュートノードグループのスケーリングを 1 件 1 状態遷移として記録するスケーリングログに対応し、Amazon Managed Grafana は Grafana 13.2 のワークスペース作成に対応 (ダッシュボードの Git Sync など 13.0〜13.2 の機能を含む)、AWS CLI は Agent Toolkit for AWS 向けにスキルの一括更新とバージョン確認のコマンドを追加しました。Amazon WorkSpaces Core Managed Instances は NVIDIA RTX PRO 4500 Blackwell Server Edition GPU と Intel Xeon 6 を搭載した Graphics G7 インスタンスに対応しています。ニュースブログでは 2026 年 9 月の新しい AWS Heroes が紹介され、日本のブログでは週刊まとめ (2026 年 9 月 28 日) も公開されました。データレイク周りの更新も続きました。Amazon S3 Tables は 1 アカウント 1 リージョンあたりのテーブルバケット数の上限が 10 から 100 に引き上げられ、1 リージョンあたり最大 100 万テーブルを作れるようになりました。データセット・ワークロード・チームごとに別のテーブルバケットを用意し、暗号化・アクセスポリシー・レプリケーションといったバケット単位の設定をそれぞれに当てられます (全アカウントに既定で適用、追加費用なし)。AWS Glue Data Catalog は Apache Iceberg V3 テーブルに対するテーブル最適化・統計・クローラーに対応しました。binpack・sort・z-order の各戦略で V3 テーブルをコンパクションしてクエリ性能を上げ、期限切れのスナップショットや孤立ファイルを削除してストレージコストを下げられ、これらの最適化は variant・地理空間・ナノ秒精度といった V3 のデータ型にも対応します。Apache Iceberg のマテリアライズドビューには、システム管理の書き込み保護が加わりました。マテリアライズドビューは重いクエリを一度だけ計算して結果をエンジン横断で再利用できる仕組みですが、その結果がデータレイク上の開かれた Iceberg テーブルであるため、カタログ経由でも Amazon S3 のファイルに直接書いても、書き込み権限を持つ誰でも変えられてしまいます。システム管理のマテリアライズドビューはそのデータと定義を AWS Glue だけが書けるようにして、誰が書き込み権限を持っていても結果が計算どおりに保たれるようにします。Amazon EMR Serverless のサーバーレスストレージは、シャッフル操作がこれまでのジョブあたり 200 GB から最大 1 TB まで扱えるようになり、結合や集約のような複雑な処理で大量のシャッフルデータを扱う本番規模の Apache Spark ワークロードを動かせます。セキュリティでは、AWS Security Hub に修復プラン (remediation plans) が加わりました。根本原因を共有する関連したエクスポージャーの検出結果をまとめるもので、個々のエクスポージャーに別々に対処するのではなく、設定の誤りや緩すぎるポリシーといった元になっているリソース 1 つを直すことで、複数のエクスポージャーを一度に解消したり深刻度を下げたりできます。各プランには優先度の指針 (Critical / High / Medium / Low)、影響の評価、そして AWS CLI・Terraform・CloudFormation など複数の形式の例を含む手順が付きます。AWS Secrets Manager は AWS Recommended Actions の枠組みと統合し、シークレットごとの状況に応じた実行可能な提案をコンソール上に表示するようになりました。ローテーションの設定が必要なシークレットを見つけたり、既定のサービス提供キーの代わりに顧客管理キーを使うよう促したりと、コンソールから離れずにベストプラクティスに沿えます。AWS IAM Identity Center はマルチリージョン対応をオプトインリージョンへ、また AWS GovCloud (US) と AWS 中国リージョンの内部のリージョン間へと広げました (これまでは既定で有効な商用リージョンのみ)。ネットワークでは、Route 53 Global Resolver と DNS Firewall が Amazon CloudWatch とのネイティブな統合によって DNS の分析とインサイトを提供するようになり、CloudWatch Metrics と Contributor Insights を通じて DNS クエリのパターンを把握し、DNS Firewall のルールの効き具合を監視し、異常な活動を検知し、DNS インフラの性能を最適化できます。ストレージでは、Amazon S3 Object Lock のイベントホールドによる可変保持が AWS GovCloud (US-East) と (US-West) でも利用可能になりました。契約の締結や監査の完了といった将来のイベントを起点に保持期間が始まるオブジェクトに WORM 保護を当てるもので、保持期間を伴うイベントホールドを置いている間は S3 がオブジェクトを保護し、ホールドを解除するとそこから指定した期間だけ保持します。AWS Transfer Family では、マネージドワークフローの実行ログを送る CloudWatch Logs のロググループをワークフロー単位で選べるようになりました (これまではサーバーに紐づくロググループに集約されていました)。BI では、Amazon Quick に階層フィルター (Hierarchy Filter) が加わりました。リージョン・国・都市のように関連する次元を 1 つのコントロールで掘り下げられるもので、積み重なった複数のフィルターを 1 つに置き換えて画面の雑然さを減らし、少ないクリックで目的のデータに導きます。最大 5 階層を広い順に並べ、1 つのドロップダウンを開いて順に展開すると、選択のたびに次の階層が絞られ、親の連なりが自動で選ばれます。このほか、Amazon Corretto の LTS 版に 2026 年 9 月のパッチ更新が出て、Corretto 8u504 がダウンロード可能になりました (tzdata 2026d の更新を含みます)。
