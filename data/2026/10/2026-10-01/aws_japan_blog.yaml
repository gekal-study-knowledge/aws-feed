  "7de1bfe8f45e52392adcaa697188d03c":
    "id": "7de1bfe8f45e52392adcaa697188d03c"
    "title": "OCC が AWS 上に構築したエージェンティック AI 調査ソリューションでセキュリティオペレーションを強化"
    "link": "https://aws.amazon.com/jp/blogs/news/occ-strengthens-security-operations-with-an-agentic-ai-investigation-solution-built-on-aws/"
    "published": "2026-10-01 13:36:35"
    "fetched": "2026-10-01 19:41:20"
    "summary": "世界最大の株式デリバティブ清算機関である The Options Clearing Corporation (OCC)® は、Amazon Bedrock で構築した AI 搭載のセキュリティ調査エージェント「SOC エージェント」を導入しました。本記事では、エージェンティックループによってセキュリティアラートの調査を自動化し、解釈可能かつ監査可能な結果を提供する仕組みを紹介します。また、ヒューマンインザループのフィードバックによって、セキュリティ専門家が主導権を保ちながらエージェンティック AI を活用する方法も説明します。"
  "953924bd04ee1217bd44cd9c82263744":
