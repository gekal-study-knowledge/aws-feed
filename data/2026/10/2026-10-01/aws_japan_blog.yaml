    "title": "REST API を Amazon Bedrock AgentCore Gateway で MCP サーバー化する ― オリックス「PATPOST」での取り組み"
    "link": "https://aws.amazon.com/jp/blogs/news/agentcore-gateway-patpost/"
    "published": "2026-10-01 07:55:36"
    "fetched": "2026-10-01 08:24:27"
    "summary": "オリックス株式会社の SaaS「PATPOST」の既存 REST API を、Amazon Bedrock AgentCore Gateway で MCP サーバー化した取り組みをご紹介します。既存資産に手を入れずに MCP サーバー化する方法を解説します。"
  "9f1ed649bf0c8376ad04c5c0b0f215a3":
    "id": "9f1ed649bf0c8376ad04c5c0b0f215a3"
    "title": "Amazon OpenSearch Ingestion と Amazon RDS および Amazon Aurora の統合"
    "link": "https://aws.amazon.com/jp/blogs/news/integrating-amazon-opensearch-ingestion-with-amazon-rds-and-amazon-aurora-2/"
    "published": "2026-10-01 12:15:12"
    "fetched": "2026-10-01 12:54:13"
    "summary": "Amazon Aurora および Amazon RDS（MySQL / PostgreSQL）と Amazon OpenSearch Service の統合が一般提供開始されました。Amazon OpenSearch Ingestion を使うと、ETL パイプラインを自前で組まずに、データベースの内容をニアリアルタイムで OpenSearch に同期できます。本記事では、サンプルの HR データベースを使って設定の流れと同期の動きを紹介します。"
  "479880ca03e9abf6ac28762891bd210f":
    "id": "479880ca03e9abf6ac28762891bd210f"
    "title": "自動推論チェックで回答を書き換えてハルシネーションを抑えるチャットボットのリファレンス実装"
    "link": "https://aws.amazon.com/jp/blogs/news/automated-reasoning-checks-rewriting-chatbot-reference-implementation/"
    "published": "2026-10-01 11:25:38"
    "fetched": "2026-10-01 12:54:13"
    "summary": "Amazon Bedrock Guardrails の自動推論チェックを活用し、大規模言語モデル (LLM) の回答を反復的に書き換えて改善するオープンソースのサンプルチャットボットを紹介します。検出結果の種類 (VALID、INVALID、SATISFIABLE など) に応じた優先順位付けと書き換えループの仕組み、確認のための質問を行うロジック、数学的に検証可能な説明と監査証跡による透明性の向上、バックエンドの主要コンポーネントと導入手順を詳しく説明します。"
  "ed65ca0934f18989f259f233ee1a77d3":
    "id": "ed65ca0934f18989f259f233ee1a77d3"
    "title": "Kiro workflows のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-workflows/"
    "published": "2026-10-01 10:59:12"
    "fetched": "2026-10-01 12:54:13"
    "summary": "本日、Kiro workflows を発表します。複数のエージェントを使い、少ない監督で複雑なタスクを最初から最後までやり遂げられる機能です。私たちは Kiro 自体の開発にも workflows を使ってきました。新しいクラウド構成、クラウドセッション、そして workflows 体験の大部分がその成果です。"
  "e5f39eaf68010749c72748308cf3be02":
    "id": "e5f39eaf68010749c72748308cf3be02"
    "title": "Amazon Aurora PostgreSQL がデータレイク上の Apache Iceberg と Parquet データへの直接クエリをサポート"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-aurora-postgresql-now-supports-direct-querying-of-apache-iceberg-and-parquet-data-in-your-data-lake/"
    "published": "2026-10-01 08:35:23"
    "fetched": "2026-10-01 12:54:13"
    "summary": "Amazon Aurora PostgreSQL で、データレイクに保存された Apache Iceberg および Apache Parquet 形式のデータを直接クエリできるようになりました。DuckDB が Aurora PostgreSQL に組み込まれ、ETL パイプラインなしで運用データとデータレイクのデータを 1 つのクエリで横断的に分析できます。"
  "0ad7c369f457577b98b3d1750eb73f50":
    "id": "0ad7c369f457577b98b3d1750eb73f50"
    "title": "Kiro で SAP モダナイゼーションを加速 – ベンチマークとユースケース"
    "link": "https://aws.amazon.com/jp/blogs/news/accelerate-your-sap-modernization-with-kiro-benchmarks-and-use-cases/"
    "published": "2026-10-01 16:31:17"
    "fetched": "2026-10-01 19:41:20"
    "summary": "Kiro ベースのサンプルエージェントを使った SAP モダナイゼーションの6つのユースケースについて、社内ベンチマークとパートナー・お客様の成果を詳しく紹介します。SAP ECC の ABAP コード88オブジェクトを4.5時間で SAP S/4HANA 準拠に変換して工数を87%削減したほか、SAP PI/PO の22インターフェースを約2時間で SAP BTP Integration Suite へ、SAP BW 環境を2.2時間で SAP Datasphere へ変換しました。依存コードの取得、ステアリングファイル、単体テスト、意思決定ログといった、正確性と監査可能性を支えるセーフガードも解説します。"
  "fcda5e507dc633d36a3562e97ef3b9c2":
    "id": "fcda5e507dc633d36a3562e97ef3b9c2"
    "title": "Kiro で SAP モダナイゼーションを加速"
    "link": "https://aws.amazon.com/jp/blogs/news/accelerate-your-sap-modernization-with-kiro/"
    "published": "2026-10-01 16:31:07"
    "fetched": "2026-10-01 19:41:20"
    "summary": "AWS の AI 搭載エンジニアリングエージェント Kiro をベースにしたサンプルエージェントを公開しました。カスタム SAP ABAP プログラム、SAP BW、SAP PI/PO のモダナイゼーションを単一のプロンプトで一括実行でき、社内ベンチマークでは ABAP コードのモダナイゼーション工数を最大87%削減しています。SAP S/4HANA 準拠への変換、クリーンコア化、SAP BTP Integration Suite や SAP Datasphere への移行、仕様書生成、単体テスト自動化といったユースケースと、正確性を担保するセーフガード、始め方を紹介します。"
