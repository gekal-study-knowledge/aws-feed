    "title": "【開催報告】KubeCon + CloudNativeCon Japan 2026 – AWS ブース：Amazon EKS の最新ソリューションに関するデモセッションを実施"
    "link": "https://aws.amazon.com/jp/blogs/news/kubecon-japan-2026/"
    "published": "2026-10-01 13:21:55"
    "fetched": "2026-10-01 19:41:20"
    "summary": "2026年7月29日から 2 日間にわたって、アマゾンウェブサービスジャパン合同会社はパシフィコ横浜で開催された KubeCon + CloudNativeCon Japan 2026 においてスポンサーとしてブースを出展しており、たくさんの方にご来場いただきました。（ご来場いただいた皆様、有難うございました！）&nbsp; AWS ブースでは、2日間で 12 のデモセッションを行い、多くのご来場者にご視聴いただきました。その際にセッション資料をシェアしてほしいとのご要望をいくつか頂いたことを受け、こちらのブログで各セッションの資料を公開させて頂きます。"
