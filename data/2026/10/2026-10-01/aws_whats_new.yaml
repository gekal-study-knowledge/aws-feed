"entries":
  "812671035a80c4c47732c668494ac3a8":
    "id": "812671035a80c4c47732c668494ac3a8"
    "title": "Aurora PostgreSQL now supports querying of Apache Iceberg and Parquet data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aurora-postgresql-query-apache-iceberg-and-parquet/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 04:46:34"
    "summary": "<p>Starting today, you can directly query operational data together with data stored in data lakes in Apache Iceberg and Parquet formats using your existing PostgreSQL applications and tools, without extract, transform, and load (ETL) pipelines or data duplication.</p>\n<p>Applications increasingly need access to data from data lakes, often stored in Apache Iceberg and Parquet formats, to make more informed decisions and automate business processes. Accessing it has typically required pipelines that copy data from your data lake into Aurora, driving up costs and engineering work as schemas evolve. With this launch, you can create PostgreSQL foreign tables that reference your Iceberg or Parquet data in Amazon S3, Amazon S3 Tables, or AWS Glue Data Catalog. When customers query these foreign tables, Aurora uses DuckDB’s high-performance query engine, embedded in PostgreSQL, to execute the query against the underlying Iceberg and Parquet data. Your existing applications and BI tools continue to use the same PostgreSQL interface.</p>\n<p>You can also query tables from external Iceberg REST Catalog (IRC)-compatible catalogs federated through AWS Glue Data Catalog, without moving or duplicating data. For latency-sensitive workloads, you can materialize Iceberg or Parquet data into native Aurora PostgreSQL tables using standard SQL statements, without an ETL pipeline.</p>\n<p>The capability is generally available on Aurora PostgreSQL starting 17.11, 18.6 and higher in all AWS commercial and GovCloud (US) Regions, at no additional charge. To get started, use the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS console</a> or any PostgreSQL client. To learn more, see the <a href=\"https://aws.amazon.com/blogs/aws/amazon-aurora-postgresql-now-supports-direct-querying-of-apache-iceberg-and-parquet-data-in-your-data-lake\" rel=\"noopener noreferrer\" target=\"_blank\">blog post</a> or&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/query-iceberg-and-parquet-data.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "b98ea81062f180a923754c682e4b11d1":
    "id": "b98ea81062f180a923754c682e4b11d1"
    "title": "Uncover blind spots in AWS data plane operations with CloudTrail Event Coverage"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-cloudtrail-event-coverage/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 04:46:34"
    "summary": "<p>AWS CloudTrail introduces Event Coverage, a new console experience that gives customers visibility into their data plane operations coverage at the account and organization level. You can now see which AWS services and resource types in your environment have data event logging enabled and which do not. This helps you quickly identify gaps in your logging posture without manually scanning accounts in your organization.</p>\n<p>Data events enable you to track data plane operations in AWS services. For example, you can log Amazon S3 object-level operations like GetObject and PutObject to detect unauthorized data access or exfiltration attempts. Without comprehensive data events coverage, these activities can go unnoticed, leaving blind spots in your security monitoring. With Event Coverage, you can view coverage across all supported data event sources in one place and subscribe to data events directly from the dashboard. This makes it easier to close coverage gaps in a few clicks, especially for organizations managing multiple accounts where tracking coverage across services can be time-consuming.</p>\n<p>You can access Event Coverage from the AWS CloudTrail console. This feature is available in all commercial AWS Regions where AWS CloudTrail is supported. To learn more about logging Data Events, visit the <a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-events-with-cloudtrail.html#logging-data-events\">AWS CloudTrail documentation</a>.</p>"
  "fa9298d8b98576f2dcac8abe5a20ea82":
    "id": "fa9298d8b98576f2dcac8abe5a20ea82"
    "title": "AWS CLI now supports bulk skill updates and version checks for the Agent Toolkit for AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-cli-agent-toolkit-update-skill/"
    "published": "2026-10-01 05:16:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Today, AWS expanded the AWS Command Line Interface (CLI) commands for the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/what-is-agent-toolkit.html\" rel=\"noopener noreferrer\" target=\"_blank\">Agent Toolkit for AWS</a> with two new capabilities that make it easier to keep agent skills up to date. Customers can now run aws agent-toolkit check-skill-updates to compare all installed skills against the latest versions available in the registry, and use aws agent-toolkit update-skill --all to update every outdated skill in a single command.</p>\n<p>The Agent Toolkit for AWS consists of the AWS MCP Server (which provides a secure, auditable agent interface to 15,000+ AWS APIs), agent skills (which give agents expert guidance across storage, networking, analytics, and more), and plugins (which bundle the MCP server and curate sets of skills into a single install). Previously, customers needed to check and update each skill individually. With these additions to AWS CLI, developers can quickly identify which skills have newer versions available and bring their entire skill set current without managing updates one at a time. This is especially useful for teams that have installed many skills across serverless, storage, networking, analytics, and other domains, and want to ensure their coding agents always operate with the latest guidance. These new commands are added to the existing set of AWS CLI capabilities for the Agent Toolkit, which already allows customers to install, search, and configure the AWS MCP Server and agent skills across Kiro, Claude Code, Codex, Cursor, and other popular coding agents.&nbsp;</p>\n<p>To get started, see <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/aws-cli.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS CLI</a> in the Agent Toolkit for AWS user guide. Make sure you have AWS CLI version 2.37.0 or later installed. The AWS MCP Server is available in the US East (N. Virginia) and Europe (Frankfurt) Regions.</p>"
  "94615c0a30a0ee885dd44e5d83a2e401":
    "id": "94615c0a30a0ee885dd44e5d83a2e401"
    "title": "Amazon S3 Vectors introduces metadata pre-filtering for up to 5x higher recall on filtered search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/s3-vectors-introduces-metadata-pre-filtering/"
    "published": "2026-10-01 05:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Amazon S3 Vectors now supports pre-filtering, which evaluates metadata filters before running similarity search, returning up to 5x more of the matching vectors when your filter is selective. S3 Vectors also adds a prefix match operator ($startsWith) for filtering on values like paths and URLs. Together, these improvements give your retrieval-augmented generation (RAG), agentic, and semantic-search applications more complete results when you filter, so your applications return more relevant answers.</p>\n<p>S3 Vectors provides native support to store and query vectors in Amazon S3, delivering purpose-built, cost-optimized vector storage and query at billion-vector scale. With this launch, indexes in new vector buckets use metadata pre-filtering by default, with no change to how you write vectors with PutVectors or run filtered queries with QueryVectors. To use pre-filtering on an existing index, update it in place with the UpdateIndexMode API. You can also compare pre-filtering against your current filtering on the same index, using a per-query parameter on QueryVectors, before you update.</p>\n<p>Metadata pre-filtering is available at no additional cost in all commercial AWS Regions where Amazon S3 Vectors is available, and in the AWS China Regions. We are in the process of deploying this change and plan to complete the deployment in the coming days. To get started, use the AWS CLI, AWS SDKs, or the Amazon S3 console. To learn more, visit the Amazon S3 Vectors <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-metadata-filtering.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and the <a href=\"https://aws.amazon.com/blogs/aws/amazon-s3-vectors-now-supports-metadata-pre-filtering-for-higher-recall-on-filtered-searches\" rel=\"noopener noreferrer\" target=\"_blank\">AWS News blog</a>.</p>"
  "b3197772c7d845574b8c3c38b3896966":
    "id": "b3197772c7d845574b8c3c38b3896966"
    "title": "Amazon Managed Grafana now supports creating Grafana 13.2 workspaces"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-managed-grafana-now-supports-creating-grafana-13-2-workspaces"
    "published": "2026-10-01 04:30:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Amazon Managed Grafana now supports creating new workspaces with Grafana version 13.2. This release brings features from open-source Grafana versions 13.0 to 13.2, including Git Sync for dashboards, dynamic dashboards, and PromQL query support in the Amazon CloudWatch data source plugin.</p>\n<p>With Git Sync, you can treat dashboards as code by linking a workspace to a Git repository, enabling version control for tracking, reviewing, and reverting dashboard modifications. Dynamic dashboards provide a more adaptable approach to layout and paneling, constructing responsive views driven by conditions that respond to data and variables. The Amazon CloudWatch data source plugin now supports PromQL queries, allowing you to use Prometheus Query Language to query metrics that CloudWatch ingests via its OpenTelemetry (OTLP) endpoint, complementing the existing Metric Search and Metrics Insights query types.</p>\n<p>Grafana 13.2 is available in all AWS regions where Amazon Managed Grafana is generally available.</p>\n<p>To learn more about creating Amazon Managed Grafana workspaces with version 13.2, visit the <a href=\"https://docs.aws.amazon.com/grafana/latest/userguide/version-differences.html#version-diff-v13\">user documentation</a>. For more information about Amazon Managed Grafana features and pricing, visit the <a href=\"https://aws.amazon.com/grafana/\">product page</a> and <a href=\"https://aws.amazon.com/grafana/pricing/\">pricing page</a>.</p>"
  "1640834e53f28411cde07e80fc6ba76e":
    "id": "1640834e53f28411cde07e80fc6ba76e"
    "title": "OpenAI GPT-6 Astra now supports UltraFast mode on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-astra-ultrafast-on-amazon-bedrock/"
    "published": "2026-10-01 04:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>&nbsp;Today, AWS announces the availability of UltraFast mode for GPT-6 Astra from OpenAI on Amazon Bedrock. Ultrafast is a premium speed tier for GPT-6 Astra built for workloads where speed matters most. According to OpenAI, Ultrafast delivers up to 6x faster inference in the API, with up to 300 tokens per second. The Amazon Bedrock inference engine delivers the performance, security, and reliability required for production workloads.</p>\n<p>Use GPT-6 Astra Ultrafast for latency-sensitive applications such as real-time coding assistants, interactive agents, and customer-facing experiences that require fast, high-quality responses. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.</p>\n<p>You can get started&nbsp;in the<a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html\">Amazon Bedrock documentation. </a>&nbsp;</p>"
  "406cf8409a76013c76b381f7d97bfc85":
    "id": "406cf8409a76013c76b381f7d97bfc85"
    "title": "AWS Parallel Computing Service now supports scaling logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-pcs-scaling-logs/"
    "published": "2026-10-01 04:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>AWS Parallel Computing Service (AWS PCS) now supports scaling logs, which record how AWS PCS scales the compute node groups in your cluster. Each log entry records one state transition for one compute node—for example, an instance launch, a node registration, a scale-down, or a launch failure with its reason. Using scaling logs, you can more easily troubleshoot scaling issues. For example, you can determine why a compute node group did not reach its target size, which launches failed for capacity reasons, and when a specific node started or stopped. Scaling log delivery is opt-in, and you can configure AWS PCS to emit scaling logs to Amazon CloudWatch Logs, Amazon S3, and Amazon Data Firehose.</p>\n<p>AWS PCS is a managed service that simplifies running and scaling HPC workloads on AWS using Slurm. You can build complete, elastic environments that integrate compute, storage, networking, and visualization tools, while the service handles cluster operations with managed updates and built-in observability features.</p>\n<p>This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"><u>AWS Regions where AWS PCS is available</u></a>. To get started, see the <a href=\"https://docs.aws.amazon.com/pcs/latest/userguide/monitoring-overview.html\">AWS PCS User Guide</a>.</p>"
  "03eac8f3825738e50c539b98fbf8457e":
    "id": "03eac8f3825738e50c539b98fbf8457e"
    "title": "Amazon Aurora serverless now scales faster to support agentic AI and other bursty workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aurora-serverless-instant-16-acu-scaling/"
    "published": "2026-10-01 02:50:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a> now scales in even larger steps, adding up to 16 ACUs to its current capacity within a second and continuing to scale up to 256 ACUs as your workload grows. With this launch, your workload will scale faster and reach capacity that it requires. When the workload finishes, Aurora serverless automatically scales down to zero, so you only pay for what you use. This makes it especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable traffic patterns.</p>\n<p>This enhancement is enabled by default on all Aurora serverless clusters running on platform version 3 or 4, with no configuration changes required. Existing clusters on platform versions 1 and 2 can upgrade directly to the latest platform version 4 to benefit from these improvements. You can verify your cluster's platform version in the AWS Management Console under the instance configuration section, or via the RDS API's ServerlessV2PlatformVersion parameter.</p>\n<p>For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more, read the Aurora serverless scaling <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\">documentation</a>, and get started by creating an Aurora serverless database in just a few steps in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
  "714fba9ad21d9f3b985e38d6a6dfa35c":
    "id": "714fba9ad21d9f3b985e38d6a6dfa35c"
    "title": "Amazon Aurora and RDS now support AMD-based R8a instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aurora-rds-amd-r8a/"
    "published": "2026-10-01 02:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Amazon Aurora and Amazon RDS now support R8a database instances powered by 5th generation AMD EPYC processors, expanding the choice available for your database workloads. Each vCPU in R8a database instances corresponds to a physical CPU core, which delivers consistent per-core performance. For workloads with high I/O requirements, R8a instances provide up to 75 Gbps of network bandwidth and 60 Gbps of Amazon EBS bandwidth. All R8a instances are built on the AWS Nitro System using sixth-generation Nitro Cards.</p>\n<p>R8a database instances are supported for Amazon Aurora PostgreSQL-Compatible Edition, Amazon Aurora MySQL-Compatible Edition, RDS for PostgreSQL, MySQL and MariaDB. R8a database instances are available in US East (N. Virginia, Ohio), US West (Oregon), Canada (Central), Asia Pacific (Tokyo, Taipei) and Europe (Ireland, Frankfurt, Spain) regions.&nbsp;</p>\n<p>You can get started with R8a database instances through the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon RDS Management Console</u></a> or by using the&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be#Aurora.CreateInstance.Creating\" rel=\"noopener noreferrer\" target=\"_blank\"><u>AWS Command Line Interface</u></a> (CLI). For the specific engine versions that support these instance classes, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.DBInstanceClass.SupportAurora.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Aurora</u></a>&nbsp;and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\"><u>RDS</u></a> documentation. For pricing, see the <a href=\"https://aws.amazon.com/rds/aurora/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon Aurora pricing page</u></a>&nbsp;&nbsp;and the&nbsp;<a href=\"https://aws.amazon.com/rds/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon RDS pricing page</u></a>.</p>"
  "3b8beedd97546406be25d325b0f101e0":
    "id": "3b8beedd97546406be25d325b0f101e0"
    "title": "Amazon RDS now supports AMD-based M8a instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aurora-rds-amd-m8a/"
    "published": "2026-10-01 02:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Amazon RDS for PostgreSQL, MySQL, and MariaDB now support M8a database instances powered by 5th generation AMD EPYC processors, expanding the choice available for your database workloads. Each vCPU in M8a database instances corresponds to a physical CPU core, which delivers consistent per-core performance. For workloads with high I/O requirements, M8a instances provide up to 75 Gbps of network bandwidth and 60 Gbps of Amazon EBS bandwidth. All instances are built on the AWS Nitro System using sixth-generation Nitro Cards.</p>\n<p>M8a database instances are available in US East (N. Virginia, Ohio), US West (Oregon), Asia Pacific (Mumbai, Tokyo, Hyderabad) and Europe (Ireland, Frankfurt, Spain) regions. You can get started with M8a database instances through the <a href=\"https://console.aws.amazon.com/rds/home?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon RDS Management Console</u></a> or by using the&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_CreateDBInstance.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>AWS Command Line Interface</u></a> (CLI). For the specific engine versions that support these instance classes, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html?refid=35100cff-4aaa-46ac-bc1d-71576bef47be\" rel=\"noopener noreferrer\" target=\"_blank\"><u>RDS</u></a> documentation. For pricing , see the <a href=\"https://aws.amazon.com/rds/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>Amazon RDS pricing page</u></a>.</p>"
  "9b6c9ed7b5d6cf5bb3695fe7239ac95d":
    "id": "9b6c9ed7b5d6cf5bb3695fe7239ac95d"
    "title": "Amazon RDS for MySQL supports MySQL 26.7 in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/rds-mysql-26-7-preview-environment/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/mysql/\" target=\"_blank\">Amazon RDS for MySQL</a> 26.7 is available in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of MySQL 26.7 on Amazon RDS for MySQL.</p>\n<p>MySQL 26.7 is the first Innovation release to adopt the new YY.M (Year.Month) calendar versioning model. It includes bug fixes, security patches, and new features such as Change Stream Applier, a modular replication applier that improves apply throughput and backlog recovery in test workloads. For more details, refer to the <a href=\"https://dev.mysql.com/doc/refman/26.7/en/mysql-nutshell.html\" target=\"_blank\">MySQL 26.7 release notes</a>.</p>\n<p>Amazon RDS Database Preview Environment database instances are retained for a maximum of 60 days and are automatically deleted after the retention period. Database snapshots created in the Preview Environment can only be used within the Preview Environment. Preview Environment database instances are priced according to <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" target=\"_blank\">pricing</a> in the US East (Ohio) Region.</p>\n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" target=\"_blank\">Amazon RDS Database Preview Environment documentation</a>.</p>"
  "277c52dab1ba0a5f176a64f0c96dfc1c":
    "id": "277c52dab1ba0a5f176a64f0c96dfc1c"
    "title": "Amazon WorkSpaces Core Managed Instances adds support for NVIDIA Blackwell GPU"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-workspaces-cmi-g7/"
    "published": "2026-10-01 08:59:00"
    "fetched": "2026-10-01 12:54:13"
    "summary": "<p>Amazon WorkSpaces Core Managed Instances now supports Graphics G7 instances, powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs and Intel Xeon 6 processors. G7 instances deliver up to 2.1X better performance for graphics-intensive workloads compared to previous generation G6 instances.</p>\n<p>With Graphics G7, customers can run demanding professional applications such as CAD/CAM, 3D rendering, scientific visualization, video editing, and AI-assisted design workflows at higher fidelity and frame rates. G7 instances feature 32 GB of GDDR7 GPU memory per GPU and 2.67X faster memory bandwidth, enabling larger, more complex 3D scenes and models. Six instance sizes are available with 1 to 8 GPUs, vCPUs ranging from 8 to 192, and system memory from 32 GB to 768 GB, with support for Linux and Windows, including bring-your-own-license.</p>\n<p>Graphics G7 instances for WorkSpaces Core Managed Instances are available in US East (N. Virginia), US East (Ohio), US West (Oregon), and Europe (Spain). Additional AWS Regions will be added as availability expands.</p>\n<p>To get started, specify an instance type from the G7 family when creating a new WorkSpaces Core Managed Instance, or look for G7 instance types when they become available through your WorkSpaces Core partner solution. For more information, see the following resources:</p>\n<p><a href=\"https://aws.amazon.com/workspaces/vdi-partners/\" target=\"_blank\">Amazon WorkSpaces Core</a></p>\n<p><a href=\"https://docs.aws.amazon.com/workspaces-core/latest/ag/partner-admin-guides.html\" target=\"_blank\">Amazon WorkSpaces Core Managed Instances</a></p>\n<p><a href=\"https://aws.amazon.com/ec2/instance-types/g7/\" target=\"_blank\">EC2 G7 Instance Types</a></p>\n<p><a href=\"https://aws.amazon.com/workspaces/vdi-partners/pricing/\" target=\"_blank\">Amazon WorkSpaces Core Managed Instances Pricing</a></p>"
  "70c0ef8a6bb981c62c5ade15501c886f":
    "id": "70c0ef8a6bb981c62c5ade15501c886f"
    "title": "Amazon Bedrock expands Claude models in-region support in the UK (London)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-region-expansion-lhr/"
    "published": "2026-10-01 02:00:00"
    "fetched": "2026-10-01 19:41:19"
    "summary": "<p>We're excited to announce in-region support for Anthropic's <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html\" target=\"_blank\">Claude Opus 5.5</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\" target=\"_blank\">Claude Sonnet 5</a> on Amazon Bedrock in the UK (London) Region. Customers who need to process data within the United Kingdom, including those in financial services, healthcare, and the public sector, can now use these models at scale while keeping inference in-country.\n <br />\n <br />\n In the UK, Amazon Bedrock supports Claude Opus 5.5 and Claude Sonnet 5 with in-region inference on the bedrock-runtime endpoint in the London (eu-west-2) Region. Amazon Bedrock processes inference requests and data within the Region you call, and the processing never leaves that Region.\n <br />\n <br />\n For the most current information about model availability in each Region, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" target=\"_blank\">Regional availability</a> by models in the Amazon Bedrock User Guide. To get started with Claude models on Amazon Bedrock, visit the Amazon Bedrock console.</p>"
  "981abba4d936e704ad656c67f42d8a8e":
    "id": "981abba4d936e704ad656c67f42d8a8e"
    "title": "Amazon Corretto 8 September 2026 Patch Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-corretto-8-sept-2026-updates/"
    "published": "2026-10-01 23:00:00"
    "fetched": "2026-10-02 02:14:12"
    "summary": "<p>On September 30, 2026, Amazon announced a patch update for the following Amazon Corretto Long-Term Support (LTS) version of OpenJDK: Corretto&nbsp;8u504 is now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK. This patch includes the tzdata 2026d updates.</p>\n<p>Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 27, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-26-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.</p>\n<p>Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "9fde44e701e5cc23f4dcad0a2e4f7ddc":
    "id": "9fde44e701e5cc23f4dcad0a2e4f7ddc"
    "title": "Serverless Storage on Amazon EMR Serverless now supports terabyte-scale shuffle"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/emr-serverless-terabyte-scale-shuffle/"
    "published": "2026-10-01 17:00:00"
    "fetched": "2026-10-02 02:14:12"
    "summary": "<p>Amazon EMR Serverless now offers enhanced serverless storage capabilities with support for up to 1TB shuffle operations, raising the previous 200 GB per-job limit. Amazon EMR Serverless makes it simple for data engineers and data scientists to run open-source big data analytics frameworks without configuring, managing, and scaling clusters or servers. This enhancement enables enterprise customers to run production-scale Apache Spark workloads that require processing large volumes of shuffle data during complex operations such as joins, aggregations, and sorting.</p>\n<p>Enterprise data teams can now confidently migrate production workloads that routinely process terabyte-scale datasets without worrying about storage constraints. This enhancement is particularly valuable for workloads involving large table joins across multi-terabyte datasets, and complex aggregations on high-cardinality data that require extensive data shuffling. The addition of spill support ensures that jobs can seamlessly handle memory-intensive operations by offloading data to disk when necessary, improving job reliability and success rates for demanding analytical workloads.</p>\n<p>This feature is available with Amazon emr-7.14, emr-spark-8.1 and later, in 18 AWS Regions where Amazon EMR Serverless is available. See the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/jobs-serverless-storage.html\">Amazon EMR documentation</a> for the full list of supported Regions and their applicable limits.</p>\n<p>To learn more about Amazon EMR Serverless and get started with terabyte-scale shuffle support, visit the <a href=\"https://aws.amazon.com/emr/serverless/\">Amazon EMR Serverless page</a>.</p>"
  "e547b8512f6e3e22b239902dabc6ae9d":
    "id": "e547b8512f6e3e22b239902dabc6ae9d"
    "title": "Amazon S3 Tables now support up to 100 table buckets per AWS Region in an AWS account"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-s3-tables-table-bucket-increase"
    "published": "2026-10-01 13:00:00"
    "fetched": "2026-10-02 02:14:12"
    "summary": "<p>Amazon S3 Tables now support up to 100 table buckets per AWS Region in an AWS account, increased from 10. This allows you to create up to 1 million tables per AWS Region in an AWS account. With a higher table bucket allowance, you can create a separate table bucket for each dataset, workload, or team, and apply table bucket-level settings such as encryption, access policies, and replication to each. The higher quota applies by default to all accounts at no additional cost.</p>\n<p>S3 Tables deliver the first cloud object store with built-in Apache Iceberg support, and the easiest way to store tabular data at scale. S3 Tables perform continual table maintenance to automatically optimize query efficiency and storage cost over time, even as your data lake scales and evolves.</p>\n<p>The higher default quota is available in all AWS Regions&nbsp;where S3 Tables are available. If you need a quota beyond the default, you can request an increase through AWS Support. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/tables/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Tables overview page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html\" rel=\"noopener noreferrer\" target=\"_blank\">user guide</a>, and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-regions-quotas.html\" rel=\"noopener noreferrer\" target=\"_blank\">quotas documentation</a>.</p>"
  "96bd8680e958e7f708bf278f6c8f3770":
    "id": "96bd8680e958e7f708bf278f6c8f3770"
    "title": "Amazon Quick adds Hierarchy Filter for guided dashboard drill-down"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/quick-hierarchy-filter"
    "published": "2026-10-01 00:00:00"
    "fetched": "2026-10-02 02:14:12"
    "summary": "<p>Amazon Quick now supports the hierarchy filter, a single control that lets readers drill through related dimensions such as Region, Country, and City. It replaces several stacked filter controls with one, cutting clutter and guiding readers to their data in fewer clicks.</p>\n<p>The filter holds up to five dimension levels, arranged broadest to most detailed. Readers open one dropdown and expand each level in turn, with every selection narrowing the next and auto-selecting its parent chain. Authors create it by adding a filter, setting its type to Hierarchy filter, and arranging the fields parent to child.</p>\n<p>For a retail sales dashboard, instead of stacking Region, Country, and City controls side by side, an author adds one hierarchy filter. A reader expands a region to see its countries, then a country to see its cities, selecting any mix along the way. The relationships are visible in the control, so readers do not need to know which country belongs to which region.</p>\n<p>The hierarchy filter is available today in all <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where Amazon Quick is supported</a>. To see how it works, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/simplify-dashboard-drill-down-with-the-amazon-quick-sight-hierarchy-filter/\" target=\"_blank\">blog post</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/hierarchy-filter.html\" rel=\"noopener noreferrer\" target=\"_blank\">Hierarchy filters</a> in the Amazon Quick User Guide.</p>"
  "cfddcc78440775998b062a59167d3a2a":
    "id": "cfddcc78440775998b062a59167d3a2a"
    "title": "Amazon S3 Object Lock variable retention with event holds is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/s3-object-lock-variable-retention-event-holds-aws-govcloud/"
    "published": "2026-10-01 22:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Amazon S3 Object Lock support for variable retention with event holds is now available in AWS GovCloud (US-East) and AWS GovCloud (US-West).</p>\n<p>Amazon S3 Object Lock variable retention allows you to apply write-once-read-many (WORM) protection to objects whose required retention period starts with a future event, such as a contract closing or an audit completing. You place an event hold with a retention duration on an object and S3 protects the object while the hold is in place. When you release the hold, S3 retains the object for the duration you specified. Unlike legal holds, which end protection immediately upon removal, event holds provide WORM compliance for the required retention period after the triggering event, so you can meet event-based retention requirements without retaining data longer than your policy requires.\n <br />\n <br />\n To learn more, read the <a href=\"https://aws.amazon.com/blogs/storage/flexibly-control-amazon-s3-object-lock-retention-based-on-real-business-events\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Storage Blog post</a>, the <a href=\"https://aws.amazon.com/s3/features/object-lock/\" rel=\"noopener noreferrer\" target=\"_blank\">S3 Object Lock overview page</a>, and the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 documentation</a>. This capability has been <a href=\"https://d1.awsstatic.com/onedam/marketing-channels/website/aws/en_US/whitepapers/compliance/Amazon-S3-Compliance-Assessment-2026.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">assessed by Cohasset Associates</a> for use in environments subject to SEC Rule 17a-4(f), FINRA Rule 4511, and CFTC Regulation 1.31.</p>"
  "409dbea32d3fd4bcb2175658f9db90bb":
    "id": "409dbea32d3fd4bcb2175658f9db90bb"
    "title": "AWS Security Hub introduces remediation plans to prioritize and fix security exposures"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-security-hub-remediation-plans/"
    "published": "2026-10-01 19:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>AWS Security Hub now offers remediation plans that group related exposure findings sharing a root cause. Instead of addressing each exposure individually, you can now fix a single underlying resource, such as a misconfigured setting or overly permissive policy, and resolve or reduce the severity of multiple exposures at once.</p>\n<p>Each remediation plan includes prioritization guidance (Critical, High, Medium, or Low), impact assessment, and detailed step-by-step instructions with examples in multiple formats including AWS CLI, Terraform, CloudFormation, Python, and CDK. Security Hub automatically prioritizes plans so those reducing the most risk appear first, helping you focus remediation efforts where they matter most. AI agents can also programmatically consume remediation plans through the API to automate security fixes across your environment.</p>\n<p>Remediation plans are available in every AWS Region where AWS Security Hub is available and at no additional cost under AWS Security Hub Essentials plan. To learn more, visit the <a href=\"https://docs.aws.amazon.com/securityhub/\">AWS Security Hub documentation</a>.</p>"
  "43aec1b88582fc5e463a4d5f0d68fa8a":
    "id": "43aec1b88582fc5e463a4d5f0d68fa8a"
    "title": "AWS Transfer Family now supports custom CloudWatch log groups for managed workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/transfer-family-custom-cloudwatch-log-groups/"
    "published": "2026-10-01 19:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>AWS Transfer Family now lets you choose a custom log group in Amazon CloudWatch Logs for managed workflow execution logs. You can organize workflow logs to monitor individual workflows separately or bring logs from related workflows together.</p>\n<p>Previously, every workflow attached to a Transfer Family server sent its execution logs to that server’s CloudWatch log group, so you could not set a separate log destination for each workflow. When creating a workflow through the AWS Transfer Family console or API, you can now select a workflow-level log group that is separate from the server’s log group. Transfer Family delivers workflow logs only to the selected group, so no server logging role is required. Workflow logs retain their existing structured JSON format and remain queryable using Amazon CloudWatch Logs Insights. You can also send logs from multiple workflows to a shared log group to create consolidated metrics and dashboards for tracking workflow execution. If you do not select a structured log destination, workflow logs continue using the server’s role-based logging configuration when configured. Existing workflows continue using their current logging configuration.</p>\n<p>This feature is available in all AWS Regions where Transfer Family managed workflows are offered. To learn more, visit the <a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/transfer-workflows.html\">Transfer Family managed workflows User Guide</a>.</p>"
  "15f8367dad9b444be59d47efc82ca589":
    "id": "15f8367dad9b444be59d47efc82ca589"
    "title": "AWS Glue Data Catalog now supports table optimization, statistics, and crawlers for Apache Iceberg V3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-glue-iceberg-v3-optimization/"
    "published": "2026-10-01 17:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>AWS Glue Data Catalog now supports table optimization, statistics, and crawlers for Apache Iceberg Version 3 (V3) tables. With these new capabilities, you can automatically maintain V3 tables, optimize them for query performance, and discover them in Amazon S3.</p>\n<p>With table optimization, you can compact V3 tables using binpack, sort, or z-order strategies to improve query performance, and remove expired snapshots and orphan files to reduce storage costs. These optimizations support V3 data types, including variant, geospatial, and nanosecond-precision timestamps. You can also generate number of distinct values (NDV) statistics for V3 tables, which analytics engines use to plan queries efficiently. In addition, you can use Glue crawlers to discover V3 tables stored in Amazon S3 and register them in Glue Data Catalog, making them available to query with any V3-compatible engines.</p>\n<p>These capabilities are available for Iceberg V3 tables in all AWS Regions where Glue Data Catalog table optimization, statistics, and crawlers are available. To learn more, see <a href=\"https://docs.aws.amazon.com/glue/latest/dg/table-optimizers.html\">Glue Optimization</a>, <a href=\"https://docs.aws.amazon.com/glue/latest/dg/iceberg-column-statistics.html\">Glue Statistics</a>, and <a href=\"https://docs.aws.amazon.com/glue/latest/dg/crawler-data-stores.html\">Glue crawlers</a> in the Glue Developer Guide.</p>"
  "914271cb19a64cd245d12e73d45bac57":
    "id": "914271cb19a64cd245d12e73d45bac57"
    "title": "Announcing DNS analytics and insights for Route 53 Global Resolver and DNS Firewall"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/route-53-dns-analytics-insights/"
    "published": "2026-10-01 17:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Route 53 Global Resolver and DNS Firewall now provide DNS analytics and insights through native Amazon CloudWatch integration. These new capabilities enable network administrators and security teams to gain full observability into DNS query patterns, monitor DNS Firewall rule effectiveness, detect anomalous activity, and optimize DNS infrastructure performance. DNS analytics and insights is available in all AWS Regions where Amazon CloudWatch, Route 53 Global Resolver, and DNS Firewall are available.</p>\n<p>With CloudWatch Metrics and Contributor Insights, customers can search and analyze DNS query logs, create metric filters for specific patterns such as blocked queries and DNS response codes, and set automated alarms. A new Analytics tab in both the Global Resolver and DNS Firewall consoles provides streamlined access to all analytics in one place.</p>\n<p>For example, customers can create a metric filter for blocked DNS queries by VPC and set an alarm to trigger when more than 10 queries are blocked within an hour, enabling rapid response to potential security threats.</p>\n<p>Standard <a href=\"https://aws.amazon.com/cloudwatch/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch pricing</a> applies to the metrics that customers opt in to. To learn more, visit the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html\" target=\"_blank\">Route 53 documentation</a>.</p>"
  "12dca50e425ff8d231ffc428e3b3d771":
    "id": "12dca50e425ff8d231ffc428e3b3d771"
    "title": "AWS IAM Identity Center extends multi-Region support to more AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-iam-identity-center-extends-multi-region-support-to-more-aws-regions"
    "published": "2026-10-01 16:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>IAM Identity Center helps you connect your workforce identities to AWS once and streamline access management to AWS accounts and applications. You can now replicate IAM Identity Center to opt-in AWS Regions, and between Regions within the AWS GovCloud (US) and AWS China Regions. Previously, multi-Region support was available in the enabled-by-default commercial AWS Regions. This helps you improve the resilience of user access to AWS accounts and deploy AWS applications in the AWS Regions that best align with your business needs.</p>\n<p>When you enable multi-Region support, IAM Identity Center automatically replicates your identities, entitlements, and other information from the primary Region to additional Regions. If IAM Identity Center is affected by a disruption in the primary Region, users continue to have access to their AWS accounts using already provisioned entitlements in the additional Regions. AWS application administrators can use the standard application deployment workflow to deploy their application in an additional Region while you continue to administer IAM Identity Center in the primary Region.</p>\n<p>Multi-Region support is available for organization instances that use an external identity provider or the IAM Identity Center directory as the identity source, and requires a multi-Region customer managed KMS key (CMK). When you create a new instance, you can enable multi-Region support with a single click, which also creates the CMK. For existing instances, create a multi-Region CMK in AWS KMS, then configure it in IAM Identity Center. Standard&nbsp;<a href=\"https://aws.amazon.com/kms/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS KMS charges apply</a> for storing and using CMKs. IAM Identity Center is provided at no additional cost.\n <br />\n <br />\n For the full list of AWS Regions where multi-Region support is available, see <a href=\"https://builder.aws.com/build/capabilities/explore?tab=service-feature&amp;f=eJxtks1OwzAQhF8F7bk-kFKQKnFF4sCFHusIWck2jTCx5Z8CqvLuGKeOHTu3nW_Wu_LYV9DIsTHYvmPXi0HDHo4UrCbItCH3FDZRVUF9Y-p5NXnsRLSw5nwzmUzHBFUFNQhlzsuGiFa6tgFlOyZZLeRybEQrXdsSPZRoV6LHEj15hFY3pMUsw05cVkiSZcNIg4NRjEeQ2GgzOwFVAD6t6KdJzXJuXg5P3jGoKZqeZ4u_fnKAJUhXazbfvIYNSCUkKvP70nOD6uOEzFiF7utdKUgKewpC-XPGiWPtiu6_cO6nd28HXlvfJDx79vXF12-Wm55MP_ruYKV0oVAY6xHGP20D8yw\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Capabilities by Region</a>.&nbsp;To learn more about multi-Region support, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using IAM Identity Center across multiple AWS Regions</a>. To find out which AWS applications support deployment in additional Regions, visit <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/awsapps-that-work-with-identity-center.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS applications that you can use with IAM Identity Center</a>.</p>"
  "2c3422baac827fb90c120ca66d983077":
    "id": "2c3422baac827fb90c120ca66d983077"
    "title": "Improve your secrets security posture with actionable recommendations in the AWS Secrets Manager console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-secrets-manager-security-posture-recommendations"
    "published": "2026-10-01 16:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>​​​AWS Secrets Manager now integrates with the <a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/recommended-actions.html\">AWS Recommended Actions framework</a> to surface contextual, actionable suggestions for your secrets directly in the Secrets Manager console. ​​</p>\n<p>​​With this launch, you can view tailored recommendations alongside your secrets to improve your security posture and follow best practices without leaving the console. For example, you can identify secrets that need rotation configured, use a customer managed key instead of default service-provided key for encryption, and act on secrets configuration improvements, all from a single view.​</p>\n<p>​​This feature is available in all AWS Commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> where AWS Secrets Manager is offered, at no additional cost. To get started, visit the <a href=\"https://console.aws.amazon.com/secretsmanager/\">AWS Secrets Manager console</a>.​</p>"
  "db3b746e83d7fd9a5bde3751a3b20107":
    "id": "db3b746e83d7fd9a5bde3751a3b20107"
    "title": "Apache Iceberg materialized views now support system-managed write protection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/system-managed-iceberg-materialized-views"
    "published": "2026-10-01 06:19:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Today, AWS announces system-managed materialized views for Apache Iceberg. Materialized views let you precompute an expensive query once and reuse the result across engines. Because this result is an open Iceberg table in your data lake, anyone with write access can change it, either through the catalog or by writing to the files in Amazon S3. System-managed materialized views close this gap by only allowing AWS Glue to write the materialized view's data and definition, so the result stays exactly as computed regardless of who has write access to the table or the underlying S3 files<b><i>.</i></b></p>\n<p>To get started, write the SQL that defines the materialized view and, optionally, a refresh schedule. AWS Glue then computes the results, stores them as a standard Apache Iceberg table in your Amazon S3 Tables bucket, and keeps them current on your schedule. Because the result is an ordinary Iceberg table in the AWS Glue Data Catalog, any Iceberg-compatible engine can read it directly, while the service guarantees no other writer can alter it. You get a governed, always-consistent dataset that you can confidently share. You can still refresh, reschedule, or drop the view whenever you need to.</p>\n<p>System-managed Apache Iceberg materialized views are available in all regions where Apache Iceberg materialized views are supported. To learn more, see <a href=\"https://docs.aws.amazon.com/glue/latest/dg/materialized-views.html#materialized-views-system-managed\" title=\"System-managed MVs user guide\">System-managed materialized views</a>&nbsp;in the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html\">AWS Glue Developer Guide</a>.</p>"
  "da412915ddc5a45ca698dd1218667b10":
    "id": "da412915ddc5a45ca698dd1218667b10"
    "title": "AWS Budgets now supports email verification for notification subscribers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-budgets/"
    "published": "2026-10-01 17:00:00"
    "fetched": "2026-10-02 10:56:57"
    "summary": "<p><a href=\"https://aws.amazon.com/aws-cost-management/aws-budgets/\">AWS Budgets</a> lets you set custom cost and usage thresholds and alerts you by email when your spending crosses the threshold. AWS Budgets now verifies new email subscribers before sending them budget alerts. When you add an email address to a budget notification, AWS Budgets sends a verification email to that address, and the address begins receiving notifications once the recipient confirms it.</p>\n<p>Verification applies to email addresses added from 9/30/26 onward. Addresses already subscribed on existing budgets are unaffected and need no action. For a new address, the recipient confirms it by following the link in the verification email, which opens the AWS Management Console. The AWS Budgets console shows the verification status of every subscriber, with a resend option for addresses still pending confirmation. AWS Budgets delivers these notifications through AWS User Notifications, and recipients can opt out at any time.</p>\n<p>AWS Budgets email verification is available in all AWS Regions, except the AWS GovCloud (US) Regions and the China Regions.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-email-recipients.html\">Adding email recipients to a budget notification</a> in the AWS Billing and Cost Management User Guide.</p>"
  "8e2bcc0bbe4cf666a4715ba1e06559d5":
    "id": "8e2bcc0bbe4cf666a4715ba1e06559d5"
    "title": "AWS Continuum for Penetration Testing now available in 6 additional Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-continuum-penetration/"
    "published": "2026-10-01 01:13:00"
    "fetched": "2026-10-02 10:56:57"
    "summary": "<p>AWS Continuum for Penetration Testing now available in 6 additional Regions\n <br />\n AWS Continuum for Penetration Testing (AWS Security Agent) is a managed security service that enables AWS customers to conduct&nbsp; penetration testing against their web applications and APIs. Previously limited in geographic reach, the service now addresses the growing need for localized security testing by expanding into six additional AWS Regions: Asia Pacific (Seoul), Canada (Montreal), Europe (London), US East (Columbus), Europe (Paris), and Europe (Stockholm). This expansion helps organizations operating across these geographies meet data residency requirements while maintaining robust security testing programs.\n <br />\n <br />\n With this regional expansion, customers can now run penetration testing workloads closer to their production environments. Security and compliance teams can leverage AWS Continuum for Penetration Testing for critical use cases including vulnerability assessments, compliance validation against frameworks such as PCI DSS and ISO 27001, and continuous security posture evaluations.\n <br />\n <br />\n This expansion is now generally available in Asia Pacific (Seoul), Canada (Montreal), Europe (London), US East (Ohio), Europe (Paris), and Europe (Stockholm), with existing supported Regions remaining fully operational. To learn more about AWS Continuum for Penetration Testing and how to get started in these newly supported Regions, visit https://aws.amazon.com/continuum/.</p>"
  "7291adcb00e332d410f44d52133e3aa7":
    "id": "7291adcb00e332d410f44d52133e3aa7"
    "title": "Amazon Quick now supports live data from your datasets in apps"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/live-data-in-apps"
    "published": "2026-10-01 00:00:00"
    "fetched": "2026-10-02 17:00:48"
    "summary": "<p>Today, Amazon Quick adds support for building applications that use live data directly from your Quick datasets, so the KPIs, charts, tables, and insights in your application always reflect the latest data. These applications go beyond viewing data. They facilitate intelligent, data-driven business operations workflows where each person can act on what they see, from handling requests and approvals to triggering the next step. Each application user sees data under their own Amazon Quick permissions, so the row-level and column-level security you already set up is applied.</p>\n<p>To build one, give the app builder chat agent the name of the dataset you want to use and describe in plain language what you want to build. This lets you enrich an application, such as a team portal that handles requests and approvals and now also shows current pipeline numbers, where each application user sees only the data their permissions allow.</p>\n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/apps-limitations.html#apps-regional-availability\">all supported regions of apps in Amazon Quick</a>. To see how it works, read the&nbsp;<a href=\"https://aws.amazon.com/blogs/machine-learning/serve-live-governed-data-in-ai-built-apps-with-amazon-quick/\" target=\"_blank\">blog post</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/connecting-datasets-apps.html\" rel=\"noopener noreferrer\" target=\"_blank\">Connecting to datasets</a>&nbsp;in the Amazon Quick User Guide.<i></i></p>\n<h2>&nbsp;</h2>"
  "1c5f4f617679478d17811d6c92a911e9":
    "id": "1c5f4f617679478d17811d6c92a911e9"
    "title": "Amazon EKS Auto Mode now supports advanced compute configuration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/eks-auto-mode-advanced-compute-config/"
    "published": "2026-10-01 17:00:00"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>Amazon Elastic Kubernetes Service (EKS) Auto Mode now lets you tune kubelet settings, Linux kernel sysctls, and hugepages directly in the NodeClass Kubernetes resource. You can now run workloads that require specific node tuning on EKS Auto Mode, which automates node provisioning, scaling, patching, and upgrades for you.</p>\n<p>With the new advancedCompute field in NodeClass, you can configure user namespaces for rootless container builds in CI/CD pipelines, tune eviction thresholds and container log rotation to protect nodes from disk and memory pressure, raise network and ARP cache limits for large clusters, and pre-allocate 2Mi or 1Gi hugepages for HPC, database, and latency-sensitive workloads. You apply these settings declaratively using the Kubernetes API. EKS Auto Mode validates them, applies them at node boot, and preserves them through scaling and upgrade events, so your workloads get the tuning they need while EKS Auto Mode continues to manage the underlying infrastructure, with no EC2 launch templates, custom AMIs, or privileged DaemonSets to maintain.</p>\n<p>Amazon EKS Auto Mode advanced compute configuration is available in all AWS Regions where EKS Auto Mode is available.</p>\n<p>To get started, see the <a href=\"https://aws.amazon.com/eks/auto-mode/\">Amazon EKS Auto Mode</a> product page, and see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/create-node-class.html#kubelet-config\">Create a Node Class for Amazon EKS</a> in the Amazon EKS documentation.</p>"
