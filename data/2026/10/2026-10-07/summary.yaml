"overview": |
  この日は 18 件で、セキュリティ速報と、Lambda の起動高速化、そしてエージェントの実装記事が中心でした。セキュリティ速報では、bedrock-agentcore-starter-toolkit に 2 件の脆弱性が公表されました (Bulletin ID 2026-127-AWS、重要度は Important、公開日は 2026 年 10 月 6 日)。このパッケージは Amazon Bedrock Agents をローカルの開発環境へインポートするコマンドラインインターフェイスを提供する、AWS がメンテナンスする OSS の Python パッケージで、GitHub と PyPI で配布されています。CVE-2026-105812 は、細工されたエージェントをインポートしてその後に実行またはデプロイすると任意のコードが実行されうるコードインジェクションの問題です。CVE-2026-106032 は、エージェントのインポート中に意図しないネットワークリクエストやローカルファイルへのアクセスを引き起こしうる、外部参照の扱いの問題です。影響を受けるのは 0.1.4 以上 0.3.13 以下のバージョンです。コンピュートでは、AWS Lambda SnapStart がコンテナイメージの関数に対応し、起動時間を数秒から最短でサブ秒まで短縮できるようになりました。仕組み、既存または新規の関数での有効化の方法、レイテンシーに敏感なワークロードでのベストプラクティスが解説されています。あわせて AWS Batch が Amazon CloudWatch へジョブのメトリクスを発行するようになりました。バッチワークロードにネイティブなオブザーバビリティをもたらすもので、ジョブのライフサイクル全体でメトリクスが出るため、ジョブキューの健全性、失敗率、ジョブの所要時間が見えます。状態遷移と所要時間のメトリクスが JobQueueName ディメンション付きで AWS/Batch 名前空間に自動で発行され、submitted・running・succeeded・failed といった状態に入ったジョブの数や、投入から runnable までの時間や総実行時間といった状態間の経過時間を追えます。AWS Batch コンソール、Amazon CloudWatch コンソール、AWS CLI と SDK から確認でき、AWS Batch が使える全リージョンで発行されます。機械学習では SageMaker HyperPod の記事が 2 本で、1 本はクラスターのガバナンスを保ったまま Amazon SageMaker Unified Studio から HyperPod を運用する方法として、インフラの境界の設計、アクセスの統制、共有キャパシティの割り当て、そして組織・プロジェクト・クラスター・ワークロードという制御レイヤーをまたいだ一貫した運用をプラットフォームチーム向けに解説しています。もう 1 本は、データサイエンティストと ML エンジニアが HyperPod の EKS クラスター上の Amazon SageMaker Spaces を SageMaker Studio から直接作成・設定・開始・停止・オープンできるようになったという案内で、コマンドラインツールを使わずに数クリックで JupyterLab と Code Editor の環境を立ち上げられます。エージェントの実装では、Amazon Bedrock AgentCore とリアルタイム音声の Amazon Nova Sonic、ポリシー回答のための Amazon Bedrock Knowledge Bases を使って、航空会社のアプリに音声の旅行コンシェルジュを追加する記事が公開されました。利用者は音声で座席を変更し、遅延を確認し、ポリシーについて質問でき、エージェントは MCP のツール経由でバックエンドに到達し、書き込みを伴う変更のたびに確認を取ります。もう 1 本は、会話をまたいで利用者を忘れてしまう既存の AI アシスタントに対し、Amazon Bedrock AgentCore ランタイム上の OpenClaw でコンテキストを蓄積する個人アシスタントの作り方で、AgentCore memory が使い捨ての会話をメタデータフィルタで取り出せる永続的で構造化された知識に変えます。ガバナンスでは、責任ある AI のガバナンスに関する国際標準に沿うための AWS の取り組みとして、AI システムの影響評価とは何か、それが全社的なリスク管理をどう改善するか、ISO/IEC 42005:2025 が評価の実施と文書化のベストプラクティスをどう体系化しているかが解説されました。セキュリティブログは 2 本で、1 本は AWS Lake Formation と Trusted Identity Propagation によるアイデンティティ認識型のデータエージェントです。レイクハウスのデータに自然言語で問い合わせられるデータエージェントを作るとき、すでに作り込んだガバナンスポリシーをアプリケーションのコードで作り直すことなくエージェントに尊重させる、という課題を扱っています。もう 1 本は AWS のマネージドサービスで SPIRE のセキュリティとレジリエンシーを高める記事で、API キーや共有シークレット、静的なサービスアカウントの認証情報といった従来の手法はクラウドワークロードの規模や短命さに向いておらず、長期の静的な認証情報から短命な暗号的ワークロード ID へ移る必要があるという問題意識が示されています。ニュースブログでは、2026 年 6 月 23 日から 26 日に Prime 会員限定で開催された Amazon Prime Day 2026 を AWS がどう支えたかという恒例の記事が公開され、35 を超えるカテゴリーにまたがる数百万件のディールを支えたサービスと記録的な数値が紹介されました。日本のブログでは、株式会社アテナが Claude Code on Amazon Bedrock で非エンジニア向けの生成 AI を全社展開した事例が、同社と AWS ジャパンの共同執筆で公開されました。モデルでは、Claude Haiku 5.5 が AWS で提供開始となり、AWS GovCloud (US) でも利用できるようになりました。Claude 5.5 ファミリーで最も高速で効率のよいモデルで、サブエージェントや、大量でコストに敏感な処理のために作られています。Anthropic によると、ほとんどのタスクで Claude Haiku 4.5 より約 75% 安く済みます。これまでの Haiku で最も高性能で、コーディング、ツールの利用、コンピュータ操作、エージェントのいずれでも Haiku 4.5 から大きく進歩しており、effort controls を備えた最初の Haiku であるため、タスクごとにコストと知能のバランスを調整できます。音声エージェントやライブサポート、アプリ内アシスタントのようにリアルタイム性が求められる用途や、分類・要約・文書からの項目抽出のような大量処理に向いています。また Claude Opus 5.5 のような高性能なモデルが作業を計画し、明確に定義されたコーディングやツール利用、ブラウザ操作を Haiku に渡すことで、多数のエージェントを並列に動かすことが現実的になります。利用経路は Amazon Bedrock と Claude Platform on AWS の 2 つで、Bedrock ならリージョン内のデータ所在地を保ったまま、Guardrails や Knowledge Bases といった AWS マネージドの機能と一体で使えます。日本のブログでは 4 本が公開されました。Amazon Bedrock Guardrails の自動推論チェックに、失敗したテストの診断と形式論理の修正案の作成を自動化するポリシーの自動改善が紹介されました。ルールの問題に対応する Iterative Refinement と、変換のあいまいさに対応する Ambiguous Variable Refinement の使い分け、AWS SDK for Python (Boto3) による非同期の開始・ポーリング・取得のワークフロー、お客様が承認するまで変更が反映されないレビューゲート、Fidelity Report による検証が解説されています。Autodesk の事例では、Amazon OpenSearch Service 上の単一インデックスの Elasticsearch 7.1.1 ドメインを、Migration Assistant for Amazon OpenSearch Service と、各クエリを該当データを持つシャードへ振り分けるルーティング層を使って、4 つのマルチインデックスの OpenSearch Service ドメインへ再設計し、23 億のドキュメントを移行した方法が紹介されました。運用では、AWS Systems Manager (SSM) ドキュメントの共有が従来はアカウント ID を個別に指定する方式で、組織の変更のたびにリストを手作業で更新する必要があったことに対し、AWS Resource Access Manager (AWS RAM) を使えば組織全体または OU 単位で共有でき、アカウントの参加・離脱に合わせて共有の状態が自動で同期されることが解説されました。Active Directory ドメイン参加ランブックを例に、コンソール・AWS CLI・CloudFormation での共有手順とメンバーアカウントからの実行手順が示されています。このほか、AWS Security Agent を紹介するセキュリティ対策セミナーの開催報告と資料が公開されました。
