  "1d9a82a7a7f3c5ddf4fba4fa6eefd5df":
    "id": "1d9a82a7a7f3c5ddf4fba4fa6eefd5df"
    "title": "AWS Batch now publishes job metrics to Amazon CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-batch-job-cloudwatch-metrics/"
    "published": "2026-10-07 02:30:00"
    "fetched": "2026-10-07 07:14:57"
    "summary": "<p>AWS Batch now publishes job metrics to Amazon CloudWatch, providing native observability for batch workloads. AWS Batch emits metrics throughout the job lifecycle, giving you visibility into job queue health, failure rates, and job durations.</p>\n<p>AWS Batch automatically publishes job state transition and duration metrics to the AWS/Batch namespace in Amazon CloudWatch, with JobQueueName dimension. State transition metrics track how many jobs entered a given state, such as submitted, running, succeeded, or failed. Duration metrics track how long jobs spent between states, such as time from submission to runnable or total execution time. You can view these metrics in the AWS Batch console, the Amazon CloudWatch console, or through the AWS CLI and AWS SDKs.</p>\n<p>AWS Batch CloudWatch metrics are now published in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see CloudWatch Metrics page in the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/using_cloudwatch_metrics.html\">AWS Batch User Guide</a>.</p>"
  "e13e3e057f66f72c1dc7d4d93fe629b1":
    "id": "e13e3e057f66f72c1dc7d4d93fe629b1"
    "title": "Claude Haiku 5.5 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/claude-haiku-5-5-aws/"
    "published": "2026-10-07 23:00:00"
    "fetched": "2026-10-08 07:36:42"
    "summary": "<p>AWS now offers Claude Haiku 5.5, the fastest and most efficient model in the Claude 5.5 family, built for subagents and high-volume, cost-sensitive work. According to Anthropic, it costs around 75% less than Claude Haiku 4.5 for most tasks.</p>\n<p>Claude Haiku 5.5 is Anthropic's most capable Haiku yet, a significant step up from Haiku 4.5 across coding, tool use, computer use, and agents. It's also the first Haiku with effort controls, so teams can tune cost against intelligence for each task. Haiku 5.5 fits work where speed and cost matter most: real-time experiences like voice agents, live support, and in-app assistants, and high-volume tasks like classification, summarization, and pulling key fields from documents. It's also a fast, cost-efficient subagent. A more capable model like Claude Opus 5.5 can plan the work and hand off well-defined coding, tool use, and browser automation tasks to Haiku, making it practical to run many agents in parallel.</p>\n<p>Customers have two ways to access Claude Haiku 5.5: Amazon Bedrock and Claude Platform on AWS.</p>\n<p>Amazon Bedrock gives you Haiku's capabilities while keeping your data within AWS infrastructure with regional data residency and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html\" target=\"_blank\">documentation</a> and regional <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" target=\"_blank\">availability</a>.</p>\n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/welcome.html\" target=\"_blank\">Claude Platform on AWS</a> documentation.</p>"
