    "title": "Autodesk が Migration Assistant とインテリジェントルーティングで 23 億ドキュメントを Amazon OpenSearch Service に移行した方法"
    "link": "https://aws.amazon.com/jp/blogs/news/how-autodesk-migrated-2-3-billion-documents-to-amazon-opensearch-service-using-migration-assistant-and-intelligent-routing/"
    "published": "2026-10-07 13:51:28"
    "fetched": "2026-10-07 18:43:11"
    "summary": "本記事では、Autodesk が Amazon OpenSearch Service 上の単一インデックスの Elasticsearch 7.1.1 ドメインを、Migration Assistant for Amazon OpenSearch Service と、各クエリを該当データを持つシャードへ振り分けるルーティング層を使って、4 つのマルチインデックス OpenSearch Service ドメインへ再設計した方法を紹介します。"
  "c1039b2039199766a8c443803660c500":
    "id": "c1039b2039199766a8c443803660c500"
    "title": "Amazon Bedrock の自動推論ポリシーの自動改善"
    "link": "https://aws.amazon.com/jp/blogs/news/automated-reasoning-policy-refinement-in-amazon-bedrock/"
    "published": "2026-10-07 12:17:02"
    "fetched": "2026-10-07 18:43:11"
    "summary": "Amazon Bedrock Guardrails の自動推論チェック (Automated Reasoning checks) で、失敗したテストの診断と形式論理の修正案の作成を自動化するポリシーの自動改善を紹介します。ルールの問題に対応する Iterative Refinement と、変換のあいまいさに対応する Ambiguous Variable Refinement の使い分け、AWS SDK for Python (Boto3) による非同期の開始・ポーリング・取得ワークフロー、お客様が承認するまで変更が反映されないレビューゲート、Fidelity Report (忠実度レポート) による検証、コンソールでのウォークスルーを解説します。"
  "7dd2f3642c0a3c14d6b891331dcb34bd":
    "id": "7dd2f3642c0a3c14d6b891331dcb34bd"
    "title": "AWS RAM を使った AWS Organization 全体への Systems Manager ドキュメント共有"
    "link": "https://aws.amazon.com/jp/blogs/news/share-systems-manager-documents-across-your-aws-organization-with-aws-ram/"
    "published": "2026-10-07 11:16:46"
    "fetched": "2026-10-07 18:43:11"
    "summary": "AWS Systems Manager (SSM) ドキュメントの共有は、これまでアカウント ID を個別に指定する方式で、組織の変更のたびにリストを手作業で更新する必要がありました。AWS Resource Access Manager (AWS RAM) を使うと、SSM ドキュメントを組織全体または OU 単位で共有でき、アカウントの参加・離脱に合わせて共有の状態が自動で同期されます。本稿では、共有の仕組みを説明し、Active Directory ドメイン参加ランブックを例に、コンソール・AWS CLI・CloudFormation で共有してメンバーアカウントから実行する手順を紹介します。"
"last_updated": "2026-10-07 18:43:11 JST"
