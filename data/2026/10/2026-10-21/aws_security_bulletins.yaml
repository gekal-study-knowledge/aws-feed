    "title": "CVE-2026-112380 - Missing authorization in the WhatsApp channel in Kiro Crew"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-140-aws/"
    "published": "2026-10-21 05:19:42"
    "fetched": "2026-10-21 07:02:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-140-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/20/2026 13:00 PM PDT</p>\n<p><b>Description:</b></p>\n<p>Kiro Crew is an open-source personal AI agent that can be reached from a web dashboard, a CLI, or messaging channels such as WhatsApp, and that runs tools on the operator's machine.</p>\n<p>We identified CVE-2026-112380, an authorization issue in the WhatsApp channel and the internal subagent run-control endpoints. In certain configurations where a WhatsApp group was added to an operator's allowed groups, or where the direct-message policy was set to open, a member of that WhatsApp group could send instructions to another session's subagent. The subagent then executed those instructions on the operator's machine under that session's approval policy, and the resulting audit trail was attributed to the operator rather than the actual sender.</p>\n<p>The default configuration is not affected: whatsapp.groups defaults to empty and whatsapp.dm_policy defaults to self, so a group that is not explicitly listed is dropped before dispatch.</p>\n<p><b>Impacted versions:</b> &gt;=0.4.0 AND &lt;0.7.2</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>\n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-140-aws/\">Read the article</a></p>"
  "3eb7fd97c994cfc9f66989ff970f606b":
    "id": "3eb7fd97c994cfc9f66989ff970f606b"
    "title": "CVE-2026-112407 - Incorrect privilege assignment in AWS CICD-toolchain-for-serverless-applications"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-141-aws/"
    "published": "2026-10-21 05:39:30"
    "fetched": "2026-10-21 07:02:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-141-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/20/2026 13:30 PM PDT</p>\n<p><b>Description:</b></p>\n<p>CICD-toolchain-for-serverless-applications is an AWS sample application that provisions a CI/CD pipeline for serverless applications through the AWS Serverless Application Repository. We identified CVE-2026-112407, an incorrect privilege assignment in the IAM policy of AWS CICD-toolchain-for-serverless-applications before 1.0.11 that allows remote authenticated users with push access to the application source repository to escalate privileges and access or modify resources outside the application stack in the same AWS account via application templates deployed by the toolchain pipeline.</p>\n<p><b>Impacted versions:</b> =1.0.7 AND &lt;=1.0.10</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>\n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-141-aws/\">Read the article</a></p>"
"last_updated": "2026-10-21 07:02:38 JST"
