"entries":
  "5f82c826285cd935a30dba251a91beb2":
    "id": "5f82c826285cd935a30dba251a91beb2"
    "title": "Work management context for AI agents with Smartsheet MCP on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/work-management-context-for-ai-agents-with-smartsheet-mcp-on-aws/"
    "published": "2026-10-21 02:59:07"
    "fetched": "2026-10-21 03:17:03"
    "summary": "The Smartsheet Model Context Protocol (MCP) Server lets AI agents read, update, and act on live work management data. This post shows two ways to connect it on AWS: Amazon Quick for business teams and Kiro for developers, so your agents can work with Smartsheet without switching tools."
  "7a585cdc5a6cefb6ca0dc3a19f628b4b":
    "id": "7a585cdc5a6cefb6ca0dc3a19f628b4b"
    "title": "From data to decisions: Conversational supply chain intelligence with Amazon Quick and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-data-to-decisions-conversational-supply-chain-intelligence-with-amazon-quick-and-amazon-bedrock-agentcore/"
    "published": "2026-10-21 02:52:50"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Enterprise supply chains are data-rich but insight-poor, with the data to decide scattered across ERP, monitoring, procurement, and email. This post shows how Amazon Bedrock AgentCore exposes those systems as a governed tool layer, and how Amazon Quick turns them into one conversational experience for business users, with a deploy-it-yourself walkthrough."
  "36795c8e7531a5310b04ae65d2a0044a":
    "id": "36795c8e7531a5310b04ae65d2a0044a"
    "title": "Fine-tuning GPT-OSS-20B for multilingual reasoning on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/fine-tuning-gpt-oss-20b-for-multilingual-reasoning-on-amazon-sagemaker-hyperpod/"
    "published": "2026-10-21 02:48:27"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Learn how we fine-tuned GPT-OSS-20B for multilingual reasoning on Amazon SageMaker HyperPod, and how to decide between supervised fine-tuning (SFT) and reinforcement learning with GRPO. SFT took reasoning-language accuracy from 22% to 100%, and GRPO added measurable gains where headroom existed."
  "925521cdb49b0e67a843fa42dbf12251":
    "id": "925521cdb49b0e67a843fa42dbf12251"
    "title": "How Octave built a secure multi-tenant AI foundation on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-octave-built-a-secure-multi-tenant-ai-foundation-on-amazon-bedrock/"
    "published": "2026-10-21 02:34:04"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Octave built a secure, multi-tenant AI foundation on Amazon Bedrock, using Cohere Embed v4 for embeddings and Amazon Bedrock AgentCore for isolated agent execution, to power a Complaint Triage Assistant that searches 2 billion regulated documents without crossing tenant boundaries."
  "c90b364b68fd9faf0e4a9a673929f3cd":
    "id": "c90b364b68fd9faf0e4a9a673929f3cd"
    "title": "Access OpenAI GPT models on Amazon Bedrock from Canada with cross-Region inference"
    "link": "https://aws.amazon.com/blogs/machine-learning/access-openai-gpt-models-on-amazon-bedrock-from-canada-with-cross-region-inference/"
    "published": "2026-10-21 01:42:53"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Canadian organizations can now access OpenAI GPT-5.6, GPT-6, and GPT-6.1 models on Amazon Bedrock from the Canada (Central) and Canada West (Calgary) Regions using cross-Region inference. This post covers the models and inference profiles, how to set up permissions, and how to invoke them with the Responses, Chat Completions, and Converse APIs."
  "1495bf91ddcc9cd5ab011b7e505e7522":
    "id": "1495bf91ddcc9cd5ab011b7e505e7522"
    "title": "Discover tools at runtime with AWS Agent Registry"
    "link": "https://aws.amazon.com/blogs/machine-learning/discover-tools-at-runtime-with-aws-agent-registry/"
    "published": "2026-10-21 01:22:24"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Hardcoded tool wiring breaks down as an agent's catalog grows from a handful of tools to hundreds. This post walks through a runtime Discover, Instantiate, Execute loop built on AWS Agent Registry, where an orchestrator discovers MCP servers and A2A agents through semantic search at runtime instead of compiling every tool at build time."
  "13049e12b0450429f2594dba189b95c8":
    "id": "13049e12b0450429f2594dba189b95c8"
    "title": "Securing AI agent identity with X.509 PKI on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/securing-ai-agent-identity-with-x-509-pki-on-aws/"
    "published": "2026-10-21 01:03:48"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Learn how to secure multi-agent AI systems with cryptographic identity using Keyfactor EJBCA and AWS services. This reference architecture combines signed request envelopes, user-signed delegation assertions, RFC 8693 audience-scoped tokens, and real-time OCSP revocation to prove agent identity and prevent request forgery across agent-to-agent and MCP tool calls."
  "0bd8f9e28fdc0fe87949432281979ad7":
    "id": "0bd8f9e28fdc0fe87949432281979ad7"
    "title": "How Eon built multi-cloud investigation with an MCP Gateway on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-eon-built-multi-cloud-investigation-with-an-mcp-gateway-on-amazon-bedrock-agentcore/"
    "published": "2026-10-21 00:57:57"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Learn how Eon replaced per-tool credentials and local MCP processes across AWS, GCP, and Azure with a single authenticated Amazon Bedrock AgentCore gateway, giving more than 100 developers and autonomous agents unified access to production investigation and cutting new-engineer onboarding from two days to two minutes."
  "fe8647a528a88fc04782b0384012c07d":
    "id": "fe8647a528a88fc04782b0384012c07d"
    "title": "Build a semantic layer for agentic AI on AWS with Denodo and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-semantic-layer-for-agentic-ai-on-aws-with-denodo-and-amazon-bedrock-agentcore/"
    "published": "2026-10-21 00:39:04"
    "fetched": "2026-10-21 03:17:03"
    "summary": "Build a governed semantic layer for agentic AI on AWS with the Denodo Platform and Amazon Bedrock AgentCore. It federates Amazon Aurora, Amazon Redshift, and an on-premises PostgreSQL database into a single customer 360 view an agent queries in VQL, with identity propagation and row- and column-level access control enforced at the semantic layer."
  "3bcc39dd96ba6cd11c15f8097a15db4a":
    "id": "3bcc39dd96ba6cd11c15f8097a15db4a"
    "title": "Build a semantic layer for agentic AI on AWS with Strategy Mosaic and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-semantic-layer-for-agentic-ai-on-aws-with-strategy-mosaic-and-amazon-bedrock-agentcore/"
    "published": "2026-10-21 00:36:39"
    "fetched": "2026-10-21 03:17:03"
    "summary": "The third post in our semantic-layer series builds a customer 360 across Amazon Redshift and Amazon Aurora with Strategy Mosaic, exposes it to a Strands agent on Amazon Bedrock AgentCore through the Mosaic MCP server, and enforces per-user row and column security end-to-end."
  "8aeee3412746878bd3594d5f483740b0":
    "id": "8aeee3412746878bd3594d5f483740b0"
    "title": "Build a semantic layer for agentic AI on AWS with AtScale and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-semantic-layer-for-agentic-ai-on-aws-with-atscale-and-amazon-bedrock-agentcore/"
    "published": "2026-10-21 00:33:54"
    "fetched": "2026-10-21 03:17:03"
    "summary": "The third post in our semantic-layer series builds a governed customer 360 model on Amazon Redshift with AtScale, then exposes it to a Strands agent on Amazon Bedrock AgentCore through the AtScale MCP server. Identity propagation, RBAC, row security, and full query audit are enforced at the semantic layer, not the prompt."
  "197bde9a1af32d7830dd8ebdea81fb52":
    "id": "197bde9a1af32d7830dd8ebdea81fb52"
    "title": "Beyond the KV cache: Training and serving i14’s Laplace 3B linear attention model on AWS Trainium2 with native PyTorch"
    "link": "https://aws.amazon.com/blogs/machine-learning/beyond-the-kv-cache-training-and-serving-i14s-laplace-3b-linear-attention-model-on-aws-trainium2-with-native-pytorch/"
    "published": "2026-10-21 06:14:10"
    "fetched": "2026-10-21 07:02:39"
    "summary": "Learn how i14 trained and served Laplace 3B, a linear attention model, on AWS Trainium2 using native PyTorch. Its recurrent state stays fixed at 29.5 MB per sequence regardless of context length, avoiding the growing key-value cache of transformer models and keeping serving memory predictable."
"last_updated": "2026-10-21 07:02:39 JST"
