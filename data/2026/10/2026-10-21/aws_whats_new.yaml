  "5a3e503370682647c002e20ff8aae6fa":
    "id": "5a3e503370682647c002e20ff8aae6fa"
    "title": "Polly Generative engine upgraded with more natural speech, 14 new voices, and 2 new languages"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/polly-generative/"
    "published": "2026-10-21 00:32:00"
    "fetched": "2026-10-21 03:17:01"
    "summary": "<p>Today, we are introducing a new model behind the Amazon Polly Generative engine that delivers more natural-sounding, accurate speech output with low latency. With this upgrade, you get access to an enhanced voice portfolio with higher overall quality, 14 new voices across nine locales, and two new languages—Hindi and Finnish—now generally available on the Generative engine for the first time. New voices include Kenneth and Nate (US English), Russell and Curtis (Australian English), Kiara and Arjun (Hindi and Indian English), Tina (German), Carlos (US Spanish), Leo and Carolina (Brazilian Portuguese), Hyunduk (Korean), and Suvi (Finnish).</p>\n<p><a href=\"https://aws.amazon.com/polly\"><u>Amazon Polly</u></a> is a fully managed service that turns text into natural-sounding speech. This drop-in model upgrade makes Generative voices more natural and accurate. Complex content such as numbers, email addresses, and street addresses is designed to sound more reliable, reducing the need to fine-tune speech output. You can continue to use Speech Synthesis Markup Language (SSML) tags to control speech output on the Generative engine, just as before. The low-latency streaming API makes it easy to build contact center experiences, chatbots, and large language model (LLM) based agentic voice applications for real-time conversations. The richness and variety of voice options are also well suited for news, media, entertainment, e-learning, and accessibility use cases. This launch also expands the Amazon Polly Generative offering to AWS GovCloud, providing more options for public sector and regulated industries.</p>\n<p>All new Generative voices are now available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Europe (Frankfurt), Europe (Zurich), Europe (London), Asia Pacific (Sydney), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Tokyo), Canada (Central), and AWS GovCloud (US-West).</p>\n<p>To hear how Polly voices sound, go to <a href=\"https://aws.amazon.com/polly/features/?nc=sn&amp;loc=3\"><u>Amazon Polly Features</u></a>. For more details on the Polly offerings and use, see the <a href=\"https://docs.aws.amazon.com/polly/latest/dg/what-is.html\"><u>Amazon Polly documentation</u></a> and <a href=\"https://aws.amazon.com/polly/pricing/?nc=sn&amp;loc=4\"><u>pricing page</u></a>.</p>"
  "244355906e7dabbd1ec94140118d18f4":
    "id": "244355906e7dabbd1ec94140118d18f4"
    "title": "AWS announces TorchNeuron: Native PyTorch Support for AWS Trainium (Public Beta)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announce-native-pytorch-support-trainium"
    "published": "2026-10-21 00:00:00"
    "fetched": "2026-10-21 03:17:01"
    "summary": "<p>Today, AWS launched the public beta of TorchNeuron, an open source native PyTorch backend for AWS Trainium. Trainium is a portfolio of AI chips designed to deliver high performance and cost efficiency for deep learning AI training and inference workloads. TorchNeuron enables AI scientists and researchers to experiment and build models with PyTorch natively on Trainium.</p>\n<p>With TorchNeuron, developers can enable their PyTorch code on Trainium simply by switching to .to('neuron') while maintaining full PyTorch compatibility with eager execution, torch.compile, and standard PyTorch APIs. Additionally, TorchNeuron integrates with Neuron Kernel Interface (NKI) to enable custom operators and performance optimization for Trainium hardware.</p>\n<p>TorchNeuron is available as open source through the <a href=\"https://github.com/aws-neuron/torch-neuronx\">TorchNeuron github repo</a> for Amazon EC2 Trainium2 instances and Amazon EC2 Trainium3 instances.</p>\n<p>To learn more about TorchNeuron and AWS Trainium accelerators, visit the <a href=\"https://aws.amazon.com/ai/machine-learning/neuron/\">AWS Neuron page</a>.</p>"
  "39a6e10b46f98cec978077d6266e3362":
    "id": "39a6e10b46f98cec978077d6266e3362"
    "title": "Announcing Amazon ECS Gateway, a managed ingress solution for your ECS services"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/announcing-amazon-ecs-gateway/"
    "published": "2026-10-21 08:26:00"
    "fetched": "2026-10-21 10:13:43"
    "summary": "<p>AWS announces Amazon Elastic Container Service (Amazon ECS) Gateway, a new resource that simplifies ingress networking for containerized applications by dynamically provisioning and managing Application Load Balancers (ALBs) and their supporting resources directly in your account.</p> \n<p>With ECS Gateway, platform teams define organizational networking standards once on a gateway and associate it with one or more clusters, giving organizations a centralized way to govern how traffic reaches their ECS services. Application teams simply opt in to inherit those standards without requiring networking expertise. ECS Gateway offers host-based routing, allows up to 25 services to share an ALB to optimize infrastructure costs, and gives each service a unique Domain Name System (DNS) hostname. ECS manages the full lifecycle of the underlying infrastructure, provisioning the first ALB when your first service connects, adding more ALBs when capacity is reached, and removing them when no longer needed. You can inspect these resources and the gateway route to each service to see exactly how requests reach your applications. For traffic and health monitoring, you can use standard ALB metrics in Amazon CloudWatch and target health information from Elastic Load Balancing.</p> \n<p>To get started, create an ECS Gateway, associate it with a cluster, and opt in your ECS service by adding the gateway connector parameter using the AWS Management Console, AWS CLI, API, AWS SDKs, or AWS CloudFormation. ECS Gateway is available for ECS services using the awsvpc network mode across all launch types. It is available now in all commercial AWS Regions at no additional charge. You pay only for the underlying infrastructure provisioned in your account when your services connect to the gateway. To learn more, refer to the <a href=\"https://aws.amazon.com/blogs/aws/introducing-amazon-ecs-gateway-a-fully-managed-ingress-solution-for-ecs-services\">AWS News blog</a> and our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/gateway-overview.html\">documentation</a> page.</p>"
  "4f635511729c2d08c0515d2456eb98ed":
    "id": "4f635511729c2d08c0515d2456eb98ed"
    "title": "Amazon DynamoDB global tables now support disassociating replicas"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/dynamodb-global-tables-disassociate/"
    "published": "2026-10-21 08:00:00"
    "fetched": "2026-10-21 10:13:43"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html\">Amazon DynamoDB</a> global tables now support disassociating a replica without deleting its table or data. Global tables provide fully managed, multi-Region, multi-active replication. You can now stop replication to and from a replica and continue using the same table as a single-Region table.</p> \n<p>An account can leave a shared multi-account global table and continue using its table independently. You can also stop replication to a Region while keeping its table for local workloads, validation, or audit, without creating a replacement table or copying data.</p> \n<p>DynamoDB supports disassociating replicas in all AWS Regions for same-account and multi-account global tables that use multi-Region eventual consistency (MREC).</p> \n<p>To get started, use the AWS Management Console, AWS CLI, DynamoDB API, or AWS CloudFormation. For more information, see <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/globaltables-disassociate.html\">Disassociating replicas</a> in the Amazon DynamoDB&nbsp;Developer Guide.</p>"
  "10e17c3c8b96b7e1f31f542c70bcd734":
    "id": "10e17c3c8b96b7e1f31f542c70bcd734"
    "title": "Amazon Connect Customer launches two new layouts for agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-new-layouts-agent-workspace"
    "published": "2026-10-21 22:48:00"
    "fetched": "2026-10-22 02:52:11"
    "summary": "<p>Amazon Connect Customer now offers two different layouts that optimize screen space on the agent workspace. Contact center agents spend hours each day in the agent workspace, which includes all of the contact controls and applications they need to resolve customer issues. Agents who handle different channels and workflows want the workspace arranged differently, so that they can quickly read, respond, and access their tools. Now, administrators can choose the best layout for each team, maximizing agent efficiency and satisfaction.</p> \n<p>On the Modern layout, contact controls are at the top of the workspace, maximizing screen space for the applications beneath during voice calls. When agents handle chat, email, and task contacts on the Modern layout, they now have a taller, wider area to read and respond. The Classic layout offers a familiar experience for agents already using the agent workspace, now with contact controls that expand and contract by channel and a resizable agent assist application. Administrators can assign the Modern layout to a team migrating from another agent desktop with controls at the top, while teams already familiar with the agent workspace can use the Classic layout.</p> \n<p>You can use the new layouts for the Amazon Connect Customer agent workspace in the following AWS regions: US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Canada (Central), Europe (Frankfurt), and Europe (London).</p> \n<p>To learn more and get started, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/agent-workspace.html\">agent workspace</a> in the Amazon Connect Customer administrator guide.<b></b></p>"
  "4176b851605e1f6fbc95fa284097b424":
    "id": "4176b851605e1f6fbc95fa284097b424"
    "title": "Amazon WorkSpaces simplifies secure AI agent access to enterprise cloud desktops with less infrastructure to operate and manage"
    "link": "https://aws.amazon.com/whats-new/2026/10/workspaces-ai-agents-oauth-connection-management"
    "published": "2026-10-21 02:00:00"
    "fetched": "2026-10-22 02:52:11"
    "summary": "<p>WorkSpaces for AI agents now handles authentication and desktop connections as part of the managed Model Context Protocol (MCP) service, so you can connect agents to governed cloud desktops, removing the need to write custom code. This makes it easy to use WorkSpaces with any client that supports MCP.</p> \n<p>Connecting an agent to a desktop previously required you to manage presession requirements; generate, invoke, and rotate streaming URLs manually, adding complexity every time a session expired. You can now create sessions with your existing AWS credentials through OAuth 2.0, and the service handles the connection lifecycle. You configure once which desktop stack to use, and your agents reach the right desktop without ever seeing or handling the underlying streaming connection. You can also query session state to see which desktop stack, fleet, and session an agent is connected to, and generate a link for real-time observability of your agent. This gives you visibility and auditability over active agent work to know what your agents are doing and where.</p> \n<p>To help your agents work with multiple applications, they can now discover and launch applications through a catalog&nbsp;MCP Tool rather than navigating menus. Using these new tools, agents can list the available applications, launch one or several at runtime, and switch between them, replacing the start-menu and taskbar navigation with a programmatic, deterministic path that improves accuracy and reduces token cost.&nbsp;</p> \n<p>WorkSpaces for AI agents runs agent sessions inside the same network isolation and compliance boundaries that govern your human workforce, inheriting the VPC controls, data-loss prevention policies, and session-level security posture that enterprises have already configured. The service is also now available in four additional AWS Regions: South America (São Paulo), Europe (Milan), Europe (Spain), and Asia Pacific (Malaysia).</p> \n<p>To get started operating AI agents on WorkSpaces, visit: <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html\">https://docs.aws.amazon.com/appstream2/latest/developerguide/agent-access.html</a>.</p>"
