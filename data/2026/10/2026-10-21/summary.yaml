"overview": |
  この日は 18 件で、セキュリティ速報 2 件と、エージェント基盤 (セマンティックレイヤー、ツール探索、エージェントの ID) に関する記事が中心でした。セキュリティ速報の 1 件目は CVE-2026-112380 で、Kiro Crew の WhatsApp チャネルにおける認可の欠落です (Bulletin ID 2026-140-AWS、Important、2026 年 10 月 20 日 13:00 PDT 公開)。Kiro Crew は Web ダッシュボード、CLI、WhatsApp などのメッセージングチャネルから使えるオープンソースの個人向け AI エージェントで、操作者のマシン上でツールを実行します。WhatsApp チャネルと内部のサブエージェント実行制御エンドポイントに認可の問題があり、WhatsApp グループが操作者の許可グループに追加されている構成や、ダイレクトメッセージのポリシーが open になっている構成では、そのグループのメンバーが別セッションのサブエージェントに指示を送れました。サブエージェントはその指示をセッションの承認ポリシーのもとで操作者のマシン上で実行し、監査記録は実際の送信者ではなく操作者に帰属していました。既定の構成は影響を受けません (whatsapp.groups は空、whatsapp.dm_policy は self が既定で、明示的に列挙されていないグループは配送前に落とされます)。影響を受けるのは 0.4.0 以上 0.7.2 未満です。2 件目は CVE-2026-112407 で、AWS CICD-toolchain-for-serverless-applications の IAM ポリシーにおける不適切な権限割り当てです (Bulletin ID 2026-141-AWS、Important、同日 13:30 PDT 公開)。これは AWS Serverless Application Repository を通じてサーバーレスアプリケーション向けの CI/CD パイプラインを構築するサンプルアプリケーションで、1.0.11 より前のバージョンでは、アプリケーションのソースリポジトリへのプッシュ権限を持つ認証済みのリモートユーザーが、パイプラインがデプロイするアプリケーションテンプレートを通じて権限を昇格し、同じ AWS アカウント内のアプリケーションスタック外のリソースにアクセスしたり変更したりできました。影響を受けるのは 1.0.7 以上 1.0.10 以下です。エージェント基盤の話題が多く、セマンティックレイヤーのシリーズが 3 本公開されました。Denodo Platform を使う構成では Amazon Aurora、Amazon Redshift、オンプレミスの PostgreSQL をフェデレーションして単一の顧客 360 ビューにまとめ、エージェントが VQL で問い合わせつつ、ID の伝搬と行・列レベルのアクセス制御をセマンティックレイヤーで強制します。Strategy Mosaic を使う構成では Amazon Redshift と Amazon Aurora にまたがる顧客 360 を作り、Mosaic の MCP サーバー経由で Amazon Bedrock AgentCore 上の Strands エージェントへ公開し、ユーザーごとの行・列セキュリティを端から端まで強制します。AtScale を使う構成では Amazon Redshift 上に統制された顧客 360 モデルを作り、AtScale の MCP サーバー経由で同様に公開します。いずれも ID の伝搬、RBAC、行セキュリティ、クエリ監査をプロンプトではなくセマンティックレイヤーで担保する点が共通しています。エージェントの運用面では、ツールのハードコーディングがカタログの拡大に耐えられなくなる問題に対し、AWS Agent Registry を使った実行時の Discover・Instantiate・Execute ループが紹介されました。オーケストレーターがビルド時に全ツールを組み込むのではなく、実行時にセマンティック検索で MCP サーバーと A2A エージェントを見つけます。エージェントの ID については、Keyfactor EJBCA と AWS サービスを組み合わせ、署名付きのリクエストエンベロープ、ユーザーが署名した委任アサーション、RFC 8693 のオーディエンス限定トークン、リアルタイムの OCSP 失効確認によって、エージェント間や MCP ツール呼び出しでのリクエスト偽造を防ぐ X.509 PKI のリファレンスアーキテクチャが示されました。事例では、Eon が AWS・GCP・Azure にまたがるツールごとの資格情報とローカルの MCP プロセスを、認証された 1 つの Amazon Bedrock AgentCore ゲートウェイに置き換え、100 名を超える開発者と自律エージェントに本番調査への統一アクセスを提供して、新しいエンジニアのオンボーディングを 2 日から 2 分に短縮しました。Octave は Amazon Bedrock 上に安全なマルチテナントの AI 基盤を構築し、埋め込みに Cohere Embed v4、エージェントの分離実行に Amazon Bedrock AgentCore を使って、テナント境界を越えずに 20 億件の規制対象文書を検索する苦情トリアージアシスタントを実現しています。モデルと学習では、GPT-OSS-20B を Amazon SageMaker HyperPod 上で多言語推論向けにファインチューニングした事例が公開され、教師ありファインチューニング (SFT) で推論言語の正答率が 22% から 100% になり、余地がある部分では GRPO による強化学習がさらに効いたとしています。また i14 の線形アテンションモデル Laplace 3B をネイティブ PyTorch で AWS Trainium2 上で学習・提供した取り組みも紹介され、再帰状態がコンテキスト長に関わらず 1 シーケンスあたり 29.5 MB に固定されるため、Transformer の増え続ける KV キャッシュを避けて提供時のメモリが予測可能になるとしています。サービス更新では、TorchNeuron のパブリックベータが公開されました。AWS Trainium 向けのオープンソースのネイティブ PyTorch バックエンドで、.to('neuron') に切り替えるだけで PyTorch の互換性を保ったまま Trainium を使えます。Amazon Polly の Generative エンジンは新しいモデルにより、より自然で正確な音声を低レイテンシーで出力できるようになり、9 ロケールにわたる 14 の新しい声と、ヒンディー語・フィンランド語の 2 言語が追加されました。ネットワークでは Amazon ECS Gateway が発表され、コンテナワークロードのイングレスを簡素化するアカウントレベルのリソースとして、必要なインフラを顧客のアカウント内に動的にプロビジョニング・管理します。このほか、AWS Lambda の durable functions で 5 段構成の Agent Engine Optimization (AEO) スコアリングパイプラインを作る方法、Smartsheet の MCP サーバーを Amazon Quick (ビジネス向け) と Kiro (開発者向け) の 2 通りで AWS につなぐ方法、Amazon Quick と Amazon Bedrock AgentCore による会話型のサプライチェーン分析、そしてカナダ (中部) とカナダ西部 (カルガリー) からクロスリージョン推論で Amazon Bedrock 上の OpenAI GPT-5.6・GPT-6・GPT-6.1 を使う方法が公開されています。
