"overview": |
  この日は 23 件で、Amazon ECS Gateway の発表、セマンティックレイヤーとエージェントの接続、そしてソフトウェアサプライチェーンのセキュリティが中心でした。ニュースブログとサービス更新の両方で Amazon ECS Gateway が発表されました。コンテナ化されたアプリケーションのイングレスネットワーキングを簡素化する新しいアカウントレベルのリソースで、必要な Application Load Balancer などのインフラを動的にプロビジョニングして管理します。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-112380 はオープンソースの個人向け AI エージェントである Kiro Crew の WhatsApp チャネルにおける認可の欠落 (Bulletin ID: 2026-140-AWS、2026 年 10 月 20 日 13:00 PDT 公開)、CVE-2026-112407 は AWS のサンプルアプリケーションである CICD-toolchain-for-serverless-applications における誤った権限割り当て (Bulletin ID: 2026-141-AWS、同日 13:30 PDT 公開) です。日本のブログではサプライチェーンセキュリティが 3 本公開されました。2025 年 9 月以降に相次ぐ npm Registry を悪用した Shai-Hulud などの攻撃を踏まえ、AWS Well-Architected フレームワークのセキュリティの柱に沿ったパッケージ利用者向けのベストプラクティスとして、一時的な認証情報と最小権限による漏えいリスクの低減、AWS Signer によるアーティファクト署名などの多層防御が紹介されました。あわせて、npm や PyPI のパッケージは公開直後の数時間にサプライチェーンのリスクが最も高くなることを踏まえ、Amazon Linux 2023 で npm の min-release-age と pip の uploaded-prior-to を使って 1 日の依存関係クールダウンを設定し、予期しないパッケージのインストールを防ぐ方法 (npm audit と pip-audit の活用を含む) が示されています。3 本目は AI コーディングエージェント向けのコントロールフレームワークです。Kiro のようなエージェントが開発を加速させる一方でプロンプトインジェクション・過度に緩い設定・サプライチェーンリスク・スコープクリープをもたらすことを踏まえ、IDE でエージェントの出力を方向付ける作成時のコントロールと、パイプラインで検証するビルド時のコントロールという 2 つの柱からなるアプリケーションセキュリティのフレームワークが示されました。機械学習ブログでは、エージェント型 AI 向けのセマンティックレイヤーを扱うシリーズの第 3 回が 3 本公開されました。AtScale で Amazon Redshift 上に統制された customer 360 モデルを構築して AtScale MCP 経由で Amazon Bedrock AgentCore 上の Strands エージェントへ公開する構成、Strategy Mosaic で Amazon Redshift と Amazon Aurora をまたぐ customer 360 を構築して MCP 経由で公開する構成、そして Denodo Platform で Amazon Aurora・Amazon Redshift・オンプレミスの PostgreSQL をフェデレーションして統制されたセマンティックレイヤーを作る構成です。エージェント基盤では、ハードコードしたツールの配線はエージェントのカタログが数個から数百へ増えると破綻するという前提で、AWS Agent Registry 上に Discover・Instantiate・Execute のループを実行時に回す方法が解説され、Keyfactor EJBCA と AWS のサービスで X.509 PKI による暗号学的な ID をマルチエージェントシステムに与えるリファレンスアーキテクチャ (署名付きリクエストエンベロープ、ユーザーが署名する委任アサーション) も公開されました。事例としては、Eon が AWS・GCP・Azure にまたがるツールごとの認証情報とローカルの MCP プロセスを、認証された 1 つの Amazon Bedrock AgentCore ゲートウェイに置き換え、100 人を超える開発者と自律エージェントに提供している取り組み、Octave が Cohere Embed v4 の埋め込みと AgentCore の隔離されたエージェント実行で、安全なマルチテナントの AI 基盤を Amazon Bedrock 上に構築して苦情トリアージのアシスタントを動かしている事例が紹介されました。学習・推論では、GPT-OSS-20B を Amazon SageMaker HyperPod 上で多言語の推論向けにファインチューニングした記事 (教師ありファインチューニング (SFT) と GRPO による強化学習の使い分け) と、i14 が線形アテンションのモデル Laplace 3B を AWS Trainium2 上でネイティブな PyTorch を使って学習・提供した事例 (再帰的な状態がコンテキスト長にかかわらず 1 シーケンスあたり 29.5 MB に固定される) が公開されました。あわせて、AWS Trainium 向けのオープンソースのネイティブ PyTorch バックエンドである TorchNeuron のパブリックベータが開始されました。リージョン展開では、カナダの組織がカナダ (中部) とカナダ西部 (カルガリー) から、クロスリージョン推論によって Amazon Bedrock 上の OpenAI GPT-5.6・GPT-6・GPT-6.1 を利用できるようになりました。音声では、Amazon Polly の Generative エンジンが新しいモデルに更新され、より自然で正確な音声出力を低レイテンシーで提供するようになり、14 の新しい声と 2 つの新しい言語が加わりました。そのほかサービス更新では、Amazon DynamoDB のグローバルテーブルがレプリカのテーブルやデータを削除せずにレプリカの関連付けを解除できるようになりました。コンピュートブログでは、AWS Lambda durable functions で 5 ステップの Agent Engine Optimization (AEO) スコアリングパイプラインを構築する方法が解説され、チェックポイントされた各ステップがステージ間でコストをかけずに中断し、リトライできることが示されています。業務データ連携では、Amazon Bedrock AgentCore が ERP・監視・調達・メールに散らばったデータを公開して対話的なサプライチェーンインテリジェンスを実現する方法と、Smartsheet の MCP サーバーを AWS 上で接続する 2 つの方法 (業務チーム向けの Amazon Quick 経由など) が紹介されました。日本のブログではさらに、OpenAI ChatGPT Codex のモデル推論を Amazon ECS 上の LiteLLM ゲートウェイ経由で Amazon Bedrock にルーティングし、生成 AI コーディングエージェントをエンタープライズ向けに一元管理する方法が公開されました。AWS Fargate へのデプロイ手順、スコープ付きキーによる予算とレート制限の適用、Responses API の互換性検証を扱い、AWS IAM Identity Center による直接アクセスや Portkey を使う代替の経路も取り上げています。
