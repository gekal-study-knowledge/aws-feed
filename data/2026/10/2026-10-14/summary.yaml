"overview": |
  この日は 7 件で、前日に発表された AWS Lambda Web Functions の掘り下げと、Amazon Bedrock を使った生成 AI の実装事例が中心でした。AWS Compute Blog は Lambda Web Functions で標準的な Node.js の Web サーバーを動かす方法を扱い、1 コマンドまたは AWS CloudFormation でデプロイすると、アダプター層もサーバー管理もなしに公開 HTTPS エンドポイントが得られること、1 つの実行環境が多数の同時リクエストを処理すること、アクティブ CPU 課金によって待ち時間のコストが低く抑えられることを示しています。生成 AI の事例では、Orca Security が Amazon Bedrock 上に自然言語クエリエージェント Discovery AI を構築し、平易な英語の質問を同社の Sonar クエリへ変換した例が紹介されました。多段構成のアーキテクチャにより、当初のベースラインに対してクエリコストを 90% 削減、入力トークンを 93% 削減、レイテンシーを 75% 削減したとしています。ShipStation Global は Amazon Bedrock AgentCore 上に Slack 向けの社内 IT ヘルプデスクエージェント Deckhand を構築し、整備したナレッジベースから定型的な IT の質問に答え、エラーメッセージのスクリーンショットを読み取り、Jira のチケットを作成します。最初の 3 か月でチャンネルの問い合わせの 97.5% を解決し、肯定的な評価は 96% でした。モデル関連では、Grok 4.7 が Amazon Bedrock で利用可能になり、ツール呼び出し型エージェントを構築して 3 つの推論タスクを 4 段階の reasoning effort で評価し、完了あたりの正答率とトークンコストを測ってリクエスト単位でトレードオフを調整・監視する方法が示されました。性能面では、Amazon SageMaker AI 上の融合 Mixture-of-Experts (MoE) モデルに対するカーネル最適化が共有され、WGMMA の利用率を上げる Swap-AB、FP8 量子化向けの Triton バックエンドルーティング、Triton の JIT 再コンパイルの排除によって、H200 GPU でスループットが最大 10%、Time to First Token が最大 9% 改善したとしています。運用面では、AWS Marketplace のプライベート価格オファー (MPPO) を数十から数百のアカウントで個別に承諾する手間を解消する方法として、AWS License Manager でのエンタイトルメント有効化を、1 回限りの修正用の軽量スクリプトと、継続的なイベント駆動処理のための CDK 自動化の 2 通りで示した記事が公開されました。最後に AWS Weekly Roundup では、Prime Day 2026 の数値 (Amazon ElastiCache のピークが 1 日 2.3 京リクエスト) や Claude Haiku 5.5、Amazon Nova 2.5 Sonic などが取り上げられています。
