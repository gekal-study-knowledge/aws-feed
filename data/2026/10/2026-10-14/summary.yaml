"overview": |
  この日は 38 件で、Lambda Web Functions の深掘り、EC2 のセキュリティ、そしてエージェントの本番化に関する日本語記事が中心でした。コンピュートブログでは、新しい種類の Lambda 関数である Lambda Web Functions で標準的な Node.js の Web サーバーをそのまま動かし、1 コマンドまたは AWS CloudFormation でデプロイしてアダプターなしに公開 HTTPS エンドポイントを得る方法が解説されました。あわせて AWS Lambda durable functions は、1 実行あたりの durable operation の上限が 3,000 から 30,000 へ、チェックポイントのペイロードサイズが 256 KB から 1 MB へ引き上げられました。セキュリティでは、一時的実行攻撃「L1TF Reloaded」がハーフ Spectre ガジェットと L1TF を組み合わせてゲストデータを漏洩させる仕組みが解説され、AWS Nitro System と Nitro Hypervisor を使っている場合はゲストデータが影響を受けず追加の対応も不要であることが示されました (XPFO の概念に基づくシークレットハイディングやゲスト CPU コアの扱いも取り上げられています)。あわせて、Amazon EC2 インスタンス構成証明・NitroTPM・Attestable AMI を使ってセルフマネージド型データベースでゼロオペレーターアクセス (ZOA) を実現する方法が公開されました。Nix Flakes で再現可能な AMI をビルドして PCR 測定値を算出し、AWS KMS のキーポリシーの条件に設定することで、LUKS で暗号化された EBS ボリュームへのアクセスを構成証明に紐づけます。24 時間 365 日体制のグローバルチームである AWS Customer Incident Response Team (CIRT) の紹介記事も公開され、責任共有モデルにおける顧客側の責任範囲で進行中のセキュリティイベントへの支援範囲と依頼方法、脅威アクターによる AWS 固有の TTPs をまとめた公開リソースが示されました。サービス更新では、AWS Security Hub が露出 (exposure) の優先順位付けにリソースの重要度 (criticality) を加え、ビジネス上もっとも重要なリソースを脅かす露出に集中できるようになりました。Amazon ECS は実際に稼働中のタスク数を報告する新しいサービスメトリクス LiveTaskCount を全ユーザーに追加料金なしで提供し、あわせて RunningTaskCount メトリクスの課金を廃止しました。AWS Agent Registry (組織内のエージェント・MCP サーバー・エージェントスキル・ゲートウェイ・カスタムリソースを統制するカタログ) はレジストリレコードのカスタムメタデータに対応し、AWS Resilience Hub は次世代としてワークロードのスコープとレジリエンシー要件を実環境に揃え続けるための 3 つの機能 (サービス入力に対する Amazon EKS ラベルのサポートなど) を追加しました。開発者向けの連携としては、Amazon S3 が S3 Tables と S3 Vectors を含めて Vercel Marketplace と v0 by Vercel で利用できるようになり、開発環境を離れずに数秒で S3 リソースを作成・接続できます。そのほか、Amazon Location Service が Places・Routes・Maps の全 API をコードを書かずに視覚的に試せるインタラクティブな API Playground を公開し、AWS Deadline Cloud はファーム全体ではなく特定のキュー・フリート・ジョブにアクセスできるユーザーが、自分が到達できるリソースを Deadline Cloud monitor から直接見つけられるようになりました。Amazon DCV 2026.0 は RHEL 10・Rocky Linux 10・CentOS 10・Ubuntu 26.04 のサポートと新しい macOS クライアント、更新された Windows / Linux クライアントを追加し、Amazon RDS Proxy は SQL Server 2022 に対応、AWS Backup はアジアパシフィック (ニュージーランド) リージョンで Amazon FSx for Lustre・FSx for NetApp ONTAP・FSx for OpenZFS・FSx for Windows File Server に対応しました。Ethereum や Solana のノード運用者向けには、事前に同期済みの公開ブロックチェーンのチェーンデータを Amazon S3 で公開する Blockchain Snapshots on AWS が発表されています。AWS Transfer Family は SFTP サーバーのホストキーを自アカウントの AWS Secrets Manager に保存できるようになり、コンソールでは Web アプリのロゴに SVG、ファビコンに ICO を使えるようになりました (アップロード上限は 2 MB に拡大)。機械学習ブログでは、Amazon SageMaker AI 上で融合 Mixture-of-Experts (MoE) モデルのカーネル最適化を行う知見 (WGMMA 利用率を高める Swap-AB、FP8 量子化のための Triton バックエンドルーティングなど) が共有され、Amazon Bedrock で利用可能になった Grok 4.7 でツール呼び出しエージェントを作り、4 段階の推論強度で 3 つの推論タスクを評価する記事が公開されました。事例としては、ShipStation Global が Amazon Bedrock AgentCore 上に Slack 向けの AI IT ヘルプデスクエージェント Deckhand を構築した取り組み、Orca Security が平易な英語の質問を Sonar クエリに変換する自然言語クエリエージェント Discovery AI を構築した多段アーキテクチャ、そして Tamnoon が CNAPP やクラウドネイティブのソースから来るクラウドセキュリティの検出結果を自律的に調査し安全に修復するエージェント型オーケストレーター Tami を Amazon Bedrock 上に構築した事例が紹介されました。あわせて、数十から数百の AWS アカウントで AWS Marketplace のプライベート価格オファーを個別に受諾する手間を解消するマネージドエンタイトルメントの活用法、AWS Generative AI Innovation Center の Partner Agent Factory と Anchor Browser が x402 で保護された Web リソースや API に対してエージェントが自律的に支払いを行う仕組みを AgentCore の決済機能で構築した事例、Amazon SageMaker JumpStart でモデルをデプロイし SageMaker Python SDK で軽量かつ再現可能な性能テストを実施してエンドポイントを削除するまでの手順、そして AgentCore でスーパーバイザーエージェントと RAG を組み合わせ、社内文書から PowerPoint のプレゼンテーション作成を自動化するエージェントシステムの構築方法が公開されました。アーキテクチャブログでは、シドニー工科大学 (UTS) がカリキュラムデータを統制された再利用可能なプロダクトとして扱い、API・グラフ探索・セマンティック検索から利用できるデータサービス基盤を AWS 上に構築した事例と、Amazon Route 53 の DNS フェイルオーバー・Amazon DynamoDB グローバルテーブル・カナリアのヘルスプローブを組み合わせて Amazon API Gateway の WebSocket API にマルチリージョンのディザスタリカバリを構築する設計パターンが公開されました。日本のブログでは、AI エージェントをデモから本番運用へ進めるための Build・Test・Run・Secure・Observe・Govern の 6 つの柱、Amazon Aurora DSQL の外部キー制約の使い方、AWS STS のセッショントークンのサイズ制限が 4,096 バイトの単一の制限に簡素化されたこと、AWS Builder Center の無料サンドボックス環境で Amazon Connect Customer のワークショップを体験できるようになったこと、株式会社インフキュリオンによる請求書カード払いでの AI エージェント連携、株式会社エナリスと KDDI アジャイル開発センターによる ESG 対応の意思決定を支援する AI エージェント、そして月刊 AWS 製造 2026 年 10 月号が公開されました。
