"overview": |
  この日は 26 件で、Lambda Web Functions の深掘り、EC2 のセキュリティ、そしてエージェントの本番化に関する日本語記事が中心でした。コンピュートブログでは、新しい種類の Lambda 関数である Lambda Web Functions で標準的な Node.js の Web サーバーをそのまま動かし、1 コマンドまたは AWS CloudFormation でデプロイしてアダプターなしに公開 HTTPS エンドポイントを得る方法が解説されました。セキュリティでは、一時的実行攻撃「L1TF Reloaded」がハーフ Spectre ガジェットと L1TF を組み合わせてゲストデータを漏洩させる仕組みが解説され、AWS Nitro System と Nitro Hypervisor を使っている場合はゲストデータが影響を受けず追加の対応も不要であることが示されました (XPFO の概念に基づくシークレットハイディングやゲスト CPU コアの扱いも取り上げられています)。あわせて、Amazon EC2 インスタンス構成証明・NitroTPM・Attestable AMI を使ってセルフマネージド型データベースでゼロオペレーターアクセス (ZOA) を実現する方法が公開されました。Nix Flakes で再現可能な AMI をビルドして PCR 測定値を算出し、AWS KMS のキーポリシーの条件に設定することで、LUKS で暗号化された EBS ボリュームへのアクセスを構成証明に紐づけます。24 時間 365 日体制のグローバルチームである AWS Customer Incident Response Team (CIRT) の紹介記事も公開され、責任共有モデルにおける顧客側の責任範囲で進行中のセキュリティイベントへの支援範囲と依頼方法、脅威アクターによる AWS 固有の TTPs をまとめた公開リソースが示されました。サービス更新では、AWS Security Hub が露出 (exposure) の優先順位付けにリソースの重要度 (criticality) を加え、ビジネス上もっとも重要なリソースを脅かす露出に集中できるようになりました。Amazon ECS は実際に稼働中のタスク数を報告する新しいサービスメトリクス LiveTaskCount を全ユーザーに追加料金なしで提供し、あわせて RunningTaskCount メトリクスの課金を廃止しました。AWS Agent Registry (組織内のエージェント・MCP サーバー・エージェントスキル・ゲートウェイ・カスタムリソースを統制するカタログ) はレジストリレコードのカスタムメタデータに対応し、AWS Resilience Hub は次世代としてワークロードのスコープとレジリエンシー要件を実環境に揃え続けるための 3 つの機能 (サービス入力に対する Amazon EKS ラベルのサポートなど) を追加しました。そのほか、Amazon Location Service が Places・Routes・Maps の全 API をコードを書かずに視覚的に試せるインタラクティブな API Playground を公開し、AWS Deadline Cloud はファーム全体ではなく特定のキュー・フリート・ジョブにアクセスできるユーザーが、自分が到達できるリソースを Deadline Cloud monitor から直接見つけられるようになりました。Amazon DCV 2026.0 は RHEL 10・Rocky Linux 10・CentOS 10・Ubuntu 26.04 のサポートと新しい macOS クライアント、更新された Windows / Linux クライアントを追加しています。機械学習ブログでは、Amazon SageMaker AI 上で融合 Mixture-of-Experts (MoE) モデルのカーネル最適化を行う知見 (WGMMA 利用率を高める Swap-AB、FP8 量子化のための Triton バックエンドルーティングなど) が共有され、Amazon Bedrock で利用可能になった Grok 4.7 でツール呼び出しエージェントを作り、4 段階の推論強度で 3 つの推論タスクを評価する記事が公開されました。事例としては、ShipStation Global が Amazon Bedrock AgentCore 上に Slack 向けの AI IT ヘルプデスクエージェント Deckhand を構築し、整備されたナレッジベースから定型的な IT 質問に答えエラーメッセージを読み取る取り組み、Orca Security が平易な英語の質問を Sonar クエリに変換する自然言語クエリエージェント Discovery AI を Amazon Bedrock 上に構築した多段アーキテクチャが紹介されました。あわせて、数十から数百の AWS アカウントで AWS Marketplace のプライベート価格オファーを個別に受諾する手間を解消するマネージドエンタイトルメントの活用法、そして AWS Generative AI Innovation Center の Partner Agent Factory と Anchor Browser が、x402 で保護された Web リソースや API に対してエージェントが自律的に支払いを行う仕組みを Amazon Bedrock AgentCore の決済機能で構築した事例が公開されました。日本のブログでは、AI エージェントをデモから本番運用へ進めるために Build・Test・Run・Secure・Observe・Govern の 6 つの柱を自動車工場の部品在庫エージェントを例に順に解説する記事、Amazon Aurora DSQL の外部キー制約の使い方 (即時チェックと遅延チェック、ダウンタイムなしでの制約追加、OCC による競合解決、スケールを考慮した FK 設計とリトライロジック)、AWS STS のセッショントークンのサイズ制限が 4,096 バイトの単一の制限に簡素化されセッションポリシーとセッションタグに使える容量が拡大したこと (トークンサイズは API レスポンス・CloudWatch メトリクス・CloudTrail イベントで報告され、MinimumSessionTokenSize パラメータも利用可能)、AWS Builder Center の無料サンドボックス環境で AWS アカウントもクレジットカードもなしに Amazon Connect Customer のワークショップを体験できるようになったこと、株式会社インフキュリオンによる請求書カード払いでの AI エージェント連携 (Amazon Bedrock AgentCore Runtime を用いたリモート MCP サーバー構築)、株式会社エナリスと KDDI アジャイル開発センターによる Amazon Bedrock AgentCore で人の判断を記憶して ESG 対応の意思決定を支援する AI エージェント、そして月刊 AWS 製造 2026 年 10 月号が公開されました。ニュースブログでは Prime Day 2026 の数値 (Amazon EC2 の 1 日あたり 2.3 千兆リクエストなど)、Claude Haiku 5.5、Amazon Nova 2.5 Sonic などを扱う週刊まとめ (2026 年 10 月 13 日) が、セキュリティブログではサイバーセキュリティのキャリアを扱うシリーズのパート 2 が公開されています。
