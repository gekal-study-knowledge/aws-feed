"entries":
  "011f34eb7b72ab5639a6d9a4617e9cf8":
    "id": "011f34eb7b72ab5639a6d9a4617e9cf8"
    "title": "Amazon ECS adds LiveTaskCount and removes the charge for RunningTaskCount metric"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/ecs-service-metrics/"
    "published": "2026-10-14 07:00:00"
    "fetched": "2026-10-14 09:05:44"
    "summary": "<p>Today, Amazon Elastic Container Service (Amazon ECS) announces LiveTaskCount, a new ECS service metric that reports how many tasks are actively running in your service, available to all customers at no additional charge. Additionally, the existing RunningTaskCount metric in Amazon CloudWatch Container Insights no longer incurs a charge.</p>\n<p>LiveTaskCount reports the number of actively running ECS tasks across all desired states (ACTIVATING, RUNNING, and DEACTIVATING), including tasks still running while transitioning to a stopped state, for example, tasks undergoing connection draining during a scale-in event. This comprehensive state coverage makes LiveTaskCount well suited for autoscaling policies and capacity planning where a complete view of active, metric-generating tasks is required. It is available at no charge as part of ECS service utilization metrics and does not require opting in to CloudWatch Container Insights. The existing CloudWatch Container Insights RunningTaskCount metric tracks tasks where both the current and desired state are RUNNING, and continues to serve as a health and stability signal for customers who depend on it. With today's update, RunningTaskCount is now available at no additional charge for all CloudWatch Container Insights users.</p>\n<p>These updates are available in all AWS Regions where Amazon ECS is available. No action is required, and the pricing change for RunningTaskCount takes effect beginning October 1, 2026, and applies automatically. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service_utilization.html#cw_live_task_count\">ECS CloudWatch metrics</a> and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cloudwatch-container-insights.html\">ECS Container Insights metrics</a>. For a pricing example, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing</a>.</p>"
  "0ba40795ce2c31a3311f5a061e96777f":
    "id": "0ba40795ce2c31a3311f5a061e96777f"
    "title": "AWS Agent Registry now supports custom metadata for registry records"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-agent-registry-custom-metadata-registry-records"
    "published": "2026-10-14 06:00:00"
    "fetched": "2026-10-14 09:05:44"
    "summary": "<p>AWS Agent Registry is the centralized, governed catalog for agents, MCP servers, agent skills, gateways, and custom resources within your organization. As organizations scale to hundreds of such resources, a name and description alone are insufficient for effective governance and discovery. Custom metadata lets you extend every registry record with your organization's own structured fields, so both people and automated systems can find and govern resources consistently.\n <br />\n <br />\n With custom metadata, publishers can record fields like team ownership, data classification, or review status directly on each registry record. You define a schema once per registry with common attributes, then extend it with type-specific fields — such as a model family for agent records. Each field supports free text, a URL, a Boolean, or a choice from a list of allowed values, and the registry validates required fields and values on every record creation or update. You can then filter search results on any custom metadata field from the AWS Management Console, the AWS CLI, the AWS SDKs, or the registry's MCP endpoint.\n <br />\n <br />\n Custom metadata is available in all AWS Regions where AWS Agent Registry is available: US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Europe (Ireland).\n <br />\n <br />\n To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html\">AWS Agent Registry documentation</a>. For detailed setup guidance, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-custom-metadata-schema.html\">Define a custom metadata schema</a> and&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry-custom-metadata-values.html\">Set custom metadata values on a record</a>.</p>"
  "dc63ca862afb0f315b9e8f1672648e97":
    "id": "dc63ca862afb0f315b9e8f1672648e97"
    "title": "Amazon DCV releases version 2026.0 with RHEL 10 support and new clients"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-dcv-2026-0/"
    "published": "2026-10-14 04:35:00"
    "fetched": "2026-10-14 09:05:44"
    "summary": "<p>Amazon DCV 2026.0 is now available, adding support for RHEL 10, Rocky Linux 10, CentOS 10, and Ubuntu 26.04 along with a new macOS client and updated Windows and Linux clients. Amazon DCV is a high-performance remote display protocol that enables customers to securely access remote desktops and application sessions across Windows, Linux, and macOS.</p>\n<p>Amazon DCV 2026.0 includes the following key features and improvements:</p>\n<ul>\n <li>\n  <p>Support for RHEL 10, Rocky Linux 10, CentOS 10, and Ubuntu 26.04, with Linux hosts and sessions running on the modern Wayland display server</p>\n </li>\n <li>\n  <p>A new macOS client with gamepad support, and updated Windows and Linux clients</p>\n </li>\n <li>\n  <p>URL redirection on Windows hosts, so configured links opened in a remote session launch in the local browser on the client device</p>\n </li>\n <li>\n  <p>Printer preferences redirection on Windows, giving remote sessions access to client-side printer settings</p>\n </li>\n <li>\n  <p>Performance improvements, including H.264 frame slice support and slice-based multithreaded decoding on the Linux and macOS clients for lower latency</p>\n </li>\n <li>\n  <p>Support for new macOS server versions on Amazon EC2</p>\n </li>\n</ul>\n<p>For more information about the new features and enhancements in Amazon DCV 2026.0, see the <a href=\"https://docs.aws.amazon.com/dcv/latest/adminguide/doc-history-release-notes.html\" rel=\"noopener noreferrer\" target=\"_blank\">release notes</a> or visit the <a href=\"https://aws.amazon.com/hpc/dcv/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon DCV webpage</a> to learn more and get started.</p>\n<h2>&nbsp;</h2>"
  "bfa5a50e967660d50aac65ad028967cc":
    "id": "bfa5a50e967660d50aac65ad028967cc"
    "title": "AWS Deadline Cloud now helps users find their accessible resources in the Deadline Cloud monitor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/deadline-cloud/resources"
    "published": "2026-10-14 03:54:00"
    "fetched": "2026-10-14 09:05:44"
    "summary": "<p>AWS Deadline Cloud now lets users who have access to specific queues, fleets, or jobs, rather than an entire farm, find the resources they can reach directly from the Deadline Cloud monitor. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads for visual effects, animation, product design, simulation, and gaming.</p>\n<p>Previously, a user with access to only one queue had to get the farm ID from an administrator before they could reach their work. With this launch, the Deadline Cloud monitor displays to users queues they have access to, the parent IDs needed to reach them, and their level of access, covering both direct and group-inherited permissions. Teams now can share a single monitor entry point (URL) across different permission levels without additional coordination.</p>\n<p>Resource discovery is available in all AWS Regions where Deadline Cloud is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/view-member-resource-access.html\">AWS Deadline Cloud user guide</a>.</p>"
  "adbeb427218a340f28bedf442090b91f":
    "id": "adbeb427218a340f28bedf442090b91f"
    "title": "Amazon Location Service launches an interactive API Playground featuring Places, Routes and Maps APIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-location-service-api-playground"
    "published": "2026-10-14 03:46:00"
    "fetched": "2026-10-14 09:05:44"
    "summary": "<p>Amazon Location Service now offers a complete, interactive API Playground that lets developers explore and test every Places, Routes, and Maps API visually without writing code. With this release, all 14 Amazon Location Service Places, Maps and Routes APIs are available in an interactive API Playground, where developers can make real API calls, see results rendered on an interactive map, adjust parameters, and copy ready-to-use request snippets directly into their applications.</p>\n<p>The API Playground covers Amazon Location Service's Places, Routes, and Maps APIs: search and geocoding (Geocode, ReverseGeocode, Autocomplete, Suggest, SearchText, SearchNearby, and GetPlace), route planning and optimization (CalculateRoutes, CalculateRouteMatrix, CalculateIsolines, OptimizeWaypoints, and SnapToRoads), and mapping (Dynamic Map and GetStaticMap). Customers can simulate validating delivery addresses, planning truck-safe multi-stop routes, visualizing drive-time service areas, or embedding maps into their apps — with no SDK setup or test scripts required.</p>\n<p>The API Playground is available in the following AWS Regions: US East (Ohio), US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Malaysia), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Spain), Europe (Stockholm), and South America (São Paulo).</p>\n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/location/api-playground\">Amazon Location Service API Playground</a> in the AWS Console, or learn more in the <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/api-playground.html\">Developer Guide</a>.</p>"
  "693c7f7fa4f4264c6b73db74aca29ea5":
    "id": "693c7f7fa4f4264c6b73db74aca29ea5"
    "title": "AWS Security Hub now supports resource criticality for prioritization"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/security-hub-resource-criticality/"
    "published": "2026-10-14 10:00:00"
    "fetched": "2026-10-14 14:44:38"
    "summary": "<p>Today, AWS Security Hub adds resource criticality to exposure prioritization, helping central security teams focus on the exposures that threaten their most business-critical resources.</p>\n<p>You can set criticality with an automation rule, for example marking every compute resource in a specific account as Very High. The rule applies to resources already in your inventory and to new resources as Security Hub discovers them. Security Hub also infers criticality from resource tags and resource names, with no configuration required, and records which source determined the value. Criticality appears as a column on the Resources page for sorting, filtering, and grouping, and on the Impact assessment tab of an exposure finding. Resource criticality is included with Security Hub Essentials at no additional cost and is always on for all customers.</p>\n<p>Resource criticality is included with Security Hub Essentials at no additional cost and requires no new enablement. To learn more, see&nbsp; <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub-v2.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>.&nbsp;For a list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p>"
  "3c724ba0e571cee5479ffa5f72adf374":
    "id": "3c724ba0e571cee5479ffa5f72adf374"
    "title": "AWS Backup now supports Amazon FSx file systems in the Asia Pacific (New Zealand) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-backup-fsx-asia-pacific-new-zealand/"
    "published": "2026-10-14 17:00:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p>AWS Backup now supports Amazon FSx for Lustre, Amazon FSx for NetApp ONTAP, Amazon FSx for OpenZFS, and Amazon FSx for Windows File Server in the Asia Pacific (New Zealand) Region.</p>\n<p>With this launch, you can use AWS Backup to centrally automate and manage data protection for your Amazon FSx file systems in the Asia Pacific (New Zealand) Region, alongside your other supported AWS resources. You can create policy-based backup plans to schedule backups and apply retention rules, store backups in encrypted vaults, and restore file systems when needed. This helps you meet business continuity, disaster recovery, and regulatory compliance requirements from a single, centralized service.</p>\n<p>To get started, visit the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. For a complete list of supported Regions and features, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\">AWS Backup documentation</a>. To learn more about AWS Backup, visit the <a href=\"https://aws.amazon.com/backup/\">product page</a> and <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>.</p>"
  "279346135a470091b919ca41621dbf45":
    "id": "279346135a470091b919ca41621dbf45"
    "title": "Amazon RDS Proxy now supports SQL Server 2022"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/rds-proxy-supports-sqlserver-2022"
    "published": "2026-10-14 16:00:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/proxy/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Proxy</a>, a fully managed, highly available database proxy for <a href=\"https://aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (RDS)</a>, now supports <a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server</a>&nbsp;instances running major version 2022.\n <br />\n <br />\n Amazon RDS Proxy sits between your application and the database to pool and share established database connections, improving database efficiency and application scalability. For Amazon RDS for SQL Server Multi-AZ databases, RDS Proxy automatically connects to the standby database instance during a failure, preserves application connections, and helps reduce failover times by up to 83%. RDS Proxy supports standard IAM authentication for SQL Server, where your applications authenticate to the proxy using AWS Identity and Access Management (IAM) and RDS Proxy manages database connections using credentials stored in AWS Secrets Manager.\n <br />\n <br />\n You can enable Amazon RDS Proxy for your SQL Server 2022 database in a few steps on the Amazon RDS console, then connect by pointing your application to the RDS Proxy endpoint. To get started, see our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "0ea59884d1b76b946658ff6a8d46734a":
    "id": "0ea59884d1b76b946658ff6a8d46734a"
    "title": "AWS Lambda durable functions increases durable operation and checkpoint payload limits"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-lambda-durable-gen-limit-increase/"
    "published": "2026-10-14 07:00:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p>Starting today, AWS Lambda durable functions increases the maximum number of durable operations per execution from 3,000 to 30,000, and the maximum checkpoint payload size from 256 KB to 1 MB. Higher operation limits let you safely do more work in a single execution including expanding iterative loops, polling for longer time periods, and building more complex rollback paths that run when a step fails. At 1 MB, checkpoint payloads match the maximum payload size of asynchronous Lambda invocations, and integration services such as Amazon SQS, and Amazon EventBridge, so a workflow can persist a full event from any of these sources in a single operation.</p>\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">AWS Lambda durable functions</a> helps you build resilient multi-step applications and AI workflows that execute for up to one year, with built-in checkpointing, automatic retries, and waits that suspend execution without incurring compute charges. Every durable operation counts toward the per-execution limit, including each step attempt, each poll of a wait-for-condition, and each branch of a parallel or map operation. With 30,000 operations, a single execution has more room to coordinate complex, multi-step workflows, iterate across thousands of items, or poll an external system for weeks, without exceeding checkpoint limits.</p>\n<p>An agentic application can reason over thousands of model and tool calls, and with 1 MB checkpoints it persists larger conversation histories, model responses, and outputs from tools directly in the checkpoint instead of writing to external storage. For state larger than 1 MB, the JavaScript and Python SDKs include a <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/state/serialization/#filesystem-serdes\">FileSystem serializer</a> that writes the payload to an Amazon EFS or Amazon S3 Files mount and checkpoints a pointer instead.</p>\n<p>&nbsp;The new limits apply in all AWS Regions where AWS Lambda durable functions is available. To learn more about these service limits, see the&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html\">AWS Lambda developer guide</a>.</p>"
"last_updated": "2026-10-15 05:24:28 JST"
