    "title": "Scope workloads and share resilience policies with AWS Resilience Hub"
    "link": "https://aws.amazon.com/blogs/architecture/scope-workloads-and-share-resilience-policies-with-aws-resilience-hub/"
    "published": "2026-10-14 06:30:10"
    "fetched": "2026-10-14 09:05:45"
    "summary": "The next generation of AWS Resilience Hub adds three capabilities to keep workload scope and resilience requirements aligned with your running environment: Amazon EKS label support for service input sources, generative AI-powered Dependency Insights, and resilience policy sharing through AWS Organizations."
  "83dea8cde9a7321ff42d4652cdc96e3b":
    "id": "83dea8cde9a7321ff42d4652cdc96e3b"
    "title": "Multi-region disaster recovery for Amazon API Gateway WebSocket APIs"
    "link": "https://aws.amazon.com/blogs/architecture/multi-region-disaster-recovery-for-amazon-api-gateway-websocket-apis/"
    "published": "2026-10-14 23:31:55"
    "fetched": "2026-10-15 01:26:00"
    "summary": "Learn how to build multi-region disaster recovery for Amazon API Gateway WebSocket APIs. This design pattern combines Amazon Route 53 DNS failover, Amazon DynamoDB Global Tables, a canary health probe, and client-side reconnection logic to reconnect clients and restore session state automatically during a regional failover."
  "ad5190eeea6c3b446eb1f185fc6d45ec":
