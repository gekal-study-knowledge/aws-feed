    "title": "AWS Builder Center で Amazon Connect Customer のサンドボックス環境を無料提供"
    "link": "https://aws.amazon.com/jp/blogs/news/free-sandbox-environments-for-amazon-connect-customer-on-aws-builder-center/"
    "published": "2026-10-14 10:20:30"
    "fetched": "2026-10-14 14:44:39"
    "summary": "AWS Builder Center の無料サンドボックス環境を使って、Amazon Connect Customer のワークショップが利用可能になりました。この記事では AWS アカウントやクレジットカードなしで、AI を活用したコンタクトセンターの構築をハンズオンで体験する方法を解説します。"
  "5582c78ff30a9081a59bb1a5f04d21de":
    "id": "5582c78ff30a9081a59bb1a5f04d21de"
    "title": "AWS Customer Incident Response Team (CIRT) のご紹介: セキュリティイベント発生時の支援と公開リソース"
    "link": "https://aws.amazon.com/jp/blogs/news/welcoming-the-aws-customer-incident-response-team/"
    "published": "2026-10-14 09:47:20"
    "fetched": "2026-10-14 14:44:39"
    "summary": "私たち AWS Customer Incident Response Team (CIRT) は、AWS 責任共有モデルにおけるお客様の責任範囲で進行中のセキュリティイベントへの対応を支援する、24 時間 365 日体制のグローバルチームです。この記事では、AWS CIRT の支援範囲と支援の依頼方法をご紹介します。また、脅威アクターによる AWS 固有の戦術、手法、手順 (TTPs) をまとめた Threat Technique Catalog for AWS (TTC) や、インシデントレスポンスに役立つオープンソースツール、ワークショップなどの公開リソースも取り上げます。"
  "5afb97e908fe57a3fee9b90783a5ff0b":
    "id": "5afb97e908fe57a3fee9b90783a5ff0b"
    "title": "EC2 インスタンス構成証明でセルフマネージド型データベースのゼロオペレーターアクセス (ZOA) を実現"
    "link": "https://aws.amazon.com/jp/blogs/news/zero-operator-access-for-self-managed-databases-using-ec2-instance-attestation/"
    "published": "2026-10-14 09:39:34"
    "fetched": "2026-10-14 14:44:39"
    "summary": "この記事では、Amazon EC2 インスタンス構成証明、NitroTPM、Attestable AMI を使用して、セルフマネージド型データベースでゼロオペレーターアクセス (ZOA) を実現する方法を説明します。Nix Flakes で再現可能な AMI をビルドして PCR 測定値を算出し、AWS KMS キーポリシーの条件に設定します。これにより、LUKS で暗号化された EBS ボリュームを、正しい AMI で起動したインスタンスでのみ復号できるようにします。PostgreSQL を例に、dm-verity やセキュアブートを組み合わせたブート時の信頼チェーンも詳しく解説します。"
  "e378afed840d3e47386f652764658e7a":
    "id": "e378afed840d3e47386f652764658e7a"
    "title": "L1TF Reloaded に対する Amazon EC2 の防御の仕組み"
    "link": "https://aws.amazon.com/jp/blogs/news/ec2-defenses-against-l1tf-reloaded/"
    "published": "2026-10-14 09:32:18"
    "fetched": "2026-10-14 14:44:39"
    "summary": "一時的実行攻撃「L1TF Reloaded」は、ハーフ Spectre ガジェットと L1TF を組み合わせてゲストデータを漏洩させます。しかし、AWS Nitro System と Nitro Hypervisor を使用するお客様のゲストデータは影響を受けず、追加の対応も不要です。本記事では、攻撃の仕組みを解説します。さらに、XPFO の概念に基づくシークレットハイディングやゲスト CPU コンテキストの保護など、Nitro Hypervisor の多層防御の設計も詳しく説明します。"
