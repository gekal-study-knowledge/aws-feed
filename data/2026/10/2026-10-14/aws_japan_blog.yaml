  "b4efd88d045ea52d5478437e90e47596":
    "id": "b4efd88d045ea52d5478437e90e47596"
    "title": "Aurora DSQL で外部キー制約を使う"
    "link": "https://aws.amazon.com/jp/blogs/news/working-with-foreign-key-constraints-in-aurora-dsql/"
    "published": "2026-10-14 18:06:37"
    "fetched": "2026-10-14 20:05:05"
    "summary": "Amazon Aurora DSQL は外部キー制約をサポートしており、行レベルのロックを使わずに参照整合性をデータベース側で保証できます。本記事では、外部キー制約の定義、即時チェックと遅延チェック、ダウンタイムなしでの制約の追加、OCC による競合解決の仕組み、スケールを考慮した FK 設計とリトライロジックを説明します。"
  "a4e887ade00cddecb0db7d707734f2d9":
    "id": "a4e887ade00cddecb0db7d707734f2d9"
    "title": "AWS STS のセッショントークンのサイズ制限を簡素化、サイズのモニタリングにも対応"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-sts-simplifies-session-token-size-limits-and-adds-session-token-size-monitoring/"
    "published": "2026-10-14 17:04:08"
    "fetched": "2026-10-14 20:05:05"
    "summary": "AWS STS のセッショントークンのサイズ制限が 4,096 バイトの単一の制限に簡素化され、セッションポリシーとセッションタグに使用できる容量が拡大しました。トークンサイズは API レスポンス、Amazon CloudWatch メトリクス、AWS CloudTrail イベントで報告されます。また、MinimumSessionTokenSize パラメータを使用して、インフラストラクチャが処理できるトークンの最大サイズを検証できます。この記事では、変更点と影響に加え、ロードバランサーやデータベースなどトークンを扱うシステムで推奨される対応を説明します。"
  "9b6702211474e735e40ad02b62aeea1a":
    "id": "9b6702211474e735e40ad02b62aeea1a"
    "title": "AWS で本番 AI エージェントを構築する: 6つの柱によるウォークスルー"
    "link": "https://aws.amazon.com/jp/blogs/news/building-a-production-ai-agent-on-aws-a-six-pillar-walkthrough/"
    "published": "2026-10-14 16:55:51"
    "fetched": "2026-10-14 20:05:05"
    "summary": "AI エージェントをデモから本番運用へ進めるには、何が必要でしょうか。本記事では、自動車工場の部品在庫エージェントを例に、Build (構築)・Test (テスト)・Run (実行)・Secure (セキュリティ保護)・Observe (観測)・Govern (ガバナンス) の6つの柱を順に解説します。Amazon Bedrock AgentCore や Guardrails、Evaluations、Cedar ポリシーを使った実装方法を紹介します。"
