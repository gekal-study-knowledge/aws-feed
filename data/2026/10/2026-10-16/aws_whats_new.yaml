"entries":
  "8becf5b0a112a1bb2c44f58a9829e8d2":
    "id": "8becf5b0a112a1bb2c44f58a9829e8d2"
    "title": "Amazon SageMaker Studio simplifies getting started for new AI/ML builders with new sign-in options"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/sagemaker-studio-new-sign-in-options/"
    "published": "2026-10-16 05:10:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Amazon SageMaker Studio now lets new customers sign up with their Google, GitHub, or Apple credentials and land inside a fully configured Studio environment - no traditional AWS account setup and no console navigation required.</p>\n<p>Previously, new customers who discovered a model on Hugging Face or an AWS product page had to complete a multi-step AWS account creation process, provide a credit card, navigate the AWS Console to find SageMaker AI, configure an environment, and set up IAM permissions before they could begin working. With earlier launches, we reduced environment setup to twenty seconds, pre-configured model customization permissions, and introduced deep links from Hugging Face and AWS product pages so customers could land directly inside Studio with a model pre-loaded. Now, with new sign-in options, customers complete a simplified sign-up using an existing identity, receive free credits as part of the AWS Free Tier with no credit card required in most cases, and arrive inside a ready-to-use SageMaker Studio environment where they can immediately fine-tune, evaluate, and deploy foundation models. Customers can invite team members by email, and collaborators sign in with their own email credentials to access the shared Studio environment, including shared models, notebooks, and endpoints without configuring IAM users or permissions. When a project grows beyond free credits, customers can upgrade to a paid plan and set a spend limit to stay within budget. Verified customers continue to receive default GPU access to G5, G6, G6e, and G4dn instances across endpoint deployments, training jobs, and notebooks without requesting quota increases.</p>\n<p>This feature is available in all AWS Commercial Regions where Amazon SageMaker Studio is supported. To get started, visit any supported model on <a href=\"https://huggingface.co/models\"><u>Hugging Face</u></a> and select \"Customize and Deploy on SageMaker AI\" or \"Deploy on SageMaker AI,\" or click Get Started from the <a href=\"https://aws.amazon.com/sagemaker/ai/studio/\"><u>SageMaker Studio</u></a> page. To learn more, see the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/sign-in-new.html\"><u>AWS sign-up documentation</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html\"><u>SageMaker Studio setup guide</u></a>.</p>"
  "fcfd223c20fa0e12e2ac1bdab1e1865b":
    "id": "fcfd223c20fa0e12e2ac1bdab1e1865b"
    "title": "Amazon EC2 T8i instances are now available in South America (São Paulo)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/ec2-t8i-instances-south-america/"
    "published": "2026-10-16 05:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) T8i instances are now available in South America (São Paulo). These instances are powered by custom sixth generation Intel Xeon 6 processors, available exclusively on AWS, and built on the latest sixth generation AWS Nitro cards. T8i instances deliver up to 30% better price performance compared to previous generation T3 instances, and offer four sizes: nano, micro, small, and medium. These instances are designed for workloads requiring low to moderate CPU utilization, including data processing, login gateways, small databases, batch processing, event driven functions, CI/CD pipelines, microservices, and low traffic websites.\n <br />\n <br />\n T8i instances deliver up to 70% higher compute performance, 1.25x higher network bandwidth, and 2.4x higher EBS bandwidth compared to T3 instances. They use the same CPU credit system as T3 with Standard and Unlimited modes, so existing T3 customers can upgrade to T8i and immediately benefit from better price performance, enabling them to lower their TCO. For customers new to AWS or migrating from on-premises, T8i instances provide one of the most cost-effective entry points to run a variety of workloads.\n <br />\n <br />\n T8i.micro and T8i.small are available under the <a href=\"https://aws.amazon.com/free/\">AWS Free Tier</a>. T8i instances are available in US East (N. Virginia, Ohio), US West (Oregon, N. California), Europe (Frankfurt, Ireland, London, Paris), Asia Pacific (Hyderabad, Malaysia, Mumbai, Seoul, Singapore, Sydney, Tokyo), Canada (Central) and South America (São Paulo) regions. T8i instances are available to purchase via On-Demand instances, and Spot instances with Savings Plan option coming soon. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/t8i/\">Amazon EC2 T8i instances page</a>.</p>"
  "81a20e60dccd36b9481140aa5d993ee1":
    "id": "81a20e60dccd36b9481140aa5d993ee1"
    "title": "Amazon DynamoDB Streams now supports timestamp-based stream processing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-dynamodb-streams-timestamp-processing"
    "published": "2026-10-16 03:30:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Amazon DynamoDB Streams now supports timestamp-based stream processing, enabling you to begin reading stream records from a specific point in time. Previously, you could only start from the oldest retained record (up to 24 hours old) or from new records written after you start consuming the stream. Now, you can supply a timestamp and begin processing at the first record written at or after that time using the AT_TIMESTAMP shard iterator type.</p>\n<p>Timestamp-based stream processing can be used with the Amazon Kinesis Client Library (KCL) through the DynamoDB Streams Kinesis adapter. It helps you avoid reprocessing entire retained streams or missing records when resuming stream consumption, supporting common use cases such as recovery after an interruption, data replay for debugging and auditing by reading from a specific point in the past, skipping a backlog by resuming from a recent timestamp near the latest records, and synchronizing after a restore by beginning at the export timestamp following a point-in-time recovery (PITR) export.</p>\n<p>Timestamp-based stream processing is available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and the China Regions. There is no additional charge for this feature beyond standard GetRecords API request charges. To get started, see <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Timestamp.html\">Amazon DynamoDB Streams timestamp documentation</a> in the DynamoDB developer guide.</p>"
  "4571896550b9904071745a416609b36c":
    "id": "4571896550b9904071745a416609b36c"
    "title": "AWS Lambda Durable Execution SDK for Go is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-lambda-durable-go-sdk-support/"
    "published": "2026-10-16 03:23:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Today, AWS announces the general availability of the AWS Lambda Durable Execution SDK for Go, enabling Go developers to build resilient, long-running workflows using Lambda durable functions. With this SDK, developers can create multi-step applications like infrastructure automation, deployment rollouts with approval gates, and pipelines that call AI models and pause for human review directly in their Go code without implementing custom progress tracking.</p>\n<p>Lambda durable functions extend Lambda's event-driven programming model with operations that checkpoint progress automatically and pause execution for up to an year when waiting on external events. The AWS Lambda Durable Execution SDK for Go provides a native Go experience for building with Lambda durable functions. It includes steps for progress tracking, callback integration for human and agent-in-the-loop workflows, durable invocation for reliable function chaining, and waits for efficient suspension.</p>\n<p>The SDK works with the Go tools developers already use. Developers add it to a Go module with go get and deploy their function as a single static binary on the provided.al2023 runtime, like any other Go function on Lambda. Before deploying, they can locally test complete workflows on their own machine with the durabletest package, without requiring network access or AWS credentials, and use the durablelint analyzer to catch code that could break a workflow when it resumes.</p>\n<p>To get started, see the Lambda durable functions <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">developer guide</a> and the&nbsp;<a href=\"https://github.com/aws/aws-durable-execution-sdk-go\">AWS Lambda Durable Execution SDK for Go on GitHub</a>. For Regional availability and pricing details for Lambda durable functions, see the AWS Capabilities by Region <a href=\"https://builder.aws.com/build/capabilities?refid=2abe6167-e3db-40c4-a9fa-b283e7b4d7c8\">page</a> and AWS Lambda <a href=\"https://aws.amazon.com/lambda/pricing/\">Pricing</a>.</p>"
  "fb341d34c971f926a47a96b6deff47a2":
    "id": "fb341d34c971f926a47a96b6deff47a2"
    "title": "Muse Spark Open model now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/muse-spark-open-on-sagemaker-jumpstart/"
    "published": "2026-10-16 03:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Meta's Muse Spark Open is now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. This coding-optimized open-weight model from Meta is purpose-built for agentic coding workflows, bringing multi-step reasoning and tool calling to enterprise software engineering on AWS infrastructure.</p>\n<p>Muse Spark Open is designed for long-running coding agents and multimodal engineering workflows. Built on a Mixture-of-Experts (MoE) architecture with 816B total parameters and 42B active per token, it delivers the capacity of a very large network while keeping per-token compute closer to that of a much smaller dense model. The model holds a 1M-token context window, enabling it to ingest an entire project—including dependencies, legacy code, and thousands of files—without splitting tasks into smaller pieces. It accepts text, images, documents, audio, and audio-video as input and generates text output. Trained on real developer workflows such as multi-file refactors and long debugging sessions, it plans, acts, observes results, and self-corrects over long horizons rather than making single tool calls. SageMaker JumpStart offers two variants: BF16 (Muse-Spark-Open-816B-A42B) and NVFP4 quantized (Muse-Spark-Open-816B-A42B-NVFP4), with the NVFP4 variant requiring roughly a quarter of the memory for cost-efficient deployment.</p>\n<p>With SageMaker JumpStart, customers can deploy Muse Spark Open with just a few clicks, with the endpoint running in their own AWS account for full control over source code and prompts.</p>\n<p>To get started with this model, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the model to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "df5f4a211dec78e861b82545fba4fb28":
    "id": "df5f4a211dec78e861b82545fba4fb28"
    "title": "AWS HealthOmics now supports shared VPCs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/omics-workflows-shared-vpcs/"
    "published": "2026-10-16 02:42:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>AWS HealthOmics now supports sharing VPCs across accounts, enabling your workflows to access resources in Amazon Virtual Private Clouds (VPCs) managed by other AWS accounts with AWS Resource Access Manager (RAM).&nbsp;<a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p>\n<p>With shared VPCs, customers can centralize networking administration by sharing subnets and security groups from a single VPC across multiple accounts in their organization, and HealthOmics then places each account's workflows directly into those shared subnets. With cross-account VPC sharing, multiple accounts run inside one centrally managed VPC, instead of duplicating endpoints across VPCs. Workflows in participating accounts can access data privately without separate VPC peering connections or duplicated VPC endpoints. Previously, customers with centralized networking had to create separate AWS PrivateLink VPC endpoints in each VPC and maintain individual route tables using VPC peering. Cross-account VPC sharing reduces infrastructure overhead and simplifies network management for organizations with centralized networking while allowing researchers and developers to run bioinformatics workflows in their own accounts.</p>\n<p>Shared VPCs is available in all Regions where AWS HealthOmics is available: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Singapore, Seoul, Tokyo). To get started, see the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/workflows-vpc-cross-account.html\">AWS HealthOmics User Guide</a>.</p>"
  "c74be957ce30d6181cb306f64e43b42d":
    "id": "c74be957ce30d6181cb306f64e43b42d"
    "title": "Amazon Time Sync Service adds support for microsecond-accurate time on 135 additional EC2 instance types in all commercial regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/time-sync-additional-instances-all-regions"
    "published": "2026-10-16 02:34:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Amazon Time Sync Service introduces support for microsecond-accurate time on 135 additional EC2 instance types—spanning 12 instance families—in all commercial regions. Built on Amazon's proven network infrastructure and the AWS Nitro System, microsecond-accurate time and nanosecond-precision hardware timestamps leverage the reference clocks running in the Nitro System directly, enabling customers to easily order application events, measure 1-way network latency, and increase distributed application transaction speed.</p>\n<p>The newly supported families include eight Gen8 families (C8a, C8i, C8i-flex, C8id, M8i, M8i-flex, R8a, and X8i) and four Gen9 families (C9g, C9gd, M9g, and M9gd).</p>\n<p>Starting today, customers can access microsecond-accurate time on these additional instance types by creating a Precision Time Placement Group (PTPG), a new placement strategy that allows customers to launch instances with Precision Time Protocol hardware clock (PHC) enabled. Customers that require both low network latency as well as precision time can associate a PTPG with their Cluster Placement Group (CPG), so that their low-latency workloads also benefit from microsecond-accurate time.</p>\n<p>For more information, refer to the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configure-ec2-ntp.html#enhanced-amazon-time-sync-service\" title=\"Amazon Time Sync Documentation\">Amazon Time Sync Service documentation</a>.</p>"
  "a7cb633f05d091919d4b4c11651cf484":
    "id": "a7cb633f05d091919d4b4c11651cf484"
    "title": "AWS Transform for full-stack Windows modernization now supports Aurora PostgreSQL cross-region deployment in 7 more Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transform-full-stack-aurora-cross-region"
    "published": "2026-10-16 02:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Today, AWS Transform for full-stack Windows modernization adds support for cross-region deployment of converted Amazon Aurora PostgreSQL databases and is available in seven additional AWS Regions. Together these changes give customers more control over where their modernized databases are deployed after SQL Server modernization, supporting data residency, latency, and disaster recovery requirements.</p>\n<p>Customers can upload SQL Server Database Design Language (DDL) files and set a target AWS Region in the transformation plan to convert the database and deploy the resulting Aurora PostgreSQL cluster to a different AWS Region. The same workflow makes dependent .NET applications PostgreSQL compatible, updating connection strings and <a href=\"http://ADO.NET\" rel=\"noopener noreferrer\" target=\"_blank\">ADO.NET</a> and Entity Framework data-access calls.</p>\n<p>With this expansion, AWS Transform for full-stack Windows modernization is now available in the following Regions:</p>\n<p>US East (N. Virginia), Europe (Frankfurt), Europe (London), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific (Tokyo), Asia Pacific (Sydney), and Canada (Montreal).</p>\n<p>To get started, you can go to <a href=\"https://aws.amazon.com/transform/windows/\" rel=\"noopener noreferrer\" target=\"_blank\"><u>AWS Transform product page</u></a> or see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/windows-full-stack.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>AWS Transform for full-stack Windows documentation</u></a>.</p>"
  "bf51f3162e8d5bb5e7b0efdb2ddb46e6":
    "id": "bf51f3162e8d5bb5e7b0efdb2ddb46e6"
    "title": "Amazon MSK Connect and AWS Glue Schema Registry are now available in the AWS European Sovereign Cloud (Germany) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-msk-connect-aws-gsr-additional-aws-regions"
    "published": "2026-10-16 01:40:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/msk/features/msk-connect/\">Amazon MSK Connect</a> and the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html\">AWS Glue Schema Registry</a> are available in the AWS European Sovereign Cloud (Germany) region. Together with Amazon MSK Standard brokers, already available in the region, these launches give customers running streaming workloads on the AWS European Sovereign Cloud a more complete set of tools to build, connect, and govern their Apache Kafka applications.</p>\n<p>MSK Connect lets you run fully managed Kafka Connect clusters with Amazon MSK - deploy, monitor, and scale connectors that move data between Apache Kafka and external systems like databases, file systems, and search indices, with no infrastructure to provision, automatic scaling, and pay-as-you-go pricing. Complementing it, the <a href=\"https://aws.amazon.com/glue/\">AWS Glue Schema Registry</a>&nbsp;- a serverless, free feature of <a href=\"https://aws.amazon.com/glue/\">AWS Glue</a>&nbsp;- lets you validate and control the evolution of streaming data using Apache Avro, JSON, and Protobuf schemas. Acting as a centralized repository for data format and structure across decoupled applications, it reduces data validation logic, cross-team coordination, and downstream failures, and integrates with C# and Java applications built for <a href=\"https://aws.amazon.com/msk/\">Amazon MSK</a>, <a href=\"https://aws.amazon.com/kinesis/data-streams/\">Amazon Kinesis Data Streams</a>, <a href=\"https://aws.amazon.com/kinesis/data-analytics/\">Amazon Managed Service for Apache Flink</a>, and <a href=\"https://aws.amazon.com/lambda/\">AWS Lambda</a>.</p>\n<p>To get started, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-connect.html\">Amazon MSK Developer Guide</a> and the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/schema-registry-gs.html\">AWS Glue Schema Registry</a> documentation.</p>"
  "a03f1f5c6d618b417e50f20b1547c7fb":
    "id": "a03f1f5c6d618b417e50f20b1547c7fb"
    "title": "PostgreSQL 19 RC1 is now available in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/postgresql-19-rc1-amazon-rds-database-preview-environment/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/postgresql/\" target=\"_blank\">Amazon RDS for PostgreSQL</a> 19 Release Candidate 1 (RC1) is available in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of PostgreSQL 19 on Amazon RDS for PostgreSQL.</p>\n<p>PostgreSQL 19 RC1 focuses on stability, with bug fixes and improvements from the Beta 4 testing period. This release improves error handling for complex text-search expressions, hardens parallel autovacuum, and improves reliability of GIN index maintenance. Refer to the PostgreSQL community announcement for more details.. Refer to the <a href=\"https://www.postgresql.org/about/news/postgresql-19-rc-1-released-3409/\" target=\"_blank\">PostgreSQL community announcement</a> for more details.</p>\n<p>Amazon RDS Database Preview Environment database instances are retained for a maximum period of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots that are created in the Preview Environment can only be used to create or restore database instances within the Preview Environment. You can use the PostgreSQL dump and load functionality to import or export your databases from the Preview Environment. Amazon RDS Database Preview Environment database instances are priced as per the <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" target=\"_blank\">pricing</a> in the US East (Ohio) Region.</p>"
  "a899b3ab4baf79bdd91af32c0548d14e":
    "id": "a899b3ab4baf79bdd91af32c0548d14e"
    "title": "Amazon CloudFront announces dual-stack support for VPC origins"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudfront-vpc-origin-dualstack/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p>Amazon CloudFront now supports end-to-end IPv6 delivery to origins inside your Amazon Virtual Private Cloud (Amazon VPC), with the new dual-stack VPC origins. With VPC origins, customers keep their Application Load Balancers (ALB), Network Load Balancers (NLB), and EC2 instances in private subnets that only their CloudFront distributions can reach. With dual-stack support, customers can now send IPv6 traffic all the way to these private origins to meet their IPv6 architecture and regulatory requirements, without exposing origins to the internet.</p>\n<p>Previously, CloudFront supported dual-stack for public origins but connected to VPC origins over IPv4 only. Customers faced a tradeoff: move origins to public subnets for IPv6 and give up VPC origin security or keep them private and stay on IPv4. Now, with this launch, customers can configure their VPC origins as dual-stack and get end-to-end IPv6 without sacrificing security.</p>\n<p>Dual-stack VPC origins are available in all AWS Commercial Regions where VPC origins are supported. The full list of supported Regions is available <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html#vpc-origins-supported-regions\">here</a>. There is no additional cost for using dual-stack VPC origins. To learn more, visit <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html\">CloudFront VPC origins.</a></p>\n<p>&nbsp;</p>"
  "2c5b24e03e0e18a759859a458d19b3e2":
    "id": "2c5b24e03e0e18a759859a458d19b3e2"
    "title": "Amazon Redshift long-term system table retention with Amazon S3 Tables is now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/redshift-long-term-system-table-retention-expansion/"
    "published": "2026-10-16 00:00:00"
    "fetched": "2026-10-16 06:06:34"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> long-term retention for system table data through native integration with <a href=\"https://aws.amazon.com/s3/features/tables/\">Amazon S3 Tables</a> is now available in additional AWS Regions. With this feature, you can configure your Redshift system table data retention beyond the current 7-day limit to meet your compliance, auditing, and observability requirements. Once enabled, AWS automatically writes system table data to S3 Tables in <a href=\"https://aws.amazon.com/what-is/apache-iceberg/\">Apache Iceberg format</a> and manages partitioning, compaction, and retention.</p>\n<p>Customers use Redshift system tables to monitor query performance, audit data warehouse activity, and meet compliance requirements. With this feature, system table data is replicated automatically, eliminating the need for custom extract transform load (ETL) pipelines and any resource contention with your production workloads. If you operate multiple data warehouses, you can consolidate their system table data into a single location for cross-warehouse observability and analysis. Because the data is stored in the open Apache Iceberg format, you can query it through Redshift, <a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a>, <a href=\"https://duckdb.org/\">DuckDB</a>, or any Iceberg-compatible engine, and build observability dashboards using AWS services or third-party tools without additional operations overhead. Additionally, the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/system-table-skills\">AWS Agent Toolkit</a> provides skills for querying system table data to surface performance insights and optimization recommendations.</p>\n<p>This feature is available for Amazon Redshift Provisioned <a href=\"https://aws.amazon.com/redshift/features/rg/\">RG</a> and <a href=\"https://aws.amazon.com/redshift/features/ra3/\">RA3</a> instances and Amazon Redshift <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Serverless</a> in the following additional AWS Regions: Asia Pacific (New Zealand), Canada West (Calgary), AWS GovCloud (US-East), and AWS GovCloud (US-West). To learn more, visit our <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/system-table-s3-tables.html\">documentation</a> or the <a href=\"https://aws.amazon.com/blogs/big-data/long-term-system-tables-retention-in-amazon-redshift-with-amazon-s3-tables/\">blog</a>.</p>"
  "a12b7ca8519ede8f01a476cdb185af60":
    "id": "a12b7ca8519ede8f01a476cdb185af60"
    "title": "Web Search on Amazon Bedrock AgentCore expands to AWS GovCloud and 3 Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-bedrock-agentcore/"
    "published": "2026-10-16 05:40:00"
    "fetched": "2026-10-16 09:02:24"
    "summary": "<p>Web Search on Amazon Bedrock AgentCore is now available in four additional AWS Regions: US East (Ohio), US West (Oregon), Asia Pacific (Sydney), and AWS GovCloud (US-West). Web Search is a fully managed tool that provides AI agents with current grounding from the web, enabling more accurate and up-to-date responses for tasks such as research, summarization, and question answering.</p>\n<p>With this expansion, customers can build agents that retrieve web information closer to their applications and end users with lower latency. Customers with government workloads can now use Web Search in the AWS GovCloud (US-West) Region to meet compliance and data residency requirements.&nbsp;</p>\n<p>To learn more about Web Search on Amazon Bedrock AgentCore, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-target-connector-web-search-tool.html\">Web Search tool documentation</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">Amazon Bedrock AgentCore pricing</a>. For Region availability, visit <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a>.</p>"
  "000fd5e1fd9371f4231c4db03ab709d9":
    "id": "000fd5e1fd9371f4231c4db03ab709d9"
    "title": "AWS Transform announces Azure-to-AWS cloud-native code conversion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transform-azure-to-aws-code-conversion/"
    "published": "2026-10-16 22:50:00"
    "fetched": "2026-10-17 04:14:39"
    "summary": "<p>Today, AWS announced the general availability of application code conversion from Azure SDK to AWS SDK in AWS Transform, giving you an accelerated path to migrate Microsoft Azure cloud-native .NET applications to AWS. The AWS Transform .NET modernization agent identifies Azure service code and converts it to equivalent AWS service code. For example, an Azure Functions serverless function that uses Azure Cosmos DB can be converted to an AWS Lambda function that uses Amazon DynamoDB.</p>\n<p>AWS Transform discovers the Azure SDK in your submitted source code and presents the conversion options in the assessment report and modernization plan. You can accept the options provided or adjust them based on your preferences before running the modernization. AWS Transform then converts the identified Azure service code to the equivalent AWS SDK calls, and validates that the changes are incorporated into the transformed code. The feature supports conversion of Azure Functions to AWS Lambda functions, Azure Blob Storage to Amazon S3, and Azure Queue Storage to Amazon SQS, with Azure Cosmos DB to Amazon DynamoDB conversion available in preview.</p>\n<p>AWS Transform is available in eight AWS Regions: US East (N. Virginia), Asia Pacific (Mumbai, Tokyo, Seoul, Sydney), Canada (Central), and Europe (Frankfurt, London).</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/dotnet-azure-to-aws.html\">Convert cloud-native code to AWS</a> in the AWS Transform User Guide.</p>"
  "142c7eaf7b993ad5358eb2352c7e52bf":
    "id": "142c7eaf7b993ad5358eb2352c7e52bf"
    "title": "Second-generation AWS Outposts racks now supported in the AWS Mexico (Central) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-outposts-racks-mexico-central/"
    "published": "2026-10-16 17:00:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the AWS Mexico (Central) Region. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.&nbsp;\n <br />\n &nbsp;\n <br />\n Organizations of every size, from startups to enterprises to public sector agencies, can now order Outposts racks connected to this newly supported Region to optimize for latency and data residency needs. This regional expansion provides additional flexibility in the number of AWS Regions that customers’ Outposts can connect to.</p>\n<p>To learn more about second-generation Outposts racks, read the&nbsp;<a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\" style=\"background-color: rgb(255,255,255);\">blog post</a> and the&nbsp;<a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\" style=\"background-color: rgb(255,255,255);\">user guide</a>. For the latest list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, see the <a href=\"https://aws.amazon.com/outposts/rack/faqs/\" style=\"background-color: rgb(255,255,255);\">Outposts rack FAQs page</a>.</p>"
  "8778f68802311c978b3d9e1aa3330096":
    "id": "8778f68802311c978b3d9e1aa3330096"
    "title": "AWS End User Messaging adds registration improvements for faster, higher-quality submissions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-end-user-messaging-adds-registration-improvements-for-faster-higher-quality-submissions"
    "published": "2026-10-16 16:00:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>AWS End User Messaging now makes it easier to complete messaging registrations correctly the first time, with clearer guidance, explicit field requirements, and help avoiding the most common rejection reasons. Registrations ask for compliance evidence such as opt-in proof and sample messages, and submissions are often delayed or denied when that evidence is incomplete or a required field is missed. These improvements give you worked examples, surface exactly which fields you must provide, and walk you through the content that most often causes denials.\n <br />\n <br />\n First, example mock-ups of a compliant opt-in and sample messages are now included for US 10DLC, US short code, US toll-free and RCS registrations, so you can see what a compliant submission looks like before you build your own. Second, the registration API response now surfaces conditional logic, so you and your AI agents no longer have to guess which fields are required based on other field values. The response tells you which fields are required for your specific registration. Third, RCS registration now includes a walkthrough for recording the compliant video that agent registrations require.\n <br />\n <br />\n These improvements are available in all Regions where AWS End User Messaging registrations are available.\n <br />\n <br />\n To learn more and get started, see the End User Messaging <a href=\"https://docs.aws.amazon.com/end-user-messaging/latest/userguide/nx-overview.html\">User Guide</a>.</p>"
  "87a0ac615be9f32db3955a0217b35b2c":
    "id": "87a0ac615be9f32db3955a0217b35b2c"
    "title": "AWS End User Messaging now supports Brand Profiles"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-end-user-messaging-now-supports-brand-profiles"
    "published": "2026-10-16 16:00:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>Today, AWS End User Messaging announces Brand Profiles, which let you store your brand and company information once and reuse it across your messaging registrations. To send messages on SMS, RCS, and WhatsApp, you register your brand with carriers and messaging providers, and today you fill in the same company details, address, contact information, and use case by hand on every form, for each channel and country. That repeated entry slows every new registration, and a typo or other error can get one rejected and delay when you can start sending. With Brand Profiles, you enter this information once and apply it to each new registration, so you register faster and keep your details consistent across channels and countries. You can use Brand Profiles whether you send for your own brand or manage several brands in a single AWS account.\n <br />\n <br />\n When you start a registration with a Brand Profile, the service fills in the matching fields from the information you saved and gives you a draft to review before you submit. By default, it matches standard fields such as company name, tax ID, address, and contact details. You can also turn on smart match, which uses AI to fill in fields even when their names differ. You can build a Brand Profile from scratch or start from your existing registrations.\n <br />\n <br />\n Brand Profiles is available in all commercial AWS Regions where AWS End User Messaging is available.\n <br />\n <br />\n To learn more and get started, see the AWS End User Messaging <a href=\"https://docs.aws.amazon.com/end-user-messaging/latest/userguide/nx-features-brand-profiles.html\">User Guide.</a></p>"
  "044a419213577fa2b23b4994d77f7f94":
    "id": "044a419213577fa2b23b4994d77f7f94"
    "title": "AWS End User Messaging now offers managed OTP verification end-to-end"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-end-user-messaging-adds-end-to-end-managed-OTP"
    "published": "2026-10-16 16:00:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>Today, AWS End User Messaging announces end-to-end managed one-time passcode (OTP) verification in Notify. You get a working OTP solution in under five minutes, including AWS phone numbers and code verification, without setting up a phone number, registering with carriers, or managing how messages are delivered. Before, you generated the passcode yourself and passed it to Notify to send, and you built and maintained the logic to create, store, and expire codes. Now Notify generates the code, delivers it, and verifies the code the recipient enters, so you ship a complete verification flow and skip that work entirely. You can deliver codes over text, voice, and now WhatsApp.\n <br />\n <br />\n You set the rules once in a notify code configuration: the code type, length, how long it stays valid, and how many attempts a recipient gets, along with your templates for each channel. From then on, one call sends a code to a recipient on the channel you choose, and another checks the code they enter.\n <br />\n <br />\n Notify is available in all commercial AWS Regions where AWS End User Messaging is available.\n <br />\n <br />\n To learn more and get started, see the AWS End User Messaging <a href=\"https://docs.aws.amazon.com/end-user-messaging/latest/userguide/nx-notify.html\">User Guide.</a></p>"
  "e8e6382e90c99d1623f9897497422a63":
    "id": "e8e6382e90c99d1623f9897497422a63"
    "title": "AWS End User Messaging adds a guided wizard for RCS registration videos"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-end-user-messaging-adds-guided-wizard-rcs-registration-videos"
    "published": "2026-10-16 16:00:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>Today, AWS End User Messaging adds a wizard that orchestrates the entire video capture for your RCS agent registration. RCS registrations in multiple countries, including the United States, require a screen recording that demonstrates your messaging experience. To record it, you have to send a specific sequence of messages to a test device, and until now you scripted those messages yourself, which easily introduced errors and made a mismatched or incomplete video one of the hardest parts of registering for RCS.\n <br />\n <br />\n The wizard now drives each step of the capture for you, sending the right messages in the right order, so you record a compliant video the first time and get your agent approved sooner. The wizard is on all RCS registration forms that require a video submission.\n <br />\n <br />\n To learn more and get started, see the AWS End User Messaging <a href=\"https://docs.aws.amazon.com/end-user-messaging/latest/userguide/nx-overview.html\">User Guide.</a></p>"
  "ff2aa037c29682e16709e8fea5a82b71":
    "id": "ff2aa037c29682e16709e8fea5a82b71"
    "title": "AWS Transform for migrations is now available in Asia Pacific (Singapore)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transform-singapore"
    "published": "2026-10-16 04:24:00"
    "fetched": "2026-10-17 07:27:14"
    "summary": "<p>AWS Transform for migrations is now available in the Asia Pacific (Singapore) Region, giving customers data residency within the region and lower latency to local source infrastructure as they migrate. <a href=\"https://aws.amazon.com/transform/\">AWS Transform</a> is a collaborative enterprise IT transformation service powered by agentic AI that accelerates cloud migration, application modernization, and continuous tech debt reduction.\n <br />\n <br />\n With AWS Transform for migrations, enterprise IT teams can automate the entire migration lifecycle, from discovery and wave planning through network conversion and launching test and cutover instances, using purpose-built AI agents. The service supports infrastructure migration for workloads from virtually any source, including VMware, Hyper-V, KVM, bare metal, and hybrid environments, unifying teams, tools, and workflows in a single collaborative workbench.\n <br />\n <br />\n To get started, see the AWS Transform <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/\">documentation</a> or visit the AWS Transform <a href=\"https://aws.amazon.com/transform/\">product page</a>.</p>"
"last_updated": "2026-10-17 07:27:14 JST"
