  "a7ae6e666591b8eb316782c2523e4d6f":
    "id": "a7ae6e666591b8eb316782c2523e4d6f"
    "title": "Amazon S3 Access Points で Amazon FSx for NetApp ONTAP 上のデータに AWS サービスからゼロコピーでアクセスする"
    "link": "https://aws.amazon.com/jp/blogs/news/enable-zero-copy-access-to-aws-services-on-amazon-fsx-for-netapp-ontap-with-amazon-s3-access-points/"
    "published": "2026-10-16 09:56:58"
    "fetched": "2026-10-16 14:23:01"
    "summary": "半導体の検証チームが毎晩生成する大量の EDA ログを、データを移動せずに AI で分析するアーキテクチャを紹介します。Amazon S3 Access Points を使って Amazon FSx for NetApp ONTAP 上のログに S3 API でアクセスし、Amazon Bedrock AgentCore と Amazon Quick により、リグレッションテストで失敗した原因の切り分けを自然言語の質問で行います。"
  "14d88bab5a89c8ff040e1acaf5c44503":
    "id": "14d88bab5a89c8ff040e1acaf5c44503"
    "title": "エージェンティック AI への備え: 金融サービスにおけるセキュリティアプローチ"
    "link": "https://aws.amazon.com/jp/blogs/news/preparing-for-agentic-ai-a-financial-services-approach/"
    "published": "2026-10-16 09:07:00"
    "fetched": "2026-10-16 14:23:01"
    "summary": "金融サービスでエージェンティック AI をデプロイするには、AI 固有のリスクに対処する追加のセキュリティ統制が必要です。この記事では、説明可能性と説明責任を支える包括的なオブザーバビリティときめ細かなアクセス制御に焦点を当て、7 つの中核的な設計原則を説明します。さらに、Amazon Bedrock AgentCore や Amazon CloudWatch を活用した監視、最小権限、ガードレール、マルチエージェントワークフローの管理など、規制要件を満たしながら安全に導入するための実装ガイダンスを紹介します。"
  "dc50b0d15d60e08b944a956272b74b29":
    "id": "dc50b0d15d60e08b944a956272b74b29"
    "title": "エージェンティック AI システムのための 4 つのセキュリティ原則"
    "link": "https://aws.amazon.com/jp/blogs/news/four-security-principles-for-agentic-ai-systems/"
    "published": "2026-10-16 09:02:22"
    "fetched": "2026-10-16 14:23:01"
    "summary": "AWS が NIST CAISI の情報提供依頼 (RFI) に提出した回答を基に、エージェンティック AI の 4 つのセキュリティ原則を紹介します。4 つの原則は、セキュアな開発ライフサイクル、従来のセキュリティ制御の継続適用、エージェントの外部に置く決定論的な制御 (セキュリティボックス)、評価に基づく段階的な自律性の拡大です。さらに、Amazon Bedrock AgentCore によるコンピューティングの分離、アイデンティティとアクセス管理、ポリシーの適用、オブザーバビリティといったアーキテクチャの構成要素も説明します。"
  "bd69b6c3ed83c3e314113fb3de380e86":
    "id": "bd69b6c3ed83c3e314113fb3de380e86"
    "title": "AWS での多段階攻撃の検出: サービス横断のシグナル相関分析ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/detecting-multi-stage-attacks-on-aws-a-guide-to-cross-service-signal-correlation/"
    "published": "2026-10-16 17:09:37"
    "fetched": "2026-10-16 19:35:59"
    "summary": "単一のアラートだけでは、多段階攻撃の全体像は見えません。この記事では、Amazon GuardDuty 拡張脅威検出に、データ分類、通常のアクセスパターン、リソースの所有関係、変更ウィンドウといったお客様のビジネスコンテキストを重ね合わせる方法を説明します。CloudTrail、VPC フローログ、Route 53 Resolver クエリログを CloudWatch Logs Insights で相関付ける 4 つのパターンを紹介し、Lambda、Amazon SNS、EventBridge Scheduler を使った相関ルールの自動化手順も解説します。"
  "508e62ba4908d18608019a99a152561c":
    "id": "508e62ba4908d18608019a99a152561c"
    "title": "AWS Security Agent (now part of AWS Continuum) が新たに公開された実在の CVE 37 件中 33 件のエクスプロイトに成功"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-security-agent-now-part-of-aws-continuum-exploited-33-of-37-new-real-world-cves/"
    "published": "2026-10-16 17:09:03"
    "fetched": "2026-10-16 19:35:59"
    "summary": "自律型ペネトレーションテストエージェントである AWS Security Agent (now part of AWS Continuum) を、最近公開された実在の CVE 37 件で評価しました。その結果、37 件中 33 件 (89.2%) で、意図された脆弱性をエンドツーエンドでエクスプロイトしました。本記事では、コンタミネーションを低減した CTF 形式のベンチマークの設計と整合性監査の仕組みを紹介します。あわせて、代表的な攻撃チェーン、誤検知のフィルタリング、ターゲットをダウンさせた失敗事例から得たガードレールの重要性についても説明します。"
