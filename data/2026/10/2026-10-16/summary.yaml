"overview": |
  この日は 36 件で、自律型ペネトレーションテストエージェントの評価結果、エージェンティック AI のセキュリティ原則、セキュリティ速報に加えて、移行支援サービスとメッセージングの機能追加が中心でした。セキュリティブログと日本語ブログの両方で、自律型ペネトレーションテストエージェントである AWS Security Agent (現在は AWS Continuum の一部) を、最近公開された実在の CVE 37 件で評価した結果が公開されました。それぞれをライブ環境としてパッケージし評価したところ、37 件中 33 件 (89.2%) で意図された脆弱性をエンドツーエンドでエクスプロイトしています。記事ではコンタミネーションを低減した CTF 形式のベンチマークの設計と整合性監査についても説明されています。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-110812 はフルマネージドのグラフデータベースである Amazon Neptune の Gremlin グラフインポート経路における信頼できないデータのデシリアライズ (Bulletin ID: 2026-136-AWS、2026 年 10 月 15 日 09:30 PDT 公開)、もう 1 件は KVM ベースのハイパーバイザーに影響する Linux カーネルの virtio-net/TAP ネットワーク経路の問題 (Bulletin ID: 2026-137-AWS、同日 10:30 PDT 公開) です。エージェンティック AI のセキュリティについては、日本語ブログで 2 本が公開されました。1 本は AWS が NIST CAISI の情報提供依頼 (RFI) に提出した回答を基にした 4 つのセキュリティ原則で、セキュアな開発ライフサイクル、従来のセキュリティ制御の継続適用、エージェントの外部に置く決定論的な制御 (セキュリティボックス)、評価に基づく段階的な自律性の拡大が挙げられています。もう 1 本は金融サービスにおけるエージェンティック AI の設計原則 7 つで、説明可能性と説明責任を支える包括的なオブザーバビリティときめ細かなアクセス制御に焦点を当て、Amazon Bedrock AgentCore や Amazon CloudWatch を活用した監視、最小権限、ガードレールを扱います。機械学習ブログでは、エージェントにより多くの自律性を与えながら制御を失わないための AWS の階層的アプローチ「Trust in Depth」(scope・know・bound・observe・prove) が紹介されました。モデルでは、Meta のコーディングに最適化されたオープンウェイトモデル Muse Spark Open が Amazon SageMaker JumpStart で利用可能になり、SageMaker Studio や SDK から自分の AWS アカウント内の SageMaker AI エンドポイントへデプロイできます。日本語ブログでは、Moonshot AI の Kimi K3 が Kiro で利用可能になったことも案内されました。Moonshot AI によれば世界初の 2.8 兆パラメータのオープンウェイトモデルで、100 万トークンのコンテキストウィンドウとトークン効率の高い Mixture-of-Experts 構成をエージェンティックな開発ワークフローの中で直接使えます。検出・調査では、単一のアラートでは多段階攻撃の全体像が見えないという前提で、Amazon GuardDuty 拡張脅威検出にデータ分類・通常のアクセスパターン・リソースの所有関係・変更ウィンドウといったビジネスコンテキストを重ね、CloudTrail・VPC フローログ・Route 53 Resolver クエリログを CloudWatch Logs Insights で相関分析するガイドが公開されました。サービス更新では、Amazon Bedrock AgentCore の Web Search が米国東部 (オハイオ)・米国西部 (オレゴン)・アジアパシフィック (シドニー)・AWS GovCloud (US-West) の 4 リージョンに拡大しました。AWS Lambda Durable Execution SDK for Go が一般提供となり、Go の開発者が Lambda durable functions で回復力のある長時間ワークフローを構築できるようになりました。Amazon DynamoDB Streams はタイムスタンプベースのストリーム処理に対応し、これまで最も古い保持レコードからしか読み始められなかったところを、特定の時点から読み始められるようになりました。Amazon CloudFront は VPC オリジンのデュアルスタック対応により、Amazon VPC 内のオリジンまでエンドツーエンドで IPv6 配信ができるようになり、Amazon Time Sync Service は 12 のインスタンスファミリーにまたがる 135 の EC2 インスタンスタイプで、全商用リージョンにおけるマイクロ秒精度の時刻に対応しました。Amazon Redshift のシステムテーブルデータの長期保持 (Amazon S3 Tables とのネイティブ統合) が追加リージョンで利用可能になり、Amazon RDS Database Preview Environment では PostgreSQL 19 RC1 を評価できるようになりました。AWS HealthOmics は共有 VPC に対応して AWS Resource Access Manager 経由で他アカウントが管理する VPC のリソースにワークフローからアクセスできるようになり、AWS Transform のフルスタック Windows モダナイゼーションは変換後の Amazon Aurora PostgreSQL のクロスリージョンデプロイに対応して 7 リージョンが追加されました。Amazon MSK Connect と AWS Glue Schema Registry が AWS ヨーロッパソブリンクラウド (ドイツ) で利用可能になり、Amazon EC2 T8i インスタンス (第 6 世代のカスタム Intel Xeon 6 プロセッサ搭載) が南米 (サンパウロ) で提供開始、Amazon SageMaker Studio は Google・GitHub・Apple の認証情報での新しいサインイン方法に対応しました。アーキテクチャブログでは、Dynata が AI 支援のコーディングから AI 駆動開発ライフサイクル (AI-DLC) の方法論へ移り、Kiro IDE とあわせて開発ライフサイクル全体に AI を広げた事例が公開されました。日本語ブログではさらに、Amazon S3 Access Points で Amazon FSx for NetApp ONTAP 上のデータに S3 API でゼロコピーアクセスし、半導体の検証チームが毎晩生成する大量の EDA ログを移動させずに Amazon Bedrock AgentCore と Amazon Quick で分析してリグレッションテストの失敗原因を切り分けるアーキテクチャ、Kiro-CLI と AWS MCP Servers で複雑な SAP ランドスケープのネットワークトラブルシューティングを数時間から数分へ短縮するエージェント型のアプローチ (VPC Flow Logs・セキュリティグループ・Transit Gateway を自然言語で診断し CloudTrail で原因特定)、日本通運の AI 搭載型物流 Web アプリ「DCX」によるサプライチェーンの可視化と予測、2026 年 9 月 9 日の経済産業省と NEDO による GENIAC ロボット基盤モデルの研究開発における採択事業者への支援開始、そして Amazon S3 が Vercel Marketplace と v0 by Vercel で利用可能になったことの日本語記事が公開されました。移行支援では、AWS Transform が Azure SDK から AWS SDK へのアプリケーションコード変換を一般提供にしました。.NET モダナイゼーションエージェントが Azure サービスのコードを見つけて同等の AWS サービスのコードへ変換するもので、たとえば Azure Cosmos DB を使う Azure Functions のサーバーレス関数を、Amazon DynamoDB を使う AWS Lambda 関数へ変換できます。あわせて AWS Transform for migrations がアジアパシフィック (シンガポール) で利用可能になり、リージョン内でのデータ所在と移行元インフラへの低遅延が得られるようになりました。メッセージングでは AWS End User Messaging に 4 件の改善が入りました。1 つは登録申請の改善で、適合するモックアップの例示、必須フィールドの明示、却下の原因になりやすい内容の案内によって、オプトインの証跡やサンプルメッセージといったコンプライアンス証跡の不備による遅延や却下を減らします。2 つめは Brand Profiles で、ブランドと会社の情報を一度登録しておけば、チャネルや国ごとの登録申請で同じ会社情報・住所・連絡先・ユースケースを手入力し直す必要がなくなります。3 つめは Notify のエンドツーエンドのマネージド OTP 検証で、電話番号の用意やキャリアへの登録、配信方法の管理なしに 5 分以内で動く OTP の仕組みが得られます。従来は自分でパスコードを生成して Notify に渡し、生成・保存・期限切れのロジックを自作・保守する必要がありました。4 つめは RCS の登録に必要な画面録画を自動で撮るためのウィザードで、テスト端末へ送る一連のメッセージを自前でスクリプト化する必要がなくなります。ハイブリッドでは、第 2 世代の AWS Outposts ラックがメキシコ (中部) リージョンに対応しました。
