    "title": "CVE-2026-110812 - Deserialization of untrusted data in the Gremlin graph-import path in Amazon Neptune"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-136-aws/"
    "published": "2026-10-16 01:41:28"
    "fetched": "2026-10-16 02:58:15"
    "summary": "<p><b>Bulletin ID:</b> 2026-136-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/15/2026 09:30 AM PDT</p>\n<p><b>Description:</b></p>\n<p>Amazon Neptune is a fully managed graph database service. We identified CVE-2026-110812, an issue in Apache TinkerPop related to Gremlin functionality used by Amazon Neptune. Under certain conditions, an authenticated principal with Neptune data-plane (query) permissions could submit a request that causes the query engine to process untrusted input unsafely, which could lead to unintended activity within the query engine environment. This issue has been addressed in the engine versions listed below; we recommend customers upgrade.</p>\n<p><b>Impacted versions:</b> &gt;=1.2.0.0</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "314383bb0758438f62008bd0c0e37ed2":
    "id": "314383bb0758438f62008bd0c0e37ed2"
    "title": "Issue in the Linux kernel virtio-net/TAP networking path affecting KVM-based hypervisors"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-137-aws/"
    "published": "2026-10-16 04:03:20"
    "fetched": "2026-10-16 06:06:36"
    "summary": "<p><b>Bulletin ID:</b> 2026-137-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/15/2026 10:30 AM PDT</p>\n<p><b>Description:</b></p>\n<p>AWS is aware of an issue in the Linux kernel's virtio-net/TAP networking path (CVE-2026-99999) that affects KVM-based hypervisors running unpatched Linux kernel versions 4.4 through 6.18. This issue could allow an actor with privileged access inside a guest virtual machine to send specially crafted network packets that corrupt host kernel memory that could result in disclosure of host memory or a denial of service.</p>\n<p>AWS-managed compute and container services, including Amazon EC2 instances, AWS Lambda, and AWS Fargate, are not affected. There is no action required for customers using these services.</p>\n<p><b>Affected products &amp; versions:</b></p>\n<p>Customers who self-manage virtual machines using virtio-net and KVM, including those using virtual machine monitors such as Firecracker, on hosts running affected, unpatched Linux kernel versions.</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
