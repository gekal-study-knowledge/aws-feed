  "506bdc54c5719087eecaf01cf834cbbd":
    "id": "506bdc54c5719087eecaf01cf834cbbd"
    "title": "AWS License Manager now supports license type conversions for Ubuntu Pro purchased through AWS Marketplace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-license-manager-conversions-ubuntu-pro-marketplace/"
    "published": "2026-10-15 02:04:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p><a href=\"https://aws.amazon.com/license-manager/\">AWS License Manager&nbsp;</a> now supports in-place upgrades for EC2 Ubuntu LTS (Long Term Support) instances to Ubuntu Pro available on AWS Marketplace. This allows customers to strengthen their security posture and meet compliance requirements without rebuilding their fleet or migrating workloads to a new instance or AMI. With an Ubuntu Pro subscription, customers receive security patches for up to 10 years — extendable to 15 years with the Legacy add-on. This coverage extends beyond the base OS to thousands of additional packages, including widely used open-source applications such as NGINX, PostgreSQL, MongoDB, and Redis. Ubuntu Pro also supports Kernel Livepatch, which applies critical kernel security fixes without rebooting to minimize downtime.</p>\n<p>With this launch, customers, who have an existing Canonical Ubuntu Pro subscription through AWS Marketplace, can upgrade directly during the conversion workflow. Customers who do not yet have a subscription can subscribe to Canonical Ubuntu Pro from within the AWS License Manager console. The new feature is available in &nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all commercial regions&nbsp;</a> where AWS License Manager is available.</p>\n<p>To get started, navigate to the &nbsp;<a href=\"https://us-east-1.console.aws.amazon.com/license-manager/home?region=us-east-1#/\">AWS License Manager console&nbsp;</a> and the &nbsp;<a href=\"https://docs.aws.amazon.com/license-manager/latest/userguide/license-asset-groups-overview.html\">AWS License Manager User Guide&nbsp;</a>.&nbsp;</p>"
  "669c40a6246979c0e09b203a4b48fad9":
    "id": "669c40a6246979c0e09b203a4b48fad9"
    "title": "Amazon SageMaker Studio simplifies getting started for new AI/ML builders with social sign-in"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/sagemaker-studio-social-sign-in/"
    "published": "2026-10-15 02:00:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p>Amazon SageMaker Studio now lets new customers sign up with their Google, GitHub, or Apple credentials and land inside a fully configured Studio environment - no traditional AWS account setup, no credit card, and no console navigation required.</p>\n<p>Previously, new customers who discovered a model on Hugging Face or an AWS product page had to complete a multi-step AWS account creation process, provide a credit card, navigate the AWS Console to find SageMaker AI, configure an environment, and set up IAM permissions before they could begin working. With earlier launches, we reduced environment setup to twenty seconds, pre-configured model customization permissions, and introduced deep links from Hugging Face and AWS product pages so customers could land directly inside Studio with a model pre-loaded. Now, with social sign-in, new customers complete a simplified sign-up using an existing identity, receive free credits as part of the AWS Free Tier with no credit card required, and arrive inside a ready-to-use SageMaker Studio environment where they can immediately fine-tune, evaluate, and deploy foundation models. Customers can invite team members by email, and collaborators sign in with their own social credentials to access the shared Studio environment, including shared models, notebooks, and endpoints without configuring IAM users or permissions. When a project grows beyond free credits, customers can upgrade to a paid plan and set a spend limit to stay within budget. Verified customers continue to receive default GPU access to G5, G6, G6e, and G4dn instances across endpoint deployments, training jobs, and notebooks without requesting quota increases.</p>\n<p>This feature is available in all AWS Commercial Regions where Amazon SageMaker Studio is supported. To get started, visit any supported model on <a href=\"https://huggingface.co/models\"><u>Hugging Face</u></a> and select \"Customize and Deploy on SageMaker AI\" or \"Deploy on SageMaker AI,\" or click Get Started from the <a href=\"https://aws.amazon.com/sagemaker/ai/studio/\"><u>SageMaker Studio</u></a> page. To learn more, see the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/sign-in-new.html\"><u>AWS sign-up documentation</u></a> and <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/onboard-quick-start.html\"><u>SageMaker Studio setup guide</u></a>.</p>"
  "f74b65ae3968ead9fe8329a399bb0b0c":
    "id": "f74b65ae3968ead9fe8329a399bb0b0c"
    "title": "AWS HealthOmics introduces resource fallback order for Nextflow workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-healthomics-resource-fallback-for-Nextflow/"
    "published": "2026-10-15 01:00:00"
    "fetched": "2026-10-15 05:24:28"
    "summary": "<p>Today, AWS HealthOmics introduces the resource fallback directive for tasks in your Nextflow workflows, enabling you to define an ordered list of preferred accelerator types, including an option to fallback to CPU instances. Researchers and bioinformaticians can use this directive to reduce time spent diagnosing and resubmitting runs due to accelerator constraints and keep production workflows running. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows. </p>\n<p>With resource fallback for Nextflow workflows, you can prioritize your preferred accelerator for your task. When your preferred accelerator is unavailable, HealthOmics automatically moves through your specified alternatives in the fallback without resubmission. Each accelerator profile has a configurable timeout, giving you control over how long HealthOmics searches for that accelerator before moving to the next. Shorter timeouts help you move quickly through the fallback order, while longer timeouts increase the probability of reserving your preferred accelerator. You can also include a CPU profile as a final fallback to increase the likelihood of your task reserving an instance. </p>\n<p>You can now use resource fallback for Nextflow workflows in all AWS HealthOmics Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Seoul, Singapore, Tokyo). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/advanced-resource-configuration.html\">advanced resource configuration</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/omics/latest/dev/workflow-definition-nextflow.html#workflow-nextflow-directive-fallback\">Nextflow specifics</a> documentation. </p>"
  "6b082918f96723b8082b03bb9a018e0b":
    "id": "6b082918f96723b8082b03bb9a018e0b"
    "title": "ARC Region switch adds four new capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/region-switch-target-health-ssm-lambda/"
    "published": "2026-10-15 02:38:00"
    "fetched": "2026-10-15 08:37:36"
    "summary": "<p>Amazon Application Recovery Controller (ARC) Region switch helps you orchestrate the failover of multi-Region applications to achieve a bounded recovery time during a Regional impairment. Today, Region switch adds four new capabilities: AWS Systems Manager Run Command execution block, payloads for custom action Lambda execution block, service quota parity checks, and wait for target group health feature for compute scaling actions.</p>\n<p><b>AWS Systems Manager Run Command execution block.</b> During failover, you often need to run commands on managed instances and VMs. This execution block lets you invoke Run Command actions on managed instances during failover, with plan evaluation verifying that command documents target valid instances and that IAM permissions are correctly configured.</p>\n<p><b>Payloads for custom action Lambda execution block.</b> ARC Region switch now lets you pass payloads to your custom action Lambda execution block, allowing reusability of your Lambda functions across recovery plans.</p>\n<p><b>Service quota checks.</b> Service quota limits are a common failure mode during recovery. Region switch now verifies quota parity between your primary and standby Region, and automatically submits quota limit increases, reducing the risk of insufficient service quotas during recovery.</p>\n<p><b>Wait for target group health.</b> Amazon ECS service scaling and Amazon EC2 Auto Scaling group execution blocks help you provision compute capacity during recovery, but provisioned capacity may not be ready to serve traffic. The optional wait for target group health feature verifies that your provisioned capacity is ready to serve traffic.</p>\n<p>To get started, see the documentation for <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/ssm-send-command-block.html\">AWS Systems Manager Run Command execution block&nbsp;</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/custom-action-lambda-block.html\">custom action Lambda execution block&nbsp;</a>, <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/working-with-rs-service-quota-checks.html\">Service quota checks&nbsp;</a> and the Wait for target group health for <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/ecs-service-scaling-block.html\">Amazon ECS service scaling execution block&nbsp;</a> and <a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/ec2-auto-scaling-block.html\">Amazon EC2 Auto Scaling group execution block&nbsp;</a>.&nbsp;&nbsp;</p>"
  "1c42f0165d6744b8a3ab5a0e1f965b47":
    "id": "1c42f0165d6744b8a3ab5a0e1f965b47"
    "title": "Amazon CloudWatch announces log routing and chained log parsers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudwatch-pipelines-log-routing/"
    "published": "2026-10-15 07:14:00"
    "fetched": "2026-10-15 11:59:42"
    "summary": "<p>Amazon CloudWatch now supports conditional log routing and chained parsers via pipelines, giving you more control over how log data is transformed and which CloudWatch log group it's sent to. CloudWatch pipelines is a fully managed service that ingests, transforms, and routes telemetry to CloudWatch without managing infrastructure.</p>\n<p>Log pipelines often carry a mix of event types that belong in different places, and individual events can nest one log format inside another. With conditional log routing, you define routes that send each event to a different CloudWatch log group based on conditions evaluated against processed fields, so you can separate events by severity, source, or type and apply the right retention and access controls to each. With chained parsers, you can apply multiple parser processors in sequence, where later parsers consume fields produced by earlier ones. For example, you can parse a JSON envelope first, then apply a Grok parser to a field it extracts. Together, these capabilities let you structure diverse log formats and route them to the right log groups in a single pipeline.</p>\n<p>Conditional routing and chained parsers are available in all commercial AWS Regions where CloudWatch pipelines is generally available. You can configure these capabilities using the AWS Management Console, AWS CLI, or AWS SDKs. To get started, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-pipelines.html\">Amazon CloudWatch pipelines documentation</a>.</p>"
  "1ebad0668b1905d4981e148de159a5e0":
    "id": "1ebad0668b1905d4981e148de159a5e0"
    "title": "AWS Security Hub CSPM now supports the Cyber Risk Institute profile version 2.2"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/security-hub-cspm-cri-profile-v22/"
    "published": "2026-10-15 17:00:00"
    "fetched": "2026-10-16 02:58:13"
    "summary": "<p><a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub CSPM</a> now supports automated security checks that align with the Cyber Risk Institute (CRI) profile. The CRI Profile is a cybersecurity framework developed by the Cyber Risk Institute, a non-profit coalition of financial institutions and trade associations. The framework harmonizes cybersecurity and regulatory expectations that apply to the financial services sector into a common set of requirements, so that an organization can assess itself once and report against multiple regulations. AWS Security Hub CSPM provides 404 controls that support a subset of CRI Profile v2.2 requirements; the controls don't support requirements that require manual checks.</p>\n<p>The new standard is now available in all AWS Regions where Security Hub CSPM is currently available, including the AWS GovCloud (US) and the China Regions. To quickly enable the standard across your AWS environment, we recommend that you use Security Hub central configuration. With this approach, you can enable the standard in all or only some of your organization's accounts and across all AWS Regions that are linked to Security Hub with a single action.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/standards-reference-cri-profile.html\">CRI Profile v2.2</a> in the AWS Security Hub CSPM user guide. To receive notifications about new Security Hub CSPM features and controls subscribe to the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-announcements.html\">Security Hub SNS topic</a>. You can also <a href=\"https://aws.amazon.com/security-hub/cspm/pricing/\">try Security Hub CSPM at no cost for 30 days</a> with the AWS Free Tier offering.</p>"
"last_updated": "2026-10-16 02:58:13 JST"
