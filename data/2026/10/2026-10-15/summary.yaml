"overview": |
  この日は 20 件で、CloudTrail を使ったインシデント調査、Kiro によるセキュリティ運用、そしてセキュリティ速報が中心でした。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-110248 は Amazon SageMaker Python SDK におけるログファイルへの機微な情報の書き出し (Bulletin ID: 2026-134-AWS、2026 年 10 月 14 日 11:30 PDT 公開)、CVE-2026-110310 は Amazon S3 Encryption Client for .NET において古いエンベロープキー形式へのダウングレードを介した RSA PKCS#1 v1.5 のパディングオラクル (Bulletin ID: 2026-135-AWS、同日 12:30 PDT 公開) です。日本のブログでは、AWS CloudTrail を使ったインシデント調査・対応ガイドが 2 部構成で公開されました。パート 1 は AWS の Security Incident Response Team (SIRT) が実践する調査手法を 2 つの実シナリオに沿って紹介するもので、設定ミスのあるクロスアカウントアクセスが悪用されランサムウェアとの関連が疑われる Amazon S3 のデータ侵害を扱います。パート 2 は Web アプリケーションの SSRF 脆弱性を起点に、IMDSv1 からの認証情報窃取、リージョンホッピングを経て Amazon Bedrock が不正使用されたマルチステージ攻撃を CloudTrail のログから分析するもので、userIdentity・readOnly・awsRegion といった注目すべきフィールドとインシデント対応チェックリストが示されています。あわせて、Kiro と Amazon Q Developer で AWS のセキュリティポスチャを強化する 5 つの方法 (ステアリングファイルとルールによる永続的なコンテキストでセキュリティ標準を組み込む、MCP サーバーを活用した AWS Security Hub の検出結果のトリアージ、Infrastructure as Code の修復など) と、Kiro CLI で「AWS セキュリティインシデント対応ガイド」のフレームワークに沿って調査を迅速化する方法 (自然言語のプロンプトで Amazon GuardDuty の検出結果をトリアージし EC2 インスタンスや IAM 権限を分析、隔離用セキュリティグループによる封じ込め、フォレンジックスナップショットによる証拠保全) が公開されました。Kiro IDE と Kiro CLI ではローカルサンドボックスが一般提供となりました。エージェントが実行するコマンドを OS カーネルが強制するサンドボックスで動かし、書き込み先をプロジェクトに限定し、認証情報パスの読み取りを拒否し、ネットワークをドメイン単位で制限するもので、エージェント自体をサンドボックスの外に置く設計の考え方と sandbox.json・permissions の設定が解説されています。セキュリティブログでは、AWS Continuum によってデプロイごとにペネトレーションテストを行うアプローチが紹介されました。CI/CD パイプラインに組み込める従来のセキュリティツール (SAST・SCA・DAST) はパターンやシグネチャから潜在的な問題を指摘するにとどまるという課題意識が背景にあります。サービス更新では、Amazon Application Recovery Controller (ARC) の Region switch に 4 つの新機能が追加され、リージョン障害時にマルチリージョンアプリケーションのフェイルオーバーを所定の復旧時間内に収めるためのオーケストレーションが強化されました。Amazon CloudWatch はパイプラインによる条件付きのログルーティングと連鎖するログパーサーに対応し、ログデータの変換方法と送信先のロググループをより細かく制御できるようになりました。Amazon SageMaker Studio は新規の利用者が Google・GitHub・Apple の認証情報でサインアップし、従来の AWS アカウント設定なしに構成済みの Studio 環境に入れるソーシャルサインインに対応し、AWS License Manager は AWS Marketplace で購入した Ubuntu Pro について EC2 の Ubuntu LTS インスタンスからのインプレースアップグレード (ライセンス種別の変換) に対応しました。AWS HealthOmics は Nextflow ワークフローのタスクに対してリソースのフォールバック順序を指定できるようになり、優先するアクセラレータの種類を順序付きリストで定義できます。機械学習ブログでは、Amazon Bedrock AgentCore を使って業務文書の分類・抽出・検証を行い、人の介入を最小限にしながら学習していく自己改善型のインテリジェントドキュメント処理 (IDP) システムの構築方法が解説されました。コンピュートブログでは、AWS re:Invent 2026 のサーバーレス関連セッションのガイド (新しい AWS Lambda の実行モデル、サーバーレスの新しい消費者としての AI エージェントなど) が公開されています。そのほか日本のブログでは、2026 年 10 月 12 日に発表された AWS Lambda ウェブ関数の日本語記事、2026 年 9 月 24 日開催の Kiro ハンズオン「手を動かして実感する、Kiro が変える開発体験」の資料公開と開催報告 (AWS Workshop Studio の教材から 4 つのラボを選び、仕様駆動開発 (Spec)・Steering・Agent Skills・MCP・Kiro Crew までを扱う)、同日開催の Kiro Meetup #8 の資料公開と開催報告 (前回以降半年間のアップデートと常駐型エージェント基盤 Kiro Crew の仕組みの紹介に続き、三菱電機株式会社・東海旅客鉄道株式会社・株式会社オープンアップシステムが Kiro を組織に広げる工夫を共有)、そして株式会社東京会計パートナーズが株式会社ゼネットと Amazon Bedrock で実現した、事業承継相談の入口を開く生成 AI チャットボットの事例が公開されました。
