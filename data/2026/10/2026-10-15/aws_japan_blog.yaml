  "21defe439fbc9819ad0003b8534ad161":
    "id": "21defe439fbc9819ad0003b8534ad161"
    "title": "AWS Continuum で実現するデプロイごとのペネトレーションテスト"
    "link": "https://aws.amazon.com/jp/blogs/news/penetration-testing-every-deployment-with-aws-continuum/"
    "published": "2026-10-15 17:42:57"
    "fetched": "2026-10-15 22:53:20"
    "summary": "従来は定期的な診断で行われていたペネトレーションテストを、CI/CD パイプラインのデプロイ後ゲートとして組み込む方法を紹介します。AWS Continuum for penetration testing は、直前にデプロイした変更にスコープを限定し、AI エージェントを使用して悪用可能な脆弱性を確認します。そのため、デプロイのたびに高速かつ低コストで実行できます。OIDC フェデレーションによる IAM ロールの設定、GitHub Actions のワークフロー例、レポート専用モードからブロック運用へ移行する際の注意点も説明します。"
