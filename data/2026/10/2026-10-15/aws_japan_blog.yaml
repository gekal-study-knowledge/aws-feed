    "title": "Kiro のローカルサンドボックス: エージェントが実行するコマンドを境界内にとどめる"
    "link": "https://aws.amazon.com/jp/blogs/news/local-sandboxing/"
    "published": "2026-10-15 16:40:28"
    "fetched": "2026-10-15 17:10:48"
    "summary": "Kiro IDE と Kiro CLI で、ローカルサンドボックスが一般提供されました。エージェントが実行するコマンドを OS カーネルが強制するサンドボックスで動かし、書き込み先をプロジェクトに限定し、認証情報パスの読み取りを拒否し、ネットワークをドメイン単位で制限します。本記事では、エージェント自体をサンドボックスの外に置く設計の考え方と、sandbox.json と permissions.yaml による設定方法を紹介します。"
