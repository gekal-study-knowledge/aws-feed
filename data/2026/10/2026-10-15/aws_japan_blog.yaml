  "b21c5718927a25a0d39b0c6a8559ab7f":
    "id": "b21c5718927a25a0d39b0c6a8559ab7f"
    "title": "Amazon Bedrock を使った AWS Systems Manager Session Manager ログの AI による異常検知"
    "link": "https://aws.amazon.com/jp/blogs/news/ai-powered-anomaly-detection-for-aws-systems-manager-session-manager-logs-using-amazon-bedrock/"
    "published": "2026-10-15 22:48:23"
    "fetched": "2026-10-15 22:53:20"
    "summary": "Session Manager のセッションで実行されたコマンドはトランスクリプトとして記録されますが、数百台のノードで毎日数千件になると、SOC チームが手作業で確認することはできません。このブログでは、Amazon Bedrock、AWS Lambda、Amazon S3、Amazon Bedrock AgentCore を使い、セッションの終了時にトランスクリプトを自動で分析して Normal・Suspicious・Critical に分類し、不審なセッションを SOC にメールで通知する仕組みを構築します。分類の基準、CloudFormation テンプレートでのデプロイ手順、セッションの履歴を自然言語で問い合わせる方法を説明し、多層的なセキュリティ戦略の中での位置付けにも触れます。"
  "ac2d4203fb28da90def45692ecd7a0cc":
    "id": "ac2d4203fb28da90def45692ecd7a0cc"
    "title": "Aurora DSQL コンソールと CloudWatch アラームで Amazon Aurora DSQL のコストをモニタリングする"
    "link": "https://aws.amazon.com/jp/blogs/news/monitor-amazon-aurora-dsql-costs-with-the-aurora-dsql-console-and-cloudwatch-alarms/"
    "published": "2026-10-15 18:28:09"
    "fetched": "2026-10-15 22:53:20"
    "summary": "Amazon Aurora DSQL の DPU 料金モデルと、CloudWatch メトリクスと請求額の対応関係を解説します。Aurora DSQL コンソールの Usage and cost パネルでコストを確認する方法、1 時間あたりの DPU 使用量を監視する CloudWatch アラームの設定方法、AWS CloudFormation でアラームをデプロイする方法を紹介します。"
