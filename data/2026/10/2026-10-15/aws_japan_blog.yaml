  "0a8632e5ec11e48da6e1610d082b03d8":
    "id": "0a8632e5ec11e48da6e1610d082b03d8"
    "title": "【資料公開 & 開催報告】Kiro Meetup #8 ～三菱電機・東海旅客鉄道・オープンアップシステムが語る、Kiro を組織に広げる工夫～"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-meetup-20260924-report/"
    "published": "2026-10-15 11:54:36"
    "fetched": "2026-10-15 11:59:43"
    "summary": "アマゾン ウェブ サービス ジャパン（AWS ジャパン）は、2026 年 9 月 24 日に「Kiro Meetup #8」を開催しました。まず AWS から、前回の Kiro Meetup 以降の半年間のアップデートと、常駐型エージェント基盤 Kiro Crew の仕組みを紹介しました。続いて、三菱電機株式会社、東海旅客鉄道株式会社、株式会社オープンアップシステムの皆様に、Kiro を組織に広げる取り組みをライトニングトークでご紹介いただきました。本記事ではその模様をレポートします。"
  "5748783f5abf14e23155c401f8718118":
    "id": "5748783f5abf14e23155c401f8718118"
    "title": "【資料公開 & 開催報告】Kiro ハンズオン「手を動かして実感する、Kiro が変える開発体験」"
    "link": "https://aws.amazon.com/jp/blogs/news/kiro-handson-20260924-report/"
    "published": "2026-10-15 11:54:23"
    "fetched": "2026-10-15 11:59:43"
    "summary": "アマゾン ウェブ サービス ジャパン（AWS ジャパン）は、2026 年 9 月 24 日に Kiro のハンズオンイベント「手を動かして実感する、Kiro が変える開発体験」を開催しました。AWS Workshop Studio の教材から 4 つのラボを選び、Kiro の仕様駆動開発（Spec）、Steering、Agent Skills、MCP、そして Kiro Crew までを、講義とワークショップを交互に進めながら体験いただきました。本記事では当日の模様をレポートします。"
  "7c0b0492d1531854f417ce0ed6a4cbd2":
    "id": "7c0b0492d1531854f417ce0ed6a4cbd2"
    "title": "Kiro CLI でセキュリティ調査を迅速化"
    "link": "https://aws.amazon.com/jp/blogs/news/accelerate-security-investigations-with-kiro-cli/"
    "published": "2026-10-15 11:41:29"
    "fetched": "2026-10-15 11:59:43"
    "summary": "Kiro CLI を使用して、「AWS セキュリティインシデント対応ガイド」のフレームワークに沿ってセキュリティ調査を迅速化する方法を紹介します。自然言語のプロンプトで Amazon GuardDuty の検出結果をトリアージし、EC2 インスタンスや IAM 権限を分析します。さらに、隔離用セキュリティグループによる封じ込め、フォレンジックスナップショットによる証拠保全、AWS CloudTrail ログ分析を進めます。Amazon SNS と Amazon EventBridge による自動アラートの構築や、ステアリングファイルによる再利用可能な調査ワークフローの作成も解説します。"
  "a1876090585e04cadfd0baa3443e8168":
    "id": "a1876090585e04cadfd0baa3443e8168"
    "title": "Kiro と Amazon Q でセキュリティポスチャを強化する 5 つの方法"
    "link": "https://aws.amazon.com/jp/blogs/news/five-ways-to-use-kiro-and-amazon-q-to-strengthen-your-security-posture/"
    "published": "2026-10-15 11:39:51"
    "fetched": "2026-10-15 11:59:43"
    "summary": "この記事では、Kiro と Amazon Q Developer を使用して AWS のセキュリティポスチャを強化する 5 つの方法を紹介します。ステアリングファイルとルールによる永続的なコンテキストでセキュリティ標準を組み込む方法をはじめ、MCP サーバーを活用した AWS Security Hub の検出結果のトリアージ、Infrastructure as Code (IaC) の修復、AWS Well-Architected フレームワークのセキュリティの柱に沿ったレビュー、サービスコントロールポリシー (SCP) の作成を迅速化する手法を説明します。あわせて、人間による検証の重要性と段階的な導入の進め方も解説します。"
  "f83b1b3ab7e434821168f431dd16aa09":
    "id": "f83b1b3ab7e434821168f431dd16aa09"
    "title": "AWS CloudTrail を使ったインシデント調査・対応ガイド – パート 2"
    "link": "https://aws.amazon.com/jp/blogs/news/incident-response-guide-for-aws-cloudtrail-investigations-part-2/"
    "published": "2026-10-15 11:37:35"
    "fetched": "2026-10-15 11:59:43"
    "summary": "本ガイドのパート 2 では、ウェブアプリケーションの SSRF の脆弱性を起点に、IMDSv1 からの認証情報の窃取、リージョンホッピングを経て Amazon Bedrock が不正使用されたマルチステージ攻撃を、AWS CloudTrail のログから分析します。userIdentity、readOnly、awsRegion などの注目すべきフィールドとインシデント対応チェックリストを紹介し、IMDSv2 の強制、最小権限、モデル呼び出しのログ記録といった強化策と、脅威アクターの回避手法も解説します。"
  "7843b50c56f54a528244bbd4a3c9d4e2":
    "id": "7843b50c56f54a528244bbd4a3c9d4e2"
    "title": "AWS CloudTrail を使ったインシデント調査・対応ガイド – パート 1"
    "link": "https://aws.amazon.com/jp/blogs/news/incident-response-guide-for-aws-cloudtrail-investigations-part-1/"
    "published": "2026-10-15 11:35:15"
    "fetched": "2026-10-15 11:59:43"
    "summary": "AWS CloudTrail ログには、疑わしいアクティビティを調査するために必要な証拠が含まれています。このパート 1 では、AWS の Security Incident Response Team (SIRT) が実践する調査手法を、2 つの実際のシナリオに沿って紹介します。1 つは、設定ミスのあるクロスアカウントアクセスが悪用され、ランサムウェアとの関連が疑われる Amazon S3 データ削除に至った事例です。もう 1 つは、多要素認証 (MFA) のないコンソール認証情報が悪用され、AWS CloudFormation と AWS CloudShell で暗号通貨マイニングが行われた事例です。重要なフィールドの読み解き方、調査の優先順位、対応チェックリスト、予防策を解説します。"
