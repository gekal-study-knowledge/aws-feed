  "5e6b47545bf7d62eb2752492966726cb":
    "id": "5e6b47545bf7d62eb2752492966726cb"
    "title": "Amazon Redshift adds support for creating and refreshing Apache Iceberg materialized views"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/redshift-iceberg-materialized-views"
    "published": "2026-10-06 06:57:18"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>Amazon Redshift now supports the creation and refresh of Apache Iceberg materialized views. Materialized views pre-compute expensive joins and aggregations once and store the results in an Apache Iceberg table in Amazon S3 or Amazon S3 table buckets, registered in the AWS Glue Data Catalog. Materialized views are created using familiar SQL — CREATE MATERIALIZED VIEW ... USING ICEBERG and the results are instantly queryable by any Iceberg-compatible engine, including Amazon Athena, Apache Spark on Amazon EMR and AWS Glue, and third-party engines such as Trino, or Snowflake. Redshift keeps them current by recomputing only what has changed with manual incremental refresh, and because the results are Iceberg tables in the Glue Data Catalog, they are governed and discovered like any other catalog table.</p>\n<p>Data teams often build analytics in stages, stitching together different engines to clean and transform raw data before serving it. This adds pipeline orchestration overhead and can introduce semantic differences between engines. Iceberg materialized views deliver value in two ways. First, instead of hundreds of users and teams re-running the same expensive joins and aggregations, and re-scanning source tables on every query, you compute the result once and everyone reads the precomputed table. Second, you can run an end-to-end pipeline using a single engine like Apache Spark and now Amazon Redshift, and every downstream consumer shares the same open result without the overhead of orchestrating multiple engines. Either way, the output is an open Iceberg table that any engine can read without copies or conversion. You can still load these tables into Redshift Managed Storage (RMS) as native RMS materialized views for your most performance-sensitive dashboards.</p>\n<p>You can create Iceberg Materialized Views in any region where Redshift Serverless and provisioned Graviton instances are supported. To learn more, see <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-iceberg.html\">Materialized views stored as Apache Iceberg tables</a> in the Amazon Redshift Database Developer Guide, the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-create-sql-command.html\">CREATE MATERIALIZED VIEW</a> command reference, and the <a href=\"https://aws.amazon.com/blogs/big-data/materialize-once-query-anywhere-introducing-iceberg-materialized-views-in-amazon-redshift/\">Materialize once, query anywhere</a> blog post.</p>"
  "0bf88e9461fdc724d66f12174ae73392":
    "id": "0bf88e9461fdc724d66f12174ae73392"
    "title": "AWS IAM Identity Center now supports network access controls for Identity Store"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-identity-store-network-controls/"
    "published": "2026-10-06 06:00:00"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>AWS IAM Identity Center helps you configure the single sign-on experience for your workforce to AWS accounts and applications. IAM Identity Center now supports network access controls for Identity Store, which stores your users and groups. You can restrict access to the Identity Store API and the SCIM API based on the network that requests originate from. Your custom applications and user provisioning workflows use the Identity Store API to manage and look up users and groups, and your external identity provider uses the SCIM API to synchronize users and groups.</p>\n<p>For the Identity Store API, you can require that requests arrive only through allowed VPC endpoints in your account or organization, or from specific source VPCs. For both APIs, you can allow requests only from specific IP ranges. Within the same configuration, you can apply different restrictions to each API. For example, you can require that Identity Store API requests arrive only through VPC endpoints, while allowing SCIM requests from your external identity provider's published IP ranges.</p>\n<p>Network access controls are optional and turned off by default. Requests that AWS services make on your behalf are exempt. You configure network access controls by using the Identity Store API through the AWS SDKs and AWS CLI. This capability is available in all AWS Regions where IAM Identity Center is offered.</p>\n<p>To learn more about IAM Identity Center, visit the <a href=\"https://aws.amazon.com/iam/identity-center/\">product detail page</a>. To get started with network access controls, see the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/API_UpdateIdentityStore.html\" rel=\"noopener noreferrer\" target=\"_blank\">Identity Store API Reference</a>.</p>"
  "1732d64f2bcbc81eb780c8d249677916":
    "id": "1732d64f2bcbc81eb780c8d249677916"
    "title": "AWS Continuum for Penetration Testing now supports continuous penetration testing integrated directly into your CI/CD pipeline"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-continuum-penetration-testing/"
    "published": "2026-10-06 03:32:00"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>AWS Continuum for Penetration Testing now integrates continuous penetration testing directly into your CI/CD pipeline (public preview)</p>\n<p>AWS Continuum for Penetration Testing (formerly AWS Security Agent) already provides continuous, on-demand penetration testing without the need to contract third-party pentest vendors. Now, in public preview, Continuum for Penetration Testing shifts security testing even further left by integrating directly into your existing CI/CD systems, making penetration testing a deploy-time event.</p>\n<p>Development teams ship code daily, but even with on-demand penetration testing available, security validation often happens outside the deployment workflow. CI/CD integration closes this gap. Developers receive findings, including severity, affected endpoints, and remediation guidance, directly in pipeline output. Non-security changes complete with no meaningful delay, and the pipeline automatically re-tests and verifies fixes after remediation without requiring manual re-triggers.</p>\n<p>Getting started requires no security expertise. An auto-generated pipeline snippet can be pasted into any existing pipeline and is completable in under five minutes. Application context bootstraps automatically on the first run, with no prior full penetration test required.</p>\n<p>Continuous penetration testing is available today. To get started, visit our <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/cicd-pentest.html\">documentation</a>.</p>"
  "2dea45047afa79adc1502c595e67c942":
    "id": "2dea45047afa79adc1502c595e67c942"
    "title": "AWS Advanced Ruby Driver Wrapper is generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-ruby-driver-wrapper-available/"
    "published": "2026-10-06 02:00:00"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>The Amazon Web Services (AWS) Advanced Ruby Driver Wrapper is now generally available for use with <a href=\"https://aws.amazon.com/rds/\" target=\"_blank\">Amazon RDS</a> and <a href=\"https://aws.amazon.com/rds/aurora/\" target=\"_blank\">Amazon Aurora</a> PostgreSQL and MySQL-compatible databases. This advanced database driver reduces RDS Blue/Green switchover, Aurora Global database switchover and database failover times, improving application availability. Additionally, it supports multiple authentication mechanisms for your database, including AWS Secrets Manager authentication, and token-based authentication with AWS Identity and Access Management (IAM).</p>\n<p>The AWS Advanced Ruby Driver Wrapper builds on top of the community <a href=\"https://rubygems.org/gems/pg\" rel=\"noopener noreferrer\" target=\"_blank\">pg</a> (PostgreSQL), and the <a href=\"https://rubygems.org/gems/mysql2\" rel=\"noopener noreferrer\" target=\"_blank\">mysql2</a> (MySQL) drivers to provide enhanced functionality beyond standard database connectivity. The wrapper is natively integrated with Aurora and RDS databases, enabling it to monitor database cluster status and quickly connect to newly promoted writers during unexpected failures that trigger database failovers. Furthermore, the wrapper seamlessly integrates with the ActiveRecord through provided aws_postgresql and aws_mysql2 adapters, so you can enable it without changing your application code.</p>\n<p>The driver is available as an open-source project under the Apache 2.0 license. Refer to the instructions on the <a href=\"https://github.com/aws/aws-advanced-ruby-driver-wrapper\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub repository</a> to get started.</p>"
  "12e4db0bfeda98eddff212b07f7e6dbd":
    "id": "12e4db0bfeda98eddff212b07f7e6dbd"
    "title": "AWS Batch now supports Amazon EKS access entry authentication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-batch-access-entries/"
    "published": "2026-10-06 00:31:00"
    "fetched": "2026-10-06 08:40:07"
    "summary": "<p>AWS Batch now supports Amazon EKS access entry authentication for compute environments. EKS access entries provide an API-driven approach to granting IAM principals access to Kubernetes clusters, complementing the existing <i>aws-auth</i> <i>ConfigMap</i>. AWS Batch can now authenticate to your cluster through the access entry mechanism, simplifying cluster setup and authentication lifecycle management.\n <br />\n <br />\n To get started, use the <i>CreateComputeEnvironment</i> or <i>UpdateComputeEnvironment</i> APIs to set <i>accessEntry.desiredState</i> to ENABLED on all AWS Batch compute environments targeting your cluster. AWS Batch creates one access entry per cluster and associates the <i>AWSBatchClusterPolicy</i> with it. You can configure access entries through the AWS CLI, AWS SDKs, or AWS Management Console.\n <br />\n <br />\n Access entry authentication for AWS Batch on Amazon EKS is now supported in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see Amazon EKS access entry authentication in the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/eks-access-entries.html\">AWS Batch User Guide</a>.</p>"
  "79d0af29a1802475c4bb56ef6dc45f19":
    "id": "79d0af29a1802475c4bb56ef6dc45f19"
    "title": "GLM 5.3 by Z.ai is now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-bedrock-glm-5-3/"
    "published": "2026-10-06 06:42:00"
    "fetched": "2026-10-06 13:38:31"
    "summary": "<p>Amazon Bedrock now supports GLM 5.3 from Z.ai, giving you a powerful new option for agentic coding and long-horizon software engineering work. Customers using GLM 5.3 on Amazon Bedrock have access to the latest open weight model with the AWS security and compliance posture.</p>\n<p>GLM 5.3 is Z.ai’s flagship model, a mixture-of-experts architecture with 753B total parameters and roughly 40B active per token, built on the same base model as GLM 5.2 with all improvements driven by scaled post-training. It combines a 1-million-token context window with up to 128K output tokens, and reasoning is always enabled with selectable effort levels so you can trade latency and token consumption against task performance.</p>\n<p>Bedrock support for GLM 5.3 includes explicit prompt caching with cache points on system prompts and messages, helping you reduce latency and input costs when reusing context across model calls.</p>\n<p>GLM 5.3 is available to eligible enterprise customers, and is accessible through the US and Global cross-Region inference profiles. To get started with GLM 5.3, you can access the model in the<a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-zai-glm-5-3.html\">Amazon Bedrock documentation</a>. To learn more, read the launch <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-glm-5-3-on-amazon-bedrock/\">blog post</a>.</p>"
  "6c506739e4c3798e43b74e7d567215fc":
    "id": "6c506739e4c3798e43b74e7d567215fc"
    "title": "AWS Client VPN now supports device posture assessment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-client-vpn-device-posture/"
    "published": "2026-10-06 02:00:00"
    "fetched": "2026-10-06 13:38:31"
    "summary": "<p>AWS Client VPN now supports device posture assessment, allowing you to verify that connecting user devices meet your security and compliance requirements before granting network access. This feature integrates with your existing device posture providers, so only trusted, compliant devices can access your AWS resources through Client VPN.</p>\n<p>Previously, Client VPN authenticated users through certificates, SAML, or Active Directory. With device posture assessment, you can now also integrate &nbsp;<a href=\"https://www.crowdstrike.com/\">CrowdStrike&nbsp;</a>, &nbsp;<a href=\"https://www.jamf.com/\">Jamf&nbsp;</a>, or &nbsp;<a href=\"https://jumpcloud.com/\">JumpCloud&nbsp;</a> with Client VPN to automatically evaluate device security signals such as compliance scores, encryption status, and risk level before allowing a connection. You define these requirements using &nbsp;<a href=\"https://cedarpolicy.com/\">Cedar policies&nbsp;</a>, giving you fine-grained control over which devices can connect. To help you author and validate these policies, Client VPN provides you a Test Policy tool that guides you through creating Cedar policies for your device posture requirements.</p>\n<p>This feature continuously re-evaluates device compliance during active sessions, and automatically disconnects a session if a device falls out of compliance, such as when risk score or security settings change. You can also use this feature in monitoring-only mode, which logs posture evaluation results without disconnecting sessions, so you can assess the impact of your policies before enforcing them. Device posture assessment works alongside your existing authorization rules to provide defense in depth.</p>\n<p>This feature is available in all AWS Regions where AWS Client VPN is available, at no additional cost. This feature requires AWS VPN Client version 6.2.0 or later.</p>\n<p>To learn more about Client VPN:</p>\n<ul>\n <li>Visit the AWS Client VPN &nbsp;<a href=\"https://aws.amazon.com/vpn/client-vpn/\">product page</a></li>\n</ul>\n<ul>\n <li>Download the &nbsp;<a href=\"https://aws.amazon.com/vpn/client-vpn-download/\">AWS VPN Client</a></li>\n</ul>\n<ul>\n <li>Read the AWS Client VPN &nbsp;<a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html\">administrator guide</a></li>\n</ul>\n<ul>\n <li>Read the AWS Client VPN &nbsp;<a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-user/client-vpn-user-what-is.html\">user guide</a></li>\n</ul>"
"last_updated": "2026-10-06 13:38:31 JST"
