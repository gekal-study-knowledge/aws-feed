"overview": |
  この日は 23 件で、Redshift の Iceberg マテリアライズドビュー、AWS Continuum の自律的なコードセキュリティ、そしてデジタル主権向けの新しい Well-Architected レンズが中心でした。分析では、Amazon Redshift が Apache Iceberg マテリアライズドビューの作成と更新に対応しました。コストの高い結合や集計を一度だけ事前計算し、その結果を Amazon S3 上の標準的な Apache Iceberg テーブルとして格納できるため、Amazon Athena・Apache Spark・AWS Glue といった Iceberg 互換エンジンから、コピーや別のパイプラインを用意せずに同じ事前計算済みの結果を使えます。日本語でも「一度作れば、どこでも使える」として紹介されました。モデルでは、Z.ai の GLM 5.3 が Amazon Bedrock で一般提供となりました。コーディングと長期にわたるエージェント的なタスク向けに作られた 7,530 億パラメータの Mixture-of-Experts モデルで、OpenAI 互換 API からの呼び出し方法も解説されています。セキュリティでは、AWS Continuum が自律的なコードセキュリティの新しい基準を示す記事が公開されました。AI モデルの能力が上がるほど、より多くの脆弱性とより巧妙な悪用経路が見つかるようになり、防御側に求められる対応速度も上がるという問題意識が背景にあります。あわせて AWS Continuum for Penetration Testing (旧 AWS Security Agent) が、継続的なペネトレーションテストを CI/CD パイプラインへ直接組み込めるようになりました (パブリックプレビュー)。AWS IAM Identity Center は Identity Store に対するネットワークアクセス制御に対応し、AWS Client VPN はデバイスポスチャ評価に対応して、接続しようとする端末がセキュリティとコンプライアンスの要件を満たしていることをネットワークアクセス付与の前に確認できるようになりました。アーキテクチャブログでは、AWS Digital Sovereignty Lens が Well-Architected Framework の新しいレンズとして公開され、デジタル主権の要件を踏まえた設計の指針が示されました (2026 年 10 月に内容が見直し・更新されています)。機械学習ブログでは、マルチエージェントシステムが流暢な応答以上の保証 (正しいツールの選択、制約の遵守、意思決定の説明) を必要とすることを前提に、Strands ベースのマルチエージェント構成を Amazon Bedrock AgentCore で説明可能性と有用性の観点から評価する方法が解説されました。あわせて、Anthropic の Claude Opus 5.5 と Claude Sonnet 5.5 が AWS GovCloud (US) リージョンの Amazon Bedrock で利用できることを踏まえ、規制対象ワークロードで Claude Code を使う方法、LangChain と Amazon Bedrock Managed Knowledge Base でエージェント型の検索 (agentic retrieval) を組み、単発の検索では扱いづらい複数の要素を含む質問に対応する RAG アプリケーションの構築方法、そして Amazon SageMaker の最適化された生成 AI 推論が Agent Toolkit for AWS 経由で aws-ai-ml スキルを提供し、Kiro・Claude Code・Codex といったコーディングエージェントに推論まわりの深い知識を与えるという新しいエージェントスキルが紹介されました。Amazon Quick については、エージェント・アクションコネクタ・ナレッジベース・フロー・スペースといったリソースを開発アカウントから本番アカウントへ昇格させる作業を自動化し監査可能にする方法と、Admin や Author から Reader へユーザーロールを下げる 2 つの確実な手順 (手動での削除・再作成と AWS CLI を使う方法) が解説されています。コンピュートブログでは、EC2 AMI Tag Sharing が紹介されました。AMI の所有者が ec2:SharedTag/ プレフィックスを使い、そのイメージにアクセスできる任意のアカウントとタグを共有できる機能で、更新は自動的に伝播し独自の複製ワークフローは不要です。サービス更新ではさらに、Amazon EKS Auto Mode が高度なコンピュート設定に対応し、NodeClass リソースの新しい advancedCompute フィールドで kubelet の設定・Linux カーネルの sysctl・hugepages を直接調整できるようになりました。CI/CD パイプラインでの rootless なコンテナビルド向けのユーザー名前空間、ディスクとメモリ圧迫からノードを守る退避しきい値とコンテナログローテーション、大規模クラスター向けのネットワークと ARP キャッシュ上限の引き上げ、HPC・データベース・レイテンシー重視のワークロード向けの 2Mi または 1Gi の hugepages 事前割り当てを Kubernetes API から宣言的に設定できます。AWS Batch は Amazon EKS のアクセスエントリー認証に対応し、AWS Advanced Ruby Driver Wrapper が Amazon RDS と Amazon Aurora の PostgreSQL / MySQL 互換データベース向けに一般提供となりました。ニュースブログでは、OpenAI を基盤とする Amazon Bedrock Managed Agents のパブリックプレビュー (OpenAI の Agents API を AWS ネイティブに作り替え AWS のリソースと統合したもの)、第 3 四半期のサービス提供状況の更新、Kiro workflows などを扱う週刊まとめ (2026 年 10 月 5 日) が公開されました。日本のブログでは、AI でアプリケーション移行を進める「AI Modernization Flow」の公開、AWS Mainframe Modernization Day Tokyo 2026 の開催報告 (AWS のデータセンター、AWS Nitro System、セキュリティ、レジリエンシー、運用高度化、生成 AI デモの 6 セッション)、AWS Skill Builder に中級コース「SAP Generative AI on AWS (Level 200)」が追加されたこと (90 分・4 モジュール、AWS SDK for SAP ABAP・Amazon Bedrock AgentCore・Amazon Quick・Strands Agents などを扱う)、そしてイージャイズ株式会社 (旧ルミーズ株式会社) が決済端末のリモートキーインジェクション基盤に AWS Payment Cryptography を採用し、鍵の注入と復号を一元化して HSM 運用の負荷を大幅に削減した事例が公開されました。
