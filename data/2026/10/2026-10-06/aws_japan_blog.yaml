    "title": "一度作れば、どこでも使える – Amazon Redshift の Iceberg マテリアライズドビューの紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/materialize-once-query-anywhere-introducing-iceberg-materialized-views-in-amazon-redshift/"
    "published": "2026-10-06 13:23:01"
    "fetched": "2026-10-06 13:38:32"
    "summary": "Amazon Redshift で Iceberg マテリアライズドビューが利用可能になりました。コストの高い結合や集計を一度計算し、その結果を Amazon S3 上の標準的な Apache Iceberg テーブルとして格納できます。Amazon Athena、Apache Spark、AWS Glue などの Iceberg 互換エンジンから、コピーや別パイプラインなしに同じ事前計算済みの結果を直接クエリ可能です。"
  "bf66f0b71392f2b68c42bfd7ea2fdc87":
    "id": "bf66f0b71392f2b68c42bfd7ea2fdc87"
    "title": "SAP Generative AI on AWS コースが AWS Skill Builder で受講可能に"
    "link": "https://aws.amazon.com/jp/blogs/news/sap-generative-ai-on-aws-course-now-on-aws-skill-builder/"
    "published": "2026-10-06 10:23:57"
    "fetched": "2026-10-06 13:38:32"
    "summary": "AWS Skill Builder に新しい中級コース「SAP Generative AI on AWS (Level 200)」が登場しました。90分・4モジュール構成で、SAP 環境と AWS の生成 AI サービスを結び付ける設計・実装・最適化を学べます。AWS SDK for SAP ABAP、Amazon Bedrock AgentCore、Amazon Quick、Strands Agents SDK などを用いたエージェント型 AI や、Well-Architected Generative AI Lens に基づくベストプラクティスを扱います。SAP ソリューションアーキテクトや AWS 専門家に最適な内容です。"
  "845f53e70ddc6a2bf8a9a7cbca9ec585":
