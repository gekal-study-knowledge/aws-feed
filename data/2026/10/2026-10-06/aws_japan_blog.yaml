    "title": "AWS Mainframe Modernization Day Tokyo 2026【開催報告】"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-m2-day-20260917-report/"
    "published": "2026-10-06 08:46:06"
    "fetched": "2026-10-06 13:38:32"
    "summary": "本ブログは、AWS Mainframe Modernization Day Tokyo 2026 の内容をレポートしています。AWS のデータセンター、AWS Nitro System、セキュリティ、レジリエンシー、運用高度化、生成 AI デモという 6 つの技術セッションを通じて、メインフレームが 50 年にわたり支持されてきた信頼性・安全性・運用安定性を AWS が最新のクラウドアーキテクチャでどのように再現するかを体系的に紹介しました。"
