  "86c828b2f22e8234216ca3be81bc368b":
    "id": "86c828b2f22e8234216ca3be81bc368b"
    "title": "Supercharge regulated workloads with Claude Code and Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/supercharge-regulated-workloads-with-claude-code-and-amazon-bedrock/"
    "published": "2026-10-06 02:25:20"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Anthropic Claude Opus 5.5 and Claude Sonnet 5.5 are available on Amazon Bedrock in the AWS GovCloud (US) Regions. Learn how to use them with Claude Code, Anthropic's agentic coding tool, for compliance-aligned, AI-assisted development on regulated and ITAR workloads."
  "37e39b44a8205604106085bed2e49360":
    "id": "37e39b44a8205604106085bed2e49360"
    "title": "New agent skill: Amazon SageMaker optimized generative AI inference for your coding agent"
    "link": "https://aws.amazon.com/blogs/machine-learning/new-agent-skill-amazon-sagemaker-optimized-generative-ai-inference-for-your-coding-agent/"
    "published": "2026-10-06 02:23:19"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Amazon SageMaker optimized generative AI inference introduces the aws-ai-ml skill through the Agent Toolkit for AWS, giving coding agents like Kiro, Claude Code, and Codex deep expertise in inference optimization and benchmarking. Describe what you want, and your agent generates executable SageMaker Python SDK v3 code to benchmark, recommend, and compare deployments."
  "39152ff332597105e2f5efd9dd1169cf":
    "id": "39152ff332597105e2f5efd9dd1169cf"
    "title": "Making Amazon Quick enterprise-ready: Automated, auditable cross-account resource promotion"
    "link": "https://aws.amazon.com/blogs/machine-learning/making-amazon-quick-enterprise-ready-automated-auditable-cross-account-resource-promotion/"
    "published": "2026-10-06 00:56:28"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Promoting Amazon Quick resources (agents, action connectors, knowledge bases, flows, and spaces) from a development to a production AWS account has been a manual, error-prone chore. This post shows how to automate cross-account promotion with an idempotent, auditable MCP server on Amazon Bedrock AgentCore."
  "ade3815c86890c81c5d9a9d53ac35a50":
    "id": "ade3815c86890c81c5d9a9d53ac35a50"
    "title": "Agentic retrieval with LangChain and Amazon Bedrock Knowledge Bases"
    "link": "https://aws.amazon.com/blogs/machine-learning/agentic-retrieval-with-langchain-and-amazon-bedrock-knowledge-bases/"
    "published": "2026-10-06 00:53:56"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Build a Retrieval Augmented Generation (RAG) application on Amazon Bedrock Managed Knowledge Base with LangChain, and see how agentic retrieval handles the multi-part questions that single-shot retrieval answers poorly. Run the same query through both paths, read the trace events, and compare what each retrieval path costs."
  "81665c36522908a7eb97aa4cdb995e59":
    "id": "81665c36522908a7eb97aa4cdb995e59"
    "title": "Downgrading user roles in Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/downgrading-user-roles-in-amazon-quick/"
    "published": "2026-10-06 00:51:38"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Amazon Quick doesn't offer a direct console path to downgrade a user from Admin or Author to Reader. This post walks through two reliable methods: a manual delete-and-recreate approach and an AWS CLI step-down sequence that downgrades roles safely while preserving asset ownership."
  "21264d1f545d5a69f81a5d726ff07257":
    "id": "21264d1f545d5a69f81a5d726ff07257"
    "title": "Evaluating multi-agent systems for explainability and helpfulness with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluating-multi-agent-systems-for-explainability-and-helpfulness-with-amazon-bedrock-agentcore/"
    "published": "2026-10-06 00:50:01"
    "fetched": "2026-10-06 02:47:59"
    "summary": "Multi-agent systems need deeper guarantees than fluent responses: they must select the right tools, respect constraints, and explain their decisions. Learn how to build a Strands-based multi-agent supply chain decisioning system and evaluate it with Amazon Bedrock AgentCore Evaluations using built-in, custom, and explainability evaluators."
