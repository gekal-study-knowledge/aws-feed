  "b8dc41d80dcd08585bbf2784b61c15b6":
    "id": "b8dc41d80dcd08585bbf2784b61c15b6"
    "title": "OpenAI GPT-6.1 Terra is now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-6-1-terra-on-amazon-bedrock/"
    "published": "2026-10-27 03:27:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>Today, AWS announces the general availability of OpenAI GPT-6.1 Terra on Amazon Bedrock. GPT-6.1 Terra expands the GPT-6 family with a balance of capability, speed, and cost efficiency for everyday workloads.&nbsp;</p> \n<p>As the newest model in the Terra line, GPT-6.1 Terra combines detailed visual reasoning, accurate computer use, and improved factuality and natural writing over GPT-5.6 Terra, for complex workflows. In OpenAI’s Agents’ Last Exam evaluation, it scored 15 percentage points higher than GPT-5.6 Terra, performed on par with GPT-6 Astra, and completed tasks more than three times faster than GPT-6 Astra and GPT-6.1 Sol. GPT-6.1 Terra offers balanced performance with input and output token prices at least 50% lower than those of GPT-6.1 Sol and GPT-5.6 Terra. It supports a context window of up to 1 million input tokens and accepts both text and image inputs. The Amazon Bedrock inference engine delivers the performance, security, and scale required for enterprise workloads.&nbsp;</p> \n<p>You can call GPT-6.1 Terra directly through Amazon Bedrock APIs or configure ChatGPT Work and Codex to use the model on Amazon Bedrock. Use it to draft proposals, interpret technical drawings, investigate codebases, and build agents that operate across business systems.&nbsp; Established AWS controls help you secure workloads, govern access, and audit model invocation activity.&nbsp;</p> \n<p>You can get started in the Amazon Bedrock console or programmatically through supported Amazon Bedrock APIs. For information about supported AWS Regions, endpoints, APIs, features, inference profiles and pricing, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock documentation.</a> &nbsp;</p>"
  "a38d82f1d205a287a2443fbb36d5cac9":
    "id": "a38d82f1d205a287a2443fbb36d5cac9"
    "title": "Amazon WorkSpaces Core Managed Instances now supports ModifyVolume API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-workspaces-cmi-modifyvolume/"
    "published": "2026-10-27 03:00:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>Amazon WorkSpaces Core Managed Instances now supports the ModifyVolume API, which lets you change volume size, volume type, IOPS, or throughput in place, without detaching the volume or restarting the instance. Previously, changing storage capacity or performance on a deployed managed instance required rebuilding it.</p> \n<p>With ModifyVolume, you can increase volume size up to 16,384 GiB, switch between supported Amazon EBS volume types, adjust IOPS for gp3, io1, and io2 volumes, and modify throughput for gp3 volumes. The API supports idempotency tokens to prevent duplicate changes, and you can track progress with the Amazon EC2 DescribeVolumesModifications operation.</p> \n<p>ModifyVolume is available in all AWS Regions where Amazon WorkSpaces Core Managed Instances is available.</p> \n<p>To get started, call ModifyVolume directly, or use it through your WorkSpaces Core partner solution once available. To learn more, see <a href=\"https://docs.aws.amazon.com/workspaces-instances/latest/api/API_ModifyVolume.html\" rel=\"noopener noreferrer\" target=\"_blank\">ModifyVolume</a> in the WorkSpaces Instances API Reference and <a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html#elastic-volumes-limitations\" rel=\"noopener noreferrer\" target=\"_blank\">Limitations</a> in the Amazon EBS User Guide, or visit <a href=\"https://aws.amazon.com/workspaces/vdi-partners/\" rel=\"noopener noreferrer\" target=\"_blank\">WorkSpaces Core</a>.</p>"
  "690ab4e059bbbf9b4fee65f1f790d447":
    "id": "690ab4e059bbbf9b4fee65f1f790d447"
    "title": "Amazon SageMaker Unified Studio adds light mode support for IDC-based domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/smus-light-mode"
    "published": "2026-10-27 00:32:00"
    "fetched": "2026-10-27 09:12:51"
    "summary": "<p>Today, AWS announces light mode support in Amazon SageMaker Unified Studio for Identity Center (IDC) based domains. Customers can now configure the visual interface mode to match their preference, choosing between dark and light themes. With this launch, customers can set this visual preference in both IAM-based and IDC-based domains.&nbsp;</p> \n<p>Light mode helps improve readability in bright environments and provides a familiar visual experience for customers who prefer lighter interfaces. Combined with the existing dark mode, this update gives you full control over the appearance of your development environment, improving accessibility and reducing eye strain across varying lighting conditions. In SageMaker Unified Studio settings, you can choose 'Customize appearance' under your Profile settings to select between visual modes including dark mode, light mode, and device setting, which matches your operating system's setting. The setting persists across browsers and devices.</p> \n<p>This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/navigating-sagemaker-unified-studio.html#display-mode\">Amazon SageMaker Unified Studio User Guide.</a></p>"
  "53b73b4103d0f73b8ca28d7b4b5ef7b7":
    "id": "53b73b4103d0f73b8ca28d7b4b5ef7b7"
    "title": "Amazon Connect Customer expands testing and simulation to validate flow action outcomes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-validate-flow-actions/"
    "published": "2026-10-27 00:00:00"
    "fetched": "2026-10-27 09:12:51"
    "summary": "<p>Amazon Connect Customer now enables you to validate the outcomes of your customer experience flow actions during testing and simulation. In addition to confirming that an action started, you can now verify the data it returns when it completes, such as a Lambda function response, an Amazon Lex resolved intent, or the variables set by an Agentic CX block. When a test fails, you can pinpoint the exact action that returned an unexpected result instead of tracing it back from a downstream step, so you can resolve issues faster and launch flow changes with greater confidence.</p> \n<p>To learn more about this feature, see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/testing-simulation-observe-block.html\">testing and simulation</a> in the Connect Customer administrator guide. For a complete list of testing and simulation capabilities available by AWS Region, refer to <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html\">Availability of Connect Customer features by Region</a>. To learn more about Amazon Connect Customer, an agentic AI solution that helps enterprises deliver exceptional customer experiences, visit the <a href=\"https://aws.amazon.com/products/connect/customer/\">Amazon Connect Customer website</a>.</p>"
"last_updated": "2026-10-27 09:12:51 JST"
