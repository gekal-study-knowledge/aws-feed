  "99fdfbabca6ccd550164714fe655fd72":
    "id": "99fdfbabca6ccd550164714fe655fd72"
    "title": "スペックファースト: SAP ABAP のスペック駆動開発"
    "link": "https://aws.amazon.com/jp/blogs/news/spec-driven-development-for-sap-abap/"
    "published": "2026-10-27 20:36:45"
    "fetched": "2026-10-27 20:40:58"
    "summary": "AI コーディングエージェントで ABAP を生成する際、スペックがなければ開発上の判断が記録に残りません。本記事では、Kiro CLI 上で動作する AWS Coding Plugin for SAP ABAP を使ったスペック駆動開発 (SDD) の進め方を紹介します。良い ABAP スペックの書き方、AI-DLC に沿ったスペックからトランスポートリリースまでの流れ、ステアリングファイルによるチーム標準の適用を解説します。スペックを Git に残すことで、ドキュメントのない既存プログラムにも変更のたびに最新の仕様が蓄積されます。"
  "dfa74a422533c97e1415396ea568d21f":
    "id": "dfa74a422533c97e1415396ea568d21f"
    "title": "Claude Haiku 5.5 が Kiro で利用可能になりました"
    "link": "https://aws.amazon.com/jp/blogs/news/haiku-5-5/"
    "published": "2026-10-27 20:13:41"
    "fetched": "2026-10-27 20:40:58"
    "summary": "Claude Haiku 5.5 が本日より Kiro IDE、CLI、Web、Crew のすべてで利用可能になりました。Claude 5.5 ファミリーで最も高速なモデルで、大量に実行され素早い応答が求められる作業を想定しています。Claude Haiku 4.5 から明確に進化しました。Haiku 5.5 の登場で、Claude 5.5 の 3 つのモデルがすべて Kiro で使えるようになります。最も難しい問題には Opus 5.5、日常的なコーディングには Sonnet 5.5 があり、処理量や速度が何より重要な場面では Haiku 5.5 が担います。"
  "eb989c9a7fa09a6126605367108ce0fc":
    "id": "eb989c9a7fa09a6126605367108ce0fc"
    "title": "AWS Coding Plugin for SAP ABAP, powered by Kiro のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-aws-coding-plugin-for-sap-abap/"
    "published": "2026-10-27 20:12:15"
    "fetched": "2026-10-27 20:40:58"
    "summary": "Kiro を搭載した AWS Coding Plugin for SAP ABAP をリリースしました。SAP の ABAP Development Tools (ADT) と併せて Eclipse 上でスペック駆動開発 (SDD) を実現し、開発者とエージェントが協働して要件定義・設計・実装を進められます。IBM Consulting では、カスタム ABAP 拡張の開発時間を最大 30% 短縮し、開発後の不具合を最大 45% 削減しました。ECC から S/4HANA、BTP ABAP まで幅広いシステムに対応し、クリーンコアと RISE への移行を加速します。"
"last_updated": "2026-10-27 20:40:58 JST"
