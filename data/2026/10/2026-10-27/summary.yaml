"overview": |
  この日は 6 ソースから 15 本。セキュリティ速報として AWS CDK の @aws-cdk/aws-redshift-alpha のデータベースクエリ用カスタムリソースハンドラーにおける SQL インジェクション (CVE-2026-115418, Important) が公開された。What's New では OpenAI GPT-6.1 Terra の Amazon Bedrock での一般提供、Amazon ECR のレプリケーションバックフィル (既存イメージのレプリケーション) 対応、WorkSpaces Core Managed Instances の ModifyVolume API 対応、Amazon Connect Customer のテスト・シミュレーションでのフローアクション結果の検証、SageMaker Unified Studio の IDC ベースドメインでのライトモード対応。AWS Japan Blog では Kiro を搭載した AWS Coding Plugin for SAP ABAP のリリースと、それを使った ABAP のスペック駆動開発 (SDD) の解説、Claude Haiku 5.5 の Kiro (IDE・CLI・Web・Crew) での提供開始が公開された。ブログでは次世代 AWS Resilience Hub の推奨レジリエンステスト、S3 annotations によるデータガバナンス、Bedrock の OpenAI モデル向けプロンプトキャッシュ、マネージド Bedrock Knowledge Base でのエージェント型検索、SageMaker SDK v3 によるエッジのコンピュータビジョン運用、週次まとめ (Amazon Polly Generative エンジン、Trainium 向け TorchNeuron など) が並んだ。
