    "title": "AWS Capabilities by Region now offers availability notifications for individual features and advanced filters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/awscapabilities-enhancements/"
    "published": "2026-10-08 00:00:00"
    "fetched": "2026-10-08 02:11:37"
    "summary": "<p>Today, AWS announces feature-level availability notifications and advanced filters for <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Capabilities by Region</a> in AWS Builder Center. You can now set availability notifications for AWS service, or to an individual feature of an AWS service, in the AWS Regions you are interested in, and receive an in-app notification and a weekly email digest covering all the capabilities that became available since you enabled availability notifications. Setting availability notifications for a service covers every feature within it, and an 'All regions' option covers every Region, including AWS Regions that launch in the future.</p>\n<p>In addition to the feature level availability notifications , you can now filter API operations and CloudFormation resources by availability status and compare Regions to show all capabilities, only matching ones, or only differences. With over 19,000 API operations and more than 5,000 CloudFormation resource types, these filters quickly narrow a full listing down to the exact differences between Regions, working alongside search and existing display preferences.&nbsp;</p>\n<p>Comparing capabilities in AWS Capabilities by Region requires no account. Setting up availability notifications requires a Builder ID, which is free. To get started, visit <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Capabilities by Region</a> on AWS Builder Center. To learn more, explore the <a href=\"https://builder.aws.com/faq#aws-capabilities-by-region\">AWS Builder Center FAQ</a></p>"
"last_updated": "2026-10-08 02:11:37 JST"
