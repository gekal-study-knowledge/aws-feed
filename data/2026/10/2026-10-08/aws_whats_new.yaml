  "7bb1d4522d3377e2d10deadfa8f459e2":
    "id": "7bb1d4522d3377e2d10deadfa8f459e2"
    "title": "AWS Capabilities by Region now offers availability notifications for individual features and advanced filters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/awscapabilities-enhancements/"
    "published": "2026-10-08 00:00:00"
    "fetched": "2026-10-08 02:11:37"
    "summary": "<p>Today, AWS announces feature-level availability notifications and advanced filters for <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Capabilities by Region</a> in AWS Builder Center. You can now set availability notifications for AWS service, or to an individual feature of an AWS service, in the AWS Regions you are interested in, and receive an in-app notification and a weekly email digest covering all the capabilities that became available since you enabled availability notifications. Setting availability notifications for a service covers every feature within it, and an 'All regions' option covers every Region, including AWS Regions that launch in the future.</p>\n<p>In addition to the feature level availability notifications , you can now filter API operations and CloudFormation resources by availability status and compare Regions to show all capabilities, only matching ones, or only differences. With over 19,000 API operations and more than 5,000 CloudFormation resource types, these filters quickly narrow a full listing down to the exact differences between Regions, working alongside search and existing display preferences.&nbsp;</p>\n<p>Comparing capabilities in AWS Capabilities by Region requires no account. Setting up availability notifications requires a Builder ID, which is free. To get started, visit <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Capabilities by Region</a> on AWS Builder Center. To learn more, explore the <a href=\"https://builder.aws.com/faq#aws-capabilities-by-region\">AWS Builder Center FAQ</a></p>"
  "488cb76504658407e220bc8e2e486e89":
    "id": "488cb76504658407e220bc8e2e486e89"
    "title": "AWS Config now supports 77 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-config-new-resource-types"
    "published": "2026-10-08 00:00:00"
    "fetched": "2026-10-08 07:36:42"
    "summary": "<p>AWS Config now supports 77 additional AWS resource types across key services including Amazon EC2, Amazon S3 Files, and Amazon Q Business. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p>\n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p>\n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\">AWS Regions</a> where the resources are available:</p>\n<p>\n <br />\n Resource Types:\n</p>\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"979\">\n <tbody>\n  <tr>\n   <td height=\"21\" width=\"348\">AWS::ApplicationAutoScaling::ScalableTarget</td>\n   <td width=\"348\">AWS::GuardDuty::ThreatEntitySet</td>\n   <td width=\"283\">AWS::PCS::Queue</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ApplicationSignals::Discovery</td>\n   <td>AWS::GuardDuty::TrustedEntitySet</td>\n   <td>AWS::QBusiness::DataSource</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::APS::AnomalyDetector</td>\n   <td>AWS::HealthLake::DataTransformationProfile</td>\n   <td>AWS::QBusiness::Index</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::APS::ResourcePolicy</td>\n   <td>AWS::InspectorV2::CodeSecurityScanConfiguration</td>\n   <td>AWS::QBusiness::Permission</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ARCRegionSwitch::Plan</td>\n   <td>AWS::IoT::Logging</td>\n   <td>AWS::QBusiness::Plugin</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Batch::QuotaShare</td>\n   <td>AWS::IoTWireless::WirelessDeviceImportTask</td>\n   <td>AWS::QBusiness::Retriever</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Batch::ServiceEnvironment</td>\n   <td>AWS::LicenseManager::Grant</td>\n   <td>AWS::QBusiness::WebExperience</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::PaymentConnector</td>\n   <td>AWS::LicenseManager::License</td>\n   <td>AWS::QuickSight::OAuthClientApplication</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::ResourcePolicy</td>\n   <td>AWS::Lightsail::DatabaseSnapshot</td>\n   <td>AWS::RTBFabric::InboundExternalLink</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Braket::SpendingLimit</td>\n   <td>AWS::MediaConnect::RouterInput</td>\n   <td>AWS::RTBFabric::RequesterGateway</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CleanRooms::IdMappingTable</td>\n   <td>AWS::MediaConnect::RouterNetworkInterface</td>\n   <td>AWS::S3Files::AccessPoint</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CleanRoomsML::ConfiguredModelAlgorithm</td>\n   <td>AWS::MediaLive::Multiplex</td>\n   <td>AWS::S3Files::FileSystem</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CloudWatch::AlarmMuteRule</td>\n   <td>AWS::MediaLive::Node</td>\n   <td>AWS::S3Files::FileSystemPolicy</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::UserHierarchyStructure</td>\n   <td>AWS::MediaLive::SdiSource</td>\n   <td>AWS::S3Files::MountTarget</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ConnectCampaignsV2::Campaign</td>\n   <td>AWS::MediaPackageV2::ChannelPolicy</td>\n   <td>AWS::SecurityAgent::Application</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CUR::ReportDefinition</td>\n   <td>AWS::MediaPackageV2::OriginEndpointPolicy</td>\n   <td>AWS::SecurityAgent::TargetDomain</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::DataSync::LocationAzureBlob</td>\n   <td>AWS::MediaTailor::ChannelPolicy</td>\n   <td>AWS::SES::MailManagerAddressList</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::DataSync::LocationFSxONTAP</td>\n   <td>AWS::NeptuneGraph::GraphSnapshot</td>\n   <td>AWS::SSM::MaintenanceWindow</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::DataSync::LocationFSxOpenZFS</td>\n   <td>AWS::Notifications::EventRule</td>\n   <td>AWS::SSO::Application</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EC2::TransitGatewayMeteringPolicy</td>\n   <td>AWS::Notifications::NotificationHub</td>\n   <td>AWS::Timestream::InfluxDBCluster</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EC2::VPCCidrBlock</td>\n   <td>AWS::Omics::Configuration</td>\n   <td>AWS::Timestream::InfluxDBInstance</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ECR::RegistryScanningConfiguration</td>\n   <td>AWS::Omics::WorkflowVersion</td>\n   <td>AWS::Transcribe::VocabularyFilter</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EKS::Capability</td>\n   <td>AWS::OpenSearchServerless::CollectionGroup</td>\n   <td>AWS::Wisdom::AIGuardrail</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::ElementalInference::Feed</td>\n   <td>AWS::PCAConnectorAD::ServicePrincipalName</td>\n   <td>AWS::Wisdom::Assistant</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EntityResolution::IdNamespace</td>\n   <td>AWS::PCS::Cluster</td>\n   <td>AWS::WorkSpacesWeb::NetworkSettings</td>\n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Glue::Blueprint</td>\n   <td>AWS::PCS::ComputeNodeGroup</td>\n   <td>&nbsp;</td>\n  </tr>\n </tbody>\n</table>"
  "bff39eea1ee77b8ec4ff4032b178ad92":
    "id": "bff39eea1ee77b8ec4ff4032b178ad92"
    "title": "Amazon EC2 C8gb instances now generally available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ec2-c8gb/"
    "published": "2026-10-08 03:26:00"
    "fetched": "2026-10-09 07:48:35"
    "summary": "<p style=\"text-align: left;\">Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gb instances, powered by the latest-generation AWS Graviton4 processors, are available in the US East (Ohio), US West (N. California), EU (Frankfurt, Ireland, Paris, Stockholm), and Africa (Cape Town) regions. The new instances provide up to 30% better compute performance than AWS Graviton3-based EC2 instances. At up to 300 Gbps EBS bandwidth and 1600K IOPS, C8gb instances offer higher EBS performance compared to same-sized equivalent Graviton4-based instances.</p>\n<p style=\"text-align: left;\">Take advantage of the higher block storage performance offered by these new EBS optimized EC2 instances to scale the performance and throughput of workloads such as high-performance file systems, while optimizing the cost of running your workloads.</p>\n<p style=\"text-align: left;\">For increased scalability, these instances offer instance sizes up to 48xlarge, up to 384 GiB of memory, up to 300 Gbps of EBS bandwidth, up to 400 Gbps of networking bandwidth. These instances support Elastic Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge sizes, which enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.</p>\n<p style=\"text-align: left;\">C8gb instances are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (N.California, Oregon), EU (Frankfurt, Ireland, Paris, Stockholm), and Africa (Cape Town).</p>\n<p style=\"text-align: left;\">To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 C8gb Instances</a>. To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\" rel=\"noopener noreferrer\" target=\"_blank\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS SDKs</a>.</p>"
"last_updated": "2026-10-09 07:48:35 JST"
