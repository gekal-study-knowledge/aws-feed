  "9b26361564c80a335c6de6b2df0b1ab3":
    "id": "9b26361564c80a335c6de6b2df0b1ab3"
    "title": "AWS Continuum が自律型コードセキュリティの新たな基準を確立: CyberGym-E2E で成功率 89.0% を達成"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-continuum-sets-a-new-standard-in-autonomous-code-security/"
    "published": "2026-10-08 10:36:38"
    "fetched": "2026-10-08 11:26:24"
    "summary": "AI モデルの進化により脆弱性への迅速な対応が求められるなか、AWS Continuum for code vulnerabilities は、マシンスピードで動作する自律型セキュリティによって脆弱性の発見、検証、修復を加速します。脆弱性ライフサイクル全体を評価する CyberGym-E2E ベンチマークで、Continuum は 920 件中 819 件のタスクをパスし、成功率 89.0% を達成しました。これは従来の公開最高値を 23.1 ポイント上回る結果です。本記事では、ベンチマークの評価方法、マルチエージェントのハーネス設計、今後の評価の方向性を紹介します。"
  "817841668abd2d82261a3195e0c9a7c9":
    "id": "817841668abd2d82261a3195e0c9a7c9"
    "title": "Amazon DynamoDB から Amazon S3 へのフィルター付きエクスポート機能のご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-filtered-export-from-amazon-dynamodb-to-amazon-s3/"
    "published": "2026-10-08 14:58:45"
    "fetched": "2026-10-08 18:53:46"
    "summary": "本ブログでは、Amazon DynamoDB の新機能であるフィルター付きエクスポートについてご紹介します。この機能を使うと、ExportTableToPointInTime リクエストに FilterSpecification を指定することで、必要なアイテムや属性のみを Amazon S3 へエクスポートでき、テーブルのキャパシティを消費しません。マルチテナント環境における特定テナントのリカバリ、属性を限定したデータ共有、Amazon Athena を用いた影響分析、別リージョンへの移行といった実践的なユースケースを通して、効率的なデータ運用方法を学べます。"
