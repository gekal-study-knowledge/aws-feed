"overview": |
  この日は 14 件で、セキュリティ速報 2 件と、脆弱性トリアージの自動化、そして生成 AI の事例記事が中心でした。セキュリティ速報では、Amazon Athena のエンジンバージョン 3 のリクエスト処理に認可チェックの欠落があり (CVE-2026-107352、Bulletin ID 2026-128-AWS、重要度は Important、公開日は 2026 年 10 月 7 日)、認証済みのユーザーが他の AWS アカウントの限定的なクエリメタデータ (AWS アカウント識別子と SQL 文のテキスト) を読み取れた可能性がありました。AWS は 2026 年 9 月 1 日にサービス側で修正を適用し、顧客のメタデータへのアクセスはなかったことを確認しています。クエリの結果、認証情報、Amazon S3 のデータは影響を受けておらず、顧客側での対応は不要です。もう 1 件は QnABot on AWS の任意の Amazon Q Business Lambda フックのサンプル (q-business-lambda-hook) における、ユーザーが制御できるキーを介した認可バイパスです (CVE-2026-105811、Bulletin ID 2026-126-AWS、公開日は 2026 年 10 月 6 日)。このサンプルは QnABot on AWS のリポジトリに含まれる任意の統合例で、別途手作業でのデプロイと追加の設定が必要であり、QnABot と一緒に自動でデプロイされるものではないため、このサンプルをデプロイしていない利用者は影響を受けず、対応も不要です。セキュリティブログでは、AI を使った脆弱性トリアージの仕組みが 2 部構成で公開されました。第 1 部はアーキテクチャの話で、脆弱性スキャナが手作業のトリアージで処理できる速度を超えて検出結果を出し、依存関係の多いコードを開発者がどんどん出荷するため候補となる検出結果の量が増え続ける一方、スキャナが出す結果の多くは実際には悪用されにくい、という問題を扱います。重要なものを、担当者が行動できるだけの根拠を添えて速く届ける必要があるという前提です。第 2 部は steering file の設計で、熟練のセキュリティアナリストと同じ一貫性で、構造化された根拠に基づく脆弱性のトリアージを AI モデルに行わせる設定方法を示します。構造の検証、根拠に基づくスコアリング、インフラを踏まえた優先順位付けをすべての分析セッションで強制する 5 つの設定セクションの設計判断が解説されています。あわせて、サイバーセキュリティのキャリアについての連載第 1 部も公開されました。モデルでは、Claude Haiku 5.5 が Amazon Bedrock と Claude Platform on AWS で利用可能になったことを受けて、その改善点と使い始め方を解説する記事が公開されました。Claude 5.5 ファミリーで最も高速で効率のよいモデルで、サブエージェントや大量でコストに敏感な処理のために作られており、Anthropic によるとほとんどのタスクで Claude Haiku 4.5 より約 75% 安く済みます。機械学習ブログでは事例と方法論が並びました。Qlik は Qlik Answers を Amazon Bedrock 上に構築し、4 万社を超える顧客に対して、構造化・非構造化の企業データをまたいだ根拠と出典のある回答を提供しています。階層化されたマルチエージェントの構成に、クロスリージョン推論と Amazon Bedrock Guardrails を組み合わせ、グローバルな規模で信頼できる AI を実現した仕組みが紹介されました。Cornerstone OnDemand は Amazon Bedrock と Strands Agents の上に Orion AI というマルチエージェントシステムを作り、データベース運用を受け身の火消しから先回りの自動化へ変えました。3 人のチームが半年でデータベースの診断を 45 分から 10 分へ、78% 短縮しています。運用の自動化では、AWS DevOps Agent が本番のインシデントを診断できるものの、リソースを直接変更しないよう observe-and-report モードに留められていることを踏まえ、AWS Lambda Durable Functions、Amazon EventBridge、Amazon Bedrock を使って、その調査結果の要約を、オンコールのエンジニアがワンアクションで承認できる事前検証済みの修正に変える方法が示されました。RAG のアクセス制御では、SharePoint・Google Drive・Confluence のような知識ソースが複雑な権限を持つことに対し、Amazon Quick と Amazon Bedrock Knowledge Bases がクエリ時に権限の正しい持ち主へ直接確認することで、文書単位のアクセス制御をリアルタイムに適用する仕組みが解説されました。組織づくりでは、RPA 時代の ROI モデルではエージェント型の自動化が生む価値の大半を捉えられないという指摘のもと、時間の削減・例外処理・意思決定の質・保守の経済性にわたって価値を見積もり、どのワークフローから自動化するかを優先順位付けするための枠組みが示されました。あわせて、AI 導入の最大の障壁は認知ではなく「AI について話すこと」と「AI で作ること」の間の隔たりであるとして、技術者でない顧客対応の担当者を 6 週間で自信ある AI の作り手に変えたプレイブックも公開されています。サービス更新では、AWS Builder Center の AWS Capabilities by Region が、サービス単位だけでなく個々の機能単位での提供開始通知と高度なフィルタに対応しました。関心のあるリージョンについて通知を設定すると、アプリ内通知と、有効化してから提供開始になったすべての機能をまとめた週次のメールダイジェストを受け取れます。サービス単位で設定すればその中のすべての機能が対象になり、「All regions」を選べば将来立ち上がるリージョンも含めて全リージョンが対象になります。API 操作や CloudFormation のリソースを提供状況で絞り込んだり、リージョンを比較したりもできます。AWS Config は 77 の新しいリソースタイプに対応し、Amazon EC2、Amazon S3 Files、Amazon Q Business といった主要サービスにまたがって対象範囲が広がりました。すべてのリソースタイプの記録を有効にしている場合は自動で追跡が始まり、Config ルールと Config アグリゲータでも利用できます。
