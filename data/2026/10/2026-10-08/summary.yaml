"overview": |
  この日は 23 件で、セキュリティ速報 2 件と、脆弱性トリアージの自動化、そして生成 AI の事例記事が中心でした。セキュリティ速報では、Amazon Athena のエンジンバージョン 3 のリクエスト処理に認可チェックの欠落があり (CVE-2026-107352、Bulletin ID 2026-128-AWS、重要度は Important、公開日は 2026 年 10 月 7 日)、認証済みのユーザーが他の AWS アカウントの限定的なクエリメタデータ (AWS アカウント識別子と SQL 文のテキスト) を読み取れた可能性がありました。AWS は 2026 年 9 月 1 日にサービス側で修正を適用し、顧客のメタデータへのアクセスはなかったことを確認しています。クエリの結果、認証情報、Amazon S3 のデータは影響を受けておらず、顧客側での対応は不要です。もう 1 件は QnABot on AWS の任意の Amazon Q Business Lambda フックのサンプル (q-business-lambda-hook) における、ユーザーが制御できるキーを介した認可バイパスです (CVE-2026-105811、Bulletin ID 2026-126-AWS、公開日は 2026 年 10 月 6 日)。このサンプルは QnABot on AWS のリポジトリに含まれる任意の統合例で、別途手作業でのデプロイと追加の設定が必要であり、QnABot と一緒に自動でデプロイされるものではないため、このサンプルをデプロイしていない利用者は影響を受けず、対応も不要です。セキュリティブログでは、AI を使った脆弱性トリアージの仕組みが 2 部構成で公開されました。第 1 部はアーキテクチャの話で、脆弱性スキャナが手作業のトリアージで処理できる速度を超えて検出結果を出し、依存関係の多いコードを開発者がどんどん出荷するため候補となる検出結果の量が増え続ける一方、スキャナが出す結果の多くは実際には悪用されにくい、という問題を扱います。重要なものを、担当者が行動できるだけの根拠を添えて速く届ける必要があるという前提です。第 2 部は steering file の設計で、熟練のセキュリティアナリストと同じ一貫性で、構造化された根拠に基づく脆弱性のトリアージを AI モデルに行わせる設定方法を示します。構造の検証、根拠に基づくスコアリング、インフラを踏まえた優先順位付けをすべての分析セッションで強制する 5 つの設定セクションの設計判断が解説されています。あわせて、サイバーセキュリティのキャリアについての連載第 1 部も公開されました。モデルでは、Claude Haiku 5.5 が Amazon Bedrock と Claude Platform on AWS で利用可能になったことを受けて、その改善点と使い始め方を解説する記事が公開されました。Claude 5.5 ファミリーで最も高速で効率のよいモデルで、サブエージェントや大量でコストに敏感な処理のために作られており、Anthropic によるとほとんどのタスクで Claude Haiku 4.5 より約 75% 安く済みます。機械学習ブログでは事例と方法論が並びました。Qlik は Qlik Answers を Amazon Bedrock 上に構築し、4 万社を超える顧客に対して、構造化・非構造化の企業データをまたいだ根拠と出典のある回答を提供しています。階層化されたマルチエージェントの構成に、クロスリージョン推論と Amazon Bedrock Guardrails を組み合わせ、グローバルな規模で信頼できる AI を実現した仕組みが紹介されました。Cornerstone OnDemand は Amazon Bedrock と Strands Agents の上に Orion AI というマルチエージェントシステムを作り、データベース運用を受け身の火消しから先回りの自動化へ変えました。3 人のチームが半年でデータベースの診断を 45 分から 10 分へ、78% 短縮しています。運用の自動化では、AWS DevOps Agent が本番のインシデントを診断できるものの、リソースを直接変更しないよう observe-and-report モードに留められていることを踏まえ、AWS Lambda Durable Functions、Amazon EventBridge、Amazon Bedrock を使って、その調査結果の要約を、オンコールのエンジニアがワンアクションで承認できる事前検証済みの修正に変える方法が示されました。RAG のアクセス制御では、SharePoint・Google Drive・Confluence のような知識ソースが複雑な権限を持つことに対し、Amazon Quick と Amazon Bedrock Knowledge Bases がクエリ時に権限の正しい持ち主へ直接確認することで、文書単位のアクセス制御をリアルタイムに適用する仕組みが解説されました。組織づくりでは、RPA 時代の ROI モデルではエージェント型の自動化が生む価値の大半を捉えられないという指摘のもと、時間の削減・例外処理・意思決定の質・保守の経済性にわたって価値を見積もり、どのワークフローから自動化するかを優先順位付けするための枠組みが示されました。あわせて、AI 導入の最大の障壁は認知ではなく「AI について話すこと」と「AI で作ること」の間の隔たりであるとして、技術者でない顧客対応の担当者を 6 週間で自信ある AI の作り手に変えたプレイブックも公開されています。サービス更新では、AWS Builder Center の AWS Capabilities by Region が、サービス単位だけでなく個々の機能単位での提供開始通知と高度なフィルタに対応しました。関心のあるリージョンについて通知を設定すると、アプリ内通知と、有効化してから提供開始になったすべての機能をまとめた週次のメールダイジェストを受け取れます。サービス単位で設定すればその中のすべての機能が対象になり、「All regions」を選べば将来立ち上がるリージョンも含めて全リージョンが対象になります。API 操作や CloudFormation のリソースを提供状況で絞り込んだり、リージョンを比較したりもできます。AWS Config は 77 の新しいリソースタイプに対応し、Amazon EC2、Amazon S3 Files、Amazon Q Business といった主要サービスにまたがって対象範囲が広がりました。すべてのリソースタイプの記録を有効にしている場合は自動で追跡が始まり、Config ルールと Config アグリゲータでも利用できます。セキュリティでは、AWS Continuum for code vulnerabilities が自律型のコードセキュリティの新しい基準を打ち出しました。脆弱性のライフサイクル全体を評価する CyberGym-E2E ベンチマークで 920 件中 819 件のタスクをパスして成功率 89.0% を達成し、従来の公開最高値を 23.1 ポイント上回っています。記事ではベンチマークの評価方法、マルチエージェントのハーネス設計、今後の評価の方向性が紹介されています。コンプライアンスでは、Amazon Bedrock Guardrails の自動推論チェックが生成 AI のコンプライアンスをどう変えるかが解説されました。別の大規模言語モデルに出力を評価させる LLM-as-a-judge のような確率的な検証では、規制業界が監査で求められる形式的な保証を提供できないという前提のもと、自動推論チェックが形式的検証によって AI の出力を数学的に検証し、監査にそのまま使えるエビデンスとともに、確率的な確信から数学的な証明へ進む道筋を示します。Amazon Logistics、Lucid Motors、Fortive、FETG など 6 業界の導入事例と、コンプライアンスチェックのリファレンスアーキテクチャ、利用開始の手順も紹介されています。データベースでは、Amazon DynamoDB から Amazon S3 へのフィルター付きエクスポートが紹介されました。ExportTableToPointInTime リクエストに FilterSpecification を指定することで、必要なアイテムや属性だけを S3 へエクスポートでき、テーブルのキャパシティを消費しません。マルチテナント環境における特定テナントのリカバリ、属性を限定したデータ共有、Amazon Athena を使った影響分析、別リージョンへの移行といった実践的な使い道が示されています。あわせて Timestream for InfluxDB 3 のワークロード分析とベストプラクティスの日本語記事も公開されました。サービス更新では、最新世代の AWS Graviton4 を搭載した Amazon EC2 C8gb インスタンスが、米国東部 (オハイオ)、米国西部 (北カリフォルニア)、欧州 (フランクフルト、アイルランド、パリ、ストックホルム)、アフリカ (ケープタウン) で利用可能になりました。AWS Graviton3 ベースのインスタンスと比べて計算性能が最大 30% 高く、最大 300 Gbps の EBS 帯域と 1600K IOPS により、同サイズの Graviton4 ベースのインスタンスよりも高い EBS 性能を提供します。高性能ファイルシステムのようなワークロードの性能とスループットを伸ばしつつコストを最適化できます。インスタンスサイズは最大 48xlarge、メモリは最大 384 GiB、ネットワーク帯域は最大 400 Gbps で、16xlarge・24xlarge・48xlarge では Elastic Fabric Adapter (EFA) に対応し、密結合のクラスターで低レイテンシーとクラスター性能の向上が得られます。このほか、週刊まとめ (2026 年 10 月 5 日) とプライムデー 2026 の記事の日本語版も公開されました。サービス更新ではさらに、Amazon GuardDuty の RDS Protection が、ログインの異常に留まらず、Amazon Aurora PostgreSQL と Amazon RDS for PostgreSQL を狙うデータの持ち出しや破壊の攻撃を検出できるようになりました。RDS Protection for data activity として提供され、機械学習に基づく異常検出と統合された脅威インテリジェンスでデータベースのクエリのパターンを継続的に監視します。エージェントも追加のインフラもデータベースの設定変更も不要です。攻撃者がフィッシングやソーシャルエンジニアリング、設定の誤りを通じて正規の認証情報を得たあとでデータベースを狙う例が増えており、その悪意ある操作は正当なアプリケーションの振る舞いと見分けがつかないことがあるため、通常のクエリのパターンの振る舞いのベースラインを作って、従来のツールが見逃す脅威を検出できるようにするものです。また Amazon GameLift Servers がコンテナフリートで CPU のバースト性に対応しました。従来はコンテナフリートが固定の CPU 値に依存し、その値がコンテナの集約密度と実行時の上限の両方を同時に決めていたため、リソースの効率的な利用と性能の余裕の確保のどちらかを選ばざるを得ませんでした。ゲームサーバーのワークロードは本質的にバースト的で、CPU の要求は試合中のほとんどの時間は低く、物理演算や AI の処理、衝突判定のときに急に跳ね上がります。CPU のバースト性により、ふだんの CPU の必要量に合わせてコンテナを詰めつつ、ピーク時にはインスタンスの空いている CPU へバーストさせられます。コンテナグループ定義ごとに設定するオプトインの機能で、標準のコンテナフリートの料金に含まれ追加費用はかかりません。
