  "6b8573f1a15337f490ce508be750a888":
    "id": "6b8573f1a15337f490ce508be750a888"
    "title": "Amazon Connect Customer now lets you view metrics by customer lifetime value and repeat-caller status"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-boma-segment/"
    "published": "2026-10-26 22:47:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>Now you can view your metrics across customer segments: customer lifetime value (LTV) and repeat callers. See how any metric differs for repeat callers versus the rest of your contacts, or how results hold up among your highest-LTV customers; so you can spot the groups trending the wrong way before it shows up in the aggregate. Where a segment is underperforming, you can act. Route high-LTV customers to your most effective people, adjust the knowledge bases and self-service flows that repeat callers are falling back from, or refine agent guidance for segments where satisfaction is slipping. The segment tells you where to look; the metrics tell you what to fix.</p>"
  "a8d9309cf2af70d990ad2208fb482b17":
    "id": "a8d9309cf2af70d990ad2208fb482b17"
    "title": "Amazon Connect Customer now measures the outcomes that drive retention and revenue"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/connect-customer-boma-metrics/"
    "published": "2026-10-26 22:31:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>Amazon Connect Customer now scores the outcome of your customer interactions. It shows whether the customer left satisfied, is at risk of churning, made a purchase, or resolved their need in self-service. You can now see whether an interaction worked, not just how efficiently it ran. Each metric comes with a default definition you can adjust to match how your business defines success and are available both through the analytics dashboards and APIs.<br /> &nbsp;</p>"
  "08d1bf7cd0f9de9d527493ac7896cf60":
    "id": "08d1bf7cd0f9de9d527493ac7896cf60"
    "title": "AWS IAM Identity Center now supports cross-Region trusted identity propagation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-iam-identity-center-cross-region-tip/"
    "published": "2026-10-26 17:00:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>Trusted identity propagation carries a user's identity with their request, so AWS services can grant permissions based on who the user is and their underlying group associations, and log that user's access for auditing. With cross-Region support, this identity context can now be propagated to AWS services running in different AWS Regions, giving you greater flexibility in how you architect and deploy across AWS Regions.</p> \n<p>Customers often distribute workloads across AWS Regions for many reasons including separating the compute from the data it queries, to running workloads where capacity is available, or for disaster recovery and global scale. Previously, trusted identity propagation required all of the AWS services accessing a user's identity to reside in the same AWS Region. To reach services in another AWS Region, customers had to either grant access through broad IAM roles that cannot distinguish individual users or consolidate all their services into a single AWS Region. With cross-Region trusted identity propagation, a user's identity travels with the request across AWS Regions automatically, so you can grant access based on who the user is and their underlying group associations, and audit who accessed which resources, while preserving fine-grained access control for every individual user.</p> \n<p>Cross-Region trusted identity propagation is available at no additional cost in all AWS Regions where IAM Identity Center is available. For the list of Regions where IAM Identity Center is available, see <a href=\"https://builder.aws.com/build/capabilities/explore?tab=service-feature&amp;f=eJxtks1OwzAQhF8F7bk-kFKQKnFF4sCFHusIWck2jTCx5Z8CqvLuGKeOHTu3nW_Wu_LYV9DIsTHYvmPXi0HDHo4UrCbItCH3FDZRVUF9Y-p5NXnsRLSw5nwzmUzHBFUFNQhlzsuGiFa6tgFlOyZZLeRybEQrXdsSPRRoV6LHEj15hFY3pMUsw05cVkiSZcNIg4NRjEeQ2GgzOwFVAD6t6KdJzXJuXg5P3jGoKZqeZ4u_fnKAJUhXazbfvIYNSCUkKvP70nOD6uOEzFiF7utdKUgKewpC-XPGiWPtiu6_cO6nd28HXlvfJDx79vXF12-Wm55MP_ruYKV0oVAY6xHGP20D8yw\">AWS Capabilities by Region.</a>&nbsp; For more information, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/trustedidentitypropagation-overview.html\">Trusted identity propagation</a> in the IAM Identity Center User Guide.</p>"
  "35b29edb49dd6f1720003361c15389b2":
    "id": "35b29edb49dd6f1720003361c15389b2"
    "title": "AWS EC2 Auto Scaling now supports Launch Before Terminate at account-level to replace instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/ec2-auto-scaling-launch-before-terminate/"
    "published": "2026-10-26 17:00:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p>AWS EC2 Auto Scaling now lets you enable Launch Before Terminate as the default replacement behavior across all Auto Scaling groups in your account. When enabled, Auto Scaling launches a replacement instance and waits for it to pass health checks before terminating the instance it replaces, helping your applications maintain full capacity and availability during instance replacement events. This applies to replacement events such as instance refreshes, rebalancing, health checks, and maximum-instance-lifetime replacements.</p> \n<p>You can enable Launch Before Terminate through AWS EC2 Auto Scaling account settings, which let you configure the behavior once at the account level instead of on each Auto Scaling group individually. You can manage the setting with the new `PutAccountSetting` and `DescribeAccountSettings` APIs, available through the AWS Management Console, AWS CLI, or AWS SDKs.</p> \n<p>Launch Before Terminate is available in all AWS Regions at no additional cost.</p> \n<p>To learn more, see Launch Before Terminate in the <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-account-settings.html\">AWS EC2 Auto Scaling User Guide</a> and <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_Operations.html\">AWS EC2 Auto Scaling API Reference Guide</a>.</p>"
  "1f4744775a76eafc6398d15b3690db9d":
    "id": "1f4744775a76eafc6398d15b3690db9d"
    "title": "Amazon RDS now supports the latest Cumulative Update and GDR updates for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-rds-supports-latest-cumulative-update-gdr-microsoft-sql-server/"
    "published": "2026-10-26 16:30:00"
    "fetched": "2026-10-27 05:52:19"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server </a>now supports the latest Cumulative Updates (CU) and General Distribution Release (GDR) updates for Microsoft SQL Server. This release includes support for Microsoft SQL Server 2017 CU31+GDR <a href=\"https://support.microsoft.com/help/5122774\" rel=\"noopener noreferrer\" target=\"_blank\">KB5122774</a> (RDS version 14.00.3550.4.v1), SQL Server 2019 CU32+GDR <a href=\"https://support.microsoft.com/help/5122772\" rel=\"noopener noreferrer\" target=\"_blank\">KB5122772</a> (RDS version 15.00.4490.9.v1), SQL Server 2022 CU27 <a href=\"https://support.microsoft.com/help/5104824\" rel=\"noopener noreferrer\" target=\"_blank\">KB5104824</a> (RDS version 16.00.4295.3.v1) and SQL Server 2025 CU9 <a href=\"https://support.microsoft.com/help/5122048\" rel=\"noopener noreferrer\" target=\"_blank\">KB5122048</a> (RDS version 17.00.5005.3.v1).<br /> <br /> For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5122774, KB5122772, KB5104824 and KB5122048. We recommend that you upgrade your Amazon RDS for SQL Server instances to apply these updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can learn more about upgrading your database instance in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft SQL Server DB engine</a>.</p>"
  "25d7ddefd8abd03823ad7470cae90e31":
    "id": "25d7ddefd8abd03823ad7470cae90e31"
    "title": "AWS Key Management Service now supports ML-KEM for post-quantum key encapsulation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/kms-ml-kem-post-quantum/"
    "published": "2026-10-26 17:00:00"
    "fetched": "2026-10-27 09:12:51"
    "summary": "<p>AWS Key Management Service (KMS) now supports Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM), a post-quantum cryptography standard under <a href=\"https://csrc.nist.gov/pubs/fips/203/final\">NIST FIPS 203</a>, which&nbsp;enables two parties to establish a shared secret.&nbsp;NIST designed ML-KEM to replace the classical key-establishment schemes, like DH/ECDH key agreement, and RSA-based key transport, in their strategic cryptographic roadmap&nbsp;(see <a href=\"https://csrc.nist.gov/pubs/ir/8547/ipd\">NIST IR 8547</a>).&nbsp;ML-KEM addresses the \"harvest now, decrypt later\" threat to those classical schemes, where an adversary records the key-establishment exchange today and recovers the shared secret once sufficiently powerful quantum computers become available.</p> \n<p>KMS supports all three ML-KEM key specs defined in NIST FIPS 203: ML-KEM-512, ML-KEM-768, and ML-KEM-1024. The Encapsulate API uses the public key to produce a random 32-byte shared secret and its ciphertext form. The Decapsulate API recovers the shared secret from ciphertext using the corresponding private key. KMS protects the private key of an ML-KEM key pair in FIPS 140-3 Level 3 validated hardware security modules (HSMs). You can use the GetPublicKey API to export the public key and distribute it to partners, client applications, or external systems for performing the encapsulate operation locally using cryptographic libraries like AWS-LC, OpenSSL, or Bouncy Castle.</p> \n<p>ML-KEM is available in all AWS Regions where KMS is available, except the the Middle East (UAE), Middle East (Bahrain), and China Regions. For more information, see <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html\">Key spec reference</a> in the AWS KMS Developer Guide.</p>"
  "f05261c8b02d40f81a1b153c1ee5953c":
    "id": "f05261c8b02d40f81a1b153c1ee5953c"
    "title": "AWS Glue Data Catalog now supports OAuth for Apache Iceberg REST Catalog APIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/glue-catalog-oauth-iceberg-rest/"
    "published": "2026-10-26 13:00:00"
    "fetched": "2026-10-27 14:56:44"
    "summary": "<p>AWS Glue Data Catalog now supports OAuth 2.0 bearer token authentication for Apache Iceberg REST Catalog (IRC) APIs using AWS Sign-In. The Apache Iceberg REST Catalog specification defines OAuth 2.0 as its standard authentication mechanism, and query engines such as Apache Spark, Trino, and Apache Flink implement it natively. These engines and external integration partners can now authenticate to the Glue Data Catalog Iceberg endpoint using standard OAuth 2.0 bearer tokens, in addition to AWS Signature Version 4 (SigV4).</p> \n<p>You can now grant partners federated access to your Iceberg tables without distributing AWS credentials. Using OAuth 2.0 Token Exchange (RFC 8693), you exchange an OpenID Connect (OIDC) identity token for a short-lived, Glue-scoped bearer token and include it in IRC requests following the same standards-based pattern used across the Iceberg ecosystem. Access remains governed by AWS IAM and AWS Lake Formation permissions. Common use cases include enabling third-party analytics and data cloud platforms to query tables in the Glue Data Catalog through a single, consistent authentication path.</p> \n<p>This capability is available in all AWS Regions where AWS Glue and Lake Formation are available. To learn more, see the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/connect-glu-iceberg-rest.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Glue User Guide</a> and <a href=\"https://docs.aws.amazon.com/signin/latest/userguide/configure-oauth-glue-iceberg-rest.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Sign-In User Guide</a>.</p>"
"last_updated": "2026-10-27 14:56:44 JST"
