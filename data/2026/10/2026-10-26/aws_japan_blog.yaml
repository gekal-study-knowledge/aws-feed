  "9ad5306c9ae3939b7cf0d7438d89fe79":
    "id": "9ad5306c9ae3939b7cf0d7438d89fe79"
    "title": "週刊生成AI with AWS – 2026/10/19 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20261019/"
    "published": "2026-10-26 16:22:53"
    "fetched": "2026-10-26 17:45:00"
    "summary": "今週の「週刊生成 AI with AWS」は、NEC 様の Claude Code 全社展開（約 3 万人体制を目指す CoE・チャンピオン制度）と、コーテッグ様が Amazon Bedrock AgentCore で構築した AI 分析基盤「Dotta」の 2 つの国内事例や、Amazon Bedrock の API キー保護や最小権限、AI コーディングエージェント向けコントロールフレームワークなどセキュリティ関連のブログに加え、AWS Physical AI Toolchain、AWS DevOps Agent の調査コスト制御も取り上げています。 サービスアップデートでは、Amazon Bedrock での Claude 構造化出力、Amazon CloudWatch Omni の東京リージョン対応、Kiro IDE と CLI のメモリ機能など 25 件を紹介しています。"
