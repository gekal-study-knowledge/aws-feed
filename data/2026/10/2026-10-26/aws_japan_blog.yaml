    "title": "Amazon OpenSearch intelligent ingestion で Amazon S3 のデータから RAG 対応インデックスを構築する"
    "link": "https://aws.amazon.com/jp/blogs/news/build-rag-ready-indexes-from-amazon-s3-with-amazon-opensearch-intelligent-ingestion/"
    "published": "2026-10-26 08:34:06"
    "fetched": "2026-10-26 08:45:18"
    "summary": "契約書、製品マニュアル、調査レポートなど、企業の価値ある知識は Amazon S3 に保存されたドキュメントに蓄積されています。本記事では、Amazon OpenSearch Serverless (NextGen) の新機能である Amazon OpenSearch intelligent ingestion を使い、こうしたドキュメントの解析、画像の説明生成、チャンク分割、ベクトル埋め込みの生成、インデックス化までを、取り込みパイプラインを運用せずに実行する方法を紹介します。"
