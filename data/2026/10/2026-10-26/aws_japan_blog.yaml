    "summary": "Amazon GuardDuty が Runtime Monitoring 向けのオプション脅威検出ルールを追加、Amazon Bedrock 上の Claude モデルで Structured Outputs が利用可能に、AWS Transform が新規ネットワークの構築とセキュリティグループの最新化に対応、AWS Continuum for code vulnerabilities が一般提供開始 など"
