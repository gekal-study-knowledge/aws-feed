  "1045b1e6c3bf5ed3ef97e4a02e2ee5b6":
    "id": "1045b1e6c3bf5ed3ef97e4a02e2ee5b6"
    "title": "Amazon EC2 R8gd instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ec2-r8gd-thf/"
    "published": "2026-10-10 04:29:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) R8gd instances are available in AWS European Sovereign Cloud (Germany) region. These instances feature up to 11.4 TB of local NVMe-based SSD block-level storage and are powered by AWS Graviton4 processors, delivering up to 30% better performance over Graviton3-based instances. These instances are built on the AWS Nitro System and are a great fit for applications that need access to high-speed, low latency local storage.&nbsp;\n <br />\n &nbsp;\n <br />\n R8gd instances are available in 12 different sizes. They provide up to 50 Gbps of network bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Additionally, customers can now adjust the network and Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.</p>\n<p>To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\" target=\"_blank\">R8gd instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\" target=\"_blank\">AWS Graviton Fast Start program</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\" target=\"_blank\">AWS Management Console</a>.</p>"
  "1975aefbd6ac79c7210beb6dde6dbc13":
    "id": "1975aefbd6ac79c7210beb6dde6dbc13"
    "title": "Amazon EC2 R8g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ec2-r8g-instances-thf/"
    "published": "2026-10-10 04:19:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8g instances are available in the AWS European Sovereign Cloud (Germany) region. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 R8g instances are ideal for memory-intensive workloads such as databases, in-memory caches, and real-time big data analytics. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\" target=\"_blank\">AWS Nitro System</a>, which offloads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads.</p>\n<p>AWS Graviton4-based Amazon EC2 instances deliver the best performance and energy efficiency for a broad range of workloads running on Amazon EC2. AWS Graviton4-based R8g instances offer larger instance sizes with up to 3x more vCPU (up to 48xlarge) and memory (up to 1.5TB) than Graviton3-based R7g instances. These instances are up to 30% faster for web applications, 40% faster for databases, and 45% faster for large Java applications compared to AWS Graviton3-based R7g instances. R8g instances are available in 12 different instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS).&nbsp;\n <br />\n &nbsp;\n <br />\n To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\" target=\"_blank\">Amazon EC2 R8g Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\" target=\"_blank\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\" target=\"_blank\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\" target=\"_blank\">AWS Management Console</a>.</p>"
  "7f5f4dfc951242d274fc64abdc0e24d4":
    "id": "7f5f4dfc951242d274fc64abdc0e24d4"
    "title": "Amazon Bedrock now supports reasoning summaries for OpenAI models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-bedrock-reasoning-summaries-openai/"
    "published": "2026-10-10 02:44:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon Bedrock now supports the reasoning.summary parameter for OpenAI models through the Responses API. This capability lets you request a human-readable summary of a model’s reasoning alongside its response, helping you understand its approach to complex tasks such as coding, analysis, and multi-step problem solving.</p>\n<p>Reasoning summaries give developers additional context for evaluating responses, debugging applications, and showing users how a model approached a request. The summary is returned in the summary array of the reasoning output item, alongside the model’s answer.</p>\n<p>This capability is available for all OpenAI models on Amazon Bedrock in all AWS Regions where OpenAI GPT models are available, including in-Region inference, geographic (GEO) cross-Region inference, and global cross-Region inference.</p>\n<p>To learn more, see the OpenAI documentation on r<a href=\"https://developers.openai.com/api/docs/guides/reasoning#reasoning-summaries\">easoning summaries</a>. To get started with OpenAI GPT models on Amazon Bedrock, see documentation <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/getting-started.html\">here</a>.</p>"
  "80d53978eea02426030e59b2d060a806":
    "id": "80d53978eea02426030e59b2d060a806"
    "title": "Anthropic Claude Sonnet 5.5 and Claude Opus 5.5 are now available on Kiro in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/kiro-claude-5-5-aws-govcloud-us/"
    "published": "2026-10-10 02:13:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Two new Anthropic models are now available in the Kiro IDE and CLI for the AWS GovCloud (US) Regions.</p>\n<p>Claude Opus 5.5 is Anthropic's most capable Opus model yet and a step up from Opus 5 on long-running agentic coding work. Opus 5.5 thinks adaptively on every request, deciding how much effort each task needs, and completes tasks with roughly 40% fewer tool calls and about half the tokens of Opus 5 in Kiro's internal benchmarking. Available with a 1M context window and 2.0x credit multiplier, down from Opus 5's 2.2x.</p>\n<p>Claude Sonnet 5.5 is Anthropic's fastest Sonnet model to date and a natural upgrade for teams already building on Sonnet 5. Output is more than 30% faster, real-world coding and knowledge work approaches Opus 5.5 performance, and clearer writing makes it a stronger collaborator, giving developers a cost-performance dial between maximum capability and higher throughput. Available with a 1M context window and 1.3x credit multiplier.</p>\n<p>Ensure your IDE or CLI is updated to the latest version, then restart it to access the new models from the model selector. For more details, visit the <a href=\"https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/govcloud-kiro.html\">GovCloud documentation</a>, the <a href=\"https://kiro.dev/docs/enterprise/monitor-and-track/\">monitoring and tracking guide</a>, or contact your AWS account team. To learn more about Kiro, visit the <a href=\"https://kiro.dev/\">Kiro product page</a>.</p>"
  "61568c8bdadbbc232e291ce18a0c9d19":
    "id": "61568c8bdadbbc232e291ce18a0c9d19"
    "title": "Amazon Connect Customer now provides automated checks to improve performance evaluation forms"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-connect-customer-automated-checks-evaluation-forms/"
    "published": "2026-10-10 02:00:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon Connect Customer now suggests changes to performance evaluation forms that improve the accuracy of evaluations automatically filled by AI. While setting up an evaluation form, managers can run an automated check that compares the form against best practices with a single click. Managers then receive a list of evaluation questions that are missing context for AI to score reliably, along with suggestions to make them more specific. For example, the check might flag \"Did the agent provide a sales disclosure?\" and prompt the manager to define exactly what the agent must disclose before a sale. This helps managers automatically score human and AI agents fairly and accurately, while spending less time refining their evaluation forms.</p>\n<p>This feature is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Singapore), Asia Pacific (Sydney), and Asia Pacific (Tokyo). To learn more, please visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/create-evaluation-forms.html#step-validateform\">documentation</a> and our <a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>. For information about Amazon Connect Customer pricing, please visit our <a href=\"https://aws.amazon.com/products/connect/customer/pricing/?trk=758059ab-77e5-44fc-8a4a-1be845ee42b9&amp;sc_channel=ps\">pricing</a> page.</p>"
  "52d6288f88fc40c3edbb07cddfcf5569":
    "id": "52d6288f88fc40c3edbb07cddfcf5569"
    "title": "Amazon S3 Vectors metadata pre-filtering is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/s3-vectors-metadata-pre-filtering-in-govcloud-regions/"
    "published": "2026-10-10 02:00:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Amazon S3 Vectors metadata pre-filtering is now available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. Pre-filtering evaluates metadata filters before running similarity search, returning up to 5x more of the matching vectors when your filter is selective. S3 Vectors also adds a prefix match operator ($startsWith) for filtering on values like paths and URLs. Together, these improvements give your retrieval-augmented generation (RAG), agentic, and semantic-search applications more complete results when you filter, so your applications return more relevant answers.</p>\n<p>S3 Vectors provides native support to store and query vectors in Amazon S3, delivering purpose-built, cost-optimized vector storage and query at billion-vector scale. With this launch, indexes in new vector buckets in the AWS GovCloud (US) Regions use metadata pre-filtering by default, with no change to how you write vectors with PutVectors or run filtered queries with QueryVectors. To use pre-filtering on an existing index, update it in place with the UpdateIndexMode API. You can also compare pre-filtering against your current filtering on the same index, using a per-query parameter on QueryVectors, before you update.</p>\n<p>Metadata pre-filtering is available at no additional cost in all commercial AWS Regions where Amazon S3 Vectors is available, and in the AWS China Regions. We are in the process of deploying this change and plan to complete the deployment in the coming days. To get started, use the AWS CLI, AWS SDKs, or the Amazon S3 console. To learn more, visit the Amazon S3 Vectors <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-metadata-filtering.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and the <a href=\"https://aws.amazon.com/blogs/aws/amazon-s3-vectors-now-supports-metadata-pre-filtering-for-higher-recall-on-filtered-searches\" rel=\"noopener noreferrer\" target=\"_blank\">AWS News blog</a>.</p>\n<p><a href=\"https://signin.aws.amazon.com/signup?request_type=register\">&nbsp;</a></p>"
  "da4947ef5de544ecf83847193994c2af":
    "id": "da4947ef5de544ecf83847193994c2af"
    "title": "AWS Lambda supports OAuth authentication for self-managed Apache Kafka event sources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-Lambda-supports-oauth-kafka-esm/"
    "published": "2026-10-10 01:30:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>AWS Lambda now supports OAuth authentication for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-kafka.html\">self-managed Apache Kafka event source mappings</a> (ESM), including&nbsp;Kafka clusters that customers run themselves and managed offerings such as Confluent Cloud, Aiven, and Redpanda. With this launch, customers can authenticate their Lambda Kafka consumers through their enterprise identity provider, helping them meet the security and compliance requirements for their Kafka applications.</p>\n<p>Customers building event-driven Kafka workloads for use cases such as payment processing, fraud detection, and real-time data pipelines use Kafka ESM to build serverless Kafka consumers. Kafka ESM provides automatic scaling, error handling, batching, and event filtering. Previously, Kafka ESM supported only SASL/PLAIN, SASL/SCRAM, and mutual TLS (mTLS) as&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/kafka-cluster-auth.html\">authentication methods</a>,&nbsp;so customers in regulated industries that require OAuth could not use Kafka ESM with their clusters. With OAuth support, customers can use their enterprise identity provider, such as <a href=\"https://aws.amazon.com/cognito/\">Amazon Cognito</a> or Okta,&nbsp;to authenticate their Kafka ESM and apply the same identity governance and access policies across their Kafka clusters and Lambda consumers.</p>\n<p>This capability is available in all&nbsp;<a href=\"https://builder.aws.com/build/capabilities\">AWS commercial Regions</a>&nbsp;where self-managed Kafka ESM is available. To use OAuth authentication, create a new Kafka ESM with your authentication configuration through the AWS Management Console, Lambda API, AWS CLI, AWS CloudFormation, or AWS SAM. To learn more, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-kafka.html\">AWS Lambda developer guide</a> and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>.&nbsp; &nbsp;&nbsp;</p>"
  "a3f442c2f2bd6cb887631c7796e25e04":
    "id": "a3f442c2f2bd6cb887631c7796e25e04"
    "title": "Amazon Quick now supports brand templates for on-brand presentations and documents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-quick-brand-templates-on-brand-presentations-documents/"
    "published": "2026-10-10 00:00:00"
    "fetched": "2026-10-10 06:26:46"
    "summary": "<p>Starting today, you can upload brand templates in Amazon Quick, allowing you to create presentations and documents that match your approved visual identity. Brand managers set up a template once and everyone gets on-brand output, without hunting for the right file in each chat.</p>\n<p>Brand managers upload PowerPoint or Word templates, or pull them from a connected file store such as SharePoint. Quick extracts the colors, fonts, logos, layouts and brand rules from each file. A brand manager reviews and edits what Quick found before publishing it to the whole organization.</p>\n<p>Quick also follows a template's rules as it creates new assets. If a request breaks a rule, Quick explains why and suggests an on-brand alternative. For each task, Quick picks the best-fit template based on guidance the brand manager writes. Users can still choose a different template.</p>\n<p>Administrators decide who can create and publish brand templates using custom permissions, ensuring that only the proper members of brand, marketing, or other approved teams can set visual standards.&nbsp;</p>\n<p>Brand assets are generally available today in the Amazon Quick desktop app. To learn more, see the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/brand-assets-desktop.html\" target=\"_blank\">Amazon Quick documentation,</a> or <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost&amp;additionalState=ampDeviceId%3Da8b6426f-6802-4b96-8ebb-e39fff4fab5f%26ampSessionId%3D1791568256376#/validation&amp;refid=0ea79374-057c-4897-84f0-5fe792905a8f\">create an account for free</a> and start using Quick in minutes.</p>"
  "5cbf7b5fe75b006fbc0df439b6715bd4":
    "id": "5cbf7b5fe75b006fbc0df439b6715bd4"
    "title": "AWS Security Hub now exports findings to S3 in CSV or JSON format"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/security-hub-exports-s3-csv-json/"
    "published": "2026-10-10 07:00:00"
    "fetched": "2026-10-10 10:28:22"
    "summary": "<p>Today, AWS Security Hub announces support for exporting findings to Amazon S3 in CSV or JSON (OCSF) format. Security teams that need findings outside the console for use cases such as compliance reporting and audit evidence can now export findings from every findings page in the Security Hub console, including Threats, Exposure, Vulnerabilities, Posture Management, Sensitive Data, and All Findings, without building and maintaining their own extraction pipelines.</p>\n<p>With this launch, you can start an export on demand from the findings page you are viewing and have Security Hub deliver the results to an S3 bucket in your account. You can choose CSV when you want to review or share findings in a spreadsheet or export in JSON if you need these findings in Open Cybersecurity Schema Framework (OCSF) format.</p>\n<p>Findings export is available in all AWS Regions where AWS Security Hub is available. To learn more, visit the AWS Security Hub User Guide at&nbsp;<a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-findings-export.html\">https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-findings-export.html</a>.</p>"
