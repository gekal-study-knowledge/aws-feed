"overview": |
  この日は 13 件で、セキュリティ速報 2 件と、Lambda の新しいメタデータエンドポイント、そしてサービス更新が中心でした。セキュリティ速報の 1 件目は、AWS Tools for PowerShell でログファイルに機微な情報が書き込まれていた問題です (CVE-2026-107783、Bulletin ID 2026-132-AWS、公開日は 2026 年 10 月 9 日)。5.0.306 より前のバージョンで、ローカルのユーザーがコマンドの出力やログの成果物から IAM ユーザーの AWS マネジメントコンソールのパスワードを平文で復元できる可能性がありました。影響を受けるのは v5.0.305 以下です。2 件目は AWS Amplify の API カテゴリにおける、SQL をバックエンドとするモデルのクエリリゾルバの認可の不備です (CVE-2026-108096、Bulletin ID 2026-133-AWS)。@aws-amplify/graphql-index-transformer が生成するクエリリゾルバに問題があり、認証済みのリモートのユーザーが細工したクエリによって、同じアプリケーションの他のユーザーが所有するレコードを読める可能性がありました。影響を受けるのは @aws-amplify/graphql-index-transformer の 2.2.0 以上 3.1.2 未満、@aws-amplify/graphql-api-construct の 1.4.0 以上 1.21.4 未満などです。コンピュートでは、AWS Lambda が実行環境のエンドポイント経由でアベイラビリティーゾーンのメタデータを公開するようになりました。HTTP リクエストで自分の AZ ID を知れるため、ElastiCache・Amazon RDS・MemoryDB のようなサービスで同じ AZ のエンドポイントを優先して AZ 間のレイテンシーとデータ転送のコストを下げたり、AZ を意識したレジリエンシーのパターンを組んだりできます。あわせて Lambda が自己管理の Apache Kafka のイベントソースマッピングで OAuth 認証に対応しました。自分で運用する Kafka クラスターに加えて、Confluent Cloud・Aiven・Redpanda のようなマネージドの提供も対象で、企業の ID プロバイダを通じて Lambda の Kafka コンシューマーを認証できるため、Kafka アプリケーションのセキュリティとコンプライアンスの要件を満たしやすくなります。モデルでは、Amazon Bedrock が OpenAI のモデルについて Responses API 経由で reasoning.summary パラメータに対応しました。モデルの推論の人間が読める要約を回答と一緒に要求できるもので、コーディング、分析、多段の問題解決といった複雑なタスクにどう取り組んだかを理解しやすくなります。回答の評価、アプリケーションのデバッグ、利用者へのモデルの考え方の提示に使え、要約は reasoning の出力項目の summary 配列に返ります。開発ツールでは、Anthropic の Claude Sonnet 5.5 と Claude Opus 5.5 が AWS GovCloud (US) リージョンの Kiro の IDE と CLI で利用可能になりました。Opus 5.5 はリクエストごとに適応的に考えてタスクに必要な労力を決め、Kiro の社内ベンチマーキングでは Opus 5 に比べてツール呼び出しが約 40% 少なくトークンは約半分で、1M のコンテキストウィンドウとクレジット倍率 2.0 倍 (Opus 5 の 2.2 倍から低下) で提供されます。Sonnet 5.5 は出力が 30% 以上速くなっています。検索では、Amazon S3 Vectors のメタデータの事前フィルタリングが AWS GovCloud (US 東部・US 西部) で利用可能になりました。類似検索の前にメタデータのフィルタを評価することで、フィルタが選択的な場合に一致するベクトルを最大 5 倍多く返せます。あわせてパスや URL のような値を絞り込むための前方一致の演算子 ($startsWith) も加わり、RAG やエージェント、意味検索のアプリケーションがフィルタをかけたときにより完全な結果を得られます。コンタクトセンターでは、Amazon Connect Customer が評価フォームに対する自動チェックを提供するようになりました。AI が自動で記入する評価の精度を上げるための変更を提案するもので、フォームの設定中にワンクリックでベストプラクティスとの比較を実行でき、AI が確実に採点するための文脈が足りない評価の質問と、より具体的にするための提案を受け取れます。「エージェントは販売時の開示を行ったか」という質問に対して、販売の前に何を開示しなければならないかを正確に定義するよう促す、といった具合です。生成 AI の文書作成では、Amazon Quick がブランドテンプレートに対応し、承認済みのビジュアルアイデンティティに沿ったプレゼンテーションや文書を作れるようになりました。ブランド管理者が PowerPoint や Word のテンプレートをアップロードするか SharePoint のような接続済みのファイルストアから取り込むと、Quick が色・フォント・ロゴ・レイアウト・ブランドのルールを抽出し、管理者が確認・編集してから全社に公開できます。新しい成果物を作るときもテンプレートのルールに従い、ルールに反する依頼があれば理由を説明して代替案を提示します。コンピュートのリージョン拡大では、AWS Graviton4 搭載の Amazon EC2 R8gd と R8g が AWS European Sovereign Cloud (ドイツ) で利用可能になりました。R8gd は最大 11.4 TB のローカル NVMe SSD のブロックストレージを備え、Graviton3 ベースのインスタンスと比べて性能が最大 30% 向上し、12 のサイズで最大 50 Gbps のネットワーク帯域と最大 40 Gbps の EBS 帯域を提供します。R8g はデータベース、インメモリキャッシュ、リアルタイムのビッグデータ分析のようなメモリ集約型のワークロードに向いています。機械学習ブログでは、Postman が 4,000 万人の開発者のために Amazon Bedrock 上で Agent Mode を動かしているアーキテクチャのパターンが共有されました。デモで動く AI エージェントを作ることと、4,000 万人のために動かすことは別の問題だという前提で、ツールの乱立の抑制、スキーマに基づく読み取りの公開、そしてコンテキストこそが本当のボトルネックだと捉えることが挙げられています。あわせて、2026 年 9 月の Amazon Bedrock・Amazon Bedrock AgentCore・Strands の更新をまとめた月次の振り返りも公開されました。
