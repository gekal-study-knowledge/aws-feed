"overview": |
  この日は 14 件で、セキュリティ速報とソブリンクラウドへの展開、そしてエージェントの大規模運用の知見が中心でした。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-107783 は AWS Tools for PowerShell V5 におけるログファイルへの機微な情報の書き出し (Bulletin ID: 2026-132-AWS、2026 年 10 月 9 日 08:30 PDT 公開)、CVE-2026-108096 は AWS Amplify API Category の SQL バックエンドのモデルに対するクエリリゾルバーにおける不適切な認可 (Bulletin ID: 2026-133-AWS、同日 11:00 PDT 公開) です。機械学習ブログでは、Postman と AWS が 4,000 万人の開発者向けに Agent Mode を Amazon Bedrock 上で運用している裏側のアーキテクチャパターンが共有されました。デモで動く AI エージェントを作ることと、4,000 万人のために動かし続けることは別の問題であるという前提で、ツールの乱立 (tool sprawl) を抑える仕組みなどが語られています。あわせて、2026 年 9 月の Amazon Bedrock・Amazon Bedrock AgentCore・Strands の更新をまとめた月次の振り返り (ICYMI) が公開され、モデル選択の幅の広がり、評価機能を内蔵したより高速なサーバーレスエージェント、自動化の進展が取り上げられました。コンピュートブログでは、AWS Lambda が実行環境内のエンドポイントからアベイラビリティゾーンのメタデータを公開するようになり、関数が HTTP リクエストで自分の AZ ID を取得できるようになったことが解説されました。同じ AZ のエンドポイントを優先することで AZ 間のレイテンシーを削減できます。ソブリンクラウドでは、Amazon EC2 R8g インスタンス (AWS Graviton4 プロセッサ搭載) と R8gd インスタンス (最大 11.4 TB のローカル NVMe SSD ブロックストレージを備える) が AWS ヨーロッパソブリンクラウド (ドイツ) リージョンで利用できるようになりました。AWS GovCloud (US) 向けには、Anthropic の Claude Sonnet 5.5 と Claude Opus 5.5 が Kiro の IDE と CLI で使えるようになり、Amazon S3 Vectors のメタデータ事前フィルタリングが GovCloud (US-East) と GovCloud (US-West) でも利用可能になりました。セキュリティ運用では、AWS Security Hub が検出結果を Amazon S3 へ CSV または JSON (OCSF) 形式でエクスポートできるようになり、コンプライアンス報告のようにコンソール外で検出結果を扱う用途に対応します。モデルでは、Amazon Bedrock が Responses API を通じて OpenAI モデルの reasoning.summary パラメータに対応し、モデルの推論について人間が読める要約を出力とあわせて取得できるようになりました。そのほかサービス更新では、AWS Lambda が自己管理の Apache Kafka イベントソースマッピング (ESM) で OAuth 認証に対応し、自前で運用する Kafka クラスターや Confluent Cloud のようなマネージドの提供形態も含めて使えるようになりました。Amazon Quick はブランドテンプレートに対応し、承認済みのビジュアルアイデンティティに沿ったプレゼンテーションや文書を作成できます (ブランド管理者が一度テンプレートを用意すれば共有できます)。Amazon Connect Customer は、AI が自動入力する評価の精度を上げるために、パフォーマンス評価フォームへの改善提案を自動チェックとして提示するようになりました。
