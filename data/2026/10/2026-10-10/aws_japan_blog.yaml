    "title": "Kiro CLI V3 をデフォルトのエクスペリエンスとして順次展開します"
    "link": "https://aws.amazon.com/jp/blogs/news/cli-3/"
    "published": "2026-10-10 21:22:45"
    "fetched": "2026-10-10 23:59:58"
    "summary": "Kiro CLI V3 は、Kiro IDE と Kiro Web を動かしているものと同じエージェントハーネスをターミナルで使えるようにします。V3 では、計画・実装・レビューが必要なタスクを Kiro に渡し、workflow のエージェントがバックグラウンドで各ステップを進めている間も、ご自身は作業を続けられます。クラウドセッションを開始すれば、ノート PC を閉じても作業は止まりません。新しい spec モードでは、Kiro がコードを書き始める前に要件と設計を Kiro と一緒にレビューできます。新しい tangent モードを使うと、メインセッションのコンテキストに影響を与えずに、並行する会話へ分岐できます。"
"last_updated": "2026-10-10 23:59:58 JST"
