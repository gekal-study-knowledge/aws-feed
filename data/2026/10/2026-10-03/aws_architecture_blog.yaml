    "title": "Architect highly available Oracle Database on Amazon EVS and FSx for ONTAP"
    "link": "https://aws.amazon.com/blogs/architecture/architect-highly-available-oracle-database-on-amazon-evs-and-fsx-for-ontap/"
    "published": "2026-10-03 02:57:01"
    "fetched": "2026-10-03 05:18:43"
    "summary": "Learn how to architect a highly available Oracle Database environment on Amazon Elastic VMware Service (Amazon EVS) with Amazon FSx for NetApp ONTAP. This post covers EC2 bare metal instance selection, vSAN and FSx storage tiering, NSX networking, and SnapMirror cross-region disaster recovery for enterprises preserving their VMware operational tooling."
  "e3b8f3b62182ceca182b3a38a567477e":
