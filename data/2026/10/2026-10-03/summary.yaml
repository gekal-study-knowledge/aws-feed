"overview": |
  この日は 15 件で、セキュリティ速報の連続、Oracle Database を Amazon EVS 上で可用性高く動かす構成、そしてエージェントのスキル設計が中心でした。セキュリティ速報は 3 件で、いずれも Important (要対応) です。CVE-2026-103505 は Container Storage Interface ドライバである Amazon EFS CSI Driver におけるマウントオプションインジェクション (Bulletin ID: 2026-120-AWS、2026 年 10 月 1 日 08:30 PDT 公開)、CVE-2026-103956・CVE-2026-103957・CVE-2026-103958 は AWS Labs のオープンソース AI エージェントオーケストレーションプラットフォーム Loom for AWS における 3 件の問題 (Bulletin ID: 2026-124-AWS、2026 年 10 月 2 日 12:00 PDT 公開)、CVE-2026-104019 は Amazon SageMaker Distribution の Studio Space 起動スクリプトにおける OS コマンドインジェクション (Bulletin ID: 2026-125-AWS、同日 13:00 PDT 公開) です。アーキテクチャブログでは、Amazon Elastic VMware Service (Amazon EVS) と Amazon FSx for NetApp ONTAP を使って高可用性の Oracle Database 環境を構築する設計記事と、FSx for ONTAP を NFS データストアストレージとして使う手順を追った実装記事の 2 本が公開されました。EC2 ベアメタルインスタンスの選定からストレージボリュームのプロビジョニングまでを扱います。あわせて、AWS のリージョン別の提供状況データを自分たちが所有するインフラとしてデプロイする方法も紹介されました。Capability Insights for AWS は VPC 内で日次に自動更新されるセルフホストのダッシュボードを動かし、Workload Analysis がカタログを絞り込みます。機械学習ブログでは、小さな検索エージェントにツールと環境を教え込むことでフロンティアモデル並みの信頼性をより低いレイテンシーとコストで得るために、Amazon SageMaker AI 上でマルチターンの強化学習によって LLM ベースの検索エージェントをファインチューニングする方法が解説されました。あわせて、Amazon Bedrock 上の Claude Desktop がモデルの知識カットオフに縛られる問題に対し、Amazon Bedrock AgentCore Gateway 経由で Web 検索を安全につなぐ方法と、Amazon Quick のチャットエージェントを決定論的なルールエンジンの上に置いた境界の明確な MCP サーバーと組み合わせ、証明可能に網羅的で説明可能なコンプライアンス回答を得る「Adjudicated Query」パターンで数千件のリース契約を一括点検する方法が公開されました。サービス更新では、Amazon EKS と Amazon EKS Distro が Kubernetes 1.37 に対応し、Amazon Aurora DSQL がテーブルの一部の行だけを対象にする部分インデックスに対応して、該当する行のみを格納することでクエリ性能を上げつつインデックスのコストを下げられるようになりました。Amazon ECS は Amazon VPC Lattice を使う ECS サービスについて、Blue/Green・Linear・Canary のデプロイ戦略を組み込みで利用できるようになりました。AWS Health はソフトウェアバージョンのライフサイクル情報を AWS のサービス横断で集約する version catalog を導入し、AWS Brazil は AWS Brazil 2P Distribution Program によってブラジル国外の独立系ソフトウェアベンダー (ISV) の製品ライセンスをブラジルの顧客へ自動配布するワークフローを提供するようになりました。日本のブログでは、AWS DevOps Agent の Skills を作成するためのベストプラクティスが公開されました。深夜のインシデント対応の質が誰が呼び出されるかで変わってしまう問題に対し、チームの調査ノウハウを再利用可能なプレイブックとして蓄積し、誰が対応しても一貫した調査ができるようにする仕組みで、エージェント指示との使い分けや、起動を左右する description の書き方など、確実に起動して判断ロジックを持つ Skill を書くための指針が示されています。
