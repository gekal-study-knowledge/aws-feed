"overview": |
  この日は 11 件で、セキュリティ速報 2 件 (CVE は計 4 件) と、VMware 環境での Oracle Database 運用、そしてエージェントの強化が中心でした。セキュリティ速報はいずれも Important (要対応) です。CVE-2026-103505 は Amazon EFS CSI Driver の問題で、PersistentVolume を作成する権限を持つ者が mounttargetipmap という volumeAttribute を通じて追加のマウントオプションを注入できます。その JSON マップ内の値にカンマ区切りの値を足すと、マウントユーティリティがそれらを別々のマウントオプションとして解釈してしまいます (Bulletin ID: 2026-120-AWS、2026 年 10 月 1 日 08:30 PDT 公開)。もう 1 件は、AWS Labs のオープンソースの AI エージェントオーケストレーション基盤である Loom for AWS における 3 件の問題で、最新版 1.7.0 への更新と、フォークや派生コードへの修正の取り込みが推奨されています (Bulletin ID: 2026-124-AWS、2026 年 10 月 2 日 12:00 PDT 公開)。CVE-2026-103956 は 1.6.1 より前のバージョンの認証依存関係の問題で、ID プロバイダーを設定していない構成では、ネットワーク上のどのクライアントでもアプリケーション API への任意のリクエストによってエージェントのコントロールプレーンに対する完全な管理権限 (ツールサーバーの登録、保存された連携用の資格情報の読み取り、マネージドなエージェントロールに付いた IAM ロールポリシーの書き換え) を得られました (1.6.1 で修正、2026 年 8 月 4 日公開)。CVE-2026-103957 は 1.7.0 より前の OAuth2 ディスカバリー処理の問題で、mcp:write または a2a:write のスコープを持つ認証済みの利用者が、バックエンドに OAuth2 のクライアントシークレットや別の利用者のアクセストークンを第三者の制御するエンドポイントへ送らせるような well-known のディスカバリー URL を設定できました (1.6.1 では内部アドレスへの到達は防いだものの、トークンの漏洩は完全には解決しておらず、1.7.0 で修正)。CVE-2026-103958 はツールサーバー (MCP) とリモートエージェント (A2A) の接続処理における外向きリクエストの扱いの問題です。コンテナでは、Amazon EKS と Amazon EKS Distro が Kubernetes 1.37 に対応しました。EKS コンソール、eksctl、あるいは IaC のツールから 1.37 のクラスターを新規作成したり、既存のクラスターを 1.37 にアップグレードできます。1.37 では Metrics API が metrics.k8s.io/v1 として一般提供に昇格し、Pod とノードの CPU などのメトリクスを提供します。運用では、AWS Health にソフトウェアのライフサイクル管理のためのバージョンカタログが加わりました。AWS の各サービスにまたがるソフトウェアバージョンのライフサイクル情報を 1 か所に集めるもので、バージョンのアップグレードとサポート終了のリスクを後追いではなく先回りして管理できるようにします。AWS Health Dashboard から見られ、Business Support Plus・Enterprise Support・Unified Operations の利用者は AWS Health API でライフサイクルのデータを自分の運用フローに組み込めます。アーキテクチャブログでは、Amazon Elastic VMware Service (Amazon EVS) と Amazon FSx for NetApp ONTAP の組み合わせで Oracle Database を動かす記事が 2 本公開されました。1 本は FSx for NetApp ONTAP を NFS データストアとして使って Oracle Database を配置する手順書で、ストレージボリュームの用意、NFS データストアのマウント、Oracle のインストール、リージョンをまたぐ災害対策のための SnapMirror レプリケーションの設定までを扱います。もう 1 本は可用性の高い Oracle Database 環境の設計で、EC2 ベアメタルインスタンスの選び方、vSAN と FSx のストレージ階層化、NSX のネットワーク、SnapMirror によるクロスリージョンの災害対策を、VMware の運用ツールを維持したい企業向けに整理しています。あわせて、AWS のリージョン別の可用性データを自分の所有物として VPC 内に配置する方法が紹介されました。Capability Insights for AWS が VPC 内で自己ホストのダッシュボードを毎日自動更新で動かし、Workload Analysis がカタログを自分のアカウントが実際に使っているサービスに絞るため、リージョン展開のギャップ分析が自分がデプロイしているものだけに集中できます。機械学習ブログでは 3 本が公開されました。Amazon Quick のチャットエージェントを、決定論的なルールエンジンの上に置いた範囲を限定した MCP サーバーと組み合わせる Adjudicated Query パターンで、完全性が証明でき説明に耐えるコンプライアンスの回答を得る方法 (リースのコンプライアンスを題材に、リファレンスアーキテクチャとデプロイ可能な AWS CDK のサンプルを提示)。Amazon Bedrock の Claude Desktop はウェブ検索がないとモデルの知識のカットオフに縛られるため、Amazon Bedrock AgentCore Gateway を使って Web Search につなぎ、AWS IAM Identity Center と Amazon Cognito による JWT ベースの受信認証を通す方法。そして、小さな検索エージェントに自分たちのツールと環境を覚えさせることで、フロンティアモデル並みの信頼性を低いレイテンシーとコストで得るために、Amazon SageMaker AI 上でマルチターンの強化学習 (MTRL) によって LLM ベースの検索エージェントをファインチューニングし、検索品質と信頼性の改善を測った記事です。このほか、AWS Brazil 2P Distribution Program により、ブラジル国外の適格な独立系ソフトウェアベンダー (ISV) が AWS Brazil に SaaS 製品ライセンスの販売権を与え、AWS Brazil が販売元としてブラジルの顧客にブラジルレアル建てで現地の税を含めて請求する自動化された流通の仕組みが提供されるようになりました。
