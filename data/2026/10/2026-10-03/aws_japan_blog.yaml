    "title": "AWS DevOps Agent Skills を作成するためのベストプラクティス"
    "link": "https://aws.amazon.com/jp/blogs/news/best-practices-for-writing-aws-devops-agent-skills/"
    "published": "2026-10-03 15:18:08"
    "fetched": "2026-10-03 20:26:31"
    "summary": "深夜のインシデント対応の質は、誰が呼び出されるかによって変わってしまいがちです。AWS DevOps Agent の Skills は、チームの調査ノウハウを再利用可能なプレイブックとして蓄積し、誰が対応しても一貫した調査を行えるようにする仕組みです。本記事では、確実に起動し判断ロジックを持つ Skill を書くためのベストプラクティスとして、エージェント指示との使い分け、起動を左右する description の書き方、調査プレイブックとしての指示の構成、エージェントタイプへの絞り込み、参考資料の活用、複数Skillsの組み合わせ方、メモリストアとの補完関係、そして矛盾・陳腐化・過度な厳格さ・対象範囲の重複といった見落としやすい失敗パターンを紹介します。"
"last_updated": "2026-10-03 20:26:31 JST"
