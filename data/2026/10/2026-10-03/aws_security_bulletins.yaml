    "title": "CVE-2026-103505 - Mount Option Injection in Amazon EFS CSI Driver"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-120-aws/"
    "published": "2026-10-03 01:38:11"
    "fetched": "2026-10-03 05:18:42"
    "summary": "<p><b>Bulletin ID:</b> 2026-120-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/01/2026 08:30 AM PDT</p>\n<p><b>Description:</b></p>\n<p>The Amazon EFS CSI Driver is a Container Storage Interface driver that allows Kubernetes clusters to use Amazon Elastic File System. We identified CVE-2026-103505, where an actor with PersistentVolume creation privileges can inject additional mount options through the mounttargetipmap volumeAttribute. Appending comma-separated values to a value inside that JSON map causes the mount utility to parse them as separate mount options.</p>\n<p><b>Impacted versions:</b> &gt;= v3.1.0 AND &lt;= v3.4.2</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "3a081aafd9adeaeaebc71516c9bb65ae":
    "id": "3a081aafd9adeaeaebc71516c9bb65ae"
    "title": "CVE-2026-103956, CVE-2026-103957, and CVE-2026-103958 - Issues in Loom for AWS"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-124-aws/"
    "published": "2026-10-03 04:21:29"
    "fetched": "2026-10-03 05:18:42"
    "summary": "<p><b>Bulletin ID:</b> 2026-124-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/02/2026 12:00 PM PDT</p>\n<p><b>Description:</b></p>\n<p>Loom is an AWS Labs open-source AI agent orchestration platform. We have identified and addressed three issues in Loom for AWS, described below. We recommend upgrading to the latest version (1.7.0) and ensuring any forked or derivative code is patched to incorporate the new fixes.</p>\n<p><b>- CVE-2026-103956 ‐ Authentication bypass in Loom for AWS (CWE-306, CWE-1188)</b> An issue in the authentication dependency in Loom for AWS versions &lt;1.6.1 allowed any network client to obtain full administrative authority over the agent control plane ‐ including registering tool servers, reading stored integration credentials, and rewriting IAM role policies attached to managed agent roles ‐ via any request to the application API in a deployment where no identity provider was configured. This issue was addressed in version 1.6.1, released 2026-08-04.\n <br />\n <b>- CVE-2026-103957 ‐ OAuth2 token and credential disclosure via outbound request handling in Loom for AWS (CWE-918, CWE-201)</b> An issue in the OAuth2 discovery handling in Loom for AWS versions &lt;1.7.0 allowed an authenticated user with the mcp:write or a2a:write scope to configure a well-known discovery URL whose document directed the backend to send OAuth2 client secrets or another user's access token to a third-party-controlled endpoint. The 1.6.1 release blocked internal-address reach for this code path but did not fully address the token disclosure. This issue was fully addressed in version 1.7.0.\n <br />\n <b>- CVE-2026-103958 ‐ Outbound request handling issue in tool server and remote agent connections in Loom for AWS (CWE-918)</b> An issue in the tool server (MCP) and remote agent (A2A) connection handling in Loom for AWS versions &lt;1.7.0 allowed an authenticated user with the mcp:write or a2a:write scope to direct connection requests to arbitrary internal network locations — including the container's credential-vending endpoint ‐ and read the responses. This issue was addressed in version 1.7.0.</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "f486b17b46144e795f4c94a3d653716a":
    "id": "f486b17b46144e795f4c94a3d653716a"
    "title": "CVE-2026-104019 - OS command injection in the Studio Space startup script in Amazon SageMaker Distribution"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-125-aws/"
    "published": "2026-10-03 05:25:48"
    "fetched": "2026-10-03 09:06:42"
    "summary": "<p><b>Bulletin ID:</b> 2026-125-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 10/02/2026 13:00 PM PDT</p>\n<p><b>Description:</b></p>\n<p>Amazon SageMaker Unified Studio is an AWS service that unifies data, analytics, and AI development. It lets you find and access your organization's data and act on it with integrated, purpose-built tools.</p>\n<p>We identified CVE-2026-104019, an issue with the startup of SageMaker Spaces in SageMaker Unified Studio. The startup script in a SageMaker Space performs a network validation against all the available SageMaker connections in a project. Under certain conditions, improper sanitization of connection details during this validation could allow arbitrary code to be executed in the Space of another project member. In projects with the Trusted Identity Propagation feature enabled, this issue could result in a user with project contributor permissions (or higher) gaining access to another member's temporary execution role credentials and calling downstream trusted identity propagation-enabled AWS services on their behalf.</p>\n<p>We implemented a fix to all supported SageMaker Distribution versions to sanitize connection details during the startup validation process. The fix is deployed globally and will apply to all Spaces automatically on the next startup.</p>\n<p><b>Impacted versions:</b></p>\n<p>- 2.8.x - 2.13.x: all versions affected, no fix (end of support)\n <br />\n - 2.14.x: &lt; 2.14.12, fixed in 2.14.12\n <br />\n - 3.3.x - 3.8.x: all versions affected, no fix (end of support)\n <br />\n - 3.9.x: &lt; 3.9.12, fixed in 3.9.12\n <br />\n - 4.0.x: &lt; 4.0.11, fixed in 4.0.11\n <br />\n - 4.1.x: &lt; 4.1.11, fixed in 4.1.11\n <br />\n - 4.2.x: &lt; 4.2.8, fixed in 4.2.8\n <br />\n - 4.3.x: &lt; 4.3.5, fixed in 4.3.5\n <br />\n - 4.4.x: &lt; 4.4.3, fixed in 4.4.3\n <br />\n - 4.5.x: not affected\n <br />\n - &lt; 2.8.0 and &lt; 3.3.0: not affected</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
