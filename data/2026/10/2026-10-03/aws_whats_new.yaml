  "42b98b932ffa2ce7f96c7d80ab9726a9":
    "id": "42b98b932ffa2ce7f96c7d80ab9726a9"
    "title": "AWS Health introduces the version catalog for software lifecycle management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-health-introduces-version-catalog-software-lifecycle-management"
    "published": "2026-10-03 03:09:00"
    "fetched": "2026-10-03 05:18:40"
    "summary": "<p>Today, AWS Health introduces the version catalog which provides a centralized source of lifecycle information for software versions across AWS services. The version catalog helps customers move from reactive to proactive management of version upgrades and end-of-support risk. It is available in the AWS Health Dashboard, and customers on Business Support Plus, Enterprise Support, or Unified Operations can use the AWS Health API to integrate lifecycle data into their operational workflows.</p>\n<p>Customers running applications on AWS need to stay current with software versions to maintain a strong security and operational posture. AWS Health already sends account and resource-specific Planned Lifecycle Events well in advance for major version end-of-support milestones. The version catalog adds service-wide view of supported versions and their timelines, so customers can build upgrade schedules, governance controls, and move to newer supported versions before receiving an account-specific Planned Lifecycle Event.</p>\n<p>At launch, the version catalog covers multiple AWS services including Amazon RDS, Amazon EKS, and AWS Lambda with more services being added over time. The version catalog is available across all AWS Commercial Regions.</p>\n<p>To get started, visit the version catalog in the <a href=\"https://health.console.aws.amazon.com/health/home?region=us-east-1#/account/version-catalog\">AWS Health Dashboard</a> or read the <a href=\"https://docs.aws.amazon.com/health/latest/ug/aws-health-version-catalog.html\">documentation</a> to learn more.</p>"
  "dfa2957cb6cf0bd74a7d5a80563af7de":
    "id": "dfa2957cb6cf0bd74a7d5a80563af7de"
    "title": "Amazon EKS and Amazon EKS Distro now support Kubernetes version 1.37"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-eks-distro-kubernetes-version-1-37"
    "published": "2026-10-03 02:30:00"
    "fetched": "2026-10-03 05:18:40"
    "summary": "<p>Kubernetes version 1.37 introduced several new features and bug fixes, and AWS is excited to announce that you can now use <a href=\"https://aws.amazon.com/eks/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Kubernetes Service</a> (EKS) and <a href=\"https://aws.amazon.com/eks/eks-distro/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EKS Distro</a> to run Kubernetes version 1.37. Starting today, you can create new EKS clusters using version 1.37 and upgrade existing clusters to version 1.37 using the EKS console, the eksctl command line interface, or through an infrastructure-as-code tool.</p>\n<p>Kubernetes version 1.37 introduces several key improvements, promoting the Metrics API to general availability as <i>metrics.k8s.io/v1</i>. This API provides Pod and node CPU and memory usage for the Horizontal Pod Autoscaler and <i>kubectl top</i>. Dynamic Resource Allocation (DRA) device taints and tolerations also graduate to general availability, letting DRA drivers and administrators taint devices such as GPUs so the scheduler avoids them unless tolerated. Horizontal Pod Autoscaler scale-to-zero graduates to beta and is enabled by default, allowing autoscalers with <i>minReplicas: 0</i> that use object or external metrics to scale workloads to zero Pods when idle and back up when demand returns. To learn more about Kubernetes version 1.37, see our <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions-standard.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and the Kubernetes project <a href=\"https://github.com/kubernetes/kubernetes/blob/master/CHANGELOG/CHANGELOG-1.37.md\" rel=\"noopener noreferrer\" target=\"_blank\">release notes.</a></p>\n<p>EKS now supports Kubernetes version 1.37 in all the AWS Regions where EKS is available, including the AWS GovCloud (US) Regions.</p>\n<p>You can learn more about the Kubernetes versions available on EKS and instructions to update your cluster to version 1.37 by visiting EKS documentation. You can use <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/cluster-insights.html\" rel=\"noopener noreferrer\" target=\"_blank\">EKS cluster insights</a> to check if there are any issues that can impact your Kubernetes cluster upgrades. EKS Distro builds of Kubernetes version 1.37 are available through ECR Public Gallery and GitHub. Learn more about the EKS version lifecycle policies in the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "b196685e3a773d4ba9b84757464b8b1a":
    "id": "b196685e3a773d4ba9b84757464b8b1a"
    "title": "AWS Brazil automates distribution of non-Brazilian software product licenses to Brazilian customers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-brazil-software-license-distribution/"
    "published": "2026-10-03 01:30:00"
    "fetched": "2026-10-03 05:18:40"
    "summary": "<p>AWS Brazil now provides an automated distribution workflow through the AWS Brazil 2P Distribution Program. Eligible non-Brazilian independent software vendors (ISVs) grant AWS Brazil the right to distribute their Software-as-a-Service (SaaS) product licenses, and AWS Brazil distributes them to customers in Brazil. AWS Brazil is the seller of record, invoicing Brazilian customers in Brazilian Reais (BRL) with applicable Brazilian taxes. The distribution authorizations, seller disbursements, withholding tax calculation, invoicing, and seller reporting are automated.</p>\n<p>Eligible ISVs agree to the applicable Brazil 2P distribution terms to grant AWS Brazil the right to distribute SaaS product licenses locally by creating distribution authorizations through AWS Partner Central or public APIs. AWS Brazil, as the seller of record, creates private offers for Brazilian buyers, determines the buyer-facing price, and automatically generates invoices, calculates and withholds taxes, and disburses payments. ISVs track transactions and payment status through the Seller Insights dashboard.&nbsp;</p>\n<p>Buyers in Brazil see private offers priced in USD and invoiced in BRL by AWS Brazil, using the exchange rate on the invoice date. Buyers can pay by credit card (Visa, Mastercard, American Express) or Pay by Invoice (PBI), add a purchase order number, and access invoices in the AWS Billing Console.</p>\n<p>To learn more about the AWS Brazil 2P Distribution Program, visit the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/brazil-2p-getting-started.html\">AWS Marketplace Seller Guide</a> and the <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/brazil-2p-buyer-faq.html\">AWS Marketplace Buyer Guide</a>.&nbsp;</p>"
  "7e90da6495a44f36a6cf5045bfb7ee05":
    "id": "7e90da6495a44f36a6cf5045bfb7ee05"
    "title": "Amazon ECS adds Amazon VPC Lattice support for blue/green, linear, and canary deployments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-ecs-vpc-lattice-blue-green-deployments"
    "published": "2026-10-03 05:18:00"
    "fetched": "2026-10-03 09:06:40"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now supports built-in blue/green, linear, and canary deployment strategies for ECS services using <a href=\"https://aws.amazon.com/vpc/lattice/\" target=\"_blank\">Amazon VPC Lattice</a>. Applications that use VPC Lattice for service-to-service communication across VPCs and AWS accounts can now take advantage of managed traffic shifting natively from Amazon ECS when rolling out updates.</p>\n<p>With this launch, ECS customers using VPC Lattice can shift traffic in a controlled manner during deployments, choosing how quickly traffic moves based on their confidence in each release: all at once with blue/green, in equal increments with linear, or starting with a small percentage with canary. Teams can validate new versions with test traffic before shifting production traffic, and run custom validation steps or manual approvals with deployment lifecycle hooks, including Lambda and pause hooks. These services can also use Amazon CloudWatch alarms and the Amazon ECS deployment circuit breaker to automatically roll back deployments if issues are detected, with bake time keeping the previous version ready for a quick rollback without downtime.</p>\n<p>To get started, select your VPC Lattice target groups, listener rule, and preferred deployment strategy in the ECS service configuration using the AWS Management Console, AWS CLI, AWS SDKs, or Infrastructure-as-Code tools. This functionality can be enabled for both new and existing ECS services in all AWS <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">Regions</a> where VPC Lattice is available. For more information, see <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/vpc-lattice-resources-for-blue-green.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ECS deployments with VPC Lattice</a>.\n <br /></p>"
  "0d3187833aa9f604b87ce436f014427b":
    "id": "0d3187833aa9f604b87ce436f014427b"
    "title": "Amazon Aurora DSQL now supports partial indexes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aurora-dsql-partial-indexes/"
    "published": "2026-10-03 02:30:00"
    "fetched": "2026-10-03 09:06:40"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now lets you build an index over a specific subset of a table, storing only qualifying rows rather than every row in the entire table, which improves query performance and lowers index storage cost.</p>\n<p>Many tables hold a small working set alongside a much larger history, such as open orders among years of completed ones. Add a WHERE clause to CREATE INDEX to index just that working set. The index stays small as the table grows, and queries that target those rows read less data. Aurora DSQL uses a partial index for any query whose filter falls within the index's condition.</p>\n<p>Partial indexes are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL is available. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/create-index-syntax-support.html\">CREATE INDEX</a> in the Aurora DSQL User Guide.</p>"
"last_updated": "2026-10-03 09:06:40 JST"
