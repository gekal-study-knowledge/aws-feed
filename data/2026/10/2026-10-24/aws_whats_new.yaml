    "title": "AWS Transit Gateway and AWS Cloud WAN now support 1:1 NAT"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transit-gateway-cloud-wan-1-1-nat/"
    "published": "2026-10-24 00:43:00"
    "fetched": "2026-10-24 03:51:42"
    "summary": "<p>AWS Transit Gateway and AWS Cloud WAN now provide managed one-to-one network address translation (NAT) directly on their attachments, through integration with Regional Private NAT Gateway. This enables customers to connect private networks that share the same IP address ranges without renumbering either network, deploying a NAT appliance, or writing return-traffic rules.</p> \n<p>Networks with overlapping Classless Inter-Domain Routing (CIDR) blocks have long been unable to communicate, a common blocker during mergers and acquisitions, when connecting partner networks over AWS Site-to-Site VPN, in multicloud connectivity, and when independently provisioned VPCs need to interconnect. Using this capability, customers can define address-translation rules on a AWS Transit Gateway or AWS Cloud WAN attachment, specifying the private IP range each source CIDR translates to, across Amazon VPC, AWS Site-to-Site VPN, AWS Direct Connect, and SD-WAN appliances connected through Transit Gateway Connect. Both services apply translation automatically in both directions, with no separate return-traffic rule and no NAT appliance to deploy. AWS operates, scales, and manages the NAT capability as part of the attachment. For example, if a customer acquires a business and both VPCs use 10.0.0.0/16, they translate one VPC's addresses to a non-overlapping range on its attachment and connect the networks immediately. Customers set it up in minutes using the AWS Management Console, AWS Command Line Interface (AWS CLI), AWS SDKs, and AWS CloudFormation, and monitor translated traffic through Amazon CloudWatch metrics and Amazon EventBridge events.</p> \n<p>AWS Transit Gateway and AWS Cloud WAN offer 1:1 NAT through Regional Private NAT Gateway in all AWS commercial&nbsp;regions where they operate. For full pricing details, see &nbsp;<a href=\"https://aws.amazon.com/vpc/pricing/\">Amazon VPC pricing&nbsp;</a>. To learn more, see the &nbsp;<a href=\"https://aws.amazon.com/transit-gateway/\">AWS Transit Gateway&nbsp;</a> and &nbsp;<a href=\"https://aws.amazon.com/cloud-wan/\">AWS Cloud WAN&nbsp;</a> product pages, and the <a href=\"https://docs.aws.amazon.com/vpc/latest/tgw/\">AWS Transit Gateway&nbsp;</a> and <a href=\"https://docs.aws.amazon.com/network-manager/latest/cloudwan/what-is-cloudwan.html\">AWS Cloud WAN&nbsp;</a> documentation.</p>"
  "2967bea491b452c988c3faa93d9ccf02":
    "id": "2967bea491b452c988c3faa93d9ccf02"
    "title": "Amazon Connect Customer Global Resiliency now supports persistent chat across linked AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-connect-global-resiliency-persistent-chat"
    "published": "2026-10-24 02:00:00"
    "fetched": "2026-10-24 06:48:51"
    "summary": "<p>Amazon Connect Customer Global Resiliency now provides customers a mechanism to deliver long, persistent chat experiences across linked AWS Regions. With this capability, end users can resume previous conversations with full context, metadata, and transcripts carried over across Regions, eliminating the need for end users to repeat information and allowing agents to provide personalized service with access to the entire conversation history across AWS Regions.</p> \n<p>For example, an end user can start a chat in US-East (N. Virginia) and later come back to it in the linked US-West (Oregon) Region, continuing the same conversation with an agent with full conversation history&nbsp;and&nbsp;chat attachment. To adopt this capability, onboard to <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/global-routing-across-acgr-regions.html\">Global routing</a>.</p> \n<p>This feature is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/get-started-connect-global-resiliency.html\">Amazon Connect Customer Global Resiliency</a> is supported. To learn more, visit <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/setup-connect-global-resiliency.html\">Amazon Connect Customer Admin Guide</a>.</p>"
"last_updated": "2026-10-24 06:48:51 JST"
