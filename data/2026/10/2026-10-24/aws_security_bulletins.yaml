    "title": "CVE-2026-115812 and CVE-2026-115813: Issue in Amazon Web Services Multi Model Server"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-148-aws/"
    "published": "2026-10-24 02:45:37"
    "fetched": "2026-10-24 03:51:44"
    "summary": "<p><b>Bulletin ID:</b> 2026-148-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/23/2026 10:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon Web Services Multi Model Server (MMS) is an open source tool for serving machine learning models for inference. It was published by AWS on GitHub, PyPI, and Docker Hub, and reached end of life; its source repository has been archived and read-only since November 20, 2025.</p> \n<p><b>CVE-2026-115812:</b> An issue in model archive extraction could allow a crafted model archive to write files outside the intended directory, potentially resulting in code execution with the privileges of the MMS process.</p> \n<p><b>CVE-2026-115813:</b> An issue in the model download path could allow the MMS management interface to be directed to make requests to unintended network destinations.</p> \n<p><b>Impacted versions:</b> &lt;=1.1.11 (all released versions)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-148-aws/\">Read this article</a></p>"
"last_updated": "2026-10-24 03:51:44 JST"
