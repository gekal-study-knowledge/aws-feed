"overview": |
  この日は 10 件 (Bedrock の Web Search の発表が表記違いで 2 件重複) で、セキュリティ速報 2 件、重複する IP アドレス範囲をまたぐ接続、そしてエージェントの学習と事例が中心でした。セキュリティ速報はいずれも Important (要対応) です。1 件目は AWS Multi Model Server (MMS) の 2 件の CVE です (Bulletin ID: 2026-148-AWS、2026 年 10 月 23 日 10:30 PDT 公開)。MMS は推論のために機械学習モデルを提供するオープンソースのツールで、GitHub・PyPI・Docker Hub で公開されていましたが既に End of Life となり、ソースリポジトリは 2025 年 11 月 20 日からアーカイブされ読み取り専用です。CVE-2026-115812 はモデルアーカイブの展開処理の問題で、細工したモデルアーカイブが意図したディレクトリの外にファイルを書き込み、MMS プロセスの権限でコードが実行される可能性があります。CVE-2026-115813 はモデルのダウンロード経路の問題です。2 件目の CVE-2026-115845 は AWS MCP Server の run_script ツールの Python サンドボックスにおける検証の不備です (Bulletin ID: 2026-149-AWS、同日 12:00 PDT 公開)。AWS MCP Server は Model Context Protocol (MCP) 経由で AI エージェントに AWS へのアクセスを提供するマネージドなサーバーで、run_script はサンドボックス環境で Python スクリプトを実行します。禁止する入力の一覧が不完全だったため、認証済みのリモートユーザーが細工したスクリプトによって自分の隔離されたセッション環境内で任意のコードを実行できる可能性がありました。マネージドサービスとして AWS のみがホストしているため、利用者側で対象となるバージョンはありません。ネットワークでは、AWS Transit Gateway と AWS Cloud WAN が、Regional Private NAT Gateway との統合によってアタッチメント上で 1 対 1 のネットワークアドレス変換 (NAT) をマネージドで提供するようになりました。同じ IP アドレス範囲を使うプライベートネットワーク同士を、どちらのネットワークも再採番せず、NAT アプライアンスを置かず、戻りトラフィックのルールも書かずに接続できます。CIDR が重複するネットワークは長く通信できず、合併・買収、AWS Site-to-Site VPN でのパートナーネットワークとの接続、マルチクラウドの接続、独立に作られた VPC 同士の相互接続でよく障害になっていました。コンタクトセンターでは、Amazon Connect Customer Global Resiliency がリンクされた AWS リージョンをまたぐ永続的なチャットに対応しました。利用者は、コンテキスト・メタデータ・トランスクリプトを引き継いだまま以前の会話を再開でき、たとえば米国東部 (バージニア北部) で始めたチャットを、後からリンク先の米国西部 (オレゴン) リージョンで、会話履歴とチャットの添付ファイルごと続けられます。利用者が情報を言い直す必要がなくなり、エージェントはリージョンをまたぐ会話履歴全体を見て対応できます。機械学習ブログでは 4 本が公開されました。1 本目はマルチターン強化学習 (MTRL) の実践ガイドで、ラベル付けされた各ステップではなく複数ステップのタスク全体の結果でモデルを学習させるという考え方を、Wordle を題材にエージェントと報酬の Amazon Bedrock AgentCore へのデプロイ、データセットの準備、学習、提供時の設定での評価まで一通り追っています。2 本目は SageMaker AI のエンドポイントのオートスケーリングを AWS CDK で扱う方法です。Application Auto Scaling を登録済みのエンドポイントを更新すると AWS CloudFormation と AWS CDK のデプロイが失敗するため、CloudFormation のカスタムリソースでオートスケーリングの登録解除と再登録を自動化する再利用可能な CDK コンストラクトを作り、エンドポイントとスケーリングを 1 回のデプロイで更新できるようにします。3 本目は Amazon Quick Sight のレイヤーマップが同じ GeoJSON のワークフローから Point と LineString のジオメトリに対応したことで、店舗の位置とその間の経路を一緒に描けるようになりました。レイヤーマップが求めるデータセットと GeoJSON の構造、点と線のどちらを選ぶか、表示範囲の制御・ジオメトリの重ね方・GeoJSON の動的な更新の手法を扱っています。4 本目は Bayer Crop Science の事例で、育種担当者・アナリスト・研究者が分析プラットフォームについて自然言語で質問できるマルチエージェントの基盤 Agentic Decision Engine (ADE) を Amazon Bedrock AgentCore 上に構築し、AWS Unified Operations で本番運用に備えた経緯と 5 つの設計判断が紹介されています。あわせて、Amazon Bedrock の Web Search が、モデルの応答を根拠づける検索結果をより精密に制御する 2 つの機能に対応しました。ドメインフィルタリングとユーザーの位置情報で、いずれも既存の OpenAI Responses API のリクエスト内で web_search ツールに直接設定します。ドメインフィルタリングでは filters パラメータを使い、信頼できる情報源に限定するために最大 100 件の allowed_domains を指定するか、含めたくない情報源を除くために最大 100 件の blocked_domains を指定できます。特定のサイトだけに根拠づけたい場合や、特定のドメインを結果から外したい場合に役立ちます。
