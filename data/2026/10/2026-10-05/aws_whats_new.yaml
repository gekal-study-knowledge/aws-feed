    "title": "AWS Private CA now provides detailed certificate issuance logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-private-ca-certificate-issuance-logs/"
    "published": "2026-10-05 18:00:00"
    "fetched": "2026-10-06 02:47:56"
    "summary": "<p>AWS Private CA announces detailed certificate issuance logs, a new AWS CloudTrail service event that records the complete certificate content, issuing CA information, requester identity, and signing status for every issuance. You can use these events for compliance auditing, certificate inventory, algorithm migration tracking, and failed-issuance monitoring. Previously, the CloudTrail management event for the IssueCertificate API confirmed that the API call succeeded by providing a certificate ARN but did not capture the certificate content, information about the CA that signed it, or issuances that failed before signing.</p>\n<p>The new IssueCertificateDetails event captures the complete to-be-signed (TBS) certificate with all X.509 fields and extensions, plus convenience fields for the subject, issuer, serial number, validity period, template, and signing algorithm. Events are emitted for both successful and failed issuance, so pre-signing failures such as name constraints violations now produce a record with a failure explanation. Each event identifies the requester: the account and IAM principal for direct API callers, or the service principal for certificates issued through AWS Private CA connectors or integrated AWS services. In cross-account configurations, the event is delivered to the CA owner account.</p>\n<p>The event is delivered automatically as a CloudTrail management event, with no configuration or opt-in required and no additional cost beyond standard AWS CloudTrail pricing. Because it flows through CloudTrail, you can act on it in real time with Amazon EventBridge or query it in batch with Amazon Athena for certificate auditing, inventory, tracking, and monitoring.&nbsp;This feature is available in all AWS Regions where AWS Private CA is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/privateca/latest/userguide/logging-using-cloudtrail-pca.html#pca-service-events\" style=\"background-color: rgb(255,255,255);\">AWS Private CA User Guide</a>.</p>"
  "2124c0f4c149dbd093f3f3ea1174f10c":
    "id": "2124c0f4c149dbd093f3f3ea1174f10c"
    "title": "Announcing Amazon Nova 2.5 Sonic with improved reasoning for voice agents"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-nova-2.5-sonic/"
    "published": "2026-10-05 17:10:00"
    "fetched": "2026-10-06 13:38:31"
    "summary": "<p>Today, we announce the general availability of Amazon Nova 2.5 Sonic, our latest speech-to-speech model for natural, real-time voice agents. This release brings improved reasoning, instruction following, and tool-calling accuracy to real-time voice applications. The model also delivers lower latency, enabling faster, more natural interactions.</p>\n<p>Nova 2.5 Sonic helps voice agents maintain context, follow multi-step instructions, and use connected tools to complete customer tasks. For example, a customer-service agent can look up an order, check return eligibility, and initiate a return within a conversation. These improvements help developers build more capable voice agents for customer service, personal AI assistants, and real-time conversational applications.</p>\n<p>Nova 2.5 Sonic builds on existing capabilities, including robust speech understanding, expressive voices in seven languages, and controllable turn-taking, alongside support for voice and text in the same session, asynchronous tool calling, and a 256K context window. Developers can also use Nova 2.5 Sonic with Strands Bidi Agents, now generally available, to build production voice agents in a few lines of code, with longer conversations and connections to other agents.</p>\n<p>Nova 2.5 Sonic is available in Amazon Bedrock in the US East (N. Virginia), US West (Oregon), Europe (Stockholm), and Asia Pacific (Tokyo) AWS Regions, at the same pricing as Nova 2 Sonic. To learn more, visit the <a href=\"https://aws.amazon.com/nova/models/\">Amazon Nova models page</a>. To get started, see the <a href=\"https://docs.aws.amazon.com/nova/latest/nova2-userguide/what-is-nova-2.html\">Amazon Nova user guide</a>, and<a href=\"https://strandsagents.com/blog/bidi-agents-now-ga/\">&nbsp;blog on building voice agents with Nova 2.5 Sonic and Strands Bidi Agents</a>.</p>"
