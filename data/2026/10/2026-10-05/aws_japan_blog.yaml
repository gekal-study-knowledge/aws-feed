    "summary": "週刊生成AI with AWS, 朝晩すっかり涼しくなった2026年9月28日週号 – オリックス様のAmazon Bedrock AgentCore GatewayによるPATPOSTのMCPサーバー化事例、日立産業制御ソリューションズ様とのKiroワークショップ、Kiro workflowsの紹介含む18件のブログ記事を紹介。サービスアップデートでは、Claude Sonnet 5.5・GPT-6.1 Sol・Grok 4.7のAWS提供開始、Amazon Bedrock Managed Agents, powered by OpenAIのプレビュー開始、AWS MCP Serverの東京リージョン対応含む25件を紹介。"
