    "published": "2026-10-05 11:44:09"
    "fetched": "2026-10-05 17:13:16"
    "summary": "Amazon Route 53 Resolver DNS Firewall で Palo Alto Networks Advanced DNS Security が GA、AWS Backup の論理的エアギャップボールトが Amazon FSx for NetApp ONTAP に対応、OpenAI GPT-6.1 Sol が Amazon Bedrock で GA、Aurora PostgreSQL から Apache Iceberg / Parquet データを直接クエリ可能に、Amazon Aurora serverless のスケーリングが高速化、Amazon RDS で AMD ベースの M8a インスタンスをサポート、Amazon CloudWatch Logs で頻繁にクエリされるフィールドを自動インデックス化、AWS IAM Identity Center のマルチリージョンサポートの対象リージョンを拡大、AWS Health に version catalog 追加、AWS アカウントで電話番号の検証をサポート等"
