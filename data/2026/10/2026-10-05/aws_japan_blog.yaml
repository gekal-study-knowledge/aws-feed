    "title": "Claude Sonnet 5.5 が Kiro で利用可能になりました"
    "link": "https://aws.amazon.com/jp/blogs/news/sonnet-5-5/"
    "published": "2026-10-05 12:15:36"
    "fetched": "2026-10-05 17:13:16"
    "summary": "Claude Sonnet 5.5 が 2026 年 10 月 2 日より Kiro IDE、CLI、Crew、Web のすべてで利用可能になりました。Anthropic のこれまでで最も高速な Sonnet モデルであり、Claude Sonnet 5 から明確に進化しています。社内のベンチマークでは、Sonnet 5.5 は Sonnet 5 を上回る結果を示し、トークン消費と速度の両面でも効率が向上しました。Sonnet 5.5 は、Opus 5.5 に続く Claude 5.5 ファミリーの 2 番目のモデルです。"
  "ffd45915026cce2b214b514ca5e300b1":
    "id": "ffd45915026cce2b214b514ca5e300b1"
    "title": "週刊AWS – 2026/9/28週"
