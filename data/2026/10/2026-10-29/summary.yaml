"overview": |
  この日は 5 ソースから 8 本。セキュリティ速報は 1 件で Important (要対応)。CVE-2026-118029 (Bulletin ID: 2026-153-AWS、2026 年 10 月 28 日 08:30 PDT 公開) は AWS SDK for pandas (awswrangler) の Athena モジュールで、既定のクエリ結果保存先の所有者を検証していなかった問題で、事前に作成された S3 バケットを介してリモートの第三者が Athena のクエリ結果を読み取ったり、呼び出し元に返る結果セットを改ざんしたりできるおそれがある。対象は awswrangler 3.16.1 未満。What's New では Amazon EKS Auto Mode が Kubernetes Gateway API に対応し、標準的で移植性のある方法でアプリケーションへのトラフィックを定義できるようになった。アーキテクチャでは、Smarsh がコンソールでまだ選べない Well-Architected の Agentic AI Lens を Claude のスキルとして実装してエージェント型ワークロードのレビューを自動化した事例と、世界 12,500 以上のホテルを支える Revinate の Amazon API Gateway による API 導入の加速。機械学習では Amazon Nova Act を使ったエージェント型 QA 自動化の連載第 3 回 (テストの整理と所有権の管理)、Ray Train DLC と EFA を使った EKS 上での分散学習 (PyTorch FSDP で Qwen2.5-1.5B をファインチューニング)、Bedrock AgentCore 上にガバナンスの効いたマルチアカウントの Agentic AI Platform を構築するオープンソースのリファレンスブループリント。AWS Japan Blog では AMOREPACIFIC が Kiro の spec-driven development と SAP 専用 MCP サーバー、Steering ファイルを組み合わせてレガシーな SAP ECC 6.0 環境に AI 駆動開発を導入した事例が公開された。
