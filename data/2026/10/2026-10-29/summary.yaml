"overview": |
  この日は 6 ソースから 25 本。セキュリティ速報は 3 件。CVE-2026-118029 (Bulletin ID: 2026-153-AWS、Important、2026 年 10 月 28 日 08:30 PDT 公開) は AWS SDK for pandas (awswrangler) の Athena モジュールで既定のクエリ結果保存先の所有者を検証していなかった問題で、事前に作成された S3 バケットを介してリモートの第三者が Athena のクエリ結果を読み取ったり結果セットを改ざんしたりできるおそれがあり、awswrangler 3.16.1 未満が対象。CVE-2026-115415 (2026-154-AWS、同日 12:30 PDT) は Strands Agents Tools の environment ツールがマスキング指定を LLM からツールスキーマ経由で受け付けていたため、細工されたプロンプトでマスキングを無効化させ、クラウド認証情報や API キーを含むホストの環境変数を操作者の同意なく平文で返させられる問題で、0.1.0 以上 0.8.6 未満が対象。CVE-2026-111497 (2026-155-AWS、同日 15:00 PDT) はネイティブ Brotli 伸長ライブラリの問題で、影響を受けるアプリケーションで第三者によるコード実行やプロセスメモリの読み取りが起こりうる。Lambda、Amplify、App Runner、CloudWatch Synthetics、CodeBuild、Elastic Beanstalk、Elemental MediaLive が対応中で、一部サービスでは利用者の対応が必要。What's New では Amazon EKS Auto Mode が Kubernetes Gateway API に対応、EKS Dashboard が全クラスターの CA ローテーション状況を一覧表示 (2018 年以降に作成されたクラスターの CA は有効期間 10 年でローテーションの準備時期に近づいている)、ECS Managed Instances がインスタンス横断と Spot の統合 (consolidation) に対応、Lambda Managed Instances で OCI イメージの SOCI 遅延読み込みに対応しコンテナ起動を最大 70% 短縮、Lambda durable functions が実行履歴を外部に送る Durable Execution Telemetry Exporter と自然言語で照会できる MCP サーバーを提供 (Compute Blog の解説では送信先は 13 種類)、OpenSearch Serverless の次世代版が時系列コレクションに対応し低コストのウォーム層を追加 (コレクションあたり最大 100 TB のホットストレージ、日本語ブログでも紹介)、Bedrock AgentCore CLI 1.0 (@aws/agentcore 1.0.0) が一般提供、Amazon Quick が分類器でエージェントの操作を審査し定型操作は自動承認・重要な操作は人に回すスマート承認に対応、RDS for Oracle が 19c と 26ai 向けの 2026 年 9 月 MRP (7 月 RU ベース、9 月 CSPU、タイムゾーンファイル DST v46) に対応した。アーキテクチャでは Smarsh の Agentic AI Lens による Well-Architected レビュー自動化と Revinate の Amazon API Gateway 活用。機械学習では Amazon Nova Act によるエージェント型 QA 自動化の連載第 3 回、Ray Train DLC と EFA による EKS 上の分散学習、Bedrock AgentCore 上のマルチアカウントな Agentic AI Platform のリファレンスブループリント。AWS Japan Blog では AMOREPACIFIC が Kiro でレガシーな SAP ECC 6.0 に AI 駆動開発を導入した事例、Kiro for Students の対象を世界の 41 大学に拡大 (1 年間無料・毎月 1,000 クレジット)、2026 年 7 月 28 日の改定でステートレスな HTTP 型になった MCP のエンドポイントを CloudFront / ALB と AWS WAF でエッジ保護する 9 つのユースケース、Kiro・Claude Code・Codex のいずれにも適用できる金融機関向け AI-DLC のガバナンスハーネス、2026 年 11 月から週次で開くセキュリティハンズオン (AWS Security Agent、WAF、Inspector など) の案内、re:Invent 2026 のクラウドと AI の支出管理ガイドが公開された。
