    "title": "CVE-2026-118029 - Unverified ownership of the default Athena query result location in AWS SDK for pandas"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-153-aws/"
    "published": "2026-10-29 00:40:38"
    "fetched": "2026-10-29 04:18:33"
    "summary": "<p><b>Bulletin ID:</b> 2026-153-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 10/28/2026 08:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS SDK for pandas (awswrangler) is an open-source Python library that integrates pandas with AWS data services such as Amazon Athena, Amazon S3, and AWS Glue. We identified CVE-2026-118029 in the Athena module, where unverified ownership of the default query result location could allow a remote user to read Athena query results and tamper with result sets returned to the caller via a pre-created S3 bucket.</p> \n<p><b>Impacted versions:</b> awswrangler &lt; 3.16.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-153-aws/\">Read this article</a></p>"
  "713c2ec1cac932901b5bdf664fbaab9e":
    "id": "713c2ec1cac932901b5bdf664fbaab9e"
    "title": "CVE-2026-115415 - Secret masking bypass in the environment tool in Strands Agents Tools"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-154-aws/"
    "published": "2026-10-29 04:39:08"
    "fetched": "2026-10-29 08:51:22"
    "summary": "<p><b>Bulletin ID:</b> 2026-154-AWS<br /> <b>Publication Date:</b> 10/28/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>We identified CVE-2026-115415, an issue where the environment tool accepted a masking parameter from the large language model (LLM) through its tool schema. A crafted prompt, delivered through content the agent is asked to process, could instruct the model to call the tool with masking turned off. The tool would then return the agent host's environment variables in cleartext, including cloud credentials and API keys, without prompting the operator for consent.</p> \n<p><b>Impacted versions:</b> &gt;= 0.1.0 AND &lt; 0.8.6</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-154-aws/\">Read this article</a></p>"
  "8a1e6e5fb5d84431debf6450de73e15b":
    "id": "8a1e6e5fb5d84431debf6450de73e15b"
    "title": "CVE-2026-111497: Native Brotli Decoder Remote Code Execution and Memory Disclosure"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-155-aws/"
    "published": "2026-10-29 06:58:12"
    "fetched": "2026-10-29 08:51:22"
    "summary": "<p><b>Bulletin ID:</b> 2026-155-AWS<br /> <b>Publication Date:</b> 10/28/2026 15:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS is aware of CVE-2026-111497, an issue in the native Brotli decompression library that could allow a third party to run code or read process memory in an affected application. AWS Lambda, AWS Amplify, AWS App Runner, Amazon CloudWatch Synthetics, AWS CodeBuild, AWS Elastic Beanstalk, and AWS Elemental MediaLive are addressing this issue. Some services require customer action. For details, see the bulletin.</p> \n<p><a href=\"https://aws.amazon.com/security/security-bulletins/2026-155-aws/\">Read this article</a></p>"
