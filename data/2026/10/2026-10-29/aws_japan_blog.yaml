  "8f34638546cef001daba29a9e9b92211":
    "id": "8f34638546cef001daba29a9e9b92211"
    "title": "AMOREPACIFIC が Kiro でレガシー SAP ECC に AI 駆動開発を導入した方法"
    "link": "https://aws.amazon.com/jp/blogs/news/how-amorepacific-brought-ai-driven-development-to-sap-ecc-with-kiro/"
    "published": "2026-10-29 00:36:46"
    "fetched": "2026-10-29 04:18:32"
    "summary": "AMOREPACIFIC の ERP Platform Planning チームが、GUI ベースのレガシーな SAP ECC 6.0 環境に AI 駆動開発を導入した事例です。Kiro の spec-driven development、AWS ソリューションアーキテクトが構築した SAP 専用 MCP サーバー、そして Steering ファイルを組み合わせ、組織のコーディング標準に従ったコード生成を実現しました。ABAP と SAPUI5 の 4 プロジェクトで、生産性は最大 72% 向上し、FS/TS ドキュメント作成時間は 80% 削減されました。"
  "9414fc06408b79ae169aa58e48479d87":
    "id": "9414fc06408b79ae169aa58e48479d87"
    "title": "Kiro for Students の対象大学を新たに 41 校追加しました"
    "link": "https://aws.amazon.com/jp/blogs/news/41-more-universities/"
    "published": "2026-10-29 07:27:43"
    "fetched": "2026-10-29 08:51:22"
    "summary": "Kiro for Students の対象を、世界の 41 大学に広げます。対象校の学生は Kiro を 1 年間無料で使えます。毎月 1,000 クレジットと、プレミアムモデルなどの有料機能が含まれます。"
  "482a60afcbbcb1aae082575648463b37":
    "id": "482a60afcbbcb1aae082575648463b37"
    "title": "金融機関が AI-DLC を素早く効果的に運用に乗せる方法"
    "link": "https://aws.amazon.com/jp/blogs/news/how-financial-institutions-can-operationalize-ai-dlc-quickly-and-effectivel/"
    "published": "2026-10-29 12:23:34"
    "fetched": "2026-10-29 13:10:27"
    "summary": "金融機関は AI コーディングエージェントを急速に導入していますが、多くの機関には、規制当局や自社のリスクアペタイトを満たすガバナンスの枠組みがありません。その結果、強力なツールが組織の統制の外でコードを生成しています。以前の記事「金融サービスのための AI 駆動開発ライフサイクル」（AI-DLC）では、お客様がこれをどう運用に乗せているかを説明しました。今回はさらに踏み込みます。チームが Amazon の Kiro、Anthropic Claude Code、OpenAI Codex のどれを使っていても、エージェントを組織のルールの範囲内で動かすためのガバナンス層をどう構成すればよいのでしょうか。この記事では、ガバナンスハーネスを数日で構築する方法と、エンジニアリングチームとガバナンス・リスク・コントロール（GRC）チームがそこから何を得られるかを説明します。"
  "0bdc7959a757a79e9074f5fb7bd264cc":
    "id": "0bdc7959a757a79e9074f5fb7bd264cc"
    "title": "Amazon OpenSearch Serverless NextGen の時系列コレクションのご紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-the-next-generation-of-serverless-time-series-for-amazon-opensearch-service/"
    "published": "2026-10-29 11:08:58"
    "fetched": "2026-10-29 13:10:27"
    "summary": "本日、Amazon OpenSearch Serverless NextGen が時系列コレクションに対応したことを発表します。クラスターのプロビジョニングや管理なしでログ、メトリクス、トレース、イベントデータを取り込み、保存、分析でき、アラートと異常検知も利用できます。コレクションあたり最大 100 TB のホットストレージをサポートし、アプリケーション監視、セキュリティ分析、IoT テレメトリなど大規模なオブザーバビリティワークロードに対応します。"
  "b2984bfea8bb447b2929b47a08af8abd":
    "id": "b2984bfea8bb447b2929b47a08af8abd"
    "title": "Amazon CloudFront と AWS WAF によりエッジで MCP エンドポイントを保護する"
    "link": "https://aws.amazon.com/jp/blogs/news/protect-mcp-endpoints-at-the-edge-with-amazon-cloudfront-and-aws-waf/"
    "published": "2026-10-29 09:49:07"
    "fetched": "2026-10-29 13:10:27"
    "summary": "MCP は、 AI エージェントがツールやデータとやり取りするための標準的な方法として急速に普及しました。もともと MCP は、長時間のセッション、永続的な接続、クライアントとサーバーインスタンスの紐付けを前提としたステートフルなプロトコルでした。 2026 年 7 月 28 日の改定では、 MCP がステートレスな HTTP リクエスト/レスポンス型のプロトコルとして再設計されました。これにより、すべての MCP リクエストは自己完結した POST リクエストとなり、ネットワーク上ではほかの REST API 呼び出しと見分けがつかない形になりました。その結果、ほかの HTTP API の前段ですでに利用しているのと同じレイヤー 7 の検査、変換、最適化を、 MCP サーバーのコードを変更することなく CDN や AWS WAF のレイヤーで適用できるようになります。本記事では、Amazon CloudFront または Application Load Balancer (ALB) の背後にデプロイした MCP エンドポイントを、 AWS WAF で保護し、可視化する方法を紹介します。新しい仕様によって簡単に適用できる、次の 9 つのユースケースを順に説明します。"
"last_updated": "2026-10-29 13:10:27 JST"
