  408856bb0f428901e521d3fead128caa:
    id: 408856bb0f428901e521d3fead128caa
    title:
      Application Performance Monitoring Enabled by Default in CloudWatch Observability
      EKS Add-on
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/application-performance-monitoring-cloudwatch-eks/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>Today, Amazon CloudWatch Observability EKS add-on version 5.0.0 automatically\
      \ enables CloudWatch Application Signals — Amazon's application performance\
      \ monitoring (APM) capability — for all new installations and upgrades, eliminating\
      \ the previous manual opt-in step. Amazon Elastic Kubernetes Service (EKS) is\
      \ a managed Kubernetes service that simplifies running containerized applications\
      \ at scale. The CloudWatch Observability add-on for EKS extends native Kubernetes\
      \ observability by integrating Enhanced Container Insights, Container Logs,\
      \ and now Application Signals directly into your clusters. The Observability\
      \ add-on automatically instruments your services to collect traces, metrics,\
      \ and logs for a unified, application-centric view. For DevOps engineers, platform\
      \ teams, and developers who needed application-level visibility into their EKS-hosted\
      \ services — such as service latency, error rates, and request traces — this\
      \ change closes that gap by making those capabilities available out of the box,\
      \ so teams can focus on building and operating applications rather than configuring\
      \ observability tooling.azon EKS.</p> \n<p>With Application Signals now enabled\
      \ by default, customers immediately benefit from automatic service instrumentation\
      \ — no manual configuration or Kubernetes workload annotations required — along\
      \ with pre-built dashboards that surface application performance metrics and\
      \ a rich troubleshooting experience that goes beyond infrastructure-level data\
      \ to help teams quickly identify and resolve issues. For example, a platform\
      \ team managing a microservices application on EKS can now detect latency spikes\
      \ or error rate increases at the service level without any additional setup,\
      \ accelerating root cause analysis during incidents.</p> \n<p>This feature is\
      \ available in all commercial AWS regions where Amazon CloudWatch Application\
      \ Signals is available; to get started, you can refer to the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html#Container-Insights-setup-EKS-appsignalsconfiguration\"\
      >Amazon CloudWatch Application Signals documentation</a> and upgrade to version\
      \ 5.0.0 of the add-on.</p>"
  7f86b3e8c015b6643ce2b1fae625aad3:
    id: 7f86b3e8c015b6643ce2b1fae625aad3
    title: Amazon SageMaker HyperPod now supports API-driven Slurm configuration
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-sagemaker-hyperpod-slurm/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>Amazon SageMaker HyperPod now supports API-driven Slurm configuration,\
      \ enabling you to define Slurm topology and shared filesystem configurations\
      \ directly in the cluster create and update APIs or through the AWS Console.\
      \ SageMaker HyperPod helps you provision resilient clusters for running machine\
      \ learning (ML) workloads and developing state-of-the-art models such as large\
      \ language models (LLMs), diffusion models, and foundation models (FMs).</p>\
      \ \n<p>With this new API-driven configuration, you can now specify Slurm node\
      \ types including Controller, Login, and Compute for cluster instance groups;\
      \ instance group to partition mappings; and FSx for Lustre and FSx for OpenZFS\
      \ filesystem mounts per instance group directly in the cluster API definition\
      \ or through the advanced configuration section in the AWS Console. When you\
      \ modify partition-node mappings directly in Slurm's native configuration files\
      \ to fine-tune cluster resource assignments, Slurm's partition-node configurations\
      \ can drift from HyperPod's view. A new cluster-level SlurmConfigStrategy helps\
      \ you manage drift with three options: Managed, Overwrite, and Merge. The Managed\
      \ strategy allows you to manage instance group to partition mappings completely\
      \ via the API or Console, and automatically detects drift in partition-to-node\
      \ mappings during scale-up or scale-down operations. When drift is detected,\
      \ cluster updates are paused until you resolve it by switching to the Overwrite\
      \ strategy to force API-defined mappings, the Merge strategy to preserve manual\
      \ customizations, or by directly updating Slurm configurations to align with\
      \ HyperPod.</p> \n<p>API-driven Slurm configuration is available in all AWS\
      \ Regions where SageMaker HyperPod is available. To get started, you can use\
      \ the AWS Management Console, AWS CLI, AWS CloudFormation, or AWS SDKs. For\
      \ more information, see the Amazon SageMaker HyperPod documentation for creating\
      \ clusters using the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-quickstart.html\"\
      \ target=\"_blank\">Console</a>&nbsp;or the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/smcluster-getting-started-slurm-cli.html\"\
      \ target=\"_blank\">CLI</a>, and the API reference for&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateCluster.html\"\
      \ target=\"_blank\">CreateCluster</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateCluster.html\"\
      \ target=\"_blank\">UpdateCluster</a>.</p>"
