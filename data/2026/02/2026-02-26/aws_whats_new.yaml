entries:
  202c1c8e8ca019afdb79faaeeb508421:
    id: 202c1c8e8ca019afdb79faaeeb508421
    title: AWS Security Hub launches Extended plan for pay-as-you-go partner solutions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/sec-hub-extended/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      <p>Today, we're announcing the general availability of AWS Security Hub
      Extended, a new plan that extends unified security operations across your enterprise
      through a single-vendor experience. This plan helps address the complexity of
      managing multiple vendor relationships and lengthy procurement cycles by bringing
      together the best of AWS detection services and curated partner security solutions.<br
      /> <br /> The Security Hub Extended plan delivers three critical advantages.
      First, it helps streamline procurement by consolidating solution usage into
      one bill—thereby reducing procurement complexity while preserving direct access
      to each provider's domain expertise. AWS Enterprise Support Customers also benefit
      from unified Level 1 support from AWS. Second, it enables you to establish more
      comprehensive protection by bringing together the best of AWS detection services
      with curated partner solutions across endpoint, identity, email, network, data,
      browser, cloud, AI, and security operations. Third, it helps enhance operational
      efficiency by streamlining security findings in a standard format, providing
      centralized visibility across your security environment while reducing the burden
      of manual integration work.<br /> <br /> You can access and review partner solutions
      across security categories through the Security Hub console, selecting only
      the solutions you need with flexible pay-as-you-go or flat-rate pricing—no upfront
      investments or long-term commitments required. With AWS as the seller of record,
      the Extended plan may be eligible for AWS Private Pricing opportunities. This
      gives you the flexibility to add or remove security categories as your business
      needs evolve, while enabling you to streamline vendor contract negotiations
      and consolidate billing. For a list of AWS commercial Regions where Security
      Hub is available, see the <a href="https://us-east-1.quicksight.aws.amazon.com/sn/account/amazonbi/spaces/04f16102-b2e5-48f5-ba57-dbb41b6ea5be">AWS
      Region table</a>. For more information about pricing, visit the AWS Security
      Hub <a href="https://aws.amazon.com/security-hub/pricing/">pricing page</a>.
      To get started, visit the AWS Security Hub <a href="https://console.aws.amazon.com/securityhub/v2/home">console</a>
      or <a href="https://aws.amazon.com/security-hub/?nc=sn&amp;loc=1">product page</a>.</p>
  7651a14a689afbd5b131f9fbc0604ce9:
    id: 7651a14a689afbd5b131f9fbc0604ce9
    title:
      Amazon Cognito enhances client secret management with secret rotation and
      custom secrets
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-cognito-client-secret-lifecycle/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>Amazon Cognito enhances client secret lifecycle management for app\
      \ clients of Cognito user pools by adding client secret rotation and support\
      \ for custom client secrets. Cognito helps you implement secure sign-in and\
      \ access control for users, AI agents, and microservices in minutes, and a Cognito\
      \ app client is a configuration that interacts with one mobile or web application\
      \ that authenticates with Cognito. Previously, Cognito automatically generated\
      \ all app client secrets. With this launch, in addition to the automatically\
      \ generated secrets, you have the option to bring your own custom client secrets\
      \ for new or existing app clients. Additionally, you can now rotate client secrets\
      \ on-demand and maintain up to two active client secrets per app client.</p>\
      \ \n<p>The new client secret lifecycle management capabilities address needs\
      \ for organizations with periodic credential rotation requirements, companies\
      \ improving security posture, and enterprises migrating from other authentication\
      \ systems to Cognito. Maintaining two active secrets per app client allows gradual\
      \ transition to the new secret without application downtime.</p> \n<p>Client\
      \ secret rotation and custom client secrets are available in all AWS Regions\
      \ where Amazon Cognito user pools are available. To learn more, see the&nbsp;<a></a><a\
      \ href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-client-apps.html\"\
      >Amazon Cognito Developer Guide</a>. You can get started using the new capabilities\
      \ through the AWS Management Console, AWS Command Line Interface (CLI), AWS\
      \ Software Development Kits (SDKs), or AWS CloudFormation.</p>"
  48478b55cc925fb79828644ee7e63685:
    id: 48478b55cc925fb79828644ee7e63685
    title: AWS Lambda Durable Execution SDK for Java now available in Developer Preview
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/lambda-durable-execution-java-preview/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>Today, AWS announces the developer preview of the AWS Lambda Durable\
      \ Execution SDK for Java. With this SDK, developers can build resilient multi-step\
      \ applications like order processing pipelines, AI-assisted workflows, and human-in-the-loop\
      \ approvals using Lambda durable functions, without implementing custom progress\
      \ tracking or integrating external orchestration services.</p> \n<p>Lambda durable\
      \ functions extend Lambda's event-driven programming model with operations that\
      \ checkpoint progress automatically and pause execution for up to a year when\
      \ waiting on external events. The new Durable Execution SDK for Java provides\
      \ an idiomatic experience for building with durable functions and is compatible\
      \ with Java 17+. This preview includes steps for progress tracking, waits for\
      \ efficient suspension, and durable futures for callback-based workflows.</p>\
      \ \n<p>To get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\"\
      \ target=\"_blank\">Lambda durable functions developer guide</a>&nbsp;and the&nbsp;<a\
      \ href=\"https://github.com/aws/aws-durable-execution-sdk-java/\" target=\"\
      _blank\">AWS Lambda Durable Execution SDK for Java on GitHub</a>. To learn more\
      \ about Lambda durable functions, visit the&nbsp;<a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\"\
      \ target=\"_blank\">product page</a>.</p> \n<p>On-demand functions are not billed\
      \ for duration while paused.&nbsp;For pricing details, see&nbsp;<a href=\"https://aws.amazon.com/lambda/pricing/\"\
      \ target=\"_blank\">AWS Lambda Pricing</a>. For information about AWS Regions\
      \ where Lambda durable functions are available, see the&nbsp;<a href=\"https://builder.aws.com/build/capabilities\"\
      \ target=\"_blank\">AWS Regional Services List</a>.</p>"
  7721aa5e5405c6427d6a5b63a6ed3563:
    id: 7721aa5e5405c6427d6a5b63a6ed3563
    title:
      Amazon Connect now supports dynamic dialing mode switching for outbound
      campaigns
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/connect-dynamic-dialing-modes/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>Today, AWS announces the general availability of dynamic dialing\
      \ mode switching for Amazon Connect Outbound Campaigns, which allows contact\
      \ center administrators to change between preview and non-preview dialing modes\
      \ during active campaign execution. Previously, campaigns were locked into their\
      \ initial dialing mode once started, requiring administrators to stop and restart\
      \ campaigns to adjust strategies. This launch solves the problem of inflexible\
      \ dialing strategies that couldn't adapt to real-time business needs and agent\
      \ availability changes.</p> \n<p>Dynamic dialing mode switching enables contact\
      \ centers to optimize agent productivity and campaign efficiency in real-time\
      \ without campaign interruptions. For example, you can automatically switch\
      \ from progressive dialing to preview mode when handling high-priority contacts\
      \ that require additional context, then revert back when traffic returns to\
      \ normal patterns. This flexibility is particularly valuable for campaigns with\
      \ varying contact priorities or fluctuating agent availability throughout the\
      \ day.</p> \n<p>Dynamic dialing mode switching is available at no additional\
      \ cost in all AWS Regions where Amazon Connect Outbound Campaigns is supported:\
      \ US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt),\
      \ Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific\
      \ (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town).</p> \n<p>To learn\
      \ more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/\"\
      >Amazon Connect Administrator Guide</a>&nbsp;or visit the&nbsp;<a href=\"https://aws.amazon.com/connect/\"\
      >Amazon Connect website</a>.&nbsp;</p>"
  6ea0a7162cd381082b687b5c4cb97deb:
    id: 6ea0a7162cd381082b687b5c4cb97deb
    title: Amazon EC2 M8i and M8i-flex instances are available in additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-m8i-m8i-flex-instances-additional-regions/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      <p>Starting today, Amazon EC2 M8i and M8i-flex instances are now available
      in US West (N. California), Europe (Paris), Asia Pacific (Hyderabad), and South
      America (Sao Paulo) regions. These instances are powered by custom Intel Xeon
      6 processors, available only on AWS, delivering the highest performance and
      fastest memory bandwidth among comparable Intel processors in the cloud. The
      M8i and M8i-flex instances offer up to 15% better price-performance, and 2.5x
      more memory bandwidth compared to previous generation Intel-based instances.
      They deliver up to 20% better performance than M7i and M7i-flex instances, with
      even higher gains for specific workloads. The M8i and M8i-flex instances are
      up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications,
      and up to 40% faster for AI deep learning recommendation models compared to
      M7i and M7i-flex instances.<br /> <br /> M8i-flex are the easiest way to get
      price performance benefits for a majority of general-purpose workloads like
      web and application servers, microservices, small and medium data stores, virtual
      desktops, and enterprise applications. They offer the most common sizes, from
      large to 16xlarge, and are a great first choice for applications that don't
      fully utilize all compute resources.<br /> <br /> M8i instances are a great
      choice for all general purpose workloads, especially for workloads that need
      the largest instance sizes or continuous high CPU usage. The SAP-certified M8i
      instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size
      for the largest applications.<br /> <br /> To get started, sign in to the <a
      href="https://aws.amazon.com/console/">AWS Management Console</a>. For more
      information about the new instances, visit the <a href="https://aws.amazon.com/ec2/instance-types/m8i/">M8i
      and M8i-flex</a> page or visit the <a href="https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/">AWS
      News</a> blog.</p>
  e373e78ebe446fd1d233cf418a550419:
    id: e373e78ebe446fd1d233cf418a550419
    title: Introducing Amazon EC2 I8g.metal-48xl instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/ec2-i8g-metal-48xl-generally-available/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      <p>AWS is announcing the general availability of Amazon EC2 Storage Optimized
      I8g.metal-48xl instances. I8g instances are powered by AWS Graviton4 processors
      that deliver up to 60% better compute performance compared to previous generation
      I4g instances. I8g instances use the latest third generation AWS Nitro SSDs,
      local NVMe storage that deliver up to 65% better real-time storage performance
      per TB while offering up to 50% lower storage I/O latency and up to 60% lower
      storage I/O latency variability. These instances are built on the <a href="https://aws.amazon.com/ec2/nitro/">AWS
      Nitro System</a>, which offloads CPU virtualization, storage, and networking
      functions to dedicated hardware and software enhancing the performance and security
      for your workloads.<br /> <br /> Amazon EC2 I8g instances are designed for I/O
      intensive workloads that require rapid data access and real-time latency from
      storage. These instances excel at handling transactional and real-time databases,
      including MySQL, PostgreSQL, and NoSQL solutions like ClickHouse, Apache Druid,
      and MongoDB. They're also optimized for real-time analytics platforms such as
      Apache Spark. I8g instances are available in 11 different sizes with up to 48xlarge
      (including 2 metal sizes), 1,536 GiB of memory, and 45 TB local instance storage.
      They deliver up to 100 Gbps of network performance bandwidth, and 60 Gbps of
      dedicated bandwidth for Amazon Elastic Block Store (EBS).<br /> <br /> To learn
      more, visit <a href="https://aws.amazon.com/ec2/instance-types/i8g/">EC2 I8g
      instances</a>. To begin your Graviton journey, visit the <a href="https://aws.amazon.com/ec2/graviton/level-up-with-graviton/">Level
      up your compute with AWS Graviton page</a>.</p>
  d6684ecdfc560ab5bf89798a429a159a:
    id: d6684ecdfc560ab5bf89798a429a159a
    title: Amazon ECS Managed Instances now integrates with Amazon EC2 Capacity Reservations
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/ecs-mi-ec2-capacity-reservations/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      '<p>Amazon Elastic Container Service (Amazon ECS) Managed Instances now
      integrates with Amazon EC2 Capacity Reservations, enabling you to leverage your
      reserved capacity for predictable workload availability, while ECS handles all
      infrastructure management. This integration helps you balance reliable capacity
      scaling with cost efficiency, helping achieve high availability for mission‑critical
      workloads.<br /> <br /> <a href="https://aws.amazon.com/ecs/managed-instances/">Amazon
      ECS Managed Instances</a> is a fully managed compute option designed to eliminate
      infrastructure management overhead, dynamically scale EC2 instances to match
      your workload requirements, and continuously optimize task placement to reduce
      infrastructure costs. With today’s launch, you can configure your ECS Managed
      Instances capacity providers to use capacity reservations by setting the capacityOptionType
      parameter to reserved, in addition to the existing spot and on-demand options.
      You can also specify reservation preferences to optimize cost and availability:
      use reservations-only to launch EC2 instances exclusively in reserved capacity
      for maximum predictability, reservations-first to prefer reservations while
      maintaining flexibility to fall back to on-demand capacity when needed, or reservations-excluded
      to prevent your capacity provider from using reservations altogether.<br />
      <br /> To get started, you can use the AWS Management Console, AWS CLI, AWS
      CloudFormation, or AWS SDKs to configure your ECS Managed Instances capacity
      provider by choosing capacityOptionType=reserved and providing a capacity reservation
      group and reservation strategy. This feature is now available in all AWS Regions.
      For more details, refer to the <a href="https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-instances-instance-types.html#managed-instances-instance-billing-and-purchase-options">documentation</a>.</p>'
  3505916abc49723bb692d60da2e85ab1:
    id: 3505916abc49723bb692d60da2e85ab1
    title:
      AWS Marketplace now supports multiple purchases of SaaS and Professional
      Services products
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/concurrent-agreements-february/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p>AWS Marketplace now supports Concurrent Agreements for SaaS and Professional\
      \ Services products, enabling buyers to make multiple purchases for the same\
      \ product within a single AWS account. Previously, buyers could only maintain\
      \ one active agreement per product per AWS account, requiring sellers to use\
      \ workarounds to support expansion deals. Concurrent Agreements removes this\
      \ constraint, allowing different business units to procure independently with\
      \ their own negotiated terms and pricing.</p> \n<p>Both buyers and sellers benefit\
      \ from the flexibility Concurrent Agreements provides. Buyers can accept multiple\
      \ offers for the same product without disrupting existing agreements, supporting\
      \ multi-team procurement within centralized AWS accounts, mid-term expansions,\
      \ and repeat purchases. Sellers can close multi-business unit deals that couldn't\
      \ happen before, transact expansions immediately instead of waiting for renewal\
      \ cycles, and eliminate the operational overhead of managing workarounds.&nbsp;</p>\
      \ \n<p>Concurrent Agreements is enabled by default for all Professional Services\
      \ listings starting today, with no seller action required. For SaaS listings,\
      \ sellers must update their AWS Marketplace integration to handle multiple active\
      \ subscriptions, including updating subscription notifications to use EventBridge\
      \ and updating entitlement and metering APIs. Starting June 1, 2026, support\
      \ for Concurrent Agreements will be required for new SaaS products. Sellers\
      \ who have completed the integration work can opt in to enable Concurrent Agreements\
      \ for their SaaS products now.&nbsp;</p> \n<p>This capability is available in\
      \ all&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/supported-regions.html\"\
      >AWS Regions</a>&nbsp;where AWS Marketplace is supported. Concurrent Agreements\
      \ purchasing is available on SaaS products where sellers have completed the\
      \ integration, and is enabled by default for all Professional Services listings.\
      \ To learn more about enabling Concurrent Agreements as a seller of SaaS products,\
      \ review the <a href=\"https://catalog.workshops.aws/mpseller/en-US/saas/integration-for-concurrent-agreements\"\
      >Concurrent Agreements integration lab</a>.</p>"
  ec8c9ceed62faed9733ab9cd827c4888:
    id: ec8c9ceed62faed9733ab9cd827c4888
    title:
      Amazon CloudWatch now provides lock contention diagnostics for Amazon RDS
      for PostgreSQL
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-cloudwatch-lock-contention-diagnostics-rds-postgresql/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      <p>Amazon CloudWatch Database Insights now provides lock contention diagnostics
      for Amazon RDS for PostgreSQL instances. This feature helps you identify the
      root cause behind both ongoing and historical lock contention issues within
      minutes. The lock contention diagnostics feature is available exclusively in
      the Advanced mode of CloudWatch Database Insights.<br /> <br /> With this launch,
      you can visualize a locking condition in the Database Insights console, which
      shows the relationship between blocking and waiting sessions. The visualization
      helps you quickly identify the dominating sessions, queries, or objects causing
      lock contention. Additionally, this feature persists historical locking data
      for 15 months, allowing you to analyze and investigate historical locking conditions.
      You no longer need to manually run custom queries or rely on application logs
      to diagnose lock contention issues, streamlining the troubleshooting process.<br
      /> <br /> You can get started with this feature by enabling the Advanced mode
      of CloudWatch Database Insights on your Amazon RDS for PostgreSQL clusters using
      the RDS console, AWS APIs, or the AWS SDK. CloudWatch Database Insights delivers
      database health monitoring aggregated at the fleet level, as well as instance-level
      dashboards for detailed database and SQL query analysis.<br /> <br /> CloudWatch
      Database Insights is available in&nbsp;<a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">all public AWS Regions</a><a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">&nbsp;</a>and
      offers vCPU-based pricing – see the&nbsp;<a href="https://aws.amazon.com/cloudwatch/pricing/"
      target="_blank">pricing page</a>&nbsp;for details. For further information,
      visit the<a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Database-Insights.html"
      target="_blank">&nbsp;</a><a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Database-Insights.html"
      target="_blank">Database Insights documentation.</a></p>
  1fa35ba240152e807c7da5947871387a:
    id: 1fa35ba240152e807c7da5947871387a
    title: Amazon SNS now supports push notifications in the Europe (Spain) Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-sns-push-expansion-spain/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      "<p><a href=\"https://aws.amazon.com/sns/\" target=\"_blank\">Amazon\
      \ Simple Notification Service (Amazon SNS)</a> now supports sending push notifications\
      \ in the AWS Europe (Spain) Region.&nbsp;</p> \n<p>Amazon SNS is a fully managed\
      \ pub/sub service that provides message delivery to multiple endpoints, including\
      \ AWS Lambda, Amazon SQS, Amazon Data Firehose, HTTP, SMS (via AWS End User\
      \ Messaging), push notifications, and email. With this launch,&nbsp;customers&nbsp;in\
      \ the Europe (Spain) Region&nbsp;can use Amazon SNS to send push notifications\
      \ to the following supported push notification services:&nbsp;Amazon Device\
      \ Messaging (ADM), Apple Push Notification Service (APNs), Baidu Cloud Push\
      \ (Baidu), Firebase Cloud Messaging (FCM), Microsoft Push Notification Service\
      \ for Windows Phone (MPNS), and Windows Push Notification Services (WNS).&nbsp;</p>\
      \ \n<p>With this expansion, Amazon SNS now supports sending push notifications\
      \ from 25 regions. For the full list of regions from which you can send push\
      \ notifications, see <a target=\"_blank\"></a><a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-mobile-push-supported-regions.html\"\
      \ target=\"_blank\">Supported Regions and Countries</a> in&nbsp;the Amazon SNS\
      \ Developer Guide.</p> \n<p>For more information, see the <a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-mobile-application-as-subscriber.html\"\
      \ target=\"_blank\">Amazon SNS push notifications documentation</a>.</p>"
  dd519b12d780932ba12507bf54a86446:
    id: dd519b12d780932ba12507bf54a86446
    title: Amazon Bedrock announces OpenAI-compatible Projects API
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-bedrock-projects-api-mantle-inference-engine/
    published: "2026-02-26"
    fetched: "2026-02-26"
    summary:
      <p>Amazon Bedrock now supports OpenAI-compatible Projects API in the
      Mantle inference engine in Amazon Bedrock. Amazon Bedrock is a fully managed
      service that offers a broad selection of best-in-class foundation models from
      leading AI companies like Anthropic, Meta, and OpenAI, along with a broad set
      of specialized developer tools that make it easy to build and scale compelling
      generative AI applications. Mantle is Amazon Bedrock's distributed inference
      engine for large-scale model serving that supports OpenAI-compatible APIs.<br
      /> <br /> With Projects API, customers who have more than one application, environment,
      or team can now create individual projects to achieve better isolation across
      all of them. You can assign different IAM-based access control to each project
      and add tags to each project for better cost visibility.<br /> <br /> Projects
      are available for all customers using the <a href="https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-mantle.html">OpenAI-compatible
      APIs</a>, the Responses API and Chat Completions API, through the Mantle inference
      engine in Amazon Bedrock. There is no additional charge for using the Projects
      API. You pay only for the underlying model inference you consume. To get started
      with the Projects API in Amazon Bedrock, visit the <a href="https://docs.aws.amazon.com/bedrock/latest/userguide/projects.html">Amazon
      Bedrock documentation</a>.&nbsp;</p>
  09f7cbf7aafae01e6432140ff514cb02:
    id: 09f7cbf7aafae01e6432140ff514cb02
