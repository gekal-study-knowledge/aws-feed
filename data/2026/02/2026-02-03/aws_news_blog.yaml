    title:
      AWS IAM Identity Center now supports multi-Region replication for AWS account
      access and application use
    link: https://aws.amazon.com/blogs/aws/aws-iam-identity-center-now-supports-multi-region-replication-for-aws-account-access-and-application-use/
    published: "2026-02-03"
    summary:
      AWS IAM Identity Center now supports multi-Region replication of workforce
      identities and permission sets, enabling improved resiliency for AWS account
      access and allowing applications to be deployed closer to users while meeting
      data residency requirements.
