"overview": |
  この日は生成 AI モデルの拡充とセキュリティ強化が目立ちました。SageMaker JumpStart には DeepSeek OCR、MiniMax M2.1、Qwen3-VL-8B-Instruct が追加され、さらに創薬・ロボティクス向けの NVIDIA NIMs (ProteinMPNN、Nemotron-3.5B-Instruct、MSA Search NIM、Cosmos Reason) がワンクリックでデプロイ可能になりました。セキュリティ面では SageMaker Python SDK の HMAC 鍵漏洩と TLS 設定に関する脆弱性 (CVE-2026-1777/1778) の速報が公開されたほか、CloudFront が origin 向け mTLS に対応、AWS STS が Google・GitHub・CircleCI・OCI の IdP 固有クレーム検証をサポート、Multi-party approval が投票時の OTP 検証を必須化しました。Amazon Connect は音声インタラクションのテスト・シミュレーション API を提供、Lightsail はメモリ最適化バンドルを追加、RDS for MySQL は新マイナーバージョン 8.0.45/8.4.8 に対応しました。
