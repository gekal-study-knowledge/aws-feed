    title: AWS Elemental MediaLive Now Supports SRT Listener Mode
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-medialive-introduces-srt-listener/
    published: '2026-02-28'
    summary: "<p>AWS Elemental&nbsp;MediaLive&nbsp;now supports Secure Reliable Transport\
      \ (SRT) Listener mode for both inputs and outputs. With SRT Listener mode,&nbsp;MediaLive&nbsp;waits\
      \ for connections rather than&nbsp;initiating&nbsp;them. Upstream sources push\
      \ live video directly to&nbsp;MediaLive, and downstream systems pull encoded\
      \ streams on demand. This simplifies network setup by removing the need for\
      \ complex&nbsp;firewall&nbsp;configurations or static, publicly accessible IP\
      \ addresses on the source or destination side. SRT Listener mode complements&nbsp;MediaLive's&nbsp;existing\
      \ SRT Caller mode, giving you full control over which side of the connection&nbsp;initiates&nbsp;the\
      \ SRT handshake.</p> \n<p>SRT Listener mode enables flexible contribution and&nbsp;distribution&nbsp;workflows.\
      \ On the input side, you can push streams from on-premises encoders or remote\
      \ production sites, including&nbsp;MediaLive&nbsp;Anywhere deployments, directly\
      \ to&nbsp;MediaLive&nbsp;in the cloud without coordinating&nbsp;firewall&nbsp;changes\
      \ with your network team. On the output side, downstream distribution partners\
      \ can connect to&nbsp;MediaLive&nbsp;and pull encoded streams when ready, without\
      \ requiring&nbsp;MediaLive&nbsp;to&nbsp;initiate&nbsp;outbound connections.\
      \ Both SRT Listener inputs and outputs support configurable latency settings\
      \ and mandatory AES encryption to help ensure content security.</p> \n<p>SRT\
      \ Listener mode is available in all AWS Regions where AWS Elemental&nbsp;MediaLive&nbsp;is\
      \ offered.&nbsp;To get started, see&nbsp;<a href=\"https://docs.aws.amazon.com/medialive/latest/ug/input-listener-srt.html\"\
      >Setting up an SRT Listener input</a>&nbsp;and&nbsp;<a href=\"https://docs.aws.amazon.com/medialive/latest/ug/creating-srt-listener-output.html\"\
      >Creating SRT outputs in listener mode</a>&nbsp;in the AWS Elemental&nbsp;MediaLive&nbsp;User\
      \ Guide.</p>"
