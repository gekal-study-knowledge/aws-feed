  2210f539e40f98522d346228a447e89f:
    id: 2210f539e40f98522d346228a447e89f
    title: AWS Batch now provides Job Queue and Share Utilization Visibility
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-batch-provides-job-queue-share-utilization
    published: "2026-02-13"
    fetched: "2026-02-13"
    summary:
      <p>AWS Batch now provides Queue and Share Utilization Visibility, giving
      you insights into how your workloads are distributed across compute resources.
      This feature introduces queue utilization data in job queue snapshots, revealing
      compute capacity used by your first-in-first-out (FIFO) and fair share job queues,
      along with capacity consumption by individual fair share allocations. Additionally,
      the <i>ListServiceJobs </i>API now includes a <i>scheduledAt </i>timestamp for
      AWS Batch service jobs, allowing you to track when jobs are scheduled for execution.<br
      /> <br /> Queue and Share Utilization Visibility helps you understand which
      fair-share allocations consume the most capacity and pinpoint the specific jobs
      driving resource consumption. You can monitor overall queue utilization and
      drill down into active shares to optimize resource distribution, or filter jobs
      by share identifier to analyze consumption patterns and scheduling behavior
      across your workloads.<br /> <br /> You can access this feature using the <i>GetJobQueueSnapshot</i>,
      <i>ListJobs</i>, and <i>ListServiceJobs</i> APIs, or through the AWS Batch Management
      Console by navigating to your job queue details page and selecting the new Share
      Utilization tab. This feature is available today in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> where AWS Batch is available. To learn more, visit the <a href="https://docs.aws.amazon.com/batch/latest/APIReference/API_GetJobQueueSnapshot.html">Job
      Queue Snapshot</a>, <a href="https://docs.aws.amazon.com/batch/latest/APIReference/API_ListJobs.html">List
      Jobs</a>, and <a href="https://docs.aws.amazon.com/batch/latest/APIReference/API_ListServiceJobs.html">List
      Service Jobs</a> pages of the AWS Batch API Reference Guide.</p>
  493e0828948502d74a500015283192bb:
    id: 493e0828948502d74a500015283192bb
    title:
      Amazon Connect launches in-app notifications to surface critical operational
      alerts to business users
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-connect-in-app-notifications
    published: "2026-02-13"
    fetched: "2026-02-13"
    summary:
      <p>Amazon Connect now supports in-app notifications in the workspace
      header, visible from any page, so your team can stay informed without interrupting
      their workflow— whether configuring, analyzing data, or servicing customers.
      A notification icon appears in the header of every workspace page, with a badge
      indicating unread messages. Click the icon to view messages, access relevant
      resources through embedded links, and manage read/unread status—all without
      navigating away from your current task. For example, if all supervisors need
      to complete a certain training by end of week, a notification can be published
      to non-compliant users to remind them.<br /> <br /> The new notification APIs
      enable you to programmatically send targeted messages to specific audiences
      within your organization, ensuring teams stay aware of urgent updates, policy
      changes, and action items requiring immediate attention. Amazon Connect will
      also leverage this capability to deliver system updates and important announcements.<br
      /> <br /> In-app notifications are available in all <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region"
      target="_blank" title="AWS regions">AWS regions</a> where Amazon Connect is
      available and offer public API and AWS CloudFormation support. To learn more
      about in-app notifications, see the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html"
      target="_blank" title="Amazon Connect Administrator Guide">Amazon Connect Administrator
      Guide</a>. To learn more about Amazon Connect, please visit the <a href="https://aws.amazon.com/connect/"
      target="_blank" title="Amazon Connect website">Amazon Connect website</a>.</p>
  193df7d346a3051e6915629cd0e893f1:
    id: 193df7d346a3051e6915629cd0e893f1
    title:
      Amazon Connect now provides real time AI-powered overviews and recommended
      next actions for Tasks
    link: https://aws.amazon.comamazon-connect-tasks-ai-assistance
    published: "2026-02-13"
    fetched: "2026-02-13"
    summary:
      <p>Amazon Connect now provides AI-powered Task overviews with suggested
      next actions so agents can understand work items faster and resolve them more
      quickly. For example, when an agent receives a Task to process a refund request
      submitted through an online form, Amazon Connect summarizes earlier activities
      such as verifying order details, checking return eligibility, and confirming
      the payment method, and then presents recommended next steps to complete the
      refund.<br /> <br /> To enable this feature, add the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/connect-assistant-block.html">Connect
      assistant flow block</a> to your flows before a Task contact is assigned to
      your agent. You can guide the recommendations of your generative AI-powered
      Tasks assistant by <a href="https://docs.aws.amazon.com/connect/latest/adminguide/ai-agent-initial-setup.html#enable-q-step-3">adding
      knowledge bases</a>.<br /> <br /> This new feature is available in all AWS regions
      where Amazon Connect real time agent assistance is <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#q-connect_region">available</a>.
      To learn more and get started, refer to the help <a href="https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html">documentation</a>,
      <a href="https://aws.amazon.com/connect/pricing/">pricing page</a>, or visit
      the <a href="https://aws.amazon.com/connect/">Amazon Connect</a> website.</p>
  841459b725241ca1462e7792a89dbecd:
    id: 841459b725241ca1462e7792a89dbecd
    title: Amazon RDS now supports backup configuration when restoring snapshots
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/rds-aurora-backup-configuration-restoring-snapshots/
    published: "2026-02-13"
    fetched: "2026-02-13"
    summary:
      <p>Amazon Relational Database Service (RDS) and Amazon Aurora now offer
      greater flexibility for restore operations to view and modify backup retention
      period and preferred backup window prior to and upon restoring database snapshots.
      The backup retention period lets you specify how many days backups are retained,
      while the preferred backup window allows you to set your desired backup schedule.<br
      /> <br /> Previously, restored database instances and clusters inherited backup
      parameter values from snapshot metadata and could only be modified after restore
      was complete. This launch introduces two enhancements - you can now view the
      backup retention period and preferred backup window settings as part of automated
      backups and snapshots, providing visibility into backup configurations before
      initiating restore operation. Additionally, you can now specify or modify the
      backup retention period and preferred backup window when restoring database
      instances and clusters, eliminating the need to modify the instance or cluster
      after restoration.<br /> <br /> These enhancements are available for all Amazon
      RDS database engines (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, and DB2)
      and Amazon Aurora (MySQL-Compatible and PostgreSQL-Compatible editions) in all
      AWS commercial regions and AWS GovCloud (US) regions where RDS and Aurora are
      supported and respective database engines are available. You can use these features
      through the AWS Management Console, AWS Command Line Interface (CLI), and AWS
      SDKs at no additional cost. For more information, see <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.BackupRestore.html">Amazon
      RDS</a> and <a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/BackupRestoreAurora.html">Amazon
      Aurora</a> User Guide.</p>
  1398813f83d3430037b64e4420513288:
    id: 1398813f83d3430037b64e4420513288
    title: Amazon Aurora DSQL adds support for identity columns and sequence objects
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-aurora-dsql-adds-identity-columns-sequence/
    published: "2026-02-13"
    fetched: "2026-02-13"
    summary:
      <p><a href="https://aws.amazon.com/rds/aurora/dsql/">Amazon Aurora DSQL</a>
      now supports&nbsp;identity columns and&nbsp;sequence objects enabling developers
      to generate auto-incrementing, integer-based IDs directly in the database using
      familiar SQL patterns.<br /> <br /> This launch simplifies migrations of existing
      PostgreSQL applications and supports development of new workloads that rely
      on database-managed integer identifiers. Developers can create compact, human-readable
      IDs, such as order numbers, account IDs, or operational references without custom
      ID generation logic in application code or middleware.&nbsp;</p>
