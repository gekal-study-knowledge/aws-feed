"overview": |
  この日はコンテナ・エージェント基盤の拡充とコスト削減、監視強化が中心でした。AWS Network Firewall は NAT Gateway のセカンダリエンドポイント向け割引適用と Advanced Inspection (TLS 検査) の追加データ処理料金撤廃という 2 つの価格改善を発表し、自動的に適用されます。Amazon ECS Managed Instances が AWS ヨーロッパソブリンクラウドで利用可能になりました。Amazon Bedrock AgentCore Browser はブラウザプロファイルに対応し、14 リージョンで認証状態の再利用によりセッションセットアップ時間を大幅短縮します。監視面では AWS Config が Amazon EKS・Amazon Q・AWS IoT など 30 の新しいリソースタイプに対応し、Amazon ECR がリポジトリ数とリポジトリ毎イメージ数のメトリクスを追加しました。その他 WorkSpaces Secure Browser のカスタムドメイン対応、Amazon Connect Cases の CSV による関連フィールドオプション設定も発表されました。
