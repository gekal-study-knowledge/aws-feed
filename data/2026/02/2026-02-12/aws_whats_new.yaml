  de02cd2898483e13fe5f83ebb1264867:
    id: de02cd2898483e13fe5f83ebb1264867
    title: Amazon RDS now supports latest Cumulative Update (CU23) for Microsoft SQL
      Server
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-rds-supports-latest-cumulative-update-cu23-for-microsoft-sql-server
    published: '2026-02-12'
    summary: <p><a href="https://aws.amazon.com/rds/sqlserver/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) for SQL Server </a>now supports the
      latest Cumulative Update (CU23) <a href="https://learn.microsoft.com/en-us/troubleshoot/sql/releases/sqlserver-2022/cumulativeupdate23"
      target="_blank">KB5078297</a> for SQL Server 2022.<br /> <br /> We recommend
      that you upgrade your Amazon RDS for SQL Server instances to apply this update
      using Amazon RDS Management Console, or by using the AWS SDK or CLI. You can
      learn more about upgrading your database instance in the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.SQLServer.html"
      target="_blank">Amazon RDS SQL Server User Guide for upgrading your RDS Microsoft
      SQL Server DB engine</a>.</p>
  a4b6311c54341dab12006693ebedd02f:
    id: a4b6311c54341dab12006693ebedd02f
    title: Amazon Connect  launches granular access controls for analytics dashboards
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-connect-launches-granular-access
    published: '2026-02-12'
    summary: "<p>Amazon Connect dashboards now provides granular access controls for\
      \ analytics dashboards. This enables you to apply resource tags that control\
      \ who is able to see metrics for specific resources such as agents, queues,\
      \ and routing profiles. You can now&nbsp;filter&nbsp;metrics using tags to view\
      \ aggregate metrics for agents or queues that share the same tags. For example,\
      \ you can tag agents with Department:Customer Service to restrict dashboard\
      \ metrics visibility to Customer Service team managers.</p> \n<p><br /> Amazon\
      \ Connect dashboards are available in all AWS commercial and AWS GovCloud (US-West)\
      \ <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      >regions</a> where Amazon Connect is offered. To learn more about dashboards,\
      \ see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/dashboards.html\"\
      >Amazon Connect Administrator Guide</a>. To learn more about Amazon Connect,\
      \ the AWS cloud-based contact center, please visit the <a href=\"https://aws.amazon.com/connect/\"\
      >Amazon Connect website</a>.</p>"
  90b2bab1f0263c7992bcffc17b3d66e2:
    id: 90b2bab1f0263c7992bcffc17b3d66e2
    title: Amazon EC2 X8i instances are now available in Europe (Stockholm)
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-x8i-instances-ARN-region/
    published: '2026-02-12'
    summary: '<p>Amazon Web Services (AWS) is announcing the general availability
      of Amazon EC2 X8i instances, next-generation memory optimized instances powered
      by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified
      and deliver the highest performance and fastest memory bandwidth among comparable
      Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x
      more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to
      previous generation X2i instances.<br /> <br /> X8i instances are designed for
      memory-intensive workloads like SAP HANA, large databases, data analytics, and
      Electronic Design Automation (EDA). Compared to X2i instances, X8i instances
      offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance,
      88% faster Memcached performance, and 46% faster AI inference performance. X8i
      instances come in 14 sizes, from large to 96xlarge, including two bare metal
      options.<br /> <br /> X8i instances are available in the following <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West
      (Oregon), Europe (Frankfurt) and Europe (Stockholm).<br /> <br /> To get started,
      visit the <a href="https://aws.amazon.com/console/" target="_blank">AWS Management
      Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances,
      and Spot instances. For more information visit <a href="https://aws.amazon.com/ec2/instance-types/x8i/"
      target="_blank">X8i instances page</a>.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p>'
last_updated: '2026-02-19T01:54:18.815065'
