  672b58ad7f2c394a1b9ca0c756aef203:
    id: 672b58ad7f2c394a1b9ca0c756aef203
    title:
      Amazon OpenSearch Service expands support for Graviton4 (c8g,m8g & r8g
      ) instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-opensearch-service-expands-support-graviton4-based-instances
    published: "2026-02-18"
    summary:
      '<p>Amazon OpenSearch Service expands support for the latest generation
      Graviton4-based Amazon EC2 instance families. These new instance types are compute
      optimized (c8g), general purpose (m8g), and memory optimized (r8g, r8gd) instances.<br
      /> <br /> AWS Graviton4 processors provide up to 30% better performance than
      AWS Graviton3 processors with c8g, m8g and r8g &amp; r8gd offering the best
      price performance for compute-intensive, general purpose, and memory-intensive
      workloads respectively. To learn more about Graviton4 improvements, please see
      the <a href="https://aws.amazon.com/blogs/aws/aws-graviton4-based-amazon-ec2-r8g-instances-best-price-performance-in-amazon-ec2/">blog</a>
      on r8g instances and the <a href="https://aws.amazon.com/blogs/aws/run-your-compute-intensive-and-general-purpose-workloads-sustainably-with-the-new-amazon-ec2-c8g-m8g-instances/">blog</a>
      on c8g &amp; m8g instances.<br /> <br /> Amazon OpenSearch Service Graviton4
      instances are supported for all OpenSearch versions, and Elasticsearch (open
      source) versions 7.9 and 7.10.<br /> <br /> Apart from the regions already supported,
      one or more than one Graviton4 instance types are now also available in following
      region: Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Jakarta),
      Asia Pacific (Melbourne), Asia Pacific (Osaka), Asia Pacific (Thailand), Europe
      (Milan), Europe (Paris), Europe (Zurich), Middle East (UAE), AWS GovCloud (US-West)
      and AWS GovCloud (US-East).<br /> <br /> For region specific availability &amp;
      pricing, visit our <a href="https://aws.amazon.com/opensearch-service/pricing/">pricing
      page</a>. To learn more about Amazon OpenSearch Service and its capabilities,
      visit our <a href="https://aws.amazon.com/opensearch-service/">product page</a>.</p>'
  418ec76474f4a10c68b6d14f477cc266:
    id: 418ec76474f4a10c68b6d14f477cc266
    title: Amazon OpenSearch Service now supports storage optimized  i7i  instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-opensearch-service-supports-i7i-instances
    published: "2026-02-18"
    summary:
      <p>Amazon OpenSearch Service now supports latest generation x86 based
      high performance Storage Optimized i7i instances. Powered by 5th generation
      Intel Xeon Scalable processors, I7i instances deliver up to 23% better compute
      performance and more than 10% better price performance over previous generation
      I4i instances.<br /> <br /> I7i instances have 3rd generation AWS Nitro SSDs
      with up to 50% better real-time storage performance, up to 50% lower storage
      I/O latency, and up to 60% lower storage I/O latency variability compared to
      I4i instances. Built on the <a href="https://aws.amazon.com/ec2/nitro/">AWS
      Nitro System</a>, these instances oﬄoad CPU virtualization, storage, and networking
      functions to dedicated hardware and software enhancing the performance and security
      for your workloads.<br /> <br /> Amazon OpenSearch Service supports i7i instances
      in following <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> US East (N. Virginia, Ohio), US West (N. California, Oregon), Canada
      (Central), Canada West (Calgary), Europe (Frankfurt, Ireland, London, Milan,
      Spain, Stockholm, Zurich ), Africa (Cape Town), Asia Pacific (Hong Kong, Hyderabad,
      Jakarta, Malaysia, Melbourne, Mumbai, Osaka, Seoul, Singapore, Sydney, Tokyo),
      Middle East (UAE), South America (São Paulo) &amp; AWS GovCloud (US-West).<br
      /> <br /> For region specific availability &amp; pricing, visit our <a href="https://aws.amazon.com/opensearch-service/pricing/">pricing
      page</a>. To learn more about Amazon OpenSearch Service and its capabilities,
      visit our <a href="https://aws.amazon.com/opensearch-service/">product page</a>.</p>
  42094b213150c11e681502de93590dfa:
    id: 42094b213150c11e681502de93590dfa
    title: Amazon Connect Cases now supports AWS Service Quotas
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-connect-cases-aws-service-quotas
    published: "2026-02-18"
    summary:
      '<p>Amazon Connect Cases now supports AWS Service Quotas, giving administrators
      a centralized way to view applied limits, monitor utilization, and scale case
      workloads without hitting unexpected service constraints. You can request quota
      increases directly from the Service Quotas console, and eligible requests are
      automatically approved without manual intervention.<br /> <br /> Amazon Connect
      Cases is available in the following AWS Regions: US East (N. Virginia), US West
      (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific
      (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo),
      and Africa (Cape Town). To learn more and get started, visit the Amazon Connect
      Cases <a href="https://aws.amazon.com/connect/cases/" target="_blank">webpage</a>
      and <a href="https://docs.aws.amazon.com/connect/latest/adminguide/amazon-connect-service-limits.html#cases-quotas"
      target="_blank">documentation</a>.</p>'
  8dd99c890c5f314829f8d21d5c3071af:
    id: 8dd99c890c5f314829f8d21d5c3071af
    title: Amazon Aurora DSQL now integrates with Kiro powers and AI agent skills
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-aurora-dsql-integrates-with-kiro-powers-and-agent-skills
    published: "2026-02-18"
    summary:
      "<p>Today, AWS announces Amazon Aurora DSQL integration with Kiro powers\
      \ and AI agent skills, enabling developers to build Aurora DSQL-backed applications\
      \ faster with AI agent-assisted development. These integrations bundle the Aurora\
      \ DSQL Model Context Protocol (MCP) server with development best practices,\
      \ so AI agents can help you with Aurora DSQL schema design, performance optimization,\
      \ and database operations out of the box.<br /> <br /> Kiro powers is a registry\
      \ of curated and pre-packaged MCP servers, steering files, and agent hooks to\
      \ accelerate specialized software development and deployment use cases. With\
      \ the Kiro power for Aurora DSQL, agents have instant access to specialized\
      \ knowledge, so developers can work confidently without any prior context, reducing\
      \ trial-and-error development cycles. The power is available within the <a href=\"\
      https://kiro.dev/launch/powers/amazon-aurora-dsql/\">Kiro IDE</a> for one-click\
      \ installation.<br /> <br /> The <a href=\"https://skills.sh/awslabs/mcp/dsql\"\
      >Aurora DSQL skill</a> extends the same capabilities to additional AI coding\
      \ agents through the <a href=\"https://skills.sh/docs/cli\">Skills CLI</a>.\
      \ Developers can install the skill with a single command and select their preferred\
      \ agents including Kiro CLI, Claude Code, Gemini, Codex, Cursor, Copilot, Cline,\
      \ Windsurf, Roo, OpenCode, and more. When developers work on database tasks,\
      \ the agent dynamically loads relevant skill guidance, including Aurora DSQL\
      \ Postgres-compatible SQL patterns, distributed database design, and IAM authentication,\
      \ eliminating the need to repeatedly provide the same context across conversations.&nbsp;As\
      \ Aurora DSQL adds new features, future skill releases will include updated\
      \ patterns and guidance, ensuring that agents always have current best practices.</p>\
      \ \n<p>For more information on the Aurora DSQL Kiro power and agent skills,\
      \ visit the&nbsp;<a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_aurora-dsql-steering.html\"\
      >Aurora DSQL steering documentation</a> and <a href=\"https://github.com/awslabs/mcp/tree/main/src/aurora-dsql-mcp-server\"\
      >GitHub page</a>. Get started with Aurora DSQL for free with the <a href=\"\
      https://aws.amazon.com/free/\">AWS Free Tier</a>.<br /> </p>"
  975b797ee08cb89c184c1c26b576dcbd:
    id: 975b797ee08cb89c184c1c26b576dcbd
    title: Amazon Managed Grafana now supports AWS KMS customer managed keys
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-managed-grafana-customer-managed-keys
    published: "2026-02-18"
    summary:
      "<p>Amazon Managed Grafana now supports customer-managed keys (CMK) through\
      \ AWS Key Management Service (KMS), enabling you to encrypt data stored in&nbsp;in\
      \ your Amazon Managed Grafana workspaces with your own encryption keys. Amazon\
      \ Managed Grafana is a fully managed service based on open-source Grafana that\
      \ makes it easier for you to visualize and analyze your operational data at\
      \ scale.</p> \n<p>Amazon Managed Grafana provides encryption at rest using AWS\
      \ owned keys by default. With this launch, you now have an option to use a customer-managed\
      \ key when creating an Amazon Managed Grafana workspace. This allows you to\
      \ add a self-managed security layer, helping you meet your organization’s compliance\
      \ and regulatory requirements.</p> \n<p>This feature is now available in all\
      \ regions where Amazon Managed Grafana is generally available, except in AWS\
      \ GovCloud (US) Regions.&nbsp;To get started with Amazon Managed Grafana, refer&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/grafana/latest/userguide/what-is-Amazon-Managed-Service-Grafana.html\"\
      \ target=\"_blank\">Amazon Managed Grafana user guide</a>. To learn more about\
      \ Amazon Managed Grafana, visit the&nbsp;<a href=\"https://aws.amazon.com/grafana/\"\
      \ target=\"_blank\">product page</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/grafana/pricing/\"\
      \ target=\"_blank\">pricing page</a>.</p>"
  91331223bee2f02469f436a9e905bca0:
    id: 91331223bee2f02469f436a9e905bca0
    title: AWS Clean Rooms announces support for remote Apache Iceberg REST catalogs
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-clean-rooms-remote-iceberg-catalogs
    published: "2026-02-18"
    summary:
      <p>AWS Clean Rooms now supports catalog federation for<a href="https://docs.aws.amazon.com/clean-rooms/latest/userguide/create-config-table-athena.html">
      remote Iceberg catalogs</a>. This capability simplifies clean room setup by
      providing direct, secure access to Iceberg tables stored in Amazon S3 and cataloged
      in remote catalogs—without requiring table metadata replication. Organizations
      can now use AWS Glue catalog federation to provide direct access to their existing
      Iceberg REST catalog in a Clean Rooms collaboration. For example, a media publisher
      with data cataloged in the AWS Glue Data Catalog and an advertiser with data
      cataloged in a remote Iceberg catalog can analyze their collective datasets
      to evaluate advertising spend—without having to build ETL data pipelines or
      share underlying data with one another.<br /> <br /> AWS Clean Rooms helps companies
      and their partners easily analyze and collaborate on their collective datasets
      without revealing or copying one another’s underlying data. For more information
      about the AWS Regions where AWS Clean Rooms is available, see the <a href="https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region">AWS
      Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit
      <a href="https://aws.amazon.com/clean-rooms/">AWS Clean Rooms</a>.</p>
  183d7a53f46145ceceb4279c34ee06ce:
    id: 183d7a53f46145ceceb4279c34ee06ce
    title:
      AWS Certificate Manager updates default certificate validity to comply
      with new guidelines
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-certificate-manager-updates-default/
    published: "2026-02-18"
    summary:
      <p>Starting today, public certificates issued from AWS Certificate Manager
      (ACM) have a maximum validity period of 198 days, compared to previous validity
      period of 395 days. With this change, ACM-issued public certificates will be
      compliant with new Certification Authority Browser (CA/Browser) Forum mandate
      that certificates be no longer than 200 days starting 15th March 2026.<br />
      <br /> No action is required from the customers to receive this change. All
      new and renewed public certificates will by default have a validity of 198 days.
      Existing certificates with 395 days validity continue to be valid and can be
      used until they renew or expire. All other certificate functionality remains
      in place. ACM will still continue to auto renew the certificates before expiry.
      The certificates are now renewed 45 days before expiry. Existing 398 day validity
      certificates will renew 60 days before expiry and will renew with 198 days validity
      period.<br /> <br /> We have reduced the pricing for ACM’s exportable public
      certificates in line with the shorter validity period. 198-day exportable public
      certificate will now cost $7/Fully Qualified domain name (down from $15) and
      $79/ wildcard name (down from $149). Please refer to ACM’s pricing page for
      more details. For more information about ACM, visit the <a href="https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate-characteristics.html">ACM
      documentation</a>.</p>
  59e69c5ac14acff2dfa8b1e37c733a47:
    id: 59e69c5ac14acff2dfa8b1e37c733a47
    title: Mistral AI Devstral 2 now available on Amazon Bedrock
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/mistral-ai-devstral-bedrock/
    published: "2026-02-18"
    summary:
      "<p>Customers can now use Mistral AI Devstral 2 123B on Amazon Bedrock,\
      \ a platform for building generative AI applications and agents at production\
      \ scale.</p> \n<p>Devstral 2 123B is a state-of-the-art, open-weight large language\
      \ model purpose-built for agentic software engineering workflows. With 123B\
      \ parameters and deep specialization in code generation, automation, and multi-step\
      \ reasoning, Devstral 2 is designed for developers building AI-powered engineering\
      \ agents that can plan, write, and iterate on code at scale. Amazon Bedrock\
      \ gives customers access to Devstral 2 123B through a single, fully managed\
      \ API — no infrastructure to provision, no models to host. The model is well-suited\
      \ for production-grade coding assistants, automated code review pipelines, and\
      \ complex software development agents requiring long-context comprehension and\
      \ reliable multi-turn reasoning.</p> \n<p>Devstral 2 123B is now available in\
      \ Amazon Bedrock across select AWS Regions. For the full list of available AWS\
      \ Regions, refer to the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-regions.html\"\
      \ target=\"_blank\">documentation</a>.</p> \n<p>To get started with Devstral\
      \ 2 123B in Amazon Bedrock, visit the <a href=\"https://aws.amazon.com/bedrock/mistral/\"\
      \ target=\"_blank\">Amazon Bedrock Mistral AI page</a>.</p>"
