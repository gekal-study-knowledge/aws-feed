    title:
      "AWS Weekly Roundup: Claude Opus 4.6 in Amazon Bedrock, AWS Builder ID
      Sign in with Apple, and more (February 9, 2026)"
    link: https://aws.amazon.com/blogs/aws/aws-weekly-roundup-claude-opus-4-6-in-amazon-bedrock-aws-builder-id-sign-in-with-apple-and-more-february-9-2026/
    published: "2026-02-09"
    fetched: "2026-02-09"
    summary:
      This week's roundup covers launches across compute, networking, security,
      and AI. Amazon EC2 introduces new C8id, M8id, and R8id instances powered by
      custom Intel Xeon 6 processors. AWS Network Firewall announces price reductions.
      Amazon DynamoDB global tables now support replication across multiple AWS accounts
      for improved resiliency and workload isolation. On the security front, AWS Builder
      ID now supports Sign in with Apple, AWS STS adds validation for identity provider
      claims and Amazon CloudFront introduces mutual TLS support for origins to enforce
      certificate-based authentication. For AI, Claude Opus 4.6—Anthropic's most intelligent
      model—is now available in Amazon Bedrock, bringing industry-leading performance
      for agentic tasks and complex coding projects. Amazon Bedrock also adds structured
      outputs for consistent, machine-readable responses that adhere to your defined
      JSON schemas.
