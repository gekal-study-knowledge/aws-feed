  399b2b8fcb0f76a86c9d8d9b24f1a1e5:
    id: 399b2b8fcb0f76a86c9d8d9b24f1a1e5
    title: Amazon Neptune Analytics is now available in 7 additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-neptune-analytics-in-seven-additional-regions
    published: "2026-02-09"
    summary:
      <p><a href="https://docs.aws.amazon.com/neptune-analytics/latest/userguide/what-is-neptune-analytics.html"
      target="_blank">Amazon Neptune Analytics</a> is now available in Middle East
      (Bahrain), Middle East (UAE), Israel (Tel Aviv), Africa (Cape Town), Canada
      (Calgary), Asia Pacific (Malaysia), and Europe (Zurich) regions. You can now
      create and manage Neptune Analytics graphs in these new regions and run advanced
      graph analytics.<br /> <br /> Amazon Neptune is a serverless graph database
      for connected data, improves the accuracy of AI applications, and lowers operational
      burden and costs. Neptune instantly scales graph workloads removing the need
      to manage capacity. By modeling data as a graph, Neptune captures context that
      improves accuracy and explainability of generative AI applications. To make
      AI application development easier, Neptune offers fully managed GraphRAG with
      Amazon Bedrock Knowledge Bases, and integrations with Strands AI Agents SDK
      and popular agentic memory tools. It also easily analyzes tens of billions of
      relationships across structured and unstructured data within seconds delivering
      strategic insights. Neptune is the only database and analytics engine that gives
      you the power of connected data with the enterprise capabilities and value of
      AWS.<br /> <br /> To get started, you can create a new Neptune Analytics graphs
      using the <a href="https://ap-south-1.console.aws.amazon.com/neptune/home?region=ap-south-1#analytics-graphs:">AWS
      Management Console</a>, <a href="https://docs.aws.amazon.com/cli/latest/reference/neptune-graph/">or
      AWS CLI</a>. For more information on pricing and region availability, refer
      to the <a href="https://aws.amazon.com/neptune/pricing/">Neptune pricing page</a>
      and <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region Table</a>.</p>
  0a9c6225ccd45331b2a2304bc52f4edb:
    id: 0a9c6225ccd45331b2a2304bc52f4edb
    title: Amazon Redshift now supports allocating extra compute for automatic optimizations
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-redshift-allocate-extra-compute-for-automatic-optimizations
    published: "2026-02-09"
    summary:
      <p>Amazon Redshift now supports allocating extra compute for automatic
      optimization features, known as autonomics. Database administrators managing
      Amazon Redshift workloads can now allocate additional resources for their clusters
      to enable autonomics even during periods of high user activity, eliminating
      the need to manually schedule optimizations such as Automatic Table Optimization
      (ATO), Automatic Table Sorting (ATS), Auto Vacuum, and Auto Analyze.<br /> <br
      /> This enhancement extends Amazon Redshift's autonomics capabilities to automatically
      leverage extra compute resources, to run reliably without impacting user workloads.
      It also includes a cost control feature for provisioned clusters, allowing database
      administrators to limit the amount of resources available to autonomics. Additionally,
      the new SYS_AUTOMATIC_OPTIMIZATION system table enhances observability by providing
      detailed information on autonomics operations for both provisioned clusters
      and serverless workgroups.<br /> <br /> This feature is available in all <a
      href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> where <a href="https://aws.amazon.com/redshift/">Amazon Redshift</a>
      is supported. To learn more, see <a href="https://docs.aws.amazon.com/redshift/latest/dg/t_extra-compute-autonomics.html">Allocating
      extra compute resources for automatic database optimization</a>.</p>
  10691577aa6dff11f82eb7117eb7e436:
    id: 10691577aa6dff11f82eb7117eb7e436
    title:
      AWS HealthOmics introduces a Kiro Power and Kiro IDE extension for bioinformatics
      workflow development
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-healthomics-introduces-kiro-plugin-for-bioinformatics-workflow-development/
    published: "2026-02-09"
    summary:
      <p>AWS HealthOmics announces a <a href="https://kiro.dev/powers/">Kiro
      Power</a> and Kiro IDE extension to create, run, debug, and optimize HealthOmics
      workflows faster with AI agent-assisted development. With the HealthOmics extension
      for Kiro IDE, customers can create, modify, and analyze workflows in domain-specific
      languages including Nextflow and WDL directly in the Kiro interface. <a href="https://aws.amazon.com/healthomics/">AWS
      HealthOmics</a> is a HIPAA-eligible service that helps accelerate scientific
      breakthroughs at scale with fully managed bioinformatics workflows.<br /> <br
      /> Kiro Powers is a repository of curated and pre-packaged Model Context Protocol
      (MCP) servers, steering files, and agent hooks to accelerate specialized software
      development and deployment use cases. The Kiro Power for HealthOmics packages
      the HealthOmics MCP server with guidance, giving the Kiro agent expertise in
      HealthOmics workflow creation and optimization. The HealthOmics Kiro IDE extension
      provides syntax highlighting, code completion, and troubleshooting guidance,
      along with HealthOmics engine compatibility checking, performance optimization
      recommendations, automated run analysis with failure diagnostics, and workflow
      import/export capabilities.<br /> <br /> To get started, download and install
      the HealthOmics Kiro Power from <a href="https://kiro.dev/powers/">https://kiro.dev/powers/</a>
      and HealthOmics Kiro IDE extension from <a href="https://open-vsx.org/extension/amazonwebservices/aws-healthomics-extension">Open
      VSX Registry</a>.</p>
  7e459777a6f22f951a5388e7eba33944:
    id: 7e459777a6f22f951a5388e7eba33944
    title: Amazon EC2 C8gn instances are now available in additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-c8gn-instances-additional-regions
    published: "2026-02-09"
    summary:
      '<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances,
      powered by the latest-generation AWS Graviton4 processors, are available in
      the AWS Region&nbsp;Asia Pacific (Seoul, Melbourne), Canada (Central), Europe
      (Spain), and AWS GovCloud (US-East, US-West). The new instances provide up to
      30% better compute performance than Graviton3-based Amazon EC2 C7gn instances.
      Amazon EC2 C8gn instances feature the latest 6th generation AWS Nitro Cards,
      and offer up to 600 Gbps network bandwidth, the highest network bandwidth among
      network optimized EC2 instances.&nbsp;<br /> &nbsp;<br /> Take advantage of
      the enhanced networking capabilities of C8gn to scale performance and throughput,
      while optimizing the cost of running network-intensive workloads such as network
      virtual appliances, data analytics, CPU-based artificial&nbsp;intelligence&nbsp;and
      machine learning&nbsp;(AI/ML) inference.&nbsp;<br /> &nbsp;<br /> For increased
      scalability, C8gn instances offer instance sizes up to 48xlarge, up to 384 GiB
      of memory, and up to 60 Gbps of bandwidth to Amazon Elastic Block Store (EBS).
      C8gn instances support Elastic Fabric Adapter (EFA) networking on the 16xlarge,
      24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes, which enables lower latency
      and improved cluster performance for workloads deployed on tightly coupled clusters.&nbsp;<br
      /> &nbsp;<br /> C8gn instances are available in the following AWS Regions: US
      East (N. Virginia, Ohio), US West (Oregon, N.California), Europe (Frankfurt,
      Stockholm, Ireland, London, Spain), Asia Pacific (Singapore, Malaysia, Sydney,
      Thailand, Mumbai, Seoul, Melbourne), Middle East (UAE), Africa (Cape Town),
      Canada West (Calgary,&nbsp;Central),&nbsp;AWS GovCloud (US-East, US-West).<br
      /> &nbsp;<br /> To learn more, see&nbsp;<a href="https://aws.amazon.com/ec2/instance-types/c8g/">Amazon
      C8gn Instances</a>. To begin your Graviton journey, visit the&nbsp;<a href="https://aws.amazon.com/ec2/graviton/level-up-with-graviton/">Level
      up your compute with AWS Graviton page</a>. To get started, see&nbsp;<a href="https://console.aws.amazon.com/">AWS
      Management Console</a>,&nbsp;<a href="https://aws.amazon.com/cli/">AWS Command
      Line Interface (AWS CLI)</a>, and&nbsp;<a href="https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html">AWS
      SDKs</a>.</p>'
