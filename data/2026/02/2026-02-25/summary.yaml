"overview": |
  この日はAmazon Aurora DSQL関連の発表が集中した。AWSアカウント不要でブラウザからSQLを試せるAurora DSQL Playgroundを公開し、さらにTortoise/Flyway/PrismaといったORM・マイグレーションツールや、VS Code SQLTools・DBeaverとの統合を追加し、IAM認証を自動処理する開発者体験を強化した。コンピュートではEC2 M8gn/M8gbの新metalサイズ、R8a (Ireland)、M8i/M8i-flex (Cape Town) が利用可能になった。運用/セキュリティではAWS Security Agentがアカウント間で共有VPCへのペネトレーションテストに対応し、OutpostsラックのCloudWatchメトリクスがGovCloudで拡充、Neptune向けAWS Backupが5リージョンに拡大した。AIコーディング支援としてAmazon LocationがLLMコンテキストをKiro powerおよびClaude Codeプラグインとして提供開始した。ブログではLambda上のマルチスレッドRustによる最適化やアカウント単位のSaaSアーキテクチャの知見も共有された。
