    "title": "週刊生成AI with AWS – 2026/7/27週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260727/"
    "published": "2026-08-03 14:17:13"
    "fetched": "2026-08-03 15:17:50"
    "summary": "週刊生成AI with AWS, いよいよ8月・夏本番な2026年7月27日週号 – Astemo様のAI-DLC UnicornGym、Outpost VFX様のAIモデルトレーニング8倍高速化事例を含む10件のブログ記事を紹介。サービスアップデートでは、Amazon BedrockとKiroでのOpenAI GPT-5.6値下げ (Lunaは最大80%オフ)、OpenSearch 3.7のベクトル検索改善、Kiro CLIの/tangentコマンド含む8件を紹介。"
  "d8a3563632c6e98a3fb4da3b11bd0656":
    "id": "d8a3563632c6e98a3fb4da3b11bd0656"
    "title": "Amazon Inspector SBOM Generator をプラグインで拡張"
    "link": "https://aws.amazon.com/jp/blogs/news/extend-amazon-inspector-sbom-generator-with-plugins/"
    "published": "2026-08-03 12:28:42"
    "fetched": "2026-08-03 15:17:50"
    "summary": "Amazon Inspector SBOM Generator (inspector-sbomgen) に、Lua でカスタムパッケージコレクターを記述できるプラグインシステムを発表します。標準では対応していないエコシステムや組織独自のロックファイル形式も、コンパイル不要でインベントリ化できます。この記事では、スキャフォールディングによる最初のプラグインの作成手順、テストハーネスでの検証、Amazon Inspector の脆弱性スキャンとの統合、サンドボックス化された安全な実行環境について解説します。"
  "4ecb7b44be6b3d7137e91c4e6c8c4626":
    "id": "4ecb7b44be6b3d7137e91c4e6c8c4626"
    "title": "Amazon Inspector SBOM Generator で Java のネストされた依存関係を特定する方法"
    "link": "https://aws.amazon.com/jp/blogs/news/identify-java-nested-dependencies-with-amazon-inspector-sbom-generator/"
    "published": "2026-08-03 12:21:27"
    "fetched": "2026-08-03 15:17:50"
    "summary": "Java アプリケーションの JAR ファイル内に潜むネストされた依存関係は、Log4J の脆弱性 (CVE-2021-44228) のように見落とされがちなセキュリティリスクとなります。本記事では、Amazon Inspector SBOM Generator (Sbomgen) を使用してネストされた依存関係への明示的なパスを特定し、脆弱性を検出・緩和する方法を、Log4J、Jackson、Hibernate の具体例とともに紹介します。"
"last_updated": "2026-08-03 15:17:50 JST"
