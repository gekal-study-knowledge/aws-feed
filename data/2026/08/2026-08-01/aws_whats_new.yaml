    "title": "Amazon Aurora DSQL adds multi-Region cluster support in four more Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-aurora-dsql-adds-multi-region-clusters-four-more-regions/"
    "published": "2026-08-01 03:00:00"
    "fetched": "2026-08-01 05:16:28"
    "summary": "<p>Starting today, Amazon Aurora DSQL supports multi-Region clusters in four additional AWS Regions: Europe (Stockholm), Europe (Spain), Asia Pacific (Mumbai), and&nbsp;Asia Pacific (Singapore). Aurora DSQL is the fastest serverless, distributed SQL database, with active-active high availability and multi-Region strong&nbsp;consistency. Each multi-Region cluster provides a writable endpoint in both peered Regions, presenting a single logical database that remains available even if&nbsp;one Region becomes unavailable.</p> \n<p>With this launch, Aurora DSQL multi-Region clusters are available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Tokyo), Canada (Central), Canada West (Calgary), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Spain), and Europe (Stockholm). Aurora DSQL single-Region clusters are available in all of these Regions and in Asia Pacific (Hong Kong), Asia Pacific (Melbourne), Asia Pacific (Sydney), and South America (São Paulo).<br /> <br /> Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/\">AWS Free Tier</a>. To learn more, visit the Aurora DSQL <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">documentation</a>.</p>"
  "f30ac60667660b79a9bf8ad967fc173e":
    "id": "f30ac60667660b79a9bf8ad967fc173e"
    "title": "Amazon RDS for Oracle now offers Reserved Instances for R8i and M8i instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-rds-oracle-r8i-m8i/"
    "published": "2026-08-01 00:00:00"
    "fetched": "2026-08-01 08:58:20"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon RDS for Oracle </a>now offers 1-year and 3-year Reserved Instances for R8i and M8i instances with up to 53% cost savings compared to On-Demand prices. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. R8i and M8i instances offer up to 15% better price-performance and 2.5x more memory bandwidth compared to previous generation Intel-based instances.<br /> <br /> Reserved Instance benefits apply to both Multi-AZ and Single-AZ configurations. This means that customers can move freely between configurations within the same database instance class type, making them ideal for varying production workloads. Amazon RDS for Oracle Reserved Instances also provide size flexibility for the Oracle database engine under the Bring Your Own License (BYOL) licensing model. With size flexibility, the discounted rate for Reserved Instances will automatically apply to usage of any size in the same instance family.<br /> <br /> Customers can now purchase Reserved Instances for Amazon RDS for Oracle in all AWS regions where R8i and M8i instances are available except the South America (São Paulo) Region. For information on specific Oracle database editions and licensing options that support these database instance types, refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html\">Amazon RDS user guide</a>.<br /> <br /> To get started, purchase Reserved Instances through the AWS Management Console, AWS CLI, or AWS SDK. For detailed pricing information and purchase options visit <a href=\"https://aws.amazon.com/rds/oracle/pricing/\">Amazon RDS for Oracle Pricing</a>.</p>"
"last_updated": "2026-08-01 08:58:20 JST"
