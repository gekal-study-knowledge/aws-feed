    "title": "Amazon Aurora DSQL adds multi-Region cluster support in four more Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-aurora-dsql-adds-multi-region-clusters-four-more-regions/"
    "published": "2026-08-01 03:00:00"
    "fetched": "2026-08-01 05:16:28"
    "summary": "<p>Starting today, Amazon Aurora DSQL supports multi-Region clusters in four additional AWS Regions: Europe (Stockholm), Europe (Spain), Asia Pacific (Mumbai), and&nbsp;Asia Pacific (Singapore). Aurora DSQL is the fastest serverless, distributed SQL database, with active-active high availability and multi-Region strong&nbsp;consistency. Each multi-Region cluster provides a writable endpoint in both peered Regions, presenting a single logical database that remains available even if&nbsp;one Region becomes unavailable.</p> \n<p>With this launch, Aurora DSQL multi-Region clusters are available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Tokyo), Canada (Central), Canada West (Calgary), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Spain), and Europe (Stockholm). Aurora DSQL single-Region clusters are available in all of these Regions and in Asia Pacific (Hong Kong), Asia Pacific (Melbourne), Asia Pacific (Sydney), and South America (São Paulo).<br /> <br /> Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/\">AWS Free Tier</a>. To learn more, visit the Aurora DSQL <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/what-is-aurora-dsql.html\">documentation</a>.</p>"
"last_updated": "2026-08-01 05:16:28 JST"
