  "6b63219f24724e3b387ef808a72eac70":
    "id": "6b63219f24724e3b387ef808a72eac70"
    "title": "CVE-2026-18394 - Incorrect authorization in Strands Agents Tools http_request tool"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-069-aws/"
    "published": "2026-08-01 04:41:06"
    "fetched": "2026-08-01 05:16:29"
    "summary": "<p><b>Bulletin ID:</b> 2026-069-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 07/31/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Strands Agents is an open-source SDK for building AI agents. The strands-agents-tools package provides pre-built tools for use with the SDK, including the http_request tool for making HTTP API requests.</p> \n<p>We identified CVE-2026-18394, an incorrect authorization issue in the http_request tool. Operators can use the HTTP_REQUEST_TOKEN_CONFIG allowlist to bind a credential to a set of approved hostnames so it is sent only to those hosts. The tool also exposed a proxies parameter in the input schema that the large language model (LLM) could control. A crafted prompt, for example one delivered through untrusted web content the agent reads (indirect prompt injection), could set proxies to an actor-controlled endpoint. The hostname allowlist check still passes on the request URL, the credential is attached, and the request is routed through the actor's proxy on the first hop, disclosing the credential in cleartext in the Authorization header.</p> \n<p><b>Impacted versions:</b> &lt; 0.8.2</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
