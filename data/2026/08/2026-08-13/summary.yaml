"overview": |
  この日は IAM ロール作成の出発点を見直す role manager の一般提供が目を引きました。新しいアプリケーションを構築する際に必要な IAM ロールを自動的にセットアップし、権限設計に費やす時間を削減します。Amazon Quick にはガバナンス機能がまとまって追加され、Microsoft Purview 連携によるデータ損失防止、新しい AI 機能を利用者に届く前に既定で制限する deny by default、ユーザー単位のインデックスストレージとエージェント時間の上限、共有の承認ポリシーが揃いました。ライフサイエンス領域では Kiro を 24 分野・100 以上のデータベースを横断する統合研究インターフェースへ拡張する Kiro power パッケージ、HealthOmics 上での PacBio 全ゲノムシーケンシングのベンチマークが公開されています。アーキテクチャブログでは Adobe Firefly が Amazon Managed Service for Prometheus への移行で GPU メトリクスのクエリを 28 倍高速化した事例、パラメータ化クエリテンプレートによる Text2SQL のレイテンシ 80% 削減が解説されました。
