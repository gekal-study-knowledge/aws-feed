  "ba0e615490bb4d84ab21bd76a1ca6b16":
    "id": "ba0e615490bb4d84ab21bd76a1ca6b16"
    "title": "Oracle AI Database@AWS で Oracle Exadata on Exascale が利用可能に"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-oracle-exadata-on-exascale-for-oracle-ai-databaseaws/"
    "published": "2026-08-13 10:06:23"
    "fetched": "2026-08-13 10:39:46"
    "summary": "Oracle AI Database@AWS 向けに Oracle Exadata Database Service on Exascale Infrastructure (ExaDB-XS) が一般提供開始となりました。専用インフラストラクチャを事前に用意することなく、8 ECPU、ストレージ 300 GB から Exadata クラスのパフォーマンスと可用性を従量課金で利用できます。本記事では ExaDB-XS の新機能と、AWS マネジメントコンソールでの構築手順を紹介します。"
  "8f3d08e78273baa5682006270e9d0194":
    "id": "8f3d08e78273baa5682006270e9d0194"
    "title": "【開催報告】ISV SaaS 事業者向け 8 社合同 AI-DLC Unicorn Gym"
    "link": "https://aws.amazon.com/jp/blogs/news/joint-ai-dlc-unicorn-gym-isv-202607/"
    "published": "2026-08-13 11:58:30"
    "fetched": "2026-08-13 13:07:09"
    "summary": "2026 年 7 月 16 日（木）、 17 日（金）の 2 日間、東京・麻布台ヒルズにて、ISV SaaS 事業者向けの 8 社合同 AI-DLC Unicorn Gym を開催しました。株式会社サイバーセキュリティクラウド、freee 株式会社、株式会社いえらぶ GROUP、モビルス株式会社、エムオーテックス株式会社、株式会社ヌーラボ、テクマトリックス株式会社、株式会社ヴァル研究所（順不同・敬称略）の 8 社から計 54 名にご参加いただき、各チームが自社プロダクトの開発テーマを持ち込んで、Kiro や Claude Code などの Coding Agent を活用しながら 2 日間 AI 駆動の開発プロセスを実践しました。 本記事では、ご参加いただいた各社が 2 日間 AI-DLC をどう体験したのか、参加者の声を交えてレポートします。"
  "d3f664a90f4c2495b7f9cdd3b71de40b":
    "id": "d3f664a90f4c2495b7f9cdd3b71de40b"
    "title": "MGI、Sentieon、AWS で強化するゲノムデータストレージとワークフロー"
    "link": "https://aws.amazon.com/jp/blogs/news/enhanced-genomic-data-storage-and-workflows-with-mgi-sentieon-and-aws/"
    "published": "2026-08-13 16:17:16"
    "fetched": "2026-08-13 17:16:46"
    "summary": "MGI、Sentieon、AWS の協業により、ゲノミクスラボは大規模なシーケンシングデータを効率的に管理・解析できます。ベルリンの MGI 欧州本社では、3 台の DNBSEQ-T7 シーケンサーが週あたり合計で最大 63 テラベース生成するゲノムデータを AWS HealthOmics Sequence Store に取り込み、Sentieon の DNAscope や TNseq を Ready2Run ワークフローまたはプライベートワークフローで実行します。Ready2Run の固定料金と自動リソース管理により、コストを予測しやすく、迅速で高精度な発見を実現します。"
  "f7e6ccf1f0b6f31a15a54aeb9ed18bc7":
    "id": "f7e6ccf1f0b6f31a15a54aeb9ed18bc7"
    "title": "AWS HealthOmics ワークフローで PacBio 全ゲノムシーケンシングのバリアント解析パイプラインをベンチマークする"
    "link": "https://aws.amazon.com/jp/blogs/news/publicsector-benchmarking-pacbio-whole-genome-sequencing-variant-pipeline-analysis-with-aws-healthomics-workflows/"
    "published": "2026-08-13 15:19:52"
    "fetched": "2026-08-13 17:16:46"
    "summary": "PacBio HiFi の全ゲノムシーケンシング (WGS) バリアント解析パイプラインを AWS HealthOmics 上に実装し、大規模運用に向けてベンチマークしました。DeepVariant を GPU (NVIDIA Tesla A10G / omics.g5.2xlarge) で実行すると、CPU 比 21.3 パーセントのコスト削減と 8.5 パーセントの高速化を達成。run_analyzer の推奨構成なら 19.15 ドルまで削減できる見込みです。"
  "4467bcef64e602b5e9197d5f14b4f6dc":
    "id": "4467bcef64e602b5e9197d5f14b4f6dc"
    "title": "Kiro でライフサイエンス研究を加速する: 100 以上のオープンソースデータベースへの統合 AI インターフェース"
    "link": "https://aws.amazon.com/jp/blogs/news/accelerating-life-sciences-research-with-kiro-a-unified-ai-interface-to-100-open-source-databases/"
    "published": "2026-08-13 15:19:49"
    "fetched": "2026-08-13 17:16:46"
    "summary": "ライフサイエンス研究者は、遺伝子、バリアント、構造、薬剤、疾患を調べるたびに、API や認証、データ形式が異なる何十ものデータベースを行き来する必要があります。本記事では、Kiro を 24 分野・100 以上のデータベースを横断する統合研究インターフェースへと拡張する Kiro power パッケージ「Kiro for Life Sciences」を紹介します。24 のドメイン特化 MCP サーバーとデータベース横断検索、ガイド付きワークフロー、ドメインスキルにより、自然言語での質問から構造化された結果までを一気通貫で得られます。"
"last_updated": "2026-08-13 17:16:46 JST"
