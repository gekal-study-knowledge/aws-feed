    "fetched": "2026-08-13 10:39:46"
    "summary": "Oracle AI Database@AWS 向けに Oracle Exadata Database Service on Exascale Infrastructure (ExaDB-XS) が一般提供開始となりました。専用インフラストラクチャを事前に用意することなく、8 ECPU、ストレージ 300 GB から Exadata クラスのパフォーマンスと可用性を従量課金で利用できます。本記事では ExaDB-XS の新機能と、AWS マネジメントコンソールでの構築手順を紹介します。"
