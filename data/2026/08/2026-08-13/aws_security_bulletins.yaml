    "title": "CVE-2026-19311- Missing Authorization in OpenSearch Alerting Plugin"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-078-aws/"
    "published": "2026-08-13 03:46:36"
    "fetched": "2026-08-13 03:56:20"
    "summary": "<p><b>Bulletin ID:</b> 2026-078-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/12/2026 11:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>OpenSearch is a community-driven, open-source search and analytics suite. We identified CVE-2026-19311, a missing authorization issue in the Execute Monitor API of the OpenSearch Alerting plugin. This issue may allow an authenticated user with the alerting_full_access role to read, modify, or delete arbitrary index data via a crafted inline monitor request with unintentional data source and input index parameters.</p> \n<p><b>Impacted Versions:</b></p> \n<p><b>OpenSearch Alerting Plugin (open-source, self-managed):</b><br /> - <b>Affected:</b> 2.4.0 through 2.19.5, 3.0.0 through 3.7.0<br /> - <b>Fixed:</b> 2.19.6, 3.8.0</p> \n<p><b>Amazon OpenSearch Service (AWS Managed):</b><br /> - <b>Affected:</b> All domains running engine versions 2.4 through 3.5<br /> - <b>Fixed:</b> Service software R20260428-P3</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "fa7f69ab50dfcd886ca495c84ac96a4b":
    "id": "fa7f69ab50dfcd886ca495c84ac96a4b"
    "title": "CVE-2026-19642 & CVE-2026-19643 - Memory-safety issues in the Base64 decoder in the AWS SDK for C&plus;&plus;"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-080-aws/"
    "published": "2026-08-13 04:52:23"
    "fetched": "2026-08-13 04:59:26"
    "summary": "<p><b>Bulletin ID:</b> 2026-080-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/12/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>The AWS SDK for C++ is an open-source library that provides C++ developers with APIs for AWS services. Its core library includes a Base64 codec used by the generated service clients for a variety of features.We identified the following CVEs:<br /> - CVE-2026-19642 - Out-of-bounds write in the Base64 decoder in the AWS SDK for C++<br /> - CVE-2026-19643 - Out-of-bounds read in the Base64 decoder in the AWS SDK for C++</p> \n<p>For CVE-2026-19642, certain inputs to the Base64 decoder might cause the decoder to write past the end of its heap-allocated output buffer, which might crash or corrupt memory in the process performing the decode. Remote code execution has not been demonstrated.</p> \n<p>For CVE-2026-19643, certain inputs to the Base64 decoder, on some platforms, might cause the decoder to read outside the bounds of its decode table, which might crash the process performing the decode.</p> \n<p>For both issues, impact is confined to the process of the application performing the decode.</p> \n<p><b>Impacted Versions:</b> AWS SDK for C++: &lt;= 1.11.861</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-08-13 04:59:26 JST"
