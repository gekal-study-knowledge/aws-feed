"entries":
  "f27f2b7d367a8bd6e6b35942492c9ad1":
    "id": "f27f2b7d367a8bd6e6b35942492c9ad1"
    "title": "Amazon EKS now supports advanced Kubernetes control plane configuration parameters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-eks-control-plane-configuration-parameters"
    "published": "2026-08-13 03:00:00"
    "fetched": "2026-08-13 05:53:54"
    "summary": "<p><a href=\"https://aws.amazon.com/pm/eks/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Elastic Kubernetes Service (Amazon EKS)</a> now supports configuring parameters for Kubernetes control plane components including the scheduler, controller manager, and API server. You can tune pod placement strategies to improve resource utilization, adjust how quickly horizontal pod autoscaling responds to changes in demand, set resource lifecycle parameters such as event retention duration, and more.<br /> <br /> Cluster administrators now have more control over Kubernetes control plane parameters beyond the defaults. For example, you can set the scheduler's node resource fit strategy parameter to <i>MostAllocated</i>, which packs pods onto nodes that are already well utilized and helps you run the same workloads on fewer nodes. The default <i>LeastAllocated</i> strategy spreads pods across nodes, and you can keep it where headroom matters more than density.<br /> <br /> You can configure Kubernetes control plane parameters in any AWS Region where Amazon EKS is available. For the full list of configurable parameters and to learn more, see Control plane configuration in the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/control-plane-configuration.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EKS User Guide</a>.</p>"
  "ab5ba638f5840a97f871c1a9c855ee9d":
    "id": "ab5ba638f5840a97f871c1a9c855ee9d"
    "title": "Amazon Connect Customer supports manual assignment of queued agent-first callbacks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-agent-callbacks/"
    "published": "2026-08-13 02:15:00"
    "fetched": "2026-08-13 05:53:54"
    "summary": "<p>Amazon Connect Customer now lets agents view and self-assign queued agent-first callbacks alongside emails, tasks, and chats. This gives agents the option to prioritize work that needs immediate follow-up or for which they already have relevant context. For example, an agent familiar with a customer’s issue can assign the callback to themselves, avoiding another handoff and helping resolve the issue faster.</p> \n<p>This feature is available in all AWS Regions where Amazon Connect Customer is available. To learn more about how to use queued callbacks, refer to our documentation <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/worklist-app.html\">Access the Worklist app</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/setup-queued-cb.html\">Set up queued callbacks</a>. For more information about Amazon Connect Customer, visit our <a href=\"https://aws.amazon.com/connect/\">product page</a>.</p>"
  "fb6d9c2cf852ab0474df646693e83707":
    "id": "fb6d9c2cf852ab0474df646693e83707"
    "title": "AWS Global View now offers an interactive map view for AWS Regions and AWS Local Zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-global-view-map-view/"
    "published": "2026-08-13 07:00:00"
    "fetched": "2026-08-13 08:36:08"
    "summary": "<p>Today, AWS announces the addition of an interactive map view to AWS Global View in the AWS Management Console, providing a visual way to explore AWS Global Infrastructure.</p> \n<p>Previously, customers had to scan through a list of AWS locations in AWS Global View. With this new capability, customers can toggle between the interactive map view and the existing list view, making it easier to visualize their global AWS infrastructure footprint.&nbsp;</p> \n<p>When customers select the map view, they will see all AWS Regions and AWS Local Zones plotted on an interactive map. This capability helps customers make informed infrastructure planning decisions by visualizing already enabled AWS locations and the full range of AWS locations available to them, all in a single glance.</p> \n<p>This capability is available across all public AWS Regions. To get started, navigate to the Regions and Zones page in <a href=\"https://us-east-1.console.aws.amazon.com/ec2globalview/home#RegionsAndZones\">AWS Global View</a> console. For more information, see the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/global-view.html\">AWS Global View</a> documentation.</p>"
  "4c04e8562ca3aa24eba928cae344818c":
    "id": "4c04e8562ca3aa24eba928cae344818c"
    "title": "Amazon Quick adds deny by default for custom permissions"
    "link": "https://aws.amazon.com/whats-new/2026/08/amazon-quick-deny-by-default-permissions/"
    "published": "2026-08-13 02:15:00"
    "fetched": "2026-08-13 08:36:08"
    "summary": "<p>Amazon Quick custom permissions now include deny by default, a governance setting that automatically restricts new AI capabilities before they reach users.<br /> <br /> Previously, new AI capabilities were available to all users on release, requiring administrators to react after the fact. With deny by default, administrators restrict the AI capability category in a custom permissions profile and assign it to users, roles, or the entire account. Quick then denies any new AI capability at launch for those users. Restricting a category also restricts existing capabilities in it. Administrators explicitly allow each capability when ready. The restriction applies only to the profile you configure.<br /> <br /> Configure deny by default in Manage account in Amazon Quick or through the AWS CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions-governance.html\">Custom permissions deny by default</a>. Deny by default is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\">Amazon Quick is available</a>.</p>"
  "3abba6229efebd34b02dea2645325d5d":
    "id": "3abba6229efebd34b02dea2645325d5d"
    "title": "Amazon Quick now supports data loss prevention with Microsoft Purview"
    "link": "https://aws.amazon.com/whats-new/2026/08/amazon-quick-dlp-purview/"
    "published": "2026-08-13 02:09:00"
    "fetched": "2026-08-13 08:36:08"
    "summary": "<p>Amazon Quick now integrates with Microsoft Purview to enforce data loss prevention (DLP) policies across your Quick environment. Organizations need to ensure that sensitive files aren't shared outside approved channels. With this integration, IT administrators and security teams can apply their existing Purview sensitivity labels to automatically control how files are handled in Quick capabilities such as chat, spaces, and knowledge bases.</p> \n<p>Administrators can configure enforcement actions (block, warn, or allow) for each sensitivity label, giving organizations granular control over sensitive file sharing across Quick. For example, a financial services company can block files labeled \"Highly Confidential\" from being uploaded to shared spaces while allowing \"Internal\" files with a warning notification. With this integration, customers can extend their existing Microsoft Purview governance policies into Quick without additional tools.</p> \n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\">all AWS Regions where Amazon Quick agentic capabilities are supported</a>. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/data-loss-prevention.html\" rel=\"noopener noreferrer\" target=\"_blank\">Data loss prevention</a> in the <i>Amazon Quick User Guide</i>.&nbsp;</p>"
  "8137cff1467e3e278e86aa5d9e3bee28":
    "id": "8137cff1467e3e278e86aa5d9e3bee28"
    "title": "AWS IAM now provides role manager to set up IAM roles automatically"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-iam-role-manager"
    "published": "2026-08-13 03:00:00"
    "fetched": "2026-08-13 10:39:45"
    "summary": "<p>Today, AWS announces the general availability of role manager, a capability in AWS Identity and Access Management (IAM) that automatically sets up the IAM roles your AWS services need. When you set up a supported service in the console, role manager creates a default role on your behalf, or reuses one that already exists in your account if it already matches the required permissions. You can enable or disable role manager at any time, as well as inspect the AWS-managed templates that role manager deploys on your behalf.</p> \n<p>Role manager supports 6 AWS service consoles at launch, including AWS Lambda and Amazon EventBridge. For example, when you create an AWS Lambda function, role manager applies the AWS-managed template for that workflow. Roles created via role manager appear in the IAM console as standard IAM roles that you fully control, and you can identify the ones role manager created. When you are ready to tighten permissions, you can disable role manager and use IAM Access Analyzer to refine each role to only the permissions it needs.</p> \n<p>Role manager is available in all AWS Regions, except the AWS GovCloud (US) Regions and the China Regions.</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/blogs/security/how-aws-iam-role-manager-rethinks-the-starting-point-for-iam-roles/\">How AWS IAM role manager rethinks the starting point for IAM roles</a> on the AWS Security Blog, or <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_role-manager.html\">Create roles automatically with role manager</a> in the IAM User Guide.</p>"
  "b531454f40835c32cff6508851ddaf5d":
    "id": "b531454f40835c32cff6508851ddaf5d"
    "title": "Amazon S3 adds additional policy details to access denied error messages"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/s3-additional-policy-details-access-denied-error-messages/"
    "published": "2026-08-13 22:00:00"
    "fetched": "2026-08-14 02:54:17"
    "summary": "<p>Amazon S3 now includes the specific AWS Identity and Access Management (IAM) and AWS Organizations policy Amazon Resource Name (ARN) in HTTP 403 Access Denied error messages for same-account and same-organization requests. This helps you quickly identify the exact policy responsible for a denied request and remediate the issue directly.</p> \n<p>Previously, S3 access denied error messages included the policy type and reason for denial, but when multiple policies of the same type existed, you still had to manually inspect each one to pinpoint the root cause. Now the error message includes the specific policy ARN for explicit deny cases, covering Service Control Policies (SCPs), Resource Control Policies (RCPs), identity-based policies, session policies, and permission boundaries.</p> \n<p>This capability is available in all AWS Regions, including the AWS GovCloud (US) Regions and the AWS China Regions. To learn more about how to troubleshoot access denied errors in Amazon S3, visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/troubleshoot-403-errors.html\">S3 User Guide</a> and the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/troubleshoot_access-denied.html\">IAM troubleshooting documentation</a>.</p>"
  "364eb5af211053e958f79e3804ad0b04":
    "id": "364eb5af211053e958f79e3804ad0b04"
    "title": "Amazon Quick now supports approval policies for sharing"
    "link": "https://aws.amazon.com/whats-new/2026/08/amazon-quick-approval-policies-sharing/"
    "published": "2026-08-13 07:22:00"
    "fetched": "2026-08-14 07:36:42"
    "summary": "<p>Amazon Quick now offers approval policies, giving administrators governance controls over how assets are shared within their organization. With approval policies, administrators can require designated approvers to review and approve share requests before access is granted, helping organizations ensure that sharing of sensitive assets is deliberate, compliant, and auditable.</p> \n<p>Administrators can create approval policies scoped to specific asset types, including knowledge bases, spaces, and custom chat agents. When a user submits a share request for an asset covered by a policy, it is routed to the assigned approver group for review. Approvers can evaluate the asset directly before approving or denying the request, and all workflow events are captured in AWS CloudTrail for full auditability. For custom chat agents, approvers can review and act on the entire dependency package in a single request.</p> \n<p>This feature is available for Professional and Enterprise plans, in all AWS Regions where Amazon Quick agentic capabilities are supported. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p> \n<p>Learn more about Amazon Quick by visiting the <a href=\"https://aws.amazon.com/quick\" rel=\"noopener noreferrer\" target=\"_blank\">Quick website</a>. To learn more about approval policies, see Approval policies in the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/data-loss-prevention.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick User Guide</a>.&nbsp;</p>"
  "66c2225d590832c22fc2872586e852b2":
    "id": "66c2225d590832c22fc2872586e852b2"
    "title": "Amazon Quick now supports per-user resource limits"
    "link": "https://aws.amazon.com/whats-new/2026/08/amazon-quick-per-user-resource-limits/"
    "published": "2026-08-13 07:17:00"
    "fetched": "2026-08-14 07:36:42"
    "summary": "<p>Amazon Quick now enables administrators to set per-user limits on index storage and agent hours, giving them direct control over subscription costs. With limits management, administrators can create limit profiles that cap per-user consumption, helping prevent unexpected overage charges and ensuring subscription entitlements are used efficiently across their organization.</p> \n<p>For example, an organization deploying Quick enterprise-wide to thousands of users can set account-level limit profiles to establish cost-predictable baselines, then assign higher limits to specific roles that require more agent hours. Administrators can create and assign limit profiles at the user, role, or account level, with a priority hierarchy that ensures the right users get the right capacity. When a user reaches their limit, new consumption is blocked while existing content is preserved.</p> \n<p>This feature is available for Professional and Enterprise plans, in all AWS Regions where Amazon Quick agentic capabilities are supported. For more information, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region table</a>.</p> \n<p>Learn more about Amazon Quick by visiting the <a href=\"https://aws.amazon.com/quick\">Quick website</a>. To learn more about limit profiles, see Limits management in the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/limit-profiles.html\" target=\"_blank\">Amazon Quick User Guide</a>.&nbsp;</p>"
  "4cdb54ddd2882d94d8088b60f771ca0b":
    "id": "4cdb54ddd2882d94d8088b60f771ca0b"
    "title": "AWS Clean Rooms supports minimum aggregation thresholds in custom analysis rules"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-clean-rooms-minimum-aggregation-custom-analysis-rules"
    "published": "2026-08-13 21:00:00"
    "fetched": "2026-08-14 10:38:07"
    "summary": "<p>AWS Clean Rooms now supports <a href=\"https://docs.aws.amazon.com/clean-rooms/latest/userguide/analysis-rules-custom.html\" rel=\"noopener noreferrer\" target=\"_blank\">minimum aggregation thresholds for the Custom analysis rule type</a>. Minimum aggregation helps protect the privacy of individual data subjects by preventing queries from returning results about individuals or small groups. With this launch, organizations can enforce minimum aggregation on custom SQL queries, ensuring that every row a query outputs represents at least the specified number of distinct values (e.g., user IDs). Data providers in a collaboration can specify their identity column and a minimum identity count to enforce on a query’s output, with the option to set a higher threshold for specific columns.</p> \n<p>Previously, enforcing minimum aggregation thresholds on custom SQL required data providers to rely on pre-approved analysis templates and manual code reviews before queries could run. Now, data providers can configure the minimum aggregation threshold for custom SQL using the Custom analysis rule type, without using pre-structured queries or manual approval processes. Additionally, data providers can specify which columns can be filtered or joined across datasets. For example, a publisher collaborating with an advertiser for media planning use cases can enable ad-hoc queries to run on their data—and small, rural zip codes with fewer than 1,000 common users can be automatically filtered out from the result to help protect user privacy.&nbsp;</p> \n<p>AWS Clean Rooms helps companies and their partners easily analyze and collaborate on their collective datasets without revealing or copying one another’s underlying data. For more information about the AWS Regions where AWS Clean Rooms is available, see the <a href=\"https://docs.aws.amazon.com/general/latest/gr/clean-rooms.html#clean-rooms_region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> table. To learn more about collaborating with AWS Clean Rooms, visit <a href=\"https://aws.amazon.com/clean-rooms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Clean Rooms</a>.</p>"
  "fb8574a021bc4663c456f0c705600fef":
    "id": "fb8574a021bc4663c456f0c705600fef"
    "title": "AWS Deadline Cloud Now Supports EBS Persistent Volume Cost Tracking"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-deadline-cloud-now-supports-ebs-persistent-volume-cost-tracking/"
    "published": "2026-08-13 01:00:00"
    "fetched": "2026-08-18 02:22:10"
    "summary": "<p>AWS Deadline Cloud now surfaces costs related to Amazon Elastic Block Store (Amazon EBS) persistent volumes in the Usage Explorer in the Deadline Cloud Monitor app. AWS Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming.</p> \n<p>Customers have historically been able to see compute and license costs related to Deadline Cloud. With the recent release of support for persistent EBS volumes, customers needed a way to see storage costs as well. Now, Deadline Cloud tracks the cost for each EBS volume from creation until deletion, independent of any job or session. These costs appear as a new persistent volume usage type in Usage Explorer and the statistics APIs. These are attributed to the fleet that owns the volume so customers can aggregate spend by fleet, farm, or time period. This helps customers spot idle volumes and decide whether to adjust a time-to-live or let it expire. Cost tracking is enabled automatically, so no action is required.</p> \n<p>Persistent volume cost tracking is available in all AWS Regions where Deadline Cloud is offered. Cost tracking introduces no additional charges. To learn more, visit the <a href=\"https://aws.amazon.com/deadline-cloud/\">AWS Deadline Cloud product page</a> or our <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/\">user guide</a>.</p>"
"last_updated": "2026-08-18 02:22:10 JST"
