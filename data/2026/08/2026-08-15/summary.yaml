  この日は土曜日で件数が少なく、開発者向けの機能が中心でした。AWS Lambda にパブリックプレビューランタイムという仕組みが導入され、GA 前の言語バージョンを試せるようになりました。第一弾として Node.js 26 と Python 3.15 が利用できます。あわせて AWS AppConfig を使った Lambda での動的なフィーチャーフラグの実装方法が解説され、コードをデプロイせずに実行時の挙動を切り替える手法が示されました。機械学習では SageMaker AI の OpenAI 互換エンドポイントと Bedrock AgentCore ランタイムを組み合わせたマルチエージェントワークフローの構築、Amazon Nova Forge でのマルチターン強化学習における複合報酬関数の設計が紹介されています。Amazon Quick では前々日に発表されたガバナンス機能群 (deny by default、共有承認ポリシー、Microsoft Purview 連携の DLP、ユーザー単位の上限) が改めて案内されました。
