  "b09549ceb5b8de1b0e757516ef165350":
    "id": "b09549ceb5b8de1b0e757516ef165350"
    "title": "Daybreak Red and Daybreak Blue from OpenAI are now available to eligible customers on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/openai-daybreak-red-and-blue-on-amazon-bedrock/"
    "published": "2026-08-14 01:12:00"
    "fetched": "2026-08-14 02:54:17"
    "summary": "<p>Security teams can now access Daybreak Red and Daybreak Blue from OpenAI on Amazon Bedrock. Both are part of Daybreak, the cyber defense initiative from OpenAI that gives defenders governed access to frontier AI for cybersecurity work.</p> \n<p>Daybreak Blue is the starting point for most security teams across defensive workflows including vulnerability discovery, detection engineering, and incident response. Daybreak Red is designed for advanced, authorized tasks such as vulnerability research, exploit reproduction, and mitigation development. For these tasks, a lower refusal threshold matched by stronger identity verification, monitoring, and access controls improves the speed and depth of an investigation. Both models run on Bedrock's next-generation inference engine with zero-operator access (ZOA) enforced at the chip. Your inference data is not used for model training, and neither model requires you to opt into sharing your data with OpenAI.</p> \n<p>Daybreak Red: GPT-5.6 Cyber and Daybreak Blue: GPT-5.6 Sol are now available to eligible customers on Amazon Bedrock in the following <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Region</a>: US East (N. Virginia). Access to the models requires enrollment in <a href=\"https://openai.com/form/enterprise-trusted-access-for-cyber/\">Daybreak access</a> from OpenAI. To enroll, contact OpenAI or reach out to your AWS account team for guidance on eligibility. Once approved, work with your account team to request access on AWS. To learn more, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/accelerate-cyber-defense-with-openai-and-aws-daybreak-red-daybreak-blue-now-available-to-eligible-customers-on-amazon-bedrock/\">blog.</a></p>"
  "e4ad2555f70a96b0cc471bfdd8851077":
    "id": "e4ad2555f70a96b0cc471bfdd8851077"
    "title": "Spot Placement Score now includes Local Zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/spot-placement-score-local-zones/"
    "published": "2026-08-14 02:13:00"
    "fetched": "2026-08-14 04:55:18"
    "summary": "<p>Today, AWS announces support for AWS Local Zones in Spot placement score, helping you identify locations where your Spot capacity request is most likely to succeed. Spot placement score evaluates your target capacity and compute requirements and returns scores for AWS Regions or Availability Zones.</p> \n<p>Previously, Spot placement scores excluded local zone capacity information when reporting zonal and regional scores. Now, you can optionally request local zones to be included in the zonal and regional score responses giving you a broader view of your Spot capacity options.</p> \n<p>You can use Spot placement score through EC2 Spot Console, AWS CLI, or SDK. To learn more about Spot placement score see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-placement-score.html\"><u>Spot placement score documentation</u></a>.</p>"
  "19ca605522f4cdee4f63df321e416113":
    "id": "19ca605522f4cdee4f63df321e416113"
    "title": "Amazon Quick Microsoft 365 extensions are now generally available"
    "link": "https://aws.amazon.com/amazon-quick-microsoft-365-extensions-generally-available"
    "published": "2026-08-14 03:00:00"
    "fetched": "2026-08-14 05:37:21"
    "summary": "<p>Today, Amazon Quick announces the general availability of Microsoft 365 extensions for Excel, PowerPoint, Word, and Outlook. These extensions enable Quick to perform tasks directly within users' M365 environments, using AI to handle complex local tasks such as redlining documents, building financial models, creating presentation-ready decks, and managing Outlook inboxes.</p> \n<p>The Excel extension helps with complex spreadsheet analysis, creating pivot tables and charts, and importing and cleaning data. The PowerPoint extension helps you create and refine presentations from Quick data using organization-defined templates. The Word extension generates formatted documents with Word primitives, makes sweeping edits with track changes enabled, and participates as a reviewer in comments. The Outlook extension performs inbox and calendaring tasks such as prioritizing emails, organizing your inbox, scheduling meetings, and drafting replies using your Quick data and entire inbox context.</p> \n<p>These extensions transform daily work across teams. Finance teams can build complex models by describing what they need. Sales teams can draft proposals that automatically pull from CRM data. Marketing teams can create branded presentations without manual formatting. Legal teams can streamline contract reviews. Operations teams can manage email workflows and schedule meetings intelligently, and IT teams can automate routine data analysis that previously required manual effort.</p> \n<p>Amazon Quick Microsoft 365 extensions are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), Asia Pacific (Tokyo), and Europe (Frankfurt). To learn more, see <a href=\"https://aws.amazon.com/blogs/machine-learning/amazon-quick-for-microsoft-365-agentic-ai-where-you-work/\">Amazon Quick for Microsoft 365: Agentic AI where you work</a>, and download extensions on the <a href=\"https://aws.amazon.com/quick/download/\">Quick download page.</a></p>"
  "6d0e8986962b045205f433e6f16b9316":
    "id": "6d0e8986962b045205f433e6f16b9316"
    "title": "Claude Opus 5 is now available in AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/claude-opus-5-aws-govcloud/"
    "published": "2026-08-14 03:23:00"
    "fetched": "2026-08-14 06:40:07"
    "summary": "<p>AWS GovCloud (US) now offers Claude Opus 5 — the most advanced Opus model yet, and compatible with zero data retention (ZDR) — bringing a step-change in coding, long-running agents, and complex professional work to teams building at the highest level.&nbsp;Claude Opus 5 is available via the bedrock-runtime endpoint in both AWS GovCloud (US) regions, and available via the&nbsp;bedrock-mantle&nbsp;endpoint in AWS GovCloud (US-West)</p> \n<p>Claude Opus 5 delivers advances in coding, understanding and navigating codebases like an experienced engineer and writing production-quality code while adapting its strategy as it works. It powers dependable agents that run for hours and even overnight, finding paths around obstacles, recovering from errors, and reaching their objectives. And it brings deeper reasoning to long documents and higher accuracy to complex analysis, with the largest gains on document-heavy enterprise work.&nbsp;</p> \n<p>Amazon Bedrock offers Claude Opus 5 with zero data retention (ZDR) enabled by default, giving you Opus' top-tier intelligence while meeting your data governance requirements. It keeps your data within AWS infrastructure with regional data residency and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\">regional availability.</a></p>"
"last_updated": "2026-08-14 06:40:07 JST"
