"overview": |
  この日は証明書運用の大きな方針転換が告知されました。AWS Certificate Manager が CA/B フォーラムによる業界全体の動きに合わせ、2027 年 9 月 30 日までに E メール検証済みパブリック証明書のサポートを終了します。あわせて既存の証明書について E メール検証から DNS 検証へ切り替える機能も提供開始されました。Amazon Quick は Microsoft 365 拡張機能が一般提供となり、Word・Excel・PowerPoint・Outlook の中から直接エージェンティック AI とデータにアクセスできます。Claude Opus 5 が GovCloud (US) でも利用可能になり、OpenAI のサイバー防御モデル Daybreak Red / Daybreak Blue も対象顧客向けに Bedrock で提供開始となりました。コンピュートブログでは相関するハードウェア障害を防ぐ分散システム設計、Lambda MicroVMs の CPU・メモリメトリクス収集、durable functions のオブザーバビリティのベストプラクティスが解説されています。
