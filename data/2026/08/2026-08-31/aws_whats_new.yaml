    "id": "1296d96b1f19cd85cff4ed1d0d8ba333"
    "title": "AWS Workload Credentials Provider is now available as a one-click install for Linux and Windows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/workload-credentials-provider-install/"
    "published": "2026-08-31 16:00:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Today, AWS Secrets Manager announces one-click installation for the AWS Workload Credentials Provider (AWCP) on Amazon Linux and Windows, reducing setup from a multi-step build-from-source process to a single command.&nbsp;<br /> &nbsp;<br /> AWCP resolves secrets from AWS Secrets Manager and caches them locally, enabling applications to retrieve secrets over a local HTTP endpoint. AWCP also enables you to pull your certificates from AWS Certificate Manager. Previously, customers who wanted to use AWCP on Amazon EC2 instances had approximately 6 steps, starting from cloning the Github repository to compiling the binary and setting up configurations. This multi-step process required every developer to learn Rust expertise and build infrastructure.&nbsp;<br /> &nbsp;<br /> Now, customers can download pre-built, signed binaries for Linux (x86_64 and ARM64) and Windows (x64) directly from a public download URL. Along with this, AWCP is now available in the Amazon Linux repository. Amazon Linux EC2 customers can install it in one command. All binaries are code-signed to ensure integrity and authenticity, and deliver a ready-to-run agent with in-memory secret caching.&nbsp;<br /> &nbsp;<br /> AWS Workload Credentials Provider one-click install is available on Amazon Linux 2023 (x86_64 and ARM64) and Windows Server (x64) in all AWS Regions where AWS Secrets Manager is available, at no additional cost beyond standard Secrets Manager pricing. To get started, see the following resources - AWS Workload Credentials Provider <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/workload-credentials-provider.html\">documentation</a> , ACM <a href=\"https://docs.aws.amazon.com/acm/latest/userguide/acm-certificate-automation.html\">documentation</a>, and AWCP on <a href=\"https://github.com/aws/aws-workload-credentials-provider\">GitHub</a>.</p>"
  "eb0edd682a8e88c4ff768238bfff5cd7":
    "id": "eb0edd682a8e88c4ff768238bfff5cd7"
    "title": "Automated Security Response on AWS adds AI Toolkit for custom remediations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/automated-security-response-adds-AI-toolkit/"
    "published": "2026-08-31 15:00:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Today, AWS announced four new capabilities for Automated Security Response on AWS (ASR). Customers can now use an AI-driven Toolkit that generates custom remediations using any AI assistant with built-in safety guardrails. In addition, customers can automatically remediate findings from Amazon Inspector, Amazon GuardDuty, and Amazon Macie. Customers can also centrally configure and scope automated remediations by account, OU, region, and resource tags through an enhanced web console. Lastly, customers can configure notifications for AWS Security Hub findings with new multi-channel adapters for Email, Slack, Jira, and ServiceNow with severity-based filtering and configurable deadline enforcement.</p> \n<p><br /> ASR's AI Remediation Toolkit reduces custom remediation development time from weeks to hours using guided prompts with built-in safety guardrails, minimizing misconfigurations and eliminating reliance on deep SSM Automation expertise. Expanded service coverage enables automatic response to credential compromise, unpatched vulnerabilities, and sensitive data exposure with minimal manual triage. The enhanced web console centralizes management of 100+ security controls with built-in validation, replacing error-prone manual DynamoDB and SSM configuration. Configurable multi-channel notifications with remediation links, deadlines, and IaC code snippets help teams fix root causes and ensure timely, accountable response.</p>"
  "9904104588957cc04ce10e4544d0d04e":
    "id": "9904104588957cc04ce10e4544d0d04e"
    "title": "AWS Elastic Beanstalk now supports Active Directory domain join for Windows Server environments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/elastic-beanstalk-active-directory-domain-join/"
    "published": "2026-08-31 13:00:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>AWS Elastic Beanstalk now automatically joins the Windows Server instances in your environment to an Active Directory domain that you manage with AWS Directory Service. Previously, running domain-joined Windows workloads on Elastic Beanstalk required custom join scripts that you had to maintain. With this launch, you set a few configuration options and every instance in the environment — including instances launched later by auto scaling — joins the domain at boot, before your application deploys, with no custom scripts.</p> \n<p>Domain-joined instances can use Windows-integrated authentication, apply group policy, and reach domain resources such as file shares and SQL Server databases that use Windows authentication. You can place instances in an organizational unit that you want to target with a group policy, and each instance takes a predictable computer name derived from its instance ID. The feature is resilient by design: if an instance can't join the domain, your deployment still completes, and the environment reports the problem, so a join failure never blocks a deployment.</p> \n<p>Active Directory domain join is available on Windows Server platform versions released on or after August 18, 2026, in all AWS Commercial Regions and the AWS GovCloud (US) Regions where Elastic Beanstalk is available. For a complete list of supported Regions, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/dotnet-activedirectory.html\">Joining instances to an Active Directory domain</a> in the <i>AWS Elastic Beanstalk Developer Guide</i>. To learn more about Elastic Beanstalk, visit the <a href=\"https://aws.amazon.com/elasticbeanstalk/\">AWS Elastic Beanstalk product page</a>.</p>"
"last_updated": "2026-09-01 07:21:56 JST"
