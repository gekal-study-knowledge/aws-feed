  "02369fa3470c9afd5e271ff03b461ed2":
    "id": "02369fa3470c9afd5e271ff03b461ed2"
    "title": "Razor Group が AWS でモダンなデータレイクハウスを構築するまでの道のり"
    "link": "https://aws.amazon.com/jp/blogs/news/razor-groups-journey-to-a-modern-data-lakehouse-on-aws/"
    "published": "2026-08-31 15:41:12"
    "fetched": "2026-08-31 19:26:17"
    "summary": "Razor Group は 250 以上のブランドを展開する欧州有数の EC アグリゲーターです。本記事では、同社が AWS 上に Apache Iceberg と Amazon S3 Tables を軸としたレイクハウスアーキテクチャを構築し、データプラットフォームを最適化した道のりを紹介します。段階的な移行アプローチ、アーキテクチャ上の意思決定、そしてインフラコスト 63% 削減やクエリ 65% 高速化といった測定可能な成果を取り上げます。"
  "461ef5e666bfcb6e4ad589dc0139e670":
    "id": "461ef5e666bfcb6e4ad589dc0139e670"
    "title": "週刊AWS – 2026/8/24週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260824/"
    "published": "2026-08-31 15:36:17"
    "fetched": "2026-08-31 19:26:17"
    "summary": "Amazon Connect Customer がエージェントの音声およびチャット会話からの情報抽出に対応、Amazon EKS がクラスターあたり複数の外部 OIDC ID プロバイダーをサポート、Amazon ECS がエージェント接続に障害のあるコンテナインスタンスを自動検出・修復、AWS Lambda 関数が IAM リソースベースポリシーをフルサポート、AWS Lambda が Node.js 26 と Python 3.15 のマネージドランタイムをパブリックプレビューで提供開始、AWS Batch が Amazon ECS Managed Instances をサポート、AWS Backup が Amazon DocumentDB のクロスリージョンバックアップコピーと論理的エアギャップボールトを 9 リージョンで追加サポート、Mountpoint for Amazon S3 がメモリ使用量の制御機能を追加、Amazon Connect Customer がエージェントスケジュールで計画外シュリンケージをサポート、Amazon Aurora DSQL が外部キー制約をサポート、AWS Backup が Amazon FSx for NetApp ONTAP のクロスリージョンおよびクロスアカウントバックアップに対応、Amazon Redshift が Agent Toolkit for AWS と統合、AI 支援によるデータウェアハウス管理に対応、Amazon CloudWatch agent が journald ログのサポートを追加、Amazon Bedrock AgentCore Memory がきめ細かなアクセス制御をサポート"
  "0bc5c330ff02cdcd68f87476052e30a7":
    "id": "0bc5c330ff02cdcd68f87476052e30a7"
    "title": "AWS Glue を使用して DynamoDB テーブルエクスポートをフィルタリング、変換、ロードする"
    "link": "https://aws.amazon.com/jp/blogs/news/filter-transform-and-load-your-dynamodb-table-exports-using-aws-glue/"
    "published": "2026-08-31 14:10:42"
    "fetched": "2026-08-31 19:26:17"
    "summary": "この記事では、Amazon DynamoDB のフルまたはインクリメンタルテーブルエクスポートを 2 つ目の DynamoDB テーブルにロード（インポート）する方法を紹介します。何をロードするか、どの書き込みレートでロードするかを正確にコントロールでき、進捗を観察する機能も備えています。この技術は、最大限の制御が必要な大規模なデータマイグレーションや同期を推進するのに役立ちます。ここで説明するメカニズムは、オープンソースの Bulk Executor for DynamoDB のコマンドとして提供されています。これは、DynamoDB テーブルに対してバルクコマンドを実行するためのユーティリティセットです。このコマンドを使用することで、DynamoDB のエクスポート（済みデータ）を細かく制御しながらロードでき、アイテムを変換したり、データをフィルタリングしたり、コマンドのオプションの transform パラメータを使用して宛先テーブルに何を配置するかをカスタマイズしたりできます。"
"last_updated": "2026-08-31 19:26:17 JST"
