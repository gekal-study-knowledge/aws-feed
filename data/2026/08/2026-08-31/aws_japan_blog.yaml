    "title": "週刊生成AI with AWS – 2026/8/24 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260824/"
    "published": "2026-08-31 16:20:17"
    "fetched": "2026-08-31 19:26:17"
    "summary": "今週の週刊生成 AI with AWSでは、Dify から Amazon Bedrock AgentCore への移行を 2 週間で実現した Sapeet 様、Amazon Connect と Amazon Bedrock で電話対応業務を刷新した JAPANNEXT 様の国内事例 をお届けします。 推論コストを IAM プリンシパルに自動で紐付ける Amazon Bedrock のきめ細かなコスト配分機能の解説や、ラップトップを閉じてもエージェントが動き続ける Kiro の cloud sessions（プレビュー）の紹介も必見です。 Amazon Bedrock AgentCore の 2 リージョン拡大や AgentCore Memory の機能強化などのサービスアップデートもまとめていますので、ぜひご覧ください。"
