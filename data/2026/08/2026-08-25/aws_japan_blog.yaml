    "title": "Amazon Quick と Snowflake Cortex AI によるマネーロンダリング対策のアラートトリアージの自動化"
    "link": "https://aws.amazon.com/jp/blogs/news/automate-aml-alert-triage-with-amazon-quick-and-snowflake-cortex-ai/"
    "published": "2026-08-25 16:10:06"
    "fetched": "2026-08-25 16:39:58"
    "summary": "金融機関のマネーロンダリング対策では、1 件のアラート調査に 30〜90 分を要し、その 90〜95% が誤検知とされます。本記事では、Amazon Quick Flows と Snowflake Cortex Agent を MCP で接続し、取引データとコンプライアンス文書を横断して調査ブリーフィングを自動生成するワークフローの構築手順を解説します。"
  "078517a350ceb01c972e3acfd148dafa":
    "id": "078517a350ceb01c972e3acfd148dafa"
    "title": "本番インシデントのトリアージを AI エージェントに任せられるようになるまで"
    "link": "https://aws.amazon.com/jp/blogs/news/trust-agent-triage/"
    "published": "2026-08-25 15:59:27"
    "fetched": "2026-08-25 16:39:58"
    "summary": "ある日曜日の午前 2 時 33 分（PDT）、フロンティアモデルの可用性アラームが発報しました。本番のレスポンスがストリームの途中で止まりはじめ、監視システムが自動でチケットを起票しました。その 13 分 35 秒後、午前 2 時 46 分（PDT）には、根拠のある診断がチケット上に載っていました。ストリームが本番バグかキャパシティのスケーリングのいずれかによってエラーを出さずに停止していること、顧客に影響が出ていること、競合する仮説がすべて排除されていること、そして裏付けとなる証拠を添えた推奨される次のアクション、が書き出されていました。"
  "4f23ae33ec04262e9dd63f802be8182a":
    "id": "4f23ae33ec04262e9dd63f802be8182a"
    "title": "継続的なプロンプト評価: LLM ジャッジとライブシグナルを使って Kiro エージェントの品質を高める方法"
    "link": "https://aws.amazon.com/jp/blogs/news/continuous-prompt-evaluation/"
    "published": "2026-08-25 15:51:27"
    "fetched": "2026-08-25 16:39:58"
    "summary": "本記事は、人手で作成されたシステムプロンプトや設定の変更を評価することに焦点を当てています。自動的なトラジェクトリマイニング、変更の自動生成、ハーネス全体の自己改善については扱いません。このワークフローは、ベンチマーク結果と、社内の開発者による数千件の Kiro との会話を LLM で分析した結果を組み合わせ、タスク完遂・検証・ツール利用における改善機会を特定します。"
"last_updated": "2026-08-25 16:39:58 JST"
