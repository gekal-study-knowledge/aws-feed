  "f8f6d4f68e3c605d07c3d83203e2cba8":
    "id": "f8f6d4f68e3c605d07c3d83203e2cba8"
    "title": "Agentic Resource Discovery (ARD): An open specification for agent discovery"
    "link": "https://aws.amazon.com/blogs/machine-learning/agentic-resource-discovery-ard-an-open-specification-for-agent-discovery/"
    "published": "2026-08-25 01:22:03"
    "fetched": "2026-08-25 01:31:50"
    "summary": "AWS Agent Registry gives your organization a centralized, searchable catalog for agents, tools, and skills. It works with the open Agentic Resource Discovery (ARD) standard to enable cross-environment discovery and governance at scale."
  "41716d419dd81ca472b39c3e28983bed":
    "id": "41716d419dd81ca472b39c3e28983bed"
    "title": "Building a restaurant telephony AI host with Amazon Connect"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-a-restaurant-telephony-ai-host-with-amazon-connect/"
    "published": "2026-08-25 01:13:09"
    "fetched": "2026-08-25 01:31:50"
    "summary": "Learn how to build a voice ordering system for restaurants that answers a phone call and takes an order end to end, with no app, no website, and no sign-in. It uses Amazon Connect for telephony, Amazon Connect Agentic Voice for real-time speech, an Amazon Connect AI agent for reasoning, and Amazon Bedrock AgentCore Gateway to reach backend tools through MCP."
  "6176d3053eb743e999d741637b3c6763":
    "id": "6176d3053eb743e999d741637b3c6763"
    "title": "AI-powered metadata correction and harmonization"
    "link": "https://aws.amazon.com/blogs/machine-learning/ai-powered-metadata-correction-and-harmonization/"
    "published": "2026-08-25 00:53:03"
    "fetched": "2026-08-25 01:31:50"
    "summary": "Metadata harmonization (standardizing labels, identifiers, and formats so datasets can work together) is still largely manual. This post shows how AI-powered metadata correction works in practice, covering two approaches, human-in-the-loop validation and autonomous agent-driven workflows, plus governance considerations for production deployment."
  "d6639b937d14d9cca1cd812042c3c67d":
    "id": "d6639b937d14d9cca1cd812042c3c67d"
    "title": "Democratizing institutional knowledge: Building an AI-powered knowledge management system with AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/democratizing-institutional-knowledge-building-an-ai-powered-knowledge-management-system-with-aws/"
    "published": "2026-08-25 03:59:15"
    "fetched": "2026-08-25 04:25:05"
    "summary": "Learn how to build a customizable, smart-caching knowledge management system on AWS that captures and delivers institutional (tribal) knowledge through a voice-first AI avatar. The accelerator uses Amazon Bedrock Knowledge Bases for retrieval-augmented generation and deploys in hours with AWS CloudFormation."
  "136d2f539ad0f08674be62535731043d":
    "id": "136d2f539ad0f08674be62535731043d"
    "title": "Introducing new Ray capabilities on SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-new-ray-capabilities-on-sagemaker-hyperpod/"
    "published": "2026-08-25 04:32:14"
    "fetched": "2026-08-25 05:24:39"
    "summary": "Amazon SageMaker HyperPod now offers managed Ray support on Amazon EKS. Create and monitor Ray clusters, connect JupyterLab and Code Editor notebooks to live clusters, get out-of-the-box observability, and run resilient distributed training and accelerated inference from SageMaker Studio, all with open-source KubeRay and standard Ray APIs."
"last_updated": "2026-08-25 05:24:39 JST"
