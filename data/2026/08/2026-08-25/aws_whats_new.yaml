"entries":
  "ff6b201d2f831d730414625b898f3b40":
    "id": "ff6b201d2f831d730414625b898f3b40"
    "title": "Amazon Aurora now supports PostgreSQL 18.4, 17.10, 16.14, 15.18, and 14.23"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-aurora-postgresql-18-4-17-10-16-14-15-18-14-23/"
    "published": "2026-08-25 01:00:00"
    "fetched": "2026-08-25 03:33:34"
    "summary": "<p>Amazon Aurora PostgreSQL-Compatible Edition now supports PostgreSQL versions 18.4, 17.10, 16.14, 15.18, and 14.23 which include bug fixes from the PostgreSQL community and Aurora-specific enhancements. We recommend upgrading to the latest minor versions to address known Common Vulnerabilities and Exposures (CVEs) and benefit from these improvements, as detailed in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/AuroraPostgreSQL.Updates.html\" rel=\"noopener noreferrer\" target=\"_blank\">release notes</a>.&nbsp;</p> \n<p>You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate multiple upgrades in phases, validating on lower-priority environments before upgrading your most critical ones. For more information, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.PostgreSQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrading Amazon Aurora PostgreSQL DB clusters</a>.</p> \n<p>Amazon Aurora is designed for high performance and availability at global scale with full PostgreSQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
  "485803e1fc97e9f5368a48e64ebbd2a8":
    "id": "485803e1fc97e9f5368a48e64ebbd2a8"
    "title": "Amazon SageMaker HyperPod enhances support for Ray"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-sagemaker-hyperpod-ray"
    "published": "2026-08-25 00:00:00"
    "fetched": "2026-08-25 03:33:34"
    "summary": "<p>Amazon SageMaker HyperPod now enhances support for Ray with built-in observability, resilient training, accelerated inference and managed development environments. Ray is a popular open-source framework for scaling AI workloads on a unified compute layer, from data processing and distributed training to reinforcement learning and model serving. Running Ray on Kubernetes at production scale can be an operational burden: job hangs, low GPU utilization from static team allocations, and multi-step observability setup. Also, lack of interactive development environment means every code change needs another job submission and familiarity with kubectl.</p> \n<p>HyperPod now brings easier development, resilient training, and accelerated inference to Ray. Data scientists create, edit, monitor, and delete Ray clusters from a web-based interface in Amazon SageMaker Studio, then attach JupyterLab, Code Editor, or a local IDE to a running Ray cluster and iterate interactively against cluster-scale compute. A multi-node Ray cluster behaves like a local development environment, so you test each change immediately, without waiting for a new job to queue and start. For Observability, HyperPod provisions Grafana dashboards with metrics in Amazon Managed Service for Prometheus and allows one-click access to the Ray Dashboard through a secure browser link, giving you visibility into your workloads from the first run. For training at scale, HyperPod node auto recovery and hung job detection handle GPU faults, job hangs, loss spikes, and degraded throughput. Tiered checkpointing restores state from cluster memory to maximize goodput, and task governance improves compute utilization through quotas, priorities, and preemption. Together, these keep your long training runs progressing through failures and maximize the useful work done per GPU-hour. For inference with Ray Serve, a tiered KV cache reuses cached prefixes to reduce time to first token, and you can deploy Amazon SageMaker JumpStart models directly.</p> \n<p>Open-source Ray code runs unchanged and you can either adopt the purpose-built experience in SageMaker Studio or take individual capabilities to integrate into your own ML platform.</p> \n<p>Ray support is available for HyperPod clusters orchestrated by Amazon EKS, in AWS Regions where SageMaker HyperPod is supported. To learn more, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-ray.html\" rel=\"noopener noreferrer\" target=\"_blank\">SageMaker HyperPod documentation</a>, and explore the&nbsp;<a href=\"https://d1dpyy0tl92esj.cloudfront.net/overview\" rel=\"noopener noreferrer\" target=\"_blank\">interactive demo</a>.</p>"
  "1409596a8c494189c4205dd82df31816":
    "id": "1409596a8c494189c4205dd82df31816"
    "title": "SageMaker MLflow now supports customer managed keys"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/sagemaker-mlflow-custom-keys"
    "published": "2026-08-25 04:26:00"
    "fetched": "2026-08-25 05:24:37"
    "summary": "<p>SageMaker MLflow now enables customers to encrypt their data using customer-managed keys (CMK) through AWS Key Management Service (KMS).</p> \n<p>This enhancement allows organizations with strict security and compliance requirements to manage their own encryption keys. With customer-managed keys, you gain enhanced security control and comprehensive audit capabilities through AWS CloudTrail integration. You can encrypt your data with your own KMS keys, trace all data access for security auditing.</p> \n<p>Customer-managed keys must be created in the same AWS account and region as your MLflow App, and only symmetric AWS KMS keys are supported.</p> \n<p>This feature is generally available in all AWS Regions&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow.html#mlflow-regions\">where MLflow App is available</a>. To learn more, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/mlflow-kms.html\">SageMaker MLflow detail page</a>.</p>"
  "0400cf00386e8a5a8473a1a8b7767bd1":
    "id": "0400cf00386e8a5a8473a1a8b7767bd1"
    "title": "Amazon EKS now supports multiple external OIDC identity providers per cluster"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-eks-multiple-oidc-providers"
    "published": "2026-08-25 03:29:00"
    "fetched": "2026-08-25 07:20:52"
    "summary": "<p>Amazon Elastic Kubernetes Service (Amazon EKS) now supports multiple external OpenID Connect (OIDC) identity providers per cluster. You can associate up to 10 OIDC identity providers with a single cluster, giving you more flexibility in how you authenticate users and workloads to your Kubernetes clusters.<br /> <br /> Many organizations use different identity providers for different user populations, such as employees, contractors, and CI/CD systems. You can now associate each of these providers directly with your cluster, without consolidating users into a single provider or running an intermediary identity broker. Each provider is configured and managed independently, so each population authenticates through its own provider and identity mapping. Your existing IAM authentication continues to work alongside every configured provider. You add each provider the same way as before, using the AWS Management Console or the AssociateIdentityProviderConfig API through the AWS CLI and AWS SDKs.<br /> <br /> This capability is available at no additional cost in all AWS Regions where Amazon EKS is available. To learn more, see <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/authenticate-oidc-identity-provider.html\">Grant users access to Kubernetes with an external OIDC provider</a> in the Amazon EKS User Guide.</p>"
  "160c2d2b451a4432f4853a4b3e327501":
    "id": "160c2d2b451a4432f4853a4b3e327501"
    "title": "Amazon ECS now automatically detects and repairs container instances with impaired agent connectivity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ecs-agent-connectivity-health"
    "published": "2026-08-25 07:42:00"
    "fetched": "2026-08-25 10:01:33"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html\">Amazon Elastic Container Service</a> (Amazon ECS) now&nbsp;automatically detects and repairs container instances, enabling customers to reduce undetected workload failures and improve application availability without manual intervention.</p> \n<p>With this launch, Amazon ECS continuously monitors agent connectivity across container instances. Infrastructure events such as EBS volume degradation, host thermal events, or network connectivity failures can sever the ECS agent's connection to the ECS control plane. Amazon ECS now surfaces a new type of container instance health change event (AGENT_CONNECTIVITY) for all compute options: AWS Fargate, Amazon ECS Managed Instances, and Amazon ECS on EC2. For ECS Managed Instances and AWS Fargate, ECS automatically performs recovery - automatically draining running tasks and launching replacement capacity while deregistering impaired instances. Customers running workloads on Amazon ECS on EC2, can use this health change event to drive instance replacement workflows.</p> \n<p>This capability is available at no additional cost in all AWS Commercial and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/container-instance-health.html\">Monitor Amazon ECS Container Instance Health</a>.</p>"
  "560b08eb69bfbdf9243b3cca8b7911bf":
    "id": "560b08eb69bfbdf9243b3cca8b7911bf"
    "title": "AWS Lambda functions now support full IAM resource-based policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-lambda-full-iam-resource-based-policies/"
    "published": "2026-08-25 11:00:00"
    "fetched": "2026-08-25 19:26:48"
    "summary": "<p>AWS Lambda functions now support full Identity and Access Management (IAM) <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_controlling.html#access_controlling-resources\" rel=\"noopener noreferrer\" target=\"_blank\">resource-based policies</a>, enabling platform admins and security teams to define granular access permissions using the full capabilities of AWS IAM. With full IAM resource-based policies, you can define permissions for multiple principals and actions in a single policy document and leverage the full range of <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html\" rel=\"noopener noreferrer\" target=\"_blank\">IAM condition keys</a>.<br /> <br /> Previously, Lambda functions&nbsp;required customers to add permissions individually per principal. This provided limited flexibility for&nbsp;platform admins and security teams&nbsp;who want to manage permissions at scale.&nbsp;Now, Lambda functions support full IAM resource-based policies, including the full range of IAM condition keys. This provides a broader range of policy capabilities and streamlines policy management for teams operating multi-account architectures or managing multiple resources. For example, you can now use IAM condition keys to restrict access based on source IP or principal tag, and platform teams can now allow multiple&nbsp;services to invoke a function by using a single policy, rather than maintaining multiple statements to add permissions.<br /> <br /> You can update resource-based policies in one step using the JSON editor in the AWS Lambda console, AWS CLI, AWS SDK, or infrastructure as code tools such as AWS CloudFormation and AWS SAM. To learn more, explore the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html\" rel=\"noopener noreferrer\" target=\"_blank\">Lambda resource-based policy examples</a>&nbsp;in the AWS Lambda Developer Guide.&nbsp;<br /> <br /> Full IAM resource-based policies are available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS commerical Regions</a> at no additional charge.</p>"
  "282cd390412bc32f15053f41c449ca2d":
    "id": "282cd390412bc32f15053f41c449ca2d"
    "title": "MSK Replicator now supports OAuth 2.0 (SASL/OAUTHBEARER) authentication for replication from external Apache Kafka clusters to Amazon MSK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-msk-replicator-OAuth-support"
    "published": "2026-08-25 00:00:00"
    "fetched": "2026-08-26 03:33:17"
    "summary": "<p>Amazon MSK Replicator now supports OAuth 2.0 (SASL/OAUTHBEARER) authentication for data replication from external Apache Kafka clusters - including on-premises, self-managed on AWS, or other cloud providers - to <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-provisioned.html\">Amazon MSK Provisioned clusters</a>. With this capability, external Apache Kafka clusters configured with OAuth/OIDC authentication can now use MSK Replicator to migrate workloads to Amazon MSK, support disaster recovery by using MSK-based clusters as a failover or backup target and enable data distribution across hybrid and multi-cloud environments.</p> \n<p>MSK Replicator is a feature of Amazon MSK that automates data replication between Kafka clusters, eliminating the need to manage custom replication infrastructure or configure open-source tools. Previously, MSK Replicator supported SASL/SCRAM and mTLS authentication for connecting to external Apache Kafka clusters. With this launch, you can now also use OAuth 2.0 authentication with MSK Replicator to replicate data from external Kafka clusters to Amazon MSK. Unlike self-managed replication tools, MSK Replicator lets you retain your original Kafka topic names during replication while automatically avoiding infinite replication loops. It also synchronizes consumer group offsets bidirectionally, enabling you to move producers and consumers across clusters independently, in any order, without coordination constraints or the risk of data loss.</p> \n<p>This new capability is supported in all AWS Regions where MSK Replicator is available. Visit the MSK Replicator <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-replicator.html\">documentation</a>, <a href=\"https://aws.amazon.com/msk/features/msk-replicator/\">product page</a>, <a href=\"https://aws.amazon.com/msk/pricing/\">pricing page</a>, and this <a href=\"https://aws.amazon.com/blogs/big-data/migrate-third-party-and-self-managed-apache-kafka-clusters-to-amazon-msk-express-brokers-with-amazon-msk-replicator/\">AWS blog post</a> to learn more.</p>"
"last_updated": "2026-08-26 03:33:17 JST"
