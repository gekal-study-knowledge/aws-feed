    "title": "DuckDB で Amazon S3 Tables に格納された表形式データセットへのアクセスを効率化する"
    "link": "https://aws.amazon.com/jp/blogs/news/streamlining-access-to-tabular-datasets-stored-in-amazon-s3-tables-with-duckdb/"
    "published": "2026-08-30 19:56:07"
    "fetched": "2026-08-30 21:33:21"
    "summary": "DuckDB は軽量なインメモリ SQL エンジンで、追加のサーバー運用なしに対話型のデータ分析を実現します。本記事では、Amazon SageMaker Lakehouse Iceberg REST エンドポイントと AWS Lake Formation のアクセス許可を利用して、AWS CloudShell 上の DuckDB から Amazon S3 Tables に格納された Iceberg テーブルにアクセスし、クエリを実行する手順を紹介します。"
  "0bc433274e8de4345035f26ed41bcb8e":
