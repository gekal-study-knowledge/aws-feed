"overview": |
  この日は Amazon が DuckDB を開発するアムステルダム拠点の DuckLabs を買収する最終契約を締結したことが発表されました。DuckDB は 1 テラバイト以下の日常的なクエリを高速に処理するアーキテクチャを持ち、データエンジニアリングやデータサイエンス、AI エージェントの分析用途で広く使われています。アーキテクチャブログでは AI エージェントに全権限か読み取り専用かの二択を迫るのではなく、段階的に自律性を与える graduated autonomy というパターンが提示されました。Amazon Bedrock AgentCore Evaluations はエージェント評価を構築フレームワークから切り離し、OpenTelemetry のテレメトリさえ出していればどのフレームワークでも評価できるようにしています。データベースでは Aurora DSQL が新規・既存テーブルへの外部キー制約に対応しました。セキュリティブログでは複数サービスのシグナルを相関させて多段階攻撃を検知するガイドが公開され、事例では Gallup が 90 年分の職場科学を Bedrock ベースの Gallup AI に変換し、GoDaddy がレガシー BI から Amazon Quick へ 2 年かけて移行した内容が紹介されています。
