  "4d759d1ae234ceaf996408684288496d":
    "id": "4d759d1ae234ceaf996408684288496d"
    "title": "Amazon Connect Customer now supports unplanned shrinkage in agent schedules"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-customer-unplanned-shrinkage/"
    "published": "2026-08-27 05:16:00"
    "fetched": "2026-08-27 06:37:14"
    "summary": "<p>Amazon Connect Customer now enables managers to input unplanned shrinkage in agent schedules, providing a more accurate picture of staffing due to unscheduled agent absences such as late logins or unplanned sick leave. Managers can upload unplanned shrinkage assumptions directly into agent schedules and immediately see updated scheduling metrics such as scheduled headcount, net staffing, and projected service level — each adjusted for unplanned shrinkage. For example, if 10% of the agents scheduled to work at 8 AM next Monday are expected to be unavailable due to late logins, then projected service level falls from 90% to 85% with unplanned shrinkage. This enables workforce managers to proactively address gaps in staffing that may arise due to unplanned agent unavailability, thus improving scheduling accuracy and their ability to maintain target service levels.</p> \n<p> </p> \n<p>This feature is available in all &nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region\">AWS Regions&nbsp;</a> where Amazon Connect Customer agent scheduling is available. To learn more about Amazon Connect Customer agent scheduling, click &nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html\">here&nbsp;</a>.</p>"
  "676ca714d1cb22e38faca4314b7cab7a":
    "id": "676ca714d1cb22e38faca4314b7cab7a"
    "title": "Mountpoint for Amazon S3 adds memory usage controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/mountpoint-for-S3-adds-memory-usage-controls"
    "published": "2026-08-27 03:00:00"
    "fetched": "2026-08-27 06:37:14"
    "summary": "<p>Mountpoint for Amazon S3 can now limit memory usage, either automatically based on the environment it runs in or with a limit that you define. This lets you run Mountpoint alongside memory-intensive applications, for example, in machine learning training or analytics workloads where applications share a memory budget.</p> \n<p>Previously, Mountpoint’s memory usage could expand over time based on usage patterns, potentially causing performance or stability issues when competing with other memory-intensive applications. With this launch, you can define a memory target for Mountpoint to reserve memory for your applications. Alternatively, Mountpoint can automatically determine a safe default based on the environment it runs in. For example, when running in Amazon EKS, Mountpoint can automatically detect a container's assigned memory budget. Under memory pressure, Mountpoint slows down operations to stay within this budget, enabling you to run Mountpoint in containers with strict memory allocations. &nbsp;</p> \n<p>Mountpoint is available in all AWS Regions. To upgrade to the latest version, visit the <a href=\"https://aws.amazon.com/s3/features/mountpoint/\" rel=\"noopener noreferrer\" target=\"_blank\">Mountpoint GitHub repository</a>. To learn more about Mountpoint, see the <a href=\"https://github.com/awslabs/mountpoint-s3/blob/main/doc/CONFIGURATION.md\" rel=\"noopener noreferrer\" target=\"_blank\">overview page</a> and the <a href=\"https://github.com/awslabs/mountpoint-s3/blob/main/doc/CONFIGURATION.md\" rel=\"noopener noreferrer\" target=\"_blank\">configuration guide</a> in the Mountpoint GitHub repository.</p>"
  "bba4fa88de4640a14058d63a01ae3256":
    "id": "bba4fa88de4640a14058d63a01ae3256"
    "title": "Amazon Connect Customer now supports points-based scoring in performance evaluations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-customer-points-based-scoring-evaluations/"
    "published": "2026-08-27 02:00:00"
    "fetched": "2026-08-27 06:37:14"
    "summary": "<p>Amazon Connect Customer now supports points-based scoring to evaluate human and AI agent performance, giving managers more flexibility in configuring evaluation scores. With points-based scoring, managers assign points to each criterion based on its importance to the business, and the score is the sum of the points earned. In contrast, with the existing percentage-based scoring, each question is assigned weights that need to add up to 100%. For example, a points-based evaluation might award 40 points for resolving the customer's problem, 20 for meeting compliance requirements, and 10 for a proper greeting – without the need for scores to add up to 100. Managers control how points are awarded: combining several compliance criteria into one multiple-choice question to shorten the form, excluding the call reason from scoring, or awarding bonus points for strong customer rapport. Managers decide what counts, how much it counts, and what earns extra credit, so the score reflects what the business values most.</p> \n<p>This feature is available in all regions where Amazon Connect Customer is offered. To learn more, please visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/about-pointbased-scoring.html\">documentation</a> and our <a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>.</p>"
  "a0fcf03635ceabd1ee13bf85b4abb172":
    "id": "a0fcf03635ceabd1ee13bf85b4abb172"
    "title": "Amazon Cognito adds admin API operation to reset user TOTP configurations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cognito-totp-reset/"
    "published": "2026-08-27 07:00:00"
    "fetched": "2026-08-27 11:51:03"
    "summary": "<p>Amazon Cognito now provides a new admin API operation to reset a user's time-based one-time Password (TOTP) multi-factor authentication (MFA) configuration. When users lose access to their TOTP device, administrators can remove the device association, allowing the user to enroll a new device on their next sign-in.</p> \n<p>This removes the need to recreate accounts to recover locked-out users if they lose access to their TOTP device. Customers can maintain MFA enforcement while providing a recovery path.</p> \n<p>This new capability is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon Cognito is available. To get started, access the <a href=\"https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_AdminDeleteSoftwareToken.html\">AdminDeleteSoftwareToken</a> API using the AWS CLI, SDKs, or APIs. See the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-mfa-totp.html#user-pool-settings-mfa-totp-remove\">developer guide</a> for instructions.</p>"
  "0cfa9ec462c2aafc45130ff670df5eb1":
    "id": "0cfa9ec462c2aafc45130ff670df5eb1"
    "title": "AWS Glue 5.1 is now available in AWS European Sovereign Cloud Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-glue-5-1-european-sovereign-cloud"
    "published": "2026-08-27 01:26:00"
    "fetched": "2026-08-27 22:41:24"
    "summary": "<p>AWS Glue 5.1 is now available in the AWS European Sovereign Cloud Region.<br /> <br /> <a href=\"https://aws.amazon.com/glue/\">AWS Glue</a> is a serverless, scalable data integration service that simplifies discovering, preparing, moving, and integrating data from multiple sources. AWS Glue 5.1 upgrades core engines to Apache Spark 3.5.6, Python 3.11, and Scala 2.12.18, bringing performance and security enhancements. This release also updates support for open table format libraries, including Apache Hudi 1.0.2, Apache Iceberg 1.10.0, and Delta Lake 3.3.2. Additionally, AWS Glue 5.1 introduces support for Apache Iceberg format version 3.0, adding default column values, deletion vectors for merge-on-read tables, multi-argument transforms, and row lineage tracking. This release extends <a href=\"https://aws.amazon.com/lake-formation/\">AWS Lake Formation</a> fine-grained access control to write operations - both DML and DDL - for Spark DataFrames and Spark SQL. Previously, this capability was limited to read operations only. AWS Glue 5.1 also adds full-table access control in Apache Spark for Apache Hudi and Delta Lake tables, providing more comprehensive security options for your data.<br /> <br /> With this expansion, AWS Glue 5.1 is now available all AWS commercial and AWS GovCloud (US) Regions.<br /> <br /> You can get started with AWS Glue 5.1 using AWS APIs, AWS CLI, AWS SDK, or AWS Glue Studio. To learn more, visit the AWS Glue <a href=\"https://aws.amazon.com/glue/\">product page</a> and our <a href=\"https://docs.aws.amazon.com/glue/latest/dg/release-notes.html\">documentation</a>.&nbsp;</p>"
  "7dd4b117bff003787e5d701f214de623":
    "id": "7dd4b117bff003787e5d701f214de623"
    "title": "Amazon Aurora DSQL now supports foreign key constraints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aurora-dsql-foreign-key-constraints/"
    "published": "2026-08-27 16:00:00"
    "fetched": "2026-08-28 12:11:27"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/dsql/\">Amazon Aurora DSQL</a> now lets you add foreign key constraints to new and existing tables. Aurora DSQL is a serverless, distributed SQL database with PostgreSQL compatibility and active-active multi-Region availability.</p> \n<p>You can now express your application's rules about how tables reference each other as FOREIGN KEY constraints in your Aurora DSQL cluster. Declare, for example, that a customer's primary address must reference an existing row in your address table. Aurora DSQL then refuses any write that would leave that customer pointing at an address that no longer exists.&nbsp;You choose what happens when a referenced row is deleted or updated, with the options NO ACTION, RESTRICT, CASCADE, SET NULL, and SET DEFAULT.</p> \n<p>This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Aurora DSQL is available. To learn more, see <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/working-with-foreign-key-constraints.html\">working with foreign key constraints</a> and the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/create-table-syntax-support.html#create-table-foreign-keys\">CREATE TABLE foreign key syntax</a> in the Aurora DSQL User Guide.</p>"
"last_updated": "2026-08-28 12:11:27 JST"
