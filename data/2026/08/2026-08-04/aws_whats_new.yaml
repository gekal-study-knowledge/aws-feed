    "title": "Amazon ECR now supports image layers up to 200 GB"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ecr-image-layers/"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 01:19:46"
    "summary": "<p>Amazon Elastic Container Registry (Amazon ECR) has increased the maximum image layer size limit to 200 GB, for images pushed via Docker push.</p> \n<p>Previously, packaging assets required splitting data across multiple layers or offloading to external storage systems. With this update, customers can store up to 200 GB in a single image layer, eliminating extra complexity for use cases like embedding large language models, bundling genomics datasets, or packaging large binary dependencies directly into your container images. Images pushed using the AWS SDK or CLI; (UploadLayerPartAPI) remain limited to 50 GB.</p> \n<p>This feature is available in all AWS Regions and partitions where Amazon ECR is available except the Middle East (Bahrain) and Middle East (UAE) Regions. To learn more, visit the <a href=\"https://aws.amazon.com/ecr/\">Amazon ECR product page</a> and refer to the <a href=\"https://docs.aws.amazon.com/AmazonECR/latest/userguide/\">Amazon ECR User Guide</a>. For pricing information, see the <a href=\"https://aws.amazon.com/ecr/pricing/\">Amazon ECR pricing page</a>.</p>"
  "d23ba3c4563461af04f00840f42a7b6e":
    "id": "d23ba3c4563461af04f00840f42a7b6e"
    "title": "AWS Transform for full-stack Windows modernization now supports offline schema transformation to Aurora PostgreSQL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/aws-transform-windows-sql-schema-aurora"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 03:47:43"
    "summary": "<p>Today, AWS Transform for full-stack Windows modernization announced general availability of offline source transformation, enabling customers to modernize Microsoft SQL Server databases to Amazon Aurora PostgreSQL without requiring a live database connection. AWS Transform now converts SQL Server storage objects, powered by AWS DMS, and code objects (stored procedures) using an agentic, interactive experience. Enterprises modernizing legacy .NET applications and their dependent SQL Server databases can now start their modernization by directly uploading the Data Design Language (DDL) source files from their databases.</p> \n<p>With offline source transformation, customers upload SQL Server data design language (DDL) files, assess database and stored procedure complexity, and generate a customizable transformation plan. AWS Transform converts tables, schemas and converts code objects such as stored procedures and functions, validates functional equivalence, and deploys the converted schema to Aurora PostgreSQL. The same workflow transforms database dependent .NET applications to be PostgreSQL compatible .NET applications with updated connection strings, ADO.NET and Entity Framework data-access calls. To address remaining conversion issues, customers can iterate directly in the web console or hand off to their preferred IDE using the AWS Transform MCP server. A separate synthetic data workflow populates Aurora PostgreSQL with test data for end-to-end application validation.</p> \n<p>AWS Transform for full-stack Windows modernization and offline source transformation is available in US East (N. Virginia). To get started, you can go to <a href=\"https://aws.amazon.com/transform/windows/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform product page</a> or see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/windows-full-stack.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform for full-stack Windows documentation</a>.</p>"
  "5582d348a6acf44e97a6ead1aabfbe8b":
    "id": "5582d348a6acf44e97a6ead1aabfbe8b"
    "title": "AWS WAF now supports Miggo Security managed rule groups for emerging threats and AI/ML application protection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-waf-miggo-managed-rule-groups"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 03:47:43"
    "summary": "<p>AWS WAF now supports two new partner managed rule groups from Miggo Security, available through AWS Marketplace: <a href=\"https://aws.amazon.com/marketplace/pp/prodview-6zieu7lxn5vje\">Miggo Rules for AWS WAF – High Emerging Application Threats</a>, and <a href=\"https://aws.amazon.com/marketplace/pp/prodview-a6ezxvokf5keg\">Miggo Rules for AWS WAF – AI/ML Application Protection</a>. These rule groups give AWS WAF customers continuously updated protection against vulnerabilities that are being actively exploited, have public proof-of-concept code, or appear in the CISA Known Exploited Vulnerabilities (KEV) catalog, without writing or maintaining custom rules.<br /> <br /> The High Emerging Application Threats rule group focuses on vulnerabilities under active exploitation, and the AI/ML Application Protection rule group focuses on generative-AI application stacks such as AI agent frameworks, LLM gateways, and model-serving infrastructure. You can subscribe to either rule group and add it to a web ACL directly in the AWS WAF console through AWS Marketplace, with no additional configuration. Both rule groups support versioning, and pricing is set by Miggo through AWS Marketplace.<br /> <br /> To get started, visit the AWS WAF console or find the Miggo rule groups in AWS Marketplace. For more information, see the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-managed-rule-groups.html\">AWS WAF Developer Guide</a>. For a full list of supported Regions, visit the AWS Regional Services page.</p>"
"last_updated": "2026-08-04 03:47:43 JST"
