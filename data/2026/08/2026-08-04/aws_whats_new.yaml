"entries":
  "cf9eaf46e303b51437176283a404c925":
    "id": "cf9eaf46e303b51437176283a404c925"
    "title": "Amazon ECR now supports image layers up to 200 GB"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ecr-image-layers/"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 01:19:46"
    "summary": "<p>Amazon Elastic Container Registry (Amazon ECR) has increased the maximum image layer size limit to 200 GB, for images pushed via Docker push.</p> \n<p>Previously, packaging assets required splitting data across multiple layers or offloading to external storage systems. With this update, customers can store up to 200 GB in a single image layer, eliminating extra complexity for use cases like embedding large language models, bundling genomics datasets, or packaging large binary dependencies directly into your container images. Images pushed using the AWS SDK or CLI; (UploadLayerPartAPI) remain limited to 50 GB.</p> \n<p>This feature is available in all AWS Regions and partitions where Amazon ECR is available except the Middle East (Bahrain) and Middle East (UAE) Regions. To learn more, visit the <a href=\"https://aws.amazon.com/ecr/\">Amazon ECR product page</a> and refer to the <a href=\"https://docs.aws.amazon.com/AmazonECR/latest/userguide/\">Amazon ECR User Guide</a>. For pricing information, see the <a href=\"https://aws.amazon.com/ecr/pricing/\">Amazon ECR pricing page</a>.</p>"
  "d23ba3c4563461af04f00840f42a7b6e":
    "id": "d23ba3c4563461af04f00840f42a7b6e"
    "title": "AWS Transform for full-stack Windows modernization now supports offline schema transformation to Aurora PostgreSQL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/aws-transform-windows-sql-schema-aurora"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 03:47:43"
    "summary": "<p>Today, AWS Transform for full-stack Windows modernization announced general availability of offline source transformation, enabling customers to modernize Microsoft SQL Server databases to Amazon Aurora PostgreSQL without requiring a live database connection. AWS Transform now converts SQL Server storage objects, powered by AWS DMS, and code objects (stored procedures) using an agentic, interactive experience. Enterprises modernizing legacy .NET applications and their dependent SQL Server databases can now start their modernization by directly uploading the Data Design Language (DDL) source files from their databases.</p> \n<p>With offline source transformation, customers upload SQL Server data design language (DDL) files, assess database and stored procedure complexity, and generate a customizable transformation plan. AWS Transform converts tables, schemas and converts code objects such as stored procedures and functions, validates functional equivalence, and deploys the converted schema to Aurora PostgreSQL. The same workflow transforms database dependent .NET applications to be PostgreSQL compatible .NET applications with updated connection strings, ADO.NET and Entity Framework data-access calls. To address remaining conversion issues, customers can iterate directly in the web console or hand off to their preferred IDE using the AWS Transform MCP server. A separate synthetic data workflow populates Aurora PostgreSQL with test data for end-to-end application validation.</p> \n<p>AWS Transform for full-stack Windows modernization and offline source transformation is available in US East (N. Virginia). To get started, you can go to <a href=\"https://aws.amazon.com/transform/windows/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform product page</a> or see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/windows-full-stack.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform for full-stack Windows documentation</a>.</p>"
  "5582d348a6acf44e97a6ead1aabfbe8b":
    "id": "5582d348a6acf44e97a6ead1aabfbe8b"
    "title": "AWS WAF now supports Miggo Security managed rule groups for emerging threats and AI/ML application protection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-waf-miggo-managed-rule-groups"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 03:47:43"
    "summary": "<p>AWS WAF now supports two new partner managed rule groups from Miggo Security, available through AWS Marketplace: <a href=\"https://aws.amazon.com/marketplace/pp/prodview-6zieu7lxn5vje\">Miggo Rules for AWS WAF – High Emerging Application Threats</a>, and <a href=\"https://aws.amazon.com/marketplace/pp/prodview-a6ezxvokf5keg\">Miggo Rules for AWS WAF – AI/ML Application Protection</a>. These rule groups give AWS WAF customers continuously updated protection against vulnerabilities that are being actively exploited, have public proof-of-concept code, or appear in the CISA Known Exploited Vulnerabilities (KEV) catalog, without writing or maintaining custom rules.<br /> <br /> The High Emerging Application Threats rule group focuses on vulnerabilities under active exploitation, and the AI/ML Application Protection rule group focuses on generative-AI application stacks such as AI agent frameworks, LLM gateways, and model-serving infrastructure. You can subscribe to either rule group and add it to a web ACL directly in the AWS WAF console through AWS Marketplace, with no additional configuration. Both rule groups support versioning, and pricing is set by Miggo through AWS Marketplace.<br /> <br /> To get started, visit the AWS WAF console or find the Miggo rule groups in AWS Marketplace. For more information, see the <a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-managed-rule-groups.html\">AWS WAF Developer Guide</a>. For a full list of supported Regions, visit the AWS Regional Services page.</p>"
  "a02086a6fcc5688f24232100d29a0a71":
    "id": "a02086a6fcc5688f24232100d29a0a71"
    "title": "AWS Config now supports 15 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-config-new-resource-types"
    "published": "2026-08-04 00:00:00"
    "fetched": "2026-08-04 05:23:50"
    "summary": "<p>AWS Config now supports 15 additional AWS resource types across key services including Amazon Bedrock,&nbsp; Amazon OpenSearch Serverless, and Amazon SageMaker. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.<br /> <br /> With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.<br /> <br /> You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\">AWS Regions</a> where the resources are available:<br /> <br /> Resource Types:</p> \n<table> \n <tbody>\n  <tr>\n   <td>AWS::AppSync::DomainName</td> \n   <td>AWS::OpenSearchServerless::AccessPolicy</td> \n  </tr>\n  <tr>\n   <td>AWS::Bedrock::AutomatedReasoningPolicy</td> \n   <td>AWS::OpenSearchServerless::LifecyclePolicy</td> \n  </tr>\n  <tr>\n   <td>AWS::Bedrock::AutomatedReasoningPolicyVersion</td> \n   <td>AWS::SageMaker::ImageVersion</td> \n  </tr>\n  <tr>\n   <td>AWS::Bedrock::Blueprint</td> \n   <td>AWS::SageMaker::InferenceComponent</td> \n  </tr>\n  <tr>\n   <td>AWS::Bedrock::DataAutomationProject</td> \n   <td>AWS::SageMaker::PartnerApp</td> \n  </tr>\n  <tr>\n   <td>AWS::BedrockAgentCore::ApiKeyCredentialProvider</td> \n   <td>AWS::SageMaker::Project</td> \n  </tr>\n  <tr>\n   <td>AWS::Connect::UserHierarchyGroup</td> \n   <td>AWS::SageMaker::Space</td> \n  </tr>\n  <tr>\n   <td>AWS::Glue::Trigger</td> \n  </tr>\n </tbody>\n</table>"
  "d712bc42564d1eeaef1f61a415bb957c":
    "id": "d712bc42564d1eeaef1f61a415bb957c"
    "title": "Amazon GameLift Streams now supports sharing streams with stream URLs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-gamelift-streams/"
    "published": "2026-08-04 05:24:00"
    "fetched": "2026-08-04 07:04:53"
    "summary": "<p>Amazon GameLift Streams now offers stream URLs, which give end users temporary, unauthenticated access to a playable stream session in a supported web browser. Recipients need no AWS account, no credentials, and no software install.</p> \n<p>To share a playable stream, create a stream URL for a stream group and one of its applications, set how long the stream URL stays valid and how many sessions it can start, and send the link. Each person who opens the link starts an independent stream session, and Amazon GameLift Streams routes them to a nearby streaming location from the locations you selected. No client integration or backend service is required. You can create, monitor, and revoke stream URLs in the Amazon GameLift Streams console or with the new CreateStreamUrl, GetStreamUrl, ListStreamUrls, and RevokeStreamUrl APIs.</p> \n<p>There is no additional charge for stream URLs. You are charged for the stream capacity that sessions started from a stream URL consume, as described on the <a href=\"https://aws.amazon.com/gamelift/streams/pricing/\">Amazon GameLift Streams pricing page</a>. For a full list of supported Regions, see the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/regions-quotas-rande.html\">AWS Region table</a>.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/stream-urls.html\">Share stream sessions with stream URLs</a> in the Amazon GameLift Streams Developer Guide and the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_CreateStreamUrl.html\">CreateStreamUrl API Reference</a>. To learn more about the service, see the <a href=\"https://aws.amazon.com/gamelift/streams/\">Amazon GameLift Streams product page</a>.&nbsp;</p>"
  "432e3b8d113727af1e0c0dddc633797d":
    "id": "432e3b8d113727af1e0c0dddc633797d"
    "title": "AWS HealthOmics now supports task-level timeout for WDL workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-healthomics-wdl-task-level-timeout/"
    "published": "2026-08-04 05:00:00"
    "fetched": "2026-08-04 07:04:53"
    "summary": "<p>AWS HealthOmics now supports task-level timeout for Workflow Description Language (WDL) workflows, enabling you to set maximum execution duration for individual tasks. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.&nbsp;</p> \n<p>With task-level timeout, you can define time bounds on individual WDL tasks to control costs and enable automated error recovery. HealthOmics provides the omicsTimeout runtime attribute that you can add to any task's runtime section to specify the maximum duration a task is allowed to run. When a task exceeds the specified duration, HealthOmics stops the task and sets the task and run statuses to failed. The omicsTimeout attribute accepts duration values with standard time units (such as 90s, 2h, 1d). This prevents tasks from consuming resources and helps you set cost guardrails during workflow development.&nbsp;</p> \n<p>Task-level timeout for WDL workflows is available in all supported AWS HealthOmics Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Seoul, Singapore, Tokyo). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/workflow-languages-wdl.html\">WDL workflow definition specifics</a> documentation.&nbsp;</p>"
  "13e84c26969c12380d7bbe0208636423":
    "id": "13e84c26969c12380d7bbe0208636423"
    "title": "AWS Resilience Hub now provides recommended resilience tests"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-resilience-hub/"
    "published": "2026-08-04 04:02:58"
    "fetched": "2026-08-04 07:04:53"
    "summary": "<p>AWS Resilience Hub now offers recommended resilience tests that help platform engineering and site reliability teams validate how their services respond to and recover from known failure scenarios.&nbsp;</p> \n<p>Resilience Hub provides pre-configured tests based on your service's architecture, configuration, and resilience policy. It uses AWS Fault Injection Service (FIS) to inject controlled faults and then evaluates whether your service recovers within your defined recovery objectives. With the AWS-recommended resilience tests, teams can validate readiness for scenarios such as Availability Zone impairment, Regional impairment, and dependency failure. Each test automatically targets resources in the service, injects the required faults, produces a pass or fail outcome based on alarm evaluation and recovery objectives, then generates a detailed test report.</p> \n<p>The recommended testing on the next generation of the AWS Resilience Hub is available in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), Canada (Central), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Paris), Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Asia Pacific (Seoul), and South America (São Paulo).</p> \n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/resiliencehub/v2/home\">AWS console</a>. To learn more about recommended resilience testing see the product page for the next generation of <a href=\"https://aws.amazon.com/resilience-hub/\">AWS Resilience Hub</a>.&nbsp;</p>"
  "52742d5a42ea4feb7f0b2e73fb445d7f":
    "id": "52742d5a42ea4feb7f0b2e73fb445d7f"
    "title": "Amazon EC2 I7i instances now available in Asia Pacific (Thailand) and Israel (Tel Aviv) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-i7i-instances-in-additional-regions/"
    "published": "2026-08-04 02:28:00"
    "fetched": "2026-08-04 07:04:53"
    "summary": "<p>Amazon Web Services (AWS) announces the availability of high performance Storage Optimized Amazon EC2 I7i instances in the Asia Pacific (Thailand) and Israel (Tel Aviv) Regions. Powered by 5th Gen Intel Xeon Processors with an all-core turbo frequency of 3.2 GHz, these new instances deliver up to 23% better compute performance and more than 10% better price performance over previous generation I4i instances. Powered by 3rd generation AWS Nitro SSDs, I7i instances offer up to 45TB of NVMe storage with up to 50% better real-time storage performance, up to 50% lower storage I/O latency, and up to 60% lower storage I/O latency variability compared to I4i instances.<br /> <br /> I7i instances offer compute and storage performance for x86-based storage optimized instances in Amazon EC2 ideal for I/O intensive and latency-sensitive workloads that demand very high random IOPS performance with real-time latency to access the small to medium size datasets. Additionally, torn write prevention feature support up to 16KB block sizes, enabling customers to eliminate database performance bottlenecks.<br /> <br /> I7i instances are available in eleven sizes - nine virtual sizes up to 48xlarge and two bare metal sizes - delivering up to 100Gbps of network bandwidth and 60Gbps of Amazon Elastic Block Store (EBS) bandwidth. To learn more, visit the I7i instances <a href=\"https://aws.amazon.com/ec2/instance-types/i7i/\">page</a>.</p>"
  "cc60b6065cc974f44b9b836d28ec9608":
    "id": "cc60b6065cc974f44b9b836d28ec9608"
    "title": "Amazon SageMaker AI serverless model customization now supports full fine-tuning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-sagemaker-fft"
    "published": "2026-08-04 02:00:00"
    "fetched": "2026-08-04 07:04:53"
    "summary": "<p>Amazon SageMaker AI serverless model customization now supports full fine-tuning for over 25 open-source models. These include popular models from gpt-oss, Gemma, Llama, Nemotron, and Qwen model families. In addition to parameter-efficient methods such as LoRA, which update a small subset of model weights, you can now update all parameters in the model for deeper adaptation when your use case requires it.<br /> <br /> Full fine-tuning allows the model to more thoroughly learn your domain-specific patterns, terminology, and task structure. This is particularly valuable when you need the model to acquire capabilities beyond surface-level style adjustments, such as learning specialized reasoning patterns, adopting complex output formats, or internalizing domain knowledge from large proprietary datasets. With serverless model customization, SageMaker manages all infrastructure provisioning and training orchestration, so you can run full fine-tuning jobs without provisioning or managing any infrastructure and you pay only for what you use.<br /> <br /> Serverless full fine-tuning on SageMaker is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To get started, navigate to the JumpStart and Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a>. To learn more, and see the supported list of models, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/model-customize-open-weight.html\">model customization documentation.</a></p>"
  "22d9d486cefc7b7ddc9d4387658fe12f":
    "id": "22d9d486cefc7b7ddc9d4387658fe12f"
    "title": "AWS Transform continuous modernization is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/7/aws-transform-continuous-general-available"
    "published": "2026-08-04 06:15:00"
    "fetched": "2026-08-04 09:05:01"
    "summary": "<p><a href=\"https://aws.amazon.com/transform/continuous-modernization/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform continuous modernization</a> is now generally available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where AWS Transform is supported</a>. This capability helps engineering teams analyze and remediate technical debt across source code repositories at scale. Teams can connect GitHub organizations, GitLab groups, and Bitbucket workspaces, run analyses on demand or on a recurring schedule, and prioritize findings across technical debt, security, agentic readiness, modernization readiness, and custom analysis criteria.<br /> <br /> With today's launch, you can connect source code providers, initiate and schedule analyses, review findings, and create remediations directly from the AWS Transform web application. For findings with an associated remediation, continuous modernization creates branches and opens pull requests or merge requests containing validated code changes for review. Analysis and remediation run in your AWS account using your credentials, while your source code remains under your control.<br /> <br /> You can also use the AWS Transform Kiro Power, agent plugins, or AWS Transform CLI to work from your IDE or terminal, analyze local repositories, organize repositories using labels, and run analyses locally or remotely using Amazon EC2 or AWS Batch. To get started, open the <a href=\"https://console.aws.amazon.com/transform/home\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform web application</a> or use the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/ct-developer-tools.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform Kiro Power and agent plugins</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/continuous-modernization.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform continuous modernization</a> in the AWS Transform User Guide.</p>"
  "b0b0af8a18cb8f66f33626cf50626732":
    "id": "b0b0af8a18cb8f66f33626cf50626732"
    "title": "AWS Organizations now provides maximum account quota visibility in Service Quotas"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-organizations/"
    "published": "2026-08-04 03:54:00"
    "fetched": "2026-08-04 09:05:01"
    "summary": "<p>AWS Organizations customers can now view their maximum number of accounts quota and its utilization directly through AWS Service Quotas instead of relying on AWS Support or AWS account teams to determine their current account limit.<br /> <br /> Customers can now proactively plan account growth with ease by monitoring their current account quota utilization and requesting increases before reaching their limit. They can view this quota by logging into management account and accessing the Service Quotas console or calling the Service Quotas <a href=\"https://docs.aws.amazon.com/servicequotas/2019-06-24/apireference/API_GetServiceQuota.html\">GetServiceQuota API.</a><br /> <br /> This quota visibility is available now available in US East (N. Virginia). To learn more, see <a href=\"https://docs.aws.amazon.com/servicequotas/latest/userguide/gs-request-quota.html\">viewing service quotas</a> in the AWS Service Quotas documentation. For more information about AWS Organizations quotas and service limits, see the <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html\">AWS Organizations documentation</a>.</p>"
  "d18cfe31aaff34363145d548819c6b26":
    "id": "d18cfe31aaff34363145d548819c6b26"
    "title": "AWS Lambda Provisioned Mode for Amazon SQS event source mappings now supports up to 10,000 event pollers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-Lambda-provisioned-sqs-esm-max-pollers/"
    "published": "2026-08-04 03:00:00"
    "fetched": "2026-08-04 09:05:01"
    "summary": "<div class=\"OutlineElement Ltr SCXW239223550 BCX2\" style=\"direction: ltr;\">\n <p>AWS Lambda now supports a maximum of 10,000 event pollers for Provisioned Mode for Amazon SQS event source mappings (ESMs), a 5x increase from the previous limit of 2,000. This enables you to reach up to 100,000 concurrent invocations, so you can build highly responsive and scalable event-driven applications with stringent performance requirements.</p> \n <p>Customers use Amazon SQS as an event source for Lambda to build mission-critical applications such as real-time order processing, financial transaction pipelines, IoT telemetry ingestion, and large-scale fan-out workloads, where delays in event processing can directly impact business outcomes. Provisioned Mode for SQS ESM allows you to configure a minimum and maximum number of event pollers and optimize the throughput for your application.&nbsp;However, the maximum number of pollers was previously limited to 2,000, which constrained the number of concurrent invocations that could be reached per ESM, and required customers to split their workload across multiple ESMs. With this launch, customers can reach up to 10,000 event pollers and 100,000 concurrent invocations per ESM, enabling them to build at-scale workloads with stringent latency and throughput requirements.</p> \n <p>This feature is generally available in all AWS Commercial Regions. You can activate Provisioned Mode for SQS ESM by configuring a minimum and maximum number of event pollers using the ESM API, AWS Console, AWS CLI, AWS SDK, AWS CloudFormation, and AWS SAM. You pay for the usage of event pollers based on a billing unit called Event Poller Unit (EPU). To learn more, read the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html#sqs-provisioned-mode\">Lambda ESM documentation</a> and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>.</p> \n</div>"
  "4d1e57537a51c16f7308285e1453fad1":
    "id": "4d1e57537a51c16f7308285e1453fad1"
    "title": "OpenAI GPT-5.6 Sol, Terra, and Luna now support 1 million token context windows on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/gpt-sol-terra-luna-long-context-bedrock"
    "published": "2026-08-04 06:03:00"
    "fetched": "2026-08-04 13:09:23"
    "summary": "<p>GPT-5.6 Sol, Terra, and Luna now support 1 million token context windows on Amazon Bedrock, enabling you to process full codebases, lengthy documents, and multi-turn agent histories in a single request. Models reason over broader context and return more accurate, coherent responses without chunking or information loss.</p> \n<p><br /> With a context window size of 1 million tokens, you can analyze entire repositories in a single pass for code review and migration, process long-form legal or regulatory documents end-to-end, and maintain full conversation history in multi-step agentic workflows. Prompt caching with explicit cache breakpoints applies to long context requests, so repeated context is billed at a 90% discount. Pricing matches OpenAI first-party rates and usage counts toward your AWS commitments.</p> \n<p><br /> GPT-5.6 Sol is available in the following <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions</a>: US East (N. Virginia) and US East (Ohio). GPT-5.6 Terra and Luna are available in US East (N. Virginia), US East (Ohio), and US West (Oregon). Get started with Sol, Terra, and Luna using the <a href=\"https://us-east-1.console.aws.amazon.com/bedrock-mantle/home?region=us-east-1#\">Amazon Bedrock Console</a> or the Responses API on the bedrock-mantle endpoint. To learn more, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock documentation</a> and read the <a href=\"https://aws.amazon.com/blogs/machine-learning/openai-gpt-5-6-sol-terra-and-luna-are-now-generally-available-on-amazon-bedrock/\">launch blog post</a>.</p>"
  "006a442a70a70d9e6239acf180e6fb21":
    "id": "006a442a70a70d9e6239acf180e6fb21"
    "title": "Amazon RDS for SQL Server now support BYOM in additional commercial regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/rds-sql-server-supports-byom-in-additional-aws-regions/"
    "published": "2026-08-04 16:00:00"
    "fetched": "2026-08-05 04:25:48"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> now supports Bring Your Own Media (BYOM) in 10 additional AWS Regions: Asia Pacific (Taipei, Hyderabad, Jakarta, Malaysia, Melbourne, New Zealand, Thailand), Europe (Milan, Spain), and Mexico (Central).<br /> <br /> With BYOM, you can adopt Amazon RDS as a managed database service and reuse your existing Microsoft SQL Server licenses with active&nbsp;Software Assurance, through Microsoft's License Mobility program. BYOM is supported on SQL Server 2019, 2022, and 2025. Amazon RDS for SQL Server BYOM is integrated with AWS License Manager so you can track license usage across your AWS environment for compliance.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/sqlserver-byom.html\" target=\"_blank\">Bring Your Own Media (BYOM) for RDS for SQL Server.</a> For pricing and regional availability, see <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\" target=\"_blank\">Amazon RDS for SQL Server Pricing</a>.</p>"
  "c6e018d05a50df49b20d812c0afc6cbf":
    "id": "c6e018d05a50df49b20d812c0afc6cbf"
    "title": "Amazon RDS for SQL Server supports Developer Edition in additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/rds-sql-server-supports-developer-edition-in-additional-aws-regions/"
    "published": "2026-08-04 16:00:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> Developer Edition is now available in 13 additional AWS Regions: Asia Pacific (Hong Kong, Taipei, Hyderabad, Jakarta, Malaysia, Melbourne, New Zealand, Thailand), Canada West (Calgary), Europe (Milan, Spain), Israel (Tel Aviv), and Mexico (Central).<br /> <br /> SQL Server Developer Edition includes all the functionality of Enterprise Edition and is free of license charges for use as a development and test system. With this expansion, you can build and test applications in more regions closer to your data and end users, reducing latency and simplifying your development workflows.<br /> <br /> For more information about these features and region availability, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/sqlserver-dev-edition.html\" rel=\"noopener noreferrer\" target=\"_blank\">Working with SQL Server Developer Edition on RDS for SQL Server</a>. For pricing details, see <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server Pricing</a>.&nbsp;</p>"
  "84998169ed3cb9cd0d91b0dc1913d6e6":
    "id": "84998169ed3cb9cd0d91b0dc1913d6e6"
    "title": "RDS SQL Server now supports publishing SQL Server Audit logs to CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/rds-sqlserver-publish-sql-audit-to-cw/"
    "published": "2026-08-04 16:00:00"
    "fetched": "2026-08-05 07:58:51"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> now supports publishing SQL Server Audit logs to CloudWatch.&nbsp;SQL Server Audit is a native SQL Server feature that allows tracking and logging events that occur on the Database Engine. On Amazon RDS, you can create audits and audit specifications in the same way that you create them for on-premises SQL Server database servers.</p> \n<p>Now you can publish the audit logs to S3, CloudWatch, or both. If you enable both S3 and CloudWatch options, the audit log publication will be marked as \"completed\" only after the audit log files are uploaded to both S3 and CloudWatch. Once the audit logs are in CloudWatch, you can perform real-time analysis of the log data. If you enable retention, RDS keeps your audit logs on your DB instance for the configured period of time.</p> \n<p>For more information, see <a href=\"https://docs.microsoft.com/sql/relational-databases/security/auditing/sql-server-audit-database-engine\" target=\"_blank\">SQL Server Audit (database engine)</a> in the SQL Server documentation. For detailed configuration instructions, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Appendix.SQLServer.Options.Audit.html\" target=\"_blank\">Amazon RDS for SQL Server User Guide</a>. This feature is available in all AWS Commercial and AWS GovCloud (US) Regions where Amazon RDS for SQL Server is available.</p>"
"last_updated": "2026-08-05 07:58:51 JST"
