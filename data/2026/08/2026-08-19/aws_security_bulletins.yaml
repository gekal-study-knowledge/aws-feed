    "title": "CVE-2026-75897 - Uncontrolled resource consumption in OpenSearch Dashboards capabilities route"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-082-aws/"
    "published": "2026-08-19 03:26:06"
    "fetched": "2026-08-19 03:31:38"
    "summary": "<p><b>Bulletin ID:</b> 2026-082-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/18/2026 10:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>OpenSearch Dashboards is the open-source visualization and management UI for OpenSearch, and ships as part of Amazon OpenSearch Service. We identified CVE-2026-75897, an improper input validation in the capabilities route handler in OpenSearch Dashboards. The handler does not bound the size of the request payload, which might allow remote attackers to cause a denial of service via a crafted HTTP request.</p> \n<p><b>Affected Products and Versions:</b></p> \n<p><b>OpenSearch \"Plugin Type\" Plugin (open-source, self-managed):</b><br /> - <b>Affected:</b> All versions from 1.3.0 through 3.7.0 inclusive, including all 2.x releases up to and including 2.19.6. The issue is inherited from upstream Kibana and is also present in Kibana 7.7.1 through 7.10.2.<br /> - <b>Fixed:</b> 3.8.0</p> \n<p><b>Amazon OpenSearch Service (AWS Managed):</b><br /> - <b>Affected:</b> Engine versions OpenSearch 1.3, 2.11, 2.13, 2.15, 2.17, 2.19, 3.1, 3.3, and 3.5, and Elasticsearch-compatibility versions using Kibana 7.9 and 7.10.<br /> - <b>Fixed:</b> A patched service software release is available for all affected versions. Apply the latest available service software update to your domain.</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
