    "title": "How Jumio built a real-time feature store on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-jumio-built-a-real-time-feature-store-on-aws/"
    "published": "2026-08-19 02:05:48"
    "fetched": "2026-08-19 02:22:07"
    "summary": "Learn how Jumio built a centralized, real-time feature store on AWS with Amazon SageMaker Feature Store, Amazon Managed Service for Apache Flink, and Amazon Kinesis Data Streams. The architecture delivers sub-100ms feature serving for fraud detection and saves approximately $120,000 annually."
  "6fcfdc1cce2db3ef6b2aa207f16dd552":
    "id": "6fcfdc1cce2db3ef6b2aa207f16dd552"
    "title": "Improve contract search accuracy with auto-generated filters in Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/improve-contract-search-accuracy-with-auto-generated-filters-in-amazon-bedrock/"
    "published": "2026-08-19 02:02:52"
    "fetched": "2026-08-19 02:22:07"
    "summary": "In this post, we describe how AIDA works at a high level and how it helps address these challenges — grounding users in the right contracts, under the right legal context, and within the right access boundaries. Specifically, we explore how AIDA uses implicit and explicit filtering, along with metadata-enriched chunking in Amazon Bedrock Knowledge Bases, to dramatically improve contract search accuracy."
