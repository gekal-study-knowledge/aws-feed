    "title": "Implement vector-prompt document classification using Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/implement-vector-prompt-document-classification-using-amazon-bedrock/"
    "published": "2026-08-19 02:10:37"
    "fetched": "2026-08-19 02:22:07"
    "summary": "Learn how to build a multi-agent document classification solution on Amazon Bedrock using the Strands Agents SDK. Three specialized agents combine textual analysis with Claude Haiku 4.5 and visual similarity search with Amazon Titan Multimodal Embeddings to accurately classify insurance documents such as policies and affidavits."
  "05dc1249cc4bb744bc6f39f7347a7953":
