  "a22cecf25329a5fa8354f7edcb35090b":
    "id": "a22cecf25329a5fa8354f7edcb35090b"
    "title": "Amazon MWAA Serverless now supports PythonOperator and BashOperator"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/mwaa-serverless-pythonoperator-bashoperator/"
    "published": "2026-08-19 03:00:00"
    "fetched": "2026-08-19 04:23:39"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (Amazon MWAA) Serverless now supports running custom Python functions and shell scripts directly in the serverless runtime using PythonOperator and BashOperator. With this launch, data engineering teams can execute the code patterns they rely on daily, including data transformations, format conversions, and data quality checks, without provisioning additional infrastructure.</p> \n<p>Package your Python modules or shell scripts as code packages, upload them to Amazon S3, and reference them when creating or updating a workflow. The service snapshots your code at workflow creation time and uses that snapshot for all subsequent runs, ensuring consistency across executions.</p> \n<p>This feature is available in all AWS Regions where Amazon MWAA Serverless is available. To learn more, visit <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/operators-python-bash-detail.html\">Using Python and Bash operators</a>.</p>"
  "36fcc7d1c9afd027295abf447e4e27e4":
    "id": "36fcc7d1c9afd027295abf447e4e27e4"
    "title": "IAM Policy Autopilot now supports Terraform plan files"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/iam-policy-autopilot-now-supports-terraform-plan-files"
    "published": "2026-08-19 02:19:00"
    "fetched": "2026-08-19 04:23:39"
    "summary": "<p>IAM Policy Autopilot can now generate baseline IAM policies directly from a Terraform plan file. IAM Policy Autopilot is an open source tool, launched at re:Invent 2025, that analyzes your code to deterministically create scoped-down IAM policies you can refine as your application evolves, reducing the time you spend writing IAM policies and troubleshooting access issues. Until now the tool analyzed application source code, but it was not possible to generate policies for deploying AWS infrastructure defined via Infrastructure as Code.</p> \n<p>Now you can pass a Terraform plan file as input, and IAM Policy Autopilot applies a deterministic analysis to produce a policy scoped to the CRUD functions of the resources in that plan. The generated policies reference specific resource ARNs rather than wildcards, when possible. Supporting policy generation for deploying AWS infrastructure defined via Terraform has been the most requested capability since IAM Policy Autopilot launched, and it complements the existing Terraform-aware analysis, which cross-references Terraform resource definitions with SDK calls in your application code to resolve ARNs.</p> \n<p>IAM Policy Autopilot is available at no additional cost and runs on your own machine. To get started, visit the <a href=\"https://github.com/awslabs/iam-policy-autopilot\">IAM Policy Autopilot GitHub repository</a>.</p>"
  "7f6c9b73cc48868e918b6c9bf88fc7ba":
    "id": "7f6c9b73cc48868e918b6c9bf88fc7ba"
    "title": "AgentCore payments is now generally available in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/bedrock-agentcore-payments-ga/"
    "published": "2026-08-19 04:15:00"
    "fetched": "2026-08-19 05:17:57"
    "summary": "<p>Today, AWS announces the general availability of AgentCore payments, a capability within Amazon Bedrock AgentCore that enables AI agents to autonomously discover, access, and pay for paid APIs, MCPs, and content with just a few lines of code. AgentCore payments provides the security, guardrails, and observability enterprises need to deploy transacting agents in production at scale.</p> \n<p>AgentCore payments integrates with Coinbase and Stripe Privy wallets for microtransactions, provides payment orchestration across protocols, enforces configurable payment limits at the infrastructure layer, and delivers end-to-end observability through AgentCore Observability. At general availability, AgentCore payments includes Quick Create for Coinbase credential provisioning directly within the AgentCore console, a curated Coinbase Bazar MCP server of pay-per-use x402 endpoints via AgentCore gateway, support for the Machine Payment Protocol (MPP), and the \"upto\" scheme in the x402 protocol for pay-per-inference and dynamic pricing use cases.</p> \n<p>Developers can get started using coding assistant skills such as Claude Code, Kiro, and Codex, AgentCore CLI, or AWS Management Console - follow this <a href=\"https://github.com/awslabs/agentcore-samples/tree/main/01-features/08-agents-that-transact\">link</a>. </p> \n<p>AgentCore payments is available in the regions listed <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">here</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/payments.html\">AgentCore payments documentation</a> or the <a href=\"https://aws-blogs-prod.amazon.com/machine-learning/amazon-bedrock-agentcore-payments-is-now-generally-available-enabling-agents-to-transact-safely-and-autonomously-at-scale/\">AWS News Blog</a>.</p> \n<p>To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>.</p>"
  "5d0036bb7684ab80fff148c309573b2d":
    "id": "5d0036bb7684ab80fff148c309573b2d"
    "title": "Amazon SageMaker Unified Studio now supports data profiling and anomaly detection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/05/smus-data-profiling"
    "published": "2026-08-19 03:49:00"
    "fetched": "2026-08-19 06:19:10"
    "summary": "<p>Amazon SageMaker Unified Studio now supports data profiling and anomaly detection, powered by AWS Glue Data Quality. Data stewards, engineers and analysts can generate statistical profiles of their data to understand its shape and completeness, and track how these statistics change over time. Anomaly detection helps identify when data points drift from historical patterns without requiring predefined thresholds or custom rules. These capabilities are available for both data at rest in catalog tables and data in transit within Visual ETL jobs.</p> \n<p>With this launch, a dedicated Data profile tab on catalog tables provides on-demand and scheduled profiling that computes dataset-level and column-level statistics. As profile history accumulates, anomaly detection builds a baseline of expected behavior and flags data points that fall outside the predicted range. This is particularly useful when you may not be aware of specific thresholds, or when expected values change over time and fixed rules could become stale. For data in transit, the same profiling statistics and anomaly detection are available on the results page of any Visual ETL job with an Evaluate Data Quality transform.</p> \n<p>This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-profiling-catalog.html\">Amazon SageMaker Unified Studio documentation.</a></p>"
  "4068e9c9fab3bdf68f5d9f239657b283":
    "id": "4068e9c9fab3bdf68f5d9f239657b283"
    "title": "PostgreSQL 19 Beta 3 is now available in Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/postgresql-19-beta-3-amazon-rds-database-preview-environment/"
    "published": "2026-08-19 01:00:00"
    "fetched": "2026-08-19 06:19:10"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/postgresql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for PostgreSQL</a> 19 Beta 3 is available in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of PostgreSQL 19 on Amazon RDS for PostgreSQL.</p> \n<p>PostgreSQL 19 Beta 3 adds new capabilities for query performance and autovacuum management. The new pg_stat_autovacuum_scores view helps you monitor and tune autovacuum prioritization. Parallel autovacuum can now use multiple workers to speed up maintenance on large tables. The new pg_plan_advice module lets you lock in efficient query plans to avoid unexpected slowdowns. Eager aggregation improves analytical queries by grouping data earlier, so queries process fewer rows and complete faster. Beta 3 also includes bug fixes and stability improvements from the Beta 2 testing period. Refer to the <a href=\"https://www.postgresql.org/about/news/postgresql-186-1711-1615-1519-1424-and-19-beta-3-released-3365/\" rel=\"noopener noreferrer\" target=\"_blank\">PostgreSQL community announcement</a> for more details.</p> \n<p>Amazon RDS Database Preview Environment database instances are retained for a maximum period of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots that are created in the Preview Environment can only be used to create or restore database instances within the Preview Environment. You can use the PostgreSQL dump and load functionality to import or export your databases from the Preview Environment. Amazon RDS Database Preview Environment database instances are priced as per the <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing</a> in the US East (Ohio) Region.</p>"
  "9fc96eeee931d096d3722b1b7a4aa53e":
    "id": "9fc96eeee931d096d3722b1b7a4aa53e"
    "title": "Amazon EC2 R8i instances are now available in Israel (Tel Aviv) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-r8i-israel-tel-aviv/"
    "published": "2026-08-19 02:24:00"
    "fetched": "2026-08-19 07:18:09"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i instances are available in the Israel (Tel Aviv) region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.&nbsp;&nbsp;<br /> <br /> R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.&nbsp;<a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" rel=\"noopener noreferrer\" target=\"_blank\">R8i instances are SAP-certified&nbsp;</a>and deliver 142,100 aSAPS, the highest among all comparable machines in on-premises and cloud environments, delivering exceptional performance for mission-critical SAP workloads.&nbsp;&nbsp;<br /> <br /> To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" rel=\"noopener noreferrer\" target=\"_blank\">R8i </a>instances visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" rel=\"noopener noreferrer\" target=\"_blank\">blog</a>.</p> \n<p>&nbsp;</p>"
