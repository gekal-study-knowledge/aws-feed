  "6740fe35f72b157a51cd2f823fdd25f8":
    "id": "6740fe35f72b157a51cd2f823fdd25f8"
    "title": "AWS Certificate Manager の ACME サポートで証明書の発行と更新を自動化"
    "link": "https://aws.amazon.com/jp/blogs/news/automate-certificates-with-acme-support-in-aws-certificate-manager/"
    "published": "2026-08-19 14:34:37"
    "fetched": "2026-08-19 15:36:08"
    "summary": "AWS Certificate Manager (ACM) の ACME プロトコルサポートについて紹介します。CA/Browser Forum の方針により証明書の有効期間が段階的に短縮される中、certbot や cert-manager などの使い慣れた ACME クライアントで、オンプレミスやハイブリッド環境を含むインフラストラクチャのパブリック証明書の発行・更新を自動化できます。ACME エンドポイントの作成手順、ドメインの事前承認、EAB 認証情報の管理、エンタープライズ向けの統制とベストプラクティスを解説します。"
