    "published": "2026-08-19 11:46:26"
    "fetched": "2026-08-19 12:41:41"
    "summary": "株式会社セガが開発・運用する『ソニックランブル パーティ』のバックエンドに Amazon DynamoDB と Amazon ElastiCache Serverless for Valkey を採用した経緯・技術的な工夫・得られた効果を、開発チームの声を交えて紹介します。"
  "5568e92d715459a4cc4d330fec242186":
    "id": "5568e92d715459a4cc4d330fec242186"
    "title": "株式会社セガ、グローバル展開タイトル『ソニックランブル パーティ』を少人数チームで支える Amazon EKS Auto Mode × Agones 活用事例"
    "link": "https://aws.amazon.com/jp/blogs/news/sonic-rumble-party-eks-automode-agones/"
    "published": "2026-08-19 11:45:10"
    "fetched": "2026-08-19 12:41:41"
    "summary": "本記事では、株式会社セガが開発・運用する『ソニックランブル パーティ』の専用ゲームサーバー基盤で、ゲームサーバーのオーケストレーションに Agones を用い、その基盤に Amazon EKS (Elastic Kubernetes Service) Auto Mode を採用した経緯と効果を、お客様の声を交えて紹介します。 EKS Auto Mode の採用により、開発環境では「ゼロインスタンス運用」によるコスト削減を実現、本番環境ではグローバルローンチ以降、インフラ起因の停止はなく安定稼働を続けています。加えてその運用負荷削減効果により、運用が軌道に乗ってからは API サーバーやデータベースも含めた全環境を 1 名のエンジニアで運用できています。"
