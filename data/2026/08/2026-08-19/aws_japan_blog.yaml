    "title": "鮮度の高いインサイトで迅速な意思決定を – talabat が AWS と Google Cloud で実現したニアリアルタイム分析"
    "link": "https://aws.amazon.com/jp/blogs/news/fresher-insights-faster-decisions-talabats-near-real-time-analytics-across-aws-and-google-cloud/"
    "published": "2026-08-19 12:01:09"
    "fetched": "2026-08-19 12:41:41"
    "summary": "talabat が AWS と Google Cloud にまたがるハイブリッドなマルチクラウドレイクハウスを構築した方法を紹介します。Apache Iceberg のデータを Amazon S3 Tables に一元的に保持しながら、Lakehouse フェデレーテッド Iceberg REST カタログを通じて BigQuery からニアリアルタイムで読み取り可能にし、データ移動コストを約 40% 削減しました。"
