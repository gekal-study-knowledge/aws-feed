    "title": "Security Hub Extended が 10 番目のカテゴリとしてサプライチェーンセキュリティを追加"
    "link": "https://aws.amazon.com/jp/blogs/news/security-hub-extended-adds-supply-chain-security-as-its-tenth-category/"
    "published": "2026-08-19 14:31:52"
    "fetched": "2026-08-19 15:36:08"
    "summary": "AWS Security Hub Extended に 10 番目のカテゴリとしてサプライチェーンセキュリティが加わりました。厳選されたパートナーである Chainguard と Socket により、オープンソースの依存関係の来歴検証と悪意あるパッケージのブロックを実現します。検出結果は OCSF 形式で Security Hub に集約され、従量制料金とプライベートオファーで柔軟に導入できます。23 パートナー、10 カテゴリへの拡大と今後の展望を紹介します。"
