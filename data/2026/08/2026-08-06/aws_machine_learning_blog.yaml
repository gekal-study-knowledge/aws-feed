    "title": "Run production AI agents in n8n with Amazon Bedrock AgentCore harness"
    "link": "https://aws.amazon.com/blogs/machine-learning/run-production-ai-agents-in-n8n-with-amazon-bedrock-agentcore-harness/"
    "published": "2026-08-06 03:00:57"
    "fetched": "2026-08-06 03:17:35"
    "summary": "Amazon Bedrock AgentCore harness is now generally available. Learn how to add it as an agent step in n8n workflows using a new open-source community node, and build agents with persistent memory, real tools, code execution, and VPC isolation — all from the n8n editor with no infrastructure or agent code."
