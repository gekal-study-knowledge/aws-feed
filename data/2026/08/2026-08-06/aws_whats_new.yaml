  "ce29b357f434414419ab1cba4db2c772":
    "id": "ce29b357f434414419ab1cba4db2c772"
    "title": "AWS Marketplace adds AI Insights so buyers can understand pricing before they buy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-marketplace-ai-insights/"
    "published": "2026-08-06 02:00:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p>You can now understand how a product's pricing works before you buy it. Available in the pricing section of the listing in AWS Marketplace, AI Insights explains each product's pricing in plain language: what a pricing unit maps to, how your bill changes as usage scales, how multiple pricing dimensions combine into one cost, and what is and isn't included. Answering these questions used to mean having to visit multiple websites and piecing together pricing details on your own. Now the context sits on the listing, so you can evaluate pricing and move to purchase without switching tabs.</p> \n<p>AI Insights cites sources so you can see where the explanations come from. AI Insights draws from the pricing the seller publishes on the Marketplace listing, and additional pricing context on the seller's public website.</p> \n<p>AI Insights is live today on most listings where external pricing context is available. It is available in all commercial AWS Regions where AWS Marketplace is available. To see it, open any product listing on the <a href=\"https://aws.amazon.com/marketplace/\">AWS Marketplace</a> website and scroll to the pricing section. Sellers can review what appears on their listing and request edits at any time through the Contact Us form linked in the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/ai-insights.html\">AI Insights</a> page on the AWS Marketplace Seller Guide.</p>"
  "c0423853af4f18fa4749e7428e9d49dc":
    "id": "c0423853af4f18fa4749e7428e9d49dc"
    "title": "Amazon DynamoDB now supports real-time vector search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-dynamodb-vector-search"
    "published": "2026-08-06 01:59:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p>Today, AWS announces the general availability of vector search for Amazon DynamoDB, a new feature to index and search vectors in real time. As vector datasets grow into the billions or trillions, vector search at scale traditionally trades off search speed, scale, and accuracy: latency climbs with vector count unless you accept lower recall or throughput. DynamoDB now supports native vector search with single-digit millisecond latency at 99%+ recall and is designed for any scale, even trillions of vectors.<br /> <br /> With DynamoDB vector search, you store vector embeddings alongside your other attributes and generate them using a model of your choice, including models available on Amazon Bedrock. You create a vector index and run approximate nearest neighbor searches, pick the vector index partition key to scale, and filter on attributes to scope results. You get the same serverless benefits you rely on today: zero infrastructure management, zero downtime, zero maintenance windows, and pay for only what you use. You can already use DynamoDB to store memory for AI agents, and with vector search you can now add semantic retrieval over that memory for agentic grounding, along with product similarity search, personalized advertising, retrieval augmented generation, and recommendation systems, with predictable performance.<br /> <br /> To learn more, visit the <a></a><a href=\"https://aws.amazon.com/blogs/aws/amazon-dynamodb-now-supports-real-time-vector-search-at-any-scale\">AWS News Blog</a>, <a href=\"https://aws.amazon.com/dynamodb\"></a><a>Amazon DynamoDB product page</a>, and <a></a><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/VectorSearch.html\">Amazon DynamoDB Developer Guide</a>.</p>"
  "637e2f70e361991c34228080fb9d8f20":
    "id": "637e2f70e361991c34228080fb9d8f20"
    "title": "Amazon Aurora serverless now scales faster to support agentic AI and other bursty workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aurora-serverless-instant-12-acu-scaling"
    "published": "2026-08-06 00:00:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a> now delivers higher initial capacity during scale-up events, reaching up to 12 ACUs within a second and continuing to scale up to 256 ACUs as your workload grows. When the workload finishes, Aurora serverless automatically scales down to zero. This makes it especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable traffic patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents, so you only pay for what you use.<br /> <br /> This enhancement is enabled by default on all Aurora serverless clusters running on platform version 3 or 4, with no configuration changes required. Existing clusters on platform versions 1 and 2 can upgrade directly to the latest platform version 4 to benefit from these improvements. You can verify your cluster's platform version in the AWS Management Console under the instance configuration section, or via the RDS API's ServerlessV2PlatformVersion parameter.<br /> <br /> For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more, read the Aurora serverless scaling <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\">documentation</a>, and get started by creating an Aurora serverless database in just a few steps in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
  "5914b17ee5ddef942b1e89c634330f5f":
    "id": "5914b17ee5ddef942b1e89c634330f5f"
    "title": "AWS IAM Identity Center makes managment of AWS account access optional for new organization instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-identity-center-accounts-optional/"
    "published": "2026-08-06 00:12:00"
    "fetched": "2026-08-06 05:22:51"
    "summary": "<p>AWS IAM Identity Center now lets you decide whether to enable management of AWS account access when you create a new organization instance. This allows you to use IAM Identity Center to manage access to AWS applications only, without the need to manage access to AWS accounts. This feature is available at the time of initial configuration of an IAM Identity Center instance and does not affect existing IAM Identity Center instances.</p> \n<p>IAM Identity Center enables you to connect your workforce identities to AWS once and offer AWS application owners across your organization streamlined access management. Application end users benefit from single sign-on, user awareness, and consistent authentication experience across AWS applications. Previously, this meant you also needed to manage access to AWS accounts. With this release, account management is now optional. When you choose not to enable management of AWS accounts, IAM Identity Center does not provision its service-linked role into your member accounts, which reduces the access surface in your environment. You can enable account management permissions later through instance settings or the UpdateInstance API.&nbsp;</p> \n<p>This capability is available in all AWS Regions where IAM Identity Center is available. To get started, see Configure instance settings in the IAM Identity Center User Guide.</p>"
"last_updated": "2026-08-06 05:22:51 JST"
