"entries":
  "ce29b357f434414419ab1cba4db2c772":
    "id": "ce29b357f434414419ab1cba4db2c772"
    "title": "AWS Marketplace adds AI Insights so buyers can understand pricing before they buy"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-marketplace-ai-insights/"
    "published": "2026-08-06 02:00:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p>You can now understand how a product's pricing works before you buy it. Available in the pricing section of the listing in AWS Marketplace, AI Insights explains each product's pricing in plain language: what a pricing unit maps to, how your bill changes as usage scales, how multiple pricing dimensions combine into one cost, and what is and isn't included. Answering these questions used to mean having to visit multiple websites and piecing together pricing details on your own. Now the context sits on the listing, so you can evaluate pricing and move to purchase without switching tabs.</p> \n<p>AI Insights cites sources so you can see where the explanations come from. AI Insights draws from the pricing the seller publishes on the Marketplace listing, and additional pricing context on the seller's public website.</p> \n<p>AI Insights is live today on most listings where external pricing context is available. It is available in all commercial AWS Regions where AWS Marketplace is available. To see it, open any product listing on the <a href=\"https://aws.amazon.com/marketplace/\">AWS Marketplace</a> website and scroll to the pricing section. Sellers can review what appears on their listing and request edits at any time through the Contact Us form linked in the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/ai-insights.html\">AI Insights</a> page on the AWS Marketplace Seller Guide.</p>"
  "c0423853af4f18fa4749e7428e9d49dc":
    "id": "c0423853af4f18fa4749e7428e9d49dc"
    "title": "Amazon DynamoDB now supports real-time vector search"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-dynamodb-vector-search"
    "published": "2026-08-06 01:59:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p>Today, AWS announces the general availability of vector search for Amazon DynamoDB, a new feature to index and search vectors in real time. As vector datasets grow into the billions or trillions, vector search at scale traditionally trades off search speed, scale, and accuracy: latency climbs with vector count unless you accept lower recall or throughput. DynamoDB now supports native vector search with single-digit millisecond latency at 99%+ recall and is designed for any scale, even trillions of vectors.<br /> <br /> With DynamoDB vector search, you store vector embeddings alongside your other attributes and generate them using a model of your choice, including models available on Amazon Bedrock. You create a vector index and run approximate nearest neighbor searches, pick the vector index partition key to scale, and filter on attributes to scope results. You get the same serverless benefits you rely on today: zero infrastructure management, zero downtime, zero maintenance windows, and pay for only what you use. You can already use DynamoDB to store memory for AI agents, and with vector search you can now add semantic retrieval over that memory for agentic grounding, along with product similarity search, personalized advertising, retrieval augmented generation, and recommendation systems, with predictable performance.<br /> <br /> To learn more, visit the <a></a><a href=\"https://aws.amazon.com/blogs/aws/amazon-dynamodb-now-supports-real-time-vector-search-at-any-scale\">AWS News Blog</a>, <a href=\"https://aws.amazon.com/dynamodb\"></a><a>Amazon DynamoDB product page</a>, and <a></a><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/VectorSearch.html\">Amazon DynamoDB Developer Guide</a>.</p>"
  "637e2f70e361991c34228080fb9d8f20":
    "id": "637e2f70e361991c34228080fb9d8f20"
    "title": "Amazon Aurora serverless now scales faster to support agentic AI and other bursty workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aurora-serverless-instant-12-acu-scaling"
    "published": "2026-08-06 00:00:00"
    "fetched": "2026-08-06 03:17:32"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a> now delivers higher initial capacity during scale-up events, reaching up to 12 ACUs within a second and continuing to scale up to 256 ACUs as your workload grows. When the workload finishes, Aurora serverless automatically scales down to zero. This makes it especially well-suited for agentic AI applications, which typically have bursts of activity, long idle windows, and unpredictable traffic patterns. Aurora serverless handles all of it automatically, scaling capacity with your agents, so you only pay for what you use.<br /> <br /> This enhancement is enabled by default on all Aurora serverless clusters running on platform version 3 or 4, with no configuration changes required. Existing clusters on platform versions 1 and 2 can upgrade directly to the latest platform version 4 to benefit from these improvements. You can verify your cluster's platform version in the AWS Management Console under the instance configuration section, or via the RDS API's ServerlessV2PlatformVersion parameter.<br /> <br /> For pricing details and Region availability, visit <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more, read the Aurora serverless scaling <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\">documentation</a>, and get started by creating an Aurora serverless database in just a few steps in the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
  "5914b17ee5ddef942b1e89c634330f5f":
    "id": "5914b17ee5ddef942b1e89c634330f5f"
    "title": "AWS IAM Identity Center makes managment of AWS account access optional for new organization instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-identity-center-accounts-optional/"
    "published": "2026-08-06 00:12:00"
    "fetched": "2026-08-06 05:22:51"
    "summary": "<p>AWS IAM Identity Center now lets you decide whether to enable management of AWS account access when you create a new organization instance. This allows you to use IAM Identity Center to manage access to AWS applications only, without the need to manage access to AWS accounts. This feature is available at the time of initial configuration of an IAM Identity Center instance and does not affect existing IAM Identity Center instances.</p> \n<p>IAM Identity Center enables you to connect your workforce identities to AWS once and offer AWS application owners across your organization streamlined access management. Application end users benefit from single sign-on, user awareness, and consistent authentication experience across AWS applications. Previously, this meant you also needed to manage access to AWS accounts. With this release, account management is now optional. When you choose not to enable management of AWS accounts, IAM Identity Center does not provision its service-linked role into your member accounts, which reduces the access surface in your environment. You can enable account management permissions later through instance settings or the UpdateInstance API.&nbsp;</p> \n<p>This capability is available in all AWS Regions where IAM Identity Center is available. To get started, see Configure instance settings in the IAM Identity Center User Guide.</p>"
  "a240955f61aa0c5dd128b09286931a43":
    "id": "a240955f61aa0c5dd128b09286931a43"
    "title": "AWS Lambda announces scalable network bandwidth up to 3,000 Mbps for functions outside a VPC"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-lambda-network-bandwidth/"
    "published": "2026-08-06 06:35:00"
    "fetched": "2026-08-06 07:08:26"
    "summary": "<p><a href=\"https://aws.amazon.com/lambda/\">AWS Lambda</a> now supports scalable network bandwidth for Lambda functions, enabling faster data transfer to and from your execution environment for latency-sensitive workloads. This feature enables functions outside a VPC configured with 2 GB of memory or more to access network bandwidth that scales proportionally, from 625 Mbps at 2 GB up to 3,000 Mbps at 10 GB.<br /> <br /> Customers use Lambda to build latency-sensitive data processing workloads, which need to transfer large volumes of data - up to several terabytes - from external data sources into the function’s execution environment for processing. As data volume and performance requirements grow, the existing limit of 625 Mbps can constrain data transfer speeds to and from an execution environment.&nbsp;With this launch, network throughput increases proportionally from 625 Mbps at 2 GB up to 3,000 Mbps at 10 GB, helping reduce function execution times and per-invocation costs while improving end-user experience.<br /> <br /> To get started, submit a request through <a href=\"https://console.aws.amazon.com/servicequotas/home/services/lambda/quotas\">AWS Service Quotas</a> under the Network bandwidth per execution environment quota to enable scalable network bandwidth on your account. Once enabled, bandwidth will scale automatically based on your function's memory configuration for all functions outside a VPC in your account.<br /> <br /> Scalable network bandwidth for functions outside a VPC is available at no additional charge in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regions_az/\">AWS Regions</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html\">Lambda quotas</a> page.&nbsp;</p>"
  "25a8535cbe3df4af92c40a115853ee04":
    "id": "25a8535cbe3df4af92c40a115853ee04"
    "title": "Amazon Keyspaces (for Apache Cassandra) is now available in the Canada West (Calgary) Region (ca-west-1)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2025/11/amazon-keyspaces-apache-cassandra-canada-west/"
    "published": "2026-08-06 05:06:00"
    "fetched": "2026-08-06 07:08:26"
    "summary": "<p><a href=\"https://aws.amazon.com/keyspaces/\">Amazon Keyspaces (for Apache Cassandra)</a> is now available in the Canada West (Calgary) Region (ca-west-1), allowing customers in the Canada West Region to build Cassandra-compatible applications with lower latency while keeping their data within the Region to meet data residency requirements. </p> \n<p>Amazon Keyspaces (for Apache Cassandra) is a scalable, highly available, and managed Apache Cassandra–compatible database service. Amazon Keyspaces is serverless, so you pay for only the resources that you use and you can build applications that serve thousands of requests per second with virtually unlimited throughput and storage.&nbsp;</p> \n<p>This regional expansion enables organizations in Canada to build highly scalable, low-latency applications using familiar Cassandra Query Language (CQL) without the operational burden of managing Cassandra clusters.</p> \n<p>To learn more about on Keyspaces, visit the <a href=\"https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html\">Amazon Keyspaces documentation</a>.</p>"
  "e5f10b6dc56debd7471e99beb11c9694":
    "id": "e5f10b6dc56debd7471e99beb11c9694"
    "title": "AWS Glue Data Quality makes ETL anomaly detection free and improves anomaly predictions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-glue-data-quality-anomaly-detection-free"
    "published": "2026-08-06 03:25:00"
    "fetched": "2026-08-06 11:30:13"
    "summary": "<p>AWS Glue Data Quality now offers improved anomaly detection with a new observation mode that reduces detection of false anomalies and removes pricing for anomaly detection in ETL jobs.&nbsp;Customers using notebook-based or exploratory workflows now benefit from smarter anomaly detection that gracefully handles irregular data arrival intervals. This new capability avoids over-extrapolating trends by using a constant baseline instead of a linear trend, delivering more accurate alerts and reducing noise so teams can focus on genuine anomalies.<br /> <br /> The new anomaly detection observation mode is particularly useful for exploratory data analysis, datasets with flat or random patterns, workloads without predictable trends and cases where you run data quality checks on varying schedules or in interactive environments like notebooks. Additionally, anomaly detection for AWS Glue ETL jobs is now available at no additional cost, so you can monitor data quality anomalies across all your Glue pipelines without worrying about pricing.<br /> <br /> These improvements are available in all AWS commercial regions and AWS GovCloud (US) regions.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/data-quality.html\">AWS Glue Data Quality documentation</a>. To learn more about pricing, see the <a href=\"https://aws.amazon.com/glue/pricing/\">AWS Glue pricing page</a>.</p>"
  "fa4048f5b277375c3153105fa1107c65":
    "id": "fa4048f5b277375c3153105fa1107c65"
    "title": "AWS IAM Identity Center makes management of AWS account access optional for new organization instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-identity-center-accounts-optional/"
    "published": "2026-08-06 00:12:00"
    "fetched": "2026-08-06 11:30:13"
    "summary": "<p>AWS IAM Identity Center now lets you decide whether to enable management of AWS account access when you create a new organization instance. This allows you to use IAM Identity Center to manage access to AWS applications only, without the need to manage access to AWS accounts. This feature is available at the time of initial configuration of an IAM Identity Center instance and does not affect existing IAM Identity Center instances.</p> \n<p>IAM Identity Center enables you to connect your workforce identities to AWS once and offer AWS application owners across your organization streamlined access management. Application end users benefit from single sign-on, user awareness, and consistent authentication experience across AWS applications. Previously, this meant you also needed to manage access to AWS accounts. With this release, account management is now optional. When you choose not to enable management of AWS accounts, IAM Identity Center does not provision its service-linked role into your member accounts, which reduces the access surface in your environment. You can enable account management permissions later through instance settings or the UpdateInstance API.&nbsp;</p> \n<p>This capability is available in all AWS Regions where IAM Identity Center is available. To get started, see Configure instance settings in the IAM Identity Center User Guide.</p>"
  "c438df7a2327cd894b8dae9492741e55":
    "id": "c438df7a2327cd894b8dae9492741e55"
    "title": "AWS Glue Data Catalog now supports  metadata exports to S3 Tables (Preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-glue-data-catalog-s3-tables/"
    "published": "2026-08-06 00:42:00"
    "fetched": "2026-08-06 22:56:48"
    "summary": "<p>AWS Glue Data Catalog is a centralized metadata repository that helps you discover and understand data, with semantic search and support for adding business context to datasets currently in preview. Today, we are adding two new capabilities to this preview: exporting catalog metadata exports to S3 Tables for metadata querying, and expanding the semantic search preview to catalogs encrypted with AWS Key Management Service (AWS KMS) customer managed keys.</p> \n<p>When you enable the Glue metadata export, your catalog's technical and business metadata, including glossary terms, custom metadata attachments, and asset descriptions, are written to tables in the managed aws-catalog S3 table bucket. Metadata is stored in Apache Iceberg format, enabling you to query, audit, and perform time travel queries for historical analysis using standard SQL in query engines that support Iceberg, such as AWS analytics services like Amazon Athena and Amazon QuickSight as well as third-party tools. This lets you join catalog metadata with other AWS service data for additional analysis, such as auditing glossary usage and metadata changes. Catalogs encrypted with customer managed keys now support the same business context enrichment and semantic search.</p> \n<p>You can use these capabilities in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), and Europe (Ireland). S3 Tables requests and storage are charged based on <a href=\"https://aws.amazon.com/s3/pricing/\"><u>S3 pricing</u></a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/catalog-export-s3-tables.html\">AWS Glue User Guide</a>.</p>"
  "e945f2ad0e971d240de17d56d7f1e11f":
    "id": "e945f2ad0e971d240de17d56d7f1e11f"
    "title": "AWS Marketplace now lets sellers configure net payment terms on private offers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-marketplace-net-payment-terms-for-private-offers"
    "published": "2026-08-06 23:49:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>AWS Marketplace now supports configurable net payment terms on private offers, with options including Net 30, Net 45, Net 60, or Net 90. Prior to this launch, net payment terms were uniform across all AWS Marketplace purchases, based on the buyer's payment terms with AWS. This new feature allows sellers to configure when payment is due, so invoice due dates match what buyers and sellers negotiate. This gives buyers upfront clarity on payment due dates, allows them to take advantage of more favorable payment terms, and gives sellers better cash flow predictability by setting net payment terms during private offer creation.<br /> <br /> Buyers see the configured payment terms on the procurement page before accepting a private offer. The net payment terms apply uniformly to all AWS Marketplace charges within a private offer, including upfront fees, scheduled payments, and usage-based charges. For Channel Partner Private Offers (CPPO), ISVs set maximum payment terms and channel partners can offer terms at or below that ceiling.<br /> <br /> This capability is generally available in all commercial AWS Regions for sellers creating private offers. No additional setup or onboarding is required. Flexible net payment terms apply to buyers who pay by invoice. The default behavior remains unchanged. If no custom payment terms are set, the buyer's standard AWS payment terms continue to apply.<br /> <br /> To learn more, see the <a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/seller-net-payment-terms.html\">AWS Marketplace Seller Guide</a> or the <a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/buyer-net-payment-terms.html\">AWS Marketplace Buyer Guide</a>.</p>"
  "4cfc12e942d0719f23e886809fa2aa70":
    "id": "4cfc12e942d0719f23e886809fa2aa70"
    "title": "Amazon MSK now delivers Kafka Authorizer Logs to customers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-msk-kafka-authorizer-logs/"
    "published": "2026-08-06 23:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/\">Amazon Managed Streaming for Apache Kafka (MSK)</a> now supports Authorizer Log Delivery for Provisioned clusters, including both Standard and Express brokers, at no additional cost. With authorizer logs, you get detailed visibility into user and application access, identify and address client authorization issues , and meet your organization's security requirements. Each denied authorization request is captured with the client's IP address and the API it attempted, so you can pinpoint the root cause. You can deliver logs to Amazon CloudWatch Logs, Amazon S3, or Amazon Data Firehose. Authorizer Log Delivery is available for both new and existing Provisioned clusters. You can enable it from the Amazon MSK console or AWS CLI. To learn how to set up Authorizer Log Delivery, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-logging.html\">Amazon MSK Authorizer Logs documentation</a>.</p> \n<p>Amazon MSK is a fully managed service for Apache Kafka that makes it easy to ingest and process streaming data in real time. Authorizer Log Delivery is supported in all AWS Regions where Amazon MSK Provisioned clusters are available, except for AWS&nbsp;European Sovereign Cloud (eusc-de-east-1) region. With Amazon MSK, you spend more time innovating on applications and less time managing clusters. To get started, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\">Amazon MSK Developer Guide</a>.</p>"
  "2eac7636e5a26385f6a33a2221f3d6ec":
    "id": "2eac7636e5a26385f6a33a2221f3d6ec"
    "title": "AWS Backup for Amazon S3 now supports direct access to backup data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-backup-amazon-s3-direct-access/"
    "published": "2026-08-06 19:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>AWS Backup for Amazon S3 now supports creating S3 Access Points, providing immediate read-only access to backup data using standard S3 APIs without initiating a restore. This enables targeted file recovery, data validation, compliance auditing, and forensic investigation while your backup data remains protected in your backup vault.</p> \n<p>You can create an access point for an S3 recovery point and read backup data using standard S3 operations such as GetObject, HeadObject, and ListObjectsV2. Access points work with both snapshot and continuous (point-in-time) recovery points stored in standard backup vaults or logically air-gapped vaults, including recovery points shared across accounts through AWS Resource Access Manager or Multi-party approval. While an access point is active, the associated recovery point is protected from deletion.</p> \n<p>Get started with this capability by creating access points for your S3 recovery points using the AWS Backup console, API, or CLI. This capability is available in <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\">select AWS Regions</a>.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-access-points.html\">Access points</a> and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/s3-backups.html\">Amazon S3 backups</a> in the AWS Backup Developer Guide and read the <a href=\"https://aws.amazon.com/blogs/storage/access-amazon-s3-backup-data-directly-using-s3-access-points-in-aws-backup/\">launch blog</a>. For pricing information, see <a href=\"https://aws.amazon.com/backup/pricing/\">AWS Backup pricing</a>.</p>"
  "f22103fccdb05b21dbe06c1a9f2fd197":
    "id": "f22103fccdb05b21dbe06c1a9f2fd197"
    "title": "AWS Backup extends logically air-gapped vault support for Amazon Neptune to three additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-backup-logically-air-gapped-vault-neptune-regions/"
    "published": "2026-08-06 16:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>AWS Backup logically air-gapped vault support for Amazon Neptune is now available in three additional AWS Regions: Asia Pacific (Melbourne), Europe (Spain), and Europe (Zurich).</p> \n<p>With this expansion, you can store Neptune backups in logically air-gapped vaults in these Regions. Logically air-gapped vaults are immutable, locked by default, and encrypted using AWS owned keys or customer-managed keys. You can copy backups across accounts and Regions, share vaults for recovery using AWS Resource Access Manager (RAM), and protect vault access during account compromise with Multi-party approval. This helps reduce recovery time and meet your disaster recovery and compliance requirements.</p> \n<p>To get started, visit the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. For a complete list of supported Regions and features, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\">AWS Backup documentation</a>. To learn more about logically air-gapped vaults, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html\">product page</a> and <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>.</p>"
  "26e83ac7153dd7613dbc50106f247d3c":
    "id": "26e83ac7153dd7613dbc50106f247d3c"
    "title": "Amazon Quick supports multi-dataset analytical capabiity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick/"
    "published": "2026-08-06 15:54:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Today, Amazon Quick announces supporting multi-dataset topics, enabling users to model relationships across multiple datasets in a single topic and use that model to build dashboards and answer questions in natural language. Previously, answering a question in a Quick Sight visual that spanned datasets required pre-joining the data into a single dataset—adding manual JOIN logic in the data preparation, consuming extra SPICE capacity, and users have to rebuild multiple datasets based on different use cases or when the model changed. With multi-dataset topics, a topic becomes a reusable relational data model: users add multiple datasets, define the relationships once, and Quick performs the joins at runtime.</p> \n<p>The new capability applies for both dashboard building and natural-language Q&amp;A. For dashboard building, the topic acts as the data model, so a single visual can draw fields from multiple datasets and Quick generates the underlying join automatically—users author the semantic model once and reuse it across every visual in the dashboard. For natural-language analytics, users can point a chat agent directly at a topic and ask questions; the agent reads the relationships defined in the topic and performs runtime joins across datasets to answer, with no need to pre-join tables or prepare data first. Because both experiences query toward the same topic, one governed semantic model serves as the single source of truth for people and agents alike. Multi-dataset topics reuse existing dataset permissions and support row-level and column-level security (RLS/CLS), so established governance carries through every cross-dataset visual and every answer.</p> \n<p>Multi-dataset topics are now generally available in all AWS Regions <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html#regions-qs\">where Amazon Quick is available</a>. To get started, see this <a href=\"https://aws.amazon.com/blogs/machine-learning/build-a-unified-semantic-layer-across-datasets-with-multi-dataset-topics-in-amazon-quick/\">blog post</a>.</p>"
  "8ca45b96b39918a75bcac49432f1e473":
    "id": "8ca45b96b39918a75bcac49432f1e473"
    "title": "Announcing temporal policies and rate limiting in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/temporal-policies-agentcore/"
    "published": "2026-08-06 13:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon Bedrock AgentCore announces two new controls: temporal policies for stateful agent authorization and rate limiting for AI traffic.</p> \n<p>Temporal policies let you define stateful authorization rules that evaluate each request in the context of an agent's prior actions within a session, because a single tool call can be safe in isolation yet harmful given what preceded it. With temporal policies you can enforce workflow sequencing, require that a tool argument exactly matches the output of a prior call, require human approval before taking privileged actions, and enforce data freshness.</p> \n<p>Rate limiting enables per-user or per-group controls over how much traffic flows to the tools, models, and agents connected to your gateway. Using rules scoped by OAuth or AWS IAM, you can set rate limits on requests across all target types, tokens for inference targets, and concurrent connections to cap long-lived concurrent sessions, aiding downstream service availability and enforcing fair limit distribution.&nbsp;</p> \n<p>For regional availability and to learn more, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html\">documentation</a>, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/control-agent-behaviors-and-cost-beyond-a-single-action-new-capabilities-in-amazon-bedrock-agentcore/\">announcement blog,</a> and explore the <a href=\"https://github.com/dogwood-policy\">Dogwood reference implementation</a>.&nbsp;</p>"
  "99513cd012680ab93fddea2d086783d4":
    "id": "99513cd012680ab93fddea2d086783d4"
    "title": "Amazon EC2 M8g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-m8g-instances-additional-regions/"
    "published": "2026-08-06 09:27:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M8g instances are available in AWS Asia Pacific (Taipei), and AWS Mexico (Central) regions. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 M8g instances are built for general-purpose workloads, such as application servers, microservices, gaming servers, midsize data stores, and caching fleets. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which oﬄoads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads.</p> \n<p>&nbsp;AWS Graviton4-based Amazon EC2 instances deliver the best performance and energy efficiency for a broad range of workloads running on Amazon EC2. These instances offer larger instance sizes with up to 3x more vCPUs and memory compared to Graviton3-based Amazon M7g instances. AWS Graviton4 processors are up to 40% faster for databases, 30% faster for web applications, and 45% faster for large Java applications than AWS Graviton3 processors. M8g instances are available in 12 different instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS).&nbsp;</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">Amazon EC2 M8g Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.&nbsp;</p>"
  "54869ffbe7618f3c0b5177ef7a1ccc46":
    "id": "54869ffbe7618f3c0b5177ef7a1ccc46"
    "title": "Amazon SES now helps identify automated open and click events in event notifications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ses-automated-email-interactions/"
    "published": "2026-08-06 16:00:00"
    "fetched": "2026-08-07 12:46:48"
    "summary": "<p>Amazon Simple Email Service (SES) now helps you identify automated email interactions. Open and Click event notifications now include an isBotEvent field that indicates whether the event was likely triggered by an automated system or a human recipient.<br /> <br /> Customers who publish Open or Click events through a configuration set event destination will now see an isBotEvent field with a value of Likely or Unlikely in event notifications. You can use this field as a signal to help you better understand how much of your engagement is driven by human recipients versus automated systems.<br /> <br /> This feature is available in all AWS Regions where Amazon SES is available. If you already publish Open or Click events to an event destination, the isBotEvent field is automatically included, no additional configuration is needed.<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/ses/latest/dg/event-publishing-retrieving-sns-contents.html\">Contents of event data that Amazon SES publishes to Amazon SNS</a> and <a href=\"https://docs.aws.amazon.com/ses/latest/dg/event-publishing-retrieving-firehose-contents.html\">Contents of event data that Amazon SES publishes to Firehose</a> in the Amazon SES Developer Guide.</p>"
"last_updated": "2026-08-07 12:46:49 JST"
