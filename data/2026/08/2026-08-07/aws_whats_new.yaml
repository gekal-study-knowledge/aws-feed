  "5086170deb1964cf413bbdc9b3d7016d":
    "id": "5086170deb1964cf413bbdc9b3d7016d"
    "title": "Amazon ECS now supports fractional GPU scheduling with Amazon EC2 G6f instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ecs-fractional-gpu/"
    "published": "2026-08-07 07:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS) now supports fractional GPU scheduling with Amazon EC2 G6f instances, enabling you to run your workloads on GPU partitions as small as one-eighth of an NVIDIA L4 Tensor Core GPU with 3 GB of GPU memory. Fractional GPUs give you the flexibility to right-size your containers for small-model AI inference, model experimentation, graphics rendering, and other workloads that do not require a full GPU, helping reduce infrastructure costs compared to provisioning a full GPU instance.</p> \n<p>You can request a fractional GPU by setting GPU=0.125, GPU=0.25, or GPU=0.5 in the container definition of your Amazon ECS task definition. Amazon ECS then places the task on a G6f instance that satisfies the request. Fractional GPU configuration is supported on both Amazon ECS Managed Instances and Amazon ECS on EC2. With <a href=\"https://aws.amazon.com/ecs/managed-instances/\" target=\"_blank\">ECS Managed Instances</a>, you get a fully managed experience where ECS automatically handles instance provisioning, scaling, patching, and lifecycle management, so you can focus on your GPU workloads rather than infrastructure operations. ECS Managed Instances also include capabilities built specifically for accelerated workloads, such as GPU metrics through <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Container-Insights-enhanced-observability-metrics-ECS.html\" target=\"_blank\">Amazon CloudWatch Container Insights</a>, and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-instances-gpu-auto-repair.html\" target=\"_blank\">automatic health monitoring</a> that detects GPU hardware failures and replaces unhealthy instances to minimize workload disruption.</p> \n<p>This capability is available in all AWS Regions where Amazon EC2 G6f instances are available. To get started, use the AWS Management Console, AWS CLI, AWS SDKs, AWS CloudFormation, or other infrastructure-as-code tools to configure a capacity provider with G6f instances and specify a fractional GPU value in the container definition of your ECS task definition. To learn more, visit the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-gpu-specifying.html#ecs-gpu-specifying-fractional\" target=\"_blank\">Amazon ECS fractional GPU documentation</a> and the <a href=\"https://aws.amazon.com/ec2/instance-types/g6/\" target=\"_blank\">Amazon EC2 G6 instance page</a>.</p>"
  "56c8287e08fb484e8a30a139baf20390":
    "id": "56c8287e08fb484e8a30a139baf20390"
    "title": "Amazon EC2 G7 instances are now available in the AWS Europe (Spain) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-g7-available-spain"
    "published": "2026-08-07 05:51:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) G7 instances powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs are now available in Europe (Spain) Region. G7 instances deliver up to 4.6x AI inference performance and up to 2.1 graphics performance compared to G6 instances. G7 instances also deliver faster performance for GPU-accelerated data analytics workloads.</p> \n<p>Customers can use G7 instances for deploying AI models for language translation, video and image analysis, and speech recognition. They also accelerate graphics workloads such as creating and rendering real-time, cinematic-quality graphics and game streaming. Additionally, G7 instances support video transcoding, spatial computing, and data analytics workloads such as recommender systems, Retrieval Augmented Generation (RAG) inference, and real-time data pipelines. G7 instances feature up to 8 NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs with 32 GB of memory per GPU and custom Intel Xeon 6 processors. They support up to 192 virtual CPUs (vCPUs) and up to 700 Gbps of Elastic Fabric Adapter (EFA) networking bandwidth. They also support up to 768 GiB of system memory, and up to 7.6 TB of local NVMe SSD storage.</p> \n<p>You can start using Amazon EC2 G7 instances today in four AWS Regions: US East (N. Virginia and Ohio), US West (Oregon), and Europe (Spain). You can purchase G7 instances as On-Demand Instances, Spot Instances, or as part of Savings Plans.</p> \n<p>To get started, visit the <a href=\"https://console.aws.amazon.com/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Command Line Interface</a> (CLI), and AWS SDKs. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\" rel=\"noopener noreferrer\" target=\"_blank\">G7 instance page</a>.</p>"
  "3dff7fd49e1e8f4e1cf48067d4d16f90":
    "id": "3dff7fd49e1e8f4e1cf48067d4d16f90"
    "title": "Amazon ElastiCache now supports Graviton4-based M8g, R8g, and C8gn nodes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-elasticache-graviton4-m8g-r8g-c8gn/"
    "published": "2026-08-07 04:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon ElastiCache now supports Graviton4-based M8g, R8g, and C8gn node families for Valkey and Memcached. Graviton4-based nodes provide up to 47% higher throughput, up to 43% lower P99 latency, and up to 31% better price-performance for on-demand pricing over Graviton3-based nodes of equivalent sizes on Amazon ElastiCache for Valkey, depending on node family, size, and workload configuration.</p> \n<p>Graviton4-based nodes also offer more memory per node compared to equivalent Graviton3-based nodes. As an example, an m8g.8xlarge provides 124.65 GiB versus 103.68 GiB on m7g.8xlarge, up to 20% more memory at the same node size. C8gn nodes offer up to 200 Gbps of network bandwidth, enabling you to scale performance and throughput while optimizing the cost of running network-intensive workloads.</p> \n<p>M8g, R8g, and C8gn nodes are available in sizes from large to 16xlarge in over 30 AWS Regions, including the AWS GovCloud (US) Regions and the China Regions. For complete information on pricing and regional availability, please refer to the <a href=\"https://aws.amazon.com/elasticache/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon ElastiCache pricing page</a>. To get started, create a new cluster or modify an existing cluster using the <a href=\"https://console.aws.amazon.com/elasticache/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>, AWS SDK, or AWS CLI. To work with ElastiCache using AI coding agents, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AgentTools.html\" rel=\"noopener noreferrer\" target=\"_blank\">Agent tools for ElastiCache</a>. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/CacheNodes.SupportedTypes.html\" rel=\"noopener noreferrer\" target=\"_blank\">Supported node types</a> in the <i>Amazon ElastiCache User Guide</i>.</p>"
  "5ebfd2709337ed3874e4a2f1f4e7b835":
    "id": "5ebfd2709337ed3874e4a2f1f4e7b835"
    "title": "AWS Glue Schema Registry is now available in ten more AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-gsr-10-more-regions"
    "published": "2026-08-07 03:56:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>You can now use the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html\">AWS Glue Schema Registry</a>, a serverless and free feature of<a href=\"https://aws.amazon.com/glue/\"> AWS Glue</a>, in the Asia Pacific (New Zealand), Asia Pacific (Thailand), Asia Pacific (Hyderabad), Asia Pacific (Osaka), Asia Pacific (Malaysia), Asia Pacific (Melbourne), Mexico (Central), Israel (Tel Aviv), Asia Pacific (Taipei), Canada West (Calgary) regions to validate and control the evolution of streaming data using registered Apache Avro, JSON, and Protobuf schema formats.<br /> <br /> The Schema Registry acts as a centralized repository for managing data format and structure between decoupled applications in data streaming systems. By using it, you can eliminate data validation logic and cross-team coordination, improve streaming data quality, and reduce downstream application failures. Through Apache-licensed serializers and deserializers, the Schema Registry integrates with C# and Java applications developed for <a href=\"https://aws.amazon.com/msk/\">Apache Kafka/Amazon Managed Streaming for Apache Kafka</a>, <a href=\"https://aws.amazon.com/kinesis/data-streams/\">Amazon Kinesis Data Streams</a>, <a href=\"https://aws.amazon.com/kinesis/data-analytics/\">Apache Flink/Amazon Managed Service for Apache Flink</a>, and <a href=\"https://aws.amazon.com/lambda/\">AWS Lambda</a>.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/schema-registry-gs.html\">AWS Glue Schema Registry</a> documentation. For a full list of AWS Regions where AWS Glue Schema Registry is available, see the<a href=\"https://builder.aws.com/build/capabilities/explore?f=eJxVjjEPgjAQhf9K82YYXEkcWDSuMjhwDBVObKyUtAdJQ_jv1g4mbu9977vkNgS23AsPVx6NmwIqtIQllKyDlAdCh-Ln1Ks2Vt-NNRKTWE9R_aECs3cze4knY4V9cjbCTKgIzhMKgqTSdimM35DWNa_1rVFnu7Bq-ie_tfLpmyA-5ptXVh6sZfF8GTJzmR0Je7dj_wBrpUH1&amp;tab=service-feature\"> AWS Regional Services List</a>.</p>"
  "840fe81b5af032d595b5ac4fe221f6fa":
    "id": "840fe81b5af032d595b5ac4fe221f6fa"
    "title": "AWS Transform for migrations automates post-launch actions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-transform-for-migrations-automates-post-launch-actions"
    "published": "2026-08-07 02:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>AWS Transform now automates the configuration and execution of post-launch actions through the migration workflow. Define actions at the account level and apply them automatically to each source server across your target accounts, including multi-account migrations. Automating these actions removes the slow, error-prone work of configuring them server by server, so your team moves more servers with less hands-on effort.</p> \n<p>Post-launch actions run through AWS Systems Manager (SSM) immediately after test or cutover launch. You can use predefined actions or bring your own SSM document. For source server bulk configurations, the migration inventory file now includes a new structure for post-launch actions, making it easier to review and modify actions per source server.</p> \n<p>The AWS Transform for migrations agent automates your migration configuration end to end, including replication templates, EC2 launch templates, EC2 right-sizing, and post-launch actions, with the flexibility to create and edit any of these at the source server level.&nbsp;</p> \n<p>This new capability is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html\">AWS Transform is offered</a>.</p> \n<p>To learn more, please visit the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-migrate-servers.html#transform-vmware-ms-prereqs-and-defaults\">AWS Transform User Guide</a>.</p>"
  "5848bf056ded41e0b3c8e6c6ad036ed9":
    "id": "5848bf056ded41e0b3c8e6c6ad036ed9"
    "title": "AWS Security Agent now supports email-based MFA for penetration testing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-security-agent-mfa/"
    "published": "2026-08-07 01:54:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>AWS Security Agent (now part of <a href=\"http://aws.amazon.com/continuum?refid=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e\">AWS Continuum</a>) now enables penetration testing of applications that use email-based multi-factor authentication (MFA) as part of their login flow. Previously, applications requiring one-time codes or verification links sent by email were out of scope for automated pentesting because the agent had no mechanism to intercept those messages. This launch expands coverage for penetration testing customers whose target applications rely on email-based authentication.</p> \n<p>To use this feature, AWS Security Agent generates a unique forwarding address per credential, allowing you to route your application's MFA emails directly to the agent using a forwarding rule in your existing email provider. During a pentest, the agent automatically reads the forwarded message and submits the code or link to complete authentication — no email account credentials are stored, preserving a strong privacy posture. This capability complements existing TOTP support, giving customers a unified solution for testing applications across multiple MFA methods.</p> \n<p>This feature is available in all AWS Regions where AWS Security Agent is supported.</p> \n<p>To learn more, visit the <a href=\"https://aws.amazon.com/security-agent/?trk=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e&amp;sc_channel=ps&amp;ef_id=CjwKCAjw4dDTBhAqEiwAkHYmSuBZ_V1zxJ29F9CUMF-dw-2pVhe8YC2_92NoHZwMhMknYw6nqMHbUhoCvjwQAvD_BwE&amp;gads_camp=23532472972&amp;gads_ag=200881312961&amp;gads_ad=812204788708&amp;gads_kw=aws%20security%20agent&amp;gads_matchtype=e&amp;gads_network=g&amp;gads_device=c&amp;gads_geo=9193254&amp;gad_campaignid=23532472972&amp;gbraid=0AAAAADjHtp8JMRwV7qBFDei1P9Woz23HE&amp;gclid=CjwKCAjw4dDTBhAqEiwAkHYmSuBZ_V1zxJ29F9CUMF-dw-2pVhe8YC2_92NoHZwMhMknYw6nqMHbUhoCvjwQAvD_BwE\">AWS Security Agent product page</a> and the <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/what-is.html?trk=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e&amp;sc_channel=ps\">AWS Security Agent User Guide</a>.&nbsp;</p>"
  "fe49452bb6596d5e29491183914fd148":
    "id": "fe49452bb6596d5e29491183914fd148"
    "title": "Amazon RDS now provides visibility into storage volume initialization status"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-rds-storage-volume-initialization-visibility"
    "published": "2026-08-07 01:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon RDS now provides visibility into the initialization status of database storage volumes created from snapshots. You can use this status to determine when your storage is fully initialized after a restore and is ready to support latency-sensitive database workloads at fully provisioned performance.<br /> <br /> When you restore a database instance to a point-in-time, or create a read replica creation, or convert from Single-AZ to Multi-AZ conversion, Amazon RDS creates storage volumes from a snapshot. These volumes undergo initialization, during which storage blocks are downloaded from Amazon S3 and written to the volume before they can be accessed. The initialization rate varies depending on the workload and which blocks are accessed and during this period you may notice increased I/O latency. Previously, Amazon RDS reported the instance as available throughout initialization, giving you no direct signal for when performance would stabilize. The new StorageOperationStatus and StorageOperationPercentProgress fields on the RDS Console and&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DescribeDBInstances.html\" rel=\"noopener noreferrer\" target=\"_blank\">DescribeDBInstances</a> API let you monitor your storage initialization progress in real time, so you can validate when all blocks have been written. You can use the information to time your workloads to align with its completion. The fields also report storage optimization progress so you can plan for full provisioned performance after a storage modification.<br /> <br /> Storage volume initialization status is accessible by default for all Amazon RDS database instances in all commercial AWS Regions and US GovCloud Regions. You can start using it today through the Amazon RDS Management Console, the AWS Command Line Interface (CLI), or the AWS SDKs. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS storage</a> in the Amazon RDS User Guide.</p>"
  "693b4ac5ef7c758cefb99f446f5692af":
    "id": "693b4ac5ef7c758cefb99f446f5692af"
    "title": "Amazon WorkSpaces now publishes enhanced observability metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-workspaces-observability-metrics"
    "published": "2026-08-07 00:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon WorkSpaces now publishes additional performance and session health metrics to Amazon CloudWatch, enabling IT administrators to gain deeper visibility into their virtual desktop workloads. These new metrics span network performance, compute and storage resource utilization, and session lifecycle events — all available at no additional cost.<br /> <br /> With these metrics, administrators can proactively identify and troubleshoot issues that impact end-user experience. For example, TCP retransmission rate and congestion window help pinpoint network degradation, GPU usage and CPU queue length surface compute bottlenecks, and storage metrics like disk I/O queue lengths and memory page hard faults provide visibility into disk saturation and memory pressure. Administrators can set CloudWatch alarms for rapid detection of performance issues, build custom dashboards for fleet-wide visibility, and reduce mean time to resolution.<br /> <br /> These metrics are available in all AWS Regions where Amazon WorkSpaces is supported.<br /> <br /> To get started, navigate to the Amazon CloudWatch console and observe these metrics or update your <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/cloudformation-templates.html\">WorkSpaces custom dashboards</a>. You can also monitor these metrics through <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/cloudwatch-dashboard.html\">WorkSpaces automatic dashboard</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces.html\">Amazon WorkSpaces documentation</a> and the <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/cloudwatch-metrics.html\">CloudWatch metrics reference</a>.</p>"
  "b9b7c2a44db899ba5bb4cbbd0f2aa01f":
    "id": "b9b7c2a44db899ba5bb4cbbd0f2aa01f"
    "title": "Amazon WorkSpaces Applications now publishes enhanced observability metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-workspaces-applications-observability-metrics"
    "published": "2026-08-07 00:00:00"
    "fetched": "2026-08-07 09:38:45"
    "summary": "<p>Amazon WorkSpaces Applications now publishes additional performance and session health metrics to Amazon CloudWatch, enabling IT administrators to gain deeper visibility into their application streaming workloads. These new metrics span network performance, compute resource utilization, and session lifecycle events — all available at no additional cost.<br /> <br /> With these metrics, administrators can proactively identify and troubleshoot issues that impact end-user experience. For example, metrics such as TCP retransmission rate and congestion window help pinpoint network degradation, while GPU utilization and memory page hard faults surface resource bottlenecks before they affect session quality. Session lifecycle metrics like connection failures and connection duration enable teams to set CloudWatch alarms for rapid detection of connectivity issues, build custom dashboards for fleet-wide visibility, and reduce mean time to resolution.<br /> <br /> These metrics are available in all AWS Regions where Amazon WorkSpaces Applications is supported.<br /> <br /> To get started, navigate to the Amazon CloudWatch console and observe these metrics or update your <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/custom-cloudwatch-dashboards.html\">WorkSpaces Applications custom dashboards</a>. You can also monitor these metrics through <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/cloudwatch-automatic-dashboard.html\">WorkSpaces Applications automatic dashboard</a>. To learn more about metric availability by operating system, visit the <a href=\"https://docs.aws.amazon.com/appstream2/\">Amazon WorkSpaces Applications documentation</a> and the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/monitoring.html\">CloudWatch metrics reference</a>.</p>"
"last_updated": "2026-08-07 09:38:45 JST"
