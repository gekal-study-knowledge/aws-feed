"overview": |
  この日は検索とベクトルの基盤強化が目立ちました。Amazon DynamoDB がネイティブのベクトル検索に対応し、数兆ベクトル規模でも 99% 以上の再現率を 1 桁ミリ秒のレイテンシで提供します。Amazon Bedrock には Web Search がサーバーサイドの組み込みツールとして一般提供され、モデル応答を Web 上の情報にグラウンディングできるようになりました (OpenAI GPT モデルでも利用可能)。Kiro では 3 つに分かれていた IDE / CLI / Web のエージェントを標準化された Agent Client Protocol ベースの単一ハーネスへ統合した経緯が解説され、あわせて仕事を代行する Kiro Crew が紹介されています。セキュリティでは Security Hub Extended に 10 番目のカテゴリとしてサプライチェーンセキュリティが追加され、Chainguard と Socket がキュレーションパートナーとなりました。Network Firewall は明示的なフォワードプロキシとして利用できる機能がプレビューで再導入されています。
