"entries":
  "390a0eef7bb64ea34a832428d01a8288":
    "id": "390a0eef7bb64ea34a832428d01a8288"
    "title": "AWS 認定の上位・下位関係を理解して効率的に認定を更新しましょう"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-certification-hierarchy-recertification-guide/"
    "published": "2026-08-05 09:06:12"
    "fetched": "2026-08-05 09:09:24"
    "summary": "AWS 認定には Professional → Associate → Foundational の上位・下位関係があり、上位の認定を取得または更新すると、取得済みの下位認定も自動的に更新されます。複数の認定を保持している方は、この関係を活用して効率的に再認定を進めることができます。本記事では具体的な上位・下位の紐づきを図で整理し、効率的な再認定の方法と注意点を解説します。"
  "ebf249a5794b602691c4589e559d6947":
    "id": "ebf249a5794b602691c4589e559d6947"
    "title": "1 つのエージェントで、あらゆるクライアントに: Kiro エージェントハーネスをどう構築したか"
    "link": "https://aws.amazon.com/jp/blogs/news/one-agent/"
    "published": "2026-08-05 09:43:36"
    "fetched": "2026-08-05 12:56:46"
    "summary": "Kiro IDE、CLI、Web に別々に存在した 3 つのエージェントを、単一の Kiro エージェントハーネスに統合した過程を解説します。標準化された Agent Client Protocol (ACP) を採用し、独自の WebSocket トランスポートと Kiro-ACP 拡張、Cedar ベースのケイパビリティ権限モデルを組み合わせることで、仕様駆動開発、カスタムエージェント、フックをすべてのクライアントで一貫して提供します。IDE 1.0、CLI v3、Web、iOS 版で今すぐ試せます。"
  "67108955b1fbcbbcdc05fa33333ebfd4":
    "id": "67108955b1fbcbbcdc05fa33333ebfd4"
    "title": "KNFSD ファイルキャッシュのご紹介: NFS ストレージをクラウドに拡張"
    "link": "https://aws.amazon.com/jp/blogs/news/jp-mne-introducing-knfsd-file-cache-extending-your-nfs-storage-into-the-cloud/"
    "published": "2026-08-05 15:07:38"
    "fetched": "2026-08-05 15:27:51"
    "summary": "本記事では、KNFSD File Cache (KNFSD) の仕組みと、オンプレミスのファイラー、サードパーティ、Amazon FSx などの AWS サービスを問わず、NFS 準拠のストレージとどのように連携するかを説明します。また、単一の Terraform モジュールを使って本番環境向けのオートスケーリングクラスターをデプロイする方法も紹介します。このクラスターは、100 Gb 毎秒あたり時間 6 ドル未満で集約スループットを実現します。"
  "2e26f3dd2c23a55d015615ef7da1a071":
    "id": "2e26f3dd2c23a55d015615ef7da1a071"
    "title": "Kiro Crew の紹介"
    "link": "https://aws.amazon.com/jp/blogs/news/introducing-kiro-crew/"
    "published": "2026-08-05 13:21:23"
    "fetched": "2026-08-05 15:27:51"
    "summary": "Kiro Crew は、その仕事を代わりに引き受けます。Crew にメッセージを 1 通投げれば、前回どう対応したかを探し出し、まとめ、同僚に送るところまでを、あなたが再び手を入れることなく進めてくれます。あなたはその日の仕事を終えて外に出て、「問題は解決しました」というチームからのメモを目にするだけです。チケットのキューを渡せば、Kiro Crew はトリアージして振り分け、オーナーを特定し、あなたの判断が必要なものにフラグを立てます。複数リポジトリにまたがるインシデントを指し示せば、あなたが修正に集中している間に調査を進めます。マイグレーションを開始すれば、あなたが会議中でも眠っている間でも、チェックポイントとリトライを通じて前進し続けます。すでにあなたが使っているツールをつなぎ、セッションをまたいで作業を調整するので、戻ってきたときに待っているのは「やり直すべきワークフロー」ではなく「進んだ結果」です。"
