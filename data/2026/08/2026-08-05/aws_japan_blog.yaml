    "title": "AWS 認定の上位・下位関係を理解して効率的に認定を更新しましょう"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-certification-hierarchy-recertification-guide/"
    "published": "2026-08-05 09:06:12"
    "fetched": "2026-08-05 09:09:24"
    "summary": "AWS 認定には Professional → Associate → Foundational の上位・下位関係があり、上位の認定を取得または更新すると、取得済みの下位認定も自動的に更新されます。複数の認定を保持している方は、この関係を活用して効率的に再認定を進めることができます。本記事では具体的な上位・下位の紐づきを図で整理し、効率的な再認定の方法と注意点を解説します。"
  "ebf249a5794b602691c4589e559d6947":
    "id": "ebf249a5794b602691c4589e559d6947"
    "title": "1 つのエージェントで、あらゆるクライアントに: Kiro エージェントハーネスをどう構築したか"
    "link": "https://aws.amazon.com/jp/blogs/news/one-agent/"
    "published": "2026-08-05 09:43:36"
    "fetched": "2026-08-05 12:56:46"
    "summary": "Kiro IDE、CLI、Web に別々に存在した 3 つのエージェントを、単一の Kiro エージェントハーネスに統合した過程を解説します。標準化された Agent Client Protocol (ACP) を採用し、独自の WebSocket トランスポートと Kiro-ACP 拡張、Cedar ベースのケイパビリティ権限モデルを組み合わせることで、仕様駆動開発、カスタムエージェント、フックをすべてのクライアントで一貫して提供します。IDE 1.0、CLI v3、Web、iOS 版で今すぐ試せます。"
"last_updated": "2026-08-05 12:56:46 JST"
