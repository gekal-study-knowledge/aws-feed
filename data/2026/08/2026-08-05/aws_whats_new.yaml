"entries":
  "f57b1251142dcf73efb8ee6a6d47509d":
    "id": "f57b1251142dcf73efb8ee6a6d47509d"
    "title": "Amazon EC2 I8g instances now available in AWS Europe (Paris), Asia Pacific (Jakarta) regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-i8g-instances-aws-paris-jakarta-regions/"
    "published": "2026-08-05 01:00:00"
    "fetched": "2026-08-05 02:42:36"
    "summary": "<p>AWS announces the general availability of Amazon EC2 Storage Optimized I8g instances in AWS Europe (Paris) and Asia Pacific (Jakarta) regions.&nbsp;I8g instances are powered by AWS Graviton4 processors and offer the best compute performance in Amazon EC2 for storage-intensive workloads. I8g instances use the third generation AWS Nitro SSDs, local NVMe storage that deliver up to 65% better real-time storage performance per TB while offering up to 50% lower storage I/O latency and up to 60% lower storage I/O latency variability compared to I4g instances. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which offloads CPU virtualization, storage, and networking functions to dedicated hardware and software enhancing the performance and security for your workloads.</p> \n<p><br /> Amazon EC2 I8g instances are designed for I/O intensive workloads that require rapid data access and real-time latency from storage. These instances excel at handling transactional, real-time, distributed databases, including MySQL, PostgreSQL, Hbase and NoSQL solutions like Aerospike, MongoDB, ClickHouse, and Apache Druid. They're also optimized for real-time analytics platforms such as Apache Spark, data lakehouse and AI LLM pre-processing for training. I8g instances are available in eleven different sizes including two metal sizes, 1.5 TiB of memory, and 45 TB local instance storage. They deliver up to 100 Gbps of network performance bandwidth, and 60 Gbps of dedicated bandwidth for Amazon Elastic Block Store (EBS).</p> \n<p><br /> To learn more, visit <a href=\"https://aws.amazon.com/ec2/instance-types/i8g/\">Amazon EC2 I8g instances.</a> To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>.<br /> </p>"
  "315c32e04d189c08f0db271723205d0c":
    "id": "315c32e04d189c08f0db271723205d0c"
    "title": "Amazon Bedrock launches Web Search for OpenAI GPT models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-web/"
    "published": "2026-08-05 05:37:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p>Today, we are announcing the general availability of Web Search on Amazon Bedrock, a built-in server side tool that performs web search entirely within AWS, enabling OpenAI models (GPT-5.4, GPT-5.5, and GPT-5.6 Sol/Terra/Luna) to ground responses with current web knowledge while maintaining data residency within your secured AWS environment with zero data egress. Previously, adding web grounding required onboarding a third-party search provider, managing separate API keys and billing, building custom orchestration, and conducting additional compliance reviews for each external vendor. Web Search removes this heavy lifting by enable grounding with a single parameter in an existing API call, with no vendor onboarding, no external APIs to orchestrate, and no additional vendor security reviews to conduct.<br /> <br /> Web Search is built by Amazon, informed by years of experience across Alexa+, Amazon Quick and Kiro. It combines a web index operated by Amazon, spanning tens of billions of documents refreshed continually, with a built-in knowledge graph that provides verified facts. Rather than returning raw pages, Web Search performs semantic snippet extraction, delivering context-efficient results optimized for the model's context window with low latency. Web Search integrates through a standardized tool-use interface, compatible with the OpenAI Responses API. Simply add the web search tool to your API call, and Bedrock handles the entire search lifecycle server-side; a single API call returns a grounded response with citations.<br /> <br /> Web Search on Amazon Bedrock is generally available today in US East (N. Virginia), US East (Ohio), and US West (Oregon). To get started, read our blog post <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-web-search-on-amazon-bedrock-for-foundation-model-grounding/\">Introducing Web Search on Amazon Bedrock for foundation model grounding</a>, review the <a href=\"https://docs.aws.amazon.com/bedrock/\">Web Search section in the Amazon Bedrock User Guide</a> for technical documentation, and visit the <a href=\"https://aws.amazon.com/bedrock/pricing/\">Amazon Bedrock pricing page</a> for cost details.</p>"
  "7bdbef8374ab2934a02bc7d6a6c52f0c":
    "id": "7bdbef8374ab2934a02bc7d6a6c52f0c"
    "title": "Run interactive workloads on Amazon EMR on EC2 with Spark Connect"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-emr-ec2-spark-connect/"
    "published": "2026-08-05 05:29:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p>Amazon EMR on EC2 now supports interactive Apache Spark sessions with Spark Connect. Data engineers and data scientists can develop and debug Apache Spark applications interactively from managed notebooks in Amazon SageMaker Unified Studio and their own IDEs, such as Jupyter and Visual Studio Code, with each session running on dedicated EMR on EC2 clusters. You can also monitor and debug active and completed sessions in the EMR console.</p> \n<p>&nbsp;</p> \n<p>An interactive session provides a persistent Spark context that spans across cells and scripts, letting you blend local Python code execution with remote Spark operations. Spark Connect's client-server architecture decouples your application client from the Spark driver and allows you to maintain your preferred development environment and tooling while Spark infrastructure runs on the cluster. This architecture supports workflows including ad hoc data exploration, iterative step-by-step debugging, and incremental PySpark job development before deploying to production. For observability, you get real-time session monitoring via the Spark UI, history tracking through the Spark History Server, and session management from the EMR console or API/CLI/SDK.</p> \n<p>&nbsp;</p> \n<p>Interactive Sessions is available on Amazon EMR on EC2 with AWS runtime for Apache Spark (emr-spark-8.0) and later, in all AWS Regions where Amazon EMR is available, except the AWS GovCloud Regions and the China Regions. The Amazon SageMaker Unified Studio experience is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">supported regions</a>. To get started, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-spark-connect-sessions.html\">Interactive sessions with Spark Connect</a> guide or the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/what-is-sagemaker-unified-studio.html\">Amazon SageMaker Unified Studio Getting Started guide</a>.</p>"
  "1308cef65fe67d52546e72a57c956f36":
    "id": "1308cef65fe67d52546e72a57c956f36"
    "title": "AWS Security Hub Extended adds supply chain security as its 10th category"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-security-hub-extended-adds-supply-chain-security"
    "published": "2026-08-05 04:14:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p>The AWS Security Hub Extended plan now includes Supply Chain Security as its 10th security category, with Chainguard and Socket as the curated partners. As developers adopt open-source libraries at scale, security teams need confidence that the packages entering their environments are trustworthy and free from malicious code. With this addition, you can detect and block malicious dependencies before they are built into your applications, with the same streamlined activation and pay-as-you-go pricing as every other Extended category. This brings the Extended plan to 23 curated partner solutions. All solutions are on a single AWS bill and no required long-term commitments.</p> \n<p>Security Hub Extended is a plan within AWS Security Hub that helps simplify how you procure, deploy, and integrate a full-stack enterprise security solution across endpoint, identity, email, network, data, browser, cloud, AI, security operations, and supply chain. Security findings from all participating solutions are emitted in the Open Cybersecurity Schema Framework (OCSF) and automatically aggregated in AWS Security Hub. With the Extended plan, you can combine AWS and curated partner solutions to quickly identify and respond to risks that span boundaries.</p> \n<p>We will continue to expand the Extended plan based on customer feedback. The two new curated partner solutions are available today in all AWS commercial Regions where Security Hub is available. For a list of supported Regions, see the<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/?p=ngi&amp;loc=4&amp;refid=d8ec3b19-0f37-4f8c-8c12-189f913e205c\"><u> AWS Region table.</u></a> For more information about pricing, visit the<a href=\"https://aws.amazon.com/security-hub/pricing/\" title=\"AWS Security Hub pricing\"><u> AWS Security Hub pricing page</u></a>. To get started, visit the <a href=\"https://console.aws.amazon.com/securityhub/v2/home\"><u>AWS Security Hub console</u></a> or <a href=\"https://aws.amazon.com/security-hub/\" title=\"AWS Security Hub overview\"><u>product page.</u></a></p>"
  "1a172d35d706b327e5e7b7bc6777bd86":
    "id": "1a172d35d706b327e5e7b7bc6777bd86"
    "title": "Amazon EC2 C8g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-c8g-instances-additional-regions/"
    "published": "2026-08-05 03:57:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8g instances are available in AWS Europe (Paris), AWS Africa (Cape Town), AWS Israel (Tel Aviv), and AWS Canada West (Calgary) regions. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 C8g instances are built for compute-intensive workloads, such as high performance computing (HPC), batch processing, gaming, video encoding, scientific modeling, distributed analytics, CPU-based machine learning (ML) inference, and ad serving. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which oﬄoads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads.</p> \n<p>AWS Graviton4-based Amazon EC2 instances deliver the best performance and energy efficiency for a broad range of workloads running on Amazon EC2. These instances offer larger instance sizes with up to 3x more vCPUs and memory compared to Graviton3-based Amazon C7g instances. AWS Graviton4 processors are up to 40% faster for databases, 30% faster for web applications, and 45% faster for large Java applications than AWS Graviton3 processors. C8g instances are available in 12 different instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS).</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon EC2 C8g Instances</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
  "25b2f5aaf5cd1e15b9f66a1fc6aa41c2":
    "id": "25b2f5aaf5cd1e15b9f66a1fc6aa41c2"
    "title": "AWS Application and Network Load Balancers now support RFC 9151 compliant security policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-application-network/"
    "published": "2026-08-05 03:28:00"
    "fetched": "2026-08-05 06:07:20"
    "summary": "<p>AWS Application Load Balancer (ALB) and Network Load Balancer (NLB) now support new TLS-based security policies that comply with RFC 9151 TLS server requirements for Commercial National Security Algorithm (CNSA) 1.0 suite requirements. These policies implement the cryptographic requirements defined by the US National Security Agency (NSA) for secure communications using TLS 1.2 and TLS 1.3 protocols.<br /> <br /> Customers who are required to meet CNSA 1.0 TLS security requirements can now use ALB and NLB with RFC 9151 compliant security policies. Broader interoperability policies are also supported, allowing you to implement CNSA by default while maintaining compatibility with non-CNSA clients during their transition to RFC 9151 compliance, minimizing service disruption.<br /> <br /> This feature is available for ALB and NLB in all AWS Commercial Regions, the AWS GovCloud (US) Regions, and the China region at no additional cost. To use this capability, update your existing ALB HTTPS listeners or NLB TLS listeners to a RFC 9151 compliant security policy, or select a compliant policy when creating new listeners through the AWS Management Console, CLI, API, or SDK.<br /> <br /> To learn more, visit the <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html\">ALB User Guide</a> and <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/describe-ssl-policies.html\">NLB User Guide</a> documentation. Get started with <a href=\"https://aws.amazon.com/elasticloadbalancing/\">Elastic Load Balancing</a>.</p>"
  "9cba88416d98ea74afb6f317c9907db5":
    "id": "9cba88416d98ea74afb6f317c9907db5"
    "title": "Amazon Connect Customer now lets you export cases to CSV from the agent workspace"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-export-cases/"
    "published": "2026-08-05 06:00:00"
    "fetched": "2026-08-05 07:58:51"
    "summary": "<p>Amazon Connect Customer now supports exporting cases to a CSV file directly from the agent workspace, making it easier to share case data with internal teams and external stakeholders such as vendors, legal teams, or business partners. Agents can filter and select cases and choose which case fields to include in the export. Admins can control access using a security profile permission.<br /> <br /> Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/connect/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/case-bulk-export.html\">documentation</a>.<a href=\"http://aws.amazon.com\" rel=\"noopener noreferrer\" target=\"_blank\"></a></p>"
  "9a761c09a8b3699eddbecbe5af88e8b0":
    "id": "9a761c09a8b3699eddbecbe5af88e8b0"
    "title": "Amazon S3 Vectors is now available in the AWS European Sovereign Cloud (Germany) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-s3-vectors-european-sovereign-cloud-germany/"
    "published": "2026-08-05 03:15:00"
    "fetched": "2026-08-05 07:58:51"
    "summary": "<p>Amazon S3 Vectors is now available in the AWS European Sovereign Cloud (Germany) Region. Amazon S3 Vectors is purpose-built vector storage for AI agents, inference, Retrieval Augmented Generation (RAG), and semantic search at billion-vector scale. S3 Vectors is designed to provide the same elasticity, durability, and availability as Amazon S3, with a dedicated set of APIs that let you store, access, and query vectors without provisioning any infrastructure.</p> \n<p>For a full list of AWS Regions where Amazon S3 Vectors is available, see <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-regions-quotas.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions and endpoints</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/features/vectors/\" rel=\"noopener noreferrer\" target=\"_blank\">product page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>, and the <a href=\"https://aws.amazon.com/s3/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 pricing page</a>.</p>"
  "a2809096aa87ebb05860dba1bb9be7aa":
    "id": "a2809096aa87ebb05860dba1bb9be7aa"
    "title": "Amazon Connect Customer now supports capacity planning in 15 or 30 minute intervals"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-customer-interval-capacity-plan"
    "published": "2026-08-05 02:00:00"
    "fetched": "2026-08-05 09:09:23"
    "summary": "<p>Amazon Connect Customer now lets you generate capacity plans at the interval level (15-minute or 30-minute intervals), giving workforce planners visibility into more granular staffing requirements across Voice, Chat, Task, and Email channels. Interval-level plans capture how demand shifts throughout the day — such as a lunchtime surge in chat contacts or an end-of-day change in call volume — so you can align agent capacity with demand as it changes and staff precisely for each part of the day. You can also provide shrinkage assumptions and available headcount at the interval level for more accurate plans. Together, these capabilities improve planning accuracy and help you reduce over- and under-staffing, improving service levels and operational efficiency.<br /> <br /> This feature is available in all <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region\">AWS Regions</a> where Amazon Connect Customer agent scheduling is available. To learn more about Amazon Connect Customer agent scheduling, click <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html\">here</a>.</p>"
  "6a537bb4ed6b5f9c2fac7fcc6bea25df":
    "id": "6a537bb4ed6b5f9c2fac7fcc6bea25df"
    "title": "[Preview Announcement] Re-introducing Forward Proxy as AWS Network Firewall Functionality"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-network-firewall-forward-proxy-preview/"
    "published": "2026-08-05 07:24:00"
    "fetched": "2026-08-05 12:56:46"
    "summary": "<p>You can now use your Network Firewall with all its existing filtering capabilities and features as an explicit forward proxy.<br /> <br /> On Nov 25, 2025, AWS introduced Network Firewall <i>proxy </i>in public preview to help customers exert centralized security controls against data exfiltration and malware injection. At the time, the Network Firewall <i>proxy</i> was introduced as a standalone product, separate from Network Firewall <i>transparent firewall </i>and used its own separate <i>proxy </i>security policy. Customers who tested it in preview shared that they want the Network Firewall <i>proxy </i>to maintain parity with Network Firewall’s existing set of capabilities and use the same security policy across the two functionalities<i>.</i> In keeping with customer feedback, we are reintroducing explicit <i>proxy</i> as a functionality of Network Firewall. With this launch, you can configure Network Firewall with your existing Firewall policy in a new <i>no-source-preservation</i> deployment where it can be used as an explicit <i>proxy</i> with all its existing features including managed rule groups, active threat defense, Geo-IP filtering, URL and domain category filtering, container attribute-based rules for Amazon EKS and Amazon ECS, etc. You can create a single security policy and use it for both explicit <i>proxy</i> and <i>transparent firewall</i> functionalities.<br /> <br /> Try out AWS Network Firewall in <i>no-source-preservation</i> deployment with <i>proxy</i> functionality in your test environment today in US East (Ohio) region. <i>no-source-preservation</i> Network Firewall is available for free during public preview. For more information, check <u><a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/nfw-no-source-preservation.html\">no-source-preservation Network Firewall documentation</a></u>.</p>"
"last_updated": "2026-08-05 12:56:46 JST"
