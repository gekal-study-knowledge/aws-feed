"entries":
  "6ab49fc2ede762d2bce517d6f41f5ec9":
    "id": "6ab49fc2ede762d2bce517d6f41f5ec9"
    "title": "Amazon Connect Customer now lets you update the customer profile on a case or add a profile after a case is opened"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-cases-flexible-profiles/"
    "published": "2026-08-26 01:00:00"
    "fetched": "2026-08-26 02:27:20"
    "summary": "<p><span style=\"font-weight: normal;\">Amazon Connect Customer now lets agents change the profile on a case or choose a profile after the case is opened. If a case is linked to the wrong customer, agents can update the profile to keep case histories accurate. Agents can also add a profile later when the customer is not identified at case creation, such as for calls from a shared phone number or issues that require identity verification.</span></p> \n<p><span style=\"font-weight: normal;\">Amazon Connect Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Amazon Connect Cases <a href=\"https://aws.amazon.com/products/connect/customer/cases/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases.html\">documentation</a>.</span></p>"
  "b554456ad367d07686094182dcae0175":
    "id": "b554456ad367d07686094182dcae0175"
    "title": "Amazon RDS for PostgreSQL supports minor versions 18.6, 17.11, 16.15, 15.19, and 14.24"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-rds-postgresql-18-6-17-11-16-15-15-19-14-24/"
    "published": "2026-08-26 01:00:00"
    "fetched": "2026-08-26 03:33:17"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (RDS) for PostgreSQL</a> now supports the latest minor versions 18.6, 17.11, 16.15, 15.19, and 14.24. We recommend that you upgrade to the latest minor versions to address Common Vulnerabilities and Exposures (CVEs) in prior versions of PostgreSQL, and to benefit from the bug fixes and improvements added by the PostgreSQL community.</p> \n<p>You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate multiple upgrades in phases, validating on lower-priority environments before upgrading your most critical ones. You can also use Amazon RDS Blue/Green deployments to minimize downtime for minor version upgrades. For more information, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.PostgreSQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrading RDS for PostgreSQL DB engine</a>.&nbsp;</p> \n<p>Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. See <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for PostgreSQL Pricing</a> for pricing details and regional availability. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (CLI).</p>"
  "83649ff8a0b549d0551e6f65ef1cf5a4":
    "id": "83649ff8a0b549d0551e6f65ef1cf5a4"
    "title": "AWS Batch now supports Amazon ECS Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-batch-on-ecs-managed-instances/"
    "published": "2026-08-26 04:36:00"
    "fetched": "2026-08-26 06:22:57"
    "summary": "<p>AWS Batch now supports Amazon ECS Managed Instances (ECS MI) as a new compute option, enabling you to run GPU-accelerated and compute-intensive batch workloads on AWS-managed infrastructure. With AWS Batch on ECS MI you can now access GPU-accelerated instances while AWS handles AMI updates, security patching,&nbsp;and instance lifecycle automatically, eliminating the operational overhead of customer-managed Amazon EC2 infrastructure.<br /> <br /> To get started, create an AWS Batch on ECS MI compute environment using the AWS Batch <i>CreateComputeEnvironment</i> API or the AWS Batch Management Console. You can specify your allowed instance types and networking configuration in the <i>managedInstancesProvider</i> block, associate the compute environment with a job queue, and submit jobs using On-Demand, Spot, or reserved capacity.<br /> <br /> AWS Batch on ECS Managed Instances is supported in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/ecs_managed_instances.html\">AWS Batch User Guide</a>.</p>"
  "c71ed40c42367de5464bebd02778e481":
    "id": "c71ed40c42367de5464bebd02778e481"
    "title": "AWS IoT Core now supports native InfluxDB routing for time-series data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-iot-core-influxdb/"
    "published": "2026-08-26 04:42:00"
    "fetched": "2026-08-26 07:21:39"
    "summary": "<p><a href=\"https://aws.amazon.com/iot-core/\">AWS IoT Core</a> now supports <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/influxdb-rule-action.html\">InfluxDB rule action</a> that routes time-series data from your Internet of Things (IoT) devices directly to <a href=\"https://www.influxdata.com/products/timestream-for-influxdb/\">InfluxDB</a> databases, without writing custom device-side code or using intermediate cloud services. AWS IoT Core is a fully managed service that securely connects billions of IoT devices to the AWS cloud, and routes IoT device data to AWS and third-party services.</p> \n<p>The new InfluxDB rule action automatically converts time-series data from your device to InfluxDB’s line protocol format and writes it to either an <a href=\"https://docs.aws.amazon.com/timestream/latest/developerguide/influxdb3.html\">Amazon Timestream</a> managed or a self-hosted InfluxDB cluster. The new rule action also supports the following two batching modes to help you optimize cost and throughput: device-side batching, where your devices send pre-batched payloads to AWS IoT Core; and server-side batching, where IoT rules engine aggregates individual messages before writing to InfluxDB. For example, a life sciences company can batch thousands of telemetry readings from scientific instruments at millisecond granularity and write directly to InfluxDB for monitoring, without building a custom data pipeline.</p> \n<p>To get started, connect your IoT devices to AWS IoT Core and define an InfluxDB rule action specifying the destination database, along with authentication and batching parameters. The InfluxDB rule action is available in all AWS Global Regions where Amazon Timestream for InfluxDB is available. To learn more, visit the AWS IoT Core <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/influxdb-rule-action.html\">developer guide</a>.</p>"
  "081cf5c26bb71434e97b3fd48df34d54":
    "id": "081cf5c26bb71434e97b3fd48df34d54"
    "title": "Capacity Reservation Resource Groups now support Amazon EC2 Capacity Blocks and interruptible Capacity Reservations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/capacity-reservation-resource-groups-ec2"
    "published": "2026-08-26 03:00:00"
    "fetched": "2026-08-26 08:21:04"
    "summary": "<p>Starting today, you can add Amazon EC2 Capacity Blocks for ML and interruptible Capacity Reservations to Capacity Reservation Resource Groups. Amazon EC2 offers different reservation offerings such as On-Demand Capacity Reservations (ODCRs), interruptible Capacity Reservations, and Capacity Blocks for ML. Previously, a Capacity Reservation Resource Group could only include ODCRs. Now you can add any type of Capacity Reservation to a Capacity Reservation Resource Group, making it easier to launch EC2 instances across your entire portfolio of reserved capacity.</p> \n<p>To use this feature, create a Capacity Reservation Resource Group, add any Capacity Reservation to it, and then target the group in your launch request. When using EC2 Fleet and EC2 Auto Scaling groups, you can also specify your prioritization preferences across reservation types, and configure automatic fall back to EC2 On-Demand capacity when there is no capacity remaining across your reservations.</p> \n<p>There are no additional charges for using this feature. This feature is available in all AWS Regions where Capacity Blocks for ML and interruptible ODCRs are supported, excluding AWS GovCloud (US) and China Regions.&nbsp;To get started, see <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/cr-groups.html\">Capacity Reservation Resource Groups</a> and the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html\">Capacity Reservations user guide</a>.</p>"
  "8a5f7dc46d2bb81121574993b904ca74":
    "id": "8a5f7dc46d2bb81121574993b904ca74"
    "title": "AWS Lambda MicroVMs now supports AWS PrivateLink"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/lambda-microvms-supports-privatelink"
    "published": "2026-08-26 01:34:00"
    "fetched": "2026-08-26 08:21:04"
    "summary": "<p>AWS Lambda MicroVMs now supports AWS PrivateLink, enabling private connectivity to Lambda MicroVMs directly from Amazon Virtual Private Cloud (VPC) resources without exposing traffic to the public internet. This launch helps regulated workloads in financial services, healthcare, and government meet strict network isolation requirements when building with Lambda MicroVMs.&nbsp;</p> \n<p>PrivateLink VPC Endpoints deliver private connectivity to AWS services from your VPC, ensuring that your traffic does not travel over the public internet when communicating with AWS services. Today's launch extends this capability to Lambda MicroVMs. Developers and IT teams needing private connectivity to Lambda MicroVMs can now create PrivateLink VPC Endpoints in their VPC to call MicroVM APIs (for example, to create MicroVM images or launch MicroVMs) and to connect to each MicroVM’s HTTP endpoint.</p> \n<p>PrivateLink VPC Endpoints for Lambda MicroVMs can be created using the AWS Management Console, AWS CLI, AWS CloudFormation, or the AWS SDKs. This feature is supported in all Regions where Lambda MicroVMs is available. Visit the <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region page</a> for the latest region availability.&nbsp;&nbsp;</p> \n<p>To learn more about using PrivateLink with Lambda MicroVMs, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/microvms-networking.html\">developer guide</a>.&nbsp;For pricing details, see <a href=\"https://aws.amazon.com/privatelink/pricing/\">AWS PrivateLink Pricing</a>. To learn more about configuring private connectivity for AWS services, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/interface-endpoints.html\">AWS PrivateLink developer guide</a>.&nbsp;</p> \n<p>&nbsp;</p>"
  "8f907d445089e1fe5e4d75dfa42e4beb":
    "id": "8f907d445089e1fe5e4d75dfa42e4beb"
    "title": "Amazon EC2 R8id instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-r8id/"
    "published": "2026-08-26 05:00:00"
    "fetched": "2026-08-27 03:55:35"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) R8id instances are now available in additional regions. R8id instances are now available in Asia Pacific (Mumbai, Malaysia, Sydney), Canada (Central), and Europe (Ireland, Stockholm).</p> \n<p>R8id instances feature up to 22.8TB of NVMe SSD local instance storage, 3x more than R6id, and provide up to 3.3x higher memory bandwidth, delivering up to 43% higher performance compared to R6id instances. They are ideal for memory-intensive workloads that benefit from high-performance local storage, including in-memory databases, real-time big data analytics, large in-memory caches, and data processing applications.<br /> <br /> Additionally, customers can now adjust the network and Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.</p> \n<p>Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the <a href=\"https://aws.amazon.com/ec2/instance-types/r8i/\">Amazon EC2 R8id page</a>.</p>"
  "326d1824441cdfee1491651ed6152dbe":
    "id": "326d1824441cdfee1491651ed6152dbe"
    "title": "Amazon EC2 C8id and M8id instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-c8id-m8id-aws-regions/"
    "published": "2026-08-26 05:00:00"
    "fetched": "2026-08-27 03:55:35"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) C8id and M8id instances with up to 22.8 TB of local NVMe-based SSD block-level storage are now available in additional regions. C8id instances are now available in Asia Pacific (Sydney) and Canada (Central) and M8id instances are available in Asia Pacific (Mumbai) and Canada (Central).</p> \n<p>Amazon EC2 C8id and M8id instances offer 3 times more vCPUs, memory and local storage compared to previous sixth-generation instances. These instances deliver up to 43% higher compute performance and 3.3 times more memory bandwidth compared to previous sixth-generation C6id and M6id instances. They also deliver up to 46% higher performance for I/O intensive database workloads, and up to 30% faster query results for I/O intensive real-time data analytics compared to previous sixth generation instances.<br /> </p> \n<ul> \n <li><p><b>C8id instances</b> are ideal for compute-intensive workloads, including those that need access to high-speed, low-latency local storage like video encoding, image manipulation, and other forms of media processing.</p> </li> \n <li><p><b>M8id instances</b> are best for workloads that require a balance of compute and memory resources along with high-speed, low-latency local block storage, including data logging, media processing, and medium-sized data stores.</p> </li> \n</ul> \n<p>Additionally, customers can now adjust the network and Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.</p> \n<p>Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\">Amazon EC2 C8id</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\">Amazon EC2 M8id</a> pages.</p>"
