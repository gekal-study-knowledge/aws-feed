  この日は AWS Glue 6.0 の一般提供が最大のニュースです。Apache Spark 4.1・Python 3.12・Scala 2.13 による完全刷新されたランタイム上に構築され、従来より 30% 低価格になったうえ Apache Iceberg v3 を完全サポートします。あわせて OpenAI が GPT-5.6 Sol の API 価格を引き下げ、Terra と Luna に続く値下げとして Bedrock 側の価格も低下しました。アーキテクチャブログでは DynamoDB のネイティブベクトル検索を使い、ベクトル埋め込みと運用データを単一テーブルに保持する統合 AI エージェントアーキテクチャが紹介されています。機械学習ブログでは RAG のコストを下げるクエリ考慮型の圧縮手法、AgentCore Gateway による AI エージェントのツールアクセス統制 (4 段階の成熟度モデル)、Bronze-Silver-Gold のデータ工程を自動化する Agentic Data Operations Platform が公開されました。AWS Neuron 2.32 では NKI 0.6.0 と MXFP8 学習カーネルが導入されています。
