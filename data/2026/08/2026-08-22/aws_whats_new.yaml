  "620a56111a7bbad69974e2c137311032":
    "id": "620a56111a7bbad69974e2c137311032"
    "title": "AWS Deadline Cloud now tracks automatic download status in the Deadline Cloud Monitor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-deadline-cloud-auto-download-status-tracking/"
    "published": "2026-08-22 03:00:00"
    "fetched": "2026-08-22 04:22:06"
    "summary": "<p>The AWS Deadline Cloud monitor now shows the progress, status, and health of your automatic file downlaods from jobs running in the cloud. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming. The Deadline Cloud Monitor (DCM) desktop app provides customers with visibility into their render environments, jobs, resources, and costs. Now, customers can also use the monitor to confirm that automatically configured job outputs successfully downloaded to their destination drive.</p> \n<p>With this update, the monitor app introduces a new Download status column at both the job and task level, showing download progress and confirming when all output files are available on your drive. An indicator displays how current that status is. If files are unavailable for any reason, the app surfaces clear guidance on next steps. This eliminates manual drive verification and helps teams confidently confirm output availability before downstream tasks begin, particularly valuable in large-scale render pipelines where manual file checking is impractical.</p> \n<p>To learn more about AWS Deadline Cloud and the new automatic download status feature in the Deadline Cloud Monitor desktop app, visit https://aws.amazon.com/deadline-cloud/.</p>"
  "2cbdc4a5725649f950c0dc073d2ff2bc":
    "id": "2cbdc4a5725649f950c0dc073d2ff2bc"
    "title": "AWS Glue 6.0 delivers 30% price reduction and Iceberg v3 support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-glue-6-0-price-reduction-iceberg-v3"
    "published": "2026-08-22 01:42:00"
    "fetched": "2026-08-22 04:22:06"
    "summary": "<p>AWS Glue 6.0 is now generally available, delivering a 30% price reduction and introducing full support for Apache Iceberg v3, newer versions of Apache Hudi and Delta Lake, and new capabilities to improve developer productivity. AWS Glue 6.0 also upgrades runtime to Apache Spark 4.1, Python 3.13, and Scala 2.13.</p> \n<p>With Apache Iceberg v3, AWS Glue 6.0 adds the VARIANT data type with automatic shredding for faster reads on semi-structured data, deletion vectors for high-performance row-level updates, geometry and geography data types for spatial processing, and flexible schema evolution through UNKNOWN data type and DEFAULT column values. Glue 6.0 also introduces features that boost developer productivity and performance, such as Spark Declarative Pipelines that eliminate repetitive orchestration code, Real-Time Mode streaming for sub-second latencies, and Arrow-native Python UDFs for improved PySpark performance. These capabilities help you implement large-scale ETL, recurring batch workloads, streaming analytics, and AI application development using AWS Glue.</p> \n<p>AWS Glue 6.0 is available in all AWS Commercial, AWS GovCloud (US), and AWS China regions.</p> \n<p>To get started, select Glue 6.0 from the version dropdown in the AWS Glue console or SageMaker Unified Studio when creating a new job, or migrate existing jobs using the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/upgrade-analysis.html\">Spark Upgrade Agent</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html\">AWS Glue documentation</a> and <a href=\"https://aws.amazon.com/glue/pricing/\">AWS Glue pricing</a>.</p>"
  "423056dfd12109e3d1092404eb59fdd0":
    "id": "423056dfd12109e3d1092404eb59fdd0"
    "title": "Amazon Connect Customer now lets managers chat with their data"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-customer-ai-data-analytics"
    "published": "2026-08-22 05:00:00"
    "fetched": "2026-08-22 06:19:25"
    "summary": "<p>Amazon Connect Customer now lets managers chat with their data in plain language and get back the answer, the evidence behind it, and the fix, in seconds. Managers have always had the data. What they haven’t had is the time to dig through dashboards, find what’s driving performance, and decide what to do next. Now Amazon Connect Customer does that work for them. It searches across more than 150 metrics spanning self-service, agent performance, and queue performance to find what matters, explain why, and recommend the best next step.&nbsp;<br /> &nbsp;<br /> Managers can start broad and go deep in the same conversation. For example, a manager can ask which queues are the best candidates for automation, and Amazon Connect Customer reviews where handle time and after-contact work run highest, then returns a prioritized list with confidence scores and projected impact. What once required analysts, dashboards, and weeks of investigation now becomes a prioritized action plan in seconds.&nbsp;<br /> &nbsp;<br /> This feature is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">Amazon Connect Customer</a> AI Agents are supported. To learn more, visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/manager-assistant.html\">product documentation</a>.&nbsp;</p>"
  "570a78cf214312997bf6ee8681e2e890":
    "id": "570a78cf214312997bf6ee8681e2e890"
    "title": "Amazon EKS Capability for Argo CD now supports custom configuration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-eks-argo-cd-configuration"
    "published": "2026-08-22 02:00:00"
    "fetched": "2026-08-22 08:18:41"
    "summary": "<p>The Amazon Elastic Kubernetes Service (Amazon EKS) Capability for Argo CD now supports custom configuration through a standard argocd-cm ConfigMap in your cluster. This capability gives you a fully managed GitOps continuous delivery experience, and you can now tune it to fit how your teams work. You can define custom health checks for your Custom Resources, customize the Argo CD UI banner content, adjust how the capability watches and compares the resources it manages, and more. You configure these settings the same way you do in upstream Argo CD, and AWS applies them to your managed capability.</p> \n<p>With this launch, cluster administrators now have more control over how Argo CD reports application health. By default, Argo CD has no built-in health logic for Custom Resources, so an Application can report as healthy while its resources are still provisioning, and sync waves can advance before those resources are ready. With a custom health check, you define this logic yourself. For example, a health check for a database resource can hold an Application at progressing until the database is ready. The capability also includes built-in health checks for AWS Controllers for Kubernetes (ACK) and kro (Kube Resource Orchestrator) resources, so these report accurate health with no additional configuration.</p> \n<p>You can configure the EKS Capability for Argo CD in all AWS Regions where the capability is available. To learn more, see <a href=\"https://aws.amazon.com/eks/\">Amazon EKS</a> and <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/argocd-configure-settings.html\">Configure Argo CD settings</a> in the Amazon EKS User Guide.</p> \n<h4>&nbsp;</h4>"
  "9cd7d740e6a9ee005a12dafc6f86eb06":
    "id": "9cd7d740e6a9ee005a12dafc6f86eb06"
    "title": "Amazon Bedrock announces reduced pricing for OpenAI GPT-5.6 Sol"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/bedrock-openai-gpt-56-sol-reduced-pricing/"
    "published": "2026-08-22 05:11:00"
    "fetched": "2026-08-22 11:18:17"
    "summary": "<p>Today, OpenAI announced that they are lowering API prices for GPT-5.6 Sol. Following the recent Terra and Luna price reductions, Sol now costs $4 per million input tokens and $20 per million output tokens—20% lower input pricing and 33.3% lower output pricing. This promotional pricing is available at least through November 21, 2026.</p> \n<p><br /> Whether you're building autonomous coding agents, running complex multi-step analyses, or performing advanced research workflows, the reduced pricing gives you more room to experiment and scale what's already working. GPT-5.6 Sol delivers state-of-the-art results on agentic coding benchmarks, and the lower price point makes it more accessible for sustained, high-volume workloads.</p> \n<p><br /> For latest Regional availability of GPT-5.6 Sol, check the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions</a> page. To learn more and view the pricing visit the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-56-sol.html\">Amazon Bedrock documentation</a> on GPT-5.6 Sol.</p>"
  "602dc34cb586bbfc9f741cdb798eb5d5":
    "id": "602dc34cb586bbfc9f741cdb798eb5d5"
    "title": "AWS Neuron 2.32 introduces expanded NKI programming, MXFP8 training kernels, and variable-size collectives for Trn2 and Trn"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-announce-neuron-2-32-0"
    "published": "2026-08-22 06:11:00"
    "fetched": "2026-08-25 07:20:52"
    "summary": "<p>AWS Neuron 2.32.0 is now available, introducing NKI 0.6.0 with an on-device top-K instruction, a variable-length `all-gather `for kernels whose ranks hold differently sized tensors, and new loop constructs for data-dependent iteration. &nbsp;</p> \n<p>This release also introduces 13 new NKI Library kernels for Mixture of Experts (MoE) training and sparse attention, and a new Neuron Agentic Development skill that ports transformer models to the vLLM Neuron plugin. The NKI Library kernels cover context encoding for DeepSeek-V3.2 sparse multi-head latent attention, MXFP8 attention for the decode step, and a matched MXFP8 forward and backward pass that lets blockwise MoE layers train end to end in MXFP8, with PyTorch reference implementations for 22 additional kernels. &nbsp;</p> \n<p>The Neuron Runtime adds variable-size all-gather, reduce-scatter, and all-to-all collectives on Trn2 and Trn3, letting each rank contribute or receive a different number of elements. The vLLM Neuron plugin moves to vLLM 0.24.0 and is included in all Neuron Deep Learning AMIs and Deep Learning Containers. The Neuron Compiler adds explicit control over 64-bit integer compilation, and Neuron Explorer adds per-core host CPU utilization to the System Trace Viewer.</p> \n<p>AWS Neuron is available in all AWS Regions where Amazon EC2 Trn1, Trn2, Trn3, Inf2, and Inf1 instances are available. For more information about Regional availability, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region table</a>.</p> \n<p>To get started, see the following resources:</p> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/release-notes/index.html\">AWS Neuron 2.32.0 Release Notes</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/index.html\">Neuron Kernel Interface (NKI) Documentation</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://awsdocs-neuron.readthedocs-hosted.com/en/latest/tools/neuron-agentic-development/index.html\">Neuron Agentic Development</a></p> </li> \n</ul> \n<ul> \n <li><p><a href=\"https://aws.amazon.com/ai/machine-learning/neuron/\">AWS Neuron</a></p> </li> \n</ul>"
"last_updated": "2026-08-25 07:20:52 JST"
