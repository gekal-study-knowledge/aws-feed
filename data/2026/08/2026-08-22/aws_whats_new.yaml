    "title": "AWS Deadline Cloud now tracks automatic download status in the Deadline Cloud Monitor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-deadline-cloud-auto-download-status-tracking/"
    "published": "2026-08-22 03:00:00"
    "fetched": "2026-08-22 04:22:06"
    "summary": "<p>The AWS Deadline Cloud monitor now shows the progress, status, and health of your automatic file downlaods from jobs running in the cloud. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming. The Deadline Cloud Monitor (DCM) desktop app provides customers with visibility into their render environments, jobs, resources, and costs. Now, customers can also use the monitor to confirm that automatically configured job outputs successfully downloaded to their destination drive.</p> \n<p>With this update, the monitor app introduces a new Download status column at both the job and task level, showing download progress and confirming when all output files are available on your drive. An indicator displays how current that status is. If files are unavailable for any reason, the app surfaces clear guidance on next steps. This eliminates manual drive verification and helps teams confidently confirm output availability before downstream tasks begin, particularly valuable in large-scale render pipelines where manual file checking is impractical.</p> \n<p>To learn more about AWS Deadline Cloud and the new automatic download status feature in the Deadline Cloud Monitor desktop app, visit https://aws.amazon.com/deadline-cloud/.</p>"
  "2cbdc4a5725649f950c0dc073d2ff2bc":
    "id": "2cbdc4a5725649f950c0dc073d2ff2bc"
    "title": "AWS Glue 6.0 delivers 30% price reduction and Iceberg v3 support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-glue-6-0-price-reduction-iceberg-v3"
    "published": "2026-08-22 01:42:00"
    "fetched": "2026-08-22 04:22:06"
    "summary": "<p>AWS Glue 6.0 is now generally available, delivering a 30% price reduction and introducing full support for Apache Iceberg v3, newer versions of Apache Hudi and Delta Lake, and new capabilities to improve developer productivity. AWS Glue 6.0 also upgrades runtime to Apache Spark 4.1, Python 3.13, and Scala 2.13.</p> \n<p>With Apache Iceberg v3, AWS Glue 6.0 adds the VARIANT data type with automatic shredding for faster reads on semi-structured data, deletion vectors for high-performance row-level updates, geometry and geography data types for spatial processing, and flexible schema evolution through UNKNOWN data type and DEFAULT column values. Glue 6.0 also introduces features that boost developer productivity and performance, such as Spark Declarative Pipelines that eliminate repetitive orchestration code, Real-Time Mode streaming for sub-second latencies, and Arrow-native Python UDFs for improved PySpark performance. These capabilities help you implement large-scale ETL, recurring batch workloads, streaming analytics, and AI application development using AWS Glue.</p> \n<p>AWS Glue 6.0 is available in all AWS Commercial, AWS GovCloud (US), and AWS China regions.</p> \n<p>To get started, select Glue 6.0 from the version dropdown in the AWS Glue console or SageMaker Unified Studio when creating a new job, or migrate existing jobs using the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/upgrade-analysis.html\">Spark Upgrade Agent</a>. To learn more, visit the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/migrating-version-60.html\">AWS Glue documentation</a> and <a href=\"https://aws.amazon.com/glue/pricing/\">AWS Glue pricing</a>.</p>"
"last_updated": "2026-08-22 04:22:06 JST"
