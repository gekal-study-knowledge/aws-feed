  "1bec6dd60ff56cb80094fbba128778ea":
    "id": "1bec6dd60ff56cb80094fbba128778ea"
    "title": "Issue with FreeRTOS-Kernel - CVE-2026-77234, CVE-2026-77235, CVE-2026-77236, CVE-2026-77237"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-086-aws/"
    "published": "2026-08-22 02:59:03"
    "fetched": "2026-08-22 03:30:20"
    "summary": "<p><b>Bulletin ID:</b> 2026-086-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/21/2026 10:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>FreeRTOS-Kernel is a real-time operating system kernel for microcontrollers and small microprocessors. AWS identified four issues with FreeRTOS-Kernel, affecting multiple versions.<br /> - CVE-2026-77234: This issue affects configurations that use the FreeRTOS MPU together with software timers; applications that do not use the FreeRTOS MPU are not affected.<br /> - CVE-2026-77235: This issue affects ARM TrustZone (ARMv8-M) configurations; applications that do not use ARM TrustZone secure contexts are not affected.<br /> - CVE-2026-77236: This issue affects ARM TrustZone (ARMv8-M) configurations; applications that do not use ARM TrustZone secure contexts are not affected.<br /> - CVE-2026-77237: This issue affects builds with queue sets enabled; applications built without queue sets are not affected.</p> \n<p><b>Impacted versions:</b><br /> - CVE-2026-77234: &gt;=7.0.0 AND &lt;=11.3.0 (MPU-enabled ports)<br /> - CVE-2026-77235: &gt;=10.2.0 AND &lt;=11.3.0 (ARMv8-M ports with TrustZone + MPU)<br /> - CVE-2026-77236: &gt;=10.2.0 AND &lt;=11.3.0 (ARMv8-M ports with TrustZone)<br /> - CVE-2026-77237: &gt;=7.4.0 AND &lt;=11.3.0 (MPU-enabled ports with configUSE_QUEUE_SETS=1)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "c2d50134969e7dbcb72f30b6eb79a4cf":
    "id": "c2d50134969e7dbcb72f30b6eb79a4cf"
    "title": "CVE-2026-77811 - Stored Cross-Site Scripting via Integration Template Asset in OpenSearch Dashboards"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-088-aws/"
    "published": "2026-08-22 05:12:14"
    "fetched": "2026-08-22 05:20:20"
    "summary": "<p><b>Bulletin ID:</b> 2026-088-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/21/2026 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon OpenSearch Service is a managed service that makes it easy to deploy, operate, and scale OpenSearch clusters. We identified CVE-2026-77811, a stored cross-site scripting issue in the dashboards-observability plugin in OpenSearch Dashboards. Improper input validation in the integrations static file endpoint allows a remote authenticated actor with write permissions to OpenSearch Dashboards saved objects to upload a custom integration containing arbitrary JavaScript. When another user accesses the static file endpoint directly, the script executes in their browser session and can perform actions on their behalf, including making API calls to OpenSearch with their privileges.</p> \n<p><b>Affected products &amp; versions:</b><br /></p> \n<p><u>OpenSearch Dashboards dashboards-observability plugin (open-source, self-managed):</u><br /> - Affected: versions before 3.4 and versions before 2.19.6<br /> - Fixed: versions 3.4 and 2.19.6</p> \n<p><u>Amazon OpenSearch Service (AWS Managed):</u><br /> - Affected: versions before 3.3<br /> - Fixed: fixed in all affected versions (via service software update)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "97472d0f6807c77e222f1ae9894bff75":
    "id": "97472d0f6807c77e222f1ae9894bff75"
    "title": "CVE-2026-77810 - Issue with Athena Federated Query Neptune Connector"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-087-aws/"
    "published": "2026-08-22 04:42:12"
    "fetched": "2026-08-22 05:20:20"
    "summary": "<p><b>Bulletin ID:</b> 2026-087-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/21/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon Athena is a serverless, interactive query service that lets you analyze data directly in Amazon S3 using standard SQL. Athena Query Federation is a feature that allows you to connect to data sources outside of Amazon S3 like DynamoDB, Azure Synapse, and custom connectors using standard SQL syntax. These connectors are open source and deployed to the Athena service on a regular basis.</p> \n<p>We identified CVE-2026-77810, in the Neptune connector where a user with access to Neptune through Athena Federated Query could gain access to properties in the Lambda supplying the compute for the connector.</p> \n<p><b>Impacted versions:</b> &lt;=v2026.28.1 AND &gt;=v2024.15.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
