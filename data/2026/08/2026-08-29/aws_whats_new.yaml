"entries":
  "b9a80ceb4d8fbc3c1a6e6d948e455c78":
    "id": "b9a80ceb4d8fbc3c1a6e6d948e455c78"
    "title": "AWS Transform now in scope for FedRAMP Class C"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-transform-fedramp-class-c/"
    "published": "2026-08-29 04:45:00"
    "fetched": "2026-08-29 05:39:35"
    "summary": "<p>AWS Transform is now in scope for FedRAMP Class C (formerly Moderate baseline) in the US East (Ohio) Region. You can now use AWS Transform to build applications and run workloads that are subject to FedRAMP Class C compliance requirements.</p> \n<p>The Federal Risk and Authorization Management Program (FedRAMP) is a US government-wide program that delivers a standard approach to the security assessment, authorization, and continuous monitoring for cloud products and services. <a href=\"https://aws.amazon.com/transform\">AWS Transform</a> is an agentic migration and modernization service designed to compress enterprise timelines from years to months — handling everything from large-scale infrastructure migrations to continuous tech debt reduction, without the manual handoffs and lost context that commonly stall these programs.</p> \n<p>To learn more about <a href=\"https://aws.amazon.com/compliance/fedramp/\">FedRAMP</a>, visit the <a href=\"https://aws.amazon.com/compliance/services-in-scope/FedRAMP/\">AWS services in scope page</a>. To learn more about AWS Transform, visit the <a href=\"https://aws.amazon.com/transform/\">webpage</a> and <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html\">documentation</a>.</p>"
  "30e74331e4d0a973f3c20e7a0e9ecc0d":
    "id": "30e74331e4d0a973f3c20e7a0e9ecc0d"
    "title": "Amazon EC2 P6-B300 instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-p6-b300-instances-available-additional-regions"
    "published": "2026-08-29 02:34:00"
    "fetched": "2026-08-29 05:39:35"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in Asia Pacific (Hyderabad) and South America (Sao Paulo) Regions. P6-B300 instances provide 8xNVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.</p> \n<p>P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) and large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads. &nbsp;</p> \n<p>P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon), AWS GovCloud (US-East), US East (N. Virginia), Asia Pacific (Hyderabad, Seoul), and South America (Sao Paulo). To learn more about P6-B300 instances, visit <a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6 instances.</a></p>"
  "a43d49cbe721629c9720a457ccfa4469":
    "id": "a43d49cbe721629c9720a457ccfa4469"
    "title": "Amazon Aurora MySQL 3.13 (compatible with MySQL 8.0.45) is generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-aurora-mysql-313-available/"
    "published": "2026-08-29 01:00:00"
    "fetched": "2026-08-29 05:39:35"
    "summary": "<p>Starting today, Amazon Aurora MySQL-Compatible Edition 3 (compatible with MySQL 8.0) supports MySQL 8.0.45, which includes community MySQL fixes and Aurora-specific improvements. For detailed information on this release, refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraMySQLReleaseNotes/AuroraMySQL.Updates.30Updates.html\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora MySQL 3</a> and <a href=\"https://dev.mysql.com/doc/relnotes/mysql/8.0/en/news-8-0-45.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL 8.0.45</a> release notes.<br /> <br /> You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Updates.AMVU.html\" rel=\"noopener noreferrer\" target=\"_blank\">automatic minor version upgrades</a> and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate upgrades across your clusters in phases. You can perform minor version upgrades in-place or via snapshot restore. This release is supported in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.RegionsAndAvailabilityZones.html#Aurora.Overview.Availability.MySQL\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora MySQL is available.<br /> <br /> <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> is designed for high performance and availability at global scale with full MySQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at Aurora’s <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.&nbsp;</p>"
  "a1f72e4fec123cd4f04773f0c36ede69":
    "id": "a1f72e4fec123cd4f04773f0c36ede69"
    "title": "Amazon CloudWatch agent adds support for journald logs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cloudwatch-agent-journald/"
    "published": "2026-08-29 01:00:00"
    "fetched": "2026-08-29 05:39:35"
    "summary": "<p>AWS announces support for collecting systemd journal (journald) logs with the Amazon CloudWatch agent. You can now configure the CloudWatch agent to read log entries directly from the systemd journal on Linux instances and send them to Amazon CloudWatch Logs, without first writing those logs to files on disk.</p> \n<p>Many modern Linux distributions, including Amazon Linux 2023, use systemd journal as the primary logging system and no longer write traditional text log files such as /var/log/messages by default. Previously, collecting these logs with the CloudWatch agent required additional configuration to export the journal to files on disk. With this launch, the CloudWatch agent reads journald entries natively, preserving the structured metadata that journald captures, such as the systemd unit, priority, and process information. You can filter log entries using systemd units, journal priority levels, and journal field matches, and you can apply regular expression filters before logs are published to CloudWatch Logs. This helps you reduce noise and control log volume and costs.</p> \n<p>Support for journald in the CloudWatch agent is available in all AWS Commercial Regions and GovCloud(US) regions. Standard Amazon CloudWatch Logs pricing applies for ingested logs. For more information, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch Pricing page</a>.</p> \n<p>To get started, update to the latest version of the CloudWatch agent and add a journald section to your agent configuration file. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html\">Manually create or edit the CloudWatch agent configuration file</a> in the Amazon CloudWatch User Guide.</p>"
  "ca18d61e1a83e6e991dd52d47890b3a7":
    "id": "ca18d61e1a83e6e991dd52d47890b3a7"
    "title": "Amazon EC2 C8gn instances are now available in AWS Europe (Paris) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-c8gn-europe-paris/"
    "published": "2026-08-29 07:00:00"
    "fetched": "2026-08-29 12:02:54"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances, powered by the latest-generation AWS Graviton4 processors, are available in the AWS Europe (Paris) region. The C8gn instances provide up to 30% better compute performance than Graviton3-based Amazon EC2 C7gn instances. Amazon EC2 C8gn instances feature the latest 6th generation AWS Nitro Cards, and offer up to 600 Gbps network bandwidth, the highest network bandwidth among network optimized EC2 instances.&nbsp;</p> \n<p>Take advantage of the enhanced networking capabilities of C8gn to scale performance and throughput, while optimizing the cost of running network-intensive workloads such as network virtual appliances, data analytics, CPU-based artificial intelligence and machine learning (AI/ML) inference.&nbsp;</p> \n<p>For increased scalability, C8gn instances offer instance sizes up to 48xlarge, up to 384 GiB of memory, and up to 120 Gbps of bandwidth to Amazon Elastic Block Store (EBS). C8gn instances support Elastic Fabric Adapter (EFA) networking on the 16xlarge, 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes, which enables lower latency and improved cluster performance for workloads deployed on tightly coupled clusters.&nbsp;</p> \n<p>C8gn instances are available in the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon, N.California), Europe (Frankfurt, Stockholm, Ireland, London, Spain, Zurich, Milan, Paris), Asia Pacific (Singapore, Malaysia, Sydney, Thailand, Mumbai, Seoul, Melbourne, Jakarta, Hyderabad, Tokyo, Hong Kong), Middle East (UAE), Africa (Cape Town), Canada West (Calgary, Central), South America (Sao Paulo), AWS GovCloud (US-East, US-West).<br /> &nbsp;<br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon C8gn Instances</a>. To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>.</p> \n<p><a href=\"https://signin.aws.amazon.com/signup?request_type=register\">&nbsp;</a></p>"
  "d3590dcd2817d38b5a2b2033e7212781":
    "id": "d3590dcd2817d38b5a2b2033e7212781"
    "title": "Amazon Bedrock AgentCore Memory now supports fine-grained access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/agentcorememory-fine-grained-access-control"
    "published": "2026-08-29 05:00:00"
    "fetched": "2026-08-29 12:02:54"
    "summary": "<p>Amazon Bedrock AgentCore Memory now supports fine-grained access control (FGAC), enabling you to enforce per-user and per-tenant memory isolation through AgentCore Gateway without building custom authorization logic.</p> \n<p><br /> With FGAC, you can front your Memory resource with an AgentCore Gateway configured for OAuth (JWT) authentication and attach Cedar policies that restrict access based on the authenticated caller's identity. You can enforce that each user only accesses their own actor's data, restrict memory records to namespaces derived from the user's token claims, and allow or deny specific Memory operations per caller. This lets you move access control enforcement from application code to the infrastructure layer using cryptographic proof of identity. FGAC for Memory is built on the AgentCore Memory connector, a managed gateway connector that wires a gateway target to the Memory data plane and exposes 12 Memory operations as Cedar actions with their request attributes available for policy conditions.</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-gateway-fgac.html\">Fine-grained access control for Memory</a> in the Amazon Bedrock AgentCore Developer Guide.</p>"
  "5aab8b8c4e335e73fa1947e516ee71a8":
    "id": "5aab8b8c4e335e73fa1947e516ee71a8"
    "title": "Amazon Bedrock AgentCore Memory now supports flexible namespace variables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/agentcorememory-flexible-namespaces"
    "published": "2026-08-29 05:00:00"
    "fetched": "2026-08-29 12:02:54"
    "summary": "<p>Amazon Bedrock AgentCore Memory now lets developers define flexible namespace variables to scope long-term memories along any application-specific dimension - such as organization, tenant, team, or environment - without creating duplicate strategies or overloading built-in variables. This gives multi-tenant and complex-hierarchy applications fine-grained control over how memories are organized, isolated, and accessed.<br /> <br /> Define keys on the memory resource, reference them in a strategy's namespace template, and supply values at runtime through the CreateEvent API. The service substitutes them into namespace templates during long-term memory extraction. Up to five keys can be defined per memory resource, each referenceable across multiple strategies.<br /> <br /> Flexible namespace variables are available today in all AWS Regions where Amazon Bedrock AgentCore Memory is generally available, at no additional cost. To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/specify-long-term-memory-organization.html\">Specify long-term memory organization with namespaces</a> in the Amazon Bedrock AgentCore Developer Guide.</p>"
  "f1c7629bbc8d3e17c3ebfa049d77f1dc":
    "id": "f1c7629bbc8d3e17c3ebfa049d77f1dc"
    "title": "Amazon EMR on EKS now supports job run concurrency controls"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-emr-eks/"
    "published": "2026-08-29 02:08:00"
    "fetched": "2026-09-01 02:49:38"
    "summary": "<p>Amazon EMR on EKS lets you run open-source big data frameworks such as Apache Spark and Flink on AWS EKS(Elastic Kubernetes Service) clusters. You submit jobs to a virtual cluster, which maps to a namespace on an EKS cluster, and EMR on EKS handles packaging, scheduling, and running your applications. Today, we are excited to announce job run admission control on EMR EKS with support for job run concurrency and backpressure signals from StartJobRun API. </p> \n<p>With this launch, you can now set concurrent job limits on a virtual cluster, giving you fine-grained control over how many job runs execute at once and how many can wait in queue. This is a logical queue representing jobs in PENDING/SUBMITTED state. These controls help you protect shared EKS clusters from being overloaded in multi-tenant shared environments and avoid noisy-neighbor scheduling failures, so your critical workloads keep running predictably even under heavy demand.&nbsp;You configure two optional limits on a virtual cluster: maxConcurrentJobRuns, the maximum number of jobs running at any time, and maxInQueueJobRuns, the maximum queue depth for job runs that EMR on EKS has accepted but not yet started running. When the queue is full, StartJobRun returns an HTTP ValidationException, so you can gracefully shed or reroute traffic to another cluster instead of overwhelming a single one. You can view current limits and live job counts at any time with DescribeVirtualCluster. No limits are applied by default, so existing workloads are unaffected until you opt in.&nbsp;</p> \n<p>Concurrent job limits are available in all AWS Regions where EMR on EKS is offered. To get&nbsp;started, see <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/virtual-cluster.html#virtual-cluster-job-concurrency-limits\">managing virtual clusters. </a></p>"
  "0a21b50344abeea610a73a79efed6b3a":
    "id": "0a21b50344abeea610a73a79efed6b3a"
    "title": "Amazon Kinesis Data Streams announces data delivery to general purpose Amazon S3 buckets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/kinesis/data-delivery-general-purpose-s3-buckets"
    "published": "2026-08-29 15:47:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Amazon Kinesis Data Streams now delivers streaming data directly to general purpose Amazon S3 buckets, providing the easiest way to ingest and deliver streaming data to S3 without building or managing delivery pipelines. S3 general purpose delivery reduces data delivery costs by up to 60% compared to self-managed alternatives.</p> \n<p>Amazon Kinesis Data Streams is a serverless streaming data service that makes it easy to capture, process, and store data streams at any scale. Customers commonly deliver streaming data to Amazon S3 for downstream batch analytics, log delivery, compliance retention, and replay. To do this today, customers either chain multiple serverless services together, adding cost and configuration complexity, or build custom consumer applications on self-managed compute, handling scaling, retries, and operating infrastructure that grows costly as workloads increase. With S3 general purpose delivery, customers configure delivery in a few clicks from the console or via APIs, with no additional services to chain, no custom applications, no self-managed compute, and no operational overhead. Kinesis Data Streams automatically handles scaling, retries, and delivery reliability, and delivers in minutes.</p> \n<p>S3 general purpose delivery supports On Demand Advantage (ODA) and On Demand Standard (ODS) capacity modes with usage-based pricing, no setup fees or minimum commitments. You are only charged for successfully delivered data. S3 general purpose delivery is available in all AWS Regions where Amazon Kinesis Data Streams is available, including AWS GovCloud (US) and China regions. To get started, see the <a href=\"https://docs.aws.amazon.com/streams/latest/dev/\">Amazon Kinesis Data Streams User Guide</a> and the <a href=\"https://aws.amazon.com/kinesis/data-streams/pricing/\">pricing page</a>.</p>"
  "a7c7bbc670e89aeb92942c60f33d248f":
    "id": "a7c7bbc670e89aeb92942c60f33d248f"
    "title": "Amazon Kinesis Data Streams announces streaming tables, delivering data to Apache Iceberg tables on Amazon S3 Tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/kinesis/data-delivery-s3-tables"
    "published": "2026-08-29 08:34:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Amazon Kinesis Data Streams introduces streaming tables, a new fully serverless capability that continuously delivers data from Kinesis streams to Amazon S3 Tables in Apache Iceberg format. Streaming tables eliminate the need to build and operate self-managed Iceberg delivery pipelines, reducing data delivery costs by up to 50%. Intelligent inline compaction eliminates the small file problem and keeps query performance predictable, reducing downstream query costs by up to 30%.</p> \n<p>Amazon Kinesis Data Streams is a serverless streaming data service that makes it easy to capture, process, and store data streams at any scale. Customers increasingly want to deliver streaming data to Apache Iceberg tables to power near real time analytics and AI/ML feature pipelines using the freshest data. To do this today, customers build and manage custom pipelines, handle format conversions, and manage compute infrastructure, adding to their costs. High volume streaming ingestion also creates many small Parquet files that degrade downstream query performance and increase storage costs. With streaming tables, customers simply create a streaming table, a fully serverless capability that continuously delivers data from a Kinesis stream to Amazon S3 Tables. Intelligent inline compaction eliminates the performance impact of small files and keeps query performance predictable without sacrificing data freshness. Kinesis Data Streams automatically handles scaling, retries, compaction, and delivery reliability, and delivers in minutes, no custom applications, no self-managed compute, and no operational overhead. Customers configure streaming tables in a few clicks from the console as an integrated experience or via APIs.</p> \n<p>Streaming tables support On Demand Advantage (ODA) and On Demand Standard (ODS) capacity modes with usage-based pricing, no setup fees or minimum commitments. You are only charged for successfully delivered data. Streaming tables are available in all AWS Regions where Amazon Kinesis Data Streams is available, including AWS GovCloud (US) and China regions. To get started, see the <a href=\"https://docs.aws.amazon.com/streams/latest/dev/\">Amazon Kinesis Data Streams User Guide</a> and the <a href=\"https://aws.amazon.com/kinesis/data-streams/pricing/\">pricing page</a>.</p>"
"last_updated": "2026-09-01 10:35:03 JST"
