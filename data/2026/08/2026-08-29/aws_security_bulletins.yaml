    "title": "CVE-2026-81838 - Zip Slip path traversal in awsdac (diagram-as-code)"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-090-aws/"
    "published": "2026-08-29 01:50:52"
    "fetched": "2026-08-29 05:39:37"
    "summary": "<p><b>Bulletin ID:</b> 2026-090-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/27/2026 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>awsdac (diagram-as-code) is a CLI tool that generates AWS architecture diagrams from YAML definitions, enabling version-controlled, code-driven diagramming. We identified CVE-2026-81838, a Zip Slip (path traversal) issue. When awsdac extracts a zip archive referenced by a ZipFile resource in a definition file, a crafted archive can write files outside the intended cache directory, to any path writable by the user running awsdac. Depending on the file written, this can lead to arbitrary code execution.</p> \n<p>Leveraging this issue requires processing a definition file from an untrusted source. This can occur when:<br /> - awsdac is run without definition trust restrictions (versions prior to 0.22.4 had no trust distinction; version 0.22.4 and later require the −−allow−untrusted−definitions flag), or<br /> - a definition file is loaded from the local filesystem ('Type: LocalFile'), which bypasses the definition URL allowlist.</p> \n<p>CI/CD environments that process definition files from untrusted or semi-trusted sources are the primary risk scenario.</p> \n<p>awsdac is a client-side CLI tool that renders architecture diagrams locally. This issue does not affect any AWS service, AWS account, or customer data. The impact is limited to the machine on which awsdac runs.</p> \n<p><b>Impacted versions:</b> awsdac: versions 0.10 through 0.23 (inclusive)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "67c97d9c509eeb87304a2a0f947fd281":
    "id": "67c97d9c509eeb87304a2a0f947fd281"
    "title": "CVE-2026-81849 - Path traversal in the aws:downloadContent plugin in amazon-ssm-agent"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-091-aws/"
    "published": "2026-08-29 03:06:52"
    "fetched": "2026-08-29 05:39:37"
    "summary": "<p><b>Bulletin ID:</b> 2026-091-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/28/2026 11:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS Systems Manager Agent (amazon-ssm-agent) is Amazon software that runs on Amazon Elastic Compute Cloud (Amazon EC2) instances, edge devices, on-premises servers, and virtual machines (VMs). Amazon-ssm-agent makes it possible for Systems Manager to update, manage, and configure these resources. We identified CVE-2026-81849, where an improper limitation of a pathname to a restricted directory in the aws:downloadContent plugin in amazon-ssm-agent before 3.3.4515.0 might allow an authenticated remote user whose ssm:SendCommand permission is restricted to the AWS-DownloadContent document, to write arbitrary files outside the intended download directory with root privileges, via crafted object keys in the S3 source the document is directed to retrieve. This issue may lead to arbitrary code execution as root if specific sensitive files are overwritten.</p> \n<p>To remediate this issue, customers should upgrade amazon-ssm-agent to version 3.3.4515.0 or later.</p> \n<p><b>Impacted versions:</b> Amazon amazon-ssm-agent from 2.0.767.0 to 3.3.4364.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
