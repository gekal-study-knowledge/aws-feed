    "title": "Amazon CloudWatch Logs で Application Load Balancer のログを分析する"
    "link": "https://aws.amazon.com/jp/blogs/news/analyze-application-load-balancer-logs-with-amazon-cloudwatch-logs/"
    "published": "2026-08-29 01:00:56"
    "fetched": "2026-08-29 05:39:36"
    "summary": "Amazon CloudWatch Logs が Application Load Balancer (ALB) のログを Vended Logs としてサポートしました。これにより、ALB のアクセスログ、接続ログ、ヘルスチェックログが構造化 JSON として CloudWatch Logs へ直接配信されるようになり、ワークロードの入口をリクエスト単位・接続単位・ターゲット単位で可視化できるようになりました。このブログでは有効化ルールによる一括配信設定の方法やALB監視ダッシュボードの提供、Log Analytics による障害を切り分け、ログアラームによる通知、Contributor Insights の利用について説明します。"
"last_updated": "2026-08-29 05:39:36 JST"
