    "title": "AWS CloudShell now includes a built-in visual file editor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-cloudshell-visual-file-editor/"
    "published": "2026-08-17 22:00:00"
    "fetched": "2026-08-18 03:32:12"
    "summary": "<p>AWS CloudShell now includes a built-in visual file editor that you can launch directly from your shell session using a single 'edit' command, no setup required. CloudShell provides a browser-based shell environment that uses your existing AWS Management Console credentials, making it a popular choice for developers, DevOps engineers, and cloud administrators managing scripts, infrastructure-as-code, agentic workflows, and AWS Lambda workflows. This new capability extends CloudShell's utility by bringing a familiar, GUI-based editing experience directly into your console session.</p> \n<p>Previously, editing files in CloudShell required using terminal-based editors such as Vim or Emacs, or downloading files locally and re-uploading them after making changes. This added friction to common workflows.&nbsp;The built-in visual editor eliminates this by supporting syntax highlighting, find-and-replace, multi-line selection, copy-paste, and undo-redo in a single browser session. Whether you are updating a deployment script, modifying an agent steering file, editing an AWS CloudFormation template, or fixing an AWS Lambda function, the editor enables a seamless edit-and-run experience.</p> \n<p>This feature is available in all AWS Regions where AWS CloudShell is available.</p> \n<p>To learn more about the built-in visual file editor and how to get started, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/cloudshell/latest/userguide/getting-started.html#edit-run\" rel=\"noopener noreferrer\" target=\"_blank\">AWS CloudShell documentation.</a></p>"
"last_updated": "2026-08-18 03:32:12 JST"
