    "title": "AWS CloudShell now includes a built-in visual file editor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-cloudshell-visual-file-editor/"
    "published": "2026-08-17 22:00:00"
    "fetched": "2026-08-18 03:32:12"
    "summary": "<p>AWS CloudShell now includes a built-in visual file editor that you can launch directly from your shell session using a single 'edit' command, no setup required. CloudShell provides a browser-based shell environment that uses your existing AWS Management Console credentials, making it a popular choice for developers, DevOps engineers, and cloud administrators managing scripts, infrastructure-as-code, agentic workflows, and AWS Lambda workflows. This new capability extends CloudShell's utility by bringing a familiar, GUI-based editing experience directly into your console session.</p> \n<p>Previously, editing files in CloudShell required using terminal-based editors such as Vim or Emacs, or downloading files locally and re-uploading them after making changes. This added friction to common workflows.&nbsp;The built-in visual editor eliminates this by supporting syntax highlighting, find-and-replace, multi-line selection, copy-paste, and undo-redo in a single browser session. Whether you are updating a deployment script, modifying an agent steering file, editing an AWS CloudFormation template, or fixing an AWS Lambda function, the editor enables a seamless edit-and-run experience.</p> \n<p>This feature is available in all AWS Regions where AWS CloudShell is available.</p> \n<p>To learn more about the built-in visual file editor and how to get started, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/cloudshell/latest/userguide/getting-started.html#edit-run\" rel=\"noopener noreferrer\" target=\"_blank\">AWS CloudShell documentation.</a></p>"
  "ba566f10e96b736a954b239bafc09a0b":
    "id": "ba566f10e96b736a954b239bafc09a0b"
    "title": "Amazon Location Service now supports POI category and density filtering in map styles"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-location-service/amazon-location-poi-categorization-density-map-styles"
    "published": "2026-08-17 23:25:00"
    "fetched": "2026-08-21 03:32:27"
    "summary": "<p>Today, Amazon Location Service adds per-category and density-based Point of Interest (POI) filtering to its maps. Developers gain server-side control over the density of POIs and which categories of places appear on a map. Developers control this behavior through the GetStyleDescriptor API. Amazon Location Service is a fully managed service that helps developers add maps, places, routing, and tracking to applications using high-quality geospatial data. Previously, every map style rendered all POI categories, and developers who wanted to tailor POIs to their use case relied on a client-side workaround tied to internal style layer identifiers.</p> \n<p>With this launch, the developer provides new poi-categories and poi-density query parameters. The poi-categories parameter takes an allowlist of categories - such as Food &amp; Drink, Transit, or Accommodations—and the poi-density parameter tunes how many POIs appear on the map. Amazon Location Service returns a style descriptor that renders only the requested categories at the chosen density. Filtering is configured server-side, so maps display correctly with no additional code required on the client side, on web, mobile, and headless server-side renderers alike. A property-listing site can surface only accommodations, a logistics fleet app can show only transit and fuel, and a tourist map can highlight sights and dining.&nbsp;</p> \n<p>Amazon Location Service is available in the following AWS Regions: US East (Ohio), US East (N. Virginia), US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Spain), Europe (Stockholm), South America (São Paulo), and AWS GovCloud (US-West).</p> \n<p>To get started, see <a href=\"https://docs.aws.amazon.com/location/latest/developerguide/maps-concepts.html#maps-concepts-features\">Map features</a> in the Amazon Location Service Developer Guide.</p>"
