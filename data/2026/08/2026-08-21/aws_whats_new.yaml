"entries":
  "fc405f6c87f50d01d5ebb74a0d672013":
    "id": "fc405f6c87f50d01d5ebb74a0d672013"
    "title": "Generative AI Inference Recommendation for Amazon SageMaker now available in the SageMaker AI Studio"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/generative-ai-inference-recommendation-for-amazon-sagemaker-now-available-in-the-sagemaker-ai-studio"
    "published": "2026-08-21 02:25:00"
    "fetched": "2026-08-21 03:32:27"
    "summary": "<p>Amazon SageMaker AI now offers Generative AI Inference Recommendations in SageMaker AI Studio, giving customers a guided, low-code, no-code path to find the best inference configuration for their workload. This builds on the API-based launch in April 2026, extending the same benchmarking infrastructure to teams that prefer a visual workflow over programmatic access.</p> \n<p>Deploying generative AI models in production requires finding the right combination of instance type, serving container, and optimization strategy. Getting this right typically involves weeks of manual benchmarking, configuration tuning, and trial-and-error, with no easy way to know if the final setup is actually optimal. With the new experience, customers describe their workload and what matters most, whether that's latency, throughput, or cost, and SageMaker AI does the rest. It benchmarks multiple configurations on real GPU infrastructure using NVIDIA AIPerf, applies goal-aligned techniques like speculative decoding for throughput or kernel tuning for latency, and returns ranked, production-ready recommendations with measured performance data. Teams get to a validated configuration in hours instead of weeks, without needing to decide which techniques to apply or how to configure them.</p> \n<p>With the new experience, customers describe their workload and what matters most, whether that's latency, throughput, or cost, and SageMaker AI does the rest. It benchmarks multiple configurations on real GPU infrastructure using NVIDIA AIPerf, applies goal-aligned techniques like speculative decoding for throughput or kernel tuning for latency, and returns ranked, production-ready recommendations with measured performance data. Teams get to a validated configuration in hours instead of weeks, without needing to decide which techniques to apply or how to configure them.</p> \n<p>In SageMaker AI Studio under Jobs, Inference optimization, customers select a use-case profile (Interact, Generate, Summarize, or Custom), choose an optimization goal (minimize latency, maximize throughput, or minimize cost), and pick their model from JumpStart, S3, Model Registry, or an existing SageMaker model. Recommendations are ranked by TTFT, inter-token latency, throughput, and cost, and can be compared visually before deploying to a SageMaker real-time endpoint directly from Studio.</p> \n<p>There is no additional cost for generating recommendations. Standard compute costs apply for optimization jobs and endpoints provisioned during benchmarking. This capability is available in US East (N. Virginia), US West (Oregon), US East (Ohio), Europe (Ireland), Europe (Frankfurt), Asia Pacific (Singapore), Asia Pacific (Tokyo). To learn more, visit the <a href=\"https://aws.amazon.com/blogs/machine-learning/launching-ui-for-generative-ai-inference-recommendations-in-amazon-sagemaker-ai/\">blog post</a> or the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/generative-ai-inference-recommendations.html\">documentation</a>.</p>"
  "a7745fac99a6cbfd42451922a5fdff89":
    "id": "a7745fac99a6cbfd42451922a5fdff89"
    "title": "AWS Direct Connect introduces inbound prefix controls and higher prefix scale"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-direct-connect-new-prefix-controls"
    "published": "2026-08-21 00:00:00"
    "fetched": "2026-08-21 03:32:27"
    "summary": "<p>Today, AWS Direct Connect announced inbound prefix controls, a new capability that lets you allocate and manage inbound route-prefix allocations for your private and transit virtual interfaces (VIFs) based on your workload's needs. You can now allocate up to 1,000 prefixes each for IPv4 and IPv6 on your VIFs on dedicated and hosted connections.</p> \n<p>Previously, Direct Connect VIFs accepted a maximum of 100 route prefixes advertised from your on-premises network to AWS on a private or transit VIF. If you had a larger or growing network, you had to architect around this ceiling, for example, by summarizing routes or segmenting across multiple VIFs or connections. With inbound prefix controls, you can allocate up to 1,000 prefixes to a single VIF and advertise your routes directly.</p> \n<p>Inbound prefix controls introduce new prefix capacity pools at the dedicated connection level and at the Direct Connect gateway (DXGW) level. When you create or update a VIF, you allocate a specific number of prefixes to it, and that allocation draws from the dedicated connection's pool and the DXGW's pool when you attach it. This lets you right-size prefix capacity per workload—for example, a large allocation for a transit VIF carrying many routes and a smaller allocation for a private VIF on the same connection. Connection pool sizes scale with connection speed, and link aggregation group (LAG) pools scale with the number of member connections.</p> \n<p>You can configure prefix allocations using the AWS Direct Connect console or CLI/API. Inbound prefix controls are available at no additional cost in all commercial AWS Regions where AWS Direct Connect is available, AWS GovCloud Regions (US-East and US-West), as well as the Amazon Web Services China (Beijing) Region, operated by Sinnet, and the Amazon Web Services China (Ningxia) Region, operated by NWCD.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/prefix-controls.html\" rel=\"noopener noreferrer\" target=\"_blank\">Inbound prefix controls for AWS Direct Connect</a> in the AWS Direct Connect User Guide.</p>"
  "438eea1504b4f565cfed755ce10a3225":
    "id": "438eea1504b4f565cfed755ce10a3225"
    "title": "Amazon EKS now supports certificate authority (CA) rotation with automated lifecycle management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-eks-certificate-authority-ca-rotation-automated-lifecycle-management"
    "published": "2026-08-21 03:30:00"
    "fetched": "2026-08-21 06:23:07"
    "summary": "<p>Today, Amazon Elastic Kubernetes Service (Amazon EKS) announced certificate authority (CA) rotation, enabling customers to rotate their cluster's CA through a managed lifecycle with automated safeguards. Each Amazon EKS cluster has its own CA that allows encrypted connections to the cluster's Kubernetes API, and now you can rotate the CA before it expires to ensure your cluster remains operational and secure.</p> \n<p>Amazon EKS clusters created since launch in 2018 have CAs with a 10-year validity period, and clusters from that era are now approaching the point where CA rotation activities should begin. CA rotation in Amazon EKS is a shared responsibility. Amazon EKS manages the rotation lifecycle and automatically updates AWS-managed components to trust the successor CA. Customers are responsible for replacing their worker nodes and updating external clients to trust the successor CA before it is activated. EKS Auto Mode instances and AWS Fargate nodes are updated automatically by AWS, but customers are still responsible for updating any external clients that connect to the cluster's API server. Amazon EKS provides automated safeguards to support customers through this process, including advance notifications before CA expiration, automatic appending of a successor CA if one is not created by the customer, and automatic activation if the customer does not activate on their own schedule. A rollback capability allows customers to revert to the previous CA to resolve any issues that may arise with their updates during the transition to the successor CA.</p> \n<p>Amazon EKS CA rotation is available at no additional cost in all commercial AWS Regions. To get started with CA rotation, you can use the AWS CLI, EKS APIs, CloudFormation, and the AWS console. For more information, see the <a href=\"https://docs.aws.amazon.com/eks/latest/userguide/certificate-authority-rotation.html\">Amazon EKS documentation</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/blogs/containers/deep-dive-into-amazon-eks-certificate-authority-rotation/\">Deep dive into Amazon EKS certificate authority rotation</a>.</p>"
  "1c12f18a2a3f14c4b965c798a216dc87":
    "id": "1c12f18a2a3f14c4b965c798a216dc87"
    "title": "Amazon CloudFront now supports Origin Access Control (OAC) for Amazon S3 Multi-Region Access Points"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cloudfront-oac-s3-mrap"
    "published": "2026-08-21 03:30:00"
    "fetched": "2026-08-21 06:23:07"
    "summary": "<p>Starting today, customers can protect their origins using Amazon S3 Multi-Region Access Points (MRAP) by using CloudFront Origin Access Control (OAC) to only allow access from designated CloudFront distributions.</p> \n<p>Customers use Amazon S3 MRAP with CloudFront to serve content from a single global endpoint that automatically routes to the closest available replicated bucket across regions during a cache miss, improving performance and resilience for globally distributed users. Previously, customers had to compute and forward their own Asymmetric Signature Version 4 (SigV4a) Authorization header using a custom Lambda@Edge Function. Now, CloudFront natively signs requests to S3 MRAP origins. Customers get faster cache-miss fills from the nearest region and restricted, OAC-secured MRAP access without&nbsp; custom Authorization header computation.</p> \n<p>CloudFront OAC support for Amazon S3 MRAP origins is available worldwide, except in the CloudFront China region. To get started, use the CloudFront Console, SDK, CLI, or CloudFormation to enable OAC when configuring your Amazon S3 MRAP endpoint with CloudFront. For more information, refer to the <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3-mrap.html\">CloudFront Developer Guide</a>. There are no additional fees associated with this feature</p>"
  "e6ec430136f33725819ecf65238d146a":
    "id": "e6ec430136f33725819ecf65238d146a"
    "title": "AWS Partner Central agents MCP Server now supports OAuth with AWS Sign-In"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/8/aws-partner-central-mcp/"
    "published": "2026-08-21 03:02:00"
    "fetched": "2026-08-21 06:23:07"
    "summary": "<p>AWS partners can now access AWS Partner Central agents from tools they already use, such as Amazon Quick and Kiro, using OAuth through AWS Sign-In. Partners can authorize agent access with their existing AWS identities, sign-in methods, IAM permissions, and governance controls without installing or maintaining additional authentication software.</p> \n<p>Previously, AWS Partners needed to set up an MCP proxy with SigV4 credentials to access Partner Central agents from their existing tools, or sign in to AWS Partner Central through the AWS Management Console with IAM credentials. OAuth simplifies this by allowing partners to use AWS Sign-In to authorize tools such as Amazon Quick and Kiro to access Partner Central agents. Partners can use OAuth&nbsp;from their existing tools for co-sell engagements,&nbsp;AWS funding applications, and AWS Marketplace seller setup. Administrators can govern access with IAM policies, global condition keys, token introspection and revocation APIs, dynamic client registration, and CloudTrail audit events.</p> \n<p>OAuth support is available to AWS Partners through AWS Partner Central agents MCP Server, which is available in the US East (N. Virginia) Region. To learn more, visit &nbsp;<a href=\"https://docs.aws.amazon.com/partner-central/latest/developer-guide/mcp-getting-started.html\">Getting started with the Partner Central agents MCP Server&nbsp;</a>, and &nbsp;<a href=\"https://docs.aws.amazon.com/signin/latest/userguide/oauth-sign-in-overview.html\">Sign-In with OAuth 2.0&nbsp;</a>.</p>"
  "9173927117f3c3703da3e3fa949f4431":
    "id": "9173927117f3c3703da3e3fa949f4431"
    "title": "AWS announces the general availability of a new AWS Local Zone in Las Vegas, Nevada"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-local-zones-las-vegas-nevada/"
    "published": "2026-08-21 06:45:00"
    "fetched": "2026-08-21 08:21:08"
    "summary": "<p>AWS Local Zone in Las Vegas, Nevada is now generally available. The new AWS Local Zone supports Amazon Elastic Compute Cloud (Amazon EC2) C7i, M7i, R7i, and C8gn instances, Amazon Elastic Block Store (Amazon EBS) volume types gp3, gp2, io1, sc1, and st1, Amazon Elastic Container Service (Amazon ECS), Amazon Elastic Kubernetes Service (Amazon EKS), Application Load Balancer, and AWS Direct Connect.</p> \n<p>AWS Local Zones are AWS infrastructure deployments that extend core services, such as compute, storage, networking, and other select services, closer to metropolitan areas worldwide. AWS Local Zones help you achieve single-digit millisecond latency for end-user workloads, meet data residency requirements, support AI/ML inference workloads, and accelerate migration and modernization of legacy applications to the cloud, all while maintaining consistent AWS APIs, tools, and services as AWS Regions. AWS Local Zones are available in more than 30 metropolitan areas worldwide.</p> \n<p>To get started, enable the Las Vegas Local Zone (us-west-2-las-2a) from the <a href=\"https://us-east-1.console.aws.amazon.com/awsglobalview/home#RegionsAndZones:tabId=regions\">Regions and Zones</a> tab in the AWS Global View or by using the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyAvailabilityZoneGroup.html\">ModifyAvailabilityZoneGroup</a> API. For pricing information, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/pricing/?nc=sn&amp;loc=4\">AWS Local Zones pricing page.</a> To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/localzones/\">AWS Local Zones overview page</a>.</p>"
  "3b932b591d3ae25aaa340be7269151ab":
    "id": "3b932b591d3ae25aaa340be7269151ab"
    "title": "Amazon Timestream for InfluxDB now supports customer managed keys"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-timestream-influxdb-cmk/"
    "published": "2026-08-21 05:00:00"
    "fetched": "2026-08-21 08:21:08"
    "summary": "<p>Amazon Timestream for InfluxDB now supports AWS Key Management Service (AWS KMS) customer managed keys for encrypting data at rest in InfluxDB 2 database instances, InfluxDB 2 Read Replicas, and InfluxDB 3 clusters. Customers select a symmetric AWS KMS key when creating a database resource.</p> \n<p>Timestream for InfluxDB uses the selected key to encrypt the underlying database storage for InfluxDB 2 and InfluxDB 3 resources. The key must be in the same AWS account and AWS Region as the database resource. Customers specify the key during resource creation. The key cannot be changed after the resource is created.</p> \n<p>Customer managed key support is available through the AWS Management Console, AWS Command Line Interface (AWS CLI), and Timestream for InfluxDB application programming interface (API). The feature is available in all AWS Regions where Timestream for InfluxDB is available. There is no additional Timestream for InfluxDB charge for using customer managed keys. Standard AWS KMS charges apply.<br /> <br /> Support for Customer managed keys is available in all AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Amazon Timestream for InfluxDB is available. To get started, open the Amazon Timestream console. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "3360d21c9afc9fc3814baf11ad892a5e":
    "id": "3360d21c9afc9fc3814baf11ad892a5e"
    "title": "ARC Region switch adds Amazon RDS Switchover Read Replica execution block"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/region-switch-rds-switchover-execution-block/"
    "published": "2026-08-21 02:45:00"
    "fetched": "2026-08-21 08:21:08"
    "summary": "<p>Today, we are launching the <b>Amazon RDS Switchover Read Replica execution block</b> in <b>ARC Region switch</b>, which automates recovery orchestration for Amazon RDS databases running Oracle Data Guard in multi-Region workloads. <b>Amazon Application Recovery Controller (ARC) Region switch </b>helps customers orchestrate the failover of their multi-Region applications to achieve a bounded recovery time in the event of a Regional impairment.</p> \n<p>To recover an Amazon RDS database running Oracle Data Guard during a Regional failover, customers perform manual steps to reverse the roles of the primary database and its read replica or to promote a read replica to a primary database instance. Region switch now allows you to automate this recovery with the <b>RDS Switchover Read Replica execution block</b>. The same execution block automates the role transition between the primary database and read replica with zero data loss during a planned failover scenario, or promotion of the read replica to a primary database during an unplanned failover where recovery speed is of the essence. With native cross-account support, you can orchestrate recovery of Amazon RDS instances that are hosted in a different account from your Region switch plan, enabling centralized management of recovery across your organization.</p> \n<p>To get started, see the documentation for&nbsp;<a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/rds-switchover-read-replica-block.html\">Amazon RDS Switchover Read Replica execution block&nbsp;</a>. To learn more about ARC Region switch, visit the <a href=\"https://aws.amazon.com/application-recovery-controller/multi-region-recovery/\">Application Recovery Controller page&nbsp;</a>.&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</p>"
  "a924b0f7ab523bb51418f26ee4385024":
    "id": "a924b0f7ab523bb51418f26ee4385024"
    "title": "Amazon Redshift introduces long-term system table retention with Amazon S3 Tables integration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/redshift-long-term-system-table-retention/"
    "published": "2026-08-21 00:00:00"
    "fetched": "2026-08-21 08:21:08"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> now supports long-term retention for system table data through native integration with <a href=\"https://aws.amazon.com/s3/features/tables/?trk=a0cfbe47-9163-4866-b531-ae6e42b850fb&amp;sc_channel=ps&amp;ef_id=CjwKCAjws_DTBhB_EiwAXZknGWBvpgJrpG58UgmwS6tvQHUY9CSWOHPTWD3gwcvOPs-HvoPrPkEMlBoC1DcQAvD_BwE&amp;gads_camp=23522747487&amp;gads_ag=199083605197&amp;gads_ad=820200021722&amp;gads_kw=amazon%20s3%20tables&amp;gads_matchtype=e&amp;gads_network=g&amp;gads_device=c&amp;gads_geo=1027744&amp;gad_campaignid=23522747487&amp;gbraid=0AAAAADjHtp9cwZBKiv30JXu5qrPDkKSyb&amp;gclid=CjwKCAjws_DTBhB_EiwAXZknGWBvpgJrpG58UgmwS6tvQHUY9CSWOHPTWD3gwcvOPs-HvoPrPkEMlBoC1DcQAvD_BwE\">Amazon S3 Tables.</a> With this feature, you can configure your Redshift system table data retention beyond the current 7-day limit to meet your compliance, auditing, and observability requirements. Once enabled, AWS automatically writes system table data to S3 Tables in <a href=\"https://aws.amazon.com/what-is/apache-iceberg/\">Apache Iceberg format</a> and manages partitioning, compaction, and retention.</p> \n<p>Customers use Redshift system tables to monitor query performance, audit data warehouse activity, and meet compliance requirements. Previously, extending retention required building and maintaining custom extract transform load (ETL) pipelines to copy system table data, adding development effort and ongoing operational overhead. Customers operating multiple data warehouses faced additional complexity, relying on Redshift data sharing to consolidate system table data from each warehouse into a central location for cross-warehouse analysis. With this feature, system table data is replicated automatically, eliminating the need for custom ETL pipelines and any resource contention with your production workloads. &nbsp;If you operate multiple data warehouses, you can consolidate their system table data into a single location for cross-warehouse observability and analysis. Because the data is stored in the open Apache Iceberg format, you can query it through Redshift,&nbsp;<a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a>, or any Iceberg-compatible engine, and build observability dashboards using AWS services or third-party tools without additional operations overhead. Additionally, the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/system-table-skills\">AWS Agent Toolkit</a>&nbsp;provides skills for querying system table data to surface performance insights and optimization recommendations.</p> \n<p>This feature is available for Amazon Redshift Provisioned <a href=\"https://aws.amazon.com/redshift/features/rg/\">RG</a> and <a href=\"https://aws.amazon.com/redshift/features/ra3/\">RA3</a> instances and Amazon Redshift <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Serverless</a>&nbsp;in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Africa (Cape Town), Asia Pacific (Hong Kong), Asia Pacific (Taipei), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Pacific (Osaka), Asia Pacific (Mumbai), Asia Pacific (Hyderabad), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Jakarta), Asia Pacific (Melbourne), Asia Pacific (Malaysia), Asia Pacific (Thailand), Canada (Central), Europe (Frankfurt), Europe (Zurich), Europe (Stockholm), Europe (Milan), Europe (Spain), Europe (Ireland), Europe (London), Europe (Paris), Israel (Tel Aviv), and South America (Sao Paulo). To learn more, visit our <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/system-table-s3-tables.html\">documentation</a> or&nbsp;read the&nbsp;<a href=\"https://aws.amazon.com/blogs/big-data/long-term-system-tables-retention-in-amazon-redshift-with-amazon-s3-tables/\">blog</a>.</p>"
  "14a2dc977593618f14772e7f0d663fcf":
    "id": "14a2dc977593618f14772e7f0d663fcf"
    "title": "Amazon EC2 P6-B300 instances are now available in the Asia Pacific (Seoul) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-p6-b300/"
    "published": "2026-08-21 03:31:00"
    "fetched": "2026-08-21 10:03:06"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in the Asia Pacific (Seoul) Region. P6-B300 instances provide 8xNVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.<br /> <br /> P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) and large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads.<br /> <br /> P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon), AWS GovCloud (US-East), US East (N. Virginia) and Asia Pacific (Seoul). To learn more about P6-B300 instances, visit <a href=\"https://aws.amazon.com/ec2/instance-types/p6/\">Amazon EC2 P6 instances.</a><br /> </p>"
  "69db96dc6fe9b1bb8798fc70f2191739":
    "id": "69db96dc6fe9b1bb8798fc70f2191739"
    "title": "Amazon EC2 C8gd, M8gd and R8gd instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-c8gd-m8gd/"
    "published": "2026-08-21 05:00:00"
    "fetched": "2026-08-22 03:30:18"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) C8gd, M8gd, and R8gd instances with up to 11.4 TB of local NVMe-based SSD block-level storage are now available in additional regions. C8gd instances are now available in Asia Pacific (Singapore), M8gd instances are available in Mexico (Central) and Asia Pacific (Melbourne), and R8gd instances are available in Europe (Zurich). These instances are powered by AWS Graviton4 processors, delivering up to 30% better performance over Graviton3-based instances. They have up to 40% higher performance for I/O intensive database workloads, and up to 20% faster query results for I/O intensive real-time data analytics than comparable AWS Graviton3-based instances. These instances are built on the AWS Nitro System and are a great fit for applications that need access to high-speed, low latency local storage.<br /> <br /> Each instance is available in 12 different sizes. They provide up to 50 Gbps of network bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Additionally, customers can now adjust the network and Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.</p> \n<p>C8gd instances are ideal for compute-intensive workloads such as high-performance web servers, batch processing, distributed analytics, ad serving, video encoding, and gaming servers. M8gd instances are well-suited for balanced workloads including application servers, microservices, enterprise applications, and small to medium databases. R8gd instances are ideal for memory-intensive workloads such as in-memory databases, real-time big data analytics, large in-memory caches, and scientific computing applications.</p> \n<p>To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon C8gd Instances</a>, <a href=\"https://aws.amazon.com/ec2/instance-types/m8g/\">Amazon M8gd Instances</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\">Amazon R8gd Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
  "3da34545e1b0015b4ac8e415050663e8":
    "id": "3da34545e1b0015b4ac8e415050663e8"
    "title": "Amazon SES now supports open and click tracking override parameters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ses-adds-open-click-tracking-override/"
    "published": "2026-08-21 16:00:00"
    "fetched": "2026-08-22 04:22:06"
    "summary": "<p>Amazon Simple Email Service (SES) now supports open and click tracking override parameters in the SendEmail and SendBulkEmail APIs. Senders can enable or disable open tracking and click tracking on an individual API call, rather than managing tracking preferences through separate configuration sets.<br /> <br /> Previously, controlling tracking behavior required maintaining a distinct configuration set for each combination of open- and click-tracking settings. With this new capability, you specify the tracking preference directly in the send request, reducing configuration overhead and simplifying how you honor recipient-level tracking consent. This is useful for senders that must respect per-recipient consent choices to meet data protection requirements such as GDPR and CNIL guidance.<br /> <br /> The tracking overrides apply per request and take precedence over the tracking behavior defined in the associated configuration set, giving you fine-grained control without changing your existing configuration set structure. There is no additional cost to use this feature.<br /> <br /> This capability is available in all AWS Regions where Amazon SES is available.</p> \n<p>To learn more, see the documentation on open and click tracking in the <a href=\"https://docs.aws.amazon.com/ses/latest/APIReference-V2/API_SendEmail.html\"><i>Amazon SES Developer Guide</i>.&nbsp;</a></p>"
"last_updated": "2026-08-22 04:22:06 JST"
