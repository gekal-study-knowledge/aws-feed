  "38057fee97bbda780ab916d386d9665e":
    "id": "38057fee97bbda780ab916d386d9665e"
    "title": "Oracle Database 26ai での自然言語クエリ: Amazon Bedrock を使った Amazon RDS for Oracle での Select AI 入門"
    "link": "https://aws.amazon.com/jp/blogs/news/natural-language-queries-on-oracle-database-26ai-getting-started-with-select-ai-on-amazon-rds-for-oracle-with-amazon-bedrock/"
    "published": "2026-08-21 08:46:54"
    "fetched": "2026-08-21 10:03:06"
    "summary": "Amazon RDS for Oracle で Oracle Database 26ai が利用可能になりました。本記事では、Amazon Bedrock の基盤モデルを使って自然言語でリレーショナルデータを照会できる Select AI を取り上げます。VPC インターフェイスエンドポイントと IAM 認証情報の設定から、DBMS_CLOUD_AI プロファイルの作成、合成データの生成、自然言語クエリの実行までを一通り説明します。"
  "3419a7f8b3aae9a67c85c82264fe16d3":
    "id": "3419a7f8b3aae9a67c85c82264fe16d3"
    "title": "AWS Transform の SQL Server から PostgreSQL へのスキーマ検証"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-transform-sql-server-to-postgresql-schema-validation-in-net-application-modernization/"
    "published": "2026-08-21 12:05:58"
    "fetched": "2026-08-21 12:52:21"
    "summary": "AWS Transform が備える 3 層の検証モデル (構造的検証、意味的検証、動作検証) の仕組みを詳しく解説します。稼働中のデータベースに直接クエリを発行する検証方式、スタブ検出やミューテーションテストによる動作確認、そして Amazon Bedrock を活用した AI エージェントが検出内容を根本原因ごとにまとめて重大度を判定する流れを追うことで、移行品質を体系的に担保する方法が見えてきます。"
  "47b672abc21268a7b48a2d3444eb8cb6":
    "id": "47b672abc21268a7b48a2d3444eb8cb6"
    "title": "AWS Transform を使用した SQL Server データベースから Aurora PostgreSQL へのモダナイズ"
    "link": "https://aws.amazon.com/jp/blogs/news/modernize-microsoft-sql-server-databases-to-aurora-postgresql-using-aws-transform/"
    "published": "2026-08-21 12:05:09"
    "fetched": "2026-08-21 12:52:21"
    "summary": "AWS Transform の Offline Source 機能を使用して SQL Server データベースを Aurora PostgreSQL へモダナイズする方法を紹介します。DDL ファイルをアップロードするだけで、ネットワーク接続や中間環境のプロビジョニングなしにモダナイゼーションを開始できます。LLM ベースのスキーマ変換、3 層の自動検証、Aurora PostgreSQL へのデプロイ、.NET アプリケーションコードの変換まで、エンドツーエンドのワークフローをステップごとに解説します。"
"last_updated": "2026-08-21 12:52:21 JST"
