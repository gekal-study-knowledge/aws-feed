"entries":
  "b628a70f8e2bd208ad12fa6ff01847a2":
    "id": "b628a70f8e2bd208ad12fa6ff01847a2"
    "title": "Build intelligent security for healthcare APIs with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-intelligent-security-for-healthcare-apis-with-amazon-bedrock/"
    "published": "2026-08-21 00:20:03"
    "fetched": "2026-08-21 00:28:40"
    "summary": "Learn how to add context-aware security monitoring to FHIR APIs using Amazon Bedrock. This post shows how to detect anomalous access patterns, classify data sensitivity automatically, and generate compliance reports in natural language, all without adding latency to clinical workflows."
  "8d3c9a4456476cfd2e64b3f95f2b7e95":
    "id": "8d3c9a4456476cfd2e64b3f95f2b7e95"
    "title": "Scaling agentic AI: Enterprise patterns without vendor lock-in"
    "link": "https://aws.amazon.com/blogs/machine-learning/scaling-agentic-ai-enterprise-patterns-without-vendor-lock-in/"
    "published": "2026-08-21 01:24:12"
    "fetched": "2026-08-21 01:29:23"
    "summary": "Scaling agentic AI across an enterprise requires patterns that preserve flexibility while avoiding vendor lock-in. In this second post of our multi-agent series, we examine how ML teams operate many agentic AI systems across a multi-everything environment of frameworks, models, and providers, and the principles that let those systems scale together."
  "2318226bd4b087a9c4d6e3621f652c09":
    "id": "2318226bd4b087a9c4d6e3621f652c09"
    "title": "Scaling cloud migrations with agentic AI on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/scaling-cloud-migrations-with-agentic-ai-on-amazon-bedrock-agentcore/"
    "published": "2026-08-21 01:11:18"
    "fetched": "2026-08-21 01:29:23"
    "summary": "Learn how AWS Professional Services uses a multi-agent framework built on Amazon Bedrock AgentCore to automate enterprise cloud migrations end to end. Purpose-built AI agents handle discovery, infrastructure as code generation, portfolio governance, and post-migration operations, reducing IaC development time from weeks to minutes."
  "336ff2af673acf92483735ce7c712c63":
    "id": "336ff2af673acf92483735ce7c712c63"
    "title": "AWS vector solutions: Build agentic AI where your data lives"
    "link": "https://aws.amazon.com/blogs/machine-learning/aws-vector-solutions-build-agentic-ai-where-your-data-lives/"
    "published": "2026-08-21 01:06:06"
    "fetched": "2026-08-21 01:29:23"
    "summary": "AWS offers a broad portfolio of vector search built directly into the databases and storage services you already use, with no standalone vector database or data migration required. This post covers six purpose-built services, a decision framework for choosing the right engine, and customer proof points for each."
  "5fc1d0aff2d7398c021c6867cdefd974":
    "id": "5fc1d0aff2d7398c021c6867cdefd974"
    "title": "Authoring Dogwood policies from natural language in Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/authoring-dogwood-policies-from-natural-language-in-amazon-bedrock-agentcore/"
    "published": "2026-08-21 01:31:28"
    "fetched": "2026-08-21 02:24:24"
    "summary": "AI agents can take actions that do not match your organization's policies. Policy in Amazon Bedrock AgentCore lets teams enforce controls across agents, now including time-based constraints. This post shows how Policy Authoring turns natural-language policy documents into correct Dogwood policies, with worked examples and best practices."
  "e9dac460d3cd32cd8e4ba37fdd1cc96d":
    "id": "e9dac460d3cd32cd8e4ba37fdd1cc96d"
    "title": "Introducing cross-Region inference for OpenAI GPT-5.6 models on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-cross-region-inference-for-openai-gpt-5-6-models-on-amazon-bedrock/"
    "published": "2026-08-21 06:46:03"
    "fetched": "2026-08-21 07:22:00"
    "summary": "Amazon Bedrock now offers OpenAI GPT-5.6 models (Sol, Terra, and Luna) in more than 25 AWS Regions with cross-Region inference. Learn how US geographic and global inference profiles route requests for higher throughput, how to call the models with the OpenAI and Converse APIs, and how to configure IAM, quotas, and monitoring."
  "6a4dc6214dc281e68431b4bef7038967":
    "id": "6a4dc6214dc281e68431b4bef7038967"
    "title": "Build a no-code ML workflow with Snowflake, Amazon SageMaker Canvas and Amazon Quick – Part 1: Setting up your Snowflake environment"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-no-code-ml-workflow-with-snowflake-amazon-sagemaker-canvas-and-amazon-quick-part-1-setting-up-your-snowflake-environment/"
    "published": "2026-08-21 06:23:38"
    "fetched": "2026-08-21 07:22:00"
    "summary": "Healthcare, retail, and life sciences teams store large volumes of operational data in Snowflake, but turning it into predictions is hard. In Part 1 of this series, you set up your AWS account and Snowflake environment for a no-code ML workflow with Amazon SageMaker Canvas, laying the foundation for building a fraud detection model without writing code."
  "655860dbbe098f8802dcc81a295d5772":
    "id": "655860dbbe098f8802dcc81a295d5772"
    "title": "Build a no-code ML workflow with Snowflake, Amazon SageMaker Canvas and Amazon Quick – Part 2: Data preparation and model building with Amazon SageMaker Canvas"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-no-code-ml-workflow-with-snowflake-amazon-sagemaker-canvas-and-amazon-quick-part-2-data-preparation-and-model-building-with-amazon-sagemaker-canvas/"
    "published": "2026-08-21 06:23:29"
    "fetched": "2026-08-21 07:22:00"
    "summary": "In Part 2 of this no-code ML series, you connect Amazon SageMaker Canvas to Snowflake, prepare and join transaction data with Data Wrangler visual transformations, and train an XGBoost fraud detection model. All without writing machine learning code, laying the groundwork for interactive dashboards in Part 3."
  "4534aa815e033232e421a791febdb91b":
    "id": "4534aa815e033232e421a791febdb91b"
    "title": "Build a no-code ML workflow with Snowflake, Amazon SageMaker Canvas and Amazon Quick – Part 3: Visualizing insights with Amazon Quick Sight"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-no-code-ml-workflow-with-snowflake-amazon-sagemaker-canvas-and-amazon-quick-part-3-visualizing-insights-with-amazon-quick-sight/"
    "published": "2026-08-21 06:23:23"
    "fetched": "2026-08-21 07:22:00"
    "summary": "In Part 3 of this no-code ML series, you bring fraud detection predictions to life. Import your Amazon SageMaker Canvas predictions into Amazon Quick Sight, build interactive dashboards, use generative BI to answer questions in natural language, and publish AI-generated executive summaries for stakeholders."
"last_updated": "2026-08-21 07:22:00 JST"
