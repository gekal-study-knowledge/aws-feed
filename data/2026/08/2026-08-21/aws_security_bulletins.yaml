    "title": "CVE-2026-18420 - Remote Code Execution via Prototype Pollution in OpenSearch Dashboards TSVB Plugin"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-085-aws/"
    "published": "2026-08-21 06:35:57"
    "fetched": "2026-08-21 07:21:59"
    "summary": "<p><b>Bulletin ID:</b> 2026-085-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 08/20/2026 13:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Improper input validation in the Time Series Visual Builder (TSVB) plugin in OpenSearch Dashboards before 3.8 allows a remote authenticated user with standard data access permissions to execute arbitrary code on the server by sending a crafted JSON payload to the metrics visualization API endpoint. To mitigate this issue, users should upgrade to OpenSearch Dashboards 3.8 or later.</p> \n<p><b>Impacted products and versions:</b><br /> - OpenSearch-Dashboards (open-source, self-managed): &gt;=3.0.0, &lt;3.8.0<br /> - OpenSearch-Dashboards (AWS Managed): &gt;=3.0.0, &lt;3.8.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
