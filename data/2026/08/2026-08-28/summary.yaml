"overview": |
  この日はインド国内での推論とコスト最適化、そしてモデルの品揃え拡充が話題でした。Amazon Bedrock が OpenAI GPT-5.6 の Terra と Luna をインド地理のクロスリージョン推論でサポートし、ローカルのデータ保護要件があるケースに対応します。SageMaker JumpStart には NVIDIA の Cosmos3-Edge / Cosmos3-Nano / Cosmos3-Super、Meta の Muse-Glimmer-30B、Alibaba の Qwen 3.8-27B が追加されました。機械学習ブログでは NVIDIA CUDA Multi-Process Service を使い、1 リクエストが GPU の一部しか使わない音声認識の推論コストを 75% 削減する手法が公開されています。セキュリティでは Bedrock Guardrails をモデル境界だけでなくツール呼び出しにも広げる方法が Strands Agents SDK を使って解説されました。サービス更新では Elastic Disaster Recovery に複数サーバーのアプリケーションを順序立てて起動する Recovery Plans が追加され、AgentCore が北カリフォルニアとハイデラバードの 2 リージョンへ拡大、FSx for NetApp ONTAP はリージョン間・アカウント間のバックアップコピーに対応しています。国内では Bedrock のきめ細かなコスト配分と Athena / CUDOS を使った可視化の日本語解説、8 月 25 日に 20 周年を迎えた Amazon EC2 の振り返りが公開されました。
