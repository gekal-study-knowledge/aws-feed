  "61a70d7b85e101eba489989604b06793":
    "id": "61a70d7b85e101eba489989604b06793"
    "title": "Amazon Redshift streaming can now ingest 10MiB records from Amazon Kinesis Data Streams"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/redshift-streaming-supports-kds-10mib-records"
    "published": "2026-08-28 06:41:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift </a>&nbsp;now supports Amazon Kinesis Data Streams (KDS) record sizes up to 10 MiB—a 10x increase from the previous 1 MiB limit—fully matching the expanded maximum record size in Amazon KDS. This means you can stream significantly larger payloads directly into Amazon Redshift without splitting records, simplifying your ingestion pipelines and unlocking new use cases for high-volume, large-record workloads.</p> \n<p>Amazon Redshift support for 10MiB record size in Amazon KDS streams is now available in all commercial AWS regions where Amazon Redshift is available. For more information on direct streaming ingestion into Amazon Redshift, see the <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-streaming-ingestion.html\">Amazon Redshift streaming documentation</a>. For more information on 10MiB record support in Amazon KDS, see the <a href=\"https://docs.aws.amazon.com/streams/latest/dev/large-records.html\">Amazon KDS documentation</a>. &nbsp;</p>"
  "04afbc15e1352770746b713de066b50d":
    "id": "04afbc15e1352770746b713de066b50d"
    "title": "Amazon Redshift integrates with Agent Toolkit for AWS for AI-assisted data warehouse management"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/redshift-agenttoolkit-for-ai-assisted-datawarehouse-mgmt"
    "published": "2026-08-28 05:07:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p><a href=\"https://aws.amazon.com/redshift/\">Amazon Redshift</a> now integrates with the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\">Agent Toolkit for AWS</a>, enabling you to build, query, troubleshoot, and migrate to Amazon Redshift data warehouses and date lakes directly from AI agents such as Claude Code, Kiro, and Cursor. The integration pairs the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html\">AWS MCP (Model Context Protocol) server</a>, which provides authenticated AWS API execution on your behalf — with <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/specialized-skills/analytics-skills/redshift-guide\">Redshift skills</a>: curated packages of tested procedures and reference material that help AI agents complete Redshift tasks more effectively.</p> \n<p>The <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/1799aae50f30a8e97bab4faf38f2eadbd665028b/skills/specialized-skills/analytics-skills/redshift-guide\">Redshift skills</a> cover SQL syntax references to reduce query generation errors, metadata discovery to explore schemas and data without writing SQL by hand, data loading patterns, materialized view best practices, function and data type guidance, and extensions such as Qualify, Pivot, and Super. It also guides end-to-end data warehouse migrations to Amazon Redshift, including discovery, schema and SQL conversion, data movement, validation, and performance comparison. We will continue to expand these skills with additional capabilities over time.</p> \n<p>The skills work with provisioned clusters and <a href=\"https://aws.amazon.com/redshift/redshift-serverless/\">Serverless</a> workgroups, require no changes to existing infrastructure, and are available at no additional charge in all AWS Regions where Amazon Redshift and the AWS MCP Server are offered.</p> \n<p>To get started, install the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/1799aae50f30a8e97bab4faf38f2eadbd665028b/plugins/aws-data-analytics\">aws-data-analytics plugin</a> in your agent, which bundles the MCP Server configuration and Redshift skills in a single step. Agents with MCP Server access can also discover and load skills at runtime without pre-installation. For setup instructions, see the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/quick-start.html\">Agent Toolkit documentation</a> or the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/agent-skills.html\">Amazon Redshift skills documentation</a>.</p>"
  "c7a693b835f388d3f00238a66292443a":
    "id": "c7a693b835f388d3f00238a66292443a"
    "title": "Amazon EC2 X8i instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-x8i-europe-milan-spain/"
    "published": "2026-08-28 03:40:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8i instances are available in the Europe (Milan) and Europe (Spain) regions. These instances are powered by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified and deliver the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to previous generation X2i instances.&nbsp;<br /> &nbsp;<br /> X8i instances are designed for memory-intensive workloads like SAP HANA, large databases, data analytics, and Electronic Design Automation (EDA). Compared to X2i instances, X8i instances offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance, 88% faster Memcached performance, and 46% faster AI inference performance. X8i instances come in 14 sizes, from large to 96xlarge, including two bare metal options.&nbsp;<br /> &nbsp;<br /> To get started, visit the <a href=\"https://aws.amazon.com/console/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances, and Spot instances. For more information visit <a href=\"https://aws.amazon.com/ec2/instance-types/x8i/\" rel=\"noopener noreferrer\" target=\"_blank\">X8i instances page</a>.</p>"
  "9cccbec6012442a0a41bc35c8e1aaf35":
    "id": "9cccbec6012442a0a41bc35c8e1aaf35"
    "title": "AWS Elastic Disaster Recovery introduces Recovery Plans for orchestrated application recovery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/elastic-disaster-recovery-plans/"
    "published": "2026-08-28 03:00:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>AWS Elastic Disaster Recovery (AWS DRS) now offers Recovery Plans, a capability that automates the sequential launch of multi-server applications during recovery and drills. Instead of launching servers one at a time and tracking dependencies manually, you define the recovery sequence once and run it with a single action when you need it. This addresses a common challenge for customers running applications made up of databases, application tiers, and supporting services that must come up in a specific order.</p> \n<p>Recovery Plans let you group servers into sequential steps with configurable wait times between them, so your application recovers predictably and consistently every time. You can run plans in a non-disruptive drill mode to validate your procedures, add approval steps where you want a person in the loop, and monitor progress in real time. This automation reduces recovery time and eliminates common errors that occur when coordinating server launch order during high-stress disaster scenarios.</p> \n<p>Recovery Plans are available in all AWS Regions where AWS DRS is offered, at no additional cost beyond standard DRS usage. To learn more, visit the <a href=\"https://docs.aws.amazon.com/drs/latest/userguide/recovery-plans.html\">AWS Elastic Disaster Recovery User Guide</a>.</p>"
  "2bf103df004205b56f8c2e81c14d9f13":
    "id": "2bf103df004205b56f8c2e81c14d9f13"
    "title": "Amazon Bedrock AgentCore expands to two new regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/bedrock-agentcore-two-new-regions/"
    "published": "2026-08-28 03:00:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Amazon Bedrock AgentCore is now available in two additional AWS Regions: US West (N. California) and Asia Pacific (Hyderabad). Amazon Bedrock AgentCore is the platform to build, connect, and optimize agents. It helps engineers ship agents fast with any framework and any model, connect them to enterprise systems and tools, and optimize them continuously, with security enforced at the infrastructure layer that agents can't bypass.</p>\n<p>With this expansion, customers in these regions can build and run agents closer to their end users with lower latency. AgentCore capabilities including agent runtime, identity and access control, policy management, session persistence, tool connectivity, evaluations and observability are available in these regions at launch.</p>\n<p>For more information on AgentCore, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/\">AgentCore product page</a> or the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/\">AgentCore Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/bedrock/agentcore/pricing/\">AgentCore pricing</a>. For region availability, visit <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">Supported AWS Regions</a>.</p>"
  "9b190cda9c616102af3613094cdb5897":
    "id": "9b190cda9c616102af3613094cdb5897"
    "title": "Amazon Connect Customer expands conversational analytics capabilities in the Africa (Cape Town) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/connect-customer-analytics-cape-town/"
    "published": "2026-08-28 03:00:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Amazon Connect Customer now supports generative AI-powered summaries, real-time call analytics, and real-time rules in the Africa (Cape Town) Region. These capabilities extend the post-contact conversational analytics already available in the Region, giving companies access to AI-powered insights that help them improve customer experience, agent performance, and operational efficiency.</p> \n<p>With generative AI-powered summaries, supervisors and human-agents receive concise, AI-generated summaries of customer interactions immediately after a contact ends, eliminating the need for manual note-taking and reducing after-contact work. Real-time call analytics provide live transcription enabling supervisors to monitor interactions as they happen and intervene when needed to improve outcomes. Real-time rules automatically categorize contacts and alert supervisors based on keywords, sentiment, and other criteria detected during a live interaction, enabling immediate action such as sending notifications or generating tasks.</p> \n<p>To learn more about Connect Customer conversational analytics capabilities, refer to the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/analyze-conversations.html\">Amazon Connect Customer Administrator Guide</a> or visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>. For a complete list of conversational analytics features available by Region, refer to <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#contactlens_region\">Availability of Connect Customer features by Region</a>.</p>"
  "50cf0458ccba775649b882e2673adba8":
    "id": "50cf0458ccba775649b882e2673adba8"
    "title": "Amazon Connect Customer now automatically refreshes scheduling metrics"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-customer-scheduling-metrics/"
    "published": "2026-08-28 02:59:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Amazon Connect Customer now automatically refreshes schedule metrics on the scheduling page, giving managers immediate visibility into the impact of schedule updates. For example, when a new team meeting is added for 10 agents from 10 AM – 11 AM, metrics such as net available headcount and projected service level are automatically updated. This gives workforce managers up-to-date visibility into how schedule changes affect staffing coverage, so they can make faster, more informed decisions throughout the day.</p> \n<p> </p> \n<p>This feature is available in all &nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region\">AWS Regions&nbsp;</a> where Amazon Connect Customer agent scheduling is available. To learn more about Amazon Connect Customer agent scheduling, click &nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html\">here&nbsp;</a>.</p>"
  "b281ed9094f186f357ddd5d0a7b986b0":
    "id": "b281ed9094f186f357ddd5d0a7b986b0"
    "title": "Amazon FSx for NetApp ONTAP now supports copying backups across AWS Regions and accounts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/fsx-ontap-cross-region-backup-copy/"
    "published": "2026-08-28 02:37:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Amazon FSx for NetApp ONTAP, a fully managed shared storage service built on NetApp's popular ONTAP file system, now supports copying backups within and across AWS Regions, and across trusted accounts in your AWS organization. You can now provide an additional layer of protection for your data by storing secondary backup copies in a different Region or account than your primary copies, making it easier to meet your business continuity, data protection, and compliance requirements.</p> \n<p>Amazon FSx offers secure, highly durable, and incremental backups designed to support your data retention, archival, and compliance needs. Backups are point-in-time offline copies of your volumes, stored redundantly across multiple Availability Zones in the same Region as your file system. Previously, you could create and restore backups in the same Region and account as your file system.&nbsp;Starting today, you can copy backup data to multiple Regions and accounts for enhanced resilience, data isolation, and operational flexibility.</p> \n<p>You can copy new and existing backups in <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">all AWS Regions</a> where Amazon FSx for NetApp ONTAP is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/getting-started.html\">FSx for NetApp ONTAP user guide</a> and the <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\">Amazon FSx for NetApp ONTAP product page</a>.</p>"
  "a3b67442ac8c0268e8af33f25733fc1b":
    "id": "a3b67442ac8c0268e8af33f25733fc1b"
    "title": "AWS Backup adds cross-Region and cross-account backup support for Amazon FSx for NetApp ONTAP"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-backup-amazon-fsx-netapp-cross-account-region/"
    "published": "2026-08-28 02:25:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>AWS Backup now supports copying Amazon FSx for NetApp ONTAP backups across AWS Regions and accounts. You can copy your FSx for NetApp ONTAP backups to another AWS Region, another AWS account, or both, using policy-based backup plans or on-demand copy jobs.</p> \n<p>Copying backups to a separate Region helps you meet cross-Region disaster recovery and business continuity goals, while copying to a separate account helps protect your backups from accidental deletion, operational error, or account compromise. AWS Backup manages these copies centrally, and you can automate them across your organization using AWS Organizations.</p> \n<p>This capability is available in all commercial AWS Regions where both Amazon FSx for NetApp ONTAP and AWS Backup are available. To get started, visit the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. For a complete list of supported Regions and features, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#supported-services-by-region\" target=\"_blank\">AWS Backup documentation</a>. To learn more, visit the <a href=\"https://aws.amazon.com/backup/\" target=\"_blank\">product page</a> and <a href=\"https://aws.amazon.com/backup/pricing/\" target=\"_blank\">pricing page</a>.</p>"
  "2c5d13b2c9c79c75f2d4a20c1ceb8e0f":
    "id": "2c5d13b2c9c79c75f2d4a20c1ceb8e0f"
    "title": "Amazon EVS now supports i7i.metal-48xl Amazon EC2 instance type"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-evs-i7i-48xl"
    "published": "2026-08-28 01:35:00"
    "fetched": "2026-08-28 08:31:52"
    "summary": "<p>Today, we're announcing that Amazon Elastic VMware Service (Amazon EVS) now supports the i7i.metal-48xl Amazon Elastic Cloud Compute (Amazon EC2) bare-metal instance type, offering a higher core-count option with a newer generation processor to help you realize cost-performance benefits for your VMware-based workloads on AWS.</p> \n<p>With this release, you now have more options for running your virtual machines (VMs) on Amazon EVS environments and growing your cloud presence at your own pace, as your business demands. Powered by 5th generation Intel Xeon Scalable processors, i7i instances offer the best compute and storage performance for x86-based storage optimized instances in Amazon EC2, delivering up to 23% better compute performance and more than 10% better price performance over i4i instances. The i7i.metal-48xl's larger&nbsp;memory and storage footprint allows you to run more VMs to vertically scale your operation with less EVS hosts - and take further advantage of the latest VMware Cloud Foundation (VCF) 9.x features such as <a href=\"https://aws.amazon.com/blogs/migration-and-modernization/increase-your-cluster-density-with-memory-tiering-in-amazon-elastic-vmware-service/\">memory tiering</a>&nbsp;and new automations such as the <a href=\"https://github.com/aws/solutions-for-amazon-evs/tree/main/Deploy/EVS-Deployment-Orchestrator\">Amazon EVS Deployment Orchestrator</a> to simplify onboarding.</p> \n<p>This latest release is available in AWS Regions where Amazon EVS and Amazon EC2 i7i are both available. See <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon EVS regional availability</a> and <a href=\"https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-instance-regions.html\">Amazon EC2 i7i regional availability</a>.</p> \n<p>Learn more about Amazon EVS by visiting the <a href=\"https://aws.amazon.com/evs/\">product detail page</a> and the <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>.</p>"
"last_updated": "2026-08-28 08:31:52 JST"
