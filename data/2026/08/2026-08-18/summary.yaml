"overview": |
  この日はエージェントの決済と Bedrock の API 拡充が話題でした。Amazon Bedrock は OpenAI GPT-5.6 モデル (Sol / Terra / Luna) を bedrock-runtime エンドポイントでサポートし、Responses・Converse などの API とクロスリージョン推論に対応しました。機械学習ブログでは自律エージェントにウォレットと支出ガードレールを与え、有料 API や MCP サーバー、Web コンテンツの支払いを行わせる OpenClaw と AgentCore payments の連携が紹介されています。アーキテクチャブログの「Consistency is the new latency」では、AI エージェントがチャットボットから行動する存在へ移るにつれ、その信頼性が下層のデータ層の一貫性に依存するという観点が示されました。ACM の E メール検証終了については日本語の移行案内も公開されています。サービス更新は Network Firewall のステートフルルールのヒットカウント、EC2 Auto Scaling のバッチインスタンス終了 (1 回の API で最大 100 台)、WorkSpaces のネステッド仮想化対応などです。
