  "dd4d12ee03e3ec2dd33b75b87b90d1ae":
    "id": "dd4d12ee03e3ec2dd33b75b87b90d1ae"
    "title": "Amazon Quick Microsoft 365 extensions are now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick-microsoft-365-extensions-generally-available"
    "published": "2026-08-18 00:41:00"
    "fetched": "2026-08-18 01:21:38"
    "summary": "<p>Amazon Quick announces the general availability of Microsoft 365 extensions for Excel, PowerPoint, Word, and Outlook. These extensions enable Quick to perform tasks directly within users' M365 environments, using AI to handle complex local tasks such as redlining documents, building financial models, creating presentation-ready decks, and managing Outlook inboxes.</p> \n<p>The Excel extension helps with complex spreadsheet analysis, creating pivot tables and charts, and importing and cleaning data. The PowerPoint extension helps you create and refine presentations from Quick data using organization-defined templates. The Word extension generates formatted documents with Word primitives, makes sweeping edits with track changes enabled, and participates as a reviewer in comments. The Outlook extension performs inbox and calendaring tasks such as prioritizing emails, organizing your inbox, scheduling meetings, and drafting replies using your Quick data and entire inbox context.</p> \n<p>These extensions transform daily work across teams. Finance teams can build complex models by describing what they need. Sales teams can draft proposals that automatically pull from CRM data. Marketing teams can create branded presentations without manual formatting. Legal teams can streamline contract reviews. Operations teams can manage email workflows and schedule meetings intelligently, and IT teams can automate routine data analysis that previously required manual effort.</p> \n<p>Amazon Quick Microsoft 365 extensions are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), Asia Pacific (Tokyo), and Europe (Frankfurt). To learn more, see <a href=\"https://aws.amazon.com/blogs/machine-learning/amazon-quick-for-microsoft-365-agentic-ai-where-you-work/\">Amazon Quick for Microsoft 365: Agentic AI where you work</a>, and download extensions on the <a href=\"https://aws.amazon.com/quick/download/\" target=\"_blank\">Quick download page.</a></p>"
  "7e13912163d2c98d6f8b5297ce9849c1":
    "id": "7e13912163d2c98d6f8b5297ce9849c1"
    "title": "Amazon OpenSearch Service now supports automatic semantic enrichment for VPC domains"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-opensearch-service-vpc/"
    "published": "2026-08-18 00:39:00"
    "fetched": "2026-08-18 01:21:38"
    "summary": "<p>Amazon OpenSearch Service now extends automatic semantic enrichment to VPC-enabled domains, allowing customers with private network configurations to leverage AI-powered semantic search without exposing their domains to the public internet.</p> \n<p>&nbsp;<br /> Automatic semantic enrichment transforms traditional keyword-only search into context-aware retrieval by understanding the meaning behind queries. For example, a search for \"lightweight laptop for travel\" returns results about \"ultrabooks\" and \"portable notebooks under 3 lbs\" even when these exact terms aren't in the query. The feature handles all semantic processing automatically, eliminating the need to self-manage machine learning models and integration overhead. Previously, automatic semantic enrichment was available only on domains that are not VPC-enabled. This capability is now supported within VPCs (Virtual Private Clouds), enabling customers with stricter network security requirements to improve search relevance while maintaining their existing security posture. No changes to existing VPC configurations are required. To learn more about automatic semantic enrichment, see our <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-semantic-enrichment.html\">documentation</a>.</p> \n<p>&nbsp;<br /> Automatic semantic enrichment for VPC domains is available across 11 Regions globally: US East (N. Virginia, Ohio), US West (Oregon), Asia Pacific (Mumbai, Singapore, Sydney, Tokyo), and Europe (Frankfurt, Ireland, Spain, Stockholm). To get started, on your VPC-enabled OpenSearch Service domain running OpenSearch version 2.19 or later, create an index with automatic semantic enrichment fields configured. Note that you may need to update your domain to the latest service software version, see <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/service-software.html\">updating service software</a> for more information. </p>"
  "e2efe8eaeaa5b1f6e1bff80ea204059a":
    "id": "e2efe8eaeaa5b1f6e1bff80ea204059a"
    "title": "Amazon EC2 Auto Scaling now supports batch instance termination"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-auto-scaling-batch-termination"
    "published": "2026-08-18 03:11:00"
    "fetched": "2026-08-18 04:23:37"
    "summary": "<p>Amazon EC2 Auto Scaling now supports batch instance termination in a single API call. You can now pass up to 100 instance IDs to the TerminateInstanceInAutoScalingGroup API to terminate them as a batch, reducing the number of API calls needed to scale down your Auto Scaling groups.</p> \n<p>Batch termination is designed for workloads that need to rapidly scale down, such as AI/ML training jobs, container orchestrators, or event-driven architectures that spin up large fleets temporarily. All instances in a batch are validated atomically before termination begins, and existing Auto Scaling behaviors such as lifecycle hooks and load balancer connection draining are preserved for each instance in the batch.</p> \n<p>This feature is available in all AWS Regions at no additional cost.</p> \n<p>To learn more, visit <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scaling-manually.html\">Amazon EC2 Auto Scaling User Guide</a> and <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/APIReference/API_TerminateInstanceInAutoScalingGroup.html\">Amazon EC2 Auto Scaling API Reference Guide</a>.</p>"
  "faa025e6fcd20993c8bd2be4140b5073":
    "id": "faa025e6fcd20993c8bd2be4140b5073"
    "title": "Amazon EC2 R8i and R8i-Flex instances are now available in Canada West (Calgary) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-r8i-r8i-flex-calgary/"
    "published": "2026-08-18 02:28:00"
    "fetched": "2026-08-18 04:23:37"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and R8i-flex instances are available in the Canada West (Calgary) region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.</p> \n<p>R8i-flex, our first memory-optimized Flex instances, are the easiest way to get price performance benefits for a majority of memory-intensive workloads. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.</p> \n<p>R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications. <a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" target=\"_blank\">R8i instances are SAP-certified </a>and deliver 142,100 aSAPS, the highest among all comparable machines in on-premises and cloud environments, delivering exceptional performance for mission-critical SAP workloads.</p> \n<p>To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" target=\"_blank\">R8i and R8i-flex </a>instances visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" target=\"_blank\">blog</a>.&nbsp;</p>"
  "ba51749c10869eba4e89cbaa229380a9":
    "id": "ba51749c10869eba4e89cbaa229380a9"
    "title": "Amazon Bedrock expands API support and introduces Cross Region Inferencing for OpenAI models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-cross-region-openai-v2/"
    "published": "2026-08-18 05:29:00"
    "fetched": "2026-08-18 06:21:07"
    "summary": "<p>Amazon Bedrock now supports the OpenAI GPT-5.6 models (Sol, Terra, and Luna) on the bedrock-runtime endpoint, with support for the Responses, Converse, and Chat Completions APIs. It also adds support for cross-Region inference, allowing customers to use Global and Geo cross-Region inference to access higher throughput and lower inference costs.&nbsp;&nbsp;</p> \n<p>Cross-Region inference automatically routes inference requests across multiple AWS Regions to give you higher throughput, without you needing to manage capacity across multiple Regions. Geo cross region inference routes requests within a predefined geography—including new US Geo (US CRIS) support with this launch—so you can scale while keeping data processed within that geography, while Global cross region inference serve requests from any commercial AWS Region where the model is available, giving you the broadest access to Bedrock capacity and the highest throughput during demand spikes. With Global cross-Region inference you also get lower costs as Global inferencing is priced lower per token for OpenAI models than in-Region and Geo inferencing. This launch also expands API support—you can also use OpenAI GPT models with the Responses API, Chat Completions API, and the Converse API on the bedrock-runtime endpoint. Because these native OpenAI APIs now run on bedrock-runtime, the models work with the same account-level controls you already use for other models on Bedrock: usage appears in Bedrock model invocation logging (deliverable to Amazon S3 or Amazon CloudWatch Logs) and in Amazon CloudWatch metrics covering invocation counts, token counts, latency, throttles, and errors, and it is itemized in AWS Cost Explorer and the AWS Cost and Usage Report so you can attribute spend by model.</p> \n<p>Cross-Region inference for OpenAI models is available in all AWS Regions where OpenAI models on Amazon Bedrock are offered. To get started, review the model cards for GPT 5.6 (Sol, Tera and Luna) in the <a href=\"https://docs.aws.amazon.com/bedrock/\">Amazon Bedrock User Guide.</a></p>"
  "e8b78f38fc771b7bc94bcab26e98ea12":
    "id": "e8b78f38fc771b7bc94bcab26e98ea12"
    "title": "Amazon Connect Customer dashboards now support reporting on routing steps and agent proficiencies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-routing-steps/"
    "published": "2026-08-18 02:23:00"
    "fetched": "2026-08-18 07:19:25"
    "summary": "<p>Amazon Connect Customer dashboards now support reporting on routing steps and agent proficiencies enabling supervisors to monitor and optimize how contacts are matched to agents based on agent proficiencies. Managers can filter agents by their assigned proficiencies, group metrics by routing steps, and track new metrics including number of contacts queued in a routing step. For example, a supervisor notices a spike in queued contacts at a routing step requiring highly skilled agents, then relaxes the routing criteria to expand the agent pool and reduce wait times.<br /> <br /> Routing steps and agent proficiencies reporting on analytics dashboards is available in all AWS commercial and AWS GovCloud (US-West) <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">regions</a> where Amazon Connect Customer is offered. To learn more about Amazon Connect Customer analytics dashboards, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/dashboards.html\">Amazon Connect Customer Administrator Guide</a>. To learn more about Amazon Connect Customer, the AWS cloud-based contact center, please visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.</p>"
  "03131339d35fdfe36651d50d60646fbb":
    "id": "03131339d35fdfe36651d50d60646fbb"
    "title": "AWS Network Firewall Now Supports Stateful Rule Hit Counts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-network-firewall-stateful-rule-hit-counts/"
    "published": "2026-08-18 01:30:00"
    "fetched": "2026-08-18 07:19:25"
    "summary": "<div class=\"OutlineElement Ltr SCXW86699367 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW86699367 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; padding-left: 0.0px; padding-right: 0.0px; text-indent: 0.0px;\"><span class=\"TextRun SCXW86699367 BCX2\"><span class=\"NormalTextRun SCXW86699367 BCX2\">AWS Network Firewall now provides rule hit counts for stateful rules, giving network administrators and security engineers visibility into how often each stateful rule in the firewall policy matches network traffic. AWS Network Firewall is a managed network firewall service that provides inspection and visibility into your VPC traffic.</span></span><span class=\"EOP Selected SCXW86699367 BCX2\"></span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW86699367 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW86699367 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; padding-left: 0.0px; padding-right: 0.0px; text-indent: 0.0px;\"><span class=\"TextRun SCXW86699367 BCX2\"><span class=\"NormalTextRun SCXW86699367 BCX2\">With rule hit counts, you can turn firewall rule activity into actionable intelligence. You can accelerate incident response by detecting the rules that triggered, identify policy blind spots such as shadow, redundant, and obsolete rules, and validate policy changes by confirming newly deployed rules are matching the intended traffic. Rule hit counts are enabled by default across both custom and managed rule groups, with metrics refreshing at configurable intervals as low as 5 minutes.</span></span><span class=\"EOP Selected SCXW86699367 BCX2\"></span></p> \n</div> \n<div class=\"OutlineElement Ltr SCXW86699367 BCX2\" style=\"direction: ltr;\">\n <p class=\"Paragraph SCXW86699367 BCX2\" style=\"font-weight: normal; font-style: normal; vertical-align: baseline; background-color: transparent; color: windowtext; text-align: left; padding-left: 0.0px; padding-right: 0.0px; text-indent: 0.0px;\"><span class=\"TextRun SCXW86699367 BCX2\"><span class=\"NormalTextRun SCXW86699367 BCX2\">This capability is available at no additional charge as part of AWS Network Firewall. Standard charges apply for storing and querying log data. This feature is available in all AWS Regions where AWS Network Firewall is supported,&nbsp;except the Middle East (UAE) and Middle East (Bahrain) Regions.<br /> <br /> To learn more, see the <a href=\"https://aws.amazon.com/network-firewall/\">AWS Network Firewall product page</a> and <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html\">AWS Network Firewall documentation</a>.</span></span></p> \n</div>"
  "cb96c0c946da0cc4148f6de83104eaca":
    "id": "cb96c0c946da0cc4148f6de83104eaca"
    "title": "Amazon ECR now supports 25 replication rules per registry"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ecr-increased-replication-rules-limit"
    "published": "2026-08-18 04:01:00"
    "fetched": "2026-08-18 08:18:15"
    "summary": "<p>Amazon Elastic Container Registry (Amazon ECR) has increased the maximum number of replication rules per registry from 10 to 25.</p> \n<p>Previously, customers with complex multi-region or multi-account architectures were constrained to 10 replication rules per registry, requiring them to consolidate replication configurations to work within that constraint. With this update, customers can define up to 25 replication rules per registry, enabling more precise replication strategies for use cases like distributing images across many regions for low-latency pulls, or replicating to multiple production and staging accounts.</p> \n<p>This service limit increase is available in all AWS Regions where Amazon ECR is supported. To learn more, visit the <a href=\"https://aws.amazon.com/ecr/\">Amazon ECR product page</a> and refer to the <a href=\"https://docs.aws.amazon.com/AmazonECR/latest/userguide/\">Amazon ECR User Guide</a>.&nbsp;</p>"
  "ad5ad022340b232084aea61d77dd84b4":
    "id": "ad5ad022340b232084aea61d77dd84b4"
    "title": "Amazon MSK now supports configuring custom domain names for MSK Provisioned clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/17/amazon-msk-custom-domain-names/"
    "published": "2026-08-18 03:01:00"
    "fetched": "2026-08-18 08:18:15"
    "summary": "<p>You can now easily configure custom domain names on <a href=\"https://aws.amazon.com/msk/\">Amazon MSK Provisioned </a>clusters, on either ZooKeeper or KRaft mode for metadata management. This capability helps client applications maintain the same connection endpoints, simplifying cluster migrations, disaster recovery failovers, and scaling operations without reconfiguration.</p> \n<p>Previously, customers configured custom domain names manually on each broker. Additionally, on KRaft-based clusters, customers could not configure custom domain names. With this launch, you can now easily define a custom domain once at the cluster level, and Amazon MSK automatically applies it to every broker in the cluster, eliminating the need to configure each broker individually. The configuration persists through scaling operations and works identically on both ZooKeeper and KRaft-based clusters. This is particularly useful for customers who route traffic through Network Load Balancers, require persistent endpoints across cluster operations, or must adhere to organizational naming conventions for security and compliance.</p> \n<p>You can configure custom domain names on all new and existing MSK Provisioned clusters, in all AWS Regions where Amazon MSK Provisioned is available, at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\">Amazon MSK Developer Guide</a>.</p>"
  "58d784c94eabb94abf91ea51591c3847":
    "id": "58d784c94eabb94abf91ea51591c3847"
    "title": "AWS Console-to-Code adds 26 services and cross-region recording​"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/console-to-code-adds-26-services"
    "published": "2026-08-18 00:00:00"
    "fetched": "2026-08-19 03:31:36"
    "summary": "<p>AWS Console-to-Code now supports 26 additional AWS services and introduces cross-region and cross-browser-tab action recording. This expansion grows total service coverage from 6 to 32 supported services, helping developers, DevOps engineers, and cloud architects more easily convert manual console workflows into repeatable, production-ready infrastructure as code (IaC).</p> \n<p>​Console-to-Code also introduces cross-region and cross-browser-tab action recording. Previously, switching regions or working across browser tabs would reset or fragment recorded action lists. Actions are now consolidated into a single unified list, enabling customers to capture and automate complex, multi-region infrastructure deployments without losing context.</p> \n<p>​​​Starting today, customers in all commercial AWS Regions can use Console-to-Code with all 32 supported services and the new cross-region recording capability.​</p> \n<p>To learn more about getting started with AWS Console-to-Code, and review the list of services supported, visit the <a href=\"https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/console-to-code.html\">Amazon Q Developer Console-to-Code documentation</a>.</p>"
"last_updated": "2026-08-19 03:31:36 JST"
