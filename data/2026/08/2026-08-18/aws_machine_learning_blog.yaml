    "title": "NVIDIA Nemotron 3.5 Lightning now available in Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/blogs/machine-learning/nvidia-nemotron-3-5-lightning-now-available-in-amazon-sagemaker-jumpstart/"
    "published": "2026-08-18 03:06:33"
    "fetched": "2026-08-18 03:32:15"
    "summary": "NVIDIA Nemotron 3.5 Lightning, an open model built for high-volume agentic workloads, is now available in Amazon SageMaker JumpStart. This post shows how to deploy the 30B Mixture-of-Experts model (3B active), which delivers up to 4x higher throughput and up to 30% faster task completion for always-on agents."
