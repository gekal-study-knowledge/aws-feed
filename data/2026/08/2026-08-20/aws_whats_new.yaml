  "31ba76204f3df5a61d32fd77ce6707fa":
    "id": "31ba76204f3df5a61d32fd77ce6707fa"
    "title": "Amazon Quick adds deny by default for custom permissions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick-deny-by-default/"
    "published": "2026-08-20 00:36:00"
    "fetched": "2026-08-20 02:21:57"
    "summary": "<p>Amazon Quick custom permissions now include deny by default, a governance setting that automatically restricts new AI capabilities before they reach users.<br /> <br /> Previously, new AI capabilities were available to all users on release, requiring administrators to react after the fact. With deny by default, administrators restrict the AI capability category in a custom permissions profile and assign it to users, roles, or the entire account. Quick then denies any new AI capability at launch for those users. Restricting a category also restricts existing capabilities in it. Administrators explicitly allow each capability when ready. The restriction applies only to the profile you configure.<br /> <br /> Configure deny by default in Manage account in Amazon Quick or through the AWS CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions-governance.html\" target=\"_blank\">Custom permissions deny by default</a>. Deny by default is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" target=\"_blank\">Amazon Quick is available</a>.</p>"
  "3233e33cbf6a4aeec73492fa5f23ab55":
    "id": "3233e33cbf6a4aeec73492fa5f23ab55"
    "title": "Amazon OpenSearch Ingestion is now available in GovCloud Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/opensearch-ingestion-available-govcloud-regions"
    "published": "2026-08-20 02:54:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>Starting today, customers can use Amazon OpenSearch Ingestion in AWS GovCloud (US-East) and AWS GovCloud (US-West), for ingesting data into their Amazon OpenSearch Service managed clusters or serverless collections.<br /> <br /> Amazon OpenSearch Ingestion is a fully managed data ingestion tier that allows you to ingest and process data before indexing it in Amazon OpenSearch managed clusters or serverless collections. Amazon OpenSearch Ingestion provides a no-code experience to filter, transform, redact, and route data into Amazon OpenSearch Service. Amazon OpenSearch Ingestion automatically provisions and scales the underlying resources to meet the fluctuating demands of your workloads.<br /> <br /> With this launch, Amazon OpenSearch Ingestion is now generally available in 19 AWS regions: US East (Ohio), US East (N. Virginia), US West (Oregon), US West (N. California), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Spain), Europe (Paris), Asia Pacific (Tokyo), Asia Pacific (Sydney), Asia Pacific (Singapore), Asia Pacific (Mumbai), Asia Pacific (Seoul), Canada (Central), South America (Sao Paulo), Europe (Stockholm), GovCloud (US-East) and GovCloud (US-West).<br /> <br /> To learn more, see the <a href=\"https://aws.amazon.com/opensearch-service/features/ingestion/\">Amazon OpenSearch Ingestion</a> webpage and the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ingestion.html\">Amazon OpenSearch Ingestion Developer Guide</a>.</p>"
  "f0bbc8b0ad0aa3f90a08e9326418c15a":
    "id": "f0bbc8b0ad0aa3f90a08e9326418c15a"
    "title": "AWS announces a new Availability Zone in the Europe (London) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-iam-increased-quota/"
    "published": "2026-08-20 02:00:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>AWS has added a fourth Availability Zone to the Europe (London) Region (eu-west-2), expanding infrastructure capacity to meet growing demand for cloud compute in the Region. The new Availability Zone delivers next-generation AI and ML capacity, including Amazon EC2, Trn3, and P6 accelerated instances, alongside general-purpose compute. The new Availability Zone gives AWS customers in eu-west-2 greater capacity for AI and ML workloads and additional fault isolation for building highly available, resilient architectures.</p> \n<p>With this new Availability Zone (eu-west-2d), customers can distribute applications across four Availability Zones in eu-west-2, improving fault tolerance and supporting high availability architectures. AI and ML teams can now run model training and inference workloads on the latest accelerated instance types entirely within the London Region. The new Availability Zone is accessible through the AWS Management Console, APIs, and existing workflows with no changes to tooling. Standard Europe (London) Region pricing applies.</p> \n<p>To get started, visit <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\">AWS Global Infrastructure</a> to learn more about Regions, Availability Zones, and how efficient data center designs and sustainability practices power AWS cloud infrastructure. Explore the <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Builder Center</a> for hands-on resources, the <a href=\"https://aws.amazon.com/ec2/instance-types/trn3/\">EC2 Trainium page</a> for AI and ML workloads, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regional Product Services</a> for a full list of services available by Region.<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\"></a></p>"
  "2373f7c30a8055136a22fda052a1c0ed":
    "id": "2373f7c30a8055136a22fda052a1c0ed"
    "title": "Amazon WorkSpaces Applications now offers in-console monitoring capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-workspaces-applications-console-monitoring"
    "published": "2026-08-20 00:00:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>Amazon WorkSpaces Applications now offers a native monitoring experience embedded directly in the service console. Administrators can now access real-time session-level metrics, instance-level resource data, and network performance metrics without requiring third-party monitoring tools or Amazon CloudWatch expertise.</p> \n<p>Previously, enterprise customers managing large WorkSpaces Applications deployments relied on external solutions or built complex custom CloudWatch dashboards. Now, comprehensive monitoring is available with zero configuration required. The WorkSpaces Applications in-console monitoring provides fleet-level capacity visibility showing active sessions and resource utilization, customizable session tables with filtering by user ID, performance metrics, and instance ID, and correlated graphical views displaying session metrics such as frame rate, input latency, bandwidth, and CPU/memory/GPU usage on shared timelines. All these metrics are also available in Amazon CloudWatch giving customers the flexibility to pick the right experience for monitoring their WorkSpaces Applications resources.</p> \n<p>This functionality is available today in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a> where Amazon WorkSpaces Applications is offered.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/monitoring.html\" target=\"_blank\">Amazon WorkSpaces Applications documentation</a> OR log on to <a href=\"https://console.aws.amazon.com/appstream2/home\" target=\"_blank\">Amazon WorkSpaces Applications Console,</a> navigate to the fleets menu, and select a fleet to monitor the active session metrics.&nbsp;<br /> </p>"
  "daccdcf6210fbc28299ba021feabdd62":
    "id": "daccdcf6210fbc28299ba021feabdd62"
    "title": "AWS Cost Anomaly Detection supports third-party models on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-cost-anomaly-detection-bedrock-3P/"
    "published": "2026-08-20 02:57:00"
    "fetched": "2026-08-20 05:21:12"
    "summary": "<p><a href=\"https://aws.amazon.com/aws-cost-management/aws-cost-anomaly-detection/\">AWS Cost Anomaly Detection</a> now monitors spend on third-party foundation models running on Amazon Bedrock, such as Anthropic Claude and other provider-hosted models. Cost Anomaly Detection uses machine learning to detect and alert on unusual spend, and this launch extends that coverage to third-party model usage on Amazon Bedrock. Teams running production generative AI workloads now get automatic anomaly detection on their Amazon Bedrock model spend alongside the rest of their AWS costs.</p> \n<p>With this launch, Cost Anomaly Detection automatically evaluates your third-party Amazon Bedrock model costs through your AWS managed service monitor, with no setup required. When spend on a model changes unexpectedly, you receive an alert and a root-cause breakdown ranked by dollar impact across AWS service, account, Region, and usage type, so you can understand and act on generative AI cost changes as quickly as you do for any other AWS spend.</p> \n<p>This feature is available in all AWS commercial regions, except the AWS GovCloud and the China Regions.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html\">Detecting unusual spend with AWS Cost Anomaly Detection</a> in the AWS Billing and Cost Management User Guide.</p>"
  "a6eb27bccec38901cdc878114358eeca":
    "id": "a6eb27bccec38901cdc878114358eeca"
    "title": "Amazon SageMaker notebooks now support trusted identity propagation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-sagemaker/"
    "published": "2026-08-20 05:25:00"
    "fetched": "2026-08-20 06:20:42"
    "summary": "<p>Amazon SageMaker Notebooks now support Trusted Identity Propagation (TIP) with Amazon Athena, Amazon Redshift, and Amazon EMR Serverless, enabling per-user access control for data analytics.</p> \n<p>When connected to a TIP-enabled compute in a TIP-enabled Project, each notebook user's IAM Identity Center identity flows through to AWS Lake Formation, ensuring they see only the tables, columns, and rows their permissions allow, without sharing a single broad execution role. With TIP, enterprises get per-user data boundaries enforced based on who is running the query, full audit attribution with CloudTrail recording which user accessed data, and reduced admin friction since identity propagates automatically through the existing compute connection with no extra login, token, or role management required.</p> \n<p>To get started, use a notebook in a TIP enabled Project with the supported engines.&nbsp;&nbsp;This feature is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all AWS Regions where Amazon SageMaker Unified Studio is available</a>.&nbsp;To learn more, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/trusted-identity-propagation.html\">Trusted identity propagation</a> in the Amazon SageMaker Unified Studio Administrator Guide and <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks.html\">Notebooks</a> in the Amazon SageMaker Unified Studio User Guide.</p>"
  "8f4f8b1bf2182c6e7751faa2a09367df":
    "id": "8f4f8b1bf2182c6e7751faa2a09367df"
    "title": "AWS announces a new Availability Zone in the Europe (London) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-new-availability-zone-europe/"
    "published": "2026-08-20 02:00:00"
    "fetched": "2026-08-20 06:20:42"
    "summary": "<p>AWS has added a fourth Availability Zone to the Europe (London) Region (eu-west-2), expanding infrastructure capacity to meet growing demand for cloud compute in the Region. The new Availability Zone delivers next-generation AI and ML capacity, including Amazon EC2, Trn3, and P6 accelerated instances, alongside general-purpose compute. The new Availability Zone gives AWS customers in eu-west-2 greater capacity for AI and ML workloads and additional fault isolation for building highly available, resilient architectures.</p> \n<p>With this new Availability Zone (eu-west-2d), customers can distribute applications across four Availability Zones in eu-west-2, improving fault tolerance and supporting high availability architectures. AI and ML teams can now run model training and inference workloads on the latest accelerated instance types entirely within the London Region. The new Availability Zone is accessible through the AWS Management Console, APIs, and existing workflows with no changes to tooling. Standard Europe (London) Region pricing applies.</p> \n<p>To get started, visit <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\">AWS Global Infrastructure</a> to learn more about Regions, Availability Zones, and how efficient data center designs and sustainability practices power AWS cloud infrastructure. Explore the <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Builder Center</a> for hands-on resources, the <a href=\"https://aws.amazon.com/ec2/instance-types/trn3/\">EC2 Trainium page</a> for AI and ML workloads, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regional Product Services</a> for a full list of services available by Region.<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\"></a></p>"
  "e63dd7172cc62b567a32a45639b1ed66":
    "id": "e63dd7172cc62b567a32a45639b1ed66"
    "title": "Launching External Web Access for Web Search on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-web-access-web-search/"
    "published": "2026-08-20 08:00:00"
    "fetched": "2026-08-20 08:18:27"
    "summary": "<p>Earlier this month, we announced <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-web/\" style=\"background-color: rgb(255,255,255);\">Web Search on Amazon Bedrock</a>, a built-in server-side tool that allows you to ground model responses with current web knowledge, while maintaining data within your secured AWS environment with zero data egress. Today, we are expanding Web Search to enable the external_web_access parameter allowing Web Search to retrieve content directly from the public web so models can ground responses in the latest information.</p> \n<p>To enable external_web_access, grant the bedrock-websearch:ExternalWebAccess IAM permission to the request identity and leave the external_web_access parameter at its default of true. &nbsp;In doing so, Web Search can then fetch content live from the public web for use cases that need the freshest possible information, such as latest sports score, live pricing, or newly released documentation. If handling sensitive data, to keep retrieval entirely within your AWS boundary, set external_web_access: false. By setting it false, Web Search serves results only from Amazon's in-AWS web index and knowledge graph, with no request data leaving the AWS boundary. &nbsp;</p> \n<p>Enabling External Web Access is available in the following AWS Regions: US East (N. Virginia), US East (Ohio), and US West (Oregon). To learn more, read our blog post <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-web-search-on-amazon-bedrock-for-foundation-model-grounding/\">Introducing Web Search on Amazon Bedrock for foundation model grounding,</a> review <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/web-search.html#web-search-controlling-external\">Controlling external web access</a> in the Amazon Bedrock User Guide, and visit the <a href=\"https://aws.amazon.com/bedrock/pricing/\">Amazon Bedrock pricing page</a> for cost details.</p> \n<p>&nbsp;</p>"
  "9742a89f7506b09d15f96a6fb0a3f1ca":
    "id": "9742a89f7506b09d15f96a6fb0a3f1ca"
    "title": "Amazon CloudWatch log Centralization now supports log group tag propagation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cloudwatch-centralization-tag-propogation/"
    "published": "2026-08-20 06:06:00"
    "fetched": "2026-08-20 08:18:27"
    "summary": "<p>Amazon CloudWatch Centralization now copies log group tags from source accounts to the destination log groups created by centralization rules. CloudWatch Centralization aggregates log data from multiple accounts and Regions into one destination account. With tag propagation, the cost, ownership, and compliance tags you maintain at the source now apply to the copied log groups.</p> \n<p>With today's launch, CloudWatch copies the tags of each source log group to its destination log group and keeps them in sync based on the tag propogation behaviour selected as part of the centralization rule setup. For example, a platform team can preserve Application and CostCenter tags on centralized log groups, then use those tags to scope access with IAM conditions and report centralized log spend by team in AWS Cost Explorer.</p> \n<p>Tag propagation is available in all AWS Regions where CloudWatch Centralization is available. For a list of Regions, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions table</a>.</p> \n<p>To get started, turn on tag propagation for a centralization rule in the Amazon CloudWatch console, or by using the AWS CLI or AWS SDKs. To learn more about centralizing logs while preserving their tags, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html\" rel=\"noopener noreferrer\" target=\"_blank\">Log Centralization User Guide</a>. For Centralization pricing, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch pricing</a>.</p>"
  "5c4d14c0e23eff68e2075256b5d7cdc8":
    "id": "5c4d14c0e23eff68e2075256b5d7cdc8"
    "title": "AWS Marketplace launches support for Amazon Lightsail"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-marketplace-launch-ami-amazon-lightsail"
    "published": "2026-08-20 02:04:00"
    "fetched": "2026-08-20 08:18:27"
    "summary": "<p>Today, AWS Marketplace announces support for launching select Amazon Machine Images (AMIs) on Amazon Lightsail. Customers who want simple, predictable pricing and a streamlined instance-creation experience can now easily deploy eligible AWS Marketplace AMIs on Amazon Lightsail in just a few clicks. Lightsail instance bundles include compute, storage, and a generous data transfer allowance at a fixed monthly price. Lightsail also offers managed databases, containers, load balancers, and more, making it easy for customers to scale their applications as they grow.</p> \n<p>When subscribing to a supported AWS Marketplace product - including Microsoft Windows Server, Microsoft SQL Server Express, Ubuntu, cPanel &amp; WHM, and Plesk - customers will now have the option to select Amazon Lightsail in addition to Amazon EC2. Selecting Lightsail takes customers to the Lightsail console with the selected AMI and region pre-configured, providing a path to deploy at a predictable monthly price in just a few clicks.</p> \n<p>The \"Launch on Lightsail\" deployment option is available for eligible products in all <a href=\"https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html\">AWS Regions where Lightsail is available</a>. To get started, visit <a href=\"https://aws.amazon.com/marketplace\">AWS Marketplace</a> and subscribe to a compatible product. For more information about Amazon Lightsail, visit the <a href=\"https://aws.amazon.com/lightsail/\">Amazon Lightsail product page</a>.</p>"
"last_updated": "2026-08-20 08:18:27 JST"
