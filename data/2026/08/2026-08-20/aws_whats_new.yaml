  "31ba76204f3df5a61d32fd77ce6707fa":
    "id": "31ba76204f3df5a61d32fd77ce6707fa"
    "title": "Amazon Quick adds deny by default for custom permissions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-quick-deny-by-default/"
    "published": "2026-08-20 00:36:00"
    "fetched": "2026-08-20 02:21:57"
    "summary": "<p>Amazon Quick custom permissions now include deny by default, a governance setting that automatically restricts new AI capabilities before they reach users.<br /> <br /> Previously, new AI capabilities were available to all users on release, requiring administrators to react after the fact. With deny by default, administrators restrict the AI capability category in a custom permissions profile and assign it to users, roles, or the entire account. Quick then denies any new AI capability at launch for those users. Restricting a category also restricts existing capabilities in it. Administrators explicitly allow each capability when ready. The restriction applies only to the profile you configure.<br /> <br /> Configure deny by default in Manage account in Amazon Quick or through the AWS CLI. To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/custom-permissions-governance.html\" target=\"_blank\">Custom permissions deny by default</a>. Deny by default is available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/regions.html\" target=\"_blank\">Amazon Quick is available</a>.</p>"
  "3233e33cbf6a4aeec73492fa5f23ab55":
    "id": "3233e33cbf6a4aeec73492fa5f23ab55"
    "title": "Amazon OpenSearch Ingestion is now available in GovCloud Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/opensearch-ingestion-available-govcloud-regions"
    "published": "2026-08-20 02:54:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>Starting today, customers can use Amazon OpenSearch Ingestion in AWS GovCloud (US-East) and AWS GovCloud (US-West), for ingesting data into their Amazon OpenSearch Service managed clusters or serverless collections.<br /> <br /> Amazon OpenSearch Ingestion is a fully managed data ingestion tier that allows you to ingest and process data before indexing it in Amazon OpenSearch managed clusters or serverless collections. Amazon OpenSearch Ingestion provides a no-code experience to filter, transform, redact, and route data into Amazon OpenSearch Service. Amazon OpenSearch Ingestion automatically provisions and scales the underlying resources to meet the fluctuating demands of your workloads.<br /> <br /> With this launch, Amazon OpenSearch Ingestion is now generally available in 19 AWS regions: US East (Ohio), US East (N. Virginia), US West (Oregon), US West (N. California), Europe (Ireland), Europe (London), Europe (Frankfurt), Europe (Spain), Europe (Paris), Asia Pacific (Tokyo), Asia Pacific (Sydney), Asia Pacific (Singapore), Asia Pacific (Mumbai), Asia Pacific (Seoul), Canada (Central), South America (Sao Paulo), Europe (Stockholm), GovCloud (US-East) and GovCloud (US-West).<br /> <br /> To learn more, see the <a href=\"https://aws.amazon.com/opensearch-service/features/ingestion/\">Amazon OpenSearch Ingestion</a> webpage and the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ingestion.html\">Amazon OpenSearch Ingestion Developer Guide</a>.</p>"
  "f0bbc8b0ad0aa3f90a08e9326418c15a":
    "id": "f0bbc8b0ad0aa3f90a08e9326418c15a"
    "title": "AWS announces a new Availability Zone in the Europe (London) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-iam-increased-quota/"
    "published": "2026-08-20 02:00:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>AWS has added a fourth Availability Zone to the Europe (London) Region (eu-west-2), expanding infrastructure capacity to meet growing demand for cloud compute in the Region. The new Availability Zone delivers next-generation AI and ML capacity, including Amazon EC2, Trn3, and P6 accelerated instances, alongside general-purpose compute. The new Availability Zone gives AWS customers in eu-west-2 greater capacity for AI and ML workloads and additional fault isolation for building highly available, resilient architectures.</p> \n<p>With this new Availability Zone (eu-west-2d), customers can distribute applications across four Availability Zones in eu-west-2, improving fault tolerance and supporting high availability architectures. AI and ML teams can now run model training and inference workloads on the latest accelerated instance types entirely within the London Region. The new Availability Zone is accessible through the AWS Management Console, APIs, and existing workflows with no changes to tooling. Standard Europe (London) Region pricing applies.</p> \n<p>To get started, visit <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\">AWS Global Infrastructure</a> to learn more about Regions, Availability Zones, and how efficient data center designs and sustainability practices power AWS cloud infrastructure. Explore the <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Builder Center</a> for hands-on resources, the <a href=\"https://aws.amazon.com/ec2/instance-types/trn3/\">EC2 Trainium page</a> for AI and ML workloads, and <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regional Product Services</a> for a full list of services available by Region.<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/\"></a></p>"
  "2373f7c30a8055136a22fda052a1c0ed":
    "id": "2373f7c30a8055136a22fda052a1c0ed"
    "title": "Amazon WorkSpaces Applications now offers in-console monitoring capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-workspaces-applications-console-monitoring"
    "published": "2026-08-20 00:00:00"
    "fetched": "2026-08-20 04:20:41"
    "summary": "<p>Amazon WorkSpaces Applications now offers a native monitoring experience embedded directly in the service console. Administrators can now access real-time session-level metrics, instance-level resource data, and network performance metrics without requiring third-party monitoring tools or Amazon CloudWatch expertise.</p> \n<p>Previously, enterprise customers managing large WorkSpaces Applications deployments relied on external solutions or built complex custom CloudWatch dashboards. Now, comprehensive monitoring is available with zero configuration required. The WorkSpaces Applications in-console monitoring provides fleet-level capacity visibility showing active sessions and resource utilization, customizable session tables with filtering by user ID, performance metrics, and instance ID, and correlated graphical views displaying session metrics such as frame rate, input latency, bandwidth, and CPU/memory/GPU usage on shared timelines. All these metrics are also available in Amazon CloudWatch giving customers the flexibility to pick the right experience for monitoring their WorkSpaces Applications resources.</p> \n<p>This functionality is available today in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a> where Amazon WorkSpaces Applications is offered.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/monitoring.html\" target=\"_blank\">Amazon WorkSpaces Applications documentation</a> OR log on to <a href=\"https://console.aws.amazon.com/appstream2/home\" target=\"_blank\">Amazon WorkSpaces Applications Console,</a> navigate to the fleets menu, and select a fleet to monitor the active session metrics.&nbsp;<br /> </p>"
"last_updated": "2026-08-20 04:20:41 JST"
