  "62e05e7bad939461baed56e0b3f5abf7":
    "id": "62e05e7bad939461baed56e0b3f5abf7"
    "title": "AWS HealthOmics と Amazon Bedrock AgentCore によるゲノムバリアント解釈の高速化"
    "link": "https://aws.amazon.com/jp/blogs/news/accelerating-genomics-variant-interpretation-with-aws-healthomics-and-amazon-bedrock-agentcore/"
    "published": "2026-08-20 14:41:36"
    "fetched": "2026-08-20 15:38:06"
    "summary": "シーケンスデータの急増により、ゲノムバリアントの解釈は複雑なパイプラインと専門知識を要する作業になっています。本記事では、AWS HealthOmics のワークフローと Amazon S3 Tables、Amazon Bedrock AgentCore 上の Strands Agents を組み合わせ、VCF ファイルの取り込みからアノテーション、自然言語での問い合わせまでを一貫して実行するゲノムバリアント解釈エージェントを紹介します。臨床研究者が SQL を書かずに、対話形式でコホート全体のバリアントを解析できるようになります。"
  "562c0426d5afc7f28f8f51646a54511e":
    "id": "562c0426d5afc7f28f8f51646a54511e"
    "title": "AWS Organizations における Amazon Inspector 抑制ルールのベストプラクティス"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-inspector-suppression-rules-best-practices-for-aws-organizations/"
    "published": "2026-08-20 14:30:49"
    "fetched": "2026-08-20 15:38:06"
    "summary": "マルチアカウント環境で数千件におよぶ脆弱性の検出結果を効果的に管理するには、適切な優先順位付けが不可欠です。本記事では、AWS Organizations 全体で Amazon Inspector を活用した脆弱性管理のベストプラクティスを紹介します。委任管理者の設定、抑制ルールによる検出結果の大規模な管理、リソースタグを活用したリスクベースの優先順位付け、AWS Security Hub との統合など、7 つの実践的なアプローチを解説します。原文公開後のサービスアップデートは訳注として補足しています。"
  "d7891ebe04a82785e1b028d9db5e03e6":
    "id": "d7891ebe04a82785e1b028d9db5e03e6"
    "title": "Amazon Inspector を使用したソフトウェア部品表 (SBOM) のエクスポート"
    "link": "https://aws.amazon.com/jp/blogs/news/export-a-software-bill-of-materials-using-amazon-inspector/"
    "published": "2026-08-20 14:26:10"
    "fetched": "2026-08-20 15:38:06"
    "summary": "Amazon Inspector を使用して、組織全体のリソースの統合されたソフトウェア部品表 (SBOM) を CycloneDx や SPDX 形式で Amazon S3 にエクスポートする方法を紹介します。CloudFormation による前提条件のデプロイから、AWS Glue クローラーでのデータカタログ化、Amazon Athena を使用した脆弱性やパッケージの分析クエリまでを解説します。SBOM を活用することで、ソフトウェアサプライチェーンの可視化やコンプライアンス対応を実現できます。"
