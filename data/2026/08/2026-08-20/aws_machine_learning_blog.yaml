  "113b688925ff5a78a86cccd5a9e5727f":
    "id": "113b688925ff5a78a86cccd5a9e5727f"
    "title": "How Fanatics Betting and Gaming built a multi-agent customer support system"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-fanatics-betting-and-gaming-built-a-multi-agent-customer-support-system/"
    "published": "2026-08-20 05:40:45"
    "fetched": "2026-08-20 06:20:44"
    "summary": "Fanatics Betting and Gaming built a multi-agent customer support system on AWS to handle the complexity of sports betting: state-specific rules, real-time responsible gaming, and traffic spikes during major sporting events. This post walks through the architecture, the AWS services involved, and the patterns for your own multi-agent support solution."
  "3b74f3ad96b8b16a2d085d94f181d0a7":
    "id": "3b74f3ad96b8b16a2d085d94f181d0a7"
    "title": "KnowledgeForge: mining gold from the ITSM ticket graveyard"
    "link": "https://aws.amazon.com/blogs/machine-learning/knowledgeforge-mining-gold-from-the-itsm-ticket-graveyard/"
    "published": "2026-08-20 05:36:50"
    "fetched": "2026-08-20 06:20:44"
    "summary": "KnowledgeForge mines resolved ITSM incident tickets into new knowledge base articles and automatically curates the existing library by deduplicating, quality-scoring, and improving content, using Amazon Bedrock, Amazon S3 Vectors, and AWS Step Functions in a multi-tenant, closed-loop pipeline."
  "2dd4ecb399977f7df584354b25f4f8a2":
    "id": "2dd4ecb399977f7df584354b25f4f8a2"
    "title": "Domain and publish date filters for Web Search on AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/domain-and-publish-date-filters-for-web-search-on-agentcore/"
    "published": "2026-08-20 07:13:20"
    "fetched": "2026-08-20 07:19:35"
    "summary": "Web Search on Amazon Bedrock AgentCore now supports runtime domain and published-date filtering. New per-request filters give developers per-call control over which web sources their agents consult and how fresh those sources must be, all enforced server-side. This release also expands Web Search to the Europe (Ireland) and Asia Pacific (Tokyo) Regions."
  "8eaf4fe8e6fb552337a889f515c20b0d":
    "id": "8eaf4fe8e6fb552337a889f515c20b0d"
    "title": "Automate Document Processing with Quick Automate and the IDP Accelerator"
    "link": "https://aws.amazon.com/blogs/machine-learning/automate-document-processing-with-quick-automate-and-the-idp-accelerator/"
    "published": "2026-08-20 07:09:56"
    "fetched": "2026-08-20 07:19:35"
    "summary": "Classifying, extracting, and validating high volumes of documents is a challenge across banking, insurance, healthcare, and the public sector. See how a mid-size mortgage lender automates its entire document intake pipeline, from email to validated data, using the AWS GAIIC IDP Accelerator and Amazon Quick Automate."
  "13b2e7d6b88c0474ad7d13b0b9d86889":
    "id": "13b2e7d6b88c0474ad7d13b0b9d86889"
    "title": "Asynchronous patterns for calling Amazon Bedrock AgentCore agents in serverless pipelines"
    "link": "https://aws.amazon.com/blogs/machine-learning/asynchronous-patterns-for-calling-amazon-bedrock-agentcore-agents-in-serverless-pipelines/"
    "published": "2026-08-20 07:06:09"
    "fetched": "2026-08-20 07:19:35"
    "summary": "In this post, you learn three serverless patterns (task-token callback, direct service integration, and durable functions) for invoking Amazon Bedrock AgentCore agents asynchronously from AWS Step Functions pipelines, eliminating idle compute costs while your AI agent processes requests."
