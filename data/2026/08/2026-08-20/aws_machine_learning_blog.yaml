    "title": "How Fanatics Betting and Gaming built a multi-agent customer support system"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-fanatics-betting-and-gaming-built-a-multi-agent-customer-support-system/"
    "published": "2026-08-20 05:40:45"
    "fetched": "2026-08-20 06:20:44"
    "summary": "Fanatics Betting and Gaming built a multi-agent customer support system on AWS to handle the complexity of sports betting: state-specific rules, real-time responsible gaming, and traffic spikes during major sporting events. This post walks through the architecture, the AWS services involved, and the patterns for your own multi-agent support solution."
