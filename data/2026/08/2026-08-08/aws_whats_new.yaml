  "aebbcea92aa58f7850fdc8c901bf5d71":
    "id": "aebbcea92aa58f7850fdc8c901bf5d71"
    "title": "AWS IAM Identity Center supports one-click multi-Region option for new organization instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-iam-identity-center-supports-one-click-multi-region-option-new-organization-instances"
    "published": "2026-08-08 01:00:00"
    "fetched": "2026-08-08 02:44:49"
    "summary": "<p>AWS IAM Identity Center now makes it easier to enable multi-Region support when creating a new organization instance. Previously, enabling multi-Region support required multiple steps including creating a customer managed KMS key, configuring key policies, and manually adding Regions. Now, customers creating a new IAM Identity Center instance in supported Regions can enable multi-Region in one click.</p> \n<p>When enabling a new organization instance, you can choose from three instance configuration options: single-Region instance, multi-Region instance, or custom instance. The multi-Region instance option automatically creates a customer managed multi-Region KMS key in your account and replicates your instance to an additional Region. This enables resilient AWS account and application access — your workforce can continue to access their AWS accounts even if IAM Identity Center experiences a disruption in the primary Region. The custom instance option lets you configure your Region settings individually, including the ability to use an existing customer managed KMS key from your account.</p> \n<p>Instance configuration options are available in <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-regions.html?refid=6e78b6f1-dfd8-49b4-ae84-4527ca1881cb#manage-acct-regions-regional-availability\" rel=\"noopener noreferrer\" target=\"_blank\">17 enabled-by-default commercial AWS Regions</a> for organization instances of IAM Identity Center. Standard AWS KMS charges apply for the customer managed key created with the multi-Region instance option. IAM Identity Center is provided at no additional cost.</p> \n<p>To get started, see the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/enable-identity-center.html\" rel=\"noopener noreferrer\" target=\"_blank\">IAM Identity Center User Guide</a>. To learn more about multi-Region support, see <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using IAM Identity Center across multiple AWS Regions</a>. To learn more about IAM Identity Center, visit the <a href=\"https://aws.amazon.com/iam/identity-center/\" rel=\"noopener noreferrer\" target=\"_blank\">product detail page</a>.</p>"
  "cb754f9d806601e86351f5665a83a3db":
    "id": "cb754f9d806601e86351f5665a83a3db"
    "title": "Amazon Timestream for InfluxDB now supports backup and restore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/timestream-influxdb-backup-restore/"
    "published": "2026-08-08 04:21:00"
    "fetched": "2026-08-08 05:36:04"
    "summary": "<p>Amazon Timestream for InfluxDB now lets you create and manage your own backups and restore your data on demand. You can trigger one-time, on-demand backups, schedule automated recurring backups at the frequency and retention you choose, and restore a backup to a new resource or in place of an existing one. This capability is available for both the InfluxDB 2 and InfluxDB 3 engines through the AWS Management Console, the AWS CLI, and the Timestream for InfluxDB API.<br /> <br /> With this capability, you control your data protection strategy. You can take an on-demand backup before a risky migration or configuration change. You can also define up to four automated backup configurations per resource using hourly, daily, weekly, monthly, or custom schedules, each with its own retention period. The first backup captures a full copy of your database, and subsequent backups are incremental, reducing the performance impact of ongoing backups. When you restore a backup, you can create a new resource that inherits the source configuration or replace an existing resource. If the source resource uses a Customer Managed key (KMS), its backups use the same key.</p> \n<p>Customer-driven backup and restore is available in all AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Amazon Timestream for InfluxDB is available. To get started, open the Amazon Timestream console. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "1915ca2a719ca7cf62572922fd9a148d":
    "id": "1915ca2a719ca7cf62572922fd9a148d"
    "title": "Amazon Cognito now available as a skill in the Agent Toolkit for AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-auth-agent-skill/"
    "published": "2026-08-08 03:00:48"
    "fetched": "2026-08-08 05:36:04"
    "summary": "<p>Amazon Cognito is now available as a core skill (aws-auth) in the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\">Agent Toolkit for AWS</a>. AI coding agents using the toolkit can now set up, configure, secure, and troubleshoot Amazon Cognito using best-practice workflows, helping developers implement secure sign-in flows for users, AI agents, and microservices faster.</p> \n<p>&nbsp;</p> \n<p>The Amazon Cognito (aws-auth) skill covers user pool and app client configuration, managed login and OAuth 2.0 flows, token management, JWT authorizers, passkey/WebAuthn enrollment, threat protection, Lambda trigger wiring, and identity pools. When paired with the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html\">AWS MCP Server</a>, agents execute AWS CLI commands with IAM-based guardrails and CloudTrail audit logging. The skill also works standalone via the AWS CLI.</p> \n<p>&nbsp;</p> \n<p>The Amazon Cognito (aws-auth) skill is available as part of the Agent Toolkit for AWS. To get started, see the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/core-skills/aws-auth\">Amazon Cognito aws-auth skill on GitHub</a> or browse the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/quick-start.html\">Agent Toolkit Quick Start guide</a>. For more information about Amazon Cognito, see the <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">Amazon Cognito Developer Guide</a>.</p>"
  "2c03789e2d6e916521b934bb506c9c9f":
    "id": "2c03789e2d6e916521b934bb506c9c9f"
    "title": "Amazon Bedrock AgentCore adds memory, policy, and harness in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/agentcore-memory-policy-harness-govcloud/"
    "published": "2026-08-08 00:52:00"
    "fetched": "2026-08-08 05:36:04"
    "summary": "<p>Today, Amazon Bedrock AgentCore introduces new capabilities in AWS GovCloud (US-West). AgentCore is the platform to build, connect, and optimize agents. With these capabilities, teams operating in regulated environments can build context-aware agents and take them from prototype to production faster, with the controls needed to scale across their organization.&nbsp;</p> \n<p>AgentCore memory gives agents short-term memory for immediate conversation context and long-term memory that extracts persistent insights and preferences across sessions. Agents deliver more intelligent, personalized experiences without teams needing to manage complex memory infrastructure.</p> \n<p>Policy in AgentCore provides centralized, fine-grained controls for agent-tool interactions that operate outside agent code. Teams author policies in natural language that automatically convert to Cedar, the AWS open-source policy language. Policies attach them to an AgentCore gateway that evaluates each request before allowing or denying tool access.&nbsp;</p> \n<p>The managed harness lets developers declare an agent's model, tools, and instructions through configuration and run it in just a few API calls without writing orchestration code, while AgentCore handles the environment, compute, memory, identity, and observability.&nbsp;<br /> &nbsp;<br /> To learn more about AgentCore capabilities, visit the <a href=\"https://aws.amazon.com/bedrock/agentcore/?trk=f7596381-283b-40e2-90fe-22e22b18daf5&amp;sc_channel=ps&amp;ef_id=CjwKCAjwvsvTBhBaEiwAmf-3niL0_BL-F8aPK5N9EXC66KLf4e2JBdor5IkcUSJ2nRSQGOzEy8zoXxoCvWIQAvD_BwE&amp;gads_camp=23527793912&amp;gads_ag=197228065909&amp;gads_ad=813189298265&amp;gads_kw=agentcore&amp;gads_matchtype=p&amp;gads_network=g&amp;gads_device=c&amp;gads_geo=9007584&amp;gad_campaignid=23527793912&amp;gclid=CjwKCAjwvsvTBhBaEiwAmf-3niL0_BL-F8aPK5N9EXC66KLf4e2JBdor5IkcUSJ2nRSQGOzEy8zoXxoCvWIQAvD_BwE\">AgentCore product page</a>. For a deeper walkthrough of AgentCore concepts and best practices, see the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html\">AgentCore Documentation</a> to get started.</p>"
