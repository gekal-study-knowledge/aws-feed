    "summary": "AWS は Anthropic および OpenAI との協業を発表しました。AWS Continuum for code vulnerabilities (プレビュー) が Claude Code、Codex、Kiroの開発者ワークフローに直接統合され、開発者は既存のワークフローの中で脆弱性の発見、コンテキストに基づく優先順位付け、検証、修復を行えるようになります。"
