  "16c1841aad2b4a72cac1eac7d5803e7b":
    "id": "16c1841aad2b4a72cac1eac7d5803e7b"
    "title": "Amazon EC2 introduces application status checks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-application-status-checks"
    "published": "2026-08-11 02:47:00"
    "fetched": "2026-08-11 05:36:54"
    "summary": "<p>Amazon EC2 introduces application status checks, a new status check that helps customers detect and respond to application-level issues on their EC2 instances. With application status checks, EC2 monitors applications to detect issues such as a web server that has stopped accepting requests, a Docker daemon that is not running, an incorrect networking configuration, or a network interface that is no longer passing traffic.</p> \n<p>Customers rely on EC2 status checks today to receive alerts when an instance or the underlying system is unreachable. However, to monitor application issues, customers had to build and maintain their own monitoring solution. Now, with application status checks customers can monitor the status of their applications running on EC2 instances alongside existing EC2 instance and system status checks. Customers create a check by specifying the protocol, port, and path to monitor, along with the response codes that indicate a healthy application. After customers associate the check with their instances by instance ID or tag, Amazon EC2 sends HTTP or HTTPS requests to that port and path and reports on the application’s status every 60 seconds. Auto Scaling groups act on application status, initiating recovery by replacing instances when their applications report unhealthy.</p> \n<p>Application status checks are available in all commercial AWS Regions and AWS GovCloud (US) Regions.</p> \n<p>To get started with application status checks and review pricing, see the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/application-status-checks.html\">Amazon EC2 User Guide</a>.</p>"
  "0db8e1164349db5c3322a29e369040c8":
    "id": "0db8e1164349db5c3322a29e369040c8"
    "title": "Amazon OpenSearch Serverless now supports up to 10,000 collections per collection group"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-opensearch-serverless-supports-10000-collections-per-collection-group/"
    "published": "2026-08-11 00:51:00"
    "fetched": "2026-08-11 05:36:54"
    "summary": "<p>The next generation of Amazon OpenSearch Serverless now supports up to 10,000 collections within a single collection group, increased from the previous limit of 1,500. Collection groups organize multiple collections and enable them to share OpenSearch Compute Units (OCUs), even when the collections are encrypted with different AWS KMS keys. With this higher limit, you can consolidate significantly more collections into a single collection group and manage them under a shared set of capacity limits.</p> \n<p>Customers use collection groups to reduce costs by sharing compute across many collections rather than provisioning separate OCUs for each KMS key, while still maintaining collection-level security and access controls. As customer workloads have grown, particularly for multi-tenant applications that provision a collection per tenant, the previous limit of 1,500 collections per group constrained how many tenants could benefit from a shared compute pool. Raising the limit to 10,000 collections on the next generation of Amazon OpenSearch Serverless lets you scale these workloads further, improve compute utilization, and lower per-collection cost, without creating and operating additional collection groups. The higher limit applies automatically to new and existing nextgen collection groups.</p> \n<p>The increased limit is available on the next generation of Amazon OpenSearch Serverless in all AWS Regions where it is <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\">available</a>. To learn more, see Amazon OpenSearch Serverless&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-create.html#serverless-create-nextgen-easy\" rel=\"noopener noreferrer\" target=\"_blank\">technical documentation</a> and <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html#opensearch-limits-serverless\">quotas</a>.</p> \n<p>&nbsp;</p>"
  "b3bcd27b803ae9fd78d1a05c785b5530":
    "id": "b3bcd27b803ae9fd78d1a05c785b5530"
    "title": "Amazon GameLift Streams Now Offers Service-managed Shader Caching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/Amazon-GameLift-Streams-Shader-Caching/"
    "published": "2026-08-11 06:15:00"
    "fetched": "2026-08-11 07:32:44"
    "summary": "<p>Amazon GameLift Streams now manages shader cache capture and distribution for your applications. You capture a shader cache from a stream session, and the service automatically makes it available for future sessions across your streaming locations. No application changes are required.<br /> <br /> Capturing shader caches can help reduce loading times and visual stuttering, during the session. With service-managed shader caching, you designate a stream session for capture and run your application to generate the cache. Amazon GameLift Streams then replicates the cache to compatible stream groups and locations, and loads it automatically in future sessions.<br /> <br /> You can monitor shader cache status and storage size using the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_ListApplicationShaderCaches.html\">ListApplicationShaderCaches API</a> or the Amazon GameLift Streams console. The feature supports Linux (Ubuntu 22.04), Proton, and Windows Server 2022 runtimes.<br /> <br /> You are charged for storage of the latest version of each shader cache. For pricing details, visit the <a href=\"https://aws.amazon.com/gamelift/streams/pricing/\">Amazon GameLift Streams pricing page</a>. For supported Regions, see the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/regions-quotas-rande.html\">AWS Region table</a>.</p>"
  "894203ecf3bc9c43256b57ea1c3406ce":
    "id": "894203ecf3bc9c43256b57ea1c3406ce"
    "title": "FLUX.2-small-decoder and gemma-4-12B-it models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/flux.2-small-decoder-gemma-4-12B-it-on-sagemaker-jumpstart/"
    "published": "2026-08-11 08:08:00"
    "fetched": "2026-08-11 10:20:50"
    "summary": "<p>Black Forest Labs' FLUX.2-small-decoder and Google's gemma-4-12B-it models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These two models bring specialized capabilities spanning efficient image generation decoding and unified multimodal understanding, enabling customers to deploy high-performance, scalable AI solutions on AWS infrastructure.</p> \n<p>FLUX.2-small-decoder is optimized for faster image decoding with lower VRAM usage in FLUX.2 image generation pipelines. It is a distilled VAE decoder that serves as a drop-in replacement for the standard FLUX.2 decoder, delivering approximately 1.4× faster decoding speed at 1.4× lower VRAM consumption with minimal to zero quality loss. Benefits increase at higher resolutions where the decoder processes more pixels, making it ideal for production-grade image generation workloads at scale.</p> \n<p>gemma-4-12B-it excels in unified multimodal understanding across text, image, and audio inputs with native support for function calling and agentic workflows. It features an encoder-free architecture where all modalities flow directly into a single decoder-only transformer, delivering performance nearing Google's larger 26B MoE model at less than half the memory footprint. Compact enough to run on 16GB of RAM, it enables powerful multimodal and agentic experiences for enterprise deployments.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "d6959826fbb969310589d5e15eb58417":
    "id": "d6959826fbb969310589d5e15eb58417"
    "title": "langcache-embed-v3-small, Mellum2-12B-A2.5B-Thinking, and LightOnOCR-2-1B models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/langcache-embed-v3-small-mellum2-12B-A2.5B-thinking-lightOnOCR-2-1B-on-sagemaker-jumpstart/"
    "published": "2026-08-11 08:05:00"
    "fetched": "2026-08-11 10:20:50"
    "summary": "<p>Redis's langcache-embed-v3-small, JetBrains' Mellum2-12B-A2.5B-Thinking, and LightOn's LightOnOCR-2-1B models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three models bring specialized capabilities spanning semantic caching optimization, code-focused reasoning, and end-to-end document OCR, enabling customers to deploy high-performance, scalable AI solutions on AWS infrastructure.</p> \n<p>langcache-embed-v3-small is optimized for semantic caching in LLM applications. It maps sentences and paragraphs into a dense vector space purpose-built for identifying semantically equivalent queries regardless of phrasing, enabling intelligent cache hits that reduce redundant LLM calls and accelerate response times in high-volume inference workloads.</p> \n<p>Mellum2-12B-A2.5B-Thinking excels in code generation, debugging, multi-step reasoning, and agentic coding workflows. It uses a Mixture-of-Experts architecture (64 experts, 8 activated per token), activating only 2.5B of its 12B total parameters per forward pass with a 131,072-token context length. It emits explicit chain-of-thought reasoning traces before final answers, delivering high-throughput, low-latency inference ideal for routing, RAG, sub-agents, and private deployments.</p> \n<p>LightOnOCR-2-1B provides end-to-end multilingual document-to-text conversion for PDFs, scans, and images without brittle OCR pipelines. This 1B-parameter vision-language model directly transduces page images into clean, naturally ordered text, achieving state-of-the-art performance on OlmOCR-Bench while being ~9× smaller and significantly faster than competing approaches.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.<br /> <br /> To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "d34b754b4a09c42b1452e8236c6bab3b":
    "id": "d34b754b4a09c42b1452e8236c6bab3b"
    "title": "Amazon EC2 High Memory U7i instances now available in AWS South America (São Paulo) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-high-memory-u7i-south-america"
    "published": "2026-08-11 08:02:00"
    "fetched": "2026-08-11 10:20:50"
    "summary": "<p>Amazon EC2 High Memory U7in-24TB instances (u7in-24tb.224xlarge) are now available in AWS South America (São Paulo) region. U7i instances are part of the AWS 7th generation and are powered by custom fourth-generation Intel Xeon Scalable processors (Sapphire Rapids). U7in-24TB instances offer 24 TiB of DDR5 memory, enabling customers to scale transaction processing throughput in a fast-growing data environment.</p> \n<p>U7in-24TB instances deliver 896 vCPUs and support up to 100 Gbps of Amazon EBS bandwidth for faster data loading and backups, 200 Gbps of network bandwidth, and ENA Express. U7i instances are ideal for customers running mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.</p> \n<p>To learn more about U7i instances, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High Memory instances page</a>.</p>"
  "6e00eeb9e8ad6aca64d91b11c6b3e075":
    "id": "6e00eeb9e8ad6aca64d91b11c6b3e075"
    "title": "GLM-5.2 FP8, NVIDIA-Nemotron-Nano-12B-v2 and GLM-OCR models now available on Amazon SageMaker JumpStart"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/01/glm-5.2-fp8-nemotron-nano-12b-v2-glm-ocr-on-sagemaker-jumpstart/"
    "published": "2026-08-11 08:02:00"
    "fetched": "2026-08-11 10:20:50"
    "summary": "<p>Z.ai's GLM-5.2 FP8, NVIDIA's Nemotron-Nano-12B-v2, and Z.ai's GLM-OCR models are now available on Amazon SageMaker JumpStart, expanding the portfolio of foundation models available to AWS customers. These three models bring specialized capabilities spanning long-horizon agentic engineering, efficient hybrid reasoning, and advanced document understanding, enabling customers to deploy high-performance, scalable AI solutions on AWS infrastructure.</p> \n<p>GLM-5.2 FP8 is optimized for long-horizon tasks and agentic engineering workflows such as full-cycle software development from requirements to deployment. It delivers a substantial leap in long-horizon task capability over its predecessor GLM-5.1 and, for the first time, provides a truly usable 1M-token context window, enabling it to handle project-level engineering context, execute long-running tasks reliably, follow engineering standards consistently, and complete full development workflows in a single task.</p> \n<p>NVIDIA-Nemotron-Nano-12B-v2 excels in unified reasoning and non-reasoning tasks with high inference throughput, making it ideal for enterprise applications requiring both accuracy and efficiency. It uses a hybrid Mamba-2 and Transformer architecture with a 128K context length, generating reasoning traces before concluding with final responses. Its compact 12B parameter design achieves comparable or better accuracy than leading open models while delivering up to 6x higher inference throughput.</p> \n<p>GLM-OCR provides accurate, fast, and comprehensive document understanding for complex real-world materials including scanned PDFs, handwritten notes, dense academic papers with formulas, multi-column tables, code documentation, and multilingual text. This 0.9B-parameter multimodal model reconstructs structure, tables, and formulas into clean Markdown, JSON, or LaTeX, with latency low enough for real-time services and edge devices—ideal for large-scale document processing and invoice extraction workflows.</p> \n<p>With SageMaker JumpStart, customers can deploy any of these models with just a few clicks to address their specific AI use cases.</p> \n<p>To get started with these models, navigate to the SageMaker JumpStart model catalog in the SageMaker console or use the SageMaker Python SDK to deploy the models to your AWS account. For more information about deploying and using foundation models in SageMaker JumpStart, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/studio-jumpstart.html\">Amazon SageMaker JumpStart documentation</a>.</p>"
  "924301bcf39adaa8ab5bc58e998f0a0b":
    "id": "924301bcf39adaa8ab5bc58e998f0a0b"
    "title": "Amazon Connect Customer launches performance dashboard for Cases"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-cases-dashboard/"
    "published": "2026-08-11 22:30:00"
    "fetched": "2026-08-12 00:56:39"
    "summary": "<p>Amazon Connect Customer now provides a performance dashboard for cases that helps managers monitor case volume, resolution trends, and performance against service level agreement (SLA) targets. Managers can compare current and prior-period performance across metrics such as cases created, average resolution time, first-contact resolution percentage, and SLA achievement rate. They can also analyze trends across dimensions such as case template, assigned user, or assigned queue. For example, a manager can identify that the billing team missed more SLA targets for refund cases than in the prior period, investigate the causes, and prioritize process improvements.</p> \n<p>Cases is available in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town). To learn more and get started, visit the Cases <a href=\"https://aws.amazon.com/connect/cases/\" target=\"_blank\">webpage</a> and <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/cases-performance-dashboard.html\" target=\"_blank\">documentation</a>.</p>"
  "ce0686fb5eae480fd2b4fd2bf49a5d51":
    "id": "ce0686fb5eae480fd2b4fd2bf49a5d51"
    "title": "Amazon RDS for MariaDB now supports MariaDB 12.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-rds-mariadb-1232-available/"
    "published": "2026-08-11 17:54:00"
    "fetched": "2026-08-12 02:55:01"
    "summary": "<p>Starting today, Amazon RDS for MariaDB supports MariaDB major version 12.3, the latest Long-Term Support release from the MariaDB community. This release supports MariaDB 12.3.2 minor version. &nbsp;<br /> <br /> MariaDB 12.3 includes Oracle TO_DATE() function compatibility, reducing the code changes needed when migrating applications from Oracle to MariaDB. It adds an IS JSON predicate, so you can validate JSON documents natively in the database rather than in application code. The query optimizer now handles reorderable LEFT JOIN statements and ordered scans over RANGE partitions more efficiently, improving performance for these queries without application changes. For more details, refer to the <a href=\"https://mariadb.com/docs/release-notes/community-server/12.3\" rel=\"noopener noreferrer\" target=\"_blank\">MariaDB 12.3 release notes</a> and <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MariaDB.Concepts.VersionMgmt.html\" rel=\"noopener noreferrer\" target=\"_blank\">RDS MariaDB release notes</a>.<br /> <br /> You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. Learn more about performing major version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MariaDB.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS User Guide</a>. You can also migrate to RDS for MariaDB 12.3 from external MariaDB sources using <a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service</a>.&nbsp;&nbsp;<br /> <br /> Amazon RDS for MariaDB makes it simple to set up, operate, and scale MariaDB deployments in the cloud. Learn more about pricing details and regional availability at <a href=\"https://aws.amazon.com/rds/mariadb/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MariaDB</a>. Create or update a fully managed Amazon RDS for MariaDB database in the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a>.</p>"
"last_updated": "2026-08-12 02:55:01 JST"
