    "title": "Amazon EC2 introduces application status checks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-application-status-checks"
    "published": "2026-08-11 02:47:00"
    "fetched": "2026-08-11 05:36:54"
    "summary": "<p>Amazon EC2 introduces application status checks, a new status check that helps customers detect and respond to application-level issues on their EC2 instances. With application status checks, EC2 monitors applications to detect issues such as a web server that has stopped accepting requests, a Docker daemon that is not running, an incorrect networking configuration, or a network interface that is no longer passing traffic.</p> \n<p>Customers rely on EC2 status checks today to receive alerts when an instance or the underlying system is unreachable. However, to monitor application issues, customers had to build and maintain their own monitoring solution. Now, with application status checks customers can monitor the status of their applications running on EC2 instances alongside existing EC2 instance and system status checks. Customers create a check by specifying the protocol, port, and path to monitor, along with the response codes that indicate a healthy application. After customers associate the check with their instances by instance ID or tag, Amazon EC2 sends HTTP or HTTPS requests to that port and path and reports on the application’s status every 60 seconds. Auto Scaling groups act on application status, initiating recovery by replacing instances when their applications report unhealthy.</p> \n<p>Application status checks are available in all commercial AWS Regions and AWS GovCloud (US) Regions.</p> \n<p>To get started with application status checks and review pricing, see the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/application-status-checks.html\">Amazon EC2 User Guide</a>.</p>"
  "0db8e1164349db5c3322a29e369040c8":
    "id": "0db8e1164349db5c3322a29e369040c8"
    "title": "Amazon OpenSearch Serverless now supports up to 10,000 collections per collection group"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-opensearch-serverless-supports-10000-collections-per-collection-group/"
    "published": "2026-08-11 00:51:00"
    "fetched": "2026-08-11 05:36:54"
    "summary": "<p>The next generation of Amazon OpenSearch Serverless now supports up to 10,000 collections within a single collection group, increased from the previous limit of 1,500. Collection groups organize multiple collections and enable them to share OpenSearch Compute Units (OCUs), even when the collections are encrypted with different AWS KMS keys. With this higher limit, you can consolidate significantly more collections into a single collection group and manage them under a shared set of capacity limits.</p> \n<p>Customers use collection groups to reduce costs by sharing compute across many collections rather than provisioning separate OCUs for each KMS key, while still maintaining collection-level security and access controls. As customer workloads have grown, particularly for multi-tenant applications that provision a collection per tenant, the previous limit of 1,500 collections per group constrained how many tenants could benefit from a shared compute pool. Raising the limit to 10,000 collections on the next generation of Amazon OpenSearch Serverless lets you scale these workloads further, improve compute utilization, and lower per-collection cost, without creating and operating additional collection groups. The higher limit applies automatically to new and existing nextgen collection groups.</p> \n<p>The increased limit is available on the next generation of Amazon OpenSearch Serverless in all AWS Regions where it is <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html\">available</a>. To learn more, see Amazon OpenSearch Serverless&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless-create.html#serverless-create-nextgen-easy\" rel=\"noopener noreferrer\" target=\"_blank\">technical documentation</a> and <a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html#opensearch-limits-serverless\">quotas</a>.</p> \n<p>&nbsp;</p>"
  "b3bcd27b803ae9fd78d1a05c785b5530":
    "id": "b3bcd27b803ae9fd78d1a05c785b5530"
    "title": "Amazon GameLift Streams Now Offers Service-managed Shader Caching"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/Amazon-GameLift-Streams-Shader-Caching/"
    "published": "2026-08-11 06:15:00"
    "fetched": "2026-08-11 07:32:44"
    "summary": "<p>Amazon GameLift Streams now manages shader cache capture and distribution for your applications. You capture a shader cache from a stream session, and the service automatically makes it available for future sessions across your streaming locations. No application changes are required.<br /> <br /> Capturing shader caches can help reduce loading times and visual stuttering, during the session. With service-managed shader caching, you designate a stream session for capture and run your application to generate the cache. Amazon GameLift Streams then replicates the cache to compatible stream groups and locations, and loads it automatically in future sessions.<br /> <br /> You can monitor shader cache status and storage size using the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/apireference/API_ListApplicationShaderCaches.html\">ListApplicationShaderCaches API</a> or the Amazon GameLift Streams console. The feature supports Linux (Ubuntu 22.04), Proton, and Windows Server 2022 runtimes.<br /> <br /> You are charged for storage of the latest version of each shader cache. For pricing details, visit the <a href=\"https://aws.amazon.com/gamelift/streams/pricing/\">Amazon GameLift Streams pricing page</a>. For supported Regions, see the <a href=\"https://docs.aws.amazon.com/gameliftstreams/latest/developerguide/regions-quotas-rande.html\">AWS Region table</a>.</p>"
"last_updated": "2026-08-11 07:32:44 JST"
