"overview": |
  この日は開発者ワークフローへのセキュリティ統合が目立ちました。AWS が Anthropic および OpenAI と協業し、AWS Continuum for code vulnerabilities がプレビューとして Claude Code・Codex・Kiro の開発者ワークフローへ直接統合され、既存のワークフローの中で脆弱性を発見できるようになりました。SageMaker JumpStart には GLM-5.2 FP8、Nemotron-Nano-12B-v2、GLM-OCR、Mellum2、LightOnOCR-2-1B、FLUX.2-small-decoder、gemma-4-12B-it と多数のモデルが追加されています。ストリーミングでは Amazon MSK が Apache ZooKeeper から KRaft へのインプレース移行に対応しました。EC2 にはアプリケーションレベルの問題を検知するアプリケーションステータスチェックが追加され、IAM には workforce ユーザーへの IAM ロール割り当てを効率化する account access manager が登場しています。コンプライアンスでは 2026 年の CyberVadis 評価を最高スコアで完了し、ロンドンリージョンが PASF 認定を更新しました。
