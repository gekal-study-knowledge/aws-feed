    "published": "2026-03-30 00:53:15"
    "summary": "Amazon Bedrock AgentCore Runtime が永続的なエージェントファイルシステム状態のためのマネージドセッションストレージをサポート開始 (プレビュー)、Amazon SageMaker HyperPod が Slurm オーケストレーションクラスターの継続プロビジョニングをサポート、Amazon SageMaker AI が 12 の追加モデルに対してサーバーレス強化学習ファインチューニングをサポート、Amazon Aurora PostgreSQL が数秒でのデータベース作成と接続をサポート、Amazon Aurora PostgreSQL が AWS 無料利用枠で利用可能になりました　など"
  "d411c98acff990e0298a1142054b2006":
    "id": "d411c98acff990e0298a1142054b2006"
    "title": "隠れたコスト：AWS Well-Architected Framework でクラウドアーキテクチャの隠れたコストを明らかにする"
    "link": "https://aws.amazon.com/jp/blogs/news/the-hidden-price-tag-uncovering-hidden-costs-in-cloud-architectures-with-the-aws-well-architected-framework/"
    "published": "2026-03-30 00:47:50"
    "summary": "AWS とクラウドコンピューティングは、企業の業務運営のあり方を変革しました。組織はクラウド上で大規模にデータを保存、処理、管理できるようになり、コンピューティングリソースをユーティリティとして扱えるようになりました。クラウドアーキテクチャの設計では、それぞれの要件に適したソリューションを見つけるためにトレードオフを検討する必要があります。クラウドアーキテクチャ設計においてベストプラクティスに従わない場合、望ましくない結果や、セキュリティイベントや可用性イベントに伴うコストなどの隠れたコストが発生する可能性があります。"
