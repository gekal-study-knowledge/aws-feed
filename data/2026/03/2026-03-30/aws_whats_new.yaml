    "title": "Access Cluster Insights through the Amazon OpenSearch Service Console and Amazon EventBridge events"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/access-cluster-insights-opensearch/"
    "published": "2026-03-30 14:51:00"
    "summary": "<p>Amazon OpenSearch Service extends access to Cluster Insights through the AWS Management Console, in addition to the existing OpenSearch UI Dashboards. This launch makes it easier to review performance and resilience recommendations and make necessary configuration changes, all within the same Console. In addition, Cluster Insights now publishes insights as events to Amazon EventBridge.<br /> <br /> Cluster insights presents curated insights of a cluster’s operational health along with actionable recommendations to help prevent issues before they affect the stability or performance of the cluster. You can continue to use OpenSearch UI Dashboards for more detailed metrics, including index and shard-level data and top-N query analysis. In addition, with this release, you can monitor insights through Amazon EventBridge events.<br /> <br /> Cluster Insights is available at no additional cost for OpenSearch versions 2.17 or later in all Regions where OpenSearch Service is available. View the complete list of supported Regions <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-ui-endpoints-quotas.html\">here</a>. To learn more about Cluster Insights, refer to our <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cluster-insights.html\">technical documentation</a>.</p>"
  "17d8440c611a14494e4c9ac32a7e5e87":
    "id": "17d8440c611a14494e4c9ac32a7e5e87"
    "title": "AWS Elemental MediaTailor now available in Europe (London)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-elemental-mediatailor-london-region/"
    "published": "2026-03-30 20:00:00"
    "summary": "<p>AWS Elemental MediaTailor is now available in the Europe (London) AWS Region.&nbsp;MediaTailor is a personalized ad insertion and channel assembly service that enables video providers to serve targeted ads in live and on-demand video streams using server-side ad insertion (SSAI) and Server Guided Ad Insertion (SGAI), delivering a broadcast-quality viewing experience without the buffering or ad blockers associated with client-side ad insertion.<br /> <br /> With this expansion, customers serving viewers in Northern Europe can now run ad insertion workloads closer to their audience, reducing ad decisioning latency and improving ad fill rates. Customers using SSAI or SGAI workflows benefit from lower-latency ad stitching and ad tracking closer to their European viewers, and customers already using MediaTailor in Europe (Ireland) gain an additional region for redundancy and increased capacity.<a href=\"http://aws.amazon.com/mediatailor/\"></a></p> \n<p>To learn more, visit the <a href=\"http://aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor product page</a> or the <a href=\"http://aws.amazon.com/mediatailor/resources/\">AWS Elemental MediaTailor User Guide</a>. To get started, sign into the <a href=\"http://console.aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor console</a>.&nbsp;</p>"
