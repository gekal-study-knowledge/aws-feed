  "0dcad5ec6dcbd3d9c7561a8dbebb6f9f":
    "id": "0dcad5ec6dcbd3d9c7561a8dbebb6f9f"
    "title": "Access Cluster Insights through the Amazon OpenSearch Service Console and Amazon EventBridge events"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/access-cluster-insights-opensearch/"
    "published": "2026-03-30 14:51:00"
    "summary": "<p>Amazon OpenSearch Service extends access to Cluster Insights through the AWS Management Console, in addition to the existing OpenSearch UI Dashboards. This launch makes it easier to review performance and resilience recommendations and make necessary configuration changes, all within the same Console. In addition, Cluster Insights now publishes insights as events to Amazon EventBridge.<br /> <br /> Cluster insights presents curated insights of a cluster’s operational health along with actionable recommendations to help prevent issues before they affect the stability or performance of the cluster. You can continue to use OpenSearch UI Dashboards for more detailed metrics, including index and shard-level data and top-N query analysis. In addition, with this release, you can monitor insights through Amazon EventBridge events.<br /> <br /> Cluster Insights is available at no additional cost for OpenSearch versions 2.17 or later in all Regions where OpenSearch Service is available. View the complete list of supported Regions <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/opensearch-ui-endpoints-quotas.html\">here</a>. To learn more about Cluster Insights, refer to our <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cluster-insights.html\">technical documentation</a>.</p>"
  "17d8440c611a14494e4c9ac32a7e5e87":
    "id": "17d8440c611a14494e4c9ac32a7e5e87"
    "title": "AWS Elemental MediaTailor now available in Europe (London)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-elemental-mediatailor-london-region/"
    "published": "2026-03-30 20:00:00"
    "summary": "<p>AWS Elemental MediaTailor is now available in the Europe (London) AWS Region.&nbsp;MediaTailor is a personalized ad insertion and channel assembly service that enables video providers to serve targeted ads in live and on-demand video streams using server-side ad insertion (SSAI) and Server Guided Ad Insertion (SGAI), delivering a broadcast-quality viewing experience without the buffering or ad blockers associated with client-side ad insertion.<br /> <br /> With this expansion, customers serving viewers in Northern Europe can now run ad insertion workloads closer to their audience, reducing ad decisioning latency and improving ad fill rates. Customers using SSAI or SGAI workflows benefit from lower-latency ad stitching and ad tracking closer to their European viewers, and customers already using MediaTailor in Europe (Ireland) gain an additional region for redundancy and increased capacity.<a href=\"http://aws.amazon.com/mediatailor/\"></a></p> \n<p>To learn more, visit the <a href=\"http://aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor product page</a> or the <a href=\"http://aws.amazon.com/mediatailor/resources/\">AWS Elemental MediaTailor User Guide</a>. To get started, sign into the <a href=\"http://console.aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor console</a>.&nbsp;</p>"
  "8003abc3fae12ba5c4ce9783109e5517":
    "id": "8003abc3fae12ba5c4ce9783109e5517"
    "title": "AWS Direct Connect adds CloudWatch metrics for BGP monitoring"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-direct-connect-cloudwatch-bgp-monitoring/"
    "published": "2026-03-30 07:00:00"
    "summary": "<p>AWS Direct Connect now publishes three new Amazon CloudWatch metrics for virtual interfaces (VIFs) that provide visibility into Border Gateway Protocol (BGP) session health and route counts. Network engineers and operations teams managing hybrid cloud connectivity can now monitor BGP sessions natively through CloudWatch without building custom solutions or polling APIs.</p> \n<p>These metrics solve critical monitoring gaps that previously required custom Lambda functions or on-premises network management tools. VirtualInterfaceBgpStatus reports BGP session state, enabling detection when sessions fail. VirtualInterfaceBgpPrefixesAccepted tracks prefixes from your on-premises network, allowing proactive alarms before reaching prefix limits that would cause BGP sessions to enter idle state. VirtualInterfaceBgpPrefixesAdvertised monitors routes AWS advertises to your network, helping validate configuration changes and detect silent route withdrawals that impact traffic even when BGP sessions remain up.</p> \n<p>These metrics are available for private, public, and transit virtual interfaces in all commercial AWS Regions. You can integrate them with CloudWatch alarms, dashboards, and Amazon SNS for comprehensive BGP monitoring, reducing mean time to detect network issues and simplifying operations for multi-region and disaster recovery architectures. To learn more about AWS Direct Connect, visit <a href=\"https://aws.amazon.com/directconnect/\">https://aws.amazon.com/directconnect/</a>.</p>"
  "b39354bcd3b5ee36f913902f0f88f7b9":
    "id": "b39354bcd3b5ee36f913902f0f88f7b9"
    "title": "Amazon SageMaker Data Agent is now available in the Amazon SageMaker Unified Studio Query Editor"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-data-agent-query-editor/"
    "published": "2026-03-30 09:30:00"
    "summary": "<p>Amazon SageMaker Data Agent is now available in the Query Editor in Amazon SageMaker Unified Studio, extending beyond notebook experience. With Data Agent in Query Editor, you can generate SQL queries from natural language, debug failed queries, and explore your data through a conversational, interactive experience.<br /> <br /> Data Agent brings the same conversational experience available in notebooks to your SQL analytics workflow. You can ask \"calculate quarterly revenue growth rate by product category for 2025,\" and the agent proposes a step-by-step plan for you to review before generating contextually accurate SQL for Amazon Redshift and Amazon Athena. This helps you build analytics queries faster, going from question to executable SQL without writing complex joins and aggregations manually. When a query fails, you can use Fix with AI to analyze the error and get suggested corrections. Data Agent maintains awareness of your connected data sources and schema information, so follow-up questions and modifications build on your previous context.<br /> <br /> To get started, navigate to a project in <a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">SageMaker Unified Studio</a>, open the Query Editor from the Build menu, and open the agent panel. Data Agent in Query Editor is available in IAM domains in all AWS Regions where Amazon SageMaker Unified Studio is supported. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/data-agent-query-editor.html\">SageMaker Data Agent</a> and <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/generative-sql.html\">Generative SQL</a> in the Amazon SageMaker Unified Studio User Guide.</p>"
  "3b9c524c616d8a1d7a2b10dc132daccb":
    "id": "3b9c524c616d8a1d7a2b10dc132daccb"
    "title": "Amazon Athena launches Capacity Reservations in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-athena-adding-cap-reservation-regions/"
    "published": "2026-03-30 19:30:00"
    "summary": "<p><a href=\"https://aws.amazon.com/athena/\">Amazon Athena</a> now offers Capacity Reservations in additional commercial AWS Regions. Capacity Reservations give you dedicated serverless capacity for your most important workloads. When you use Capacity Reservations, your queries run in isolation from other workloads in your account, and you control how many queries run concurrently.</p> \n<p>Capacity Reservations is now available in US West (N. California), Africa (Cape Town), Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Jakarta), Asia Pacific (Malaysia), Asia Pacific (Melbourne), Asia Pacific (Osaka), Asia Pacific (Seoul), Asia Pacific (Thailand), Asia Pacific (Taipei), Canada (Central), Canada West (Calgary), Europe (Frankfurt), Europe (London), Europe (Milan), Europe (Paris), Europe (Zurich), and Mexico (Central).<br /> <br /> To learn more, see <a href=\"https://docs.aws.amazon.com/athena/latest/ug/capacity-management.html\">Manage query processing capacity</a> in the Athena User Guide.</p>"
  "8ed3b4bfb88c6e49da8dbc6aefcc813c":
    "id": "8ed3b4bfb88c6e49da8dbc6aefcc813c"
    "title": "Amazon CloudWatch now supports multi-account and region log centralization based on data source"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/cloudwatch-centralization-datasource/"
    "published": "2026-03-30 23:00:00"
    "summary": "<p>Amazon CloudWatch centralization now supports centralizing logs based on <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/data-source-discovery-management.html\" rel=\"noopener noreferrer\" target=\"_blank\">data source name and type</a>. CloudWatch allows customers to copy log data from multiple AWS accounts and regions into a single destination account using centralization rules. With today's launch, customers can now define rules that target data sources by name and type, such as VPC Flow Logs, EKS Audit Logs, and CloudTrail Logs, in addition to the existing log group name-based selection.</p> \n<p>Data source name and type are discovered automatically by CloudWatch for AWS service logs and are based on log group tags for application logs.&nbsp; Now, customers can specifically target which logs they want to centralize using these parameters. For example, a central security team can create a rule that centralizes all logs from CloudTrail and VPC data sources across their entire organization without needing to know or maintain a list of individual log group names.</p> \n<p>To get started, create or modify a centralization rule in the Amazon CloudWatch console or through the AWS CLI and AWS SDKs, and specify your data source selection criteria in the centralization rule configuration.</p> \n<p>Data source selection criteria is available in all AWS commercial regions where CloudWatch log centralization is available. Standard CloudWatch Logs pricing applies for log ingestion, storage, and data transfer. For more information, see the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Logs Centralization documentation.</a></p>"
  "faf69faa271a5d844ba62ab22578fa75":
    "id": "faf69faa271a5d844ba62ab22578fa75"
    "title": "AWS Security Hub is now available in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-security-hub-govcloud-us-regions/"
    "published": "2026-03-30 22:40:00"
    "summary": "<p>AWS Security Hub is now available in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. Security Hub is a unified cloud security solution that prioritizes critical security issues and helps you respond at scale, reduce security risks, and improve team productivity.<br /> <br /> Security Hub detects critical risks by correlating and enriching security signals from Amazon GuardDuty, Amazon Inspector, and AWS Security Hub CSPM, enabling you to quickly surface and prioritize active risks in your cloud environment. The service delivers near real-time risk analytics and advanced trends, transforming correlated security signals into actionable insights through enhanced visualizations and contextual enrichment. You can enable Security Hub for individual accounts or across your entire organization with centralized deployment and management. Capabilities include exposure findings, security-focused resource inventory, attack path visualization, and automated response workflows. The service automatically visualizes potential attack paths by showing how adversaries could chain together threats, vulnerabilities, and misconfigurations to compromise critical resources. Streamlined pricing consolidates charges across multiple AWS security services for improved cost predictability.<br /> <br /> To get started, visit the <a href=\"https://console.aws.amazon.com/securityhub/\">AWS Security Hub console</a> or the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>. For the full list of AWS Regions where Security Hub is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regional Services List</a>.</p>"
  "bfab7d687c47855b79ab37768247dd82":
    "id": "bfab7d687c47855b79ab37768247dd82"
    "title": "AWS HealthOmics introduces VPC-connected workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-healthomics-vpc-connected-workflows/"
    "published": "2026-03-30 21:58:00"
    "summary": "<p>AWS HealthOmics announces VPC-connected workflows, giving customers the ability to run bioinformatics pipelines that access AWS resources across regions and public internet resources through a customer’s Virtual Private Cloud (VPC). With this launch, life sciences customers no longer need to migrate their data and dependencies to the same AWS Region as their workflow before running analyses. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p> \n<p>This launch enables life sciences customers to develop and test bioinformatics workflows more quickly. Customers can design workflows that access publicly-hosted data sets as well as AWS resources in different regions without making changes to the workflow code or migrating data between regions. Customers can use new Configuration APIs to specify a VPC configured to access public internet resources to which HealthOmics can send and receive network traffic, making it easy to use different network configurations for different use cases. With Configuration APIs, you can add and remove public internet dependencies anytime. Networking settings are configured at the per-run level, allowing you to opt-in only the workflows that you want to be VPC connected.&nbsp;</p> \n<p>VPC-connected workflows are now available in all regions where AWS HealthOmics is available: US East (N. Virginia), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), Asia Pacific (Singapore), and Asia Pacific (Seoul). To learn more about connecting workflows to your VPC, see the HealthOmics <a href=\"https://docs.aws.amazon.com/omics/latest/dev/private-workflows.html\">documentation</a>.</p>"
