    "title": "Build high-performance apps with AWS Lambda Managed Instances"
    "link": "https://aws.amazon.com/blogs/compute/build-high-performance-apps-with-aws-lambda-managed-instances/"
    "published": "2026-03-30 14:53:01"
    "summary": "In this post, you will learn how to configure AWS Lambda Managed Instances by creating a Capacity Provider that defines your compute infrastructure, associating your Lambda function with that provider, and publishing a function version to provision the execution environments. We will conclude with production best practices including scaling strategies, thread safety, and observability for reliable performance."
  "55adfe1c9a5e6b4c3b424306d669627b":
    "id": "55adfe1c9a5e6b4c3b424306d669627b"
    "title": "Accelerate CPU-based AI inference workloads using Intel AMX on Amazon EC2"
    "link": "https://aws.amazon.com/blogs/compute/accelerate-cpu-based-ai-inference-workloads-using-intel-amx-on-amazon-ec2/"
    "published": "2026-03-30 16:43:10"
    "summary": "This post shows you how to accelerate your AI inference workloads by up to 76% using Intel Advanced Matrix Extensions (AMX) – an accelerator that uses specialized hardware and instructions to perform matrix operations directly on processor cores – on Amazon Elastic Compute Cloud (Amazon EC2) 8th generation instances. You'll learn when CPU-based inference is cost-effective, how to enable AMX with minimal code changes, and which configurations deliver optimal performance for your models."
