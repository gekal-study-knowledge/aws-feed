    "title": "Building age-responsive, context-aware AI with Amazon Bedrock Guardrails"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-age-responsive-context-aware-ai-with-amazon-bedrock-guardrails/"
    "published": "2026-03-26 17:26:23"
    "summary": "In this post, we walk you through how to implement a fully automated, context-aware AI solution using a serverless architecture on AWS. This solution helps organizations looking to deploy responsible AI systems, align with compliance requirements for vulnerable populations, and help maintain appropriate and trustworthy AI responses across diverse user groups without compromising performance or governance."
  "82946a6166cf249d6fe51c0669177fa2":
    "id": "82946a6166cf249d6fe51c0669177fa2"
    "title": "Accelerating LLM fine-tuning with unstructured data using SageMaker Unified Studio and S3"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerating-llm-fine-tuning-with-unstructured-data-using-sagemaker-unified-studio-and-s3/"
    "published": "2026-03-26 17:20:26"
    "summary": "Last year, AWS announced an integration between Amazon SageMaker Unified Studio and Amazon S3 general purpose buckets. This integration makes it straightforward for teams to use unstructured data stored in Amazon Simple Storage Service (Amazon S3) for machine learning (ML) and data analytics use cases. In this post, we show how to integrate S3 general purpose buckets with Amazon SageMaker Catalog to fine-tune Llama 3.2 11B Vision Instruct for visual question answering (VQA) using Amazon SageMaker Unified Studio."
  "f30a18e6e7330e6a2eb51e0621d93e60":
    "id": "f30a18e6e7330e6a2eb51e0621d93e60"
    "title": "Introducing Amazon Polly Bidirectional Streaming: Real-time speech synthesis for conversational AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-amazon-polly-bidirectional-streaming-real-time-speech-synthesis-for-conversational-ai/"
    "published": "2026-03-26 17:10:20"
    "summary": "Today, we’re excited to announce the new Bidirectional Streaming API for Amazon Polly, enabling streamlined real-time text-to-speech (TTS) synthesis where you can start sending text and receiving audio simultaneously. This new API is built for conversational AI applications that generate text or audio incrementally, like responses from large language models (LLMs), where users must begin synthesizing audio before the full text is available."
