"overview": |
  この日はコンピュートのリージョン拡張と生成 AI、エージェント開発の話題が多数を占めました。EC2 では M8a（アイルランド・GovCloud）、R8gd、I8ge、High Memory U7i（ミラノ）など複数世代のインスタンスがリージョン拡張。AWS マネジメントコンソールではサービス・リージョンの表示制御など視覚的カスタマイズが一般提供開始され、Amazon Quick が東京リージョンで利用可能になりました。エージェント/生成 AI では、Amazon Bedrock がアジアパシフィック（ニュージーランド）で提供開始、AWS Step Functions が AgentCore を含む 28 サービス統合を追加、SageMaker Studio が Kiro/Cursor IDE のリモート接続に対応、Amazon Polly の双方向ストリーミング API や Writer の Palmyra Vision 7B の Bedrock 提供が発表されました。金融サービス向けエージェント AI のセキュリティ設計や、エージェント開発のアーキテクチャパターン、CloudFront のオリジンへの mTLS 認証も取り上げられています。
