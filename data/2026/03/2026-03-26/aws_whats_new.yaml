  "ac43dbb12d2a9c9dc92c8eca49c16b69":
    "id": "ac43dbb12d2a9c9dc92c8eca49c16b69"
    "title": "Aurora DSQL launches connector that simplifies building Ruby applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aurora-dsql-connector-for-ruby/"
    "published": "2026-03-26 17:00:00"
    "summary": "<p>Today we are announcing the release of the Aurora DSQL Connector for Ruby (pg gem) that makes it easy to build Ruby applications on Aurora DSQL. The Ruby Connector streamlines authentication and eliminates security risks associated with traditional user-generated passwords by automatically generating tokens for each connection, ensuring valid tokens are always used while maintaining full compatibility with existing pg gem features.<br /> <br /> The connector handles IAM token generation, SSL configuration, and connection pooling, enabling customers to scale from simple scripts to production workloads without changing their authentication approach. It also provides opt-in optimistic concurrency control (OCC) retry with exponential backoff, custom IAM credential providers, and AWS profile support, giving customers flexibility in how they manage their AWS credentials and handle transient failures.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_connectors.html\">Connectors for Aurora DSQL documentation</a> page. For code examples, visit our <a href=\"https://github.com/awslabs/aurora-dsql-connectors/blob/main/ruby/pg/README.md\">Github page for the Ruby connector</a>. Get started with Aurora DSQL for free with the AWS Free Tier. To learn more about Aurora DSQL, visit the <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a>.</p>"
  "f18fe4a2a084b0993ec0dc8b783c3c52":
    "id": "f18fe4a2a084b0993ec0dc8b783c3c52"
    "title": "AWS AppConfig adds enhanced targeting during feature flag rollout"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/appconfig-enhanced-targeting-feature-flag-rollout/"
    "published": "2026-03-26 16:00:00"
    "summary": "<p>AWS AppConfig enhances its deployment capabilities with new controls that allow customers to target feature flag and configuration data values to specific segments or individual users during the lifecycle of a gradual roll-out.<br /> <br /> One of AWS AppConfig’s key safety guardrails is the ability for customers to roll out feature flag or configuration data changes slowly, over the course of minutes or hours. This progressive delivery allows customers to move safer, and limit the impact of unexpected changes. AWS AppConfig uses customer-provided entity identifiers to make specific feature flag or dynamic configuration data “sticky” to individual target segments during the lifecycle of these gradual roll-outs. This targeting capability, using <a href=\"https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-agent.html\">AppConfig Agent</a>, ensures fine-grained control, including using an individual user ID or IDs, while updates are being deployed.</p>"
  "c7f17d36da0929aea58257ecc7c72c66":
    "id": "c7f17d36da0929aea58257ecc7c72c66"
    "title": "Amazon EC2 R8gd instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-r8gd-aws-regions/"
    "published": "2026-03-26 15:39:00"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) R8gd instances with up to 11.4 TB of local NVMe-based SSD block-level storage are now available in US West (N. California), Asia Pacific (Seoul, Hong Kong, Jakarta), Africa (Cape Town), and Canada West (Calgary) AWS Regions. These instances are powered by AWS Graviton4 processors, delivering up to 30% better performance over Graviton3-based instances. They have up to 40% higher performance for I/O intensive database workloads, and up to 20% faster query results for I/O intensive real-time data analytics than comparable AWS Graviton3-based instances. These instances are built on the AWS Nitro System and are a great fit for applications that need access to high-speed, low latency local storage.<br /> <br /> Each instance is available in 12 different sizes. They provide up to 50 Gbps of network bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Additionally, customers can now adjust the network and<br /> Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\">Amazon R8gd Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
  "06320e66c3b09978e7dde5d822f2a566":
    "id": "06320e66c3b09978e7dde5d822f2a566"
    "title": "The AWS Advanced JDBC Wrapper now supports automatic query caching with Valkey"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-jdbc-caching-with-valkey/"
    "published": "2026-03-26 15:57:00"
    "summary": "<p>The <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper\">AWS Advanced JDBC Wrapper</a> now supports automatically caching JDBC queries with <a href=\"https://valkey.io/\">Valkey</a>, including <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">Amazon ElastiCache for Valkey</a> caches. Previously, developers who needed to cache JDBC query result sets had to manually write code to store and retrieve data from the cache for each query. Now you can automatically cache result sets from your Aurora and RDS PostgreSQL, MySQL, and MariaDB databases in just a few short steps. Simply add the wrapper dependency, enable the query cache plugin, configure database and cache endpoints, and indicate which queries to cache in your application code.<br /> <br /> <br /> With this capability, you can store and retrieve query results directly from ElastiCache for Valkey, reducing the number of database reads and lowering read latency for frequently accessed data. Automated query caching can improve performance, lower costs, and increase application resilience by reducing database resource requirements. The AWS Advanced JDBC Wrapper supports annotating queries for caching using popular persistence APIs and frameworks including Hibernate and Spring Data, as well as manual query hinting.<br /> <br /> JDBC query caching with the AWS Advanced JDBC Wrapper works seamlessly with Amazon ElastiCache for Valkey. You can create a new Amazon ElastiCache for Valkey serverless cache with the AWS Management Console, Software Development Kit (SDK), Command Line Interface (CLI), or Model Context Protocol (MCP) server. For more information, see the <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper/blob/main/docs/GettingStarted.md\">Advanced JDBC Wrapper</a> and <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">Amazon ElastiCache for Valkey</a> documentation.</p>"
