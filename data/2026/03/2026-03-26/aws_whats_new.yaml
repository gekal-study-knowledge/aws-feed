"entries":
  "ac43dbb12d2a9c9dc92c8eca49c16b69":
    "id": "ac43dbb12d2a9c9dc92c8eca49c16b69"
    "title": "Aurora DSQL launches connector that simplifies building Ruby applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aurora-dsql-connector-for-ruby/"
    "published": "2026-03-26 17:00:00"
    "summary": "<p>Today we are announcing the release of the Aurora DSQL Connector for Ruby (pg gem) that makes it easy to build Ruby applications on Aurora DSQL. The Ruby Connector streamlines authentication and eliminates security risks associated with traditional user-generated passwords by automatically generating tokens for each connection, ensuring valid tokens are always used while maintaining full compatibility with existing pg gem features.<br /> <br /> The connector handles IAM token generation, SSL configuration, and connection pooling, enabling customers to scale from simple scripts to production workloads without changing their authentication approach. It also provides opt-in optimistic concurrency control (OCC) retry with exponential backoff, custom IAM credential providers, and AWS profile support, giving customers flexibility in how they manage their AWS credentials and handle transient failures.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_connectors.html\">Connectors for Aurora DSQL documentation</a> page. For code examples, visit our <a href=\"https://github.com/awslabs/aurora-dsql-connectors/blob/main/ruby/pg/README.md\">Github page for the Ruby connector</a>. Get started with Aurora DSQL for free with the AWS Free Tier. To learn more about Aurora DSQL, visit the <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a>.</p>"
  "f18fe4a2a084b0993ec0dc8b783c3c52":
    "id": "f18fe4a2a084b0993ec0dc8b783c3c52"
    "title": "AWS AppConfig adds enhanced targeting during feature flag rollout"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/appconfig-enhanced-targeting-feature-flag-rollout/"
    "published": "2026-03-26 16:00:00"
    "summary": "<p>AWS AppConfig enhances its deployment capabilities with new controls that allow customers to target feature flag and configuration data values to specific segments or individual users during the lifecycle of a gradual roll-out.<br /> <br /> One of AWS AppConfig’s key safety guardrails is the ability for customers to roll out feature flag or configuration data changes slowly, over the course of minutes or hours. This progressive delivery allows customers to move safer, and limit the impact of unexpected changes. AWS AppConfig uses customer-provided entity identifiers to make specific feature flag or dynamic configuration data “sticky” to individual target segments during the lifecycle of these gradual roll-outs. This targeting capability, using <a href=\"https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-agent.html\">AppConfig Agent</a>, ensures fine-grained control, including using an individual user ID or IDs, while updates are being deployed.</p>"
  "c7f17d36da0929aea58257ecc7c72c66":
    "id": "c7f17d36da0929aea58257ecc7c72c66"
    "title": "Amazon EC2 R8gd instances are now available in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-r8gd-aws-regions/"
    "published": "2026-03-26 15:39:00"
    "summary": "<p>Amazon Elastic Compute Cloud (Amazon EC2) R8gd instances with up to 11.4 TB of local NVMe-based SSD block-level storage are now available in US West (N. California), Asia Pacific (Seoul, Hong Kong, Jakarta), Africa (Cape Town), and Canada West (Calgary) AWS Regions. These instances are powered by AWS Graviton4 processors, delivering up to 30% better performance over Graviton3-based instances. They have up to 40% higher performance for I/O intensive database workloads, and up to 20% faster query results for I/O intensive real-time data analytics than comparable AWS Graviton3-based instances. These instances are built on the AWS Nitro System and are a great fit for applications that need access to high-speed, low latency local storage.<br /> <br /> Each instance is available in 12 different sizes. They provide up to 50 Gbps of network bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS). Additionally, customers can now adjust the network and<br /> Amazon EBS bandwidth on these instances by 25% using EC2 instance bandwidth weighting conﬁguration, providing greater ﬂexibility with the allocation of bandwidth resources to better optimize workloads. These instances offer Elastic Fabric Adapter (EFA) networking on 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes.<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/r8g/\">Amazon R8gd Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>. To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
  "06320e66c3b09978e7dde5d822f2a566":
    "id": "06320e66c3b09978e7dde5d822f2a566"
    "title": "The AWS Advanced JDBC Wrapper now supports automatic query caching with Valkey"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-jdbc-caching-with-valkey/"
    "published": "2026-03-26 15:57:00"
    "summary": "<p>The <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper\">AWS Advanced JDBC Wrapper</a> now supports automatically caching JDBC queries with <a href=\"https://valkey.io/\">Valkey</a>, including <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">Amazon ElastiCache for Valkey</a> caches. Previously, developers who needed to cache JDBC query result sets had to manually write code to store and retrieve data from the cache for each query. Now you can automatically cache result sets from your Aurora and RDS PostgreSQL, MySQL, and MariaDB databases in just a few short steps. Simply add the wrapper dependency, enable the query cache plugin, configure database and cache endpoints, and indicate which queries to cache in your application code.<br /> <br /> <br /> With this capability, you can store and retrieve query results directly from ElastiCache for Valkey, reducing the number of database reads and lowering read latency for frequently accessed data. Automated query caching can improve performance, lower costs, and increase application resilience by reducing database resource requirements. The AWS Advanced JDBC Wrapper supports annotating queries for caching using popular persistence APIs and frameworks including Hibernate and Spring Data, as well as manual query hinting.<br /> <br /> JDBC query caching with the AWS Advanced JDBC Wrapper works seamlessly with Amazon ElastiCache for Valkey. You can create a new Amazon ElastiCache for Valkey serverless cache with the AWS Management Console, Software Development Kit (SDK), Command Line Interface (CLI), or Model Context Protocol (MCP) server. For more information, see the <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper/blob/main/docs/GettingStarted.md\">Advanced JDBC Wrapper</a> and <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">Amazon ElastiCache for Valkey</a> documentation.</p>"
  "44d0b2c3f53ed188516ee3ff2f008fdf":
    "id": "44d0b2c3f53ed188516ee3ff2f008fdf"
    "title": "Amazon SageMaker Studio launches support for Kiro and Cursor IDEs as remote IDEs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-studio-kiro-cursor/"
    "published": "2026-03-26 19:53:00"
    "summary": "<p>Today, AWS announces the ability to remotely connect from Kiro and Cursor IDEs to Amazon SageMaker Studio. This new capability allows data scientists, ML engineers, and developers to leverage their Kiro and Cursor setup - including its spec-driven development, conversational coding, and automated feature generation capabilities - while accessing the scalable compute resources of Amazon SageMaker Studio. By connecting Kiro and Cursor to SageMaker Studio using the AWS Toolkit extension, you can eliminate context switching between your local IDE and cloud infrastructure, maintaining your existing agentic development workflows within a single environment for all your AWS analytics and AI/ML services.<br /> <br /> SageMaker Studio, offers a broad set of fully managed cloud interactive development environments (IDE), including JupyterLab and Code Editor based on Code-OSS (Open-Source Software), and VS Code IDE as remote IDE. Starting today, you can also use your customized local Kiro and Cursor setup - complete with specs, steering files, and hooks - while accessing your compute resources and data on Amazon SageMaker. You can authenticate using the AWS Toolkit extension in Kiro or Cursor or through SageMaker Studio's web interface. Once authenticated, connect to any of your SageMaker Studio development environments in a few simple clicks. You maintain the same security boundaries as SageMaker Studio’s web-based environments while developing AI models and analyzing data in local IDE of your choice - Kiro or Cursor.<br /> <br /> To learn more, refer to the&nbsp;<a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/remote-access.html\">SageMaker user guide</a>.</p>"
  "73efaecdcebb20668ff2b970df232676":
    "id": "73efaecdcebb20668ff2b970df232676"
    "title": "AWS Lambda increases the file descriptor limit to 4,096 for functions running on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-Lambda-file-descriptors-increase-4096/"
    "published": "2026-03-26 16:15:00"
    "summary": "<p>AWS Lambda increases the file descriptor limit from 1,024 to 4,096, a 4x increase, for functions running on Lambda Managed Instances (LMI). This capability enables customers to run I/O intensive workloads such as high-concurrency web services, and file-heavy data processing pipelines, without running into file descriptor limits. LMI enables you to run Lambda functions on managed Amazon EC2 instances with built-in routing, load-balancing, and auto-scaling, giving you access to specialized compute configurations including the latest-generation processors and high-bandwidth networking, with no operational overhead.<br /> <br /> Customers use Lambda functions to build a wide range of serverless applications such as event-driven workloads, web applications, and AI-driven workflows. These applications rely on file descriptors for operations such as opening files, establishing network socket connections to external services and databases, and managing concurrent I/O streams for data processing. Each open file, network socket, or internal resource consumes one file descriptor. Today, Lambda supports a maximum of 1,024 file descriptors. However, LMI allows multiple requests to be processed simultaneously, which often requires higher number of file descriptors. With this launch, AWS Lambda is increasing the file descriptor limit to 4,096, allowing customers to run I/O intensive workloads, maintain larger connection pools, and effectively utilize multi-concurrency for functions running on LMI.<br /> <br /> This feature is available in all AWS Regions where AWS Lambda Managed Instances is generally available. To get started, visit the AWS Lambda Managed Instances <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\" target=\"_blank\">documentation</a>.</p>"
  "3af33d0796ed17aaab453e613a50e0d5":
    "id": "3af33d0796ed17aaab453e613a50e0d5"
    "title": "Amazon EC2 M8a instances now available in AWS Europe (Ireland) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-m8a-instances-europe-ireland-region/"
    "published": "2026-03-26 15:00:12"
    "summary": "<p>Starting today, the general-purpose Amazon EC2 M8a instances are available in AWS Europe (Ireland) region. M8a instances are powered by 5th Gen AMD EPYC processors (formerly code named Turin) with a maximum frequency of 4.5 GHz, deliver up to 30% higher performance, and up to 19% better price-performance compared to M7a instances.<br /> <br /> M8a instances deliver 45% more memory bandwidth compared to M7a instances, making these instances ideal for even latency sensitive workloads. M8a instances deliver even higher performance gains for specific workloads. M8a instances are up to 60% faster for GroovyJVM benchmark, and up to 39% faster for Cassandra benchmark compared to Amazon EC2 M7a instances. M8a instances are SAP-certified and offer 12 sizes including 2 bare metal sizes. This range of instance sizes allows customers to precisely match their workload requirements. <br /> <br /> M8a instances are built using the latest sixth generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro Cards</a> and ideal for applications that benefit from high performance and high throughput such as financial applications, gaming, rendering, application servers, simulation modeling, mid-size data stores, application development environments, and caching fleets.<br /> <br /> To get started, sign in to the AWS Management Console. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the Amazon EC2 <a href=\"https://aws.amazon.com/ec2/instance-types/m8a\">M8a instance page</a>.</p>"
  "05fbdfc5d0629de52e1f0af287112e30":
    "id": "05fbdfc5d0629de52e1f0af287112e30"
    "title": "Amazon EC2 M8a instances now available in AWS GovCloud (US-West) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-m8a-instances-govcloud-us-west-region/"
    "published": "2026-03-26 15:00:00"
    "summary": "<p>Starting today, the general-purpose Amazon EC2 M8a instances are available in AWS GovCloud (US-West) region. M8a instances are powered by 5th Gen AMD EPYC processors (formerly code named Turin) with a maximum frequency of 4.5 GHz, deliver up to 30% higher performance, and up to 19% better price-performance compared to M7a instances.<br /> <br /> M8a instances deliver 45% more memory bandwidth compared to M7a instances, making these instances ideal for even latency sensitive workloads. M8a instances deliver even higher performance gains for specific workloads. M8a instances are up to 60% faster for GroovyJVM benchmark, and up to 39% faster for Cassandra benchmark compared to Amazon EC2 M7a instances. M8a instances are SAP-certified and offer 12 sizes including 2 bare metal sizes. This range of instance sizes allows customers to precisely match their workload requirements. <br /> <br /> M8a instances are built using the latest sixth generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro Cards</a> and ideal for applications that benefit from high performance and high throughput such as financial applications, gaming, rendering, application servers, simulation modeling, mid-size data stores, application development environments, and caching fleets.<br /> <br /> To get started, sign in to the AWS Management Console. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information visit the Amazon EC2 <a href=\"https://aws.amazon.com/ec2/instance-types/m8a\">M8a instance page</a>.</p>"
  "693054c309033543261aaaa198d83169":
    "id": "693054c309033543261aaaa198d83169"
    "title": "AWS Storage Gateway Terraform modules now support Amazon Linux 2023"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/storage-gateway-terraform-al2023/"
    "published": "2026-03-26 10:00:00"
    "summary": "<p>AWS Storage Gateway Terraform modules now enable Amazon Linux 2023-based deployments, delivering improved security, reliability, and operational simplicity for Infrastructure as Code (IaC) provisioning. The updated modules support all gateway types including Amazon S3 File Gateway, Tape Gateway, and Volume Gateway in both Amazon EC2 and VMware environments.</p> \n<p>You can use the new Terraform modules to deploy AL2023-based gateways that enforce&nbsp;IMDSv2&nbsp;by default for EC2 deployments, protecting against credential theft and server-side request forgery (SSRF) attacks.&nbsp;The update prevents unexpected gateway replacements during routine Terraform operations and simplifies Active Directory integration with optional domain controller configuration. EC2-based gateways now support optional Elastic IP address (EIP) association, enabling fully private gateway activations.&nbsp;</p> \n<p>To get started, download the Terraform Storage Gateway&nbsp;<a href=\"https://github.com/aws-ia/terraform-aws-storagegateway\">module</a>. To learn more, visit the AWS Storage Gateway product page or the&nbsp;<a href=\"https://docs.aws.amazon.com/storagegateway/\">Storage Gateway User Guide</a>. See the&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Region Table</a>&nbsp;for complete regional availability.</p>"
  "e2659ede6335ead4d4e181673373f86f":
    "id": "e2659ede6335ead4d4e181673373f86f"
    "title": "Amazon ECS Managed Instances now supports FIPS-certified workloads on Graviton and GPU accelerated instances in AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ecs-mi-supports-fips-graviron-gpu/"
    "published": "2026-03-26 19:40:00"
    "summary": "<p>Starting today, customers can deploy their Graviton-based and GPU-accelerated workloads on Amazon Elastic Container Service (Amazon ECS) Managed Instances in a Federal Information Processing Standard (FIPS) compliant mode in the AWS GovCloud (US) Regions. FIPS is a U.S. and Canadian government standard that specifies the security requirements for cryptographic modules that protect sensitive information.</p> \n<p>In the AWS GovCloud (US) Regions, Amazon ECS Managed Instances automatically enable FIPS compliance by default. ECS Managed Instances communicate through FIPS-compliant endpoints, use appropriately configured cryptographic modules, and boot the underlying kernel in FIPS mode. Customers with federal compliance requirements can run workloads with FIPS-validated cryptographic modules across a broad range of instance types, including Graviton-based, GPU-accelerated, network-optimized, and burstable performance instances.</p> \n<p>To learn more about FIPS, refer to&nbsp;<a href=\"https://aws.amazon.com/compliance/fips/\">FIPS on AWS</a> and <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-fips-compliance.html\">AWS Fargate Federal Information Processing Standard (FIPS-140)</a>. To get started with ECS Managed Instances, use the AWS Console, Amazon ECS MCP Server, ECS Express Mode, or your favorite infrastructure-as-code tooling to enable it in a new or existing Amazon ECS cluster. You will be charged for the management of compute provisioned, in addition to your regular Amazon EC2 costs. To learn more about ECS Managed Instances, visit the <a href=\"https://aws.amazon.com/ecs/managed-instances/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/aws/announcing-amazon-ecs-managed-instances-for-containerized-applications\">AWS News launch blog</a>.</p>"
  "5cc99bc118a73b889847925d5c061808":
    "id": "5cc99bc118a73b889847925d5c061808"
    "title": "Amazon EC2 High Memory U7i instances now available in Europe (Milan)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/ec2-u7i-europe-milan/"
    "published": "2026-03-26 22:30:00"
    "summary": "<p>Amazon EC2 High Memory U7i-8TB instances (u7i-8tb.112xlarge) and U7i-12TB instances (u7i-12tb.224xlarge) are now available in AWS Europe (Milan). U7i instances are part of AWS 7th generation and are powered by custom fourth generation Intel Xeon Scalable Processors (Sapphire Rapids). U7i-8tb instances offer 8TiB of DDR5 memory, and U7i-12tb instances offer 12TiB of DDR5 memory, enabling customers to scale transaction processing throughput in a fast-growing data environment.</p> \n<p>U7i-8tb instances deliver 448 vCPUs; U7i-12tb instances deliver 896 vCPUs. Both instances support up to 100 Gbps of Amazon EBS bandwidth for faster data loading and backups, 100 Gbps of network bandwidth, and ENA Express. U7i instances are ideal for customers using mission-critical in-memory databases like SAP HANA, Oracle, and SQL Server.</p> \n<p>To learn more about U7i instances, visit the&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/u7i/\">High Memory instances page</a>.</p>"
  "92f5fa6821e2b77dd648808bebd167e6":
    "id": "92f5fa6821e2b77dd648808bebd167e6"
    "title": "AWS Step Functions adds 28 new service integrations, including Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-step-functions-sdk-integrations/"
    "published": "2026-03-26 22:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/step-functions/\">AWS Step Functions</a>&nbsp;expands its AWS SDK integrations with 28 additional services and over 1,100 new API actions across new and existing AWS services, including Amazon Bedrock AgentCore and Amazon S3 Vectors. This expansion enables you to orchestrate a broader set of AWS services directly from your workflows without writing integration code.<br /> <br /> AWS Step Functions is a visual workflow service capable of orchestrating over 220 AWS services to help customers build distributed applications at scale. With the Amazon Bedrock AgentCore service integration, you can invoke AI agent runtimes with built-in retries, run multiple agents in parallel using Map states, and automate agent provisioning workflows that create, update, and tear down agent infrastructure as workflow steps. This expansion also includes Amazon S3 Vectors for automating document ingestion pipelines that populate knowledge bases for AI applications.&nbsp;It also adds support for AWS Lambda durable execution APIs, allowing you to pass an execution name for idempotent invocations of Lambda durable functions and manage durable executions directly from your workflows.<br /> <br /> These enhancements are now generally available in all AWS Regions where AWS Step Functions is available. Specific services and API actions are subject to the availability of the target service in the AWS Region. To learn more about AWS Step Functions SDK integrations, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/integrate-services.html\">Developer Guide</a>, or see the full list of supported services at&nbsp;<a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/supported-services-awssdk.html\">AWS SDK service integrations</a>.</p>"
  "06d581cbcd477ab0ea2f1445be1d5d29":
    "id": "06d581cbcd477ab0ea2f1445be1d5d29"
    "title": "Amazon EC2 I8ge instances are now generally available in additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/ec2-i8ge-available-new-regions/"
    "published": "2026-03-26 17:00:00"
    "summary": "<p>Amazon Web Services (AWS) announces the availability of Amazon EC2 I8ge instances in Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Malaysia), Asia Pacific (Singapore), and Asia Pacific (Sydney) AWS regions. I8ge instances are powered by AWS Graviton4 processors to deliver up to 60% better compute performance compared to previous generation Graviton2-based storage optimized Amazon EC2 instances. I8ge instances use the third generation AWS Nitro SSDs, local NVMe storage that delivers up to 55% better real-time storage performance per TB. They offer up to 60% lower storage I/O latency and up to 75% lower storage I/O latency variability compared to previous generation Im4gn instances.<br /> <br /> I8ge instances are storage-optimized instances offering up to 120TB of locally attached NVMe storage. They are ideal for workloads that demand rapid local storage with high random read/write performance and consistently low latency for accessing large datasets. These versatile instances are offered in eleven different sizes including two metal sizes, providing flexibility to match customers’ computational needs. They deliver up to 180 Gbps of network performance bandwidth and 60 Gbps of dedicated bandwidth for Amazon Elastic Block Store (EBS), ensuring fast and efficient data transfer for the most demanding applications.<br /> <br /> To begin your Graviton journey, visit the <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton page</a>. To get started, see <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>, <a href=\"https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and <a href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\">AWS SDKs</a>. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/i8g/\">I8ge instances page.</a></p>"
"last_updated": "2026-03-28 02:46:49 JST"
