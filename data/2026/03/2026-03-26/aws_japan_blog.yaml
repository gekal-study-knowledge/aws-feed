    "summary": "インシデント発生時の根本原因分析は、クラウド運用において最も時間がかかる作業の一つです。AWS DevOps Agent は、自律的な調査能力により平均復旧時間 (MTTR) を数時間から数分に短縮します。本記事では、調査能力と運用効率のバランスを取る Agent Space のセットアップに関するベストプラクティスを紹介します。最適な調査精度を実現するための Agent Space の構成方法、適切なリソースアクセス範囲の決定方法、そして Infrastructure as Code を活用したデプロイの効率化について解説します。"
  "fc018aa75f90ac0fa9893dda1ba341a1":
    "id": "fc018aa75f90ac0fa9893dda1ba341a1"
    "title": "Amazon CloudFront がオリジンへの mTLS 認証をサポート"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-cloudfront-now-supports-mtls-authentication-to-origins/"
    "published": "2026-03-26 07:13:36"
    "summary": "Amazon CloudFront&nbsp;は相互TLS（mTLS）機能をカスタマーオリジンに拡張しました。これにより、ビューワーからカスタマーオリジンまでの接続パス全体を通じた、真のエンドツーエンド認証が可能になります。CloudFront はこれまで、ビューワーと CloudFront 間のビューワー&nbsp;mTLS&nbsp;をサポートしており、トラフィックが境界に入る前にクライアントを強力に認証することができました。今回のリリースにより、同じトラフィックが CloudFront からオリジンへも mTLS 経由で継続できるようになり、すべてのホップにわたって暗号化されたアイデンティティと信頼が維持されます。その結果、完全に認証されたリクエストパスが実現し、暗黙の信頼を排除し、エッジでのパフォーマンスを犠牲にすることなくゼロトラストの多層防御アーキテクチャを実現します。"
"last_updated": "2026-03-26 17:50:30 JST"
