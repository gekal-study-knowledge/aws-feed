    "title": "Amazon SageMaker を使用したレイクハウスのアーキテクチャ選択ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/navigating-architectural-choices-for-a-lakehouse-using-amazon-sagemaker/"
    "published": "2026-03-19 10:41:10"
    "summary": "Amazon SageMaker のレイクハウスアーキテクチャにおけるストレージパターンの選択ガイドです。データレイク (汎用 S3、S3 Tables) とデータウェアハウス (Redshift Managed Storage) の特性を比較し、ETL、Zero-ETL、データフェデレーションなどのデータ取り込みパターンとともに、ユースケースに応じた最適なアーキテクチャの選択方法を解説します。"
  "c27ed31f5616ef79d85c8d7a38dae5ae":
