    "title": "Amazon EMR Serverless のベストプラクティス 10 選"
    "link": "https://aws.amazon.com/jp/blogs/news/top-10-best-practices-for-amazon-emr-serverless/"
    "published": "2026-03-19 10:40:32"
    "summary": "Amazon EMR Serverless のパフォーマンス、コスト、スケーラビリティを最適化するためのベストプラクティス 10 選を紹介します。アプリケーション設計、ワーカーの適正化、Graviton プロセッサの活用、ストレージ選択、マルチ AZ 構成など、効率的なデータ処理パイプラインの構築に役立つ実践的な推奨事項をまとめています。"
  "9de4470f34bde0fb3376c791427b5a6d":
    "id": "9de4470f34bde0fb3376c791427b5a6d"
    "title": "AWS Load Balancer Controller が Kubernetes Gateway API サポートの一般提供を開始"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-load-balancer-controller-adds-general-availability-support-for-kubernetes-gateway-api/"
    "published": "2026-03-19 10:08:05"
    "summary": "AWS は最近、Amazon Web Services (AWS) Load Balancer Controller による Kubernetes Gateway API サポートの一般提供を発表しました。これまで、AWS Load Balancer Controller は Kubernetes Ingress と Service リソースの要件を満たすため、それぞれ Application Load Balancer (ALB) と Network Load Balancer (NLB) をプロビジョニングしていました。この新機能により、標準の Kubernetes Gateway API を使用してAWSロードバランシング機能を定義できるようになりました。"
