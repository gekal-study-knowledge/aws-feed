    "title": "AWS Organizations における不正なアカウント離脱を防止するための重要なセキュリティコントロール"
    "link": "https://aws.amazon.com/jp/blogs/news/essential-security-controls-to-prevent-unauthorized-account-removal-in-aws-organizations/"
    "published": "2026-03-19 04:57:04"
    "summary": "AWS メンバーアカウントが侵害された場合、攻撃者はアカウントを組織から離脱させ、すべてのガバナンスコントロールを無効化する可能性があります。本記事では、サービスコントロールポリシー (SCP)、安全なアカウント移行、一元化されたルートアクセス管理などの多層的なセキュリティコントロールを使用して、AWS 環境を保護する方法を解説します。"
  "cc2cfa241fbb64f94ea7331ec7cb4046":
    "id": "cc2cfa241fbb64f94ea7331ec7cb4046"
    "title": "企業向けファイアウォールを標的とする Interlock ランサムウェアキャンペーンを Amazon Threat Intelligence チームが特定"
    "link": "https://aws.amazon.com/jp/blogs/news/amazon-threat-intelligence-teams-identify-interlock-ransomware-campaign-targeting-enterprise-firewalls/"
    "published": "2026-03-19 04:46:07"
    "summary": "Amazon Threat Intelligence が、Cisco Secure Firewall Management Center の重大な脆弱性 CVE-2026-20131 を悪用する Interlock ランサムウェアのキャンペーンを特定しました。調査の結果、この脆弱性は公開の 36 日前からゼロデイとして悪用されていたことが判明しました。攻撃者の設定ミスにより外部に露出していたインフラストラクチャから攻撃ツールキットの全容が明らかになり、本記事ではその技術分析、侵害インジケータ (IoC)、および多層防御の重要性を含む防御の推奨事項を共有します。"
