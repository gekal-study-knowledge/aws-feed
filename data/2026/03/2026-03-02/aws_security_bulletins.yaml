    id: 340d54039e9220fc1a7b057400264860
    title: 'Issue with AWS-LC: an open-source, general-purpose cryptographic library
      (CVE-2026-3336, CVE-2026-3337, CVE-2026-3338)'
    link: https://aws.amazon.com/security/security-bulletins/rss/2026-005-aws/
    published: '2026-03-02'
    summary: "<p><b>Bulletin ID:</b> 2026-005-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content\
      \ Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 2026/03/02\
      \ 14:30 PM PST</p> \n<p><b>Description:</b></p> \n<p>AWS-LC is an open-source,\
      \ general-purpose cryptographic library. We identified three distinct issues:</p>\
      \ \n<p>- CVE-2026-3336: PKCS7_verify Certificate Chain Validation Bypass in\
      \ AWS-LC<br /> Improper certificate validation in PKCS7_verify() in AWS-LC allows\
      \ an unauthenticated user to bypass certificate chain verification when processing\
      \ PKCS7 objects with multiple signers, except the final signer.<br /> - CVE-2026-3337:\
      \ Timing Side-Channel in AES-CCM Tag Verification in AWS-LC<br /> Observable\
      \ timing discrepancy in AES-CCM decryption in AWS-LC allows an unauthenticated\
      \ user to potentially determine authentication tag validity via timing analysis.<br\
      \ /> - CVE-2026-3338: PKCS7_verify Signature Validation bypass in AWS-LC<br\
      \ /> Improper signature validation in PKCS7_verify() in AWS-LC allows an unauthenticated\
      \ user to bypass signature verification when processing PKCS7 objects with Authenticated\
      \ Attributes.</p> \n<p><b>Impacted versions:</b></p> \n<p>- PKCS7_verify Certificate\
      \ Chain Validation Bypass in AWS-LC &gt;= v1.41.0, &lt; v1.69.0<br /> - PKCS7_verify\
      \ Certificate Chain Validation Bypass in aws-lc-sys &gt;= v0.24.0, &lt; v0.38.0<br\
      \ /> - Timing Side-Channel in AES-CCM Tag Verification in AWS-LC &gt;= v1.21.0,\
      \ &lt; v1.69.0<br /> - Timing Side-Channel in AES-CCM Tag Verification in AWS-LC\
      \ &gt;= AWS-LC-FIPS-3.0.0, &lt; AWS-LC-FIPS-3.2.0<br /> - Timing Side-Channel\
      \ in AES-CCM Tag Verification in aws-lc-sys &gt;= v0.14.0, &lt; v0.38.0<br />\
      \ - Timing Side-Channel in AES-CCM Tag Verification in aws-lc-sys-fips &gt;=\
      \ v0.13.0, &lt; v0.13.12<br /> - PKCS7_verify Signature Validation bypass in\
      \ AWS-LC &gt;= v1.41.0, &lt; v1.69.0<br /> - PKCS7_verify Signature Validation\
      \ bypass in aws-lc-sys &gt;= v0.24.0, &lt; v0.38.0</p> \n<p><b>Please refer\
      \ to the article below for the most up-to-date and complete information related\
      \ to this AWS Security Bulletin.</b></p>"
