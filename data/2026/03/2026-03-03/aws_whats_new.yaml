  0663fbef0f362b0c7b5f2930262c9652:
    id: 0663fbef0f362b0c7b5f2930262c9652
    title: Policy in Amazon Bedrock AgentCore is now generally available
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/policy-amazon-bedrock-agentcore-generally-available/
    published: "2026-03-03"
    fetched: "2026-03-03"
    summary:
      "<p>Policy in Amazon Bedrock&nbsp;AgentCore&nbsp;is now generally available,\
      \ providing organizations with centralized, fine-grained controls for agent-tool\
      \ interactions.&nbsp;Policy&nbsp;operates&nbsp;outside your&nbsp;agent&nbsp;code,\
      \ enabling security,&nbsp;compliance, and operations teams to define&nbsp;tool&nbsp;access\
      \ and&nbsp;input&nbsp;validation&nbsp;rules&nbsp;without&nbsp;modifying&nbsp;agent\
      \ code.&nbsp;Teams can author policies using natural language that automatically\
      \ converts to Cedar,&nbsp;the&nbsp;AWS&nbsp;open-source policy language.&nbsp;Policies&nbsp;are\
      \ stored&nbsp;in&nbsp;a&nbsp;policy engine&nbsp;and&nbsp;attached&nbsp;to&nbsp;an&nbsp;AgentCore&nbsp;Gateway,&nbsp;which&nbsp;intercepts&nbsp;agent-tool&nbsp;traffic&nbsp;and&nbsp;evaluates\
      \ each request&nbsp;against the policies&nbsp;before allowing or denying tool&nbsp;access.&nbsp;Policy&nbsp;helps&nbsp;ensure&nbsp;agents&nbsp;operate&nbsp;within\
      \ defined parameters while&nbsp;maintaining&nbsp;organizational&nbsp;visibility\
      \ and governance.</p> \n<p>Policy in AgentCore&nbsp;is available in&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\"\
      >thirteen&nbsp;AWS&nbsp;Regions</a>:&nbsp;US East (N. Virginia), US East (Ohio),\
      \ US West (Oregon), Asia Pacific (Mumbai), Asia Pacific (Seoul), Asia Pacific\
      \ (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt),\
      \ Europe (Ireland), Europe (London), Europe (Paris), and Europe (Stockholm).</p>\
      \ \n<p>Learn more about&nbsp;Policy&nbsp;in AgentCore&nbsp;through the&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html\"\
      >documentation</a>, and get started with the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-get-started-toolkit.html\"\
      >AgentCore Starter Toolkit</a>.</p>"
  8916b5b1fdae1102f0bca9dc8f13a006:
    id: 8916b5b1fdae1102f0bca9dc8f13a006
    title:
      Amazon SageMaker Unified Studio launches support for remote connection
      from Kiro IDE
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-unified-studio-kiro-ide/
    published: "2026-03-03"
    fetched: "2026-03-03"
    summary:
      "<p>Today, AWS announces the ability to remotely connect from Kiro IDE\
      \ to Amazon SageMaker Unified Studio. This new capability allows data scientists,\
      \ ML engineers, and developers to leverage their Kiro setup - including its\
      \ spec-driven development, conversational coding, and automated feature generation\
      \ capabilities - while accessing the scalable compute resources of Amazon SageMaker.\
      \ By connecting Kiro to SageMaker Unified Studio using the AWS toolkit extension,\
      \ you can eliminate context switching between your local IDE and cloud infrastructure,\
      \ maintaining your existing agentic development workflows within a single environment\
      \ for all your AWS analytics and AI/ML services.</p> \n<p><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\"\
      >SageMaker Unified Studio</a>, part of the next generation of Amazon SageMaker,\
      \ offers a broad set of fully managed cloud interactive development environments\
      \ (IDE), including JupyterLab and Code Editor based on Code-OSS (Open-Source\
      \ Software). Starting today, you can also use your customized local Kiro setup\
      \ - complete with specs, steering files, and hooks - while accessing your compute\
      \ resources and data on Amazon SageMaker. Since Kiro is built on Code-OSS, authentication\
      \ is secure via IAM through the AWS Toolkit extension, giving you access to\
      \ all your SageMaker Unified Studio domains and projects. This integration provides\
      \ a convenient path from your local AI-powered development environment to scalable\
      \ infrastructure for running workloads across data processing, SQL analytics\
      \ services like Amazon EMR, AWS Glue, and Amazon Athena, and ML workflows -\
      \ all with enterprise-grade security including customer-managed encryption keys\
      \ and AWS IAM integration.</p> \n<p>This feature is available in all Regions\
      \ where Amazon SageMaker Unified Studio is available. To learn more, refer to\
      \ the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/local-ide-support.html\"\
      >SageMaker user guide.</a></p>"
  b82a224231fa69c2232a66970d84b737:
    id: b82a224231fa69c2232a66970d84b737
    title: Amazon SageMaker Unified Studio adds metadata sync with third-party catalogs
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-unified-studio-3p-catalogs/
    published: "2026-03-03"
    fetched: "2026-03-03"
    summary:
      "<p><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">Amazon\
      \ SageMaker Unified Studio</a> now supports metadata and context sync across\
      \ Atlan, Collibra, and Alation. These integrations synchronize catalog metadata\
      \ between <a href=\"https://aws.amazon.com/sagemaker/catalog/\">Amazon SageMaker\
      \ Catalog</a> and each partner platform, giving teams a consistent view of their\
      \ data and AI assets regardless of which tool they use day to day. Organizations\
      \ can maintain aligned glossary terms, asset descriptions, and ownership information\
      \ across platforms without manual reconciliation.</p> \n<p>All three integrations\
      \ synchronize key metadata elements including projects, assets, descriptions,\
      \ glossary terms, and their hierarchies. With the Collibra integration, you\
      \ can synchronize metadata in both directions between SageMaker Catalog and\
      \ the partner platform, so updates you make in one are reflected in the other.\
      \ Also, you can manage SageMaker Unified Studio data access requests from Collibra.\
      \ With the Atlan and Alation integration, you can ingest metadata from SageMaker\
      \ Catalog into Alation with additional enhancements coming soon. You set up\
      \ these integrations by setting up a connection to SageMaker Unified Studio\
      \ from within Atlan and Alation, while the Collibra integration is available\
      \ as an open-source solution on GitHub.</p> \n<p>To learn more, visit the Amazon\
      \ SageMaker Unified Studio <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/third-party-catalog-integrations.html\"\
      >documentation</a>. For implementation details, see the <a href=\"https://aws.amazon.com/blogs/big-data/unifying-governance-and-metadata-across-amazon-sagemaker-unified-studio-and-atlan/\"\
      >Atlan blog post</a>, <a href=\"https://aws.amazon.com/blogs/big-data/unifying-metadata-governance-across-amazon-sagemaker-and-collibra/\"\
      >Collibra blog post </a>, and <a href=\"https://aws.amazon.com/blogs/big-data/build-a-trusted-foundation-for-data-and-ai-using-alation-and-amazon-sagemaker-unified-studio/\"\
      >Alation blog post</a>.</p>"
  ceb41801aa6b55a529d1e2b2e352fce7:
    id: ceb41801aa6b55a529d1e2b2e352fce7
    title:
      Amazon SageMaker Unified Studio now supports AWS Glue 5.1 for data processing
      jobs
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-unified-studio-aws-glue-5-1/
    published: "2026-03-03"
    fetched: "2026-03-03"
    summary:
      "<p><a href=\"https://aws.amazon.com/sagemaker/unified-studio/\">Amazon\
      \ SageMaker Unified Studio </a>now supports <a href=\"https://aws.amazon.com/about-aws/whats-new/2025/11/aws-glue-5-1/\"\
      >AWS Glue 5.1 </a>for Visual ETL, notebook, and code-based data processing jobs.\
      \ With AWS Glue 5.1 in Amazon SageMaker Unified Studio, data engineers and data\
      \ scientists can run jobs on Apache Spark 3.5.6 with Python 3.11 and Scala 2.12.18,\
      \ and use updated open table format libraries including Apache Iceberg 1.10.0,\
      \ Apache Hudi 1.0.2, and Delta Lake 3.3.2.</p> \n<p>You can use AWS Glue 5.1\
      \ in Amazon SageMaker Unified Studio when creating data processing jobs by selecting\
      \ Glue 5.1 from the version dropdown in job settings. This applies to Visual\
      \ ETL jobs, notebook jobs, and code-based jobs, so you can take advantage of\
      \ the latest Spark runtime and open table format libraries across all your data\
      \ processing workflows.</p> \n<p>AWS Glue 5.1 in Amazon SageMaker Unified Studio\
      \ is available in US East (N. Virginia), US East (Ohio), US West (Oregon), Europe\
      \ (Ireland), Europe (Stockholm), Europe (Frankfurt), Europe (Spain), Asia Pacific\
      \ (Hong Kong), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific\
      \ (Tokyo), Asia Pacific (Malaysia), Asia Pacific (Thailand), Asia Pacific (Mumbai),\
      \ and South America (Sao Paulo).</p> \n<p>To learn more, visit the Amazon SageMaker\
      \ Unified Studio <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/smus-creating-jobs.html\"\
      >documentation</a>. For details on what's included in AWS Glue 5.1, including\
      \ updated open table format support and access control capabilities, see the\
      \ AWS Glue <a href=\"https://docs.aws.amazon.com/glue/latest/dg/release-notes.html\"\
      >documentation</a>.</p>"
