"overview": |
  この日は Amazon SageMaker Unified Studio 関連の機能拡充と AI エージェントのガバナンス、コンプライアンス認証が中心でした。Amazon Bedrock AgentCore の Policy が一般提供となり、Cedar ベースのポリシーでエージェントとツールの相互作用を集中管理できるようになりました。SageMaker Unified Studio は Kiro IDE からのリモート接続、Atlan・Collibra・Alation とのメタデータ同期、AWS Glue 5.1 サポートを追加しました。コンプライアンス分野では、フィンランドの PiTuKri とスイスの FINMA について、いずれも 183 サービスを対象とした 2025 年 ISAE 3000 Type II 認証報告書が公開されました。アーキテクチャブログでは AWS Well-Architected Framework を用いたクラウドの隠れたコスト発見が解説されました。セキュリティ情報として MariaDB サーバー監査プラグインのコメント処理バイパス (CVE-2026-3494) が公表されました。
