  "04ff18c8ed29db3776fa170d29e19efa":
    "id": "04ff18c8ed29db3776fa170d29e19efa"
    "title": "AWS HealthImaging announces study-level fine-grained access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-healthimaging-study-level-access-control/"
    "published": "2026-03-27 07:00:00"
    "summary": "<p>AWS HealthImaging now supports fine-grained access control, enabling organizations to securely manage access to medical imaging data at the DICOM study and series levels. Medical imaging workflows are typically organized around DICOM studies, which are stored in AWS HealthImaging as one or more image set resources. Now customers can easily grant users access to all image sets for a set of DICOM Studies or Series with easy-to-maintain IAM policies.</p> \n<p>Customers can now grant permissions for DICOMweb APIs using DICOM Study Instance UIDs and Series Instance UIDs directly in their IAM policies, eliminating the need to list individual image set ARNs. Customers can now create dynamic, temporary access grants using AWS Security Token Service (STS) session policies with low-latency authentication. This capability provides enhanced protection for Protected Health Information (PHI) by scoping access grants to specific Studies or Series rather than entire data stores. This launch better supports use cases such as pathologist case-level access, radiology study sharing with external partners, and controlled research data distribution. To learn more, see the <a href=\"https://docs.aws.amazon.com/healthimaging/latest/devguide/what-is.html\">AWS HealthImaging Developer Guide</a>.</p> \n<p>AWS HealthImaging is a HIPAA-eligible service that empowers healthcare providers, life sciences organizations, and their software partners to store, analyze, and share medical images. AWS HealthImaging is generally available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), and Europe (London).&nbsp;</p>"
  "4f55b55732347126b6511a196ffef06f":
    "id": "4f55b55732347126b6511a196ffef06f"
    "title": "AWS Lambda supports up to 32 GB of memory and 16 vCPUs for Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/lambda-32-gb-memory-16-vcpus/"
    "published": "2026-03-27 16:00:00"
    "summary": "<p>AWS Lambda now supports up to 32 GB of memory and 16 vCPUs for functions running on Lambda Managed Instances, enabling customers to run compute-intensive workloads such as large-scale data processing, media transcoding, and scientific simulations without managing any infrastructure. Customers can also configure the memory-to-vCPU ratio — 2:1, 4:1, or 8:1 — to match the resource profile of their workload. Lambda Managed Instances lets you run Lambda functions on managed Amazon EC2 instances with built-in routing, load balancing, and auto-scaling, giving you access to specialized compute configurations including the latest-generation processors and high-bandwidth networking, with no operational overhead.<br /> <br /> Customers building compute-intensive applications such as data processing pipelines, high-throughput API backends, and batch computation workloads require substantial memory and CPU resources to process large datasets, serve low-latency responses at scale, and run complex computations efficiently. Previously, function execution environments on Lambda Managed Instances were limited to 10 GB of memory and approximately 6 vCPUs, with no option to customize the memory-to-vCPU ratio. Functions on Lambda Managed Instances can now be configured with up to 32 GB of memory, and a choice of memory-to-vCPU ratio — 2:1, 4:1, or 8:1 — allowing customers to select the right balance of memory and compute for their workload. For example, at 32 GB of memory, customers can configure 16 vCPUs (2:1), 8 vCPUs (4:1), or 4 vCPUs (8:1) depending on whether their workload is CPU-intensive or memory-intensive.<br /> <br /> This feature is available in all AWS Regions where Lambda Managed Instances is generally available. You can configure these settings using the AWS Console, AWS CLI, AWS CloudFormation, AWS CDK, or AWS SAM. To learn more, visit the <a href=\"https://aws.amazon.com/lambda/lambda-managed-instances/\">AWS Lambda Managed Instances product page</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">documentation</a>.</p>"
  "f86a226903f182f34ff5c12df48b3921":
    "id": "f86a226903f182f34ff5c12df48b3921"
    "title": "AWS Management Console now supports settings to control service and Region visibility"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/account-customizations-console/"
    "published": "2026-03-27 15:00:00"
    "summary": "<p>Today, AWS announces the general availability of Visible services and Visible Regions account settings in the AWS Management Console. These settings allow you to customize which services and regions appear in the Management Console for authorized users in your account, helping your users easily identify what is available to them and simplifying navigation.<br /> <br /> You can configure these settings in the AWS Management Console under Unified Settings in the Account Settings tab. You can also configure these setting programmatically via User Experience Customization (UXC) in AWS Command Line Interface (CLI), AWS Software Development Kits (SDKs), AWS Cloud Development Kit (CDK), or AWS CloudFormation. The Visible services and Visible Regions settings are available in AWS Commercial Regions at no additional cost.<br /> <br /> Visit the AWS User Experience Customization <u><a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/uxc.html\">documentation</a></u> page and <u><a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/APIReference/Welcome.html\">API guide</a></u> to learn more.</p>"
  "a3788d1e893022db748f954e41e499cb":
    "id": "a3788d1e893022db748f954e41e499cb"
    "title": "Amazon GameLift Servers expands instance support with next-generation EC2 instance families"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-gamelift-servers-expands-instance-support/"
    "published": "2026-03-27 09:00:00"
    "summary": "<p>Amazon GameLift Servers now supports Amazon EC2 5th through 8th generation instances, offering enhanced price-performance, efficiency, and flexibility for game server hosting. This update allows developers to leverage the latest advancements in EC2 compute, memory, and networking across three main instance families:<br /> </p> \n<ol> \n <li>General Purpose (M-series): Balanced CPU, memory, and networking for a wide range of game workloads.</li> \n <li>Compute Optimized (C-series): High-performance compute instances with a 2:1 memory ratio, ideal for CPU-intensive game servers.</li> \n <li>Memory Optimized (R-Series): Optimized for high-memory workloads with an 8:1 memory ratio, supporting complex simulations and large player sessions.</li> \n</ol> \n<p>Each new EC2 generation brings significant improvements:<br /> </p> \n<ul> \n <li>5th Gen: Proven reliability with Intel processors with balanced performance</li> \n <li>6th Gen: Includes AWS Graviton2 ARM-based options alongside Intel and AMD variants offering enhanced price-performance efficiency.</li> \n <li>7th Gen: The latest evolution featuring DDR5 memory, enhanced networking, and offering significant performance gains over previous generations.</li> \n <li>8th Gen: Cutting-edge AWS Graviton4 and Intel Xeon-based instances for demanding workloads</li> \n</ul> \n<p>Customers can also choose variants with local storage (d), enhanced networking (n), and different processor architectures (Intel, AMD, Graviton – i/a/g).<br /> <br /> This update empowers developers with greater flexibility, scalability, and cost efficiency to optimize game server performance. Customers can now seamlessly transition workloads to newer EC2 generations, leveraging AWS's continuous innovation for building, scaling, and operating multiplayer games globally.<br /> <br /> These next-generation instances are available in Amazon GameLift Servers supported regions, except AWS China. For more information on launching fleets with next-generation EC2 instances, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/gameliftservers/latest/developerguide/release-notes.html\" target=\"_blank\">Amazon GameLift Servers documentation</a>&nbsp;and&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/\" target=\"_blank\">EC2 Instance Types overview</a>.</p>"
"last_updated": "2026-03-28 07:28:06 JST"
