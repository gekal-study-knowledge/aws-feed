    "title": "Amazon Connect と Amazon Lex によるセルフサービス導入と継続改善：JBR コンタクトセンターの業務効率化の取り組み"
    "link": "https://aws.amazon.com/jp/blogs/news/jbr-amazonconnect-lex-selfservice/"
    "published": "2026-03-25 11:14:21"
    "fetched": "2026-03-25 11:14:21"
    "summary": "ジャパンベストレスキューシステム株式会社（以下、JBR）は、日本全国で展開する生活救急サービスのリーディングカンパニーです。住宅のカギの紛失や水まわりのトラブル、ガラスの破損など、日常生活で発生する様々な緊急事態に対し、24 時間 365 日体制で駆けつけサービスを提供しています。「困っている人を助ける」という企業理念のもと、生活救急事業を中心に事業を拡大しており、全国 47 都道府県をカバーする協力事業者ネットワークを構築しています。このブログでは、JBR がカスタマーサービスの品質向上と業務効率化を実現するために、Amazon Connect、Amazon Lex でセルフサービスを導入し、目標数値の75%の自動応答化とエージェントの業務時間削減に成功した事例についてご紹介します。"
"last_updated": "2026-03-25 20:39:10 JST"
