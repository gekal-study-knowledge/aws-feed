    "link": "https://aws.amazon.com/jp/blogs/news/reimagine-your-mainframe-applications-with-agentic-ai-and-aws-transform/"
    "published": "2026-03-25 06:21:06"
    "fetched": "2026-03-25 06:21:06"
    "summary": "本ブログでは、reimagine パターンによってメインフレームのレガシーアプリケーションをモダナイズする AWS のアプローチの概要を説明し、組織がレガシー COBOL アプリケーションをモダンなクラウドネイティブアーキテクチャに変換する方法を紹介します。"
  "c61f435cd44469329c2943788b87f470":
