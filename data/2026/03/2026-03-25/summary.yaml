"overview": |
  What's New を中心に多数のサービスアップデートが発表された一日でした。特に Amazon Aurora PostgreSQL は数秒でのデータベース作成・接続と AWS 無料利用枠での提供を開始し、注目を集めました。生成 AI/エージェント分野では、Bedrock AgentCore Runtime の永続セッションストレージ（プレビュー）や Chrome ポリシー対応、SageMaker AI の 12 モデル追加向けサーバーレス強化学習ファインチューニング、Bedrock での OpenAI 互換 API による強化学習ファインチューニングが発表されました。開発ツールでは SageMaker Unified Studio の Cursor IDE 連携、AWS Serverless 向け Agent Plugin、Kiro による Amazon Connect AI エージェント開発が紹介されています。HPC 分野では ParallelCluster 3.15（P6-B300、Slurm 25.11 対応）や SageMaker HyperPod の継続プロビジョニング、EC2 I7ie のリージョン拡張なども発表されました。
