    "title": "Announcing Amazon Aurora PostgreSQL serverless database creation in seconds"
    "link": "https://aws.amazon.com/blogs/aws/announcing-amazon-aurora-postgresql-serverless-database-creation-in-seconds/"
    "published": "2026-03-26 05:37:11"
    "fetched": "2026-03-26 05:37:11"
    "summary": "AWS introduces a new express configuration for Amazon Aurora PostgreSQL, a streamlined database creation experience with preconfigured defaults designed to help you get started in seconds. With Aurora PostgreSQL, start building quickly from the RDS Console or your preferred developer tool—with the ability to modify configurations anytime. Plus, Aurora PostgreSQL is now available with AWS Free Tier."
