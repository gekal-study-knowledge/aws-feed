"entries":
  "5c971d82409fa8f0888c756728e54537":
    "id": "5c971d82409fa8f0888c756728e54537"
    "title": "Amazon EC2 I7ie instances now available in additional AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-i7ie-instances-additional-aws-regions/"
    "published": "2026-03-25 15:24:00"
    "summary": "<p>AWS is announcing starting today, Amazon EC2 I7ie instances are now available in AWS Asia Pacific (Hong Kong), Asia Pacific (Seoul),&nbsp;Asia Pacific (Melbourne),&nbsp;Asia Pacific (Thailand),&nbsp;Europe (Zurich),&nbsp;Europe (Milan) and Mexico (Central) regions. Designed for large storage I/O intensive workloads, I7ie instances are powered by 5th Gen Intel Xeon Processors with an all-core turbo frequency of 3.2 GHz, offering up to 40% better compute performance and 20% better price performance versus I3en instances.</p> \n<p>I7ie instances offer up to 120TB local NVMe storage density for storage optimized instances and offer up to twice as many vCPUs and memory compared to prior generation instances. Powered by 3rd generation AWS Nitro SSDs, I7ie instances deliver up to 65% better real-time storage performance, up to 50% lower storage I/O latency, and 65% lower storage I/O latency variability compared to I3en instances.</p> \n<p>I7ie are high density storage optimized instances, ideal for workloads requiring fast local storage with high random read/write performance at very low latency consistency to access large data sets. These instances are available in 9 virtual sizes and deliver up to 100Gbps of network bandwidth and 60Gbps of bandwidth for Amazon Elastic Block Store (EBS).</p> \n<p>To learn more, visit the I7ie instances<a href=\"https://aws.amazon.com/ec2/instance-types/i7ie/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;page</a>.</p>"
  "6e05ef03fc502d9427fe452cb7e4cc5d":
    "id": "6e05ef03fc502d9427fe452cb7e4cc5d"
    "title": "Amazon SageMaker HyperPod now supports continuous provisioning for Slurm-orchestrated clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-hyperpod-continuous-provisioning/"
    "published": "2026-03-25 04:30:00"
    "summary": "<p>Amazon SageMaker HyperPod now extends continuous provisioning support to clusters using the Slurm orchestrator, enabling greater flexibility and efficiency for enterprise customers running large-scale AI/ML training workloads. AI/ML customers running Slurm-based clusters need to start training quickly, scale seamlessly, perform maintenance without disrupting operations, and have granular visibility into cluster operations. Previously, if any instance group could not be fully provisioned, the entire cluster creation or scaling operation failed and rolled back, causing delays and requiring manual intervention.<br /> <br /> With continuous provisioning for Slurm, SageMaker HyperPod automatically provisions remaining capacity in the background while training jobs can begin immediately on available instances. The system uses priority-based provisioning to bring up the Slurm controller node first, followed by login and worker nodes in parallel, so your cluster reaches an operational state as quickly as possible. HyperPod retries failed node launches asynchronously and adds nodes to the Slurm cluster automatically as they become available, ensuring clusters reliably reach their desired scale without requiring manual intervention. You can now perform concurrent, non-blocking scaling operations across multiple instance groups simultaneously — a capacity shortage in one instance group no longer blocks scaling in others. These capabilities help customers reduce time-to-training, maximize resource utilization, and focus on innovation rather than infrastructure management.<br /> <br /> This feature is available for new SageMaker HyperPod clusters using the Slurm orchestrator. You can enable continuous provisioning by setting the NodeProvisioningMode parameter to \"Continuous\" when creating new HyperPod clusters using the CreateCluster API. Continuous provisioning can also be enabled when creating new clusters through the AWS CLI and the SageMaker AI console.<br /> <br /> This feature is available in all AWS Regions where Amazon SageMaker HyperPod is supported. To learn more about continuous provisioning for Slurm clusters, see the <a href=\"https://docs.amazonaws.cn/en_us/sagemaker/latest/dg/sagemaker-hyperpod-scaling-slurm.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon SageMaker HyperPod User Guide</a>.</p>"
  "603cc790a692980a9444f4fdc8f0b6a0":
    "id": "603cc790a692980a9444f4fdc8f0b6a0"
    "title": "AWS Backup expands support for Amazon DocumentDB to 12 Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-backup-amazon-documentdb-regions/"
    "published": "2026-03-25 10:00:00"
    "summary": "<p>AWS Backup now supports Amazon DocumentDB in 12 additional AWS Regions: Asia Pacific (Malaysia, Thailand, Osaka, Hong Kong, Jakarta, Melbourne), Europe (Stockholm, Spain, Zurich), Africa (Cape Town), Israel (Tel Aviv), and Mexico (Central).</p> \n<p>This expansion brings policy-based data protection and recovery to your Amazon DocumentDB clusters in these newly supported Regions.</p> \n<p>To start protecting your DocumentDB clusters with AWS Backup, add your DocumentDB clusters to your existing backup plans, or create a new backup plan and attach your DocumentDB clusters to it. To learn more about AWS Backup for Amazon DocumentDB, visit the <a href=\"https://aws.amazon.com/backup/\">product page</a>, <a href=\"https://aws.amazon.com/backup/pricing/\">pricing page</a>, and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html\">documentation</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/backup\">AWS Backup console</a>, AWS Command Line Interface (CLI), or AWS SDKs.</p>"
  "f639f310792106ca89453db8310eee18":
    "id": "f639f310792106ca89453db8310eee18"
    "title": "Amazon Bedrock AgentCore Runtime now supports managed session storage for persistent agent filesystem state (preview)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/bedrock-agentcore-runtime-session-storage/"
    "published": "2026-03-25 01:30:00"
    "summary": "<p>Amazon Bedrock AgentCore Runtime now offers managed session storage in public preview, enabling agents to persist their filesystem state across stop and resume cycles. Modern agents write code, install packages, generate artifacts, and manage state through the filesystem. Until now, that work was lost when a session stopped. With managed session storage, everything your agent writes to a configured mount path persists automatically, even after the compute environment terminates.</p> \n<p>When you configure session storage, each session gets a persistent directory at the mount path you specify. Your agent reads and writes files as normal, and AgentCore Runtime transparently replicates data to durable storage. When the session stops, data is flushed during graceful shutdown. When you resume with the same session ID, a new microVM mounts the same storage and the agent continues from where it left off — source files, installed packages, build artifacts, and git history all intact. No checkpoint logic, no save and restore code, and no changes to your agent application required. Session storage supports standard Linux filesystem operations including regular files, directories, and symlinks, with up to 1 GB per session and data retained for 14 days of idle time. Storage communication is confined to a single session's data and cannot access other sessions or AgentCore Runtime environments.</p> \n<p>Session storage is available in public preview across fourteen AWS Regions: US (N. Virginia, Ohio, Oregon), Canada (Central), Asia Pacific (Mumbai, Seoul, Singapore, Sydney, Tokyo), Europe (Frankfurt, Ireland, London, Paris, Stockholm).</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-persistent-filesystems.html\">persist files across stop/resume</a> in the Amazon Bedrock AgentCore documentation.</p>"
  "1561a248cd58c485d2edfd9c7aa91e33":
    "id": "1561a248cd58c485d2edfd9c7aa91e33"
    "title": "AWS Batch now supports quota management and preemption for SageMaker Training jobs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-batch-quota-management-preemption-sagemaker/"
    "published": "2026-03-25 18:40:00"
    "summary": "<p>AWS Batch now supports quota management with job preemption for SageMaker Training jobs, enabling you to efficiently allocate and share compute resources across your teams and projects. If you're using GPU capacity in SageMaker Training jobs, you can now intelligently allocate compute resources, prioritize your business-critical training jobs, and automatically preempt lower-priority workloads when your urgent experiments arrive.<br /> <br /> With quota management, you can create up to 20 quota shares per job queue that function as virtual queues with dedicated capacity limits and configurable resource sharing strategies. The service automatically uses cross-share preemption to restore borrowed capacity when the original owner submits jobs, and supports in-share preemption to allow high-priority jobs to preempt lower-priority jobs within the same quota share. You can monitor capacity utilization at the queue, quota share, and job-level granularity, update job priorities after submission to influence preemption decisions, and configure preemption retry limits to control behavior. The feature integrates directly with the SageMaker Python SDK via the <a href=\"https://github.com/aws/sagemaker-python-sdk/tree/master/sagemaker-train/src/sagemaker/train/aws_batch\"><i></i>aws_batch</a><i> </i>module.<br /> <br /> Quota management with job preemption for SageMaker Training jobs is available today in all <a href=\"https://quip-amazon.com/sPJ9Atx1pB3N/Whats-New-support-for-ECS-Exec-and-FireLens#temp:C:fbA172d523633394e51bf2ad0bc7\">AWS Regions</a> where AWS Batch is available. For more information, see our <a href=\"https://github.com/aws/sagemaker-python-sdk/blob/master/v3-examples/training-examples/aws_batch/sm-training-queues_quota-management.ipynb\">Quota Management example notebook</a> on GitHub and the <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/quota-management.html\">AWS Batch User Guide</a>.</p>"
  "3eca92a5bbb5e624cab51fa8f12d133c":
    "id": "3eca92a5bbb5e624cab51fa8f12d133c"
    "title": "AWS Batch now provides AMI status and supports AWS Health Planned Lifecycle Events"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-batch-ami-status-aws-health/"
    "published": "2026-03-25 20:32:00"
    "summary": "<p>AWS Batch now provides enhanced visibility into your compute environments with two new capabilities that help you maintain operational best practices. When you describe a compute environment, you can now see the status of your Batch-provided default Amazon Machine Images (AMIs), indicating when updates are available. Additionally, AWS Batch now publishes AWS Health Planned Lifecycle Events to help you prepare for and track changes affecting your batch computing resources.<br /> <br /> The AMI status indicator shows whether you're using the latest AMI (LATEST) or if an update is available (UPDATE_AVAILABLE), helping you identify compute environments that may be running outdated AMIs. AWS Health Planned Lifecycle Events provide advance notification of upcoming changes, such as AMI deprecations, help you monitor migration status of your affected compute environments, and automate responses using Amazon EventBridge.<br /> <br /> AMI status indicator and AWS Health Planned Lifecycle Events are available today in all <a href=\"https://quip-amazon.com/sPJ9Atx1pB3N/Whats-New-support-for-ECS-Exec-and-FireLens#temp:C:fbA172d523633394e51bf2ad0bc7\">AWS Regions</a> where AWS Batch is available. For more information, see <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/managing-ami-versions.html\">Managing AMI versions</a> and <a href=\"https://docs.aws.amazon.com/batch/latest/userguide/batch-planned-lifecycle-events.html\">AWS Health Planned Lifecycle Events</a> pages in the AWS Batch User Guide.</p>"
  "8c72c04dccf0b5ca45b64622d87cb8d0":
    "id": "8c72c04dccf0b5ca45b64622d87cb8d0"
    "title": "Amazon Bedrock AgentCore adds support for Chrome policies and custom root CA"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/agentcore-browser-policies-root-ca/"
    "published": "2026-03-25 20:10:00"
    "summary": "<p>Amazon Bedrock AgentCore now enables customers to configure Chrome Enterprise policies for AgentCore Browser and specify custom root Certificate Authority (CA) certificates for both AgentCore Browser and Code Interpreter. These enhancements help ensure enterprise requirements are met when allowing AI agents to operate within organizations that have strict security policies and internal infrastructure using custom certificates.<br /> <br /> With Chrome policies, you can leverage over 100+ configurable policies for managing browser behavior across security, URL filtering, content settings, and more to enforce organizational compliance requirements. For example, restrict agents to specific URLs for kiosk-mode operations, disable password managers and downloads for data-entry tasks, or implement URL blocklists for regulatory compliance. Custom root CA support enables agents to seamlessly connect to internal services like Artifactory, Jira, and finance portals that use SSL certificates signed by your organization's internal Certificate Authority, and work with corporate proxies performing TLS interception.<br /> <br /> These features are available in all 14 <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\">AWS Regions</a> where Amazon Bedrock AgentCore Browser and Code Interpreter are available: US East (N. Virginia), US East (Ohio), US West (Oregon), Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Asia Pacific (Seoul), and Canada (Central).<br /> <br /> To learn more, visit the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-tool.html\">AgentCore Browser documentation</a>.&nbsp;</p>"
  "73e39bb247b99f51aed027a02126104c":
    "id": "73e39bb247b99f51aed027a02126104c"
    "title": "Amazon Route 53 Profiles now supports granular IAM permissions for resource and VPC associations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-route-53-profiles-granular-iam/"
    "published": "2026-03-25 18:34:00"
    "summary": "<p>Amazon Route 53 Profiles now supports granular AWS Identity and Access Management (IAM) permissions, allowing you to control which users can manage specific resource types and VPC associations within your Profiles. With this launch, you can create IAM policies that restrict users to specific operations (associate, disassociate, or update) on individual resource types such as private hosted zones, Resolver rules, or DNS Firewall rule groups. You can also define permissions based on resource ARNs, hosted zone names, Resolver rule domain names, DNS Firewall rule group priority ranges, or specific VPC associations.<br /> <br /> Route 53 Profiles enable you to define a standard DNS configuration that includes private hosted zone associations, Resolver rules, and DNS Firewall rule groups, and apply this configuration to multiple VPCs in your account or share with AWS accounts using AWS Resource Access Manager (RAM). This new capability provides administrators with fine-grained control over Profile management, enabling you to delegate specific responsibilities while maintaining security and governance standards across your organization.<br /> <br /> This feature is available at no additional charge in all AWS Regions where Route 53 Profiles is available, except in Middle East (Bahrain) and Middle East (UAE). To learn more, see the Amazon Route 53 Profiles <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/specifying-conditions-route53.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>&nbsp;and <a href=\"https://aws.amazon.com/route53/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>.</p>"
  "ed85d55af26d9cb3de874708b525fef1":
    "id": "ed85d55af26d9cb3de874708b525fef1"
    "title": "Amazon SageMaker AI now supports serverless reinforcement fine-tuning for 12 additional models"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-ai-serverless-additional-models/"
    "published": "2026-03-25 16:25:00"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization and reinforcement fine-tuning for 12 additional open-weight models, enabling you to fine-tune and evaluate them without provisioning or managing infrastructure. The newly supported models are: gpt-oss-120b, Qwen2.5 72B Instruct, DeepSeek-R1-Distill-Llama-70B, Qwen3 14B, DeepSeek-R1-Distill-Qwen-14B, Qwen2.5 14B Instruct, DeepSeek-R1-Distill-Llama-8B, DeepSeek-R1-Distill-Qwen-7B, Qwen3 4B, Meta Llama 3.2 3B Instruct, Qwen3 1.7B, and DeepSeek-R1-Distill-Qwen-1.5B. With this expansion, you can customize these models using supervised fine-tuning (SFT), direct preference optimization (DPO), and reinforcement fine-tuning (RFT) techniques including RLVR and RLAIF, and only pay for what you use.<br /> <br /> Reinforcement fine-tuning enables you to align models to complex, domain-specific reasoning tasks where techniques such as traditional SFT alone fall short. With RLVR, you can improve model accuracy on verifiable tasks such as code generation, math, and structured extraction by providing reward signals based on correctness. RLAIF uses AI-generated feedback to steer model behavior toward your quality and safety preferences. These techniques are available on previously supported and newly added models, with no cluster setup, capacity planning, or distributed training expertise required.<br /> <br /> These models and fine-tuning techniques are available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and EU (Ireland). To get started, see the Amazon SageMaker AI model customization <a href=\"https://aws.amazon.com/sagemaker/ai/model-customization/\">product page</a> and visit the Amazon SageMaker AI <a href=\"https://aws.amazon.com/sagemaker/ai/pricing/\">pricing page</a> (Model Customization tab) to see the full list of models, techniques, and prices.&nbsp;</p>"
  "43afd2e591c90951277f9d460d2484de":
    "id": "43afd2e591c90951277f9d460d2484de"
    "title": "Amazon SageMaker Unified Studio launches support for remote connection from Cursor IDE"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/sagemaker-unified-studio-cursor-ide/"
    "published": "2026-03-25 20:21:00"
    "summary": "<p>Today, AWS announces remote connection from Cursor IDE to Amazon SageMaker Unified Studio via the AWS Toolkit extension. This new capability allows data scientists, ML engineers, and developers to leverage their Cursor setup - including its AI-powered code completion, natural language editing, and multi-file editing capabilities - while accessing the scalable compute resources of Amazon SageMaker. By connecting Cursor to SageMaker Unified Studio using the AWS Toolkit extension, you can eliminate context switching between your local IDE and cloud infrastructure, maintaining your existing AI-assisted development workflows within a single environment for all your AWS analytics and AI/ML services.</p> \n<p>SageMaker Unified Studio, part of the next generation of Amazon SageMaker, offers a broad set of fully managed cloud interactive development environments (IDE), including JupyterLab and Code Editor based on Code-OSS (Open-Source Software). Starting today, you can also use your customized local Cursor setup - complete with custom rules, extensions, and AI model preferences - while accessing your compute resources and data on Amazon SageMaker. Since Cursor is built on Code-OSS, authentication is secure via IAM through the AWS Toolkit extension, giving you access to all your SageMaker Unified Studio domains and projects. This integration provides a convenient path from your local AI-powered development environment to scalable infrastructure for running workloads across data processing, SQL analytics services like Amazon EMR, AWS Glue, and Amazon Athena, and ML workflows - all with enterprise-grade security including customer-managed encryption keys and AWS IAM integration.</p> \n<p>This feature is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">all AWS Regions where Amazon SageMaker Unified Studio is available</a>. To learn more, visit&nbsp;the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/local-ide-support.html\">local IDE support documentation</a>..</p>"
  "9d797031b3907fbb9083c229611e1a0e":
    "id": "9d797031b3907fbb9083c229611e1a0e"
    "title": "Amazon Aurora PostgreSQL now available with the AWS Free Tier"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-aurora-postgresql-aws-free-tier/"
    "published": "2026-03-25 17:00:00"
    "summary": "<p>Amazon Aurora PostgreSQL is now available on the AWS Free Tier, which offers new customers $100 in AWS credits upon sign-up and the ability to earn an additional $100 in credits by using services including Amazon RDS.<br /> <br /> With a Free Plan account, you can create an Aurora PostgreSQL serverless cluster from the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Console</a>, AWS CLI, or AWS SDKs using express configuration, which enables you to create and query an Aurora PostgreSQL database in seconds. To get started, select the Free Plan during new AWS account sign-up.</p> \n<p>AWS Free Tier is available in all AWS Regions where Aurora PostgreSQL serverless is <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.ServerlessV2.html#Concepts.Aurora_Fea_Regions_DB-eng.Feature.ServerlessV2.apg\" target=\"_blank\">supported.</a> For more details, see the <a href=\"https://aws.amazon.com/rds/free/\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora &amp; RDS Free Tier</a> and <a href=\"https://aws.amazon.com/free/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Free Tier</a> pages.</p>"
  "669b3974610735ac2aa66053a8e208a1":
    "id": "669b3974610735ac2aa66053a8e208a1"
    "title": "Amazon Aurora PostgreSQL now supports creating and connecting to a database in seconds"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-aurora-postgresql-database/"
    "published": "2026-03-25 17:00:00"
    "summary": "<p>Amazon Aurora PostgreSQL now offers a new experience to create a cluster with express configuration, enabling you to create and query an Aurora serverless database in seconds. With pre-configured settings, the new experience accelerates initial setup and reduces time to first query. You have the flexibility to modify certain settings during creation and most other settings afterward.</p> \n<p>Aurora clusters created using express configuration reside outside a virtual private cloud (VPC) network and include an internet access gateway for secure connections from your favorite development tools - no VPN, or AWS Direct Connect required. The internet access gateway supports the full PostgreSQL wire protocol, enabling connectivity from a broad range of development tools and clients. It is distributed across multiple Availability Zones, providing the same level of high availability as your Aurora cluster. It also sets up AWS Identity and Access Management (IAM) authentication for your administrator user by default, enabling passwordless database authentication from the beginning without additional configuration.</p> \n<p>Aurora PostgreSQL serverless is now available with the <a href=\"https://aws.amazon.com/free/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Free Tier</a> on both the Free and Paid plans. &nbsp;For regional availability and more details, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.AuroraPostgreSQL.ExpressConfig.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora documentation</a> or read the <a href=\"https://aws.amazon.com/blogs/aws/announcing-amazon-aurora-postgresql-serverless-database-creation-in-seconds\" rel=\"noopener noreferrer\" target=\"_blank\">launch blog</a>. To get started, use the&nbsp;<a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Console</a>, AWS CLI, or AWS SDKs.</p>"
  "9cbab81fee4d0398718b26af62d67960":
    "id": "9cbab81fee4d0398718b26af62d67960"
    "title": "AWS Transfer Family AS2 now supports receipts of MDNs asynchronously"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-transfer-family-as2-mdns/"
    "published": "2026-03-25 10:00:00"
    "summary": "<p>AWS Transfer Family now supports receiving&nbsp;Message Disposition Notifications (MDNs) asynchronously for messages sent to trading partners over Applicability Statement 2 (AS2). This enables you to migrate your AS2 workflows to Transfer Family while&nbsp;maintaining&nbsp;interoperability with your trading partners, regardless of their message processing times or network requirements.&nbsp;</p> \n<p>Organizations across healthcare, life sciences, retail, manufacturing, and supply chain sectors depend on Transfer Family for secure AS2-based data exchange with trading partners and regulatory bodies.&nbsp;You can now send AS2 messages while requesting MDNs asynchronously over a separate TLS connection, ensuring compatibility with partner AS2 systems that have extended processing times or high latency.&nbsp;With this launch, Transfer Family&nbsp;supports both synchronous and asynchronous MDN requests, enabling you to migrate AS2 workflows to AWS without&nbsp;impacting&nbsp;your partner integrations.&nbsp;</p> \n<p>This capability is available&nbsp;in the majority of AWS regions where AWS Transfer&nbsp;Family is offered.&nbsp;For the full list of supported regions, visit the&nbsp;<a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities tool</a>&nbsp;in Builder&nbsp;Center.&nbsp;For detailed implementation guidance, see the&nbsp;<a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/create-b2b-server.html\">Transfer Family user guide</a>. To learn more, visit the&nbsp;<a href=\"https://aws.amazon.com/aws-transfer-family/\">AWS Transfer Family product page</a>.</p>"
  "6c14e9b6a9e679197ce52a73f87f3326":
    "id": "6c14e9b6a9e679197ce52a73f87f3326"
    "title": "Accelerate AI-assisted development with Agent Plugin for AWS Serverless"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/agent-plugin-aws-serverless/"
    "published": "2026-03-25 21:00:00"
    "summary": "<p>AWS announces the Agent Plugin for&nbsp;AWS&nbsp;Serverless, enabling developers to easily build, deploy, troubleshoot, and manage serverless applications using AI coding assistants like Kiro, Claude Code, and Cursor.</p> \n<p>Agent plugins extend AI coding assistants with structured, reusable capabilities by packaging skills, sub-agents, hooks, and Model Context Protocol (MCP)&nbsp;servers into a single modular unit. The&nbsp;Agent Plugin for&nbsp;AWS&nbsp;Serverless&nbsp;dynamically loads relevant guidance and&nbsp;expertise&nbsp;required&nbsp;throughout the development lifecycle for building production-ready serverless applications on AWS. You can create&nbsp;AWS&nbsp;Lambda&nbsp;functions that integrate with popular event sources like Amazon&nbsp;EventBridge, Amazon Kinesis, and AWS Step Functions, while following&nbsp;built-in&nbsp;best practices for observability, performance optimization, and troubleshooting. As you adopt Infrastructure as Code&nbsp;(IaC),&nbsp;you can streamline project setup with AWS Serverless Application Model (SAM) and AWS Cloud Development Kit (CDK),&nbsp;with reusable constructs, proven architectural patterns, automated CI/CD pipelines, and local testing workflows. For long-running, stateful workflows, you can build with confidence using&nbsp;Lambda durable functions, which provides&nbsp;checkpoint-replay model, advanced&nbsp;orchestration&nbsp;patterns, and error handling&nbsp;capabilities. Lastly, you can design and manage APIs as part of your application using Amazon API Gateway, with guidance across REST&nbsp;APIs, HTTP&nbsp;APIs, and WebSocket APIs. These capabilities are packaged as agent skills in the open&nbsp;<a href=\"https://agentskills.io/home\" rel=\"noopener noreferrer\" style=\"background-color: rgb(255, 255, 255);\" target=\"_blank\">Agent Skills</a>&nbsp;format, making them usable across compatible AI tools such as Kiro, Claude Code, and Cursor.</p> \n<p>The Agent Plugin for&nbsp;AWS&nbsp;Serverless is available&nbsp;in any AI&nbsp;coding assistant&nbsp;tools&nbsp;that&nbsp;support&nbsp;agent plugins&nbsp;such as Claude Code and Cursor. In Claude Code, you can install it from the&nbsp;official&nbsp;<a href=\"https://claude.com/plugins/aws-serverless\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Marketplace</a>&nbsp;using&nbsp;a simple command&nbsp;‘/plugin&nbsp;install&nbsp;aws-serverless@claude-plugins-official’.&nbsp;You can also install agent skills from the plugin individually in any AI coding assistant&nbsp;tools&nbsp;that&nbsp;support agent skills. To learn more about the plugin and its capabilities, visit&nbsp;<a href=\"https://github.com/awslabs/agent-plugins\" rel=\"noopener noreferrer\" target=\"_blank\">GitHub.</a></p>"
  "e29032a877e81d2e9221c22f670a238d":
    "id": "e29032a877e81d2e9221c22f670a238d"
    "title": "AWS ParallelCluster 3.15 with support for P6-B300 and Slurm 25.11"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-parallelcluster-p6-b300-slurm/"
    "published": "2026-03-25 07:00:00"
    "summary": "<p>AWS ParallelCluster 3.15 is now generally available. This release adds support for P6-B300 instance types and upgrades Slurm to version 25.11 with expedited job requeue.<br /> <br /> With P6-B300 support, you can run demanding AI/ML and high-performance computing workloads on the latest NVIDIA Blackwell GPU infrastructure. This release includes improved EFA network configuration defaults and support for network interface customization. To learn how to customize network interfaces, see <a href=\"https://docs.aws.amazon.com/parallelcluster/latest/ug/tutorial-network-customization-v3.html\">Customize compute node network interfaces with launch template overrides</a>. Other improvements include more reliable cluster updates, improved performance for tightly-coupled workloads in large clusters, and support for updating cluster tags without disruption. For more details, review the AWS ParallelCluster 3.15.0 <a href=\"https://github.com/aws/aws-parallelcluster/releases/tag/v3.15.0\">release notes</a>.<br /> <br /> AWS ParallelCluster is an open-source cluster management tool that makes it possible for R&amp;D customers and IT administrators to operate high-performance computing (HPC) clusters on AWS. ParallelCluster is designed to automatically and securely provision cloud resources into elastically-scaling HPC clusters capable of running scientific and engineering workloads at scale on AWS. ParallelCluster is available at no additional charge in the AWS Regions listed <a href=\"https://docs.aws.amazon.com/parallelcluster/latest/ug/supported-regions.html\">here</a>, and you pay only for the AWS resources needed to run your applications.<br /> <br /> To learn more about launching HPC clusters on AWS, visit the ParallelCluster <a href=\"https://docs.aws.amazon.com/parallelcluster/latest/ug/tutorials-v3.html\">User Guide</a>. To start using ParallelCluster, see the installation instructions for ParallelCluster <a href=\"https://docs.aws.amazon.com/parallelcluster/latest/ug/install-pcui-v3.html\">UI</a> and <a href=\"https://docs.aws.amazon.com/parallelcluster/latest/ug/install-v3-parallelcluster.html\">CLI</a>.</p>"
"last_updated": "2026-03-27 03:00:21 JST"
