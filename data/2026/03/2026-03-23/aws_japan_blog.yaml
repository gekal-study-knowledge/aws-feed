    "title": "週刊生成AI with AWS – 2026/3/16 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260316/"
    "published": "2026-03-23 15:46:19"
    "fetched": "2026-03-23 15:46:19"
    "summary": "週刊生成AI with AWS, AgentCore の機能拡充が目立つ2026年3月16日号 - Amazon Bedrock AgentCore によるネットワーク運用エージェント構築のブログ記事を紹介。サービスアップデートでは AgentCore Runtime の AG-UI プロトコル・シェルコマンド実行・WebRTC サポートや、Minimax M2.5・GLM 5・Nemotron 3 Super の新モデル追加、SageMaker HyperPod のアイドルリソース共有をはじめとする13件のアップデートを紹介。"
  "176fc7f97cb8ed7222272d6254558926":
    "id": "176fc7f97cb8ed7222272d6254558926"
    "title": "週刊AWS – 2026/3/16週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260316/"
    "published": "2026-03-24 08:08:26"
    "fetched": "2026-03-24 08:08:26"
    "summary": "Amazon CloudWatch が組織全体での EC2 詳細モニタリング有効化を導入、Amazon Connect でオ外部メールアドレスにメール連絡先を転送可能、Amazon S3 Tables と Iceberg マテリアライズドビューの権限管理を簡素化、Amazon RDS の SQL Server Developer Edition 向け機能強化、Amazon Bedrock AgentCore Runtime でシェルコマンド実行がサポート開始、Amazon Redshift がダッシュボードと ETL ワークロードの新しいクエリのパフォーマンスを最大 7 倍向上、Amazon RDS Custom for SQL Server にOSアップデートの表示とスケジュール機能を追加"
