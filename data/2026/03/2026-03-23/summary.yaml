"overview": |
  AWS 創立 20 周年と 2026 年最初の AWS ヒーロー選出という節目の話題に加え、生成 AI・エージェント関連の発表が中心となった一日でした。Amazon Bedrock AgentCore Runtime のシェルコマンド実行サポートや、NVIDIA Nemotron 3 Super の Bedrock 追加など、週刊 AWS/週刊生成 AI で多数のアップデートが紹介されました。技術記事では、Reco によるセキュリティアラート変革や規制業界での LLM ハルシネーション対策（Amazon Nova）、Lambda 耐久性関数のベストプラクティス、Amazon EKS を用いた運用最適化、Amazon MSK Express ブローカーによる Kafka 運用の簡素化などが取り上げられました。IAM ポリシータイプの解説や AWS HealthImaging の欧州（ロンドン）リージョン提供開始も発表されています。
