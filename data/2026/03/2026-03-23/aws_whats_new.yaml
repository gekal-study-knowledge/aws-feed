    "title": "AWS HealthImaging is now available in Europe (London)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-healthimaging-europe-london/"
    "published": "2026-03-23 07:00:00"
    "fetched": "2026-03-23 07:00:00"
    "summary": "<p>AWS HealthImaging is now available in the AWS Europe (London) Region. AWS HealthImaging is a HIPAA-eligible service that empowers healthcare providers, life sciences organizations, and their software partners to store, analyze, and share medical images at petabyte scale.</p> \n<p><br /> AWS HealthImaging offers fully managed infrastructure for storing medical imaging data, with both DICOMWeb APIs for easy integration with existing applications and AWS-native APIs for cloud-first implementations. With AWS HealthImaging, organizations can reduce storage costs by up to 40% compared to do-it-yourself solutions, enable faster image access for clinical workflows, and accelerate the development of AI-powered diagnostic applications while maintaining strict security controls over sensitive data.</p> \n<p><br /> AWS HealthImaging is generally available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Europe (Ireland), and Europe (London). To learn more, see the <a href=\"https://docs.aws.amazon.com/healthimaging/latest/devguide/what-is.html\">AWS HealthImaging Developer Guide</a>.</p>"
"last_updated": "2026-03-24 02:51:55 JST"
