  "081d9242a4a41f23ab30833c2ab905ec":
    "id": "081d9242a4a41f23ab30833c2ab905ec"
    "title": "Vanguard が Amazon Redshift マルチウェアハウスアーキテクチャで分析基盤を刷新"
    "link": "https://aws.amazon.com/jp/blogs/news/how-vanguard-transformed-analytics-with-amazon-redshift-multi-warehouse-architecture/"
    "published": "2026-03-24 22:50:10"
    "summary": "Vanguard の Financial Advisor Services 部門が、Amazon Redshift のマルチウェアハウスアーキテクチャを活用して分析基盤を変革した事例を紹介します。単一クラスターから、プロビジョンドクラスターと Serverless を組み合わせたワークロード分離アーキテクチャへの移行により、ETL の SLA 遵守率 100%、月間 50 万以上のクエリ対応、BI ダッシュボード 25 倍増を実現しました。さらに、データメッシュアーキテクチャへの進化についても解説します。"
  "4c4703ea9615c42cb8d0000bcd58d45c":
    "id": "4c4703ea9615c42cb8d0000bcd58d45c"
    "title": "Amazon Redshift と AWS IAM Identity Center できめ細かなアクセス許可を複数のウェアハウスに展開する"
    "link": "https://aws.amazon.com/jp/blogs/news/scale-fine-grained-permissions-across-warehouses-with-amazon-redshift-and-aws-iam-identity-center/"
    "published": "2026-03-24 22:48:18"
    "summary": "本記事では、Amazon Redshift フェデレーテッドアクセス許可と AWS IAM Identity Center を使用して、複数のデータウェアハウスのきめ細かなアクセス許可をスケーラブルに管理する方法を紹介します。Enterprise Data Warehouse (EDW) でセキュリティポリシーを一度定義すれば、Sales や Marketing のコンシューマーウェアハウスに自動適用されるアーキテクチャを解説します。"
