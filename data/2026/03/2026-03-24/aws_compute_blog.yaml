    "title": "Enhancing auto scaling resilience by tracking worker utilization metrics"
    "link": "https://aws.amazon.com/blogs/compute/enhancing-auto-scaling-resilience-by-tracking-worker-utilization-metrics/"
    "published": "2026-03-24 16:17:58"
    "fetched": "2026-03-24 16:17:58"
    "summary": "A resilient auto scaling policy requires metrics that correlate with application utilization, which may not be tied to system resources. Traditionally, auto scaling policies track system resource such as CPU utilization. These metrics are easily available, but they only work when resource consumption correlates with worker capacity. Factors such as high variance in request processing time, mixed instance types, or natural changes in application behavior over time can break this assumption."
