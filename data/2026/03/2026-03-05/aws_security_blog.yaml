    title:
      2025 ISO and CSA STAR certificates are now available with one additional
      service and one new region
    link: https://aws.amazon.com/blogs/security/2025-iso-and-csa-star-certificates-are-now-available-with-one-additional-service-and-one-new-region/
    published: "2026-03-05"
    summary:
      Amazon Web Services (AWS) successfully completed the annual recertification
      audit with no findings for ISO 9001:2015, 27001:2022, 27017:2015, 27018:2019,
      27701:2019, 20000-1:2018, 22301:2019, and Cloud Security Alliance (CSA) STAR
      Cloud Controls Matrix (CCM) v4.0. The objective of the audit was to enable AWS
      to expand their ISO and CSA STAR certifications to include one new AWS […]
