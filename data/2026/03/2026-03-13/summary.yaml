"overview": |
  Amazon S3 の 20 周年を振り返る記事とともに、S3 Tables・S3 Vectors・S3 Metadata といった次世代機能への展望が語られた一日でした。生成 AI 基盤では Bedrock AgentCore Runtime が AG-UI プロトコルに対応し、MCP・A2A に続いてエージェントをユーザー向けアプリに組み込む標準化された双方向通信を実現しました。機械学習ブログでは vLLM への並列投機的デコード P-EAGLE 統合による LLM 推論高速化が解説されています。サーバーレス系では Lambda Managed Instances が Rust をサポートし、Kiro 上でサーバーレス開発を支援する SAM Kiro power も登場しました。コンピュートでは 5th Gen AMD EPYC 搭載の EC2 R8a (東京)、5GHz 動作の M8azn (オハイオ)、HPC 向け Hpc8a (東京・GovCloud) が展開されました。ほかに AWS Network Firewall の European Sovereign Cloud 提供、CloudWatch Application Signals の SLO 機能強化、AWS Security Agent の Service Quotas 対応も発表されています。
