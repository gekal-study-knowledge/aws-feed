    "title": "How Workhuman built multi-tenant self-service reporting using Amazon Quick Sight embedded dashboards"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-workhuman-built-multi-tenant-self-service-reporting-using-amazon-quick-sight-embedded-dashboards/"
    "published": "2026-03-16 14:48:16"
    "summary": "This post explores how Workhuman transformed their analytics delivery model and the key lessons learned from their implementation. We go through their architecture approach, implementation strategy, and the business outcomes they achieved—providing you with a practical blueprint for adding embedded analytics to your own software as a service (SaaS) applications."
  "833828b2518f279cbc2206ab0b3d4e30":
    "id": "833828b2518f279cbc2206ab0b3d4e30"
    "title": "Build an offline feature store using Amazon SageMaker Unified Studio and SageMaker Catalog"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-an-offline-feature-store-using-amazon-sagemaker-unified-studio-and-sagemaker-catalog/"
    "published": "2026-03-16 14:42:46"
    "summary": "This blog post provides step-by-step guidance on implementing an offline feature store using SageMaker Catalog within a SageMaker Unified Studio domain. By adopting a publish-subscribe pattern, data producers can use this solution to publish curated, versioned feature tables—while data consumers can securely discover, subscribe to, and reuse them for model development."
