"overview": |
  この日はリージョン拡張と生成AI関連の発表が中心でした。Amazon BedrockがアジアパシフィックのニュージーランドリージョンでAnthropicやAmazon Novaなどのモデルとともに利用可能になり、Bedrock AgentCore Runtimeはシェルコマンド実行APIをサポートしました。SageMaker Training Plansは既存のキャパシティコミットメントの延長に対応し、Unified Studioはデータリネージの集約ビューを追加。Amazon MSK Expressブローカーがケープタウンと台北に拡張され、Amazon Corretto 26が一般提供を開始しました。Amazon Connectは音声AIエージェントで13の新言語と新しい生成TTS音声を追加。AWS Blu InsightsはAWS Transform for mainframe refactorへと統合され、コード変換が無償化されました。セキュリティ面ではKiro IDEの任意コード実行脆弱性(CVE-2026-4295)が公表されました。
