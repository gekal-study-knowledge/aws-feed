    title:
      AWS completes the second GDV community audit with participant insurers
      in Germany
    link: https://aws.amazon.com/blogs/security/aws-completes-the-second-gdv-community-audit-with-participant-insurers-in-germany/
    published: "2026-03-17"
    fetched: "2026-03-17"
    summary:
      We’re excited to announce that Amazon Web Services (AWS) has completed
      its second GDV (German Insurance Association) community audit with 36 members
      from the Germany insurance industry participating, corresponding to over 63%
      coverage of the German market in terms of insurance premiums. Community audits
      are an efficient method to provide additional assurance to a group […]
