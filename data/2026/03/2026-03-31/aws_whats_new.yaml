  "bb6eee3e3af3298c899949e2adcf6cc6":
    "id": "bb6eee3e3af3298c899949e2adcf6cc6"
    "title": "AWS Security Agent on-demand penetration testing is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-security-agent-ondemand-penetration/"
    "published": "2026-03-31 14:00:00"
    "summary": "<p>Today,&nbsp;AWS&nbsp;announced the general availability of AWS&nbsp;Security&nbsp;Agent&nbsp;for&nbsp;on-demand penetration testing&nbsp;in&nbsp;six&nbsp;AWS Regions.&nbsp;AWS Security Agent&nbsp;delivers&nbsp;autonomous penetration testing that&nbsp;operates&nbsp;24/7 at a&nbsp;fraction of the cost&nbsp;than manual penetration&nbsp;tests. This milestone transforms penetration testing from a periodic bottleneck into an on-demand capability that scales with your development velocity&nbsp;across AWS, Azure, GCP, other&nbsp;cloud-providers, and on-premises. With&nbsp;multicloud&nbsp;support, AWS Security Agent allows you to&nbsp;consolidate&nbsp;penetration testing across your entire infrastructure.&nbsp;</p> \n<p><a href=\"https://aws.amazon.com/blogs/aws/new-aws-security-agent-secures-applications-proactively-from-design-to-deployment-preview/\">Previewed</a>&nbsp;at&nbsp;re:Invent&nbsp;2025,&nbsp;AWS Security Agent&nbsp;represents&nbsp;a new class of frontier agents&nbsp;that are&nbsp;autonomous systems that work independently to achieve goals, scale to tackle concurrent tasks, and run persistently without constant human oversight. It deploys specialized AI agents to help discover,&nbsp;validate, and report security vulnerabilities through sophisticated multi-step attack scenarios&nbsp;customized for each application.&nbsp;It&nbsp;provides detailed findings with CVSS risk scores, application-specific severity ratings,&nbsp;reproduction steps, and remediation suggestions.&nbsp;</p> \n<p>AWS Security Agent&nbsp;is now available in&nbsp;US&nbsp;East (N. Virginia), US West (Oregon), Europe (Ireland), Europe (Frankfurt), Asia Pacific (Sydney), and Asia Pacific (Tokyo) regions.&nbsp;</p> \n<p>New customers can explore&nbsp;AWS Security Agent&nbsp;with a&nbsp;2-month&nbsp;free trial. For pricing and feature details, visit the&nbsp;<a href=\"https://aws.amazon.com/security-agent/pricing/\">AWS Security Agent pricing page</a>.&nbsp;To learn more about AWS Security Agent, visit the&nbsp;<a href=\"https://aws.amazon.com/security-agent?refid=04d587d8-77d6-4750-bffa-2bc5a475e1a9\">product page</a>&nbsp;and read the&nbsp;<a href=\"https://aws.amazon.com/blogs/security/aws-security-agent-on-demand-penetration-testing-now-generally-available/\">launch announcement</a>.&nbsp;For technical details and to get started, see the&nbsp;<a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/what-is.html?refid=04d587d8-77d6-4750-bffa-2bc5a475e1a9\">AWS Security Agent documentation</a>.&nbsp;</p>"
  "649a1e1e80c0d07a6371b60c251b0560":
    "id": "649a1e1e80c0d07a6371b60c251b0560"
    "title": "AWS Private CA now publishes utilization metrics to Amazon CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-private-ca-publishes-metrics/"
    "published": "2026-03-31 13:00:00"
    "summary": "<p>AWS Private Certificate Authority (AWS Private CA) now publishes certificate authority (CA) utilization metrics to Amazon CloudWatch, providing visibility into your CA usage. AWS Private CA enforces service quota limits on the number of certificates a CA can issue and the number of CAs you can create per Region. The new metrics track the number of certificates issued by each CA and the total number of CAs in each Region, enabling you to monitor usage against these quotas and proactively manage CA lifecycle to maintain high availability.<br /> <br /> With these metrics, you can configure CloudWatch alarms to prevent quota-related service disruptions. For example, you can set alarms to trigger automation that replaces a CA approaching its certificate issuance quota and transitions certificate issuance to a new CA. This is particularly important when using AWS services that rely on AWS Private CA certificates, such as Amazon EKS, Amazon ECS Service Connect, and Amazon WorkSpaces.</p> \n<p>The utilization metrics are available in all AWS Regions where AWS Private CA is available.&nbsp;To learn more about AWS Private CA metrics, see the&nbsp;<a href=\"https://docs.aws.amazon.com/privateca/latest/userguide/PcaCloudWatch.html\">AWS Private CA User Guide</a>.&nbsp;<br /> </p>"
  "4950e6111b8d45ea830864e6a6040540":
    "id": "4950e6111b8d45ea830864e6a6040540"
    "title": "AWS Service Availability Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-service-availability/"
    "published": "2026-03-31 17:00:00"
    "summary": "<p>We’re announcing availability changes to the following AWS services and features.<br /> <br /> Services moving to Maintenance</p> \n<p>Services moving to maintenance will no longer be accessible to new customers starting April 30, 2026. Customers already using these services and features can continue to do so. AWS will continue to operate and support these services and features. We recommend that customers learn about the changes in the product pages and documentation.</p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/r53recovery/latest/dg/arc-readiness-availability-change.html\">Amazon Application Recovery Controller (ARC) - Readiness Check Feature</a></li> \n <li><a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/comprehend-availability-change.html\">Amazon Comprehend - Topic Modeling, Event Detection, and Prompt Safety Classification Features</a></li> \n <li><a href=\"https://docs.aws.amazon.com/rekognition/latest/dg/rekognition-streaming-video-analysis-availability-change.html\">Amazon Rekognition - Streaming Events and Batch Image Content Moderation Features</a></li> \n <li><a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-message-data-protection-availability-change.html\">Amazon Simple Notification Service (SNS) - Message Data Protection (MDP) Feature</a></li> \n <li><a href=\"https://docs.aws.amazon.com/apprunner/latest/dg/apprunner-availability-change.html\">AWS App Runner</a></li> \n <li><a href=\"https://docs.aws.amazon.com/audit-manager/latest/userguide/audit-manager-availability-change.html\">AWS Audit Manager</a></li> \n <li><a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake-service-availability-change.html\">AWS CloudTrail Lake</a></li> \n <li><a href=\"https://docs.aws.amazon.com/glue/latest/dg/awsglue-ray-jobs-availability-change.html\">AWS Glue - Ray Jobs Feature</a></li> \n <li><a href=\"https://docs.aws.amazon.com/iot-fleetwise/latest/developerguide/iotfleetwise-availability-change.html\">AWS IoT FleetWise</a></li> \n</ul> \n<p>Services entering Sunset</p> \n<p>The following services are entering sunset, and we are announcing the date upon which we will end operations and support of the service. Customers using these services should click on the links below to understand the sunset timeline and begin planning migration to alternatives as recommended in the updated service web pages and documentation.</p> \n<ul> \n <li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS-Custom-for-Oracle-end-of-support.html\">Amazon RDS Custom for Oracle</a></li> \n <li><a href=\"https://docs.aws.amazon.com/workmail/latest/adminguide/workmail-end-of-support.html\">Amazon WorkMail</a></li> \n <li><a href=\"https://docs.aws.amazon.com/workspaces-thin-client/latest/ug/workspacesthinclient-end-of-support.html\">Amazon WorkSpaces Thin Client</a></li> \n <li><a href=\"https://docs.aws.amazon.com/smc/latest/ag/smc-end-of-support.html\">AWS Service Management Connector</a></li> \n</ul> \n<p>Services reaching End of Support</p> \n<p>The following feature has reached end of support and is no longer available as of March 31, 2026.<br /> </p> \n<ul> \n <li>Amazon Chime SDK – Proxy Sessions</li> \n</ul> \n<p>For customers affected by these changes, we've prepared comprehensive migration guides, and our support teams are ready to assist with your transition. Visit&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/service-lifecycle.html\">AWS Product Lifecycle Page</a>&nbsp;to learn more, and subscribe to the RSS feed for future updates.&nbsp;</p>"
  "8812afdc40f200a48a7c58d3461bf2a6":
    "id": "8812afdc40f200a48a7c58d3461bf2a6"
    "title": "Amazon ECS Managed Instances now supports Amazon EC2 instance store"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ecs-mi-local-storage/"
    "published": "2026-03-31 16:30:00"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/managed-instances/\">Amazon ECS Managed Instances</a> now supports <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">Amazon EC2 instance store</a> volumes as a data volume option for container workloads. You can now leverage instance store volumes on your ECS container instances instead of provisioning an Amazon EBS data volume, reducing storage costs and accelerating I/O performance for latency-sensitive workloads.<br /> <br /> Amazon ECS Managed Instances is a fully managed compute option designed to eliminate infrastructure management overhead, dynamically scale EC2 instances to match your workload requirements, and continuously optimize task placement to reduce infrastructure costs. With today’s launch, you can enable local storage by configuring a custom ECS Managed Instances capacity provider and selecting the desired Amazon EC2 instance types that include instance store volumes. When an instance lacks instance store volumes or when local storage is disabled, Amazon ECS automatically provisions an Amazon EBS data volume.<br /> <br /> Support for instance store is available in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Amazon ECS Managed Instances is available. To learn more about local storage support, visit the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html#managed-instances-storage\">documentation</a>. To learn more about Amazon ECS Managed Instances, visit the <a href=\"https://aws.amazon.com/ecs/managed-instances/\">feature page</a>, <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ManagedInstances.html\">documentation</a>, and <a href=\"https://aws.amazon.com/blogs/aws/announcing-amazon-ecs-managed-instances-for-containerized-applications\">AWS News launch blog</a>.</p>"
  "e79d566ca233df648670c39e1c0ea263":
    "id": "e79d566ca233df648670c39e1c0ea263"
    "title": "AWS DevOps Agent is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aws-devops-agent-generally-available/"
    "published": "2026-03-31 15:11:00"
    "summary": "<p>Now generally available, AWS DevOps Agent is your always-available operations teammate that resolves and proactively prevents incidents, optimizes application reliability and performance, and handles on-demand SRE tasks across AWS, multicloud, and on-prem environments. Building on the preview launch, DevOps Agent now adds new use cases, broader integrations, enhanced intelligence, and enterprise-ready features, including the ability to investigate applications in Azure and on-prem environments, add custom agent skills to extend capabilities, and create custom charts and reports for deeper operational insights.<br /> <br /> DevOps Agent investigates incidents and identifies operational improvements as an experienced teammate would: by learning your applications and their relationships, working with your observability tools, runbooks, code repositories, and CI/CD pipelines, and correlating telemetry, code, and deployment data. It autonomously triages incidents and guides teams to rapid resolution, reducing mean time to resolution (MTTR) from hours to minutes, while analyzing patterns across historical incidents to deliver actionable recommendations that prevent future outages.<br /> <br /> For the full list of AWS Regions where AWS DevOps Agent is available, visit the <a href=\"http://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">Regions</a> list. Pricing details are available on the AWS DevOps Agent<a href=\"https://aws.amazon.com/devops-agent/pricing\"> pricing page</a>. AWS Support customers receive monthly DevOps Agent credits based on the prior month's gross AWS Support spend: 100% for Unified Operations, 75% for Enterprise Support, or 30% for Business Support+. For many customers, this significantly reduces or eliminates DevOps Agent costs. For details, visit the <a href=\"https://aws.amazon.com/premiumsupport/plans/\">support compare page</a>.<br /> <br /> If you are a preview customer, review the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/configuring-capabilities-for-aws-devops-agent-migrating-from-public-preview-to-general-availability.html\">migration documentation </a>to ensure seamless access to new AWS DevOps Agent capabilities. To learn more, read the <a href=\"https://aws.amazon.com/blogs/mt/announcing-general-availability-of-aws-devops-agent/\">launch blog</a> and see<a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/\"> getting started</a>.</p>"
  "1f3ccbee283b5f00ea59960dc110b458":
    "id": "1f3ccbee283b5f00ea59960dc110b458"
    "title": "Amazon CloudWatch Logs introduces lookup query command"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/cloudwatch-lookup-query-command/"
    "published": "2026-03-31 10:00:00"
    "summary": "<p>Amazon CloudWatch Logs Insights now supports a new lookup command that enables customers to enrich log query results with data from reference tables. Developers, DevOps engineers, and SREs working with complex distributed systems often&nbsp;encounter&nbsp;logs&nbsp;containing&nbsp;opaque identifiers such as GUIDs, IP addresses, or internal resource IDs that are difficult to interpret without&nbsp;additional&nbsp;context.</p> \n<p>With the lookup command, you can join log data against a lookup table at query time, automatically enriching your results with meaningful values. For example, you can translate a customer ID into a customer&nbsp;name or&nbsp;map an internal IP address to the team that owns it. The new command&nbsp;makes&nbsp;log analysis faster and more intuitive without requiring pre-processing pipelines.&nbsp;</p> \n<p>The lookup command is available today in all commercial AWS Regions.&nbsp;</p> \n<p>To get started, upload a CSV&nbsp;file by&nbsp;navigating to&nbsp;CloudWatch → Settings → Logs.&nbsp;&nbsp;Next,&nbsp;use the lookup command in your Logs Insights queries by specifying a log field, a lookup table name, and one or more&nbsp;columns.&nbsp; CSV data does not count toward CloudWatch Logs Insights per GB of data scanned <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">query charges</a>.&nbsp; To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CWL_QuerySyntax-Lookup.html\">CloudWatch Logs Insights documentation</a>.&nbsp;</p>"
  "840e5393ab7ffc6c759e0c4615313ab4":
    "id": "840e5393ab7ffc6c759e0c4615313ab4"
    "title": "Announcing Amazon RDS for Oracle on AWS Outposts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-rds-oracle-aws-outposts/"
    "published": "2026-03-31 08:00:00"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> is now available on AWS Outposts. <a href=\"https://aws.amazon.com/outposts/\">AWS Outposts</a> is a fully managed service that extends AWS infrastructure, AWS services, APIs, and tools to virtually any data center, co-location space, or on-premises facility for a consistent hybrid experience. As a result, customers can run applications using AWS features and services in their on-premises environment for applications that require data residency, regulatory, or other business constraints. With Amazon RDS for Oracle on AWS Outposts, customers can now use a managed Oracle database service on premises, just as they do in the cloud.<br /> <br /> Amazon RDS for Oracle on AWS Outposts offers fully managed database management experience such as automated backups, automated patching, point-in-time recovery, monitoring with Amazon CloudWatch, and data encryption at rest with AWS KMS. Amazon RDS for Oracle on AWS Outposts supports multi-AZ deployments across two different Outposts racks for high availability, providing automatic failover to ensure business continuity. For disaster recovery, customer can either restore the database instance in the parent AWS Region using a snapshot taken from the database instance running on AWS Outposts or set up a replica instance in the different Outpost rack or in the parent AWS Region.<br /> <br /> Customers can deploy Oracle Database 19c and 21c Enterprise Edition (EE) and Standard Edition 2 (SE2) using the Bring Your Own License (BYOL) model in Amazon RDS for Oracle on AWS Outposts. To get started with RDS for Oracle on Outposts, visit the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-on-outposts.html\">Amazon RDS on AWS Outposts User Guide</a>. Amazon RDS for Oracle on AWS Outposts is available in all AWS Regions where Amazon RDS on AWS Outposts is available. For pricing information, visit the <a href=\"https://aws.amazon.com/rds/outposts/pricing\">Amazon RDS on AWS Outposts pricing page</a>.</p>"
  "e0532c6b0c4a06d25cb4014aaedf67a8":
    "id": "e0532c6b0c4a06d25cb4014aaedf67a8"
    "title": "Aurora DSQL launches new connectors that simplify building .NET and Rust applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/aurora-dsql-rust-npgsql-connectors/"
    "published": "2026-03-31 17:34:00"
    "summary": "<p>Today we are announcing the release of Aurora DSQL connectors for .NET (Npgsql) and Rust (SQLx) that make it easy to build .NET and Rust applications on Aurora DSQL. The connectors streamline authentication and eliminate security risks associated with traditional user-generated passwords by automatically generating tokens for each connection, ensuring valid tokens are always used while maintaining full compatibility with existing Npgsql and SQLx features.<br /> <br /> The connectors handle IAM token generation, SSL configuration, and connection pooling, enabling customers to scale from simple scripts to production workloads without changing their authentication approach. They also provide opt-in optimistic concurrency control (OCC) retry with exponential backoff, custom IAM credential providers, and AWS profile support, making it easier to develop client retry logic and manage AWS credentials.<br /> <br /> To get started, visit the <a href=\"https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_connectors.html\">Connectors for Aurora DSQL documentation</a> page. For code examples, visit our GitHub pages for the <a href=\"https://github.com/awslabs/aurora-dsql-connectors/blob/main/dotnet/npgsql/README.md\">.NET connector</a> and <a href=\"https://github.com/awslabs/aurora-dsql-connectors/blob/main/rust/sqlx/README.md\">Rust connector</a>. Get started with Aurora DSQL for free with the <a href=\"https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank\\&amp;all-free-tier.sort-order=asc\\&amp;awsf.Free%20Tier%20Types=*all\\&amp;awsf.Free%20Tier%20Categories=categories%23databases\">AWS Free Tier</a>. To learn more about Aurora DSQL, visit the <a href=\"https://aws.amazon.com/rds/aurora/dsql/\">webpage</a>.</p>"
  "d29742db851a4ab7ac6ef40a93e6a6df":
    "id": "d29742db851a4ab7ac6ef40a93e6a6df"
    "title": "AWS Transform custom announces general availability of automated codebase analysis"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/transform-custom-new-codebase-analysis/"
    "published": "2026-03-31 08:00:00"
    "summary": "<p>AWS Transform custom announces the general availability of the comprehensive codebase analysis transformation. This up-front analysis reduces documentation maintenance burden and preserves critical institutional knowledge. This enables you to better understand the current state of your codebase before starting a modernization effort, reducing the time and guesswork involved in planning large-scale upgrades. It performs deep static analysis and generates structured documentation covering architecture, technical debt, code metrics, reference documentation, migration planning, and diagrams. Behavior analysis is available in early access.<br /> The transformation analyzes codebases in any language, including Python, Java (Maven and Gradle), Node.js, .NET, and applications exceeding one million lines of code. It produces a technical debt report that identifies outdated components and end-of-life dependencies, and recommends specific AWS-managed transformations to address them — helping you prioritize modernization efforts based on actual codebase conditions rather than manual assessment.</p> \n<p>To get started, install the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom-get-started.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transform CLI </a>and run atx custom def exec -n AWS/comprehensive-codebase-analysis -p. To run codebase analysis across multiple repositories at organizational scale, see<a href=\"https://aws.amazon.com/blogs/devops/building-a-scalable-code-modernization-solution-with-aws-transform-custom/\" rel=\"noopener noreferrer\" target=\"_blank\"> Building a scalable code modernization solution with AWS Transform custom.</a> For more information, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-aws-customs.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS-Managed Transformations</a>.<br /> AWS Transform custom is available in US East (N. Virginia) and Europe (Frankfurt ).</p>"
  "572587f5753855bba21a2afd698a7e86":
    "id": "572587f5753855bba21a2afd698a7e86"
    "title": "AWS Transform custom introduces new AWS-managed transformations to modernize code at scale"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/03/transform-custom-new-transformations/"
    "published": "2026-03-31 08:00:00"
    "summary": "<p>AWS Transform custom now offers seven new AWS-managed transformations to help you modernize code at scale. These transformations address common modernization scenarios across multiple languages and frameworks.<br /> <br /> Generally available transformations includes comprehensive codebase analysis transformation, enabling you to generate hierarchical, cross-referenced documentation covering architecture, business logic, and technical debt, with actionable insights on outdated components and maintenance concerns. The Node.js version upgrade transformation is now generally available and includes comprehensive library upgrade support, enabling you to upgrade Node.js applications from any source version to any target version with full dependency modernization.<br /> <br /> Those transformations available in early access include Java performance optimization transformation helps you analyze Java Flight Recorder (JFR) profiling data to detect CPU and memory hotspots and anti- patterns, then applies targeted code fixes to reduce resource usage and improve efficiency. The Log4j to SLF4J migration transformation allows you to remediate Log4j logging dependencies by migrating to the SLF4J logging framework. Also available in early access is the Angular to React migration transformation transforms Angular applications to React. The Angular version upgrade transformation enables you to upgrade Angular applications to the latest version. Finally, the Vue version upgrade transformation upgrades your Vue.js applications to the latest version.<br /> <br /> AWS-managed transformations are validated by AWS and can be customized to meet your organization's specific requirements. All transformations benefit from continual learning, automatically improving quality from every execution.</p> \n<p>To get started, install the<a href=\"https://docs.aws.amazon.com/transform/latest/userguide/custom-get-started.html\" rel=\"noopener noreferrer\" target=\"_blank\"> AWS Transform CLI </a>and run atx custom def list to see all available transformations. For more information, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-aws-customs.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS-Managed Transformations.</a><br /> AWS Transform custom is available in US East (N. Virginia) and Europe (Frankfurt).</p>"
"last_updated": "2026-04-01 04:55:33 JST"
