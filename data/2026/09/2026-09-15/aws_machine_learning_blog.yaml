    "published": "2026-09-15 06:22:45"
    "fetched": "2026-09-15 06:23:19"
    "summary": "Learn how Abnormal AI deployed Amazon Bedrock AgentCore Code Interpreter as an ephemeral compute scratch pad for the agents behind its real-time email threat detection at billion-message scale, plus the sandbox design decisions and practical lessons for builders deploying Code Interpreter in production."
  "12fe41ac06a2e64a132461cb61e64367":
