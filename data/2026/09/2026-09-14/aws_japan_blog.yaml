    "fetched": "2026-09-14 14:43:15"
    "summary": "Amazon S3 Object Lock がイベントホールドによる可変リテンションに対応、Amazon EMR が旧リリースからの移行中のお客様向けに無償でサポート延長、Amazon API Gateway がバックエンド統合向け mutual TLS をサポート、OpenAI GPT-6 Astra が Amazon Bedrock で GA、Amazon Quick デスクトップアプリが macOS と Windows で GA、AWS Lambda Managed Instances が Graviton5 搭載インスタンスと 90 分タイムアウトに対応、Amazon EVS が大阪を含む 4 リージョンに拡大、AWS Elemental Inference がライブ動画からコンテキストメタデータをリアルタイム生成、Amazon API Gateway が 1 MB の実行ログと配信先の設定に対応、AWS DevOps Agent が Slack との双方向通信に対応、AWS Lambda が Amazon S3 Files のダイレクトリード設定に対応等"
