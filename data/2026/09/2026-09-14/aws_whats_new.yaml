    "title": "AWS End User Messaging now supports Dynamic Flows in WhatsApp"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-end-user-messaging-whatsapp-dynamic-flows"
    "published": "2026-09-14 16:00:00"
    "fetched": "2026-09-15 09:12:53"
    "summary": "<p>AWS End User Messaging now supports dynamic WhatsApp flows so you can turn WhatsApp conversations into rich, interactive experiences that end-users complete directly in WhatsApp.<br /> <br /> Instead of pushing end-users to a website or a separate form to complete an interactive experience, you can instead guide them through an appointment booking, lead generation, sign-up, survey or a transaction directly in the chat. Customers can start building a flow using one of Meta's stater templates with familiar building blocks like text inputs, date pickers, drop downs, and buttons, or customize the flow from scratch. With dynamic flows, each screen can call your own HTTPS endpoint in real time, so you can show live availability, and personalize each step in the flow for your end-users.<br /> <br /> You build and manage flows entirely in AWS End User Messaging Social, through the console or APIs. Define a flow with a JSON schema, then deliver it with a message template to reach customers where they are.<br /> <br /> WhatsApp flows are available in all regions where End User Messaging Social is available. To get started, see the <a href=\"https://docs.aws.amazon.com/social-messaging/latest/userguide/what-is-service.html\">User Guide.</a></p>"
  "de61865490c878300bac0f05c36da3a6":
    "id": "de61865490c878300bac0f05c36da3a6"
    "title": "AWS End User Messaging strengthens SMS deliverability with automatic failover"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-end-user-messaging-improves-deliverability"
    "published": "2026-09-14 16:00:00"
    "fetched": "2026-09-15 09:12:53"
    "summary": "<p>AWS End User Messaging is advancing its deliverability capabilities in phone pools. Now, customers sending through phone pools automatically benefit from automatic failover to the next best performing number in the pool when SMS delivery is impacted from downstream disruptions.<br /> <br /> SMS deliverability can be affected by drops or delays when trying to reach the end recipient while it's being routed from AWS to messaging providers and eventually mobile carriers. These disruptions can hit the most important parts of your messaging program, including delivery notifications, one-time passcodes, reminders, and other time-sensitive messages. AWS End User Messaging watches for delivery delays, message failures, or drops in conversion and reroutes traffic to a more optimized delivery path.<br /> <br /> Customers do not need to take any action to receive this benefit for phone pools. If you are not sending through phone pools today, you can create one by following these <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/phone-pool-create.html\">instructions</a>. This capability is available in all AWS Regions where AWS End User Messaging is available.<br /> <br /> To learn more, see the AWS End User Messaging SMS <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/what-is-sms-mms.html\">User Guide</a>.</p>"
  "d15cb0027ee0cc355aef85154ce073c8":
    "id": "d15cb0027ee0cc355aef85154ce073c8"
    "title": "AWS Glue zero-ETL adds target table property ownership and conflict detection"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/glue-zero-etl-ownership-conflicts/"
    "published": "2026-09-14 17:00:00"
    "fetched": "2026-09-15 14:44:38"
    "summary": "<p>AWS Glue zero-ETL integrations now detect table property conflicts and track integration ownership. When you configure a source table and target catalog, Glue associates the resulting table properties with the owning integration, so two integrations can no longer be pointed at the same target table without your knowledge. This works across Amazon S3 Tables and SageMaker Lakehouse catalogs.</p> \n<p>Data teams running multiple zero-ETL integrations gain predictable control over where each source table lands. If you attempt to create or modify an integration whose table properties are owned by another integration, Glue identifies the owning integration and guides you to choose a different target or update the existing one, so your pipelines stay isolated and your data lands exactly where you intend.</p> \n<p>This feature is available in all AWS Commercial and AWS GovCloud (US) Regions where AWS Glue zero-ETL integrations are supported.</p> \n<p>To learn more, refer to the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/zero-etl-target.html\">AWS Glue Developer Guide</a> and get started in the <a href=\"https://console.aws.amazon.com/glue/\">AWS Glue console</a>.</p>"
"last_updated": "2026-09-15 14:44:38 JST"
