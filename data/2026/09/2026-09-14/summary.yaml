"overview": |
  この日は AWS ジャパンブログが主で、週刊まとめ 2 本に加えて自動推論とセキュリティ AI の解説記事が目を引きました。「はじめての自動推論」は、Amazon Science の研究領域に加わった自動推論を予備知識なしで解説する記事で、簡単な C / Python のコード例を使い、網羅的テストでは 1,300 年以上かかる検証を自動推論がミリ秒で示せる理由、それでもテストが今後も必要な理由、停止性問題ゆえに「Don't know」という答えが避けられない事情、論理・定理証明・形式手法といった関連用語の違いを整理しています。「セキュリティにおける AI の現在地」では、脆弱性を発見できるかだけでなく安全なコードを誤検出しないかが信頼の鍵になるとして、実際の脆弱性と誤検出を見分ける能力を測る初のベンチマーク Deception Benchmark を紹介し、16 のプログラミング言語・70 を超える CWE カテゴリの 14,822 サンプルで 12 モデルを FPR (偽陽性率) と FNR (偽陰性率) の両面から評価しています。第 1 回 AWS ライフサイエンス・シンポジウム欧州の開催報告も出ています。週刊 AWS (2026/9/7 週) では、S3 Object Lock のイベントホールドによる可変リテンション対応、EMR の旧リリース移行者向け無償サポート延長、API Gateway のバックエンド統合向け mTLS 対応、OpenAI GPT-6 Astra の Amazon Bedrock 一般提供、Amazon Quick デスクトップアプリの提供開始など、前週のサービス更新がまとめて振り返られました。週刊生成AI with AWS (2026/9/7 週) では、Umios (旧マルハニチロ) が時系列基盤モデル Chronos-2 で販売計画 AI を構築した事例や、産業特化型 AI 基盤 CODAS の取り組みを含む 14 件のブログ記事が紹介されています。サービス更新では、AWS End User Messaging が WhatsApp の Dynamic Flows に対応し、WhatsApp 内で完結するリッチなインタラクティブ体験を作れるようになったほか、フォンプール経由の SMS 送信で次善のパフォーマンスの番号へ自動フェイルオーバーする形で到達率を強化しました。AWS Glue の zero-ETL 連携は、ターゲットテーブルのプロパティの所有権追跡と競合検出に対応しています。
