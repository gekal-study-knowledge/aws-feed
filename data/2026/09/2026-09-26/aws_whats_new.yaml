  "1376d6b01549f37021666365f4976296":
    "id": "1376d6b01549f37021666365f4976296"
    "title": "AWS DataSync launches a monitoring dashboard for tracking task executions across your account"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/datasync-monitoring-dashboard"
    "published": "2026-09-26 00:24:00"
    "fetched": "2026-09-26 04:09:49"
    "summary": "<p>AWS DataSync now provides a monitoring dashboard in the DataSync console that gives you visibility into your data transfers across your account. For each task execution, you can see its status, data and file transfer rates, duration, and the total data and files transferred.&nbsp;You can filter executions by status, task, task mode, execution ID, or start time to focus on a specific set of runs. The dashboard summarizes the filtered results, including the number of successful and failed executions, and the cumulative data and files transferred, grouped by task. To troubleshoot issues, you can select a failed execution to view its errors. The dashboard also displays counts of your configured tasks, locations, and agents, along with real-time total transfer rates.</p>\n<p>Previously, monitoring multiple transfers required reviewing each execution individually or building custom Amazon CloudWatch dashboards. Now you can monitor the health, performance, and progress of concurrent transfers from a single view. This is useful for large migrations and recurring transfers that run many tasks at once.</p>\n<p>The AWS DataSync dashboard is available at no additional cost in all commercial AWS Regions and the AWS GovCloud (US) Regions where AWS DataSync is available. To view your dashboard, go to the <a href=\"https://www.google.com/url?sa=t&amp;source=web&amp;rct=j&amp;opi=89978449&amp;url=CAESVwHrOzAV20j8Wk9vTsmbIbYkRAmlzPqFHALrq6V60lbYjxzHw5x2zbIj319NQT3Omkeu_ddZIwedAWPfNk9FCqq2KWuwOIO-dn4eS5n6lZZW4uQyV6vV9w&amp;ved=2ahUKEwjR4Z__g4qXAxV7FDQIHVs0I7EQFnoECB4QAQ&amp;uoh=2&amp;usg=AOvVaw3L5ZM1L-1k3SwMWi6qm9p5\">AWS DataSync console</a>. To learn more about DataSync, visit the <a href=\"https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html\">AWS DataSync User Guide</a>.</p>"
  "78d2736e3bbd158392eec8d3d833d3f9":
    "id": "78d2736e3bbd158392eec8d3d833d3f9"
    "title": "Amazon Transcribe adds customer-managed KMS keys for custom resources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-transcribe/"
    "published": "2026-09-26 04:19:00"
    "fetched": "2026-09-26 08:02:33"
    "summary": "<p>Amazon Transcribe now lets you encrypt your custom vocabularies, custom vocabulary filters, and custom language models at rest with a customer-managed AWS KMS key that you own and control.</p>\n<p>Previously, these custom resources were always encrypted with an AWS owned key. Now you can supply your own symmetric AWS KMS key when you create or update these resources, so the artifacts Transcribe stores on your behalf are encrypted under a key in your account. If you do not provide a key, your resources continue to be encrypted with an AWS owned key—no action is required unless you opt in.</p>\n<p>With a customer-managed key, you control key permissions and decide exactly which principals and services can encrypt and decrypt your custom resources. Every use of your key is logged in AWS CloudTrail, giving you a full audit trail for compliance and monitoring. You can also disable the key or transition resources to a different key to revoke access on your own schedule.</p>\n<p>This feature is available in all AWS Regions where Amazon Transcribe is offered. To learn more, see <a href=\"https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html\">Amazon Transcribe Developer Guide</a>.</p>"
  "bf10f95ddf48f3753dbd6c0545dd5e76":
    "id": "bf10f95ddf48f3753dbd6c0545dd5e76"
    "title": "AWS IAM outbound identity federation now supports interface VPC endpoints for OIDC discovery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-sts-vpc-oidc/"
    "published": "2026-09-26 02:54:00"
    "fetched": "2026-09-26 08:02:33"
    "summary": "<p><a href=\"https://aws.amazon.com/identity/federation/outbound-federation/\">AWS Identity and Access Management (IAM) outbound identity federation</a> now supports Amazon Virtual Private Cloud (VPC) endpoints for the OpenID Connect (OIDC) discovery APIs. You can now access the OIDC discovery metadata and JSON Web Key Set (JWKS) verification key endpoints from within your VPC using <a href=\"https://aws.amazon.com/privatelink/\">AWS PrivateLink</a>, without requiring traffic to traverse the public internet.</p>\n<p>IAM outbound identity federation eliminates the need to use long-lived credentials when your AWS workloads access external services. Instead, your workloads request short-lived JSON Web Tokens (JWTs) from AWS Security Token Service (AWS STS). External services verify these tokens using public verification keys and metadata available at OIDC discovery endpoints. Previously, the OIDC discovery endpoints were only reachable over the public internet, so a verifying workload running in a VPC without internet access could not retrieve them. With this launch, you can create an interface VPC endpoint to reach these endpoints privately, keeping the verification key retrieval traffic within the AWS network. This capability helps you meet network security requirements for workloads that operate in VPCs with restricted internet access, while still enabling external services to verify JWTs.</p>\n<p>This feature is available in all commercial AWS Regions, the AWS GovCloud (US) Regions, and China Regions. There is no additional charge for this feature beyond standard <a href=\"https://aws.amazon.com/privatelink/pricing/\">AWS PrivateLink pricing</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_sts_oidc_vpc_endpoint_create.html\">IAM User Guide</a>.</p>"
  "455571960d5f0959b5d8cc7cc28df177":
    "id": "455571960d5f0959b5d8cc7cc28df177"
    "title": "Amazon EC2 M8i and M8i-flex instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ec2-m8i-m8i-flex-thf/"
    "published": "2026-09-26 03:40:00"
    "fetched": "2026-09-26 12:17:41"
    "summary": "<p>Starting today, Amazon EC2 M8i and M8i-flex instances are now available in the AWS European Sovereign Cloud (Germany) region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The M8i and M8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% better performance than M7i and M7i-flex instances, with even higher gains for specific workloads. The M8i and M8i-flex instances are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to M7i and M7i-flex instances.\n <br />\n <br />\n M8i-flex are the easiest way to get price performance benefits for a majority of general-purpose workloads like web and application servers, microservices, small and medium data stores, virtual desktops, and enterprise applications. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.\n <br />\n <br />\n M8i instances are a great choice for all general purpose workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. The SAP-certified M8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.\n <br />\n <br />\n To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\"><u>AWS Management Console</u></a>. For more information about the new instances, visit the<a href=\"https://aws.amazon.com/ec2/instance-types/m8i/\" target=\"_blank\"><u> M8i and M8i-flex instance page</u></a> or visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/\" target=\"_blank\"><u>blog</u></a>.</p>"
  "fdd43d9f59f4490202ead9b9bfd6e64b":
    "id": "fdd43d9f59f4490202ead9b9bfd6e64b"
    "title": "Amazon EC2 R8i and R8i-flex instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-r8i-r8i-flex-thf/"
    "published": "2026-09-26 03:37:00"
    "fetched": "2026-09-26 12:17:41"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R8i and R8i-flex instances are available in the AWS European Sovereign Cloud (Germany) region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. The R8i and R8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver 20% higher performance than R7i instances, with even higher gains for specific workloads. They are up to 30% faster for PostgreSQL databases, up to 60% faster for NGINX web applications, and up to 40% faster for AI deep learning recommendation models compared to R7i.</p>\n<p>R8i-flex, our first memory-optimized Flex instances, are the easiest way to get price performance benefits for a majority of memory-intensive workloads. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.</p>\n<p>R8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. R8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications. <a href=\"https://docs.aws.amazon.com/sap/latest/general/sap-hana-aws-ec2.html\" target=\"_blank\"><u>R8i instances are SAP-certified </u></a>and deliver 142,100 aSAPS, the highest among all comparable machines in on-premises and cloud environments, delivering exceptional performance for mission-critical SAP workloads.</p>\n<p>To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\"><u>AWS Management Console</u></a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/r8i\" target=\"_blank\"><u>R8i and R8i-flex </u></a>instances visit the AWS News <a href=\"https://aws.amazon.com/blogs/aws/best-performance-and-fastest-memory-with-the-new-amazon-ec2-r8i-and-r8i-flex-instances/\" target=\"_blank\"><u>blog</u></a>.</p>"
  "3ae6020719dc2deda2e6da79ba40759a":
    "id": "3ae6020719dc2deda2e6da79ba40759a"
    "title": "Amazon EC2 C8i and C8i-flex instances are now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/c8i-c8i-flex-thf-september-2026/"
    "published": "2026-09-26 03:09:00"
    "fetched": "2026-09-26 12:17:41"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8i and C8i-flex instances are available in the AWS European Sovereign Cloud (Germany) region. These instances are powered by custom Intel Xeon 6 processors, available only on AWS, delivering the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. These C8i and C8i-flex instances offer up to 15% better price-performance, and 2.5x more memory bandwidth compared to previous generation Intel-based instances. They deliver up to 20% higher performance than C7i and C7i-flex instances, with even higher gains for specific workloads. The C8i and C8i-flex are up to 60% faster for NGINX web applications, up to 40% faster for AI deep learning recommendation models, and 35% faster for Memcached stores compared to C7i and C7i-flex.\n <br />\n <br />\n C8i-flex are the easiest way to get price performance benefits for a majority of compute intensive workloads like web and application servers, databases, caches, Apache Kafka, Elasticsearch, and enterprise applications. They offer the most common sizes, from large to 16xlarge, and are a great first choice for applications that don't fully utilize all compute resources.\n <br />\n <br />\n C8i instances are a great choice for all memory-intensive workloads, especially for workloads that need the largest instance sizes or continuous high CPU usage. C8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge size for the largest applications.\n <br />\n <br />\n To get started, sign in to the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\"><u>AWS Management Console</u></a>. Customers can purchase these instances via Savings Plans, On-Demand instances, and Spot instances. For more information about the new <a href=\"https://aws.amazon.com/ec2/instance-types/c8i/\" target=\"_blank\"><u>C8i and C8i-flex</u></a> instances visit the <a href=\"https://aws.amazon.com/blogs/aws/introducing-new-compute-optimized-amazon-ec2-c8i-and-c8i-flex-instances/\" target=\"_blank\"><u>AWS News blog</u></a>.</p>"
