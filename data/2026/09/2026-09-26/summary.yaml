"overview": |
  この日は 12 件で、大規模な強化学習の実行基盤と、生成 AI の本番運用にまつわる解説が中心でした。機械学習ブログでは、Mixture-of-Experts (MoE) の強化学習を Amazon EKS 上でスケールさせる構成が公開されました。Amazon EKS と Elastic Fabric Adapter (EFA)、Amazon S3 を組み合わせたアーキテクチャにより、大規模な RLHF や GRPO のトレーニングにおいて強化学習のロールアウト全体のスループットを 40% 向上させています。あわせて、オープンソースの強化学習フレームワーク SkyRL を Amazon SageMaker HyperPod 上で動かし、Qwen3-VL-8B のビジョン言語モデルを GRPO でポストトレーニングする手順が紹介されました。コンテナイメージの構築、SageMaker Studio からの Ray クラスターの起動、ジョブの投入と監視、学習済み LoRA アダプターの推論用ホスティングまでを扱っています。品質管理では、NarrateAI が Amazon Bedrock 上で構築した本番向けの LLM 品質保証の仕組みが解説されました。適応的なパイプラインのオーケストレーション、クロスアカウントでのマルチモデルフェイルオーバー、リアルタイムのストリーミング評価、複合的な評価、データ正確性の検証という 5 つの手法により、応答をリアルタイムにストリーミングしながら数値の正確性で約 99% に到達しています。音声では、公開されている Qwen3-TTS-12Hz-1.7B-Base を Amazon SageMaker JumpStart からフルマネージドのリアルタイムエンドポイントにデプロイし、短い参照音声から声を複製する方法が紹介されました。言語をまたいでもクローン元の話者の特徴が保たれます。トレーニングの配置では、Amazon SageMaker HyperPod と Cloud Native Qumulo を組み合わせ、学習用のコンピュートをあるリージョンに置きながらデータセットを別のリージョンに置く構成が検証されました。リージョンをまたいだ学習でも、NeuralCache のウォームアップを短時間挟めば同一リージョン構成と同等のスループットが出たと報告されています。事例では、Datacor がガスと溶接の販売業者向けに、Amazon Quick Sight のダッシュボードと自然言語クエリを自社の TrackAbout プラットフォームに組み込み、クラウドをまたぐ自動データパイプラインとマルチテナントの行レベルセキュリティを備えたセルフサービスのレンタル分析を実現した取り組みが紹介されました。サービス更新では、AWS DataSync のコンソールに監視ダッシュボードが追加され、アカウント全体のデータ転送を俯瞰できるようになりました。タスク実行ごとにステータス、データとファイルの転送レート、所要時間、転送量を確認でき、ステータス・タスク・タスクモード・実行 ID・開始時刻で絞り込み、失敗した実行を選んでエラーを確認できます。Amazon Transcribe は、カスタム語彙・カスタム語彙フィルター・カスタム言語モデルを、自分で管理する AWS KMS キーで保存時に暗号化できるようになりました (これまでは常に AWS 所有のキーでの暗号化。キーを指定しなければ従来どおりで対応は不要)。キーの権限を自分で制御でき、使用はすべて AWS CloudTrail に記録されます。また、AWS IAM のアウトバウンド ID フェデレーションが OIDC ディスカバリー API のインターフェイス VPC エンドポイントに対応し、OIDC のディスカバリーメタデータと JWKS の検証キーのエンドポイントに、AWS PrivateLink 経由で VPC 内からアクセスできるようになりました。これまでこれらのエンドポイントはパブリックインターネット経由でしか到達できませんでした。コンピュートでは、Amazon EC2 の M8i / M8i-flex、R8i / R8i-flex、C8i / C8i-flex の各インスタンスが AWS European Sovereign Cloud (ドイツ) リージョンでも利用できるようになりました。いずれも AWS だけで使えるカスタムの Intel Xeon 6 プロセッサを搭載し、同等のクラウド向け Intel プロセッサの中で最高の性能と最速のメモリ帯域を備えます。前世代の Intel ベースのインスタンスと比べて価格性能が最大 15% 向上し、メモリ帯域は 2.5 倍です。汎用の M8i / M8i-flex は M7i / M7i-flex 比で最大 20% 高性能で、PostgreSQL で最大 30%、NGINX の Web アプリケーションで最大 60%、AI のディープラーニング推薦モデルで最大 40% 高速です。メモリ最適化の R8i / R8i-flex も R7i 比で 20% 高性能で、同様に PostgreSQL 最大 30%、NGINX 最大 60%、推薦モデル最大 40% の改善が示されています (R8i-flex は初のメモリ最適化 Flex インスタンスです)。コンピュート最適化の C8i / C8i-flex は C7i / C7i-flex 比で最大 20% 高性能で、NGINX で最大 60%、推薦モデルで最大 40%、Memcached で 35% 高速です。
