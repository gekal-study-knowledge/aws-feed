    "title": "Scaling MoE reinforcement learning on Amazon EKS with EFA and DeepEP with 40% more throughput"
    "link": "https://aws.amazon.com/blogs/machine-learning/scaling-moe-reinforcement-learning-on-amazon-eks-with-efa-and-deepep-with-40-more-throughput/"
    "published": "2026-09-26 01:29:50"
    "fetched": "2026-09-26 04:09:51"
    "summary": "Learn how to scale Mixture-of-Experts (MoE) reinforcement learning on Amazon EKS using Elastic Fabric Adapter (EFA) and DeepEP. This post presents an architecture that combines Amazon EKS, EFA, and Amazon S3 and increased aggregate reinforcement learning rollout throughput by 40% for large-scale RLHF and GRPO training."
  "ddb179fbc6f53530757f6727b5973fcf":
    "id": "ddb179fbc6f53530757f6727b5973fcf"
    "title": "Accelerate multimodal RL training with SkyRL on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/accelerate-multimodal-rl-training-with-skyrl-on-amazon-sagemaker-hyperpod/"
    "published": "2026-09-26 01:18:07"
    "fetched": "2026-09-26 04:09:51"
    "summary": "Learn how to run SkyRL, an open-source reinforcement learning framework, on Amazon SageMaker HyperPod to post-train a Qwen3-VL-8B vision-language model with GRPO. This walkthrough covers building the container image, launching a Ray cluster from SageMaker Studio, submitting and monitoring the job, and hosting the trained LoRA adapter for inference."
  "20aacf920ccaaf6375375a789e64e939":
    "id": "20aacf920ccaaf6375375a789e64e939"
    "title": "NarrateAI: production-ready LLM quality assurance on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/narrateai-production-ready-llm-quality-assurance-on-amazon-bedrock/"
    "published": "2026-09-26 01:15:22"
    "fetched": "2026-09-26 04:09:51"
    "summary": "NarrateAI delivers production-ready LLM quality assurance on Amazon Bedrock. This post details five techniques—adaptive pipeline orchestration, cross-account multi-model failover, real-time streaming evaluation, composite evaluation, and data accuracy verification—that reach about 99% numerical accuracy while streaming responses in real time."
  "767c5d3898ecea4348c90c499c82152e":
    "id": "767c5d3898ecea4348c90c499c82152e"
    "title": "Deploying real-time personalized speech with Qwen3-TTS on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/deploying-real-time-personalized-speech-with-qwen3-tts-on-amazon-sagemaker-ai/"
    "published": "2026-09-26 01:09:46"
    "fetched": "2026-09-26 04:09:51"
    "summary": "Deploy the publicly available Qwen3-TTS-12Hz-1.7B-Base text-to-speech model from Amazon SageMaker JumpStart to a fully managed, real-time endpoint, and clone a voice from a short reference clip. Cross-lingual cloning preserves the speaker's identity across languages."
  "7cc181ffd1635a536640f08a6c655e51":
    "id": "7cc181ffd1635a536640f08a6c655e51"
    "title": "How Datacor built self-service rental analytics with Amazon Quick Sight"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-datacor-built-self-service-rental-analytics-with-amazon-quick-sight/"
    "published": "2026-09-26 00:54:42"
    "fetched": "2026-09-26 04:09:51"
    "summary": "Learn how Datacor built a self-service rental analytics experience for gas and welding distributors by embedding Amazon Quick Sight dashboards and natural language querying into its TrackAbout platform, powered by an automated cross-cloud data pipeline and multi-tenant row-level security."
  "581b2357d555006f43dd0f062f92fc99":
    "id": "581b2357d555006f43dd0f062f92fc99"
    "title": "Multi-Region training with Amazon SageMaker HyperPod and Qumulo"
    "link": "https://aws.amazon.com/blogs/machine-learning/multi-region-training-with-amazon-sagemaker-hyperpod-and-qumulo/"
    "published": "2026-09-26 00:49:44"
    "fetched": "2026-09-26 04:09:51"
    "summary": "Amazon SageMaker HyperPod and Cloud Native Qumulo let you place training compute in one AWS Region while keeping your dataset in another. This post shares the architecture and validation results from a cross-Region training run, where a remote cluster matched a co-located cluster's throughput after a brief NeuralCache warmup."
