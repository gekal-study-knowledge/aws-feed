    "title": "From code to diagrams: Agentic architecture documentation with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-code-to-diagrams-agentic-architecture-documentation-with-amazon-bedrock-agentcore/"
    "published": "2026-09-03 03:18:47"
    "fetched": "2026-09-03 03:24:49"
    "summary": "Learn how a global interdealer broker built an automated architecture documentation pipeline on Amazon Bedrock AgentCore that analyzes .NET code bases, generates architecture diagrams, and maintains searchable documentation through Amazon Bedrock Knowledge Bases and AWS CodePipeline."
  "b96c954c816698be38e630cad6a6ea34":
    "id": "b96c954c816698be38e630cad6a6ea34"
    "title": "Trinity: Agentic AI-powered transition planning for students with disabilities"
    "link": "https://aws.amazon.com/blogs/machine-learning/trinity-agentic-ai-powered-transition-planning-for-students-with-disabilities/"
    "published": "2026-09-03 03:14:17"
    "fetched": "2026-09-03 03:24:49"
    "summary": "Learn how University Startups and its AWS partner g/d/n/a scaled Trinity, a conversational AI solution for students with disabilities, into a serverless multi-agent architecture on Amazon Bedrock that produces IDEA-aligned transition plans for school districts across the US."
  "c9e9e8e5fa0addb0f41d3af03c2a317b":
    "id": "c9e9e8e5fa0addb0f41d3af03c2a317b"
    "title": "Accessing OpenAI models on Amazon Bedrock from Australia with global cross-Region inference"
    "link": "https://aws.amazon.com/blogs/machine-learning/accessing-openai-gpt-5-6-models-on-amazon-bedrock-from-australia-with-global-cross-region-inference/"
    "published": "2026-09-03 06:22:05"
    "fetched": "2026-09-03 06:32:43"
    "summary": "Australian teams can now access OpenAI GPT-5.6 Sol, Terra, and Luna models on Amazon Bedrock with global cross-Region inference from the Asia Pacific (Sydney) and Asia Pacific (Melbourne) Regions. This post shows how to invoke the models, use prompt caching, set up Codex with OpenID Connect authentication, and monitor usage with Amazon CloudWatch."
