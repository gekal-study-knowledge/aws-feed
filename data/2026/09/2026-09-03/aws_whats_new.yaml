"entries":
  "aabb6dae59e0bac5108f234b52de1fe7":
    "id": "aabb6dae59e0bac5108f234b52de1fe7"
    "title": "Amazon Quick adds new tool settings and Model Context Protocol (MCP) sync support for connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-quick-adds-tool-settings-mcp-sync/"
    "published": "2026-09-03 01:54:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>Amazon Quick connectors let users leverage tools and services such as Outlook, Slack, Salesforce, Jira, and homegrown MCP servers directly into their workflows across chat, agents, apps, flows, and deep research. Today, Amazon Quick introduces new tool settings and MCP sync support that give admins and connector owners more control over how connectors are deployed and kept up to date.</p> \n<p>Connector owners and admins can now selectively enable or disable individual tools within a connector to ensure only approved tools are available to end users. Additionally, new tool permission settings let connector owners decide which tools require consent before proceeding or give end users the flexibility to decide for themselves. Lastly, MCP sync keeps connectors current as external MCP servers add new tools, update descriptions, and evolve their capabilities, ensuring users always have the latest information to get their work done.</p> \n<p>These features are available in all AWS Regions where Amazon Quick is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/quicksight/latest/user/welcome.html\" target=\"_blank\">Amazon Quick User Guide</a>.</p>"
  "18d82380f5c17ceee4e43cd7ecf698a7":
    "id": "18d82380f5c17ceee4e43cd7ecf698a7"
    "title": "Amazon Connect Customer announces general availability of agentic CX designer"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/agentic-cx-designer/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>Amazon Connect Customer announces the general availability of agentic CX designer, a no-code canvas for designing and deploying AI-powered self-service experiences. You can now build and launch voice and digital experiences that bring agentic and deterministic AI together to transform how you serve customers with the control and reliability enterprises demand. Your business teams users can go from designing conversations and integrating with the systems that run your business, to testing, to launching production-ready experiences in weeks, not months.</p> \n<p>Agentic CX designer gives you the clarity of a flowchart with the power of a large language model. On a visual canvas you define the logic, guardrails, and integrations, and the model handles the natural conversation. For outcomes that have to be exact, such as eligibility, approvals, routing, or compliance, you define the workflow and the conversation follows it. You build, test, and deploy in the same place, so the team that designs an experience can validate it and put it into production without writing code or handing the work to engineering.</p>"
  "1d1ff02668b148c53f6e9ab7718726db":
    "id": "1d1ff02668b148c53f6e9ab7718726db"
    "title": "AWS Config now supports 60 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-config-new-resource-types/"
    "published": "2026-09-03 00:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>AWS Config now supports 60 additional AWS resource types across key services including Amazon Bedrock,&nbsp; Amazon EC2, Amazon SageMaker, and AWS Organizations. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p> \n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p> \n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where the resources are available:</p> \n<p><br /> Resource Types:</p> \n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"1045\"> \n <tbody>\n  <tr>\n   <td height=\"21\" width=\"355\">AWS::AppSync::ChannelNamespace</td> \n   <td width=\"345\">AWS::EC2::RouteServer</td> \n   <td width=\"345\">AWS::Organizations::Policy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::AppSync::SourceApiAssociation</td> \n   <td>AWS::EC2::RouteServerEndpoint</td> \n   <td>AWS::Organizations::ResourcePolicy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::EnforcedGuardrailConfiguration</td> \n   <td>AWS::EC2::RouteServerPeer</td> \n   <td>AWS::QuickSight::RefreshSchedule</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::Flow</td> \n   <td>AWS::EKS::PodIdentityAssociation</td> \n   <td>AWS::RDS::DBProxy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::FlowVersion</td> \n   <td>AWS::ElasticLoadBalancingV2::ListenerRule</td> \n   <td>AWS::S3Vectors::Index</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::PromptVersion</td> \n   <td>AWS::GameLiftStreams::Application</td> \n   <td>AWS::SageMaker::Action</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::OAuth2CredentialProvider</td> \n   <td>AWS::GameLiftStreams::StreamGroup</td> \n   <td>AWS::SageMaker::Algorithm</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::PaymentManager</td> \n   <td>AWS::IdentityStore::Group</td> \n   <td>AWS::SageMaker::App</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::Policy</td> \n   <td>AWS::IoT::TopicRuleDestination</td> \n   <td>AWS::SageMaker::Context</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::PolicyEngine</td> \n   <td>AWS::Lightsail::Container</td> \n   <td>AWS::SageMaker::Hub</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::TokenVault</td> \n   <td>AWS::Lightsail::Database</td> \n   <td>AWS::SageMaker::MlflowApp</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Chime::AppInstance</td> \n   <td>AWS::Lightsail::Distribution</td> \n   <td>AWS::SageMaker::ModelCard</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CloudTrail::ResourcePolicy</td> \n   <td>AWS::Lightsail::Domain</td> \n   <td>AWS::SageMaker::ModelPackage</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CodePipeline::Webhook</td> \n   <td>AWS::Lightsail::Instance</td> \n   <td>AWS::SES::MailManagerArchive</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Config::OrganizationConformancePack</td> \n   <td>AWS::Lightsail::LoadBalancer</td> \n   <td>AWS::Transfer::WebApp</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::AgentStatus</td> \n   <td>AWS::Logs::ResourcePolicy</td> \n   <td>AWS::WorkSpacesWeb::TrustStore</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::EvaluationForm</td> \n   <td>AWS::MediaConnect::Bridge</td> \n   <td>AWS::WorkSpacesWeb::UserAccessLoggingSettings</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::View</td> \n   <td>AWS::NetworkManager::CoreNetwork</td> \n   <td>AWS::XRay::Group</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::ViewVersion</td> \n   <td>AWS::Organizations::Account</td> \n   <td>AWS::XRay::ResourcePolicy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EC2::NetworkPerformanceMetricSubscription</td> \n   <td>AWS::Organizations::Organization</td> \n   <td>AWS::XRay::SamplingRule</td> \n  </tr>\n </tbody>\n</table>"
  "10678a8a99aa9f176c8dc840ff8626b7":
    "id": "10678a8a99aa9f176c8dc840ff8626b7"
    "title": "Web Search on Amazon Bedrock is now available in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-web-aws-govcloud/"
    "published": "2026-09-03 02:52:00"
    "fetched": "2026-09-03 06:32:41"
    "summary": "<p>The Web Search built-in server-side tool on Amazon Bedrock is now available in AWS GovCloud (US-West), helping bring grounded web results to compliance-sensitive government and public-sector workloads. Web Search helps supported OpenAI GPT models ground responses with information from the web. Responses include citations to the sources the model used so users can trace each claim back to its web origin. This can be especially valuable whenever an answer depends on information that changes over time or is more recent than a model's training data, such as current events, recent releases or live pricing. Because the tool runs inside Amazon Bedrock, you don't host a search index, manage crawlers, or write the tool-call loop yourself.</p> \n<p>Web Search is designed to support the governance and data-handling standards AWS GovCloud (US) customers require. By default, it keeps your request data within the AWS boundary, serving results from a web index and cache maintained by Amazon. As an AWS-native capability governed by AWS Identity and Access Management (IAM), administrators can allow or deny it at the account or organization level and restrict it by Region, giving teams centralized control while keeping request data within the AWS boundary by default. To get started, add a tool of type web_search to the tools array in your OpenAI Responses API request using your existing OpenAI client library with an Amazon Bedrock API key. The model uses the tool only when it determines a request needs current information. At launch, Web Search in AWS GovCloud (US-West) supports GPT-5.4 , GPT-5.6 Terra and Luna models.</p> \n<p>Web Search is available in AWS GovCloud (US-West), in addition to US East (N. Virginia), US East (Ohio), and US West (Oregon). To get started, see the Web Search <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-web-search-on-amazon-bedrock-for-foundation-model-grounding/\">technical blog</a>. For implementation guidance, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/web-search.html\">Web Search documentation</a>. For pricing, see the Amazon Bedrock <a href=\"https://aws.amazon.com/bedrock/pricing/\">pricing page</a>.</p>"
  "a009ad7e07db41d52b92ff176eb7ca74":
    "id": "a009ad7e07db41d52b92ff176eb7ca74"
    "title": "Amazon Connect Customer expands automated performance evaluations to Malay"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-customer-automated-evaluations-malay/"
    "published": "2026-09-03 02:00:00"
    "fetched": "2026-09-03 06:32:41"
    "summary": "<p>Amazon Connect Customer now automates evaluations of human and AI agents in Malay using generative AI. Managers define custom evaluation criteria in natural language and receive AI-generated evaluations with justifications in their preferred language. Performance evaluations also supports cross-language evaluation and can complete assessments in English, even when the conversation is in Malay. This enables multilingual contact centers to use a standardized evaluation framework across languages.</p> \n<p>This feature is supported in 8 <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regions_az/\">AWS regions</a> including US East (N. Virginia), US West (Oregon), Europe (Frankfurt), Europe (London), Canada (Central), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Asia Pacific (Singapore). For information about Amazon Connect pricing, please visit our <a href=\"https://aws.amazon.com/connect/pricing/\">pricing page</a>. To learn more, please visit our <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/generative-ai-performance-evaluations.html#set-up-generative-ai-evals-in-non-english-language\">documentation</a> and our <a href=\"https://aws.amazon.com/connect/contact-lens/\">webpage</a>.</p>"
  "9bdc0f2280b0d53efc40e439437bd07a":
    "id": "9bdc0f2280b0d53efc40e439437bd07a"
    "title": "Second-generation AWS Outposts racks now in the AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-outposts-govcloud-us-regions/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 06:32:41"
    "summary": "<p>Second-generation AWS Outposts racks are now supported in the AWS GovCloud (US-East) and AWS GovCloud (US-West) Regions. Outposts racks extend AWS infrastructure, AWS services, APIs, and tools to virtually any on-premises data center or colocation space for a truly consistent hybrid experience.<br /> <br /> Organizations from startups to enterprises and the public sector can now order their Outposts racks connected to the new supported regions, optimizing for their latency and data residency needs. Outposts allows customers to run workloads that need low latency access to on-premises systems locally while connecting back to their home Region for application management. Customers can also use Outposts and AWS services to manage and process data that needs to remain on-premises to meet data residency requirements. This regional expansion provides additional flexibility in the AWS Regions that customers’ Outposts can connect to.<br /> <br /> To learn more about second-generation Outposts racks, read <a href=\"https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/\"><u>this blog post</u></a> and <a href=\"https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html\"><u>user guide</u></a>. For the most updated list of countries and territories and the AWS Regions where second-generation Outposts racks are supported, check out the <a href=\"https://aws.amazon.com/outposts/rack/faqs/\"><u>Outposts rack FAQs page</u></a>.</p>"
  "1a0f24c13715308cad491bf8e603ae0c":
    "id": "1a0f24c13715308cad491bf8e603ae0c"
    "title": "AWS Transform announces general availability of Amazon FSx for NetApp ONTAP support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transform-fsx-netapp-ontap-support/"
    "published": "2026-09-03 12:00:00"
    "fetched": "2026-09-04 01:53:14"
    "summary": "<p>AWS Transform for migrations adds Amazon FSx for NetApp ONTAP as a generally available storage target for block storage workloads, alongside Amazon EBS. With AWS Transform, you can now migrate block storage directly to FSx for ONTAP as part of the same migration wave that handles compute and networks, eliminating the need for intermediate storage platforms and separate migration tools.</p> \n<p>Whether migrating from NetApp ONTAP, other block storage platforms, or VMware environments, your data access patterns and operational processes remain unchanged with FSx for ONTAP. Now your workloads run on a fully managed, production-ready shared storage service that combines ONTAP's enterprise capabilities with the scalability and resiliency of AWS. What previously required stitching together multiple tools is now a single migration workflow.</p> \n<p>This capability is available in all <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\">AWS Transform supported target Regions</a> and where <a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/available-aws-regions.html\">Amazon FSx for NetApp ONTAP is supported</a>. To get started, visit <a href=\"https://aws.amazon.com/transform/migrations/\">AWS Transform for migrations</a>. To learn more about Amazon FSx for NetApp ONTAP, see the <a href=\"https://aws.amazon.com/fsx/netapp-ontap/\">product page</a>.</p>"
  "34c749bc7a6e98cba82dc9b98e1654bb":
    "id": "34c749bc7a6e98cba82dc9b98e1654bb"
    "title": "Amazon Linux 2027 is now available in public preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/announcing-amazon-linux-2027/"
    "published": "2026-09-03 17:00:00"
    "fetched": "2026-09-04 04:36:40"
    "summary": "<p>Today, AWS announces the public preview of Amazon Linux 2027 (AL2027), the next version of the Amazon Linux operating system, purpose-built for cloud-native workloads on AWS with performance, scale, and security in mind. Built on AL2023's baseline, AL2027 is designed for customers running web applications, databases, containerized microservices, AI/ML workloads, and large-scale infrastructure who need a secure, stable, and AWS-native operating system.</p> \n<p>AL2027 runs on kernel 7.1+, enables SELinux in enforcing mode as default, accelerates cryptographic performance with AWS-LC, and keeps builders current with the latest toolchains and language runtimes. For AI and machine learning workloads, it delivers access to accelerator drivers, including AWS Neuron driver support. The public preview gives customers hands-on access before general availability (GA) to experiment with new features, validate their applications, and provide direct feedback to the Amazon Linux team.</p> \n<p>AL2027 Preview AMIs are available through the AWS Management Console across all commercial AWS Regions, with both x86-64 and ARM variants. Container base images are available on Amazon ECR Public Gallery. Customers can submit feedback through the <a href=\"https://github.com/amazonlinux/amazon-linux-2027\">AL2027 GitHub repository</a>. For a full list of changes relative to AL2023, see the <a href=\"https://docs.aws.amazon.com/linux/al2027/ug/what-is-amazon-linux.html\">AL2027 documentation</a>. To learn more, visit the <a href=\"https://aws.amazon.com/linux/\">Amazon Linux product page</a>.</p>"
  "1b7402c5ab3ceed94fac4544a37a1de0":
    "id": "1b7402c5ab3ceed94fac4544a37a1de0"
    "title": "Amazon SES now supports S/MIME email signing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ses-supports-smime-signing"
    "published": "2026-09-03 16:00:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p><a href=\"https://aws.amazon.com/ses/\">Amazon Simple Email Service (SES)</a> now supports Secure/Multipurpose Internet Mail Extensions (S/MIME) signing, giving you a way to help recipients verify your emails are authentic.&nbsp;An S/MIME signature lets recipients confirm that a message was sent by the holder of the From address and that its content was not altered in transit.</p> \n<p>Previously, senders who needed S/MIME had to sign each message themselves before submitting it to SES, adding complexity to their sending.&nbsp;With this feature, you store your signing certificate in <a href=\"https://aws.amazon.com/certificate-manager/\">AWS Certificate Manager</a> and enable S/MIME signing for your sender identity. SES then signs your messages automatically as you send, so you don't have to sign messages yourself beforehand. Recipients whose email clients don't support S/MIME can still read the message normally. This gives security-conscious senders a simple way to add digital signatures to their email while continuing to use their existing SES setup.</p> \n<p>This feature is available in all AWS Regions where Amazon SES is available.&nbsp;To learn more about S/MIME signing in Amazon SES, visit the <a href=\"https://console.aws.amazon.com/ses\">Amazon SES console</a> or refer to the <a href=\"https://docs.aws.amazon.com/ses/latest/dg/send-email-authentication-smime.html\">documentation</a>.</p>"
  "74bba7185d7c98d41d471598a4e584a2":
    "id": "74bba7185d7c98d41d471598a4e584a2"
    "title": "Amazon S3 now supports PrivateLink for FIPS endpoints"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-s3-privatelink-fips-endpoints"
    "published": "2026-09-03 13:00:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>Amazon S3 now supports AWS PrivateLink for endpoints that have been validated under the Federal Information Processing Standard (FIPS) 140-3 program.<br /> <br /> Customers with security and compliance requirements can use FIPS-validated cryptographic modules when connecting to S3 while keeping their traffic within their Virtual Private Cloud (VPC). To get started, create a new or edit an existing interface VPC endpoint for S3 and configure it to use the FIPS S3 endpoint.<br /> <br /> AWS PrivateLink support for FIPS S3 endpoints is now available in the AWS US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), Canada (Central), Canada West (Calgary), and AWS GovCloud (US) Regions, at no additional cost. To learn more, visit&nbsp;<a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-access-aws-services.html\" rel=\"noopener noreferrer\" target=\"_blank\">accessing AWS services through AWS PrivateLink</a>, <a href=\"https://aws.amazon.com/compliance/fips/\" rel=\"noopener noreferrer\" target=\"_blank\">FIPS 140-3 Compliance</a>, and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html\" rel=\"noopener noreferrer\" target=\"_blank\">S3 documentation</a>.</p>"
"last_updated": "2026-09-04 07:12:38 JST"
