    "title": "AWS Config now supports 60 new resource types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-config-new-resource-types/"
    "published": "2026-09-03 00:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>AWS Config now supports 60 additional AWS resource types across key services including Amazon Bedrock,&nbsp; Amazon EC2, Amazon SageMaker, and AWS Organizations. This expansion provides greater coverage over your AWS environment, enabling you to more effectively discover, assess, audit, and remediate an even broader range of resources.</p> \n<p>With this launch, if you have enabled recording for all resource types, then AWS Config will automatically track these new additions. The newly supported resource types are also available in Config rules and Config aggregators.</p> \n<p>You can now use AWS Config to monitor the following newly supported resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where the resources are available:</p> \n<p><br /> Resource Types:</p> \n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"1045\"> \n <tbody>\n  <tr>\n   <td height=\"21\" width=\"355\">AWS::AppSync::ChannelNamespace</td> \n   <td width=\"345\">AWS::EC2::RouteServer</td> \n   <td width=\"345\">AWS::Organizations::Policy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::AppSync::SourceApiAssociation</td> \n   <td>AWS::EC2::RouteServerEndpoint</td> \n   <td>AWS::Organizations::ResourcePolicy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::EnforcedGuardrailConfiguration</td> \n   <td>AWS::EC2::RouteServerPeer</td> \n   <td>AWS::QuickSight::RefreshSchedule</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::Flow</td> \n   <td>AWS::EKS::PodIdentityAssociation</td> \n   <td>AWS::RDS::DBProxy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::FlowVersion</td> \n   <td>AWS::ElasticLoadBalancingV2::ListenerRule</td> \n   <td>AWS::S3Vectors::Index</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Bedrock::PromptVersion</td> \n   <td>AWS::GameLiftStreams::Application</td> \n   <td>AWS::SageMaker::Action</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::OAuth2CredentialProvider</td> \n   <td>AWS::GameLiftStreams::StreamGroup</td> \n   <td>AWS::SageMaker::Algorithm</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::PaymentManager</td> \n   <td>AWS::IdentityStore::Group</td> \n   <td>AWS::SageMaker::App</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::Policy</td> \n   <td>AWS::IoT::TopicRuleDestination</td> \n   <td>AWS::SageMaker::Context</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::PolicyEngine</td> \n   <td>AWS::Lightsail::Container</td> \n   <td>AWS::SageMaker::Hub</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::BedrockAgentCore::TokenVault</td> \n   <td>AWS::Lightsail::Database</td> \n   <td>AWS::SageMaker::MlflowApp</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Chime::AppInstance</td> \n   <td>AWS::Lightsail::Distribution</td> \n   <td>AWS::SageMaker::ModelCard</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CloudTrail::ResourcePolicy</td> \n   <td>AWS::Lightsail::Domain</td> \n   <td>AWS::SageMaker::ModelPackage</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::CodePipeline::Webhook</td> \n   <td>AWS::Lightsail::Instance</td> \n   <td>AWS::SES::MailManagerArchive</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Config::OrganizationConformancePack</td> \n   <td>AWS::Lightsail::LoadBalancer</td> \n   <td>AWS::Transfer::WebApp</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::AgentStatus</td> \n   <td>AWS::Logs::ResourcePolicy</td> \n   <td>AWS::WorkSpacesWeb::TrustStore</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::EvaluationForm</td> \n   <td>AWS::MediaConnect::Bridge</td> \n   <td>AWS::WorkSpacesWeb::UserAccessLoggingSettings</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::View</td> \n   <td>AWS::NetworkManager::CoreNetwork</td> \n   <td>AWS::XRay::Group</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::Connect::ViewVersion</td> \n   <td>AWS::Organizations::Account</td> \n   <td>AWS::XRay::ResourcePolicy</td> \n  </tr>\n  <tr>\n   <td height=\"21\">AWS::EC2::NetworkPerformanceMetricSubscription</td> \n   <td>AWS::Organizations::Organization</td> \n   <td>AWS::XRay::SamplingRule</td> \n  </tr>\n </tbody>\n</table>"
