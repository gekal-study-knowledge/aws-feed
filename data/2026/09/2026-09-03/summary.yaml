"overview": |
  この日は OS とセキュリティ運用の基盤、そしてエージェントを実務へ落とし込む事例が中心でした。まず Amazon Linux 2027 (AL2027) がパブリックプレビューとして発表され、AWS 上のクラウドネイティブなワークロード向けに性能とスケールを狙った次世代 OS が姿を見せました。セキュリティブログでは、この 1 年の企業のセキュリティリーダーとの対話を踏まえ、自律型 AI エージェントの台頭がクラウド移行以来もっとも大きなセキュリティ体制の転換であるとして、機械の速度での検知と対応を論じる記事が公開されています。IAM Identity Center の ID ソース移行に関する記事も、Active Directory の移行戦略と許可セットの自動化を含めて 9 月 2 日に再公開されました。セキュリティ速報は 1 件で、Amazon Ion の C 実装である Amazon Ion-C の 1.1.6 より前のバージョンで、Ion リーダーに制御されない再帰がある問題 (CVE-2026-84851) が Important として公開されています。サービス更新は幅広く、AWS Config が Amazon Bedrock、EC2、SageMaker、AWS Organizations を含む 60 の新しいリソースタイプに対応してカバレッジを広げました。Amazon Connect Customer では、AI による自己解決体験をノーコードのキャンバスで設計・デプロイできる agentic CX designer が一般提供となり、マレー語での人間と AI エージェントの自動評価にも対応しています。規制対応の要素も多く、第 2 世代の Outposts ラックが GovCloud (US-East / US-West) で利用可能になり、Bedrock の Web Search 組み込みツールが GovCloud (US-West) へ、S3 が FIPS 140-3 の検証済みエンドポイントで PrivateLink に対応、SES が S/MIME による電子メール署名をサポートしました。移行では AWS Transform がブロックストレージの移行先として Amazon FSx for NetApp ONTAP を一般提供で追加しています。機械学習ブログでは、オーストラリアのチームがシドニー・メルボルンの両リージョンからグローバルなクロスリージョン推論で OpenAI GPT-5.6 の Sol / Terra / Luna を使えるようになったことが案内され、障害のある学生の移行計画を支援する対話型 AI ソリューション Trinity を Bedrock 上のサーバーレスなマルチエージェント構成へ拡張した事例、.NET のコードベースを解析してアーキテクチャ図を生成し継続的に維持するパイプラインをグローバルなインターディーラーブローカーが AgentCore 上に構築した事例、インフラ監視がすべて正常でも空白・陳腐化・誤りを示すことがある BI ダッシュボードの内容の破綻を Bedrock で検知する取り組みが公開されました。国内では Aurora DSQL の事例セミナー告知に加え、ウィークリー総まとめと Graviton5 の R9g / R9gd の日本語版が出ています。
