"overview": |
  この日は 9 件で、新しいオープンウェイトモデルの追加と AgentCore Runtime の刷新解説が中心でした。Moonshot AI の Kimi K3 が Amazon Bedrock で一般提供となり、ネイティブなビジョン対応と 100 万トークンのコンテキストウィンドウを備え、コーディングやナレッジワーク向けの強力なオープンウェイトの選択肢として同じセキュリティとガバナンスのもとで使えます。機械学習ブログでは、前日に発表された新しい AgentCore Runtime について、メモリを必要に応じて回収する弾力的な設計と安定した高速な起動を解説する記事と、自己管理の ECS と Fargate で動いていたマルチモデルの医療 AI エージェントを、3 モデルのオーケストレーションとベクトル強化された知識検索を保ったまま AgentCore Runtime へ移行する事例が公開されました。あわせて、6 つのオープンソースエージェントスキルを使い、コーディングエージェントに指示するだけで Hugging Face のモデルを SageMaker AI 上のリアルタイムエンドポイントとして本番デプロイする方法も紹介されています。コンピュートブログでは、AWS Lambda MicroVMs を使い、エージェントのツール呼び出しごとに新しい VM 分離の MicroVM を起動するセルフホスト型のコントロールプレーンで、安全に隔離されたエージェントサンドボックスを実行する設計が解説されています。サービス更新では、AWS RTB Fabric がレスポンダーゲートウェイの Availability Zone アフィニティを設定できるようになり、Amazon ECS Express Mode が AWS Graviton (ARM64) ワークロードに対応、ペネトレーションテスト用のフロンティアエージェント AWS Continuum が認証情報のテストとアクセスしやすいドメインの提案に対応しました。
