"overview": |
  この日は 15 件で、新しいオープンウェイトモデルの追加、AgentCore Runtime の刷新解説、そしてエージェントによる開発・運用の実践例が中心でした。Moonshot AI の Kimi K3 が Amazon Bedrock で一般提供となり、ネイティブなビジョン対応と 100 万トークンのコンテキストウィンドウを備え、コーディングやナレッジワーク向けの強力なオープンウェイトの選択肢として同じセキュリティとガバナンスのもとで使えます。機械学習ブログでは、前日に発表された新しい AgentCore Runtime について、メモリを必要に応じて回収する弾力的な設計と安定した高速な起動を解説する記事と、自己管理の ECS と Fargate で動いていたマルチモデルの医療 AI エージェントを、3 モデルのオーケストレーションとベクトル強化された知識検索を保ったまま AgentCore Runtime へ移行する事例が公開されました。あわせて、6 つのオープンソースエージェントスキルを使い、コーディングエージェントに指示するだけで Hugging Face のモデルを SageMaker AI 上のリアルタイムエンドポイントとして本番デプロイする方法と、フルマネージドエンドポイントと SageMaker HyperPod Inference の 2 つの提供形態にまたがる 2026 年の推論関連 13 件のローンチを振り返る記事も紹介されています。コンピュートブログでは、AWS Lambda MicroVMs を使い、エージェントのツール呼び出しごとに新しい VM 分離の MicroVM を起動するセルフホスト型のコントロールプレーンで、安全に隔離されたエージェントサンドボックスを実行する設計が解説されました。アーキテクチャブログでは、機微なエンタープライズデータを扱うマルチテナント基盤を Amazon EKS 上で運用する ReadyOn が、テナント分離を 4 層の独立した壁として設計する「Four Walls」モデルを紹介しています。AWS ジャパンブログでは、エージェントに現場を任せるときの境界線をピックアップトピックとした月刊 AWS 製造 2026 年 9 月号と、Kiro Crew を開発する 3 人が 7 日間で 1,000 件 (1 日あたり 120 件超) のプルリクエストを CI とレビューを通してマージしたソフトウェアファクトリーの事例が公開されました。サービス更新では、Amazon SNS のメッセージペイロード上限が従来の 256 KiB から 4 倍の 1 MiB に拡大し、AWS Resilience Hub は次世代として 3 つの新機能を追加、AWS RTB Fabric がレスポンダーゲートウェイの Availability Zone アフィニティを設定できるようになり、Amazon ECS Express Mode が AWS Graviton (ARM64) ワークロードに対応、ペネトレーションテスト用のフロンティアエージェント AWS Continuum が認証情報のテストとアクセスしやすいドメインの提案に対応しました。リージョン展開では、カスタム Intel Xeon 6 プロセッサを搭載した Amazon EC2 X8i インスタンスが南米 (サンパウロ) リージョンで、大容量ストレージ I/O 集約型ワークロード向けの Amazon EC2 I7ie インスタンスが AWS イスラエル (テルアビブ) リージョンで、それぞれ利用可能になりました。
