  "7dc73f3540be5448091b6f31ffaadb14":
    "id": "7dc73f3540be5448091b6f31ffaadb14"
    "title": "AWS RTB Fabric now supports configurable Availability Zone affinity"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-rtb-fabric-configurable-availability-zone-affinity/"
    "published": "2026-09-19 00:30:00"
    "fetched": "2026-09-19 02:26:27"
    "summary": "<p>AWS RTB Fabric now supports <a href=\"https://docs.aws.amazon.com/rtb-fabric/latest/userguide/working-with-responder-gateways.html#configuring-availability-zone-affinity\" rel=\"noopener noreferrer\" target=\"_blank\">configurable Availability Zone (AZ) affinity</a> for responder gateways. With this capability, you can configure how your partners connect to your responder gateway: either in their own Availability Zone or to any Availability Zone that the gateway spans. This launch helps advertising technology (AdTech) companies use their infrastructure more efficiently—with no extra charges on RTB Fabric.</p> \n<p>Demand-side platforms (DSPs) and supply-side platforms (SSPs) run their bidding systems across multiple Availability Zones. Previously, AWS RTB Fabric sent each request to available gateway capacity in the requester's own Availability Zone (AZ), so capacity in other AZs could go unused. Now you can set a client routing policy to control this: prefer the requester's own AZ to avoid added latency of crossing a boundary, or use every AZ that the responder gateway spans to give each requester access to more gateway capacity. Configurable Availability Zone affinity is available in all AWS Regions where AWS RTB Fabric is available.&nbsp;See the AWS RTB Fabric&nbsp;<a href=\"https://docs.aws.amazon.com/rtb-fabric/latest/userguide/working-with-responder-gateways.html#configuring-availability-zone-affinity\" rel=\"noopener noreferrer\" target=\"_blank\">User Guide</a> for fleet requirements before enabling.</p> \n<p>AWS RTB Fabric helps you connect with your AdTech partners such as Amazon Ads, GumGum, Kargo, MobileFuse, Sovrn, TripleLift, Viant, Yieldmo, and more in three steps while delivering single-digit millisecond latency through a private, high-performance network environment. RTB Fabric reduces standard cloud networking costs by up to 80% and does not require upfront commitments. AWS RTB Fabric is generally available in the following <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Singapore), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (Ireland). See the&nbsp;AWS RTB Fabric <a href=\"https://aws.amazon.com/rtb-fabric/\" rel=\"noopener noreferrer\" target=\"_blank\">Product Page</a> to learn more.</p>"
  "009d98f81ad6f8720b688ac5f0165553":
    "id": "009d98f81ad6f8720b688ac5f0165553"
    "title": "AWS Continuum now supports credential testing and accessible domain suggestions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-security-agent/"
    "published": "2026-09-19 03:34:00"
    "fetched": "2026-09-19 05:19:48"
    "summary": "<p>AWS Continuum for penetration testing is a frontier agent that proactively secures applications throughout the development lifecycle by offering on-demand, customized penetration testing with real exploitability testing. Developers and security teams can now test login credentials and receive suggested domains before a penetration test runs. This makes it easier to configure an accurate network scope from the start, reducing misconfiguration and wasted test cycles.</p> \n<p>Previously, identifying all the URLs your application reaches required manual effort, and authentication failures were only discovered after a full test cycle completed, costing time and resources. With this launch, when you add login credentials during test configuration, AWS Continuum authenticates into your application exactly as a real user would, capturing every accessible domain reached during login and surfacing them as in-scope URL suggestions. You can review accessible domains, validate credentials, and confirm the agent covers the right endpoints, all before the real test begins. Accessible domains are returned regardless of whether the credential test succeeds, fails, or times out. You can learn more about this feature in our updated <a href=\"https://docs.aws.amazon.com/securityagent/latest/userguide/perform-penetration-test.html#_configure_authentication_credentials_optional\">documentaiton</a>.</p> \n<p>This capability is available in all regions where AWS Continuum for penetration testing is available and is detailed on the <a href=\"https://aws.amazon.com/continuum/?trk=77f1fbea-4ad5-4c1d-b16e-e5634ca5086e&amp;sc_channel=ps&amp;ef_id=CjwKCAjwwrPVBhA1EiwAv_YO-dtnJZvxRUPyj3N8BdcJLvN4fjq5kQwIththbsuo7ZvdNlCIcxxmSRoCX2kQAvD_BwE:G:s&amp;gclid=CjwKCAjwwrPVBhA1EiwAv_YO-dtnJZvxRUPyj3N8BdcJLvN4fjq5kQwIththbsuo7ZvdNlCIcxxmSRoCX2kQAvD_BwE\">AWS Continuum product page</a>.</p>"
  "2b42cda23478c8cd56606ae4a902b0d8":
    "id": "2b42cda23478c8cd56606ae4a902b0d8"
    "title": "Amazon ECS Express Mode now supports AWS Graviton (ARM64) workloads"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-express-mode-arm-architecture/"
    "published": "2026-09-19 02:27:00"
    "fetched": "2026-09-19 05:19:48"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> Express Mode now supports specifying ARM64 as the CPU architecture for your service, making it easy to deploy ARM-based container images on AWS Graviton-powered compute and benefit from up to 40% better price-performance compared to x86-based instances.</p> \n<p>Amazon ECS Express Mode makes it easy to rapidly launch containerized applications, including web applications and APIs, by orchestrating and managing the cloud architecture for your application. You provide your container image, and ECS Express Mode handles the rest, configuring networking, load balancing, auto scaling, and deployments, and providing your application with an auto-generated URL. With ARM64 architecture support, you can choose the compute architecture that fits your workload, whether you're optimizing for cost with Graviton, matching your existing fleet, or deploying images built natively for ARM.</p> \n<p>You can configure the CPU architecture for new and existing Amazon ECS Express Mode services using the AWS Management Console, AWS CLI, AWS SDKs, and infrastructure as code (IaC) tools. This capability is available in all AWS commercial Regions and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Regions</a>. To learn more, see the <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-overview.html\" target=\"_blank\">ECS Express Mode documentation</a>.</p>"
  "ec58ef9bb9c4df0e1d9f59dd1742feb8":
    "id": "ec58ef9bb9c4df0e1d9f59dd1742feb8"
    "title": "Kimi K3 by Moonshot AI is now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/moonshot-ai-kimi-k3-on-amazon-bedrock/"
    "published": "2026-09-19 00:15:00"
    "fetched": "2026-09-19 05:19:48"
    "summary": "<p>Amazon Bedrock continues to expand its open weight model portfolio with the same security and governance that customers rely on.&nbsp;Today, Kimi K3 from Moonshot AI is generally available on Amazon Bedrock, giving you a powerful new option for coding and knowledge work.</p> \n<p>According to Moonshot AI, Kimi K3 is its most capable model and the first open model to reach 2.8 trillion parameters. It combines native vision capabilities with a 1-million-token context window, making it well suited to long-running coding sessions across large repositories, multi-document analysis including scanned pages and screenshots, and extended agent workflows. <a href=\"https://www.kimi.com/blog/kimi-k3\">Moonshot AI reports</a> an approximate 2.5x improvement in scaling efficiency over Kimi K2.&nbsp;On Amazon Bedrock, Kimi K3 runs within the same security boundary as proprietary models, and the same controls for access, encryption, and auditing across your model portfolio. Kimi K3 is the first open weight model on Amazon Bedrock to support <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html\">explicit prompt caching</a>, helping reduce latency and input costs when reusing context&nbsp;across model calls.</p> \n<p>Kimi K3 is available in all&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions</a>&nbsp;where Amazon Bedrock is available through cross-Region inferencing. To get started, visit the <a href=\"https://us-east-1.console.aws.amazon.com/bedrock-mantle/home?region=us-east-1#\">Amazon Bedrock Console</a>. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-moonshot-ai.html\">Amazon Bedrock documentation</a>&nbsp;and read the&nbsp;<a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-kimi-k3-on-amazon-bedrock/\">launch blog</a> post.</p>"
  "ce4096493df8611dcb1eb8382a613926":
    "id": "ce4096493df8611dcb1eb8382a613926"
    "title": "AWS Resilience Hub adds three new capabilities"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/resilience-hub-eks-dependency-policy/"
    "published": "2026-09-19 01:49:00"
    "fetched": "2026-09-19 07:59:02"
    "summary": "<p>The next generation of AWS Resilience Hub is a central location in the AWS that helps platform engineering and site reliability teams assess and strengthen the resilience of their workloads running on AWS. It provides automated dependency discovery, generative AI-powered failure mode analysis, modular resilience policies, resilience testing, and organization-wide resilience posture reporting. Today, AWS Resilience Hub adds three new capabilities: EKS labels support for service input sources, dependency insights, and resilience policy sharing through AWS Organizations.</p> \n<p><b>EKS labels support for service input sources.</b> Resilience Hub now supports EKS labels within a namespace as a service input source, allowing customers to use their existing Kubernetes labeling conventions to scope exactly which resources Resilience Hub discovers and uses during failure mode analysis. This ensures assessments stay aligned with how teams organize their EKS workloads.</p> \n<p><b>Dependency insights.</b> Customers who enable dependency discovery can now generate dependency insights, a new generative AI-powered capability that analyzes discovered application dependencies and highlights meaningful patterns. Dependency insights surfaces new dependencies, identifies cross-Region dependencies, and flags unusual usage patterns. This helps teams accelerate dependency analysis and identify potential new risks.</p> \n<p><b>Resilience policy sharing through AWS Organizations.</b> Resilience Hub now supports sharing resilience policies through AWS Organizations, enabling central teams to build and manage policies that can be applied across multiple accounts. This provides organization-wide observability into which services are using each policy, making it easier to monitor adoption and ensure consistent resilience posture across the organization.</p> \n<p>To get started, visit the &nbsp;<a href=\"https://console.aws.amazon.com/resiliencehub/v2/home\">AWS console</a>. To learn more, see the <a href=\"https://aws.amazon.com/resilience-hub/\">product page</a>&nbsp;or visit the <a href=\"https://docs.aws.amazon.com/resilience-hub/latest/userguide/next-gen.html\">documentation</a>.</p>"
  "75137b6f875b457046dd540a892bc9f4":
    "id": "75137b6f875b457046dd540a892bc9f4"
    "title": "Amazon SNS now supports message payloads up to 1 MiB"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-sns-1mib-support"
    "published": "2026-09-19 00:00:00"
    "fetched": "2026-09-19 07:59:02"
    "summary": "<p><a href=\"https://aws.amazon.com/sns/\">Amazon Simple Notification Service (Amazon SNS)</a>&nbsp;now supports message payloads up to 1 MiB, a 4x increase from the previous 256 KiB limit, so you can publish larger messages to your SNS topics.</p> \n<p>Amazon SNS is a fully managed pub/sub messaging service that enables you to decouple and scale microservices, distributed systems, and serverless applications. As workloads such as application integration, IoT, and generative AI increasingly exchange larger volumes of data in a single message, the previous 256 KiB limit required customers to offload or split payloads before publishing.</p> \n<p>With this launch, you can publish message payloads up to 1 MiB by setting the new MaximumMessageSize topic attribute on both SNS Standard and SNS FIFO topics. Topics with MaximumMessageSize set above 256 KiB support Amazon SQS, Amazon Data Firehose, and AWS Lambda subscriptions, with up to 100 total subscriptions per topic.</p> \n<p>Amazon SNS 1 MiB support is available today in all AWS Regions where Amazon SNS is available. To learn more about sending large payloads with Amazon SNS, see the <a href=\"https://docs.aws.amazon.com/sns/latest/dg/large-message-payloads.html\">Amazon SNS Developer Guide</a>.&nbsp;</p> \n<p>&nbsp;</p>"
  "61e07188418f0570eb0396cfd5ce42ba":
    "id": "61e07188418f0570eb0396cfd5ce42ba"
    "title": "Amazon EC2 X8i instances are now available in the South America (São Paulo) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-x8i-south-america-sao-paulo/"
    "published": "2026-09-19 07:16:00"
    "fetched": "2026-09-21 14:50:31"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) X8i instances are available in the South America (São Paulo) region. These instances are powered by custom Intel Xeon 6 processors available only on AWS. X8i instances are SAP-certified and deliver the highest performance and fastest memory bandwidth among comparable Intel processors in the cloud. They deliver up to 43% higher performance, 1.5x more memory capacity (up to 6TB), and 3.3x more memory bandwidth compared to previous generation X2i instances.</p> \n<p>X8i instances are designed for memory-intensive workloads like SAP HANA, large databases, data analytics, and Electronic Design Automation (EDA). Compared to X2i instances, X8i instances offer up to 50% higher SAPS performance, up to 47% faster PostgreSQL performance, 88% faster Memcached performance, and 46% faster AI inference performance. X8i instances come in 14 sizes, from large to 96xlarge, including two bare metal options.</p> \n<p>To get started, visit the <a href=\"https://aws.amazon.com/console/\" target=\"_blank\">AWS Management Console</a>. X8i instances can be purchased via Savings Plans, On-Demand instances, and Spot instances. For more information visit <a href=\"https://aws.amazon.com/ec2/instance-types/x8i/\" target=\"_blank\">X8i instances page</a>.</p>"
"last_updated": "2026-09-21 14:50:31 JST"
