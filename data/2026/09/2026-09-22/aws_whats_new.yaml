  "49e49bc8413b74b86ffc07f7910797ca":
    "id": "49e49bc8413b74b86ffc07f7910797ca"
    "title": "Amazon ECS now provides real-time deployment observability in the AWS Management Console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-console-deployment-observability/"
    "published": "2026-09-22 05:05:00"
    "fetched": "2026-09-22 09:32:46"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now provides real-time service deployment observability in the Amazon ECS Console for native Linear, Canary, and Blue/Green deployment strategies. With this launch, deployment monitoring and troubleshooting come together in one place in the console, so you can track deployment progress, monitor health, and diagnose failures without switching between tools.</p>\n<p>Real-time service deployment observability includes a live deployment timeline that narrates each service deployment as it happens, showing every deployment phase, service events, and task launch and termination progress, always reflecting the current state. As a deployment moves forward, you can follow the traffic shift distribution across your source and target revisions and see the current lifecycle stage at a glance, whether it is scaling up green tasks, waiting on a lifecycle hook, or sitting through bake time. Deployment health signals that you would otherwise gather from separate tools now sit alongside the timeline: circuit breaker status with live task failure and threshold tracking, deployment alarm state, container and load-balancer health checks, and lifecycle hook status. When something goes wrong, failed tasks surface right in the timeline with diagnostic context and deep links to services such as AWS CloudTrail, so you can pinpoint the root cause and act on it quickly.\n <br />\n <br />\n These capabilities are available at no additional charge in all AWS commercial Regions, and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> for all Amazon ECS services using the Amazon ECS native Linear, Canary, and Blue/Green deployment types. To get started, navigate to any Amazon ECS service in the <a href=\"https://console.aws.amazon.com/ecs\">Amazon ECS Console</a> and select the Deployments tab.</p>"
  "27701b72e010851c05a7b1c681ff915b":
    "id": "27701b72e010851c05a7b1c681ff915b"
    "title": "Amazon EVS now in scope for FedRAMP Class C"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-evs-fedramp-class-c/"
    "published": "2026-09-22 04:08:00"
    "fetched": "2026-09-22 09:32:46"
    "summary": "<p>The&nbsp;Amazon Elastic VMware Service (EVS) service is now in scope for FedRAMP Class C (formerly Moderate baseline) in all United States Regions.&nbsp;\n <br />\n <br />\n The&nbsp;&nbsp;<a href=\"https://aws.amazon.com/compliance/fedramp/\">Federal Risk and Authorization Management Program&nbsp;(FedRAMP)</a>&nbsp;is a US government-wide program that delivers a standard approach to the security assessment, authorization, and continuous monitoring for cloud products and services.&nbsp;Amazon EVS lets you run the latest VMware Cloud Foundation (VCF) software directly within your Amazon Virtual Private Cloud (VPC) on EC2 bare-metal instances. You can set up a complete VCF environment in just a few hours, enabling rapid workload migration to AWS to help you eliminate aging infrastructure, reduce operational risks, and meet critical timelines for exiting your data center.\n <br />\n <br />\n To learn more, visit the FedRAMP&nbsp;<a href=\"https://aws.amazon.com/compliance/services-in-scope/FedRAMP/\">AWS services in scope page</a>. To learn more about Amazon EVS, visit the&nbsp;<a href=\"https://aws.amazon.com/evs/\">product detail page</a> and <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>.&nbsp;</p>"
  "ac24591938a05e6f3536840118dbc606":
    "id": "ac24591938a05e6f3536840118dbc606"
    "title": "AWS Security Hub AI Inventory adds Azure self-hosted instance support"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/security-hub-ai-inventory-azure-support/"
    "published": "2026-09-22 17:00:00"
    "fetched": "2026-09-23 07:41:24"
    "summary": "<p>AWS Security Hub AI Inventory now supports discovering and cataloging AI assets running on self-hosted instances in Microsoft Azure. This expansion extends Security Hub's existing self-hosted discovery capabilities beyond AWS, enabling central security teams to gain a continuously updated, organization-wide view of AI assets and their security posture across multi-cloud environments.</p>\n<p>Security Hub leverages the software bill of materials (SBOM) analysis from Amazon Inspector, which has been enhanced to identify inference endpoints, models, and AI agents installed on Azure virtual machines, including frameworks such as Ollama, vLLM, Hugging Face TGI, and others. Each discovered AI asset is mapped to its underlying infrastructure and correlated with security findings, enabling teams to filter, group, and query their AI inventory across both AWS and Azure environments.</p>\n<p>This capability is included with Security Hub Essentials at no additional cost. It is available in all AWS commercial Regions where Security Hub is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-v2-ai-inventory.html\">AWS Security Hub User Guide</a> and the <a href=\"https://aws.amazon.com/security-hub/\">AWS Security Hub product page</a>.</p>"
  "4b7512848bbbc5e67b31cb96ad19d3d7":
    "id": "4b7512848bbbc5e67b31cb96ad19d3d7"
    "title": "Amazon Route 53 Resolver is now generally available on second-generation AWS Outposts racks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/route-53-resolver-gen2-outposts/"
    "published": "2026-09-22 17:00:00"
    "fetched": "2026-09-23 07:41:24"
    "summary": "<p>Amazon Route 53 Resolver is now generally available on second-generation AWS Outposts, providing local, managed recursive DNS resolution directly on your Outpost. DNS queries from workloads running on your Outpost are resolved locally, reducing latency and eliminating the need to traverse the Service Link to reach the parent AWS Region. Route 53 Resolver maintains cached DNS records during Service Link disconnections, ensuring continuous DNS resolution even during connectivity interruptions. Route 53 Resolver runs entirely on AWS-managed infrastructure built into every second-generation Outpost, eliminating the need for customer compute capacity.</p>\n<p>Route 53 Resolver is enabled by default on multi-rack second-generation Outposts. Customers who prefer to manage their own DNS resolution can opt out at any time by contacting AWS Support.</p>\n<p>Route 53 Resolver on second-generation Outposts is available in all AWS Regions where second-generation Outposts are supported. All customers, including current preview customers, receive a 91-day free trial through December 21, 2026. Starting December 22, 2026, the service is priced at $0.65 per Outpost rack per hour. To get started, see the <a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/outpost-resolver.html\" rel=\"noopener noreferrer\" target=\"_blank\">Route 53 Resolver on Outposts documentation</a>. For pricing details, see <a href=\"https://aws.amazon.com/route53/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Route 53 pricing</a>.</p>"
  "12799bd6f3a58c0a99ffd31f262ca27c":
    "id": "12799bd6f3a58c0a99ffd31f262ca27c"
    "title": "AWS Glue Data Quality delivers context-specific rule recommendations in seconds"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/glue-data-quality-rule-recommendations/"
    "published": "2026-09-22 17:00:00"
    "fetched": "2026-09-23 07:41:24"
    "summary": "<p>AWS Glue Data Quality now generates data quality rules in seconds, reducing the time to establish data quality checks for your tables in the AWS Glue Data Catalog. You get a ready-to-use set of rules with full coverage across every column, with no manual setup—so you can move from raw data to trusted data faster while authoring pipelines.</p>\n<p>This is delivered through a new Advanced mode for rule recommendations, in which AWS Glue Data Quality uses generative AI to detect the intent behind your data and proposes business-relevant rules that reflect how your data is used. You can use this Advanced mode to bootstrap rules for a newly onboarded dataset or establish baseline checks across a large data lake without hand-writing each rule. You review the recommended rules, adjust as needed, and save them as a ruleset to begin monitoring immediately.</p>\n<p>Advanced mode is available in the following AWS Regions: Asia Pacific (Melbourne, Osaka, Sydney, Tokyo), Canada (Central), Europe (Frankfurt, Ireland, London, Milan, Paris, Spain, Stockholm, Zurich), US East (N. Virginia, Ohio), and US West (N. California, Oregon).</p>\n<p>To get started, see the <a href=\"https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html\">AWS Glue Data Quality documentation</a>.</p>"
  "24b5da1b6ad9294d14addebba2aa8c0b":
    "id": "24b5da1b6ad9294d14addebba2aa8c0b"
    "title": "Amazon RDS Custom now supports the latest CU for Microsoft SQL Server"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-custom-supports-latest-cu-gdr-microsoft-sql-server/"
    "published": "2026-09-22 16:30:00"
    "fetched": "2026-09-23 07:41:24"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/custom/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports the latest Cumulative Updates (CU) for Microsoft SQL Server. This release includes support for SQL Server 2022 CU26 <a href=\"https://support.microsoft.com/en-us/servicing/sql/sql-server-2022/cumulative-update/kb5093420-cu26\" rel=\"noopener noreferrer\" target=\"_blank\">KB5093420</a> (RDS version 16.00.4265.3.v1).\n <br />\n <br />\n For additional information on the improvements and fixes included in these updates, see Microsoft documentation for KB5093420. You can upgrade your Amazon RDS Custom for SQL Server instances to apply these recommended updates using Amazon RDS Management Console, or by using the AWS SDK or CLI. To learn more about upgrading your database instances, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Custom User Guide</a>.</p>"
