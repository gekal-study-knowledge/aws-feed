    "title": "Amazon ECS now provides real-time deployment observability in the AWS Management Console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-console-deployment-observability/"
    "published": "2026-09-22 05:05:00"
    "fetched": "2026-09-22 09:32:46"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now provides real-time service deployment observability in the Amazon ECS Console for native Linear, Canary, and Blue/Green deployment strategies. With this launch, deployment monitoring and troubleshooting come together in one place in the console, so you can track deployment progress, monitor health, and diagnose failures without switching between tools.</p>\n<p>Real-time service deployment observability includes a live deployment timeline that narrates each service deployment as it happens, showing every deployment phase, service events, and task launch and termination progress, always reflecting the current state. As a deployment moves forward, you can follow the traffic shift distribution across your source and target revisions and see the current lifecycle stage at a glance, whether it is scaling up green tasks, waiting on a lifecycle hook, or sitting through bake time. Deployment health signals that you would otherwise gather from separate tools now sit alongside the timeline: circuit breaker status with live task failure and threshold tracking, deployment alarm state, container and load-balancer health checks, and lifecycle hook status. When something goes wrong, failed tasks surface right in the timeline with diagnostic context and deep links to services such as AWS CloudTrail, so you can pinpoint the root cause and act on it quickly.\n <br />\n <br />\n These capabilities are available at no additional charge in all AWS commercial Regions, and AWS GovCloud (US) <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Regions</a> for all Amazon ECS services using the Amazon ECS native Linear, Canary, and Blue/Green deployment types. To get started, navigate to any Amazon ECS service in the <a href=\"https://console.aws.amazon.com/ecs\">Amazon ECS Console</a> and select the Deployments tab.</p>"
  "27701b72e010851c05a7b1c681ff915b":
    "id": "27701b72e010851c05a7b1c681ff915b"
    "title": "Amazon EVS now in scope for FedRAMP Class C"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-evs-fedramp-class-c/"
    "published": "2026-09-22 04:08:00"
    "fetched": "2026-09-22 09:32:46"
    "summary": "<p>The&nbsp;Amazon Elastic VMware Service (EVS) service is now in scope for FedRAMP Class C (formerly Moderate baseline) in all United States Regions.&nbsp;\n <br />\n <br />\n The&nbsp;&nbsp;<a href=\"https://aws.amazon.com/compliance/fedramp/\">Federal Risk and Authorization Management Program&nbsp;(FedRAMP)</a>&nbsp;is a US government-wide program that delivers a standard approach to the security assessment, authorization, and continuous monitoring for cloud products and services.&nbsp;Amazon EVS lets you run the latest VMware Cloud Foundation (VCF) software directly within your Amazon Virtual Private Cloud (VPC) on EC2 bare-metal instances. You can set up a complete VCF environment in just a few hours, enabling rapid workload migration to AWS to help you eliminate aging infrastructure, reduce operational risks, and meet critical timelines for exiting your data center.\n <br />\n <br />\n To learn more, visit the FedRAMP&nbsp;<a href=\"https://aws.amazon.com/compliance/services-in-scope/FedRAMP/\">AWS services in scope page</a>. To learn more about Amazon EVS, visit the&nbsp;<a href=\"https://aws.amazon.com/evs/\">product detail page</a> and <a href=\"https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html\">user guide</a>.&nbsp;</p>"
"last_updated": "2026-09-22 09:32:46 JST"
