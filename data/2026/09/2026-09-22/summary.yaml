"overview": |
  この日は 10 件で、新しいフロンティアモデルの追加と、エージェントやコスト管理の実践事例が中心でした。xAI の Grok 4.6 が Amazon Bedrock で利用可能になり、長時間動作するエージェント・コーディング・ナレッジワーク向けのフロンティアモデルとして、50 万トークンのコンテキストウィンドウと 4 段階の推論強度を備えます。機械学習ブログでは、Benchling が数千のライフサイエンステナントにまたがる信頼できない AI エージェント生成コードを実行するために、Amazon Bedrock AgentCore Code Interpreter 上で多層防御のセキュリティアーキテクチャを構築した事例、EXL が IDP とドメイン特化の大規模言語モデルを SageMaker と Bedrock で組み合わせ医療保険請求のレビュー時間を短縮した Medical IDP ソリューション、BMW Group が 14,000 を超えるクラウドアカウントを監視する FinOps プラットフォーム CLEA に日次の自動コスト異常検知を追加し事後対応から脱した事例が公開されました。あわせて、Posit のデータサイエンス向け IDE である Positron が Amazon SageMaker AI 上で動作するようになり、Athena のテーブルを探索して R で特徴量を検証し XGBoost を学習させるまでの流れが紹介されています。セキュリティブログでは、Bedrock Guardrails の介入イベントを CloudWatch で OCSF 形式に変換し、既存のセキュリティテレメトリーと並べてプロンプトインジェクションなど AI 関連のセキュリティイベントを調査する方法が解説されました。サービス更新では、Amazon ECS がネイティブの Linear・Canary・Blue/Green デプロイ戦略について、AWS マネジメントコンソールでリアルタイムのデプロイ可観測性を提供するようになり、Amazon Elastic VMware Service (EVS) が米国の全リージョンで FedRAMP Class C (旧 Moderate ベースライン) の対象になりました。ニュースブログでは、AWS Builder Center のモバイルアプリ、Amazon Connect Talent の一般提供、Amazon Corretto 27 などを扱う週刊まとめ (2026 年 9 月 21 日) が出ています。AWS ジャパンブログでは、Kiro の使い方を 1 週間で学ぶオンラインチャレンジ「Kiro University Challenge」が案内され、レッスンと最終課題で最大 5,250 クレジットが得られます。このほかのサービス更新では、AWS Security Hub の AI インベントリが Microsoft Azure 上のセルフホストインスタンスで動く AI アセットの検出・カタログ化に対応し、Amazon Route 53 Resolver が第 2 世代の AWS Outposts ラックで一般提供となって Outpost 上でローカルなマネージド再帰 DNS 解決を提供、AWS Glue Data Quality は Glue データカタログのテーブル向けにコンテキストに応じたデータ品質ルールを数秒で生成できるようになり、Amazon RDS Custom for SQL Server が Microsoft SQL Server の最新の累積更新 (CU) に対応しました。
