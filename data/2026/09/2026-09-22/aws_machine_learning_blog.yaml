    "title": "Reducing medical claims review time with AI on AWS: The EXL Medical IDP solution"
    "link": "https://aws.amazon.com/blogs/machine-learning/reducing-medical-claims-review-time-with-ai-on-aws-the-exl-medical-idp-solution/"
    "published": "2026-09-22 01:24:40"
    "fetched": "2026-09-22 02:47:15"
    "summary": "EXL built an AI-powered Medical intelligent document processing (IDP) solution on AWS, combining IDP with domain-specific large language models on Amazon SageMaker and Amazon Bedrock to extract, summarize, and query medical records at enterprise scale and cut claims review time from over 100 minutes per case."
