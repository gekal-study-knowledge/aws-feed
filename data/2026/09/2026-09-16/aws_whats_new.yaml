  "3431bdd06e4d1a7bd340ffff99dcdb2d":
    "id": "3431bdd06e4d1a7bd340ffff99dcdb2d"
    "title": "Amazon SageMaker AI now supports instance preference lists for training and processing jobs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-sagemaker-training-processing-instance-pref-lists/"
    "published": "2026-09-16 03:30:00"
    "fetched": "2026-09-16 04:29:26"
    "summary": "<p>Today, Amazon SageMaker AI announces instance preference lists for training and processing jobs, making it easier and faster to find compute capacity for your workloads. Many AI training, fine-tuning, and data processing workloads run comparably well on any of several instance types or sizes. However, before now, you had to name only one instance type at the time of job submission and wait for SageMaker to find that specific instance for your job. For high-demand GPUs during peak periods, where wait times can be unpredictable, customers sometimes had to build complex retry logic or concurrently submit multiple jobs with different instance types to find the first available option. Now you can simply provide a prioritized list of the instance types your workload accepts, and SageMaker automatically runs your job on the first available configuration from your preferences. With this solution, your training or processing job will likely start sooner.</p> \n<p>To use this feature, you specify your instance type and count preferences in priority order when submitting the training or processing job. For example, your list might contain a preference of two instances of ml.g6.48xlarge or four instances of ml.g5.48xlarge. SageMaker works through the list and launches your job on the first configuration where capacity is available. You can also configure the capacity sourcing from on-demand sources or from your reserved SageMaker Flexible Training Plans within the same job submission. This feature simplifies the process of getting compute for your jobs during high-demand periods and reduces the undifferentiated manual retrying you would otherwise do, all within the SageMaker training and processing job APIs you already use.</p> \n<p>Instance preference lists for SageMaker training and processing jobs is available today in all AWS Regions where SageMaker is available through the SageMaker CLIs, APIs, SDKs and Console UI. To learn more, see our <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/train-instance-preferences.html\">documentation</a>&nbsp;or our <a href=\"https://aws.amazon.com/blogs/machine-learning/announcing-instance-preference-lists-for-amazon-sagemaker-ai-training-jobs/\">launch blog</a>.</p>"
  "87a5a804e800a9b00aa3cccb208feac0":
    "id": "87a5a804e800a9b00aa3cccb208feac0"
    "title": "Analyze your CloudTrail events using natural language in Amazon Q Console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/cloudtrail-amazon-q-console/"
    "published": "2026-09-16 01:54:00"
    "fetched": "2026-09-16 04:29:26"
    "summary": "<p>AWS CloudTrail, a service that records API activity across your AWS account for security auditing, compliance, and operational troubleshooting, now integrates with Amazon Q Console to help you investigate your AWS account activity using natural language. You can ask Amazon Q Console questions about your CloudTrail configuration, query your logged events for security investigations, and troubleshoot operational issues without writing queries or manually parsing log files.</p> \n<p>With this integration, you can ask Amazon Q Console to check whether your CloudTrail trails are properly configured, identify gaps in your logging coverage, and confirm which data event sources you are tracking. You can investigate security concerns by asking who accessed a specific IAM role, what changes were made to your VPC configuration, or whether there were unauthorized access attempts in the past week. For operational troubleshooting, you can ask Amazon Q Console to find who created or deleted specific resources, identify which API calls are generating errors, trace activity from a specific IP address, or determine why your bill spiked. Amazon Q Console can query your CloudTrail trails, associated CloudWatch log groups, and event data stores on your behalf, providing answers grounded in your actual account activity rather than generic documentation.&nbsp;</p> \n<p>This integration is available in all AWS commercial regions where Amazon Q Console is supported. To get started, open Amazon Q in AWS Management Console and ask questions about your CloudTrail configuration or account activity. For more information, visit the <a href=\"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/\">AWS CloudTrail documentation</a>.</p>"
  "8b2bdd0b9d7b33257073a247bbeb819f":
    "id": "8b2bdd0b9d7b33257073a247bbeb819f"
    "title": "Amazon Connect Customer now enables agents to bid on preferred shifts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-customer-shift-bidding/"
    "published": "2026-09-16 01:00:00"
    "fetched": "2026-09-16 04:29:26"
    "summary": "<p>Amazon Connect Customer now enables agents to bid on preferred shifts, giving them more control over their work schedules. Schedulers first establish agent ranking either by uploading a CSV file or generating a randomized ranking. Connect Customer then uses forecasted demand and shift profiles to generate available shifts and presents them to agents to rank. For example, in a Monday–Friday 6AM–10PM shift profile with 9-hour shifts, required shifts are 6AM–3PM (500 agents), 9AM–6PM (800 agents), and 1PM–10PM (600 agents). Once the bidding window closes, Connect Customer automatically assigns each agent to their highest-ranked available shift while using agent ranking as a tiebreaker. Shift bidding gives agents a structured way to influence their own schedules, while reducing the time schedulers spend on manual shift assignments, improving both agent satisfaction and scheduling efficiency.</p> \n<p>This feature is available in all&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region\">AWS Regions</a>&nbsp;where Amazon Connect Customer agent scheduling is available. To learn more about Amazon Connect Customer agent scheduling, click&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html\">here</a>.</p>"
"last_updated": "2026-09-16 04:29:26 JST"
