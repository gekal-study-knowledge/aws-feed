    "title": "AI-driven development lifecycle using Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/ai-driven-development-lifecycle-using-amazon-bedrock-agentcore/"
    "published": "2026-09-04 01:16:28"
    "fetched": "2026-09-04 01:53:17"
    "summary": "Engineering teams adopting the AI-Driven Development Lifecycle (AI-DLC) often struggle to turn concepts into working code. This post walks through two reference implementations on Amazon Bedrock AgentCore, Kiro, and Claude Code: an SQL-to-ER-diagram generator and a multi-agent code security analyzer that put the AI-DLC construction phase into practice."
  "7627a18dd8c7b918878111706eea8986":
    "id": "7627a18dd8c7b918878111706eea8986"
    "title": "Migrate agentic workloads to Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/migrate-agentic-workloads-to-amazon-bedrock-agentcore/"
    "published": "2026-09-04 01:14:12"
    "fetched": "2026-09-04 01:53:17"
    "summary": "An agent that works in a notebook is not an agent in production. This post walks through migrating a LangGraph customer support agent to Amazon Bedrock AgentCore in two stages: onto Runtime, Gateway, and Memory, then to model-driven planning on Strands Agents, retiring operational burdens along the way."
  "18d3f10803e503fc39e45a9eb8250efc":
    "id": "18d3f10803e503fc39e45a9eb8250efc"
    "title": "Integrating Outlook with Amazon Quick for AI-powered email automation"
    "link": "https://aws.amazon.com/blogs/machine-learning/integrating-outlook-with-amazon-quick-for-ai-powered-email-automation/"
    "published": "2026-09-04 01:11:57"
    "fetched": "2026-09-04 01:53:17"
    "summary": "Integrate Microsoft Outlook with Amazon Quick to automate email management, calendar scheduling, and workflow coordination. This post walks through the end-to-end setup and shows automation scenarios using Amazon Quick chat agents, Amazon Quick Flows, and Amazon Quick Automate."
  "6c26b591809fe8d8102179f1550a0366":
    "id": "6c26b591809fe8d8102179f1550a0366"
    "title": "Set up OpenAI ChatGPT Codex with LiteLLM on Amazon ECS and Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/set-up-openai-chatgpt-codex-with-litellm-on-amazon-ecs-and-amazon-bedrock/"
    "published": "2026-09-04 01:10:39"
    "fetched": "2026-09-04 01:53:17"
    "summary": "Deploy a customer-operated LiteLLM gateway on Amazon ECS with AWS Fargate, connect it to an OpenAI model on Amazon Bedrock, and configure Codex to route requests through the gateway's Responses API with scoped identities, budgets, rate limits, and telemetry. We also compare direct IAM Identity Center access and a managed Portkey deployment."
  "2a2ab1797a7792b78e02b6a343b4a1e8":
    "id": "2a2ab1797a7792b78e02b6a343b4a1e8"
    "title": "Best practices for building agentic automations with Amazon Quick Automate"
    "link": "https://aws.amazon.com/blogs/machine-learning/best-practices-for-building-agentic-automations-with-amazon-quick-automate/"
    "published": "2026-09-04 01:08:28"
    "fetched": "2026-09-04 01:53:17"
    "summary": "Learn best practices for building production-grade, agent-based business process automations with Amazon Quick Automate: choosing the right process, designing focused agents, combining them with deterministic steps, applying human-in-the-loop review, and building in evaluation and observability."
  "6132598d137ad7a329a644338296dd9e":
    "id": "6132598d137ad7a329a644338296dd9e"
    "title": "Embed Quick Sight visuals using Cognito user authentication"
    "link": "https://aws.amazon.com/blogs/machine-learning/embed-quick-sight-visuals-using-cognito-user-authentication/"
    "published": "2026-09-04 01:01:56"
    "fetched": "2026-09-04 01:53:17"
    "summary": "Learn how to embed individual Amazon Quick Sight visuals into a React application with per-user access control. This walkthrough uses Amazon Cognito authentication and a serverless AWS Lambda backend to generate scoped embed URLs, deployed with a single AWS CloudFormation stack."
