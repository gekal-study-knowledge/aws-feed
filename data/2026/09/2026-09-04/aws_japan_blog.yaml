    "title": "NatWest が Amazon Connect Customer で実現したマルチリージョンレジリエンス"
    "link": "https://aws.amazon.com/jp/blogs/news/how-natwest-built-multi-region-resilience-with-amazon-connect-customer/"
    "published": "2026-09-04 16:33:09"
    "fetched": "2026-09-04 19:29:45"
    "summary": "英国最大級の銀行 NatWest Group が Amazon Connect Customer Global Resiliency (ACGR) と Amazon Lex Global Resiliency を導入し、単一リージョンのコンタクトセンターから、完全なアクティブ-アクティブのマルチリージョンアーキテクチャに変革した事例を紹介します。20 週間の実装で RTO を 30 分超からほぼ瞬時に短縮し、3,500 人以上のエージェントと 26 の統合サービスの継続性を実現しました。"
  "7c60e0556de9c97d340b60a3e91b858a":
