    "title": "構造化されたビジネスロジックとエージェンティック AI を組み合わせ、心地よい会話体験を届ける"
    "link": "https://aws.amazon.com/jp/blogs/news/blend-structured-business-logic-with-agentic-ai/"
    "published": "2026-09-04 15:59:27"
    "fetched": "2026-09-04 19:29:45"
    "summary": "Amazon Connect Customer で一般提供が始まった agentic CX designer を使い、会話とビジネスルールを 1 つのキャンバスで扱う方法を紹介します。柔軟さが必要な部分はエージェンティック AI が担い、本人確認やクレジットの適用可否は決定論的なステップで固定します。構築からテスト、公開、最適化までの流れを追います。"
