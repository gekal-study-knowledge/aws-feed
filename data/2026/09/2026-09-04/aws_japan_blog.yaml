    "published": "2026-09-04 15:55:13"
    "fetched": "2026-09-04 19:29:45"
    "summary": "AWS Modular Data Center (MDC) は、ICD-705準拠のSCIF要件を満たし、最高機密(TS/SCI)レベルの情報も扱えるデータセンターを現地に迅速展開できるサービス。発注から設置までを6ステージで解説します。"
