    "title": "CVE-2026-85012 - OS command injection in the Amazon CodeCatalyst blueprints SDK"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-095-aws/"
    "published": "2026-09-04 02:22:43"
    "fetched": "2026-09-04 04:36:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-095-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/03/2026 10:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon CodeCatalyst blueprints are reusable project templates that generate a software project. The @amazon-codecatalyst/blueprints.blueprint npm package is the open source framework that blueprint authors build on, published from github.com/aws/codecatalyst-blueprints.</p> \n<p>We identified CVE-2026-85012 in the blueprint resynthesis framework. During resynthesis, the framework reads the .ownership-file from the existing project to determine which files a blueprint may modify. In versions before 0.3.156, the owner field of a [local] merge strategy entry in the .ownership-file was passed to an operating system command through a shell without validation. A user with permission to commit to a repository in the project could place shell metacharacters in that field and execute arbitrary commands in the environment performing resynthesis, with the privileges and credentials available to that environment.</p> \n<p>No action is required for use of the Amazon CodeCatalyst service. Resynthesis runs in an isolated per-project environment with scoped credentials, and the service applies server-side validation there that rejects [local] merge strategy commands outside a restricted allowlisted form, including for blueprint versions published before 0.3.156.</p> \n<p><b>Impacted versions:</b> &lt;= 0.3.155</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "91873a95607d1bf3201e67fe974695bf":
    "id": "91873a95607d1bf3201e67fe974695bf"
    "title": "CVE-2026-85028: Creation of Temporary File in Directory with Insecure Permissions in AWS FPGA Development Kit"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-096-aws/"
    "published": "2026-09-04 03:20:07"
    "fetched": "2026-09-04 04:36:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-096-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/03/2026 11:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The AWS FPGA Developer Kit is a hardware-software development kit that enables developers to create accelerators for the high-performance accelerator cards on EC2 F2 instances. We identified CVE-2026-85028, where a creation of a temporary file in a directory with insecure permissions in the FPGA management tool installation component in AWS FPGA Development Kit (aws-fpga) before 2.3.4 might allow local users to execute arbitrary code with root privileges via crafted shell content placed at a predictable path in a world-writable temporary directory, which the installation step reads after elevating its own privileges.</p> \n<p><b>Impacted versions:</b> &lt; 2.3.4</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
