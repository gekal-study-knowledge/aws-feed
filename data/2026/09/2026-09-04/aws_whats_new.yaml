"entries":
  "06c27dee4bd6c756c443c3120619a9fc":
    "id": "06c27dee4bd6c756c443c3120619a9fc"
    "title": "Amazon CloudFront announces API support for flat-rate pricing plans"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/cloudfront-flat-rate-pricing-plans-api/"
    "published": "2026-09-04 03:00:00"
    "fetched": "2026-09-04 04:36:40"
    "summary": "<p>Starting today, customers can subscribe and manage flat-rate pricing plans programmatically using the AWS CLI, AWS SDKs, CloudFormation, CDK, or the PricingPlanManager API.</p> \n<p>CloudFront flat-rate plans give you one monthly price covering global content delivery, WAF, DDoS, DNS, logging, and edge compute, with no usage-based overage charges regardless of traffic spikes or attacks. Previously, customers could only subscribe to flat-rate pricing plans using the console, which required manual steps when using the API or infrastructure as code (IaC) like CloudFormation to create and manage distributions. Now, customers can programmatically subscribe, upgrade, downgrade, and cancel flat-rate pricing plans using the API or IaC tools.</p> \n<p>Paid plans support an optional two-phase activation flow: you first create the plan, then approve it to begin billing. This prevents you from being committed to charges before you confirm, and makes the API well-suited for automated workflows and agents that provision infrastructure on your behalf. Free plans activate immediately and don’t require approval. To learn more, refer to the <a href=\"https://docs.aws.amazon.com/PricingPlanManager/latest/UserGuide/getting-started-pricingplanmanager-api.html\">Getting started with the PricingPlanManager API</a>. There are no additional fees for using the API to manage flat-rate pricing plans.</p>"
  "b82d9ad1b6f9e140f45ff83e0387fddd":
    "id": "b82d9ad1b6f9e140f45ff83e0387fddd"
    "title": "Introducing Amazon Quick Max: 5x the usage for power users who want the most out of Quick"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-quick-max-5x-usage-power-users/"
    "published": "2026-09-04 02:17:00"
    "fetched": "2026-09-04 04:36:40"
    "summary": "<p><a href=\"https://aws.com/quick\" target=\"_blank\"><u>Amazon Quick</u></a> now offers Quick Max, a new plan for power users who want to get the absolute most out of Quick. With 5x the usage and 5x the storage of Plus, Max gives you the room to do more: more agents, more workflows, more of whatever makes Quick yours.&nbsp;</p> \n<p>With Max, you can run large, concurrent workloads without interruption—all month long. It delivers more value per dollar the more you use it and is available with both monthly and annual billing options. &nbsp;</p> \n<p>New to Amazon Quick? You can <a href=\"https://portal.aws.amazon.com/billing/signup/service?app=AmazonQuickSuite&amp;tier=free&amp;funnel=boost#/validation\" target=\"_blank\"><u>sign up for free in minutes</u></a>. Already on Plus? Click your name at the bottom of the left navigation bar, then select \"Upgrade plan\" to switch to Max. To compare all available plans—Free, Plus, and Max—visit the <a href=\"https://aws.amazon.com/quick/pricing/\" target=\"_blank\"><u>Amazon Quick pricing page</u></a>.&nbsp;</p>"
  "6ada09d777e4a1de379c28b8340d3516":
    "id": "6ada09d777e4a1de379c28b8340d3516"
    "title": "Amazon WorkSpaces Applications adds support for NVIDIA Blackwell GPU instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-workspaces-applications-nvidia-blackwell-gpu-instances/"
    "published": "2026-09-04 02:00:00"
    "fetched": "2026-09-04 04:36:40"
    "summary": "<p>Amazon WorkSpaces Applications now supports Graphics G7 instances, powered by NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs and Intel Xeon Scalable (6th Gen) processors. G7 instances deliver up to 2.1× better performance for graphics-intensive workloads compared to previous generation G6 instances.</p> \n<p>With Graphics G7, customers can stream demanding professional applications such as CAD/CAM, 3D rendering, scientific visualization, video editing, and AI-assisted design workflows at higher fidelity and frame rates. G7 instances feature 32 GB of GDDR7 GPU memory per GPU and 2.67× faster memory bandwidth, enabling streaming of larger, more complex 3D scenes and models. Six instance sizes are available, with 1 to 8 GPUs, vCPUs ranging from 8 to 192, and system memory from 32 GB to 768 GB.</p> \n<p>Graphics G7 instances are available in US East (N. Virginia), US East (Ohio), and US West (Oregon). Additional regions will be added as availability expands.</p> \n<p>To get started, select a Graphics G7 instance when launching an image builder or creating a new fleet in the <a href=\"https://aws.amazon.com/console/\">Amazon WorkSpaces Applications console</a>. For more information on available instance types, see <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/instance-types.html\">WorkSpaces Applications Instance Families</a>. To learn more about G7 GPU capabilities, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\">EC2 G7 Instance Types page</a>. For pricing details, see <a href=\"https://aws.amazon.com/workspaces/applications/pricing/\">Amazon WorkSpaces Applications Pricing</a>.</p>"
  "e44cffbd4c9748e7f157cfb2deb23901":
    "id": "e44cffbd4c9748e7f157cfb2deb23901"
    "title": "Amazon MWAA adds built-in monitoring with Amazon CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-mwaa-cloudwatch-monitoring/"
    "published": "2026-09-04 00:00:00"
    "fetched": "2026-09-04 04:36:40"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) now includes a built-in monitoring experience on the environment detail page in the <a href=\"https://console.aws.amazon.com/mwaa/home\">AWS Management Console</a>. A new metrics dashboard displays key Amazon CloudWatch metrics for your environment in one place, and each graph includes an optional toggle to overlay suggested warning ranges, helping you quickly identify conditions that may affect your environment's health and performance.</p> \n<p>The environment detail page also now shows an alarms table that lists all Amazon CloudWatch alarms associated with your MWAA environment. You can use the one-click Create Recommended Alarms action to provision a curated set of alarms from an AWS-managed template, so you can start monitoring critical metrics without having to configure each alarm manually. This feature is available for Amazon MWAA Provisioned environments in all regions where <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon MWAA is available</a>. Standard Amazon CloudWatch pricing applies for metric queries and alarms.</p> \n<p>To get started, open the <a href=\"https://console.aws.amazon.com/mwaa/home\">AWS Management Console</a>, review the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon MWAA supported regions</a>, or visit the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/monitoring-dashboard.html\">Amazon MWAA documentation</a> to learn more.</p> \n<p>&nbsp;</p>"
  "c6f75c31f97c6c759fd6a82d017a2383":
    "id": "c6f75c31f97c6c759fd6a82d017a2383"
    "title": "AWS Gateway Load Balancer now supports TCP Reset for faster failure recovery"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-gateway-load-balancer-tcp-reset/"
    "published": "2026-09-04 02:00:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>A<b></b>WS Gateway Load Balancer (GWLB) now supports sending TCP Reset (RST) packets when a target becomes unhealthy, is deregistered, or when a flow's idle timeout expires. This feature helps reduce traffic interruptions from minutes to seconds by enabling TCP endpoints to quickly detect failed connections and establish new TCP flows through healthy targets.<br /> <br /> Previously, when a GWLB target failed, existing TCP connections would continue to be forwarded to the unhealthy target (aka fail-open behavior). Client and server applications could experience interruptions lasting several minutes due to TCP retry and exponential back-off mechanisms built in the TCP stacks of clients or servers. When this capability is enabled, GWLB sends TCP Resets in response to the incoming traffic, indicating to the sender that a TCP connection is no longer viable. This allows TCP endpoints to recover in quickly.<br /> <br /> TCP Reset is not enabled by default to ensure backward compatibility. You can enable it per target group using the AWS Management Console, AWS CLI, or API. Three triggers are supported independently for generating TCP Reset: target becomes unhealthy, target deregistration (after connection draining), and TCP idle timeout expiry.<br /> <br /> This feature is available for all new and existing Gateway Load Balancers in all AWS Regions where GWLB is available. There is no additional charge for using this feature.<br /> <br /> To learn more, visit this <a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/reduce-traffic-interruptions-with-gateway-load-balancer-tcp-reset/\">AWS blog</a><i>,</i><b><i> </i></b>and GWLB User Guide <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/edit-target-group-attributes.html#send-tcp-reset-target-failover\">here</a> and <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/gateway-listeners.html#listener-attributes\">here</a>.&nbsp;</p>"
  "cc4d44ac8f2b8bf1b7eba1936e831d39":
    "id": "cc4d44ac8f2b8bf1b7eba1936e831d39"
    "title": "Amazon Redshift rg.large instances now support single-node clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/redshift-rg-large-single-node"
    "published": "2026-09-04 01:03:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>Amazon Redshift rg.large instances, powered by AWS Graviton processors, now support single-node clusters. Single-node support for rg.large clusters is available on P204 or later patch versions. Customers can now create a single-node rg.large cluster for smaller workloads that do not require high availability, offering a cost-effective option to conduct proofs of concept and tests quickly.</p> \n<p>RG instances deliver up to 2.4x faster performance running data warehouse and data lake workloads when compared to previous generation RA3 instances, at 30% lower price per vCPU. RG instances include Redshift's custom-built vectorized data lake query engine that processes Apache Iceberg and Parquet data on your cluster nodes, turning on SQL analytics across your data warehouse and data lake using a single engine.</p> \n<p>These RG instances are available in the following AWS Regions: Africa (Cape Town), Asia Pacific (Hong Kong), Asia Pacific (Tokyo), Asia Pacific (Seoul), Asia Pacific (Osaka), Asia Pacific (Mumbai), Asia Pacific (Hyderabad), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Jakarta), Asia Pacific (Melbourne), Asia Pacific (Malaysia), Asia Pacific (Taipei), Asia Pacific (Thailand), Canada (Central), Europe (Frankfurt), Europe (Stockholm), Europe (Spain), Europe (Ireland), Europe (London), Europe (Paris), South America (São Paulo), US East (N. Virginia), US East (Ohio), US West (N. California), US West (Oregon), AWS GovCloud (US-East), AWS GovCloud (US-West) and Mexico (Central).</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-rg-nodes-table\">Amazon Redshift RG Instance Documentation</a>, the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-considerations.html#rs-upgrading-to-ra3\">RA3 to RG Upgrade Guide</a>, and the <a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a>.</p>"
  "bf69e129ee696aac8eae2797700fbf4e":
    "id": "bf69e129ee696aac8eae2797700fbf4e"
    "title": "Amazon Aurora MySQL 8.4.8 (compatible with MySQL 8.4.8) is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-aurora-mysql-848-available/"
    "published": "2026-09-04 01:01:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>Starting today, Amazon Aurora MySQL-Compatible Edition 8.4 will support MySQL 8.4.8. In addition to several security enhancements and bug fixes, Aurora MySQL 8.4.8 includes several improvements, such as support for post-quantum TLS (PQ-TLS) key exchange, transaction timeout, multi-source replication, and delayed replication. PQ-TLS provides you with post-quantum cryptography options for encrypting your data in-transit. Transaction timeout helps prevent performance issues caused by long-running transactions blocking innoDB purge.</p> \n<p>Multi-source replication allows consolidation of data from multiple sources into a single replica to enable critical use-cases, such as merging shards, reporting, and backups. Delayed replication lets you set a configurable replication lag to protect against accidental data loss. To learn more about these replication features, please refer to the <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-aurora-mysql-multisourcerep-delayedrep/\" rel=\"noopener noreferrer\" target=\"_blank\">launch announcement</a>. For more details, refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraMySQLReleaseNotes/AuroraMySQL.Updates.84Updates.html\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora MySQL 8.4</a> and <a href=\"https://dev.mysql.com/doc/relnotes/mysql/8.4/en/news-8-4-8.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL 8.4.8</a> release notes.</p> \n<p>You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Updates.AMVU.html\" rel=\"noopener noreferrer\" target=\"_blank\">automatic minor version upgrades</a> and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate upgrades across your clusters in phases. You can perform minor version upgrades in-place or via snapshot restore. This release is supported in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.RegionsAndAvailabilityZones.html#Aurora.Overview.Availability.MySQL\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora MySQL is available.</p> \n<p><a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> is designed for high performance and availability at global scale with full MySQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at Aurora’s <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
  "50efcbfffde8d78a4e24f930743d1523":
    "id": "50efcbfffde8d78a4e24f930743d1523"
    "title": "Amazon Aurora MySQL now supports multi-source replication and delayed replication"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-aurora-mysql-multisourcerep-delayedrep/"
    "published": "2026-09-04 01:00:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>Starting today, Amazon Aurora MySQL supports two new replication capabilities: multi-source replication and delayed replication. Multi-source replication lets a single Aurora MySQL cluster replicate from multiple source databases at the same time, making it easier to consolidate data from separate MySQL databases. This enables critical use-cases, such as merging shards or aggregating data from separate databases (e.g. regional or departmental instances) into a central location for operational workflows, such as reporting and backups. To learn more, please refer to the <a href=\"https://dev.mysql.com/doc/refman/8.4/en/replication-multi-source.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL multi-source replication documentation</a>.<br /> <br /> Delayed replication lets you configure a binlog replica to intentionally lag behind its source by a set period of time, giving you a simple safeguard against human error and logical data corruption. If a harmful change is made on the source, you can recover quickly by stopping replication to the replica before the change is applied and promoting it, without performing a full database restore. A delayed replica also provides a convenient fallback during upgrades and a way to inspect an earlier state of your data. To learn more, please refer to the <a href=\"https://dev.mysql.com/doc/refman/8.4/en/replication-delayed.html\" rel=\"noopener noreferrer\" target=\"_blank\">MySQL delayed replication documentation</a>.<br /> <br /> Together, these capabilities give you greater flexibility and stronger data protection when replicating into Aurora MySQL. Multi-source replication and Delayed replication are supported on Aurora MySQL version 8.4.8 and higher, in all <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.RegionsAndAvailabilityZones.html#Aurora.Overview.Availability.MySQL\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a> where Aurora MySQL is available. For additional information on Aurora MySQL disaster recovery, see the <a href=\"https://docs.aws.amazon.com/solutions/disaster-recovery-using-amazon-aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">guidance from our solutions library</a>. To learn more, please refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraMySQLReleaseNotes/AuroraMySQL.Updates.84Updates.html\" rel=\"noopener noreferrer\" target=\"_blank\">Aurora MySQL 8.4</a> release notes.<br /> <br /> <a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora</a> is designed for high performance and availability at global scale with full MySQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at Aurora’s <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.&nbsp;</p>"
  "42d508d9bfbb0c248ebc5e8f764646df":
    "id": "42d508d9bfbb0c248ebc5e8f764646df"
    "title": "Amazon SageMaker Unified Studio Workflows support Python and Bash operators"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/sagemaker-workflows-python-bash/"
    "published": "2026-09-04 00:00:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p>Amazon SageMaker Unified Studio Workflows now supports PythonOperator and BashOperator, enabling you to run custom Python functions and shell commands directly in your serverless workflows without provisioning separate compute resources. This eliminates the need to offload custom logic to Lambda or ECS for tasks like data transformations or shell script execution.</p>\n<p>To get started, open a serverless visual workflow in your SageMaker Unified Studio project, search for PythonOperator or BashOperator in the task panel, and drag the node onto your canvas. Provide your Python or shell script files through the workflow settings, then point each operator to the function or command in your scripts. For example, configure PythonOperator to call a data transformation function or set BashOperator to run a shell command, all without leaving the visual canvas.</p>\n<p>This feature is available in all AWS Regions where Amazon SageMaker Unified Studio is available. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">Supported Regions for Amazon SageMaker Unified Studio</a>.</p>\n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/operators.html\">Supported operators for Amazon MWAA Serverless workflows</a>. To get started, see <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/serverless-visual-workflows.html\">Serverless visual workflows</a> in the Amazon SageMaker Unified Studio User Guide.</p>"
  "581ad1e121fcf9665c3e084d99ab43c1":
    "id": "581ad1e121fcf9665c3e084d99ab43c1"
    "title": "Amazon ECS Managed Daemons now support non-critical daemons"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ecs-managed-daemons-non-critical/"
    "published": "2026-09-04 07:01:00"
    "fetched": "2026-09-04 09:41:43"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html\">Amazon Elastic Container Service</a> (Amazon ECS) now support non-critical Managed Daemons for <a href=\"https://aws.amazon.com/ecs/managed-instances/\">ECS Managed Instances</a>. You can configure a daemon as non-critical so that your mission-critical application tasks continue running uninterrupted, even when a daemon fails, stops, or becomes unhealthy.</p> \n<p>Amazon ECS Managed Daemons lets you centrally deploy and manage software agents independently of application deployments to ensure consistent coverage and compliance across your container infrastructure. For some mission-critical applications, uninterrupted execution of application tasks may matter more than auxiliary daemon functionality like logging or metrics collection. With this launch, you can now configure a managed daemon as non-critical so that its failure does not cause your application tasks to churn. When a non-critical daemon task fails, stops, or becomes unhealthy, the container instance remains active, your existing application tasks continue running uninterrupted, ECS continues placing new application tasks on it, and instance registration is never blocked, so your tasks launch immediately even when the daemon fails to start. Amazon ECS emits an EventBridge event when a daemon task fails to start and records service action logs for both critical and non-critical daemons, giving you full observability into daemon health.</p> \n<p>To get started, you can use AWS Console, CLI, CloudFormation, or AWS SDKs to create a non-critical daemon by setting the critical parameter to false when creating or updating a daemon. Non-critical daemons are available in all AWS Regions where Amazon ECS Managed Daemons are supported. To learn more, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-daemons.html#managed-daemons-criticality\">documentation</a> page.</p>"
  "d77069cb42a2cdc8b21b9254b3da0929":
    "id": "d77069cb42a2cdc8b21b9254b3da0929"
    "title": "Amazon EC2 P6-B200 instances are now available in the AWS Asia Pacific (Hyderabad) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ec2-p6-b200-instances-available-asia-pacific-hyderabad"
    "published": "2026-09-04 04:14:00"
    "fetched": "2026-09-04 14:25:18"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) P6-B200 instances accelerated by NVIDIA Blackwell GPUs are available in the AWS Asia Pacific (Hyderabad) Region. These instances offer up to 2x performance compared to P5en instances for AI training and inference.</p> \n<p>P6-B200 instances feature 8 Blackwell GPUs with 1440 GB of high-bandwidth GPU memory and a 60% increase in GPU memory bandwidth compared to P5en, 5th Generation Intel Xeon processors (Emerald Rapids), and up to 3.2 terabits per second of Elastic Fabric Adapter (EFAv4) networking. P6-B200 instances are powered by the AWS Nitro System, so you can reliably and securely scale AI workloads within Amazon EC2 UltraClusters to tens of thousands of GPUs.</p> \n<p>P6-B200 instances are now available in p6-b200.48xlarge size in the following AWS Regions: US West (Oregon), US East (N. Virginia, Ohio), AWS GovCloud (US-West, US-East), and Asia Pacific (Hyderabad, Mumbai) Regions. To learn more about P6-B200 instances, visit <a href=\"https://aws.amazon.com/ec2/instance-types/p6/\" target=\"_blank\">Amazon EC2 P6 instances.</a></p>"
  "3abc49099dd4a0389763de809f6594f1":
    "id": "3abc49099dd4a0389763de809f6594f1"
    "title": "Amazon EC2 P6-B300 instances are now available in the AWS Asia Pacific (Jakarta) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ec2-p6-b300-instances-available-asia-pacific-jakarta"
    "published": "2026-09-04 04:03:00"
    "fetched": "2026-09-04 14:25:18"
    "summary": "<p>Starting today, Amazon Elastic Cloud Compute (Amazon EC2) P6-B300 instances are available in the AWS Asia Pacific (Jakarta) Region. P6-B300 instances provide 8xNVIDIA Blackwell Ultra GPUs with 2.1 TB high bandwidth GPU memory, 6.4 Tbps EFA networking, 300 Gbps dedicated ENA throughput, and 4 TB of system memory.</p> \n<p>P6-B300 instances deliver 2x networking bandwidth, 1.5x GPU memory size, and 1.5x GPU TFLOPS (at FP4, without sparsity) compared to P6-B200 instances, making them well suited to train and deploy large trillion-parameter foundation models (FMs) including large language models (LLMs) with sophisticated techniques. The higher networking and larger memory deliver faster training times and more token throughput for AI workloads.</p> \n<p>P6-B300 instances are now available in p6-b300.48xlarge size in the following AWS Regions: US West (Oregon), AWS GovCloud (US-East), US East (N. Virginia), Asia Pacific (Hyderabad, Jakarta, Seoul), and South America (Sao Paulo) Regions. To learn more about P6-B300 instances, visit <a href=\"https://aws.amazon.com/ec2/instance-types/p6/\" target=\"_blank\">Amazon EC2 P6 instances.</a></p>"
  "76e487d54d38b49651aad7a3b1da01ad":
    "id": "76e487d54d38b49651aad7a3b1da01ad"
    "title": "Amazon EC2 C8g instances now available in additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ec2-c8g-instances-additional-regions/"
    "published": "2026-09-04 23:06:00"
    "fetched": "2026-09-05 03:01:53"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8g instances are available in AWS Asia Pacific (Taipei, New Zealand), and&nbsp;AWS GovCloud (US-East) regions. These instances are powered by AWS Graviton4 processors and deliver up to 30% better performance compared to AWS Graviton3-based instances. Amazon EC2 C8g instances are built for compute-intensive workloads, such as high performance computing (HPC), batch processing, gaming, video encoding, scientific modeling, distributed analytics, CPU-based machine learning (ML) inference, and ad serving. These instances are built on the <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a>, which oﬄoads CPU virtualization, storage, and networking functions to dedicated hardware and software to enhance the performance and security of your workloads.<br /> <br /> AWS Graviton4-based Amazon EC2 instances deliver the best performance and energy efficiency for a broad range of workloads running on Amazon EC2. These instances offer larger instance sizes with up to 3x more vCPUs and memory compared to Graviton3-based Amazon C7g instances. AWS Graviton4 processors are up to 40% faster for databases, 30% faster for web applications, and 45% faster for large Java applications than AWS Graviton3 processors. C8g instances are available in 12 different instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block Store (Amazon EBS).<br /> <br /> To learn more, see <a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\">Amazon EC2 C8g Instances</a>. To explore how to migrate your workloads to Graviton-based instances, see <a href=\"https://aws.amazon.com/ec2/graviton/fast-start/\">AWS Graviton Fast Start program</a> and <a href=\"https://github.com/aws/porting-advisor-for-graviton\">Porting Advisor for Graviton</a>.&nbsp;To get started, see the <a href=\"https://console.aws.amazon.com/\">AWS Management Console</a>.</p>"
  "476f328a08d8b1d8596b271ca374d933":
    "id": "476f328a08d8b1d8596b271ca374d933"
    "title": "AWS Transfer Family SFTP Connectors now support continuing file transfers during credential rotation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/transfer-family-sftp-credential-rotation/"
    "published": "2026-09-04 17:00:00"
    "fetched": "2026-09-05 03:01:53"
    "summary": "<p>AWS Transfer Family SFTP Connectors now continue running file transfers while you rotate the credentials used to authenticate with remote SFTP servers. You no longer need to update the connector to point to a new secret version each time a credential rotates, removing a manual step and helping avoid failed transfers during the rotation window.</p> \n<p>Connectors can now retrieve credentials from an ordered list of AWS Secrets Manager version stages, such as the current and previous versions, during authentication. The connector automatically tries each version in the order you specify and proceeds with the first that succeeds, so transfers continue uninterrupted as credentials are rotated on either side. You configure this when you create or update a connector, and the connector's credentials must be stored in AWS Secrets Manager.</p> \n<p>Support for continuing transfers during credential rotation is available in all AWS Regions where AWS Transfer Family SFTP Connectors are supported. To learn more, visit the <a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transfer Family User Guide</a>. Get started with AWS Transfer Family in the <a href=\"https://console.aws.amazon.com/transfer/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transfer Family console</a>.</p>"
  "7670c58fe450e1a57c5154d344a01ea0":
    "id": "7670c58fe450e1a57c5154d344a01ea0"
    "title": "Amazon EC2 C9g and C9gd instances are now available in Asia Pacific (Tokyo) region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-c9g-c9gd-asia-pacific-tokyo/"
    "published": "2026-09-04 08:00:00"
    "fetched": "2026-09-05 03:01:53"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C9g and C9gd instances, powered by AWS Graviton5 processors, are available in the Asia Pacific (Tokyo) region. AWS Graviton5 processors are the fifth generation of custom-designed CPUs, delivering the best price performance for compute-intensive workloads running on Amazon EC2.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">C9g and C9gd instances</a> deliver up to 25% better compute performance compared to AWS Graviton4-based C8g and C8gd instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>C9g instances are ideal for workloads such as high-performance computing (HPC), batch processing, gaming, video encoding, scientific modeling, distributed analytics, CPU-based machine learning (ML) inference, real time analytics, and ad serving. C9gd instances offer local NVMe-based SSD block-level storage for customers running compute-intensive workloads that also require high-speed, low-latency local storage for scratch space, temporary files, and caches.</p> \n<p>C9g and C9gd instances are available for purchase in Asia Pacific (Tokyo) via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/c9g/\">get started today.</a></p>"
  "6974444a5532deb5b0f96d4f8a49a325":
    "id": "6974444a5532deb5b0f96d4f8a49a325"
    "title": "Amazon EC2 M9g and M9gd instances are now available in four additional regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-m9g-m9gd-four-regions/"
    "published": "2026-09-04 06:00:00"
    "fetched": "2026-09-05 03:01:53"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M9g and M9gd instances, powered by AWS Graviton5 processors, are available in Europe (Ireland) and Asia Pacific (Singapore, Sydney, Tokyo) regions. AWS Graviton5 processors are the fifth generation of custom-designed CPUs, delivering the best price performance for memory-intensive workloads running on Amazon EC2.</p> \n<p><a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">M9g and M9gd instances</a> deliver up to 25% better performance compared to AWS Graviton4-based M8g and M8gd instances. They are up to 30% faster for databases. These instances are built on the sixth-generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>M9g instances are ideal for workloads such as open-source databases, in-memory caches, big data analytics, and memory-intensive applications. M9gd instances offer local NVMe-based SSD block-level storage for customers running memory-intensive workloads that also require high-speed, low-latency local storage for scratch space, temporary files, and caches.</p> \n<p>M9g and M9gd instances are available for purchase in these four regions via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts. <a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/m9g/\">get started today.</a></p>"
  "f0fd003d56245c3cc365d3bcf3793014":
    "id": "f0fd003d56245c3cc365d3bcf3793014"
    "title": "Amazon SageMaker AI Batch Transform now supports G6e instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/sagemaker-batch-transform-g6e-instances/"
    "published": "2026-09-04 17:00:00"
    "fetched": "2026-09-05 06:11:39"
    "summary": "<p>Amazon SageMaker AI now supports <a href=\"https://aws.amazon.com/ec2/instance-types/g6e/\">Amazon EC2 G6e instances</a> for batch transform. Batch Transform enables you to run predictions on datasets stored in Amazon S3 and is suited for large datasets that do not require a persistent inference endpoint.</p>\n<p>Amazon EC2 G6e instances are powered by up to eight NVIDIA L40S Tensor Core GPUs with 48 GB of memory per GPU and third-generation AMD EPYC processors. G6e instances deliver improved performance for GPU-intensive workloads. With this launch, you can use G6e instances for GPU-intensive offline inference workloads, including large language models and diffusion models that generate images, video, and audio. To get started, select a supported ml.g6e instance type when creating a Batch Transform job through AWS SDKs, AWS CLI, or the CreateTransformJob API.</p>\n<p>G6e support for Batch Transform is available in US East (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), and Asia Pacific (Hyderabad). To learn more, visit the <a href=\"https://aws.amazon.com/sagemaker/ai/deploy/\">Amazon SageMaker AI</a> product page and see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform.html\">Batch Transform documentation</a>. For pricing information on these instances, please visit our <a href=\"https://aws.amazon.com/sagemaker/ai/pricing/?refid=ft_sagemaker\">pricing page</a>.</p>"
"last_updated": "2026-09-05 06:11:39 JST"
