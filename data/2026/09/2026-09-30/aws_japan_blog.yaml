    "title": "【開催報告】組み込みソフトウェア開発でも AI エージェントは活用できる ─ 日立産業制御ソリューションズ様とのワークショップ"
    "link": "https://aws.amazon.com/jp/blogs/news/hiics-ai-sdlc-workshop/"
    "published": "2026-09-30 09:00:45"
    "fetched": "2026-09-30 10:00:20"
    "summary": "長期にわたって保守される組み込みソフトウェアの開発でも、AI エージェントは活用できます。2026 年 7 月、日立産業制御ソリューションズ様向けに、既存コードの読み解きから仕様化、実装、テストまでを Kiro で体験するハンズオンワークショップを 2 回開催し、102 名のエンジニアにご参加いただいた開催報告です。"
  "d05054ee0438fbd23346657351ac2469":
    "id": "d05054ee0438fbd23346657351ac2469"
    "title": "Amazon Bedrock の自動推論チェックによる信頼できる AI システムの構築 – パート 1"
    "link": "https://aws.amazon.com/jp/blogs/news/build-reliable-ai-systems-with-automated-reasoning-on-amazon-bedrock-part-1/"
    "published": "2026-09-30 16:49:17"
    "fetched": "2026-09-30 16:53:02"
    "summary": "規制産業では、AI 応答が定められたポリシーに準拠していることを、数学的な確実性をもって示すことが求められます。2 部構成の第 1 部となる本記事では、形式的検証の技術によって生成 AI の出力を検証する Amazon Bedrock Guardrails の自動推論チェックについて、その技術的な基礎を解説します。7 種類の検出結果タイプ、シナリオ生成やテスト管理などの新機能に加え、病院再入院リスク評価を例に、自然言語のドキュメントからのポリシー作成、テストによる検証、注釈を用いたポリシー改善、ガードレールへの統合までを実装手順とともに紹介します。"
"last_updated": "2026-09-30 16:53:02 JST"
