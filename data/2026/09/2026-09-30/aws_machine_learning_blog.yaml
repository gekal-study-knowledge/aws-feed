    "title": "Prompt engineering fundamentals for Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/prompt-engineering-fundamentals-for-amazon-quick/"
    "published": "2026-09-30 01:27:57"
    "fetched": "2026-09-30 01:46:15"
    "summary": "Prompt engineering in Amazon Quick shapes how accurately its AI-powered features respond to your requests. Part 1 of a two-part series covers the foundational principles and reusable frameworks (specificity, context-setting, few-shot examples, and the CRISPE framework) for consistent, high-quality results across Amazon Quick."
  "75a6c2ece477d3532347126065d73ebe":
    "id": "75a6c2ece477d3532347126065d73ebe"
    "title": "Prompt engineering by Quick component: Patterns and pitfalls"
    "link": "https://aws.amazon.com/blogs/machine-learning/prompt-engineering-by-quick-component-patterns-and-pitfalls/"
    "published": "2026-09-30 01:27:33"
    "fetched": "2026-09-30 01:46:15"
    "summary": "Part 2 of our Amazon Quick prompt engineering series goes component by component. Learn the prompt patterns that get the best results from Amazon Quick Research, Quick Flows, Quick Sight, chat agents, and action integrations, plus the common pitfalls to avoid."
  "c65d1af236db3e5e0784bf5043643c6a":
    "id": "c65d1af236db3e5e0784bf5043643c6a"
    "title": "Building an AI-powered contract intelligence platform with Amazon Quick and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/building-an-ai-powered-contract-intelligence-platform-with-amazon-quick-and-amazon-bedrock-agentcore/"
    "published": "2026-09-30 01:14:24"
    "fetched": "2026-09-30 01:46:15"
    "summary": "Manually extracting data from hundreds of vendor contracts doesn't scale, and RAG chat tools fall short on portfolio-wide questions. This post shares a contract intelligence platform on AWS that uses AI agents to extract and verify contract fields, then answers aggregate and single-contract questions through Amazon Quick analytics."
  "773d3471bc7f82e507524da52292b46a":
    "id": "773d3471bc7f82e507524da52292b46a"
    "title": "How Condé Nast built multimodal video discovery with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-conde-nast-built-multimodal-video-discovery-with-amazon-bedrock/"
    "published": "2026-09-30 00:55:17"
    "fetched": "2026-09-30 01:46:15"
    "summary": "Condé Nast's editorial teams spent an average of 250 minutes per task searching a library of more than 140,000 videos using only titles and descriptions. Working with the AWS Generative AI Innovation Center, they built a multimodal video discovery solution on Amazon Bedrock and Amazon OpenSearch Service that cut discovery time to under 2 minutes."
  "6e9419017e8dae89ce3512497d8c720a":
    "id": "6e9419017e8dae89ce3512497d8c720a"
    "title": "Bring near-Astra intelligence to everyday work with GPT-6.1 Sol on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/bring-near-astra-intelligence-to-everyday-work-with-gpt-6-1-sol-on-amazon-bedrock/"
    "published": "2026-09-30 04:34:14"
    "fetched": "2026-09-30 06:14:52"
    "summary": "GPT-6.1 Sol is now generally available on Amazon Bedrock, bringing stronger reasoning to coding, computer use, and professional workloads that run frequently."
  "dbde2e73dbe1ab02e53b42953db0350c":
    "id": "dbde2e73dbe1ab02e53b42953db0350c"
    "title": "Amazon Bedrock expands Claude model availability to in-country inferencing in India"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-bedrock-expands-claude-model-availability-to-india-cross-region-inference/"
    "published": "2026-09-30 10:13:14"
    "fetched": "2026-09-30 16:53:03"
    "summary": "Anthropic's Claude Opus 5, Claude Sonnet 5, and Claude Haiku 4.5 are now available in India through Amazon Bedrock geographic cross-Region inference. You can access these models while processing data within the India Regions, and get started from the Amazon Bedrock console or with the Messages, InvokeModel, and Converse APIs."
  "7f378d52eb3ead9da28d3de6d867734e":
    "id": "7f378d52eb3ead9da28d3de6d867734e"
    "title": "Introducing Anthropic models on Amazon Bedrock for in-region inference in Seoul and Singapore"
    "link": "https://aws.amazon.com/blogs/machine-learning/introducing-anthropic-models-on-amazon-bedrock-for-in-region-inference-in-seoul-and-singapore/"
    "published": "2026-09-30 10:13:12"
    "fetched": "2026-09-30 16:53:03"
    "summary": "Amazon Bedrock now supports Anthropic's Claude Opus 5 and Claude Sonnet 5 with in-region inference in Seoul, and Claude Sonnet 5 in Singapore. If you have local data processing requirements in South Korea or Singapore, you can now use these Anthropic models at scale, with inference processed entirely within the Region you call."
"last_updated": "2026-09-30 16:53:03 JST"
