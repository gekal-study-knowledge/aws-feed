"entries":
  "a6bee516bf4869ffac9ec7f4b743243c":
    "id": "a6bee516bf4869ffac9ec7f4b743243c"
    "title": "OpenAI GPT-6.1 Sol is now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-1-sol-on-amazon-bedrock/"
    "published": "2026-09-30 05:17:00"
    "fetched": "2026-09-30 06:14:49"
    "summary": "<p>Today, AWS announces the general availability of GPT-6.1 Sol from OpenAI on Amazon Bedrock. An upgrade to GPT-6 Sol, GPT-6.1 Sol delivers exceptionally strong performance on agentic coding, computer use, and professional work. According to OpenAI, it approaches GPT-6 Astra across demanding evaluations at roughly one-fifth of the cost, giving developers more room to build and run capable agents at scale.&nbsp;The Amazon Bedrock inference engine delivers the performance, security, and reliability required for production workloads.</p>\n<p>Use GPT-6.1 Sol to build features, debug issues, iterate on solutions, carry out multistep workflows, and investigate complex codebases. It also supports explicit prompt caching on Amazon Bedrock, making it practical for agentic workloads that reuse context across repeated requests. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.</p>\n<p>You can get started in the<a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\"> Amazon Bedrock documentation</a>. To learn more, <a href=\"https://aws.amazon.com/blogs/machine-learning/bring-near-astra-intelligence-to-everyday-work-with-gpt-6-1-sol-on-amazon-bedrock/\">read the blog.</a>&nbsp;</p>"
  "f3fd190d06aa5b03bdc6a0637066ca6e":
    "id": "f3fd190d06aa5b03bdc6a0637066ca6e"
    "title": "Amazon Connect Customer now lets business users manage more reference data to adjust contact center configurations in real time"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-manage-data-tables/"
    "published": "2026-09-30 02:00:00"
    "fetched": "2026-09-30 06:14:49"
    "summary": "<p>Amazon Connect Customer now lets administrators store more of the reference data that drives their contact center configurations. Administrators can now use data tables to hold up to 20,000 values per table for defining configurations such as operating hours, escalation rules, AI agent prompts or queue assignments that drive contact flows. Administrators can now also export tables, edit hundreds of records, move tables between Connect Customer instances, or load reference data from external systems using tools and sources such as Excel and DynamoDB. Business teams can keep this data current themselves, adjusting their contact center configurations as conditions change without depending on technical resources.</p>\n<p>This feature is available in all AWS commercial and AWS GovCloud (US-West)&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\" rel=\"noopener noreferrer\" target=\"_blank\">regions</a>&nbsp;where Amazon Connect Customer is offered. To learn more, see&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/data-tables.html\" rel=\"noopener noreferrer\" target=\"_blank\">Create and configure data tables</a>&nbsp;in the Amazon Connect Administrator Guide. To learn more about Amazon Connect, visit the&nbsp;<a href=\"https://aws.amazon.com/products/connect/customer/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Connect Customer website&nbsp;</a>.</p>"
  "a1d0ee01db3d28433d25a9738f4f2976":
    "id": "a1d0ee01db3d28433d25a9738f4f2976"
    "title": "Amazon RDS for PostgreSQL announces Extended Support minor versions 13.23-rds.20260514, 12.22-rds.20260514 and 11.22-rds.20260514"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-postgresql-extended-support/"
    "published": "2026-09-30 01:00:00"
    "fetched": "2026-09-30 06:14:49"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/postgresql/\">Amazon Relational Database Service (RDS) for PostgreSQL</a> announces Amazon RDS Extended Support minor versions 13.23-rds.20260514, 12.22-rds.20260514, and 11.22-rds.20260514.</p>\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\">Amazon RDS Extended Support</a> provides up to three additional years of fixes for critical Common Vulnerabilities and Exposures (CVE) and bugs beyond a major version's end of standard support date, giving you more time to upgrade to a new major version.</p>\n<p>You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. Learn more about performing version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.PostgreSQL.html\">Amazon RDS for PostgreSQL User Guide</a>.&nbsp;</p>\n<p>Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (AWS CLI).</p>"
  "b4c13a31ab7e7a90e308fb3fa666db58":
    "id": "b4c13a31ab7e7a90e308fb3fa666db58"
    "title": "Amazon Aurora now supports PostgreSQL 18.6, 17.11, 16.15, 15.19, 14.24"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-aurora-postgresql-18-6-17-11-16-15-15-19-14-24/"
    "published": "2026-09-30 01:00:00"
    "fetched": "2026-09-30 06:14:49"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Aurora PostgreSQL-Compatible Edition</a> now supports PostgreSQL versions 18.6, 17.11, 16.15, 15.19, and 14.24, which include bug fixes from the PostgreSQL community and Aurora-specific enhancements. We recommend upgrading to the latest minor versions to benefit from these improvements and address Common Vulnerabilities and Exposures (CVEs), as detailed in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/AuroraPostgreSQL.Updates.html\" rel=\"noopener noreferrer\" target=\"_blank\">release notes</a>.\n <br />\n <br />\n You can upgrade your databases during scheduled maintenance windows using automatic minor version upgrades. To simplify operations at scale, enable automatic minor version upgrades and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Maintenance.AMVU.UpgradeRollout.html\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate multiple upgrades in phases, validating on lower-priority environments before upgrading your most critical ones. For more information, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/USER_UpgradeDBInstance.PostgreSQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrading Amazon Aurora PostgreSQL DB clusters</a>.</p>\n<p>Amazon Aurora is designed for high performance and availability at global scale with full PostgreSQL compatibility. It provides scale-to-zero serverless compute, Aurora Global Database for multi-Region resilience, Aurora I/O-Optimized for improved price performance on I/O-intensive workloads, and built-in security and continuous backups. To get started, take a look at our <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_GettingStartedAurora.html\" rel=\"noopener noreferrer\" target=\"_blank\">getting started page</a>.</p>"
  "1c2ade7bb5ae7dea46a8380a10d82594":
    "id": "1c2ade7bb5ae7dea46a8380a10d82594"
    "title": "Amazon RDS now adds full snapshot size information to the Console and API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-full-snapshot-size-available/"
    "published": "2026-09-30 06:00:23"
    "fetched": "2026-09-30 10:00:20"
    "summary": "<p>Amazon RDS now displays the full snapshot size for RDS Snapshots. With this enhancement, customers can now retrieve full snapshot sizes programmatically through the DescribeDBSnapshots API using the new field, ‘FullSnapshotSizeInBytes’. They can also view this on the console with the ‘Full Snapshot Size’ column.&nbsp; &nbsp;</p>\n<p>Amazon RDS snapshots are incremental. This means that if you take multiple snapshots of a volume over time, each snapshot only stores the new or modified blocks while maintaining references to unchanged blocks from previous snapshots. The ‘FullSnapshotSizeInBytes’ field shows you the total size of all blocks that make up a snapshot, including both the blocks stored directly in that snapshot and all blocks referenced from previous snapshots. For instance, if you have a 100 GB database volume with 50 GB of data, the ‘full snapshot size’ would show 50 GB regardless of whether it's the first snapshot or a subsequent one. Please note that this is different from the incremental snapshot size, which only refers to the size of newly changed blocks stored in that specific snapshot.</p>\n<p>Full snapshot size is available all Amazon RDS database instances in all commercial AWS Regions. You can start using it today through the Amazon RDS Management Console, the AWS Command Line Interface (CLI), or the AWS SDKs. To learn more, see&nbsp;the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_CommonTasks.BackupRestore.html\" target=\"_blank\">Amazon RDS User Guide.</a></p>"
  "e8c3ae0b1ab57b8016e0da116663831e":
    "id": "e8c3ae0b1ab57b8016e0da116663831e"
    "title": "Amazon WorkSpaces Applications introduces unified graphics images"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-workspaces-applications-unified-graphics-images/"
    "published": "2026-09-30 02:00:00"
    "fetched": "2026-09-30 10:00:20"
    "summary": "<p>Today, Amazon WorkSpaces Applications announces unified graphics images, a single image type that works across all supported graphics instance families, including G4dn, G5, G6, and G7. Previously, each graphics generation required its own dedicated image. Now customers can use one image to create and manage fleets on any supported graphics instance family.</p>\n<p>Unified graphics images simplify image management and make it easier to adopt newer GPU generations as they become available. When creating a fleet using the unified graphics image, the console displays all compatible instance types, so you can choose the right price and performance for your workload. Fleets built on a unified graphics image can also change instance types across supported families using the console or the UpdateFleet API, an operation previously limited to sizes within a single instance family.</p>\n<p>Unified graphics images are available in all AWS commercial and AWS GovCloud (US) Regions where Amazon WorkSpaces Applications graphics instances are supported.</p>\n<p>To get started, upgrade an existing graphics image through Managed Image Update or launch an image builder from a unified base image. To learn more, visit the <a href=\"https://docs.aws.amazon.com/appstream2/latest/developerguide/unified-graphics-images.html\" target=\"_blank\">Amazon WorkSpaces Applications documentation</a>.\n <br /></p>"
  "756bcdb73cfbfb18ece49490ff371e36":
    "id": "756bcdb73cfbfb18ece49490ff371e36"
    "title": "AWS Service Availability Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-service-availability/"
    "published": "2026-09-30 01:21:00"
    "fetched": "2026-09-30 10:00:20"
    "summary": "<p>We're announcing availability changes to the following AWS services and features.</p>\n<p><b>Services moving to Maintenance</b></p>\n<p>Services moving to maintenance will no longer be accessible to new customers starting October 29, 2026. Customers already using these services and features can continue to do so. AWS will continue to operate and support these services and features. We recommend that customers learn about the changes in the product pages and documentation.</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/chime-sdk/latest/ag/sip-applications-service-change.html\">Amazon Chime SDK SIP Media Application</a></p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/workspaces-web/latest/adminguide/workspaces-secure-browser-maintenance-mode.html\">Amazon WorkSpaces Secure Browser</a></p>\n<p><b>Services entering Sunset</b></p>\n<p>The following services are entering sunset, and we are announcing the date upon which we will end operations and support of the service. Customers using these services should click on the links below to understand the sunset timeline and begin planning migration to alternatives as recommended in the updated service web pages and documentation.</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/managed-blockchain/latest/hyperledger-fabric-dev/managed-blockchain-end-of-support.html\">Amazon Managed Blockchain</a> (end of support September 29, 2027)</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/devops-guru/latest/userguide/devops-guru-end-of-support.html\">Amazon DevOps Guru</a> (end of support September 30, 2027)</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/sap/latest/sap-AnyDB/ase-backint-end-of-support.html\">AWS Backint Agent for SAP ASE</a> (end of support September 29, 2027)</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <a href=\"https://docs.aws.amazon.com/infrastructure-composer/latest/dg/composer-availability-change.html\">AWS Infrastructure Composer</a> (standalone console end of support December 7, 2026)</p>\n<p><b>Services reaching End of Support</b></p>\n<p>The following services have reached end of support and are no longer available as of September 29, 2026.</p>\n<p>·&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Amazon Mechanical Turk</p>\n<p>For customers affected by these changes, we've prepared comprehensive migration guides, and our support teams are ready to assist with your transition. Visit the AWS Product Lifecycle Page to learn more, and subscribe to the RSS feed for future updates.</p>"
  "a5ddcc7d17571e17e778e65f1abdd595":
    "id": "a5ddcc7d17571e17e778e65f1abdd595"
    "title": "Amazon Bedrock Managed Agents, powered by OpenAI, is now available in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/bedrock-managed-agents-preview/"
    "published": "2026-09-30 06:10:00"
    "fetched": "2026-09-30 16:53:02"
    "summary": "<p>Developed jointly by AWS and OpenAI, Bedrock Managed Agents (BMA) is built on a customized version of&nbsp;OpenAI's Agents API engineered to be AWS-native and integrated with AWS resources.&nbsp;You can now build agents optimized for OpenAI models that run entirely inside AWS with the identities, permissions, and governance controls you already use.&nbsp;</p>\n<p>BMA manages how the model preserves state, selects and uses tools, executes code, and coordinates work across multiple steps and decisions. Durable sessions retain messages, tool calls, and intermediate results so you can return later, provide new information, and continue from the progress already made. You can add reusable skills for specialized procedures and connect agents to tools, including via Model Context Protocol (MCP) servers. Each agent operates with its own IAM role, supports human approval before consequential actions, and records supported API activity with AWS CloudTrail.</p>\n<p>During preview, there is no additional charge for BMA beyond the underlying AWS resources your agents consume. Pricing is subject to change at general availability.</p>\n<p>Get started with Amazon Bedrock Managed Agents today through supported APIs. BMA is available in preview in US East (N. Virginia), US West (Oregon), and US East (Ohio). For details, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/bedrock-managed-agents-openai.html\">Amazon Bedrock documentation</a>. &nbsp;</p>"
  "f19117590a88610ad4bd36cb4f2e7cb0":
    "id": "f19117590a88610ad4bd36cb4f2e7cb0"
    "title": "Amazon Bedrock expands Claude model availability to India, South Korea, and Singapore"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-region-expansion-in-sk/"
    "published": "2026-09-30 00:41:00"
    "fetched": "2026-09-30 16:53:02"
    "summary": "<p>We're excited to announce the availability of Anthropic's <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Opus 5,</a> <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Sonnet 5</a>, and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">Claude Haiku 4.5</a> on Amazon Bedrock in India, Claude Opus 5 and Claude Sonnet 5 in South Korea, as well as Claude Sonnet 5 in Singapore. Customers who need to process data within a specific geography, including those in financial services, healthcare, and the public sector, can now use these models at scale while keeping inference in-country.</p>\n<p>In India, the regional endpoint is served through geographic cross-Region inference across the Mumbai and Hyderabad Regions. Customers in India can access these models while processing data in India Regions, in addition to the already supported global cross-Region inference.</p>\n<p>In South Korea, Amazon Bedrock supports Claude Opus 5 and Claude Sonnet 5 models with in-region inference on the bedrock-runtime endpoint in the Seoul (ap-northeast-2) Region. In Singapore (ap-southeast-1), Amazon Bedrock supports Claude Sonnet 5 with in-region inference on the bedrock-runtime endpoint. Amazon Bedrock processes inference requests and data within the Region you call, and the processing never leaves that Region.</p>\n<p>For the most current information about model availability in each Region, <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">see Regional availability by models</a> in the Amazon Bedrock User Guide.</p>"
  "c4c5d72d586557a021ec8c0477c87b5d":
    "id": "c4c5d72d586557a021ec8c0477c87b5d"
    "title": "AWS Transform now supports Apache Kafka migration assessments for Amazon MSK"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-msk-migration-assessment-with-aws-transform"
    "published": "2026-09-30 00:00:00"
    "fetched": "2026-09-30 16:53:02"
    "summary": "<p>You can now use <a href=\"https://aws.amazon.com/transform/\">AWS Transform</a> agentic migration assessments to evaluate the migration of on-premises Apache Kafka clusters to <a href=\"https://aws.amazon.com/msk/\">Amazon Managed Streaming for Apache Kafka (Amazon MSK)</a>. AWS Transform <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\">migration assessments</a> use agentic AI to analyze your workloads, recommend the best-fit AWS services, and generate a total cost of ownership (TCO) business case with pricing options and actionable next steps - all in minutes, through natural-language chat or with <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-migrations-mcp.html\">AWS Transform MCP server</a>. For Apache Kafka workloads, the assessment agent delivers compatibility checks, right-sized <a href=\"https://aws.amazon.com/msk/features/express-brokers-for-amazon-msk/\">Amazon MSK Express broker</a> recommendations, and projected costs - helping you quickly build a migration business case and accelerate your migration decisions.</p>\n<p>Evaluating a Kafka-to-MSK migration often involves multiple steps - mapping topologies, validating compatibility, right-sizing brokers, and projecting costs - that can take weeks when done manually. With this launch, you can start your migration assessment by uploading a Kafka cluster inventory file or simply describing your clusters in chat. The assessment agent then handles the heavy lifting - checking each cluster for MSK compatibility across topology, version, configurations, authentication, and quotas; sizing MSK Express brokers; and projecting costs across broker hours, storage, data-in, and cross-AZ transfer. Additionally, you can create what-if scenarios with customized assumptions - compare pricing across Regions, adjust retention, or explore alternative configurations - to generate a comprehensive migration business case that gives stakeholders the confidence to move forward.</p>\n<p><a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-app-assessments.html\">Migration assessments</a> for Amazon MSK are available in all AWS Regions where <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/regions.html\"><u>AWS Transform is offered</u></a>. To get started, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\">Amazon MSK Developer Guide</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/msk-replicator-migrate-ai-assist.html\">Assess MSK migration readiness with AI tools</a>, or the <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/what-is-service.html\">AWS Transform user guide</a>.</p>"
  "716baa857ec16145a8871d4865c89dc8":
    "id": "716baa857ec16145a8871d4865c89dc8"
    "title": "AWS Marketplace launches an AI agent skill for usage-based metering integration"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/marketplace-ai-agent-metering/"
    "published": "2026-09-30 14:00:00"
    "fetched": "2026-10-01 04:46:34"
    "summary": "<p>AWS announces the general availability of the AWS Marketplace metering agent skill, an AI-guided experience that helps sellers build, deploy, and validate a usage-based (pay-as-you-go) SaaS metering integration from within their AI coding assistant. The skill guides sellers through the complete integration journey — gathering their product type, pricing model, and usage dimensions; recommending the correct metering API; generating integration code and a customized AWS CloudFormation stack tailored to their configuration; and running an end-to-end test against AWS Marketplace before any production code ships.</p>\n<p>Previously, sellers integrating metering navigated documentation, workshops, and trial-and-error API calls, where common mistakes such as mismatched dimension names or invalid timestamps create billing gaps discovered days later. The metering agent skill cross-validates dimensions against the seller's actual product configuration, applies built-in guardrails, deploys a serverless metering pipeline (using ResolveCustomer API, BatchMeterUsage API, and Amazon EventBridge for subscription events), and verifies the integration with a live test. It also supports <a href=\"https://aws.amazon.com/blogs/awsmarketplace/complete-guide-to-upgrading-your-saas-product-to-aws-marketplace-concurrent-agreements/\">Concurrent Agreements</a> and helps existing sellers inspect, debug, and analyze their metering records.</p>\n<p>The skill is available through the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html\"><u>AWS MCP Server</u></a>&nbsp;in any AI coding assistant that supports MCP, including Amazon Q Developer, Kiro, and other MCP-compatible clients, with no plugin installation required.</p>\n<p>To get started, visit&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/metering-for-usage.html#configure-application-for-meter-usage\">Configuring metering for usage with SaaS subscriptions</a>.</p>"
  "deed648fc96be82f23f10c2cb91f7726":
    "id": "deed648fc96be82f23f10c2cb91f7726"
    "title": "AWS Deadline Cloud now supports expressions in job templates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-deadline-cloud-expressions-job-templates/"
    "published": "2026-09-30 06:55:00"
    "fetched": "2026-10-01 04:46:34"
    "summary": "<p>AWS Deadline Cloud now supports flexible expressions and rich parameter types in job templates, giving customers a cleaner, more powerful way to fit the service to existing production pipelines. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming.</p>\n<p>Customers can now express pipeline logic directly in their job templates. This includes expressions such as arithmetic, conditionals, string and path operations, and list comprehensions, all in a familiar Python-style syntax. Customers can use this to split a frame range into per-task frames, derive an output path from the scene name, or toggle an optional flag directly within job templates themselves, making it easier to automate bespoke pipeline operations. New boolean, list, and frame-range parameter types match how pipelines already describe work. For example, a checkbox can add a --gpu flag and its matching host requirement when set, and a list of cameras can become a step's task range. Expressions are type-checked at submission, and their evaluation is deterministic, meaning that job execution behaves predictably every time.</p>\n<p>These capabilities come from the new EXPR extension to Open Job Description, the open specification Deadline Cloud uses for job templates, and are available in all AWS Regions where AWS Deadline Cloud is supported.</p>\n<p>To get started, visit the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/developerguide/VERIFY-expr-doc-url.html\">Deadline Cloud developer guide</a>.</p>"
  "97511d1d1f06c913ebb597ede48450b0":
    "id": "97511d1d1f06c913ebb597ede48450b0"
    "title": "AWS Deadline Cloud now supports ECS containers on Linux Service-Managed Fleets"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-deadline-cloud-ecs-containers-linux-smf/"
    "published": "2026-09-30 05:18:00"
    "fetched": "2026-10-01 04:46:34"
    "summary": "<p>AWS Deadline Cloud now supports running jobs using Docker containers from Amazon Elastic Container Service (ECS) on Linux-based service-managed fleets. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming.\n <br />\n <br />\n Deadline Cloud customers can now bring their own software containers directly to the service using Docker-enabled fleets. Customers that already package software into container images can point Deadline Cloud to these images directly. This unlocks any container-deployed software use case, from rendering tools like Blender to physical AI workloads such as NVIDIA Isaac Sim and MuJoCo. With service-managed fleets, Deadline Cloud automatically deploys the containerized software on every worker instance at scale.</p>\n<p>Containers are integrated with Deadline Cloud fleets and queues, so that customer job templates do not need to contain container commands or image references. This means the same job bundles customers run locally with the Open Job Description CLI can be submitted to Deadline Cloud with no additional changes. The result is a faster path from existing containerized software workflows to a fully managed render and compute farm.</p>\n<p>Container support for service-managed fleets is available in all AWS Regions where Deadline Cloud is offered.</p>\n<p>To get started, see our <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/userguide/fleet-container-support.html\">user guide</a> and our <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/developerguide/containers.html\">developer guide</a>.</p>"
  "50345715bb6709f267817816612e21a0":
    "id": "50345715bb6709f267817816612e21a0"
    "title": "Partner Revenue Measurement adds Multi-Partner support to Resource Tagging"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/partner-revenue-measurement-multi-partner-resource-tagging"
    "published": "2026-09-30 21:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Partner Revenue Measurement (PRM) provides measurement of AWS consumption driven by Partner solutions. Today, PRM adds multi-Partner support to Resource Tagging, so that multiple AWS Partners can receive revenue attribution for the same AWS resource. Previously, a resource carried only one Partner tag, <i>aws-apn-id</i>, so when multiple Partners contributed to the same workload, only one Partner received attribution.&nbsp;</p>\n<p>With this update, each Partner tags the resources they contribute to using a new key in the format <i>aws-apn-id-&lt;partner-central-aws-account-id&gt;.</i> When more than one Partner tags the same resource, each tagged Partner receives revenue attribution. This benefits Partners that co-deliver solutions, such as a consulting Partner that deploys and operates a software Partner's product in an AWS account. The existing <i>aws-apn-id</i> key continues to work, and resources tagged with it require no additional changes. &nbsp;</p>\n<p>Multi-Partner support in Resource Tagging is available today in all commercial AWS regions. Revenue attributed through the existing <i>aws-apn-id</i> key and the new key both appear under the “Resource Tagging” method in the <a href=\"https://aws.amazon.com/blogs/apn/unlock-revenue-insights-in-the-new-attributed-revenue-dashboard/\">Attributed Revenue Dashboard</a>, with no changes to the dashboard.</p>\n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">Partner Revenue Measurement product page</a> and the Resource Tagging&nbsp;<a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/\">onboarding guide</a>.</p>"
  "a49bc585bba3ef2e992ccead26044e94":
    "id": "a49bc585bba3ef2e992ccead26044e94"
    "title": "AWS Transfer Family now automatically approves SFTP connector quota increases up to 1,000"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transfer-family-sftp-connector-quota-1000/"
    "published": "2026-09-30 17:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>AWS Transfer Family now automatically approves requests to increase your SFTP connector quota up to 1,000 connectors per AWS account in each AWS Region. You can add more connectors as your file transfer needs grow without waiting for manual approval.</p>\n<p>The default quota remains 100 SFTP connectors per AWS account in each AWS Region, and you continue to request increases in the AWS Service Quotas console. Previously, all quota increases required manual approval. Automatic approval applies to connectors using either service-managed or Amazon VPC Lattice egress. If you need more than 1,000 connectors, submit a higher quota request in the Service Quotas console.</p>\n<p>This feature is available in all AWS Regions where Transfer Family SFTP connectors are offered. To learn more, visit the <a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/creating-connectors.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Transfer Family SFTP connectors documentation</a>.</p>"
  "ae93d9c6c2ce5305eb4347544de83361":
    "id": "ae93d9c6c2ce5305eb4347544de83361"
    "title": "AWS accounts now support phone number verification"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-accounts-phone-number-verification/"
    "published": "2026-09-30 17:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>AWS Accounts now support phone number verification for primary contact phone numbers. Previously, phone numbers in AWS account contact information were validated for format but never verified through an out-of-band mechanism. Now, customers can verify their phone numbers via SMS one-time passcode (OTP).</p>\n<p>To verify a phone number, customers initiate verification through the AWS Management Console or programmatically via the new SendPhoneNumberVerification API, which sends a 6-digit OTP. After entering the code, the VerifyPhoneNumber API validates and persists the verified status. When a phone number is changed through the PutContactInformation API, customers will be prompted to complete verification again. The GetContactInformation API now exposes verification status, enabling customers to confirm which phone numbers have been verified.</p>\n<p>For AWS Organizations customers, phone number verification supports inheritance from the management account. When a verified phone number is applied to member accounts from the management account, those member accounts inherit the verified status if the number matches the management account, eliminating the need to verify the same number across thousands of accounts. Member accounts that independently change their own phone numbers will need to complete verification separately.</p>\n<p>This feature is available in all AWS commercial regions. To learn more about phone number verification, visit the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/\">AWS Account Management documentation</a>.</p>"
  "4d5dfcbe7aa9449822b659738470b289":
    "id": "4d5dfcbe7aa9449822b659738470b289"
    "title": "AWS IAM Identity Center Identity Store APIs now accept resource ARNs in addition to resource IDs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/iam-identity-center-apis-arns/"
    "published": "2026-09-30 17:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>AWS IAM Identity Center's Identity Store APIs now accept the Amazon Resource Name (ARN) for a user, group, group membership, or identity store anywhere the APIs previously accepted the resource ID. ARN support is additive and existing integrations continue to work unchanged.</p>\n<p>If you build on the Identity Store APIs, you may already hold resource ARNs — for example, from IAM policy evaluation, CloudTrail events, or cross-service integrations. Previously, you had to strip the ARN down to the resource ID before calling Identity Store APIs. With this change, you can pass either form directly, simplifying application code and eliminating potential parsing errors.</p>\n<p>The change applies to every request identifier field across the Identity Store API surface. Responses continue to return resource IDs as they did before. Malformed or wrong-resource-type ARNs return a ValidationException.</p>\n<p>This capability is available in all AWS Regions where AWS IAM Identity Center is offered, at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/singlesignon/latest/IdentityStoreAPIReference/\">Identity Store API Reference</a>.</p>"
  "d0ad05e52e154844fd7327116fd0bf7b":
    "id": "d0ad05e52e154844fd7327116fd0bf7b"
    "title": "Amazon S3 Tables now support all Apache Iceberg V3 data types"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-s3-tables-iceberg-v3-data-types"
    "published": "2026-09-30 13:00:00"
    "fetched": "2026-10-01 08:24:26"
    "summary": "<p>Amazon S3 Tables add support for geometry, geography, unknown, and nanosecond timestamp data types, along with column default values, as defined in the Apache Iceberg Version 3 (V3) specification. You can now store geospatial coordinates and nanosecond-precision event times natively instead of encoding them in strings or integers. This helps simplify data architecture while improving storage efficiency and performance. With this launch, S3 Tables support all data types introduced in V3, adding to existing support for the Variant data type, deletion vectors, and row lineage.</p>\n<p>Geometry and geography columns store points, lines, and polygons natively, so fleet tracking and asset mapping workloads can filter on location at query time. Nanosecond timestamps let telemetry and financial workloads record event times at source precision. Column default values populate a newly added column for existing rows, with no backfill required. S3 Tables provide automatic table maintenance and compaction for Apache Iceberg tables, so tables using V3 data types stay performant and cost effective as data scales.</p>\n<p>Support for these data types in S3 Tables is available in all AWS Regions where S3 Tables are available. To learn more, see <a href=\"https://aws.amazon.com/s3/features/tables/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon S3 Tables</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/working-with-apache-iceberg-v3.html\" rel=\"noopener noreferrer\" target=\"_blank\">Apache Iceberg V3 on AWS</a>, and the <a href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/apache-iceberg-on-aws/table-spec-v3.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Prescriptive Guidance</a>&nbsp;for working with Iceberg table format specification version 3.</p>"
  "05187f94ec55ce0937f5de91c3cb9899":
    "id": "05187f94ec55ce0937f5de91c3cb9899"
    "title": "Amazon Redshift simplifies access to secure logging with federated permissions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/redshift-secure-logging-permissions/"
    "published": "2026-09-30 17:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p>Amazon Redshift now makes it easier to troubleshoot and audit queries on data protected by federated permissions with fine-grained access control (FGAC). Using the new DEBUG permission, data owners can let specific identities see unredacted secure logging records across multiple Redshift data warehouses.</p>\n<p>With Amazon Redshift federated permissions, you define data permissions once, and Redshift enforces them automatically across every Redshift warehouse in your AWS account. When a query accesses FGAC-protected data, secure logging redacts sensitive values in system table records, such as rewritten query text, error messages, and object names. This protects the producer's data from consumers. At the same time, authorized auditors and administrators need visibility into these records to troubleshoot queries and meet compliance requirements, without turning off secure logging.</p>\n<p>With the new DEBUG permission, a superuser or database owner can choose which identities see these records without redaction. You grant DEBUG with the standard Redshift GRANT command, typically to an IAM user, IAM role, or IAM Identity Center user or group, so that identity can see unredacted records for its own queries. You can also grant DEBUG to the administrators of a consumer account for full log visibility during troubleshooting and audit. Records authorized for account administrators also stay unredacted when you export Redshift system table data to Amazon S3 Tables. You get precise, auditable control over who can see logs, and secure logging stays on.</p>\n<p>The feature is available in all AWS Regions where Amazon Redshift is supported. To learn more, see <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/federated-permissions.html\">federated permissions</a>,&nbsp;&nbsp;<a href=\"https://docs.aws.amazon.com/redshift/latest/dg/r_GRANT-usage-notes.html\">Usage Notes</a> and <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/db-auditing-secure-logging.html\">secure logging</a> in the Amazon Redshift documentation.</p>"
  "740807d0f14148a81200375934299606":
    "id": "740807d0f14148a81200375934299606"
    "title": "Amazon Kinesis Video Streams now supports VPC endpoints with AWS PrivateLink"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/kinesis-video-streams-vpc-privatelink/"
    "published": "2026-09-30 17:00:00"
    "fetched": "2026-10-02 07:17:07"
    "summary": "<p><a href=\"https://aws.amazon.com/kinesis/video-streams/\">Amazon Kinesis Video Streams</a> now supports interface VPC endpoints powered by <a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html\">AWS PrivateLink</a>, providing private connectivity from your Amazon Virtual Private Cloud (Amazon VPC). Traffic between your VPC and Kinesis Video Streams stays on the AWS network and is not exposed to the public internet, across the control plane and the video ingestion and playback data planes.</p>\n<p>Customers with strict security, compliance, or network-isolation requirements can now ingest, store, and play back video without internet gateways, NAT devices, or public IP addresses. For example, connected-camera or IoT video workloads in a private subnet can send media to Kinesis Video Streams and retrieve it for playback and analytics entirely over private connectivity. You create the endpoint from the Amazon VPC console, AWS CLI, or AWS SDKs and can attach a VPC endpoint policy to control access.</p>\n<p>VPC endpoints for Amazon Kinesis Video Streams are available in all AWS Regions where Amazon Kinesis Video Streams is available, including the AWS GovCloud (US) Regions and the China (Beijing) Region, operated by Beijing Sinnet Technology Co., Ltd. (\"Sinnet\").</p>\n<p>To learn more, see our <a href=\"https://docs.aws.amazon.com/kinesisvideostreams/latest/dg/vpc-interface-endpoints.html\">Getting Started Guide</a>.</p>"
"last_updated": "2026-10-02 07:17:07 JST"
