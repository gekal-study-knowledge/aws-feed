"overview": |
  この日は 13 件で、セキュリティ速報 1 件と、新しいモデルの一般提供、そして Amazon Quick を軸にした解説が中心でした。セキュリティ速報は CVE-2026-100308 で、Important (要対応) です。時系列モデルの深層学習ライブラリである OSS の GluonTS において、信頼できないモデル成果物をデシリアライズすると任意のコマンドが実行される可能性があります。Amazon GluonTS 0.17.0 より前のバージョンのモデル読み込みコンポーネントに信頼できないデータのデシリアライズの問題があり、細工されたシリアライズ済みモデルディレクトリに対して Predictor.deserialize() または RepresentablePredictor.deserialize() を呼び出すと、読み込み処理の権限で任意の OS コマンドを実行されるおそれがあります (Bulletin ID: 2026-119-AWS、2026 年 9 月 29 日 08:00 PDT 公開)。モデルでは、OpenAI の GPT-6.1 Sol が Amazon Bedrock で一般提供となりました。GPT-6 Sol の後継で、エージェント的なコーディング、コンピュータ操作、専門的な業務で非常に強い性能を示します。OpenAI によれば、要求の厳しい評価において GPT-6 Astra に迫る一方でコストは約 5 分の 1 で、規模を持った有能なエージェントを構築・運用する余地が広がります。機能の実装、不具合の調査、解の反復、多段のワークフローの実行、複雑なコードベースの調査に使え、Amazon Bedrock 上で明示的なプロンプトキャッシュにも対応します。機械学習ブログでは、Amazon Quick のプロンプトエンジニアリングを扱う 2 部構成の記事が公開されました。Part 1 は具体性、文脈の設定、少数事例、CRISPE フレームワークといった基礎原則と再利用できる枠組みを扱い、Part 2 は Quick Research・Quick Flows・Quick Sight・チャットエージェント・アクション連携というコンポーネントごとに、効果の出るプロンプトのパターンと避けるべき落とし穴を整理しています。あわせて、Amazon Quick と Amazon Bedrock AgentCore による契約インテリジェンスの基盤が紹介されました。数百件の取引先契約から手作業でデータを抜き出す運用は規模に耐えず、RAG のチャットツールではポートフォリオ全体にまたがる問いに答えきれないという課題に対し、AI エージェントが契約の項目を抽出して検証し、Amazon Quick の分析で集計的な問いと個別契約の問いの双方に答えます。事例では、Condé Nast が 14 万本を超える動画ライブラリをタイトルと説明だけで検索しており、1 つの作業に平均 250 分かかっていた状況を、AWS Generative AI Innovation Center と協力して Amazon Bedrock と Amazon OpenSearch Service 上のマルチモーダルな動画探索に置き換え、2 分未満に短縮した取り組みが紹介されました。コンピュートブログでは 3 本が公開されました。1 つは、DescribeImages API が対応する SSM パラメーターを直接返すようになった改善を使って、AMI ID と AWS Systems Manager のパラメーターパスを手作業で対応づける必要をなくす方法で、AWS CLI・CloudFormation・Terraform・Auto Scaling の起動テンプレートでの使い方を扱っています。もう 1 つは、規制下のエアギャップな RHEL 系フリートを AWS で運用するためのサーバーレスな 2 アカウント構成で、接続されたパッケージの取り込みとエアギャップ側のワークロードを分離し、パッケージ変更に明示的な人間の承認を挟み、EC2 Image Builder の AMI と Patch Manager を凍結した Amazon S3 リポジトリのスナップショット 1 つに揃えます。3 つ目は、AWS Lambda の durable functions が実行状態を永続ストレージにチェックポイントすることを受けて、規制下の決済ワークロードのために AWS KMS の顧客管理キーで永続実行データを暗号化し、最小権限のキーポリシーを定義し、AWS CloudTrail で暗号化を確認するところまでを Terraform で構成する方法です。このほかサービス更新として、Amazon Connect Customer がコンタクトセンターの設定を動かす参照データをより多く保持できるようになりました。営業時間、エスカレーションのルール、AI エージェントのプロンプト、キューの割り当てといった設定に使うデータテーブルを 1 テーブルあたり 20,000 値まで扱え、テーブルのエクスポートや数百件のレコードの編集、インスタンス間のテーブル移動、Excel や DynamoDB といった外部システムからの読み込みができるため、業務部門が技術者に頼らず自分で設定を最新に保てます。データベースでは、Amazon RDS for PostgreSQL の Extended Support マイナーバージョン 13.23-rds.20260514・12.22-rds.20260514・11.22-rds.20260514 が公開され、Amazon Aurora PostgreSQL 互換エディションが PostgreSQL 18.6・17.11・16.15・15.19・14.24 をサポートしました (コミュニティのバグ修正と Aurora 独自の改善を含み、CVE への対応のため最新マイナーへの更新が推奨されています)。
