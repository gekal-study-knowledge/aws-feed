"overview": |
  この日は 26 件で、新モデルの追加と規制環境向けの運用パターン、そしてデータベースのバージョン更新が中心でした。モデルでは、OpenAI の GPT-6.1 Sol が Amazon Bedrock で一般提供となりました。GPT-6 Sol の後継として、頻繁に実行されるエージェント的なコーディング・コンピュータ操作・業務ワークロードで強い性能を発揮し、Astra に近い知能を日常業務に持ち込むものと位置づけられています。機械学習ブログでは、Condé Nast の編集チームがタイトルと説明だけで 14 万本を超える動画ライブラリを検索し 1 タスクあたり平均 250 分を費やしていた状況を、AWS Generative AI Innovation Center と協力して Amazon Bedrock によるマルチモーダルな動画探索で改善した事例、Amazon Quick と Amazon Bedrock AgentCore で数百件のベンダー契約からデータを抽出しポートフォリオ横断の問いにも答える契約インテリジェンス基盤の構築事例が公開されました。あわせて Amazon Quick のプロンプトエンジニアリングが 2 部構成で解説され、Part 1 は基礎となる原則と再利用可能なフレームワーク、Part 2 は Quick Research・Quick Flows・Quick Sight・チャットエージェントといったコンポーネントごとのパターンと落とし穴を扱います。コンピュートブログでは、規制対象のエアギャップ環境で RHEL 系のフリートを運用するために、接続環境でのパッケージ取り込みとエアギャップのワークロードを分離し人による明示的な承認を挟むサーバーレスな 2 アカウント構成、DescribeImages API の拡張で AMI ID に対応する SSM パラメータパスが返るようになり AMI の探索が簡単になったこと、そして規制対象の決済ワークロード向けに Lambda durable functions のチェックポイントデータを AWS KMS のカスタマー管理キーで暗号化する Terraform での設定方法が解説されました。セキュリティ速報は 1 件で、CVE-2026-100308 は深層学習による時系列予測のオープンソースライブラリ GluonTS におけるモデルのデシリアライズ時の任意コマンド実行です (Bulletin ID: 2026-119-AWS、2026 年 9 月 29 日 08:00 PDT 公開、Important / 要対応)。データベースでは、Amazon Aurora PostgreSQL 互換エディションが PostgreSQL 18.6・17.11・16.15・15.19・14.24 に対応し、コミュニティのバグ修正と Aurora 固有の機能強化が含まれます。Amazon RDS for PostgreSQL は Extended Support のマイナーバージョン 13.23-rds.20260514、12.22-rds.20260514、11.22-rds.20260514 を公開し、Amazon RDS はスナップショットの完全サイズをコンソールと DescribeDBSnapshots API で取得できるようになりました。あわせて、AWS Service Availability Updates として、新規顧客への提供を終了してメンテナンスに移行するサービスと機能の変更が告知されています。Amazon Connect Customer では管理者がコンタクトセンターの構成を駆動する参照データをより多く保持できるようになり、データテーブルで 1 つあたり最大 20,000 件の値を扱えます。Amazon WorkSpaces Applications は統合グラフィックスイメージを導入し、G4dn・G5・G6・G7 を含む対応する全グラフィックスインスタンスファミリーで 1 つのイメージタイプが使えるようになりました。AWS ジャパンブログでは、長期保守が前提の組み込みソフトウェア開発でも AI エージェントを活用できることを示す、日立産業制御ソリューションズ様向けのワークショップ開催報告が公開されました。2026 年 7 月に既存コードの読み解きから仕様化・実装・テストまでを Kiro で体験するハンズオンを 2 回開催し、102 名のエンジニアが参加しています。エージェント基盤では、Amazon Bedrock Managed Agents (BMA) がプレビューで利用可能になりました。AWS と OpenAI が共同で開発したもので、OpenAI の Agents API を AWS ネイティブに、かつ AWS のリソースと統合するよう作り替えた版の上に構築されています。OpenAI のモデルに最適化したエージェントを、すでに使っている ID・権限・ガバナンスの統制のまま AWS の内側で完結して動かせます。モデルがどう状態を保持し、ツールを選んで使い、コードを実行し、複数の手順と判断にまたがって仕事を進めるかを BMA が管理します。永続的なセッションがメッセージ・ツール呼び出し・中間結果を保持するため、後から戻ってきて新しい情報を与え、それまでの進捗の続きから再開できます。専門的な手順のために再利用できるスキルを追加することもできます。モデルの提供地域も広がりました。Amazon Bedrock でインドに Claude Opus 5・Claude Sonnet 5・Claude Haiku 4.5、韓国に Claude Opus 5 と Claude Sonnet 5、シンガポールに Claude Sonnet 5 が加わり、金融サービス・ヘルスケア・公共部門のように特定の地域内でデータを処理する必要がある利用者が、推論を国内に留めたまま規模を持って使えるようになりました。インドでは、ムンバイとハイデラバードのリージョンにまたがる地理的なクロスリージョン推論でリージョナルエンドポイントが提供され、ソウルとシンガポールではリージョン内推論として、呼び出したリージョンの内側だけで推論が処理されます。移行では、AWS Transform のエージェント型移行アセスメントが、オンプレミスの Apache Kafka クラスターから Amazon Managed Streaming for Apache Kafka (Amazon MSK) への移行評価に対応しました。自然言語のチャットまたは AWS Transform MCP サーバー経由で、ワークロードを分析して最適な AWS サービスを推奨し、価格の選択肢と次の打ち手を含む TCO のビジネスケースを数分で作ります。Kafka のワークロードでは、互換性のチェック、適正サイズの Amazon MSK Express ブローカーの推奨、想定コストが得られます。このほか、AWS Marketplace が従量課金 (pay-as-you-go) の SaaS 計測連携を AI コーディングアシスタントの中から構築・デプロイ・検証できる計測エージェントスキルを一般提供しました。製品タイプ・価格モデル・使用量のディメンションを聞き取り、適切な計測 API を推奨し、設定に合わせた連携コードと AWS CloudFormation スタックを生成して、本番のコードを出す前に AWS Marketplace に対してエンドツーエンドのテストを実行します。AWS Deadline Cloud には 2 つの更新が入りました。1 つはジョブテンプレートでの式と豊富なパラメーター型のサポートで、算術・条件分岐・文字列やパスの操作・リスト内包表記といった Python 風の構文でパイプラインのロジックをテンプレートに直接書けるため、フレーム範囲をタスクごとのフレームに分割したり、シーンから出力パスを導いたりできます。もう 1 つは Linux のサービスマネージド型フリートで Amazon ECS の Docker コンテナを使えるようにしたもので、すでにソフトウェアをコンテナイメージにまとめている利用者はそのイメージを直接指定でき、Blender のようなレンダリングツールから NVIDIA Isaac のような物理 AI のワークロードまで、コンテナで配布されるあらゆる用途に使えます。日本語ブログでは、Amazon Bedrock Guardrails の自動推論チェックによって信頼できる AI システムを構築する 2 部構成の第 1 部が公開されました。規制産業では AI の応答が定められたポリシーに準拠していることを数学的な確実性をもって示す必要があるという前提のもと、形式的検証の技術で生成 AI の出力を検証する仕組みの技術的な基礎、7 種類の検出結果タイプ、シナリオ生成やテスト管理といった新機能を解説し、病院の再入院リスク評価を例に、自然言語のドキュメントからのポリシー作成、テストによる検証、注釈を使ったポリシー改善、ガードレールへの統合までを実装手順つきで紹介しています。
