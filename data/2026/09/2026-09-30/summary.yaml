"overview": |
  この日は 17 件で、新モデルの追加と規制環境向けの運用パターン、そしてデータベースのバージョン更新が中心でした。モデルでは、OpenAI の GPT-6.1 Sol が Amazon Bedrock で一般提供となりました。GPT-6 Sol の後継として、頻繁に実行されるエージェント的なコーディング・コンピュータ操作・業務ワークロードで強い性能を発揮し、Astra に近い知能を日常業務に持ち込むものと位置づけられています。機械学習ブログでは、Condé Nast の編集チームがタイトルと説明だけで 14 万本を超える動画ライブラリを検索し 1 タスクあたり平均 250 分を費やしていた状況を、AWS Generative AI Innovation Center と協力して Amazon Bedrock によるマルチモーダルな動画探索で改善した事例、Amazon Quick と Amazon Bedrock AgentCore で数百件のベンダー契約からデータを抽出しポートフォリオ横断の問いにも答える契約インテリジェンス基盤の構築事例が公開されました。あわせて Amazon Quick のプロンプトエンジニアリングが 2 部構成で解説され、Part 1 は基礎となる原則と再利用可能なフレームワーク、Part 2 は Quick Research・Quick Flows・Quick Sight・チャットエージェントといったコンポーネントごとのパターンと落とし穴を扱います。コンピュートブログでは、規制対象のエアギャップ環境で RHEL 系のフリートを運用するために、接続環境でのパッケージ取り込みとエアギャップのワークロードを分離し人による明示的な承認を挟むサーバーレスな 2 アカウント構成、DescribeImages API の拡張で AMI ID に対応する SSM パラメータパスが返るようになり AMI の探索が簡単になったこと、そして規制対象の決済ワークロード向けに Lambda durable functions のチェックポイントデータを AWS KMS のカスタマー管理キーで暗号化する Terraform での設定方法が解説されました。セキュリティ速報は 1 件で、CVE-2026-100308 は深層学習による時系列予測のオープンソースライブラリ GluonTS におけるモデルのデシリアライズ時の任意コマンド実行です (Bulletin ID: 2026-119-AWS、2026 年 9 月 29 日 08:00 PDT 公開、Important / 要対応)。データベースでは、Amazon Aurora PostgreSQL 互換エディションが PostgreSQL 18.6・17.11・16.15・15.19・14.24 に対応し、コミュニティのバグ修正と Aurora 固有の機能強化が含まれます。Amazon RDS for PostgreSQL は Extended Support のマイナーバージョン 13.23-rds.20260514、12.22-rds.20260514、11.22-rds.20260514 を公開し、Amazon RDS はスナップショットの完全サイズをコンソールと DescribeDBSnapshots API で取得できるようになりました。あわせて、AWS Service Availability Updates として、新規顧客への提供を終了してメンテナンスに移行するサービスと機能の変更が告知されています。Amazon Connect Customer では管理者がコンタクトセンターの構成を駆動する参照データをより多く保持できるようになり、データテーブルで 1 つあたり最大 20,000 件の値を扱えます。Amazon WorkSpaces Applications は統合グラフィックスイメージを導入し、G4dn・G5・G6・G7 を含む対応する全グラフィックスインスタンスファミリーで 1 つのイメージタイプが使えるようになりました。AWS ジャパンブログでは、長期保守が前提の組み込みソフトウェア開発でも AI エージェントを活用できることを示す、日立産業制御ソリューションズ様向けのワークショップ開催報告が公開されました。2026 年 7 月に既存コードの読み解きから仕様化・実装・テストまでを Kiro で体験するハンズオンを 2 回開催し、102 名のエンジニアが参加しています。
