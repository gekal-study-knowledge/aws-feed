"overview": |
  この日は 26 件で、フロンティアモデルの相次ぐ追加と、エージェント指向のアーキテクチャ、そしてネットワーク・データ転送まわりのサービス更新が中心でした。モデルでは、Claude Sonnet 5.5 が Amazon Bedrock と AWS 上の Claude Platform で利用可能になりました。集中を要するコーディングとナレッジワークに向けて賢く効率を高めたモデルで、ほとんどの作業をより速く、タスクあたりのコストを下げて処理でき、AWS GovCloud (US) でも提供されます。xAI の Grok 4.7 も Amazon Bedrock に加わりました。コーディング・長時間動作するエージェント・ナレッジワーク向けのフロンティアモデルで、50 万トークンのコンテキストウィンドウと 4 段階の設定可能な推論強度を備え、Grok 4.6 を基に改良され、US Geo と Global のクロスリージョン推論に対応します。AWS ジャパンブログでは、Claude Opus 5.5 が 2026 年 9 月 28 日より Kiro の IDE・CLI・Crew・Web のすべてで使えるようになったことが案内され、ほとんどの作業で Fable 5.1 と同等の性能を Opus 5 より 40% 低いコストで提供するとされています。アーキテクチャブログでは、エージェントの出力が一定でないことを前提に自動で適応する AI インターフェースを、動的な UI 生成のための AG-UI プロトコル、説明可能なマルチエージェントのための Strands Agents SDK の swarm パターン、そして Nova Act で構築する方法が解説されました。機械学習ブログでは、Amazon Nova Act と Amazon Bedrock AgentCore によるエージェント駆動の合成監視 (シンセティックモニタリング) でユーザージャーニーの検証を継続的に行うアーキテクチャ、Amazon Textract Custom Queries のアダプターを CloudFormation と Terraform で管理しアカウント間で昇格させる運用手法、そして AWS vLLM-Omni Deep Learning Container を使って SageMaker AI 上で生成メディアと音声を扱う 2 部構成のチュートリアル (Part 1 は永続的な双方向接続で音声合成をストリーミング、Part 2 は FLUX.2-klein でリアルタイム推論による画像生成からその動画化まで) が公開されました。コンピュートブログでは、AWS Lambda が VPC 外で動作するメモリ 2,048 MB 以上の関数についてスケーラブルなネットワーク帯域に対応し、持続スループットが 625 Mbps から 10,240 MB 時の 3,000 Mbps まで伸びるようになったことと、Amazon EventBridge のカスタムイベントバスが刷新され、プラットフォームチームが統制された 1 つのバスを組織全体で共有しつつ、アプリケーションチームが自分のアカウントから発行・購読できるようになったことが解説されています。セキュリティブログでは、2026 年 10 月 24 日 (土) に AWS ヨーロッパソブリンクラウドが欧州連合 (EU) 外のインフラに一切依存せず運用できることを示す演習を実施すると告知されました。サービス更新では、Amazon Route 53 Resolver DNS Firewall の Palo Alto Networks (PANW) Advanced DNS Security 対応が 32 の AWS リージョンで一般提供となり、Amazon ElastiCache Serverless for Valkey がパブリックエンドポイントに対応してノート PC やサーバーレス関数、AWS 外のアプリケーションから直接接続できるようになりました。AWS Systems Manager は SSM ドキュメントを AWS Resource Access Manager 経由で組織全体または特定の OU に共有でき、AWS DataSync は共有 VPC に対応してアカウント間で共有されたサブネットでエージェントと転送タスクを動かせるようになりました。AWS Transfer Family の Web アプリではファイルとフォルダを複数まとめて一括ダウンロードでき、Amazon Rekognition Face Liveness は生体検知のスコアが低かった理由と再試行の方法を示すフィードバックコードを返すようになり、Amazon EC2 の将来日付のキャパシティ予約は開始日の延期に対応しました。ニュースブログでは、GPT-6 Sol と Luna、Amazon Bedrock 上の Claude Opus 5.5、Strands ハーネスなどを扱う週刊まとめ (2026 年 9 月 28 日) が出ています。AWS ジャパンブログではさらに、送配電事業におけるクラウドと AI の活用を議論した T&D エグゼクティブ・ラウンドテーブルの開催報告と、HR Open Standards を活用した HR データ統合のためのオントロジー設計が公開されました。可観測性では、Amazon CloudWatch Logs がよく検索されるフィールドを自動でインデックスするようになりました。これまではクエリのパターンと使い方を見ながら手作業でインデックス対象のフィールドを選ぶ必要があり、パターンが変わるチームには余分な手間がかかっていました。CloudWatch Logs は = と IN による絞り込みに使われているフィールドを見つけて自動でインデックスするため、CloudWatch Logs Insights のクエリが速くなり、走査するデータも減ります。自動インデックスされたフィールドはロググループあたり 20 フィールドの上限に数えられず、30 日間保持され、対象の一覧はクエリのパターンの変化に合わせて更新されます (恒久的にインデックスしておきたいフィールドは、フィールドインデックスポリシーへ昇格させます)。あわせて CloudWatch Logs Insights では、クエリを実行する前に、選んだロググループと期間でどれだけのログデータ (バイト数) を走査することになるかを見積もれるようになりました。コンソールではロググループの選択・期間・クエリ本文を変えると見積もりが自動で表示され、AWS CLI や API では estimate コマンドをクエリに付けて明示的に要求します。estimate を使ったクエリには CloudWatch Logs Insights のクエリ料金はかかりません (全商用リージョンで利用可能)。
