"overview": |
  この日は 21 件で、フロンティアモデルの AWS 上での提供開始と、生成メディアの推論基盤、そして AWS European Sovereign Cloud の独立運用の実証が中心でした。モデルでは、Claude Sonnet 5.5 が Amazon Bedrock と AWS 上の Claude Platform で利用可能になりました。コーディングとナレッジワークに焦点を当てた、より賢く効率的な Sonnet で、ほとんどの作業においてタスクあたりのコストが下がります。AWS GovCloud (US) でも同時に提供が始まりました。xAI の Grok 4.7 も Amazon Bedrock に加わりました。コーディング、長時間動作するエージェント、ナレッジワーク向けのフロンティアモデルで、500K トークンのコンテキストウィンドウと 4 段階の設定可能な構成を持ち、US Geo と Global のクロスリージョン推論に対応します。開発ツールでは、Claude Opus 5.5 が 2026 年 9 月 28 日より Kiro の IDE・CLI・Crew・Web のすべてで利用可能になりました。ほとんどの作業において Fable 5.1 と同等の性能を、Opus 5 より 40% 低いコストで提供します。セキュリティブログでは、2026 年 10 月 24 日 (土) に AWS European Sovereign Cloud が欧州連合 (EU) の外にあるインフラに一切依存せずに運用できることを示す演習を実施すると告知されました。数時間にわたって AWS グローバルネットワークのバックボーン (AWS リージョン間を結ぶプライベートネットワーク) との接続を断った状態で運用します。機械学習ブログでは、AWS vLLM-Omni Deep Learning Container を使ったリアルタイム推論の記事が 2 本公開されました。Part 1 では音声合成モデルを Amazon SageMaker AI にデプロイし、持続的な双方向接続の上で生成した音声をストリーミングします。Part 2 では 1 つの同じコンテナから 2 つの生成メディアモデルを動かし、FLUX.2-klein でリアルタイム推論による画像生成を行い、それを Wan2.1-VACE で非同期推論により動画へアニメーション化する流れを扱っています。監視では、Amazon Nova Act と Amazon Bedrock AgentCore を使ったエージェント駆動の合成監視 (synthetic monitoring) が紹介されました。壊れやすい UI スクリプトから抜け出し、回復力のあるマネージドなユーザージャーニー検証を行うためのアーキテクチャとパターンが示されています。文書処理では、Amazon Textract の Custom Queries アダプターを本番運用に乗せる方法が解説されました。AWS CloudFormation と Terraform によるコードでのインフラ管理、アカウントをまたぐアダプターの昇格プロセス、複数の帳票バージョンを扱うための事前分類によるルーティングパターンを扱っています。コンピュートでは、AWS Lambda が 2,048 MB 以上のメモリを持ち VPC 外で動作する関数について、スケーラブルなネットワーク帯域に対応しました。持続スループットが 625 Mbps から最大 3,000 Mbps まで伸びます。Amazon EventBridge は Custom event bus を再ローンチし、プラットフォームチームが統制された 1 つのバスを組織全体で共有しながら、各アプリケーションチームが自分たちの側から発行・購読できる構成が取れるようになりました。このほか、Amazon Rekognition Face Liveness が Feedback Codes を返すようになり、ライブネスチェックのスコアが低かった理由と、利用者がどう再試行すればよいかを把握できます。Amazon EC2 の Future-dated Capacity Reservations は開始日の延期に対応しました (最大 120 日先まで、必要な容量・開始日・コミットメント期間を指定して容量を確保する仕組みです)。日本語ブログでは、送配電事業 (Transmission & Distribution) の T&D エグゼクティブ・ラウンドテーブルの開催報告が公開され、熟練技術者の高齢化と定年退職による暗黙知の喪失、再エネ大量導入に伴う系統の複雑化、設備の老朽化と新規投資の削減圧力、量子コンピュータ時代を見据えたサイバー脅威の高度化といった課題が扱われています。また、HR データ統合基盤を題材に、HR Open Standards を活用した共通オントロジーの設計の考え方と、取込・質問応答・推論への使い方を解説する記事も公開されました。まとめとしては AWS Weekly Roundup (2026 年 9 月 28 日) が公開され、先週を貫いたテーマは「選択肢」であり、フロンティアモデルが次々と登場する中で問いは「どれだけ賢いか」だけではなく「どのモデルがどの工程に合うか」に移っている、として、Amazon Bedrock に加わった GPT-6 Sol と Luna、Claude Opus 5.5、Strands のハーネスなどが取り上げられています。ネットワークセキュリティでは、Amazon Route 53 Resolver DNS Firewall の Palo Alto Networks (PANW) Advanced DNS Security 対応が 32 の AWS リージョンで一般提供となりました。AWS Summit New York City でプレビュー公開されていたもので、別途ファイアウォールを立てたり VPC の構成を変えたりせずに、PANW のルールを使って VPC から出る悪意ある DNS トラフィックを検知・ブロックできます。コマンド&コントロール、マルウェア、フィッシング、新規登録ドメインといった DNS の脅威保護を Route 53 DNS Firewall のルールとして適用でき、Route 53 Resolver エンドポイント経由でハイブリッド環境にも効かせられます。運用では、AWS Systems Manager が AWS Resource Access Manager (AWS RAM) 経由でのドキュメント共有に対応しました。これまでは一般公開か、個別のアカウント ID を列挙するかしかありませんでしたが、組織全体や特定の組織単位 (OU) を指定して SSM ドキュメントを共有でき、アカウントが組織や OU に追加・削除されると共有状態が自動で追随するため、アカウントを手作業で追いかける必要がなくなります。共有は AWS RAM とリソースベースのポリシーで管理されるため、アクセスは標準の AWS の認可を通ります。機械学習ブログでは、エージェントの出力が毎回変わることに自動で追随する AI インターフェイスの作り方が紹介されました。動的な UI 生成には AG-UI プロトコル、説明可能なマルチエージェント協調には Strands Agents SDK の swarm パターン、API を持たないレガシーシステムの取り込みには Amazon Nova Act を使う構成です。
