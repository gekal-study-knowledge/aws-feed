  "79f97c632195971dc051bb59aa3205c6":
    "id": "79f97c632195971dc051bb59aa3205c6"
    "title": "Amazon EC2 Future-dated Capacity Reservations Now Supports Postponing Start Dates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-fcr-postpone-start-date/"
    "published": "2026-09-29 06:17:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>Amazon EC2 Future-dated Capacity Reservations let you secure capacity up to 120 days in advance by specifying the capacity you need, the start date, and a commitment duration. If your plans change before delivery, you can now postpone your start date to match your new timeline.</p>\n<p>When you postpone your start date, EC2 presents a quote that shows the new start date and the required commitment duration. The commitment duration can increase, depending on when you postpone the start date. After you review and accept the quote, EC2 updates your reservation with the new start date.</p>\n<p>This feature is available to all Future-dated Capacity Reservation customers. Refer to the <a href=\"https://builder.aws.com/build/capabilities/explore\">AWS Capabilities by Region</a> website for the feature's regional availability. For more details, refer to the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/capacity-reservations-modify.html\">Capacity Reservation user guide</a>.</p>"
  "d7940b166b2bd909a9a07141e7101920":
    "id": "d7940b166b2bd909a9a07141e7101920"
    "title": "Amazon Rekognition Face Liveness now returns Feedback Codes"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/rekognition-liveness-feedback-codes/"
    "published": "2026-09-29 05:41:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>Amazon Rekognition Face Liveness now returns Feedback Codes that help customers understand why a liveness check&nbsp;received a low score and how users could retry successfully. The codes are returned in the GetFaceLivenessSessionResults API response, and they identify the specific conditions that contributed to the low score, such as poor lighting, face obstruction, closed eyes, or low video quality. Customers can surface these codes to their end users who can then make targeted corrections and retry with confidence. A single session can return multiple Feedback Codes at once, allowing users to resolve all contributing issues in one retry.&nbsp;This feature is especially useful in identity verification onboarding, re-authentication flows, and accessibility scenarios.</p>\n<p>Amazon Rekognition Face Liveness verifies that the person in front of the camera is a real, live human (instead of a photo, video replay, mask, or deepfake) through a short, guided selfie-video check. It returns a confidence score, a reference image for face matching, and session audit images.&nbsp;\n <br />\n <br />\n Rekognition Face Liveness is available in US East (N. Virginia), US West (Oregon), Europe (Ireland), Asia Pacific (Tokyo, Mumbai, Malaysia, Thailand), and South America (São Paulo). To learn more, visit the <a href=\"https://docs.aws.amazon.com/rekognition/latest/dg/face-liveness-programming-api.html\">Amazon Rekognition Face Liveness API documentation</a> and <a href=\"https://docs.aws.amazon.com/rekognition/latest/dg/face-liveness-faq.html\">Face Liveness FAQ</a>.</p>"
  "0fadd7ee91225a7855eb215b0adc98f3":
    "id": "0fadd7ee91225a7855eb215b0adc98f3"
    "title": "Grok 4.7 is now available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-grok-4-7/"
    "published": "2026-09-29 03:29:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>Amazon Bedrock now supports SpaceXAI Grok 4.7, a frontier model built for coding, agentic tasks, and knowledge work, with US Geo and Global cross-Region inference. &nbsp;</p>\n<p>Grok 4.7 builds on Grok 4.6 with better mixed-document handling, more dependable repo-scale coding with planning and error recovery, and enhanced browser-use agents for form fills and portal navigation. &nbsp;</p>\n<p>Get started with Grok 4.7 in the<a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-xai-grok-4-7.html\">Amazon Bedrock documentation</a>. To learn more, read the launch <a href=\"https://aws.amazon.com/blogs/machine-learning/grok-4-7-is-now-available-on-amazon-bedrock/\">blog post</a>.</p>\n<p>&nbsp;</p>"
  "ef9850d4d91adfb8a7f8fed3bbe66283":
    "id": "ef9850d4d91adfb8a7f8fed3bbe66283"
    "title": "Claude Sonnet 5.5 now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-sonnet-5-5-aws/"
    "published": "2026-09-29 00:00:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>AWS now offers Claude Sonnet 5.5, a smarter and more efficient Sonnet that delivers a clear leap forward on coding and knowledge work with at a lower cost per task for most work at faster speed.</p>\n<p>Claude Sonnet 5.5 is a smarter, more efficient Sonnet and a step up from Sonnet 5, making it a natural upgrade for teams already building on Sonnet. It's stronger for coding, completing well-scoped tasks as part of a larger coding strategy such as building and fixing features with Claude in the same session or verifying output against requirements. And it produces ready-to-share knowledge work, from 1-pagers, diagrams, and summary slides to document edits and spreadsheet cleanup.</p>\n<p>Customers have two ways to access Claude Sonnet 5.5: Amazon Bedrock and Claude Platform on AWS.</p>\n<p>Amazon Bedrock gives you Sonnet's capabilities while keeping your data within AWS infrastructure with regional data residency and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html?refid=7ecf60df-6136-414c-a7c3-6aa4d2d6019f#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability</a>.&nbsp;</p>\n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the Claude Platform on AWS <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html?refid=7ecf60df-6136-414c-a7c3-6aa4d2d6019f\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
