    "title": "CVE-2026-85656 - OS command injection in Amazon log4j-cve-2021-44228-hotpatch"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-098-aws/"
    "published": "2026-09-05 02:37:16"
    "fetched": "2026-09-05 03:01:55"
    "summary": "<p><b>Bulletin ID:</b> 2026-098-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 10:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>log4j-cve-2021-44228-hotpatch is a tool which injects a Java agent into a running JVM process. The agent will attempt to patch the lookup() method of all loaded org.apache.logging.log4j.core.lookup.JndiLookup instances to unconditionally return the string \"Patched JndiLookup::lookup()\". It is designed to address the CVE-2021-44228 remote code execution issue in Log4j without restarting the Java process. We identified CVE-2026-85656, an OS command injection issue in the log4j-cve-2021-44228-hotpatch package in Amazon Linux before 1.3-9.amzn2 might allow a local user to execute arbitrary commands with root privileges via a Java process whose executable path contains embedded newline characters.</p> \n<p><b>Impacted versions:</b> &lt;=1.3-8.amzn2</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-09-05 03:01:55 JST"
