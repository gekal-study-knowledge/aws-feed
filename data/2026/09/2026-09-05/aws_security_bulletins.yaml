  "dbe16ff884a40984ce65bfe71ddc70d4":
    "id": "dbe16ff884a40984ce65bfe71ddc70d4"
    "title": "CVE-2026-85656 - OS command injection in Amazon log4j-cve-2021-44228-hotpatch"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-098-aws/"
    "published": "2026-09-05 02:37:16"
    "fetched": "2026-09-05 03:01:55"
    "summary": "<p><b>Bulletin ID:</b> 2026-098-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 10:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>log4j-cve-2021-44228-hotpatch is a tool which injects a Java agent into a running JVM process. The agent will attempt to patch the lookup() method of all loaded org.apache.logging.log4j.core.lookup.JndiLookup instances to unconditionally return the string \"Patched JndiLookup::lookup()\". It is designed to address the CVE-2021-44228 remote code execution issue in Log4j without restarting the Java process. We identified CVE-2026-85656, an OS command injection issue in the log4j-cve-2021-44228-hotpatch package in Amazon Linux before 1.3-9.amzn2 might allow a local user to execute arbitrary commands with root privileges via a Java process whose executable path contains embedded newline characters.</p> \n<p><b>Impacted versions:</b> &lt;=1.3-8.amzn2</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "02d85ffc00ca30607018259b0c879153":
    "id": "02d85ffc00ca30607018259b0c879153"
    "title": "CVE-2026-85781 - Unverified access point ownership in Amazon EFS CSI Driver"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-099-aws/"
    "published": "2026-09-05 04:03:02"
    "fetched": "2026-09-05 06:11:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-099-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 11:45 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The Amazon EFS CSI Driver is an open-source Kubernetes Container Storage Interface (CSI) driver that lets Kubernetes workloads use Amazon EFS file systems. We identified CVE-2026-85781, an issue in the driver's volume-deletion logic. When the controller is configured with the non-default --delete-access-point-root-dir=true option, it did not verify that the EFS access point referenced by a PersistentVolume's volume handle belonged to the file system referenced by that same volume handle. An authenticated Kubernetes user with permission to create PersistentVolumes could use a crafted volume handle to cause the controller to recursively delete directories from an Amazon EFS file system that the user was not otherwise authorized to modify. This issue does not affect Amazon EFS itself; Amazon EFS access controls operated as designed.</p> \n<p><b>Impacted versions:</b> &lt;=3.4.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "29a8ab91d382a096bec7e0fd54ca1d3e":
    "id": "29a8ab91d382a096bec7e0fd54ca1d3e"
    "title": "CVE-2026-85786 - Incomplete fix for CVE-2026-75936 memory-amplification denial of service in Amazon ion-java"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-100-aws/"
    "published": "2026-09-05 04:24:10"
    "fetched": "2026-09-05 06:11:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-100-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 12:30 PM PDT</p> \n<p><b>Description:</b></p> \n<p>ion-java is a Java library that implements the Amazon Ion data format specification. We identified CVE-2026-85786, memory-amplification denial of service via highly compressed data expansion. ion-java 1.12.0 added a GZIP auto-decompression opt-out for CVE-2026-75936, but the implementation of the opt-out in 1.12.0 was insufficient to address the issue.</p> \n<p><b>Impacted versions:</b> &lt; 1.12.1</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "a9b3c70de52f774b9f655d40ff5ceccd":
    "id": "a9b3c70de52f774b9f655d40ff5ceccd"
    "title": "CVE-2026-85654 - Code injection in the CDK generator in Amazon awslabs.dynamodb-mcp-server"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-097-aws/"
    "published": "2026-09-05 04:47:32"
    "fetched": "2026-09-05 06:11:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-097-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 10:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Amazon awslabs.dynamodb-mcp-server is an open-source Model Context Protocol (MCP) server that enables AI coding assistants to interact with Amazon DynamoDB, including table design, data modeling, and CDK infrastructure generation. We identified CVE-2026-85654, an improper neutralization of special elements used in a template engine in the CDK generator component. Under certain circumstances, a context-dependent actor could execute arbitrary code on the host that deploys the generated application via crafted table, index, or attribute names in a data model file.</p> \n<p><b>Impacted versions:</b> &gt;= 2.0.10 AND &lt;= 2.1.5</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "9bc19b2c4a7dbd545fc686c152d8dd1d":
    "id": "9bc19b2c4a7dbd545fc686c152d8dd1d"
    "title": "CVE-2026-85787 - An incomplete list of disallowed inputs in the SQL validation component in Amazon awslabs postgres-mcp-server to modify data beyond the read-only scope"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-101-aws/"
    "published": "2026-09-05 05:08:08"
    "fetched": "2026-09-05 06:11:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-101-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/04/2026 13:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>We have identified CVE-2026-85787, an incomplete list of disallowed inputs in the SQL validation component in Amazon awslabs postgres-mcp-server before version 1.1.7 might allow an unauthenticated actor to modify data beyond the read-only scope by placing crafted SQL into the content that is submitted when an authenticated user interacts with the MCP server.</p> \n<p><b>Impacted versions:</b> any pypi package version &lt; 1.1.7</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
