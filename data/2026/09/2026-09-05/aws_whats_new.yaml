  "261cdcd08d160c9ef02080b082fc7711":
    "id": "261cdcd08d160c9ef02080b082fc7711"
    "title": "Amazon EC2 now supports specifying compatible instance types on AMIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-images-supported-instances"
    "published": "2026-09-05 04:26:00"
    "fetched": "2026-09-05 06:11:39"
    "summary": "<p>Amazon EC2 now enables AMI owners to define which instance types are compatible with their AMIs. Owners can specify supported instance types, unsupported instance types, or both — and any launch attempt on a non-permitted instance type is automatically blocked.</p> \n<p>AMI owners now have a built-in way to prevent launches on instances that are not compatible with their AMIs. This reduces the risk of failed launches due to incompatible instance-AMI pairings. By default, an AMI can be launched on any instance type, so existing workflows remain unaffected until restrictions are explicitly applied.</p> \n<p>This feature is available in all AWS Regions at no additional cost. To learn more, please visit the <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ami-allowed-instance-types.html\">documentation</a>.</p>"
  "637fda7ea81dd656a7bad6887ba038d3":
    "id": "637fda7ea81dd656a7bad6887ba038d3"
    "title": "AWS MCP Server adds a serverless capability for AWS Lambda functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-mcp-server-serverless/"
    "published": "2026-09-05 01:31:00"
    "fetched": "2026-09-05 06:11:39"
    "summary": "<p>Today, <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html\" target=\"_blank\">AWS Model Context Protocol Server</a> (AWS MCP Server) added a serverless capability so that coding agents such as Claude Code and Kiro can efficiently diagnose issues with your Lambda functions. The serverless capability helps you troubleshoot your running Lambda functions and their connected resources.</p> \n<p>The AWS MCP Server, available through the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\" target=\"_blank\">Agent Toolkit for AWS</a> or as a standalone installation, is a managed service that gives AI coding agents secure access to AWS services. With the new AWS MCP Sever serverless capability, your coding agent inspects your Lambda function and its connected resources across Amazon API Gateway, Amazon EventBridge, Amazon S3, Amazon DynamoDB, Amazon SNS, Amazon SQS, and AWS Step Functions. The agent can correlate error signals against a 7-day baseline to pinpoint what changed, surface recurring errors to identify trends, retrieve the deployed configuration of your function and connected resources, provide a timeline of recent changes to track what happened, and analyze service latency across connected resources. As the agent gets comprehensive data in a single call, it consumes fewer tokens compared to orchestrating multiple API calls.</p> \n<p>To get started, configure the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\" target=\"_blank\">Agent toolkit for AWS</a> by running ‘aws configure agent-toolkit’ from the AWS CLI, or enable the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html\" target=\"_blank\">AWS MCP Server</a> directly.</p> \n<p>The AWS MCP Server can access services in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">AWS Regions</a>, while the AWS MCP Server itself runs in the US East (N. Virginia) and Europe (Frankfurt) Regions. The serverless diagnostic capabilities in the AWS MCP Server are available at no additional cost. To learn more, see the <a href=\"https://docs.aws.amazon.com/agent-toolkit/latest/userguide/capabilities.html\" target=\"_blank\">user guide</a>.&nbsp;&nbsp;&nbsp;</p>"
  "6a38e5008530c96ca716bde1a2df28ea":
    "id": "6a38e5008530c96ca716bde1a2df28ea"
    "title": "Amazon ECS introduces Early Success Criteria for service deployments"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-deployments-early-success/"
    "published": "2026-09-05 02:00:00"
    "fetched": "2026-09-05 08:40:07"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\" target=\"_blank\">Amazon Elastic Container Service</a> (Amazon ECS)&nbsp;now supports Early Success Criteria for rolling service deployments, giving you the flexibility to define when a deployment is considered successful based on your confidence level and the operational needs of your workload. This can help you complete deployments sooner and unblock subsequent deployments, CI/CD pipelines, and other dependent operations.</p> \n<p>With Early Success Criteria, you configure the healthy percent - the proportion of desired tasks that must be running and healthy on the target service revision before the deployment is marked successful. For example, with a desired count of 100 and a healthy percent of 90%, Amazon ECS marks the deployment successful after 90 tasks are healthy and continues launching the remaining tasks through regular service scaling, outside the deployment lifecycle. This can benefit workloads running on specialized or constrained capacity, such as GPU-accelerated inference workloads, where hardware availability can extend task launch times. Early Success Criteria also gives you more control over how long deployment rollback monitoring applies, allowing it to protect the deployment until your configured success criteria are met while subsequent scale-out continues through regular service scaling. You can also choose how Amazon ECS handles source service revision cleanup using BLOCKING or DEFERRED. With BLOCKING, Amazon ECS completes source revision cleanup before declaring success. With DEFERRED, Amazon ECS declares success when the criteria are met and drains source revision tasks asynchronously outside the deployment. This benefits services with active long-lived connections or task scale-in protection, where source revision tasks may need to remain running without holding the deployment open.</p> \n<p>The feature is available with the rolling deployment strategy in all AWS Commercial and AWS GovCloud (US)&nbsp;<a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" target=\"_blank\">Regions</a>. You can configure Early Success Criteria for new and existing Amazon ECS services using the AWS Management Console, AWS CLI, AWS SDKs, and infrastructure as code (IaC) tools. To learn more, see our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/early-success-criteria.html\" target=\"_blank\">documentation</a>.</p>"
  "fb77a3b40c6243af69e9ece7236fdb38":
    "id": "fb77a3b40c6243af69e9ece7236fdb38"
    "title": "Amazon Bedrock Managed Knowledge Base introduces user-managed setup for SharePoint, OneDrive, and Confluence data sources"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-user-managed-setup-sharepoint-onedrive-confluence/"
    "published": "2026-09-05 06:29:00"
    "fetched": "2026-09-05 11:44:15"
    "summary": "<p>AWS announces user-managed setup (3LO) for SharePoint, OneDrive, and Confluence data sources in Amazon Bedrock Managed Knowledge Base. Previously, configuring these data sources required generating 2LO credentials on the third-party side, which could be time-consuming and inaccessible for users who lack admin-level access to those systems. With user-managed setup, you simply sign in with your existing third-party credentials, and Amazon Bedrock Managed Knowledge Base handles authentication—allowing you to complete data source setup in just a few minutes.<br /> This streamlined experience lowers the barrier to getting started with managed knowledge bases. Teams that want to quickly prototype an AI assistant grounded in their SharePoint documentation, OneDrive files, or Confluence wikis no longer need to coordinate with IT administrators to obtain service account credentials. User-managed setup complements the existing service account authentication, giving you a faster path to connect your data while still preserving the programmatic, enterprise-grade option for production workloads.<br /> To get started, see the following resources:;&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sharepoint-3lo-setup.html\" target=\"_blank\">SharePoint user-managed setup</a> in the Amazon Bedrock User Guide,&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-onedrive-3lo-setup.html\" target=\"_blank\">OneDrive user-managed setup</a> in the Amazon Bedrock User Guide and,&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-confluence-3lo-setup.html\" target=\"_blank\">Confluence user-managed setup</a> in the Amazon Bedrock User Guide</p>"
  "740be0ab39366fa82b75ab2da2581284":
    "id": "740be0ab39366fa82b75ab2da2581284"
    "title": "Amazon Bedrock Managed Knowledge Base now supports ServiceNow as a native data source connector"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-servicenow-native-data-source-connector/"
    "published": "2026-09-05 06:14:00"
    "fetched": "2026-09-05 11:44:15"
    "summary": "<p>AWS announces the ServiceNow data source connector for Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service. Customers can now connect their ServiceNow instance to crawl knowledge articles and service catalog items directly into their managed knowledge base. Previously, bringing ServiceNow content into Bedrock Knowledge Bases required building and maintaining custom ingestion pipelines—now, you simply provide your ServiceNow instance credentials, and the connector handles data crawling, metadata extraction, and incremental sync automatically.<br /> The ServiceNow connector crawls knowledge articles and service catalog items, including file attachments, giving your AI agents access to the institutional knowledge already maintained in ServiceNow. You can scope crawls to specific knowledge bases, article categories, or service catalogs using sys ID inclusion lists, ensuring only relevant content is ingested. This makes it straightforward to power employee-facing IT assistants, HR helpdesks, or customer support agents grounded in your organization's up-to-date ServiceNow content.<br /> To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-servicenow.html\" target=\"_blank\">ServiceNow data source</a> in the Amazon Bedrock User Guide. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">Amazon Bedrock Knowledge Bases product page</a>.<br /> <br /> <br /> </p>"
  "73abf053c1a2cbcf13c1db6d9519cb60":
    "id": "73abf053c1a2cbcf13c1db6d9519cb60"
    "title": "Amazon Bedrock Managed Knowledge Base now supports automatic sync scheduling for data source connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-automatic-sync-scheduling-data-source-connectors/"
    "published": "2026-09-05 06:01:00"
    "fetched": "2026-09-05 11:44:15"
    "summary": "<p>AWS announces automatic sync scheduling for Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service that handles data ingestion, storage optimization, and advanced retrieval without requiring you to manage vector databases or data pipelines. Previously, keeping your knowledge base current required manually triggering a sync each time your source data changed or building a custom solution. Now, you can configure daily, weekly, or monthly sync schedules for all native data source connectors, so your AI agents always retrieve the most up-to-date information.<br /> With automatic sync scheduling, you can match your sync frequency to how often your source content changes. For example, set a daily sync for a rapidly evolving customer support knowledge base in Confluence, a weekly sync for SharePoint policy documents that update periodically, or a monthly sync for reference materials stored in Amazon S3. This eliminates the need to build and maintain custom scheduling workarounds, reducing operational overhead while ensuring your retrieval-augmented generation applications stay grounded in current enterprise data.<br /> To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-sync.html#kb-managed-sync-schedule\">Sync scheduling for data sources</a> in the Amazon Bedrock User Guide. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
"last_updated": "2026-09-05 11:44:15 JST"
