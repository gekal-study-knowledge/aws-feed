"overview": |
  この日は 32 件と多く、AgentCore Runtime の刷新、Kiro への Claude Fable 5.1 追加、新しい EC2 インスタンス、そして欧州ソブリンクラウドでのオープンウェイトモデル提供が目立ちました。Amazon Bedrock AgentCore では次世代の AgentCore Runtime が利用可能になり、サーバーレスの microVM コンピュートにおいてメモリを弾力的に管理できるようになりました。Kiro では Claude Fable 5.1 がエンタープライズ顧客向けに利用可能になり、長時間でコンテキスト量の多いエージェントセッションでも、症状を並べるのではなくコードの根本原因まで追跡し、複雑なタスクの全体にわたってコンテキストと意図を保持するとされています。コンピューティングでは、カスタムの第 6 世代 Intel Xeon 6 (Granite Rapids) を搭載した低価格のバースト可能な Amazon EC2 T8i インスタンスが一般提供となり、AWS Elastic Beanstalk の Cluster Mode は、コンテナイメージやソースコードを渡すだけで背後のコンピュートを意識せずにアプリケーションを実行できる形で解説されています。AWS Batch は CancelJobs・TerminateJobs・TerminateServiceJobs API により 1 回の呼び出しで最大 50 ジョブをまとめてキャンセル・終了できるようになり、AWS HealthOmics は IAM セッションポリシーに対応して実行ごとの権限を個別のロール作成なしに制限でき、AWS Transfer Family は NLB の背後に置いた VPC ホスト型エンドポイントの SFTP サーバーで Proxy Protocol v2 によりクライアントの送信元 IP を保持できるようになりました。AWS European Sovereign Cloud では、EU 域内にデータを保ったまま Amazon Bedrock でオープンウェイトモデルを使った生成 AI ワークロードを実行できるようになっています。機械学習ブログでは、EKS 向けの GPU 認識型ルーティングアドオン Amazon SageMaker HyperPod Inference Gateway、Amazon Quick 上で Microsoft Entra ID のグループ・クレームベースの JWT を使って MCP ツールに多層防御の認可をかける方法、約 400 人の従業員に安全なセルフサービス AI エージェントを提供した MRH Trowe の事例、Wood Mackenzie が AgentCore 上に構築した共有エージェント基盤 APEX、Bedrock Knowledge Bases のベクトルストア選定の比較、合成データで産業安全 AI を強化するパイプライン、GitHub / GitLab の Git メトリクスを Quick Sight で可視化するサーバーレス構成、AI 面接や評価を備えた Amazon Connect Talent が紹介されました。アーキテクチャブログでは、DHI Group によるハッカソンを通じた生成 AI の本番化、マルチ病院ネットワーク向けのクラウドネイティブ PACS、Equinix が EKS 上の共有サービスアーキテクチャで運用負荷を削減した事例、CSIRO のゲノムバリアント検索基盤 sBeacon が取り上げられました。コンピュートブログでは、Local Zones と Outposts ラックを使った災害復旧計画、規制対象ワークロードの配置、EC2 Auto Scaling のマルチモーダルオートスケーリングが解説されています。AWS ジャパンブログでは、NTT ドコモの AI-DLC 実践 (全 2 回)、レスターの Bedrock による情報プラットフォーム、AgentCore と Strands を基盤に SOP を実行時に解釈して ERP の例外を自律解決する「エージェント型 SOP」、SAP Commerce Cloud と SAP Cloud ERP Private on AWS の統合、RDS for SQL Server の Bring Your Own Media (BYOM) によるライセンスモビリティと License Included からの変換手順が公開されました。セキュリティ速報では、AWS IoT Device SDK for Python における証明書のホスト名不一致の検証不備 (CVE-2026-92943) が Important として公開されています。
