    "title": "RDS for SQL Server インスタンスを License Included から Bring Your Own Media (BYOM) へ変換"
    "link": "https://aws.amazon.com/jp/blogs/news/converting-an-rds-for-sql-server-instance-from-license-included-to-bring-your-own-media-byom/"
    "published": "2026-09-18 12:00:53"
    "fetched": "2026-09-18 17:06:34"
    "summary": "本記事では、RDS for SQL Server インスタンスを License Included から Bring Your Own Media (BYOM) へ変換するためのインストールメディアの準備、BYOM エンジンバージョンの作成、インプレースでのライセンスモデル変更というエンドツーエンドの変換プロセスを説明します。"
  "563b823ef71d8e5ff64be22281763243":
    "id": "563b823ef71d8e5ff64be22281763243"
    "title": "フルマネージドの Amazon RDS for SQL Server で Bring Your Own Media によるライセンスモビリティの実現"
    "link": "https://aws.amazon.com/jp/blogs/news/unlock-license-mobility-with-bring-your-own-media-on-fully-managed-amazon-rds-for-sql-server/"
    "published": "2026-09-18 11:59:44"
    "fetched": "2026-09-18 17:06:34"
    "summary": "Amazon RDS for SQL Server の Bring Your Own Media (BYOM) は、既存の SQL Server インストールメディアと、すでに投資済みのライセンスを持ち込み、フルマネージドデータベースサービスである RDS for SQL Server 上で追加のライセンス費用なしに利用できます。本記事では、SQL Server のインストールメディアを Amazon Simple Storage Service (Amazon S3) にアップロードし、BYOM インスタンスを起動する方法を説明します。"
