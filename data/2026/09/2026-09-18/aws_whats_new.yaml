    "title": "AWS Batch now supports bulk job cancellation and termination"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-batch-bulk-cancellation/"
    "published": "2026-09-18 02:23:00"
    "fetched": "2026-09-18 03:46:03"
    "summary": "<p>AWS Batch now supports bulk job cancellation and termination, enabling you to cancel or terminate up to 50 jobs with a single API call. The new CancelJobs, TerminateJobs, and TerminateServiceJobs APIs reduce the operational complexity of managing large-scale batch workloads, letting you act on groups of jobs at once and receive per-job results in a single response. Additionally, ListJobs now returns isCancelled and isTerminated fields, and ListServiceJobs returns isTerminated, making it easier to track the lifecycle state of your jobs.</p> \n<p>To get started, call CancelJobs for jobs in SUBMITTED, PENDING, or RUNNABLE states, or TerminateJobs and TerminateServiceJobs for jobs in any state, including STARTING and RUNNING. All three APIs accept up to 50 job IDs and work with individual and array jobs. You can access them through the AWS CLI or AWS SDKs.</p> \n<p>Bulk job cancellation and termination is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see <a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_CancelJobs.html\">CancelJobs</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_TerminateJobs.html\">TerminateJobs</a>, and <a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_TerminateServiceJobs.html\">TerminateServiceJobs</a> pages in the AWS Batch API Reference Guide.</p>"
"last_updated": "2026-09-18 03:46:03 JST"
