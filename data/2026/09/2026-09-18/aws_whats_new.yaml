  "1b32cb3e79ef777f9c3db196b34d1094":
    "id": "1b32cb3e79ef777f9c3db196b34d1094"
    "title": "AWS Batch now supports bulk job cancellation and termination"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-batch-bulk-cancellation/"
    "published": "2026-09-18 02:23:00"
    "fetched": "2026-09-18 03:46:03"
    "summary": "<p>AWS Batch now supports bulk job cancellation and termination, enabling you to cancel or terminate up to 50 jobs with a single API call. The new CancelJobs, TerminateJobs, and TerminateServiceJobs APIs reduce the operational complexity of managing large-scale batch workloads, letting you act on groups of jobs at once and receive per-job results in a single response. Additionally, ListJobs now returns isCancelled and isTerminated fields, and ListServiceJobs returns isTerminated, making it easier to track the lifecycle state of your jobs.</p> \n<p>To get started, call CancelJobs for jobs in SUBMITTED, PENDING, or RUNNABLE states, or TerminateJobs and TerminateServiceJobs for jobs in any state, including STARTING and RUNNING. All three APIs accept up to 50 job IDs and work with individual and array jobs. You can access them through the AWS CLI or AWS SDKs.</p> \n<p>Bulk job cancellation and termination is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where AWS Batch is available. For more information, see <a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_CancelJobs.html\">CancelJobs</a>,&nbsp;<a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_TerminateJobs.html\">TerminateJobs</a>, and <a href=\"https://docs.aws.amazon.com/batch/latest/APIReference/API_TerminateServiceJobs.html\">TerminateServiceJobs</a> pages in the AWS Batch API Reference Guide.</p>"
  "f6994cae8a22042b363bf59c3002c0b7":
    "id": "f6994cae8a22042b363bf59c3002c0b7"
    "title": "AWS Transfer Family now supports source IP preservation for SFTP servers behind a Network Load Balancer (NLB)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/transfer-family-sftp-source-ip-nlb/"
    "published": "2026-09-18 04:00:00"
    "fetched": "2026-09-18 06:53:22"
    "summary": "<p>AWS Transfer Family now preserves the client's source IP address using Proxy Protocol v2 (PPv2) when you place a Network Load Balancer (NLB) in front of your SFTP server that uses a VPC-hosted endpoint. You can now retain visibility of the client's source IP for IP-based auditing, access controls, and compliance when you use your own NLB.</p> \n<p>Previously, an NLB replaced the client's source IP with its own private IP address, so your Transfer Family logs and events recorded the NLB's address instead of the client's source IP. Because the NLB's private IP was the address presented to your custom identity provider during authentication, you couldn't authorize users based on their true source IP. With this launch, you can enable source IP preservation on your SFTP server so that the client's source IP is preserved. The preserved source IP is recorded in your logs and events and presented to your custom identity provider during authentication. You can enable the feature on each Transfer Family server individually through the console, CLI, or API.</p> \n<p>Source IP preservation for SFTP servers is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions where AWS Transfer Family is available</a>. To get started, visit the AWS Transfer Family console or use the AWS CLI/SDK. To learn more, visit the <a href=\"https://aws.amazon.com/about-aws/whats-new/recent/feed/Transfer%20Family%20User%20Guide\">Transfer Family User Guide</a>.</p>"
  "f36a7b20bdf9eefa7c471cbdf99067ae":
    "id": "f36a7b20bdf9eefa7c471cbdf99067ae"
    "title": "AWS HealthOmics now supports IAM session policies"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/omics-iam-session-policy/"
    "published": "2026-09-18 03:32:00"
    "fetched": "2026-09-18 06:53:22"
    "summary": "<p>AWS HealthOmics now supports IAM session policies, enabling you to restrict permissions for individual runs without creating and managing multiple IAM roles. Until now, there was no way to dynamically scope down permissions for a single run, requiring you to create a separate IAM role for each tenant or run. AWS HealthOmics is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs with fully managed bioinformatics workflows.</p> \n<p>An IAM session policy is an inline policy that limits the maximum permissions of a run without modifying the underlying service role. Your effective permissions during a run are the intersection of permissions allowed by both the underlying identity-based policy and the temporary session policy. For example, if you operate a multi-tenant application, you can pass a session policy that limits a run's access to only that tenant's Amazon S3 buckets, without provisioning a dedicated IAM role for that tenant. You can also use IAM session policies to grant temporary access to specific Amazon S3 objects for a single run, and isolate access to sensitive resources on a per-run basis.</p> \n<p>IAM session policy support is available in all AWS Regions where AWS HealthOmics is available: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Tokyo, Singapore, Seoul). To learn how to configure IAM session policies for your runs, visit the Permissions section of the &nbsp;<a href=\"https://docs.aws.amazon.com/omics/latest/dev/permissions-service.html\">AWS HealthOmics User Guide</a>. To learn more about the service, visit &nbsp;<a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a>.</p>"
  "d7b03c9ae734a7dc7e0a5c0818d3d4b3":
    "id": "d7b03c9ae734a7dc7e0a5c0818d3d4b3"
    "title": "Introducing Amazon EC2 T8i instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-t8i-instances-ga/"
    "published": "2026-09-18 00:00:00"
    "fetched": "2026-09-18 08:52:35"
    "summary": "<p>AWS is announcing the general availability of new low-cost burstable Amazon EC2 T8i instances. These instances are powered by custom sixth generation Intel Xeon 6 processors, available exclusively on AWS, and built on the latest sixth generation AWS Nitro cards. T8i instances deliver up to 30% better price performance compared to previous generation T3 instances, and offer four sizes: nano, micro, small, and medium. These instances are designed for workloads requiring low to moderate CPU utilization, including data processing, login gateways, small databases, batch processing, event driven functions, CI/CD pipelines, microservices, and low traffic websites. &nbsp;</p> \n<p>T8i instances deliver up to 70% higher compute performance, 1.25x higher network bandwidth, and 2.4x higher EBS bandwidth compared to T3 instances. They use the same CPU credit system as T3 with Standard and Unlimited modes, so existing T3 customers can upgrade to T8i and immediately benefit from better price performance, enabling them to lower their TCO. For customers new to AWS or migrating from on-premises, T8i instances provide one of the most cost-effective entry points to run a variety of workloads.</p> \n<p>T8i.micro and T8i.small are available under the <a href=\"https://aws.amazon.com/free/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Free Tier</a>.&nbsp;T8i instances are available in US East (N. Virginia, Ohio), US West (Oregon, N. California), Europe (Frankfurt, Ireland, London, Paris), Asia Pacific (Hyderabad, Malaysia, Mumbai, Seoul, Singapore, Sydney, Tokyo), and Canada (Central) regions.&nbsp;T8i instances are available to purchase via On-Demand instances, and Spot instances with Savings Plan option coming soon. To learn more, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/t8i/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon EC2 T8i instances page</a>.</p>"
