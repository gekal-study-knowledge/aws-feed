    "title": "Multi-modal autoscaling with Amazon EC2 Auto Scaling: adding signals for faster, more reliable scaling"
    "link": "https://aws.amazon.com/blogs/compute/multi-modal-autoscaling-with-amazon-ec2-auto-scaling-adding-signals-for-faster-more-reliable-scaling/"
    "published": "2026-09-18 03:18:38"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Multi-modal autoscaling with Amazon EC2 Auto Scaling combines infrastructure metrics like CPU with application-level signals, so a group scales on the demand its users create. In this post, we show you how to implement it, with code samples and results from a controlled test."
  "c75c6bdfc3e49808411c1309def562cb":
    "id": "c75c6bdfc3e49808411c1309def562cb"
    "title": "Deploying regulated workloads on AWS Local Zones and AWS Outposts"
    "link": "https://aws.amazon.com/blogs/compute/deploying-regulated-workloads-on-aws-local-zones-and-aws-outposts/"
    "published": "2026-09-18 02:29:40"
    "fetched": "2026-09-18 03:46:06"
    "summary": "AWS Local Zones and AWS Outposts help you keep regulated workloads within specific geographic boundaries. This post presents a framework of technologies, including the AWS Nitro System, AWS Organizations SCPs with AWS Control Tower, and Amazon VPC Traffic Mirroring, to help you build auditable, secure architectures for data residency."
  "9fa7014bac2e2160af1258b39849767d":
    "id": "9fa7014bac2e2160af1258b39849767d"
    "title": "Planning for disaster recovery using AWS Local Zones and AWS Outposts racks"
    "link": "https://aws.amazon.com/blogs/compute/planning-for-disaster-recovery-using-aws-local-zones-and-aws-outposts-racks/"
    "published": "2026-09-18 02:24:21"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Build highly available architectures that span two AWS Outposts racks, or an Outpost rack and an AWS Local Zone, without single points of failure. This post covers three disaster recovery approaches: DNS-based failover, active/active load balancing, and hybrid database replication, with the RTO/RPO trade-offs of each."
