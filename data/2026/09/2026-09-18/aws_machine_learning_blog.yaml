"entries":
  "b7610b5a2556eba8f115ceff73a6f921":
    "id": "b7610b5a2556eba8f115ceff73a6f921"
    "title": "Reduce time-to-hire for quality candidates with AI-powered Amazon Connect Talent"
    "link": "https://aws.amazon.com/blogs/machine-learning/reduce-time-to-hire-for-quality-candidates-with-ai-powered-amazon-connect-talent/"
    "published": "2026-09-18 02:55:20"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Amazon Connect Talent is an AI hiring solution built for talent acquisition leaders managing scaled hiring. It delivers AI-led interviews, data-driven assessments, and consistent evaluation, helping recruiters identify strong candidates more efficiently while providing applicants with a flexible interview experience. Informed by decades of Amazon's hiring science, Amazon Connect Talent provides transparency for every assessment, interview, and candidate score, enabling recruiters to stay in control of final hiring decisions."
  "8ad87e46224bdf1c871033bf00519299":
    "id": "8ad87e46224bdf1c871033bf00519299"
    "title": "Selecting a vector store for Amazon Bedrock Knowledge Bases"
    "link": "https://aws.amazon.com/blogs/machine-learning/selecting-a-vector-store-for-amazon-bedrock-knowledge-bases/"
    "published": "2026-09-18 00:53:13"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Choosing the right vector store for your Amazon Bedrock Knowledge Bases RAG application affects performance and cost. This post compares Amazon OpenSearch Service, Amazon Aurora PostgreSQL with pgvector, and Amazon S3 Vectors across three RAG use cases, with benchmarks and a practical selection framework."
  "4116928987bbdeb81ca4a8cb2c88a490":
    "id": "4116928987bbdeb81ca4a8cb2c88a490"
    "title": "A serverless, data-driven Git metrics dashboard using Amazon Quick Sight"
    "link": "https://aws.amazon.com/blogs/machine-learning/a-serverless-data-driven-git-metrics-dashboard-using-amazon-quick-sight/"
    "published": "2026-09-18 00:42:31"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Learn how to build a fully serverless pipeline that automatically collects Git metrics from GitHub and GitLab and visualizes them in interactive Amazon Quick Sight dashboards, giving engineering teams near-real-time delivery analytics at low cost."
  "5d8c54f94da12e7a61d89283b61d5662":
    "id": "5d8c54f94da12e7a61d89283b61d5662"
    "title": "A shared agentic platform for Wood Mackenzie, on Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/a-shared-agentic-platform-for-wood-mackenzie-on-amazon-bedrock-agentcore/"
    "published": "2026-09-18 00:41:03"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Wood Mackenzie built APEX, a shared agentic AI platform on Amazon Bedrock AgentCore so every team can ship production agents without rebuilding runtime, identity, observability, and guardrails from scratch. Learn why they chose AgentCore, how APEX Studio operates it, and where multi-agent systems go next."
  "0ebb627fc0cb8afcf170c68c3fb82008":
    "id": "0ebb627fc0cb8afcf170c68c3fb82008"
    "title": "How MRH Trowe enabled secure self-service AI agents in financial services"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-mrh-trowe-enabled-secure-self-service-ai-agents-in-financial-services/"
    "published": "2026-09-18 00:36:42"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Learn how MRH Trowe, one of Germany's leading commercial and industrial insurance brokers, gave about 400 employees secure, self-service access to AI agents in its first month of production - using Strands Agents, Amazon Bedrock AgentCore, and LibreChat to meet the security, data residency, and compliance requirements of the German financial sector."
  "a3781e2926a69a955a8a4b5dcebb3b9f":
    "id": "a3781e2926a69a955a8a4b5dcebb3b9f"
    "title": "Implementing defense-in-depth authorization for MCP tools on Amazon Quick"
    "link": "https://aws.amazon.com/blogs/machine-learning/implementing-defense-in-depth-authorization-for-mcp-tools-on-amazon-quick/"
    "published": "2026-09-18 00:30:17"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Learn how to enforce defense-in-depth authorization for Model Context Protocol (MCP) tools on Amazon Quick. This walkthrough wires Microsoft Entra ID group and claims-based JWTs through an Amazon Bedrock AgentCore Gateway interceptor to apply per-user, per-tool role-based and attribute-based access control, with a server-side check and an immutable audit trail."
  "b6f723c2326284b2be7176e4680e096a":
    "id": "b6f723c2326284b2be7176e4680e096a"
    "title": "Enhancing industrial safety AI with synthetic data on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/enhancing-industrial-safety-ai-with-synthetic-data-on-amazon-sagemaker-ai/"
    "published": "2026-09-18 00:28:08"
    "fetched": "2026-09-18 03:46:06"
    "summary": "Learn how to build a synthetic data augmentation pipeline on Amazon SageMaker AI and Amazon Rekognition that generates photo-realistic, auto-labeled training images for industrial safety AI. This approach improved person detection by up to 160% without manual annotation or hazardous data collection near heavy machinery."
