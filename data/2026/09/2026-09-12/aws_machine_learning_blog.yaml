    "title": "Monitoring production agent lifecycle with AWS DevOps Agent and AgentCore Evaluations"
    "link": "https://aws.amazon.com/blogs/machine-learning/monitoring-production-agent-lifecycle-with-aws-devops-agent-and-agentcore-evaluations/"
    "published": "2026-09-12 03:26:38"
    "fetched": "2026-09-12 04:24:49"
    "summary": "Multi-agent systems fail in ways traditional monitoring misses. This post presents a dual-layer approach to monitoring production agents: Amazon Bedrock AgentCore Evaluations for continuous quality scoring and AWS DevOps Agent for autonomous infrastructure investigation, shown on a four-agent airline reservation system."
  "e5ea122371c18bb147567aae7a7d5c98":
    "id": "e5ea122371c18bb147567aae7a7d5c98"
    "title": "Beyond the price per token: Choosing the right OpenAI model on Amazon Bedrock for your workload"
    "link": "https://aws.amazon.com/blogs/machine-learning/beyond-the-price-per-token-choosing-the-right-openai-model-on-amazon-bedrock-for-your-workload/"
    "published": "2026-09-12 03:24:38"
    "fetched": "2026-09-12 04:24:49"
    "summary": "Comparing models on dollars per million tokens misses what production workloads actually pay for: outcomes. This post shares an open-source benchmarking harness that measures cost per correct answer, agent trajectory cost, and rubric-graded deliverable quality across OpenAI models on Amazon Bedrock."
