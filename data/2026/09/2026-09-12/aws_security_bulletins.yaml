    "title": "CVE-2026-18061 - XML External Entity (XXE) in AWS Advanced JDBC Wrapper RemoteQueryCachePlugin"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-109-aws/"
    "published": "2026-09-12 01:37:01"
    "fetched": "2026-09-12 01:52:14"
    "summary": "<p><b>Bulletin ID:</b> 2026-109-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/11/2026 09:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>The <a href=\"https://github.com/aws/aws-advanced-jdbc-wrapper\" target=\"_blank\">AWS Advanced JDBC Wrapper</a> is an open-source library that enhances existing JDBC drivers with AWS-specific capabilities such as Aurora failover, IAM authentication, and automated SQL query caching for applications connecting to Amazon Aurora, RDS MySQL, and RDS MariaDB.</p> \n<p>We identified CVE-2026-18061, an improper restriction of XML external entity (XXE) references in the optional RemoteQueryCachePlugin. When this plugin is enabled with a shared cache, an actor with write access to that cache infrastructure might place crafted XML in a cached column value. When an application subsequently reads that cached result as XML, the wrapper's XML parsers resolve external entities, which might allow the actor to disclose sensitive files readable by the application process, including stored database and IAM role credentials.</p> \n<p><b>Impacted versions:</b> &gt;= 3.3.0 and &lt;= 4.2.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "aacd2b649817ac04fac3fc7a10a11f46":
    "id": "aacd2b649817ac04fac3fc7a10a11f46"
    "title": "CVE-2026-89065 and CVE-2026-89066: Issue with projen - Path traversal and OS command injection"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-108-aws/"
    "published": "2026-09-12 01:10:27"
    "fetched": "2026-09-12 01:52:14"
    "summary": "<p><b>Bulletin ID:</b> 2026-108-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/11/2026 09:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>projen is an open-source tool for defining and synthesizing software project configurations as code. AWS identified two issues in projen affecting the generated file manifest cleanup component and the task synthesis component.</p> \n<p><b>- CVE-2026-89065 —</b> Relative path traversal in the generated file manifest cleanup component in projen before 0.101.37 might allow context-dependent attackers to recursively delete files and directories outside the project directory, via crafted entries in the version-controlled generated file manifest (.projen/files.json) that is consumed during project synthesis. The corrected containment check is automatically applied by the projen runtime the next time it is run.</p> \n<p><b>- CVE-2026-89066 —</b> Improper neutralization of special elements used in an OS command in the task synthesis component in projen before 0.103.0 might allow context-dependent attackers to execute arbitrary commands on a developer workstation or continuous integration runner via shell metacharacters in project configuration values and repository file names that are interpolated into generated task definitions in .projen/tasks.json.</p> \n<p><b>Impacted versions:</b><br /> - All projen versions before 0.101.37 (CVE-2026-89065)<br /> - All projen versions before 0.103.0 (CVE-2026-89066)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "94b96489685599a9ce74a3dae28540eb":
    "id": "94b96489685599a9ce74a3dae28540eb"
    "title": "CVE-2026-89332 - Kiro IDE Sensitive Workspace Data Exfiltration via Agent-Written Workspace Configuration"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-111-aws/"
    "published": "2026-09-12 04:08:25"
    "fetched": "2026-09-12 04:24:48"
    "summary": "<p><b>Bulletin ID:</b> 2026-111-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/11/2026 12:00 PM PDT</p> \n<p><b>Description:</b></p> \n<p>Kiro IDE is an agentic development environment that makes it easy for developers to ship real engineering work with the help of AI agents.</p> \n<p>We identified CVE-2026-89332, where the Kiro agent could modify a workspace's settings file in an untrusted workspace in Kiro IDE. A specially crafted repository could use this to point the Kiro Powers registry URL, which Kiro fetches when the Powers panel is opened, at an external endpoint, sending potentially sensitive workspace data to that endpoint. Kiro presented the edit to the user for approval, showing the inserted data and the URL, but the file was already written to disk, so opening the Powers panel before responding to the prompt made the request anyway.</p> \n<p><b>Impacted versions:</b> Kiro IDE &lt; 0.8.135</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "4d803a5c3d44c211fc83d6bcc960f037":
    "id": "4d803a5c3d44c211fc83d6bcc960f037"
    "title": "CVE-2026-89090 - Denial of service in the event stream header decoder in AWS SDK for Go v2"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-110-aws/"
    "published": "2026-09-12 02:09:09"
    "fetched": "2026-09-12 04:24:48"
    "summary": "<p><b>Bulletin ID:</b> 2026-110-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/11/2026 10:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>An issue exists in the the EventStream header decoder in AWS SDK for Go v2 in versions predating 2026-03-23. An actor can send a malformed EventStream response frame containing a crafted header value type byte outside the valid range, which can cause the host process to terminate.</p> \n<p><b>Impacted versions:</b> &lt; 2026-03-23</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-09-12 04:24:48 JST"
