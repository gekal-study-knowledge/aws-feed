    "title": "Amazon SageMaker HyperPod now supports model caching for faster inference autoscaling and reduced cold starts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/sgm-hyperpod-model-caching-inf/"
    "published": "2026-09-12 03:25:00"
    "fetched": "2026-09-12 04:24:47"
    "summary": "<p>Amazon SageMaker HyperPod now supports model caching, an inference optimization that pre-loads model weights and container images onto cluster nodes so pods start in seconds instead of minutes.</p> \n<p>When running LLM inference at scale for workloads like chat assistants, agentic pipelines, RAG, and document analysis, cold start is a real bottleneck. Deployments and scale-out events spend most of their time downloading container images and model weights. As model size increases, this gets worse, with large models taking tens of minutes before they can serve traffic.</p> \n<p>Model caching solves this with two independent capabilities. The weights cache stores model weights on local NVMe so pods read from fast local storage instead of pulling from S3 or FSx over the network. The image cache pre-pulls the container image so pods skip the ECR download entirely. If a pod lands on a node without a warm cache, it falls back to pulling from the original source automatically, so there is no risk of pods getting stuck or failing.</p> \n<p>Benchmarks across models from 57 GB to 145 GB show around 60% faster scale-out, and the image cache cuts over two minutes of image-pull time (97% reduction). The benefit grows with model size while retaining the reliability of the original source path.</p> \n<p>Customers enable model caching through the HyperPod Inference Operator by adding a modelCacheConfig section to their InferenceEndpointConfig or JumpStartModel resource. The operator handles the full lifecycle with no manual setup or cleanup.</p> \n<p>Model caching is now generally available in all regions where SageMaker HyperPod is available. To get started, see the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-model-caching.html\">SageMaker HyperPod documentation</a>.</p> \n<p>&nbsp;</p>"
  "b00ae8f3bcb12f4f0813ee2a50c6a2a7":
    "id": "b00ae8f3bcb12f4f0813ee2a50c6a2a7"
    "title": "Amazon Bedrock Managed Knowledge Base now supports multimodal embeddings for video, audio, and image content with TwelveLabs Marengo 3.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-multimodal-embeddings-twelvelabs-marengo/"
    "published": "2026-09-12 00:13:00"
    "fetched": "2026-09-12 04:24:47"
    "summary": "<p>AWS announces the availability of TwelveLabs Marengo 3.0 as an embedding model in Amazon Bedrock Managed Knowledge Base, enabling customers to create multimodal embeddings for video, audio, and image content. Amazon Bedrock Managed Knowledge Base already supports media search by transcribing audio and video to text and generating text-based embeddings—Marengo 3.0 goes further by encoding visual scenes, speech, and video cues directly into multimodal embeddings, capturing meaning that transcription alone cannot. Simply upload your media assets from data sources such as Amazon S3, sync, and search using natural language—with no infrastructure to manage.<br /> Marengo 3.0 produces compact 512-dimensional vectors, delivering state-of-the-art retrieval accuracy. Results include segment start and end times, enabling applications to jump directly to the relevant moment in a video. This unlocks use cases across sports analytics, media and entertainment, security, education, and retail—from finding specific plays across seasons of game footage to locating lecture segments by concept rather than keywords. The model offers configurable segmentation options to match your content structure.<br /> To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-native-multimodal.html\" target=\"_blank\">TwelveLabs Marengo 3.0 embedding model integration</a> in the Amazon Bedrock Knowledge Base User Guide. For more information, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "4ab3b57cae702460074cb90cbfc4ef19":
    "id": "4ab3b57cae702460074cb90cbfc4ef19"
    "title": "AWS DevOps Agent adds bidirectional Slack communication for investigations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/06/aws-devops-agent-bidirectional-slack-communication"
    "published": "2026-09-12 00:00:00"
    "fetched": "2026-09-12 04:24:47"
    "summary": "<p>AWS DevOps Agent now enables engineers to manage the full investigation lifecycle directly within Slack. Previously, on-call engineers and DevOps teams faced fragmented workflows during high-severity incidents, forced to context-switch between communication and investigation platforms. This update consolidates both surfaces into a single, unified location where incident response already happens.</p> \n<p>Engineering teams can now initiate an investigation by simply @mentioning AWS DevOps Agent in any connected Slack channel. All investigation activity, including team-contributed context, agent findings, and recommended actions, is captured within a single thread. This eliminates cognitive load during critical moments and preserves a complete audit trail from trigger to mitigation, making post-incident retrospectives significantly more efficient.</p> \n<p>This capability is available in all commercial AWS Regions where AWS DevOps Agent is <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/about-aws-devops-agent-supported-regions.html\">currently supported</a>.</p> \n<p>To get started, read the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/connecting-to-ticketing-and-chat-connecting-slack.html#setting-up-bidirectional-communication-in-slack\">user guide</a>. See all the latest AWS DevOps Agent features on the <a href=\"https://docs.aws.amazon.com/devopsagent/latest/userguide/whats-new.html\">release history</a>&nbsp;page.</p>"
  "95d5db35903b60e428fbeaf8f5033d9c":
    "id": "95d5db35903b60e428fbeaf8f5033d9c"
    "title": "AWS HealthOmics now publishes real-time run metrics to Amazon CloudWatch"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-healthomics-realtime-run-metrics/"
    "published": "2026-09-12 00:00:00"
    "fetched": "2026-09-12 04:24:47"
    "summary": "<p>AWS HealthOmics now publishes real-time run metrics to Amazon CloudWatch, giving you visibility into workflow resource utilization as runs execute. The 14 new run metrics span CPU and GPU usage, memory usage, file system usage and I/O metrics, network throughput, and ephemeral storage usage. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.</p> \n<p>Real-time run metrics can help you identify CPU or GPU bottlenecks, detect memory or storage exhaustion before a task fails, and track file system throughput, all without opening a support case. By comparing actual usage against allocated resources, you can right-size the compute and storage configurations for your workflows. These metrics are emitted using the Amazon CloudWatch OpenTelemetry standard, so you can integrate them with third-party observability tools in addition to native CloudWatch dashboards and alarms.</p> \n<p>Real-time run metrics are now available in the following AWS HealthOmics Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), and Asia Pacific (Singapore, Seoul, Tokyo). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/monitoring-run-metrics.html\">Monitoring run metrics with CloudWatch</a> documentation. Amazon CloudWatch charges for these run metrics based on the volume of metric data ingested. For more information on pricing, visit <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing</a>.</p>"
"last_updated": "2026-09-12 04:24:47 JST"
