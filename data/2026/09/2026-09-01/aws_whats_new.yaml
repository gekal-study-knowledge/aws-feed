"entries":
  "b4cef1ce5cb1f4504741d04116981c19":
    "id": "b4cef1ce5cb1f4504741d04116981c19"
    "title": "Amazon OpenSearch Service adds new Cluster Insights for faster diagnosis of cluster status"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/opensearch-cluster-status-insight/"
    "published": "2026-09-01 00:41:00"
    "fetched": "2026-09-01 02:49:38"
    "summary": "<p><a href=\"https://aws.amazon.com/opensearch-service/\">Amazon OpenSearch Service</a> has expanded Cluster Insights with 17 new insights that identify the root causes behind Red and Yellow cluster status and provide actionable recommendations to resolve them. These insights cover resource exhaustion scenarios including JVM out-of-memory, sustained CPU saturation, as well as configuration issues such as zone imbalance, and misconfigured replica counts.</p> \n<p>Previously, when a cluster entered Red or Yellow status due to unassigned shards, diagnosing the underlying cause required manually correlating multiple metrics across nodes and availability zones. With these new insights, OpenSearch Service automatically identifies the specific resource constraint or misconfiguration responsible and provides tailored recommendations — such as scaling up instance types, increasing disk capacity, or correcting shard allocation settings — so you can restore cluster stability faster.</p> \n<p>Six new Critical-severity insights detect conditions causing primary shards to become unassigned (Red status), while eleven insights ranging from Medium to Critical severity surface issues preventing replica shard allocation (Yellow status). Each insight identifies affected nodes and provides specific remediation recommendations to help you take targeted corrective action.</p> \n<p>These insights are available at no additional cost for Amazon OpenSearch Service domains running OpenSearch 1.0 and later, and Elasticsearch 6.8 and later, across 11 Regions globally: US East (N. Virginia, Ohio), US West (Oregon), Canada (Central), Asia Pacific (Sydney, Tokyo), and Europe (Frankfurt, Ireland, London, Paris, Stockholm). To learn more, visit the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cluster-insights.html\">Cluster Insights documentation</a> or view the complete <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/insights-catalog.html\">catalog of available insights</a>.</p>"
  "1a6f9ffc4b14646c4cc9fba18dfda1b0":
    "id": "1a6f9ffc4b14646c4cc9fba18dfda1b0"
    "title": "Amazon Redshift now supports AWS IAM Identity Center authentication with enhanced VPC routing"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-redshift-supports-idc-evr"
    "published": "2026-09-01 06:02:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Amazon Redshift now supports AWS IAM Identity Center authentication for provisioned clusters and serverless workgroups configured with enhanced VPC routing (EVR). You can access Amazon Redshift with single sign-on with your corporate credentials, and the traffic traverses Amazon Virtual Private Cloud (Amazon VPC) and stays on the AWS network. This is valuable for customers with data residency, regulatory, or network-isolation requirements that mandate no public internet egress for analytics.</p> \n<p>With Redshift EVR, all traffic between your Redshift warehouse and other AWS services goes through your VPC, where you can govern it with security groups, network ACLs, and endpoint policies, and observe it in VPC Flow Logs. With this launch, Redshift validates and exchanges IAM Identity Center tokens over AWS PrivateLink interface VPC endpoints from inside your VPC, so authentication and authorization follows the same governed network path as the rest of your Redshift traffic. This feature also supports <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\">IAM Identity Center multi-Region replication</a> for customers running Redshift in a different Region than their primary Identity Center instance.</p> \n<p>Read the Amazon Redshift enhanced VPC routing <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/redshift-iam-access-control-idp-connect-evr.html\">documentation</a> and the <a href=\"https://aws.amazon.com/blogs/big-data/integrate-amazon-redshift-and-iam-identity-center-with-enhanced-vpc-routing/\">blog post</a>&nbsp;to get started. This capability is available in all AWS Regions where both Amazon Redshift and IAM Identity Center are available.&nbsp;</p>"
  "3c9eec870ffb85880ae66b7de4e9457a":
    "id": "3c9eec870ffb85880ae66b7de4e9457a"
    "title": "Amazon Timestream for InfluxDB is now available in 8 additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-timestream-influxdb-regions/"
    "published": "2026-09-01 04:48:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>You can now use Amazon Timestream for InfluxDB in the Africa (Cape Town), Asia Pacific (Bangkok), Asia Pacific (Hong Kong), Asia Pacific (Hyderabad), Asia Pacific (Melbourne), Asia Pacific (Seoul), Europe (Zurich), and Israel (Tel Aviv) AWS Regions. Timestream for InfluxDB makes it easy for application developers and DevOps teams to run fully managed InfluxDB databases on AWS for real-time time-series applications using open-source APIs.</p> \n<p>Timestream for InfluxDB offers Multi-AZ high availability, read replicas, enhanced durability, and multi-node scaling — giving you flexible deployment options to match your workload as it evolves. Whether you're starting with a single-node setup or scaling to a 15-node Enterprise cluster, you can right-size your infrastructure without re-architecting.</p> \n<p>You can create your InfluxDB databases using the <a href=\"https://console.aws.amazon.com/timestream\">Amazon Timestream for InfluxDB console</a>. AWS CLI, or AWS SDKs . Amazon Timestream for InfluxDB is available in the following AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a>.<br /> For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.</p>"
  "ff78236e75cfe278a8992a8bbf88e6aa":
    "id": "ff78236e75cfe278a8992a8bbf88e6aa"
    "title": "Amazon Redshift now supports Apache Iceberg v3 tables"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-redshift-supports-apache-iceberg-v3"
    "published": "2026-09-01 03:10:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Amazon Redshift now supports reading from and writing to Apache Iceberg v3 tables in your data lake. Apache Iceberg is an open table format, and its v3 release adds several new features.&nbsp;With this launch, Amazon Redshift introduces support for default column values, row lineage, and deletion vectors.<br /> With default column values, you can define an initial value that Amazon Redshift applies when no value is provided, simplifying schema evolution as you add columns to existing tables. Row lineage exposes pseudo-columns that track each row's identity and last-updated sequence number, so you can build incremental pipelines and CDC (change data capture) workflows that process only modified rows. Deletion vectors replace Iceberg v2's positional delete files with compact compressed bitmaps, delivering faster reads and writes for high-frequency update and delete workloads such as compliance-driven record removal. You can create a v3 table with CREATE TABLE &lt;table&gt; ... USING ICEBERG TABLE PROPERTIES ('format-version' = '3'), or upgrade an existing v2 table in place with ALTER TABLE &lt;table&gt; SET TABLE PROPERTIES ('format-version' = '3').<br /> Amazon Redshift's Graviton based provisioned and serverless clusters support the new v3 format. To learn more, see <a href=\"https://docs.aws.amazon.com/redshift/latest/dg/iceberg-v3-features.html\" title=\"Iceberg V3 features doc\"><u>Apache Iceberg v3 features</u> </a>in the <a href=\"https://docs.aws.amazon.com/redshift/\">Amazon Redshift Documentation</a>.</p>"
  "5e00088c4317a8a1b57b80ec424164be":
    "id": "5e00088c4317a8a1b57b80ec424164be"
    "title": "Amazon EC2 R9g and R9gd memory optimized instances are now available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-r9g-and-r9gd-memory-optimized-instances-are-now-available/"
    "published": "2026-09-01 03:08:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) R9g and R9gd instances, powered by AWS Graviton5 processors, are generally available. AWS Graviton5 processors are the fifth generation of custom-designed CPUs, delivering the best price performance for memory-intensive workloads running on Amazon EC2.</p> \n<p>R9g instances are ideal for memory-intensive workloads including databases, in-memory caches, real-time big data analytics, Linux-based workloads including containerized and micro-service-based applications (e.g. Kubernetes, Docker, EKS, ECS), as well as applications written in popular programming languages such as C/C++, Rust, Go, Java, Python, .NET Core, Node.js, Ruby, and PHP.</p> \n<p>R9gd instances offer local NVMe-based SSD block-level storage for customers. R9gd instances are great for memory-intensive workloads such as open-source databases, distributed real-time big data analytics, large in-memory databases, and large caching workloads.</p> \n<p>R9g and R9gd instances deliver up to 25% better compute performance compared to AWS Graviton4-based R8g and R8gd instances. They are up to 30% faster for databases, up to 35% faster for web applications, and up to 35% faster for machine learning. They feature 5x larger cache and the fastest memory of any processor instances in the cloud. These instances are built on the sixth generation <a href=\"https://aws.amazon.com/ec2/nitro/\">AWS Nitro System</a> and are the first to feature the <a href=\"https://aws.amazon.com/blogs/compute/aws-nitro-isolation-engine-formally-verifying-the-hypervisor-in-the-aws-nitro-system/\">Nitro Isolation Engine</a>, harnessing formal verification to provide mathematical assurance that customer workloads are isolated from each other and AWS operators, pioneering a new standard for mathematically proven cloud security.</p> \n<p>R9g and R9gd instances are available in US East (N. Virginia, Ohio), US West (Oregon), and EU (Frankfurt) regions. R9g and R9gd instances are available for purchase via Savings Plans, On-Demand, Spot instances, Dedicated instances, or Dedicated hosts.</p> \n<p><a href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level up your compute with AWS Graviton</a> and <a href=\"https://aws.amazon.com/ec2/instance-types/r9g/\">get started today.</a></p>"
  "2f4b2614a577e2d6148e33156acf254c":
    "id": "2f4b2614a577e2d6148e33156acf254c"
    "title": "Amazon Cognito now supports machine-to-machine authorization without a user pool domain"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cognito-get-client-token/"
    "published": "2026-09-01 03:00:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>Amazon Cognito now supports the GetClientToken API operation, enabling app clients to obtain access tokens for machine-to-machine (M2M) authorization directly through the AWS SDK, CLI, or API — without configuring a user pool domain. This gives you an additional path to authorize service-to-service communication for applications, microservices, and automated workloads.</p> \n<p>The new GetClientToken API operation lets your app client authenticate with its client ID and secret to receive an access token authorized for custom scopes on your resource servers. As a native AWS API operation, GetClientToken integrates seamlessly with AWS SDKs and supports AWS WAF and VPC interface endpoints (AWS PrivateLink). The existing domain-based OAuth 2.0 client-credentials flow remains available.</p> \n<p>This feature is available in all AWS Regions where Amazon Cognito user pools are available. To get started, configure an app client and call GetClientToken using the AWS Management Console, CLI, or SDKs. Standard Amazon <a href=\"https://aws.amazon.com/cognito/pricing/\">Cognito M2M pricing</a> applies. See <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html#get-client-token\">Amazon Cognito Developer Guide</a> and <a href=\"https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_GetClientToken.html\">GetClientToken API Reference</a> for details.</p>"
  "77248ae82a70b86b0bba83a1b525eb53":
    "id": "77248ae82a70b86b0bba83a1b525eb53"
    "title": "AWS Lambda recursive loop detection is now available in all commercial AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/lambda-recursion-regions"
    "published": "2026-09-01 02:30:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>AWS Lambda <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html\">recursive loop detection</a> has expanded support to all commercial AWS Regions. This feature, which is enabled by default, is a guardrail that automatically detects and stops recursive invocations between Lambda functions and other supported services, preventing runaway workloads.</p> \n<p>When using event sources such as Amazon S3, Amazon SQS, and Amazon SNS to trigger Lambda functions, a misconfiguration or code defect can cause events to be sent back to the same source that triggered the Lambda function, causing recursive loops, unintended usage, and unexpected billing. When such a loop is detected, Lambda recursive loop detection automatically stops processing the event and sends you an AWS Health Dashboard notification with troubleshooting steps.&nbsp;</p> \n<p>With this expansion, you now benefit from recursive loop detection in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regions_az/\">AWS Regions</a> when using a <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html#invocation-recursion-supported\">supported SDK version or later</a>. If your function uses intentional recursive loops, you can use the <a href=\"https://docs.aws.amazon.com/lambda/latest/api/API_PutFunctionRecursionConfig.html\">PutFunctionRecursionConfig API </a>to turn off recursive loop detection on your Lambda function.&nbsp;<br /> &nbsp;<br /> To learn more about Lambda recursive loop detection, please refer to <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html\">Lambda documentation</a>.</p>"
  "ce74991c8943a57d853f17d9ee3ed7ba":
    "id": "ce74991c8943a57d853f17d9ee3ed7ba"
    "title": "Amazon Aurora serverless is now available with 30% better performance and smarter scaling in additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-aurora-serverless-performance-improvement-additional-regions/"
    "published": "2026-09-01 01:46:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">Amazon Aurora serverless</a>&nbsp; now delivers up to 30% better performance and enhanced scaling in additional AWS Regions: Asia Pacific (New Zealand), Asia Pacific (Thailand), Africa (Cape Town), Europe (Milan), and Mexico (Central). These improvements are available for both Aurora PostgreSQL and Aurora MySQL.</p> \n<p>Aurora serverless is the autoscaling database that scales up to support your most demanding workloads and down to zero when you don't need it,&nbsp;so you only pay for what you actually use. The enhanced scaling algorithm efficiently handles workloads where multiple tasks compete for resources, such as busy web applications and API services. Together, these improvements make Aurora serverless especially well suited for agentic AI applications, which see traffic bursts, idle periods, and unpredictable usage.</p> \n<p>These improvements are delivered in platform version 4 at no additional cost. New clusters, restores, and clones launch on platform version 4 automatically. Existing clusters running earlier platform versions can upgrade to platform version 4 through a pending maintenance action, a stop and restart, or blue/green deployments.</p> \n<p>For pricing details and Region availability, see the <a href=\"https://aws.amazon.com/rds/aurora/pricing/\">Amazon Aurora Pricing</a>. To learn more about Aurora serverless, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html\">documentation</a>. To get started, visit the <a href=\"https://signin.aws.amazon.com/signin?redirect_uri=https%3A%2F%2Fconsole.aws.amazon.com%2Fconsole%2Fhome%3FhashArgs%3D%2523%26isauthcode%3Dtrue%26state%3DhashArgsFromTB_us-east-2_a53ff6382623e9a3&amp;client_id=arn%3Aaws%3Asignin%3A%3A%3Aconsole%2Fcanvas&amp;forceMobileApp=0&amp;code_challenge=SCavOinSDkGpz8021yaDgWGy_E5aIbgB7HoRsIR47N0&amp;code_challenge_method=SHA-256\">AWS Management Console</a>.</p>"
  "5d16b86d6e2d058eb4a58128386934c7":
    "id": "5d16b86d6e2d058eb4a58128386934c7"
    "title": "AWS Agent Registry for centralized agent discovery and governance is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-generally-available"
    "published": "2026-09-01 00:21:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>AWS Agent Registry is now generally available. It provides a private, governed catalog and discovery layer for agents, tools, skills, MCP servers, and custom resources within your organization. Teams get complete visibility into their AI landscape, so they can discover existing capabilities instead of rebuilding from scratch. Access it through the AWS Agent Registry console, AWS CLI, or AWS SDK. You can also discover and use registry resources from Amazon Bedrock AgentCore, Amazon Quick, and Kiro IDE, so teams can find the right agents and tools without switching context. The console pairs semantic and keyword search with a dedicated browse experience for exploring registries and records. The registry is also exposed as an MCP server that builders can query directly from their IDEs.</p> \n<p>In addition to the capabilities launched in preview (manual and URL-based record creation, approval workflows, semantic and keyword search, and AWS CloudTrail audit trails), Registry now adds new enterprise features. Teams can provision and manage registries as code using AWS CloudFormation, Terraform, and the AWS CDK, and apply tags to registries and records for organization, cost allocation, and access control. Using AWS Resource Access Manager (AWS RAM), customers can share registries across accounts and create organization-wide registries. Registry can also auto-detect agents on AgentCore runtime and AgentCore gateways across the entire organization into a central registry, keeping records current without manual authoring. A new integration with Amazon Quick lets customers discover custom connectors from the registry directly on the Quick Connectors page.</p> \n<p>AWS Agent Registry is available in five AWS Regions: US West (Oregon), Asia Pacific (Tokyo), Asia Pacific (Sydney), Europe (Ireland), and US East (N. Virginia). Learn more about the registry through <a href=\"https://aws.amazon.com/blogs/machine-learning/manage-agents-tools-and-skills-at-scale-with-aws-agent-registry/\">the blog</a>, and deep dive using the <a href=\"https://docs.aws.amazon.com/agent-registry/\">documentation</a>.</p>"
  "170038aed8471f024d85e0752828f699":
    "id": "170038aed8471f024d85e0752828f699"
    "title": "AWS announces AWS Interconnect - multicloud connectivity with Microsoft Azure in preview"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-announces-AWS-interconnect-multicloud-microsoft-azure-preview/"
    "published": "2026-09-01 00:00:00"
    "fetched": "2026-09-01 07:21:56"
    "summary": "<p>AWS announces the public preview of AWS Interconnect — multicloud with Microsoft Azure.</p> \n<p>Customers have been adopting multicloud strategies while migrating more applications to the cloud. They do so for many reasons including interoperability requirements, the freedom to choose technology that best suits their needs, and the ability to build and deploy applications on any environment with greater ease and speed. Previously, when interconnecting workloads across multiple cloud service providers (CSPs), customers had to go the route of a ‘do-it-yourself’ multicloud approach, leading to complexities of building and managing global multi-layered networks at scale. AWS Interconnect - multicloud is the first purpose-built product of its kind and a new way of how clouds connect and talk to each other, allowing customers to quickly provision resilient, scalable private connections to other cloud providers.</p> \n<p>AWS introduced AWS Interconnect – multicloud in preview at re:Invent 2025, publishing an <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener noreferrer\" target=\"_blank\"><u>open specification</u></a> for network interoperability that raised the bar for the industry and established a framework any provider can adopt, inviting the broader ecosystem to participate. Today, Microsoft Azure is the latest CSP to adopt the specification that powers AWS Interconnect. Customers who operate between AWS and Azure can now manage their connectivity through a single, managed experience, without compromise. This allows AWS to provide a consistent, simple experience to our customers on Microsoft Azure (Preview), OCI (Generally Available), and Google Cloud (Generally Available).</p> \n<p>Interconnect - multicloud is available in preview with Microsoft Azure in the following AWS Regions: US East (N. Virginia), US West (N. California), Asia Pacific (Sydney), and Europe (Frankfurt). You can create a preview Interconnect using the AWS Management Console, Command Line Interface (CLI), or API. For more information, see the <a href=\"https://docs.aws.amazon.com/interconnect/latest/userguide/what-is-interconnect.html\" rel=\"noopener noreferrer\" target=\"_blank\"><u>AWS Interconnect - multicloud documentation</u></a>.</p>"
  "d326ea8e65b0b975f6b3fe04710087bb":
    "id": "d326ea8e65b0b975f6b3fe04710087bb"
    "title": "Amazon DocumentDB now supports direct major version upgrades to version 8.0"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/documentdb-major-version-upgrade-8-0/"
    "published": "2026-09-01 07:30:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Amazon DocumentDB (with MongoDB compatibility) now supports in-place major version upgrades (MVU) directly from engine versions 3.6 and 4.0 to version 8.0. This upgrade capability removes the need for intermediate version upgrades and allows you to upgrade your version 3.6 or 4.0 clusters while preserving existing data, configurations, and cluster settings.</p> \n<p>Upgrading to version 8.0 provides access to the latest security patches, performance improvements, and new developer capabilities. Major version upgrades from DocumentDB 3.6 and 4.0 to 8.0 are available in all AWS regions where these versions are currently supported.</p> \n<p>To learn more about upgrading to Amazon DocumentDB 8.0, including detailed guidance on version differences and upgrade paths, visit the <a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-mvu.html#mvu-36-to-50-differences\">Amazon DocumentDB MVU documentation</a>, review <a href=\"https://docs.aws.amazon.com/documentdb/latest/devguide/docdb-version-support-dates.html\">version support dates</a>, and explore the full list of new capabilities on the <a href=\"https://aws.amazon.com/about-aws/whats-new/2025/11/documentdb-8-o/\">Amazon DocumentDB 8.0 announcement page</a>.</p>"
  "0d6d4bc4027723b1efa14f7b30da4483":
    "id": "0d6d4bc4027723b1efa14f7b30da4483"
    "title": "Partner Revenue Measurement expands service coverage for User Agent string capability"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/partner-revenue-measurement-user-agent-expansion/"
    "published": "2026-09-01 07:00:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Partner Revenue Measurement <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-string.html\">User Agent string</a> now supports additional AWS services. Partner Revenue Measurement allows Partners to better understand their AWS revenue impact and product consumption patterns. Previously, the User Agent string capability measured AWS service consumption across select services. With this expansion, Partners can now measure attributed revenue across additional applicable AWS services that log control plane activity in AWS CloudTrail, significantly increasing the visibility Partners have into the revenue their solutions drive.</p> \n<p>Partners who have already embedded a user agent (format APN_1.1/pc_&lt;AWS Marketplace product-code&gt;$) in their applications automatically benefit from the expanded coverage with no additional implementation needed. The additional service consumption measured through this expansion is now visible in the <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/04/attributed-revenue-dashboard-launch/\">Attributed Revenue Dashboard</a>, accessible through Partner Analytics in AWS Partner Central on the AWS Console. This User Agent string method complements Partner Revenue Measurement's <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/resource-tagging.html\">Resource Tagging</a> and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/marketplace-metering.html\">AWS Marketplace Metering</a> integration capabilities.</p> \n<p>Partner Revenue Measurement is generally available in all commercial regions. To learn more about User Agent string implementation or other Partner Revenue Measurement capabilities, review the&nbsp;<a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/what-is-service.html\">onboarding guide</a>&nbsp;and <a href=\"https://docs.aws.amazon.com/PRM/latest/aws-prm-onboarding-guide/user-agent-included-services.html\">services supported</a>.</p>"
  "30f6370a3de923da9b321ee4f55a0a2e":
    "id": "30f6370a3de923da9b321ee4f55a0a2e"
    "title": "AWS Agent Registry agents and MCP servers now available in Amazon Quick"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-agent-registry-agents-mcp-servers-quick/"
    "published": "2026-09-01 06:05:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Today, Amazon Quick announces integration with AWS Agent Registry, enabling users to discover and use resources from their organization's AWS Agent Registry directly within Amazon Quick. AWS Agent Registry supports MCP servers and agents, which users can now search and browse directly within Amazon Quick. After finding the agent or MCP server they need, users can enable it with a few clicks. Connection details are already populated from the registry. Once enabled, these resources can be shared with teams for use across chat, agents, apps, flows, and deep research.&nbsp;</p> \n<p>This integration bridges the gap between technical teams who build agents with Amazon Bedrock AgentCore and business users who work in Amazon Quick. Organizations no longer need to manually configure connections to agents and tools that already exist in their AWS Agent Registry. Business users get access through their familiar Amazon Quick workspace without duplicate effort.&nbsp;</p> \n<p>Amazon Quick integration with AWS Agent Registry is available in all AWS Regions where both Amazon Quick and Amazon Bedrock AgentCore are available. This includes US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), and Europe (Ireland).&nbsp;</p> \n<p>To get started, open the Amazon Quick admin console and go to Manage account, Permissions, AWS Agent Registry to connect your registry. To learn more, see the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/aws-agent-registry-integration.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Quick Integrations documentation</a> and the <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/registry.html\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Agent Registry documentation</a>.</p>"
  "3c63526ebe988ca65400444a21133fff":
    "id": "3c63526ebe988ca65400444a21133fff"
    "title": "Amazon MSK Connect now supports restarting connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-msk-connect-restart/"
    "published": "2026-09-01 00:00:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p><a href=\"https://aws.amazon.com/msk/features/msk-connect/\">Amazon MSK Connect</a> (Amazon Managed Streaming for Apache Kafka Connect) supports restarting newly created connectors and their tasks, enabling fast recovery for streaming data pipelines.</p> \n<p>Amazon MSK Connect is a fully managed service that allows you to deploy, monitor, and scale Apache Kafka Connect connectors with Amazon MSK (Managed Streaming for Apache Kafka). Previously, recovering from failures required deleting and recreating the connector, resulting in downtime and operational overhead. With this feature, you can restart your connector and all its tasks, or selectively restart only the failed tasks, making recovery seamless. You can also restart connectors that have no failed tasks to recover from transient issues or to pick up changes in external systems or dependencies.</p> \n<p>This restart capability is available at no additional cost through the Amazon MSK Console, AWS CLI, AWS SDK, and AWS CDK in all AWS Regions where Amazon MSK Connect is available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/mskconnect.html\">Amazon MSK Connect documentation</a>. To get started, visit the <a href=\"https://console.aws.amazon.com/msk\">Amazon MSK Console</a>.</p>"
  "fa9e030209b1eb49edb83f267a928d96":
    "id": "fa9e030209b1eb49edb83f267a928d96"
    "title": "Amazon WorkSpaces Applications is now available in three new AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-workspaces-applications-region-expansion"
    "published": "2026-09-01 00:00:00"
    "fetched": "2026-09-01 10:35:03"
    "summary": "<p>Amazon Web Services (AWS) has expanded the regional availability for Amazon WorkSpaces Applications. Starting today, AWS customers can deploy their applications and desktops in the Europe (Zurich), Asia Pacific (Osaka), and Canada West (Calgary) Regions and stream them using WorkSpaces Applications.</p> \n<p>Deploying your applications on WorkSpaces Applications in a region closer to your end users helps provide a more responsive experience. Additionally, customers in Europe, Asia Pacific, and Canada now have more AWS region options to deploy their workloads on WorkSpaces Applications, helping them meet data residency and compliance requirements.</p> \n<p>Amazon WorkSpaces Applications is a fully managed, secure application streaming service that provides users with instant access to their desktop applications from anywhere. It allows users to stream applications and desktops from AWS to their devices, without requiring them to download, install, or manage any software locally. WorkSpaces Applications manages the AWS resources required to host and run your applications, scales automatically, and provides access to your users on demand.</p> \n<p>To get started with Amazon WorkSpaces Applications, sign into the <a href=\"https://console.aws.amazon.com/appstream2/home\" rel=\"noopener noreferrer\" target=\"_blank\">WorkSpaces Applications management console</a> and select Europe (Zurich), Asia Pacific (Osaka), or Canada West (Calgary) Region. For the full list of Regions where WorkSpaces Applications is available, see the <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Region Table</a>. WorkSpaces Applications offers pay-as-you-go pricing. For more information, see <a href=\"https://aws.amazon.com/workspaces/applications/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon WorkSpaces Applications Pricing</a>.</p>"
  "4eb6362a0a672ce530065d1c985e141b":
    "id": "4eb6362a0a672ce530065d1c985e141b"
    "title": "Amazon Connect Global Resiliency now supports cross-region routing of contacts across two active AWS regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-connect-global-resiliency-cross-region-routing/"
    "published": "2026-09-01 04:25:00"
    "fetched": "2026-09-01 16:10:28"
    "summary": "<p>Amazon Connect Global Resiliency now supports cross-region routing of contacts to agents across two linked AWS regions. For example, a contact arriving in US East (N. Virginia) is offered to the longest-available matching agent whether that agent is in US East (N. Virginia) or US West (Oregon), while managers view analytics and search contacts across both regions as a unified contact center.</p> \n<p>Because both regions now carry live traffic at all times, neither sits idle as an untested standby. Your full configuration and any integrations are exercised continuously in both regions, providing confidence that either environment is ready to absorb the full workload whenever you need it. You retain full control over how traffic is distributed, and can shift new contacts and agents to a single region at any time.</p> \n<p>Global routing is supported in <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#gr_region\">all AWS regional pairings where Amazon Connect Global Resiliency is available</a>: US East (N. Virginia) and US West (Oregon), EU (Frankfurt) and EU (London), Asia Pacific (Osaka) and Asia Pacific (Tokyo). To obtain access to this feature, contact your AWS account team or an AWS representative. To learn more, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect website</a> or see <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/setup-connect-global-resiliency.html\">Set up Amazon Connect Global Resiliency</a> in the Amazon Connect Administrator Guide.</p>"
  "b288fa592daa871f4d6e767dc3987ffe":
    "id": "b288fa592daa871f4d6e767dc3987ffe"
    "title": "Amazon CloudWatch now supports warm-up periods for alarms"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-cloudwatch-alarms-warmup-period"
    "published": "2026-09-01 17:00:00"
    "fetched": "2026-09-01 22:00:59"
    "summary": "<p>Amazon CloudWatch now lets you configure a warm-up period for metric alarms and log alarms, delaying alarm evaluation for a set time after the alarm is created. This reduces noise from missing data while a new resource or service starts up and begins publishing metrics. For example, a team that provisions a new microservice and its alarms together through a CI/CD pipeline can attach a warm-up period so alarms do not page the on-call engineer while the service is still starting up and has not yet published metrics.</p> \n<p> </p> \n<p>Previously, when you created an alarm before the underlying metric was reporting data, CloudWatch evaluated the alarm right away using its \"treat missing data\" setting. For resources that take time to begin emitting metrics, such as a newly deployed application or service, this could cause the alarm to transition state and run actions on missing data during startup, triggering unnecessary notifications. A warm-up period fixes this by giving you two ways to hold off evaluation during startup: wait a fixed duration you set before evaluation begins, or let CloudWatch start evaluating automatically as soon as the metric actually has enough data to fill the alarm's evaluation window.</p> \n<p> </p> \n<p>You set the warm-up period with the WarmUpConfiguration parameter when you create or update an alarm. Specify a warm-up duration from 1 to 2,880 minutes (2 days). By default, the alarm ends warm-up early and begins evaluating as soon as enough data fills its evaluation window. Additionally, you can optionally require the alarm to wait the full duration before evaluating.</p> \n<p> </p> \n<p>Warm-up periods are available in all AWS Regions where Amazon CloudWatch is offered at no additional charge beyond standard CloudWatch alarm pricing.</p> \n<p> </p> \n<p>To get started, see &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-warm-up.html\" target=\"_blank\">Alarm warm-up periods&nbsp;</a> and &nbsp;<a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_WarmUp_Alarm.html\" target=\"_blank\">Create an alarm that uses a warm-up period&nbsp;</a> in the Amazon CloudWatch User Guide.</p>"
"last_updated": "2026-09-01 22:00:59 JST"
