    "title": "MCP went stateless: Is your AWS MCP server deployment well-architected?"
    "link": "https://aws.amazon.com/blogs/architecture/mcp-went-stateless-is-your-aws-mcp-server-deployment-well-architected/"
    "published": "2026-09-01 22:09:19"
    "fetched": "2026-09-02 02:33:02"
    "summary": "On July 28, 2026, MCP made its protocol core stateless, removing the initialize handshake and session header. This post maps the MCP 2026-07-28 specification to the AWS Well-Architected Agentic AI Lens, pillar by pillar, and shows why the stateless design lets you delete the sticky sessions and session stores your MCP servers needed on AWS."
