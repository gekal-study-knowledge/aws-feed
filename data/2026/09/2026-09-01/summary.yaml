"overview": |
  この日は月初らしく発表が多く、マルチクラウド接続、Graviton5 世代のインスタンス、そしてエージェントの統制が三つの柱でした。AWS Interconnect が Microsoft Azure との専用マルチクラウド接続としてパブリックプレビューに入り、クラウドをまたぐネットワークを個別に組む必要がなくなります。コンピュートでは AWS Graviton5 を搭載したメモリ最適化インスタンス EC2 R9g / R9gd が一般提供となり、R8g 比で最大 25% 高いコンピュート性能をうたっています。モデルでは Anthropic の新しいフロンティアモデル Claude Fable 5.1 が AWS で一般提供となり、コーディングや科学分野を含む野心的なタスク向けの知能を提供します。エージェント統制では AWS Agent Registry が GA になり、組織内のエージェント・ツール・スキル・MCP サーバー・カスタムリソースを検索可能な単一カタログで管理できるようになりました。Amazon Quick からも Agent Registry のエージェントや MCP サーバーを直接使えます。あわせてアーキテクチャブログでは、2026 年 7 月 28 日に MCP がプロトコルのコアをステートレス化し、initialize ハンドシェイクとセッションヘッダーを廃止したことを受け、MCP 2026-07-28 仕様を AWS Well-Architected の Agentic AI レンズに対応づける記事が出ています。データベースまわりの更新も厚く、Redshift が Apache Iceberg v3 テーブルの読み書きと、拡張 VPC ルーティング構成での IAM Identity Center 認証に対応し、Aurora serverless の 30% 性能向上が追加リージョンへ、Timestream for InfluxDB が 8 リージョンへ広がり、DocumentDB は 3.6 / 4.0 から 8.0 への直接メジャーバージョンアップグレードが可能になり、RDS Custom for SQL Server は最新の CU / GDR 更新に対応しました。運用面では Lambda の再帰ループ検出が全商用リージョンへ拡大し、CloudWatch のメトリクスアラームとログアラームにウォームアップ期間を設定してデータ欠損によるノイズを抑えられるようになり、Cognito はユーザープールドメインなしで GetClientToken による M2M 認可ができるようになり、OpenSearch Service の Cluster Insights は Red / Yellow の原因を特定する 17 の新しいインサイトを追加、Connect Global Resiliency は 2 つのアクティブリージョン間でのコンタクトのクロスリージョンルーティングに対応しました。セキュリティ速報として OpenSearch SQL プラグインのカーソルページネーションにおける無制限の Java デシリアライズ (CVE-2026-83497) が Important で公開されています。国内では AWS Summit Japan 2026 の Physical AI デモの裏側が 2 部構成で、AI-DLC を学べる Skill Builder コースの日本語版公開、Amazon EVS 一般提供 1 年の振り返り、パブリックセクター向けに月次開催しているセキュリティワークショップの報告が公開されました。
