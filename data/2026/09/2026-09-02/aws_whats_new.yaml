"entries":
  "5884365db04e540c41f42396e98dd2cf":
    "id": "5884365db04e540c41f42396e98dd2cf"
    "title": "Amazon Connect Customer dashboards now support compact mode"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/connect-dashboards-compact-mode/"
    "published": "2026-09-02 02:00:00"
    "fetched": "2026-09-02 05:28:23"
    "summary": "<p>Amazon Connect Customer now offers compact mode on the analytics dashboards, increasing data density so supervisors can see more of their operational data without scrolling. Compact mode reduces widget size, font, and minimizes&nbsp;filters to maximize&nbsp;screen space. For example, a supervisor on a 13-inch laptop toggles compact mode, which reduces row height, enabling them to view all team agents on the widget without scrolling and spot non-adherent agents faster.</p> \n<p>Compact mode on dashboards is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\">regions</a> where Amazon Connect Customer is offered. To learn more about Amazon Connect Customer analytics dashboards, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/dashboards.html\">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.</p>"
  "25888b7c741b1f3584cde286596da760":
    "id": "25888b7c741b1f3584cde286596da760"
    "title": "Amazon MWAA supports Apache Airflow version 3.3.1"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-mwaa-apache-airflow-3-3-1/"
    "published": "2026-09-02 00:00:00"
    "fetched": "2026-09-02 05:28:23"
    "summary": "<p>Amazon Managed Workflows for Apache Airflow (MWAA) now supports Apache Airflow version 3.3.1, the latest release of the popular open-source workflow orchestration framework. Amazon MWAA is a managed orchestration service for Apache Airflow that makes it easier to set up and operate end-to-end data pipelines in the cloud.</p> \n<p>Apache Airflow 3.3 introduces stateful tasks and multi-language support. With the new Task and Asset State Store, tasks can now persist durable state across retries and reruns, enabling cursor tracking and crash-safe reconnection to long-running jobs. The Language Task SDK (experimental) lets teams write task logic in Java or Go while keeping orchestration in Python. Additional improvements include expanded asset partitioning, pluggable retry policies, and bulk actions for DAG runs and task instances. Apache Airflow 3.3.1 also delivers stability, security, and UI improvements on top of these capabilities.</p> \n<p>You can launch a new Apache Airflow 3.3.1 environment on Amazon MWAA, or upgrade from 3.2 or later, with a few clicks in the <a href=\"https://console.aws.amazon.com/mwaa/home\">AWS Management Console</a> in all currently supported <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">Amazon MWAA regions</a>. To learn more about Apache Airflow 3.3.1, visit the <a href=\"https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html\">Amazon MWAA documentation</a> and the <a href=\"https://airflow.apache.org/docs/apache-airflow/3.3.1/release_notes.html#airflow-3-3-1-2026-08-12\">Apache Airflow 3.3.1 change log</a> in the Apache Airflow documentation.</p> \n<p><i>Apache, Apache Airflow, and Airflow are either registered trademarks or trademarks of the <a href=\"https://www.apache.org/\">Apache Software Foundation</a> in the United States and/or other countries.</i></p>"
  "97eee32ec90df854d4db25f2f3603d38":
    "id": "97eee32ec90df854d4db25f2f3603d38"
    "title": "Amazon Quick now lets you build custom apps with natural language  -"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-quick-custom-apps-natural-language/"
    "published": "2026-09-02 06:37:00"
    "fetched": "2026-09-02 07:57:46"
    "summary": "<p>Now generally available, Amazon Quick lets you build custom applications by simply describing them in natural language. Create project trackers, customer dashboards, and training portals in minutes instead of months. Whether you're a product manager, finance lead, HR partner, or ops analyst, you can now turn ideas into fully functional apps without writing any code. Tell Quick what you need, and it builds a live, connected application with real-time data from your existing business systems.</p> \n<p>Quick connects directly to the tools and data your business already uses, including Salesforce, Jira, Asana, ServiceNow, Microsoft 365, Google Workspace, databases, and data warehouses. Your apps stay current automatically as underlying data changes, and every connection respects your organization's existing identity, authorization, and access control policies. Once built, you can publish and share apps instantly with specific users or your entire organization. Need to make a change like adding AI, updating the visual style, or connecting to another system? Just describe what you want and Quick handles it.</p> \n<p>During preview, customers used Quick to replace spreadsheets and disconnected tools with purpose-built applications. New York Life built an e-learning portal for their Institutional Life team that consolidates onboarding, training, and compliance courses into a single experience. The Amazon Quick team tracks pipeline, customer requests, and adoption metrics in a weekly leadership review app that replaced manual data pulls from four different systems.</p> \n<p>Building apps in Quick is available to Plus, Professional, and Enterprise customers starting September 1, 2026. To learn more, visit the <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/using-amazon-quick-apps.html\">Apps in Quick getting-started guide</a>.</p>"
  "9f9183eaddc867221cb39a314e9e1bfa":
    "id": "9f9183eaddc867221cb39a314e9e1bfa"
    "title": "Amazon CloudWatch Database Insights now supports self-managed PostgreSQL"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/database-insights-self-managed-postgresql/"
    "published": "2026-09-02 04:00:00"
    "fetched": "2026-09-02 07:57:46"
    "summary": "<p>Today, AWS announces support for self-managed PostgreSQL databases in Amazon CloudWatch Database Insights. Using CloudWatch Database Insights, you can now monitor your self-managed PostgreSQL instances running on Amazon EC2, alongside Amazon RDS and Amazon Aurora, to give you a complete view of your database fleet in a single console.&nbsp;</p> \n<p>Amazon CloudWatch Database Insights is a database observability solution that provides a curated experience to help you monitor database fleet health, diagnose issues, and resolve performance bottlenecks. With support for self-managed databases, you use the Amazon CloudWatch agent to collect health and performance data from your self-managed PostgreSQL instances. Your database appears in the Database Insights fleet view with live performance data, including database load, wait event analysis, query-level statistics, and host metrics. Monitor and troubleshoot your self-managed PostgreSQL instances using the same familiar Database Insights console and workflows you already use for your AWS-managed databases.</p> \n<p>Amazon CloudWatch Database Insights support for self-managed PostgreSQL is available in all AWS Commercial Regions. To get started, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Database-Insights-Self-Managed.html\">Monitoring Self-Managed Databases</a> in the <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html\">Amazon CloudWatch User Guide</a>. For pricing details, see the <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch pricing page</a>.</p>"
  "ebe6d9c1fce3f7d083c6c87705517045":
    "id": "ebe6d9c1fce3f7d083c6c87705517045"
    "title": "AWS Backup now supports protecting more than 1,000 Amazon S3 buckets per account"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-backup-more-than-1000-s3-buckets/"
    "published": "2026-09-02 03:00:00"
    "fetched": "2026-09-02 07:57:46"
    "summary": "<p>AWS Backup now supports backup and restore of more than 1,000 Amazon S3 buckets per account, matching the Amazon S3 bucket quota configured for your account.</p> \n<p>Previously, AWS Backup for Amazon S3 supported up to 1,000 buckets per account. With this launch, AWS Backup supports backing up all general purpose buckets in your account. Existing backup plans and configurations continue to work with no changes required if you are using default AWS Backup managed policies. For details on the required permissions for custom policies, see the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/s3-backups.html\" target=\"_blank\">AWS Backup documentation</a>.</p> \n<p>This capability is available in all AWS commercial and AWS GovCloud (US) Regions. To get started, visit the <a href=\"https://console.aws.amazon.com/backup\" target=\"_blank\">AWS Backup console</a>.</p>"
  "adb902d6e8ae684ef289a453d7fd1320":
    "id": "adb902d6e8ae684ef289a453d7fd1320"
    "title": "AWS Deadline Cloud now supports sharing job bundles"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/deadline-cloud/job-bundle-sharing"
    "published": "2026-09-02 05:16:00"
    "fetched": "2026-09-02 09:53:12"
    "summary": "<p>AWS Deadline Cloud now supports sharing job bundles, giving teams a simple way to distribute and reuse render job templates without manual file distribution. Deadline Cloud is a fully managed service that helps teams run compute-intensive workloads in the cloud for visual effects, animation, product design, simulation, and gaming.&nbsp;</p> \n<p>Job bundles define the jobs you submit to Deadline Cloud, including the job template, parameters, and asset references. Previously, sharing a bundle with teammates meant distributing files through shared drives or manual copying. Now, you can publish a bundle to your queue directly from the submitter or the command line, and it immediately becomes available to everyone with access to that queue. Shared bundles are packaged as portable archives and stored in the queue's existing job attachments bucket in Amazon S3, so there is no additional infrastructure or configuration to set up. This makes it easy for pipeline teams to publish standard, ready-to-submit job templates that artists can pick up and use.</p> \n<p>You can browse bundles shared on your queue, on your local filesystem, or from your job submission history. You can preview each bundle's name, description, steps, and parameters before selecting it. New CLI commands let you manage shared bundles from the command line and integrate bundle sharing into pipeline scripts.</p> \n<p>This feature is available in all AWS Regions where Deadline Cloud is available. To get started, visit the <a href=\"https://docs.aws.amazon.com/deadline-cloud/latest/developerguide/share-job-bundles.html\">AWS Deadline Cloud documentation</a>.</p>"
  "65614409c28eae646a18ca2204ce6534":
    "id": "65614409c28eae646a18ca2204ce6534"
    "title": "Amazon Kinesis Data Streams now supports a dry run feature to validate API requests"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-kinesis-data-streams-api/"
    "published": "2026-09-02 04:00:00"
    "fetched": "2026-09-02 09:53:12"
    "summary": "<p>Amazon Kinesis Data Streams now supports a dry run feature to check whether an API request would succeed without executing the operation. Customers can now set the new optional parameter ‘DryRun’ to true in their API requests to validate permissions before interacting with a stream in production.</p> \n<p>Previously, customers had no safe way to test whether their application had the correct permissions to access a stream. They would often send a request engineered to fail after checking permissions, such as a PutRecord request with a payload deliberately larger than the maximum supported size. This approach was fragile as it depended on current service limits, and if those limits ever changed, the request could unexpectedly succeed, writing unintended records into the production stream and into any downstream consumers. Now, customers can simply set the parameter ‘DryRun’ to true to indicate they only want to validate the API request. If all checks complete successfully, the API returns a ‘DryRunOperationException’, confirming the request would have succeeded without the ‘DryRun’ parameter.</p> \n<p>The dry run feature is available for five APIs (PutRecord, PutRecords, GetRecords, GetShardIterator, and SubscribeToShard) in all AWS Regions where Amazon Kinesis Data Streams is available. For more information about dry run, see <a href=\"https://docs.aws.amazon.com/streams/latest/dev/kds-dryrun-validation.html\">Test your permissions and request inputs with dry run</a> in the Amazon Kinesis Data Streams Developer Guide. To get started with dry run, see the <a href=\"https://docs.aws.amazon.com/kinesis/latest/APIReference/\">Amazon Kinesis Data Streams API Reference</a>.</p>"
  "3894579b3800855936e303c5c5c62653":
    "id": "3894579b3800855936e303c5c5c62653"
    "title": "AWS Lambda now supports SnapStart for container image functions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/07/aws-lambda-snapstart-container/"
    "published": "2026-09-02 18:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>Starting today, AWS Lambda supports SnapStart for functions packaged as <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/images-create.html\" rel=\"noopener noreferrer\" target=\"_blank\">container images</a>, reducing startup times from several seconds to as low as sub-second. Lambda SnapStart is an opt-in capability that makes it easier for you to build highly responsive and scalable applications without provisioning resources or implementing complex performance optimizations.</p> \n<p>Customers deploy Lambda functions with container images to align with their organization's container-based deployment standards, or to package larger dependencies up to 10 GB. However, larger container images can experience startup times of several seconds as Lambda downloads image layers and initializes the runtime and application code. SnapStart addresses this by taking a snapshot of the initialized execution environment during function deployment, caching it, and resuming from it on invocation, instead of initializing from scratch. Previously, SnapStart was only supported for managed runtimes (Python, .NET, and Java). Starting today, customers can use SnapStart for container images to improve startup times for latency-sensitive workloads such as ML inference and interactive APIs.</p> \n<p>Lambda SnapStart for container images is available in all commercial <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Regions</a>, except Asia Pacific (New Zealand) and Asia Pacific (Taipei).&nbsp;</p> \n<p>You can activate SnapStart for new or existing <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/images-create.html\" rel=\"noopener noreferrer\" target=\"_blank\">container image</a> functions using AWS Lambda API, AWS Console, AWS Command Line Interface (AWS CLI), AWS CloudFormation, AWS Serverless Application Model (AWS SAM), AWS SDK, and AWS Cloud Development Kit (AWS CDK). If you use an AWS base image for Lambda with Java (version 11+), Python (version 3.12+), or .NET (version 8+), the experience remains the same as with functions deployed as .zip file archives. For all other AWS base images for Lambda (for example, Node.js or Ruby) or custom base images, refer to the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/snapstart-runtime-hooks-custom.html\" rel=\"noopener noreferrer\" target=\"_blank\">developer guide.</a> For more information about SnapStart, see Lambda <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation.</a> To learn more about pricing for SnapStart for container image functions, visit <a href=\"https://aws.amazon.com/lambda/pricing/#SnapStart_Pricing\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Lambda Pricing.</a></p>"
  "d08c8d524425700f2577c52c03ed86bd":
    "id": "d08c8d524425700f2577c52c03ed86bd"
    "title": "Amazon RDS for SQL Server supports additional SQL trace flags"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/rds-sqlserver-supports-additional-trace-flags/"
    "published": "2026-09-02 16:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server</a>&nbsp;supports 18 additional SQL trace flags that you can enable through database parameter groups. Trace flags are configuration switches that modify SQL Server engine behavior — such as query optimizer cardinality estimation, lock escalation, statistics management, and memory handling — to allow database administrators to fine-tune performance and address workload-specific challenges. With this expansion, you have greater flexibility to optimize and stabilize your SQL Server workloads directly within your managed RDS environment.</p> \n<p>The newly supported trace flags include: 647, 652, 1448, 3654, 4138, 4139, 7745, 8285, 8780, 9432, 9481, 9492, 9592, 11024, 11042, 12502, 12618, and 12656. These trace flags address scenarios such as query plan optimization, DDL performance improvements, availability group replication, Query Store behavior, automatic plan correction, and known engine bug mitigations. Because trace flags modify core SQL Server engine behavior, you should test them in a non-production environment before applying them to production instances. Some trace flags can impact system performance, increase memory usage, or change query execution plans in unexpected ways.</p> \n<p>Trace flags are available in all AWS Regions where Amazon RDS for SQL Server is supported. To get started, update your RDS parameter group to enable the desired trace flags and apply it to your DB instance.&nbsp;To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for SQL Server User Guide</a>.</p>"
  "f91fa1d363a692d274bacd945f7dc6a8":
    "id": "f91fa1d363a692d274bacd945f7dc6a8"
    "title": "AWS Marketplace reduces listing fee for professional services in multi-product solutions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-marketplace-fee-professional-services/"
    "published": "2026-09-02 03:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>AWS Marketplace now offers a 0% listing fee for professional services purchased as part of a qualifying multi-product solution. This builds on the recent reduction of professional services listing fee to 0.5%. It further lowers the cost for any Partner that transacts services through AWS Marketplace, while retaining the billing benefits that come with it.</p> \n<p>Over the past year, AWS Marketplace has built a set of capabilities purpose-built for discovering and purchasing services. Customers can find the right Partner through AI-powered discovery in Agent Mode, combine software and services in a single transaction through multi-product solutions, and pay through variable payment models like time-and-materials. The 0% fee for professional services within a multi-product solution complements these capabilities and further reduces the cost for Partners to sell solutions through AWS Marketplace.</p> \n<p>A multi-product solution qualifies for the 0% fee when its professional services are combined with at least one other valid, paid subscription. The fee applies to new subscriptions, while existing subscriptions continue at their original terms.&nbsp;This applies to all commercial AWS Regions where AWS Marketplace operates.&nbsp;</p> \n<p>To get started, Partners can review&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/listing-fees.html\">seller documentation</a>&nbsp;and list multi-product solutions through&nbsp;<a href=\"https://console.aws.amazon.com/partnercentral/solutions\">AWS Partner Central&nbsp;</a>. Customers can explore&nbsp;<a href=\"https://aws.amazon.com/marketplace/search/results?ref_=header_nav_dm_saas&amp;NUMBER_OF_PRODUCTS=MULTI_PRODUCT&amp;filters=NUMBER_OF_PRODUCTS\">multi-product solutions</a>&nbsp;directly on AWS Marketplace.</p>"
  "1c1bf3d2d49c66dc00b2043e670cc73f":
    "id": "1c1bf3d2d49c66dc00b2043e670cc73f"
    "title": "AWS Marketplace now supports auto-renewals for private offers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-marketplace-auto-renewals-for-private-offers"
    "published": "2026-09-02 00:00:00"
    "fetched": "2026-09-03 03:24:47"
    "summary": "<p>AWS Marketplace now supports auto-renewals for private offers. This capability helps sellers and buyers maintain active software and service subscriptions without re-negotiation or re-purchasing at the end of the term. Negotiated pricing and contract terms carry forward automatically when buyers and sellers agree to renew. This helps reduce procurement overhead and prevent unintended lapses in subscriptions.</p> \n<p>When creating a private offer, sellers define the renewal terms and choose how pricing carries forward: renewal with no price change, renewal with a fixed price change, or a price change within a defined range. Buyers can opt in or out during initial offer acceptance, and can update their preferences later as their business needs change. Before automatically renewing the subscription, AWS Marketplace notifies both parties and provides a comparison of the current and upcoming terms, including any pricing changes. Either party can opt out of an upcoming renewal before the renewal decision deadline. Buyers can map a purchase order to any renewal to maintain procurement controls. Both parties are notified when a renewal completes successfully.</p> \n<p>This capability is generally available in all commercial AWS Regions for sellers creating direct private offers with contract pricing. No additional setup or onboarding is required. To learn more, see the&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/userguide/creating-private-offer.html#drafting-and-publishing-private-offer\">AWS Marketplace Seller Guide</a>&nbsp;and the&nbsp;<a href=\"https://docs.aws.amazon.com/marketplace/latest/buyerguide/how-auto-renewal-private-offers-works.html\">AWS Marketplace Buyer Guide&nbsp;</a>. Sellers can configure auto-renewing private offers in the&nbsp;<a href=\"https://aws.amazon.com/marketplace/management/\">AWS Marketplace Management Portal&nbsp;</a>. Buyers can manage subscriptions and renewals in the&nbsp;<a href=\"https://console.aws.amazon.com/marketplace/subscriptions\">AWS Marketplace Console&nbsp;</a>.&nbsp;</p>"
  "5243dfb0e723232cc014c1da6f59f520":
    "id": "5243dfb0e723232cc014c1da6f59f520"
    "title": "AWS User Experience Customization (UXC) is now available in all commercial AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-uxc-aws-regions"
    "published": "2026-09-02 22:00:00"
    "fetched": "2026-09-03 06:32:41"
    "summary": "<p>AWS User Experience Customization (UXC) is now available in all commercial AWS Regions. UXC enables account administrators to set a custom account color and control which services and Regions appear in the AWS Management Console.</p> \n<p>Previously, UXC was available only in US East (N. Virginia), requiring customers who manage these settings programmatically to direct API calls to that single Region. With today's expansion, customers can manage account customizations from any commercial AWS Region using the AWS CLI, AWS SDKs, or AWS CloudFormation — making it easier to configure the console experience alongside existing infrastructure automation.</p> \n<p>UXC is available at no additional charge. To get started, see the <a href=\"https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/uxc.html\">AWS User Experience Customization documentation</a>.</p>"
  "3e4d1b5bdb792bc34b68f6012c69e949":
    "id": "3e4d1b5bdb792bc34b68f6012c69e949"
    "title": "Amazon SageMaker Unified Studio CI/CD adds notebook promotion and AI-assisted manifest generation"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/sagemaker-cicd-notebook-ai-manifest/"
    "published": "2026-09-02 17:00:00"
    "fetched": "2026-09-03 08:48:45"
    "summary": "<p>Amazon SageMaker Unified Studio CI/CD expands its open-source deployment toolkit with two new capabilities: (1) an AI agent skill that automates manifest authoring, and (2) native notebook promotion across environments. Together, they help data teams go from project to production faster while maintaining best-practice defaults across stages.</p> \n<p><b>AI-assisted manifest generation. </b>The new generate-bundle-manifest agent skill inspects a project's connections, storage, and workflows and produces a ready-to-use deployment manifest. It applies least-privilege IAM guidance, substitutes environment variables in place of hardcoded resource identifiers, and sets safe defaults such as opt-in catalog handling. Teams can import the skill into their own agents to standardize how they package and promote SageMaker Unified Studio projects across development, test, and production accounts.</p> \n<p><b>Native notebook promotion. </b>The CI/CD toolkit now supports promoting native SMUS Notebooks alongside code, workflows, and catalog assets. Notebook promotion uses an in-place synchronization model that creates a notebook on first deployment and updates it on subsequent deployments, preserving run history across releases. Teams can promote every notebook in a project or select specific notebooks by ID, and a dry-run mode validates S3 connectivity, IAM permissions, and notebook counts before deployment. Notebook promotion integrates with the existing bundle, deploy, destroy, and dry-run commands and requires no changes to current pipeline structure.</p> \n<p>Both capabilities are open source and available in all AWS Regions where Amazon SageMaker Unified Studio is offered.</p> \n<p>To get started, visit the <a href=\"https://github.com/aws/CICD-for-SageMakerUnifiedStudio\">CICD-for-SageMakerUnifiedStudio</a> repository on GitHub. For more information, see the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/cicd.html\">CI/CD for Amazon SageMaker Unified Studio documentation</a>.</p>"
  "7699ef98d2bca94925ef7f7f9f83743b":
    "id": "7699ef98d2bca94925ef7f7f9f83743b"
    "title": "Amazon Bedrock AgentCore Identity now offers a managed consent portal"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-agentcore/"
    "published": "2026-09-02 06:29:00"
    "fetched": "2026-09-04 07:12:38"
    "summary": "<p><a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-overview.html\">Amazon Bedrock AgentCore Identity</a> now offers a managed consent portal that eliminates the need for custom OAuth callback infrastructure when connecting agents to third-party tools and services.</p> \n<p>Developers using AgentCore Gateway to connect agents with services such as GitHub, Salesforce, and Slack previously had to build, host, and maintain custom OAuth callback infrastructure to complete OAuth 2.0 three-legged authorization (3LO) flows. The new managed consent portal eliminates this undifferentiated heavy lifting for agent developers and platform administrators.</p> \n<p>Each AgentCore Gateway receives its own managed consent portal with a dedicated hosted web client and credential provider list. Platform admins can share a portal URL with their team before sessions begin, granting consent for agents to call external tools on their behalf. End users can view their connection status at any time through a self-service interface without contacting an administrator.</p> \n<p>Developers using agent IDE-based clients, which cannot natively present OAuth consent URLs or handle post-consent session binding, can now use the managed consent portal as a dedicated authorization surface for these workflows.</p> \n<p>This feature is available in all commercial regions where Bedrock AgentCore Identity is available.</p> \n<p>To learn more, visit the <a href=\"http://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-consent-portal.html\">Amazon Bedrock AgentCore Identity documentation</a>.</p>"
  "3f2a07acce3acfba02ed8aca9a14ba49":
    "id": "3f2a07acce3acfba02ed8aca9a14ba49"
    "title": "Amazon MemoryDB now supports AWS PrivateLink in the AWS GovCloud (US) Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-memorydb-privatelink/"
    "published": "2026-09-02 23:06:00"
    "fetched": "2026-09-04 09:41:43"
    "summary": "<p>You can now use <a href=\"https://aws.amazon.com/privatelink/\">AWS PrivateLink</a> to privately access <a href=\"https://aws.amazon.com/memorydb/\">Amazon MemoryDB</a> from your Amazon Virtual Private Cloud (Amazon VPC) in the AWS GovCloud (US-West) and AWS GovCloud (US-East) Regions. AWS PrivateLink provides private connectivity between VPCs, AWS services, and on-premises networks, without exposing traffic to the public internet and securing your network traffic.</p> \n<p>To use AWS PrivateLink with Amazon MemoryDB, you create an <a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html\">interface VPC endpoint</a> for Amazon MemoryDB in your VPC using the Amazon VPC console, AWS SDK, or AWS CLI. With an interface VPC endpoint, you can privately access the Amazon MemoryDB APIs from applications inside your Amazon VPC. You can also access the VPC endpoint from other VPCs using VPC Peering or your on-premises environments using AWS VPN or AWS Direct Connect. To learn more, read the <a href=\"https://docs.aws.amazon.com/memorydb/latest/devguide/memorydb-privatelink.html\">documentation</a>, or get started in the <a href=\"https://console.amazonaws-us-gov.com/vpc/\">Amazon VPC Console</a>.</p>"
