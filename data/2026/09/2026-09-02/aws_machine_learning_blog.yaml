    "title": "How t54 built a trust layer with Amazon Bedrock AgentCore payments"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-t54-built-a-trust-layer-with-amazon-bedrock-agentcore-payments/"
    "published": "2026-09-02 00:50:00"
    "fetched": "2026-09-02 02:33:02"
    "summary": "t54 built x402-secure, a trust layer on Amazon Bedrock AgentCore payments that scores every endpoint before an autonomous agent pays it. See how session budgets, credential isolation, and a deterministic trust gate have governed more than 20 million agent-initiated transactions with no human in the loop."
  "3d27c5bef11f401d8cf7cb0489aa0091":
