    "title": "From theory to delivery: How Atos upskilled 400 engineers in agentic AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-theory-to-delivery-how-atos-upskilled-400-engineers-in-agentic-ai/"
    "published": "2026-09-02 01:17:54"
    "fetched": "2026-09-02 02:33:02"
    "summary": "When Atos set out to upskill 400 engineers in agentic AI, hands-on learning was the missing ingredient. Over three days, engineers built multi-agent systems on AWS through an AI League event. This post explains why Atos chose the format, what engineers built and learned, and what other enterprises should consider."
  "80dc5c5c527abd6515687f374bd6eb2f":
    "id": "80dc5c5c527abd6515687f374bd6eb2f"
    "title": "Tokenomics at scale: How Jamf built real-time spend enforcement for Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/tokenomics-at-scale-how-jamf-built-real-time-spend-enforcement-for-amazon-bedrock/"
    "published": "2026-09-02 01:03:41"
    "fetched": "2026-09-02 02:33:02"
    "summary": "As generative AI adoption scales, cost governance becomes a top challenge. Learn how Jamf built real-time, per-user spend enforcement for Amazon Bedrock using IAM Customer Managed Policies, an Amazon Athena cost view, and a serverless AWS Lambda loop that applies tiered model limits in near-real-time without disrupting active sessions."
  "4dfc321e2aa3d7d0a641f1c2a7ea77c2":
    "id": "4dfc321e2aa3d7d0a641f1c2a7ea77c2"
    "title": "Securing Amazon Quick from POC to production: Agents, Flows, and Spaces"
    "link": "https://aws.amazon.com/blogs/machine-learning/securing-amazon-quick-from-poc-to-production-agents-flows-and-spaces/"
    "published": "2026-09-02 01:02:22"
    "fetched": "2026-09-02 02:33:02"
    "summary": "Amazon Quick proof-of-concept projects often stall when security teams review the production plan. This post walks through designing dashboards, Spaces, knowledge bases, agents, and Flows with security controls that hold as you scale: dataset shaping, agent isolation, document classification, and approval gates."
  "a75f47346bae4be3b254e08841d06e70":
