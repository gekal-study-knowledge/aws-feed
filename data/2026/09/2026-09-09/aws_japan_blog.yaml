  "a3524d66a9cb675f51ae72433e3b3b0d":
    "id": "a3524d66a9cb675f51ae72433e3b3b0d"
    "title": "Oracle Database@AWS を始める: オンボーディング完全ガイド"
    "link": "https://aws.amazon.com/jp/blogs/news/getting-started-with-oracle-databaseaws-a-complete-onboarding-guide/"
    "published": "2026-09-09 15:42:02"
    "fetched": "2026-09-09 16:49:29"
    "summary": "Oracle Database@AWS のオンボーディングを、サービスの選定と調達から OCI テナンシのリンク、AWS と OCI 両側の IAM 設定まで 5 つのステップで解説します。ADB-S と ExaDB-XS のパブリックオファー経路、ExaDB-D と ADB-D のプライベートオファー経路の両方を扱います。購入者アカウントの選び方、ネットワーク計画、SCP の注意点、ジョブの分離まで、プロビジョニング前に押さえておくべきポイントをまとめました。"
  "b06fb7577923022e5c1e4a86cd53e049":
    "id": "b06fb7577923022e5c1e4a86cd53e049"
    "title": "Kiro が ISO/IEC 27001:2022 のカバレッジに対応"
    "link": "https://aws.amazon.com/jp/blogs/news/iso-27001/"
    "published": "2026-09-09 14:54:37"
    "fetched": "2026-09-09 16:49:29"
    "summary": "調達・セキュリティ・ベンダーリスクの各チームが、Kiro の採用に関する意思決定を裏付ける、第三者によって独立に検証されたエビデンスを利用できるようになったことをお知らせします。Kiro は、AWS の ISO/IEC 27001:2022 認証の定義された範囲（スコープ）に含まれています。チームは Kiro を、ソースコード、システムアーキテクチャ、社内ドキュメント、その他のプロジェクトコンテキストとともに利用します。こうした情報には、知的財産や、組織のセキュリティポリシーによって管理されるデータが含まれることがあります。開発ツールを承認する前に、組織はそのツールを提供する組織が情報セキュリティリスクをどのように特定し、管理し、レビューしているのかについて、明確なエビデンスを必要とします。"
  "cfa59ca41aab1fd76a6bb7131e603388":
    "id": "cfa59ca41aab1fd76a6bb7131e603388"
    "title": "1 年間無料の Kiro を、世界中の学生へ"
    "link": "https://aws.amazon.com/jp/blogs/news/students-2026/"
    "published": "2026-09-09 14:51:59"
    "fetched": "2026-09-09 16:49:29"
    "summary": "新年度の始まりにあたって、私たちは、より多くの学生が本格的なツールを手にしてキャンパスへ戻ることを望んでいます。そこで Kiro Students プログラムを、16 か国にわたる新たな 121 の大学へと拡大します。これら 16 か国の対象となる学生は、いまや同じオファーを受けられます。Kiro を 1 年間無料で利用でき、毎月 1,000 クレジット、そしてプレミアムモデルや Kiro Web といった有料機能にもフルアクセスできます。クレジットカードは不要。トライアルのタイマーもありません。ただ作るだけです。"
"last_updated": "2026-09-09 16:49:29 JST"
