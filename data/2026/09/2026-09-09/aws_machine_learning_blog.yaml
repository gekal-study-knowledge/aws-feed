"entries":
  "dc106ef7d8b7ca860f11b7182070a30a":
    "id": "dc106ef7d8b7ca860f11b7182070a30a"
    "title": "Govern models with MLflow and Amazon SageMaker AI Model Registry sync: Part 2"
    "link": "https://aws.amazon.com/blogs/machine-learning/govern-models-with-mlflow-and-amazon-sagemaker-ai-model-registry-sync-part-2/"
    "published": "2026-09-09 02:03:50"
    "fetched": "2026-09-09 02:43:06"
    "summary": "Governing models across accounts is the next step after automatic model registration. This post extends managed MLflow and Amazon SageMaker AI Model Registry sync to two cross-account governance topologies: a hub-and-spoke pattern that centralizes governance with AWS RAM, and a hybrid pattern that keeps development accounts isolated."
  "fa4dad6b597b98cc9f4890a454db4eff":
    "id": "fa4dad6b597b98cc9f4890a454db4eff"
    "title": "Govern models with MLflow and Amazon SageMaker AI Model Registry sync: Part 1"
    "link": "https://aws.amazon.com/blogs/machine-learning/govern-models-with-mlflow-and-amazon-sagemaker-ai-model-registry-sync-part-1/"
    "published": "2026-09-09 02:03:20"
    "fetched": "2026-09-09 02:43:06"
    "summary": "Managed MLflow on Amazon SageMaker AI now syncs richer model metadata (training metrics, evaluation results, inference specs, and lineage) into the SageMaker AI Model Registry, with lifecycle stage promotion. Part 1 shows how to govern candidate models in a single account using IAM guardrails."
  "8c1c7142f07aa21b2b8819b1811a313b":
    "id": "8c1c7142f07aa21b2b8819b1811a313b"
    "title": "Automated agent evaluation with Amazon Bedrock AgentCore and GitHub Actions"
    "link": "https://aws.amazon.com/blogs/machine-learning/automated-agent-evaluation-with-amazon-bedrock-agentcore-and-github-actions/"
    "published": "2026-09-09 01:23:21"
    "fetched": "2026-09-09 02:43:06"
    "summary": "Wire Amazon Bedrock AgentCore Evaluations into a GitHub Actions pipeline: deploy an AI agent and an OAuth-protected MCP server to AgentCore runtime, invoke the agent with test prompts, score the responses, and automatically block pull requests when agent behavior regresses."
  "e756143c42b75448cc7aa91079166402":
    "id": "e756143c42b75448cc7aa91079166402"
    "title": "Benchmarking small LLM inference on SageMaker AI: G7 vs G5 and G6"
    "link": "https://aws.amazon.com/blogs/machine-learning/benchmarking-small-llm-inference-on-sagemaker-ai-g7-vs-g5-and-g6/"
    "published": "2026-09-09 01:21:57"
    "fetched": "2026-09-09 02:43:06"
    "summary": "Benchmark two 30B Mixture-of-Experts models, Qwen3-Coder-30B and NVIDIA Nemotron-3-Nano-30B, across G5, G6, G6e, and G7 GPU instances on Amazon SageMaker AI. Compare throughput, latency, and cost-per-token, and see how G7's NVIDIA Blackwell GPUs deliver measurable price-performance gains for real-time LLM inference."
  "67afb9bd3b7074871063559950ee5618":
    "id": "67afb9bd3b7074871063559950ee5618"
    "title": "How HPE Zerto built an agentic troubleshooting system with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-hpe-zerto-built-an-agentic-troubleshooting-system-with-amazon-bedrock/"
    "published": "2026-09-09 01:15:23"
    "fetched": "2026-09-09 02:43:06"
    "summary": "HPE Zerto built an agentic troubleshooting system powered by Amazon Bedrock that runs on-premises inside the customer environment. This post describes the multi-agent architecture, the on-premises deployment model built with Strands Agents, and the engineering challenges of grounding agents in live disaster recovery data."
  "331a43c428fac6f09645acde4c809421":
    "id": "331a43c428fac6f09645acde4c809421"
    "title": "How DiDi built intelligent contact center QA with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-didi-built-intelligent-contact-center-qa-with-amazon-bedrock/"
    "published": "2026-09-09 01:11:11"
    "fetched": "2026-09-09 02:43:06"
    "summary": "DiDi built a transparent, self-owned contact center quality assurance (QA) system on Amazon Bedrock, replacing an opaque third-party tool. Intent verification accuracy rose from 38% to 86%, compliance scoring topped 90%, and Voice of Customer trend analysis dropped from hours to minutes across Spanish and Portuguese support."
  "8cf38ac33dc89ff6bdff6e851b0bca6e":
    "id": "8cf38ac33dc89ff6bdff6e851b0bca6e"
    "title": "Pathway’s brain-inspired architecture development on Amazon SageMaker HyperPod"
    "link": "https://aws.amazon.com/blogs/machine-learning/pathways-brain-inspired-architecture-development-on-amazon-sagemaker-hyperpod/"
    "published": "2026-09-09 04:12:51"
    "fetched": "2026-09-09 05:38:57"
    "summary": "Pathway's Baby Dragon Hatchling (BDH) is a brain-inspired, post-transformer architecture that reasons in latent space instead of emitting chain-of-thought tokens. See how Pathway develops and scales BDH on Amazon SageMaker HyperPod, and how BDH-CQ set a new cost-efficiency mark on the ARC-AGI-1 benchmark."
  "efc41676325861d8c571410668ee5162":
    "id": "efc41676325861d8c571410668ee5162"
    "title": "Amazon SageMaker Feature Store introduces UpdateRecord for feature-level writes"
    "link": "https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-feature-store-introduces-updaterecord-for-feature-level-writes/"
    "published": "2026-09-09 03:29:15"
    "fetched": "2026-09-09 05:38:57"
    "summary": "Amazon SageMaker Feature Store now supports feature-level writes. With the new UpdateRecord API, you can update one or more feature values in a single call without reading or rewriting the entire record. It is available for both the Standard (Amazon DynamoDB) and In-Memory (Amazon ElastiCache) online store tiers."
  "c4600a1280f830d7be63b8db1faf9053":
    "id": "c4600a1280f830d7be63b8db1faf9053"
    "title": "Take on your most ambitious work with GPT-6 Astra on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/take-on-your-most-ambitious-work-with-gpt-6-astra-on-amazon-bedrock/"
    "published": "2026-09-09 07:06:58"
    "fetched": "2026-09-09 08:09:02"
    "summary": "GPT-6 Astra from OpenAI is now generally available on Amazon Bedrock. It brings deeper reasoning and sharper judgment to your most demanding tasks, running on the Amazon Bedrock inference engine built for high performance, security, and scale."
"last_updated": "2026-09-09 08:09:02 JST"
