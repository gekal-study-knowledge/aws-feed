  "0c66d74f703a4338e458dea797d0b8d6":
    "id": "0c66d74f703a4338e458dea797d0b8d6"
    "title": "Amazon RDS for MariaDB now supports community MariaDB minor versions 10.6.28, 10.11.19, 11.4.13, 11.8.9, and 12.3.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-mariadb-community-versions/"
    "published": "2026-09-09 01:00:00"
    "fetched": "2026-09-09 02:43:03"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/mariadb/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for MariaDB</a> now supports MariaDB minor versions 10.6.28, 10.11.19, 11.4.13, 11.8.9, and 12.3.3, the latest minors released by community MariaDB. In addition to operational improvements, these minor versions&nbsp;introduce support for post-quantum TLS (PQ-TLS) key exchange, providing you with post-quantum cryptography options for encrypting your data in-transit. We recommend upgrading to the newer minor versions to accept fixes for Common Vulnerabilities and Exposures (CVEs) in prior versions of MariaDB and to benefit from bug fixes, performance improvements, and new functionality added by the MariaDB community. Learn more about the enhancements in RDS for MariaDB in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MariaDB.Concepts.VersionMgmt.html\" rel=\"noopener noreferrer\" target=\"_blank\">RDS MariaDB release notes.</a>​</p> \n<p>You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. To simplify operations at scale, enable <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MariaDB.Minor.html\" rel=\"noopener noreferrer\" target=\"_blank\">automatic minor version upgrades</a> and use the AWS Organizations <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html\" rel=\"noopener noreferrer\" target=\"_blank\">Upgrade Rollout Policy</a> to orchestrate upgrades across your clusters in phases. Learn more about performing version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MariaDB.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS User Guide</a>. You can also migrate to RDS for MariaDB from external MariaDB sources using <a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service</a>. Learn more about pricing details and regional availability at <a href=\"https://aws.amazon.com/rds/mariadb/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MariaDB</a>.&nbsp;</p> \n<p>Amazon RDS for MariaDB makes it simple to set up, operate, and scale MariaDB deployments in the cloud. Create or update a fully managed Amazon RDS for MariaDB database in the <a href=\"https://console.aws.amazon.com/rds/home\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a>.</p>"
  "b96a55d67a89058a6c54a3129bc203f1":
    "id": "b96a55d67a89058a6c54a3129bc203f1"
    "title": "Amazon Bedrock AgentCore Memory now supports direct ingestion to long-term memory"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/agentcore-memory-direct-ingest"
    "published": "2026-09-09 01:00:00"
    "fetched": "2026-09-09 05:38:55"
    "summary": "<p>Amazon Bedrock AgentCore Memory now lets developers submit content directly for long-term memory extraction without persisting it as a short-term memory event. The new IngestData API accepts content, fans it out to the memory's configured long-term memory strategies, and makes the resulting memory records available through the same retrieval operations used for any other long-term memory records, all without creating a short-term event.<br /> <br /> Until now, all content had to be stored as a short-term memory event before extraction strategies could process it into long-term memory records. IngestData removes this requirement, enabling developers to adopt long-term memory independently of short-term memory.<br /> <br /> IngestData supports both conversational payloads (messages with USER/ASSISTANT roles) and JSON payloads (behavioral events, activity logs, system events), and accepts optional metadata that feeds the same extraction pipeline as CreateEvent. After processing, developers can verify extraction results with ListMemoryRecords or RetrieveMemoryRecords, stream real-time notifications via Kinesis, and redrive failed extractions with ListMemoryExtractionJobs. To get started, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/long-term-ingest-data.html\">Direct ingestion to long-term memory</a> in the Amazon Bedrock AgentCore Developer Guide. IngestData is available in all AWS Regions where Amazon Bedrock AgentCore Memory is supported.</p>"
  "bc324078bbeeef62cfb5a0041e833af6":
    "id": "bc324078bbeeef62cfb5a0041e833af6"
    "title": "Amazon Timestream for InfluxDB 3 now supports custom plugins"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/timestream-influxdb-custom-plugins/"
    "published": "2026-09-09 06:58:00"
    "fetched": "2026-09-09 08:08:59"
    "summary": "<p>Amazon Timestream for InfluxDB now lets you run your own custom Python plugins on the managed versions of InfluxDB 3 Core and Enterprise editions. You host your plugin code in public or private repositories you control and the engine fetches and runs it in response to triggers, letting you implement logic specific to your workload without standing up separate external infrastructure.</p> \n<p>Plugins run on the trigger types the processing engine already supports and with them, you can build custom data transformations, alerting, aggregation, and integrations with your own services, all running close to your data. Plugins execute in a managed Python environment that includes the standard library and Amazon-vetted packages , so you can move workload-specific processing into the database instead of operating a separate pipeline to do it.</p> \n<p>To get started, set a plugin repository on a DB parameter group, apply that parameter group to your cluster, and create triggers that reference your plugin using the influxdb3 CLI or HTTP API; private repositories are authenticated with a token stored in AWS Secrets Manager.&nbsp; Custom plugins are available in all AWS <a href=\"https://docs.aws.amazon.com/general/latest/gr/timestream.html\">Regions</a> where Amazon Timestream for InfluxDB is available. To get started with Amazon Timestream for InfluxDB 3, visit the <a href=\"https://console.aws.amazon.com/timestream\">Amazon Timestream for InfluxDB console</a>. For more information, see the <a href=\"https://docs.aws.amazon.com/timestream/\">Amazon Timestream for InfluxDB documentation</a> and <a href=\"https://aws.amazon.com/timestream/pricing/\">pricing page</a>.&nbsp;</p> \n<p>&nbsp;<br /> &nbsp;</p>"
  "ea42e262adace720b6971e29510dc3a7":
    "id": "ea42e262adace720b6971e29510dc3a7"
    "title": "Amazon SageMaker Feature Store now supports individual feature updates to lower write latency"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/08/sgm-feature-store-update-record/"
    "published": "2026-09-09 06:19:00"
    "fetched": "2026-09-09 08:08:59"
    "summary": "<p>Amazon SageMaker Feature Store is a fully managed capability that makes it easy to compute, store, and retrieve features for training and deploying AI models. SageMaker Feature Store now supports feature-level writes, a new capability for updating individual features in a record. Data scientists can now update one or more feature values in a single request, without rewriting the entire record.</p> \n<p>Data scientists can use a single update call to replace the read-modify-write pattern their pipelines run today. Each write updates only the features in the request and leaves every other feature in the record unchanged, which lowers write latency and cost. When multiple pipelines write to the same feature group, each pipeline updates only the features it computes, so a streaming job and a nightly batch job can update the same record independently. This capability enables data scientists to update a single feature at high processing volumes, without building merge logic in their data ingestion pipelines.</p> \n<p>This capability is now available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where<a href=\"https://aws.amazon.com/sagemaker/ai/feature-store/\"> Amazon SageMaker Feature Store</a> is available. For more information, see <a href=\"https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_Operations_Amazon_SageMaker_Feature_Store_Runtime.html\">Amazon Feature Store Runtime</a>, <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-storage-configurations-online-store.html#feature-store-storage-configurations-online-store-standard-v2-tier\">Standard V2 documentation</a> and <a href=\"https://aws.amazon.com/blogs/machine-learning/amazon-sagemaker-feature-store-introduces-updaterecord-for-feature-level-writes/\">launch blog</a>.</p>"
  "f84272023c2518c4e75295f0bfb9c9b2":
    "id": "f84272023c2518c4e75295f0bfb9c9b2"
    "title": "AWS Transform is now available in AWS GovCloud (US-West)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transform-govcloud-us-west/"
    "published": "2026-09-09 06:00:00"
    "fetched": "2026-09-09 08:08:59"
    "summary": "<p>AWS Transform is now available in the AWS GovCloud (US-West) Region, enabling government agencies and regulated organizations to plan and execute large-scale migrations to AWS. With this launch, customers operating in AWS GovCloud (US) can use the <a href=\"https://aws.amazon.com/transform/migrations\">migration capabilities</a> of AWS Transform to automate server migrations within an isolated environment designed to host sensitive data and regulated workloads. AWS Transform in this Region supports migrating servers to both AWS GovCloud (US-East) and AWS GovCloud (US-West) as <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-vmware-connect-target-account.html#transform-vmware-cta-supported-regions\">target Regions</a>.</p> \n<p>Organizations migrating VMware, bare metal, Hyper-V, or database workloads can use AWS Transform to automate server replication and cutover, reducing the manual effort and risk involved in large-scale moves. This is particularly valuable for federal agencies, defense contractors, and regulated industries that must operate within the AWS GovCloud (US) boundary. Modernization, custom transformation, and assessment capabilities are not included in this regional launch and remain available in supported commercial Regions.</p> \n<p>To get started, see the AWS Transform <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/\">documentation</a> or visit the AWS Transform <a href=\"https://aws.amazon.com/transform/\">product page</a>.</p>"
  "117fabcf2703bf0de4d66febc2707954":
    "id": "117fabcf2703bf0de4d66febc2707954"
    "title": "AWS HealthOmics introduces resource fallback order for WDL workflows"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-healthomics-resourcefallback-wdl/"
    "published": "2026-09-09 01:00:00"
    "fetched": "2026-09-09 08:08:59"
    "summary": "<p>Today, AWS HealthOmics introduces the resource fallback directive, enabling you to define an ordered list of preferred accelerator types, including an option to fallback to CPU instances, for tasks in your Workflow Description Language (WDL) workflows. Researchers and bioinformaticians can use this directive to reduce time spent diagnosing and resubmitting runs due to accelerator constraints and keep production workflows running. <a href=\"https://aws.amazon.com/healthomics/\">AWS HealthOmics</a> is a HIPAA-eligible service that helps healthcare and life sciences customers accelerate scientific breakthroughs at scale with fully managed bioinformatics workflows.&nbsp;</p> \n<p>With resource fallback, you can prioritize your preferred accelerator for your task. When your preferred accelerator is unavailable, HealthOmics automatically moves through your specified alternatives in the fallback without resubmission. Each accelerator profile has a configurable timeout, giving you control over how long HealthOmics searches for that accelerator before moving to the next. Shorter timeouts help you move quickly through the fallback order, while longer timeouts increase the probability of reserving your preferred accelerator. You can also include a CPU profile as a final fallback to increase the likelihood of your task reserving an instance.&nbsp;</p> \n<p>You can now use resource fallback for WDL workflows in all AWS HealthOmics Regions: US East (N. Virginia, Ohio), US West (Oregon), Europe (Frankfurt, Ireland, London), Israel (Tel Aviv), and Asia Pacific (Seoul, Singapore, Tokyo). To learn more, visit the <a href=\"https://docs.aws.amazon.com/omics/latest/dev/advanced-resource-configuration.html\">advanced resource configuration documentation</a>.&nbsp;</p>"
  "95d010055c453e69979994b9a2cdf348":
    "id": "95d010055c453e69979994b9a2cdf348"
    "title": "OpenAI GPT-6 Astra is now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-astra-on-amazon-bedrock/"
    "published": "2026-09-09 07:49:00"
    "fetched": "2026-09-09 11:52:05"
    "summary": "<p>Today, AWS announces the general availability of GPT-6 Astra from OpenAI on Amazon Bedrock. The latest and most capable model from OpenAI to date, GPT-6 Astra brings deeper reasoning and judgment, professional-quality writing and design, and advanced computer and browser use to demanding business workflows. It supports a context window of up to 1 million input tokens and can produce output aligned with organizational voice, templates, and standards. The Amazon Bedrock inference engine delivers the performance, security, and scale required for production workloads.</p> \n<p>You can call GPT-6 Astra directly through supported Amazon Bedrock APIs or configure ChatGPT Work and Codex to use the model on Amazon Bedrock. Use it to build autonomous agents, analyze extensive document collections, investigate complex software issues, and create applications that require judgment across competing inputs. As part of this launch, OpenAI is also introducing new enterprise plugins for ChatGPT Work that extend Astra’s browser-use capabilities across common business applications. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.</p> \n<p>You can get started in the <a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\">Amazon Bedrock console</a> or programmatically supported Amazon Bedrock APIs. For information about supported <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\">AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\">Amazon Bedrock documentation</a>.&nbsp;To explore what you can build with GPT-6 Astra, read the<a href=\"https://aws.amazon.com/blogs/machine-learning/take-on-your-most-ambitious-work-with-gpt-6-astra-on-amazon-bedrock/\"> blog</a>.&nbsp;</p>"
  "ff4eea1b4add9a1fb4db1526013de98b":
    "id": "ff4eea1b4add9a1fb4db1526013de98b"
    "title": "Amazon API Gateway now supports mutual TLS for backend integrations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-api-gateway-mutual-tls-backend/"
    "published": "2026-09-09 04:16:00"
    "fetched": "2026-09-09 11:52:05"
    "summary": "<p>You can now configure Amazon API Gateway REST APIs to present an AWS Certificate Manager (ACM) certificate to your backend during the TLS handshake, enabling mutual TLS (mTLS). Previously, API Gateway could present only a self-signed certificate that it generated; now you can use a certificate signed by a certificate authority you trust. Your integration endpoint validates this certificate during the handshake to confirm the connection comes from your API.&nbsp;</p> \n<p>You can import a certificate into ACM from your existing public key infrastructure (PKI), or have ACM issue and manage one for you through AWS Private Certificate Authority. When a certificate is reimported or renewed in ACM, API Gateway propagates the update automatically, with no redeployment and no downtime. Combined with the existing inbound mTLS support for client connections, you can apply mutual authentication across both the client-to-API and API-to-backend connections, which is a common requirement in financial services, healthcare, and other regulated or zero-trust environments.</p> \n<p>Mutual TLS for backend integrations is available in all commercial AWS Regions and the AWS GovCloud (US) Regions, where API Gateway REST APIs are available. You can configure it through the API Gateway console, AWS CLI, or AWS CloudFormation. To get started, see <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-backend-authentication.html\">Amazon API Gateway documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/bring-your-own-client-certificate-for-backend-mtls-in-amazon-api-gateway/\">AWS blog post</a>.&nbsp;</p>"
"last_updated": "2026-09-09 11:52:05 JST"
