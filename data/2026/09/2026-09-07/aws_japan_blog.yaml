    "fetched": "2026-09-07 11:39:47"
    "summary": "週刊生成AI with AWS, フィジカル AI とエージェント活用が進んだ2026年8月31日号 - NEC様、DeNA様、株式会社アドバンスト・メディア様、第一三共株式会社様・ＪＣＲファーマ株式会社様らの国内事例・実践レポートを紹介。また、AWS Summit Japan 2026 Physical AI デモの裏側やAI-DLC日本語コースなどのブログ記事も。サービスアップデートではAWS Agent Registryの一般提供、Claude Fable 5.1、Amazon Bedrock Managed Knowledge Baseの強化をはじめとする18件の関連アップデートを紹介。"
