"overview": |
  この日は 23 件で、Lambda まわりの機能追加、Outposts と各種サービスのリージョン拡大、Bedrock まわりの推論最適化とエージェント事例が中心でした。AWS Lambda durable functions が Python でエージェントを構築するオープンソースフレームワーク Pydantic AI と統合し、エージェントの状態を保存できるようになりました。Lambda の再帰ループ検出は Europe Sovereign Cloud でも利用可能になっています。Amazon API Gateway は REST API の実行ログについて、最大 1 MB のログイベントと配信先の設定に対応し、従来は API Gateway 管理の単一の CloudWatch ロググループに限られていた配信先を選べるようになりました。Amazon MQ が RabbitMQ 4.3 に対応し、クォーラムキューのコンパクション、優先度レベルの拡大、ネイティブな遅延リトライ、コンシューマーのグレースフルタイムアウトといった機能強化が入りました。Amazon Redshift の RG インスタンス (Graviton) が欧州 (チューリッヒ) リージョンで利用可能になり、Amazon ECS が RunTask / StartTask API で CPU・メモリの IAM 条件キーに対応、Amazon OpenSearch Serverless が Vercel の v0 上で使えるようになりました。第 2 世代の単一ラック AWS Outposts の一般提供も引き続き案内されています。AWS Transform for .NET は、モダナイズしたコードのテスト対象クラスに向けて単体テストを自動生成できるようになりました。Amazon RDS for Oracle は Oracle Database 19c / 26ai 向けに 2026 年 7 月のリリースアップデートの Supplemental Patch Bundle に対応しています。推論最適化では、Amazon SageMaker Inference が同じプロンプトプレフィックスのリクエストを同一インスタンスへ送って KV キャッシュを温存する prefix-aware routing を追加して LLM のレイテンシを削減し、Amazon SageMaker HyperPod はモデルの重みとコンテナイメージをクラスタノードへ事前ロードするモデルキャッシングでコールドスタートを短縮しました。機械学習ブログでは、TwelveLabs Marengo Embed 3.0 が Amazon Bedrock Knowledge Bases の埋め込みモデルとして一般提供となり、動画・画像・音声に対する自然言語検索がフルマネージドで使えるようになりました。あわせて、複数ターンの会話でエージェントを評価する Agent Evaluation Metric (AEM)、Bedrock 上の任意の LLM をプロンプトだけで PII 検出器にするモデル非依存の手法、Amazon Quick Automate による RFI 質問票ワークフロー、AvioBook (Thales グループ) が運用データを平易な回答へ変える取り組み、Amazon Chronos2 のゼロショット予測とマルチエージェントオーケストレーションを組み合わせ AgentCore 上で需要予測から発注まで自動化する事例が公開されました。国内の AWS ジャパンブログでは、AI 投資の ROI をどう算出するかを扱う記事が出ています。セキュリティ速報は 2 件で、Deep Java Library のテンソルバッファ検証における整数オーバーフロー (CVE-2026-85228) と、SSM Agent の Session Manager ポートフォワーディング機能におけるサーバーサイドリクエストフォージェリ (CVE-2026-89049) が Important として公開されました。
