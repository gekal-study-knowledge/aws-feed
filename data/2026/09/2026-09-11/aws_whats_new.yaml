  "8f17125ac99b28ba8231968083b9198f":
    "id": "8f17125ac99b28ba8231968083b9198f"
    "title": "AWS Lambda recursive loop detection is now available in Europe Sovereign Cloud"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/lambda-recursion-europe-sovereign-cloud"
    "published": "2026-09-11 05:00:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>AWS Lambda <a href=\"https://docs.aws.eu/lambda/latest/dg/invocation-recursion.html\">recursive loop detection</a> is now supported for functions running in Europe Sovereign Cloud. Recursive loop detection automatically detects and stops recursive invocations between Lambda functions and other supported services, preventing unexpected billing caused by unintended recursive loops. </p> \n<p>Customers use event sources such as Amazon S3, Amazon SQS, and Amazon SNS to build event driven applications that trigger Lambda functions. Misconfiguration or code defect can cause events to be sent back to the same source that triggered the Lambda function, causing recursive loops and unintended usage. When such a loop is detected, recursive loop detection automatically stops processing the event and sends you an AWS Health Dashboard notification with troubleshooting steps.</p> \n<p>Recursive loop detection is enabled by default for Lambda functions using a <a href=\"https://docs.aws.eu/lambda/latest/dg/invocation-recursion.html#invocation-recursion-supported\">supported SDK version</a>. If your function intentionally uses recursive loops, you can use the <a href=\"https://docs.aws.eu/lambda/latest/api/API_PutFunctionRecursionConfig.html\">PutFunctionRecursionConfig API </a>to turn off recursive loop detection on your Lambda function.&nbsp;</p> \n<p>To learn about recursive loop detection, visit&nbsp;<a href=\"https://docs.aws.eu/lambda/latest/dg/invocation-recursion.html\">Lambda documentation</a>.</p>"
  "5bca947ed5ddc9302b9c9e57a5d1082f":
    "id": "5bca947ed5ddc9302b9c9e57a5d1082f"
    "title": "Amazon API Gateway now supports 1 MB execution logs with configurable delivery destinations"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-api-gateway-1-mb-execution-logs/"
    "published": "2026-09-11 05:00:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>Amazon API Gateway now supports configurable delivery destinations and larger log events for REST API execution logs. Previously, execution logs were delivered to a single API Gateway-managed CloudWatch Logs log group with log events truncated at 1 KB, limiting visibility into request and response data.<br /> <br /> You can now route execution logs up to 1 MB to your own Amazon CloudWatch Logs log groups, Amazon S3 buckets, or Amazon Data Firehose streams, and deliver to multiple destinations simultaneously. For example, you can route execution logs to Amazon S3 in Apache Parquet format for cost-efficient long-term storage and analysis with Amazon Athena, while simultaneously delivering structured JSON logs to CloudWatch Logs for real-time alerting.<br /> <br /> This feature is available in all AWS Regions where API Gateway REST APIs are available, including the AWS GovCloud (US) Regions. Execution logs delivered through this feature are charged at vended logs rates. For pricing details, see <a href=\"https://aws.amazon.com/cloudwatch/pricing/\">Amazon CloudWatch Pricing</a>. You can set up delivery through the API Gateway console, AWS CLI, or AWS CloudFormation<i>.</i> To get started, see <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-execution-logging.html\">Amazon API Gateway documentation</a> and <a href=\"https://aws.amazon.com/blogs/compute/customize-amazon-api-gateway-destinations-for-execution-logs/\">AWS blog post</a>.&nbsp;</p>"
  "dbfb9c2ac98503feb4980f1c3609c07a":
    "id": "dbfb9c2ac98503feb4980f1c3609c07a"
    "title": "AWS Lambda durable functions integrates with Pydantic AI"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-durable-pydantic-ai/"
    "published": "2026-09-11 03:45:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>Today, AWS Lambda durable functions announces an integration with <a href=\"https://pydantic.dev/docs/ai/overview/\">Pydantic AI</a>, an open source framework for building AI agents in Python. AWS Lambda durable functions saves your Pydantic AI agent's progress as it runs, so after an interruption like a timeout, your agent resumes from the last completed step instead of starting over. Your agent gains fault tolerance without you having to write the checkpoint and retry logic yourself.</p> \n<p>With this integration, each model and tool call your agent makes is a durable execution step, so an interrupted run does not repeat calls that already completed. This matters when the work is expensive to repeat, such as a chain of model calls that reviews a set of documents or researches a topic across many sources, where starting over means paying again for tokens to do the same work. It also helps to avoid unwanted side-effects when resuming execution, such as billing a customer twice. Because your agent runs on AWS Lambda, you manage no servers and pay only for the compute it uses.</p> \n<p>You can use this integration in any Python AWS Lambda durable function. It is available in all AWS Regions where AWS Lambda durable functions is available. To get started, install Pydantic AI and follow its <a href=\"https://pydantic.dev/docs/ai/harness/aws-lambda/\">AWS Lambda durability page</a>. You can also find the integration details in the <a href=\"https://docs.aws.amazon.com/durable-execution/sdk-reference/integrations/pydantic-ai/\">durable execution SDK reference</a>. For more information about AWS Lambda durable functions, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">developer guide</a> and the <a href=\"https://aws.amazon.com/lambda/\">AWS Lambda product page</a>.</p>"
  "d309b8dc33cdaf2ae3433f74a1f140c7":
    "id": "d309b8dc33cdaf2ae3433f74a1f140c7"
    "title": "Amazon MQ now supports RabbitMQ 4.3"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-mq-rabbitmq-43/"
    "published": "2026-09-11 03:08:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>Amazon MQ now supports RabbitMQ version 4.3 which adds quorum queue feature enhancements such as compaction, increased priority levels, native delayed retries, and graceful consumer timeouts.&nbsp;RabbitMQ 4.3 also includes various bug fixes and performance improvements for memory management.</p> \n<p>Quorum queues on RabbitMQ 4.3 performs compaction to reduce disk usage for queues and native support for 32 strict priority levels, compared to the relative 2 levels supported in previous RabbitMQ versions. Quorum queues can now automatically set failed messages aside and retry delivery after a set cooldown delay. Consumer timeouts have moved from global protocol channels to quorum queues and can be configured specific to the protocol now.&nbsp;Both consumer timeouts and delayed retries can be configured and managed by RabbitMQ Policies. Transient non-exclusive queues, Global QoS, and Classic queues v1 storage are no longer supported on RabbitMQ 4.3. Consumer timeouts also do not apply to classic queues.</p> \n<p>To start using RabbitMQ 4.3 on Amazon MQ, simply select RabbitMQ 4.3 when creating a new broker using the m7g instance type through the AWS Management console, AWS CLI, or AWS SDKs. Amazon MQ automatically manages patch version upgrades for your RabbitMQ 4.3 brokers, so you need to only specify the major.minor version. To learn more about the changes in RabbitMQ 4.3, see the <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-release-notes.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon MQ release notes</a> and the Amazon MQ <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/working-with-rabbitmq.html\" rel=\"noopener noreferrer\" target=\"_blank\">developer guide</a>. This version is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\" rel=\"noopener noreferrer\" target=\"_blank\">regions</a> where Amazon MQ m7g type instances are available today.&nbsp;</p>"
  "c7e4cfff918890e7e04463d9c8830d65":
    "id": "c7e4cfff918890e7e04463d9c8830d65"
    "title": "Announcing second-generation single-rack AWS Outposts"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/single-rack-aws-outposts/"
    "published": "2026-09-11 02:58:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>Today, AWS announces the general availability of second-generation single-rack AWS Outposts, a self-contained 42U rack that integrates compute, storage and networking into a single compact unit purpose-built for workloads requiring low latency, local data processing, and data residency in space and power constrained locations. A single-rack Outposts delivers up to 2,688 vCPU and 100 TB of Amazon Elastic Block Store (Amazon EBS) storage. Moreover, like multi-rack Outposts, single-rack Outposts support the latest x86-powered EC2 instances, including general purpose (M7i, M8i), compute-optimized (C7i, C8i), memory-optimized (R7i, R8i), and Outposts accelerated networking (Bmn-sf2e, Bmn-cx2, Bmn-cx3a) instances.</p> \n<p>For organizations that operate in locations with limited rack space, such as manufacturing, gaming, and other industries, single-rack Outposts brings the latest AWS compute, storage, and networking features on-premises, and gives customers a direct path to modernize while leveraging their currently available space and power. Single-rack and multi-rack Outposts offer customers a consistent experience with the same AWS APIs, management console, automation, governance policies, and security controls across AWS Regions and on-premises locations.</p> \n<p>For a current list of AWS Regions and countries/territories where Outposts racks are supported, check out the <a href=\"https://aws.amazon.com/outposts/rack/faqs/#product-faqs%23in-which-countries-and-territories-is-outposts-rack-available-trigger\">Outposts rack FAQs page</a>. To get started, open the <a href=\"https://console.aws.amazon.com/outposts/\">AWS Outposts console</a>.</p>"
  "3f83b5da23e30c830e519fbc044cbaa5":
    "id": "3f83b5da23e30c830e519fbc044cbaa5"
    "title": "Amazon OpenSearch Serverless is now available on v0 by Vercel"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-opensearch-serverless-available-V0-vercel/"
    "published": "2026-09-11 02:00:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>You can now build full-stack search and AI applications in minutes using Amazon OpenSearch Serverless on v0 by Vercel, an AI-powered platform that transforms your ideas into production-ready web applications. OpenSearch Serverless eliminates infrastructure management and automatically scales capacity up and down based on demand, so you can focus on building and not managing clusters. With this launch, you can use natural language prompts to build applications powered by OpenSearch Serverless for full-text search and vector search for retrieval-augmented generation (RAG) workloads, all without leaving the v0 interface.</p> \n<p>To get started, simply describe what you want to build using a natural language prompt in&nbsp;<a href=\"https://v0.app\" rel=\"noopener noreferrer\" target=\"_blank\">v0</a> or visit <a href=\"https://v0.app/?pi=aws.opensearch\" rel=\"noopener noreferrer\" target=\"_blank\">OpenSearch Serverless</a> in v0 to begin with Amazon OpenSearch Serverless pre-selected.&nbsp;v0 generates a complete full-stack application, automatically provisions an Amazon OpenSearch Serverless collection, indexes your data into the collection, and uses the Amazon OpenSearch Serverless endpoint for serving search queries. v0 handles the required environment variables and configuration, and loads provider-specific agent skills to generate code that follows recommended patterns. You can either prompt v0 to provision Amazon OpenSearch Serverless resources under a new AWS account or link to an existing AWS account.</p> \n<p>You can create Vercel apps with Amazon OpenSearch Serverless in v0 in the following AWS Regions: US East (N. Virginia), US East (Ohio), US West (Oregon), US West (N. California), Canada (Central), South America (São Paulo), Europe (Ireland), Europe (London), Europe (Paris), Europe (Frankfurt), Europe (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Asia Pacific (Seoul), and Asia Pacific (Osaka). To learn more, check out the Vercel <a href=\"https://x.com/v0/status/2097745295706833121\" rel=\"noopener noreferrer\" target=\"_blank\">announcement</a> or visit the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> for Amazon OpenSearch Serverless.</p>"
  "19ff0c8cd608933a14073036b606410d":
    "id": "19ff0c8cd608933a14073036b606410d"
    "title": "Amazon ECS expands IAM condition key support for RunTask and StartTask APIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-expands-condition-key-support/"
    "published": "2026-09-11 01:52:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p><br /> <a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now supports the IAM condition keys for CPU and memory resources on the RunTask and StartTask APIs. Administrators can use these keys to enforce consistent CPU and memory limits across all methods of launching ECS tasks. This helps organizations prevent unexpected cost overruns and keep workloads aligned with their resource policies.<br /> Previously, the ecs:task-cpu and ecs:task-memory condition keys were available only on the RegisterTaskDefinition, CreateService, and UpdateService APIs. These condition keys are now extended on the RunTask and StartTask APIs. Now, IAM policies that reference these condition keys are evaluated when tasks are launched through RunTask and StartTask as well, giving administrators a single, unified mechanism to control resource allocation across their ECS environments.</p> \n<p>This enhancement is available in all AWS Regions where Amazon ECS is available, at no additional cost. To learn more about using condition keys with Amazon ECS, refer to our <a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonelasticcontainerservice.html\"><u>documentation</u></a>.</p>"
  "6e95b09af220439928e2a710652f0e9a":
    "id": "6e95b09af220439928e2a710652f0e9a"
    "title": "Amazon Redshift RG instances now available in Europe (Zurich) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-redshift-rg-available-zurich"
    "published": "2026-09-11 01:00:00"
    "fetched": "2026-09-11 06:21:32"
    "summary": "<p>Amazon Redshift RG instances, powered by AWS Graviton processors, are now available in the AWS Europe (Zurich) Region. RG instances deliver better performance, running data warehouse and data lake workloads up to 2.4x as fast as previous generation RA3 instances, at 30% lower price per vCPU. RG instances include Redshift's custom-built vectorized data lake query engine that processes Apache Iceberg and Parquet data on your cluster nodes, enabling you to run SQL analytics across your data warehouse and data lake using a single engine.</p> \n<p>RG instances are available in four instance sizes, rg.large, rg.xlarge, rg.4xlarge and rg.12xlarge. Customers with existing RA3 clusters can upgrade them to RG using Snapshot &amp; Restore, Elastic Resize, or Classic Resize. RG instances are available with flexible pricing options, including On-Demand, and 1-year and 3-year Reserved Instances with All Upfront, Partial Upfront, and No Upfront payment options. For pricing details, visit the <a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a>.<br /> <br /> To get started, refer to the following resources:<br /> </p> \n<ul> \n <li><p><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html#rs-rg-nodes-table\">Amazon Redshift RG Instance Documentation</a></p> </li> \n <li><p><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/managing-cluster-considerations.html#rs-upgrading-to-ra3\">RA3 to RG Upgrade Guide</a></p> </li> \n <li><p><a href=\"https://aws.amazon.com/redshift/pricing/\">Amazon Redshift pricing page</a></p> </li> \n</ul>"
  "d45a4b52fb3131df98d2cb344ade30a2":
    "id": "d45a4b52fb3131df98d2cb344ade30a2"
    "title": "AWS Transform for .NET now generates unit tests for modernized code"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transform-net-unit-tests"
    "published": "2026-09-11 05:00:00"
    "fetched": "2026-09-11 08:39:38"
    "summary": "<p>Today, AWS announced that AWS Transform for .NET can automatically generate unit tests for the code it modernizes. When enabled, AWS Transform generates unit tests that target the testable classes in your transformed .NET application, such as business logic and controllers, giving you an automated test safety net on the modernized code as part of the same job that performs the migration.</p> \n<p>Modernizing a .NET Framework application to modern .NET produces a transformed, buildable codebase, but teams previously had to write test coverage for that modernized code by hand. With this launch, AWS Transform assesses your application for testability in parallel with the standard .NET assessment, plans which classes and methods to cover, and generates the corresponding unit test code, so you complete the migration with tests already in place. Unit test generation is opt-in: you can enable it at the start of a job or after transformation completes.</p> \n<p>Unit test generation for AWS Transform for .NET is supported in the AWS Toolkit for Visual Studio extension. It is available in all AWS Regions where AWS Transform for .NET is supported. To get started, run a .NET transformation with AWS Transform for .NET in Visual Studio and choose to generate unit tests. To learn more, refer to&nbsp;<a href=\"https://docs.aws.amazon.com/transform/latest/userguide/dotnet-ide.html\">Modernizing .NET in the IDE</a> in the AWS Transform User Guide.</p>"
  "61a13ee3978c5fb43eb83bde5ba90697":
    "id": "61a13ee3978c5fb43eb83bde5ba90697"
    "title": "Amazon RDS for Oracle now supports Supplemental Patch Bundle for July 2026 Release Update"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-oracle-supports-spatial-patch-bundle-jul-2026-ru/"
    "published": "2026-09-11 16:12:00"
    "fetched": "2026-09-12 07:11:34"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/oracle/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for Oracle</a> now supports the Supplemental Patch Bundle (SPB) for the July 2026 Release Update (RU) for Oracle Database version 19c and 26ai.&nbsp;</p> \n<p>Starting with April 2026 releases, the Oracle Spatial Patch Bundle has been renamed to Supplemental Patch Bundle (SPB). The SPB includes additional database patches recommended by Oracle for specific use cases, such as Oracle Spatial, Oracle Data Pump, and Oracle GoldenGate. For details, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Oracle.Minor.html#RUs-and-SPBs\" rel=\"noopener noreferrer\" target=\"_blank\">Release Updates (RUs) and Supplemental Patch Bundles (SPBs).</a></p> \n<p>You can apply the Supplemental Patch Bundle update for new database instances, or upgrade existing instances to engine version 19.0.0.0.ru-2026-07.spb-1.r1 or 26.0.0.0.ru-2026-07.spb-1.r1 by selecting the \"Supplemental Patch Bundle Engine Versions\" checkbox in the AWS Console.&nbsp;To learn more about Oracle SPBs supported on Amazon RDS for each engine version, see the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/OracleReleaseNotes/Welcome.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for Oracle Release notes</a>.</p> \n<p>You can also use AWS Organizations upgrade rollout policy to stagger automatic minor version upgrades for your Amazon RDS database instances. This feature allows you to automatically apply updates to non-production environments, validate the updates, and then automatically apply the same update to production environments. For additional details about using AWS Organizations upgrade rollout policy for automatic minor version upgrades, refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Oracle.Minor.html#oracle-minor-version-upgrade-rollout\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for Oracle documentation</a>.</p>"
"last_updated": "2026-09-12 07:11:34 JST"
