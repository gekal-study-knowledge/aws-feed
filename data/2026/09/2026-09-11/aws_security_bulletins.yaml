    "title": "CVE-2026-85228 - Integer overflow in tensor buffer validation in Deep Java Library"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-106-aws/"
    "published": "2026-09-11 02:13:16"
    "fetched": "2026-09-11 03:02:02"
    "summary": "<p><b>Bulletin ID:</b> 2026-106-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/10/2026 10:00 AM PDT</p> \n<p><b>Description:</b></p> \n<p>Deep Java Library (DJL) is an open-source, engine-agnostic Java framework for deep learning, developed and maintained by Amazon. AWS identified CVE-2026-85228, an integer overflow in the tensor buffer validation component of DJL on all platforms. A crafted tensor payload declaring a shape whose computed byte size exceeds the 32-bit signed integer range causes the size to wrap, allowing an undersized buffer to pass validation; a subsequent tensor operation then reads out of bounds. If leveraged, a remote, unauthenticated actor could obtain information from adjacent process memory or cause a denial of service. A fix for this issue has been released and we recommend users of DJL upgrade to version 0.37.0 or later.</p> \n<p><b>Impacted versions:</b> &gt;=0.13.0 AND &lt;=0.36.0</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
  "fe816ed675163e3271e82852e52121d4":
    "id": "fe816ed675163e3271e82852e52121d4"
    "title": "CVE-2026-89049 - Server-side request forgery in the Session Manager port forwarding functionality in AWS Systems Manager Agent"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-107-aws/"
    "published": "2026-09-11 03:44:24"
    "fetched": "2026-09-11 06:21:34"
    "summary": "<p><b>Bulletin ID:</b> 2026-107-AWS<br /> <b>Scope:</b> AWS<br /> <b>Content Type:</b> Important (requires attention)<br /> <b>Publication Date:</b> 09/10/2026 11:30 AM PDT</p> \n<p><b>Description:</b></p> \n<p>AWS Systems Manager Agent (SSM Agent) is software that runs on managed nodes (EC2 instances, on-premises servers, and other supported machines) and processes requests from the AWS Systems Manager service, enabling capabilities including Session Manager port forwarding to remote hosts. We identified CVE-2026-89049, a server-side request forgery issue in the remote-host port forwarding functionality. Due to improper validation of equivalent address representations, an authenticated user with port-forwarding permission could bypass the remote destination denylist and reach link-local endpoints, potentially obtaining the managed instance's temporary IAM role credentials and acting with that role's permissions from outside the instance.</p> \n<p><b>Impacted versions:</b> &lt; 3.3.4851.0 (all versions supporting remote-host port forwarding)</p> \n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
