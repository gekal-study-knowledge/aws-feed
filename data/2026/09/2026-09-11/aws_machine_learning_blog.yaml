    "title": "Video and image search in Amazon Bedrock Knowledge Base using Marengo 3.0"
    "link": "https://aws.amazon.com/blogs/machine-learning/video-and-image-search-in-amazon-bedrock-knowledge-base-using-marengo-3-0/"
    "published": "2026-09-11 06:15:39"
    "fetched": "2026-09-11 06:21:35"
    "summary": "TwelveLabs Marengo Embed 3.0 is now generally available as an embedding model in Amazon Bedrock Knowledge Bases, bringing fully managed natural language search to video, image, and audio content. This walkthrough shows how to build a knowledge base powered by Marengo 3.0 and run semantic queries against your media."
