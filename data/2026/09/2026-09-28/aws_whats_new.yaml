  "f81cd45c65eb9c7c7f3492d247e27402":
    "id": "f81cd45c65eb9c7c7f3492d247e27402"
    "title": "Amazon Corretto September 2026 Patch Updates"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-corretto-sept-2026-updates/"
    "published": "2026-09-28 23:00:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>On September 25, 2026, Amazon announced a patch update for the following Amazon Corretto Long-Term Support (LTS) and Feature Release (FR) versions of OpenJDK: Corretto 25.0.4.10.1, 21.0.12.11.1, 17.0.20.12.1, and 11.0.32.12.1 are now available for <a href=\"https://aws.amazon.com/corretto/\">download</a>. Amazon Corretto is a no-cost, multi-platform, production-ready distribution of OpenJDK. This patch includes the latest&nbsp;tzdata 2026d updates.</p>\n<p>Visit Corretto <a href=\"https://aws.amazon.com/corretto\">home page</a> to download Corretto 27, Corretto 25, Corretto 21, Corretto 17, Corretto 11, or Corretto 8. You can also get the updates on your Linux system by configuring a <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-26-ug/generic-linux-install.html\">Corretto Apt, Yum, or Apk repo</a>.</p>\n<p>Feedback is <a href=\"https://github.com/corretto\">welcomed</a>!</p>"
  "5d13f37b98fdaf08843a0cee87740739":
    "id": "5d13f37b98fdaf08843a0cee87740739"
    "title": "AWS Backup adds logically air-gapped vault support for Amazon FSx for NetApp ONTAP"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-backup-air-gapped-vault-fsx-ontap/"
    "published": "2026-09-28 17:00:00"
    "fetched": "2026-09-29 08:39:13"
    "summary": "<p>AWS Backup logically air-gapped vault now supports Amazon FSx for NetApp ONTAP. Logically air-gapped vaults are a type of AWS Backup vault that allows secure sharing of backups across accounts and AWS Organizations, supporting direct restore to reduce recovery time from a data loss event.</p>\n<p>You can now protect your Amazon FSx for NetApp ONTAP volumes in logically air-gapped vaults. A logically air-gapped vault stores immutable backups that are locked by default, and isolated with encryption using AWS owned keys or customer-managed keys. You can store your FSx for NetApp ONTAP backups in a logically air-gapped vault in the same account or across other accounts and Regions. This helps reduce the risk of downtime, ensure business continuity, and meet compliance and disaster recovery requirements.</p>\n<p>You can get started using the AWS Backup console, AWS Command Line Interface (CLI), or AWS SDKs. Target FSx for NetApp ONTAP backups to a logically air-gapped vault by specifying it as the primary target or copy destination in your backup plan. Share the vault for recovery or restore testing with other accounts using AWS Resource Access Manager (RAM), or safeguard vault access during account compromise using <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/multipartyapproval.html\" rel=\"noopener noreferrer\" target=\"_blank\">Multi-party approval</a>. Once available, you can initiate direct restore jobs from that account, eliminating the overhead of copying backups first.</p>\n<p>This support is available in all AWS Regions where both logically air-gapped vault and Amazon FSx for NetApp ONTAP are available. For more information and detailed regional availability, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html#features-by-region\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Backup documentation</a>. To learn more about logically air-gapped vaults, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html\">feature documentation</a> and <a href=\"https://aws.amazon.com/backup/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing page</a>.</p>"
