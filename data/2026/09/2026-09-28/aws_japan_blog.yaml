  "d537e9f5a86a71a65cd24ec4b86df0d8":
    "id": "d537e9f5a86a71a65cd24ec4b86df0d8"
    "title": "AWS と SAP、SAP Business AI Platform の提供拡大に向け協業を強化"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-and-sap-expand-collaboration-for-sap-business-ai-platform/"
    "published": "2026-09-28 11:58:29"
    "fetched": "2026-09-28 12:23:17"
    "summary": "SAP Sapphire 2026 で、AWS は SAP との 5 年間の Strategic Collaboration Agreement（SCA）を発表しました。SAP Business AI Platform のプラットフォームサービスと SAP Business Data Cloud を、日本を含む 7 つの新しい AWS リージョンに展開します。これにより、規制産業や新興市場のお客様がデータレジデンシー、コンプライアンス、低レイテンシーの要件を満たしつつ、SAP と AWS の AI・機械学習機能を活用できるようになります。"
  "0adc43fc82a7509f996a9aad91a46001":
    "id": "0adc43fc82a7509f996a9aad91a46001"
    "title": "量子アルゴリズム入門: Daniel Simon 本人と読み解く Simon のアルゴリズム"
    "link": "https://aws.amazon.com/jp/blogs/news/simons-algorithm/"
    "published": "2026-09-28 16:21:48"
    "fetched": "2026-09-28 19:28:41"
    "summary": "量子アルゴリズムの原型にあたる Simon のアルゴリズムを、考案者 Daniel Simon 本人のコメントとともに解説します。既知の最良の古典アルゴリズムに対して、初めて指数関数的な高速化を示した成果です。Simon の問題の定義、古典と量子のクエリ複雑性の比較、量子回路の数学的な解析、ガウスの消去法による古典的な後処理までを順に追い、Amazon Braket での実装コードも紹介します。"
  "3d6efafa263bbcbfad224fd2888583ba":
    "id": "3d6efafa263bbcbfad224fd2888583ba"
    "title": "AWS がクラウドプロバイダーとして初めて NATO 全加盟国で NATO RESTRICTED ワークロードの取り扱い承認を取得"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-first-cloud-provider-nato-restricted-workloads/"
    "published": "2026-09-28 15:42:59"
    "fetched": "2026-09-28 19:28:41"
    "summary": "AWS は、北大西洋条約機構 (NATO) の全加盟国で NATO RESTRICTED (NR) ワークロードの取り扱いを承認された初のクラウドプロバイダーとなりました。本記事では、NATO D32 への準拠とスペイン国立暗号センター (CCN) による評価を経た承認プロセスや、同盟国による AWS 認定の迅速化、セキュリティおよびコンプライアンス上の義務を果たすための時間、労力、コストの削減といったメリットを紹介します。また、NATO 加盟国内にある 15 の AWS リージョンで NR 対応システムを構築できることや、今回の発表の基盤となる AWS Trusted Secure Enclaves – Sensitive Edition (TSE-SE) を含む、AWS の利用を開始する方法も説明します。"
  "3ded176cea3b8ba294d5e53d47d86c58":
    "id": "3ded176cea3b8ba294d5e53d47d86c58"
    "title": "週刊生成AI with AWS – 2026年9月21日週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260921/"
    "published": "2026-09-28 14:59:45"
    "fetched": "2026-09-28 19:28:41"
    "summary": "週刊生成AI with AWS, AI エージェントの運用と観測が大きく前進した2026年9月21日号 - 株式会社 PLAY様、株式会社クリエイティブ・ウェブ様の国内事例ブログを紹介。また、Amazon CloudWatch Omni の紹介や AWS for SAP MCP Server、AI-DLC による SAP ABAP 開発などのブログ記事も。サービスアップデートでは Claude Opus 5.5 や OpenAI GPT-6 Sol / Luna の提供開始、Amazon CloudWatch Omni の一般提供をはじめとする 17 件のアップデートを紹介。"
  "bd5de4235627e5b4e47827f4cfe328ce":
    "id": "bd5de4235627e5b4e47827f4cfe328ce"
    "title": "週刊AWS – 2026/9/21週"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-weekly-20260921/"
    "published": "2026-09-28 23:15:05"
    "fetched": "2026-09-29 03:23:15"
    "summary": "Claude Opus 5.5 が AWS で利用可能に、Amazon CloudWatch Omni: エージェントとアプリケーションのための AI ファーストオブザーバビリティ、スケーラブルな LLM 推論のための Amazon SageMaker HyperPod Inference Gateway、AWS End User Messaging が WhatsApp での音声通話に対応 など"
