    "title": "AWS と SAP、SAP Business AI Platform の提供拡大に向け協業を強化"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-and-sap-expand-collaboration-for-sap-business-ai-platform/"
    "published": "2026-09-28 11:58:29"
    "fetched": "2026-09-28 12:23:17"
    "summary": "SAP Sapphire 2026 で、AWS は SAP との 5 年間の Strategic Collaboration Agreement（SCA）を発表しました。SAP Business AI Platform のプラットフォームサービスと SAP Business Data Cloud を、日本を含む 7 つの新しい AWS リージョンに展開します。これにより、規制産業や新興市場のお客様がデータレジデンシー、コンプライアンス、低レイテンシーの要件を満たしつつ、SAP と AWS の AI・機械学習機能を活用できるようになります。"
"last_updated": "2026-09-28 12:23:17 JST"
