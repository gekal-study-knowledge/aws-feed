  "3b6c517b62bc158ac05b0f603fc9a05d":
    "id": "3b6c517b62bc158ac05b0f603fc9a05d"
    "title": "Amazon Bedrock Managed Knowledge Base now supports Salesforce and Zendesk as native data source connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-salesforce-zendesk-native-data-source-connectors/"
    "published": "2026-09-24 02:41:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>AWS announces Salesforce and Zendesk data source connectors for Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service. Customers can now sync Salesforce knowledge articles and Zendesk articles and community posts directly into their managed knowledge base.\n <br />\n Previously, bringing content from these platforms into Bedrock Knowledge Bases required building custom ingestion pipelines—now, you provide your instance credentials, and the connectors handle data crawling, metadata extraction, and incremental sync automatically.\n <br />\n These connectors make it easy to build AI agents and assistants grounded in the support and product knowledge your teams already maintain in Salesforce and Zendesk. For example, power a customer-facing support bot with up-to-date Zendesk help center articles and community answers, or build an internal sales enablement assistant that retrieves relevant Salesforce knowledge articles during deal preparation. By keeping your knowledge base in sync with these platforms, your retrieval-augmented generation applications always reflect the latest content without manual intervention.\n <br />\n To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-salesforce.html\">Salesforce data source connector</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-zendesk.html\">Zendesk data source connector </a>in the Amazon Bedrock User Guide. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "6eb1053f28246268a52b974525218c1d":
    "id": "6eb1053f28246268a52b974525218c1d"
    "title": "Amazon Connect Customer now provides routing step data in the analytics data lake"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-routing-step-data/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>Amazon Connect Customer now provides routing step data in the analytics data lake, making it easier for customers to generate insights from routing decisions. Using the data lake, customers can leverage Amazon Athena and Amazon Quick to analyze trends, such as contacts queued and contacts joined at each routing step, without complex data pipelines. For example,&nbsp;an analyst can now report on how contacts progressed through each routing step, identify where agent matching criteria were relaxed, and measure the impact of routing step configurations on wait times and agent utilization.</p>\n<p>Routing step data is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#analytics_datalake_region\">regions</a> where Amazon Connect Customer data lake is offered. To learn more about Amazon Connect Customer data lake, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/data-lake-contact-data.html\">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.&nbsp;</p>"
  "d1f2a7821e8bcb364eee9cf46205f5e3":
    "id": "d1f2a7821e8bcb364eee9cf46205f5e3"
    "title": "Amazon Kinesis Data Streams announces Service-Managed Partition Keys for simplified data ingestion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/kinesis/service-managed-partition-keys"
    "published": "2026-09-24 07:51:00"
    "fetched": "2026-09-24 14:49:14"
    "summary": "<p>Amazon Kinesis Data Streams now supports service-managed partition keys for On-Demand Standard and On-Demand Advantage streams, automatically distributing records across shards without requiring customers to specify partition keys to publish data. This capability simplifies data ingestion for workloads where record ordering is not required, eliminating hot partition keys and reducing time to production for streaming workloads.</p>\n<p>Amazon Kinesis Data Streams is a serverless streaming data service that makes it easy to capture, process, and store data streams at any scale. Many streaming use cases such as log aggregation, metrics collection, and IoT telemetry do not require ordering guarantees and benefit from prewarmed capacity for instant scaling. Previously, customers generated random partition keys (such as UUIDs) to distribute data, but random partitioning can still produce uneven throughput across shards, causing throttling for some partition keys even when the stream has sufficient aggregate capacity. By opting into service-managed partition keys, customers no longer need to specify partition keys when publishing data to streams in on-demand mode. The service automatically distributes records based on available warm capacity, allowing customers to scale to gigabytes per second without maintaining any distribution logic. Customers who want to send records without specifying a partition key can simply upgrade to the latest AWS SDK or Kinesis Producer Library (KPL) version to benefit from this capability.</p>\n<p>Service-managed partition keys for Amazon Kinesis Data Streams is available today in all AWS commercial regions at no additional cost. To get started, visit the Amazon Kinesis Data Streams documentation (<a href=\"https://aws.amazon.com/kinesis\">https://aws.amazon.com/kinesis</a>).</p>"
  "cbd666d97a0bc7aa871b97bda3e15dc1":
    "id": "cbd666d97a0bc7aa871b97bda3e15dc1"
    "title": "Amazon EMR on EKS now supports IPv6 Amazon EKS clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-emr-eks-ipv6-support"
    "published": "2026-09-24 00:00:00"
    "fetched": "2026-09-24 14:49:14"
    "summary": "<p>Today, AWS announces that Amazon EMR on EKS now supports running workloads on IPv6 Amazon Elastic Kubernetes Service (Amazon EKS) clusters. Amazon EMR on EKS enables data platform and analytics teams to run open-source big data frameworks such as Apache Spark and Apache Flink on Amazon EKS. With IPv6 support, teams operating at scale can now run these workloads on IPv6 Amazon EKS clusters, giving them access to the vastly larger address space of IPv6 as their analytics workloads grow.</p>\n<p>You can now scale large Spark and Flink workloads using the expanded IPv6 address space, which removes the need for IPv4 conservation workarounds such as secondary CIDR ranges or prefix delegation. High-executor jobs, such as 500-executor Spark jobs, can run concurrently without planning around address limits. To submit workloads, use StartJobRun, Spark Connect Interactive Endpoints, and Amazon SageMaker Unified Studio with no additional configuration, while the Flink, Livy, and Spark Operators are also supported. This capability is available at no additional cost, starting with Amazon EMR releases emr-7.14.0 and emr-spark-8.0.0.</p>\n<p>IPv6 cluster support is available in all AWS Regions where Amazon EMR on EKS and IPv6 Amazon EKS clusters are available.</p>\n<p>Amazon EMR on EKS IPv6 cluster support includes detailed setup instructions and documentation on supported submission models. Visit the <a href=\"https://aws.amazon.com/emr/features/eks/\">Amazon EMR on EKS product page</a> and the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-ipv6.html\">IPv6 documentation</a> to learn more.&nbsp;</p>"
  "0d745bddef11b51de1c05dd1e6110ac9":
    "id": "0d745bddef11b51de1c05dd1e6110ac9"
    "title": "Amazon SageMaker HyperPod Inference Gateway for scalable LLM inference"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/sagemaker-hyperpod-inference-gateway/"
    "published": "2026-09-24 17:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Amazon SageMaker HyperPod Inference Gateway is a Kubernetes-native, GPU-aware routing system that deploys as a single EKS managed add-on on existing SageMaker HyperPod infrastructure with zero application changes. By replacing unintelligent round-robin load balancing with real-time inference-signal-driven routing, it reduces first-token latency by up to 82% and p99 TTFT reductions of 97–98% in mixed-hardware and burst traffic scenarios.</p>\n<p>The Gateway is built around 3 core components. The Envoy Endpoint terminates HTTPS traffic and exposes a single private endpoint per cluster. The Body-Based Router reads the model name directly from each incoming request and routes it to the correct GPU pool - enabling one gateway to serve many models from a single endpoint URL with no client-side changes required. The Endpoint Picker continuously scores every model server pod in real time across 6 inference-level signals - KV cache utilization, queue depth, LoRA adapter residency, prefix cache hit rate, predicted latency and running requests - selecting the optimal pod for each individual request.</p>\n<p>The gateway works with any OpenAI-compatible model server, including vLLM and SGLang, requiring no application code changes.</p>\n<p>Per-cluster routing is available today in all AWS Regions where the SageMaker HyperPod inference add-on is supported. Coming soon - cross-cluster and cross-region routing with a centralized fleet gateway, global rate limiting, and cost-tier-aware traffic shaping.</p>\n<p>To learn more, read the <a href=\"https://aws.amazon.com/blogs/machine-learning/introducing-amazon-sagemaker-hyperpod-inference-gateway/\">launch blog</a> and explore the <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-hyperpod-model-deployment-inference-gateway.html\">documentation</a></p>"
  "1169af5dfa5a828d2d051ce393d66c6f":
    "id": "1169af5dfa5a828d2d051ce393d66c6f"
    "title": "Run interactive workloads on Amazon EMR on EKS with Spark Connect"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/emr-eks-spark-connect-interactive/"
    "published": "2026-09-24 17:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Amazon EMR on EKS now supports interactive Apache Spark sessions with Spark Connect. Data engineers and data scientists can develop and debug Apache Spark applications interactively from managed notebooks in Amazon SageMaker Unified Studio and their own IDEs, such as Jupyter and Visual Studio Code, with Spark running on the Amazon EKS clusters they already operate. &nbsp;</p>\n<p>An interactive session provides a persistent Spark context that spans across cells and scripts, letting you blend local Python code execution with remote Spark operations. Spark Connect's client-server architecture decouples your application client from the Spark driver and allows you to maintain your preferred development environment and tooling while Spark runs on your Amazon EKS cluster. This architecture supports workflows including ad hoc data exploration and incremental PySpark job development before deploying to production. Each session runs as pods on a virtual cluster, secured with your AWS Identity and Access Management (IAM) execution role and tagged by project and user.</p>\n<p>Spark Connect on Amazon EMR on EKS is available with EMR release 7.14 (Apache Spark 3.5) and emr-spark-8.1.0 (Apache Spark 4.1), in all AWS Commercial Regions. The Amazon SageMaker Unified Studio experience is available in <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html\">supported AWS Regions</a>.</p>\n<p>To get started, visit the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-spark-connect.html\">Spark Connect on Amazon EMR on EKS documentation</a> or the <a href=\"https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/notebooks-spark-connect.html#spark-connect-emr-eks\">Amazon SageMaker Unified Studio Getting Started guide.</a></p>"
  "c22eee25ebc9c70929f61c1ee8348d35":
    "id": "c22eee25ebc9c70929f61c1ee8348d35"
    "title": "Amazon GameLift Servers now available in 5 new regions and 8 Local Zones"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-gamelift-servers-region-expansion-2026"
    "published": "2026-09-24 17:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Amazon GameLift Servers is a fully managed service for deploying, operating, and scaling dedicated game servers for multiplayer games. High latency caused by geographic distance between players and servers remains one of the most common challenges in multiplayer game development. This expansion helps game developers and studios address that challenge by bringing Amazon GameLift Servers to 5 new AWS Regions and 8 AWS Local Zones worldwide.</p>\n<p>With this expansion, customers can deploy game server fleets closer to players across Latin America, Southeast Asia, Europe, the Middle East, and South Asia, reducing latency and improving gameplay responsiveness.&nbsp;</p>\n<p>The 5 new AWS Regions are il-central-1 (Tel Aviv), mx-central-1 (Mexico/Queretaro), eu-south-2 (Spain/Zaragoza), ap-south-2 (Hyderabad), and ap-southeast-3 (Jakarta). The 8 new AWS Local Zones are us-east-1-atl-2 (Atlanta), us-east-1-chi-2 (Chicago), us-east-1-iah-2 (Houston), us-east-1-mia-2 (Miami), us-west-2-phx-2 (Phoenix), sa-east-1-bue-1 (Buenos Aires), us-east-1-nyc-2 (NYC) and sa-east-1-lim-1 (Lima).\n <br />\n <br />\n To learn more about Amazon GameLift Servers and supported locations, or to deploy fleets in these new Regions and Local Zones, visit the Amazon GameLift Servers <a href=\"https://docs.aws.amazon.com/gameliftservers/latest/developerguide/release-notes.html\" target=\"_blank\">documentation</a>.</p>"
  "317f060864ef1a4309fa7b35dd8d9c21":
    "id": "317f060864ef1a4309fa7b35dd8d9c21"
    "title": "Amazon RDS supports Multi-AZ for SQL Server Developer Edition"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-sql-server-multi-az-developer-edition/"
    "published": "2026-09-24 16:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/sqlserver/\" target=\"_blank\">Amazon Relational Database Service (Amazon RDS) for SQL Server</a> now supports Multi-AZ deployments using Always On Availability Groups for SQL Server Developer Edition. Multi-AZ deployments maintain a synchronous standby replica in a different Availability Zone and provide automatic failover during infrastructure failure. You can use this capability to build and test high availability configurations in non-production environments using Developer Edition, which includes all the functionality of Enterprise Edition at no license cost.\n <br />\n <br />\n You can use this feature to validate your high availability architecture, test failover behavior, and develop against production-equivalent configurations without incurring Enterprise Edition licensing costs. Multi-AZ with Always On Availability Groups is available on SQL Server Developer Edition major versions 2019 and 2022, and on SQL Server 2025 Enterprise Developer Edition. SQL Server 2025 Standard Developer Edition does not support this feature.\n <br />\n <br />\n For more information about the AWS Regions where this feature is available, see <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/sqlserver-dev-edition.html\" target=\"_blank\">Working with SQL Server Developer Edition on RDS for SQL Server</a>. For pricing details, see <a href=\"https://aws.amazon.com/rds/sqlserver/pricing/\" target=\"_blank\">Amazon RDS for SQL Server Pricing</a>.</p>"
  "140378cf8bc6081136a1ebe275a6fa3a":
    "id": "140378cf8bc6081136a1ebe275a6fa3a"
    "title": "Amazon ElastiCache Global Datastore now supports tagging and tag-based access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-elasticache-global-datastore-tagging/"
    "published": "2026-09-24 16:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Amazon ElastiCache now supports resource tagging and tag-based access control (TBAC) for Global Datastore. Previously, ElastiCache supported tagging on all resources except Global Datastore, which prevented customers from applying a single, consistent permission and cost-allocation model across their ElastiCache fleet.</p>\n<p>With this launch, you can use AddTagsToResource, RemoveTagsFromResource, and ListTagsForResource on a Global Datastore, and reference those tags as conditions in IAM policies and Service Control Policies (SCPs) to grant permissions based on tag attributes rather than enumerating individual resources. Tag changes on a Global Datastore propagate automatically to every Region it spans, so access-control and cost-allocation policies stay consistent without per-Region operations.</p>\n<p>There is no additional cost for this feature, and no change to how you create or manage Global Datastores. This feature is available in all AWS Regions where ElastiCache Global Datastore is available. To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Tagging-Resources.html\" rel=\"noopener noreferrer\" target=\"_blank\">Tagging your ElastiCache resources</a> and <a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/IAM.ConditionKeys.html\" rel=\"noopener noreferrer\" target=\"_blank\">Using condition keys with ElastiCache</a>.&nbsp;</p>"
"last_updated": "2026-09-25 08:44:37 JST"
