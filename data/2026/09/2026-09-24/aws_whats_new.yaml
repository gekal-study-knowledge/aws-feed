    "title": "Amazon Bedrock Managed Knowledge Base now supports Salesforce and Zendesk as native data source connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-salesforce-zendesk-native-data-source-connectors/"
    "published": "2026-09-24 02:41:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>AWS announces Salesforce and Zendesk data source connectors for Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service. Customers can now sync Salesforce knowledge articles and Zendesk articles and community posts directly into their managed knowledge base.\n <br />\n Previously, bringing content from these platforms into Bedrock Knowledge Bases required building custom ingestion pipelines—now, you provide your instance credentials, and the connectors handle data crawling, metadata extraction, and incremental sync automatically.\n <br />\n These connectors make it easy to build AI agents and assistants grounded in the support and product knowledge your teams already maintain in Salesforce and Zendesk. For example, power a customer-facing support bot with up-to-date Zendesk help center articles and community answers, or build an internal sales enablement assistant that retrieves relevant Salesforce knowledge articles during deal preparation. By keeping your knowledge base in sync with these platforms, your retrieval-augmented generation applications always reflect the latest content without manual intervention.\n <br />\n To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-salesforce.html\">Salesforce data source connector</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-zendesk.html\">Zendesk data source connector </a>in the Amazon Bedrock User Guide. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "6eb1053f28246268a52b974525218c1d":
    "id": "6eb1053f28246268a52b974525218c1d"
    "title": "Amazon Connect Customer now provides routing step data in the analytics data lake"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-routing-step-data/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>Amazon Connect Customer now provides routing step data in the analytics data lake, making it easier for customers to generate insights from routing decisions. Using the data lake, customers can leverage Amazon Athena and Amazon Quick to analyze trends, such as contacts queued and contacts joined at each routing step, without complex data pipelines. For example,&nbsp;an analyst can now report on how contacts progressed through each routing step, identify where agent matching criteria were relaxed, and measure the impact of routing step configurations on wait times and agent utilization.</p>\n<p>Routing step data is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#analytics_datalake_region\">regions</a> where Amazon Connect Customer data lake is offered. To learn more about Amazon Connect Customer data lake, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/data-lake-contact-data.html\">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.&nbsp;</p>"
"last_updated": "2026-09-24 06:59:52 JST"
