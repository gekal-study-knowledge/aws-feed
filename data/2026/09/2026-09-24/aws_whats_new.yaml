  "3b6c517b62bc158ac05b0f603fc9a05d":
    "id": "3b6c517b62bc158ac05b0f603fc9a05d"
    "title": "Amazon Bedrock Managed Knowledge Base now supports Salesforce and Zendesk as native data source connectors"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-salesforce-zendesk-native-data-source-connectors/"
    "published": "2026-09-24 02:41:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>AWS announces Salesforce and Zendesk data source connectors for Amazon Bedrock Managed Knowledge Base, a fully managed retrieval-augmented generation (RAG) service. Customers can now sync Salesforce knowledge articles and Zendesk articles and community posts directly into their managed knowledge base.\n <br />\n Previously, bringing content from these platforms into Bedrock Knowledge Bases required building custom ingestion pipelines—now, you provide your instance credentials, and the connectors handle data crawling, metadata extraction, and incremental sync automatically.\n <br />\n These connectors make it easy to build AI agents and assistants grounded in the support and product knowledge your teams already maintain in Salesforce and Zendesk. For example, power a customer-facing support bot with up-to-date Zendesk help center articles and community answers, or build an internal sales enablement assistant that retrieves relevant Salesforce knowledge articles during deal preparation. By keeping your knowledge base in sync with these platforms, your retrieval-augmented generation applications always reflect the latest content without manual intervention.\n <br />\n To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-salesforce.html\">Salesforce data source connector</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/kb-managed-ds-zendesk.html\">Zendesk data source connector </a>in the Amazon Bedrock User Guide. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "6eb1053f28246268a52b974525218c1d":
    "id": "6eb1053f28246268a52b974525218c1d"
    "title": "Amazon Connect Customer now provides routing step data in the analytics data lake"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-routing-step-data/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 06:59:52"
    "summary": "<p>Amazon Connect Customer now provides routing step data in the analytics data lake, making it easier for customers to generate insights from routing decisions. Using the data lake, customers can leverage Amazon Athena and Amazon Quick to analyze trends, such as contacts queued and contacts joined at each routing step, without complex data pipelines. For example,&nbsp;an analyst can now report on how contacts progressed through each routing step, identify where agent matching criteria were relaxed, and measure the impact of routing step configurations on wait times and agent utilization.</p>\n<p>Routing step data is available in all AWS <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#analytics_datalake_region\">regions</a> where Amazon Connect Customer data lake is offered. To learn more about Amazon Connect Customer data lake, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/data-lake-contact-data.html\">Amazon Connect Customer Administrator Guide</a>.&nbsp; To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon Connect Customer website</a>.&nbsp;</p>"
  "d1f2a7821e8bcb364eee9cf46205f5e3":
    "id": "d1f2a7821e8bcb364eee9cf46205f5e3"
    "title": "Amazon Kinesis Data Streams announces Service-Managed Partition Keys for simplified data ingestion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/kinesis/service-managed-partition-keys"
    "published": "2026-09-24 07:51:00"
    "fetched": "2026-09-24 14:49:14"
    "summary": "<p>Amazon Kinesis Data Streams now supports service-managed partition keys for On-Demand Standard and On-Demand Advantage streams, automatically distributing records across shards without requiring customers to specify partition keys to publish data. This capability simplifies data ingestion for workloads where record ordering is not required, eliminating hot partition keys and reducing time to production for streaming workloads.</p>\n<p>Amazon Kinesis Data Streams is a serverless streaming data service that makes it easy to capture, process, and store data streams at any scale. Many streaming use cases such as log aggregation, metrics collection, and IoT telemetry do not require ordering guarantees and benefit from prewarmed capacity for instant scaling. Previously, customers generated random partition keys (such as UUIDs) to distribute data, but random partitioning can still produce uneven throughput across shards, causing throttling for some partition keys even when the stream has sufficient aggregate capacity. By opting into service-managed partition keys, customers no longer need to specify partition keys when publishing data to streams in on-demand mode. The service automatically distributes records based on available warm capacity, allowing customers to scale to gigabytes per second without maintaining any distribution logic. Customers who want to send records without specifying a partition key can simply upgrade to the latest AWS SDK or Kinesis Producer Library (KPL) version to benefit from this capability.</p>\n<p>Service-managed partition keys for Amazon Kinesis Data Streams is available today in all AWS commercial regions at no additional cost. To get started, visit the Amazon Kinesis Data Streams documentation (<a href=\"https://aws.amazon.com/kinesis\">https://aws.amazon.com/kinesis</a>).</p>"
  "cbd666d97a0bc7aa871b97bda3e15dc1":
    "id": "cbd666d97a0bc7aa871b97bda3e15dc1"
    "title": "Amazon EMR on EKS now supports IPv6 Amazon EKS clusters"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-emr-eks-ipv6-support"
    "published": "2026-09-24 00:00:00"
    "fetched": "2026-09-24 14:49:14"
    "summary": "<p>Today, AWS announces that Amazon EMR on EKS now supports running workloads on IPv6 Amazon Elastic Kubernetes Service (Amazon EKS) clusters. Amazon EMR on EKS enables data platform and analytics teams to run open-source big data frameworks such as Apache Spark and Apache Flink on Amazon EKS. With IPv6 support, teams operating at scale can now run these workloads on IPv6 Amazon EKS clusters, giving them access to the vastly larger address space of IPv6 as their analytics workloads grow.</p>\n<p>You can now scale large Spark and Flink workloads using the expanded IPv6 address space, which removes the need for IPv4 conservation workarounds such as secondary CIDR ranges or prefix delegation. High-executor jobs, such as 500-executor Spark jobs, can run concurrently without planning around address limits. To submit workloads, use StartJobRun, Spark Connect Interactive Endpoints, and Amazon SageMaker Unified Studio with no additional configuration, while the Flink, Livy, and Spark Operators are also supported. This capability is available at no additional cost, starting with Amazon EMR releases emr-7.14.0 and emr-spark-8.0.0.</p>\n<p>IPv6 cluster support is available in all AWS Regions where Amazon EMR on EKS and IPv6 Amazon EKS clusters are available.</p>\n<p>Amazon EMR on EKS IPv6 cluster support includes detailed setup instructions and documentation on supported submission models. Visit the <a href=\"https://aws.amazon.com/emr/features/eks/\">Amazon EMR on EKS product page</a> and the <a href=\"https://docs.aws.amazon.com/emr/latest/EMR-on-EKS-DevelopmentGuide/emr-eks-ipv6.html\">IPv6 documentation</a> to learn more.&nbsp;</p>"
"last_updated": "2026-09-24 14:49:14 JST"
