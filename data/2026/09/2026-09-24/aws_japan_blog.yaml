    "title": "週刊生成AI with AWS – 2026/9/14 週"
    "link": "https://aws.amazon.com/jp/blogs/news/weekly-genai-20260914/"
    "published": "2026-09-24 13:49:26"
    "fetched": "2026-09-24 14:49:15"
    "summary": "今週の週刊生成 AI with AWSでは、AI の「正しさ」をどう測るかという話題が目立ちました。Byron Cook 氏による自動推論の翻訳記事 3 本もあわせて公開されています。国内事例では、第一興商のカラオケ聴感採点 AI、レスターの営業情報プラットフォーム、NTTドコモの AI-DLC 実践（全 2 回）をご紹介します。サービスアップデートでは、新しい AgentCore Runtime が東京リージョンを含む 5 リージョンで利用可能になり、Moonshot AI の Kimi K3 が Amazon Bedrock で一般提供されています。Kiro 関連では、GPT‑5.6 の 1M コンテキスト対応、Claude Fable 5.1 のエンタープライズ向け提供、Kiro Web の自律モードで 2 年以上残っていた issue を人間の作業 5 分未満で解決した事例、Kiro Crew で 1 週間に 1,000 件の PR をマージした話と今週も盛りだくさんです。"
