  "d4e57e7ef66bc526999acab18c13b167":
    "id": "d4e57e7ef66bc526999acab18c13b167"
    "title": "Amazon CloudFront で SAP S/4HANA に mTLS 認証を実装する"
    "link": "https://aws.amazon.com/jp/blogs/news/implement-mtls-authentication-with-amazon-cloudfront-for-sap-s-4hana/"
    "published": "2026-09-24 11:08:01"
    "fetched": "2026-09-24 14:49:15"
    "summary": "グローバルに SAP S/4HANA を運用する企業では、単一リージョンへのアクセスによる TLS ハンドシェイクの遅延と、パスワード頼みの認証によるセキュリティリスクが課題となります。本記事では、Amazon CloudFront の mTLS verify モードでエッジでクライアント証明書を検証し、Application Load Balancer（ALB）のパススルーと SAP ICM の X.509 認証を組み合わせて、パスワードレスなシングルサインオン（SSO）を実現するアーキテクチャを解説します。CloudFront-Viewer-Cert-Pem ヘッダーの転送、S3 トラストストア、AWS Private CA、AWS Shield/AWS WAF による多層防御まで、実装からクリーンアップまでを順を追って説明します。社内テストでは初回ログイン時間を約40〜50%短縮しました。"
  "b743c90f0869f1625fde9475cc4c7a13":
    "id": "b743c90f0869f1625fde9475cc4c7a13"
    "title": "AI-DLC（AI 駆動開発ライフサイクル）による SAP ABAP アプリケーション開発"
    "link": "https://aws.amazon.com/jp/blogs/news/sap-abap-application-development-with-ai-dlc-ai-driven-development-lifecycle/"
    "published": "2026-09-24 11:01:12"
    "fetched": "2026-09-24 14:49:15"
    "summary": "Kiro と ABAP Accelerator を用いて AI-Driven Development Lifecycle（AI-DLC）の手法を適用し、SAP S/4HANA 上にフライト予約アプリケーションを構築する手順を解説します。Inception・Construction・Operations の 3 フェーズを通じて、AI が計画・設計・ABAP コード生成を主導し、ABAP Accelerator が SAP ABAP Test Cockpit（ATC）検証やオブジェクトのアクティベーションを自動化します。ビジネス上の意図から、数週間ではなく数時間で動作するコードへと到達する開発体験を実現します。"
