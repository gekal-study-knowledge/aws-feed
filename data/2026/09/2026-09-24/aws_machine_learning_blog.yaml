    "title": "From portal-hopping to instant answers: HEMA’s journey with MCP and Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/from-portal-hopping-to-instant-answers-hemas-journey-with-mcp-and-amazon-bedrock/"
    "published": "2026-09-24 03:41:09"
    "fetched": "2026-09-24 06:59:55"
    "summary": "HEMA, a 100-year-old Dutch retailer, turned developer portal-hopping into instant answers by building HAL, an internal AI assistant on Amazon Bedrock AgentCore. Using Model Context Protocol (MCP), HAL delivers governed knowledge inside the tools teams already use, with no AWS credentials on the client and security anchored in Microsoft Entra ID."
  "561e42e9330b99fb11bc86279b87e7ee":
    "id": "561e42e9330b99fb11bc86279b87e7ee"
    "title": "Agentic conversational video intelligence built on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/agentic-conversational-video-intelligence-built-on-aws/"
    "published": "2026-09-24 03:21:54"
    "fetched": "2026-09-24 06:59:55"
    "summary": "Learn how to build a conversational video intelligence solution on AWS using an agentic architecture. A single Strands Agents SDK agent orchestrates Amazon Bedrock, Amazon Rekognition, and Amazon Transcribe at runtime, deciding which service to call so you can ask natural language questions about your videos and get answers in seconds."
  "4f67579e301c574b0053597c0132bf0b":
    "id": "4f67579e301c574b0053597c0132bf0b"
    "title": "Use open weight models as your AI coding agent with Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/use-open-weight-models-as-your-ai-coding-agent-with-amazon-bedrock/"
    "published": "2026-09-24 03:17:44"
    "fetched": "2026-09-24 06:59:55"
    "summary": "Pair OpenCode, an open-source terminal-native AI coding agent, with open weight models on Amazon Bedrock to get a secure, flexible, pay-per-use coding assistant. Learn how to configure multi-model workflows, match the right model to each task, and keep your data in your own AWS account with no infrastructure to manage."
