"overview": |
  この日は 19 件で、エージェントを使った開発支援と業務適用の事例が中心でした。機械学習ブログでは、ターミナル上で動くオープンソースの AI コーディングエージェント OpenCode と、Amazon Bedrock のオープンウェイトモデルを組み合わせ、安全で柔軟な従量課金のコーディングアシスタントを構成する方法が紹介されました。複数モデルを使い分けるワークフローの設定手順が解説されています。あわせて、Strands Agents SDK の単一エージェントが Amazon Bedrock・Amazon Rekognition・Amazon Transcribe を統合的に呼び出す、対話型の動画インテリジェンスをエージェント型アーキテクチャで構築する方法が公開されました。事例としては、創業 100 年のオランダの小売企業 HEMA が、開発者が複数のポータルを渡り歩いていた状況を解消するために、Amazon Bedrock AgentCore 上で社内 AI アシスタント HAL を構築し、Model Context Protocol (MCP) を使って即座に答えを得られるようにした取り組みが紹介されています。セキュリティブログでは、月次ダイジェストの 2026 年 8 月号 (ICYMI: August 2026 @AWS Security) が公開され、最新のセキュリティ機能、コンプライアンスの更新、専門家によるブログ記事、新しいサービス機能、コードサンプル、ワークショップがまとめられています。サービス更新では、Amazon Connect Customer がルーティングステップのデータを分析データレイクで提供するようになり、ルーティングの判断から洞察を得やすくなりました。また、フルマネージドな RAG サービスである Amazon Bedrock Managed Knowledge Base が、Salesforce と Zendesk をネイティブのデータソースコネクタとしてサポートし、それぞれのナレッジを同期できるようになっています。サービス更新では、Amazon EMR on EKS が IPv6 の Amazon EKS クラスターに対応しました。Spark や Flink のワークロードを IPv6 クラスターで動かせるようになり、セカンダリ CIDR やプレフィックス委任といった IPv4 節約の回避策が不要になります。500 エグゼキューターの Spark ジョブのようなワークロードもアドレス上限を気にせず同時に実行でき、StartJobRun・Spark Connect インタラクティブエンドポイント・SageMaker Unified Studio から追加設定なしで投入でき、Flink・Livy・Spark の各 Operator もサポートされます。追加費用はかかりません。Amazon Kinesis Data Streams には Service-Managed Partition Keys が追加され、On-Demand Standard と On-Demand Advantage のストリームで、パーティションキーを指定しなくてもサービス側がレコードをシャードに自動分散するようになりました。ログ集約・メトリクス収集・IoT テレメトリーのように順序保証が不要な用途で、UUID などのランダムキーを自前で生成しても起きていたシャード間のスループットの偏りとスロットリングを避けられます。日本語ブログでは、Kiro と ABAP Accelerator を使い AI 駆動開発ライフサイクル (AI-DLC) の Inception・Construction・Operations の 3 フェーズで SAP S/4HANA 上にフライト予約アプリを構築する手順、Amazon CloudFront の mTLS verify モードでエッジでクライアント証明書を検証し Application Load Balancer と組み合わせて SAP S/4HANA の認証を強化する構成、Amazon Timestream for InfluxDB 3 の機能とワークフローの翻訳記事が公開されました。あわせて、AWS Builder Center モバイルアプリ、Amazon Connect Talent の一般提供開始、Amazon Corretto 27 などを取り上げたウィークリーラウンドアップ (2026 年 9 月 21 日)、週刊 AWS (2026/9/14 週。AWS Direct Connect の専用接続の定額料金、AWS PrivateLink の Tunnel Endpoint、AWS Elastic Beanstalk の Cluster Mode、Moonshot AI の Kimi K3 が Amazon Bedrock で一般提供開始など)、週刊生成 AI with AWS (2026/9/14 週。AI の「正しさ」をどう測るかを軸に、Byron Cook 氏による自動推論の翻訳記事 3 本と、第一興商のカラオケ聴感採点 AI、レスターの営業情報プラットフォーム、NTT ドコモの AI-DLC 実践といった国内事例) も届いています。推論基盤では、Amazon SageMaker HyperPod Inference Gateway が登場しました。既存の SageMaker HyperPod 基盤に EKS のマネージドアドオンとして 1 つ入れるだけで、アプリケーションを変更せずに使える Kubernetes ネイティブで GPU を意識したルーティングの仕組みです。単純なラウンドロビンの負荷分散を、推論のシグナルに基づくリアルタイムのルーティングに置き換えることで、ハードウェアが混在する環境やバースト時に、最初のトークンまでの時間を最大 82%、p99 の TTFT を 97〜98% 短縮します。HTTPS を終端しクラスターごとに 1 つのプライベートエンドポイントを提供する Envoy Endpoint、リクエストからモデル名を読み取って正しい GPU プールへ振り分ける Body-Based Router (1 つのエンドポイント URL で複数モデルをクライアント側の変更なしに提供)、エンドポイントを継続的にスコアリングする Endpoint Picker の 3 つが中核です。分析では、Amazon EMR on EKS が Spark Connect による対話型の Apache Spark セッションに対応しました。SageMaker Unified Studio のマネージドノートブックや、Jupyter・Visual Studio Code といった手元の IDE から、すでに運用している EKS クラスター上の Spark を対話的に開発・デバッグできます。セルやスクリプトをまたいで持続する Spark コンテキストにより、ローカルの Python 実行とリモートの Spark 操作を混ぜられ、アドホックなデータ探索や逐次的な開発に向きます。このほかサービス更新として、Amazon GameLift Servers が 5 つの新リージョン (テルアビブ、メキシコ/ケレタロ、スペイン/サラゴサ、ハイデラバード、ジャカルタ) と 8 つの Local Zones に拡大しプレイヤーとサーバーの距離によるレイテンシーを削減、Amazon RDS for SQL Server が Always On 可用性グループを使った Multi-AZ 配置を Developer Edition でもサポート (Enterprise Edition と同等の機能をライセンス費用なしで使えるため、非本番環境で HA 構成の検証やフェイルオーバーのテストができる)、Amazon ElastiCache の Global Datastore がリソースのタグ付けとタグベースのアクセス制御 (TBAC) に対応 (タグの変更はまたがる全リージョンへ自動で伝播し、アクセス制御とコスト配分のポリシーをリージョンごとの操作なしに揃えられる) が届いています。
