"overview": |
  この日は 6 件で、エージェントを使った開発支援と業務適用の事例が中心でした。機械学習ブログでは、ターミナル上で動くオープンソースの AI コーディングエージェント OpenCode と、Amazon Bedrock のオープンウェイトモデルを組み合わせ、安全で柔軟な従量課金のコーディングアシスタントを構成する方法が紹介されました。複数モデルを使い分けるワークフローの設定手順が解説されています。あわせて、Strands Agents SDK の単一エージェントが Amazon Bedrock・Amazon Rekognition・Amazon Transcribe を統合的に呼び出す、対話型の動画インテリジェンスをエージェント型アーキテクチャで構築する方法が公開されました。事例としては、創業 100 年のオランダの小売企業 HEMA が、開発者が複数のポータルを渡り歩いていた状況を解消するために、Amazon Bedrock AgentCore 上で社内 AI アシスタント HAL を構築し、Model Context Protocol (MCP) を使って即座に答えを得られるようにした取り組みが紹介されています。セキュリティブログでは、月次ダイジェストの 2026 年 8 月号 (ICYMI: August 2026 @AWS Security) が公開され、最新のセキュリティ機能、コンプライアンスの更新、専門家によるブログ記事、新しいサービス機能、コードサンプル、ワークショップがまとめられています。サービス更新では、Amazon Connect Customer がルーティングステップのデータを分析データレイクで提供するようになり、ルーティングの判断から洞察を得やすくなりました。また、フルマネージドな RAG サービスである Amazon Bedrock Managed Knowledge Base が、Salesforce と Zendesk をネイティブのデータソースコネクタとしてサポートし、それぞれのナレッジを同期できるようになっています。
