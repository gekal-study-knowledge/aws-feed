    "title": "AWS 認定資格 (MLA、SAP、DVA) に関するアップデート: 2026 年 9 月"
    "link": "https://aws.amazon.com/jp/blogs/news/september-2026-new-offerings/"
    "published": "2026-09-10 08:48:07"
    "fetched": "2026-09-10 09:47:31"
    "summary": "AWS が 3 つの認定試験を更新します。MLA-C02 のベータ登録はすでに開始しており、SAP-C03 と DVA-C03 は 2026 年 10 月 27 日より登録開始予定です。生成 AI・エージェンティック AI への対応や AI 支援開発など、今日のクラウドエンジニアに求められるスキルを反映した各試験の変更内容と重要な日程をお伝えします。"
