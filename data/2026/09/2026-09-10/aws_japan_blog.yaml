    "title": "【開催報告】Girls Meet STEM in AWS 2026 を開催しました"
    "link": "https://aws.amazon.com/jp/blogs/news/girls-meet-stem-event-2026summer/"
    "published": "2026-09-10 10:04:27"
    "fetched": "2026-09-10 14:32:15"
    "summary": "2026 年 8 月 21 日、AWS は中高生女子向けプログラム「Girls Meet STEM」に参加し、麻布台ヒルズの新オフィスにて生成 AI 体験ワークショップ、オフィスツアー、パネルディスカッションを開催しました。"
  "16e6d6123d5a35bfc677646ecdfb231f":
    "id": "16e6d6123d5a35bfc677646ecdfb231f"
    "title": "AWS Shield Advanced が AWS WAF Anti-DDoS マネージドルールグループを採用: 変更点と準備方法"
    "link": "https://aws.amazon.com/jp/blogs/news/aws-shield-advanced-is-embracing-the-aws-waf-anti-ddos-managed-rule-group-what-changes-and-how-to-prepare/"
    "published": "2026-09-10 09:47:18"
    "fetched": "2026-09-10 14:32:15"
    "summary": "AWS Shield Advanced は、アプリケーションレイヤー (L7) DDoS 保護のデフォルトとして AWS WAF Anti-DDoS マネージドルールグループを採用し、将来的には唯一の保護機能とします。2026 年 7 月 27 日から、対象のウェブ ACL への Count モードでのルールグループの追加が始まります。既存の L7 自動緩和と並行して動作するため、トラフィックへの影響はありません。この記事では、Anti-DDoS マネージドルールグループの機能、2027 年 1 月 1 日の Shield Advanced アプリケーションレイヤー自動緩和の終了までの 5 つのフェーズ、請求、モニタリングとメトリクスの変更点、IaC や AWS Firewall Manager ポリシーの更新など、移行に向けた準備方法を解説します。"
