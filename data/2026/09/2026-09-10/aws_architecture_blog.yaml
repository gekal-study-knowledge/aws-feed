    "title": "Testing application resilience with Amazon SQS and AWS Fault Injection Service"
    "link": "https://aws.amazon.com/blogs/architecture/testing-application-resilience-with-amazon-sqs-and-aws-fault-injection-service/"
    "published": "2026-09-10 06:33:59"
    "fetched": "2026-09-10 07:13:12"
    "summary": "Learn how to use AWS Fault Injection Service and AWS Systems Manager Automation to run progressive chaos experiments against Amazon SQS queues. Validate that your retry logic, circuit breakers, and dead-letter queues actually work under failure before a real outage hits production."
