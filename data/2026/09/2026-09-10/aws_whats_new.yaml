  "265777e360e186dc67f5ebb3306f4032":
    "id": "265777e360e186dc67f5ebb3306f4032"
    "title": "AWS Lambda now supports Graviton5-powered EC2 instances on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-graviton5-ec2/"
    "published": "2026-09-10 03:00:00"
    "fetched": "2026-09-10 04:40:35"
    "summary": "<p>AWS Lambda now supports AWS Graviton5-powered C9g, C9gd, M9g, and M9gd instances on <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances</a>. You can now run your Lambda functions on the latest generation of Graviton processors, delivering up to 25% better compute performance compared to Graviton4-powered instances.</p> \n<p>AWS Lambda Managed Instances lets you run Lambda functions on your AWS EC2 instances while maintaining Lambda's operational simplicity. With Lambda Managed Instances, you can access specialized compute configurations and drive cost efficiency through EC2 pricing advantages, without managing infrastructure. Lambda Managed Instances fully manages all infrastructure tasks, including instance lifecycle, OS and runtime patching, built-in routing, load balancing, and auto-scaling based on configurable parameters - so you can focus on writing code. Starting today, you can leverage Lambda Managed Instances with the latest Graviton5-powered instances, which deliver up to 25% better compute performance compared to the previous generation Graviton4-powered instances.</p> \n<p>To get started, you can specify the desired Graviton5 instance type (C9g, C9gd, M9g, or M9gd) when you create a capacity provider. When you set the instance type to default, Lambda automatically includes Graviton5 instances in the list of instances it chooses from, based on your function’s configured architecture, memory size, and memory-to-vCPU ratio.</p> \n<p>AWS Lambda Managed Instances supports C9g, C9gd, M9g, and M9gd instance types in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where both Lambda Managed Instances and these EC2 instances are available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances documentation</a>&nbsp;and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>.&nbsp;</p>"
  "3a1986cb1698c4acc92e0025a3cea749":
    "id": "3a1986cb1698c4acc92e0025a3cea749"
    "title": "Amazon Bedrock Managed Knowledge Base adds APIs and console support for debugging document-level access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-knowledge-base-debugging-document-access-control/"
    "published": "2026-09-10 01:03:00"
    "fetched": "2026-09-10 04:40:35"
    "summary": "<p>AWS announces the CheckIngestedDocumentAcl and GetIngestedDocumentAcl APIs for Amazon Bedrock Managed Knowledge Base, giving customers a self-service way to debug document access issues and audit document-level permissions. When a user doesn't see an expected document in retrieval results for ACL-enabled data sources, it can be difficult to determine whether the cause is an access control misconfiguration or something else entirely. These new APIs and the accompanying console experience close that gap, enabling you to quickly diagnose and resolve permission issues without opening a support case.</p> \n<p>CheckIngestedDocumentAcl lets you verify whether a specific user has access to a given ingested document, while GetIngestedDocumentAcl returns the full ACL attached to a document so you can audit exactly what permissions are configured and catch misconfigurations. The console also introduces a new Document Access Control section on the data source details page, where you can check access by entering a document ID and user email or retrieve a document's full ACL by document ID. Together, these capabilities give administrators the visibility they need to manage access control at scale across enterprise knowledge bases.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_CheckIngestedDocumentAcl.html\" target=\"_blank\">CheckIngestedDocumentAcl</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_GetIngestedDocumentAcl.html\" target=\"_blank\">GetIngestedDocumentAcl</a> in the Amazon Bedrock API Reference. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "a75d75a80fad1d7ecb527c6fd1be5652":
    "id": "a75d75a80fad1d7ecb527c6fd1be5652"
    "title": "Amazon Connect Customer now lets you set specific capacity limits for different types of Tasks and Emails"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-capacity-limits/"
    "published": "2026-09-10 06:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>Amazon Connect Customer now gives contact center managers the ability to set specific capacity limits for different kinds of work. Previously, concurrency settings were applied at the channel level so all contacts within a channel were treated the same regardless of complexity or effort required. With this launch, managers can classify Task and Email contacts into workload types based on complexity, priority, or business function, each with its own concurrency and interruption rules. For example, a manager can configure agents to handle up to 3 simple, low-effort Tasks concurrently while limiting complex, high-attention Tasks to 1 at a time.<br /> <br /> Specific capacity limits for Task and Email channels are available in all AWS commercial and AWS GovCloud (US-West) <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\" rel=\"noopener noreferrer\" target=\"_blank\">regions</a> where Amazon Connect Customer is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/channels-and-concurrency.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Connect Customer Administrator Guide</a>. To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/products/connect/customer/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Connect Customer website</a>.</p>"
  "8001345019c738be8fbf110068911181":
    "id": "8001345019c738be8fbf110068911181"
    "title": "AWS Transform for .NET modernization is now generally available via CLI"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transform-dotnet-cli"
    "published": "2026-09-10 05:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>Today, AWS announced the general availability of an AWS-managed transformation for .NET modernization in AWS Transform custom that you can trigger with a single one-line CLI command. You can run this transformation interactively, or script it into any existing pipeline or workflow to run autonomously. The CLI experience complements the existing AWS Transform for .NET experiences: the web application, Visual Studio IDE, Kiro Power, and MCP agents.</p> \n<p>AWS Transform custom enables organizations to modernize and transform code at scale using AWS-managed and custom transformations. You can upgrade language versions, migrate frameworks, optimize performance, and analyze code bases using transformations that are ready to use or can be customized to meet your organization's specific requirements. These transformations benefit from continuous improvement, learning from each engagement to deliver more accurate and efficient results.</p> \n<p>AWS Transform custom and AWS Transform for .NET are available in eight AWS Regions: US East (N. Virginia), Asia Pacific (Mumbai, Tokyo, Seoul, Sydney), Canada (Central), and Europe (Frankfurt, London).</p> \n<p>The .NET modernization transformation includes 50,000 free agent minutes per month. View AWS Transform Pricing for pricing details and examples. To learn more, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-aws-customs.html\">AWS-Managed Transformations</a> in the AWS Transform User Guide.</p>"
  "1abee5effab50cc3eb9346ece149f162":
    "id": "1abee5effab50cc3eb9346ece149f162"
    "title": "AWS Lambda now supports 90-minute function timeout on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-90-minute-function/"
    "published": "2026-09-10 03:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>AWS Lambda now supports a 90-minute function timeout for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html\">asynchronous</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html\">event source mapping (ESM)</a> invocations on <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances (LMI)</a>, a 6x increase from the previous 15-minute limit. You can now run data processing, media transcoding, financial calculations, AI inference, and batch workloads on Lambda for jobs that require longer continuous execution, without re-architecting your applications.</p> \n<p>Customers use Lambda to build serverless applications like event-driven processors, API backends, and data processing pipelines. For data-intensive workloads like media transcoding, financial calculations (such as Monte Carlo simulations), and AI inference that need longer continuous execution, Lambda's 15-minute function timeout limit required customers to adopt&nbsp;architectural workarounds. With today's launch, you can configure a function timeout of up to 90 minutes for asynchronous and ESM invocations on Lambda Managed Instances. Lambda Managed Instances lets you process multiple concurrent requests per instance, access specialized compute configurations, and drive cost efficiency through EC2 pricing advantages, without managing infrastructure. The increased function timeout also applies to invocations within <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions</a>, which allow you to checkpoint and replay steps for longer-running invocations. When invoked asynchronously, a multi-step durable execution can run for up to 1 year.</p> \n<p>You can configure up to a 90-minute function timeout for asynchronous and ESM invocations via the AWS Lambda Console, AWS CLI, Lambda APIs, Infrastructure as Code tooling, or the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html\">Agent Toolkit for AWS</a>. Synchronous invocations retain the existing 15-minute maximum timeout. This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Lambda Managed Instances is available.</p> \n<p>To learn more about configuring the 90-minute function timeout, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda developer guide</a>. For combining extended timeouts with checkpoint-and-replay resilience, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">durable functions documentation</a>. For pricing details, see <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda Pricing</a>. To learn more about AWS Lambda, visit <a href=\"https://aws.amazon.com/lambda/\">aws.amazon.com/lambda</a>.&nbsp;</p>"
"last_updated": "2026-09-10 07:13:10 JST"
