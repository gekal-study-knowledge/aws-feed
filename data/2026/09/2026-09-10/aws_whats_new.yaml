  "265777e360e186dc67f5ebb3306f4032":
    "id": "265777e360e186dc67f5ebb3306f4032"
    "title": "AWS Lambda now supports Graviton5-powered EC2 instances on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-graviton5-ec2/"
    "published": "2026-09-10 03:00:00"
    "fetched": "2026-09-10 04:40:35"
    "summary": "<p>AWS Lambda now supports AWS Graviton5-powered C9g, C9gd, M9g, and M9gd instances on <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances</a>. You can now run your Lambda functions on the latest generation of Graviton processors, delivering up to 25% better compute performance compared to Graviton4-powered instances.</p> \n<p>AWS Lambda Managed Instances lets you run Lambda functions on your AWS EC2 instances while maintaining Lambda's operational simplicity. With Lambda Managed Instances, you can access specialized compute configurations and drive cost efficiency through EC2 pricing advantages, without managing infrastructure. Lambda Managed Instances fully manages all infrastructure tasks, including instance lifecycle, OS and runtime patching, built-in routing, load balancing, and auto-scaling based on configurable parameters - so you can focus on writing code. Starting today, you can leverage Lambda Managed Instances with the latest Graviton5-powered instances, which deliver up to 25% better compute performance compared to the previous generation Graviton4-powered instances.</p> \n<p>To get started, you can specify the desired Graviton5 instance type (C9g, C9gd, M9g, or M9gd) when you create a capacity provider. When you set the instance type to default, Lambda automatically includes Graviton5 instances in the list of instances it chooses from, based on your function’s configured architecture, memory size, and memory-to-vCPU ratio.</p> \n<p>AWS Lambda Managed Instances supports C9g, C9gd, M9g, and M9gd instance types in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where both Lambda Managed Instances and these EC2 instances are available. To learn more, visit the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances documentation</a>&nbsp;and <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>.&nbsp;</p>"
  "3a1986cb1698c4acc92e0025a3cea749":
    "id": "3a1986cb1698c4acc92e0025a3cea749"
    "title": "Amazon Bedrock Managed Knowledge Base adds APIs and console support for debugging document-level access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-knowledge-base-debugging-document-access-control/"
    "published": "2026-09-10 01:03:00"
    "fetched": "2026-09-10 04:40:35"
    "summary": "<p>AWS announces the CheckIngestedDocumentAcl and GetIngestedDocumentAcl APIs for Amazon Bedrock Managed Knowledge Base, giving customers a self-service way to debug document access issues and audit document-level permissions. When a user doesn't see an expected document in retrieval results for ACL-enabled data sources, it can be difficult to determine whether the cause is an access control misconfiguration or something else entirely. These new APIs and the accompanying console experience close that gap, enabling you to quickly diagnose and resolve permission issues without opening a support case.</p> \n<p>CheckIngestedDocumentAcl lets you verify whether a specific user has access to a given ingested document, while GetIngestedDocumentAcl returns the full ACL attached to a document so you can audit exactly what permissions are configured and catch misconfigurations. The console also introduces a new Document Access Control section on the data source details page, where you can check access by entering a document ID and user email or retrieve a document's full ACL by document ID. Together, these capabilities give administrators the visibility they need to manage access control at scale across enterprise knowledge bases.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_CheckIngestedDocumentAcl.html\" target=\"_blank\">CheckIngestedDocumentAcl</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent-runtime_GetIngestedDocumentAcl.html\" target=\"_blank\">GetIngestedDocumentAcl</a> in the Amazon Bedrock API Reference. For more information about Amazon Bedrock Managed Knowledge Base, visit the <a href=\"https://aws.amazon.com/bedrock/knowledge-bases/\" target=\"_blank\">Amazon Bedrock Knowledge Bases product page</a>.</p>"
  "a75d75a80fad1d7ecb527c6fd1be5652":
    "id": "a75d75a80fad1d7ecb527c6fd1be5652"
    "title": "Amazon Connect Customer now lets you set specific capacity limits for different types of Tasks and Emails"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-capacity-limits/"
    "published": "2026-09-10 06:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>Amazon Connect Customer now gives contact center managers the ability to set specific capacity limits for different kinds of work. Previously, concurrency settings were applied at the channel level so all contacts within a channel were treated the same regardless of complexity or effort required. With this launch, managers can classify Task and Email contacts into workload types based on complexity, priority, or business function, each with its own concurrency and interruption rules. For example, a manager can configure agents to handle up to 3 simple, low-effort Tasks concurrently while limiting complex, high-attention Tasks to 1 at a time.<br /> <br /> Specific capacity limits for Task and Email channels are available in all AWS commercial and AWS GovCloud (US-West) <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region\" rel=\"noopener noreferrer\" target=\"_blank\">regions</a> where Amazon Connect Customer is offered. To learn more, see the <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/channels-and-concurrency.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Connect Customer Administrator Guide</a>. To learn more about Amazon Connect Customer, visit the <a href=\"https://aws.amazon.com/products/connect/customer/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Connect Customer website</a>.</p>"
  "8001345019c738be8fbf110068911181":
    "id": "8001345019c738be8fbf110068911181"
    "title": "AWS Transform for .NET modernization is now generally available via CLI"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-transform-dotnet-cli"
    "published": "2026-09-10 05:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>Today, AWS announced the general availability of an AWS-managed transformation for .NET modernization in AWS Transform custom that you can trigger with a single one-line CLI command. You can run this transformation interactively, or script it into any existing pipeline or workflow to run autonomously. The CLI experience complements the existing AWS Transform for .NET experiences: the web application, Visual Studio IDE, Kiro Power, and MCP agents.</p> \n<p>AWS Transform custom enables organizations to modernize and transform code at scale using AWS-managed and custom transformations. You can upgrade language versions, migrate frameworks, optimize performance, and analyze code bases using transformations that are ready to use or can be customized to meet your organization's specific requirements. These transformations benefit from continuous improvement, learning from each engagement to deliver more accurate and efficient results.</p> \n<p>AWS Transform custom and AWS Transform for .NET are available in eight AWS Regions: US East (N. Virginia), Asia Pacific (Mumbai, Tokyo, Seoul, Sydney), Canada (Central), and Europe (Frankfurt, London).</p> \n<p>The .NET modernization transformation includes 50,000 free agent minutes per month. View AWS Transform Pricing for pricing details and examples. To learn more, see <a href=\"https://docs.aws.amazon.com/transform/latest/userguide/transform-aws-customs.html\">AWS-Managed Transformations</a> in the AWS Transform User Guide.</p>"
  "1abee5effab50cc3eb9346ece149f162":
    "id": "1abee5effab50cc3eb9346ece149f162"
    "title": "AWS Lambda now supports 90-minute function timeout on Lambda Managed Instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-90-minute-function/"
    "published": "2026-09-10 03:00:00"
    "fetched": "2026-09-10 07:13:10"
    "summary": "<p>AWS Lambda now supports a 90-minute function timeout for <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html\">asynchronous</a> and <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html\">event source mapping (ESM)</a> invocations on <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda Managed Instances (LMI)</a>, a 6x increase from the previous 15-minute limit. You can now run data processing, media transcoding, financial calculations, AI inference, and batch workloads on Lambda for jobs that require longer continuous execution, without re-architecting your applications.</p> \n<p>Customers use Lambda to build serverless applications like event-driven processors, API backends, and data processing pipelines. For data-intensive workloads like media transcoding, financial calculations (such as Monte Carlo simulations), and AI inference that need longer continuous execution, Lambda's 15-minute function timeout limit required customers to adopt&nbsp;architectural workarounds. With today's launch, you can configure a function timeout of up to 90 minutes for asynchronous and ESM invocations on Lambda Managed Instances. Lambda Managed Instances lets you process multiple concurrent requests per instance, access specialized compute configurations, and drive cost efficiency through EC2 pricing advantages, without managing infrastructure. The increased function timeout also applies to invocations within <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">Lambda durable functions</a>, which allow you to checkpoint and replay steps for longer-running invocations. When invoked asynchronously, a multi-step durable execution can run for up to 1 year.</p> \n<p>You can configure up to a 90-minute function timeout for asynchronous and ESM invocations via the AWS Lambda Console, AWS CLI, Lambda APIs, Infrastructure as Code tooling, or the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/agent-setup-guide.html\">Agent Toolkit for AWS</a>. Synchronous invocations retain the existing 15-minute maximum timeout. This feature is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\">AWS Regions</a> where Lambda Managed Instances is available.</p> \n<p>To learn more about configuring the 90-minute function timeout, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances.html\">Lambda developer guide</a>. For combining extended timeouts with checkpoint-and-replay resilience, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\">durable functions documentation</a>. For pricing details, see <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda Pricing</a>. To learn more about AWS Lambda, visit <a href=\"https://aws.amazon.com/lambda/\">aws.amazon.com/lambda</a>.&nbsp;</p>"
  "2b82945cdd8bc2ed0b04dc4a9fa19025":
    "id": "2b82945cdd8bc2ed0b04dc4a9fa19025"
    "title": "AWS Elemental MediaLive adds support for A/B forensic watermarking"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/medialive-ab-forensic-watermarking/"
    "published": "2026-09-10 17:00:00"
    "fetched": "2026-09-10 23:45:52"
    "summary": "<p>AWS Elemental MediaLive now supports A/B forensic watermarking, enabling content owners to trace the source of unauthorized redistribution of live video content. A single MediaLive channel produces two synchronized output variants, each carrying a distinct visually transparent watermark that persists through re-encoding and screen capture. Downstream packaging and CDN infrastructure assembles these variants into unique per-session sequences that identify the origin of leaked content.</p> \n<p>Forensic watermarking follows the DASH Industry Forum (DASH-IF) specification for A/B watermarking (European Telecommunications Standards Institute (ETSI) TS 104 002), ensuring interoperability with standards-compliant packagers and CDN infrastructure. Customers can configure watermarking on Common Media Application Format (CMAF) Ingest output groups through the MediaLive API or console. MediaLive delivers watermarked A and B variants via CMAF ingest to AWS Elemental MediaPackage or third-party packagers, enabling downstream per-session watermark assembly through compatible CDN infrastructure including Amazon CloudFront.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/medialive/latest/ug/feature-ab-watermark.html\">AWS Elemental MediaLive User Guide</a>.</p> \n<p>A/B forensic watermarking is available in all AWS Regions where AWS Elemental MediaLive is available.</p>"
  "678519f6781c5dcda791562818dc48f9":
    "id": "678519f6781c5dcda791562818dc48f9"
    "title": "AWS Elemental MediaTailor now offers Yield Optimization to automatically fill ad breaks with Amazon Ads demand"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/mediatailor-yield-optimization/"
    "published": "2026-09-10 17:00:00"
    "fetched": "2026-09-10 23:45:52"
    "summary": "<p>AWS Elemental MediaTailor now offers Yield Optimization, a new capability that automatically monetizes unused ad inventory with Amazon Ads demand during server-side ad insertion (SSAI) for livestreams. Available exclusively to publishers in the Amazon Publisher Services (APS) Streaming TV program, yield optimization turns unfilled ad breaks into monetized impressions at zero cost to enable and with no additional infrastructure required.</p> \n<p>Because ads are stitched directly into the stream before reaching the viewer, they play seamlessly on every device. Key highlights:</p> \n<p>- Built for scale: yield optimization is designed for large-scale live events such as professional league championships, with low latency and fast response times to maximize ad fill during peak viewership.</p> \n<p>- Brand safe: demand is filtered by category to avoid competitive conflicts within the same ad break. publishers set their own price floors and category rules to maintain full control over which ads run in their streams.</p> \n<p>- Simple to enable: configure yield optimization through the MediaTailor API or Console. No additional infrastructure or client-side changes are required.</p> \n<p>- Performance visibility: monitor ad fill rate improvements using MediaTailor metrics in Amazon CloudWatch. Track revenue and earnings through the APS Publisher portal.</p> \n<p>AWS Elemental MediaTailor yield optimization is available at no additional cost in all AWS Regions where MediaTailor is available, including US East (Ohio), US East (N. Virginia), US West (Oregon); Africa (Cape Town); Asia Pacific (Hyderabad, Malaysia, Melbourne, Mumbai, Osaka, Seoul, Singapore, Sydney, Tokyo); Canada (Central); Europe (Frankfurt, Ireland, London, Paris, Stockholm); Middle East (UAE); and South America (São Paulo). To learn more, visit the AWS Elemental MediaTailor documentation.</p>"
  "44e808ad412b24d347717d5a9843fa79":
    "id": "44e808ad412b24d347717d5a9843fa79"
    "title": "AWS Elemental Inference now generates contextual metadata from live video in real time"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/elemental-inference-contextual-metadata/"
    "published": "2026-09-10 17:00:00"
    "fetched": "2026-09-10 23:45:52"
    "summary": "<p><a href=\"https://aws.amazon.com/elemental-inference/\">AWS Elemental Inference</a> now generates contextual metadata from live video streams in real time, using AI to produce scene-level intelligence without custom machine learning infrastructure. The new capability analyzes live video in parallel with encoding to extract Interactive Advertising Bureau (IAB) content taxonomy categories, Global Alliance for Responsible Media (GARM) brand suitability signals, detected objects and actions, and shot and scene-level descriptions. Broadcasters and content platforms can now power contextual ad decisioning, media asset enrichment, and content discovery workflows using serverless, fully managed AI.</p> \n<p>For contextual advertising, <a href=\"https://aws.amazon.com/medialive/\">AWS Elemental MediaLive</a> embeds the Elemental Inference feed ID into (Society of Cable Telecommunications Engineers) SCTE-35 ad markers in the live stream. At each ad break, <a href=\"https://aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor</a> uses a Monetization Function to retrieve the scene-level signals for that feed ID and translate them into the targeting parameters ad servers expect. This enables context-aware ad decision-making without custom integration work, supporting use cases like contextual deal curation and brand suitability scores, resulting in improved monetization outcomes for publishers. For media asset management, detecting objects and actions, and shot and scene-level descriptions, provide automatic structured metadata generation for every scene and shot, building richer archives that power contextual content discovery, assisted editing workflows, and personalized content recommendations without manual logging or post-production metadata entry.</p> \n<p>Contextual metadata is available today in the AWS Elemental MediaLive console in all AWS Regions where AWS Elemental Inference is available.</p>"
  "40612fa1c50ea0fb43fc52ec26e419a7":
    "id": "40612fa1c50ea0fb43fc52ec26e419a7"
    "title": "AWS Elemental introduces Dynamic Multiview for live video"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-elemental-dynamic-multiview-video/"
    "published": "2026-09-10 17:00:00"
    "fetched": "2026-09-10 23:45:52"
    "summary": "<p>AWS Elemental MediaPackage now offers Dynamic Multiview, a server-side capability that composes multiple live video sources into viewer-selected tiled layouts on demand. Content providers can deliver multi-angle, multi-game, and personalized viewing experiences as standard HLS (HTTP Live Streaming) and DASH (Dynamic Adaptive Streaming over HTTP) streams playable on most modern consumer devices, televisions, and set top boxes without custom player development.</p> \n<p>Dynamic Multiview operates entirely in the compressed domain, combining individually encoded sources without re-encoding or compositing. Customers encode each source once through AWS Elemental MediaLive, and MediaPackage assembles compositions on demand - only when viewers request them, eliminating the need to pre-encode combinations. Because the output is standard HLS and DASH, it plays natively on existing devices and players with no app changes or SDK integration required. The feature supports AVC and HEVC codecs, DRM encryption, SCTE-35 ad marker passthrough, and full-screen ad replacement.</p> \n<p>To learn more, visit the <a href=\"https://docs.aws.amazon.com/medialive/latest/ug/dynamic-multiview-reference.html\">Elemental Dynamic Multiview Reference Guide</a>.</p> \n<p>Dynamic Multiview is available in all AWS Regions where AWS Elemental MediaPackage and MediaLive are available.</p>"
  "9c53b5bff8f519e903d1dec35393e8a9":
    "id": "9c53b5bff8f519e903d1dec35393e8a9"
    "title": "AWS Elemental MediaTailor now supports Low-Latency HLS ad insertion"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-elemental-mediatailor-low-latency-hls-ad-insertion"
    "published": "2026-09-10 17:00:00"
    "fetched": "2026-09-10 23:45:52"
    "summary": "<p>AWS Elemental MediaTailor now supports Low-Latency HTTP Live Streaming (LL-HLS) ad insertion using HLS Interstitials. MediaTailor is a channel assembly and personalized ad insertion service for video providers that monetizes live streams, linear channels, and video-on-demand content. With this launch, video providers can insert ads into low-latency live streams while holding the reduced latency their viewers expect.</p> \n<p>LL-HLS reduces live latency by delivering partial segments and letting players hold a playlist request open until the next segment part is ready, which requires media playlists to be cacheable at the content delivery network (CDN) edge. MediaTailor supports this using HLS Interstitials, which reference ads as a separate playlist instead of stitching them into each viewer's media playlist. Every viewer receives the same cacheable playlist, so MediaTailor sustains low-latency playback at scale and moves the ad decision server call off the manifest request path. This capability has been proven in production on live sporting events with multi-million views, and is ideal for live sports, news, betting and wagering, watch-party, and interactive live formats where latency is a product requirement.</p> \n<p>Low-Latency HLS ad insertion is available in all AWS Regions where AWS Elemental MediaTailor is available. To learn more, visit the <a href=\"https://aws.amazon.com/mediatailor/\">AWS Elemental MediaTailor product page</a> and the <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/server-guided.html\">MediaTailor server-guided ad insertion documentation</a>. To get started, sign in to the <a href=\"https://console.aws.amazon.com/mediatailor/home\">MediaTailor console</a>..</p>"
  "63e1aaa431f46eb5ed5c3b0146e02aaf":
    "id": "63e1aaa431f46eb5ed5c3b0146e02aaf"
    "title": "CloudWatch Network Monitor now provides NHI for Transit Gateway peering"
    "link": "https://aws.amazon.com/amazon-cloudwatch-network-monitor-nhi-transit-gateway-peering"
    "published": "2026-09-10 19:28:00"
    "fetched": "2026-09-11 03:02:01"
    "summary": "<p>Today, AWS announces that Amazon CloudWatch Network Monitor synthetic monitoring now provides its network health indicator (NHI) for paths that reach a destination across an AWS Transit Gateway inter-Region peering connection. Amazon CloudWatch Network Monitor is a fully managed service that measures packet loss and latency for the hybrid network paths connecting your AWS-hosted applications to your destinations. The NHI helps network operators and application developers rapidly determine whether an observed degradation is within the AWS network.</p> \n<p>Previously, the NHI covered only paths that connect through AWS Direct Connect. With this launch, hybrid architectures that route across Transit Gateway inter-Region peering receive the same rapid diagnosis, reducing the time you spend isolating the source of an issue. For these paths, the NHI reflects the health of the AWS network path up to the Transit Gateway peering connection, and <a href=\"https://aws.amazon.com/cloudwatch/\">Amazon CloudWatch</a> receives the metric so you can build dashboards and set alarms.</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/nw-monitor-how-it-works.html\">How Network Synthetic Monitor works</a> in the Amazon CloudWatch User Guide.</p>"
"last_updated": "2026-09-11 03:02:01 JST"
