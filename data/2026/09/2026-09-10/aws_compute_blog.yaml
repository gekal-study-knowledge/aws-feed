    "title": "Announcing 90-minute function timeout on AWS Lambda Managed Instances"
    "link": "https://aws.amazon.com/blogs/compute/announcing-90-minute-function-timeout-on-aws-lambda-managed-instances/"
    "published": "2026-09-10 04:08:14"
    "fetched": "2026-09-10 04:40:39"
    "summary": "AWS Lambda now supports a 90-minute function timeout for asynchronous and event source mapping (ESM) invocations on Lambda Managed Instances, a 6x increase from the previous 15-minute limit. Data processing, media transcoding, AI inference, and batch workloads can now run on Lambda without re-architecting."
