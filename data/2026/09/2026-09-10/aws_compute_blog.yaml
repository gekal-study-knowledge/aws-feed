    "title": "Announcing 90-minute function timeout on AWS Lambda Managed Instances"
    "link": "https://aws.amazon.com/blogs/compute/announcing-90-minute-function-timeout-on-aws-lambda-managed-instances/"
    "published": "2026-09-10 04:08:14"
    "fetched": "2026-09-10 04:40:39"
    "summary": "AWS Lambda now supports a 90-minute function timeout for asynchronous and event source mapping (ESM) invocations on Lambda Managed Instances, a 6x increase from the previous 15-minute limit. Data processing, media transcoding, AI inference, and batch workloads can now run on Lambda without re-architecting."
  "97943a228beba37d9ae7486cf977c5d6":
    "id": "97943a228beba37d9ae7486cf977c5d6"
    "title": "Architecting SASE solutions using AWS Local Zones"
    "link": "https://aws.amazon.com/blogs/compute/architecting-sase-solutions-using-aws-local-zones/"
    "published": "2026-09-10 05:36:09"
    "fetched": "2026-09-10 07:13:13"
    "summary": "Organizations with geographically distributed workforces face a trade-off between security and low-latency access. This post explores how to use AWS Local Zones and Secure Access Service Edge (SASE) solutions to deploy virtual security appliances closer to end users, covering key design principles, capacity planning, and traffic routing."
