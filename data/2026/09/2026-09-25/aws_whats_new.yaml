  "82bfe68e08acf747dc2d9417f406559b":
    "id": "82bfe68e08acf747dc2d9417f406559b"
    "title": "AWS Lambda durable functions are now available in AWS European Sovereign Cloud region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/durablefunctions-european-sovereign-cloud/"
    "published": "2026-09-25 03:29:00"
    "fetched": "2026-09-25 05:15:26"
    "summary": "<p>AWS Lambda durable functions are now available in the AWS European Sovereign Cloud. Lambda durable functions enable developers to build reliable multi-step applications and AI workflows within the Lambda developer experience.</p>\n<p>Lambda durable functions extend the Lambda programming model with new primitives in your event handler, such as \"step\" and \"wait\", allowing you to checkpoint progress, automatically recover from failures, and pause executions without incurring compute charges for on-demand functions. With availability in the AWS European Sovereign Cloud region, customers can orchestrate complex processes such as order workflows, user onboarding, and AI-assisted tasks while meeting compliance and security requirements.</p>\n<p>You can activate durable functions for new Python (versions 3.13 and 3.14), Node.js (versions 22 and 24), or Java (17+) based Lambda functions using the AWS Lambda API, AWS Management Console, or AWS SDK. You can also use infrastructure as code tools such as AWS CloudFormation, AWS Serverless Application Model (AWS SAM), and the AWS Cloud Development Kit (AWS CDK).</p>\n<p>For more information on durable functions, visit the <a href=\"https://aws.amazon.com/lambda/lambda-durable-functions/\">AWS Lambda durable functions product page</a> or the <a href=\"https://docs.aws.eu/lambda/latest/dg/durable-functions.html#\">AWS Lambda Developer Guide</a>. To learn about pricing, visit <a href=\"https://aws.amazon.com/lambda/pricing/\">AWS Lambda pricing</a>. &nbsp;</p>"
  "f2aae8bad9557f8f494caba9fecb10ae":
    "id": "f2aae8bad9557f8f494caba9fecb10ae"
    "title": "Amazon RDS for MySQL announces Extended Support minor versions 5.7.44-rds.20260902 and 8.0.46-rds.20260908"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-rds-mysql-extended-support-minor-5744-8046-rds/"
    "published": "2026-09-25 01:00:00"
    "fetched": "2026-09-25 05:15:26"
    "summary": "<p><a href=\"https://aws.amazon.com/rds/mysql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon Relational Database Service (RDS) for MySQL</a> announces Amazon RDS Extended Support minor versions 5.7.44-rds.20260902 and 8.0.46-rds.20260908.</p>\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Extended Support</a> provides up to three additional years of fixes for critical Common Vulnerabilities and Exposures (CVE) and bugs beyond a major version's end of standard support date, giving you more time to upgrade to a new major version.\n <br />\n <br />\n You can upgrade your database using <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/blue-green-deployments.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Blue/Green Deployments</a>, in-place upgrade, or restore from a snapshot. Learn more about performing version upgrades in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.MySQL.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MySQL User Guide</a>. You can also migrate to MySQL 8.4 from external MySQL sources using <a href=\"https://aws.amazon.com/dms/\" rel=\"noopener noreferrer\" target=\"_blank\">AWS Database Migration Service</a>. Learn more about pricing details and regional availability at <a href=\"https://aws.amazon.com/rds/mysql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for MySQL</a>.</p>\n<p>Amazon RDS for MySQL makes it simple to set up, operate, and scale MySQL deployments in the cloud. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (AWS CLI).</p>"
  "9a0815a9a228cc0099d7a6c3319dfef4":
    "id": "9a0815a9a228cc0099d7a6c3319dfef4"
    "title": "Amazon RDS for PostgreSQL now supports PostgreSQL 19 Beta 4 in the Amazon RDS Database Preview Environment"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/postgresql-19-beta-4-amazon-rds-database-preview-environment/"
    "published": "2026-09-25 01:00:00"
    "fetched": "2026-09-25 05:15:26"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/postgresql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for PostgreSQL</a> 19 Beta 4 is available in the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/create-db-instance-in-preview-environment.html\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Database Preview Environment</a>, allowing you to evaluate the pre-release of PostgreSQL 19 on Amazon RDS for PostgreSQL.</p>\n<p>PostgreSQL 19 Beta 4 refines the query performance and autovacuum management capabilities introduced in earlier releases and includes bug fixes and stability improvements since Beta 3. Fixes include pg_stat_autovacuum_scores view reporting for TOAST tables and corrected freeze-score scaling so you can tune autovaccum prioritization effectively. Parallel autovacuum now shares a rebalanced cost limit across its workers to keep maintenance on large tables within your configured limits. Refer to the <a href=\"https://www.postgresql.org/about/news/postgresql-19-beta-4-released-3386/\" rel=\"noopener noreferrer\" target=\"_blank\">PostgreSQL community announcement</a> for more details.</p>\n<p>Amazon RDS Database Preview Environment database instances are retained for a maximum period of 60 days and are automatically deleted after the retention period. Amazon RDS database snapshots that are created in the Preview Environment can only be used to create or restore database instances within the Preview Environment. You can use the PostgreSQL dump and load functionality to import or export your databases from the Preview Environment. Amazon RDS Database Preview Environment database instances are priced as per the <a href=\"https://aws.amazon.com/rds/postgresql/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">pricing</a> in the US East (Ohio) Region.</p>"
  "ac648553b248121c3594ba112a7643bb":
    "id": "ac648553b248121c3594ba112a7643bb"
    "title": "Amazon RDS for PostgreSQL now supports post-quantum TLS key exchange"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/postgresql-post-quantum-tls-key-exchange/"
    "published": "2026-09-25 01:00:00"
    "fetched": "2026-09-25 05:15:26"
    "summary": "<p>Starting today, <a href=\"https://aws.amazon.com/rds/postgresql/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS for PostgreSQL</a> introduces support for post-quantum TLS (PQ-TLS) key exchange, providing you with post-quantum cryptography options for encrypting your data in-transit.</p>\n<p>RDS for PostgreSQL versions 18 and higher support modification of the ssl_groups parameter. You can <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.SSL.html#PostgreSQL.Concepts.General.SSL.Groups\" rel=\"noopener noreferrer\" target=\"_blank\">select cryptographic groups</a> from the RDS for PostgreSQL allow list to align with your organization's security standards.</p>\n<p>Amazon RDS for PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments in the cloud. Create or update a fully managed Amazon RDS database in the <a href=\"https://console.aws.amazon.com/rds/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon RDS Management Console</a> or by using the AWS Command Line Interface (AWS CLI).</p>"
  "c2e0cd02e54e4faaf27398838a0375dc":
    "id": "c2e0cd02e54e4faaf27398838a0375dc"
    "title": "Amazon EventBridge relaunches event buses for enterprise scale"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/eventbridge-relaunches-custom-event-buses/"
    "published": "2026-09-25 06:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Amazon EventBridge relaunches event buses with a new enhanced Custom event bus that lets you build event-driven applications that decouple teams and can scale with your organization. Create a custom event bus, share it across accounts, and now teams can publish and consume events with strict ordering, open event formats, built-in retention, and support for advanced event transformations.</p>\n<p>The EventBridge Custom event bus is a serverless event broker that enables you to create scalable event-driven applications by routing events between your applications, SaaS integrations, and AWS services. It can now be shared with one or more accounts through AWS Resource Access Manager allowing publishers to send events directly to the central event bus. With a new event publishing API, you can now publish events in popular JSON based event formats like CloudEvents and preserve their schema without modification. Custom event buses include 24 hours of built-in retention that can be extended for up to one year allowing you to recover from application errors or hydrate new components from historical data. A new Subscriber resource allows you to filter events and deliver them to over 250 AWS services. Now with native support for strictly ordered use cases, customers can ensure events are processed in the exact order they were received and new event evaluations allow automatic content based deduplication.</p>\n<p>To get started, you can create and share the new Custom event bus using the AWS Management Console, AWS CLI, AWS SDKs, Serverless Agent skill, and AWS CloudFormation. To help you separate the existing Custom event bus experience from the new enhanced Custom event bus, we have renamed the existing bus to Custom event bus - classic. All existing APIs remain unchanged.</p>\n<p>The enhanced Custom event bus is available at launch in fourteen AWS Regions: United States (N. Virginia, Ohio, Oregon), Europe (Ireland, Frankfurt, Stockholm, Spain), and Asia Pacific (Tokyo, Singapore, Sydney, Malaysia, Thailand, Mumbai, Hong Kong). We have introduced a new pricing model that charges for data transferred rather than events, and rewards you with lower costs as your workloads scale. To learn more, visit <a href=\"https://aws.amazon.com/eventbridge\">Amazon EventBridge</a>.&nbsp;</p>\n<p>To learn more, see the <a href=\"http://aws.amazon.com/blogs/aws/introducing-enhanced-custom-event-buses-in-amazon-eventbridge-for-enterprise-scale-event-driven-applications\">AWS News blog</a>, the <a href=\"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html\">EventBridge user guide</a>, and the <a href=\"https://aws.amazon.com/eventbridge/\">EventBridge product page</a>, or download the <a href=\"https://github.com/aws/agent-toolkit-for-aws/tree/main/skills/core-skills/aws-serverless\">agent skills</a>.</p>"
  "42830df165b285e4f34f07f524240288":
    "id": "42830df165b285e4f34f07f524240288"
    "title": "AWS Network Security Manager is now generally available in US East (N. Virginia) Region"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/network-security-manager-us-east-va/"
    "published": "2026-09-25 00:00:00"
    "fetched": "2026-09-25 08:44:37"
    "summary": "<p>Today, AWS announces the general availability of AWS Network Security Manager, a comprehensive network security management solution designed to simplify security policy deployment and enforcement at scale. Network Security Manager supports AWS WAF and AWS Shield Advanced, with support for AWS Network Firewall soon to follow. AWS Network Security Manager enables security teams to consistently enforce firewall and DDoS protection configurations across their entire AWS organization.</p>\n<p>Network Security Manager features always-on security deployment automation that applies AWS WAD and AWS Sheild Advanced security protection to Internet facing assets like AWS Application Load Balancer and Amazon CloudFront. This automated approach helps security teams deploy and manage WAF rules and Shield Advanced protections efficiently, ensuring consistent security posture across targeted accounts and resources. Teams can centrally manage security policies, automatically detect configuration drift, and apply remediation reducing the operational overhead of manual security management while maintaining comprehensive protection.</p>\n<p>AWS Network Security Manager is generally available in US East (N. Virginia). For pricing information, visit the <a href=\"https://aws.amazon.com/network-security-manager/pricing/\">AWS Network Security Manager Pricing page</a>.</p>"
  "6c49a7b0e8631e670b6b157e1724b754":
    "id": "6c49a7b0e8631e670b6b157e1724b754"
    "title": "AWS Billing and Cost Management now provides billing context for your account through a new API"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-billing-and-cost-management-billing-context-api/"
    "published": "2026-09-25 09:58:00"
    "fetched": "2026-09-25 18:19:51"
    "summary": "<p>AWS Billing and Cost Management now offers the ListBillingViewSegments API, which returns the billing context of your account over a time period you specify.</p>\n<p>You can use the API to retrieve information about how your accounts are positioned in the billing hierarchy, such as management accounts, member accounts, or billing group primary accounts. You can also identify which accounts managed your billing relationship and the rate settings, either billable or pro forma, applied to your cost data. The API returns billing context only, not cost and usage data. You can call the API directly or through an AI agent.</p>\n<p>Your billing context can change mid-period. The API therefore divides the requested period into time segments, each with its effective date range. For example, an account starts as its own payer, then moves under another organization as a member account, and in a later month has its new payer manage its billing through AWS Billing Conductor. A request covering all three periods returns three segments, each identifying the accounts and billing settings that were in effect.</p>\n<p>ListBillingViewSegments is available in all commercial AWS Regions at no additional charge and supports primary billing views. To get started, visit the <a href=\"https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_billing_ListBillingViewSegments.html\">AWS Billing API Reference</a>.</p>"
"last_updated": "2026-09-25 18:19:51 JST"
