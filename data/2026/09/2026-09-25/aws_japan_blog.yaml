    "title": "AWS for SAP MCP Server で実現する SAP へのシングルサインオン・エージェントアクセス"
    "link": "https://aws.amazon.com/jp/blogs/news/achieving-single-sign-on-agentic-access-to-sap-with-aws-for-sap-mcp-server/"
    "published": "2026-09-25 13:36:12"
    "fetched": "2026-09-25 18:19:52"
    "summary": "AI エージェントに SAP へのアクセスを与えつつ、ユーザーごとのセキュリティを維持する方法を解説します。Amazon Bedrock AgentCore を基盤とする AWS for SAP MCP Server と Microsoft Entra ID の On-Behalf-Of（OBO）トークン交換により、Amazon Quick からの各ユーザーの ID を SAP まで伝播させ、共有サービスアカウントに頼らずに認証・認可・監査を実現します。Entra ID アプリ登録、CloudFormation デプロイ、SAP OIDC トラスト設定までのエンドツーエンド手順を紹介します。"
"last_updated": "2026-09-25 18:19:52 JST"
