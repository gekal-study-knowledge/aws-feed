"overview": |
  この日は 19 件で、セキュリティ速報 1 件と、データベース周りの更新、そしてエージェント活用の事例が中心でした。セキュリティ速報は CVE-2026-96883 で、Important (要対応) です。PostgreSQL の OSS 拡張である pgcollection の型変換ロジックの問題で、保存されている icollection の値を実際の保存形式と互換性のない型として要求すると、拡張がデータの表現を誤って解釈し、認証済みのデータベースユーザーが PostgreSQL のバックエンドをクラッシュさせたり、任意のコードを実行できる可能性があります。影響を受けるのは pgcollection v2.0.0 から v2.1.1 です (Bulletin ID: 2026-118-AWS、2026 年 9 月 24 日 12:00 PDT 公開)。データベースの更新では、Amazon RDS for PostgreSQL が耐量子 TLS (PQ-TLS) の鍵交換に対応し、転送中のデータ暗号化に耐量子暗号の選択肢が加わりました。バージョン 18 以降で ssl_groups パラメーターを変更でき、RDS for PostgreSQL の許可リストから組織のセキュリティ基準に合う暗号グループを選べます。また、Amazon RDS Database Preview Environment で PostgreSQL 19 Beta 4 が利用可能になりました。Beta 3 以降のバグ修正と安定性の改善に加え、TOAST テーブルに対する pg_stat_autovacuum_scores ビューのレポート修正、freeze スコアのスケーリング修正による autovacuum の優先度調整、並列 autovacuum がワーカー間でコスト上限を再配分して大きなテーブルのメンテナンスを設定値の範囲に収める改善が入っています (プレビュー環境のインスタンスは最長 60 日で自動削除されます)。Amazon RDS for MySQL では、Extended Support のマイナーバージョン 5.7.44-rds.20260902 と 8.0.46-rds.20260908 が公開されました。Extended Support はメジャーバージョンの標準サポート終了後も最大 3 年間、重要な CVE とバグの修正を提供するもので、Blue/Green Deployments、インプレースアップグレード、スナップショットからの復元でアップグレードできます。サーバーレスでは、AWS Lambda の durable functions が AWS European Sovereign Cloud リージョンでも利用可能になりました。イベントハンドラーに step や wait といったプリミティブを加えて進捗をチェックポイントし、障害から自動復旧し、オンデマンド関数では課金なしで実行を一時停止できるもので、注文ワークフローやユーザーオンボーディング、AI を使った処理をコンプライアンス要件を満たしながら組み立てられます (Python 3.13 / 3.14、Node.js 22 / 24、Java 17 以降が対象)。機械学習ブログでは、Aderant が Amazon Bedrock 経由の Amazon Nova Lite でチケットの自動トリアージを構築し、クラウド運用チーム向けに文脈収集・分類・振り分け・ナレッジ拡充を自動化した事例、各チームのデータをそれぞれの AWS アカウントに置いたまま、中央のプラットフォームアカウントで Amazon Bedrock AgentCore Gateway と MCP を使ってエージェントが横断的に問い合わせるマルチアカウント構成 (各事業部門のアカウントは自分のデータを MCP サーバーとして公開し、安全なクロスアカウントアクセスと細かい認可を効かせる)、Whisper・wav2vec2 による強制アライメント・話者ダイアライゼーションをまとめた AWS WhisperX Deep Learning Container を Amazon SageMaker AI のリアルタイム / 非同期エンドポイントに展開し、単語単位で話者ラベル付きの文字起こしを行う方法 (GPU AMI のピン留め、スケーリング、コスト管理といった本番運用の勘所つき) が公開されました。イベント駆動では、Amazon EventBridge がエンタープライズ規模に向けて event bus を刷新しました。新しい拡張版のカスタムイベントバスは、組織内の全 AWS アカウントで 1 つのイベントバスを共有でき、AWS Resource Access Manager を通じて他アカウントに共有すると、パブリッシャーが中央のイベントバスへ直接イベントを送れます。厳密な順序保証、新しい発行 API による一般的な JSON ベースのイベント形式のサポート、組み込みの保持機能、高度なイベント変換、簡素化された Subscriber リソースを備え、規模が大きくなるほど経済性も改善します。ネットワークセキュリティでは、AWS Network Security Manager が米国東部 (バージニア北部) リージョンで一般提供となりました。AWS WAF と AWS Shield Advanced に対応し (AWS Network Firewall も近日対応予定)、組織全体でファイアウォールと DDoS 防御の設定を一貫して適用できます。Application Load Balancer や Amazon CloudFront といったインターネットに面したリソースに対して、常時有効なデプロイ自動化で保護を適用します。このほか、AWS Billing and Cost Management に ListBillingViewSegments API が追加され、指定した期間について自分のアカウントの請求上の位置付け (管理アカウント、メンバーアカウント、請求グループのプライマリアカウントなど) や、請求関係を管理していたアカウント、適用されていたレート設定 (billable か pro forma か) を取得できるようになりました。期間中に請求のコンテキストが変わる場合に備えて、期間は有効な日付範囲を持つセグメントに分割されて返ります (コストと使用量のデータそのものは返しません)。AWS Elastic Disaster Recovery は AWS Graviton (arm64) ベースのソースサーバーに対応し、arm64 のソースサーバーを自動検出して Graviton インスタンスへリカバリすることで、ワークロードのアーキテクチャを保ったまま x86 と同じ手順で保護できます (追加費用なし、DRS が提供される全リージョン)。AWS End User Messaging は WhatsApp 上での音声通話に対応し、メッセージングで使っているのと同じ認証済みのビジネス ID のまま、チャットから音声通話へ文脈を失わずに移行できるようになりました (顧客からの発信と、許諾済みの顧客への発信の双方向に対応)。日本語ブログでは、Amazon CloudWatch Omni の紹介記事が 2 本 (アプリケーション向けのコラボレーション型 AI を活用したオブザーバビリティと、生成 AI およびエージェント型ワークロード向けのオブザーバビリティ) 公開されました。あわせて、株式会社クリエイティブ・ウェブによる Amazon Connect Customer を活用した AI ロールプレイ研修システムの高速構築事例、株式会社 PLAY が AWS DevOps Agent で全社共通のインシデント対応基盤を築いた事例、そして AWS for SAP MCP Server で SAP へのシングルサインオンとエージェントアクセスを実現する解説 (Amazon Bedrock AgentCore を基盤に、Microsoft Entra ID の On-Behalf-Of トークン交換で Amazon Quick からユーザーごとの ID を SAP まで伝播させ、共有サービスアカウントに頼らず認証・認可・監査を成立させる。Entra ID のアプリ登録から CloudFormation でのデプロイ、SAP の OIDC トラスト設定までの手順つき) が届いています。
