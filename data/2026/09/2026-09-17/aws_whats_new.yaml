"entries":
  "a7bf07f7bb2ce7edf718a7313b84b3dc":
    "id": "a7bf07f7bb2ce7edf718a7313b84b3dc"
    "title": "AWS Elemental MediaTailor Monetization Functions adds ad response hooks"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-elemental-mediatailor-functions-ad-response-hooks"
    "published": "2026-09-17 01:30:00"
    "fetched": "2026-09-17 02:55:43"
    "summary": "<p>AWS Elemental MediaTailor now supports two additional lifecycle hooks for monetization functions: post ad decision server (ADS) response, and pre manifest insertion. MediaTailor is a video service that personalizes and inserts ads into live and on-demand streams. Monetization functions run customer-defined logic at defined points in an ad-personalized playback session, removing the need for a middleware tier between MediaTailor and the ADS.</p> \n<p>The post ADS response hook runs after MediaTailor parses an ADS response and resolves all Video Ad Serving Template (VAST) wrappers, before ads are selected and transcoded. Customers use it to call a secondary ad source when the primary ADS returns less demand than the ad break can hold, remove ads that their content or brand policies do not permit, and add house ads or promotions from their own marketing systems. The pre manifest insertion hook runs at the last point before MediaTailor returns the ad pod to the viewer, and receives every newly personalized ad break in a single invocation. Customers use it as a final check on what is about to play, including inserting a personalized slate when a break cannot be filled any other way. Pre-built recipes in the MediaTailor console give customers a starting point for each of these use cases. Both hooks are fail-open: on a timeout, expression error, or resource limit, MediaTailor discards the function output and continues with default ad insertion, so viewer playback is unaffected.</p> \n<p>The new hooks are available in all AWS Regions where AWS Elemental MediaTailor is available. To learn more, see <a href=\"https://docs.aws.amazon.com/mediatailor/latest/ug/monetization-functions.html\" target=\"_blank\">Monetization Functions</a> in the AWS Elemental MediaTailor User Guide and the <a href=\"https://aws.amazon.com/mediatailor/pricing/\" target=\"_blank\">MediaTailor pricing page</a>. To get started, sign in to the <a href=\"https://console.aws.amazon.com/mediatailor/\" target=\"_blank\">AWS Elemental MediaTailor console</a>.</p>"
  "780a44a2d68b5f59476fea58fa0406dc":
    "id": "780a44a2d68b5f59476fea58fa0406dc"
    "title": "AWS Client VPN is now supporting MacOS 27 Golden Gate"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-client-vpn-macos-golden-gate/"
    "published": "2026-09-17 02:56:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p>AWS Client VPN now supports MacOS 27 Golden Gate client with versions 6.0+ You can now run the AWS supplied VPN client on the latest MacOS versions. AWS Client VPN desktop clients are available free of charge, and can be downloaded <a href=\"https://aws.amazon.com/vpn/client-vpn-download/\">here</a>.<br /> <br /> AWS Client VPN is a managed service that securely connects your remote workforce to AWS or on-premises networks. It supports desktop clients for MacOS, Windows x64, Windows Arm64 and Ubuntu-Linux. With client version 6.0 onwards, Client VPN now supports the latest MacOS&nbsp; Golden Gate 27.0. It already supports Mac OS version 13.0, 14.0, 15.0, and 26.0, Windows 10 (x64) and Windows 11 (Arm64 and x64), and Ubuntu Linux 22.04 and 24.04 LTS versions.<br /> To learn more about Client VPN:</p> \n<ul> \n <li>Visit the AWS Client VPN <a href=\"https://aws.amazon.com/vpn/\">product page</a></li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html\">documentation</a></li> \n <li>Read the AWS Client VPN <a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-user/client-vpn-user-what-is.html\">user guide</a></li> \n</ul>"
  "35139990b43676172e5f393684ec42fc":
    "id": "35139990b43676172e5f393684ec42fc"
    "title": "New AWS experience helps builders get started and ship faster"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/New-AWS-Builder-Experience"
    "published": "2026-09-17 02:45:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p>Builders can now sign up for a new simplified experience that makes it faster to turn ideas into running code on AWS. AWS services provide an array of configuration options so that the largest enterprises can customize settings for their distinct needs. Until now, builders with a new project idea had to decide among these options and configure their AWS environment before beginning to build. The new experience reduces setup effort by simplifying sign-up and automatically configuring an initial project with sensible defaults so builders can begin implementing their idea immediately.</p> \n<p>When you sign up, you can use your existing Google, GitHub, Apple, or Amazon credentials. For most new customers, no credit card is required and you will receive up to $200 in free credits as part of the <a href=\"https://aws.amazon.com/free/\">AWS Free Tier</a>. Once signup is complete, you can connect your coding agent to AWS with a single prompt that automatically installs the AWS CLI and the <a href=\"https://aws.amazon.com/products/developer-tools/agent-toolkit-for-aws/\">Agent Toolkit for AWS</a>. Your coding agent connects to your project and uses built-in guidance to deploy resources using best practices.</p> \n<p>As your project expands, you can invite team members to collaborate with you by email. When a team member accepts your invitation, their project access is configured automatically. Similarly, many of the AWS resources you create can access resources in other AWS services automatically because the new <a href=\"https://aws.amazon.com/blogs/security/how-aws-iam-role-manager-rethinks-the-starting-point-for-iam-roles/\">IAM role manager</a> capability is enabled for your projects. When you're ready to upgrade to a paid plan, you can set a monthly spend limit for your project based on your usage patterns so that you stay within your budget. If a project's usage reaches its spend limit, your project is paused for that month. You can create additional projects with one click, each with its own spend limit and distinct team members. At any time, you can activate advanced features without migration or downtime, enabling you to use additional features such as multiple AWS Regions and custom governance controls.</p> \n<p>To try the new experience, <a href=\"https://signin.aws.amazon.com/signup?request_type=builderId\">create a new AWS account</a>. To learn more, see&nbsp;<a href=\"http://aws.amazon.com/blogs/aws/aws-reimagines-the-getting-started-experience\">AWS reimagines the getting started experience</a> on the AWS News Blog.</p>"
  "e8d774bd8939073066043ba69b1bd9f9":
    "id": "e8d774bd8939073066043ba69b1bd9f9"
    "title": "Amazon WorkSpaces adds support for NVIDIA Blackwell GPU instances"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-workspaces-nvidia-blackwell-gpu-instances/"
    "published": "2026-09-17 02:00:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p>Amazon WorkSpaces Personal and Amazon WorkSpaces Core now support Graphics G7 bundles, built on NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs and Intel Xeon 6 processors. Graphics G7 delivers up to 2.1x better performance for graphics-intensive workloads compared to previous generation Graphics G6 bundles. Four bundle sizes are available, ranging from 8 vCPUs, 32 GB of memory, and one GPU up to 48 vCPUs, 192 GB of memory, and two GPUs.</p> \n<p>With Graphics G7, you can run demanding professional applications such as CAD/CAM, 3D rendering, scientific visualization, video editing, and AI-assisted design workflows at higher fidelity and frame rates. Each GPU provides 32 GB of GDDR7 memory, enabling larger and more complex 3D scenes and models. Graphics G7 bundles are available with Windows, including bring-your-own-license, and support both AlwaysOn and AutoStop running modes.</p> \n<p>Graphics G7 bundles are available for both WorkSpaces Personal and WorkSpaces Core in US East (N. Virginia), US East (Ohio), and US West (Oregon). Additional Regions will be added as availability expands.</p> \n<p>To get started, select a Graphics G7 bundle when creating a workspace in the <a href=\"https://aws.amazon.com/console/\">Amazon WorkSpaces console</a>, or through your Workspaces Core partner solution. For more information on available instance types, see <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/bundle-options.html\">WorkSpaces</a><a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/bundle-options.html\"> Personal Instance </a><a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/bundle-options.html\">Families</a>. To learn more about G7 GPU capabilities, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/g7/\">EC2 G7 Instance Types page</a>. For pricing details, see <a href=\"https://aws.amazon.com/workspaces/desktop-as-a-service/pricing/\">Amazon WorkSpaces Personal Pricing</a> or <a href=\"https://aws.amazon.com/workspaces/vdi-partners/pricing/\">Core Bundles Pricing</a>.</p>"
  "4608868fd58c044802111e1d8ade982f":
    "id": "4608868fd58c044802111e1d8ade982f"
    "title": "Amazon Connect Customer custom metrics now supports tag-based access control"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/connect-customer-custom-metrics-tag/"
    "published": "2026-09-17 02:00:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p>Amazon Connect Customer now supports tag-based access control for custom metrics, so you can govern which users and roles can view, create, or modify each custom metric.</p> \n<p>As more teams across your organization adopt custom metrics, they end up editing the same shared library. Without controls, one person can change a metric that other teams count on. The usual fix is to give only a handful of people permissions to custom metrics, but that shuts out every other team that wants to start using them. &nbsp;</p> \n<p>Now you can tag each metric, then use those tags to set access: a team gets full control of their own metrics, view-only access to another team’s, and no visibility into the metrics you restrict. Search follows the same access rules, so people only see the metrics they’re allowed to view or manage.</p>"
  "e288193532d66fb484d921ef26d31717":
    "id": "e288193532d66fb484d921ef26d31717"
    "title": "Amazon ECS extends Amazon S3 Files support to the Amazon EC2 compute type"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-s3-files-ec2/"
    "published": "2026-09-17 01:25:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now supports Amazon S3 Files for tasks running on the Amazon EC2 launch type, enabling customers to connect their containerized applications directly to data in Amazon S3 as a shared file system. With this launch, customers running ECS workloads on EC2 instances can work with their S3 data using standard file system semantics, so file-based applications, AI agents, and data processing workloads run on S3 data with no code changes and without duplicating or staging files first. S3 Files support was previously available for ECS tasks on AWS Fargate and ECS Managed Instances, and now extends to the EC2 launch type, giving customers consistent access to S3 Files across all three ECS launch types.<br /> <br /> Amazon S3 Files, built on Amazon EFS, delivers a shared file system that connects AWS compute resources directly with data in Amazon S3, providing full file system semantics and low-latency performance without data leaving S3. S3 Files works with new and existing data in S3 buckets, with no migration required. Customers can mount an Amazon S3 Files volume in their Amazon ECS tasks to read and write data in an S3 bucket using standard file system operations, with no application code changes and no need to copy or stage data.<br /> <br /> Amazon S3 Files support is available in all AWS commercial Regions and the AWS GovCloud (US) Regions. To learn more, refer our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/s3files-volumes.html\">documentation</a>.</p>"
  "d309d28d8558e1ace3cca8f2a457e33c":
    "id": "d309d28d8558e1ace3cca8f2a457e33c"
    "title": "Amazon Connect Customer now lets you create, manage, and search custom metrics through APIs"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/connect-customer-custom-metrics-apis/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 05:49:45"
    "summary": "<p>Amazon Connect Customer provides a library of standard metrics. Custom metrics let you go further; defining the measurements unique to your business. But managing them across various instances manually means definitions slowly drift until the numbers no longer align. A metric you can't trust is worse than no metric at all, because people still make decisions on it.</p> \n<p>Now you define a metric once and manage it programmatically through seven new API operations (CreateMetric, DeleteMetric, DescribeMetric, ListMetrics, SearchMetrics, UpdateMetricContent, and UpdateMetricMetadata) so your definitions stay consistent as you scale across queues, teams, and environments. For example, a customer experience leader noticing a drop in self-service completion rates can define a custom metric that tracks the percentage of interactions where customers abandon and request a live agent within 90 seconds. Using the API, an AI-powered operations assistant can automatically create the metric and publish it to a monitoring dashboard — no manual console work, no definition drift across environments.&nbsp;Every change is tracked in AWS CloudTrail, giving you a complete audit trail.</p>"
  "9b0782c72f33124af1092c08f63a8e9c":
    "id": "9b0782c72f33124af1092c08f63a8e9c"
    "title": "Amazon Connect Customer can now import evaluation form PDFs using AI"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-connect-customer-import-evaluation-form-PDF/"
    "published": "2026-09-17 02:00:00"
    "fetched": "2026-09-17 08:30:19"
    "summary": "<p>Amazon Connect Customer now lets managers import a PDF of an evaluation form from a third-party quality management application, and automatically recreates it in Connect using AI, making it easier to migrate an existing quality program into Connect. Instead of rebuilding an existing form question by question, you upload the PDF and choose the preferred scoring method, either percentage or points-based, and Connect Customer automatically extracts the sections, questions, answer options, and scoring into a draft evaluation form. You can also provide natural language instructions to import the form more accurately or to adjust it as it's created — for example, splitting a broad question into simpler ones — minimizing the manual edits needed before you activate the form.</p> \n<p>This feature is available in the following AWS Regions: US East (N. Virginia), US West (Oregon), Canada (Central), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Europe (Frankfurt). To learn more, please visit our&nbsp;<a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/create-evaluation-forms.html#import-form-pdf\">documentation</a>&nbsp;and our&nbsp;<a href=\"https://aws.amazon.com/products/connect/customer/conversational-analytics/\">webpage</a>. For information about Amazon Connect Customer pricing, please visit our&nbsp;<a href=\"https://aws.amazon.com/products/connect/customer/pricing/?trk=758059ab-77e5-44fc-8a4a-1be845ee42b9&amp;sc_channel=ps\">pricing</a>&nbsp;page.</p>"
  "350944b11681069f7f9a31f42e967ce5":
    "id": "350944b11681069f7f9a31f42e967ce5"
    "title": "Amazon Corretto 27 is now generally available"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-corretto-27-generally-available/"
    "published": "2026-09-17 09:00:31"
    "fetched": "2026-09-17 12:12:02"
    "summary": "<p>Amazon Corretto 27, a Feature Release (FR) version, is now available for download. <a href=\"https://aws.amazon.com/corretto/\">Amazon Corretto</a> is a no-cost, multi-platform, production-ready distribution of <a href=\"https://aws.amazon.com/blogs/opensource/amazon-corretto-no-cost-distribution-openjdk-long-term-support/\">OpenJDK</a>. You can download Corretto 27 for Linux, Windows, and macOS from our <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-27-ug/downloads-list.html\">downloads page</a>. Corretto 27 will be supported through April 2027. Noticeable features:&nbsp;</p> \n<ul> \n <li><b>G1 as the Default Garbage Collector in All Environments</b> - Makes G1 the default garbage collector across all environments, delivering more consistent performance and predictable pause times regardless of where your application runs (JEP 523)</li> \n <li><b>Post-Quantum Hybrid Key Exchange for TLS 1.3</b> - Adds protection against future quantum computing threats by combining classical and post-quantum key exchange algorithms in TLS 1.3 connections (JEP 527)</li> \n <li><b>Compact Object Headers by Default</b> - Reduces the memory footprint of Java objects by enabling smaller object headers by default, improving memory efficiency and cache utilization (JEP 534)</li> \n <li><b>JFR In-Process Data Redaction</b> - Allows sensitive data to be redacted from Java Flight Recorder recordings before they leave the JVM, helping protect confidential information during profiling and diagnostics (JEP 536)</li> \n <li><b>Enhanced Pattern Matching (continued preview)</b> - Extends support for primitive types in patterns, instanceof, and switch, letting developers write cleaner type and value checks including for types like int and boolean (JEP 532)</li> \n <li><b>Structured Concurrency (continued preview)</b> - Refines the API for structured concurrency, treating groups of related tasks running in different threads as single units of work, streamlining error handling and cancellation, improving reliability, and enhancing observability (JEP 533)</li> \n <li><b>Lazy Constants (continued preview)</b> - Provides an API to defer initialization of immutable data until it is actually needed, combining the performance benefits of final fields with the flexibility of lazy initialization (JEP 531)</li> \n <li><b>Vector API (continued incubator)</b> - Improves support for high-performance mathematical operations that can take advantage of modern CPU vector capabilities (JEP 537)</li> \n</ul> \n<p>A detailed description of these features can be found on the <a href=\"https://openjdk.org/projects/jdk/27/\">OpenJDK 27 Project page</a>. Amazon Corretto 27 is distributed by Amazon under an <a href=\"https://openjdk.org/legal/gplv2+ce.html\">open source license</a>.</p>"
  "0cfc21edc1faa56d3ec59b1dec554ce4":
    "id": "0cfc21edc1faa56d3ec59b1dec554ce4"
    "title": "Amazon SageMaker AI now supports serverless model customization for NVIDIA Nemotron 3.5 Lightning"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-sagemaker-ft-nemotron-3-5-lightning/"
    "published": "2026-09-17 07:29:00"
    "fetched": "2026-09-17 12:12:02"
    "summary": "<p>Amazon SageMaker AI now supports serverless model customization for the NVIDIA Nemotron 3.5 Lightning model using supervised fine-tuning (SFT), Direct Preference Optimization (DPO), and reinforcement fine-tuning (RFT). This is one of the latest open-weight models from NVIDIA and employs a hybrid Mixture-of-Experts architecture with 3B active parameters and 30B parameters in total. In addition to deploying this model on SageMaker AI, you can now adapt it to your specific domains and workflows.</p> \n<p>Model customization enables you to tailor foundation models with your proprietary data so a smaller, right-sized model can match frontier-model quality on your tasks, reducing cost and latency. You can use labeled data with SFT to improve accuracy on domain-specific tasks, preference data with DPO to align outputs with your organization's tone, or reward signals with RFT to enhance performance on new tasks. With serverless customization, SageMaker AI handles all infrastructure provisioning and training orchestration, so you can focus on your data and evaluation rather than cluster management, and only pay for what you use.</p> \n<p>Serverless model customization for NVIDIA Nemotron 3.5 Lightning on SageMaker AI is available in US East (N. Virginia), US West (Oregon), Asia Pacific (Tokyo), and Europe (Ireland). To get started, navigate to the Models page in Amazon SageMaker Studio to launch a customization job, or use the <a href=\"https://sagemaker.readthedocs.io/en/stable/model_customization/index.html\">SageMaker Python SDK</a>&nbsp;for programmatic access. To learn more, see the Amazon SageMaker AI <a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/customizing-models.html\">model customization documentation</a>.&nbsp;</p>"
  "fbb2a10ec019191fda92f67ab6236ab4":
    "id": "fbb2a10ec019191fda92f67ab6236ab4"
    "title": "Amazon ECS deployment observability for Amazon ECS Managed Daemons in AWS Management Console"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ecs-daemon-deployment-console/"
    "published": "2026-09-17 07:01:00"
    "fetched": "2026-09-18 03:46:03"
    "summary": "<p><a href=\"https://aws.amazon.com/ecs/\">Amazon Elastic Container Service</a> (Amazon ECS) now provides a consolidated deployment view for Amazon ECS Managed Daemons, giving you a single place to see how far a deployment has progressed, what is failing, and what could stop it. This helps you monitor Managed Daemon deployments at a glance and resolve issues faster, whether a rollout is in progress or you are reviewing what happened after it completed, eliminating the need to piece together deployment status from multiple sources.<br /> <br /> The deployment view presents a lifecycle timeline with timestamps at each step and the total deployment duration, including the rollback path if a deployment is interrupted. Progress bars for each capacity provider track instances completed, in progress, and remaining, as well as instances draining and being replaced when a capacity provider is removed. A monitoring panel shows deployment circuit breaker, deployment alarm, and container health check state, each with live Amazon CloudWatch alarm detail and whether it can stop the deployment. If a daemon task fails, the affected capacity provider shows the stop reason with links to the task, its logs, and the matching troubleshooting guide, including the failure that caused a rollback. The view also displays target and source revisions with instance counts, drain percentage, and bake time.<br /> <br /> This enhancement is available as a console-only view in all AWS Commercial Regions at no additional cost. To get started with Amazon ECS Managed Daemons, refer to our <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/managed-daemons.html\">documentation</a>.</p>"
  "5ab27f95494d9ec9d7f74b1028c3d6ac":
    "id": "5ab27f95494d9ec9d7f74b1028c3d6ac"
    "title": "AWS Elastic Beanstalk introduces Cluster Mode to run multiple applications on shared infrastructure"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/elastic-beanstalk-cluster-mode/"
    "published": "2026-09-17 17:00:00"
    "fetched": "2026-09-18 06:53:22"
    "summary": "<p>AWS Elastic Beanstalk introduces Cluster Mode, a new deployment mode that lets you run and manage multiple applications on shared infrastructure in your account. Provide your source code, a Dockerfile, or a container image in Amazon ECR, and Elastic Beanstalk handles containerization, provisioning, and ongoing operations through the console, CLI, and APIs you already use. A new Elastic Beanstalk GitHub Action deploys your application directly from your repository as part of your CI/CD pipeline.</p> \n<p>AWS Elastic Beanstalk deploys, scales, and manages your applications for their full lifecycle while handling the infrastructure, so you can focus on your code. It now offers two deployment modes. Standard Mode is the existing Elastic Beanstalk experience and continues to support all currently available platforms, including .NET, Node.js, and Python. Cluster Mode runs multiple applications on pooled infrastructure in your account, powered by Amazon EKS, instead of a dedicated environment per application. This can lower your per-application compute cost as your applications scale or your application count grows. Cluster Mode supports event-driven autoscaling, OpenTelemetry-based observability to Amazon CloudWatch and third-party providers, AWS Secrets Manager integration, and HTTPS by default via AWS Certificate Manager.</p> \n<p>To get started, create an environment in the Elastic Beanstalk console and select Cluster Mode. You can also deploy with the AWS CLI, the GitHub Action, or the agent skills.</p> \n<p>Cluster Mode is available in all commercial AWS Regions where Elastic Beanstalk is available. Elastic Beanstalk is HIPAA eligible and in scope for programs including PCI DSS, SOC, FedRAMP, and IRAP. There is no additional charge for Cluster Mode. You pay for the AWS resources your applications consume, including the EKS cluster and EKS Auto Mode charges for the infrastructure Elastic Beanstalk provisions on your behalf. See the Elastic Beanstalk and EKS pricing pages for details.</p> \n<p>To learn more, see the <a href=\"https://aws.amazon.com/blogs/aws/aws-elastic-beanstalk-introduces-cluster-mode/\">AWS News blog</a>, the <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/\">Elastic Beanstalk Developer Guide</a>, and the <a href=\"https://aws.amazon.com/elasticbeanstalk/\">Elastic Beanstalk product page</a>, or download the <a href=\"https://github.com/aws/agent-toolkit-for-aws/blob/main/skills/core-skills/aws-containers/SKILL.md\">agent skills</a>.</p>"
  "3ae698fe9c2d7e3a6b3e1046481c2815":
    "id": "3ae698fe9c2d7e3a6b3e1046481c2815"
    "title": "Amazon Keyspaces (for Apache Cassandra) is now generally available in 11 additional Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-keyspaces/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-18 06:53:22"
    "summary": "<p><a href=\"https://aws.amazon.com/keyspaces/\">Amazon Keyspaces (for Apache Cassandra)</a> is now generally available in 11 additional Regions,&nbsp;allowing customers in those Regions to build Cassandra-compatible applications with lower latency while keeping their data within the Region to meet data residency requirements..&nbsp;<br /> <br /> Amazon Keyspaces (for Apache Cassandra) is a scalable, highly available, and managed Apache Cassandra–compatible database service. Amazon Keyspaces is serverless, so you pay for only the resources that you use and you can build applications that serve thousands of requests per second with virtually unlimited throughput and storage.&nbsp;<br /> <br /> To find the list of new available Regions, see the following resources: <a href=\"https://builder.aws.com/build/capabilities\">AWS Capabilities by Region</a>.</p>"
  "51118fa7b8ddc3fce4d27a6c50665e77":
    "id": "51118fa7b8ddc3fce4d27a6c50665e77"
    "title": "AWS Builder Center now available as mobile app on iOS and Android"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-builder-center-now-available-as-mobile-app/"
    "published": "2026-09-17 16:09:00"
    "fetched": "2026-09-18 08:52:35"
    "summary": "<p>AWS Builder Center is a platform that brings together the global builder community, offering articles, workshops, sandbox environments, events, and learning resources in one place. Previously limited to desktop and web access, the experience is now available as a mobile app on iOS and Android. Builders worldwide can stay connected and engaged with the community from anywhere, using their AWS Builder ID to remain signed in across sessions.</p> \n<p>The AWS Builder Center mobile app enables builders to browse trending articles, access 600+ AWS Skill Builder courses, and manage hands-on workshops with free sandbox environments directly from their mobile devices. Builders can follow AWS Heroes, Community Builders, and User Group Leaders, check Builder Loft event calendars on the go, and receive push notifications for subscribed topics and communities. The app also supports the Wishlist feature, allowing builders to submit and manage product feedback directly to AWS teams.</p> \n<p>The AWS Builder Center mobile app is available worldwide on the Apple App Store and Google Play Store.</p> \n<p>To learn more about the AWS Builder Center mobile app, visit the <a href=\"https://builder.aws.com/mobile\">AWS Builder Center mobile page</a>.</p>"
  "13c2075440ab73e0e289e2b684516ec2":
    "id": "13c2075440ab73e0e289e2b684516ec2"
    "title": "Amazon Quick now generates individual sheets and builds analyses from an image"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/generate-sheet-and-generate-analysis-from-an-image/"
    "published": "2026-09-17 11:37:00"
    "fetched": "2026-09-18 08:52:35"
    "summary": "<p>Amazon Quick now expands Generate Analysis with two new ways to create dashboards faster. You can generate a single sheet inside an existing analysis by describing it in natural language, and you can generate a new analysis from an image of an existing dashboard.</p> \n<p>&nbsp;</p> \n<p>With Generate Sheet, you describe the sheet you want and Amazon Quick adds it to your current analysis with visuals selected for your data, filter controls, and calculated fields such as year-over-year growth and month-over-month comparisons. You can extend an analysis without building each visual by hand.</p> \n<p>&nbsp;</p> \n<p>With generate an analysis from an image, you attach an image of a dashboard, including dashboards from other BI tools, to your prompt when you generate an analysis. Amazon Quick recreates it as an editable analysis, building what is supported in Amazon Quick. Both capabilities work with existing publishing workflows, embedding, CI/CD pipelines, and point-and-click editing.</p> \n<p>&nbsp;</p> \n<p>At launch, Generate Sheet and generate analysis from an image are available to Enterprise subscription/Author Pro users. Authors also have promotional access to this capability through December 2026 as part of Amazon Quick Enterprise, provided their organization has not restricted access.</p> \n<p>&nbsp;</p> \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/quick/latest/userguide/generating-an-analysis.html\" title=\"Generating an analysis with natural language prompts in the Amazon Quick User Guide\">Generating an analysis with natural language prompts</a> in the Amazon Quick User Guide. To get started, open an analysis and choose Generate Sheet, or attach an image to your prompt and choose Generate analysis.</p>"
  "92ad08bda6f11e14e84cce010bfedf00":
    "id": "92ad08bda6f11e14e84cce010bfedf00"
    "title": "Amazon S3 Express One Zone is now available in 7 additional AWS Regions"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/s3-express-one-zone-7-regions/"
    "published": "2026-09-17 17:00:00"
    "fetched": "2026-09-18 11:58:49"
    "summary": "<p>The Amazon S3 Express One Zone storage class is now available in 7 additional AWS Regions: Asia Pacific (Singapore), South America (Sao Paulo), US West (N. California), Canada (Central), Europe (Paris), Asia Pacific (Sydney), and Asia Pacific (Seoul).</p> \n<p>Amazon S3 Express One Zone is a high-performance, single-Availability Zone storage class purpose-built to deliver consistent single-digit millisecond data access for your most frequently accessed data and latency-sensitive applications. S3 Express One Zone delivers data access speed up to 10x faster and request costs up to 80% lower than S3 Standard. It enables workloads such as machine learning training, interactive analytics, and key-value caching in AI search engines to achieve fast data access with high durability and availability.</p> \n<p>With this expansion, S3 Express One Zone is now available in 15 <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-Endpoints.html\">AWS Regions</a>. For pricing details, visit the <a href=\"https://aws.amazon.com/s3/pricing/\">S3 pricing page</a>. To learn more, visit the <a href=\"https://aws.amazon.com/s3/storage-classes/express-one-zone/\">product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-getting-started.html\">documentation</a>.</p>"
  "650fd77667fa8593f99f89a9c1f30139":
    "id": "650fd77667fa8593f99f89a9c1f30139"
    "title": "Amazon SES now supports tenant-level deliverability insights"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-ses-vdm-tenants/"
    "published": "2026-09-17 16:00:00"
    "fetched": "2026-09-19 02:26:27"
    "summary": "<p><a href=\"https://aws.amazon.com/ses/\">Amazon Simple Email Service (SES)</a> now supports tenant-level deliverability insights in Virtual Deliverability Manager (VDM). <a href=\"https://docs.aws.amazon.com/ses/latest/dg/tenants.html\">Tenant management</a> allows email senders to isolate email sending across customers, business units, or applications. Previously, VDM provided deliverability metrics at the account, ISP, sending identity, and configuration set levels. Now, customers who use tenants and have enabled VDM can also monitor the deliverability of each tenant.</p> \n<p>The VDM dashboard adds a Tenants view with per-tenant metrics (send volume, deliveries, bounces, complaints, opens, and clicks) and a detail page that breaks those metrics down by mailbox provider and by associated identities and configuration sets. Customers can also search and export a tenant's sent messages, or query tenant metrics programmatically using the BatchGetMetricData API operation's new TENANT_NAME dimension. This helps senders identify the tenant causing a deliverability issue and correct it without impact to their other tenants.</p> \n<p>Virtual Deliverability Manager is available in all AWS Regions where Amazon SES is available.</p> \n<p>To learn more, visit the <a href=\"https://console.aws.amazon.com/ses\">Amazon SES console</a> or refer to the Virtual Deliverability Manager dashboard documentation in the <a href=\"https://docs.aws.amazon.com/ses/latest/dg/vdm-dashboard.html\">Amazon SES Developer Guide</a>.</p>"
"last_updated": "2026-09-19 02:26:27 JST"
