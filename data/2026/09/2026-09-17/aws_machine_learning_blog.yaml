    "title": "Optimizing agent system prompts with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/optimizing-agent-system-prompts-with-amazon-bedrock-agentcore/"
    "published": "2026-09-17 00:47:39"
    "fetched": "2026-09-17 02:55:45"
    "summary": "AgentCore optimization turns production traces into proposed configuration changes, then validates them before promotion. This technical companion to the launch post explains how the system prompt optimizer's reflector engine works and shares benchmark results for the Single Agent and Sub-Agent Reflectors."
  "6267e41570154cb0b8309dea121a48cd":
    "id": "6267e41570154cb0b8309dea121a48cd"
    "title": "Build a serverless PII redaction pipeline with Amazon Bedrock Data Automation"
    "link": "https://aws.amazon.com/blogs/machine-learning/build-a-serverless-pii-redaction-pipeline-with-amazon-bedrock-data-automation/"
    "published": "2026-09-17 00:17:37"
    "fetched": "2026-09-17 02:55:45"
    "summary": "Learn how to automate end-to-end PII detection and redaction from scanned documents at scale using Amazon Bedrock Data Automation with a custom blueprint, AWS Step Functions, and AWS Lambda. A custom blueprint redacts sensitive fields with field-level precision, and a token matching quality check raises recall across degraded and handwritten documents."
  "76531f33263c2da70134b2b405be5eac":
    "id": "76531f33263c2da70134b2b405be5eac"
    "title": "Improving HCLS AI reasoning with open-source agent skills"
    "link": "https://aws.amazon.com/blogs/machine-learning/improving-hcls-ai-reasoning-with-open-source-agent-skills/"
    "published": "2026-09-17 04:00:00"
    "fetched": "2026-09-17 05:49:48"
    "summary": "AI agents on foundation models often misapply healthcare and life sciences decision frameworks, citing the right guideline but applying it incorrectly. This post shares 38 open-source agent skills across 11 HCLS domains that close this gap, with installation steps, three worked use cases, and a 410-prompt evaluation showing a 70-86% win rate."
  "6843cede97d8b88a6117a9f999639bb4":
    "id": "6843cede97d8b88a6117a9f999639bb4"
    "title": "Fault tolerant distributed training on Amazon EKS using NVRx"
    "link": "https://aws.amazon.com/blogs/machine-learning/fault-tolerant-distributed-training-on-amazon-eks-using-nvrx/"
    "published": "2026-09-17 03:59:25"
    "fetched": "2026-09-17 05:49:48"
    "summary": "Integrate NVIDIA Resiliency Extension (NVRx) into PyTorch FSDP training on Amazon EKS to overlap checkpoint I/O with training and recover from GPU faults in seconds. This post covers async checkpointing, in-process restart, and ft_launcher in-job restart, with H100 benchmarks at 2 to 8 nodes showing 99%+ training efficiency and second-scale recovery."
