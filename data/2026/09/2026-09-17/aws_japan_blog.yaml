    "title": "Kiro の GPT‑5.6 モデルが 100 万トークンのコンテキストウィンドウに対応"
    "link": "https://aws.amazon.com/jp/blogs/news/gpt-5-6-1m-context/"
    "published": "2026-09-17 09:19:33"
    "fetched": "2026-09-17 12:12:03"
    "summary": "Kiro の IDE、CLI、Web のすべてで、GPT‑5.6 Sol、Terra、Luna が 100 万トークンのコンテキストウィンドウに対応します。これにより、コードベース全体、長文ドキュメント、長く続いたマルチターンのエージェント履歴を、チャンク分割や要約を挟まず、細部を失わないまま 1 回のリクエストで処理できるようになります。"
"last_updated": "2026-09-17 12:12:03 JST"
