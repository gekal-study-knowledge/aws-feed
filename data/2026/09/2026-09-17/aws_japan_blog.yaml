  "faac6ee59570c3fcb39ac7d9c87e3335":
    "id": "faac6ee59570c3fcb39ac7d9c87e3335"
    "title": "Kiro Web の自律モードで技術的負債に大規模に立ち向かう"
    "link": "https://aws.amazon.com/jp/blogs/news/tackling-technical-debt-at-scale-with-autonomous-mode/"
    "published": "2026-09-17 09:32:52"
    "fetched": "2026-09-17 12:12:03"
    "summary": "技術的負債への従来のアプローチは、開発者の時間を保守に割り当てて機能提供を遅らせるか、負債が複利で膨らむのを放置するかの二択を強います。対話型の AI コーディングアシスタントは個々のタスクを速くしてくれますが、それでもすべてのステップで開発者がループの中にいる必要があります。私たちが欲しかったのは第三の選択肢、つまり issue を読むところからプルリクエストを開くところまで保守タスクを一気通貫で引き受け、エンジニアは判断が最も価値を持つコードレビューでだけ関わる、という形です。それが Web の Kiro の autonomy モードです。保守を含む幅広いタスクをこなせるエージェンティックなソフトウェアエンジニアリングツールで、エンジニアはより価値の高い仕事に集中できます。実際にどうなったかというと、2 か月のあいだに Kiro は私たちのリポジトリ群で 87 件のオープン issue に対応するプルリクエストを提出しました。これは、それまでの 22 か月（約 2 年）でチームが対応してきた量に迫る数です。本記事では、どのようにセットアップしたか、2 つのケーススタディの詳細、そして自分のリポジトリで Kiro を自律的に使う方法を紹介します"
  "1222c9b1eff90ff4778004497e6b867e":
    "id": "1222c9b1eff90ff4778004497e6b867e"
    "title": "Kiro の GPT‑5.6 モデルが 100 万トークンのコンテキストウィンドウに対応"
    "link": "https://aws.amazon.com/jp/blogs/news/gpt-5-6-1m-context/"
    "published": "2026-09-17 09:19:33"
    "fetched": "2026-09-17 12:12:03"
    "summary": "Kiro の IDE、CLI、Web のすべてで、GPT‑5.6 Sol、Terra、Luna が 100 万トークンのコンテキストウィンドウに対応します。これにより、コードベース全体、長文ドキュメント、長く続いたマルチターンのエージェント履歴を、チャンク分割や要約を挟まず、細部を失わないまま 1 回のリクエストで処理できるようになります。"
  "1911d52a49be2ede76c4483d0c79ba27":
    "id": "1911d52a49be2ede76c4483d0c79ba27"
    "title": "Verus で正しさが数学的に証明できる Rust コードの開発"
    "link": "https://aws.amazon.com/jp/blogs/news/developing-provably-correct-rust-code-with-verus/"
    "published": "2026-09-17 13:05:14"
    "fetched": "2026-09-17 18:08:38"
    "summary": "Rust の型システムは多くのバグを防ぎますが、コードが本当に正しいことまでは保証しません。そこで、Rust 向けのオープンソースの自動プログラム検証ツール Verus を紹介します。事前条件・事後条件による仕様記述の書き方、1 秒未満の高速なフィードバック、unsafe コードや並行コードの正しさの証明、そして Nitro Isolation Engine をはじめとする Amazon 社内やオープンソースでの活用事例まで説明します。"
  "ad47ef630641bcace6766c3a2e290311":
    "id": "ad47ef630641bcace6766c3a2e290311"
    "title": "【開催報告】ファッション・アパレル業界向け 第一回ナレッジ共有会 〜 SMART から始まる業界共通課題への挑戦と学びの場"
    "link": "https://aws.amazon.com/jp/blogs/news/fashion-apparel-ai-agent-knowledge-sharing-smart/"
    "published": "2026-09-17 12:44:12"
    "fetched": "2026-09-17 18:08:38"
    "summary": "店舗業務支援 AI エージェント SMART を起点に、ファッション・アパレル業界 6 社 20 名が集まった第一回ナレッジ共有会の開催報告です。週報作成 15 分が 0 分に、IT 未経験の店舗出身メンバーが 2 週間で Web アプリ開発、ベテランの経験に依存していた在庫消化業務のエージェント化——SMART の合同ブートキャンプから活動を始めた 3 社が、実際に手を動かし、現場との対話を重ねて得た実践ナレッジを発表しました。作って終わりにしない AI エージェント開発のヒントが詰まった当日の模様をレポートします。"
"last_updated": "2026-09-17 18:08:38 JST"
