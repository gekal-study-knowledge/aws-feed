  "dd727faa183c6775f157353e7da7ab98":
    "id": "dd727faa183c6775f157353e7da7ab98"
    "title": "How Tata Elxsi detects industrial safety risks in seconds on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-tata-elxsi-detects-industrial-safety-risks-in-seconds-on-aws/"
    "published": "2026-09-23 00:19:54"
    "fetched": "2026-09-23 00:23:24"
    "summary": "Learn how Tata Elxsi built IRIS, a real-time industrial safety platform on AWS. IRIS filters camera video at the edge, streams metadata through Amazon Kinesis, runs computer vision on Amazon SageMaker AI, and correlates detections into high-confidence alerts, detecting unsafe conditions in seconds instead of minutes."
  "2f7bd4310d68563648b8e5022a246dee":
    "id": "2f7bd4310d68563648b8e5022a246dee"
    "title": "Extending public sector intelligence with Agentforce and AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/extending-public-sector-intelligence-with-agentforce-and-aws/"
    "published": "2026-09-23 00:17:45"
    "fetched": "2026-09-23 00:23:24"
    "summary": "Public sector agencies process large volumes of unstructured evidence, such as body camera footage and scanned documents. This post shows how to combine Amazon Bedrock Data Automation with the Model Context Protocol (MCP) to turn that data into structured insights and surface them through natural language queries in Salesforce Agentforce."
  "9369e5993f410cf7a1caecfe3c4e9696":
    "id": "9369e5993f410cf7a1caecfe3c4e9696"
    "title": "Bring more intelligence to everyday work with GPT-6 Sol and GPT-6 Luna on Amazon Bedrock"
    "link": "https://aws.amazon.com/blogs/machine-learning/bring-more-intelligence-to-everyday-work-with-gpt-6-sol-and-gpt-6-luna-on-amazon-bedrock/"
    "published": "2026-09-23 03:10:22"
    "fetched": "2026-09-23 04:31:42"
    "summary": "GPT-6 Sol and GPT-6 Luna are now generally available on Amazon Bedrock, giving you more options to match intelligence and efficiency to each workload."
  "808eaf2f49d75b0a3aa371a8a534c005":
    "id": "808eaf2f49d75b0a3aa371a8a534c005"
    "title": "Claude Opus 5.5 is now available on AWS"
    "link": "https://aws.amazon.com/blogs/machine-learning/claude-opus-5-5-is-now-available-on-aws/"
    "published": "2026-09-23 02:28:01"
    "fetched": "2026-09-23 04:31:42"
    "summary": "Claude Opus 5.5, Anthropic's most capable Opus model for agentic coding, knowledge work, and long-running tasks, is now available on Amazon Bedrock and Claude Platform on AWS. This post covers what's new in Opus 5.5, practical guidance, and how to start building with the model on Amazon Bedrock."
  "b4cd9e7a765e1df1009961ac8efd6c2c":
    "id": "b4cd9e7a765e1df1009961ac8efd6c2c"
    "title": "Evaluate skill-equipped agents with Strands Evals and Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/evaluate-skill-equipped-agents-with-strands-evals-and-amazon-bedrock-agentcore/"
    "published": "2026-09-23 02:18:13"
    "fetched": "2026-09-23 04:31:42"
    "summary": "Skills let you encode domain-specific procedures as reusable, portable instructions for agents, but a fluent answer doesn't prove the agent picked the right skill or followed it. Learn how to measure skill selection and instruction following with Strands Evals and Amazon Bedrock AgentCore Evaluations."
  "5b19637cf1bd6b6c9cb977800d333ab6":
    "id": "5b19637cf1bd6b6c9cb977800d333ab6"
    "title": "How Reactiv automates mobile commerce 80% faster with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-reactiv-automates-mobile-commerce-80-faster-with-amazon-bedrock-agentcore/"
    "published": "2026-09-23 00:46:07"
    "fetched": "2026-09-23 04:31:42"
    "summary": "Reactiv used Amazon Bedrock AgentCore to build a multi-agent AI Scheduler that autonomously refreshes Shopify merchants' mobile apps on a schedule, reducing merchant configuration time by 80% and getting to production 33% faster."
  "79c1834f9766525be0a89718748540e7":
    "id": "79c1834f9766525be0a89718748540e7"
    "title": "Right-size generative AI endpoints with concurrency sweeps on Amazon SageMaker AI"
    "link": "https://aws.amazon.com/blogs/machine-learning/right-size-generative-ai-endpoints-with-concurrency-sweeps-on-amazon-sagemaker-ai/"
    "published": "2026-09-23 00:35:53"
    "fetched": "2026-09-23 04:31:42"
    "summary": "Concurrency sweeps help you right-size a generative AI endpoint on Amazon SageMaker AI by systematically benchmarking it at increasing load levels. This post walks through deploying a model, running automated concurrency sweeps with the CreateAIBenchmarkJob API, and using the results to make data-driven capacity decisions about fleet size."
  "9a77fc55d881172f46357dc11c72f913":
    "id": "9a77fc55d881172f46357dc11c72f913"
    "title": "How Trane gets building insights 60x faster with Amazon Bedrock AgentCore"
    "link": "https://aws.amazon.com/blogs/machine-learning/how-trane-gets-building-insights-60x-faster-with-amazon-bedrock-agentcore/"
    "published": "2026-09-23 00:30:34"
    "fetched": "2026-09-23 04:31:42"
    "summary": "In about four weeks, Trane Technologies built an AI-powered agentic solution on Amazon Bedrock AgentCore that reduced a 20-minute, multi-screen building diagnostic workflow to a 20-second natural language interaction, a 60x improvement in time-to-insight. This post shares the architectural approach and key design decisions behind the solution."
