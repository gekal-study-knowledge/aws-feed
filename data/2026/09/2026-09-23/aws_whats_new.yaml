  "a270a57cab4a6f56b894f8ac76a6d82d":
    "id": "a270a57cab4a6f56b894f8ac76a6d82d"
    "title": "OpenAI GPT-6 Sol and GPT-6 Luna are now generally available on Amazon Bedrock"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-sol-luna-on-amazon-bedrock/"
    "published": "2026-09-23 03:09:00"
    "fetched": "2026-09-23 04:31:40"
    "summary": "<p>Today, AWS announces the general availability of GPT-6 Sol and GPT-6 Luna from OpenAI on Amazon Bedrock. Expanding the GPT-6 family alongside Astra, these two models give teams more ways to balance intelligence, speed, and cost across every workload. Sol is the daily model for recurring complex tasks and software development. On an internal OpenAI factuality evaluation, it makes roughly half as many mistakes as GPT-5.6 Sol. Luna is the family's most efficient model for focused, high-volume tasks such as summarization, extraction, classification, and routing. Both models support up to 1M tokens of context. The Amazon Bedrock inference engine delivers the performance, security, and scale required for production workloads.</p>\n<p>GPT-6 Sol can implement features, debug issues, review and refactor code, analyze data, and complete multistep workflows across tools. Improvements in coding and computer use help it carry tasks from investigation through validation. GPT-6 Luna handles high-volume workloads like extraction, summarization, classification, and routing, with adjustable reasoning effort to balance quality, speed, and cost per request. Established AWS controls help you secure workloads, govern access, and audit model invocation activity.</p>\n<p>You can get started with GPT-6 Sol and GPT-6 Luna in the<a href=\"https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/\"> Amazon Bedrock console</a> or programmatically through supported Amazon Bedrock APIs. For information about supported<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html\"> AWS Regions</a>, endpoints, APIs, features, inference profiles and pricing, see the<a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-cards-openai.html\"> Amazon Bedrock documentation</a>. To learn more,<a href=\"https://aws.amazon.com/blogs/machine-learning/bring-more-intelligence-to-everyday-work-with-gpt-6-sol-and-gpt-6-luna-on-amazon-bedrock/\"> read the blog.</a></p>"
  "0568a0f5f538d6ddeb5f1e014c8283c8":
    "id": "0568a0f5f538d6ddeb5f1e014c8283c8"
    "title": "Claude Opus 5.5 is now available on AWS GovCloud (US)"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-opus-5-5-aws-govcloud/"
    "published": "2026-09-23 00:00:00"
    "fetched": "2026-09-23 04:31:40"
    "summary": "<p>AWS GovCloud (US) now offers Claude Opus 5.5, Anthropic’s most capable Opus model yet and, the first of the Claude 5.5 model family, a better collaborator that handles long-running coding and knowledge work, reporting back clearly on what it did, what it found, and what it needs next.</p>\n<p>According to Anthropic, Claude Opus 5.5 completes tasks using fewer tokens than Claude Opus 5, at a lower price per token, with cheaper cache reads stacking on top of the efficiency gain. Claude Opus 5.5 is the enterprise workhorse, a clear step up from Opus 5 on the work teams count on Opus to do. It handles long-running coding and knowledge work, and reports back like a good teammate, surfacing what it did, what it found, and what it needs from you. It thinks adaptively on every request, deciding how much effort each task needs.&nbsp;&nbsp;</p>\n<p>Amazon Bedrock gives you Opus 5.5’s advanced capabilities with zero data retention (ZDR) support by default. It keeps your data within AWS infrastructure with regional data residency and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html?refid=7ecf60df-6136-414c-a7c3-6aa4d2d6019f#model-regions-anthropic\">regional availability.</a></p>"
  "d6992af4499f96c79e80579a7311b5af":
    "id": "d6992af4499f96c79e80579a7311b5af"
    "title": "Claude Opus 5.5 is now available on AWS"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-opus-5-5-aws/"
    "published": "2026-09-23 00:00:00"
    "fetched": "2026-09-23 04:31:40"
    "summary": "<p>AWS now offers Claude Opus 5.5, Anthropic’s most capable Opus model yet and, the first of the Claude 5.5 model family, a better collaborator that handles long-running coding and knowledge work, reporting back clearly on what it did, what it found, and what it needs next.</p>\n<p>According to Anthropic, Claude Opus 5.5 completes tasks using fewer tokens than Claude Opus 5, at a lower price per token, with cheaper cache reads stacking on top of the efficiency gain. Claude Opus 5.5 is the enterprise workhorse, a clear step up from Opus 5 on the work teams count on Opus to do. It handles long-running coding and knowledge work, and reports back like a good teammate, surfacing what it did, what it found, and what it needs from you. It thinks adaptively on every request, deciding how much effort each task needs.</p>\n<p>Customers have two ways to access Claude Opus 5.5: Amazon Bedrock and Claude Platform on AWS: Amazon Bedrock gives you Opus 5.5’s advanced capabilities with zero data retention (ZDR) support by default. It keeps your data within AWS infrastructure with regional data residency and provides access through a unified service with AWS-managed features like Guardrails and Knowledge Bases. To learn more, see the Amazon Bedrock <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a> and <a href=\"https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html?refid=7ecf60df-6136-414c-a7c3-6aa4d2d6019f#model-regions-anthropic\" rel=\"noopener noreferrer\" target=\"_blank\">regional availability.</a></p>\n<p>Claude Platform on AWS gives you direct access to Anthropic's native platform experience and capabilities via the AWS Console. Build, test, and deploy with the same APIs, features, and console experience you'd get working with Anthropic directly, unified with AWS billing and authentication. To get started, see the Claude Platform on AWS <a href=\"https://docs.aws.amazon.com/claude-platform/latest/userguide/setup.html?refid=7ecf60df-6136-414c-a7c3-6aa4d2d6019f\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>.</p>"
  "8ec388d77fe680432f0875c420f32c5d":
    "id": "8ec388d77fe680432f0875c420f32c5d"
    "title": "Billing Transfer now supports automatic billing group creation for two-level transfers"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-billing-transfer-supports-automatic-billing-group-creation/"
    "published": "2026-09-23 05:08:00"
    "fetched": "2026-09-23 07:41:24"
    "summary": "<p>AWS Billing Transfer users can now enable the Auto-Billing Transfer Billing Group Creation, a new AWS Billing Conductor preference that eliminates the manual billing group configuration in two-level billing transfer arrangements. Designed for AWS Distributors managing billing for downstream seller Partners and their end customers, this feature automatically creates billing groups when an end customer accepts a billing transfer from a downstream seller Partner, ensuring pro forma cost data is immediately available to the Partner, with no extra manual configuration.</p>\n<p>Auto-Billing Transfer Billing Group Creation is a one-time preference configuration per inbound transfer relationship, enabling you to request the creation of a billing group for any new indirect transfer coming through your Partners' account, as well as being able to specify an AWS Billing Conductor pricing plan for the billing groups created automatically.&nbsp;</p>\n<p>The preference is accessible through two new API operations and through the AWS Management Console in the Billing Transfer details page.&nbsp;</p>\n<p>To learn more about Auto-Billing Transfer Billing Group Creation and how to configure your billing transfer preferences, visit the <a href=\"https://docs.aws.amazon.com/billingconductor/latest/userguide/create-billing-group.html\">AWS Billing Conductor documentation</a>.</p>"
  "87d14129c765e79fab7d538b38e8bb44":
    "id": "87d14129c765e79fab7d538b38e8bb44"
    "title": "Amazon CloudWatch Omni: AI-first observability for agents and applications"
    "link": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-cloudwatch-omni-ai/"
    "published": "2026-09-23 09:06:00"
    "fetched": "2026-09-23 10:12:22"
    "summary": "<p>AWS announces the general availability of Amazon CloudWatch Omni, an evolution of Amazon CloudWatch. Omni is an AI-powered observability experience organized around your teams and the applications they run, so that you can observe and troubleshoot your applications and agents in one place. It combines the interoperability of OpenTelemetry with the scale and reliability of CloudWatch. And it meets you wherever you work: a standalone web experience with single sign-on (SSO) for your team, or a local IDE extension for getting hands-on with your agents.</p>\n<p>With CloudWatch Omni, you create spaces in your central accounts to see telemetry across your AWS accounts and Regions, as well as other clouds, including Azure workloads. Omni automatically discovers services, maps dependencies, and surfaces golden metrics to help streamline your operational workflows. Using Omni, you can interact with telemetry however you prefer: via chat, through a guided point-and-click path in the console, or directly from a tool of your choice leveraging Agent Toolkit for AWS. Ask a question in natural language and Omni finds the relevant telemetry, builds dynamic views of the signals you care about, and helps you get to root cause powered by AWS DevOps Agent. Prefer to drive yourself? Point and click through the signals that matter most, whether you're investigating a degrading application or diving deep into a trace or evaluation.</p>\n<p>Omni also features a dedicated agent observability experience with an evaluation-driven development workflow for AI workloads across frameworks including LangGraph, CrewAI, OpenAI Agents SDK, Vercel AI SDK, and Strands. For every prompt, model call, and tool invocation, Omni helps you evaluate quality and run experiments to validate fixes before you ship.</p>\n<p>To get started, create your Omni space from the CloudWatch console, configure SSO, and sign in to the standalone web experience. Agent developers can install the free <a href=\"https://marketplace.visualstudio.com/items?itemName=AmazonWebServices.amazon-cloudwatch-omni\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Omni extension</a> for VS Code, Cursor, and Kiro to instrument, debug, and evaluate agents locally (no AWS account required). CloudWatch Omni is generally available in US East (N. Virginia), US West (Oregon) and Europe (Ireland). To learn more, see the <a href=\"https://aws.amazon.com/cloudwatch/omni/\" rel=\"noopener noreferrer\" target=\"_blank\">Amazon CloudWatch Omni product page</a> and <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-omni.html\" rel=\"noopener noreferrer\" target=\"_blank\">documentation</a>. For pricing, see the <a href=\"https://aws.amazon.com/cloudwatch/omni/pricing/\" rel=\"noopener noreferrer\" target=\"_blank\">CloudWatch Omni pricing page</a>.</p>"
"last_updated": "2026-09-23 10:12:22 JST"
