    "title": "CVE-2026-94384 - Missing Authorization in AmazonConnectSalesforceLambda sfExecuteAWSService"
    "link": "https://aws.amazon.com/security/security-bulletins/rss/2026-115-aws/"
    "published": "2026-09-23 02:10:17"
    "fetched": "2026-09-23 04:31:41"
    "summary": "<p><b>Bulletin ID:</b> 2026-115-AWS\n <br />\n <b>Scope:</b> AWS\n <br />\n <b>Content Type:</b> Important (requires attention)\n <br />\n <b>Publication Date:</b> 09/22/2026 10:00 AM PDT</p>\n<p><b>Description:</b></p>\n<p>Amazon Connect Salesforce Lambda (AmazonConnectSalesforceLambda) is a Serverless Application Repository application that provides Lambda functions for integrating Amazon Connect with Salesforce. We identified CVE-2026-94384, a missing authorization issue in the sfExecuteAWSService Lambda function, which is used only during initial setup. The function dispatches caller-supplied parameters to privileged AWS service APIs without validating the caller's authorization. As a result, an IAM principal with lambda:InvokeFunction permission on the function can perform AWS operations that their own IAM permissions would otherwise deny.</p>\n<p><b>Impacted versions:</b> &gt;= 5.15 AND &lt;= 5.24.16</p>\n<p><b>Please refer to the article below for the most up-to-date and complete information related to this AWS Security Bulletin.</b></p>"
"last_updated": "2026-09-23 04:31:41 JST"
