"overview": |
  この日は 17 件で、新しいモデルの追加と、生成 AI 向けの可観測性、そして AgentCore の事例が中心でした。Anthropic の Claude Opus 5.5 が Amazon Bedrock と AWS 上の Claude Platform で利用可能になり、エージェント型のコーディング・ナレッジワーク・長時間タスク向けの最も高性能な Opus モデルとして、AWS GovCloud (米国) でも同時に提供が始まりました。OpenAI の GPT-6 Sol と GPT-6 Luna も Amazon Bedrock で一般提供となり、既存の Astra とあわせて GPT-6 ファミリーが広がって、ワークロードごとに知能と効率を選べるようになっています。ニュースブログでは Amazon CloudWatch Omni が発表されました。生成 AI とエージェント型ワークロード向けに作られた AI 駆動の可観測性で、任意の環境の AI エージェントをトレース・評価・実験でき、アプリケーションと AI エージェントを自動検出とともに 1 つの体験へまとめる CloudWatch の次の形と位置づけられています。機械学習ブログでは、約 4 週間で構築した Trane Technologies のエージェント型ソリューションが 20 分かかっていた複数画面のビル診断を 20 秒に短縮した事例 (60 倍)、Reactiv が AgentCore のマルチエージェント AI スケジューラーで Shopify 加盟店のモバイルアプリ更新を自律化し設定作業を 80% 速くした事例、Tata Elxsi がエッジで映像を絞り込み Kinesis 経由でメタデータを流すリアルタイム産業安全プラットフォーム IRIS、Bedrock Data Automation と Agentforce を組み合わせてボディカメラ映像やスキャン文書といった非構造化証拠を扱う公共部門向けの構成が紹介されました。あわせて、負荷を段階的に上げて計測する並行実行スイープで SageMaker AI の生成 AI エンドポイントを適正サイズにする方法と、スキルを備えたエージェントが正しいスキルを選び手順どおりに従ったかを Strands Evals と AgentCore で評価する方法も解説されています。コンピュートブログでは、Application Load Balancer を使って AWS Lambda MicroVMs に独自ドメインを割り当て、アプリケーションを変更せずにブラウザークライアントの CORS も満たす方法が公開されました。サービス更新では、AWS Billing Transfer が 2 階層の移管において請求グループを自動作成できるようになっています。セキュリティ速報では、Amazon Connect Salesforce Lambda の sfExecuteAWSService における認可の欠落 (CVE-2026-94384)、および Retry パケットを送信する設定時の s2n-quic におけるサービス拒否の可能性 (CVE-2026-94450) が、いずれも Important として公開されました。
