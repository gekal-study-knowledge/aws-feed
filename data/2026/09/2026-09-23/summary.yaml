"overview": |
  この日は 20 件で、主要モデルの AWS 上での提供開始と、CloudWatch の刷新、そしてエージェント活用の事例が中心でした。Anthropic の Claude Opus 5.5 が Amazon Bedrock と AWS 上の Claude Platform で利用可能になりました。Claude 5.5 ファミリーの最初のモデルで、エージェント的なコーディング・ナレッジワーク・長時間動作するタスクに向けた最も高性能な Opus と位置づけられ、AWS GovCloud (US) でも提供されます。OpenAI の GPT-6 Sol と GPT-6 Luna も Amazon Bedrock で一般提供となり、既存の Astra とあわせて GPT-6 ファミリーが広がり、ワークロードごとに知能と効率のバランスを選べるようになりました。可観測性では、Amazon CloudWatch Omni が一般提供となりました。CloudWatch の次の進化形として、アプリケーションと AI エージェントを 1 つの体験に統合し、自動検出されたトポロジーと自然言語での操作、チームとアプリケーション単位で整理された AI 主導の可観測性を提供します。生成 AI・エージェントワークロード向けには、フレームワークを問わずエージェントのトレース・評価・実験を行えます。機械学習ブログでは、Trane Technologies が Amazon Bedrock AgentCore 上で約 4 週間で構築したエージェントにより、20 分かかっていた複数画面にまたがる建物診断のワークフローを 20 秒の自然言語操作に短縮した事例 (60 倍の高速化)、Reactiv が AgentCore でマルチエージェントの AI スケジューラーを構築し Shopify マーチャントのモバイルアプリ更新を自動化して設定時間を 80% 削減した事例、Tata Elxsi がエッジでカメラ映像を絞り込み Amazon Kinesis でメタデータを流して SageMaker でコンピュータービジョンを動かすリアルタイム産業安全プラットフォーム IRIS の事例が公開されました。あわせて、Amazon Bedrock Data Automation と Model Context Protocol を組み合わせ、ボディカメラ映像やスキャン文書といった非構造化データを扱う公共部門向けの Agentforce 連携、スキルを備えたエージェントを Strands Evals と AgentCore で評価し「正しいスキルを選び手順に従ったか」を測る方法、SageMaker AI で負荷を段階的に上げる並行実行スイープによって生成 AI エンドポイントを適正サイズに調整する手法も解説されています。コンピュートブログでは、Application Load Balancer を使って AWS Lambda MicroVMs に独自ドメインを割り当て、アプリケーションを変更せずにブラウザークライアント向けの CORS も満たす構成が紹介されました。セキュリティ速報は 2 件で、いずれも Important (要対応) です。CVE-2026-94384 は Amazon Connect Salesforce Lambda (AmazonConnectSalesforceLambda) の sfExecuteAWSService における認可の欠落 (Bulletin ID: 2026-115-AWS、2026 年 9 月 22 日 10:00 PDT 公開)、CVE-2026-94450 は QUIC プロトコルの Rust 実装である s2n-quic で Retry パケットを送信する設定にしている場合のサービス拒否の可能性 (Bulletin ID: 2026-116-AWS、2026 年 9 月 22 日 13:00 PDT 公開) です。課金では、AWS Billing Transfer が 2 階層の移管で請求グループを自動作成する AWS Billing Conductor の設定に対応し、手作業の請求グループ構成が不要になりました。セキュリティブログでは、オーストラリア信号局 (ASD) が今月打ち出した多要素認証の呼びかけ 「Multi-factor authentication: Switch it on」を受けて、MFA がこれまで以上に重要である理由が解説されました。データベースでは、Amazon DynamoDB global tables のマルチリージョン強整合性 (MRSC) が、カナダ (中部)、ヨーロッパ (ストックホルム)、ヨーロッパ (スペイン)、アジアパシフィック (ムンバイ)、アジアパシフィック (シンガポール) の 5 リージョンに追加で対応し、対応リージョンは合計 15 になりました。15 リージョンのうち任意の 3 リージョン構成 (3 レプリカ、または 2 レプリカと 1 つの witness リージョン) で MRSC グローバルテーブルを作成でき、北米・ヨーロッパ・アジアパシフィックをまたぐ大陸間の構成も組めます。MRSC は RPO ゼロのマルチリージョンアプリケーションを実現するもので、利用者に近いリージョンにレプリカを置くことで、近くのエンドポイントで強整合な読み取りを行いながら、リージョン障害時も可用性を保てます。
