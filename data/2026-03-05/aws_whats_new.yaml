  210bef963a885016fefe0ecf0066c01c:
    id: 210bef963a885016fefe0ecf0066c01c
    title: Accelerate Lambda durable functions development with new Kiro power
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/lambda-durable-kiro-power/
    published: '2026-03-05'
    summary: "<p>Today, AWS announces the Lambda durable functions Kiro power, bringing\
      \ Lambda durable function development expertise to agentic AI development in\
      \ Kiro. With this power, you can build resilient, long-running multi-step applications\
      \ and AI workflows faster with AI agent-assisted development directly in your\
      \ local development environment.</p> \n<p>When you work with durable functions,\
      \ the AI agent dynamically loads relevant guidance and development expertise.\
      \ This includes replay model best practices, step and wait operations, concurrent\
      \ execution with map and parallel patterns, error handling with retry strategies\
      \ and compensating transactions, testing patterns, and deployment with AWS CloudFormation,\
      \ AWS Cloud Development Kit (AWS CDK), and AWS Serverless Application Model\
      \ (AWS SAM). With this guidance, you can go from idea to a working durable function\
      \ quickly, whether you are building order processing pipelines, AI agent orchestration\
      \ with human-in-the-loop approvals, or payment coordination workflows.</p> \n\
      <p>The Lambda durable functions power is available today with one-click installation\
      \ from the <a href=\"https://kiro.dev/launch/powers/aws-lambda-durable-functions/\"\
      \ target=\"_blank\">Kiro IDE</a> and the <a href=\"https://kiro.dev/powers/\"\
      \ target=\"_blank\">Kiro powers page</a>. Explore the <a href=\"https://github.com/aws/aws-durable-execution-docs/tree/main/aws-lambda-durable-functions-power\"\
      \ target=\"_blank\">power on GitHub</a>. To get started with Lambda durable\
      \ functions, see the <a href=\"https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html\"\
      \ target=\"_blank\">developer guide</a>.</p>"
  e7f55c4f5fdce1ee9bae268f458995d7:
    id: e7f55c4f5fdce1ee9bae268f458995d7
    title: Amazon OpenSearch Service introduces capacity optimized blue/green deployments
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-service-bg/
    published: '2026-03-05'
    summary: <p><a href="https://aws.amazon.com/opensearch-service/">Amazon OpenSearch
      Service</a> now offers a Capacity Optimized option for blue/green deployments,
      ensuring domain updates can complete even when available instance capacity is
      less than required. Updates are performed in incremental batches, reducing the
      number of additional instances needed during the process.<br /> <br /> Amazon
      OpenSearch Service uses a blue/green deployment process when updating domains
      — creating an idle copy of the original environment, applying updates, and routing
      traffic to the new environment once complete. This minimizes downtime and preserves
      the original environment as a fallback. Until now, blue/green deployments required
      100% instance capacity upfront. For example, for a cluster with 100 data nodes,
      another 100 nodes were needed to proceed. If sufficient capacity was unavailable,
      customers had to wait and retry later.<br /> <br /> Now, customers can choose
      between two deployment strategies. The default Full Swap option maintains current
      behavior, requiring full capacity upfront for the fastest deployment. The new
      Capacity Optimized option attempts a full capacity deployment first, but automatically
      falls back to batch deployment if capacity is insufficient. OpenSearch Service
      determines the appropriate batch size based on cluster size and available instances.
      Because updates are applied in batches, this option may take longer than a full-swap
      deployment. Customers can select their preferred option in the deployment configuration
      settings via the OpenSearch Service console or API. We recommend choosing the
      Capacity Optimized deployment option for clusters with 30 or more nodes.<br
      /> <br /> The Capacity Optimized option is available for all OpenSearch and
      Elasticsearch versions, across all AWS Commercial Regions where OpenSearch Service
      is available. See <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">here</a>
      for a full listing of our Regions. To learn more, visit the <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/managedomains-configuration-changes.html">documentation
      page</a>.</p>
  b585c63b6c611e79f8aef0d196138219:
    id: b585c63b6c611e79f8aef0d196138219
    title: Introducing Amazon Connect Health, Agentic AI Built for Healthcare
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-health-agentic-ai-healthcare/
    published: '2026-03-05'
    summary: "<p>Amazon Connect Health is now generally available, bringing purpose-built\
      \ agentic AI to healthcare organizations to streamline patient engagement and\
      \ point-of-care workflows. Amazon Connect Health delivers five AI agents designed\
      \ to reduce administrative burden across the care continuum — enabling patients\
      \ faster access to care and freeing clinicians from paperwork and administrative\
      \ burden to focus on what matters most: their patients. These agents are ready\
      \ to deploy within existing patient, clinician, and healthcare workflows — such\
      \ as patient access centers (i.e., contact centers), Electronic Health Records\
      \ (EHR) applications, and telehealth solutions — in days, not months. All the\
      \ features follow responsible AI best practices, implement safety guardrails,\
      \ are HIPAA-eligible, and deliver the same security and reliability standards\
      \ as any AWS service.</p> \n<p>Agents available at launch:</p> \n<ul> \n <li><p>Patient\
      \ verification (GA) – Confirms patient identity in real time against EHR records\
      \ with appointment lookup, reducing inbound call-handling time.</p> </li> \n\
      </ul> \n<ul> \n <li><p>Appointment management (Preview) – Books appointments\
      \ via natural language voice interaction, 24/7, with real-time insurance eligibility\
      \ checks, enabling after-hours scheduling, and relieving burden on human staff.&nbsp;</p>\
      \ </li> \n</ul> \n<ul> \n <li><p>Patient insights (Preview) – Surfaces relevant\
      \ patient history and clinical context before the visit, so clinicians walk\
      \ in prepared. Reduces the time clinicians spend piecing together information\
      \ before a patient’s visit.</p> </li> \n</ul> \n<ul> \n <li><p>Ambient documentation\
      \ (GA) – Captures patient-clinician conversations during the visit and generates\
      \ clinical notes in real time.</p> </li> \n</ul> \n<ul> \n <li><p>Medical coding\
      \ (Preview) – Automatically generates ICD-10 and CPT codes from clinical notes\
      \ post-visit, with full audit trails.</p> </li> \n</ul> \n<p>Amazon Connect\
      \ Health patient engagement capabilities are natively integrated with <a href=\"\
      https://aws.amazon.com/connect/\">Amazon Connect</a>, a complete AI-powered\
      \ contact center solution delivering personalized customer experiences at scale.\
      \ Clinical and administrative staff can configure and customize these AI capabilities\
      \ in minutes using the Amazon Connect Health application, enabling rapid testing\
      \ and seamless deployment into contact center workflows. The point-of-care capabilities\
      \ — ambient listening, patient insight, and medical coding — are available via\
      \ Amazon Connect Health unified SDK (SDK documentation), enabling developers\
      \ to integrate the features directly into existing EHR and clinician-facing\
      \ applications.&nbsp;</p> \n<p>&nbsp;</p> \n<p>Amazon Connect Health is available\
      \ in US East (N. Virginia) and US West (Oregon). To get started, visit the <a\
      \ href=\"https://aws.amazon.com/health/connect-health/\">Amazon Connect Health\
      \ product page</a>. For technical details, see the <a href=\"https://aws.amazon.com/health/connect-health/\"\
      >Amazon Connect Health documentation</a></p>"
  fe7372f841fa0e1c2483569a0562b639:
    id: fe7372f841fa0e1c2483569a0562b639
    title: AWS HealthLake announces data transformation agent for automated CCDA-to-FHIR
      data conversion (Preview)
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-healthlake-data-transformation-agent/
    published: '2026-03-05'
    summary: <p>Starting today, healthcare organizations can now transform legacy
      clinical documents into queryable FHIR resources in AWS HealthLake in days instead
      of months, unlocking use cases such as longitudinal patient record generation,
      population health analytics, and clinical data exchange. AWS HealthLake data
      transformation agent (preview) is an AI-powered capability that converts Consolidated
      Clinical Document Architecture (CCDA) files into Fast Health Interoperability
      Resources Release 4 (FHIR R4)-compliant resources without requiring specialized
      FHIR expertise, through an integrated experience that combines real-time conversion
      testing, AI-assisted template customization, and scalable bulk import.<br />
      <br /> The data transformation agent includes ready-to-use templates for CCDA
      2.1 to FHIR R4 data conversion. Developers can submit individual CCDA files
      through a synchronous conversion API or console workflow and receive transformed
      FHIR Bundles in seconds. They can preview results, interactively validate conversion
      quality, and sign off on templates before production use. An enhanced import
      workflow automatically detects uploaded CCDA files, applies the active template,
      matches and reconciles patients based on identifiers, and ingests the resulting
      FHIR resources into the target AWS HealthLake datastore with detailed logs.
      All capabilities are available both on the AWS console and programmatically
      via API for seamless integration into existing workflows.<br /> <br /> When
      default templates need adjustment, the data transformation agent offers an AI-powered
      experience to customize them directly in the console. Users can describe changes
      such as "skip medications with status entered-in-error" or "map procedure dates
      to performedDateTime instead of performedPeriod" in natural language, and the
      AI agent modifies the underlying template automatically. Manual curation is
      also available for power users who wish to make targeted template edits. Users
      can then immediately test against sample files, iterate conversationally, and
      publish once satisfied.<br /> <br /> AWS HealthLake is available in the US East
      (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), Europe
      West (London), Europe (Ireland), and Asia Pacific SouthEast (Sydney) Regions.
      Visit the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region Table</a> to see all the regions.<br /> <br /> To learn more, see the
      <a href="https://aws.amazon.com/healthlake/">AWS HealthLake product page</a>.</p>
