  51c25007ae464e4f943f5e3a21e4275f:
    id: 51c25007ae464e4f943f5e3a21e4275f
    title: Amazon WorkSpaces Secure Browser now supports custom domain
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-workspaces-secure-browser-custom-domains/
    published: '2026-02-06'
    summary: <p>Amazon WorkSpaces Secure Browser now supports custom domains for your
      WorkSpaces Secure Browser portals, enabling you to configure portal access through
      your own domain name instead of the default portal URL. This feature provides
      users with a more integrated experience using a domain that aligns with your
      organization's branding for each secure browser session.<br /> <br /> As an
      administrator you simply add the custom domain in the WorkSpaces Secure browser
      portal and set up a reverse proxy (for example Amazon CloudFront). Once set
      up, traffic is routed through your reverse proxy to the portal endpoint, and
      WorkSpaces Secure Browser automatically redirects users to the configured custom
      domain after authentication and authorization. Authentication can be via AWS
      Identity Center or your own Identity Provider (IdP), supporting both IdP-initiated
      and service provider-initiated flows.<br /> <br /> This feature is available
      at no additional cost in 10 AWS Regions, including US East (N. Virginia), US
      West (Oregon), Canada (Central), Europe (Frankfurt, London, Ireland), and Asia
      Pacific (Tokyo, Mumbai, Sydney, Singapore). WorkSpaces Secure Browser offers
      pay-as-you go <a href="https://aws.amazon.com/workspaces/secure-browser/pricing/"
      target="_blank">pricing</a>.<br /> <br /> To get started, visit the Amazon WorkSpaces
      Secure Browser console to configure your custom domain for your WorkSpaces Secure
      Browser portal. For more information, see the custom domain section in the Amazon
      WorkSpaces Secure Browser’s<a href="https://docs.aws.amazon.com/workspaces-web/latest/adminguide/custom-domains.html"
      target="_blank"> documentation.</a></p>
  8b142d9ccdb4b9b2f21c5c7af8c3334b:
    id: 8b142d9ccdb4b9b2f21c5c7af8c3334b
    title: Amazon Connect Cases now supports CSV uploads to map related field options
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-connect-cases-csv-related-field-options
    published: '2026-02-06'
    summary: '<p>Amazon Connect Cases now supports using a CSV file to define which
      field options appear based on other field values, making it easier to configure
      complex field relationships on case templates. Instead of manually defining
      valid options — such as applicable defect types based on product category —
      admins can upload a file to define these relationships at scale, reducing onboarding
      effort and configuration time.<br /> <br /> Amazon Connect Cases is available
      in the following AWS regions: US East (N. Virginia), US West (Oregon), Canada
      (Central), Europe (Frankfurt), Europe (London), Asia Pacific (Seoul), Asia Pacific
      (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), and Africa (Cape Town)
      AWS regions. To learn more and get started, visit the Amazon Connect Cases <a
      href="https://aws.amazon.com/connect/cases/" target="_blank">webpage</a> and
      <a href="https://docs.aws.amazon.com/connect/latest/adminguide/case-field-dependent-csv-upload.html"
      target="_blank">documentation</a>.</p>'
  5ae76961424c0e3f272e0d43a249a440:
    id: 5ae76961424c0e3f272e0d43a249a440
    title: AWS Network Firewall announces new price reductions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-network-firewall-new-price-reduction/
    published: '2026-02-06'
    summary: "<p><a href=\"https://aws.amazon.com/network-firewall/\">AWS Network\
      \ Firewall</a> has introduced two pricing improvements for customers. The service\
      \ has added the hourly and data processing discounts on NAT Gateways that are\
      \ service-chained with Network Firewall secondary endpoints. Additionally, AWS\
      \ Network Firewall has removed additional data processing charges for Advanced\
      \ Inspection, which enables Transport Layer Security (TLS) inspection of encrypted\
      \ network traffic.</p> \n<p>Previously, NAT Gateway discounts were limited to\
      \ primary Network Firewall endpoints, and customers paid additional data processing\
      \ charges when using Advanced Inspection for TLS inspection in select AWS regions.\
      \ With these improvements, the NAT Gateway discounts now apply when service-chained\
      \ with both primary and secondary firewall endpoints. Customers also no longer\
      \ pay the additional data processing charge for Advanced Inspection that ranged\
      \ from $0.001/GB to $0.009/GB in 13 AWS regions: Middle East (Bahrain), Asia\
      \ Pacific (Hong Kong), Asia Pacific (Tokyo), Asia Pacific (Osaka), Asia Pacific\
      \ (Mumbai), EU (Milan), South America (São Paulo), US West (N. California),\
      \ Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore), Asia Pacific\
      \ (Sydney), and Asia Pacific (Melbourne).</p> \n<p>These changes help to reduce\
      \ costs for architectures that use Network Firewall's multiple VPC endpoint\
      \ capability and TLS inspection features. Multiple VPC endpoints allow you to\
      \ connect 50 VPCs per Availability Zone to a single Network Firewall, helping\
      \ to reduce operational complexity and lower costs as you protect more VPCs.\
      \ By removing additional data processing charges when using Advanced Inspection,\
      \ customers can now implement TLS inspection more cost-effectively across their\
      \ network security architecture.</p> \n<p>These pricing improvements are available\
      \ in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      >AWS regions</a> where Network Firewall is offered and are applied automatically\
      \ to eligible configurations. No action is required from customers.</p> \n<p>To\
      \ learn more, see AWS Network Firewall <a href=\"https://aws.amazon.com/network-firewall/pricing/\"\
      >pricing</a> and the AWS Network Firewall service <a href=\"https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-creating.html\"\
      >documentation</a>.</p>"
  749d2592551a6419f33939f20db36c8e:
    id: 749d2592551a6419f33939f20db36c8e
    title: Amazon ECS Managed Instances now available in AWS European Sovereign Cloud
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/ecs-mi-european-sovereign-cloud
    published: '2026-02-06'
    summary: <p>Amazon Elastic Container Service (Amazon ECS) Managed Instances is
      now available in the AWS European Sovereign Cloud. ECS Managed Instances is
      a fully managed compute option designed to eliminate infrastructure management
      overhead while giving you access to the full capabilities of Amazon EC2. By
      offloading infrastructure operations to AWS, you get the application performance
      you want and the simplicity you need while reducing your total cost of ownership.<br
      /> <br /> Managed Instances dynamically scales EC2 instances to match your workload
      requirements and continuously optimizes task placement to reduce infrastructure
      costs. It also enhances your security posture through regular security patching
      initiated every 14 days. You can simply define your task requirements such as
      the number of vCPUs, memory size, and CPU architecture, and Amazon ECS automatically
      provisions, configures and operates most optimal EC2 instances within your AWS
      account using AWS-controlled access. You can also specify desired instance types
      in Managed Instances Capacity Provider configuration, including GPU-accelerated,
      network-optimized, and burstable performance, to run your workloads on the instance
      families you prefer.<br /> <br /> To get started with ECS Managed Instances,
      use the AWS Console, Amazon ECS MCP Server, or your favorite infrastructure-as-code
      tooling to enable it in a new or existing Amazon ECS cluster. You will be charged
      for the management of compute provisioned, in addition to your regular Amazon
      EC2 costs. To learn more about ECS Managed Instances, visit the <a href="https://aws.eu/ecs/managed-instances/">feature
      page</a>, <a href="https://docs.aws.eu/AmazonECS/latest/developerguide/ManagedInstances.html">documentation</a>,
      and <a href="https://aws.amazon.com/blogs/aws/announcing-amazon-ecs-managed-instances-for-containerized-applications">AWS
      News launch blog</a>.</p>
  107ea7d8eceece4a2043de4ce515ac81:
    id: 107ea7d8eceece4a2043de4ce515ac81
    title: Amazon Bedrock AgentCore Browser now supports browser profiles
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-bedrock-agentcore-browser-profiles
    published: '2026-02-06'
    summary: "<p>Amazon Bedrock AgentCore Browser now supports browser profiles, enabling\
      \ you to reuse authentication state across multiple browser sessions without\
      \ repeated login flows. This feature reduces session setup time from minutes\
      \ to tens of seconds for enterprise customers processing hundreds or thousands\
      \ of automated browser sessions daily.</p> \n<p>Browser profiles persist and\
      \ reuse browser data including cookies and local storage across multiple sessions.\
      \ You authenticate to a website once and save the session to a browser profile.\
      \ When you start a new session using that saved profile, your authentication\
      \ state is preserved, and you remain logged in. This enables agents to perform\
      \ tasks on authenticated websites without manual login intervention. You can\
      \ choose flexible session modes for both read-only and persistent operations,\
      \ enabling parallel processing where multiple sessions use the same profile\
      \ simultaneously.</p> \n<p>This feature is available in all 14 <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\"\
      >AWS Regions</a> where Amazon Bedrock AgentCore Browser is available: US East\
      \ (N. Virginia), US East (Ohio), US West (Oregon), Asia Pacific (Mumbai), Asia\
      \ Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt),\
      \ Europe (Ireland), Europe (London), Europe (Paris), Europe (Stockholm), Asia\
      \ Pacific (Seoul), and Canada (Central).</p> \n<p>To learn more, visit the <a\
      \ href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/browser-profiles.html\"\
      >Browser Profiles documentation</a>.&nbsp;</p>"
  b38d6823eb6d2e4940fea79ca0a6b5b4:
    id: b38d6823eb6d2e4940fea79ca0a6b5b4
    title: AWS Config now supports 30 new resource types
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-config-new-resource-types
    published: '2026-02-06'
    summary: "<p>AWS Config now supports 30 additional AWS resource types across key\
      \ services including Amazon EKS, Amazon Q, and AWS IoT. This expansion provides\
      \ greater coverage over your AWS environment, enabling you to more effectively\
      \ discover, assess, audit, and remediate an even broader range of resources.<br\
      \ /> <br /> With this launch, if you have enabled recording for all resource\
      \ types, then AWS Config will automatically track these new additions. The newly\
      \ supported resource types are also available in Config rules and Config aggregators.<br\
      \ /> <br /> You can now use AWS Config to monitor the following newly supported\
      \ resource types in all <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/what-is-resource-config-coverage.html\"\
      \ target=\"_blank\">AWS Regions</a> where the supported resources are available:<br\
      \ /> <br /> Resource Types:<br /> </p> \n<table> \n <tbody>\n  <tr>\n   <td>AWS::ApplicationSignals::ServiceLevelObjective</td>\
      \ \n   <td>AWS::IoT::SoftwarePackage</td> \n  </tr>\n  <tr>\n   <td>AWS::ARCZonalShift::AutoshiftObserverNotificationStatus&nbsp;\
      \ &nbsp; &nbsp;</td> \n   <td>AWS::IoT::TopicRule</td> \n  </tr>\n  <tr>\n \
      \  <td>AWS::B2BI::Transformer</td> \n   <td>AWS::IoTWireless::Destination</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::CE::CostCategory</td> \n   <td>AWS::IoTWireless::DeviceProfile</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::CleanRooms::ConfiguredTable</td> \n   <td>AWS::IoTWireless::NetworkAnalyzerConfiguration&nbsp;</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::CleanRooms::Membership</td> \n   <td>AWS::IoTWireless::TaskDefinition</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::CodeArtifact::PackageGroup</td> \n   <td>AWS::IoTWireless::WirelessGateway</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::Connect::Prompt</td> \n   <td>AWS::Kinesis::ResourcePolicy</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::EKS::Nodegroup</td> \n   <td>AWS::PCAConnectorSCEP::Connector</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::GameLift::MatchmakingRuleSet</td> \n   <td>AWS::QBusiness::Application</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::GameLift::Script</td> \n   <td>AWS::QuickSight::DataSet</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::Glue::Crawler</td> \n   <td>AWS::QuickSight::Dashboard</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::InternetMonitor::Monitor</td> \n   <td>AWS::Route53::DNSSEC</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::IoT::BillingGroup</td> \n   <td>AWS::SSM::PatchBaseline</td>\
      \ \n  </tr>\n  <tr>\n   <td>AWS::IoT::ResourceSpecificLogging</td> \n   <td>AWS::Transfer::User</td>\
      \ \n  </tr>\n </tbody>\n</table>"
