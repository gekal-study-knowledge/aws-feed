  80a7c1924eebbbcd00eef056fa352d9f:
    id: 80a7c1924eebbbcd00eef056fa352d9f
    title: Amazon WorkSpaces now supports Microsoft Windows Server 2025
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-workspaces-windows-server-2025/
    published: '2026-03-12'
    summary: "<p>AWS announces availability of new bundles powered by&nbsp;Microsoft\
      \ Windows&nbsp;Server 2025, offered for Amazon WorkSpaces Personal and Amazon\
      \ WorkSpaces Core. With these bundles, customers can launch Windows Server 2025\
      \ WorkSpaces and take advantage of the latest Windows server operating systems\
      \ features. Customers can run applications such as eligible Microsoft 365 Apps\
      \ for enterprise that require newer Windows versions.<br /> <br /> While Windows\
      \ Server 2016, 2019, and 2022 powered WorkSpaces bundles remain available, the\
      \ Windows Server 2025 option brings enhanced security and modern capabilities\
      \ such as Trusted Platform Module 2.0 (TPM 2.0), Unified Extensible Firmware\
      \ Interface (UEFI) Secure Boot, Secured-core server, Credential Guard and Hypervisor-protected\
      \ Code Integrity (HVCI) and DNS-over-HTTPS.</p> \n<p>You can get started using\
      \ the managed Windows Server 2025 WorkSpaces bundles or create your own custom\
      \ bundle and image tailored to your requirements. For more information on Amazon\
      \ WorkSpaces’ new Windows Server Bundles, visit <a href=\"https://aws.amazon.com/workspaces-family/workspaces/faqs/\"\
      \ target=\"_blank\">Amazon WorkSpaces FAQs</a>.&nbsp;The new WorkSpaces Windows\
      \ Server 2025 support is available in all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      \ target=\"_blank\">AWS Regions</a> where Amazon WorkSpaces is available. For\
      \ pricing information, visit Amazon WorkSpaces <a href=\"https://aws.amazon.com/workspaces/pricing/\"\
      \ target=\"_blank\">pricing page</a>.</p>"
  76c72fcc11c48ada1322aa55f0444394:
    id: 76c72fcc11c48ada1322aa55f0444394
    title: AWS Elastic Beanstalk launches Deployments tab with in-progress deployment
      logs
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/elastic-beanstalk-deployments-tab/
    published: '2026-03-12'
    summary: "<p>AWS Elastic Beanstalk now provides a Deployments tab in the environment\
      \ dashboard, giving customers a consolidated view of their deployment history\
      \ and real-time deployment progress with step-by-step deployment logs. Previously,\
      \ customers had to wait until a deployment completed before retrieving logs,\
      \ and then correlate events across multiple sources to understand what happened.\
      \ With this launch, customers can view deployment status, events, and detailed\
      \ logs in a single interface directly from the Elastic Beanstalk console, even\
      \ while a deployment is still in progress.</p> \n<p>The Deployments tab displays\
      \ a history of recent deployments for an environment, including application\
      \ deployments, configuration updates, and environment launches. Each deployment\
      \ includes a detailed view with deployment events and a new consolidated log\
      \ that captures each step of the deployment process, including dependency installation,\
      \ application builds, .ebextensions, platform hooks, and application startup\
      \ output.</p> \n<p>This feature is supported across all Elastic Beanstalk Linux-based\
      \ platform branches. It is available in all AWS Commercial Regions and AWS GovCloud\
      \ (US) Regions where Elastic Beanstalk is available. For a complete list of\
      \ supported Regions, see <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      >AWS Regions</a>.</p> \n<p>To learn more, see the <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/environments-deployment-logs.html\"\
      >AWS Elastic Beanstalk Developer Guide</a>. For additional information, visit\
      \ the <a href=\"https://aws.amazon.com/elasticbeanstalk/\">AWS Elastic Beanstalk\
      \ product page</a>.</p>"
  f68dc2d0f8001e11fffa5db27aa8dd66:
    id: f68dc2d0f8001e11fffa5db27aa8dd66
    title: Amazon EC2 M8i and M8i-flex instances are now available in additional AWS
      Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-m8i-m8i-flex-additional-regions/
    published: '2026-03-12'
    summary: <p>Starting today, Amazon EC2 M8i and M8i-flex instances are now available
      in Europe (Ireland)<b> </b>and Europe (London)<b> </b>Regions. These instances
      are powered by custom Intel Xeon 6 processors, available only on AWS, delivering
      the highest performance and fastest memory bandwidth among comparable Intel
      processors in the cloud. The M8i and M8i-flex instances offer up to 15% better
      price-performance, and 2.5x more memory bandwidth compared to previous generation
      Intel-based instances. They deliver up to 20% better performance than M7i and
      M7i-flex instances, with even higher gains for specific workloads. The M8i and
      M8i-flex instances are up to 30% faster for PostgreSQL databases, up to 60%
      faster for NGINX web applications, and up to 40% faster for AI deep learning
      recommendation models compared to M7i and M7i-flex instances.<br /> <br /> M8i-flex
      are the easiest way to get price performance benefits for a majority of general-purpose
      workloads like web and application servers, microservices, small and medium
      data stores, virtual desktops, and enterprise applications. They offer the most
      common sizes, from large to 16xlarge, and are a great first choice for applications
      that don't fully utilize all compute resources.<br /> <br /> M8i instances are
      a great choice for all general purpose workloads, especially for workloads that
      need the largest instance sizes or continuous high CPU usage. The SAP-certified
      M8i instances offer 13 sizes including 2 bare metal sizes and the new 96xlarge
      size for the largest applications.<br /> <br /> To get started, sign in to the
      <a href="https://aws.amazon.com/console/" target="_blank">AWS Management Console</a>.
      For more information about the new instances, visit the<a href="https://aws.amazon.com/ec2/instance-types/m8i/"
      target="_blank"> M8i and M8i-flex instance page</a> or visit the <a href="https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/"
      target="_blank">AWS News</a> blog.</p>
  47ef32ea21704588bc9f2fadc236f3cf:
    id: 47ef32ea21704588bc9f2fadc236f3cf
    title: AWS Backup adds logically air-gapped vault support for Amazon EKS
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-backup-logically-air-gapped-vault-amazon-eks/
    published: '2026-03-12'
    summary: "<p>AWS Backup logically air-gapped vault now supports Amazon EKS. Logically\
      \ air-gapped vaults are a type of AWS Backup vault that allows secure sharing\
      \ of backups across accounts and AWS Organizations, supporting direct restore\
      \ to reduce recovery time from a data loss event.</p> \n<p>You can now protect\
      \ your Amazon EKS clusters in logically air-gapped vaults. A logically air-gapped\
      \ vault stores immutable backup copies that are locked by default, and isolated\
      \ with encryption using AWS owned keys or customer-managed keys. You can store\
      \ your Amazon EKS backups in a logically air gapped vault either the same account\
      \ or across other accounts and Regions. This helps reduce the risk of downtime,\
      \ ensure business continuity, and meet compliance and disaster recovery requirements.</p>\
      \ \n<p>You can get started using the <a href=\"https://console.aws.amazon.com/backup/home\"\
      >AWS Backup console</a>, API, or CLI. Target Amazon EKS backups to a logically\
      \ air-gapped vault by specifying it as the primary target or copy destination\
      \ in your backup plan. Share the vault for recovery using <a href=\"https://aws.amazon.com/ram/\"\
      >AWS Resource Access Manager</a> (RAM) or access it via Multi-party approval.\
      \ Once available, you can initiate direct restore jobs from that account, eliminating\
      \ the overhead of copying backups first.</p> \n<p>AWS Backup logically air-gapped\
      \ vault support for Amazon EKS is available in 24 AWS Regions. For more information\
      \ and detailed regional availability, visit the <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/eks-backups.html\"\
      >AWS Backup documentation</a>.</p>"
  3bdae248790e22fa7b785cb3c4843bd2:
    id: 3bdae248790e22fa7b785cb3c4843bd2
    title: AWS Private CA Connector for SCEP now supports AWS PrivateLink
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-private-ca-connector-scep-privatelink/
    published: '2026-03-12'
    summary: <p>AWS Private CA Connector for SCEP now supports AWS PrivateLink, allowing
      your clients to request certificates from within your Amazon Virtual Private
      Cloud (VPC) without traversing the public internet. With this launch, you can
      create VPC endpoints to connect to your SCEP connector privately, keeping all
      traffic within the AWS network.<br /> <br /> AWS Private CA Connector for SCEP
      is a managed connector that enables you to use the Simple Certificate Enrollment
      Protocol (SCEP) to issue certificates from AWS Private Certificate Authority
      (CA). SCEP is widely used for automated certificate enrollment and renewal for
      mobile devices, network equipment, and IoT devices. AWS PrivateLink support
      simplifies network connectivity by eliminating the need for internet gateways,
      NAT devices, or VPN connections to access your SCEP connector endpoints, while
      helping you meet compliance requirements that mandate private connectivity for
      certificate management.<br /> <br /> AWS PrivateLink support for AWS Private
      CA Connector for SCEP is available in all AWS Regions where the connector is
      available. For more information about Regional availability, see the AWS Region
      Table.<br /> <br /> To learn more and get started, visit the <a href="https://docs.aws.amazon.com/privateca/latest/userguide/connector-for-scep.html">AWS
      Private CA Connector for SCEP documentation</a>.&nbsp;For more information,
      please refer to the AWS PrivateLink <a href="https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html">documentation</a>.</p>
  6beb53a7fb3e0a4a4c3e98935d9d2cb3:
    id: 6beb53a7fb3e0a4a4c3e98935d9d2cb3
    title: AWS Glue zero-ETL integrations with Amazon DynamoDB as the source support
      new configurations
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-glue-zetl-dynamodb-configurations/
    published: '2026-03-12'
    summary: "<p>AWS Glue zero-ETL now supports configurable change data capture (CDC)\
      \ refresh intervals and on-demand data ingestion for integrations with Amazon\
      \ DynamoDB as the source. This enhancement can help you to customize how frequently\
      \ data changes are captured from your Amazon DynamoDB tables, with refresh intervals\
      \ ranging from 15 minutes to 6 days, and trigger immediate data ingestion when\
      \ needed. These capabilities bring zero-ETL integrations from Amazon DynamoDB\
      \ sources to feature parity with zero-ETL integrations from SaaS sources, like\
      \ Salesforce, SAP, and ServiceNow, ensuring consistent functionality across\
      \ different source types.<br /> <br /> With configurable CDC refresh intervals,\
      \ you can optimize your data pipeline performance by adjusting the frequency\
      \ of change capture to match your specific business requirements—whether you\
      \ need near real-time updates every 15 minutes or can work with longer intervals\
      \ up to 6 days to reduce costs. The on-demand ingestion capability allows you\
      \ to immediately capture critical data changes without waiting for the next\
      \ scheduled CDC interval. This functionality is ideal for scenarios that require\
      \ data to be immediately available for analytics, reporting, or downstream applications\
      \ and helps strike a balance between data freshness requirements and operational\
      \ efficiency.<br /> <br /> These features are available today in all AWS regions\
      \ where AWS Glue zero-ETL is supported.</p> \n<p><br /> To get started with\
      \ configuring CDC refresh intervals and on-demand ingestion for your Amazon\
      \ DynamoDB integrations, see the AWS Glue <a href=\"https://docs.aws.amazon.com/glue/latest/dg/zero-etl-configuring-integration.html\"\
      >User Guide</a>. To learn more about AWS Glue zero-ETL integrations, visit the\
      \ AWS Glue <a href=\"https://docs.aws.amazon.com/glue/latest/dg/zero-etl-using.html\"\
      >documentation</a>.&nbsp;</p>"
  82f5ac9204089ee91182b1c962bbf43b:
    id: 82f5ac9204089ee91182b1c962bbf43b
    title: Amazon Bedrock AgentCore Memory announces streaming notifications for long-term
      memory
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/agentcore-memory-streaming-ltm/
    published: '2026-03-12'
    summary: "<p>Amazon Bedrock AgentCore Memory now supports streaming notifications\
      \ for long-term memory, eliminating the need to poll for changes. Long-term\
      \ memory extracts insights from agent interactions to deliver personalized experiences\
      \ in future interactions. Developers now receive push notifications whenever\
      \ memory records are created or modified.<br /> <br /> Updates stream directly\
      \ to Amazon Kinesis each time a memory record is created or modified. This enables\
      \ developers to trigger downstream workflows, refresh application state, and\
      \ audit memory updates automatically without writing polling logic or managing\
      \ refresh intervals.</p> \n<p>This feature is available in&nbsp;<a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agentcore-regions.html\"\
      >15 AWS Regions</a>: US East (N. Virginia), US East (Ohio), US West (Oregon),\
      \ Europe (Frankfurt), Europe (Ireland), Europe (London), Europe (Paris), Europe\
      \ (Stockholm), Asia Pacific (Mumbai), Asia Pacific (Singapore), Asia Pacific\
      \ (Sydney), Asia Pacific (Tokyo), Asia Pacific (Seoul), Canada (Central), and\
      \ South America (São Paulo).&nbsp;</p> \n<p>To learn more about implementing\
      \ streaming notifications&nbsp;in AgentCore Memory,&nbsp;visit&nbsp;the&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-record-streaming.html\"\
      >documentation</a>.</p>"
  a83a39c9946b4a2c5ae86f42b9f5038a:
    id: a83a39c9946b4a2c5ae86f42b9f5038a
    title: Amazon S3 introduces account regional namespaces for general purpose buckets
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-s3-account-regional-namespaces/
    published: '2026-03-12'
    summary: <p>You can now create Amazon S3 general purpose buckets in your own reserved
      namespace, eliminating the need to find globally unique bucket names and making
      it easier to build workloads that utilize a bucket per customer, team, or dataset.
      With account regional namespaces, you can create predictable bucket names across
      multiple AWS Regions with assurance that the names you want will always be available
      for you to use.<br /> <br /> Account regional namespaces help simplify bucket
      creation and management as your data storage needs grow in size and scope. To
      get started, add the new bucket namespace request header when creating buckets
      through the CreateBucket API or by updating your AWS CloudFormation templates
      to include your unique account regional suffix in the requested name. Additionally,
      cloud security teams can use service control policies (SCP) and IAM policies
      to enforce that users only create buckets in their account regional namespace,
      helping teams enforce consistent bucket naming practices across their enterprise.<br
      /> <br /> Account regional namespaces for S3 general purpose buckets are now
      available in 37 AWS Regions including the AWS China and AWS GovCloud (US) Regions
      at no additional cost through the AWS Management Console, S3 REST API, AWS CLI,
      AWS SDK, and AWS CloudFormation. To learn more, read the <a href="https://aws.amazon.com/blogs/aws/introducing-account-regional-namespaces-for-amazon-s3-general-purpose-buckets/"
      target="_blank">AWS News Blog</a> or visit the <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/gpbucketnamespaces.html"
      target="_blank">S3 user guide</a>.&nbsp;</p>
