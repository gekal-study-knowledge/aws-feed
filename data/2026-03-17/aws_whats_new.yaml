  177f19686f72577b888dd308a1c00ab3:
    id: 177f19686f72577b888dd308a1c00ab3
    title: SageMaker Training Plans now enables extending of existing capacity commitments
      without workload reconfiguration
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sagemaker-training-plan-extension/
    published: '2026-03-17'
    summary: <p><a href="https://docs.aws.amazon.com/sagemaker/latest/dg/reserve-capacity-with-training-plans.html">SageMaker
      Training Plans</a> allows you to reserve GPU capacity within specified time
      frames in cluster sizes of up to 64 instances. Today, Amazon SageMaker AI announces
      that Training Plans can now be extended when your AI workloads take longer than
      anticipated, ensuring uninterrupted access to capacity. You can extend plans
      by 1-day increments up to 14 days, or 7-day increments up to 182 days (26 weeks).
      Extensions can be initiated via API or the SageMaker console. Once the extension
      is purchased the workload continues to run un-interrupted without you needing
      to reconfgure the workload.<br /> <br /> SageMaker AI helps you create the most
      cost-efficient training plans that fits within your timeline and AI budget.
      Once you create and purchase your training plans, SageMaker automatically provisions
      the infrastructure and runs the AI workloads on these compute resources without
      requiring any manual intervention. See the <a href="https://aws.amazon.com/sagemaker/ai/pricing/">SageMaker
      AI pricing page</a> for a detailed breakdown of instance availability by AWS
      Region.<br /> <br /> To learn more about training plan extensions, see the <a
      href="https://docs.aws.amazon.com/sagemaker/latest/dg/reserve-capacity-with-training-plans.html">Amazon
      SageMaker Training Plans User Guide</a></p>
  1c7de13508c0098a1deeb74815145565:
    id: 1c7de13508c0098a1deeb74815145565
    title: Amazon MSK expands Express brokers to Africa (Cape Town) and Asia Pacific
      (Taipei) regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-msk-express-2-new-aws-regions/
    published: '2026-03-17'
    summary: "<p>You can now create provisioned&nbsp;<a href=\"https://aws.amazon.com/msk/\"\
      >Amazon Managed Streaming for Apache Kafka (Amazon MSK)</a>&nbsp;clusters with\
      \ Express brokers in Africa (Cape Town) and Asia Pacific (Taipei) regions.</p>\
      \ \n<p>Express brokers are a new broker type for Amazon MSK Provisioned designed\
      \ to deliver up to 3x more throughput per broker, scale up to 20x faster, and\
      \ reduce recovery time by 90% as compared to standard Apache Kafka brokers.\
      \ Express brokers come pre-configured with Kafka best practices by default,\
      \ support all Kafka APIs, and provide the same low-latency performance that\
      \ Amazon MSK customers expect, so they can continue using existing client applications\
      \ without any changes.</p> \n<p>To get started, create a new cluster with Express\
      \ brokers through the Amazon MSK console or the Amazon CLI and read our&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\"\
      >Amazon MSK Developer Guide</a>&nbsp;for more information.</p>"
  2edddc57fc88b69998bdedd9ae3ee67c:
    id: 2edddc57fc88b69998bdedd9ae3ee67c
    title: Amazon Bedrock is now available in Asia Pacific (New Zealand)
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-bedrock-asia-pacific-new-zealand/
    published: '2026-03-17'
    summary: <p>Starting today, customers can use Amazon Bedrock in the Asia Pacific
      (New Zealand) Region to easily build and scale generative AI applications using
      a variety of foundation models (FMs) as well as powerful tools to build generative
      AI applications.<br /> <br /> Amazon Bedrock is a fully managed service that
      offers a choice of high-performing large language models (LLMs) and other FMs
      from&nbsp;<a href="https://docs.aws.amazon.com/bedrock/latest/userguide/models.html">leading
      AI companies</a>&nbsp;like AI21 Labs, Anthropic, Cohere, Meta, Mistral AI, OpenAI,&nbsp;Stability
      AI, as well as Amazon via a single API. Amazon Bedrock also provides a broad
      set of capabilities customers need to build generative AI applications with
      security, privacy, and responsible AI built in. These capabilities help you
      build tailored applications for multiple use cases across different industries,
      helping organizations unlock sustainable growth from generative AI while maintaining
      privacy and security.<br /> <br /> With this launch, customers can now use models
      from Anthropic (Sonnet 4.5, Sonnet 4.6, Opus 4.5, Opus 4.6, Haiku 4.5) and Amazon
      (Nova 2 Lite) in New Zealand with cross region inference.<br /> <br /> To get
      started, visit the&nbsp;<a href="https://aws.amazon.com/bedrock/">Amazon Bedrock
      page</a>&nbsp;and see the&nbsp;<a href="https://docs.aws.amazon.com/bedrock/latest/userguide/models-region-compatibility.html">Amazon
      Bedrock documentation</a>&nbsp;for more details.</p>
  a35298d51ff6cb7211e945ecfc62c9a5:
    id: a35298d51ff6cb7211e945ecfc62c9a5
    title: Amazon Bedrock AgentCore Runtime now supports shell command execution
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/bedrock-agentcore-runtime-shell-command/
    published: '2026-03-17'
    summary: "<p>Amazon Bedrock AgentCore Runtime now supports InvokeAgentRuntimeCommand,\
      \ a new API that lets you execute shell commands directly inside a running AgentCore\
      \ Runtime session. Developers can send a command, stream the output in real\
      \ time over HTTP/2, and receive the exit code — without building custom command\
      \ execution logic in their containers.</p> \n<p>AI agents often operate in workflows\
      \ where deterministic operations such as running tests, installing dependencies,\
      \ or executing git commands need to run alongside LLM-powered reasoning. Previously,\
      \ developers had to build custom logic inside their containers to distinguish\
      \ agent invocations from shell commands, spawn child processes, capture stdout\
      \ and stderr, and handle timeouts. InvokeAgentRuntimeCommand eliminates this\
      \ undifferentiated work by providing a platform-level API for command execution.\
      \ Commands run inside the same container, filesystem, and environment as the\
      \ agent session, and can execute concurrently with agent invocations without\
      \ blocking.</p> \n<p>Executing shell commands in AgentCore Runtime is supported\
      \ across fourteen AWS Regions: US East (N. Virginia), US East (Ohio), US West\
      \ (Oregon), Asia Pacific (Mumbai), Canada (Central), Asia Pacific (Seoul), Asia\
      \ Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt),\
      \ Europe (Ireland), Europe (London), Europe (Paris), and Europe (Stockholm).</p>\
      \ \n<p>To learn more, see <a href=\"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-execute-command.html\"\
      >Execute shell commands in AgentCore Runtime</a>.</p>"
  db05f93a2caa29f8c3d830d6ab97d618:
    id: db05f93a2caa29f8c3d830d6ab97d618
    title: Amazon SageMaker Unified Studio supports aggregated view of data lineage
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-sageMaker-unified-studio-aggregated-view
      -data-lineage/
    published: '2026-03-17'
    summary: <p><a href="https://aws.amazon.com/sagemaker/unified-studio/">Amazon
      SageMaker Unified Studio</a> now provides an aggregated view of data lineage,
      displaying all jobs contributing to your dataset. The aggregated view gives
      you a complete picture of data transformations and dependencies across your
      entire lineage graph, helping you quickly identify all upstream sources and
      downstream consumers of your datasets.<br /> <br /> Previously, SageMaker Unified
      Studio showed the lineage graph as it existed at a specific point in time, which
      is useful for troubleshooting and investigating specific data processing events.
      The aggregated view now provides a complete picture of data transformations
      and dependencies across multiple levels of the lineage graph. You can use this
      view to understand the full scope of jobs impacting your datasets and to identify
      all upstream sources and downstream consumers.<br /> <br /> The aggregated view
      is available as the default lineage view in Amazon SageMaker Unified Studio
      for IdC-based domains. You can switch to the previous view by toggling the "display
      in event timestamp order" option. You can also query the lineage graph using
      the new QueryGraph API, which provides lineage node graphs with metadata and
      augmented business context.<br /> <br /> Aggregated view of lineage is available
      in all existing Amazon SageMaker Unified Studio <a href="https://docs.aws.amazon.com/sagemaker-unified-studio/latest/adminguide/supported-regions.html">regions</a>.
      For detailed information on how to get started with lineage using these new
      features, refer to the <a href="https://docs.aws.amazon.com/sagemaker-unified-studio/latest/userguide/aggregated-lineage-view.html">documentation</a>
      and <a href="https://docs.aws.amazon.com/boto3/latest/reference/services/datazone/paginator/QueryGraph.html">API</a>.</p>
  b8c699405c453671b0994d0b26379d04:
    id: b8c699405c453671b0994d0b26379d04
    title: AWS Blu Insights is now AWS Transform for mainframe refactor
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-transform-mainframe-refactor/
    published: '2026-03-17'
    summary: <p>AWS Blu Insights capabilities are now available as part of AWS Transform,
      enabling customers to launch mainframe refactoring projects from the AWS Transform
      console. This launch unifies all three mainframe modernization patterns — refactor,
      replatform, and reimagine — within AWS Transform for mainframe. Code transformation
      is now offered at no cost, replacing the previous lines-of-code based pricing
      model.<br /> <br /> With this launch, you can access AWS Transform for mainframe
      refactor directly from the AWS Transform console using your existing AWS credentials.
      The mandatory three-level certification requirement to access the Transformation
      Center has been removed, lowering the friction to exploring refactor projects.
      Self-paced training content remains available within the application for those
      who want to build deeper knowledge.<br /> <br /> AWS Transform for mainframe
      refactor is available in <a href="https://bluinsights.aws/docs/faq-account-multi-region">18
      AWS Regions</a>. In regions where AWS Transform for mainframe is not yet available,
      you can continue to access the service through the AWS Mainframe Modernization
      console.<br /> <br /> To get started, visit the AWS Transform for mainframe
      refactor <a href="https://bluinsights.aws/docs/quick-start-get-started">user
      guide</a>.</p>
  4e0c3fd0643d6059867c0de46d083bc0:
    id: 4e0c3fd0643d6059867c0de46d083bc0
    title: Amazon Corretto 26 is now generally available
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-corretto-26-generally-available/
    published: '2026-03-17'
    summary: "<p>Amazon Corretto 26, a Feature Release (FR) version, is now available\
      \ for download. <a href=\"https://aws.amazon.com/corretto/\">Amazon Corretto</a>\
      \ is a no-cost, multi-platform, production-ready distribution of <a href=\"\
      https://aws.amazon.com/blogs/opensource/amazon-corretto-no-cost-distribution-openjdk-long-term-support/\"\
      >OpenJDK</a>. You can download Corretto 26 for Linux, Windows, and macOS from\
      \ our <a href=\"https://docs.aws.amazon.com/corretto/latest/corretto-26-ug/downloads-list.html\"\
      >downloads page</a>. Corretto 26 will be supported through October 2026.<br\
      \ /> </p> \n<ul> \n <li><b>HTTP/3 Support</b> - Java applications can now use\
      \ the latest HTTP/3 protocol, which is faster and more efficient than older\
      \ HTTP versions (JEP 517)</li> \n <li><b>Ahead-of-Time Object Caching</b> -\
      \ Applications can start up faster by pre-caching commonly used objects, working\
      \ with any garbage collector (JEP 516)</li> \n <li><b>Enhanced Pattern Matching</b>\
      \ - Developers can write cleaner code when checking types and values, now including\
      \ support for primitive types like int and boolean (JEP 530)</li> \n <li><b>Making\
      \ Final Mean Final</b> - Starts warning when code uses reflection to modify\
      \ final fields, preparing for a future release where final fields will truly\
      \ be immutable. This change improves both program safety and enables better\
      \ optimizations like constant folding (JEP 500)</li> \n <li><b>Structured Concurrency\
      \ (continued preview) </b>- Introduces API for structured concurrency, treating\
      \ groups of related tasks running in different threads as single units of work,\
      \ streamlining error handling and cancellation, improving reliability, and enhancing\
      \ observability (JEP 525)</li> \n <li><b>Vector API (continued incubator)</b>\
      \ - Improved support for high-performance mathematical operations that can take\
      \ advantage of modern CPU capabilities (JEP 529)</li> \n <li><b>Lazy Constants\
      \ (continued preview)</b> - Provides API to defer initialization of immutable\
      \ data until it is actually needed, combining the performance benefits of final\
      \ fields with the flexibility of lazy initialization (JEP 526)</li> \n</ul>\
      \ \n<p>A detailed description of these features can be found on the <a href=\"\
      https://openjdk.org/projects/jdk/26/\">OpenJDK 26 Project page</a>. Amazon Corretto\
      \ 26 is distributed by Amazon under an <a href=\"https://openjdk.org/legal/gplv2+ce.html\"\
      >open source license</a>.</p>"
  57a80088249ac658995deb9a4194646c:
    id: 57a80088249ac658995deb9a4194646c
    title: Amazon RDS enhancements for SQL Server Developer Edition
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-rds-enhancements-for-sql-server-developer-edition/
    published: '2026-03-17'
    summary: <p><a href="https://aws.amazon.com/rds/sqlserver/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) for SQL Server</a> now supports Additional
      Storage Volumes, Resource Governor, and SQL Server 2019 with SQL Server Developer
      Edition. SQL Server Developer Edition is an ideal choice to build and test applications
      because it includes all the functionality of Enterprise edition, and is free
      of license charges for use as a development and test system, not as production
      server. <br /> <br /> You can use Additional Storage Volumes to your Amazon
      RDS for SQL Server Developer Edition instances, which provide you up to 256
      TiB, 4X more storage. You can also use SQL Server Resource Governor, which lets
      you manage workload and resource consumption by defining resource pools and
      workload groups to control CPU and memory usage, enabling more realistic performance
      testing. Amazon RDS for SQL Server Developer Edition now also supports SQL Server
      2019 (CU32 GDR - 15.0.4455.2), so you can match the SQL Server version used
      in your development and testing environments with what you use for your production
      environment.<br /> <br /> For more information about these features and region
      availability, see <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/sqlserver-dev-edition.html"
      target="_blank">Working with SQL Server Developer Edition on RDS for SQL Server</a>.
      For pricing details, see <a href="https://aws.amazon.com/rds/sqlserver/pricing/"
      target="_blank">Amazon RDS for SQL Server Pricing</a>.</p>
  a26ba61bd1b5816eac6620133f65ffe4:
    id: a26ba61bd1b5816eac6620133f65ffe4
    title: Simplified permissions for Amazon S3 Tables and Iceberg materialized views
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/gdc-simplified-permissions-s3tables-iceberg-views/
    published: '2026-03-17'
    summary: <p>AWS Glue Data Catalog now supports AWS IAM-based authorization for
      Amazon S3 Tables and Apache Iceberg materialized views. With IAM-based authorization,
      you can define all necessary permissions across storage, catalog, and query
      engines in a single IAM policy.<br /> <br /> This capability simplifies the
      integration of S3 Tables or materialized views with any AWS Analytics service,
      including Amazon Athena, Amazon EMR, Amazon Redshift, and AWS Glue. You can
      also opt in to AWS Lake Formation at any time to manage fine-grained access
      controls using the AWS Management Console, AWS CLI, API, and AWS CloudFormation.<br
      /> <br /> This feature is now available in select AWS Regions. To learn more,
      visit the <a href="https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-integration-overview.html"
      target="_blank">S3 Tables documentation</a> and the <a href="https://docs.aws.amazon.com/glue/latest/dg/glue-federation-s3tables.html"
      target="_blank">AWS Glue Data Catalog documentation</a>.</p>
  3684834c3841fd009d960cd6c45c11d1:
    id: 3684834c3841fd009d960cd6c45c11d1
    title: Amazon Connect voice AI agents now supports 13 new languages
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-voice-ai-agents-13-languages/
    published: '2026-03-17'
    summary: "<p>Amazon Connect now supports 13 new languages for voice AI agents,\
      \ bringing the total to 40 language locales.&nbsp;&nbsp;New languages include\
      \ Arabic (Saudi Arabia), Czech, Danish, Dutch (Belgium), English (Ireland),\
      \ English (New Zealand), English (Wales), German (Switzerland), Icelandic, Romanian,\
      \ Spanish (Mexico), Turkish, and Welsh.</p> \n<p>Amazon&nbsp;Connect's&nbsp;agentic\
      \ self-service capabilities enable AI agents to understand, reason, and&nbsp;take\
      \ action&nbsp;across voice and digital channels to automate routine and complex\
      \ customer service tasks&nbsp;across multiple languages.&nbsp;&nbsp;</p> \n\
      <p>To learn more about this feature, see the Amazon Connect&nbsp;<a href=\"\
      https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html\"\
      >Administrator Guide</a>.&nbsp;To&nbsp;learn more about Amazon Connect,&nbsp;a&nbsp;complete\
      \ AI-powered contact center solution delivering personalized customer experiences\
      \ at scale, visit the&nbsp;Amazon Connect&nbsp;<a href=\"https://aws.amazon.com/connect/\"\
      >website.</a></p>"
  a565820d54783188d2b542c8e18dd5fb:
    id: a565820d54783188d2b542c8e18dd5fb
    title: AWS Elemental MediaConnect adds support for NDI® inputs
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/mediaconnect-ndi-inputs/
    published: '2026-03-17'
    summary: <p>Starting today, <a href="https://aws.amazon.com/mediaconnect/">AWS
      Elemental MediaConnect </a>supports <a href="https://ndi.video/">NDI® (Network
      Device Interface)</a> as a live video source, enabling broadcasters and live
      production teams to ingest NDI streams and convert them to transport stream
      outputs such as SRT for downstream distribution. NDI is a widely adopted IP
      video technology used in live production environments and supported by more
      than 500 hardware products and 400 software applications.<br /> <br /> With
      this new capability, live production teams can bridge NDI-based production environments
      with standards-based cloud distribution workflows without requiring custom transcoding
      or protocol conversion infrastructure. For example, you can route an NDI feed
      from an EC2 instance running NDI Tools directly into a MediaConnect flow, convert
      it to a transport stream, and pass it downstream to AWS Elemental MediaLive
      for transcoding and AWS Elemental MediaPackage for origin and packaging. This
      eliminates the complexity of egressing NDI content from the AWS Cloud and enables
      seamless integration with existing IP-based broadcast workflows.<br /> <br />
      NDI support is available in most regions where MediaConnect is currently deployed.
      For more information and details on pricing, please refer to the <a href="https://docs.aws.amazon.com/mediaconnect/latest/ug/sources-using-ndi.html">NDI
      documentation</a> and the <a href="https://aws.amazon.com/mediaconnect/pricing">MediaConnect
      pricing page</a>.</p>
