    title: Amazon RDS Custom for SQL Server adds ability to view and schedule new
      operating system updates
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-rds-custom-sql-server-operating-system-updates/
    published: '2026-03-19'
    summary: "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\"\
      >Amazon RDS Custom</a> for SQL Server now provides customers with ability to\
      \ view and schedule new operating system (OS) updates for RDS provided engine\
      \ versions (RPEV). With RPEV, RDS Custom provides a SQL Server version pre-installed\
      \ on an Amazon Machine Image (AMI). When new operating system updates are available\
      \ for RPEV, customers can now view upcoming updates, apply them immediately,\
      \ or schedule them for application in the next maintenance window using RDS\
      \ Custom APIs.<br /> <br /> To view available OS updates, customers can use\
      \ the <a href=\"https://docs.aws.amazon.com/cli/latest/reference/rds/describe-pending-maintenance-actions.html\"\
      \ target=\"_blank\">describe-pending-maintenance-actions</a> API, or subscribe\
      \ to RDS-EVENT-0230 to receive an alert when new updates become available for\
      \ their database instance. Customers can use <a href=\"https://docs.aws.amazon.com/cli/latest/reference/rds/apply-pending-maintenance-action.html\"\
      \ target=\"_blank\">apply-pending-maintenance-action</a> API to apply the updates\
      \ immediately or schedule them within their next maintenance window.</p> \n\
      <p>Using these features, customers can efficiently track and apply OS updates.\
      \ To learn more, refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/working-with-custom-sqlserver.html\"\
      \ target=\"_blank\">Amazon RDS Custom for SQL Server User Guide</a>. These features\
      \ are available in all the AWS Regions where RDS Custom for SQL Server is available.</p>"
