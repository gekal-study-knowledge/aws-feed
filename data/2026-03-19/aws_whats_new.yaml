  b98f480d1056b186ed994670599ff189:
    id: b98f480d1056b186ed994670599ff189
    title: Amazon RDS Custom for SQL Server adds ability to view and schedule new
      operating system updates
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-rds-custom-sql-server-operating-system-updates/
    published: '2026-03-19'
    summary: "<p><a href=\"https://aws.amazon.com/rds/custom/\" target=\"_blank\"\
      >Amazon RDS Custom</a> for SQL Server now provides customers with ability to\
      \ view and schedule new operating system (OS) updates for RDS provided engine\
      \ versions (RPEV). With RPEV, RDS Custom provides a SQL Server version pre-installed\
      \ on an Amazon Machine Image (AMI). When new operating system updates are available\
      \ for RPEV, customers can now view upcoming updates, apply them immediately,\
      \ or schedule them for application in the next maintenance window using RDS\
      \ Custom APIs.<br /> <br /> To view available OS updates, customers can use\
      \ the <a href=\"https://docs.aws.amazon.com/cli/latest/reference/rds/describe-pending-maintenance-actions.html\"\
      \ target=\"_blank\">describe-pending-maintenance-actions</a> API, or subscribe\
      \ to RDS-EVENT-0230 to receive an alert when new updates become available for\
      \ their database instance. Customers can use <a href=\"https://docs.aws.amazon.com/cli/latest/reference/rds/apply-pending-maintenance-action.html\"\
      \ target=\"_blank\">apply-pending-maintenance-action</a> API to apply the updates\
      \ immediately or schedule them within their next maintenance window.</p> \n\
      <p>Using these features, customers can efficiently track and apply OS updates.\
      \ To learn more, refer to the <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/working-with-custom-sqlserver.html\"\
      \ target=\"_blank\">Amazon RDS Custom for SQL Server User Guide</a>. These features\
      \ are available in all the AWS Regions where RDS Custom for SQL Server is available.</p>"
  f321b957f27b709f71220c579df7aa7b:
    id: f321b957f27b709f71220c579df7aa7b
    title: Amazon EC2 C8gn instances are now available in additional regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-c8gn-instances-additional-regions/
    published: '2026-03-19'
    summary: "<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8gn instances,\
      \ powered by the latest-generation AWS Graviton4 processors, are available in\
      \ the AWS Region&nbsp;Asia Pacific (Jakarta, Hyderabad, Tokyo),&nbsp;South America\
      \ (Sao Paulo), and&nbsp;Europe (Zurich). The new instances provide up to 30%\
      \ better compute performance than Graviton3-based Amazon EC2 C7gn instances.\
      \ Amazon EC2 C8gn instances feature the latest 6th generation AWS Nitro Cards,\
      \ and offer up to 600 Gbps network bandwidth, the highest network bandwidth\
      \ among network optimized EC2 instances.&nbsp;</p> \n<p>&nbsp;<br /> Take advantage\
      \ of the enhanced networking capabilities of C8gn to scale performance and throughput,\
      \ while optimizing the cost of running network-intensive workloads such as network\
      \ virtual appliances, data analytics, CPU-based artificial&nbsp;intelligence&nbsp;and\
      \ machine learning&nbsp;(AI/ML) inference.&nbsp;<br /> &nbsp;<br /> For increased\
      \ scalability, C8gn instances offer instance sizes up to 48xlarge, up to 384\
      \ GiB of memory, and up to 60 Gbps of bandwidth to Amazon Elastic Block Store\
      \ (EBS). C8gn instances support Elastic Fabric Adapter (EFA) networking on the\
      \ 16xlarge, 24xlarge, 48xlarge, metal-24xl, and metal-48xl sizes, which enables\
      \ lower latency and improved cluster performance for workloads deployed on tightly\
      \ coupled clusters.&nbsp;<br /> &nbsp;<br /> C8gn instances are available in\
      \ the following AWS Regions: US East (N. Virginia, Ohio), US West (Oregon, N.California),\
      \ Europe (Frankfurt, Stockholm, Ireland, London, Spain, Zurich), Asia Pacific\
      \ (Singapore, Malaysia, Sydney, Thailand, Mumbai, Seoul, Melbourne, Jakarta,\
      \ Hyderabad, Tokyo), Middle East (UAE), Africa (Cape Town), Canada West (Calgary,&nbsp;Central),&nbsp;South\
      \ America (Sao Paulo), AWS GovCloud (US-East, US-West).<br /> &nbsp;<br /> To\
      \ learn more, see&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/c8g/\"\
      >Amazon C8gn Instances</a>. To begin your Graviton journey, visit the&nbsp;<a\
      \ href=\"https://aws.amazon.com/ec2/graviton/level-up-with-graviton/\">Level\
      \ up your compute with AWS Graviton page</a>. To get started, see&nbsp;<a href=\"\
      https://console.aws.amazon.com/\">AWS Management Console</a>,&nbsp;<a href=\"\
      https://aws.amazon.com/cli/\">AWS Command Line Interface (AWS CLI)</a>, and&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/EC2.html\"\
      >AWS SDKs</a>.</p>"
