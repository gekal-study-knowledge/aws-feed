  82e7a0d6f5c3bcf62254c9c620883f18:
    id: 82e7a0d6f5c3bcf62254c9c620883f18
    title: Amazon OpenSearch Service adds new insights for improved cluster stability
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-opensearch-service-adds-new-insights-improved-cluster-stability/
    published: '2026-02-27'
    summary: <p><a href="https://aws.amazon.com/opensearch-service/">Amazon OpenSearch
      Service</a> has enhanced Cluster Insights with two new insights — Cluster Overload
      and Suboptimal Sharding Strategy. Suboptimal Sharding Strategy provides instant
      visibility into shard imbalances that cause uneven workload distribution, while
      Cluster Overload surfaces elevated cluster resource utilization that can lead
      to request throttling or rejections. Both insights come with details of affected
      resources along with actionable mitigation recommendations.<br /> <br /> Previously,
      identifying resource constraints and shard imbalances required manually correlating
      multiple metrics and logs, making it difficult to detect issues early. With
      these new insights, you can proactively monitor cluster health and take timely
      action.<br /> <br /> Suboptimal Sharding Strategy detects shard imbalances caused
      by indices with too few shards relative to the number of data nodes, or by shards
      carrying disproportionately large amounts of data compared to others. It identifies
      the root cause of uneven workload distribution and provides recommendations
      to help you achieve optimal shard distribution for improved query performance
      and resource utilization. Similarly, Cluster Overload helps you identify elevated
      resource utilization, including CPU, memory, disk I/O, disk throughput, and
      disk utilization that can potentially lead to request throttling or rejections.
      It also provides scale-up recommendations so you can take timely action to protect
      your critical workloads.<br /> <br /> These new insights are available at no
      additional cost for OpenSearch version 2.17 or later in all Regions where the
      OpenSearch UI is available. See the complete list of supported Regions <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">here</a>.
      To learn more, visit the <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/cluster-insights.html">Cluster
      Insights documentation</a> or view the complete <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/insights-catalog.html">catalog
      of available insights</a>.</p>
  abeec699a8f70afb457a119445b6477b:
    id: abeec699a8f70afb457a119445b6477b
    title: AWS now supports Bacs Direct Debit as a payment method for UK customers
    link: https://aws.amazon.com/about-aws/whats-new/aws-supports-bacs-direct-debit-payment-method/
    published: '2026-02-27'
    summary: "<p>Starting today, AWS customers based in the United Kingdom can use\
      \ Bacs Direct Debit to pay for their AWS services. This new feature provides\
      \ a convenient and automated way to manage your cloud spend directly from your\
      \ GBP-based bank account.</p> \n<p>Customers can securely connect any personal\
      \ or business bank account that supports the Bacs standard.&nbsp;Previously,\
      \ AWS only&nbsp; accepted credit or debit cards and EUR-based bank accounts\
      \ in the UK.</p> \n<p>During sign-up, customers can choose \"Bacs Direct Debit\"\
      \ from the AWS sign-up page, select their bank, and authenticate using their\
      \ bank's mobile app or online banking credentials. This securely verifies ownership\
      \ and links the bank account to the AWS account. By default, this account will\
      \ be used for future AWS invoices.</p> \n<p>Existing customers can add Bacs\
      \ Direct Debit by navigating to the Payment Preferences page in the AWS Billing\
      \ console. They choose \"Add payment method,\" select \"Bacs Direct Debit,\"\
      \ and follow the same bank selection and authentication flow. Once verified,\
      \ the bank account is available as a payment method for future invoices.</p>\
      \ \n<p>Bacs Direct Debit is available to customers in UK regions at not additional\
      \ cost. To learn more, see&nbsp;<a href=\"https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-bacs-emea.html\"\
      >Managing your Bacs direct debit payment method</a>.&nbsp;</p>"
  29879a48402063e91e56ef9723a3ed49:
    id: 29879a48402063e91e56ef9723a3ed49
    title: Amazon CloudWatch logs centralization rules now support customizable destination
      log group structure
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/cloudwatch-centralization-custom-groups/
    published: '2026-02-27'
    summary: "<p>Amazon CloudWatch now supports customizing destination log group\
      \ names when creating CloudWatch log centralization rules. Organizations managing\
      \ logs across multiple accounts can now use attributes to organize centralized\
      \ logs into meaningful hierarchies — by account ID, region, organizational unit,\
      \ or other AWS Organizations metadata — that match how their organization operates\
      \ and what their compliance requirements demand.</p> \n<p>You can define a destination\
      \ log group name structure using attributes that CloudWatch Logs automatically\
      \ replaces with actual values when logs are copied. For example, using the pattern\
      \ ${source.accountId}/${source.region}/${source.logGroup} creates destination\
      \ log groups like 123456789012/us-east-1/cloudtrail/managementevent, making\
      \ it easy to identify which account and region logs originated from. You can\
      \ use attributes, including source account ID, region, log group name, organization\
      \ ID, organizational unit ID, root ID, and the full organizational path.</p>\
      \ \n<p>Customizable destination log group names are available in all <a href=\"\
      https://builder.aws.com/build/capabilities/explore\" target=\"_blank\">centralization\
      \ rules supported regions</a>.</p> \n<p>Customers can use centralization rules\
      \ to centralize one copy of logs for free (ingestion). Additional copies are\
      \ charged at $0.05/GB of logs centralized (the backup region feature is considered\
      \ an additional copy). Storage charges apply. To learn more, visit the <a href=\"\
      https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html\"\
      \ target=\"_blank\">CloudWatch Logs Centralization documentation</a>.</p>"
  f615802b6b6d56e0ec5d5e2a62ba2e30:
    id: f615802b6b6d56e0ec5d5e2a62ba2e30
    title: Amazon RDS for PostgreSQL supports minor versions 18.3, 17.9, 16.13, 15.17,
      and 14.22
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/rds-minor-version-18-3-17-9-16-13-15-17-14-22/
    published: '2026-02-27'
    summary: <p><a href="https://aws.amazon.com/rds/postgresql/" target="_blank">Amazon
      Relational Database Service (RDS)</a> for PostgreSQL now supports the latest
      minor versions 18.3, 17.9, 16.13, 15.17, and 14.22. These versions address the
      regression from the February 12, 2026 PostgreSQL community release. We recommend
      that you upgrade to the latest minor versions to fix known security vulnerabilities
      in prior versions of PostgreSQL, and to benefit from the bug fixes added by
      the PostgreSQL community.<br /> <br /> You can upgrade your databases during
      scheduled maintenance windows using automatic minor version upgrades. To simplify
      operations at scale, enable automatic minor version upgrades and use the <a
      href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/RDS.Maintenance.AMVU.UpgradeRollout.html"
      target="_blank">AWS Organizations Upgrade Rollout Policy</a> to orchestrate
      thousands of upgrades in phases, first to development environments before upgrading
      production systems. You can also use <a href="https://aws.amazon.com/about-aws/whats-new/2024/11/rds-blue-green-deployments-upgrade-rds-postgresql/"
      target="_blank">Amazon RDS Blue/Green deployments</a> with physical replication
      to minimize downtime for minor version upgrades.<br /> <br /> Amazon RDS for
      PostgreSQL makes it simple to set up, operate, and scale PostgreSQL deployments
      in the cloud. See <a href="https://aws.amazon.com/rds/postgresql/pricing/" target="_blank">Amazon
      RDS for PostgreSQL Pricing</a> for pricing details and regional availability.
      Create or update a fully managed Amazon RDS database in the Amazon RDS Management
      Console or by using the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html"
      target="_blank">AWS Command Line Interface</a> (CLI).</p>
