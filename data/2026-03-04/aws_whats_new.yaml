  dffe3720042e41e5e3e967b8ab9a42fc:
    id: dffe3720042e41e5e3e967b8ab9a42fc
    title: Amazon Lightsail now offers OpenClaw, a private self-hosted AI assistant
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-lightsail-openclaw/
    published: '2026-03-04'
    summary: <p>Amazon Lightsail now lets you deploy OpenClaw, a private self-hosted
      AI assistant, on your own cloud infrastructure in a simple and secure manner.<br
      /> <br /> Every Lightsail OpenClaw instance ships with built-in security controls,
      pre-configured and ready to use. Sandboxing isolates each agent session for
      improved security posture. One-click HTTPS access puts the OpenClaw dashboard
      in your browser securely, without requiring manual TLS configuration. Device
      pairing authentication ensures only your authorized devices can connect to your
      assistant. Automatic snapshots back up your configuration continuously, so you
      never lose your setup. Amazon Bedrock serves as the default model provider for
      Lightsail OpenClaw, and you can swap models or connect to Slack, Telegram, WhatsApp,
      and Discord as per your requirements.<br /> <br /> Amazon Lightsail is available
      in <a href="https://docs.aws.amazon.com/lightsail/latest/userguide/understanding-regions-and-availability-zones-in-amazon-lightsail.html">15
      AWS Regions</a> including US East (N. Virginia), US West (Oregon), Europe (Frankfurt),
      Europe (London), Asia Pacific (Tokyo), and Asia Pacific (Jakarta). To get started,
      visit the <a href="https://lightsail.aws.amazon.com/">Lightsail console</a>.
      For pricing and other details, visit the <a href="https://aws.amazon.com/lightsail/pricing/">Amazon
      Lightsail pricing</a> and <a href="https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-quick-start-guide-openclaw.html">quick
      start documentation</a> pages.</p>
  c24d557d830170cbe62629f596ad6cbc:
    id: c24d557d830170cbe62629f596ad6cbc
    title: Amazon OpenSearch Ingestion now supports Amazon Managed Service for Prometheus
      as a sink
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-ingestion-supports-amazon-managed-service-prometheus-sink
    published: '2026-03-04'
    summary: "<p>Amazon OpenSearch Ingestion now supports Amazon Managed Service for\
      \ Prometheus&nbsp; as a sink, making it possible to build fully managed, end-to-end\
      \ metrics ingestion pipelines without any custom forwarding infrastructure.&nbsp;With\
      \ this launch, customers can now manage their entire metrics ingestion workflow\
      \ using the same pipeline infrastructure they already use for logs and traces.</p>\
      \ \n<p>Customers can now choose the right destination for each observability\
      \ signal — sending logs and traces to Amazon OpenSearch Service for powerful\
      \ full-text search, log analytics, and trace correlation, while routing metrics\
      \ to&nbsp;Amazon Managed Service for Prometheus for time-series storage and\
      \ analysis. This flexibility allows teams to build purpose-fit observability\
      \ pipelines that leverage the strengths of each service without compromising\
      \ on data fidelity or analytical capability.&nbsp;Amazon OpenSearch Ingestion's\
      \ built-in data transformation and enrichment capabilities allow customers to\
      \ prepare and refine metrics before they land in Amazon Managed Service for\
      \ Prometheus, improving data quality and consistency. Once metrics are in Amazon\
      \ Managed Service for Prometheus, customers can query them using Prometheus\
      \ Query Language to analyze trends, configure alerting rules to get notified\
      \ when metrics cross defined thresholds, and visualize their data using Amazon\
      \ Managed Grafana for rich, customizable views of infrastructure and application\
      \ health.</p> \n<p>The feature is supported in all regions that Amazon OpenSearch\
      \ Ingestion and&nbsp; is currently&nbsp;<a href=\"https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html#opensearch-service-regions\"\
      \ target=\"_blank\">available</a>. Customers can get started by using the new\
      \ sink for Amazon Managed Service for Prometheus&nbsp;in their pipeline configuration\
      \ via the AWS Management console or using the AWS CLI and start ingesting metrics\
      \ into their&nbsp;Amazon Managed Service for Prometheus workspace.</p> \n<p>To\
      \ learn more and get started, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/configure-client-prometheus.html\"\
      \ target=\"_blank\">Amazon OpenSearch Ingestion documentation</a>.</p>"
  0ebc82b8d4955725a44954058714509d:
    id: 0ebc82b8d4955725a44954058714509d
    title: Amazon GameLift Servers launches DDoS Protection
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-gamelift-servers-ddos-protection/
    published: '2026-03-04'
    summary: "<p>We’re excited to announce&nbsp;Amazon GameLift Servers DDoS Protection,\
      \ a new feature&nbsp;that helps game developers protect&nbsp;session-based multiplayer\
      \ games that utilize <a href=\"https://aws.amazon.com/gamelift/servers/\">Amazon\
      \ GameLift Servers</a> to help improve overall game session resiliency. DDoS\
      \ Protection is designed to defend against denial-of-service (DoS) and distributed\
      \ denial-of-service (DDoS) attacks, providing proactive, User Datagram Protocol\
      \ (UDP)-based traffic protection–without the need for manual byte matching,\
      \ and with negligible latency added.</p> \n<p>Amazon GameLift Servers DDoS Protection\
      \ co-locates a relay network directly alongside your game servers. The relay\
      \ authenticates client traffic using access tokens so that only authorized traffic\
      \ reaches the server. The feature also enforces per-player traffic limits to\
      \ help prevent disruptions, even from seemingly legitimate sources. Game developers\
      \ can use DDoS Protection to protect against targeted disruptions to specific\
      \ players or entire game sessions. Check out the Amazon GameLift Servers&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/gameliftservers/latest/developerguide/release-notes.html#release-notes-03032026\"\
      \ target=\"_blank\">release notes</a> to get started through the console or\
      \ API, with sample code provided for popular game engines including Unreal Engine\
      \ and native C++.</p> \n<p>Amazon GameLift Servers&nbsp;DDoS Protection is available\
      \ at no additional cost to Amazon GameLift Servers customers and is initially\
      \ available in the following regions: US East (N. Virginia), US West (Oregon),\
      \ Europe (Frankfurt), Europe (Ireland), Asia Pacific (Sydney), Asia Pacific\
      \ (Tokyo), Pacific (Seoul).</p>"
  9aa0d3f0eea2990327be37d707096531:
    id: 9aa0d3f0eea2990327be37d707096531
    title: Amazon OpenSearch Ingestion now supports unified ingestion endpoint for
      OpenTelemetry data
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-ingestion-unified-ingestion-endpoint-opentelemetry
    published: '2026-03-04'
    summary: <p>Amazon OpenSearch Ingestion now supports a unified ingestion endpoint
      that can accept all three OpenTelemetry observability signals — logs, metrics,
      and traces — through a single pipeline. Previously, customers who wanted to
      ingest all three&nbsp;OpenTelemetry data types had to create and manage three
      separate pipelines, one for each signal type. With this launch, a single pipeline
      can now receive any combination of&nbsp;OpenTelemetry signals, simplifying pipeline
      architecture and reducing operational overhead.<br /> <br /> Customers can now
      build centralized observability pipelines that consolidate logs, metrics, and
      traces in one place, making it easier to correlate signals and gain a holistic
      view of application health. Teams operating at scale can reduce the number of
      pipelines they manage, lowering infrastructure costs and simplifying access
      control, monitoring, and lifecycle management. This also makes it easier to
      adopt OpenTelemetry incrementally as teams can begin with one signal type and
      add others over time without any pipeline reconfiguration.<br /> <br /> The
      unified ingestion endpoint for OpenTelemetry data is supported in all regions
      that Amazon OpenSearch Ingestion is currently <a href="https://docs.aws.amazon.com/general/latest/gr/opensearch-service.html#opensearch-service-regions"
      target="_blank">available</a>. Customers can get started by using the new unified
      OpenTelemetry source in their pipeline configuration via the AWS Management
      console or using the AWS CLI and point their OpenTelemetry clients to the new
      unified endpoint.<br /> <br /> To learn more and get started, visit the <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/configure-client-otel.html"
      target="_blank">Amazon OpenSearch Ingestion documentation</a>.</p>
