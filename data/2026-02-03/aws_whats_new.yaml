  7a6c93f5d414ee90bdf21ff680dad0c7:
    id: 7a6c93f5d414ee90bdf21ff680dad0c7
    title: AWS IAM Identity Center enables account access and application use in multiple
      AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-iam-identity-center-multi-region-aws-account-access-and-application-deployment
    published: '2026-02-03'
    summary: "<p>IAM Identity Center helps you configure the single sign-on experience\
      \ of your workforce to AWS accounts and applications. You can now replicate\
      \ IAM Identity Center from the primary AWS Region where you first enabled it\
      \ to additional Regions of your choice. This feature enhances resilience of\
      \ user access to AWS accounts and helps you deploy AWS applications in the AWS\
      \ Regions that best align with your business needs such as application data\
      \ residency and proximity to users.</p> \n<p>When you enable this feature, IAM\
      \ Identity Center automatically replicates your identities, entitlements, and\
      \ other information from the primary Region to additional Regions. If IAM Identity\
      \ Center is affected by a disruption in the primary Region, IAM Identity Center\
      \ users continue to have access to their AWS accounts using the already provisioned\
      \ entitlements in the additional Regions.&nbsp;</p> \n<p>AWS application administrators\
      \ can use the standard application deployment workflow to deploy their application\
      \ in an additional Region. They can assign users to the application in that\
      \ Region, while you continue to administer IAM Identity Center in the primary\
      \ Region.<br /> <br /> IAM Identity Center multi-Region support is currently\
      \ available in the <a href=\"https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-regions.html#manage-acct-regions-regional-availability\"\
      >17 enabled-by-default commercial AWS Regions</a> for organization instances\
      \ of IAM Identity Center connected to an external identity provider, such as\
      \ Okta. The IAM Identity Center organization instance must be configured with\
      \ a multi-Region customer managed KMS key (CMK). To find out which AWS applications\
      \ support deployment in additional Regions, visit <a href=\"https://docs.aws.amazon.com/singlesignon/latest/userguide/awsapps-that-work-with-identity-center.html\"\
      >AWS applications that you can use with IAM Identity Center</a>. Standard <a\
      \ href=\"https://aws.amazon.com/kms/pricing/\">AWS KMS charges</a> apply for\
      \ storing and using CMKs. IAM Identity Center is provided at no additional cost.\
      \ To learn more about IAM Identity Center, <a href=\"https://aws.amazon.com/iam/identity-center/\"\
      >visit the product detail page</a>.&nbsp;To get started, see the <a href=\"\
      https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html\"\
      >IAM Identity Center User Guide</a>.&nbsp;</p>"
  ebef5557435280e96d1e9462a5ed157d:
    id: ebef5557435280e96d1e9462a5ed157d
    title: AWS Lake Formation is now available in Asia Pacific (New Zealand) Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/AWS-Lake-Formation-Asia-Pacific-New-Zealand-Region
    published: '2026-02-03'
    summary: <p>AWS Lake Formation is now available in the Asia Pacific (New Zealand)
      Region, enabling you to centrally manage and scale fine-grained data access
      permissions and share data securely within and outside your organization.<br
      /> <br /> <a href="https://aws.amazon.com/lake-formation/">AWS Lake Formation</a>
      is a service that allows you to define where your data resides and what data
      access and security policies you want to apply. Your users can then access the
      centralized AWS Glue Data Catalog which describes available data sets and their
      appropriate usage. Your users can then usethese data sets with their choice
      of analytics and machine learning services, like Amazon EMR for Apache Spark,
      Amazon Redshift, AWS Glue, Amazon QuickSight, and Amazon Athena.<br /> <br />
      To learn more about Lake Formation, visit the <a href="https://docs.aws.amazon.com/lake-formation/">documentation</a>.
      For AWS Lake Formation Region availability, please see the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region table</a>.</p>
  6dde073c8b0f1feb081b8b0323a95ca9:
    id: 6dde073c8b0f1feb081b8b0323a95ca9
    title: Amazon Connect launches an appeals workflow for agent performance evaluations
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-connect-appeals-workflow-agent-performance-evaluations/
    published: '2026-02-03'
    summary: <p>Amazon Connect now provides an integrated workflow to capture and
      resolve agent appeals of performance evaluations, enhancing evaluation fairness
      and agent engagement. When agents disagree with an evaluation, they can appeal
      the evaluation along with their reasoning directly within the Connect UI. For
      example, an agent who received a low evaluation score for active listening on
      a conversation, may appeal their evaluation by citing specific examples where
      they actively listened and acknowledged the customer’s problem. Designated managers
      then receive automated email notifications to review and resolve the appeal.
      Additionally, managers can monitor which evaluations have been appealed, and
      track their status, ensuring timely resolution of appeals.<br /> <br /> This
      feature is available in all regions where&nbsp;<a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#amazonconnect_region">Amazon
      Connect</a>&nbsp;is offered. To learn more, please visit our&nbsp;<a href="https://docs.aws.amazon.com/connect/latest/adminguide/evaluation-review-requests.html">documentation</a>&nbsp;and
      our&nbsp;<a href="https://aws.amazon.com/connect/contact-lens/">webpage</a>.</p>
  ec959186bd6ace4908f2718b28879ac7:
    id: ec959186bd6ace4908f2718b28879ac7
    title: AWS Management Console now displays Account Name on the Navigation bar
      for easier account identification
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/console-displays-account-name-on-nav-bar
    published: '2026-02-03'
    summary: <p>Today, AWS announces the general availability of displaying account
      name in AWS Management Console across all Public Regions. AWS customers now
      have an easy way to identify their accounts at a glance. Users can now quickly
      distinguish between accounts visually using the account name that appears in
      the navigation bar for all authorized users in that account.<br /> <br /> AWS
      customers manage multiple accounts to separate their workloads, such as maintaining
      distinct accounts for development and production environments or for different
      business units. Previously, users had to rely on account numbers to identify
      accounts. With this new feature, all authorized users can quickly identify the
      account using its name on the navigation bar.<br /> <br /> The account name
      display feature is available at no additional cost in all public AWS Regions.
      To get started, make sure your administrator has enabled the feature (visit
      our <a href="https://docs.aws.amazon.com/awsconsolehelpdocs/latest/gsg/security-iam-awsmanpol.html">managed
      policy documentation</a>) and sign in to <a href="http://console.aws.com/">AWS
      Management Console</a>.&nbsp;</p>
  945c3a9f12d14a019f1be73e20878e71:
    id: 945c3a9f12d14a019f1be73e20878e71
    title: Amazon DynamoDB global tables now support replication across multiple AWS
      accounts
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/dynamodb-gt-multi-account/
    published: '2026-02-03'
    summary: '<p>Amazon DynamoDB global tables now support replication across multiple
      AWS accounts. DynamoDB global tables is a fully managed, serverless, multi-Region,
      and multi-active database used by tens of thousands of customers to power business-critical
      applications. With this new capability, you can replicate tables across AWS
      accounts and Regions to improve resiliency, isolate workloads at the account
      level, and apply distinct security and governance controls.<br /> <br /> For
      multi-account global tables, DynamoDB automatically replicates tables across
      AWS accounts and Regions. This capability allows you to strengthen fault tolerance
      and helps ensure applications remain highly available even during account-level
      disruptions, while allowing customers to align data placement with organizational
      and security requirements. Multi-account global tables are ideal for customers
      that adopt multi-account strategies or use AWS Organizations to improve security
      isolation, enforce data perimeter guardrails, implement disaster recovery (DR),
      or separate workloads by business unit.<br /> <br /> Multi-account global tables
      is available in <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      style="cursor: pointer;" target="_blank">all AWS Regions</a> and is billed according
      to existing <a href="https://aws.amazon.com/dynamodb/pricing/" style="cursor:
      pointer;" target="_blank">global tables pricing</a>.<br /> <br /> To get started,
      see the <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html"
      style="cursor: pointer;" target="_blank">DynamoDB global tables documentation</a>,
      and visit the <a href="https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/globaltables-MultiAccount.html"
      style="cursor: pointer;" target="_blank">AWS developer guide</a> to learn more
      about the benefits of using a multi-account strategy for your AWS environment.</p>'
  7c8ead93b8cc7eea17e54a9f44c1826e:
    id: 7c8ead93b8cc7eea17e54a9f44c1826e
    title: AWS Marketplace introduces localized billing for Professional Services
      from AWS EMEA
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-marketplace-localized-billing-professional/
    published: '2026-02-03'
    summary: <p>AWS Marketplace now offers a more localized experience for Europe,
      Middle East, and Africa (EMEA) customers purchasing Professional Service solutions
      via AWS EMEA Marketplace Operator.<br /> <br /> Customers can now procure Professional
      Services using localized payment methods and receive invoices from AWS EMEA.
      This removes previous procurement barriers caused by complex payment remittance
      processes between different AWS entities, which made it difficult for EMEA customers
      to purchase Professional Services through AWS Marketplace.<br /> <br /> Key
      benefits include support for SEPA (Single Euro Payment Area) payment methods
      and invoicing consistency from the same AWS entity covering all AWS Marketplace
      purchases via AWS EMEA Marketplace Operator. This capability is ideal for EMEA
      customers purchasing consulting, implementation, or managed services through
      AWS Marketplace. It also benefits organizations that prefer local payment methods
      such as SEPA direct debit, want to consolidate AWS and Marketplace billing,
      or are seeking a simpler procurement experience for Professional Services.<br
      /> <br /> This capability is available for EMEA customers who purchase professional
      services solutions in AWS Marketplace, with AWS EMEA as the Marketplace Operator.
      To learn more about purchasing Professional Services products in AWS Marketplace
      and receive invoices issued by AWS EMEA, visit the <a href="https://docs.aws.amazon.com/marketplace/latest/buyerguide/buyer-proserv-products.html">AWS
      Marketplace Buyer Guide</a> and <a href="https://aws.amazon.com/legal/aws-emea/">AWS
      EMEA Marketplace FAQs</a>. For more information on how to add a bank account
      for SEPA, see <a href="https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-debit-emea.html">Managing
      Your SEPA Direct Debit Payment Method</a> in the <a href="https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-what-is.html">AWS
      Billing and Cost Management user guide</a>.&nbsp;</p>
  d2d6723f45113e51adc7c91201f4bfad:
    id: d2d6723f45113e51adc7c91201f4bfad
    title: Amazon RDS now provides an enhanced console experience to connect to a
      database
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-rds-provides-enhanced-console-experience
    published: '2026-02-03'
    summary: <p>Amazon RDS now provides an enhanced console experience that consolidates
      and provides all relevant information needed to connect to a database in one
      place, making it easier to connect to your RDS databases.<br /> <br /> The new
      console experience provides ready-made code snippets for Java, Python, Node.js
      and other programming languages as well as tools like the psql command line
      utility. These code snippets are automatically adjusted based on your database's
      authentication settings. For example, if your cluster uses IAM authentication,
      the generated code snippets will use token-based authentication to connect to
      the database. The console experience also includes integrated CloudShell access,
      offering the ability to connect to your databases directly from within the RDS
      console.<br /> <br /> This feature is available for Amazon Aurora PostgreSQL,
      Amazon Aurora MySQL, Amazon RDS for PostgreSQL, Amazon RDS for MySQL, Amazon
      RDS for MariaDB database engines across <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">all commercial AWS Regions.</a><br /> <br /> Get started with
      the new console experience for database connectivity through the <a href="https://console.aws.amazon.com/rds/home"
      target="_blank">Amazon RDS Console</a>. To learn more, see the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html"
      target="_blank">Amazon RDS </a>and <a href="https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html"
      target="_blank">Aurora </a>user guide</p>
  7d5262e7ea511fe40b1d5f89f0c45f00:
    id: 7d5262e7ea511fe40b1d5f89f0c45f00
    title: Amazon Aurora DSQL now supports indexes on the NUMERIC data type
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-aurora-dsql-indexes-numeric-data-type/
    published: '2026-02-03'
    summary: <p><a href="https://aws.amazon.com/rds/aurora/dsql/">Amazon Aurora DSQL</a>&nbsp;now
      supports index creation on NUMERIC data types. With this enhancement, you can
      now use NUMERIC columns in both primary keys and secondary indexes, which can
      improve query performance for workloads that rely on high-precision values such
      as currency amounts, measurements and statistical data.<br /> <br /> </p>
  20189d28e45b40de89888f443e24d939:
    id: 20189d28e45b40de89888f443e24d939
    title: Amazon Quick Suite Enables Easy Resolution of Ambiguous Map Locations
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/quick-ambiguous-locations-resolution
    published: '2026-02-03'
    summary: '<p><a href="https://aws.amazon.com/quick/quicksight/" target="_blank">Quick
      Sight in Amazon Quick Suite</a> now enables authors to resolve or update ambiguous
      locations directly on map visuals for accurate geographical data visualization.
      When Quick Suite encounters location names that exist in multiple regions—such
      as cities like Springfield or Abbeville that appear in multiple U.S. states—users
      can now explicitly define the correct geographical context through three resolution
      methods: adding supporting geospatial fields to create location hierarchies,
      searching for specific locations from Quick Suite''s geographical database,
      or entering exact latitude and longitude coordinates for precise positioning.<br
      /> <br /> These enhancements address visualization accuracy needs for organizations
      working with datasets containing common location names that could refer to multiple
      places. With location mapping, dashboard authors can ensure their geospatial
      visuals correctly represent their data''s geographical context, leading to more
      reliable insights. The feature provides clear status tracking with Unmatched,
      Matched, and Unused location indicators, helping users understand and manage
      their location mappings effectively. Users can resolve ambiguous locations directly
      from map visuals by selecting "Resolve now" or accessing "Geo data match" options.<br
      /> <br /> This feature is now available in all Amazon Quick Suite&nbsp;<a href="https://docs.aws.amazon.com/quicksuite/latest/userguide/regions.html"
      target="_blank">regions where Quick Sight is supported.</a>&nbsp;Discover how
      to&nbsp;<a href="https://docs.aws.amazon.com/quicksuite/latest/userguide/geospatial-charts.html"
      target="_blank">create maps and geospatial charts</a>&nbsp;in Quick Suite and
      learn more about this new feature in&nbsp;<a href="https://aws.amazon.com/blogs/business-intelligence/ambiguous-location-mapping-for-map-visuals-in-amazon-quick-sight/"
      target="_blank">our blog post</a>.</p>'
  18f92c642dd7bebeb8fcae54b83da04b:
    id: 18f92c642dd7bebeb8fcae54b83da04b
    title: Oracle Database@AWS is now available in the Canada Central and Sydney AWS
      Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/oracle-database-aws-available-canada-central-sydney-aws-regions
    published: '2026-02-03'
    summary: '<p>Oracle Database@AWS is now available in two additional AWS Regions:
      CA-Central-1 (Canada Central) and AP-Southeast-2 (Sydney), starting with one
      Availability Zone (AZ) in each Region. Oracle Database@AWS enables you to access
      database services on Oracle Cloud Infrastructure (OCI) managed Oracle Exadata
      systems within AWS data centers. As a result, customers can easily migrate their
      on-premises Oracle Exadata and Oracle Real Application Clusters (RAC) applications
      to a like-for-like environment on AWS, and also benefit from integrations with
      AWS services such as AWS Key Management Service (KMS) for data encryption and
      AWS CloudWatch for monitoring. With expansion to the Canada Central and Sydney
      Regions, customers with data residency requirements in Canada and Australia
      can migrate their on-premises Oracle Exadata and RAC applications to AWS.<br
      /> <br /> With this expansion, Oracle Database@AWS services are now available
      in seven Regions: US-East-1 (N. Virginia), US-West-2 (Oregon), US-East-2 (Ohio),
      EU-Central-1 (Frankfurt), AP-Northeast-1 (Tokyo), CA-Central-1 (Canada Central)
      and AP-Southeast-2 (Sydney). To use Oracle Database@AWS services, request a
      <a href="https://aws.amazon.com/marketplace/pp/prodview-qks5dl3hr7nfw?sr=0-1&amp;ref_=beagle&amp;applicationId=AWSMPContessa"
      target="_blank"><u>private offer from Oracle through the AWS Marketplace</u></a>,
      and use AWS Management Console to setup and use your databases.<br /> <br />
      To learn more, visit Oracle Database@AWS <a href="https://aws.amazon.com/marketplace/featured-seller/oracle"
      target="_blank">overview </a>and <a href="https://docs.aws.amazon.com/odb/latest/UserGuide/getting-started.html"
      target="_blank"><u>documentation</u></a>.</p>'
  473ee5f1b614e41a713bb4f6138f8082:
    id: 473ee5f1b614e41a713bb4f6138f8082
    title: AWS Batch now provides Array Job Status Summary in ListJobs API
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-batch-array-job-status-summary/
    published: '2026-02-03'
    summary: '<p>AWS Batch now includes a status summary for Array Jobs in the ListJobs
      API response, giving you immediate visibility into the distribution of child
      job statuses without additional API calls. This enhancement helps you monitor
      large-scale workloads more efficiently.<br /> <br /> When you call the <i>ListJobs</i>
      API for Array Jobs, the response now includes a <i>statusSummary</i> field that
      shows the count of child jobs in each state: SUBMITTED, PENDING, RUNNABLE, STARTING,
      RUNNING, SUCCEEDED, and FAILED. Previously,&nbsp;<i>statusSummary</i> field
      was only available in the response of <i>DescribeJobs</i> API call. Using the
      new field you can now monitor the progress of multiple array jobs in your queue
      with a single API call.. The response also includes a <i>statusSummaryLastUpdatedAt</i>
      timestamp, allowing you to assess the freshness of the status information. This
      transparency helps you make informed decisions about your workload management
      and troubleshooting.<br /> <br /> This feature is particularly valuable for
      high-scale batch processing workloads in financial services, automotive, and
      other industries where monitoring thousands of parallel jobs is critical for
      operational visibility. Available today in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> where AWS Batch is available. For more information, see the ListJobs
      API page in <a href="https://docs.aws.amazon.com/batch/latest/APIReference/API_ListJobs.html">AWS
      Batch API Reference</a>.</p>'
