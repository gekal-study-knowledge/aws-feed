  4ec55dffd0d3b03ccbdc40611425c4b6:
    id: 4ec55dffd0d3b03ccbdc40611425c4b6
    title: Amazon WorkSpaces Core announces monthly pricing for managed instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/1/amazon-workspaces-core-managed-instances-flexible-billing/
    published: '2026-01-26'
    summary: <p>AWS is announcing flexible billing for Amazon WorkSpaces Core managed
      instances, adding monthly flat-rate pricing alongside existing hourly billing.
      Customers can now choose the optimal pricing model based on their end user usage
      patterns. Monthly billing is ideal for predictable full-time desktops and hourly
      billing is ideal for variable usage patterns. Both options are pay-as-you-go
      with no long-term commitments.<br /> <br /> Amazon WorkSpaces Core managed instances
      simplifies virtual desktop infrastructure (VDI) migrations with highly customizable
      instance configurations. WorkSpaces Core managed instances provisions resources
      in your AWS account, handling infrastructure lifecycle management for both persistent
      and non-persistent workloads. Monthly pricing delivers savings vs hourly billing
      at always-on utilization, optimized for real-world VDI use cases.<br /> <br
      /> With flexible billing, customers benefit from predictable costs for persistent
      desktop workloads and the flexibility to mix hourly and monthly billing within
      the same deployment. VDI partners utilizing WorkSpaces Core managed instances
      including <b>Citrix</b>, <b>Workspot</b>, <b>Dizzion</b>, and <b>Leostream</b>
      can now integrate with new WorkSpaces API billing features to enable the monthly
      billing option when instances are created. Hourly billing remains the default
      billing option for managed instances.<br /> <br /> In addition, starting today,
      hourly utility rates for WorkSpaces Core managed instances will now be combined
      and billed by Amazon WorkSpaces to simplify pricing. Previously, hourly rates
      were split between Amazon EC2 and Amazon WorkSpaces on customer bills. There
      is no change to the effective rates for on-demand hourly usage of WorkSpaces
      Core Managed Instances with this announcement.<br /> <br /> To learn more about
      Amazon WorkSpaces Core managed instances flexible billing, visit the <a href="https://aws.amazon.com/workspaces/vdi-partners/pricing/">WorkSpaces
      for VDI partners pricing page</a>. For more information, see the <a href="https://aws.amazon.com/workspaces/vdi-partners/">WorkSpaces
      for VDI partners product page</a>. For technical documentation, see the <a href="https://docs.aws.amazon.com/workspaces-core/">Amazon
      WorkSpaces Core Documentation</a>.</p>
  efe645b34e29cbe9b2a64dfaabe726a1:
    id: efe645b34e29cbe9b2a64dfaabe726a1
    title: AWS Transfer Family now supports Amazon FSx for NetApp ONTAP
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-transfer-family-amazon-fsx-netapp-ontap
    published: '2026-01-26'
    summary: <p>AWS Transfer Family customers can now access file system data stored
      in Amazon FSx for NetApp ONTAP over SFTP, FTPS, and FTP.&nbsp;<br /> <br />
      AWS Transfer Family provides fully managed file transfers over SFTP, FTP, FTPS,
      AS2, and web browser-based interfaces. With this launch, you can now access
      FSx for ONTAP file systems over Transfer Family’s supported protocols through
      S3 Access Points, while maintaining access via native file protocols (NFS/SMB).
      This allows you to maintain existing file system workflows while adding secure
      access via industry-standard protocols for external partners and internal users.
      Access is controlled through standard IAM policies and S3 Access Point configurations,
      helping you meet data security and compliance requirements.<br /> <br /> Transfer
      Family support for FSx for ONTAP is available in select&nbsp;<a href="https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/accessing-data-via-s3-access-points.html#access-points-for-fsx-ontap-supported-regions"
      target="_blank">AWS Regions</a>.&nbsp;To get started, visit the AWS Transfer
      Family console, or use AWS CLI/SDK.&nbsp;To learn more, visit the Transfer Family&nbsp;<a
      href="https://docs.aws.amazon.com/transfer/latest/userguide/fsx-s3-access-points.html"
      target="_blank">User Guide</a>.</p>
