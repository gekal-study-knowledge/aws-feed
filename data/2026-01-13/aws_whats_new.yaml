    title: Amazon MSK Connect is now available in three additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-msk-connect-additional-aws-regions
    published: '2026-01-13'
    summary: '<p>Amazon MSK Connect is now available in three additional AWS Regions:
      Asia Pacific (New Zealand), AWS GovCloud (US-East), and AWS GovCloud (US-West).<br
      /> <br /> MSK Connect enables you to run fully managed Kafka Connect clusters
      with Amazon Managed Streaming for Apache Kafka (Amazon MSK). With a few clicks,
      MSK Connect allows you to easily deploy, monitor, and scale connectors that
      move data in and out of Apache Kafka and Amazon MSK clusters from external systems
      such as databases, file systems, and search indices. MSK Connect eliminates
      the need to provision and maintain cluster infrastructure. Connectors scale
      automatically in response to increases in usage and you pay only for the resources
      you use. With full compatibility with Kafka Connect, it is easy to migrate workloads
      without code changes. MSK Connect will support both Amazon MSK-managed and self-managed
      Apache Kafka clusters.<br /> <br /> You can get started with MSK Connect from
      the Amazon MSK console or the Amazon CLI. With this launch, MSK Connect is now
      available in thirty eight AWS Regions. To get started visit, the MSK Connect
      <a href="https://aws.amazon.com/msk/features/msk-connect/" target="_blank">product
      page</a>, <a href="https://aws.amazon.com/msk/pricing/" target="_blank">pricing
      page</a>, and the <a href="https://docs.aws.amazon.com/msk/latest/developerguide/msk-connect.html"
      target="_blank">Amazon MSK Developer Guide</a>.</p>'
