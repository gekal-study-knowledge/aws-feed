  f3fc9510e2d4e030842226277bf507e6:
    id: f3fc9510e2d4e030842226277bf507e6
    title: Amazon EC2 M8i-flex instances are now available in additional AWS regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-m8i-flex-instances-FRA-ICN-KUL-NRT-SIN-YUL-region/
    published: '2026-02-19'
    summary: <p>Starting today, Amazon EC2 M8i-flex instances are now available in
      Asia Pacific (Malaysia, Seoul, Singapore, Tokyo), Europe (Frankfurt) and Canada
      (Central) regions. These instances are powered by custom Intel Xeon 6 processors,
      available only on AWS, delivering the highest performance and fastest memory
      bandwidth among comparable Intel processors in the cloud. The M8i-flex instances
      offer up to 15% better price-performance, and 2.5x more memory bandwidth compared
      to previous generation Intel-based instances. They deliver up to 20% better
      performance than M7i-flex instances, with even higher gains for specific workloads.
      The M8i-flex instances are up to 30% faster for PostgreSQL databases, up to
      60% faster for NGINX web applications, and up to 40% faster for AI deep learning
      recommendation models compared to M7i-flex instances.<br /> <br /> M8i-flex
      instances are the easiest way to get price performance benefits for a majority
      of general-purpose workloads like web and application servers, microservices,
      small and medium data stores, virtual desktops, and enterprise applications.
      They offer the most common sizes, from large to 16xlarge, and are a great first
      choice for applications that don't fully utilize all compute resources.<br />
      <br /> To get started, sign in to the <a href="https://aws.amazon.com/console/"
      target="_blank">AWS Management Console</a>. For more information about the <a
      href="https://aws.amazon.com/ec2/instance-types/m8i/" target="_blank">M8i-flex
      </a>instances visit the AWS News <a href="https://aws.amazon.com/blogs/aws/new-general-purpose-amazon-ec2-m8i-and-m8i-flex-instances-are-now-available/"
      target="_blank">blog</a>.</p>
  5469506522e302cdb245e40682648e1c:
    id: 5469506522e302cdb245e40682648e1c
    title: Aurora DSQL launches new Go, Python, and Node.js connectors that simplify
      IAM authentication
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aurora-dsql-launches-go-python-nodejs-connectors
    published: '2026-02-19'
    summary: <p>Today we are announcing the release of Aurora DSQL Connectors for
      Go (pgx), Python (asyncpg), and Node.js (WebSocket for Postgres.js) that simplify
      IAM authentication for customers using standard PostgreSQL drivers to connect
      to Aurora DSQL clusters. These connectors act as transparent authentication
      layers that automatically handle IAM token generation, eliminating the need
      to write token generation code or manually supply IAM tokens. Tokens are automatically
      generated for each connection, ensuring valid tokens are always used while maintaining
      full compatibility with existing PostgreSQL driver features. The Postgres.js
      connector additionally supports WebSocket protocol, enabling customers to connect
      to DSQL clusters in environments where TCP connections are not available.<br
      /> <br /> These connectors streamline authentication and eliminate security
      risks associated with traditional user-generated passwords. All three connectors
      support custom IAM credential providers, giving customers flexibility in how
      they manage their AWS credentials.<br /> <br /> To get started, visit the <a
      href="https://docs.aws.amazon.com/aurora-dsql/latest/userguide/SECTION_connectors.html">Connectors
      for Aurora DSQL documentation</a> page. For code examples, visit our Github
      page for <a href="https://github.com/awslabs/aurora-dsql-connectors/tree/main/go/pgx">pgx
      for Go</a>, <a href="https://github.com/awslabs/aurora-dsql-connectors/tree/main/python/connector">asyncpg
      for Python</a>, and <a href="https://github.com/awslabs/aurora-dsql-connectors/tree/main/node/postgres-js">Websocket
      for Postgres.js</a>. Get started with Aurora DSQL for free with the <a href="https://aws.amazon.com/free/?all-free-tier.sort-by=item.additionalFields.SortRank&amp;all-free-tier.sort-order=asc&amp;awsf.Free%20Tier%20Types=*all&amp;awsf.Free%20Tier%20Categories=categories%23databases">AWS
      Free Tier</a>. To learn more about Aurora DSQL, visit the <a href="https://aws.amazon.com/rds/aurora/dsql/">webpage</a>.</p>
  a42c1fa9ae8b22bccfa890a65e5fe62b:
    id: a42c1fa9ae8b22bccfa890a65e5fe62b
    title: Amazon MQ now supports ActiveMQ minor version 5.19
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-mq-activemq-5-19/
    published: '2026-02-19'
    summary: "<p>Amazon MQ now supports ActiveMQ minor version 5.19, which introduces\
      \ several improvements and fixes compared to the previous version of ActiveMQ\
      \ supported by Amazon MQ. Amazon MQ manages the patch version upgrades for your\
      \ brokers. All brokers on ActiveMQ version 5.19 will be automatically upgraded\
      \ to the next compatible and secure patch version in your scheduled maintenance\
      \ window.</p> \n<p>If you are utilizing prior versions of ActiveMQ, such as\
      \ 5.18, we strongly recommend you to upgrade to ActiveMQ 5.19. You can easily\
      \ perform this upgrade with just a few clicks in the AWS Management Console.\
      \ To learn more about upgrading, consult the <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/activemq-version-management.html\"\
      \ target=\"_blank\">ActiveMQ Version Management section </a>in the Amazon MQ\
      \ Developer Guide. To learn more about the changes in ActiveMQ 5.19, see the\
      \ <a href=\"https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-release-notes.html\"\
      \ target=\"_blank\">Amazon MQ release notes</a>. This version is available across\
      \ all <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      \ target=\"_blank\">AWS Regions</a> where Amazon MQ is available.</p>"
  806e987cc76aebe0580ad0c01585d977:
    id: 806e987cc76aebe0580ad0c01585d977
    title: Amazon SNS now supports sending SMS in additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-sns-sms-region-expansion
    published: '2026-02-19'
    summary: "<div class=\"wn-body\">\n <p>Customers that use <a target=\"_blank\"\
      ></a><a href=\"https://aws.amazon.com/sns/\">Amazon Simple Notification Service\
      \ (Amazon SNS)</a> in the Asia Pacific (New Zealand) and Asia Pacific (Taipei)\
      \ Regions can now send text messages (SMS) to subscribers in more than 200 countries\
      \ and territories.<br /> </p> \n <p>Amazon SNS is a fully managed pub/sub messaging\
      \ service that enables message delivery to multiple endpoints including AWS\
      \ Lambda, Amazon SQS, Amazon Data Firehose, mobile devices, and email. With\
      \ this launch, customers using SNS in these Regions can send SMS messages via\
      \ AWS End User Messaging. Amazon SNS now supports the ability to send SMS in\
      \ 32 AWS Regions.<br /> <br /> More information:<br /> </p> \n <ul> \n  <li>To\
      \ learn more about sending SMS messages with SNS, visit <a target=\"_blank\"\
      ></a><a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-mobile-phone-number-as-subscriber.html\"\
      >Mobile text messaging with Amazon SNS</a>.</li> \n  <li>For the list of supported\
      \ countries and regions, visit <a href=\"https://docs.aws.amazon.com/sms-voice/latest/userguide/phone-numbers-sms-by-country.html\"\
      >Supported countries and regions</a>.</li> \n </ul> \n</div>"
  548be9e1690f342b6dae0b84685e2a2d:
    id: 548be9e1690f342b6dae0b84685e2a2d
    title: Amazon EC2 G7e instances now available in Asia Pacific (Tokyo) region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-g7e-instances-tokyo-region/
    published: '2026-02-19'
    summary: "<p>Starting today, Amazon EC2 G7e instances accelerated by NVIDIA RTX\
      \ PRO 6000 Blackwell Server Edition GPUs are now available in &nbsp;Asia Pacific\
      \ (Tokyo) region. G7e instances offer up to 2.3x inference performance compared\
      \ to G6e.</p> \n<p>Customers can use G7e instances to deploy large language\
      \ models (LLMs), agentic AI models, multimodal generative AI models, and physical\
      \ AI models. G7e instances offer the highest performance for spatial computing\
      \ workloads as well as workloads that require both graphics and AI processing\
      \ capabilities. G7e instances feature up to 8 NVIDIA RTX PRO 6000 Blackwell\
      \ Server Edition GPUs, with 96 GB of memory per GPU, and 5th Generation Intel\
      \ Xeon processors. They support up to 192 virtual CPUs (vCPUs) and up to 1600\
      \ Gbps of networking bandwidth. G7e instances support NVIDIA GPUDirect Peer\
      \ to Peer (P2P) that boosts performance for multi-GPU workloads. Multi-GPU G7e\
      \ instances also support NVIDIA GPUDirect Remote Direct Memory Access (RDMA)\
      \ with EFA in EC2 UltraClusters, reducing latency for small-scale multi-node\
      \ workloads.</p> \n<p>You can use G7e instances for Amazon EC2 in the following\
      \ AWS Regions: US West (Oregon), US East (N. Virginia, Ohio) and Asia Pacific\
      \ (Tokyo). You can purchase G7e instances as On-Demand Instances, Spot Instances,\
      \ or as part of Savings Plans.</p> \n<p>To get started, visit the&nbsp;<a href=\"\
      https://console.aws.amazon.com/\">AWS Management Console</a>,&nbsp;<a href=\"\
      https://aws.amazon.com/cli/\">AWS Command Line Interface</a>&nbsp;(CLI), and\
      \ AWS SDKs. To learn more, visit&nbsp;<a href=\"https://aws.amazon.com/ec2/instance-types/g7e/\"\
      >G7e instances</a>.</p>"
  2274006d2e09d46ea3f347dbd3db7a12:
    id: 2274006d2e09d46ea3f347dbd3db7a12
    title: AWS IAM Identity Center is now available in the Asia Pacific (New Zealand)
      AWS Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-iam-identity-center-asia-pacific-new-zealand-region/
    published: '2026-02-19'
    summary: <p>You can now deploy AWS IAM Identity Center in 38 AWS Regions, including
      Asia Pacific (New Zealand).<br /> <br /> IAM Identity Center is the recommended
      service for managing workforce access to AWS applications. It enables you to
      connect your existing source of workforce identities to AWS once and offer your
      users single sign on experience across AWS. It powers the personalized experiences
      offered by AWS applications, such as Amazon Q, and the ability to define and
      audit user-aware access to data in AWS services, such as Amazon Redshift. It
      can also help you manage access to multiple AWS accounts from a central place.
      IAM Identity Center is available at no additional cost in these&nbsp;<a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a>.<br /> <br /> To learn more about IAM Identity Center,&nbsp;<a href="https://aws.amazon.com/iam/identity-center/">visit
      the product detail page</a>. To get started, see the&nbsp;<a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">IAM
      Identity Center user guide</a>.</p>
