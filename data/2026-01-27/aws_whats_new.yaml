  f415e484818abd717a37104dcc401226:
    id: f415e484818abd717a37104dcc401226
    title: AWS Marketplace expands AMI self-service listing experience to FPGA products
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-marketplace-expands-ami-self-service-listing-experience-to-fpga-products
    published: '2026-01-27'
    summary: <p>AWS Marketplace now offers a self-service listing experience for sellers
      listing Amazon Machine Image (AMI) products with FPGA (Field Programmable Gate
      Array) images. This new capability eliminates the previous dependency on manual
      Product Load Forms and accelerates time-to-market for AWS partners that offer
      specialized hardware accelerators using FPGA technology on supported Amazon
      F2 instance types.<br /> <br /> With this launch, sellers can now create and
      manage AMIs with Amazon FPGA images using a new UI experience or programmatically
      through the AWS Marketplace Catalog API. During listing creation, sellers are
      guided through a step-by-step workflow to fill in required information about
      their listings including up to 15 Amazon FPGA images. The self-service experience
      includes comprehensive inline validation and error messages to help sellers
      identify and resolve configuration issues before submission, streamlining the
      publishing process and improving speed to market.<br /> <br /> To learn more,
      see the <a href="https://docs.aws.amazon.com/marketplace/latest/userguide/ami-getting-started.html#ami-fpga-products">AWS
      Marketplace Seller Guide</a> and the AWS Marketplace <a href="https://docs.aws.amazon.com/marketplace/latest/APIReference/work-with-single-ami-products.html">Catalog
      API guide</a>. To get started, visit the server <a href="https://aws.amazon.com/marketplace/management/products/server?refid=a1eab8e1-44df-4b59-97a0-7f429e638b4b">product
      page</a> in the AWS Marketplace Management Portal.</p>
  a4efcf926bac758cdf6a0f9564c60d23:
    id: a4efcf926bac758cdf6a0f9564c60d23
    title: Amazon WorkSpaces announces advanced printer redirection
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-workspaces-advanced-printer-redirection/
    published: '2026-01-27'
    summary: "<p>AWS announces advanced printer redirection for Amazon WorkSpaces\
      \ Personal, enabling Windows users to access the full feature set of their printers\
      \ from their virtual desktop environments. With this feature, customers can\
      \ now use printer-specific capabilities such as double-sided printing, paper\
      \ tray selection, finishing options (stapling, hole-punching), and color management\
      \ directly from their Windows WorkSpaces.</p> \n<p>Advanced printer redirection\
      \ addresses the need for specialized printing features that require printer-specific\
      \ drivers rather than generic drivers. This capability is ideal for organizations\
      \ with users who need advanced printing features for professional documents,\
      \ labels, or specialized output. The feature includes configurable driver validation\
      \ modes (exact match, partial match, or name-only matching) to balance compatibility\
      \ with feature support, allowing administrators to optimize for their specific\
      \ environment. When matching drivers are not found, WorkSpaces automatically\
      \ falls back to basic printing mode, ensuring users can always print.</p> \n\
      <p>This feature is available in all AWS Regions where Amazon WorkSpaces Personal\
      \ is offered. Advanced printer redirection is supported on Windows WorkSpaces\
      \ with Windows clients only, and requires WorkSpaces Agent version 2.2.0.2116\
      \ or later and Windows client version 5.31 or later. Matching printer drivers\
      \ must be installed on both the WorkSpace and the client device.</p> \n<p>For\
      \ more information about advanced printer redirection in Amazon WorkSpaces,\
      \ see <a href=\"https://docs.aws.amazon.com/workspaces/latest/adminguide/group_policy.html\"\
      \ target=\"_blank\">Configure Printer Support for DCV</a> in the Amazon WorkSpaces\
      \ Administration Guide, or visit the <a href=\"https://aws.amazon.com/workspaces-family/workspaces/\"\
      \ target=\"_blank\">Amazon WorkSpaces</a> page to learn more about virtual desktop\
      \ solutions from AWS.</p>"
  b7351fc6593b493bc28499ae1577294e:
    id: b7351fc6593b493bc28499ae1577294e
    title: AWS Network Firewall now supports GenAI traffic visibility and enforcement
      with Web category-based filtering
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-network-firewall-web-category-based-filtering
    published: '2026-01-27'
    summary: <p>AWS Network Firewall now provides visibility into generative AI (GenAI)
      application traffic and supports traffic filtering based on web categories.
      This new capability simplifies governance by enabling you to identify and control
      access to GenAI services, social media platforms, streaming sites, and other
      web categories directly within your firewall rules using pre-defined URL categories.<br
      /> <br /> This approach of inspecting traffic based on URL categories helps
      security and compliance teams enforce consistent policies across their AWS environments
      while providing visibility into usage of emerging technologies like GenAI. You
      can now easily block access to inappropriate or high-risk domains, restrict
      GenAI tool usage to approved services, and meet regulatory requirements—all
      while reducing operational overhead. When combined with AWS Network Firewall's
      TLS inspection feature, you can inspect the full URL path using category-based
      rules for even more granular control.<br /> <br /> This feature is available
      in all AWS commercial regions where AWS Network Firewall is supported.<br />
      <br /> To learn more about URL category filtering in AWS Network Firewall, visit
      AWS Network Firewall <a href="https://aws.amazon.com/network-firewall/" target="_blank">product
      page</a> and service <a href="https://docs.aws.amazon.com/network-firewall/"
      target="_blank">documentation</a>. You can get started by updating your stateful
      rule groups in the AWS Management Console, AWS CLI, or AWS SDKs.&nbsp;<a href="https://aws.amazon.com"
      target="_blank"></a></p>
