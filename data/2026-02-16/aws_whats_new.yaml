  d1ba0e30634e68061ccf41b1eb9068ca:
    id: d1ba0e30634e68061ccf41b1eb9068ca
    title: Amazon EC2 supports nested virtualization on virtual Amazon EC2 instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-nested-virtualization-on-virtual
    published: '2026-02-16'
    summary: "<p>Starting today, customers can create nested environments within virtualized\
      \ Amazon EC2 instances. Previously, customers could only create and manage virtual\
      \ machines inside bare metal EC2 instances. With this launch, customers can\
      \ create nested virtual machines by running KVM or Hyper-V on virtual EC2 instances.\
      \ Customers can leverage this capability for use cases such as running emulators\
      \ for mobile applications, simulating in-vehicle hardware for automobiles, and\
      \ running Windows Subsystem for Linux on Windows workstations.</p> \n<p>&nbsp;</p>"
  4484b456b0440bc650b7e32933b9a84c:
    id: 4484b456b0440bc650b7e32933b9a84c
    title: Announcing Amazon DocumentDB long-term support (LTS) on 5.0
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/announcing-amazon-documentdb-5-0-long-term-support
    published: '2026-02-16'
    summary: '<p>Starting today, Amazon DocumentDB (with MongoDB compatibility) offers
      Long-Term Support (LTS) on DocumentDB 5.0, enabling customers to reduce database
      upgrade frequency and maintenance overhead. LTS versions will receive only critical
      stability and security patches without introducing new features.<br /> <br />
      To get started, create a new DocumentDB cluster engine version 5.0.0, or patch
      your existing engine version 5.0.0 cluster during your next maintenance window.
      Verify you''re running the required Engine Patch Version by connecting to your
      cluster and running&nbsp;db.runCommand({getEngineVersion: 1})<b>.</b>&nbsp;Ensure
      you''re running Engine Patch Version 3.0.17983 or later.<br /> <br /> This LTS
      release is available in all Amazon Web Services regions where DocumentDB is
      offered.&nbsp;For more details about DocumentDB LTS, and how to check to see
      what engine patch version you’re on, refer to the <a href="https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-lts-release.html"
      target="_blank">Long-Term Support (LTS) release for Amazon DocumentDB</a>.</p>'
  9ed01f7fe1c17df5daddf5ac60c9706b:
    id: 9ed01f7fe1c17df5daddf5ac60c9706b
    title: AWS Backup announces PrivateLink support for SAP HANA on AWS
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-backup-announces-privatelink-sap-hana-aws/
    published: '2026-02-16'
    summary: "<p>AWS Backup now supports AWS PrivateLink for SAP HANA systems running\
      \ on Amazon EC2. This enables customers to route all backup traffic through\
      \ private network connections without traversing the public internet, helping\
      \ organizations meet security and compliance requirements for regulated workloads.</p>\
      \ \n<p>Customers in regulated industries such as financial services, healthcare,\
      \ and government agencies often require that all traffic remain on private networks.\
      \ Previously, while SAP HANA application workloads could use AWS PrivateLink\
      \ for secure, private communication with AWS services, backup traffic to AWS\
      \ Backup had to traverse public endpoints. With this release, you can now use\
      \ AWS PrivateLink for AWS Backup storage endpoints, ensuring your SAP HANA workloads\
      \ on EC2 maintain end-to-end private connectivity for both application traffic\
      \ and backup data. This helps organizations subject to HIPAA, EU/US Privacy\
      \ Shield, and PCI DSS regulations implement fully private data protection strategies.</p>\
      \ \n<p>This feature is available in all AWS Regions where AWS Backup supports\
      \ SAP HANA databases on EC2. To get started, <a href=\"https://docs.aws.amazon.com/sap/latest/sap-hana/aws-backint-agent-backup.html#backint-backup-install\"\
      >update your Backint agent</a> and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-network.html\"\
      >add the backup-storage VPCE to your VPC</a>.</p>"
  ebbba7820d8b5fcdf70960323654b67f:
    id: ebbba7820d8b5fcdf70960323654b67f
    title: AWS HealthImaging launches additional metrics for monitoring data stores
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-healthimaging-additional-metrics/
    published: '2026-02-16'
    summary: '<p>AWS HealthImaging has launched additional metrics through <a href="https://docs.aws.amazon.com/cloudwatch/">Amazon
      CloudWatch</a> that enable monitoring storage at the account and data store
      levels. These new metrics help customers better understand their medical imaging
      storage and growth trends over time.<br /> <br /> HealthImaging now provides
      customers with granular CloudWatch metrics to monitor their data stores. Customers
      can track storage by volume, number of image sets, and the number of DICOM studies,
      series, and instances. These metrics provide the insights needed to manage both
      single-tenant and multi-tenant workloads at petabyte scale.&nbsp;To learn more,
      visit&nbsp;<a href="https://docs.aws.amazon.com/healthimaging/latest/devguide/monitoring-cloudwatch.html">Using
      Amazon CloudWatch with HealthImaging</a>.<br /> <br /> AWS HealthImaging is
      a HIPAA-eligible service that empowers healthcare providers and their software
      partners to store, analyze, and share medical images. AWS HealthImaging is generally
      available in the following&nbsp;<a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a>: US East (N. Virginia), US West (Oregon), Asia Pacific (Sydney),
      and Europe (Ireland).</p>'
  e8e9da3102dc6d5ae424d371ca4ec105:
    id: e8e9da3102dc6d5ae424d371ca4ec105
    title: Announcing new high performance computing Amazon EC2 Hpc8a instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/announcing-amazon-ec2-hpc8a-instances/
    published: '2026-02-16'
    summary: <p>AWS announces Amazon EC2 Hpc8a instances, the next generation of high
      performance computing optimized instance, powered by 5th Gen AMD EPYC processors
      (formerly code named Turin). With a maximum frequency of 4.5GHz, Hpc8a instances
      deliver up to 40% higher performance and up to 25% better price performance
      compared to Hpc7a instances, helping customers accelerate compute-intensive
      workloads while optimizing costs.<br /> <br /> <br /> Built on the latest sixth-generation
      <a href="https://aws.amazon.com/ec2/nitro/">AWS Nitro Cards</a>, Hpc8a instances
      are designed for compute-intensive, latency-sensitive HPC workloads. They are
      ideal for tightly coupled applications such as computational fluid dynamics
      (CFD), weather forecasting, explicit finite element analysis (FEA), and multiphysics
      simulations that require fast inter-node communication and consistent high performance.<br
      /> <br /> Hpc8a instances feature 192 cores, 768 GiB memory and 300 Gbps of
      Elastic Fabric Adapter (EFA) network bandwidth, enabling fast, low-latency cluster
      scaling for large-scale HPC workloads. Compared to Hpc7a instances, Hpc8a instances
      also provide up to 42% higher memory bandwidth, further improving performance
      for memory-intensive simulations and scientific computing workloads.<br /> <br
      /> Hpc8a instances are available today in US East (Ohio) and Europe (Stockholm).
      Customers can purchase Hpc8a instances via Savings Plans or On-Demand instances.
      To get started, sign in to the <a href="https://console.aws.amazon.com/ec2/?trk=d8ec3b19-0f37-4f8c-8c12-189f913e205c&amp;sc_channel=el">AWS
      Management Console</a>. For more information visit the <a href="https://aws.amazon.com/ec2/instance-types/hpc8a/">Amazon
      EC2 Hpc8a instance page</a> or <a href="https://aws.amazon.com/blogs/aws/amazon-ec2-hpc8a-instances-powered-by-5th-gen-amd-epyc-processors-are-now-available">AWS
      news blog</a>.</p>
  e23c393a5aedd253657723ab143cc1b5:
    id: e23c393a5aedd253657723ab143cc1b5
    title: Amazon EC2 M7i instances are now available in the Israel (Tel Aviv) Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-m7i-israel-tel-aviv-regions
    published: '2026-02-16'
    summary: '<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) M7i instances
      powered by custom 4th Gen Intel Xeon Scalable processors (code-named Sapphire
      Rapids) are available in the Israel (Tel Aviv) region. These custom processors,
      available only on AWS, offer up to 15% better performance over comparable x86-based
      Intel processors utilized by other cloud providers.<br /> <br /> M7i deliver
      up to 15% better price-performance compared to M6i. M7i instances are a great
      choice for workloads that need the largest instance sizes or continuous high
      CPU usage, such as gaming servers, CPU-based machine learning (ML), and video-streaming.
      M7i offer larger instance sizes, up to 48xlarge, and two bare metal sizes (metal-24xl,
      metal-48xl). These bare-metal sizes support built-in Intel accelerators: Data
      Streaming Accelerator, In-Memory Analytics Accelerator, and QuickAssist Technology
      that are used to facilitate efficient offload and acceleration of data operations
      and optimize performance for workloads.<br /> <br /> To learn more, visit <a
      href="https://aws.amazon.com/ec2/instance-types/m7i/">Amazon EC2 M7i Instances</a>.
      To get started, see the <a href="https://console.aws.amazon.com/">AWS Management
      Console</a>.</p>'
