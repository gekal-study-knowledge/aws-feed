  d1ba0e30634e68061ccf41b1eb9068ca:
    id: d1ba0e30634e68061ccf41b1eb9068ca
    title: Amazon EC2 supports nested virtualization on virtual Amazon EC2 instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-ec2-nested-virtualization-on-virtual
    published: '2026-02-16'
    summary: "<p>Starting today, customers can create nested environments within virtualized\
      \ Amazon EC2 instances. Previously, customers could only create and manage virtual\
      \ machines inside bare metal EC2 instances. With this launch, customers can\
      \ create nested virtual machines by running KVM or Hyper-V on virtual EC2 instances.\
      \ Customers can leverage this capability for use cases such as running emulators\
      \ for mobile applications, simulating in-vehicle hardware for automobiles, and\
      \ running Windows Subsystem for Linux on Windows workstations.</p> \n<p>&nbsp;</p>"
  4484b456b0440bc650b7e32933b9a84c:
    id: 4484b456b0440bc650b7e32933b9a84c
    title: Announcing Amazon DocumentDB long-term support (LTS) on 5.0
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/announcing-amazon-documentdb-5-0-long-term-support
    published: '2026-02-16'
    summary: '<p>Starting today, Amazon DocumentDB (with MongoDB compatibility) offers
      Long-Term Support (LTS) on DocumentDB 5.0, enabling customers to reduce database
      upgrade frequency and maintenance overhead. LTS versions will receive only critical
      stability and security patches without introducing new features.<br /> <br />
      To get started, create a new DocumentDB cluster engine version 5.0.0, or patch
      your existing engine version 5.0.0 cluster during your next maintenance window.
      Verify you''re running the required Engine Patch Version by connecting to your
      cluster and running&nbsp;db.runCommand({getEngineVersion: 1})<b>.</b>&nbsp;Ensure
      you''re running Engine Patch Version 3.0.17983 or later.<br /> <br /> This LTS
      release is available in all Amazon Web Services regions where DocumentDB is
      offered.&nbsp;For more details about DocumentDB LTS, and how to check to see
      what engine patch version you’re on, refer to the <a href="https://docs.aws.amazon.com/documentdb/latest/developerguide/docdb-lts-release.html"
      target="_blank">Long-Term Support (LTS) release for Amazon DocumentDB</a>.</p>'
  9ed01f7fe1c17df5daddf5ac60c9706b:
    id: 9ed01f7fe1c17df5daddf5ac60c9706b
    title: AWS Backup announces PrivateLink support for SAP HANA on AWS
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-backup-announces-privatelink-sap-hana-aws/
    published: '2026-02-16'
    summary: "<p>AWS Backup now supports AWS PrivateLink for SAP HANA systems running\
      \ on Amazon EC2. This enables customers to route all backup traffic through\
      \ private network connections without traversing the public internet, helping\
      \ organizations meet security and compliance requirements for regulated workloads.</p>\
      \ \n<p>Customers in regulated industries such as financial services, healthcare,\
      \ and government agencies often require that all traffic remain on private networks.\
      \ Previously, while SAP HANA application workloads could use AWS PrivateLink\
      \ for secure, private communication with AWS services, backup traffic to AWS\
      \ Backup had to traverse public endpoints. With this release, you can now use\
      \ AWS PrivateLink for AWS Backup storage endpoints, ensuring your SAP HANA workloads\
      \ on EC2 maintain end-to-end private connectivity for both application traffic\
      \ and backup data. This helps organizations subject to HIPAA, EU/US Privacy\
      \ Shield, and PCI DSS regulations implement fully private data protection strategies.</p>\
      \ \n<p>This feature is available in all AWS Regions where AWS Backup supports\
      \ SAP HANA databases on EC2. To get started, <a href=\"https://docs.aws.amazon.com/sap/latest/sap-hana/aws-backint-agent-backup.html#backint-backup-install\"\
      >update your Backint agent</a> and <a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-network.html\"\
      >add the backup-storage VPCE to your VPC</a>.</p>"
