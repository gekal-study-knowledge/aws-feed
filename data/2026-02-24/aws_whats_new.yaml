  bd6171427b7dbde34e01d548d391bbad:
    id: bd6171427b7dbde34e01d548d391bbad
    title: MediaConvert Introduces new video probe API and UI
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-mediaconvert-introduces-video-probe/
    published: '2026-02-24'
    summary: <p>Introducing Probe API, a powerful and free metadata analysis tool
      for AWS Elemental MediaConvert. Optimized for efficiency, Probe API reads header
      metadata to quickly return essential information about your media files, including
      codec specifications, pixel formats, color space details, and container information
      - all without waiting to process the actual video content. This analysis capability
      makes it an invaluable tool for content creators, developers, and media professionals
      who need to quickly validate files, automate workflows, or utilize Elementals'
      <a href="https://aws.amazon.com/about-aws/whats-new/2024/04/aws-step-functions-integration-elemental-mediaconvert/">Step
      Functions</a> to make encoding decisions based on source material characteristics.<br
      /> <br /> For complete implementation details and usage examples, please visit
      the MediaConvert API Reference <a href="https://docs.aws.amazon.com/mediaconvert/latest/apireference/probe.html">documentation</a>.
      The Probe API can be utilized in any region where AWS Elemental MediaConvert
      is available, making it a versatile tool for streamlining your media workflow
      analysis.<br /> <br /> To get started with Probe API and explore its capabilities,
      visit the AWS Elemental MediaConvert <a href="https://aws.amazon.com/mediaconvert/?trk=d097123b-f91d-4460-815b-85c3ddbefdc4&amp;sc_channel=ps&amp;ef_id=CjwKCAjwq7fABhB2EiwAwk-YbFZgrCp7TRbP_FIXu3VBaVAsYG4JL1MM-wDeMmadm4Tt25tJPkoUrhoCsIAQAvD_BwE:G:s&amp;s_kwcid=AL!4422!3!629393326030!!!g!!!16080176303!133788124518&amp;gbraid=0AAAAADjHtp-Ad-l3Fo8Kl6Sw-hu6LP8kO&amp;gclid=CjwKCAjwq7fABhB2EiwAwk-YbFZgrCp7TRbP_FIXu3VBaVAsYG4JL1MM-wDeMmadm4Tt25tJPkoUrhoCsIAQAvD_BwE">product
      page</a> or consult the <a href="https://docs.aws.amazon.com/mediaconvert/latest/ug/getting-started.html">User
      Guide</a> for comprehensive documentation.</p>
  3c61015df7faf3de8ea6ce097d1c6edf:
    id: 3c61015df7faf3de8ea6ce097d1c6edf
    title: AWS AppConfig integrates with New Relic for automated rollbacks
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-appconfig-new-relic-for-automated-rollback/
    published: '2026-02-24'
    summary: "<p>AWS AppConfig today launched a new integration that enables automated,\
      \ intelligent rollbacks during feature flag and dynamic configuration deployments\
      \ using <a></a><a href=\"https://docs.newrelic.com/docs/workflow-automation/introduction-to-workflow/\"\
      \ target=\"_blank\">New Relic Workflow Automation</a>. Building on AWS AppConfig's\
      \ third-party alert capability, this integration provides teams using <a></a><a\
      \ href=\"https://newrelic.com/\" target=\"_blank\">New Relic</a> with a solution\
      \ to automatically detect degraded application health and trigger rollbacks\
      \ in seconds, eliminating manual intervention.<br /> <br /> When you deploy\
      \ feature flags using AWS AppConfig's gradual deployment strategy, the <a></a><a\
      \ href=\"https://github.com/aws-samples/sample-aws-appconfig-tick-extn-for-newrelic\"\
      \ target=\"_blank\">AWS AppConfig New Relic Extension</a> continuously monitors\
      \ your application health against configured alert conditions. If issues are\
      \ detected during a feature flag update and deployment, such as increased error\
      \ rates or elevated latency, the New Relic Workflow automatically sends a notification\
      \ to trigger an immediate rollback, reverting the feature flag to its previous\
      \ state. This closed-loop automation reduces the time between detection and\
      \ remediation from minutes to seconds, minimizing customer impact during failed\
      \ deployments.<br /> <br /> <br /> </p> \n<p>&nbsp;</p>"
  a1d155939d2ceff14f6199451a2a177c:
    id: a1d155939d2ceff14f6199451a2a177c
    title: Amazon EKS Node Monitoring Agent is now open source
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-eks-node-monitoring-agent-open-source/
    published: '2026-02-24'
    summary: <p>Amazon Elastic Kubernetes Service (Amazon EKS) Node Monitoring Agent
      is now open source. You can access the Amazon EKS Node Monitoring Agent source
      code and contribute to its development on <a href="https://github.com/aws/eks-node-monitoring-agent"
      title="GitHub">GitHub</a>.<br /> <br /> Running workloads reliably in Kubernetes
      clusters can be challenging. Cluster administrators often have to resort to
      manual methods of monitoring and repairing degraded nodes in their clusters.
      The Amazon EKS Node Monitoring Agent simplifies this process by automatically
      monitoring and publishing node-level system, storage, networking, and accelerator
      issues as node conditions, which are used by Amazon EKS for automatic node repair.
      With the Amazon EKS Node Monitoring Agent’s source code available on GitHub,
      you now have visibility into the agent’s implementation, can customize it to
      fit your requirements, and can contribute directly to its ongoing development.<br
      /> <br /> The Amazon EKS Node Monitoring Agent is included in Amazon EKS Auto
      Mode and is available as an Amazon EKS add-on in all AWS Regions where Amazon
      EKS is available.<br /> <br /> To learn more about the Amazon EKS Node Monitoring
      Agent and node repair, visit the <a href="https://docs.aws.amazon.com/eks/latest/userguide/node-health.html">Amazon
      EKS documentation</a>.<a href="https://github.com/aws/eks-node-monitoring-agent"
      title="GitHub"></a></p>
