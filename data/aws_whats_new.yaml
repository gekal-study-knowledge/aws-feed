      the best performance and energy efficiency for a broad range of workloads running
      on Amazon EC2. AWS Graviton4-based R8g instances offer larger instance sizes
      with up to 3x more vCPU (up to 48xlarge) and memory (up to 1.5TB) than Graviton3-based
      R7g instances. These instances are up to 30% faster for web applications, 40%
      faster for databases, and 45% faster for large Java applications compared to
      AWS Graviton3-based R7g instances. R8g instances are available in 12 different
      instance sizes, including two bare metal sizes. They offer up to 50 Gbps enhanced
      networking bandwidth and up to 40 Gbps of bandwidth to the Amazon Elastic Block
      Store (Amazon EBS).<br /> <br /> To learn more, see <a contenteditable="false"
