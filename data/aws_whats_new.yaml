      Console</a>.</p>'
  4bb8fc418a69c4b09123a1f171cdbcee:
    id: 4bb8fc418a69c4b09123a1f171cdbcee
    title: Amazon OpenSearch Service now offers a new multi-tier storage
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/writeable-warm-tier-opensearch-optimized-instances/
    published: '2025-12-17'
    summary: "<p>Amazon OpenSearch Service now offers a new multi-tier storage option\
      \ powered by OpenSearch Optimized Instances. This new architecture combines\
      \ Amazon S3 cloud technology with local instance storage to deliver improved\
      \ durability and performance. The new multi-tier architecture features two tiers:\
      \ hot and warm. The hot tier handles frequently accessed data, while the warm\
      \ tier leverages Amazon S3 for cost-effective storage of less frequently accessed\
      \ data.&nbsp;<br /> <br /> Until now, Amazon OpenSearch Service supported a\
      \ warm tier through UltraWarm, which provided cost-effective storage for read-only\
      \ data. The new warm tier powered by OpenSearch Optimized instances supports\
      \ write operations, providing greater flexibility for data management. You can\
      \ automate rotating data from hot to warm as it ages using Index State Management\
      \ feature.</p> \n<p>For warm tier deployments, customers can use OpenSearch\
      \ Optimized (OI2) instances (size ‘large’ to ‘8xlarge’), with addressable warm\
      \ of up to five times the local cache size. tandard Managed Storage charges\
      \ apply for warm data. The new Multi-tier experience is available on OpenSearch\
      \ 3.3 and above. For more information please refer to the <a contenteditable=\"\
      false\" href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/or1.html\"\
      \ style=\"cursor: pointer;\">documentation</a>.<br /> <br /> New Multi-Tier\
      \ experience on OI2 instance family is now available on Amazon OpenSearch Service\
      \ across 12 regions globally: US East (N. Virginia, Ohio), US West (Oregon),\
      \ Canada (Central), Asia Pacific (Mumbai, Singapore, Sydney, Tokyo), Europe\
      \ (Frankfurt, Ireland, London, Spain).&nbsp;&nbsp;Please refer to the Amazon\
      \ OpenSearch Service&nbsp;<a contenteditable=\"false\" href=\"https://aws.amazon.com/opensearch-service/pricing/\"\
      \ style=\"cursor: pointer;\">pricing page</a>&nbsp;for pricing details</p>"
  a7677d716486abab2c8d495179b0b95c:
    id: a7677d716486abab2c8d495179b0b95c
    title: AWS Security Incident Response is now available in ten additional AWS Regions
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/security-incident-response-ten-regions/
    published: '2025-12-17'
    summary: '<p><a contenteditable="false" href="https://aws.amazon.com/security-incident-response/"
      style="cursor: pointer;">AWS Security Incident Response</a> is now available
      to customers in ten additional <a contenteditable="false" href="https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html#regions-opt-in-status"
      style="cursor: pointer;">opt-in AWS Regions</a>: Africa (Cape Town), Asia Pacific
      (Hong Kong, Hyderabad, Jakarta, Melbourne), Europe (Zurich, Milan, Spain), Middle
      East (UAE, Bahrain). You can now use these additional regions to prepare for,
      respond to, and recover from security events faster and more effectively.<br
      /> <br /> AWS Security Incident Response streamlines every step of the security
      incident response lifecycle through automated security finding monitoring and
      triage, AI-powered investigation, and containment capabilities. When specialized
      expertise is required, Security Incident Response gives you direct 24/7 access
      to a dedicated group of AWS security experts who respond to your request within
      minutes. This powerful combination of automation and expertise enables you to
      confidently scale your security operations, so you can focus on innovation and
      growth.<br /> <br /> For more information, please visit the <a contenteditable="false"
      href="https://aws.amazon.com/security-incident-response/" style="cursor: pointer;">AWS
      Security Incident Response page </a>and <a contenteditable="false" href="https://docs.aws.amazon.com/security-ir/latest/userguide/what-is.html"
      style="cursor: pointer;">documentation</a> for more information. See the <a
      contenteditable="false" href="https://docs.aws.amazon.com/security-ir/latest/userguide/supported-configs.html"
      style="cursor: pointer;">Supported Configurations page</a> for regional and
      language support.&nbsp;</p>'
  ba8cde81e10136598a5afdd4bb2d0d02:
    id: ba8cde81e10136598a5afdd4bb2d0d02
    title: AWS Payment Cryptography is now available in Asia Pacific(Hyderabad) and
      Europe(Paris)
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-payment-cryptography-available-in-hyderabad-paris/
    published: '2025-12-17'
    summary: '<p><a href="https://aws.amazon.com/payment-cryptography/">AWS Payment
      Cryptography</a> has expanded its global presence with availability in two new
      regions - Asia Pacific(Hyderabad) and Europe(Paris). This expansion enables
      customers with latency-sensitive payment applications to build, deploy or migrate
      into additional AWS Regions without depending on cross-region support. These
      Region offers offers additional options for multi-region high availability for
      Europe and India.<br /> <br /> AWS Payment Cryptography is a fully managed service
      that simplifies payment-specific cryptographic operations and key management
      for cloud-hosted payment applications. The service scales elastically with your
      business needs and is assessed as compliant with PCI PIN and PCI P2PE requirements,
      eliminating the need to maintain dedicated payment HSM instances. Organizations
      performing payment functions - including acquirers, payment facilitators, networks,
      switches, processors, and banks can now position their payment cryptographic
      operations closer to their applications while reducing dependencies on auxiliary
      data centers with dedicated payment HSMs.<br /> <br /> AWS Payment Cryptography
      is available in the following AWS Regions: Canada(Montreal), US East (Ohio,
      N. Virginia), US West (Oregon), Europe (Ireland, Frankfurt, London,Paris), Africa(Cape
      Town) and Asia Pacific (Singapore, Tokyo, Osaka, Mumbai,Hyderabad).<br /> <br
      /> To start using the service, please download the latest AWS <a href="https://aws.amazon.com/developer/tools/">CLI/SDK</a>
      and see the <a href="https://docs.aws.amazon.com/payment-cryptography/latest/userguide/what-is.html">AWS
      Payment Cryptography</a> user guide for more information.</p>'
  739600c60c1ab7a2cc8d2829dff3851b:
    id: 739600c60c1ab7a2cc8d2829dff3851b
    title: AWS Payment Cryptography reduces API pricing by up to 63% and introduces
      tiered key pricing
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-payment-cryptography-lower-pricing/
    published: '2025-12-17'
    summary: <p>Today, <a href="https://aws.amazon.com/payment-cryptography/" target="_blank">AWS
      Payment Cryptography</a> announced a significant price reduction of up to 63%
      for API requests across existing tiers and introduced a new fourth tier. This
      change unifies pricing across all regions and enables customers to migrate higher
      volume workloads to the service without being worried about pricing. As part
      of this update, we moved from flat rate to tiered key pricing, better supporting
      customers who need to manage high volumes of cryptographic keys. The new pricing
      model allows customers to cost-effectively scale both their key management and
      payment processing operations while optimizing costs at any volume.<br /> <br
      /> AWS Payment Cryptography is a managed AWS service that provides access to
      cryptographic functions and key management used in payment processing in accordance
      with Payment Card Industry (PCI) security standards without the need to procure
      dedicated payment Hardware Security Module (HSM) instances. The service enables
      customers performing payment functions such as acquirers, payment facilitators,
      networks, switches, processors, and banks to move their payment cryptographic
      operations closer to applications in the cloud and minimize dependencies on
      auxiliary data centers or colocation facilities containing dedicated payment
      HSMs.<br /> <br /> The price change is effective from December 15 2025, across
      all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS Regions</a> where AWS Payment Cryptography is available
      and automatically applies to all customers without any further action. For more
      information about pricing, visit the AWS Payment Cryptography <a href="https://aws.amazon.com/payment-cryptography/pricing/"
      target="_blank">pricing page</a>. To learn more about the service, see the AWS
      Payment Cryptography <a href="https://docs.aws.amazon.com/payment-cryptography/latest/userguide/what-is.html"
      target="_blank">user guide</a>.</p>
  9a3b63d08664dc0101dc59d82c6cf6e2:
    id: 9a3b63d08664dc0101dc59d82c6cf6e2
    title: AWS Marketplace now supports mandatory purchase orders and custom messaging
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-marketplace-mandatory-purchase-orders-custom-messaging
    published: '2025-12-17'
    summary: '<p>AWS Marketplace now supports mandatory purchase order requirements
      and custom messaging at the time of purchase, allowing organizations to strengthen
      their procurement governance. These capabilities help procurement, software
      asset management, and cloud governance teams enforce compliance policies while
      maintaining purchasing agility.<br /> <br /> Administrators can now enforce
      their mandatory purchase order policy by requiring buyers to provide purchase
      orders when subscribing to products through AWS Marketplace. These requirements
      can be applied to purchases through a private and public offer across various
      pricing types. Additionally, administrators can add a custom message on the
      procurement page, providing guidance on policy requirements and support contacts.
      Organizations can implement purchase order requirements without custom messaging,
      use custom messaging to guide buyers through the procurement process, or combine
      both features for more comprehensive governance. These capabilities can also
      be used with Private Marketplace, which allows customers to create a curated
      catalog of approved products for specific users and groups within an AWS organization.
      This flexibility helps finance and procurement teams enforce compliance at the
      time of purchase, improve cost allocation accuracy, and streamline procurement-to-pay
      cycles.<br /> <br /> These capabilities are available today in all <a href="https://docs.aws.amazon.com/marketplace/latest/buyerguide/supported-regions.html"
      style="cursor: pointer;">AWS Regions</a> where AWS Marketplace is supported.<br
      /> <br /> For information on configuring purchase order requirements and custom
      messaging, refer to the <a href="https://docs.aws.amazon.com/marketplace/latest/buyerguide/organizational-procurement-settings.html"
      style="cursor: pointer;">AWS Marketplace Buyer Guide</a>.</p>'
  d3fe0ceaae45563c7d370dbddddb3345:
    id: d3fe0ceaae45563c7d370dbddddb3345
    title: AWS IAM Identity Center is now available in the Asia Pacific (Taipei) AWS
      Region
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-iam-identity-center-asia-pacific-taipei-region/
    published: '2025-12-17'
    summary: <p>You can now deploy AWS IAM Identity Center in 37 AWS Regions, including
      Asia Pacific (Taipei).<br /> <br /> IAM Identity Center is the recommended service
      for managing workforce access to AWS applications. It enables you to connect
      your existing source of workforce identities to AWS once and offer your users
      single sign on experience across AWS. It powers the personalized experiences
      offered by AWS applications, such as Amazon Q, and the ability to define and
      audit user-aware access to data in AWS services, such as Amazon Redshift. It
      can also help you manage access to multiple AWS accounts from a central place.
      IAM Identity Center is available at no additional cost in these <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a>.<br /> <br /> To learn more about IAM Identity Center, <a href="https://aws.amazon.com/iam/identity-center/">visit
      the product detail page</a>. To get started, see the <a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html">IAM
      Identity Center user guide</a>.</p>
  c47d27a823e868a45593cc0e09ab89bd:
    id: c47d27a823e868a45593cc0e09ab89bd
    title: Amazon EC2 C8i and C8i-flex instances are now available in the Asia Pacific
      (Singapore) Region
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/ec2-c8i-c8i-flex-instances-singapore-region/
    published: '2025-12-17'
    summary: '<p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8i and
      C8i-flex instances are available in the Asia Pacific (Singapore) region. These
      instances are powered by custom Intel Xeon 6 processors, available only on AWS,
      delivering the highest performance and fastest memory bandwidth among comparable
      Intel processors in the cloud. These C8i and C8i-flex instances offer up to
      15% better price-performance, and 2.5x more memory bandwidth compared to previous
      generation Intel-based instances. They deliver up to 20% higher performance
      than C7i and C7i-flex instances, with even higher gains for specific workloads.
      The C8i and C8i-flex are up to 60% faster for NGINX web applications, up to
      40% faster for AI deep learning recommendation models, and 35% faster for Memcached
      stores compared to C7i and C7i-flex.<br /> <br /> C8i-flex are the easiest way
      to get price performance benefits for a majority of compute intensive workloads
      like web and application servers, databases, caches, Apache Kafka, Elasticsearch,
      and enterprise applications. They offer the most common sizes, from large to
      16xlarge, and are a great first choice for applications that don''t fully utilize
      all compute resources.<br /> <br /> C8i instances are a great choice for all
      memory-intensive workloads, especially for workloads that need the largest instance
      sizes or continuous high CPU usage. C8i instances offer 13 sizes including 2
      bare metal sizes and the new 96xlarge size for the largest applications.<br
      /> <br /> To get started, sign in to the <a contenteditable="false" href="https://aws.amazon.com/console/"
      style="cursor: pointer;">AWS Management Console</a>. Customers can purchase
      these instances via Savings Plans, On-Demand instances, and Spot instances.
      For more information about the new <a contenteditable="false" href="https://aws.amazon.com/ec2/instance-types/c8i/"
      style="cursor: pointer;">C8i and C8i-flex</a> instances visit the <a contenteditable="false"
      href="https://aws.amazon.com/blogs/aws/introducing-new-compute-optimized-amazon-ec2-c8i-and-c8i-flex-instances/"
      style="cursor: pointer;">AWS News blog</a>.</p>'
  6065e0cb35e46ef7584da3db9dc7f079:
    id: 6065e0cb35e46ef7584da3db9dc7f079
    title: AWS Payment Cryptography is now available in Sydney with AS2805 support
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-payment-cryptography-in-sydney/
    published: '2025-12-17'
    summary: '<p>Today, <a href="https://aws.amazon.com/payment-cryptography/" target="_blank">AWS
      Payment Cryptography</a> has expanded to Australia (Sydney) Region, and now
      supports AS2805 functionality. This expansion represents the service''s thirteenth
      AWS Region worldwide. With AS2805 capabilities customers can migrate more payment
      workloads to AWS while maintaining operability with other companies utilizing
      this standard.<br /> <br /> Australia, New Zealand and several other countries
      rely on Australia Standards 2805 (AS2805) as a consistent approach for managing
      cryptography between organizations for card payments. Historically, these companies
      required Hardware Security Modules (HSM) to perform these operations in a compliant,
      compatible manner. AWS Payment Cryptography now provides equivalent functionality
      for node-to-node use cases in an elastic, scalable service, eliminating the
      operational burden of procuring and managing standalone hardware. Customers
      can leverage the service’s use of PCI-certified HSMs as part of their overall
      compliance programs while using APIs that integrate with AWS IAM and AWS CloudTrail.<br
      /> <br /> AWS Payment Cryptography is available in the following AWS Regions:
      Canada (Montreal), US East (Ohio, N. Virginia), US West (Oregon), Europe (Ireland,
      Frankfurt, London), Africa (Cape Town), Asia Pacific (Singapore, Tokyo, Osaka,
      Mumbai) and Australia New Zealand (Sydney).<br /> <br /> To start using the
      service, please download the latest AWS <a href="https://aws.amazon.com/developer/tools/"
      target="_blank">CLI/SDK</a> and see the <a href="https://docs.aws.amazon.com/payment-cryptography/latest/userguide/what-is.html"
      target="_blank">AWS Payment Cryptography</a> user guide for more information
      including further compliance details.</p>'
  642b9f8ef8026d24fa3bcb065d98eb79:
    id: 642b9f8ef8026d24fa3bcb065d98eb79
    title: Amazon Redshift Serverless announces the general availability of dual-stack
      mode supporting IPV6
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/amazon-redshift-serverless-announces-dual-stack-mode-ipv6/
    published: '2025-12-17'
    summary: "<p>Amazon Redshift Serverless announces the general availability of\
      \ dual-stack mode that supports Internet Protocol version 6 (IPv6). This enhancement\
      \ enables you to modernize your network infrastructure and meet the growing\
      \ demands of internet connectivity.<br /> <br /> Redshift Serverless supports\
      \ configuring your Redshift workgroups with both IPv4 and IPv6 addresses (dual-stack)\
      \ or IPv4-only configurations within your AWS Virtual Private Clouds (VPCs).\
      \ You can enable IPv6 support when creating new Redshift Serverless workgroups\
      \ or modify existing workgroups to support IPv6 addressing. With this capability,\
      \ you can deploy Redshift warehouses in IPv6-enabled VPC subnets and configure\
      \ network settings to support the expanding address space requirements of your\
      \ applications. Your applications can now communicate with Redshift warehouses\
      \ using either IPv4 or IPv6 protocols, ensuring compatibility with both existing\
      \ and future network architectures.</p> \n<p>This feature is available in all\
      \ <a href=\"https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/\"\
      \ style=\"cursor: pointer;\">AWS commercial regions</a> where Redshift Serverless\
      \ is available. To get started, read the <a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html\"\
      \ style=\"cursor: pointer;\">documentation</a> and <a href=\"https://aws.amazon.com/blogs/big-data/ipv6-addressing-with-amazon-redshift/\"\
      \ style=\"cursor: pointer;\">blog</a>.</p>"
  7b4a9dc51ec4915e0a60b981114189fe:
    id: 7b4a9dc51ec4915e0a60b981114189fe
    title: AWS IoT Device Management Commands now supports dynamic payloads
    link: https://aws.amazon.com/about-aws/whats-new/2025/12/aws-iot-device-management-commands-dynamic-payload/
    published: '2025-12-16'
    summary: "<p>AWS IoT Device Management commands now supports dynamic payload functionality,\
      \ enabling developers to create reusable command templates with placeholders\
      \ that can be replaced with different values during command execution. The enhancement\
      \ also includes parameter validation rules to verify that parameter values conform\
      \ to specified criteria before execution. With this update, developers can now\
      \ set parameters for the command during runtime, making it easier for them to\
      \ re-use a command.<br /> <br /> This feature is ideal for scenarios where you\
      \ need to send similar commands with different parameter values to your Internet\
      \ of Things (IoT) devices. For example, instead of creating separate commands\
      \ to set different temperature values of a thermostat, you can now create one\
      \ template with a temperature placeholder and specify the actual value during\
      \ runtime. This template-based approach helps streamline command management\
      \ for applications, such as adjusting device configurations or controlling smart\
      \ home devices with variable settings.&nbsp;</p> \n<p>AWS IoT Device Management\
      \ commands with dynamic payload support is available in all AWS Regions where\
      \ AWS IoT Device Management is currently available. To learn more about dynamic\
      \ payloads and payload templates, visit AWS IoT <a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/iot-remote-command.html\"\
      >Device Management Commands Developer Guide</a>.</p>"
