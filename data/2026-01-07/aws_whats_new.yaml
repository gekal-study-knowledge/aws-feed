  b9485efccafc62d43ea3006e14f605e3:
    id: b9485efccafc62d43ea3006e14f605e3
    title: AWS simplifies Client VPN onboarding with Quickstart setup
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/aws-client-vpn-onboarding-quickstart-setup
    published: '2026-01-07'
    summary: "<p>Today, AWS announces a simplified onboarding experience for AWS Client\
      \ VPN, introducing a new Quickstart setup method that streamlines the process\
      \ of creating and configuring Client VPN endpoints.<br /> <br /> AWS Client\
      \ VPN allows you to securely connect remote users to AWS resources and on-premises\
      \ networks. The new Quickstart setup, reduces the number of steps required to\
      \ set up an Client VPN endpoint. You can now easily set up Client VPN endpoints\
      \ with pre-defined default configurations, requiring only three key inputs:\
      \ IPv4 CIDR, server certificate ARN, and subnet selection. For example, development\
      \ teams in large organizations who use Client VPN for remote access to their\
      \ VPC resources for quick testing can now create endpoints quickly with the\
      \ new simplified setup process.<br /> <br /> The Quickstart method is available\
      \ alongside the existing Standard Setup option, giving you the flexibility to\
      \ choose the approach that best fits your deployment needs. Additionally, when\
      \ you create a VPC, the Client VPN Quickstart workflow is automatically suggested\
      \ as a follow up step. Once endpoint creation is complete, you can immediately\
      \ download the client configuration file to connect using your VPN client. You\
      \ can later modify and enhance your endpoint configuration using the Client\
      \ VPN standard console or API as your usage patterns evolve. This enhancement\
      \ is available at no additional cost in all AWS Regions where AWS Client VPN\
      \ is generally available.<br /> <br /> To learn more about Client VPN:<br />\
      \ </p> \n<ul> \n <li>Visit the AWS Client VPN&nbsp;<a href=\"https://aws.amazon.com/vpn/\"\
      >product page</a></li> \n <li>Read the AWS Client VPN&nbsp;<a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html\"\
      >documentation</a></li> \n</ul>"
  ad574e382a2c079f229d9e42b255a8ee:
    id: ad574e382a2c079f229d9e42b255a8ee
    title: Announcing Apache Airflow 2.11 Support in Amazon Managed Workflows for
      Apache Airflow
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/apache-airflow-2-11-support-amazon-managed-workflows/
    published: '2026-01-07'
    summary: <p>You can now create Apache Airflow version 2.11 environments on Amazon
      Managed Workflows for Apache Airflow (MWAA). Apache Airflow 2.11 introduces
      several changes to help you prepare for upgrading to Apache Airflow 3.&nbsp;<br
      /> <br /> Amazon MWAA is a managed orchestration service for Apache Airflow
      that makes it easier to set up and operate end-to-end data pipelines in the
      cloud. Apache Airflow 2.11 introduces several notable enhancements, such as
      new trigger-based scheduling for delta intervals, consistent reporting of metrics
      in milliseconds and other changes that will make it easy to migrate to Apache
      Airflow 3. In addition, MWAA now provides support for Python 3.12 that you can
      leverage in your workflows.<br /> <br /> You can launch a new Apache Airflow
      2.11 environment on Amazon MWAA with just a few clicks in the&nbsp;<a href="https://console.aws.amazon.com/mwaa/home">AWS
      Management Console</a>&nbsp;in all currently supported&nbsp;<a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">Amazon
      MWAA regions</a>. To learn more about Apache Airflow 2.11 visit the&nbsp;<a
      href="https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html">Amazon
      MWAA documentation</a>, and the&nbsp;<a href="https://airflow.apache.org/docs/apache-airflow/2.11.0/release_notes.html#airflow-2-11-0-2025-05-20">Apache
      Airflow 2.11 change log</a>&nbsp;in the Apache Airflow documentation.<br />
      <br /> <i>Apache, Apache Airflow, and Airflow are either registered trademarks
      or trademarks of the&nbsp;</i><a href="http://www.apache.org/"><i>Apache Software
      Foundation</i></a>&nbsp;<i>in the United States and/or other countries.</i></p>
  7aea47f41e32daef7188894449e36ddb:
    id: 7aea47f41e32daef7188894449e36ddb
    title: Amazon EC2 I7ie instances now available in additional AWS regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-i7ie-instances-additional-aws-regions/
    published: '2026-01-07'
    summary: <p>AWS is announcing starting today, Amazon EC2 I7ie instances are now
      available in AWS Asia Pacific (Mumbai), Canada West (Calgary) and Europe (Paris)
      regions. Designed for large storage I/O intensive workloads, I7ie instances
      are powered by 5th Gen Intel Xeon Processors with an all-core turbo frequency
      of 3.2 GHz, offering up to 40% better compute performance and 20% better price
      performance over existing I3en instances. I7ie instances offer up to 120TB local
      NVMe storage density for storage optimized instances and offer up to twice as
      many vCPUs and memory compared to prior generation instances. Powered by 3rd
      generation AWS Nitro SSDs, I7ie instances deliver up to 65% better real-time
      storage performance, up to 50% lower storage I/O latency, and 65% lower storage
      I/O latency variability compared to I3en instances.<br /> <br /> I7ie are high
      density storage optimized instances, ideal for workloads requiring fast local
      storage with high random read/write performance at very low latency consistency
      to access large data sets. These instances are available in 9 different virtual
      sizes and deliver up to 100Gbps of network bandwidth and 60Gbps of bandwidth
      for Amazon Elastic Block Store (EBS).<br /> <br /> To learn more, visit the
      I7ie instances<a href="https://aws.amazon.com/ec2/instance-types/i7ie/" target="_blank">
      page</a>.</p>
  3dde45a7421717bdcfc7bf442c9a2e1b:
    id: 3dde45a7421717bdcfc7bf442c9a2e1b
    title: Amazon EC2 C8i and C8i-flex instances are now available in additional AWS
      regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-c8i-c8i-flex-instances-additional-aws-regions
    published: '2026-01-07'
    summary: <p>Starting today, Amazon Elastic Compute Cloud (Amazon EC2) C8i and
      C8i-flex instances are available in the Asia Pacific (Mumbai), Asia Pacific
      (Seoul), and Asia Pacific (Tokyo) regions. These instances are powered by custom
      Intel Xeon 6 processors, available only on AWS, delivering the highest performance
      and fastest memory bandwidth among comparable Intel processors in the cloud.
      These C8i and C8i-flex instances offer up to 15% better price-performance, and
      2.5x more memory bandwidth compared to previous generation Intel-based instances.
      They deliver up to 20% higher performance than C7i and C7i-flex instances, with
      even higher gains for specific workloads. The C8i and C8i-flex are up to 60%
      faster for NGINX web applications, up to 40% faster for AI deep learning recommendation
      models, and 35% faster for Memcached stores compared to C7i and C7i-flex.<br
      /> <br /> C8i-flex are the easiest way to get price performance benefits for
      a majority of compute intensive workloads like web and application servers,
      databases, caches, Apache Kafka, Elasticsearch, and enterprise applications.
      They offer the most common sizes, from large to 16xlarge, and are a great first
      choice for applications that don't fully utilize all compute resources.<br />
      <br /> C8i instances are a great choice for all memory-intensive workloads,
      especially for workloads that need the largest instance sizes or continuous
      high CPU usage. C8i instances offer 13 sizes including 2 bare metal sizes and
      the new 96xlarge size for the largest applications.<br /> <br /> To get started,
      sign in to the <a href="https://aws.amazon.com/console/" target="_blank">AWS
      Management Console</a>. Customers can purchase these instances via Savings Plans,
      On-Demand instances, and Spot instances. For more information about the new
      <a href="https://aws.amazon.com/ec2/instance-types/c8i/" target="_blank">C8i
      and C8i-flex</a> instances visit the <a href="https://aws.amazon.com/blogs/aws/introducing-new-compute-optimized-amazon-ec2-c8i-and-c8i-flex-instances/"
      target="_blank">AWS News blog</a>.</p>
