      \ <br /> With this launch, you can now enable these controls across your account\
      \ or across your organization. For example, you can assess your security posture\
      \ across AWS Amplify, Amazon SageMaker, Amazon Route 53, and more. Additionally,\
      \ you can leverage Conformance Packs to group these new controls and deploy\
      \ across an account or across organization, streamlining your multi-account\
      \ governance.<br /> <br /> For the full list of recently released rules, visit\
