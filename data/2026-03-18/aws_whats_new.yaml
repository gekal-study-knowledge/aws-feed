  27ccf2c92562162db535835ed74aaedd:
    id: 27ccf2c92562162db535835ed74aaedd
    title: Amazon Connect expands agentic speech-to-speech voice experiences to the
      London (Europe) region and adds three new voices
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-london-europe-region/
    published: '2026-03-18'
    summary: "<p>Amazon Connect now offers agentic speech-to-speech voice experiences\
      \ in an&nbsp;additional&nbsp;AWS Region: Europe (London). Amazon Connect also\
      \ adds three new speech-to-speech voices across US Spanish and UK English: Pedro\
      \ (es-US), Amy (en-GB), and Brian (en-GB).</p> \n<p>Amazon&nbsp;Connect's&nbsp;agentic\
      \ self-service capabilities enable AI agents to understand, reason, and&nbsp;take\
      \ action&nbsp;across voice and messaging channels to automate routine and complex\
      \ customer service tasks.&nbsp;Connect's&nbsp;agentic speech-to-speech voice\
      \ AI agents understand not only what customers say but how they say it, adapting\
      \ voice responses to match customer tone and sentiment while&nbsp;maintaining&nbsp;natural\
      \ conversational pace. With these updates, you can deliver agentic speech-to-speech\
      \ voice experiences to customers across a new region with a wider selection\
      \ of voices.</p> \n<p>To learn more about this feature, see the Amazon Connect&nbsp;<a\
      \ href=\"https://docs.aws.amazon.com/connect/latest/adminguide/what-is-amazon-connect.html\"\
      >Administrator Guide</a>.&nbsp;To&nbsp;learn more about Amazon Connect, a complete\
      \ AI-powered contact center solution delivering personalized customer experiences\
      \ at scale, visit the&nbsp;Amazon Connect&nbsp;<a href=\"https://aws.amazon.com/connect/\"\
      >website.</a></p>"
  98aab35b07dc08839847ced6f566a433:
    id: 98aab35b07dc08839847ced6f566a433
    title: Amazon Redshift increases performance for new queries in dashboards and
      ETL workloads by up to 7x
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-redshift-increases-performance-for-new-queries/
    published: '2026-03-18'
    summary: <p><a href="https://aws.amazon.com/redshift">Amazon Redshift</a> improves
      the performance of BI dashboards and ETL workloads by speeding up new queries
      by up to 7x. This significantly improves the response times of low-latency SQL
      queries, such as those used in near real-time analytics applications, BI dashboards,
      ETL pipelines, and autonomous, goal-seeking AI agents. Customers experience
      substantially faster query response times as Redshift accelerates the process
      of preparing the SQL query for execution. Queries start faster and return results
      quicker. This improvement is automatically enabled at no additional cost.<br
      /> <br /> To deliver this major improvement, Redshift added a new optimization
      to query compilation where new queries are processed immediately using composition.
      Composition is a technique that generates a lightweight arrangement of pre-existing
      logic while simultaneously creating highly optimized, query-specific code that
      is compiled and executed across available compute resources to further boost
      performance. Composition removes compilation from the critical path of query
      execution and provides immediate execution while compilation proceeds in the
      background. With this optimization, new queries processed by Redshift start
      faster and deliver performance consistent with subsequent runs.<br /> <br />
      This optimization is enabled by default for any SQL query across all provisioned
      clusters and serverless workgroups, in all commercial AWS Regions where Amazon
      Redshift operates. It is available on the Redshift current track with other
      tracks following in upcoming patch releases. No action is required from customers
      to benefit from this enhancement, and it is free of charge.</p>
  d194688cad361b4e0c335ce99fca7904:
    id: d194688cad361b4e0c335ce99fca7904
    title: Amazon OpenSearch Service now supports OpenSearch version 3.5
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-service-version-3-5/
    published: '2026-03-18'
    summary: "<p>You can now run OpenSearch version 3.5 on Amazon OpenSearch Service.\
      \ OpenSearch 3.5 introduces significant improvements in agentic AI capabilities,\
      \ search relevance tooling, and observability features to help you build powerful\
      \ agentic applications.</p> \n<p>With this launch, <a href=\"https://docs.opensearch.org/latest/ml-commons-plugin/api/agent-apis/execute-agent/\"\
      \ target=\"_blank\">agentic conversation memory</a>&nbsp;captures conversation\
      \ context and tool reasoning in persistent storage, enabling your agents to\
      \ provide coherent, accurate responses across multi-turn conversations. In addition\
      \ to this, <a href=\"https://docs.opensearch.org/latest/ml-commons-plugin/context-management\"\
      \ target=\"_blank\">context management</a> optimizes what you send to large\
      \ language models (LLMs) through automatic truncation and summarization, reducing\
      \ your token costs while maintaining response quality. Finally a redesigned\
      \ no-code agent interface supports Model Context Protocol (MCP) integration,\
      \ search templates, conversational memory, and single model configurations,\
      \ allowing you to build sophisticated agents without writing code.</p> \n<p>You\
      \ can now tune search quality faster with expanded <a href=\"https://docs.opensearch.org/latest/search-plugins/search-relevance/using-search-relevance-workbench/\"\
      \ target=\"_blank\">search relevance workbench</a> capabilities. LLM-powered\
      \ evaluation automatically assesses search results with customizable prompts,\
      \ letting you scale relevance testing beyond manual judgments and accelerate\
      \ quality improvements. Scheduled experiments run tests nightly, weekly, or\
      \ monthly, helping you track search quality trends over time and catch regressions\
      \ early. Enhanced single query comparison displays agentic search queries alongside\
      \ agent summaries, making it easier to validate and optimize agent-driven search\
      \ experiences.</p> \n<p>For information on upgrading to OpenSearch 3.5, please\
      \ see the <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/version-migration.html\"\
      \ target=\"_blank\">documentation</a>. OpenSearch 3.5 is now available in all\
      \ AWS Regions where Amazon OpenSearch Service is available.</p>"
  33e96a941d7807d2fdb08fd635064969:
    id: 33e96a941d7807d2fdb08fd635064969
    title: Amazon Inspector expands agentless EC2 scanning and introduces Windows
      KB-based findings
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-inspector-agentless-ec2-scanning-windows/
    published: '2026-03-18'
    summary: "<p>Amazon Inspector now offers expanded agentless EC2 scanning with\
      \ enhanced detection coverage, including new support for Windows operating system\
      \ vulnerability scanning without requiring an agent. Security teams and IT administrators\
      \ can now detect vulnerabilities across a broader range of software and applications\
      \ on their EC2 instances — including WordPress, Apache HTTP Server, Python packages,\
      \ and Ruby gems — as well as Windows OS vulnerabilities, all through agentless\
      \ scanning. Customers automatically receive findings for newly supported software\
      \ and applications with no configuration changes required.</p> \n<p>Amazon Inspector\
      \ is also introducing Windows Knowledge Base (KB)-based findings for Windows\
      \ OS vulnerabilities. Rather than receiving a separate finding for each CVE\
      \ addressed by a single Microsoft patch, customers now receive a single consolidated\
      \ KB finding that groups all related CVEs together. Each KB finding surfaces\
      \ the highest CVSS score, EPSS score, and exploit availability from its constituent\
      \ CVEs, and includes a direct link to the relevant Microsoft KB article — making\
      \ it straightforward to understand exactly which patch to apply and why. All\
      \ existing CVE-based Windows OS findings will automatically transition to KB-based\
      \ findings.&nbsp;All existing CVE-based Windows OS findings will automatically\
      \ transition to KB-based findings, and customers do not need to take any additional\
      \ action.</p> \n<p>Both capabilities are available in all AWS Regions where\
      \ Amazon Inspector is available. To learn more, visit the <a href=\"https://aws.amazon.com/inspector/\"\
      >Amazon Inspector product page</a>&nbsp;and the <a href=\"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html\"\
      >Amazon Inspector documentation</a>.&nbsp;</p>"
  322503980ad14aaf5bf1586acd16b717:
    id: 322503980ad14aaf5bf1586acd16b717
    title: Amazon S3 Access Grants are now available in the AWS Asia Pacific (New
      Zealand) Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-s3-access-grants-new-zealand/
    published: '2026-03-18'
    summary: "<p>You can now create Amazon S3 Access Grants in the AWS Asia Pacific\
      \ (New Zealand) Region.</p> \n<p>Amazon S3 Access Grants map identities in directories\
      \ such as Microsoft Entra ID, or AWS Identity and Access Management (IAM) principals,\
      \ to datasets in S3. This helps you manage data permissions at scale by automatically\
      \ granting S3 access to end users based on their corporate identity.</p> \n\
      <p>Visit the <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-grants-limitations.html#access-grants-limitations-regions\"\
      \ target=\"_blank\">AWS Region Table</a> for complete regional availability\
      \ information. To learn more about Amazon S3 Access Grants, visit our <a href=\"\
      https://aws.amazon.com/s3/features/access-grants/\" target=\"_blank\">product\
      \ page</a>.</p>"
  c78336658fa4f2d08724d56bacfe260a:
    id: c78336658fa4f2d08724d56bacfe260a
    title: Amazon EC2 C8a instances now available in the Asia Pacific (Tokyo) region
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-ec2-r8a-instances-asia-pacific-tokyo-regions/
    published: '2026-03-18'
    summary: <p>Starting today, the compute-optimized Amazon EC2 C8a instances are
      available in the Asia Pacific (Tokyo) region. C8a instances are powered by 5th
      Gen AMD EPYC processors (formerly code named Turin) with a maximum frequency
      of 4.5 GHz, delivering up to 30% higher performance and up to 19% better price-performance
      compared to C7a instances.<br /> <br /> C8a instances deliver 33% more memory
      bandwidth compared to C7a instances, making these instances ideal for latency
      sensitive workloads. Compared to Amazon EC2 C7a instances, they are up to 57%
      faster for GroovyJVM allowing better response times for Java-based applications.
      C8a instances offer 12 sizes including 2 bare metal sizes. This range of instance
      sizes allows customers to precisely match their workload requirements.<br />
      <br /> C8a instances are built on <a href="https://aws.amazon.com/ec2/nitro/"
      target="_blank">AWS Nitro System</a> and are ideal for high performance, compute-intensive
      workloads such as batch processing, distributed analytics, high performance
      computing (HPC), ad serving, highly-scalable multiplayer gaming, and video encoding.<br
      /> <br /> To get started, sign in to the AWS Management Console. Customers can
      purchase these instances via Savings Plans, On-Demand instances, and Spot instances.
      For more information visit the <a href="https://aws.amazon.com/ec2/instance-types/c8a/"
      target="_blank">Amazon EC2 C8a instance page.</a></p>
