  66ce24bf2efec38bb7dbff6e083880e5:
    id: 66ce24bf2efec38bb7dbff6e083880e5
    title: AWS Batch now supports configurable scale down delay
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-batch-configurable-scale-down-delay/
    published: '2026-03-02'
    summary: <p>AWS Batch now allows you to configure a scale down delay for managed
      compute environments, helping reduce job processing delays for intermittent
      and periodic workloads. With the new <i>minScaleDownDelayMinutes</i> parameter,
      you can specify how long AWS Batch keeps instances running after their jobs
      complete (from 20 minutes to 1 week), preventing unnecessary instance terminations
      and relaunches that can delay subsequent job processing.<br /> <br /> You can
      configure the scale down delay when creating or updating a compute environment
      via the AWS Batch API (<i>CreateComputeEnvironment</i> or <i>UpdateComputeEnvironment</i>)
      or the AWS Batch Management Console. The delay is applied at the instance level,
      based on when each instance last completed a job.<br /> <br /> Scale down delay
      is supported today in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Regions</a> where AWS Batch is available. For more information, see the <a href="https://docs.aws.amazon.com/batch/latest/APIReference/API_ComputeScalingPolicy.html#Batch-Type-ComputeScalingPolicy-minScaleDownDelayMinutes">AWS
      Batch API Guide</a>.</p>
  1283c52d25a51290b91e495675e1164b:
    id: 1283c52d25a51290b91e495675e1164b
    title: OpenSearch OR2 and OM2 instances in AWS GovCloud (US-East, US-West) Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-or2-om2-us-gov-region/
    published: '2026-03-02'
    summary: '<p>Amazon OpenSearch Service, expands availability of OR2 and OM2, OpenSearch
      Optimized Instance family to 12 additional regions. The OR2 instance delivers
      up to 26% higher indexing throughput compared to previous OR1 instances and
      70% over R7g instances. The OM2 instance delivers up to 15% higher indexing
      throughput compared to OR1 instances and 66% over M7g instances in internal
      benchmarks<br /> <br /> The OpenSearch Optimized instances, leveraging best-in-class
      cloud technologies like Amazon S3, to provide high durability, and improved
      price-performance for higher indexing throughput better for indexing heavy workload.
      Each OpenSearch Optimized instance is provisioned with compute, local instance
      storage for caching, and remote Amazon S3-based managed storage. OR2 and OM2
      offers pay-as-you-go pricing and reserved instances, with a simple hourly rate
      for the instance, local instance storage, as well as the managed storage provisioned.
      OR2 instances come in sizes ‘medium’ through ‘16xlarge’, and offer compute,
      memory, and storage flexibility. OM2 instances come in sizes ‘large’ through
      ‘16xlarge’ Please refer to the Amazon OpenSearch Service <a href="https://aws.amazon.com/opensearch-service/pricing/">pricing
      page</a> for pricing details.<br /> <br /> OR2 and OM2 instance family is now
      available on Amazon OpenSearch Service across 2 additional regions: AWS GovCloud
      (US-East, US-West).</p>'
