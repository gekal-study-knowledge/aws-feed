    id: 250d86d1652c7e0b13ee9587ff5d7ec1
    title: Amazon S3 Storage Lens adds performance metrics, support for billions of
      prefixes, and export to S3 Tables
    link: https://aws.amazon.com/blogs/aws/amazon-s3-storage-lens-adds-performance-metrics-support-for-billions-of-prefixes-and-export-to-s3-tables/
