  d28f82d1e8e5f3748e5e6bce88254fbb:
    id: d28f82d1e8e5f3748e5e6bce88254fbb
    title: Amazon Redshift Serverless introduces 3-year Serverless Reservations
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-redshift-serverless-three-year-reservations/
    published: '2026-02-23'
    summary: <p>Amazon Redshift now offers 3-year Serverless Reservations for Amazon
      Redshift Serverless, a new discounted pricing option that provides up to 45%
      savings and improved cost predictability for your analytics workloads. With
      Serverless Reservations, you commit to a specific number of Redshift Processing
      Units (RPUs) for a 3-year term with a no-upfront payment option.<br /> <br />
      Amazon Redshift Serverless allows you to run and scale analytics without having
      to provision and manage clusters with a pay-as-you-go pricing model. Serverless
      Reservations help you further optimize compute costs and improve cost predictability
      of existing and new workloads on Amazon Redshift Serverless. Managed at the
      AWS payer account level, Serverless Reservations can be shared between multiple
      AWS accounts, reducing your compute costs by up to 45% on all Amazon Redshift
      Serverless workloads in your AWS account. Serverless Reservations are billed
      hourly and metered per second, offering a consistent billing model (24 hours
      a day, seven days a week) while maintaining the flexibility offered by Amazon
      Redshift Serverless. Any usage exceeding the specified RPU level is charged
      at standard on-demand rates. You can purchase Serverless Reservations via the
      Amazon Redshift console or by invoking the Serverless Reservations API “create-reservation”.<br
      /> <br /> Serverless Reservations are available in all regions where Amazon
      Redshift Serverless is currently available. To learn more about Amazon Redshift
      Serverless pricing options, see the <a href="https://aws.amazon.com/redshift/redshift-serverless/">Redshift
      <u>Serverless feature page</u></a>, <a href="https://aws.amazon.com/redshift/pricing/"><u>Redshift
      Pricing Page</u></a>, or the <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-billing-reserved.html">Amazon
      Redshift Management Guide</a>.&nbsp;</p>
  dc2a86b64886a1bd3c6ced2c1305bbb3:
    id: dc2a86b64886a1bd3c6ced2c1305bbb3
    title: AWS IAM Policy Autopilot is now available as a Kiro Power
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-iam-policy-autopilot-kiro-power/
    published: '2026-02-23'
    summary: "<p>AWS IAM Policy Autopilot, the open source static code analysis tool\
      \ launched at re:Invent 2025, is now available as a Kiro power to bring policy\
      \ expertise to agentic AI development. This tool helps developers quickly create\
      \ baseline AWS IAM policies that can be refined as applications evolve, eliminating\
      \ the need for manual IAM policy creation.</p> \n<p>The Kiro power delivers\
      \ significant benefits through one-click installation directly from the Kiro\
      \ IDE and web interface, removing the need for manual MCP server configuration.\
      \ This streamlined workflow enables faster policy creation and integrates seamlessly\
      \ into AI-assisted development environments. Key use cases include rapid prototyping\
      \ of AWS applications requiring IAM policies, baseline policy creation for new\
      \ AWS projects, and enhanced productivity within IDE environments where developers\
      \ can generate policies without leaving their coding workflow.</p> \n<p>To learn\
      \ more about AWS IAM Policy Autopilot and access the integration, visit the\
      \ <a href=\"https://github.com/awslabs/iam-policy-autopilot\" target=\"_blank\"\
      >AWS IAM Policy Autopilot GitHub repository</a>. To learn more about Kiro powers,\
      \ visit the <a href=\"https://kiro.dev/powers/\" target=\"_blank\">Kiro powers\
      \ page</a>.&nbsp;</p>"
  bbe8a2968d26c931ab4f885d73c98e18:
    id: bbe8a2968d26c931ab4f885d73c98e18
    title: AWS Trusted Advisor now delivers more accurate unused NAT Gateway checks
      powered by AWS Compute Optimizer
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/trusted-advisor-unused-nat-gateway-check/
    published: '2026-02-23'
    summary: <p>AWS Trusted Advisor has enhanced its detection of unused NAT Gateway
      checks powered by AWS Compute Optimizer detection capabilities. The enhanced
      detection analyzes additional CloudWatch metrics over a 32-day lookback period
      and verifies whether NAT Gateways are associated with route tables, reducing
      false positives by avoiding flagging critical backup resources. This helps cost
      optimization teams and DevOps engineers confidently identify and remove unused
      NAT Gateways that incur unnecessary charges.<br /> <br /> Each recommendation
      includes estimated monthly cost savings, enabling you to prioritize cleanup
      based on monetary impact. With these recommendations, you can run regular cost
      audits to catch idle NAT Gateways before charges accumulate. This simplifies
      cleaning up resources left behind after workload migrations or decommissions.
      You can view and act on these recommendations in the Trusted Advisor console
      alongside your other cost optimization checks, or through Trusted Advisor APIs.<br
      /> <br /> This feature is available in all AWS Regions where AWS Trusted Advisor
      is supported. Organizations must be opted-in to Cost Optimization Hub and Compute
      Optimizer to access these enhanced recommendations. To learn more, visit the
      <a href="https://docs.aws.amazon.com/awssupport/latest/user/cost-optimization-checks.html#idle-nat-gateways">AWS
      Trusted Advisor documentation</a>.</p>
  1dbea6eaf1fc2cfed7cc33a28a11c0a5:
    id: 1dbea6eaf1fc2cfed7cc33a28a11c0a5
    title: Amazon announces generative AI-based artifacts in Amazon Q Developer for
      visualizing resource and cost data
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/generative-ai-based-Amazon-Q-artifacts/
    published: '2026-02-23'
    summary: <p>Today, AWS announces the general availability of Amazon Q Developer
      artifacts in the AWS Management Console. Amazon Q artifacts is a generative
      AI-based user experience that enables customers to visualize resource data in
      tables and cost data in charts. The launch also moves the Q icon to the navigation
      bar and the chat panel to the left, making Amazon Q easier to use and find.<br
      /> <br /> Customers can access Amazon Q artifacts by selecting the Amazon Q
      icon from the navigation bar in the AWS Management Console. They can ask questions
      about their AWS resources to understand the state of their resources and costs
      using Amazon Q artifacts. For example, on asking “List S3 buckets with tag value
      production", Amazon Q displays the S3 buckets that has a tag value of production
      in a tabular format. Customers can then select the hyperlinks on the bucket
      name to view the bucket details in the S3 console. Customers can also visualize
      cost and billing information with charts. For example, on entering "Show me
      RDS costs by instance type over the last 6 months", Q will render the response
      in a Q artifacts using a chart (e.g., bar graph, line chart, pie chart, or area
      chart). Customers can also use sample prompts in the Prompt Library in the Amazon
      Q chat panel to get started quickly. The artifacts are displayed in an artifact
      panel next to the Amazon Q chat panel, which is now on the left. Users can expand
      Amazon Q to full-screen for a dedicated focus mode experience.<br /> <br />
      The Amazon Q Developer artifacts are available in all AWS Regions where Amazon
      Q Developer is <a href="https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/regions.html">available</a>.
      To get started visit <a href="https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/chat-artifacts.html">Amazon
      Q Developer</a> documentation.</p>
  8c08f63583dfdff5e00c3efde729a344:
    id: 8c08f63583dfdff5e00c3efde729a344
    title: AWS Elemental Media Services Now Available in Asia Pacific (Malaysia) Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/elemental-Malaysia/
    published: '2026-02-23'
    summary: <p><a href="https://aws.amazon.com/media-services/">AWS Elemental Media
      Services</a> are now available in the Asia Pacific (Malaysia) Region, expanding
      your ability to build cloud-based video workflows closer to your audiences in
      Southeast Asia. AWS Elemental MediaConnect, MediaLive, MediaPackage, MediaConvert,
      and MediaTailor form a comprehensive suite of services that enable you to ingest,
      transport, transcode, package, and deliver high-quality video content with lower
      latency and improved performance for viewers across Malaysia and the broader
      Southeast Asia region.<br /> <br /> With this regional expansion, broadcasters,
      content providers, and streaming platforms in the region can now process video
      workloads closer to the edge reducing latency and improving video quality for
      regional audiences. For example, you can use MediaLive or MediaConvert to encode
      live sports events or VOD assets, respectively, in Kuala Lumpur, package the
      streams with MediaPackage for multi-device delivery, and monetize content using
      MediaTailor's server-side ad insertion, all while keeping your video processing
      infrastructure within the Asia Pacific (Malaysia) Region.<br /> <br /> AWS Elemental
      Media Services are a family of services that form the foundation of cloud-based
      workflows to transport, transcode, package, and deliver video.<br /> <br />
      Visit the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      region table</a> for a full list of AWS Regions where Elemental Media Services
      are available.&nbsp;</p>
  4c871d389e7ed75b73d24642daa97179:
    id: 4c871d389e7ed75b73d24642daa97179
    title: Amazon S3 Tables are now available in AWS GovCloud (US) Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-s3-tables-aws-govcloud-us/
    published: '2026-02-23'
    summary: "<p>Amazon S3 Tables are now available in AWS GovCloud (US-East) and\
      \ AWS GovCloud (US-West).<br /> <br /> Amazon S3 Tables deliver the first cloud\
      \ object store with built-in Apache Iceberg support, offering optimized tabular\
      \ data storage at scale. S3 Tables are designed to perform continual table maintenance\
      \ to automatically optimize query efficiency and storage cost over time, even\
      \ as your data lake scales and evolves. With S3 Tables support for the Apache\
      \ Iceberg standard, your tabular data can be easily queried by popular AWS and\
      \ third-party query engines. Additionally, with the Intelligent-Tiering storage\
      \ class, S3 Tables automatically manage costs based on access patterns, without\
      \ performance impact or operational overhead.</p> \n<p>For a full list of AWS\
      \ Regions where S3 Tables are available, see <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-regions-quotas.html\"\
      \ target=\"_blank\">S3 Tables AWS Regions and endpoints</a>. To learn more,\
      \ visit the <a href=\"https://aws.amazon.com/s3/features/tables/\" target=\"\
      _blank\">product page</a>, <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html\"\
      \ target=\"_blank\">documentation</a>, and the <a href=\"https://aws.amazon.com/s3/pricing/\"\
      \ target=\"_blank\">Amazon S3 pricing page</a>.</p>"
