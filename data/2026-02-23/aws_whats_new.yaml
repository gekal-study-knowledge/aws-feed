  d28f82d1e8e5f3748e5e6bce88254fbb:
    id: d28f82d1e8e5f3748e5e6bce88254fbb
    title: Amazon Redshift Serverless introduces 3-year Serverless Reservations
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-redshift-serverless-three-year-reservations/
    published: '2026-02-23'
    summary: <p>Amazon Redshift now offers 3-year Serverless Reservations for Amazon
      Redshift Serverless, a new discounted pricing option that provides up to 45%
      savings and improved cost predictability for your analytics workloads. With
      Serverless Reservations, you commit to a specific number of Redshift Processing
      Units (RPUs) for a 3-year term with a no-upfront payment option.<br /> <br />
      Amazon Redshift Serverless allows you to run and scale analytics without having
      to provision and manage clusters with a pay-as-you-go pricing model. Serverless
      Reservations help you further optimize compute costs and improve cost predictability
      of existing and new workloads on Amazon Redshift Serverless. Managed at the
      AWS payer account level, Serverless Reservations can be shared between multiple
      AWS accounts, reducing your compute costs by up to 45% on all Amazon Redshift
      Serverless workloads in your AWS account. Serverless Reservations are billed
      hourly and metered per second, offering a consistent billing model (24 hours
      a day, seven days a week) while maintaining the flexibility offered by Amazon
      Redshift Serverless. Any usage exceeding the specified RPU level is charged
      at standard on-demand rates. You can purchase Serverless Reservations via the
      Amazon Redshift console or by invoking the Serverless Reservations API “create-reservation”.<br
      /> <br /> Serverless Reservations are available in all regions where Amazon
      Redshift Serverless is currently available. To learn more about Amazon Redshift
      Serverless pricing options, see the <a href="https://aws.amazon.com/redshift/redshift-serverless/">Redshift
      <u>Serverless feature page</u></a>, <a href="https://aws.amazon.com/redshift/pricing/"><u>Redshift
      Pricing Page</u></a>, or the <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-billing-reserved.html">Amazon
      Redshift Management Guide</a>.&nbsp;</p>
  dc2a86b64886a1bd3c6ced2c1305bbb3:
    id: dc2a86b64886a1bd3c6ced2c1305bbb3
    title: AWS IAM Policy Autopilot is now available as a Kiro Power
    link: https://aws.amazon.com/about-aws/whats-new/2026/02/aws-iam-policy-autopilot-kiro-power/
    published: '2026-02-23'
    summary: "<p>AWS IAM Policy Autopilot, the open source static code analysis tool\
      \ launched at re:Invent 2025, is now available as a Kiro power to bring policy\
      \ expertise to agentic AI development. This tool helps developers quickly create\
      \ baseline AWS IAM policies that can be refined as applications evolve, eliminating\
      \ the need for manual IAM policy creation.</p> \n<p>The Kiro power delivers\
      \ significant benefits through one-click installation directly from the Kiro\
      \ IDE and web interface, removing the need for manual MCP server configuration.\
      \ This streamlined workflow enables faster policy creation and integrates seamlessly\
      \ into AI-assisted development environments. Key use cases include rapid prototyping\
      \ of AWS applications requiring IAM policies, baseline policy creation for new\
      \ AWS projects, and enhanced productivity within IDE environments where developers\
      \ can generate policies without leaving their coding workflow.</p> \n<p>To learn\
      \ more about AWS IAM Policy Autopilot and access the integration, visit the\
      \ <a href=\"https://github.com/awslabs/iam-policy-autopilot\" target=\"_blank\"\
      >AWS IAM Policy Autopilot GitHub repository</a>. To learn more about Kiro powers,\
      \ visit the <a href=\"https://kiro.dev/powers/\" target=\"_blank\">Kiro powers\
      \ page</a>.&nbsp;</p>"
