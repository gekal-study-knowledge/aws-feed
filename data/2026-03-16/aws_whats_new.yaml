  b26a1ae6548da3c0d3c22d9e3d2bc22d:
    id: b26a1ae6548da3c0d3c22d9e3d2bc22d
    title: Amazon Timestream for InfluxDB 3 Now Supports Expanded Multi-Node Cluster
      Configurations
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-timestream-for-influxdb-3-multi-node-cluster/
    published: '2026-03-16'
    summary: <p>Amazon Timestream for InfluxDB now supports expanded multi-node cluster
      configurations for InfluxDB 3 Enterprise edition, enabling you to scale clusters
      up to 15 nodes for demanding production workloads requiring high read throughput
      and high availability.<br /> <br /> With this launch, you can now configure
      clusters with up to 15 nodes total, with one to four writer/reader nodes for
      data ingestion and queries, zero to 13 dedicated reader-only nodes for scaling
      query performance, plus a dedicated compactor node. This enables you to optimize
      for specific workload patterns. For example, you can create a dedicated reader-only
      nodes to handle read-heavy workloads such as dashboards, reporting, and analytical
      queries without impacting write performance. All Multi-node deployments distribute
      workloads across multiple nodes in different Availability Zones for enhanced
      fault tolerance and high availability<br /> <br /> With this release, you can
      now add and remove nodes from all Enterprise clusters, providing greater flexibility
      for managing your time series database infrastructure. You can also upgrade
      from Core edition to Enterprise edition to access multi-node deployment capabilities
      and compaction features essential for long-term storage.<br /> <br /> You can
      create expanded multi-node clusters using the <a href="https://console.aws.amazon.com/timestream">Amazon
      Timestream for InfluxDB console</a>. AWS CLI, or AWS SDKs by configuring custom
      parameter groups with your desired node topology. Amazon Timestream for InfluxDB
      3 is available in all <a href="https://docs.aws.amazon.com/general/latest/gr/timestream.html">Regions</a>
      where Timestream for InfluxDB is available.<br /> <br /> For more information,
      see the <a href="https://docs.aws.amazon.com/timestream/latest/developerguide/multi-node-scaling.html">Amazon
      Timestream for InfluxDB documentation</a> and <a href="https://aws.amazon.com/timestream/pricing/">pricing
      page</a>.</p>
  0b9b91c9fecd99df368682ad5fac389f:
    id: 0b9b91c9fecd99df368682ad5fac389f
    title: Amazon Connect now enables agents to forward email contacts to external
      email addresses
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-forward-email-contacts/
    published: '2026-03-16'
    summary: <p>Amazon Connect now enables agents to forward email contacts to external
      email addresses and distribution lists directly from the Agent workspace and
      Contact Center Panel. When an email is forwarded, agents still retain ownership
      and complete communication trail of the original contact. This makes it easy
      for your agents to seamlessly loop in back-office teams, subject matter experts,
      partners, and other stakeholders, while remaining a single consistent point
      of contact for your customers.<br /> <br /> Amazon Connect email is available
      in the US East (N. Virginia), US West (Oregon), Africa (Cape Town), Asia Pacific
      (Seoul), Asia Pacific (Singapore), Asia Pacific (Sydney), Asia Pacific (Tokyo),
      Canada (Central), Europe (Frankfurt), and Europe (London) <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">regions</a>.
      To learn more and get started, please refer to the help <a href="https://docs.aws.amazon.com/connect/latest/adminguide/agent-forward-email.html">documentation</a>
      or visit the <a href="https://aws.amazon.com/connect/">Amazon Connect</a> website.</p>
  e6ff0281be2d7a6fc40a7f4251bc8277:
    id: e6ff0281be2d7a6fc40a7f4251bc8277
    title: Announcing AWS Partner Central agents to accelerate co-sell
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-partner-central-agents-accelerate-co-sell/
    published: '2026-03-16'
    summary: "<p>Today, AWS announces the general availability of AWS Partner Central\
      \ agents, new AI-powered capabilities designed to accelerate partner co-selling\
      \ with AWS. Built on Amazon Bedrock AgentCore, these agentic capabilities work\
      \ alongside partner sales teams to shorten sales cycles and simplify funding\
      \ access. AWS Partners can engage with these agentic capabilities directly in\
      \ the console or programmatically through Model Context Protocol (MCP), enabling\
      \ sales teams to access from within their own customer relationship management\
      \ (CRM) systems.</p> \n<p>With AWS Partner Central agents, partner teams get\
      \ pipeline insights, tailored sales plays, and next-step recommendations on\
      \ demand, so they know where to focus and what to do next. Partner sales teams\
      \ can share meeting transcripts, notes, or emails with agents that automatically\
      \ populate fields and advance deals, so they stay focused on selling, not data\
      \ entry. Agents recommend funding at the opportunity level, highlight eligibility\
      \ gaps, and create pre-populated fund requests, so partners capture available\
      \ funding faster.</p> \n<p>AWS Partner Central agents are available today in\
      \ all commercial AWS Regions. To learn more about agentic capabilities in AWS\
      \ Partner Central, review this <a href=\"https://aws.amazon.com/blogs/apn/introducing-aws-partner-central-agents/\"\
      \ target=\"_blank\">blog</a>. Partners can start using agents by visiting AWS\
      \ Partner Central in the AWS console and accessing opportunities, after reviewing\
      \ the <a href=\"https://docs.aws.amazon.com/partner-central/latest/sales-guide/partner-cosell-agent.html\"\
      \ target=\"_blank\">agents guide</a>, and to integrate agents into your own\
      \ CRM, visit the <a href=\"https://docs.aws.amazon.com/partner-central/latest/APIReference/partner-central-mcp-server.html\"\
      \ target=\"_blank\">Partner Central agents MCP server guide</a>.</p>"
