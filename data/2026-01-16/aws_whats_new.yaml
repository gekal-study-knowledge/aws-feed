  ad8168d04393d73e328153777270bead:
    id: ad8168d04393d73e328153777270bead
    title: Amazon S3 Storage Lens is now available in AWS GovCloud (US) Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/s3-storage-lens-aws-govcloud-us-regions/
    published: '2026-01-16'
    summary: <p>Amazon S3 Storage Lens provides organization-wide visibility into
      your storage usage and activity. S3 Storage Lens is now available in AWS GovCloud
      (US) Regions, bringing metrics to help you optimize storage costs, identify
      data protection opportunities, and improve application performance.<br /> <br
      /> S3 Storage Lens provides a single view of object storage usage and activity
      across thousands of accounts in an organization, with drill-downs to generate
      insights at multiple aggregation levels. You can optimize storage costs by identifying
      prefixes with incomplete multipart uploads or buckets accumulating non-current
      object versions. You can identify buckets that don’t follow your data protection
      best practices, such as using S3 Cross-Region Replication to replicate data
      across AWS Regions or S3 Versioning to keep multiple versions of an object.
      With the newly added performance metrics, you can identify application performance
      constraints—for example, using request and object size distribution metrics
      to detect inefficient access patterns or tracking cross-Region data transfer
      to reduce latency and costs.<br /> <br /> Amazon S3 Storage Lens is available
      in all AWS Regions. S3 Storage Lens is pre-configured to receive free metrics
      by default for all customers and 14 days of historical data. For more detailed
      visibility with up to 15 months data retention, you can upgrade to S3 Storage
      Lens advanced metrics. To learn more about S3 Storage Lens metrics, including
      free and advanced metrics, refer to the <a href="https://docs.amazonaws.cn/en_us/AmazonS3/latest/userguide/storage_lens_view_metrics.html">documentation</a>.
      For S3 Storage Lens Advanced pricing details, visit the <a href="https://www.amazonaws.cn/en/s3/pricing/">Amazon
      S3 pricing page</a>.</p>
  f2cd3ae7e98dd1b53d94e885bb38e688:
    id: f2cd3ae7e98dd1b53d94e885bb38e688
    title: Amazon MWAA now available in additional Region
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-mwaa-additional-region
    published: '2026-01-16'
    summary: <p>Amazon Managed Workflows for Apache Airflow (MWAA) is now available
      in AWS Region&nbsp;Asia Pacific (Thailand).<br /> <br /> Amazon MWAA is a managed
      service for Apache Airflow that lets you use the same familiar Apache Airflow
      platform as you do today to orchestrate your workflows and enjoy improved scalability,
      availability, and security without the operational burden of having to manage
      the underlying infrastructure. Learn more about using Amazon MWAA on the&nbsp;<a
      href="https://aws.amazon.com/managed-workflows-for-apache-airflow/">product
      page</a>.<br /> Please visit the&nbsp;<a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      region table</a>&nbsp;for more information on AWS regions and services. To learn
      more about Amazon MWAA visit the&nbsp;<a href="https://docs.aws.amazon.com/mwaa/latest/userguide/what-is-mwaa.html">Amazon
      MWAA documentation</a>.<br /> <br /> <i>Apache, Apache Airflow, and Airflow
      are either registered trademarks or trademarks of the Apache Software Foundation
      in the United States and/or other countries.</i></p>
  f7cc820a0bd1c5448c19c9ee025b009e:
    id: f7cc820a0bd1c5448c19c9ee025b009e
    title: AWS Outposts racks support multiple LGW routing domains
    link: https://aws.amazon.comabout-aws/whats-new/2026/01/aws-outposts-multiple-lgw-routing-domain
    published: '2026-01-16'
    summary: <p>AWS Outposts racks now support multiple local gateway (LGW) routing
      domains, enabling you to create up to 10 isolated routing domains per Outpost,
      each with independent route tables and BGP sessions to your on-premises network.
      This feature provides traffic separation between routing domains and enables
      both customer-owned IP (CoIP) and direct VPC routing (DVR) modes on the same
      Outpost.<br /> <br /> With multiple LGW routing domains, you can segment on-premises
      network connectivity for different departments or business units sharing an
      Outpost. Each routing domain maintains its own LGW VIF Group, LGW Route Table,
      and VPC associations, preventing traffic from crossing between domains. You
      can configure multiple LGW routing domains through the AWS Management Console
      or AWS CLI.<br /> <br /> Multiple LGW routing domains is available on second-generation
      Outposts racks at no additional charge. See the <a href="https://aws.amazon.com/outposts/rack/faqs/">FAQs
      for Outposts racks</a> for the latest list of supported AWS Regions.<br /> <br
      /> To learn more about implementation details and best practices, check out
      this <a href="https://aws.amazon.com/blogs/compute/simplify-network-segmentation-for-aws-outposts-racks-with-multiple-local-gateway-routing-domains/">blog
      post</a> or visit our <a href="https://docs.aws.amazon.com/outposts/latest/network-userguide/routing-domains.html">technical
      documentation</a>.</p>
  d077852ae44796e91695a75719d61851:
    id: d077852ae44796e91695a75719d61851
    title: Second-generation AWS Outposts racks are now supported in additional AWS
      Regions
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/second-generation-aws-outposts-racks-additional-aws-regions
    published: '2026-01-16'
    summary: <p>Second-generation AWS Outposts racks are now supported in the South
      America (Sao Paulo) and Europe (Stockholm) Regions. Outposts racks extend AWS
      infrastructure, AWS services, APIs, and tools to virtually any on-premises data
      center or colocation space for a truly consistent hybrid experience.<br /> <br
      /> Organizations from startups to enterprises and the public sector in and outside
      of Europe and South America can now order their Outposts racks connected to
      these new supported regions, optimizing for their latency and data residency
      needs. Outposts allows customers to run workloads that need low latency access
      to on-premises systems locally while connecting back to their home Region for
      application management. Customers can also use Outposts and AWS services to
      manage and process data that needs to remain on-premises to meet data residency
      requirements. This regional expansion provides additional flexibility in the
      AWS Regions that customers’ Outposts can connect to.<br /> <br /> To learn more
      about second-generation Outposts racks, read <a href="https://aws.amazon.com/blogs/aws/announcing-second-generation-aws-outposts-racks-with-breakthrough-performance-and-scalability-on-premises/"><u>this
      blog post</u></a> and <a href="https://docs.aws.amazon.com/outposts/latest/network-userguide/what-is-outposts.html"><u>user
      guide</u></a>. For the most updated list of countries and territories and the
      AWS Regions where second-generation Outposts racks are supported, check out
      the <a href="https://aws.amazon.com/outposts/rack/faqs/"><u>Outposts rack FAQs
      page</u></a>.</p>
