  37f7efaf23739eacb629f9a5d708a541:
    id: 37f7efaf23739eacb629f9a5d708a541
    title: Amazon Bedrock Reserved Tier available now for Claude Opus 4.5 and Haiku
      4.5
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-bedrock-reserved-tier-claude-opus-haiku/
    published: '2026-01-16'
    summary: <p>Today, Amazon Bedrock announces the expansion of the Reserved service
      tier designed for workloads requiring predictable performance and guaranteed
      tokens-per-minute capacity. The Reserved tier provides the ability to reserve
      prioritized compute capacity, keeping service levels predictable for your mission
      critical applications. It also includes the flexibility to allocate different
      input and output tokens-per-minute capacities to match the exact requirements
      of your workload and control cost. This is particularly valuable because many
      workloads have asymmetric token usage patterns. For instance, summarization
      tasks consume many input tokens but generate fewer output tokens, while content
      generation applications require less input and more output capacity. When your
      application needs more tokens-per-minute capacity than what you reserved , the
      service automatically overflows to the pay-as-you-go Standard tier, ensuring
      uninterrupted operations. The Reserved tier and is available today for Anthropic
      Claude Opus 4.5 and Claude Haiku 4.5. Customers can reserve capacity for 1 month
      or 3 month duration. Customers pay a fixed price per 1K tokens-per-minute and
      are billed monthly.<br /> <br /> With the expansion of the Reserved service
      tier, Amazon Bedrock continues to provide more choice to customers, helping
      them develop, scale, and deploy applications and agents that improve productivity
      and customer experiences while balancing performance and cost requirements.<br
      /> <br /> For more information about the AWS Regions where Amazon Bedrock Reserved
      tier is available, refer to the<a href="https://docs.aws.amazon.com/bedrock/latest/userguide/service-tiers-inference.html">
      Documentation</a>. To get access to the Reserved tier, please contact your AWS
      account team.&nbsp;</p>
