  5039f2102023fdb2dca820be689fcda6:
    id: 5039f2102023fdb2dca820be689fcda6
    title: Amazon Connect adds conditional logic and real-time updates to Step-by-Step
      Guides
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-connect-conditional-logic-real-time-updates-step-by-step-guides/
    published: '2026-01-23'
    summary: '<p>Amazon Connect Step-by-Step Guides now enables managers to build
      more dynamic and responsive guided experiences. Managers can create conditional
      user interfaces that adapt based on user interactions, making workflows more
      efficient. For example, managers can configure dropdown menus to show or hide
      fields, change default values, or adjust required fields based on the input
      in prior fields, creating tailored experiences for different scenarios.<br />
      <br /> In addition, Step-by-Step Guides can now automatically refresh data from
      Connect resources such as flow modules at specified intervals, ensuring agents
      always work with the most current information.<br /> <br /> Amazon Connect Step-by-Step
      Guides is available in the following <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS regions</a>: US East (N. Virginia), US West (Oregon), Canada
      (Central), Africa (Cape Town), Asia Pacific (Seoul), Asia Pacific (Singapore),
      Asia Pacific (Sydney), Asia Pacific (Tokyo), Europe (Frankfurt), Europe (London),
      and the AWS GovCloud (US-West) Region. To learn more and get started, visit
      the Amazon Connect <a href="https://aws.amazon.com/connect/agent-workspace/"
      target="_blank">webpage</a> and <a href="https://docs.aws.amazon.com/connect/latest/adminguide/agent-workspace.html"
      target="_blank">documentation.</a></p>'
  106131b0e5c130e6b240a582d0b8647a:
    id: 106131b0e5c130e6b240a582d0b8647a
    title: Amazon EVS now supports multiple VMware NSX Edge Gateways
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-evs-multiple-vmware-nsx-edge-gateways
    published: '2026-01-23'
    summary: <p>Today, we're announcing that Amazon Elastic VMware Service (Amazon
      EVS) now supports the ability to deploy multiple VMware NSX Tier-0 Gateways
      within VMware Software-Defined Data Centers (SDDC), enabling enhanced network
      segmentation and more flexible routing configurations.<br /> <br /> Multiple
      NSX Tier-0 Gateways allow for better performance and scale by distributing network
      traffic across multiple NSX Edge Clusters. This latest enhancement enables improved
      network segmentation, allowing you to isolate different workload environments
      and maintain distinct security policies for each gateway. You can also use multiple
      gateways to create separate test environments for validating network configurations
      and performing gateway upgrades with minimal impact to production workloads.
      This architecture flexibility helps you align your network topology with specific
      business requirements while maintaining operational efficiency in running your
      VMware workloads on AWS with Amazon EVS.&nbsp;<br /> <br /> To learn more about
      this newest enhancement, read this <a href="https://repost.aws/articles/ARUttZpYUrSIKLLyaR3txGkA"
      target="_blank">re:Post article</a>&nbsp;that walks you through the process
      of deploying multiple NSX Edge Clusters within your EVS environment. To get
      started with Amazon EVS, visit the&nbsp;<a href="https://aws.amazon.com/evs/"
      target="_blank">product detail page</a>&nbsp;and <a href="https://docs.aws.amazon.com/evs/latest/userguide/what-is-evs.html"
      target="_blank">user guide</a>.</p>
  d82dcbe4924365669e76ab620218e744:
    id: d82dcbe4924365669e76ab620218e744
    title: Announcing general availability of Amazon EC2 M4 Max Mac instances
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-ec2-m4-max-mac-instances-ga
    published: '2026-01-23'
    summary: "<p>Amazon Web Services announces general availability of Amazon EC2\
      \ M4 Max Mac instances, powered by the latest Mac Studio hardware. Amazon EC2\
      \ M4 Max Mac instances are the next-generation EC2 Mac instances, that enable\
      \ Apple developers to migrate their most demanding build and test workloads\
      \ onto AWS. These instances are ideal for building and testing applications\
      \ for Apple platforms such as iOS, macOS, iPadOS, tvOS, watchOS, visionOS, and\
      \ Safari.<br /> <br /> Amazon EC2 M4 Max Mac instances offer up to 25% better\
      \ application build performance compared to Amazon EC2 M1 Ultra Mac instances.\
      \ M4 Max Mac instances are powered by the AWS Nitro System, providing up to\
      \ 10 Gbps network bandwidth and 8 Gbps of Amazon Elastic Block Store (Amazon\
      \ EBS) storage bandwidth. These instances are built on Apple M4 Max Mac Studio\
      \ computers featuring a 16-core CPU, 40-core GPU, 16-core Neural Engine, and\
      \ 128GB of unified memory.&nbsp;</p> \n<p>Amazon EC2 M4 Max Mac instances are\
      \ available in US East (N. Virginia) and US West (Oregon).&nbsp; To learn more\
      \ about Amazon EC2 M4 Max Mac instances, visit the <a href=\"https://aws.amazon.com/ec2/instance-types/mac/\"\
      >Amazon EC2 Mac page.</a></p>"
  5c696b18c0fa4fb29ff8bf76a6394d73:
    id: 5c696b18c0fa4fb29ff8bf76a6394d73
    title: EC2 Auto Scaling Introduces New Mechanisms for Group Deletion Protection
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/ec2-auto-scaling-new-mechanisms-group-deletion-protection
    published: '2026-01-23'
    summary: <p>EC2 Auto Scaling is introducing a new policy condition key <a href="https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2autoscaling.html#amazonec2autoscaling-policy-keys"
      target="_blank">autoscaling:ForceDelete</a>. This condition key is used with
      the DeleteAutoScalingGroup action to control whether the ForceDelete parameter
      can be used during deletion, which determines if an Auto Scaling group (ASG)
      can be deleted while it still contains running instances. You can use this condition
      key in IAM policies to restrict deletion permissions. This provides a safety
      measure to prevent accidental deletion of ASGs that still have running instances.<br
      /> <br /> Furthermore, EC2 Auto Scaling now offers deletion protection at the
      group level. The new deletion-protection configuration can be set either when
      you create your ASGs or update them. This new feature lets you set enhanced
      controls based on your workload's criticality, with multiple protection levels
      available to safeguard against accidental deletions and help maintain application
      availability.<br /> <br /> Combining the autoscaling:ForceDelete condition key
      with deletion protection at the group level provides a layered defense against
      unwanted ASG termination by allowing you to both restrict IAM permissions for
      force-delete operations and set enhanced protection controls directly on critical
      ASGs.<br /> <br /> The features now available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS Regions</a> and AWS GovCloud (US) Regions. To get started,
      visit the EC2 Auto Scaling console or refer to our <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/resource-deletion-protection.html"
      target="_blank">technical documentation for deletion protection</a> and <a href="https://docs.aws.amazon.com/autoscaling/ec2/userguide/control-access-using-iam.html#policy-auto-scaling-condition-keys"
      target="_blank">policy condition keys</a> for Amazon EC2 Auto Scaling.</p>
  f3bbe6790c2de866c9b5ac4405767b72:
    id: f3bbe6790c2de866c9b5ac4405767b72
    title: Amazon Route 53 Domains adds support for .ai, and other top-level domains
    link: https://aws.amazon.com/about-aws/whats-new/2026/1/amazon-route-53-domains-adds-support-for-.ai-and-other-top-level-domains/
    published: '2026-01-23'
    summary: "<p>Amazon Route 53 Domains now supports registration and management\
      \ of ten new top-level domains (TLDs): .ai, .nz, .shop, .bot, .moi, .spot, .free,\
      \ .deal, .now, and .hot. This expansion enhances Route 53's capabilities as\
      \ a domain registration and DNS management service, offering customers more\
      \ options to establish their online presence. With these additions, businesses\
      \ and individuals can now leverage domain names tailored to specific industries,\
      \ regions, or purposes directly through Amazon Web Services (AWS).<br /> <br\
      \ /> The new TLDs cater to various use cases. To name a few, the .ai domain,\
      \ originally for Anguilla, has become popular among artificial intelligence\
      \ companies. E-commerce sites can utilize .shop for their online storefronts.\
      \ The .bot domain suits chatbot and AI-related services. The .now domain works\
      \ well for time-sensitive services and instant delivery platforms. Users can\
      \ register these domains through the Route 53 console, AWS CLI, or SDKs, enjoying\
      \ integrated DNS management and automatic renewal features. This seamless integration\
      \ allows for efficient domain administration alongside existing Route 53 hosted\
      \ zones and DNS records.<br /> <br /> To learn more about Amazon Route 53 Domains\
      \ and start registering new domains, visit the <a href=\"https://aws.amazon.com/route53/\"\
      >Amazon Route 53 page</a>. Domain registration pricing varies by TLD. Visit\
      \ the <a href=\"http://aws.amazon.com/route53/pricing/\">pricing page</a> for\
      \ detailed pricing information.</p> \n<p>&nbsp;</p>"
  232bb24d86fc87d143883d674018483b:
    id: 232bb24d86fc87d143883d674018483b
    title: Amazon RDS for Oracle now supports replicas in Oracle multi-tenant configuration
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-rds-for-oracle-replica-multi-tenant-configuration-support
    published: '2026-01-23'
    summary: "<p>Amazon RDS for Oracle now supports database replicas for instances\
      \ set up in Oracle multi-tenant configuration. Oracle multi-tenant configuration\
      \ allows customers to host multiple, isolated pluggable databases in a single\
      \ container database, which allows for cost reduction through consolidation\
      \ and easier management. With support for replicas in Oracle multi-tenant configuration,\
      \ customers can now distribute read workloads to a replica to scale workloads,\
      \ or setup cross-Region replicas. In disaster recovery situations, customers\
      \ can promote replicas to serve as a new standalone database, or execute a switchover\
      \ to reverse roles between the primary database and the replica for a quick\
      \ recovery.</p> \n<p>To set up replicas in Oracle multi-tenant configuration,\
      \ customers can create a replica in either mounted or read-only mode using the\
      \ AWS management console, AWS CLI, or AWS SDK. Once a replica is set up, Amazon\
      \ RDS for Oracle manages asynchronous physical replication between primary and\
      \ replica database instances using Oracle Data Guard.</p> \n<p>Amazon RDS for\
      \ Oracle read replicas use Oracle Data Guard. Using mounted mode replicas require\
      \ an Oracle Database Enterprise Edition (EE) license, and using read-only mode\
      \ replicas require additional Oracle Active Data Guard licenses. We recommend\
      \ customers to consult their Oracle licensing expert to determine Oracle licensing\
      \ requirements. Refer to <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/oracle-read-replicas.overview.html#oracle-read-replicas.overview.data-guard\"\
      >RDS for Oracle User Guide</a> for more information, and <a href=\"https://aws.amazon.com/rds/oracle/pricing/\"\
      >Amazon RDS for Oracle pricing</a> for available instance configurations, pricing,\
      \ and region availability.</p>"
