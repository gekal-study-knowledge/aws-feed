  bef80efa5daf11d1c590d4fcddd9e61c:
    id: bef80efa5daf11d1c590d4fcddd9e61c
    title: Amazon Connect introduces AI-powered manager assistance (Preview)
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-ai-powered-manager-assistance/
    published: '2026-03-10'
    summary: "<p>Today, Amazon Connect announces the preview of an AI-powered assistant\
      \ that enables contact center managers to get instant answers to operational\
      \ questions using natural language. You can query across 150+ Amazon Connect\
      \ metrics, including agent scheduling, self-service experience, and performance\
      \ evaluations, with historical data for all of these, and receive results in\
      \ seconds—eliminating hours of manual data gathering. The assistant can also\
      \ diagnose underlying issues, such as identifying which queues are at risk of\
      \ missing service level targets and recommending specific recovery actions.</p>\
      \ \n<p>This feature is available as a preview. To request access, contact your\
      \ AWS account team or an <a href=\"https://aws.amazon.com/contact-us/?nc2=h_l1\"\
      >AWS Representative</a>. To learn more about Amazon Connect, the AWS cloud-based\
      \ contact center, visit the <a href=\"https://aws.amazon.com/connect/\">Amazon\
      \ Connect website.</a></p>"
  13a05762557cd49f8d227a6409240936:
    id: 13a05762557cd49f8d227a6409240936
    title: Amazon Connect now supports conversational analytics for email
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-conversational-analytics-email/
    published: '2026-03-10'
    summary: <p>Amazon Connect now supports conversational analytics for email contacts,
      enabling contact center managers to automatically categorize emails, redact
      personally identifiable information (PII), and generate contact summaries. This
      allows you to quickly identify emerging trends, better maintain compliance by
      protecting sensitive information, and reduce the time spent reviewing agent
      performance. For example, when customers email about account issues, Amazon
      Connect automatically categorizes the email, redacts sensitive information,
      and generates a summary for supervisor review.<br /> <br /> To enable this feature,
      add the <a href="https://docs.aws.amazon.com/connect/latest/adminguide/set-recording-analytics-processing-behavior.html">Set
      recording, analytics and processing behavior</a> block to your flows before
      an email contact is assigned to your agent or sent to your end customer. You
      can customize which PII types to redact, choose whether redacted content shows
      specific PII type indicators e.g., [SSN] or generic markings ([PII]), opt to
      store both original and redacted versions in separate storage, as well as enable
      contact summaries. Using these analytics, you can quickly create rules to automatically
      trigger actions such as assigning categories, creating tasks, or updating cases.<br
      /> <br /> Amazon Connect conversational analytics is available in the US East
      (N. Virginia), US West (Oregon), Asia Pacific (Seoul), Asia Pacific (Singapore),
      Asia Pacific (Sydney), Asia Pacific (Tokyo), Canada (Central), Europe (Frankfurt),
      and Europe (London) <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">regions</a>.
      To learn more and get started, please refer to the help <a href="https://docs.aws.amazon.com/connect/latest/adminguide/analyze-conversations.html">documentation</a>
      or visit the <a href="https://aws.amazon.com/connect/">Amazon Connect</a> website.</p>
  426f11432ff9d84e077d618d020f41f3:
    id: 426f11432ff9d84e077d618d020f41f3
    title: Amazon OpenSearch Service now supports in-place volume increases for all
      volume sizes
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-opensearch-service-in-place-volume/
    published: '2026-03-10'
    summary: <p><a href="https://aws.amazon.com/opensearch-service/">Amazon OpenSearch
      Service</a> now extends in-place cluster volume size increases to volumes exceeding
      3 TiB. With this enhancement, you can scale storage capacity across all volume
      sizes without requiring a blue/green deployment.<br /> <br /> Previously, you
      could perform volume increases up to 3 TiB on your clusters without a blue/green
      deployment. This release removes that limitation, making it easier for you to
      scale up quickly even beyond 3 TiB when required. Domains that already have
      a volume size above 3 TiB will require a blue/green deployment the first time
      a volume increase is made; subsequent volume increases will not require a blue/green
      deployment.<br /> <br /> Decreasing storage volume size, or making volume increases
      within short intervals, will still require a blue/green deployment. You can
      use the <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/managedomains-configuration-changes.html#dryrun">dry-run</a>
      option to check whether your change requires a blue/green deployment.<br />
      <br /> This feature is available in all AWS Commercial and AWS GovCloud (US)
      Regions where Amazon OpenSearch Service is available. See <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">here</a>
      for a full list of our Regions. To learn more about Amazon OpenSearch Service
      configurations, visit the <a href="https://docs.aws.amazon.com/opensearch-service/latest/developerguide/managedomains-configuration-changes.html">documentation
      page</a>.</p>
  1981d9dcd14503881682809838bf019f:
    id: 1981d9dcd14503881682809838bf019f
    title: Amazon Connect enhances AI-powered predictive insights
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-predictive-insights/
    published: '2026-03-10'
    summary: "<p>Today, Amazon Connect is announcing enhancements to AI-powered predictive\
      \ insights that make it easier for businesses to deliver proactive, personalized\
      \ customer experiences at scale. Building on the five recommendation algorithms\
      \ launched at re:Invent 2025, AI-powered predictive insights now support up\
      \ to 40 million product catalog items (8X increase), are available in message\
      \ templates for trigger-based campaigns, and deliver up to 14% improved model\
      \ accuracy. These enhancements enable businesses to automatically engage customers\
      \ with the right message at the right time, while reducing the time required\
      \ to deploy AI-powered personalization.</p> \n<p>Businesses can now deliver\
      \ trigger-based campaigns to initiate personalized outreach based on customer\
      \ behavior and predictive signals – such as sending product recommendations\
      \ when a customer abandons their cart or offering complementary services after\
      \ a purchase. Businesses can now deliver targeted campaigns for specific customer\
      \ cohorts based on predicted preferences and behaviors. Improved model accuracy\
      \ and reduced training time mean businesses can deploy personalized experiences\
      \ faster with greater confidence in the recommendations provided to customers.</p>\
      \ \n<p>With Amazon Connect Customer Profiles, you only pay-as-you-go for utilized\
      \ profiles. Public preview for AI-powered predictive insights enhancements is\
      \ available in Europe (Frankfurt), US East (N. Virginia), Asia Pacific (Seoul),\
      \ Asia Pacific (Tokyo), US West (Oregon), Asia Pacific (Singapore), Asia Pacific\
      \ (Sydney), Canada (Central).</p> \n<p>To learn more, visit our webpages for\
      \ Customer Profiles and explore the AI-powered <a href=\"https://docs.aws.amazon.com/connect/latest/adminguide/customer-profiles-predictive-insights.html\"\
      >predictive insights documentation</a>.</p>"
  412e96da600fd516761dafef5ceb54c2:
    id: 412e96da600fd516761dafef5ceb54c2
    title: AWS Builder ID now supports Sign in with GitHub and Amazon
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-builder-id-sign-in-github-amazon/
    published: '2026-03-10'
    summary: "<p>AWS Builder ID, your&nbsp;profile for accessing AWS applications\
      \ including AWS Builder Center, AWS Training and Certification and Kiro, now\
      \ supports&nbsp;two new social logins:&nbsp;GitHub&nbsp;and Amazon. This expansion\
      \ of&nbsp;sign-in&nbsp;options&nbsp;builds on&nbsp;the existing Google&nbsp;Apple&nbsp;social\
      \ sign-in&nbsp;capabilities, providing&nbsp;GitHub and&nbsp;Amazon&nbsp;users\
      \ with a streamlined way to access AWS resources without managing separate credentials&nbsp;on&nbsp;AWS.</p>\
      \ \n<p>With Sign in&nbsp;with&nbsp;Github&nbsp;and Amazon&nbsp;integration,\
      \ developers and&nbsp;builders can now enjoy&nbsp;access to their AWS Builder\
      \ ID profile using their&nbsp;GitHub&nbsp;or&nbsp;Amazon&nbsp;Account credentials.\
      \ This enhancement&nbsp;eliminates&nbsp;password management complexity, reduces\
      \ forgotten password issues, and provides a frictionless experience for both\
      \ new user registration and returning user sign-ins. Whether&nbsp;you're&nbsp;accessing\
      \ development resources in AWS Builder Center, enrolling in certification programs&nbsp;or&nbsp;using&nbsp;Kiro&nbsp;to\
      \ code your next app, your&nbsp;GitHub&nbsp;and Amazon&nbsp;Accounts&nbsp;can&nbsp;now\
      \ serve&nbsp;as a secure gateway to your&nbsp;builder&nbsp;AWS journey.</p>\
      \ \n<p>To learn more about AWS Builder ID and&nbsp;get&nbsp;started with Sign\
      \ in with&nbsp;GitHub and Amazon, visit the&nbsp;<a href=\"https://docs.aws.amazon.com/signin/latest/userguide/sign-in-builder-id.html\"\
      >AWS Builder ID documentation</a>.</p>"
