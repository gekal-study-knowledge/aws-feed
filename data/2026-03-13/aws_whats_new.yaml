  4641556da57b3db6a14b0848fa49fa24:
    id: 4641556da57b3db6a14b0848fa49fa24
    title: AWS Network Firewall Launch in the AWS European Sovereign Cloud
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/network-firewall-european-sovereign-cloud-region/
    published: '2026-03-13'
    summary: <p>Starting today, AWS Network Firewall is available in the AWS European
      Sovereign Cloud. With this launch, European customers, particularly those in
      highly regulated industries, government agencies, and organizations with strict
      data sovereignty requirements, can deploy AWS Network Firewall to protect their
      most sensitive workloads while maintaining full compliance with European Union
      (EU) data protection regulations.<br /> <br /> Through this expansion, customers
      using the AWS European Sovereign Cloud can leverage the same AWS Network Firewall
      capabilities available in other AWS Regions, while ensuring that all data and
      operations remain entirely within EU borders and under EU-based control. AWS
      Network Firewall is a managed firewall service that provides essential network
      protections for your Amazon Virtual Private Clouds (VPCs). The service automatically
      scales with network traffic volume to provide high-availability protections
      without the need to set up or maintain the underlying infrastructure.<br />
      <br /> To learn more about AWS Network Firewall availability, visit the <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/">AWS
      Region Table</a>. For more information, please see the AWS Network Firewall
      <a href="https://aws.amazon.com/network-firewall/">product page</a> and the
      service <a href="https://docs.aws.amazon.com/network-firewall/latest/developerguide/">documentation</a>.</p>
  327bd02eb4e33fd282407bd2463beeb4:
    id: 327bd02eb4e33fd282407bd2463beeb4
    title: AWS Lambda Managed Instances now supports Rust
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-lambda-managed-instances-rust/
    published: '2026-03-13'
    summary: <p>AWS Lambda Managed Instances now supports Rust, enabling developers
      to run high-performance Rust-based functions on Lambda-managed Amazon EC2 instances
      while maintaining Lambda’s operational simplicity. This combination makes it
      easier than ever to run performance-critical applications without the complexity
      of managing servers.<br /> <br /> Lambda Managed Instances gives Lambda developers
      access to specialized compute configurations, including the latest-generation
      processors and high-bandwidth networking. Lambda Managed Instances are fully
      managed EC2 instances, with built-in routing, load-balancing and auto-scaling,
      with no operational overhead. They combine Lambda’s serverless experience with
      EC2 pricing advantages including Compute Savings Plans and Reserved Instances.
      Rust support for Lambda Managed Instances combines these benefits with the performance
      and efficiency of Rust, including parallel request processing within each execution
      environment. Together, using Lambda Managed Instances with Rust maximizes utilization
      and price-performance.<br /> <br /> Rust support for Lambda Managed Instances
      is available today in all AWS Regions where Lambda Managed Instances is available.<br
      /> <br /> To get started with Rust on Lambda Managed Instances, see the <a href="https://docs.aws.amazon.com/lambda/latest/dg/lambda-managed-instances-rust.html"
      target="_blank">Lambda documentation</a>. To learn more about more about this
      release, see the <a href="https://github.com/aws/aws-lambda-rust-runtime/releases/tag/lambda_runtime-v1.1.1"
      target="_blank">release notes</a>.</p>
  57b7e0dd6a5301c500e6a0e59a2c7564:
    id: 57b7e0dd6a5301c500e6a0e59a2c7564
    title: Accelerate serverless application development with new SAM Kiro power
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/aws-sam-kiro-power/
    published: '2026-03-13'
    summary: "<p>AWS announces the AWS Serverless Application Model (SAM)&nbsp;Kiro\
      \ power, bringing serverless application development&nbsp;expertise&nbsp;to\
      \ agentic AI development in Kiro. With this power, you can build, deploy, and\
      \ manage serverless applications with AI agent-assisted development directly\
      \ in your local environment.</p> \n<p>SAM is an open-source framework that simplifies\
      \ building serverless applications on AWS.&nbsp;SAM&nbsp;Kiro power dynamically\
      \ loads relevant guidance and development&nbsp;expertise&nbsp;the AI agent needs\
      \ to build serverless applications.&nbsp;This includes initializing SAM projects,\
      \ building and deploying applications to AWS, and locally testing Lambda functions.&nbsp;The\
      \ power&nbsp;supports event-driven patterns with Amazon&nbsp;EventBridge, Amazon\
      \ Managed Streaming for Apache Kafka (MSK),&nbsp;Amazon Kinesis, Amazon DynamoDB&nbsp;Streams,&nbsp;and\
      \ Amazon Simple Queue Service (SQS), while covering security best practices\
      \ for IAM policies. Built-in guidance enforces&nbsp;use of&nbsp;SAM resources\
      \ and&nbsp;Powertools&nbsp;for AWS Lambda&nbsp;for observability&nbsp;and&nbsp;structured\
      \ logging by default, ensuring&nbsp;best practices from the start.&nbsp;This\
      \ guidance accelerates your journey from concept to production, whether&nbsp;building\
      \ static websites with API backends, event-driven microservices, or full-stack\
      \ applications.</p> \n<p>The SAM Kiro Power is available today with&nbsp;one-click\
      \ installation from the <a href=\"https://kiro.dev/launch/powers/aws-sam/\"\
      \ target=\"_blank\">Kiro IDE</a> and the <a href=\"https://kiro.dev/powers/\"\
      \ target=\"_blank\">Kiro Powers</a> page. Explore the power on <a href=\"https://github.com/kirodotdev/powers\"\
      \ target=\"_blank\">Github</a>&nbsp;or visit the&nbsp;<a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/what-is-sam.html\"\
      \ target=\"_blank\">developer guide</a>&nbsp;to learn more about SAM.</p>"
  8be333e69121ca6ff7e846084e1e8c45:
    id: 8be333e69121ca6ff7e846084e1e8c45
    title: Amazon MSK announces support for Standard brokers Graviton-3 instance in
      Africa (Cape Town) region
    link: https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-msk-standardm7g-cpt-region/
    published: '2026-03-13'
    summary: "<p>You can now create provisioned&nbsp;<a href=\"https://aws.amazon.com/msk/\"\
      >Amazon Managed Streaming for Apache Kafka (Amazon MSK)</a>&nbsp;clusters with\
      \ Standard brokers&nbsp;running on AWS Graviton3-based M7g instances in Africa\
      \ (Cape Town) region.</p> \n<p>Graviton M7g instances for Standard brokers deliver\
      \ up to 24% compute cost savings and up to 29% higher write and read throughput\
      \ over comparable MSK clusters running on M5 instances. To get started, create\
      \ a new cluster with M7g brokers or upgrade your M5 cluster to M7g through the\
      \ Amazon MSK console or the Amazon CLI and read our&nbsp;<a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\"\
      >Amazon MSK Developer Guide</a>&nbsp;for more information.</p>"
