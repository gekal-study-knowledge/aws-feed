  6103bb70b1de2b5f6d1ce36c432c0a36:
    id: 6103bb70b1de2b5f6d1ce36c432c0a36
    title: Amazon RDS Custom now supports the latest GDR updates for Microsoft SQL
      Server
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-rds-custom-gdr-updates-microsoft-sql-server
    published: '2026-01-15'
    summary: <p><a href="https://aws.amazon.com/rds/custom/" target="_blank">Amazon
      Relational Database Service (Amazon RDS) Custom for SQL Server</a> now supports
      the latest General Distribution Release (GDR) updates for Microsoft SQL Server.
      This release includes support for SQL Server 2019 CU32+GDR <a href="https://support.microsoft.com/help/5068404"
      target="_blank">KB5068404</a> (RDS version 15.00.4455.2.1.v1) and SQL Server
      2022 CU21+GDR <a href="https://support.microsoft.com/help/5068406" target="_blank">KB5068406</a>
      (RDS version 16.00.4222.2.1.v1).<br /> <br /> The GDR updates address vulnerabilities
      described in CVE-2025-59499. For additional information on the improvements
      and fixes included in these updates, see Microsoft documentation for KB5068404
      and KB5068406. We recommend that you upgrade your Amazon RDS Custom for SQL
      Server instances to apply these updates using Amazon RDS Management Console,
      or by using the AWS SDK or CLI. You can learn more about upgrading your database
      instance in the <a href="https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-upgrading-sqlserver.html"
      target="_blank">Amazon RDS Custom User Guide</a>.</p>
  6b4e97ebf2ba451930fcbe89e6482f0e:
    id: 6b4e97ebf2ba451930fcbe89e6482f0e
    title: Amazon Redshift Serverless adds queue-based query resource management
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-redshift-serverless-queue-based-query-resource-management
    published: '2026-01-15'
    summary: <p>Amazon Redshift Serverless introduces queue-based query resource management.
      You can create dedicated query queues with customized monitoring rules for different
      workloads. This feature provides granular control over resource usage. Queues
      let you set metrics-based predicates and automated responses. For example, you
      can configure rules to automatically abort queries that exceed time limits or
      consume too many resources.<br /> <br /> Previously, Query Monitoring Rules
      (QMR) were applied only at the Redshift Serverless workgroup level, affecting
      all queries run in this workgroup uniformly. The new queue-based approach lets
      you create queues with distinct monitoring rules. You can assign these queues
      to specific user roles and query groups. Each queue operates independently,
      with rules affecting only the queries within that queue. The available monitoring
      metrics can be found in <a href="https://docs.aws.amazon.com/redshift/latest/dg/cm-c-wlm-query-monitoring-rules.html#cm-c-wlm-query-monitoring-metrics-serverless"
      target="_blank">Query monitoring metrics for Amazon Redshift Serverless</a>.<br
      /> <br /> This feature is available in all <a href="https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/"
      target="_blank">AWS regions</a> that support Amazon Redshift Serverless. You
      can manage QMR with queues through the AWS Console and Redshift APIs.<br />
      <br /> For implementation details, see the <a href="https://docs.aws.amazon.com/redshift/latest/mgmt/serverless-workgroup-query-limits.html"
      target="_blank">documentation</a> in the Amazon Redshift management guide.</p>
  f5fbd8c61c043e4e6f627dd319d666bb:
    id: f5fbd8c61c043e4e6f627dd319d666bb
    title: Amazon Connect now provides agent scheduling metrics in data lake
    link: https://aws.amazon.com/about-aws/whats-new/2026/01/amazon-connect-scheduling-metrics/
    published: '2026-01-15'
    summary: <p>Amazon Connect now provides agent scheduling metrics in data lake,
      making it easier for you to generate reports and insights from this data. For
      example, after publishing schedules for next month, you can access interval
      level (15 minutes or 30 minutes) metrics such as forecasted headcount, scheduled
      headcount, and projected service level in Connect analytics data lake. You can
      view aggregated metrics for an entire business unit (forecast group) or broken
      down by specific demand segments (demand groups). You can then visualize this
      data in Amazon Quick Sight or another BI tool of your choice for further analysis,
      such as identifying periods of over or under-staffing. This eliminates the need
      for manual reviews of agent schedules thus improving productivity for schedulers
      and supervisors.<br /> <br /> This feature is available in all <a href="https://docs.aws.amazon.com/connect/latest/adminguide/regions.html#optimization_region">AWS
      Regions</a> where Amazon Connect agent scheduling is available. To learn more
      about Amazon Connect agent scheduling, click <a href="https://docs.aws.amazon.com/connect/latest/adminguide/forecasting-capacity-planning-scheduling.html">here</a>.</p>
