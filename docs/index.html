<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Updates Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AWS Updates Feed</h1>
            <p class="subtitle">AWS公式フィードの日次まとめ</p>
        </header>

        <main>
            <div id="loading">読み込み中...</div>
            <div id="reports-list"></div>
        </main>

        <footer>
            <p>自動更新: 1時間ごと | <a href="https://github.com/gekal-study-knowledge/aws-feed" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script>
        async function loadReports() {
            const loadingEl = document.getElementById('loading');
            const reportsListEl = document.getElementById('reports-list');

            try {
                const response = await fetch('reports.json');
                const data = await response.json();

                loadingEl.style.display = 'none';

                if (data.reports.length === 0) {
                    reportsListEl.innerHTML = '<p class="no-reports">レポートがありません</p>';
                    return;
                }

                // 日付の降順でソート
                data.reports.sort((a, b) => b.date.localeCompare(a.date));

                let html = '<div class="reports-grid">';
                data.reports.forEach(report => {
                    const date = new Date(report.date);
                    const formattedDate = date.toLocaleDateString('ja-JP', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        weekday: 'short'
                    });

                    html += `
                        <div class="report-card">
                            <div class="report-date">${formattedDate}</div>
                            <div class="report-count">${report.count}件の更新</div>
                            <a href="${report.url}" class="report-link">レポートを見る →</a>
                        </div>
                    `;
                });
                html += '</div>';

                reportsListEl.innerHTML = html;
            } catch (error) {
                loadingEl.style.display = 'none';
                reportsListEl.innerHTML = '<p class="error">レポートの読み込みに失敗しました</p>';
                console.error('Error loading reports:', error);
            }
        }

        loadReports();
    </script>
</body>
</html>
